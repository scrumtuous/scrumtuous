nario: Tessellate Logistics is migrating a 2-million-line monorepo from a deprecated internal logging library to a new one. A platform team uses Claude Code in headless mode to run up to 40 coding agents at the same time. A coordinator script splits the migration into one task for each package, and each agent opens a pull request when it finishes. Human reviewers can review about 60 pull requests per day, and the agents now produce more than 200 per day. The CI pipeline runs the full test suite on every pull request.\n\nQuestion: With worktrees in place, the agents no longer overwrite each other. A new problem appears at merge time. About half of the 200 daily pull requests conflict with each other, because almost every package task also edits two shared files: the root logging configuration file and a shared test helper. Reviewers spend most of their time resolving the same conflicts again and again. Which change to the plan best reduces these conflicts?","type":"multiple-choice","options":[{"text":"Merge the shared-file changes first as one task, and limit each package task to its own files.","explanation":"The conflicts come from the way the work was divided: many tasks edit the same two files. When one task owns the shared files and merges before the others start, the package tasks no longer overlap, and their pull requests can merge in any order.","correct":true},{"text":"Ask each agent to rebase its branch on the main branch every five minutes while it works.","explanation":"Frequent rebasing keeps a branch current, but 100 branches that all edit the same two files will still conflict with each other at merge time. It also uses agent turns on repeated rebases.","correct":false},{"text":"Combine all 200 package changes into one very large pull request so that there is only one merge.","explanation":"One pull request avoids conflicts between pull requests, but it cannot be reviewed in a reasonable way and one failing package blocks all the others. It also requires all agents to share a branch, which brings back the collisions.","correct":false},{"text":"Assign two more human reviewers to the migration so that conflicts are resolved more quickly.","explanation":"More reviewers resolve the same avoidable conflicts faster, at a high cost. The source of the conflicts, overlapping tasks, is still there.","correct":false}],"answer":"<p>Correct answer: <strong>Merge the shared-file changes first as one task, and limit each package task to its own files.</strong></p><p>Worktrees isolate edits while agents work, but they do not prevent merge conflicts. Conflicts are decided earlier, by task decomposition: if two tasks edit the same lines, their branches will conflict, whatever tooling is used. A good fan-out plan gives each task a set of files that no other task touches.</p><p>For a migration, this usually means a short sequential phase followed by a wide parallel phase. First, one task makes the changes that everything depends on (shared configuration, shared helpers, a compatibility layer) and merges. Then the per-package tasks run in parallel, each limited to its own directory. Their pull requests are independent, so they can be reviewed and merged in any order. Anthropic&#x27;s guidance for parallel work makes the same point: parallel agents work best on tasks that are independent.</p><p>Rebasing more often, one very large pull request, and extra reviewers all accept the overlap and try to manage its effects. See Run agents in parallel and Run parallel sessions with worktrees.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 19. Domain: Agent Fleet Operations for Software Delivery.","answerStatus":"source"},{"query":"Scenario: Tessellate Logistics is migrating a 2-million-line monorepo from a deprecated internal logging library to a new one. A platform team uses Claude Code in headless mode to run up to 40 coding agents at the same time. A coordinator script splits the migration into one task for each package, and each agent opens a pull request when it finishes. Human reviewers can review about 60 pull requests per day, and the agents now produce more than 200 per day. The CI pipeline runs the full test suite on every pull request.\n\nQuestion: Agents produce 200 pull requests per day and reviewers can handle 60, so the review queue grows every day. A manager proposes turning on an AI code reviewer and letting it approve and merge any pull request in which it finds no issues. Nobody has measured how the AI reviewer's findings compare with the findings of Tessellate's human reviewers on this codebase. Which rollout plan is the most appropriate?","type":"multiple-choice","options":[{"text":"Enable AI approval and merging for all pull requests now, and turn it off if a production incident is traced to a merged change.","explanation":"This gives the reviewer full authority before anyone knows how reliable it is on this codebase. The first evidence of a problem would be a production incident, which is the most expensive way to find out.","correct":false},{"text":"Run the AI reviewer in shadow mode, compare its findings with human reviews, and give it gating authority only after agreement is acceptable.","explanation":"In shadow mode the reviewer comments but has no authority, so its mistakes cost nothing. Comparing its findings with human reviews on the same pull requests shows how often it misses real problems and how often it raises false ones. That evidence supports a decision about what it may gate.","correct":true},{"text":"Reject the proposal, and require the 40 agents to stop each day when 60 pull requests are open.","explanation":"Limiting the agents to human review capacity is safe, but it gives up most of the fleet's value. It also skips the chance to measure whether an AI reviewer can safely take some of the load.","correct":false},{"text":"Let the AI reviewer approve pull requests only when it reports high confidence in its own review.","explanation":"The reviewer's confidence in itself is not a measurement of its accuracy. Without a comparison against human review, a high-confidence approval is still an unverified approval.","correct":false}],"answer":"<p>Correct answer: <strong>Run the AI reviewer in shadow mode, compare its findings with human reviews, and give it gating authority only after agreement is acceptable.</strong></p><p>When code generation is faster than human review, AI code review is a reasonable way to add capacity. The question is how to introduce it safely. The accepted pattern has three steps: shadow mode, calibration, and then limited authority.</p><p>In shadow mode, the AI reviewer runs on real pull requests and posts its findings, but humans still make every merge decision. During this period the team compares the two: which real defects did humans find that the AI missed (false negatives), and which AI findings did humans judge to be wrong or unimportant (false positives)? When agreement is acceptable for a class of change, the AI reviewer can be given authority for that class, for example mechanical changes in a migration, while humans keep the decision for riskier changes. Human oversight is designed into the process and is not removed.</p><p>This also matches how Anthropic&#x27;s managed Code Review for Claude Code behaves by default: it posts findings with severity levels and a check run, but a review never approves or blocks a pull request, so the merge decision stays with the team. See Code Review and Customize Code Review.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 20. Domain: Agent Fleet Operations for Software Delivery.","answerStatus":"source"},{"query":"Scenario: Tessellate Logistics is migrating a 2-million-line monorepo from a deprecated internal logging library to a new one. A platform team uses Claude Code in headless mode to run up to 40 coding agents at the same time. A coordinator script splits the migration into one task for each package, and each agent opens a pull request when it finishes. Human reviewers can review about 60 pull requests per day, and the agents now produce more than 200 per day. The CI pipeline runs the full test suite on every pull request.\n\nQuestion: The coordinator reports that 30% of agent runs end without a pull request. Each failed run reaches the turn limit. Reading a few failed transcripts one by one has not shown a common cause, because each transcript is thousands of lines long. Every agent exports OpenTelemetry metrics and events that include the session ID, the tool name, and the duration of each tool call. How should the team find the cause most efficiently?","type":"multiple-choice","options":[{"text":"Group runs into successful and failed cohorts, and compare tool usage between them in the fleet telemetry.","explanation":"The failure is a fleet-level pattern, so fleet-level data is the right tool. Comparing the two cohorts shows what failed runs do differently, for example spending most turns on one slow command. This is visible in aggregates and very hard to see in single transcripts.","correct":true},{"text":"Raise the turn limit for every agent from 150 to 400 so that the failed runs have enough turns to finish.","explanation":"A higher limit may let some runs finish, but at a much higher cost, and the team still would not know why those runs need so many turns. The cause could keep growing.","correct":false},{"text":"Ask each failed agent to write a short explanation of why it did not finish, and collect the explanations in a report.","explanation":"An agent that ran out of turns often does not know the systemic reason. Its explanation is generated text that may sound reasonable without being the real cause, and it is not a measurement.","correct":false},{"text":"Read every failed transcript in full, and write down the last tool call that each agent made before it stopped.","explanation":"The last tool call shows where a run stopped, not what consumed its turns. Reading hundreds of long transcripts is also slow, and the earlier attempt already showed that the pattern is hard to see this way.","correct":false}],"answer":"<p>Correct answer: <strong>Group runs into successful and failed cohorts, and compare tool usage between them in the fleet telemetry.</strong></p><p>Some failure modes are fleet-level: they cannot be seen in one transcript, but they are clear when many runs are compared. The technique is cohort analysis. Divide the runs by outcome (finished or reached the turn limit), and then compare the cohorts on the dimensions that the telemetry provides: number of calls for each tool, time for each tool, tokens, package size, and so on. The dimension on which the cohorts differ most is the place to look.</p><p>Claude Code can export this data with OpenTelemetry. It emits metrics such as token usage and cost, and events for tool results and API requests, with attributes such as the session ID and model. Tool names and parameters are included when OTEL_LOG_TOOL_DETAILS is enabled. With this data in a metrics backend, a query such as &quot;time spent in the Bash tool for each session, split by outcome&quot; takes minutes. A typical finding in a monorepo is that failed runs execute the full test suite many times when they should run only the tests for their own package.</p><p>Raising the turn limit pays for the problem without understanding it, and an agent&#x27;s explanation of its own failure is not evidence. See Monitoring and Run Claude Code programmatically.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 21. Domain: Agent Fleet Operations for Software Delivery.","answerStatus":"source"},{"query":"Scenario: Tessellate Logistics is migrating a 2-million-line monorepo from a deprecated internal logging library to a new one. A platform team uses Claude Code in headless mode to run up to 40 coding agents at the same time. A coordinator script splits the migration into one task for each package, and each agent opens a pull request when it finishes. Human reviewers can review about 60 pull requests per day, and the agents now produce more than 200 per day. The CI pipeline runs the full test suite on every pull request.\n\nQuestion: A security review finds that some agents connected to an unapproved MCP server. A developer had added the server to the project's .mcp.json file to test it, and every agent that ran in that repository loaded it. The platform team wants a rule that only approved MCP servers can load on any developer machine or build server, and that no project file or user setting can widen the rule. Which configuration achieves this?","type":"multiple-choice","options":[{"text":"Add an allowedMcpServers list to the repository's project settings file, and ask developers not to change it.","explanation":"Project settings can be edited by anyone who can change the repository, which is how the unapproved server was added. Without a lock in managed settings, allowlists from user and project scopes are also merged, so users can widen the list.","correct":false},{"text":"Add a rule to the root CLAUDE.md file stating that agents must use only the approved MCP servers.","explanation":"CLAUDE.md is an instruction that the model reads. It does not control which servers Claude Code loads at startup, and an agent cannot refuse a server that is already connected and offering tools.","correct":false},{"text":"Deploy managed settings that match servers by URL or command, with allowManagedMcpServersOnly set to true.","explanation":"Managed settings are delivered by administrators and cannot be overridden by user or project settings. Matching by URL or exact command identifies the real server, and allowManagedMcpServersOnly makes the managed allowlist the only allowlist that applies.","correct":true},{"text":"Deploy managed settings with an allowlist that names each approved server by its serverName label.","explanation":"The serverName is only the label that a user gives a server when adding it, so any server can be given an approved name. The documentation states that a name entry is not a security control.","correct":false}],"answer":"<p>Correct answer: <strong>Deploy managed settings that match servers by URL or command, with allowManagedMcpServersOnly set to true.</strong></p><p>Organization-wide control of coding agents is done with managed settings: configuration that administrators deliver through device management, a system file, or server-managed settings, and that takes precedence over user and project settings. For MCP, Claude Code provides allowlists and denylists (allowedMcpServers and deniedMcpServers).</p><p>Two details decide whether an allowlist is real enforcement. First, by default the allowlists from every settings scope are merged, so a user could add entries. Setting allowManagedMcpServersOnly: true in managed settings makes the managed allowlist the only one that counts. Second, entries should identify the server itself: serverUrl for remote servers and serverCommand for local ones. A serverName entry matches only the label that the user chose, and the documentation warns that it is not a security control. For a fixed set that users cannot extend at all, administrators can deploy a managed-mcp.json file, which takes exclusive control of MCP servers.</p><p>A project settings file and a CLAUDE.md rule are both inside the repository, where any developer can change them. See Control MCP server access for your organization and Deploy managed settings.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 22. Domain: Agent Fleet Operations for Software Delivery.","answerStatus":"source"},{"query":"Scenario: Tessellate Logistics is migrating a 2-million-line monorepo from a deprecated internal logging library to a new one. A platform team uses Claude Code in headless mode to run up to 40 coding agents at the same time. A coordinator script splits the migration into one task for each package, and each agent opens a pull request when it finishes. Human reviewers can review about 60 pull requests per day, and the agents now produce more than 200 per day. The CI pipeline runs the full test suite on every pull request.\n\nQuestion: The team first tried a single agent with the goal \"migrate the whole repository to the new logging library.\" That run cost six times more per package than expected, skipped some packages, and gave different results on each attempt. The migration steps are the same for every package: find the old imports, rewrite the calls, run the package tests, and open a pull request. About 5% of packages use the old library in unusual ways. Based on this data, which architecture should the team choose?","type":"multiple-choice","options":[{"text":"Keep the single open-ended agent, and give it a larger context window and a higher turn limit so that it can cover the whole repository.","explanation":"The data shows that the open-ended approach is expensive and inconsistent. More context and more turns raise the cost further and do not make an agent's coverage of 2 million lines predictable.","correct":false},{"text":"Replace the agents with a single large regular-expression script, and do not use agents for any part of the migration.","explanation":"A script is cheap and predictable for the simplest cases, but logging calls vary in form, and tests need to be run and fixed. The 5% of unusual packages, and many ordinary ones, need the judgment that agents provide.","correct":false},{"text":"Create an agent team in which 40 agents talk to each other and decide among themselves which packages each one will migrate.","explanation":"Agents that negotiate the division of work add coordination cost and unpredictability to a problem whose division is already known. A simple list of packages in code does this job reliably.","correct":false},{"text":"Run a fixed workflow in which code lists the packages and starts one narrow agent task for each, and use a more open agent only for the unusual packages.","explanation":"The work is predictable and repeats for each package, which fits a workflow: code controls the list and the order, and each agent gets a small, well-defined task. This gives full coverage and stable cost. The few unusual packages are the cases that benefit from a more flexible agent.","correct":true}],"answer":"<p>Correct answer: <strong>Run a fixed workflow in which code lists the packages and starts one narrow agent task for each, and use a more open agent only for the unusual packages.</strong></p><p>Anthropic&#x27;s guidance separates two kinds of system. In a workflow, code defines the path and models perform set steps. In an agent, the model directs its own process. Workflows give predictability and consistency for well-defined tasks. Agents are better when flexibility is needed and the steps cannot be listed in advance. The guidance is to use the simplest design that works and to add autonomy only where it gives a clear benefit.</p><p>The production data here points clearly to a workflow. The steps are the same for every package, so the fan-out can be written in code: list the packages, start one narrow task for each, and collect the results. This guarantees coverage, because no package is skipped, and it makes cost roughly proportional to the number of packages. The open-ended single agent had to discover and track this plan by itself across a very large repository, which explains the cost and the variation between attempts.</p><p>The decision does not have to be all or nothing. The 5% of unusual packages are the place for a more open agent or for a human. See Building effective agents and dynamic workflows in Claude Code.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 23. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: Tessellate Logistics is migrating a 2-million-line monorepo from a deprecated internal logging library to a new one. A platform team uses Claude Code in headless mode to run up to 40 coding agents at the same time. A coordinator script splits the migration into one task for each package, and each agent opens a pull request when it finishes. Human reviewers can review about 60 pull requests per day, and the agents now produce more than 200 per day. The CI pipeline runs the full test suite on every pull request.\n\nQuestion: To avoid permission prompts in unattended runs, the agents on the build servers run with permission checks bypassed. The build servers also hold the credentials that the CI pipeline uses to deploy to production, and they have unrestricted outbound internet access. Agents read code comments, dependency documentation, and web pages while they work. The security team considers this setup too risky. Which change most reduces the risk while still allowing unattended runs?","type":"multiple-choice","options":[{"text":"Run agents in a sandbox with filesystem and network isolation, and remove production credentials from it.","explanation":"A sandbox limits what any command can reach, whatever the agent decides to do. Removing production credentials from the environment and limiting outbound hosts takes away both the valuable target and the path for sending data out. Unattended runs remain possible inside the boundary.","correct":true},{"text":"Add a system prompt that forbids agents from reading credentials or contacting hosts outside the company.","explanation":"A system prompt is guidance, and agents in this setup read untrusted text that may contain instructions. With permissions bypassed and credentials present, one followed instruction is enough to cause serious harm.","correct":false},{"text":"Keep the setup, and record every command the agents run so that the security team can review the logs each week.","explanation":"Logging helps an investigation after something has happened. It does not stop an agent from using the deployment credentials or sending data out during the week before the review.","correct":false},{"text":"Switch the agents to a more capable model that is better at recognizing prompt injection in the content it reads.","explanation":"A more capable model resists injection better, but resistance is not a guarantee. The environment would still allow full damage in the cases where the model is misled.","correct":false}],"answer":"<p>Correct answer: <strong>Run agents in a sandbox with filesystem and network isolation, and remove production credentials from it.</strong></p><p>Unattended agents need freedom to run commands without a human approving each one. The safe way to give that freedom is to make the environment safe. An agent that processes untrusted content (web pages, documentation, code comments) can be misled by prompt injection. The design question is: if that happens, what can the agent reach?</p><p>Sandboxing answers this at the operating-system level. Filesystem isolation limits which paths commands can read and write. Network isolation limits which hosts they can contact. Inside those limits the agent can work without prompts, because the limits hold whatever the model decides. Anthropic&#x27;s secure deployment guidance adds two related practices. Keep credentials outside the agent&#x27;s boundary: for example, a proxy adds them to approved requests, so the agent never holds them. And allow outbound traffic only to an allowlist of hosts.</p><p>In the current setup, bypassed permissions, production credentials, and open internet access together give a misled agent the means to deploy to production or to send secrets out. A prompt rule, weekly log review, and a stronger model are all useful extra layers, but none of them removes that capability. See Sandboxing and Securely deploying AI agents.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 24. Domain: Runtime Guardrails and Production Security.","answerStatus":"source"},{"query":"Scenario: Quillon builds a contract-summary copilot for in-house legal teams. Every prompt change or model change must pass an evaluation gate in the CI pipeline before release. The gate uses an LLM-as-judge (a model that grades another model's output). The judge scores each summary from 1 to 5 for \"overall quality,\" and a release passes when the mean score on 300 test contracts is at least 4.0. Last quarter, three staff lawyers scored the same kind of summaries by hand. Quillon releases about twice a week.\n\nQuestion: The team compares the judge with the lawyers on 300 summaries that both have scored. The judge's mean score is 4.3 and the lawyers' mean is 3.4. On individual summaries, the judge and the lawyers give the same pass-or-fail verdict in 61% of cases. Every release in the last two months has passed the gate, and two of those releases caused customer complaints. What should the team do before it relies on the gate again?","type":"multiple-choice","options":[{"text":"Raise the passing mean from 4.0 to 4.6 so that the gap between the judge and the lawyers is covered.","explanation":"A higher threshold moves the pass line but does not make the judge's scores more accurate. A judge that agrees with experts on only 61% of verdicts ranks summaries poorly at any threshold.","correct":false},{"text":"Replace the lawyers' scores with the judge's scores as the reference, because the judge is more consistent than three different people.","explanation":"Consistency is not correctness. The lawyers are the experts whose judgment the gate is meant to represent, and the customer complaints support their lower scores. Treating the judge as the reference would hide the problem.","correct":false},{"text":"Treat the lawyers' labels as the reference, and revise the judge until its agreement with them is acceptable.","explanation":"The judge is a measuring tool, and it must be calibrated against a trusted reference before its readings are used. Agreement of 61% and a mean that is 0.9 too high show that it is not calibrated. The lawyer labels are the reference to tune against.","correct":true},{"text":"Run the judge three times on each summary and average the scores to reduce random variation.","explanation":"Averaging reduces random noise, but the judge is wrong in a consistent direction: it scores too high. The average of three scores that are too high is still too high.","correct":false}],"answer":"<p>Correct answer: <strong>Treat the lawyers&#x27; labels as the reference, and revise the judge until its agreement with them is acceptable.</strong></p><p>An LLM-as-judge is useful only when it has been calibrated: its verdicts are compared with labels from human experts on the same items, and the agreement is good enough for the decision that depends on it. Without that check, a gate can pass every release while quality falls. That is what the two customer complaints show.</p><p>Calibration is a loop. Collect a set of items labeled by experts. Run the judge on the same items. Measure agreement on the decision that matters (in this case pass or fail), preferably with a statistic that corrects for agreement by chance, such as Cohen&#x27;s kappa. Then read the cases where the judge and the experts disagree, improve the rubric or the judge prompt, and measure again. The judge receives gating authority only when agreement is acceptable. The exam guide&#x27;s own sample question makes the same point: withhold gating authority until agreement with human labels is acceptable.</p><p>Changing the threshold, averaging repeated runs, or treating the judge as the reference all leave an inaccurate instrument in control. See Demystifying evals for AI agents and Define success criteria and build evaluations.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 25. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"},{"query":"Scenario: Quillon builds a contract-summary copilot for in-house legal teams. Every prompt change or model change must pass an evaluation gate in the CI pipeline before release. The gate uses an LLM-as-judge (a model that grades another model's output). The judge scores each summary from 1 to 5 for \"overall quality,\" and a release passes when the mean score on 300 test contracts is at least 4.0. Last quarter, three staff lawyers scored the same kind of summaries by hand. Quillon releases about twice a week.\n\nQuestion: The team reads 50 summaries on which the judge and the lawyers disagree. The judge's prompt asks only for \"overall quality from 1 to 5.\" The lawyers explain that they fail any summary that invents a term, misses a termination clause, or states a wrong party, however well it is written. The judge often gives 4 or 5 to fluent summaries that have one of these faults. How should the rubric be redesigned?","type":"multiple-choice","options":[{"text":"Widen the scale from 1 to 5 to 1 to 100 so that the judge can express smaller differences in quality.","explanation":"A wider scale gives more possible numbers, but the meaning of the numbers is still not defined. The judge would still reward fluent writing, only with finer steps.","correct":false},{"text":"Add the sentence \"Be strict and critical\" to the judge's prompt to bring its scores closer to the lawyers' scores.","explanation":"A general instruction to be strict lowers scores across the board, including scores for good summaries. It does not tell the judge about the three specific faults that the lawyers treat as failures.","correct":false},{"text":"Ask the judge to give its score first and then to write a justification for the score it chose.","explanation":"When the score comes first, the justification only explains a decision that is already made. Guidance for model-based grading is to have the model reason first and decide second.","correct":false},{"text":"Replace the single score with separate named criteria that each have a clear pass and fail definition.","explanation":"The lawyers apply specific rules that the phrase \"overall quality\" does not contain. Separate criteria such as \"no invented terms\" and \"termination clause present,\" each with a clear definition, tell the judge what to check.","correct":true}],"answer":"<p>Correct answer: <strong>Replace the single score with separate named criteria that each have a clear pass and fail definition.</strong></p><p>A vague rubric produces a judge that measures the wrong thing. &quot;Overall quality&quot; lets the model choose its own standard, and models tend to reward text that is fluent and well organized. The lawyers use a different standard: specific faults that make a summary unacceptable.</p><p>Anthropic&#x27;s guidance for LLM-based grading recommends detailed, clear rubrics, outputs that are specific and constrained (for example &quot;correct&quot; or &quot;incorrect,&quot; or a defined scale), and reasoning before the verdict. In practice, a complex quality is divided into separate criteria, each with its own definition and often its own grader call: no invented terms, all parties correct, termination clause covered, and so on. Each criterion can then be calibrated against human labels by itself, and a release report can show which criterion failed.</p><p>A wider scale and a general request for strictness do not add the missing definitions. A score written before the reasoning turns the reasoning into a justification after the fact. See Define success criteria and build evaluations and Demystifying evals for AI agents.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 26. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"},{"query":"Scenario: Quillon builds a contract-summary copilot for in-house legal teams. Every prompt change or model change must pass an evaluation gate in the CI pipeline before release. The gate uses an LLM-as-judge (a model that grades another model's output). The judge scores each summary from 1 to 5 for \"overall quality,\" and a release passes when the mean score on 300 test contracts is at least 4.0. Last quarter, three staff lawyers scored the same kind of summaries by hand. Quillon releases about twice a week.\n\nQuestion: An analyst notices that the judge's scores rise with summary length: summaries above 600 words average 4.6, and summaries below 250 words average 3.7. The lawyers prefer short summaries when the content is complete. The judge and the copilot use the same Claude model. A candidate prompt that makes summaries 40% longer has just passed the gate with the best score so far. What should the team do about this finding?","type":"multiple-choice","options":[{"text":"Accept the candidate, because the judge's score is the agreed release standard and the candidate has the highest score.","explanation":"The finding suggests that the score rewards length, which the lawyers do not want. Releasing on a score that may measure the wrong property would send a regression to customers.","correct":false},{"text":"Add a hard rule to the gate that rejects any summary longer than 400 words, and keep the judge unchanged.","explanation":"A length limit blocks the most obvious cases, but the judge would still prefer the longer of two acceptable summaries. The bias in the measurement remains and will affect later decisions.","correct":false},{"text":"Test the judge on pairs that have the same content at different lengths, and correct the rubric if it is biased.","explanation":"A controlled test separates length from content: if the longer version of the same content scores higher, the judge has a length bias. The rubric can then state that extra length is not a merit.","correct":true},{"text":"Add a system prompt instruction telling the copilot to write shorter summaries, and run the gate again.","explanation":"This changes the product, not the measuring tool. A biased judge would probably score the shorter summaries lower, so the gate would now argue against the behavior that the lawyers want.","correct":false}],"answer":"<p>Correct answer: <strong>Test the judge on pairs that have the same content at different lengths, and correct the rubric if it is biased.</strong></p><p>LLM judges have known biases: systematic preferences that are not related to quality. Common examples are a preference for longer answers (verbosity bias), a preference for whichever answer appears first in a comparison (position bias), and a tendency to rate output from the same model family more favorably. A correlation between score and length is a warning sign, but it is not proof, because longer summaries could also be more complete.</p><p>The way to confirm a bias is a controlled test. Build pairs that differ only in the suspected property, in this case the same content written at two lengths, and check whether the judge&#x27;s verdict changes. If it does, change the rubric so that it grades specific criteria and says clearly that length is not rewarded. Then check agreement with the lawyers again. Anthropic&#x27;s evaluation guidance also notes that it is generally best practice to use a different model to grade than the model that produced the output.</p><p>Until the judge is corrected, its approval of a longer-summary prompt is not evidence of an improvement. See Define success criteria and build evaluations and Demystifying evals for AI agents.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 27. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"},{"query":"Scenario: Quillon builds a contract-summary copilot for in-house legal teams. Every prompt change or model change must pass an evaluation gate in the CI pipeline before release. The gate uses an LLM-as-judge (a model that grades another model's output). The judge scores each summary from 1 to 5 for \"overall quality,\" and a release passes when the mean score on 300 test contracts is at least 4.0. Last quarter, three staff lawyers scored the same kind of summaries by hand. Quillon releases about twice a week.\n\nQuestion: The judge's configuration uses a model alias that always points to the newest version of the model. After a new model version becomes available, the mean score of the current production prompt on the unchanged test set moves from 4.1 to 4.5 overnight. No summary changed. Two candidate prompts that failed last week now pass. The team wants its gate to mean the same thing from week to week. What should it do?","type":"multiple-choice","options":[{"text":"Accept the new scores, because a newer model is a more capable judge and its scores are closer to the truth.","explanation":"A newer model may judge better or worse for this rubric. That is not known until it is compared with the lawyers' labels. What is known is that the same summaries now get different scores, so the threshold has changed its meaning.","correct":false},{"text":"Raise the passing mean by 0.4 to cancel the increase, and continue to use the alias for the judge model.","explanation":"A fixed correction assumes that the shift is the same for every summary and every future version. The next version would move the scores again, and the team would be correcting without evidence each time.","correct":false},{"text":"Pin the judge to a specific model version, and re-check agreement with the human-labeled set and reset the threshold whenever the judge changes.","explanation":"The judge is part of the measuring equipment, so it must stay fixed between measurements. Pinning the version stops silent changes. When the team decides to upgrade the judge, running it on the human-labeled set shows whether agreement holds and where the threshold should be.","correct":true},{"text":"Stop using an LLM judge, and return to full manual review by the three lawyers for every release.","explanation":"Manual review of 300 summaries twice a week is not sustainable for three lawyers. Judge drift can be controlled, so removing automation is not necessary.","correct":false}],"answer":"<p>Correct answer: <strong>Pin the judge to a specific model version, and re-check agreement with the human-labeled set and reset the threshold whenever the judge changes.</strong></p><p>Judge drift happens when the evaluator changes but the thing being evaluated does not. An alias that follows the newest model version changes the judge without any notice. Scores then move for reasons that are not related to product quality, and comparisons across time, the main purpose of a release gate, stop being valid.</p><p>The control has two parts. First, pin the judge to a specific model version (a full model ID, not a moving alias), so that it changes only when the team decides. Second, treat a change of judge like any other change to the evaluation system: run the new judge on the human-labeled calibration set, compare agreement with the previous judge, and set a new baseline and threshold from that evidence. The same discipline applies to the judge&#x27;s prompt and rubric, which should be under version control.</p><p>Accepting the new scores or subtracting 0.4 would be a guess about whether the new judge is better. Model versions and their lifecycle are described in Model IDs and versioning and Model deprecations. See also Demystifying evals for AI agents.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 28. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"},{"query":"Scenario: Quillon builds a contract-summary copilot for in-house legal teams. Every prompt change or model change must pass an evaluation gate in the CI pipeline before release. The gate uses an LLM-as-judge (a model that grades another model's output). The judge scores each summary from 1 to 5 for \"overall quality,\" and a release passes when the mean score on 300 test contracts is at least 4.0. Last quarter, three staff lawyers scored the same kind of summaries by hand. Quillon releases about twice a week.\n\nQuestion: After the rubric is revised, the gate still passes a release on the mean score alone. A review of one passed release finds that 3% of its summaries contained an invented contract term, and that almost all of these were summaries of software license agreements, which make up 10% of the test set. The mean was 4.4, because the other summaries scored well. Which two changes to the release criteria would have stopped this release? (Select TWO.)","type":"multiple-choice","options":[{"text":"Add a separate must-pass check on the rate of critical failures, such as invented terms, with a very low limit.","explanation":"This is correct. A mean hides rare, severe faults behind many good results. A separate criterion for critical failures cannot be offset by high scores on other summaries.","correct":true},{"text":"Raise the required mean score from 4.0 to 4.3 so that weaker releases, including this one, are rejected by the gate.","explanation":"This is incorrect. The release scored 4.4, so it would pass a 4.3 threshold as well. The mean is not sensitive to a small number of severe failures.","correct":false},{"text":"Increase the test set from 300 to 3,000 contracts with the same mix of contract types.","explanation":"This is incorrect. A larger set makes the mean more stable, but it is still a mean. The same 3% of severe failures would be averaged away in the same manner.","correct":false},{"text":"Report results for each contract type, and require every type to meet the standard.","explanation":"This is correct. The failures were concentrated in one contract type that is 10% of the set. Results for each type would have shown a clear regression in software license agreements that the overall mean hid.","correct":true},{"text":"Let the judge decide for each release whether the failures it found are serious enough to block the release.","explanation":"This is incorrect. Release criteria should be fixed rules agreed in advance. Leaving the decision to the judge's discretion at each release makes the gate inconsistent and hard to audit.","correct":false}],"answer":"<p>Correct answers: <strong>Add a separate must-pass check on the rate of critical failures, such as invented terms, with a very low limit.; Report results for each contract type, and require every type to meet the standard.</strong></p><p>A single aggregate score is a weak release criterion for two reasons. It lets many good results cancel a few very bad ones, and it hides segments where quality is much lower than average. For a legal product, one invented contract term can matter more than a hundred slightly awkward sentences.</p><p>Good release criteria have several conditions. Critical behaviors are must-pass checks with their own limits, for example an invented-term rate of zero or close to zero. Results are divided by meaningful segments (contract type, language, length), and each segment is compared with the current production baseline, so that a regression in a small segment is visible. Mean quality scores stay as one input among several. Anthropic&#x27;s guidance on success criteria points out that most use cases need evaluation on several dimensions, and its agent evaluation guidance separates capability evals from regression evals, which should stay close to a 100% pass rate.</p><p>A higher mean threshold and a larger test set still average the failures away, and the judge&#x27;s discretion replaces fixed criteria with a different decision each time. See Define success criteria and build evaluations and Demystifying evals for AI agents.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 29. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"},{"query":"Scenario: Quillon builds a contract-summary copilot for in-house legal teams. Every prompt change or model change must pass an evaluation gate in the CI pipeline before release. The gate uses an LLM-as-judge (a model that grades another model's output). The judge scores each summary from 1 to 5 for \"overall quality,\" and a release passes when the mean score on 300 test contracts is at least 4.0. Last quarter, three staff lawyers scored the same kind of summaries by hand. Quillon releases about twice a week.\n\nQuestion: A new prompt passed the offline gate and was released to all customers on a Monday. That week, the thumbs-up rate on summaries rose from 62% to 66%, and the product manager reported an improvement. In the same week, a large new customer started using the product, and the lawyers there rate almost everything positively. The team also knows that customer lawyers edit most summaries before they use them. How should the team measure whether the new prompt is better for real users?","type":"multiple-choice","options":[{"text":"Run both prompts on randomly assigned traffic, and compare how much lawyers edit the summaries.","explanation":"Random assignment during the same period makes the two groups alike in everything except the prompt, so the new customer affects both equally. For a generation task that users correct by hand, the amount of editing is a direct measure of how useful the draft was.","correct":true},{"text":"Compare the thumbs-up rate for the four weeks before the release with the four weeks after it.","explanation":"A longer before-and-after comparison is still affected by everything else that changed, including the new customer. It cannot separate the effect of the prompt from the change in who is using the product.","correct":false},{"text":"Run the offline gate again with twice as many test contracts to confirm the improvement.","explanation":"The offline gate has already passed, and running it again repeats a result that is known. The open question is how real users respond, and an offline test cannot answer it.","correct":false},{"text":"Ask the new customer's lawyers to stop rating summaries until the measurement period is complete.","explanation":"This removes one known distortion but leaves every other difference between the two periods. It also discards feedback from a real customer.","correct":false}],"answer":"<p>Correct answer: <strong>Run both prompts on randomly assigned traffic, and compare how much lawyers edit the summaries.</strong></p><p>Online quality measurement answers a question that offline evaluation cannot: do real users, on real tasks, get a better result? A before-and-after comparison is weak evidence, because the user population, the mix of documents, and many other factors change over time. Here, a new customer who rates everything positively is enough to explain a four-point rise.</p><p>An A/B test removes these confounding factors (other changes that happen at the same time). Traffic is assigned at random to the old prompt and the new prompt during the same period, so both groups contain the same mix of customers and documents, and a difference in outcome can be attributed to the prompt. The metric should fit the task type. For a generation task where users revise the output, behavioral signals such as edit distance, acceptance without edits, or time to finish are usually more reliable than a thumbs rating that users rarely give. Extraction tasks fit field-level accuracy, agentic tasks fit task completion, and retrieval-grounded tasks fit groundedness and citation correctness.</p><p>Anthropic&#x27;s evaluation guidance lists A/B testing, user feedback, production monitoring, and manual transcript review as complementary methods to automated evals. See Demystifying evals for AI agents and Define success criteria and build evaluations.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 30. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"},{"query":"Scenario: Quillon builds a contract-summary copilot for in-house legal teams. Every prompt change or model change must pass an evaluation gate in the CI pipeline before release. The gate uses an LLM-as-judge (a model that grades another model's output). The judge scores each summary from 1 to 5 for \"overall quality,\" and a release passes when the mean score on 300 test contracts is at least 4.0. Last quarter, three staff lawyers scored the same kind of summaries by hand. Quillon releases about twice a week.\n\nQuestion: The evaluation gate sometimes fails at night because of infrastructure problems, such as a judge request that times out, and not because of a real regression. The team wants a coding agent to respond automatically when the gate fails: it should work out whether the failure is real, collect the evidence, and reduce the time engineers spend on triage in the morning. The agent will run with nobody watching. Which design is the most appropriate?","type":"multiple-choice","options":[{"text":"Trigger the agent on the failure with read-only access, and have it report findings to the on-call engineer.","explanation":"An event-driven first responder is valuable for investigation: it reads logs, re-runs the failed checks, and classifies the failure. Limiting it to read access and reporting keeps the release decision with a person. The report means that the engineer starts with the evidence.","correct":true},{"text":"Trigger the agent on the failure, and let it change the judge threshold or merge the release when it decides that the failure is not real.","explanation":"This lets an unattended agent weaken the gate and ship a release based on its own judgment. If the agent is wrong, a real regression reaches customers with no human decision.","correct":false},{"text":"Run the agent on a schedule every morning at 8 AM to review all gate results from the night before.","explanation":"A morning schedule starts the investigation hours after the failure, and at the same time as the engineers. The team asked for an automatic response to the failure event, so that triage is done before people arrive.","correct":false},{"text":"Trigger the agent on the failure, and have it re-run the whole pipeline again and again until the gate passes.","explanation":"Repeating the pipeline until it passes can hide a real regression that fails only some of the time, and it uses a lot of compute. It also produces no explanation for the engineers.","correct":false}],"answer":"<p>Correct answer: <strong>Trigger the agent on the failure with read-only access, and have it report findings to the on-call engineer.</strong></p><p>Coding agents can run without supervision in three main ways: toward a goal, on a schedule, or as an event-driven responder. A failed CI gate is an event, so an agent that starts on that event gives the fastest first response. Claude Code supports this through headless runs in CI systems such as GitHub Actions and through cloud scheduled tasks that can also be triggered by API calls or GitHub events.</p><p>For unattended operation, the design questions are what the agent may do, how it reports, and when it hands over. A CI first responder should have least privilege: it can read logs, re-run a failed check, and write notes, but it cannot change thresholds, merge, or release. It should leave checkpoints (saved notes on what it checked and found) so that its work is not lost if it is interrupted. It should notify the right channel and escalate with a clear recommendation, so that a human makes the final decision.</p><p>An agent that can change the gate or merge on its own removes the control that the gate exists to provide. Repeating the pipeline until it passes hides failures that happen only sometimes. See Claude Code GitHub Actions, Automate work with scheduled tasks, and Best practices for Claude Code.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 31. Domain: Agent Fleet Operations for Software Delivery.","answerStatus":"source"},{"query":"Scenario: Quillon builds a contract-summary copilot for in-house legal teams. Every prompt change or model change must pass an evaluation gate in the CI pipeline before release. The gate uses an LLM-as-judge (a model that grades another model's output). The judge scores each summary from 1 to 5 for \"overall quality,\" and a release passes when the mean score on 300 test contracts is at least 4.0. Last quarter, three staff lawyers scored the same kind of summaries by hand. Quillon releases about twice a week.\n\nQuestion: Quillon's prompts are stored in a configuration service, and engineers edit the live value directly. Last month, an edit that passed the gate caused poor summaries for one contract type in production. It took two days to notice, nobody could say which requests had used the new text, and the old text had to be rebuilt from a chat message. The team wants safer prompt changes. Which practice addresses all three problems?","type":"multiple-choice","options":[{"text":"Require two engineers to approve each edit to the live prompt value in the configuration service.","explanation":"A second approval may catch some mistakes before they go live. It does not record which requests used which text, does not limit how many users see a bad change, and does not make it easy to go back.","correct":false},{"text":"Store each prompt as an immutable numbered version, record the version on every request, and release new versions to a small share of traffic with automatic rollback.","explanation":"Immutable versions mean that the previous prompt always exists and can be restored. Recording the version on every request shows exactly which outputs were affected. A gradual release limits a bad change to a small share of users, and automatic rollback returns to the known good version when metrics fall.","correct":true},{"text":"Move the prompt text into the application's source code so that it changes only with a full application deployment.","explanation":"Source control gives a history, which helps with recovery. But a full deployment still sends the change to every user at once, and requests are still not labeled with the prompt they used.","correct":false},{"text":"Keep a copy of every previous prompt in a shared document so that the old text can be found quickly.","explanation":"A document makes old text easier to find, but it depends on people keeping it current. It does nothing to detect a bad change sooner or to show which requests were affected.","correct":false}],"answer":"<p>Correct answer: <strong>Store each prompt as an immutable numbered version, record the version on every request, and release new versions to a small share of traffic with automatic rollback.</strong></p><p>A prompt is production configuration that changes product behavior, so it needs the same change management as code. Three practices work together. Prompt versioning: every change creates a new immutable version with an identifier, and old versions are never edited or lost. Traceability: each request records the prompt version (and the model version) that served it, in traces and logs, so that an incident can be limited to an exact set of requests. Progressive rollout with rollback: a new version first serves a small share of traffic (a canary), key metrics are compared with the current version, and the share grows only if the metrics hold. If they fall, traffic returns to the previous version automatically.</p><p>An offline gate reduces the chance of a bad release but cannot remove it, because no test set covers everything in production. Progressive rollout limits how many users are affected by the cases that the gate misses. In this incident, a canary with metrics for each contract type would have shown the problem within hours on a small share of traffic.</p><p>Peer approval and a shared document are helpful habits, but they do not give traceability or control over exposure. See Optimizing for cost and intelligence, which recommends a shadow run on a slice of traffic before cutover, and Define success criteria and build evaluations.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 32. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: Parcelwise is a delivery company. Its customer-support copilot handles 3 million conversations each month on the Claude API. Every request sends a 9,000-token system prompt of policies, 14 tool definitions, and the conversation so far. About 70% of conversations are simple parcel-tracking questions, and the rest involve damage claims, customs, or billing disputes. The product target is that the customer sees the first words of a reply within 1.5 seconds. Monthly API spend has doubled in one quarter.\n\nQuestion: Prompt caching is enabled with a cache breakpoint at the end of the system prompt, but usage data shows cache_read_input_tokens at zero and cache_creation_input_tokens at about 9,000 on almost every request. An engineer finds that the first line of the system prompt is \"Current time:\" followed by a timestamp that the application fills in for each request. Requests in one conversation arrive a few seconds apart. Which change will restore cache hits?","type":"multiple-choice","options":[{"text":"Change the cache duration from 5 minutes to 1 hour so that the cached system prompt stays available for longer.","explanation":"The cache is not expiring: requests arrive seconds apart, well inside 5 minutes. The prefix is different on every request, so a longer duration would only store more entries that are never read, at a higher write price.","correct":false},{"text":"Add three more cache breakpoints inside the system prompt so that smaller sections can be matched separately.","explanation":"Every breakpoint caches the prefix from the start of the prompt up to that point. The changing timestamp is on the first line, so every one of those prefixes would also be different on each request.","correct":false},{"text":"Move the timestamp out of the system prompt and into the newest user message, after the cached content.","explanation":"A cache hit needs a prefix that is exactly the same up to the breakpoint. A timestamp at the start changes the prefix on every request, so every request writes a new entry and reads none. When the changing value is placed after the stable content, the 9,000-token prefix stays the same and can be read from the cache.","correct":true},{"text":"Remove the 14 tool definitions from the request so that the system prompt is the first content in the cached prefix.","explanation":"Tool definitions come before the system prompt in the cached prefix, but they are stable here and are not the cause of the misses. Removing them would break the copilot's tools and leave the timestamp problem unchanged.","correct":false}],"answer":"<p>Correct answer: <strong>Move the timestamp out of the system prompt and into the newest user message, after the cached content.</strong></p><p>Prompt caching is a prefix match. The prefix is built in a fixed order (tools, then system, then messages), and a cache hit requires the content up to the breakpoint to be exactly the same as in an earlier request. Any change invalidates everything after it. A value that changes on every request and is placed at the start of the system prompt therefore makes every request a full cache write (billed at 1.25 times the input price for the 5-minute cache) and never a cache read (billed at a small fraction of the input price).</p><p>The usage fields show this pattern clearly. cache_creation_input_tokens counts tokens written, and cache_read_input_tokens counts tokens read. Writes on every request with zero reads mean that the prefix is not stable. Anthropic&#x27;s cost guidance names this exact cause, per-request content such as timestamps placed before the stable prefix, and recommends moving it to the end of the newest user turn. The API also offers cache diagnostics, which compare consecutive requests and report where the prefix first differed.</p><p>A longer cache duration and more breakpoints do not help when the first line changes. See Prompt caching and Optimizing for cost and intelligence.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 33. Domain: Cost and Latency Optimization at Scale.","answerStatus":"source"},{"query":"Scenario: Parcelwise is a delivery company. Its customer-support copilot handles 3 million conversations each month on the Claude API. Every request sends a 9,000-token system prompt of policies, 14 tool definitions, and the conversation so far. About 70% of conversations are simple parcel-tracking questions, and the rest involve damage claims, customs, or billing disputes. The product target is that the customer sees the first words of a reply within 1.5 seconds. Monthly API spend has doubled in one quarter.\n\nQuestion: All 3 million conversations run on the most capable model in the Claude family. Usage data confirms that 70% are simple tracking questions that end in one or two turns after a single tool call. The other 30% need several tools and careful policy reasoning, and customer satisfaction on those is a company priority. Finance asks for a large cost reduction that does not lower quality on the complex conversations. Which strategy fits best?","type":"multiple-choice","options":[{"text":"Route simple tracking questions to a smaller model, and keep the stronger model for the complex cases.","explanation":"The workload has two clear segments with different needs. A smaller model handles the simple majority at much lower cost and with faster responses, and the complex minority keeps the stronger model.","correct":true},{"text":"Move all conversations to the smallest model, and accept lower quality on the complex 30% in exchange for the savings.","explanation":"This gives the largest saving, but it goes against the stated priority. The complex conversations need the reasoning of a stronger model, and satisfaction on them would probably fall.","correct":false},{"text":"Keep the most capable model for all conversations, and reduce cost by lowering max_tokens on every request.","explanation":"The max_tokens setting only limits the maximum output length. It does not make the model write less, and short tracking answers are far below the limit already, so spend would hardly change.","correct":false},{"text":"Keep the most capable model for all conversations, and ask the vendor for a higher rate limit to handle the volume.","explanation":"A rate limit controls how many requests can be sent, not what each request costs. Higher limits would not reduce spend at all.","correct":false}],"answer":"<p>Correct answer: <strong>Route simple tracking questions to a smaller model, and keep the stronger model for the complex cases.</strong></p><p>Model routing matches each request to the least expensive model that can do it well. The Claude family covers a range of capability, speed, and price. High-volume tasks with outputs that are easy to check, such as a tracking lookup, suit the smallest model. Tasks that need reasoning over several steps justify a stronger one. When a workload has a large simple segment, routing is often the biggest cost lever after caching.</p><p>Two designs are common. A router classifies the request first (by intent, or with a small model) and sends it to the right model. A cascade starts with the cheaper configuration and escalates only when a checker shows that the result is not good enough. In both designs the decision should rest on evidence. Anthropic recommends comparing configurations by cost per completed task, not cost per token, and measuring on real traffic, because a cheaper model that fails and has to be retried may not save money.</p><p>Moving everything to the smallest model ignores the complex segment. Lowering max_tokens does not make a model write less, and a rate limit is not related to cost. See Optimizing for cost and intelligence and Models overview.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 34. Domain: Cost and Latency Optimization at Scale.","answerStatus":"source"},{"query":"Scenario: Parcelwise is a delivery company. Its customer-support copilot handles 3 million conversations each month on the Claude API. Every request sends a 9,000-token system prompt of policies, 14 tool definitions, and the conversation so far. About 70% of conversations are simple parcel-tracking questions, and the rest involve damage claims, customs, or billing disputes. The product target is that the customer sees the first words of a reply within 1.5 seconds. Monthly API spend has doubled in one quarter.\n\nQuestion: The copilot returns each reply as one complete message. Measurements show that a typical reply takes 5.5 seconds in total: the first token is generated after 0.9 seconds, and the rest of the time is spent generating about 300 output tokens. Customers see nothing until the whole reply is ready, so the 1.5-second target is missed on almost every reply. Which change meets the target with the least effect on answer quality?","type":"multiple-choice","options":[{"text":"Stream the response so that tokens are shown to the customer as they are generated.","explanation":"The target is about the first visible words, which is time to first token. That is already 0.9 seconds. Streaming shows each token as it arrives, so the customer sees text within the target while the full reply continues to generate. The content of the reply does not change.","correct":true},{"text":"Limit replies to 60 output tokens so that the total generation time falls below 1.5 seconds.","explanation":"A hard limit of 60 tokens would cut most replies in the middle of a sentence and remove information that customers need. It trades away quality to meet a target that can be met in a better way.","correct":false},{"text":"Send the requests through the Message Batches API to benefit from its more efficient processing.","explanation":"The Message Batches API is asynchronous and is built for work where nobody is waiting. Results can take up to 24 hours, so it is the opposite of what a live chat needs.","correct":false},{"text":"Double the size of the application's server fleet so that requests are processed faster.","explanation":"The time is spent generating tokens in the model, not in Parcelwise's own servers. More application servers would not change the 5.5 seconds of generation.","correct":false}],"answer":"<p>Correct answer: <strong>Stream the response so that tokens are shown to the customer as they are generated.</strong></p><p>Latency for a model response has two different measures. Time to first token (TTFT) is how long the user waits before anything appears. Total latency is how long the full response takes, and it grows with the number of output tokens. A target about &quot;the first words of a reply&quot; is a TTFT target.</p><p>In this case TTFT is already 0.9 seconds. The product misses the target only because it waits for the complete message before showing anything. Streaming (setting stream: true and reading server-sent events) sends tokens to the application as they are generated. The total time is the same, but the perceived wait falls to the TTFT. Anthropic&#x27;s latency guidance recommends streaming for this reason: it improves how responsive the application feels without changing the output.</p><p>Other levers work on other parts of the latency profile. A smaller model, a shorter prompt, and prompt caching can reduce TTFT. Shorter outputs and lower effort reduce total latency. Cutting replies to 60 tokens damages quality, and the Message Batches API is for offline work. See Reducing latency and Streaming messages.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 35. Domain: Cost and Latency Optimization at Scale.","answerStatus":"source"},{"query":"Scenario: Parcelwise is a delivery company. Its customer-support copilot handles 3 million conversations each month on the Claude API. Every request sends a 9,000-token system prompt of policies, 14 tool definitions, and the conversation so far. About 70% of conversations are simple parcel-tracking questions, and the rest involve damage claims, customs, or billing disputes. The product target is that the customer sees the first words of a reply within 1.5 seconds. Monthly API spend has doubled in one quarter.\n\nQuestion: For a customs question, the copilot needs three facts: the parcel's status, its customs declaration, and the duties owed. Each fact comes from a different tool, and no tool needs the output of another. Traces show that the model asks for one tool, waits for the result, asks for the next, and so on. This produces three model round trips of about 2 seconds each before the model starts to write the reply. How can the team shorten this sequence?","type":"multiple-choice","options":[{"text":"Combine the three tools into one tool that always returns the full record of every parcel belonging to the customer.","explanation":"One very large tool would return a lot of data that most questions do not need. That fills the context, raises cost, and slows every conversation, including the simple tracking questions.","correct":false},{"text":"Lower the effort level so that each of the three model round trips completes more quickly.","explanation":"Lower effort may shorten each round trip a little, but there would still be three of them in sequence. The larger gain comes from removing round trips.","correct":false},{"text":"Cache the results of the three tools for 24 hours so that repeat questions about a parcel skip the tool calls.","explanation":"Parcel and customs status change during the day, so results cached for 24 hours would often be out of date. Caching also gives no benefit the first time a customer asks about a parcel.","correct":false},{"text":"Let the model request the three tools in one turn, and run them at the same time in the application.","explanation":"The three lookups do not depend on each other, so they can be requested in the same assistant turn and run concurrently by the application. One round trip replaces three, and the wait is the time of the slowest tool, not the sum of all three.","correct":true}],"answer":"<p>Correct answer: <strong>Let the model request the three tools in one turn, and run them at the same time in the application.</strong></p><p>Each tool round trip costs a full model request: the model asks for a tool, the application runs it, and the model reads the result. When several lookups are independent, running them one after another adds their delays together. Parallel tool use removes that cost. Claude can return several tool_use blocks in one assistant turn. The application runs them concurrently and sends all of the tool_result blocks back in a single user message.</p><p>Two things must be true for this to work. The application must not disable parallel tool use, and it must actually run the calls concurrently. If it runs them one by one, model round trips are saved but tool time is not. The prompt can also encourage the behavior by saying that independent lookups should be requested together. The Agent SDK applies the same idea: tools that only read can run in parallel, and tools that change state run in sequence.</p><p>One oversized tool wastes context, lower effort leaves three sequential trips, and long caching of live status data returns old answers. See Parallel tool use and How the agent loop works.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 36. Domain: Cost and Latency Optimization at Scale.","answerStatus":"source"},{"query":"Scenario: Parcelwise is a delivery company. Its customer-support copilot handles 3 million conversations each month on the Claude API. Every request sends a 9,000-token system prompt of policies, 14 tool definitions, and the conversation so far. About 70% of conversations are simple parcel-tracking questions, and the rest involve damage claims, customs, or billing disputes. The product target is that the customer sees the first words of a reply within 1.5 seconds. Monthly API spend has doubled in one quarter.\n\nQuestion: Each night, a quality-assurance job sends the day's 100,000 finished conversations to Claude one at a time through the standard Messages API. Each request contains the same 6,000-token grading instructions followed by one conversation. Analysts read the results the next morning. The job costs almost as much as the live copilot. Which change reduces the cost of this job the most without affecting the analysts?","type":"multiple-choice","options":[{"text":"Submit the requests through the Message Batches API, and cache the shared instructions with the 1-hour duration.","explanation":"Nobody waits for each result, so the work suits the Message Batches API, which processes requests asynchronously at half the standard price. The 6,000-token instructions are the same in every request, so they can be read from the cache. Batches can run for longer than 5 minutes, so the 1-hour cache duration is recommended, and the caching discount is applied on top of the batch discount.","correct":true},{"text":"Enable streaming on each request so that the grading results are returned to the job more quickly, and keep the standard Messages API.","explanation":"Streaming changes when tokens are delivered, not what they cost. No person is watching the output of this job, so earlier delivery has no value.","correct":false},{"text":"Send the requests with fast mode enabled so that the nightly job finishes in less time.","explanation":"Fast mode gives higher output speed at a higher price. The job has until morning, so paying more for speed moves cost in the wrong direction.","correct":false},{"text":"Ask Anthropic for a higher rate limit so that the 100,000 requests can be sent in a shorter period each night.","explanation":"A higher rate limit lets the job send requests faster, but the price of each request is the same. The cost of the job would not change.","correct":false}],"answer":"<p>Correct answer: <strong>Submit the requests through the Message Batches API, and cache the shared instructions with the 1-hour duration.</strong></p><p>The first question for any high-volume workload is whether someone is waiting for each result. If the answer is no, the work is suited to batch economics. The Message Batches API processes requests asynchronously at 50% of the standard price. A batch can contain up to 100,000 requests. Most batches finish in less than an hour, results are guaranteed or expired within 24 hours, and each result is matched to its request by a custom_id.</p><p>The second lever is prompt caching for the shared prefix. The discounts combine: a cached read inside a batch gets both reductions. Requests in a batch are processed concurrently and in any order, so cache hits are best-effort. The documentation recommends using identical cache_control blocks in every request and the 1-hour cache duration, because a batch can run for longer than the 5-minute default.</p><p>Streaming, fast mode, and higher rate limits all change speed, and speed has no value for a job that is read the next morning. Fast mode would increase the cost. Note that batch processing has its own data retention terms and is not eligible for zero data retention, which matters for some organizations. See Batch processing and Prompt caching.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 37. Domain: Cost and Latency Optimization at Scale.","answerStatus":"source"},{"query":"Scenario: Parcelwise is a delivery company. Its customer-support copilot handles 3 million conversations each month on the Claude API. Every request sends a 9,000-token system prompt of policies, 14 tool definitions, and the conversation so far. About 70% of conversations are simple parcel-tracking questions, and the rest involve damage claims, customs, or billing disputes. The product target is that the customer sees the first words of a reply within 1.5 seconds. Monthly API spend has doubled in one quarter.\n\nQuestion: Finance asks why spend doubled while conversation volume grew by only 15%. The team has the monthly invoice and a count of requests, and nothing else. Engineers suspect several causes: the caching fault, longer conversations, and a prompt that grew when new policies were added. They cannot confirm any of these. Which telemetry would let the team explain the increase and notice the next one early?","type":"multiple-choice","options":[{"text":"A monthly export of the invoice total, divided by the number of conversations, to give an average cost per conversation.","explanation":"An average cost per conversation confirms that cost has risen, which is already known. It cannot show whether the cause is cache misses, longer conversations, or a larger prompt.","correct":false},{"text":"A full copy of every prompt and response, kept in long-term storage so that engineers can read them when costs rise.","explanation":"Reading stored conversations does not produce cost numbers. It is slow and expensive at 3 million conversations a month, and it creates a new store of customer data to protect.","correct":false},{"text":"A weekly survey that asks engineers which recent changes they think have increased token usage.","explanation":"Engineers' opinions are a starting point for an investigation, but they are not data. The team already has suspected causes and no means of testing them.","correct":false},{"text":"The usage token counts of each request with model, prompt version, and intent labels, on dashboards with alerts.","explanation":"Cost is the sum of uncached input, cache writes, cache reads, and output, each at its own price. Recording these four values for each request with labels shows directly which part grew and for which model, prompt version, or intent. Alerts on these values catch a new change within hours.","correct":true}],"answer":"<p>Correct answer: <strong>The usage token counts of each request with model, prompt version, and intent labels, on dashboards with alerts.</strong></p><p>An invoice shows the total, but not the cause. To explain cost, a team needs token and cost telemetry for each request. Every Messages API response has a usage object with the values that set the price: input_tokens (uncached input), cache_creation_input_tokens, cache_read_input_tokens, and output_tokens. Each has a different price, so they must be recorded separately and not added into one number.</p><p>These values become useful when they carry labels: model, prompt version, intent or route, and conversation ID. A dashboard can then answer the finance question directly. For example, it may show that cache-read share fell to zero on the day a prompt version was released, or that input tokens per conversation grew as the policy text grew. The same metrics support alerts. Anthropic&#x27;s cost guidance gives a reference point: in agent loops, most input should be read from the cache, and a cache-read share that is low suggests that something is breaking the prefix.</p><p>Averages from the invoice and engineers&#x27; opinions cannot separate the possible causes, and storing all content is costly without giving cost data. See Optimizing for cost and intelligence and Prompt caching.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 38. Domain: Observability and Production Monitoring.","answerStatus":"source"},{"query":"Scenario: Parcelwise is a delivery company. Its customer-support copilot handles 3 million conversations each month on the Claude API. Every request sends a 9,000-token system prompt of policies, 14 tool definitions, and the conversation so far. About 70% of conversations are simple parcel-tracking questions, and the rest involve damage claims, customs, or billing disputes. The product target is that the customer sees the first words of a reply within 1.5 seconds. Monthly API spend has doubled in one quarter.\n\nQuestion: During the evening peak, some requests fail with 429 errors. The response headers on recent requests show plenty of remaining requests per minute, but the remainin
