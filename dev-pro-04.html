s a booking copilot on Claude Managed Agents. Each customer conversation is a session in which the agent searches for flights and hotels through tools and then makes the booking. The service handles 200,000 sessions per day. The site reliability team has dashboards for HTTP error rate and 95th percentile latency only, and both look healthy. Even so, the share of sessions that end in a completed booking has fallen from 31% to 24% over three weeks, and no alert was raised.\n\nQuestion: Cohort analysis shows that the fall in bookings is concentrated in sessions that call the hotel search tool. Three weeks ago, the hotel provider changed its API response: the nightly price moved from a field named total_price to a nested field named price.total. Cinderpeak's MCP server passes the provider's JSON to the agent unchanged. In the affected sessions, the agent sometimes reads the wrong number and sometimes tells the customer that no price is available. Where is the origin of the failure, and what is the appropriate fix?","type":"multiple-choice","options":[{"text":"The origin is the tool layer, which passes on an unstable format. Have the MCP server map it to a stable, versioned schema.","explanation":"The model receives different data from what the tool's contract describes, so the fault is in the tool integration. A server that converts the provider's response into a stable schema of its own keeps the agent separate from upstream changes. Versioning the schema makes any later change explicit.","correct":true},{"text":"The origin is the model, which should understand both formats. Add examples of both response formats to the system prompt.","explanation":"The agent succeeds on some sessions and fails on others because it has to guess the meaning of an undocumented change. Prompt examples would cover this one change and would do nothing for the next one.","correct":false},{"text":"The origin is the customers, whose requests for prices are unclear. Add a clarifying question before each hotel search.","explanation":"Customers' requests have not changed in three weeks. The provider's response format changed, and the timing matches the start of the fall.","correct":false},{"text":"The origin is the agent harness, which allows too few turns. Raise the turn limit so that the agent can retry the hotel search.","explanation":"A retry of the search returns the same changed format. More turns would increase cost and would not change the result.","correct":false}],"answer":"<p>Correct answer: <strong>The origin is the tool layer, which passes on an unstable format. Have the MCP server map it to a stable, versioned schema.</strong></p><p>A failure in an agent system can start in the model&#x27;s output, the harness, the tools, or the data. Here the evidence points to the tool layer. The failure is limited to one tool, it began when the upstream provider changed its response, and the model&#x27;s behavior varies because it is reading a format that its tool description does not match.</p><p>The design fault is that the MCP server is only a pass-through for a third-party response. A tool is an interface for the model, and it should have a stable contract that the server owns. The server should convert the provider&#x27;s response into its own schema, with clear field names and only the fields that the agent needs, and should give that schema a version. When the provider changes its API, the mapping inside the server changes and the agent sees no difference. Contract tests that run the mapping against the provider&#x27;s real responses turn an upstream change into a failed test and not a three-week fall in bookings. If the tool&#x27;s own schema has to change, that change is released as a new version and tested with the agent before rollout.</p><p>Anthropic&#x27;s guidance on writing tools also recommends returning only high-signal fields with clear names, and not raw technical payloads. See Writing effective tools for agents and the MCP Tools specification.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 59. Domain: Advanced Debugging and Incident Response.","answerStatus":"source"},{"query":"Scenario: Cinderpeak Travel runs a booking copilot on Claude Managed Agents. Each customer conversation is a session in which the agent searches for flights and hotels through tools and then makes the booking. The service handles 200,000 sessions per day. The site reliability team has dashboards for HTTP error rate and 95th percentile latency only, and both look healthy. Even so, the share of sessions that end in a completed booking has fallen from 31% to 24% over three weeks, and no alert was raised.\n\nQuestion: A cost review finds that most sessions cost a few cents, but about 0.2% of sessions enter long loops, for example searching the same routes again and again for a customer who keeps changing the dates, and reach $30 to $50 each. Together these sessions account for a tenth of monthly spend. The team wants a hard limit on what any single session can spend, with no effect on normal sessions. Which control fits best?","type":"multiple-choice","options":[{"text":"Lower the max_tokens setting on every model request so that each response is shorter and costs less.","explanation":"This limits the length of each response, not the number of requests in a session. A loop of hundreds of short requests would still cost a lot, and normal sessions could have useful answers cut short.","correct":false},{"text":"Set a budget on each session at creation so that the session pauses when its cost reaches the limit.","explanation":"A session budget is a hard spending limit for one session. When the limit is reached, the session pauses and no new model requests are issued, so a loop cannot continue to consume money. Normal sessions never approach the limit and are not affected. The application can then decide whether to raise the budget or to pass the customer to a person.","correct":true},{"text":"Set a low monthly spend limit on the workspace that the booking agent uses.","explanation":"A workspace spend limit caps the total for all sessions together. When it is reached, every customer is blocked, including those in normal sessions. It does not single out the expensive sessions.","correct":false},{"text":"Run a script every 10 minutes that reads each session's usage and stops any session above the limit.","explanation":"Polling can stop a session only after the next check, so sessions can run well past the limit. The platform documentation recommends a session budget in place of polling usage and stopping sessions yourself.","correct":false}],"answer":"<p>Correct answer: <strong>Set a budget on each session at creation so that the session pauses when its cost reaches the limit.</strong></p><p>Cost control at scale needs limits at more than one level. A workspace or organization spend limit protects the total but cannot tell a good session from a bad one. A limit for each session deals with the long tail: the small share of sessions that loop and cost hundreds of times more than a typical session.</p><p>Claude Managed Agents provides this as a session budget: an optional hard ceiling, in US dollars at list prices, that is set when the session is created. The platform tracks the session&#x27;s cost continuously. When the cost reaches the ceiling, the platform stops issuing new model requests and the session pauses and goes idle with a budget_reached stop reason. The request that is in progress still completes, so the final cost can be slightly above the limit. A paused session is not lost: changing or removing the budget lets it resume. The documentation advises setting a budget in place of polling usage. A workspace spend limit is a sensible additional backstop.</p><p>Lowering max_tokens does not limit the number of turns, and a workspace limit alone would stop every customer. See Session budgets and Inspect sessions and track usage.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 60. Domain: Cost and Latency Optimization at Scale.","answerStatus":"source"},{"query":"Scenario: Ledgerstone is an accounting platform with 1,200 business customers, called tenants. A Claude-powered agent categorizes each tenant's transactions and writes a month-end summary. All tenants share one Claude API organization. Interactive categorization must respond within a few seconds, while month-end summaries are generated overnight for every tenant. On the first night of each month, the job for one very large tenant uses most of the rate limit, and other tenants' interactive requests fail with 429 errors.\n\nQuestion: The engineering lead wants to guarantee that no single tenant can use up the capacity that other tenants need, and that interactive requests are never left without capacity because of overnight work. All requests currently go directly from each service to the API with the same API key. Which design gives the isolation that the lead wants?","type":"multiple-choice","options":[{"text":"Ask Anthropic for a rate limit that is large enough for the biggest tenant's job and all interactive traffic at the same time.","explanation":"A higher limit raises the ceiling but does not isolate tenants. As the largest tenant grows, or when a second large tenant arrives, the same problem returns at the new limit.","correct":false},{"text":"Send all requests through a gateway that applies a quota and a queue for each tenant, and use separate workspaces with their own limits for interactive and overnight traffic.","explanation":"Isolation needs a place where limits are applied for each tenant before requests reach the shared API limit. A gateway with tenant quotas and fair queues stops one tenant from taking everything. Separate workspaces with their own rate limits reserve capacity for interactive work, whatever the overnight jobs do.","correct":true},{"text":"Create 1,200 separate Claude API organizations, one for each tenant, so that each tenant has its own rate limit.","explanation":"One organization for each tenant would isolate them, but it means managing 1,200 sets of billing, keys, and limits. Gateway quotas and workspaces give isolation without that operational cost.","correct":false},{"text":"Add a random delay of up to 30 seconds before every interactive request so that it is less likely to arrive during a busy moment.","explanation":"A random delay breaks the requirement to respond within a few seconds, and it does not reserve any capacity. Interactive requests would still fail whenever the overnight job is using the limit.","correct":false}],"answer":"<p>Correct answer: <strong>Send all requests through a gateway that applies a quota and a queue for each tenant, and use separate workspaces with their own limits for interactive and overnight traffic.</strong></p><p>In a multi-tenant system, all tenants draw from the provider&#x27;s organization-level rate limits. Without controls, the busiest tenant sets the experience for the others. This is called the noisy-neighbor problem. Isolation has to be built in two places.</p><p>First, inside your own system: a gateway between your services and the Claude API applies a quota for each tenant (requests and tokens per minute) and places excess work in a queue for that tenant, with fair scheduling between tenants. No tenant can then use more than its share, and one large job waits in its own queue without blocking others. Second, at the provider: workspaces in the Claude Console can have their own rate limits and spend limits, set below the organization limit. If interactive and overnight traffic use different workspaces, a limit on the overnight workspace keeps the remaining capacity available for interactive requests. The documentation gives this example: with an organization limit of 40,000 input tokens per minute, a limit of 30,000 on one workspace protects 10,000 for the others.</p><p>A larger shared limit postpones the problem, and one organization for each tenant is very expensive to operate. See Rate limits and Rate Limits API.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 61. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: Ledgerstone is an accounting platform with 1,200 business customers, called tenants. A Claude-powered agent categorizes each tenant's transactions and writes a month-end summary. All tenants share one Claude API organization. Interactive categorization must respond within a few seconds, while month-end summaries are generated overnight for every tenant. On the first night of each month, the job for one very large tenant uses most of the rate limit, and other tenants' interactive requests fail with 429 errors.\n\nQuestion: Month-end summaries are generated between midnight and 6 AM and are read by accountants at 9 AM. Each summary is one independent request with no tools. The job currently sends about 400,000 standard Messages API requests, competes with interactive traffic for the same per-minute limits, and is the largest item on Ledgerstone's bill. Ledgerstone does not have a zero data retention arrangement. Which change is the most appropriate for this workload?","type":"multiple-choice","options":[{"text":"Keep the standard API, but send the requests with streaming enabled so that summaries are completed sooner.","explanation":"Streaming changes how output is delivered and does not change the price or the use of rate limits. The job would still compete with interactive traffic and cost the same.","correct":false},{"text":"Keep the standard API, but run the job during business hours when engineers are available to watch it.","explanation":"Running the job during the day would place 400,000 requests in the same period as the heaviest interactive use. That would make the contention worse and save nothing.","correct":false},{"text":"Submit the summaries through the Message Batches API early, and match the results to tenants by custom_id.","explanation":"Nobody waits for each summary, so asynchronous processing fits. The Message Batches API costs half the standard price and has its own queue limits, so the job does not use the per-minute limits that interactive requests need. Most batches finish within an hour, and submitting early leaves time for the 24-hour maximum.","correct":true},{"text":"Generate the summaries only when an accountant opens the report, so that summaries nobody reads are never produced.","explanation":"Generation on demand makes the accountant wait for a long summary and moves the load to 9 AM, when many accountants open reports together. It turns a batch workload into an interactive peak.","correct":false}],"answer":"<p>Correct answer: <strong>Submit the summaries through the Message Batches API early, and match the results to tenants by custom_id.</strong></p><p>The useful question is whether the binding constraint for a workload is rate limits, token throughput, or price, and whether anyone is waiting. Month-end summaries are independent, have no tools, are not interactive, and are needed hours later. That is the profile of batch processing.</p><p>The Message Batches API gives three benefits here. It is billed at 50% of standard prices. It is asynchronous with separate limits: batch requests wait in a processing queue with their own size limits and do not draw on the synchronous per-minute limits, so interactive traffic is protected. And it handles scale: up to 100,000 requests in one batch, with results matched by custom_id because the order is not guaranteed. Most batches finish in less than an hour, but the guarantee is completion or expiry within 24 hours. A deadline must therefore be planned against the worst case, and the code must handle the errored and expired result types by submitting those requests again.</p><p>Batch processing keeps request and response data for up to 29 days and is not eligible for zero data retention. The scenario states that this does not apply to Ledgerstone. See Batch processing and Rate limits.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 62. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: Ledgerstone is an accounting platform with 1,200 business customers, called tenants. A Claude-powered agent categorizes each tenant's transactions and writes a month-end summary. All tenants share one Claude API organization. Interactive categorization must respond within a few seconds, while month-end summaries are generated overnight for every tenant. On the first night of each month, the job for one very large tenant uses most of the rate limit, and other tenants' interactive requests fail with 429 errors.\n\nQuestion: A separate nightly job re-categorizes old transactions through the standard Messages API. At midnight, the job starts 500 worker threads that all begin to send requests in the same second. Many requests fail with 429 errors, although the dashboard shows usage far below the per-minute token limits. The error body contains the code ramp_limit_exceeded. The workers retry at once, and the errors continue for 20 minutes. Which two changes resolve this? (Select TWO.)","type":"multiple-choice","options":[{"text":"Increase the number of worker threads from 500 to 2,000 so that the job completes before the errors build up.","explanation":"This is incorrect. More threads make the sudden jump at midnight larger, and the jump is what the ramp limit rejects. The errors would increase.","correct":false},{"text":"Retry each failed request immediately, up to 20 times, because the errors are temporary.","explanation":"This is incorrect. Immediate retries keep the request rate at its peak, so usage never settles at a level from which it can grow. This is the current behavior and the reason that the errors last 20 minutes.","correct":false},{"text":"Start the job at a low request rate and raise the rate gradually, with requests spread evenly over time.","explanation":"This is correct. A ramp limit restricts how fast usage may grow, so a sudden jump from zero to full speed is rejected even when it is below the per-minute limit. A gradual, even increase stays inside the allowed rate of growth.","correct":true},{"text":"Lower max_tokens on each request to reduce the output tokens that are counted against the limit.","explanation":"This is incorrect. The output token limit counts tokens that are actually generated and not the max_tokens value. The error is about how fast usage grows, not about response size.","correct":false},{"text":"Put the work behind a bounded queue with a controlled number of workers, and wait for the retry-after time before a retry.","explanation":"This is correct. A bounded queue with limited concurrency gives backpressure: when the API slows the workers, the producers slow as well and do not add more requests. Waiting for the retry-after time stops the retries from keeping usage at the level that causes the errors.","correct":true}],"answer":"<p>Correct answers: <strong>Start the job at a low request rate and raise the rate gradually, with requests spread evenly over time.; Put the work behind a bounded queue with a controlled number of workers, and wait for the retry-after time before a retry.</strong></p><p>Not every 429 error means that a per-minute limit is used up. The Claude API also applies ramp limits (acceleration limits), which cap how fast an organization&#x27;s token usage on a model may grow. A burst from zero to very high usage within seconds can be rejected with a rate_limit_error whose error.details.error_code is ramp_limit_exceeded, although usage is well below the ITPM and OTPM limits. The documented guidance is to wait for at least the retry-after time, hold traffic at a level where requests succeed, and then increase step by step. Scheduled or bulk jobs should start at a low rate and spread their requests evenly.</p><p>The engineering pattern for this is queueing with backpressure. Work items go into a bounded queue, and a controlled number of workers send requests at a rate that a limiter adjusts. When the API answers with 429, the limiter lowers the rate and the queue holds the remaining work. Without backpressure, producers continue to send, and retries add to the load.</p><p>More threads and immediate retries make the burst worse, and max_tokens has no effect on rate limits. The Message Batches API is not subject to ramp limits, which is one more reason to use it for bulk work that can wait. See Rate limits and Claude API errors.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 63. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: Ledgerstone is an accounting platform with 1,200 business customers, called tenants. A Claude-powered agent categorizes each tenant's transactions and writes a month-end summary. All tenants share one Claude API organization. Interactive categorization must respond within a few seconds, while month-end summaries are generated overnight for every tenant. On the first night of each month, the job for one very large tenant uses most of the rate limit, and other tenants' interactive requests fail with 429 errors.\n\nQuestion: The categorization agent connects to accounting integrations that together expose 180 tools. The tool definitions use about 40,000 input tokens on every request. A typical categorization uses 2 or 3 of these tools, and the agent has begun to select similar tools from the wrong integration. The team wants to reduce the cost of each request and improve tool selection, and it wants to keep all 180 tools available. Which technique should it adopt?","type":"multiple-choice","options":[{"text":"Shorten every tool description to a single short phrase to reduce the number of tokens in the definitions.","explanation":"Shorter descriptions save some tokens, but the description is the main information that the model uses to choose a tool. Removing detail would make wrong selections more frequent.","correct":false},{"text":"Split the 180 tools across six agents, and add a seventh agent that decides which of the six should handle each request.","explanation":"A multi-agent router adds a model call and a new point of failure to each request. It is a large redesign for a problem that deferred tool loading solves inside one agent.","correct":false},{"text":"Remove the 150 tools that are used least often so that only the 30 most common tools remain.","explanation":"This reduces tokens, but it breaks the requirement to keep all tools available. Tenants that depend on the less common integrations would lose features.","correct":false},{"text":"Mark most tools for deferred loading behind a tool search tool, and keep only the few most frequently used tools loaded.","explanation":"With tool search, deferred tool definitions are not placed in the context at the start. The agent searches the catalog and loads only the tools that the task needs. This removes most of the 40,000 tokens from each request and gives the model a smaller, more relevant set to choose from. All 180 tools remain available.","correct":true}],"answer":"<p>Correct answer: <strong>Mark most tools for deferred loading behind a tool search tool, and keep only the few most frequently used tools loaded.</strong></p><p>Tool definitions are part of the prompt. A large catalog has two costs: every request pays for definitions that it does not use, and the model&#x27;s accuracy in selecting a tool falls as many similar tools compete for attention. The tool search tool addresses both. Tools marked with defer_loading: true are not loaded into the context at the start. Claude searches the catalog when it needs a capability, and only the matching definitions are loaded.</p><p>Anthropic&#x27;s tool search documentation recommends tool search for large tool sets in which most tools are not needed on every turn, and recommends keeping the three to five most frequently used tools loaded. In one test described in the cost guidance, deferral kept cost flat while a catalog grew to several hundred tools. Deferral also works well with prompt caching, because the deferred definitions are not part of the cached prefix and a change to the catalog does not invalidate it. Other techniques deal with other sources of context growth: context editing clears old tool results, and programmatic tool calling reduces the number of round trips for tool results.</p><p>Shortening descriptions harms selection, removing tools removes features, and a multi-agent router is a more complex design than the problem needs. See Tool search tool and Manage tool context.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 64. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: Ledgerstone is an accounting platform with 1,200 business customers, called tenants. A Claude-powered agent categorizes each tenant's transactions and writes a month-end summary. All tenants share one Claude API organization. Interactive categorization must respond within a few seconds, while month-end summaries are generated overnight for every tenant. On the first night of each month, the job for one very large tenant uses most of the rate limit, and other tenants' interactive requests fail with 429 errors.\n\nQuestion: Tenants correct the agent's categories, for example \"payments to Northgate Supplies are always Office Equipment.\" At present these corrections exist only in the conversation in which they were made, so the agent repeats the same mistakes in the next session. The team wants corrections to persist across sessions, to remain available after a model upgrade, and never to be visible to another tenant. Which memory design meets these requirements?","type":"multiple-choice","options":[{"text":"Add every correction from every tenant to the shared system prompt so that the agent always has all corrections in context.","explanation":"A shared system prompt shows every tenant's corrections to every other tenant, which breaks the isolation requirement. It also grows without limit and invalidates the prompt cache each time a correction is added.","correct":false},{"text":"Store corrections in a persistent memory store with a separate namespace for each tenant, loaded on demand.","explanation":"Memory outside the context window survives the end of a session and does not depend on the model version. A separate namespace for each tenant keeps tenants apart. Loading only the entries that are relevant to the current transactions keeps the context small.","correct":true},{"text":"Keep each tenant's full conversation history, and send all of it again at the start of every new session.","explanation":"Sending all history again would keep the corrections, but at a cost and context size that grow with every session. The few useful corrections would be surrounded by a large amount of old conversation.","correct":false},{"text":"Rely on the model to remember the corrections, because it has seen them in earlier conversations.","explanation":"The model keeps nothing between API requests or sessions. Each request contains only what the application sends, so a correction that is not stored and supplied again is lost.","correct":false}],"answer":"<p>Correct answer: <strong>Store corrections in a persistent memory store with a separate namespace for each tenant, loaded on demand.</strong></p><p>A model has no memory between requests. Anything that must last longer than a session has to be kept in persistent memory outside the context window and brought back when it is needed. For a long-lived, multi-tenant agent, the memory design has to answer three questions: where the data is stored, what its scope is, and how it enters the context.</p><p>The data should be stored in a system that the application controls (files or a database), in a structured form: a rule with its vendor, category, source, and date, not unprocessed transcripts. Stored data does not depend on the model, so it survives a model upgrade unchanged. The scope must be the tenant: each tenant has its own namespace or directory, and the application, not the model, decides which namespace a session can read. This is a security boundary. For entry into the context, the agent should load entries on demand, for example the rules for the vendors in the current transactions, and should not load everything on every request.</p><p>Claude&#x27;s memory tool follows this model. Claude issues file operations on a memory directory, and the application carries them out in storage that it controls, which makes isolation between tenants possible. A shared system prompt breaks isolation and caching, and replaying all history does not scale. See Memory tool and Effective context engineering for AI agents.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 65. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: Ledgerstone is an accounting platform with 1,200 business customers, called tenants. A Claude-powered agent categorizes each tenant's transactions and writes a month-end summary. All tenants share one Claude API organization. Interactive categorization must respond within a few seconds, while month-end summaries are generated overnight for every tenant. On the first night of each month, the job for one very large tenant uses most of the rate limit, and other tenants' interactive requests fail with 429 errors.\n\nQuestion: Ledgerstone wants to charge its largest tenants according to their AI usage and to find tenants whose usage is unusual. The Claude Console shows usage and cost for each workspace and each API key, and Ledgerstone has two workspaces. Finance asks for cost for each tenant, each day, with a split between interactive and overnight work. Which instrumentation gives this in the most direct way?","type":"multiple-choice","options":[{"text":"Divide the monthly invoice by the number of tenants to give an average cost for each tenant.","explanation":"An average gives every tenant the same cost, which hides the differences that finance wants to see. The largest tenant and the smallest would look the same.","correct":false},{"text":"Create one API key for each tenant, and read usage for each key from the Console once a month.","explanation":"A key for each tenant would allow reporting by key, but it means creating, storing, and rotating 1,200 keys. It also does not separate interactive work from overnight work or give labels for further analysis.","correct":false},{"text":"Estimate each tenant's cost from the number of transactions that it uploaded, with one fixed price for each transaction.","explanation":"An estimate from the number of transactions ignores how tokens are actually used. Long descriptions, retries, and cache behavior differ between tenants, so the estimate could be far from the real cost.","correct":false},{"text":"Record the usage fields of every response in Ledgerstone's own telemetry, labeled with tenant ID and workload type, and calculate cost from them.","explanation":"The application knows which tenant each request serves, and the API's own reports do not. Recording the usage tokens of every response with a tenant label and a workload label gives exact cost for each tenant and day, and the same data shows unusual usage.","correct":true}],"answer":"<p>Correct answer: <strong>Record the usage fields of every response in Ledgerstone&#x27;s own telemetry, labeled with tenant ID and workload type, and calculate cost from them.</strong></p><p>Cost allocation in a multi-tenant application is a telemetry problem. The provider can report usage only by the dimensions that it knows: organization, workspace, API key, and model. The tenant is a concept inside your application, so your application must attach it.</p><p>The method is to record, for every model request, the usage fields from the response (uncached input, cache writes, cache reads, and output tokens) together with business labels: tenant ID, workload type, feature, and model. Cost is then calculated by applying the correct price to each type of token, and it can be summed along any dimension. The same events supply dashboards (cost for each tenant each day), anomaly detection (a tenant whose usage triples), and enforcement of budgets for each tenant in the gateway. For batch requests, the label can be included in the custom_id or connected to it.</p><p>The provider&#x27;s reports are still useful as a check on your own totals. Averages and estimates from transaction counts do not measure usage, and a key for each tenant is a heavy operational method that gives less detail. See Optimizing for cost and intelligence for calculating the price of a request from its usage fields, and Usage and Cost API.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 66. Domain: Observability and Production Monitoring.","answerStatus":"source"},{"query":"Scenario: Arbor Genomics runs a literature-review agent for its scientists. A scientist gives the agent a research question, and the agent then works for 6 to 10 hours: it searches publication databases, reads papers, and maintains a growing evidence table. A run usually makes more than 2,000 tool calls. The agent uses the Messages API with a long system prompt and prompt caching, on a model that supports mid-conversation system messages. Scientists sometimes send new instructions while a run is in progress.\n\nQuestion: After about three hours, a run approaches the context window limit. Most of the context is the full text of papers that the agent read earlier through its fetch_paper tool. The agent has already recorded the findings from those papers in the evidence table, and it can fetch any paper again if it needs to. Input cost per turn has become very high. Which context policy is the most suitable for the rest of the run?","type":"multiple-choice","options":[{"text":"Stop the run at the context limit, and ask the scientist to start a new run with a narrower question.","explanation":"This ends a run that could continue and gives up hours of work. Context management techniques exist so that a long task can continue past one context window.","correct":false},{"text":"Clear old tool results with context editing, and keep the evidence table in persistent memory.","explanation":"The paper texts are large, can be fetched again, and are already summarized in the evidence table, so they are the correct content to remove. Context editing clears old tool results and keeps the record that the calls were made. Keeping the evidence table in memory outside the context protects the findings from any clearing.","correct":true},{"text":"Continue without changes, and let the API return an error when the context window is full.","explanation":"Running into the limit without a plan ends the run with a failure at an unpredictable point. Cost also stays at its highest level for every turn before that.","correct":false},{"text":"Remove the system prompt from later requests to make room for more paper text.","explanation":"The system prompt contains the agent's instructions and is small compared with thousands of pages of papers. Removing it would harm the agent's behavior and release very little space.","correct":false}],"answer":"<p>Correct answer: <strong>Clear old tool results with context editing, and keep the evidence table in persistent memory.</strong></p><p>A long-running agent needs a context policy: a deliberate decision about what stays in the context window, what leaves it, and what is stored elsewhere. The best content to remove is content that is large, was needed only once, and can be recovered. Old tool results are the typical case.</p><p>The Claude API provides context editing for this purpose. The tool result clearing strategy removes older tool results when the context passes a configured threshold, and it keeps the record that each call happened. It works well together with persistent memory. Before content is cleared, anything that must be kept, in this case the evidence table, is written to storage outside the context, for example with the memory tool. The context then holds a small working set, and the lasting state is kept elsewhere. When a whole conversation must be reduced, compaction replaces older history with a summary.</p><p>Each technique has a tradeoff. Clearing changes the prompt prefix and therefore invalidates part of the prompt cache at that point, so thresholds should be set to clear a useful amount at one time and not a little on every turn. See Context editing, Memory tool, and Manage tool context.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 67. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: Arbor Genomics runs a literature-review agent for its scientists. A scientist gives the agent a research question, and the agent then works for 6 to 10 hours: it searches publication databases, reads papers, and maintains a growing evidence table. A run usually makes more than 2,000 tool calls. The agent uses the Messages API with a long system prompt and prompt caching, on a model that supports mid-conversation system messages. Scientists sometimes send new instructions while a run is in progress.\n\nQuestion: Four hours into a run, with about 150,000 tokens of cached context, a scientist sends a new rule: \"From now on, exclude preprints.\" The harness applies the rule by adding a sentence to the top-level system prompt. Usage data for the next request shows no cache reads and a cache write for the whole context. This happens each time a scientist adds a rule, and each occurrence costs several dollars. How should the harness deliver such rules?","type":"multiple-choice","options":[{"text":"Move the new rule to the beginning of the system prompt, before the existing instructions, so that the model reads it first.","explanation":"Any edit to the system prompt changes the cached prefix, wherever in the prompt it is made. A change at the beginning invalidates the same content as a change at the end of the system prompt: everything after the tools.","correct":false},{"text":"Turn off prompt caching for the rest of the run so that no cache writes are charged.","explanation":"Without caching, every later request pays the full input price for the whole context. That costs far more over the remaining hours than one cache write.","correct":false},{"text":"Add the rule to the description of the search tool, because tool definitions are processed before the system prompt.","explanation":"Tool definitions come first in the cached prefix. A change to them invalidates the cache for the tools, the system prompt, and all messages, which is the most expensive place to make an edit.","correct":false},{"text":"Append the rule as a system message at the end of the messages array, and leave the top-level system prompt unchanged.","explanation":"The cache matches a prefix in the order tools, system prompt, messages. An edit to the top-level system prompt changes the prefix near its start, so everything after it must be written again. A system message appended to the conversation leaves the earlier prefix identical, so the cache is still read and only the new message is processed as new input.","correct":true}],"answer":"<p>Correct answer: <strong>Append the rule as a system message at the end of the messages array, and leave the top-level system prompt unchanged.</strong></p><p>Prompt caching matches an exact prefix in a fixed order: tools, then system, then messages. A change at any point invalidates everything after it. The top-level system prompt is near the start, so a one-sentence edit forces the whole conversation to be written to the cache again. In a long session this is the most expensive kind of change. Anthropic&#x27;s cost guidance notes that mid-conversation changes cost many times more when they are made in the system prompt or at the top level.</p><p>The cache-safe method is to append. On supported models, a message with role: &quot;system&quot; can be added to the messages array at the point where the new instruction starts to apply. It has operator-level authority and takes precedence over the top-level system prompt for the turns that follow, and it leaves the earlier prefix unchanged, so the cache is still read. There are placement rules: for example, the message cannot be the first entry and cannot be placed between a tool call and its result. An instruction that comes from the end user can be sent as a normal user message, which also only appends.</p><p>The same reasoning explains why editing tool definitions during a session is costly and why caching should not be turned off. See Mid-conversation system messages and tool changes and Prompt caching.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 68. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: Arbor Genomics runs a literature-review agent for its scientists. A scientist gives the agent a research question, and the agent then works for 6 to 10 hours: it searches publication databases, reads papers, and maintains a growing evidence table. A run usually makes more than 2,000 tool calls. The agent uses the Messages API with a long system prompt and prompt caching, on a model that supports mid-conversation system messages. Scientists sometimes send new instructions while a run is in progress.\n\nQuestion: Arbor wants runs to survive two events: a crash of the worker process in the middle of a run, and a planned move to a newer model version, which may happen while some runs are in progress. Today, the only state of a run is the conversation history that the worker process holds in memory. The team has noticed that a new model version cannot always use reasoning blocks that an earlier version produced. Which design makes runs resumable in both cases?","type":"multiple-choice","options":[{"text":"Write the full conversation history to disk every hour, and reload it in a new process after a crash.","explanation":"An hourly snapshot can lose up to an hour of work. It also depends on replaying the old conversation exactly, which may not continue cleanly on a new model version.","correct":false},{"text":"Keep each run on its original model version until it ends, and never restart a worker process during a run.","explanation":"Crashes are not planned, so a rule against restarts cannot be kept. Fixing runs to old versions also fails when a version is retired, and it does not address the loss of state held in memory.","correct":false},{"text":"Enable a larger context window so that the whole run fits in one conversation and nothing has to be stored elsewhere.","explanation":"A larger window does not make state durable. A crash still loses everything that is held in memory, and the conversation is still tied to the model version that produced it.","correct":false},{"text":"Have the agent keep its evidence table and a progress file in durable storage for a new session to read.","explanation":"Artifacts outside the conversation, a current evidence table and notes on what is done and what is next, describe the state of the work in a form that does not depend on any process or model version. A new session, on the same or a newer model, can read them and continue.","correct":true}],"answer":"<p>Correct answer: <strong>Have the agent keep its evidence table and a progress file in durable storage for a new session to read.</strong></p><p>Durable execution for a long-running agent means that the state of the work exists outside the conversation. A conversation is fragile in two respects. It is lost if it exists only in a process&#x27;s memory. And it is tied to the model that produced it: reasoning blocks from one model version may not be readable by another, so an exact replay across a version change is not dependable.</p><p>The more robust pattern is structured progress artifacts. The agent maintains the product of its work (the evidence table), a progress file (what has been searched, what is still to do, decisions made, and current instructions), and a log of completed steps where that is useful. These are written to durable storage as the work proceeds. Resuming then means starting a new session and reading the artifacts. Anthropic&#x27;s engineering guidance on long-running agents describes this method: each new session begins by reading progress files and recent history to understand the current state, and leaves clear artifacts for the next session.</p><p>Session persistence is still useful for short interruptions on the same model. Artifacts add independence from the process, the context window, and the model version. See Effective harnesses for long-running agents and Memory tool.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 69. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: Arbor Genomics runs a literature-review agent for its scientists. A scientist gives the agent a research question, and the agent then works for 6 to 10 hours: it searches publication databases, reads papers, and maintains a growing evidence table. A run usually makes more than 2,000 tool calls. The agent uses the Messages API with a long system prompt and prompt caching, on a model that supports mid-conversation system messages. Scientists sometimes send new instructions while a run is in progress.\n\nQuestion: Cost data for 50 runs shows that 80% of input tokens are paper text that the lead agent reads once, uses to extract a few findings, and then carries in its context for the following turns. The reading of each paper is independent of the reading of the others. Run time is dominated by reading papers one after another. The team is deciding whether to change the architecture. Which change does this data support?","type":"multiple-choice","options":[{"text":"Convert the system into a fixed pipeline with a predefined list of search queries and a set number of papers to read for each question.","explanation":"A fixed pipeline suits tasks whose steps are known in advance. Literature review is open-ended: the papers to read next depend on what earlier papers show. A predefined list would miss the lines of evidence that only appear during the work.","correct":false},{"text":"Delegate the reading of papers to parallel subagents that return structured findings to a single lead agent.","explanation":"The data shows work that is independent, uses many tokens, and produces small results. That is the profile for delegation to subagents. Each subagent reads a paper in its own context and returns only the findings, so the lead agent's context stays small. Parallel reading also reduces run time.","correct":true},{"text":"Keep the single agent, and move it to a model with a larger context window so that more paper text fits.","explanation":"A larger window allows more text but does not change the pattern in the data. The agent would still carry large texts that it used once, at a high cost for each turn, and would still read papers one at a time.","correct":false},{"text":"Replace the lead agent with a group of equal agents that message each other freely and have no coordinator.","explanation":"Coordination between equal agents adds message overhead and makes it unclear which agent owns the evidence table. The data shows a simpler need: reading work that can be delegated and whose results return to one owner.","correct":false}],"answer":"<p>Correct answer: <strong>Delegate the reading of papers to parallel subagents that return structured findings to a single lead agent.</strong></p><p>A decision to change a running system from a single agent to a multi-agent design should rest on production data, because multi-agent systems use more tokens in total and are harder to operate. Anthropic&#x27;s description of its own research system gives the conditions under which the pattern is worth its cost: the work can be done in parallel, the information is larger than one context window, and the value of the task justifies the additional tokens.</p><p>The data for this agent meets those conditions. Reading papers is independent work, so it can be parallel. It is token-heavy with a small result: thousands of tokens are read to extract a few findings. A subagent that reads a paper in its own context window and returns a structured extract acts as a compression step, and the lead agent receives the findings without the full text. The lead agent keeps the roles that need a single owner: deciding what to read next and maintaining the evidence table.</p><p>The other options do not match the data. A fixed pipeline removes the adaptive search that research needs. A larger window keeps the wasteful pattern. A group of agents with no coordinator makes ownership unclear. See How we built our multi-agent research system and Building effective agents.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 70. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"}];

    const CURRENT_KEY = "devPro04ExamCurrentV1";
    const HISTORY_KEY = "devPro04ExamHistoryV1";
    const EXAM_NAME = "Claude Developer Professional Practice Exam 04";

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function isCorrect(question) {
      return question.options.every(option => Boolean(option.selected) === Boolean(option.correct));
    }

    function correctCount(question) {
      return question.options.filter(option => option.correct).length;
    }

    function formatDuration(ms) {
      if (!Number.isFinite(ms) || ms < 0) return "0:00";
      const total = Math.floor(ms / 1000);
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    class ExamQuestion extends HTMLElement {
      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { question, index, total, graded, cheating } = this._state;
        const reveal = graded || cheating;
        const choose = correctCount(question);

        this.innerHTML = `
          <section class="card" aria-labelledby="question-title">
            <div class="card-header">
              <span>Question ${index + 1} of ${total}</span>
              <span>${question.viewed ? "Viewed" : "New"}</span>
            </div>
            <div class="card-body">
              <p class="query" id="question-title"></p>
              <p class="choose-note">Choose ${choose}</p>
              <div class="options"></div>
              ${reveal ? `<div class="answer-panel"><strong>Answer</strong><div class="answer-html"></div><div class="tip-html"></div><p class="reference-note"></p></div>` : ""}
            </div>
          </section>
        `;

        const queryEl = this.querySelector(".query");
        const separator = "\n\nQuestion: ";
        const splitAt = question.query.indexOf(separator);
        if (splitAt >= 0 && question.query.startsWith("Scenario: ")) {
          const scenario = document.createElement("span");
          scenario.className = "scenario-text";
          scenario.textContent = question.query.slice(0, splitAt);
          const questionText = document.createElement("span");
          questionText.className = "question-text";
          questionText.textContent = question.query.slice(splitAt + separator.length);
          queryEl.append(scenario, questionText);
        } else {
          queryEl.textContent = question.query;
        }
        const options = this.querySelector(".options");

        question.options.forEach((option, optionIndex) => {
          const label = document.createElement("label");
          label.className = "option";
          if (reveal && option.correct) label.classList.add("reveal-correct");
          if (reveal && option.selected && !option.correct) label.classList.add("reveal-wrong-selected");

          const input = document.createElement("input");
          input.type = choose === 1 ? "radio" : "checkbox";
          if (choose === 1) input.name = `question-${index}`;
          input.checked = Boolean(option.selected);
          input.disabled = Boolean(graded);
          input.addEventListener("change", () => {
            this.dispatchEvent(new CustomEvent("option-toggle", {
              bubbles: true,
              detail: { optionIndex }
            }));
          });

          const textWrap = document.createElement("span");
          const text = document.createElement("span");
          text.textContent = option.text;
          textWrap.appendChild(text);

          if (reveal && option.explanation) {
            const explanation = document.createElement("small");
            explanation.textContent = option.explanation;
            textWrap.appendChild(explanation);
          }

          label.append(input, textWrap);
          options.appendChild(label);
        });

        const answer = this.querySelector(".answer-html");
        if (answer) answer.innerHTML = question.answer || "";
        const tip = this.querySelector(".tip-html");
        if (tip) tip.innerHTML = question.tip || "";
        const reference = this.querySelector(".reference-note");
        if (reference) reference.textContent = question.reference || "";
      }
    }
    customElements.define("exam-question", ExamQuestion);

    class QuestionJumper extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { questions, current, graded, cheating } = this._state;
        const reveal = graded || cheating;

        this.innerHTML = `
          <section class="card">
            <div class="card-header collapsible-title" role="button" tabindex="0">
              <span>Question Jumper</span>
              <span class="chevron">${this.collapsed ? "▼" : "▲"}</span>
            </div>
            <div class="card-body jumper-body" ${this.collapsed ? 'hidden' : ''}>
              <div class="jumper-grid"></div>
            </div>
          </section>
        `;

        const title = this.querySelector(".collapsible-title");
        const toggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        title.addEventListener("click", toggle);
        title.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });

        const grid = this.querySelector(".jumper-grid");
        questions.forEach((question, index) => {
          const button = document.createElement("button");
          button.className = "jump-btn";
          button.textContent = String(index + 1);
          button.title = question.query;

          if (question.viewed) button.classList.add("viewed");
          if (index === current) button.classList.add("current");

          if (reveal) {
            button.classList.remove("viewed", "current");
            button.classList.add(isCorrect(question) ? "correct" : "incorrect");
            if (index === current) button.style.outline = "3px solid #111827";
          }

          button.addEventListener("click", () => {
            this.dispatchEvent(new CustomEvent("jump", {
              bubbles: true,
              detail: { index }
            }));
          });
          grid.appendChild(button);
        });
      }
    }
    customElements.define("question-jumper", QuestionJumper);

    class ExamHistoryPanel extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        const history = this._state?.history || { exams: [] };
        const exams = Array.isArray(history.exams) ? history.exams : [];

        this.innerHTML = `
          <section class="card">
            <div class="card-header">
              <span class="collapsible-title" role="button" tabindex="0">Exam History</span>
              <div class="control-group">
                <button class="btn-secondary toggle-history">${this.collapsed ? "Show" : "Hide"}</button>
                <button class="btn-danger clear-history" ${exams.length ? "" : "disabled"}>Clear History</button>
              </div>
            </div>
            <div class="card-body history-body" ${this.collapsed ? "hidden" : ""}></div>
          </section>
        `;

        const doToggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        this.querySelector(".toggle-history").addEventListener("click", doToggle);
        this.querySelector(".collapsible-title").addEventListener("click", doToggle);
        this.querySelector(".clear-history").addEventListener("click", () => {
          this.dispatchEvent(new CustomEvent("history-clear", { bubbles: true }));
        });

        const body = this.querySelector(".history-body");
        if (!exams.length) {
          body.innerHTML = `<p class="history-empty">No completed exams are stored on this device.</p>`;
          return;
        }

        [...exams].reverse().forEach((exam, reverseIndex) => {
          const questions = Array.isArray(exam.questions) ? exam.questions : [];
          const score = questions.filter(isCorrect).length;
          const number = exams.length - reverseIndex;
          const finish = Number(exam.finish || exam.completedAt || 0);
          const start = Number(exam.start || 0);
          const stamp = finish ? new Date(finish).toLocaleString() : "Completed exam";
          const duration = finish && start ? formatDuration(finish - start) : "";

          const wrap = document.createElement("div");
          wrap.className = "history-exam";

          const summary = document.createElement("div");
          summary.className = "history-summary";
          summary.innerHTML = `<strong>Attempt ${number}: ${score} / ${questions.length}</strong><span>${stamp}${duration ? ` · ${duration}` : ""}</span>`;
          wrap.appendChild(summary);

          const dots = document.createElement("div");
          dots.className = "history-dots";
          questions.forEach((question, i) => {
            const dot = document.createElement("span");
            dot.className = "history-dot" + (isCorrect(question) ? " correct" : "");
            dot.textContent = String(i + 1);
            dot.title = question.query;
            dots.appendChild(dot);
          });
          wrap.appendChild(dots);
          body.appendChild(wrap);
        });
      }
    }
    customElements.define("exam-history-panel", ExamHistoryPanel);

    class ClaudeExamApp extends HTMLElement {
      constructor() {
        super();
        this.state = null;
        this.timerHandle = null;
      }

      connectedCallback() {
        this.load();
        this.addEventListener("option-toggle", e => this.toggleOption(e.detail.optionIndex));
        this.addEventListener("jump", e => this.setCurrentQuestion(e.detail.index));
        this.addEventListener("history-clear", () => this.clearHistory());
        this.render();
        this.timerHandle = setInterval(() => this.updateTimer(), 1000);
      }

      disconnectedCallback() {
        clearInterval(this.timerHandle);
      }

      load() {
        let saved = null;
        try {
          saved = JSON.parse(localStorage.getItem(CURRENT_KEY));
        } catch (_) {}

        if (saved && Array.isArray(saved.questions) && saved.questions.length === QUESTION_BANK.length && !saved.graded) {
          this.state = saved;
        } else {
          const questions = clone(QUESTION_BANK).map(q => ({
            ...q,
            viewed: false,
            options: q.options.map(o => ({ ...o, selected: false }))
          }));
          questions[0].viewed = true;
          this.state = {
            name: EXAM_NAME,
            graded: false,
            start: Date.now(),
            finish: 0,
            questions,
            currentQuestionNumber: 0,
            cheating: new URLSearchParams(location.search).get("page") === "answer"
          };
          this.saveCurrent();
        }
      }

      saveCurrent() {
        if (!this.state.graded) {
          localStorage.setItem(CURRENT_KEY, JSON.stringify(this.state));
        }
      }

      getHistory() {
        try {
          const existing = JSON.parse(localStorage.getItem(HISTORY_KEY));
          if (existing && Array.isArray(existing.exams)) return existing;
        } catch (_) {}
        const history = { name: "Exam History", exams: [] };
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        return history;
      }

      clearHistory() {
        localStorage.setItem(HISTORY_KEY, JSON.stringify({ name: "Exam History", exams: [] }));
        this.render();
      }

      toggleOption(optionIndex) {
        if (this.state.graded) return;
        const q = this.state.questions[this.state.currentQuestionNumber];
        if (correctCount(q) === 1) {
          q.options.forEach((option, i) => { option.selected = i === optionIndex; });
        } else {
          q.options[optionIndex].selected = !q.options[optionIndex].selected;
        }
        q.viewed = true;
        this.saveCurrent();
        this.render();
      }

      setCurrentQuestion(index) {
        const next = Math.max(0, Math.min(index, this.state.questions.length - 1));
        this.state.currentQuestionNumber = next;
        this.state.questions[next].viewed = true;
        this.saveCurrent();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      toggleCheat() {
        this.state.cheating = !this.state.cheating;
        this.saveCurrent();
        this.render();
      }

      grade() {
        if (this.state.graded) return;
        this.state.graded = true;
        this.state.cheating = true;
        this.state.finish = Date.now();

        const history = this.getHistory();
        history.exams.push(clone(this.state));
        history.exams = history.exams.slice(-15);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        localStorage.removeItem(CURRENT_KEY);
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      restart() {
        localStorage.removeItem(CURRENT_KEY);
        this.load();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      score() {
        return this.state.questions.filter(isCorrect).length;
      }

      answeredCount() {
        return this.state.questions.filter(q => q.options.some(o => o.selected)).length;
      }

      updateTimer() {
        const el = this.querySelector("[data-timer]");
        if (!el || !this.state) return;
        const end = this.state.finish || Date.now();
        el.textContent = formatDuration(end - this.state.start);
      }

      render() {
        if (!this.state) return;
        const qIndex = this.state.currentQuestionNumber;
        const total = this.state.questions.length;
        const answered = this.answeredCount();
        const score = this.score();

        this.innerHTML = `
          <main class="page-shell">
            <header class="hero">
              <div class="hero-top">
                <div>
                  <h1>Claude Developer Professional Practice Exam 04</h1>
                  <p>70 questions · Developer Professional · standalone and offline</p>
                </div>
                <div class="pill">Elapsed <span data-timer>${formatDuration((this.state.finish || Date.now()) - this.state.start)}</span></div>
              </div>
              <div class="meta-row">
                <span class="pill">${total} questions</span>
                <span class="pill">${answered} answered</span>
                <span class="pill">${this.state.questions.filter(q => q.viewed).length} viewed</span>
                ${this.state.graded ? `<span class="pill">Score ${score} / ${total}</span>` : ""}
              </div>
            </header>

            ${this.state.graded ? `
              <section class="card results">
                <div class="card-body">
                  <strong>Your grade is ${score} out of ${total}.</strong>
                  <div class="status-line">Correct answers and option explanations are now visible. Your completed attempt has been saved to local storage.</div>
                </div>
              </section>
            ` : ""}

            <exam-question></exam-question>

            <div class="controls">
              <div class="control-group">
                <button class="btn-secondary previous" ${qIndex === 0 ? "disabled" : ""}>Back</button>
                <button class="btn-primary next" ${qIndex === total - 1 ? "disabled" : ""}>Next</button>
              </div>
              <div class="control-group">
                <button class="btn-warning cheat">${this.state.cheating ? "Be Honest" : "Cheat"}</button>
                ${this.state.graded
                  ? `<button class="btn-primary restart">Start New Attempt</button>`
                  : `<button class="btn-primary finish">Finish</button>`}
              </div>
            </div>

            <question-jumper></question-jumper>
            <exam-history-panel></exam-history-panel>

            <p class="footer-note">Progress and completed attempts are stored only in this browser. Question source: supplied CCDV-P practice exam text, 70 questions.</p>
          </main>
        `;

        const questionEl = this.querySelector("exam-question");
        questionEl.state = {
          question: this.state.questions[qIndex],
          index: qIndex,
          total,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const jumper = this.querySelector("question-jumper");
        jumper.state = {
          questions: this.state.questions,
          current: qIndex,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const history = this.querySelector("exam-history-panel");
        history.state = { history: this.getHistory() };

        this.querySelector(".previous").addEventListener("click", () => this.setCurrentQuestion(qIndex - 1));
        this.querySelector(".next").addEventListener("click", () => this.setCurrentQuestion(qIndex + 1));
        this.querySelector(".cheat").addEventListener("click", () => this.toggleCheat());

        const finish = this.querySelector(".finish");
        if (finish) finish.addEventListener("click", () => this.grade());

        const restart = this.querySelector(".restart");
        if (restart) restart.addEventListener("click", () => this.restart());
      }
    }
    customElements.define("claude-exam-app", ClaudeExamApp);
  </script>
</body>
</html>
