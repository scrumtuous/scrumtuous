<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Developer Professional | Practice Exam 04</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #d9e0e8;
      --primary: #a65435;
      --primary-dark: #804027;
      --secondary: #667085;
      --success: #16803c;
      --success-bg: #eaf8ef;
      --danger: #b42318;
      --danger-bg: #fff0ee;
      --warning: #9a6700;
      --warning-bg: #fff7d6;
      --shadow: 0 10px 28px rgba(23, 32, 51, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      border-radius: 9px;
      padding: .62rem .92rem;
      cursor: pointer;
      font-weight: 650;
      transition: transform .08s ease, background .15s ease, opacity .15s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-secondary { background: #e8edf3; color: var(--text); }
    .btn-warning { background: #ffd96a; color: #4b3500; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }

    .page-shell {
      width: min(1040px, calc(100% - 28px));
      margin: 28px auto 60px;
    }

    .hero {
      background: linear-gradient(135deg, #222236, #6b4039);
      color: white;
      border-radius: 18px;
      padding: 24px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero-top {
      display: flex;
      gap: 18px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .hero h1 { margin: 0 0 6px; font-size: clamp(1.55rem, 3.1vw, 2rem); }
    .hero p { margin: 0; opacity: .88; }
    .meta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .pill {
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.1);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: .9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-top: 16px;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 18px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-weight: 750;
    }

    .card-body { padding: 18px; }

    .results {
      border-left: 5px solid var(--primary);
    }
    .results strong { font-size: 1.1rem; }

    .query {
      white-space: pre-line;
      font-size: 1.08rem;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .query .scenario-text {
      display: block;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      background: #f5f7fa;
      color: #3e4b60;
      font-size: .96rem;
      font-weight: 450;
      line-height: 1.6;
    }

    .query .question-text { display: block; font-weight: 700; }

    .choose-note {
      color: var(--muted);
      font-size: .9rem;
      margin: 0 0 16px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 11px 12px;
      margin: 8px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
    }

    .option input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--primary);
      flex: 0 0 auto;
    }

    .option.reveal-correct {
      border-color: #75c991;
      background: var(--success-bg);
    }

    .option.reveal-wrong-selected {
      border-color: #e9a7a0;
      background: var(--danger-bg);
    }

    .option small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .answer-panel {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--warning-bg);
      border: 1px solid #f0d783;
    }

    .answer-panel p:first-child { margin-top: 0; }
    .answer-panel ul { margin-bottom: 0; }
    .answer-panel .tip-html { margin-top: 12px; }
    .answer-panel .reference-note { margin: 14px 0 0; color: var(--muted); font-size: .84rem; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .control-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .collapsible-title { cursor: pointer; user-select: none; }
    .chevron { font-size: .9rem; color: var(--muted); }

    .jumper-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .jump-btn {
      min-width: 38px;
      padding: 7px 9px;
      background: #eef2f6;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .jump-btn.viewed { background: #d7dee7; }
    .jump-btn.current { background: var(--primary); color: white; border-color: var(--primary); }
    .jump-btn.correct { background: var(--success); color: white; border-color: var(--success); }
    .jump-btn.incorrect { background: var(--danger); color: white; border-color: var(--danger); }

    .history-empty { color: var(--muted); margin: 0; }
    .history-exam {
      border-top: 1px solid var(--line);
      padding: 14px 0;
    }
    .history-exam:first-child { border-top: 0; padding-top: 0; }
    .history-summary {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }
    .history-dots { display: flex; flex-wrap: wrap; gap: 5px; }
    .history-dot {
      width: 26px; height: 26px; border-radius: 7px;
      display: grid; place-items: center;
      font-size: .76rem; color: white;
      background: var(--danger);
    }
    .history-dot.correct { background: var(--success); }

    .status-line {
      color: var(--muted);
      font-size: .92rem;
      margin-top: 10px;
    }

    .footer-note {
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
      margin-top: 22px;
    }

    @media (max-width: 640px) {
      .page-shell { width: min(100% - 16px, 1040px); margin-top: 8px; }
      .hero { border-radius: 12px; padding: 19px 17px; }
      .card-body { padding: 14px; }
      .card-header { padding: 12px 14px; }
      .controls { align-items: stretch; }
      .control-group { width: 100%; }
      .control-group button { flex: 1; }
    }
  </style>
</head>

  <script>
    const QUESTION_BANK = [{"query":"Scenario: Meridian Health Partners runs a claims-review copilot for its 400 claims adjusters. A supervisor agent built on the Claude Agent SDK receives each claim and delegates to three worker subagents: one reads the member's policy documents, one checks the medical coding, and one drafts the decision letter. The system handles protected health information, so Meridian has a zero data retention (ZDR) arrangement with Anthropic. A compliance rule states that no payment above $5,000 may be approved without a human adjuster. A typical claim takes 40 to 90 agent turns.\n\nQuestion: The supervisor currently runs the three workers one after another, and median claim time is 11 minutes against a target of 6. Traces show the policy worker and the coding worker never use each other's output, while the drafting worker needs the results of both. The team also wants a failure in one worker to stay contained so that it does not corrupt the others. Which orchestration change best meets the target?","type":"multiple-choice","options":[{"text":"Dispatch the policy and coding workers in parallel, then pass both structured results to the drafting worker.","explanation":"The policy and coding tasks are independent, so they can run at the same time, each in its own isolated context. The drafting task depends on both, so it must run after them. This design shortens the claim time and keeps failures inside one worker.","correct":true},{"text":"Dispatch all three workers in parallel and let them coordinate through a shared scratch file that each worker reads and updates while it works.","explanation":"The drafting worker depends on the other two results, so it cannot start at the same time. A shared file that all workers write to also removes the isolation between them, and one worker's bad output can corrupt the others.","correct":false},{"text":"Replace the workers with one agent that performs all three tasks in a single long conversation with a larger context window.","explanation":"One long conversation performs the tasks in sequence, so it does not reduce the claim time. It also mixes policy text, coding detail, and drafting in one context, which removes failure containment and makes the context grow faster.","correct":false},{"text":"Keep the sequence but lower the effort level on every worker so that each step finishes sooner.","explanation":"Lower effort can shorten each step, but it also reduces quality on tasks like medical coding checks. The main delay is that two independent tasks wait for each other, and this option does not change that.","correct":false}],"answer":"<p>Correct answer: <strong>Dispatch the policy and coding workers in parallel, then pass both structured results to the drafting worker.</strong></p><p>The first design question for a supervisor/worker system is which tasks depend on each other. Tasks with no dependency can be sent out in parallel (parallel subagent dispatch). Tasks that need earlier results must wait. In this scenario the traces show that policy reading and coding checks are independent, and that drafting needs both. The correct shape is therefore a parallel step followed by a sequential step.</p><p>Each subagent works in its own context window and returns only its final result to the supervisor. This context isolation has two benefits. The long tool output of one worker does not fill the context of another, and a failure stays inside the worker where it happened. A shared scratch file removes that boundary. A single large agent removes it completely and does not make the work faster. Lowering effort is a real tuning control, but it trades quality for speed and does not fix the structure of the workflow.</p><p>See Subagents in the SDK for parallel dispatch and context isolation, and Building effective agents for the parallelization and orchestrator-workers patterns.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 1. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: Meridian Health Partners runs a claims-review copilot for its 400 claims adjusters. A supervisor agent built on the Claude Agent SDK receives each claim and delegates to three worker subagents: one reads the member's policy documents, one checks the medical coding, and one drafts the decision letter. The system handles protected health information, so Meridian has a zero data retention (ZDR) arrangement with Anthropic. A compliance rule states that no payment above $5,000 may be approved without a human adjuster. A typical claim takes 40 to 90 agent turns.\n\nQuestion: An audit finds two claims where the supervisor called the approve_payment tool for amounts above $5,000 without an adjuster. The system prompt already says, in capital letters, that such payments need human approval. The compliance officer asks for a control that will hold on every claim, including claims where the model reasons incorrectly or reads misleading text in an attached document. Which control should the team add?","type":"multiple-choice","options":[{"text":"Move the approval rule to the top of the system prompt and repeat it in the description of the approve_payment tool so that the model sees it twice.","explanation":"Instructions in a prompt or a tool description are guidance that the model usually follows, but compliance is probabilistic (likely, not guaranteed). The audit already shows that a strongly worded prompt rule was not followed on two claims.","correct":false},{"text":"Add a second model call that reviews each approve_payment request and blocks any request that it judges to be above the limit.","explanation":"A reviewing model adds another probabilistic check. It can also make mistakes or be misled by the same document text. A numeric limit can be checked exactly in code, so a model is the wrong tool for this rule.","correct":false},{"text":"Run a nightly report that lists every payment above $5,000 made without an adjuster so that the compliance team can reverse it.","explanation":"A report finds the problem after the payment has been made. It is a useful detection control, but it does not prevent the action, and the compliance officer asked for a control that holds on every claim.","correct":false},{"text":"Add a PreToolUse hook on approve_payment that checks the amount in code and pauses for adjuster approval above $5,000.","explanation":"A hook runs in the harness, outside the model, before the tool call executes. The check on the amount is ordinary code, so it gives the same result on every claim, whatever the model reasoned or read. This is deterministic enforcement for an action that cannot be undone.","correct":true}],"answer":"<p>Correct answer: <strong>Add a PreToolUse hook on approve_payment that checks the amount in code and pauses for adjuster approval above $5,000.</strong></p><p>Rules with financial or compliance consequences need deterministic enforcement: a check in code that gives the same answer every time. A system prompt is context for the model, not an enforced configuration. Stronger wording raises the chance of compliance but never reaches a guarantee, and a model can also be misled by instructions hidden in a document that it reads.</p><p>In the Claude Agent SDK, a PreToolUse hook runs after the model has built the tool call and before the call executes. The hook can read the tool input (in this case the payment amount) and return a decision to allow, deny, or ask for approval. Because the hook is outside the model, no reasoning error or injected text can skip it. This is the approval gate pattern for irreversible actions: the agent prepares the action, and a human decides.</p><p>A second model as reviewer is still probabilistic, and a nightly report only detects. Both can be useful extra layers, but neither one is the control that prevents the payment. See Agent SDK hooks and Agent SDK permissions.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 2. Domain: Runtime Guardrails and Production Security.","answerStatus":"source"},{"query":"Scenario: Meridian Health Partners runs a claims-review copilot for its 400 claims adjusters. A supervisor agent built on the Claude Agent SDK receives each claim and delegates to three worker subagents: one reads the member's policy documents, one checks the medical coding, and one drafts the decision letter. The system handles protected health information, so Meridian has a zero data retention (ZDR) arrangement with Anthropic. A compliance rule states that no payment above $5,000 may be approved without a human adjuster. A typical claim takes 40 to 90 agent turns.\n\nQuestion: By turn 60 of a long claim, the supervisor's context holds the full transcripts returned by each worker, including every policy page the policy worker opened. Input cost per claim has tripled, and on the longest claims the supervisor forgets the original claim details. The drafting worker needs only the relevant clause numbers, the coding verdict, and short supporting quotes. Which change best addresses both the cost and the quality problem?","type":"multiple-choice","options":[{"text":"Move the supervisor to a model with a larger context window so that the full worker transcripts always fit.","explanation":"A larger window delays the limit but does not remove the unneeded content. The cost per claim stays high, and long inputs still make it harder for the model to keep attention on the original claim details.","correct":false},{"text":"Have each worker return a short structured result with clause numbers, verdicts, and quotes, and keep the raw pages in the worker's context.","explanation":"The supervisor only needs conclusions and the evidence for them. When each worker returns a compact, structured result, the raw pages stay in the worker's own context and never enter the supervisor's. This reduces cost and keeps the supervisor's context focused on the claim.","correct":true},{"text":"Have the harness delete the oldest messages from the supervisor's history whenever input tokens pass a fixed threshold.","explanation":"Deleting the oldest messages removes content by age, not by value. The oldest messages contain the original claim, and losing them is the quality problem the team already sees.","correct":false},{"text":"Raise the supervisor's max_tokens setting so that it has more room to restate the claim details in each turn.","explanation":"The max_tokens setting limits the length of the model's output. It does not reduce the input that has built up in the context, and restating details every turn would add even more tokens to the conversation.","correct":false}],"answer":"<p>Correct answer: <strong>Have each worker return a short structured result with clause numbers, verdicts, and quotes, and keep the raw pages in the worker&#x27;s context.</strong></p><p>Subagents are useful because of delegation boundaries. A worker can read many pages in its own context window and then return only a condensed result. If the worker returns its full transcript, that benefit is lost: all of the raw material moves into the supervisor&#x27;s context, where it increases cost on every later turn and pushes important details (such as the original claim) further away.</p><p>The fix is to define what crosses the boundary. A structured result with fixed fields (for example clause number, verdict, supporting quote, source document) gives the supervisor and the next worker what they need and nothing more. Anthropic&#x27;s guidance on context engineering describes the same idea: find the smallest set of high-signal tokens that lets the model do the task.</p><p>A larger context window and a deletion rule based on age both treat the symptom. The first keeps paying for unneeded tokens, and the second removes the wrong content. The max_tokens parameter controls output length and is not related to this problem. See Effective context engineering for AI agents and Subagents in the SDK.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 3. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: Meridian Health Partners runs a claims-review copilot for its 400 claims adjusters. A supervisor agent built on the Claude Agent SDK receives each claim and delegates to three worker subagents: one reads the member's policy documents, one checks the medical coding, and one drafts the decision letter. The system handles protected health information, so Meridian has a zero data retention (ZDR) arrangement with Anthropic. A compliance rule states that no payment above $5,000 may be approved without a human adjuster. A typical claim takes 40 to 90 agent turns.\n\nQuestion: During a routine deployment, the service that hosts the supervisor restarts while 30 claims are in progress. After the restart, each claim starts again from turn 1. Members later complain that they received two decision letters, because the send_letter tool had already run before the restart. The team wants an interrupted claim to continue from where it stopped and wants no duplicate letters. Which two changes meet these goals? (Select TWO.)","type":"multiple-choice","options":[{"text":"Add a system prompt instruction that tells the supervisor never to send a letter for a claim that it has processed before.","explanation":"This is incorrect. After a restart from turn 1, the supervisor has no record that it processed the claim before, so it cannot follow the instruction. The missing piece is stored state, not wording.","correct":false},{"text":"Save the session ID and a checkpoint of completed stages to durable storage, and resume the session from it after a restart.","explanation":"This is correct. If the session and the list of completed stages are stored outside the process, a restarted service can resume the same conversation and skip work that is already done, instead of starting from turn 1.","correct":true},{"text":"Increase the number of service replicas so that fewer claims are affected when any single replica restarts.","explanation":"This is incorrect. More replicas reduce how many claims one restart touches, but every affected claim still starts again and can still send a duplicate letter. The durability problem is unchanged.","correct":false},{"text":"Give send_letter an idempotency key built from the claim ID so that a repeated call does not send a second letter.","explanation":"This is correct. A resumed agent may repeat a step that ran just before the interruption. An idempotent tool (a tool that has the same effect when called twice with the same key) makes that repeat safe, so no second letter is sent.","correct":true},{"text":"Keep the conversation history in process memory and write it to disk only when the claim is complete.","explanation":"This is incorrect. State that is written only at the end is lost when the process stops in the middle of a claim. That is the failure the team has now, so this option does not change anything.","correct":false}],"answer":"<p>Correct answers: <strong>Save the session ID and a checkpoint of completed stages to durable storage, and resume the session from it after a restart.; Give send_letter an idempotency key built from the claim ID so that a repeated call does not send a second letter.</strong></p><p>A long-running agent must be designed for interruption. Deployments, crashes, and timeouts will stop the process at some point, so the state of the work has to exist outside the process. Two things are needed, and they solve different parts of the problem.</p><p>Session persistence and checkpointing let the agent continue. The Claude Agent SDK stores each session&#x27;s conversation, and a session can be resumed by its ID. If the harness also records which stages are complete (a checkpoint), the resumed agent knows where to continue. Note that a session stores the conversation, not the effects of tools in the outside world.</p><p>Idempotent side effects make continuing safe. A checkpoint can never be perfectly in step with the outside world: the letter may be sent a moment before the checkpoint is written. If send_letter accepts an idempotency key, a repeated call is harmless. A prompt instruction cannot replace stored state, more replicas only reduce the number of affected claims, and state held in memory until the end is the current failing design.</p><p>See Work with sessions, Persist sessions to external storage, and Effective harnesses for long-running agents.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 4. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: Meridian Health Partners runs a claims-review copilot for its 400 claims adjusters. A supervisor agent built on the Claude Agent SDK receives each claim and delegates to three worker subagents: one reads the member's policy documents, one checks the medical coding, and one drafts the decision letter. The system handles protected health information, so Meridian has a zero data retention (ZDR) arrangement with Anthropic. A compliance rule states that no payment above $5,000 may be approved without a human adjuster. A typical claim takes 40 to 90 agent turns.\n\nQuestion: In 3% of claims the coding worker's lookup service times out and the worker returns the plain text \"Unable to complete.\" The supervisor treats this text as a normal result, tells the drafting worker that there are no coding issues, and a letter goes out. The team wants the system to handle a worker failure correctly without stopping the claims that have no problem. What should the team change?","type":"multiple-choice","options":[{"text":"Tell the supervisor in its system prompt to read each worker result carefully and to look for words that suggest a failure.","explanation":"Looking for failure words in free text is unreliable. The supervisor has already shown that it reads \"Unable to complete\" as a normal result, and a prompt instruction does not make that reading dependable.","correct":false},{"text":"Have the coding worker return an empty list of coding issues when its lookup service times out so that the claim can continue.","explanation":"An empty list means \"checked, and found no issues.\" Returning it after a timeout hides the failure and produces the same wrong letter that the team is trying to prevent.","correct":false},{"text":"Have workers return a structured status, and have the supervisor retry or escalate on a failure.","explanation":"A structured status field makes the difference between \"done\" and \"failed\" explicit. The supervisor is the place to handle a worker failure: it can retry a timeout, or send the claim to an adjuster, and it never treats a failure as a clean result.","correct":true},{"text":"Stop every in-progress claim whenever any worker reports a timeout, and restart all of them when the service recovers.","explanation":"One failed lookup affects one claim. Stopping every claim spreads the failure across the whole system and breaks the requirement that claims without a problem continue.","correct":false}],"answer":"<p>Correct answer: <strong>Have workers return a structured status, and have the supervisor retry or escalate on a failure.</strong></p><p>In a supervisor/worker (hub-and-spoke) design, every result returns to the supervisor. The supervisor is therefore the right place, and the only place, to decide what happens after a worker fails. To make that decision, it needs a clear signal. Free text such as &quot;Unable to complete&quot; is not a clear signal, because the model must guess whether it is a finding or a failure.</p><p>The reliable pattern is a structured result contract. Each worker returns a status (for example success, failed, or partial), an error category such as a timeout, and whether a retry is useful. The supervisor then applies a simple policy: retry temporary failures a limited number of times, and escalate to a human when the retry does not help. This keeps one failure from becoming a wrong letter, and it also keeps the failure contained to the one claim.</p><p>Returning an empty list is silent failure: it turns &quot;unknown&quot; into &quot;no issues.&quot; Stopping all claims does the opposite and makes a small failure large. See Subagents in the SDK and Handle tool calls for error signaling in results.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 5. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: Meridian Health Partners runs a claims-review copilot for its 400 claims adjusters. A supervisor agent built on the Claude Agent SDK receives each claim and delegates to three worker subagents: one reads the member's policy documents, one checks the medical coding, and one drafts the decision letter. The system handles protected health information, so Meridian has a zero data retention (ZDR) arrangement with Anthropic. A compliance rule states that no payment above $5,000 may be approved without a human adjuster. A typical claim takes 40 to 90 agent turns.\n\nQuestion: The coding worker reads clinical notes. On a small number of claims that describe overdoses or serious injuries, the API returns an HTTP 200 response with stop_reason \"refusal\" and no content. The harness treats the empty content as a temporary fault and sends the same request to the same model five times, and then the claim fails with a generic error. Adjusters only find out when members call. How should the team handle these responses?","type":"multiple-choice","options":[{"text":"Increase the retry count from five to ten and add exponential backoff so that the request has more chances to succeed.","explanation":"Backoff helps with rate limits and overload, where waiting changes the result. A refusal does not depend on timing, so more retries on the same model only add cost and delay before the same failure.","correct":false},{"text":"Detect refusals by checking whether the content array is empty, and then ask the model to try again with a shorter prompt.","explanation":"Empty content is an indirect sign and can have other causes. The API gives an explicit signal in the stop reason, and the harness should branch on that. A shorter prompt also does not address why the request was declined.","correct":false},{"text":"Branch on the refusal stop reason, and route the claim to a fallback model or an adjuster queue.","explanation":"A refusal is a separate class of result, not a temporary fault. Repeating the same request on the same model usually gives the same refusal. A dedicated path that uses a fallback model or a human handles the claim.","correct":true},{"text":"Remove the clinical notes from the request for these claims so that the worker checks the codes without reading the notes.","explanation":"The worker needs the notes to check the coding. Removing them might avoid the refusal, but the worker would then approve codes without evidence, which is a quality and compliance risk.","correct":false}],"answer":"<p>Correct answer: <strong>Branch on the refusal stop reason, and route the claim to a fallback model or an adjuster queue.</strong></p><p>A refusal is returned as a successful HTTP response with stop_reason: &quot;refusal&quot;. It is not an error status, so error-rate dashboards do not show it, and it is not a temporary condition, so a retry on the same model usually refuses again. The harness in this scenario makes two mistakes: it guesses the condition from empty content, and it uses the retry path that was built for a different failure class.</p><p>Anthropic&#x27;s guidance is to branch on the stop reason and to handle a refusal with a fallback: retry on a different model that is configured for this purpose, or route the work to a person. It also recommends monitoring refusals separately, with one event per refusal and one per response served by a fallback, because they are invisible in normal error metrics. In a healthcare workflow, a human queue is a natural safety fallback for the small number of claims that no model path handles.</p><p>Removing the clinical notes would hide the symptom and damage the quality of the check. See Refusals and fallback and Stop reasons and fallback.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 6. Domain: Runtime Guardrails and Production Security.","answerStatus":"source"},{"query":"Scenario: Meridian Health Partners runs a claims-review copilot for its 400 claims adjusters. A supervisor agent built on the Claude Agent SDK receives each claim and delegates to three worker subagents: one reads the member's policy documents, one checks the medical coding, and one drafts the decision letter. The system handles protected health information, so Meridian has a zero data retention (ZDR) arrangement with Anthropic. A compliance rule states that no payment above $5,000 may be approved without a human adjuster. A typical claim takes 40 to 90 agent turns.\n\nQuestion: Engineers cannot explain why some claims take 90 turns. They want traces for every claim. The privacy office reminds them that claim content is protected health information, that the observability vendor is not approved to store it, and that under the ZDR arrangement Anthropic does not keep prompts or responses that could be requested later. Which instrumentation approach gives the engineers what they need within these limits?","type":"multiple-choice","options":[{"text":"Send full prompts and responses to the observability vendor, and ask the vendor to delete the data after 30 days.","explanation":"The vendor is not approved to hold protected health information at all. A deletion period does not change that, so this approach breaks the privacy requirement from the first trace.","correct":false},{"text":"Turn tracing off for the claims system, and ask Anthropic support for the request history when a slow claim needs investigation.","explanation":"Under a ZDR arrangement, prompts and responses are not stored after the response is returned, so there is no history for Anthropic to provide. Without the team's own telemetry, slow claims cannot be investigated.","correct":false},{"text":"Log only the final decision letter and total duration for each claim, because these two values contain no intermediate claim content.","explanation":"The letter itself contains protected health information, so it cannot go to the vendor. A single duration value also cannot show which turns or tool calls made the claim slow.","correct":false},{"text":"Emit a span for each agent turn and tool call with timing and token counts, and keep content capture off.","explanation":"Spans with metadata show the structure of each claim: which agent ran, which tools it called, how long each step took, and how many tokens it used. This answers the \"why 90 turns\" question without sending any claim content to the vendor.","correct":true}],"answer":"<p>Correct answer: <strong>Emit a span for each agent turn and tool call with timing and token counts, and keep content capture off.</strong></p><p>Observability for an agent has two parts that can be separated: structure and content. Structure is the trace: one span for each model request, tool call, and subagent, with attributes such as agent name, tool name, duration, input and output tokens, cache tokens, and stop reason. Content is the text of prompts, responses, and tool results. Most performance questions (&quot;why did this claim take 90 turns?&quot;) can be answered from structure alone.</p><p>Under privacy constraints, the usual design is to export structure to the observability platform and to keep content capture off by default. If content is needed for debugging, it is stored only in a system that is approved for it, and it is linked to the trace by an ID. Claude&#x27;s own tooling follows the same model. For example, Claude Code&#x27;s OpenTelemetry export redacts prompt and tool content unless an administrator turns on specific settings.</p><p>ZDR also changes who holds the evidence. Because Anthropic does not store prompts and responses at rest, your own telemetry is the only record. See API and data retention, Observability with OpenTelemetry, and Monitoring.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 7. Domain: Observability and Production Monitoring.","answerStatus":"source"},{"query":"Scenario: Meridian Health Partners runs a claims-review copilot for its 400 claims adjusters. A supervisor agent built on the Claude Agent SDK receives each claim and delegates to three worker subagents: one reads the member's policy documents, one checks the medical coding, and one drafts the decision letter. The system handles protected health information, so Meridian has a zero data retention (ZDR) arrangement with Anthropic. A compliance rule states that no payment above $5,000 may be approved without a human adjuster. A typical claim takes 40 to 90 agent turns.\n\nQuestion: Over two weeks, 4% of decision letters cite the wrong policy clause. An engineer opens ten failing traces. In all ten, the policy worker's result names the correct clause. The supervisor's delegation prompt to the drafting worker contains a one-paragraph summary of the policy findings with no clause numbers, and the drafting worker then picks a clause that sounds similar. A recent harness change introduced that summary step. Where is the origin of the failure, and what should the team do first?","type":"multiple-choice","options":[{"text":"The origin is the drafting model, which invents clause numbers. Move the drafting worker to a more capable model.","explanation":"The drafting worker never received the clause number, so it had to guess. A more capable model would still be guessing. The evidence points to missing input, not to weak reasoning.","correct":false},{"text":"The origin is the policy documents, which contain clauses with similar names. Ask the policy team to rename the clauses.","explanation":"Similar clause names make a wrong guess more likely, but the policy worker identified the right clause every time. The data is not the place where the information was lost.","correct":false},{"text":"The origin is the harness handoff, which drops clause numbers. Pass them as structured fields.","explanation":"The trace comparison shows the clause number present at the policy worker's output and absent from the drafting worker's input. The step between them, the summary added by the harness change, is where the failure starts. Passing the clause numbers as explicit fields fixes it.","correct":true},{"text":"The origin is the policy worker's tool, which returns too much text. Reduce the number of pages that the tool returns.","explanation":"The traces show that the policy worker's result is correct. Changing a stage that works would not restore the clause number that is dropped later, and it could reduce the worker's accuracy.","correct":false}],"answer":"<p>Correct answer: <strong>The origin is the harness handoff, which drops clause numbers. Pass them as structured fields.</strong></p><p>When a multi-agent system gives a wrong answer, the useful question is where the information was last correct. Each stage has an input and an output that are visible in the trace. Compare them stage by stage, and the origin of the failure is the first place where the output is right and the next input is wrong. Possible origins are the model&#x27;s output, the agent harness, a tool, or the data.</p><p>Here, the policy worker&#x27;s output is right and the drafting worker&#x27;s input is missing the clause numbers. The loss happens in the summary step of the handoff, which is harness logic. The drafting model then fills the gap with a plausible clause. This looks like a model error from the outside, but a better model cannot use information that it never receives. The recent harness change is a second piece of evidence, because the timing matches.</p><p>The fix follows the general rule for handoffs: facts that later stages depend on (IDs, numbers, quotes) should cross agent boundaries as structured fields, not inside free-text summaries. See Subagents in the SDK and How we built our multi-agent research system.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 8. Domain: Advanced Debugging and Incident Response.","answerStatus":"source"},{"query":"Scenario: Meridian Health Partners runs a claims-review copilot for its 400 claims adjusters. A supervisor agent built on the Claude Agent SDK receives each claim and delegates to three worker subagents: one reads the member's policy documents, one checks the medical coding, and one drafts the decision letter. The system handles protected health information, so Meridian has a zero data retention (ZDR) arrangement with Anthropic. A compliance rule states that no payment above $5,000 may be approved without a human adjuster. A typical claim takes 40 to 90 agent turns.\n\nQuestion: At 9 AM each Monday, the API returns 529 overloaded errors for several minutes. Each worker retries a failed request five times with no delay. The supervisor also retries a failed worker three times, and the adjuster-facing service retries a failed claim twice. During the last incident, request volume from Meridian rose to 20 times normal and recovery took 40 minutes. The team wants claims to survive short periods of overload without making them longer. Which design should they adopt?","type":"multiple-choice","options":[{"text":"Raise the retry count at each layer so that every claim eventually succeeds during the overload period.","explanation":"More retries at three layers multiply each other. This sends even more requests into an overloaded service, which is the cause of the 20 times traffic increase and the slow recovery.","correct":false},{"text":"Remove all retries, and return an error to the adjuster as soon as any API request fails.","explanation":"Short overload periods are temporary, and one careful retry often succeeds. With no retries, every brief fault becomes a failed claim that an adjuster must restart by hand.","correct":false},{"text":"Keep the current retries, and switch every worker to a smaller model during the Monday morning peak.","explanation":"A smaller model does not change the retry behavior. The three layers would still multiply requests whenever errors appear, so the same amplification would happen again.","correct":false},{"text":"Retry at one layer only, with exponential backoff and jitter and a retry limit, and queue the claim for later when a circuit breaker opens.","explanation":"Retrying at a single layer stops the multiplication of requests. Backoff with jitter (a small random delay) spreads the retries over time, and a circuit breaker stops calls for a period when failures continue. The claim waits in a queue and completes later, which is graceful degradation.","correct":true}],"answer":"<p>Correct answer: <strong>Retry at one layer only, with exponential backoff and jitter and a retry limit, and queue the claim for later when a circuit breaker opens.</strong></p><p>Three retry layers multiply: 5 worker retries, 3 supervisor retries, and 2 service retries can turn one failing request into as many as 30 attempts. When the service is already overloaded, these extra requests make the overload worse and delay recovery. This pattern is called a retry storm.</p><p>The resilient design has four parts. First, retry at one layer, usually the one closest to the API call. Second, use exponential backoff with jitter, and respect the retry-after header when the response has one. Third, set a retry limit so that the total number of attempts is bounded. Fourth, add a circuit breaker: after repeated failures, stop calling for a period and let the system degrade gracefully. For a claims workflow, graceful degradation means placing the claim in a queue and telling the adjuster that it will finish later.</p><p>A 529 overloaded_error is a temporary condition, so it should be retried, but carefully. Removing all retries wastes that chance. See Claude API errors and Rate limits.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 9. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: Harborline Bank runs an internal copilot that answers employees' questions about 60,000 policy and procedure documents. The retrieval system splits each document into fixed 400-token chunks, embeds the chunks, and passes the 5 chunks with the highest vector similarity to Claude. Regulators require every answer to cite its source document and to say clearly when the documents do not contain an answer. Employees often ask about exact identifiers, such as form number \"HB-2291\" or a regulation code.\n\nQuestion: Branch staff report that questions containing a form number, such as \"What is the retention period for HB-2291?\", often return chunks about other forms. Questions phrased in general language, such as \"How long do we keep account opening forms?\", work well. The team checks the index and confirms that the HB-2291 document is present and embedded correctly. Which change to the retrieval system best addresses this failure?","type":"multiple-choice","options":[{"text":"Increase the number of dimensions of the embedding vectors so that each chunk is represented in more detail.","explanation":"More dimensions can improve how well meaning is captured, but the weakness here is exact matching of a rare identifier. Embeddings represent meaning, and a form number has almost no meaning for the model to capture.","correct":false},{"text":"Add a lexical BM25 index next to the embedding index, and merge the two result lists with rank fusion.","explanation":"BM25 scores chunks by exact term matches, so a rare token such as HB-2291 ranks its own document very high. Combining lexical and embedding results (hybrid search) keeps the strength of each method: exact identifiers and general meaning.","correct":true},{"text":"Increase the number of chunks passed to Claude from 5 to 50 so that the correct chunk is more likely to be included.","explanation":"More chunks raise cost and latency and can distract the model. If the embedding search does not rank the HB-2291 chunk highly, it may still be absent from the top 50, so the cause is not addressed.","correct":false},{"text":"Add an instruction to the system prompt telling Claude to pay close attention to form numbers in the question.","explanation":"The model can only use the chunks it receives. The wrong chunks are selected before the model reads anything, so an instruction to the model cannot repair a retrieval step that returned the wrong content.","correct":false}],"answer":"<p>Correct answer: <strong>Add a lexical BM25 index next to the embedding index, and merge the two result lists with rank fusion.</strong></p><p>Embedding search and lexical search fail in different ways. Embeddings capture meaning, so they work well for questions in natural language, but they can miss exact matches for rare strings such as form numbers, error codes, and regulation codes. BM25 is a lexical ranking method: it scores a chunk by the query terms it contains, and rare terms count more. A unique identifier is therefore a very strong signal for BM25.</p><p>Hybrid search runs both searches and merges the two ranked lists, usually with a rank fusion step that combines the positions from each list and removes duplicates. Anthropic&#x27;s Contextual Retrieval article describes this pipeline and gives the same example of an exact identifier that embeddings miss and BM25 finds.</p><p>The other options change the wrong stage. More dimensions and a larger top-k keep the same embedding-only ranking, and a prompt instruction acts after retrieval has already selected the wrong chunks. See Introducing Contextual Retrieval and Embeddings.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 10. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: Harborline Bank runs an internal copilot that answers employees' questions about 60,000 policy and procedure documents. The retrieval system splits each document into fixed 400-token chunks, embeds the chunks, and passes the 5 chunks with the highest vector similarity to Claude. Regulators require every answer to cite its source document and to say clearly when the documents do not contain an answer. Employees often ask about exact identifiers, such as form number \"HB-2291\" or a regulation code.\n\nQuestion: Many chunks contain sentences such as \"The limit for this product is $10,000 per day\" without naming the product, because the product name appears only in the document title and first paragraph. These chunks are retrieved for questions about the wrong product, and Claude then gives a confident answer with a citation to the wrong document. The team wants to fix this at indexing time and keep the 400-token chunk size. Which technique fits?","type":"multiple-choice","options":[{"text":"Remove the overlap between neighboring chunks so that each sentence appears in exactly one chunk.","explanation":"Removing overlap makes the problem worse. Each chunk would then have even less of the surrounding text, and the product name from the start of the document would still be missing.","correct":false},{"text":"Embed only the title of each document, and return the whole document when its title matches the question.","explanation":"Titles carry the product name but not the details inside the document. Many questions would match no title, and whole documents are far larger than the chunks the pipeline is designed to pass to the model.","correct":false},{"text":"Use Claude to write a short context for each chunk, and prepend it before the chunk is indexed.","explanation":"This is Contextual Retrieval. A sentence or two that places the chunk in its document, such as the product name and section, is added to the chunk before indexing. The chunk can then be matched to the right product by both embedding and lexical search.","correct":true},{"text":"Lower the similarity threshold so that more chunks from different products are returned for each question.","explanation":"A lower threshold returns more chunks of the same ambiguous kind. The chunks still do not say which product they describe, so the model has more unclear evidence, not better evidence.","correct":false}],"answer":"<p>Correct answer: <strong>Use Claude to write a short context for each chunk, and prepend it before the chunk is indexed.</strong></p><p>Splitting a document into chunks removes context. A chunk that says &quot;the limit for this product&quot; was clear inside the document, but alone it is ambiguous. The retrieval system then matches it to questions about any product, and the model, which trusts the retrieved text, answers incorrectly with full confidence.</p><p>Contextual Retrieval repairs this at indexing time. For each chunk, Claude receives the whole document and the chunk and writes a short description (usually 50 to 100 tokens) that places the chunk in the document. That text is prepended to the chunk before it is embedded and before the BM25 index is built. Anthropic reports that this reduced failed retrievals by 49% with contextual embeddings and contextual BM25 together, and by 67% when reranking was added. Prompt caching keeps the indexing cost low, because the full document is cached while its chunks are processed.</p><p>Removing overlap and lowering the threshold do not add the missing product name, and indexing only titles discards the content that answers most questions. See Introducing Contextual Retrieval and Prompt caching.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 11. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: Harborline Bank runs an internal copilot that answers employees' questions about 60,000 policy and procedure documents. The retrieval system splits each document into fixed 400-token chunks, embeds the chunks, and passes the 5 chunks with the highest vector similarity to Claude. Regulators require every answer to cite its source document and to say clearly when the documents do not contain an answer. Employees often ask about exact identifiers, such as form number \"HB-2291\" or a regulation code.\n\nQuestion: The team builds a labeled set of 500 questions, each with the chunk that contains its answer. For the current pipeline, the correct chunk is in the top 100 results for 96% of questions but in the top 5 for only 58%. Passing 100 chunks to Claude for every question would triple the cost and break the 4-second latency target. Which change gives the largest quality gain while respecting the cost and latency limits?","type":"multiple-choice","options":[{"text":"Replace the embedding model and re-embed all 60,000 documents so that recall in the top 100 rises above 96%.","explanation":"Recall in the top 100 is already high, so the first stage is not the weak point. Re-embedding the whole corpus is expensive and does not directly improve the order of the top results.","correct":false},{"text":"Double the chunk size to 800 tokens so that each of the 5 chunks passed to Claude carries more text.","explanation":"Larger chunks carry more text, but the correct chunk still has to be ranked in the top 5 to be passed at all. The ranking problem remains, and each chunk also becomes less specific.","correct":false},{"text":"Retrieve a wider candidate set, and add a reranking model that selects the best chunks to pass to Claude.","explanation":"The numbers show that the first-stage search finds the right chunk but ranks it too low. A reranker reads the question and each candidate together and orders them more accurately, so the right chunk moves into the small set that Claude receives. The model input stays small.","correct":true},{"text":"Ask Claude to answer from the top 5 chunks, and to request more chunks when it cannot find the answer.","explanation":"A second retrieval round can help in some cases, but it adds a full model call to each affected question. With 42% of questions missing the right chunk, this would break the latency target and raise cost sharply.","correct":false}],"answer":"<p>Correct answer: <strong>Retrieve a wider candidate set, and add a reranking model that selects the best chunks to pass to Claude.</strong></p><p>The two recall numbers show which stage is weak. Recall at 100 (96%) measures whether the search can find the right chunk at all. Recall at 5 (58%) measures whether it ranks that chunk at the top. A large gap between them means that the search finds the answer but orders it badly. That is a ranking problem, not a recall problem.</p><p>Reranking is the standard fix. The first stage quickly retrieves a wide candidate set. A reranking model then scores each candidate against the question and keeps the best ones. Anthropic&#x27;s Contextual Retrieval article describes retrieving the top 150 chunks and reranking them down to the top 20. The reranker adds a small latency cost, but the main model receives a short, high-quality input, which protects both cost and the latency target. The number of candidates to rerank is a setting to tune for each application.</p><p>Replacing the embedding model works on a stage that already performs well. Larger chunks and a second retrieval round do not correct the order of results. See Introducing Contextual Retrieval and Embeddings.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 12. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: Harborline Bank runs an internal copilot that answers employees' questions about 60,000 policy and procedure documents. The retrieval system splits each document into fixed 400-token chunks, embeds the chunks, and passes the 5 chunks with the highest vector similarity to Claude. Regulators require every answer to cite its source document and to say clearly when the documents do not contain an answer. Employees often ask about exact identifiers, such as form number \"HB-2291\" or a regulation code.\n\nQuestion: An internal audit samples 200 answers. In 14 of them, the retrieved chunks did not contain the answer, but the copilot still gave a specific, plausible answer and cited one of the chunks. The regulator's requirement is that every claim can be traced to a source passage and that the copilot says so when the documents do not contain the answer. Which change to answer generation best meets the requirement?","type":"multiple-choice","options":[{"text":"Set the temperature to 0 so that the copilot gives the same answer every time for the same chunks.","explanation":"A low temperature makes output more repeatable. It does not make the output grounded: the copilot can give the same unsupported answer every time.","correct":false},{"text":"Require answers to be based on quoted passages, and allow the copilot to say that no passage answers.","explanation":"Tying each claim to a quoted passage makes grounding checkable: a claim with no quote is removed. Giving the copilot explicit permission to say that the documents do not contain the answer removes the pressure to invent one. Both parts of the regulator's requirement are covered.","correct":true},{"text":"Ask the copilot to add a confidence score from 1 to 10 to each answer, and hide answers that score below 7.","explanation":"A confidence number written by the model is generated text, not a measurement. The audit found answers that were confident and unsupported, so those answers would probably also receive high scores.","correct":false},{"text":"Pass 20 chunks in place of 5 so that it is more likely that at least one chunk contains the answer.","explanation":"More chunks may reduce the number of cases with no answer, but they do not change what the copilot does when the answer is still missing. The behavior the regulator objects to would remain.","correct":false}],"answer":"<p>Correct answer: <strong>Require answers to be based on quoted passages, and allow the copilot to say that no passage answers.</strong></p><p>A retrieval-grounded system needs explicit grounding practices at the generation stage, because retrieval will sometimes return passages that do not answer the question. Anthropic&#x27;s guidance on reducing hallucinations recommends three practices that work together. First, allow the model to say that it does not know. Second, for tasks over documents, have the model find word-for-word quotes first and base its answer on them. Third, have the model check each claim against a supporting quote and withdraw any claim that has none.</p><p>The Claude API citations feature supports this pattern directly. When documents are passed with citations enabled, the response links each part of the answer to the exact passage that supports it, so an auditor or application code can check the link. The regulator&#x27;s requirement is then met by the structure of the answer, not by trust in the model.</p><p>Temperature controls variation, not truth. A confidence score that the model reports about itself is not calibrated. More chunks change the input but not the behavior when the answer is absent. See Reduce hallucinations and Citations.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 13. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: Harborline Bank runs an internal copilot that answers employees' questions about 60,000 policy and procedure documents. The retrieval system splits each document into fixed 400-token chunks, embeds the chunks, and passes the 5 chunks with the highest vector similarity to Claude. Regulators require every answer to cite its source document and to say clearly when the documents do not contain an answer. Employees often ask about exact identifiers, such as form number \"HB-2291\" or a regulation code.\n\nQuestion: Answer accuracy on the labeled question set is 71%, and two engineers disagree about the cause. One believes that retrieval returns the wrong chunks. The other believes that Claude misreads correct chunks. The team wants evidence that separates a retrieval failure from a generation failure before it spends money on either stage. Which two measurements provide that evidence? (Select TWO.)","type":"multiple-choice","options":[{"text":"Measure the average end-to-end latency of the pipeline, and compare the time spent in retrieval with the time spent in generation.","explanation":"This is incorrect. Latency shows where time is spent, not where accuracy is lost. A fast stage can be wrong and a slow stage can be right.","correct":false},{"text":"For each labeled question, check whether the chunk that contains the answer appears in the set passed to Claude.","explanation":"This is correct. This measurement looks only at retrieval. If the answer chunk is missing from the model's input, the failure started in retrieval, whatever the model did afterward.","correct":true},{"text":"Give Claude the known correct chunk directly for each question, and measure how often the answer is then correct.","explanation":"This is correct. This measurement removes retrieval from the test. If accuracy is high when the correct chunk is supplied, generation works, and the 71% result is caused by retrieval. If accuracy stays low, generation is the problem.","correct":true},{"text":"Ask Claude to rate, for each of its answers, whether the retrieved chunks were helpful, and average the ratings.","explanation":"This is incorrect. A rating that the model gives about its own input is not a measurement against known correct labels. The model can rate unhelpful chunks as helpful, especially when it has already produced a confident answer from them.","correct":false},{"text":"Count the total number of chunks in the index, and compare it with the number of documents to confirm that all documents were split.","explanation":"This is incorrect. This is a useful check that indexing completed, but it says nothing about whether the right chunk is returned for a question or whether the model reads it correctly.","correct":false}],"answer":"<p>Correct answers: <strong>For each labeled question, check whether the chunk that contains the answer appears in the set passed to Claude.; Give Claude the known correct chunk directly for each question, and measure how often the answer is then correct.</strong></p><p>A retrieval-grounded pipeline has stages, and an end-to-end accuracy number mixes their errors together. To diagnose a failure by stage, test each stage with the other one held fixed.</p><p>To test retrieval alone, use a labeled set in which each question is linked to the chunk that answers it. Then measure how often that chunk is in the retrieved set (recall at k) and how many retrieved chunks are relevant (precision). No model output is involved. To test generation alone, skip retrieval and give the model the known correct chunk. The accuracy that results is the best the generation stage can reach with perfect retrieval. Together, the two numbers show where the 71% comes from. For example, 60% recall with 97% accuracy on correct chunks means that almost all of the loss is in retrieval.</p><p>Latency, the model&#x27;s rating of its own input, and index counts all measure something else. See Introducing Contextual Retrieval, which reports results as retrieval failure rates measured separately from generation, and Define success criteria and build evaluations.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 14. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: Harborline Bank runs an internal copilot that answers employees' questions about 60,000 policy and procedure documents. The retrieval system splits each document into fixed 400-token chunks, embeds the chunks, and passes the 5 chunks with the highest vector similarity to Claude. Regulators require every answer to cite its source document and to say clearly when the documents do not contain an answer. Employees often ask about exact identifiers, such as form number \"HB-2291\" or a regulation code.\n\nQuestion: The golden set of 500 questions was written 14 months ago. Since then, the bank has revised about 20% of its policies, and several product lines have closed. Release candidates now fail the evaluation gate on questions where the copilot gives the current, correct policy but the stored expected answer describes the old one. Engineers have started to approve releases by hand and to ignore the gate. What should the team do to restore the value of the suite?","type":"multiple-choice","options":[{"text":"Lower the pass threshold of the gate by 20 percentage points to allow for the questions with outdated expected answers.","explanation":"A lower threshold lets real regressions pass together with the false failures. The gate would then accept a release that is 20 points worse, which removes most of its value.","correct":false},{"text":"Remove the gate from the release pipeline, and rely on user feedback from production to find regressions.","explanation":"User feedback is a useful signal, but it arrives after users are affected and it covers only what users choose to report. Removing the gate gives up the chance to catch regressions before release.","correct":false},{"text":"Freeze the copilot's document index at the version from 14 months ago when the evaluation runs, so that old expected answers are correct again.","explanation":"This makes the old answers pass, but the evaluation then tests a system that no longer exists. It says nothing about how the copilot behaves with the current policies that employees ask about.","correct":false},{"text":"Link each golden item to its source document version, review items when the source changes, and add recent questions.","explanation":"The suite has drifted away from the real task. Tracking the source version of each item shows which expected answers need review when a policy changes. Adding items from current production questions keeps coverage in line with what employees ask today.","correct":true}],"answer":"<p>Correct answer: <strong>Link each golden item to its source document version, review items when the source changes, and add recent questions.</strong></p><p>An evaluation suite is only useful while it is valid, which means that a pass or a fail reflects real quality. Suites lose validity over time. Expected answers become outdated when the source data changes, coverage develops gaps as users ask new kinds of questions, and a suite can become saturated when almost every candidate passes. When a gate produces false failures, people stop trusting it and work around it. That is the situation in this scenario.</p><p>Maintaining a golden set is ongoing work. Each item should record where its expected answer came from (document and version), so that a change to the document marks the item for review. New items should be added regularly from real production questions and from incidents, so that the set follows the real distribution of tasks. Anthropic&#x27;s evaluation guidance says that a suite needs ownership and regular maintenance in the same way as other test code, and that a task which often fails for reasons that are not the system&#x27;s fault should be repaired.</p><p>Lowering the threshold or freezing the index hides the problem, and removing the gate gives up protection before release. See Demystifying evals for AI agents and Define success criteria and build evaluations.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 15. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"},{"query":"Scenario: Harborline Bank runs an internal copilot that answers employees' questions about 60,000 policy and procedure documents. The retrieval system splits each document into fixed 400-token chunks, embeds the chunks, and passes the 5 chunks with the highest vector similarity to Claude. Regulators require every answer to cite its source document and to say clearly when the documents do not contain an answer. Employees often ask about exact identifiers, such as form number \"HB-2291\" or a regulation code.\n\nQuestion: On Tuesday night, a scheduled job re-embedded all documents with a newer embedding model. On Wednesday morning, employees report that almost every answer says the documents do not contain the information. Dashboards show normal latency and no API errors. Similarity scores for the top results fell from about 0.80 to about 0.25 for all questions at the time the job finished. The service that embeds employee questions was not changed. What is the most likely cause, and what is the best first action?","type":"multiple-choice","options":[{"text":"Claude was updated overnight and has become too cautious, so the team should rewrite the prompt to make the copilot more willing to answer.","explanation":"The similarity scores fell before the model was involved, so the model is receiving poor chunks and is correctly reporting that they do not answer the question. Making it less cautious would turn honest \"not found\" answers into invented ones.","correct":false},{"text":"The new embedding model is lower quality, so the team should increase the number of chunks passed to Claude from 5 to 25.","explanation":"A slightly weaker model would cause a small drop on some questions, not a collapse on all of them. With incomparable vectors, the top 25 results are almost as irrelevant as the top 5.","correct":false},{"text":"Questions and documents are now embedded with different models, so the team should roll back to the previous index and then align both sides.","explanation":"Vectors from two different embedding models are not comparable, so similarity scores become close to meaningless for every question. The timing and the uniform drop both point to the re-embedding job. Rolling back to the old index restores service quickly while the team prepares a change that updates both sides together.","correct":true},{"text":"The vector database is overloaded after the job, so the team should add capacity and wait for performance to return.","explanation":"Latency is normal and there are no errors, so there is no sign of overload. An overloaded database returns results slowly or fails, but it does not return fast results with very low similarity.","correct":false}],"answer":"<p>Correct answer: <strong>Questions and documents are now embedded with different models, so the team should roll back to the previous index and then align both sides.</strong></p><p>Incident diagnosis starts with what changed and when. Here, one change (the re-embedding job) matches the start of the problem exactly, and the damage is uniform: every question is affected, and similarity scores fell together. A uniform drop of this kind is typical of a system-level mismatch, not of a model that is slightly worse.</p><p>The mechanism is specific to embeddings. Each embedding model defines its own vector space. Document vectors from the new model and question vectors from the old model are not in the same space, so the similarity between them carries almost no information. Retrieval then returns chunks that are close to random, and Claude, following its grounding instructions, correctly says that it cannot find an answer. The &quot;not found&quot; answers show that the generation stage is working as designed.</p><p>The first action in an incident is mitigation: roll back to the last index that is known to be good. After that, the team can plan a change that updates question embedding and document embedding together, and can add a check, such as a small set of test questions with a minimum expected similarity, that runs after every re-index. See Embeddings and Reduce hallucinations.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 16. Domain: Advanced Debugging and Incident Response.","answerStatus":"source"},{"query":"Scenario: Harborline Bank runs an internal copilot that answers employees' questions about 60,000 policy and procedure documents. The retrieval system splits each document into fixed 400-token chunks, embeds the chunks, and passes the 5 chunks with the highest vector similarity to Claude. Regulators require every answer to cite its source document and to say clearly when the documents do not contain an answer. Employees often ask about exact identifiers, such as form number \"HB-2291\" or a regulation code.\n\nQuestion: After the incident, the team reviews its telemetry. At present each request produces one log line with the question, the final answer, and total latency. During the incident, nobody could tell from the logs which index version had served a request, which chunks were retrieved, or how relevant they were. The team wants to be able to explain any single answer and to detect a retrieval problem within minutes. What should each request record?","type":"multiple-choice","options":[{"text":"A trace with a retrieval span that holds the index version and the IDs and scores of retrieved chunks.","explanation":"A retrieval span records what the model was given and how relevant it was. With chunk IDs, scores, and the index version, an engineer can explain one answer, and an alert on the similarity scores would have detected Tuesday's problem in minutes.","correct":true},{"text":"The full text of every document in the index, written to the log once for each request.","explanation":"Writing 60,000 documents to the log for each request is extremely expensive and still does not show which chunks were selected for this question or how well they matched.","correct":false},{"text":"The final answer and latency only, for a random 1% sample of requests, to keep log volume low.","explanation":"This records even less than the current design. A sample of final answers cannot explain a single answer, and it would not show a drop in retrieval quality.","correct":false},{"text":"The model's own description of how it reached its answer, added as an extra paragraph at the end of each response.","explanation":"A description written by the model is generated text and may not match what actually happened. It also contains no retrieval scores or index version, which were the missing facts during the incident.","correct":false}],"answer":"<p>Correct answer: <strong>A trace with a retrieval span that holds the index version and the IDs and scores of retrieved chunks.</strong></p><p>For a retrieval-grounded application, the trace must make the grounding path visible: the question, what was retrieved, what the model received, and what it cited. One log line with question and answer hides the middle of that path, and the middle is where most failures begin.</p><p>A practical design has one trace for each request, with a span for each stage. The retrieval span records the index or embedding version, the query variant used, the IDs of the retrieved chunks, and their scores. The generation span records the model, the input and output tokens, and the stop reason. The answer&#x27;s citations are recorded as chunk IDs. With this structure, a single answer can be explained by reading one trace. Systemic problems can be detected with metrics built from the spans, for example an alert when the median top-1 similarity score falls below its normal range.</p><p>Recording chunk IDs and scores is much smaller, and much more useful, than recording text. If the documents are sensitive, the IDs can be stored without the content. See Citations and Search results for how source identifiers are kept with the content that Claude cites.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 17. Domain: Observability and Production Monitoring.","answerStatus":"source"},{"query":"Scenario: Tessellate Logistics is migrating a 2-million-line monorepo from a deprecated internal logging library to a new one. A platform team uses Claude Code in headless mode to run up to 40 coding agents at the same time. A coordinator script splits the migration into one task for each package, and each agent opens a pull request when it finishes. Human reviewers can review about 60 pull requests per day, and the agents now produce more than 200 per day. The CI pipeline runs the full test suite on every pull request.\n\nQuestion: In the first trial, all 40 agents ran in the same checkout of the repository on one build server. Agents reported test failures in files they had not touched, and several pull requests contained edits that belonged to another agent's package. One agent ran a git command that discarded another agent's uncommitted work. The team wants to keep 40 agents running in parallel on the same repository. What should it change?","type":"multiple-choice","options":[{"text":"Reduce the fleet to one agent at a time so that only one process edits the checkout.","explanation":"One agent at a time removes the collisions, but it also removes the parallelism that the team wants to keep. The migration would take about 40 times longer.","correct":false},{"text":"Start each agent in its own git worktree on its own branch so that every agent has a separate working directory.","explanation":"A git worktree is a separate working directory with its own files and branch that shares the same repository history. Each agent edits and tests its own copy, so agents cannot see or discard each other's uncommitted work.","correct":true},{"text":"Tell each agent in its prompt to edit only files inside its own package and never to run git commands that affect other files.","explanation":"An instruction lowers the chance of a collision but does not prevent one. Agents still share one working directory, so tests still see the half-finished edits of other agents.","correct":false},{"text":"Give each agent a file lock, and make every agent wait for the lock before it edits any file in the repository.","explanation":"A lock around every edit makes the agents take turns, so most of them wait. It also does not isolate test runs, which would still read files that other agents have changed.","correct":false}],"answer":"<p>Correct answer: <strong>Start each agent in its own git worktree on its own branch so that every agent has a separate working directory.</strong></p><p>Parallel coding agents need isolation of file edits. In a shared checkout, every agent sees every other agent&#x27;s unfinished changes, so a test failure may be caused by someone else&#x27;s edit, and a broad git command can destroy another agent&#x27;s work. The standard solution is one git worktree for each agent. A worktree has its own files and its own branch, and it shares the history and remote of the same repository.</p><p>Claude Code supports this directly. The --worktree flag starts a session in a new worktree on a new branch, and it also works with -p for headless runs. A custom subagent can declare isolation: worktree so that it always runs in its own worktree. While a session is isolated in this way, Claude Code blocks file edits and git commands that target the main checkout.</p><p>A prompt instruction and a global lock both leave the shared directory in place. Note that a worktree is a fresh checkout: files that are not tracked by git, such as a local .env file, must be copied in (for example with a .worktreeinclude file). See Run parallel sessions with worktrees and Run agents in parallel.</p>","tip":"","reference":"Matthew's Practice Exam 1: CCDV-P, question 18. Domain: Agent Fleet Operations for Software Delivery.","answerStatus":"source"},{"query":"Sce
