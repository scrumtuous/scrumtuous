<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
        crossorigin="anonymous"></script>

<script type="module">
  import { UserManager, WebStorageStateStore } from "https://cdn.jsdelivr.net/npm/oidc-client-ts@2.4.0/+esm";

  // ---------- Config (single source of truth) ----------
  const AUTHORITY  = "https://cognito-idp.us-east-1.amazonaws.com/us-east-1_2Vm1F3RdZ";
  const COGNITO_DOMAIN = "https://us-east-12vm1f3rdz.auth.us-east-1.amazoncognito.com";
  const CLIENT_ID  = "s6qs08b48fg6u10gg5hlurfvc";
  const REDIRECT   = "https://certificationexams.guru/pitstops/thank-you-for-logging-in.html";
  const POST_LOGOUT_REDIRECT = "https://certificationexams.guru/pitstops/sorry-to-see-you-logout.html";
  const SCOPE = "openid email phone profile";
  const STORE_PREFIX = "mp_";
  const CALLBACK_GUARD = "__mpAuthRedirectHandled";

  // ---------- Small utils ----------
  const $id = (id) => document.getElementById(id);
  const onReady = (fn) =>
    (document.readyState === "loading")
      ? document.addEventListener("DOMContentLoaded", fn, { once: true })
      : fn();

  const setText = (id, text) => { const el = $id(id); if (el) el.textContent = text; };
  const setHTML = (id, html) => { const el = $id(id); if (el) el.innerHTML = html; };
  const show    = (id) => { const el = $id(id); if (el) el.classList.remove("hidden","d-none"); };
  const hide    = (id) => { const el = $id(id); if (el) el.classList.add("hidden","d-none"); };

  const buildHostedLoginUrl = () =>
    `${COGNITO_DOMAIN}/oauth2/authorize` +
    `?client_id=${encodeURIComponent(CLIENT_ID)}` +
    `&response_type=code` +
    `&redirect_uri=${encodeURIComponent(REDIRECT)}` +
    `&scope=${encodeURIComponent(SCOPE)}`;

  const buildHostedLogoutUrl = () =>
    `${COGNITO_DOMAIN}/logout` +
    `?client_id=${encodeURIComponent(CLIENT_ID)}` +
    `&logout_uri=${encodeURIComponent(POST_LOGOUT_REDIRECT)}`;

  // ---------- OIDC manager (one instance) ----------
  const store = new WebStorageStateStore({ store: window.localStorage, prefix: STORE_PREFIX });
  const mgr = new UserManager({
    authority: AUTHORITY,
    client_id: CLIENT_ID,
    redirect_uri: REDIRECT,
    response_type: "code",
    scope: SCOPE,
    post_logout_redirect_uri: POST_LOGOUT_REDIRECT,
    stateStore: store,
    userStore:  store,
    automaticSilentRenew: true,
    revokeTokensOnSignout: true,
  });

  // Back-compat / global helpers
  window.userManager = mgr;
  window.myUserManager = mgr;

  window.currentUser = null;
  const listeners = new Set();
  window.onAuthChange = (fn) => { listeners.add(fn); return () => listeners.delete(fn); };
  window.getIdToken     = () => window.currentUser?.id_token || null;
  window.getAccessToken = () => window.currentUser?.access_token || null;

  window.apiFetch = async (input, init = {}) => {
    const token = window.getAccessToken() || window.getIdToken();
    const headers = new Headers(init.headers || {});
    if (token) headers.set("Authorization", `Bearer ${token}`);
    return fetch(input, { ...init, headers, credentials: init.credentials || "same-origin" });
  };

  let resolveAuthReady;
  window.authReady = new Promise((res) => (resolveAuthReady = res));

  // ---------- UI bits ----------
  function swapProfileMedia(loggedIn, profile = {}) {
    const currentImg = document.getElementById("mp-profile-pic");
    const container = currentImg?.parentElement || document.querySelector(".position-relative");
    if (!container) return;

    const existing = container.querySelector("img, video");
    if (existing) existing.remove();

    if (loggedIn) {
      const vid = document.createElement("video");
      vid.src = "/assets/registered-user.mp4";
      vid.className = "rounded-circle avatar-xl";
      vid.autoplay = true; vid.loop = true; vid.muted = true; vid.playsInline = true;
      if (profile.picture) vid.poster = profile.picture;
      container.appendChild(vid);
    } else {
      const img = document.createElement("img");
      img.id = "mp-profile-pic";
      img.src = "/assets/unknown-user.jpg";
      img.alt = "unknown exam taker";
      img.className = "rounded-circle avatar-xl";
      container.appendChild(img);
    }
  }

  function notifyAuthChanged(user) {
    window.currentUser = user || null;
    const detail = { isAuthenticated: !!(user && !user.expired) };
    window.dispatchEvent(new CustomEvent("auth:changed", { detail }));
    for (const fn of listeners) { try { fn(user); } catch {} }
  }

  function updateUI(user) {
    notifyAuthChanged(user);
    const profile = user?.profile || {};
    const name = profile.username || profile.email || profile.name || "User";

    // Legacy targets
    if (user && !user.expired) {
      setText("login-status", "You are logged in!");
      hide("signed-out"); show("signed-in");
      const ui = $id("user-info"); if (ui) ui.textContent = JSON.stringify(profile, null, 2);
      setHTML("nav-register", `&nbsp;&nbsp;Welcome ${name}!&nbsp;&nbsp;`);
    } else {
      setText("login-status", "You are not logged in.");
      setHTML("nav-register", `&nbsp;&nbsp;Register | Sign-In&nbsp;&nbsp;`);
      show("signed-out"); hide("signed-in");
    }

    // Modern targets
    if (user && !user.expired) {
      setText("mp-name", profile.name || profile.email || "User");
      setText("mp-registered-status", "Registered User");
      setHTML("mp-ranking", `<span class="text-success">Logged In</span>`);
      setText("mp-logged-in", "true");
      setText("mp-profile-loaded", "true");
      setText("mp-last-login", new Date().toLocaleString());
      swapProfileMedia(true, profile);
      hide("mp-signIn"); show("mp-signOut");
    } else {
      setText("mp-name", "Lurker McLurkerface");
      setText("mp-registered-status", "Unregistered?");
      setHTML("mp-ranking", `<span class="text-warning">Not logged in?</span><br />Please log in or register`);
      setText("mp-logged-in", "false");
      setText("mp-profile-loaded", "false");
      setText("mp-last-login", "unknown");
      swapProfileMedia(false);
      show("mp-signIn"); hide("mp-signOut");
    }
  }

  // ---------- Callback handling (idempotent) ----------
  async function handleCallbackIfNeeded() {
    const hasCode  = /[?&]code=/.test(location.search);
    const hasState = /[?&]state=/.test(location.search);
    if (!hasCode || !hasState) return;

    if (window[CALLBACK_GUARD]) return;
    try {
      const user = await mgr.signinRedirectCallback();
      history.replaceState({}, document.title, location.pathname);
      window[CALLBACK_GUARD] = true;
      updateUI(user);
    } catch (e) {
      // ignore "No matching state" races; let other pages handle if needed
    }
  }

  // ---------- Sign-in / Sign-out ----------
  async function signIn() { await mgr.signinRedirect(); }

  async function signOut() {
    try {
      await mgr.signoutRedirect({ post_logout_redirect_uri: POST_LOGOUT_REDIRECT });
    } catch {
      window.location.assign(buildHostedLogoutUrl());
    }
  }
  window.signOut = signOut; // in case other code calls it

  // ---------- Element wiring (nav-register, footer-signin, logout button) ----------
  function wireLoginAnchor(el) {
    if (!el) return;
    el.setAttribute("href", buildHostedLoginUrl());
    el.setAttribute("role", "button");
    // Only add .nav-link to the navbar item
    if (el.id === "nav-register") el.classList.add("nav-link");

    const go = (ev) => {
      if (typeof mgr.signinRedirect === "function") {
        ev.preventDefault();
        signIn();
      }
    };
    el.addEventListener("click", go, { passive: false });
    el.addEventListener("touchend", go, { passive: false });
  }

  function ensureLogoutBtnAttrs() {
    const btn = $id("mp-signOut");
    if (!btn) return;
    if (!btn.getAttribute("type")) btn.setAttribute("type", "button");
    btn.style.pointerEvents = "auto";
  }

  // Delegate so it survives re-renders/toggles
  function delegatedLogoutHandler(e) {
    let t = e.target;
    while (t && t !== document) {
      if (t.id === "mp-signOut") {
        e.preventDefault();
        signOut();
        return;
      }
      t = t.parentNode;
    }
  }

  // ---------- Init ----------
  await handleCallbackIfNeeded();

  let initialUser = null;
  try { initialUser = await mgr.getUser(); } catch {}
  updateUI(initialUser || null);
  resolveAuthReady?.(window.currentUser);
  try { await mgr.clearStaleState(); } catch {}

  // Keep UI in sync with OIDC events
  mgr.events.addUserLoaded?.((user) => updateUI(user));
  mgr.events.addUserUnloaded?.(() => updateUI(null));
  mgr.events.addUserSignedOut?.(() => updateUI(null));

  onReady(() => {
    // Login anchors
    wireLoginAnchor($id("nav-register"));
    wireLoginAnchor($id("footer-signin"));
    $id("signInAgain")?.addEventListener("click", () => signIn());
    $id("sign-in-again")?.addEventListener("click", () => signIn());
    $id("signIn")?.addEventListener("click", () => signIn());
    $id("mp-signIn")?.addEventListener("click", () => signIn());

    // Logout buttons
    ensureLogoutBtnAttrs();
    $id("logout")?.addEventListener("click", () => signOut());
    $id("logout1")?.addEventListener("click", () => signOut());
    $id("logout2")?.addEventListener("click", () => window.location.assign(buildHostedLogoutUrl()));

    document.addEventListener("click", delegatedLogoutHandler, { passive: false });
    document.addEventListener("touchend", delegatedLogoutHandler, { passive: false });

    // If SPA/DOM mutations swap elements, keep attrs sane
    if (window.MutationObserver) {
      new MutationObserver(() => ensureLogoutBtnAttrs())
        .observe(document.body, { childList: true, subtree: true, attributes: true });
    }
  });

  // Multi-tab sync
  window.addEventListener("storage", async (e) => {
    if (!e.key) return;
    if (e.key.startsWith(STORE_PREFIX)) {
      const u = await mgr.getUser().catch(() => null);
      updateUI(u || null);
    }
  });
</script>
