<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PSPO Product Owner Exam | Annotated 2020 Scrum Guide</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #d9e0e8;
      --primary: #1769aa;
      --primary-dark: #0f4f85;
      --secondary: #667085;
      --success: #16803c;
      --success-bg: #eaf8ef;
      --danger: #b42318;
      --danger-bg: #fff0ee;
      --warning: #9a6700;
      --warning-bg: #fff7d6;
      --shadow: 0 10px 28px rgba(23, 32, 51, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      border-radius: 9px;
      padding: .62rem .92rem;
      cursor: pointer;
      font-weight: 650;
      transition: transform .08s ease, background .15s ease, opacity .15s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-secondary { background: #e8edf3; color: var(--text); }
    .btn-warning { background: #ffd96a; color: #4b3500; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }

    .page-shell {
      width: min(1040px, calc(100% - 28px));
      margin: 28px auto 60px;
    }

    .hero {
      background: linear-gradient(135deg, #12243b, #1e4f79);
      color: white;
      border-radius: 18px;
      padding: 24px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero-top {
      display: flex;
      gap: 18px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .hero h1 { margin: 0 0 6px; font-size: clamp(1.65rem, 4vw, 2.35rem); }
    .hero p { margin: 0; opacity: .88; }
    .meta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .pill {
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.1);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: .9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-top: 16px;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 18px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-weight: 750;
    }

    .card-body { padding: 18px; }

    .results {
      border-left: 5px solid var(--primary);
    }
    .results strong { font-size: 1.1rem; }

    .query {
      font-size: 1.08rem;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .choose-note {
      color: var(--muted);
      font-size: .9rem;
      margin: 0 0 16px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 11px 12px;
      margin: 8px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
    }

    .option input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--primary);
      flex: 0 0 auto;
    }

    .option.reveal-correct {
      border-color: #75c991;
      background: var(--success-bg);
    }

    .option.reveal-wrong-selected {
      border-color: #e9a7a0;
      background: var(--danger-bg);
    }

    .option small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .answer-panel {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--warning-bg);
      border: 1px solid #f0d783;
    }

    .answer-panel p:first-child { margin-top: 0; }
    .answer-panel ul { margin-bottom: 0; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .control-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .collapsible-title { cursor: pointer; user-select: none; }
    .chevron { font-size: .9rem; color: var(--muted); }

    .jumper-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .jump-btn {
      min-width: 38px;
      padding: 7px 9px;
      background: #eef2f6;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .jump-btn.viewed { background: #d7dee7; }
    .jump-btn.current { background: var(--primary); color: white; border-color: var(--primary); }
    .jump-btn.correct { background: var(--success); color: white; border-color: var(--success); }
    .jump-btn.incorrect { background: var(--danger); color: white; border-color: var(--danger); }

    .history-empty { color: var(--muted); margin: 0; }
    .history-exam {
      border-top: 1px solid var(--line);
      padding: 14px 0;
    }
    .history-exam:first-child { border-top: 0; padding-top: 0; }
    .history-summary {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }
    .history-dots { display: flex; flex-wrap: wrap; gap: 5px; }
    .history-dot {
      width: 26px; height: 26px; border-radius: 7px;
      display: grid; place-items: center;
      font-size: .76rem; color: white;
      background: var(--danger);
    }
    .history-dot.correct { background: var(--success); }

    .status-line {
      color: var(--muted);
      font-size: .92rem;
      margin-top: 10px;
    }

    .footer-note {
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
      margin-top: 22px;
    }

    @media (max-width: 640px) {
      .page-shell { width: min(100% - 16px, 1040px); margin-top: 8px; }
      .hero { border-radius: 12px; padding: 19px 17px; }
      .card-body { padding: 14px; }
      .card-header { padding: 12px 14px; }
      .controls { align-items: stretch; }
      .control-group { width: 100%; }
      .control-group button { flex: 1; }
    }
  </style>
</head>
<body>
  <scrum-exam-app></scrum-exam-app>

  <script>
    const QUESTION_BANK = [{"query":"A Scrum Team has been working on a product for 9 Sprints. A new Product Owner who is new to Scrum joins the team and understands she is accountable for the Product Backlog. However, she is unsure about the purpose of the Product Backlog. She has read that the Product Backlog should be a list of all user features for the product. She goes to the Scrum Master asking where to put the other types of requirements that are going to be taken into account. Are all of the following types of requirements acceptable on a Product Backlog? Stability requirements. Performance requirements. Product Functionality. Documentation. Fixes. (choose the best answer)","type":"multiple-choice","options":[{"text":"Yes, they all belong on the Product Backlog. Product Backlog is supposed to be the Single Source of Truth for all the work for the product.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"No, Product Backlog is a tool for the Product Owner. The Product Owner represents the users and stakeholders. Other types of requirements should be managed separately by the Developers. They are not the Product Owner's concern.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Yes, they all belong on the Product Backlog. Product Backlog is supposed to be the Single Source of Truth for all the work for the product.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>It is the single source of work undertaken by the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>The Product Backlog is an emergent, ordered list\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #1."},{"query":"What variables should a Product Owner consider when ordering the Product Backlog? (choose the best answer)","type":"multiple-choice","options":[{"text":"Development cohesion as indicated by the Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The availability of resources and skills for implementation.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Lowest development cost in order to maximize Return on Investment (ROI).","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Effort first, then value.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Anything that informs them to achieve the product's goals and to optimize the value delivered.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Anything that informs them to achieve the product&#x27;s goals and to optimize the value delivered.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Ordering Product Backlog items;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #2."},{"query":"The Product Owner manages the Product Backlog. Who is accountable for estimating the effort to complete the Product Backlog Items? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Developers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The PMO.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 11):\u003c/strong> \u003cq>The Developers who will be doing the work are responsible for the sizing.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #3."},{"query":"How do timeboxes help the Product Owner and the other members of the Scrum Team validate assumptions, adapt, and maximize the value of their product? (choose the best answer)","type":"multiple-choice","options":[{"text":"Timeboxes help by making sure a Sprint does not stop until all testing is done, and the work is verified by the Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Timeboxes assure the Product Owner that the Developers will finish all work on the Sprint Backlog by the end of the Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Timeboxes help minimize risk by creating the opportunity to validate assumptions using feedback from users and the market; allowing Scrum Teams to inspect progress toward the Product Goal and decide whether to pivot or persevere.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"At the end of each Sprint when the timebox expires a detailed report with all test cases and test results is available.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Timeboxes help minimize risk by creating the opportunity to validate assumptions using feedback from users and the market; allowing Scrum Teams to inspect progress toward the Product Goal and decide whether to pivot or persevere.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Inspection (p. 4):\u003c/strong> \u003cq>The Scrum artifacts and the progress toward agreed goals must be inspected frequently and diligently to detect potentially undesirable variances or problems.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>They are fixed lengthevents of one month or less to create consistency.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Inspection, The Sprint; original PSPO question #5."},{"query":"How important is it for a Product Owner to order Product Backlog Items by using value points? (choose the best answer)","type":"multiple-choice","options":[{"text":"Calculating value points is a predictive approach that conflicts with the empiricism of Scrum, and is therefore not acceptable.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Using value points is the ultimate way for a Product Owner to predict the value that the product will provide.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner may order the Product Backlog by using value points or select another technique, the decision is up to them.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Owner may order the Product Backlog by using value points or select another technique, the decision is up to them.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Definition (p. 3):\u003c/strong> \u003cq>Various processes, techniques and methods can be employed within the framework.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>How this is done may vary widely across organizations, Scrum Teams, and individuals.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Value points are a supplementary technique, not a mandated Scrum practice.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Definition, Product Owner; original PSPO question #8."},{"query":"When can the Product Backlog be updated? (choose the best answer)","type":"multiple-choice","options":[{"text":"Never, unless agreed to by the change request.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"At any time when done by the Product Owner or a delegate.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Only after a Sprint Review if agreed to by the stakeholders.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Only during Product Backlog Refinement sessions if the Product Owner is present.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>At any time when done by the Product Owner or a delegate.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>The Product Backlog is an emergent, ordered list\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>The Product Owner may do the above work or may delegate the responsibility to others.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog, Product Owner; original PSPO question #9."},{"query":"Who is accountable for creating a valuable and usable Increment each Sprint? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The CEO.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Team.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Team.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #12."},{"query":"What are two effective ways for the Scrum Team to make non-functional requirements visible? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Run the integration and regression tests before the end of the Sprint, and capture the open work for the Sprint Backlog of the next Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Add them to the Product Backlog to ensure transparency.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Put them on a separate list on the Scrum board, available for all to see.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Add them to the Definition of Done so the work is taken care of every Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Add them to the Product Backlog to ensure transparency.\u003c/li>\u003cli>Add them to the Definition of Done so the work is taken care of every Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>It is the single source of work undertaken by the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done, Product Backlog; original PSPO question #13."},{"query":"The Cone of Uncertainty can be used to do what? (choose the best answer)","type":"multiple-choice","options":[{"text":"Determine the length of the next Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Determine the cost of a project before it begins.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Determine whether to cut quality, similar to the Iron Triangle of project management.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Illustrate that as a project forecast lengthens, it is increasingly less certain.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Illustrate that as a project forecast lengthens, it is increasingly less certain.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 8):\u003c/strong> \u003cq>In complex environments, what will happen is unknown.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Cone of Uncertainty is not defined in the Scrum Guide; this passage supports the underlying uncertainty principle.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #14."},{"query":"Which of the following are criteria to order Product Backlog Items? (choose all that apply)","type":"multiple-choice","options":[{"text":"Value of Product Backlog Items.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Dependencies between Product Backlog Items.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Dependencies to other products.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The availability of the Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"All of the above.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Value of Product Backlog Items.\u003c/li>\u003cli>Dependencies between Product Backlog Items.\u003c/li>\u003cli>Dependencies to other products.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Ordering Product Backlog items;\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #16."},{"query":"All Scrum artifacts must be transparent to ensure sufficient accuracy of inspection. Which two measures ensure that the Product Backlog is transparent? (choose the best two answers)","type":"multiple-choice","options":[{"text":"The Product Backlog is managed using a web-based tool.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Backlog is available to all stakeholders.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Backlog is ordered.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Each Product Backlog Item has a MoSCoW priority.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Backlog only has work for the next 2 Sprints.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The Product Backlog is available to all stakeholders.\u003c/li>\u003cli>The Product Backlog is ordered.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Transparency (p. 3):\u003c/strong> \u003cq>The emergent process and work must be visible to those performing the work as well as those receiving the work.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Transparency; original PSPO question #17."},{"query":"Which of the following practices might help the Product Owner minimize waste in developing and sustaining the Product Backlog? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Avoid distracting the Scrum Team by maintaining newly gathered Product Backlog items in a separate Product Backlog until they are fully understood.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Only fully describe Product Backlog items when it seems likely they will be implemented.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Hand off ownership of the Product Backlog to someone else.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Remove items from the Product Backlog that have not been addressed in a long time.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Only fully describe Product Backlog items when it seems likely they will be implemented.\u003c/li>\u003cli>Remove items from the Product Backlog that have not been addressed in a long time.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>Product Backlog refinement is the act of breaking down and further defining Product Backlog items into smaller more precise items.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>This is an ongoing activity to add details, such as a description, order, and size.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Specific Product Backlog pruning techniques are not mandated; this is related guidance on progressive refinement.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #18."},{"query":"What three things might a Scrum Product Owner focus on to ensure the product delivers value? (choose the best three answers)","type":"multiple-choice","options":[{"text":"Minimizing changes to project scope.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"How much of the functionality of the product is being used.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"How quickly or easily the product can be absorbed and used by its customers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Direct customer feedback.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Velocity is increasing over time.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>How much of the functionality of the product is being used.\u003c/li>\u003cli>How quickly or easily the product can be absorbed and used by its customers.\u003c/li>\u003cli>Direct customer feedback.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>The Product Owner may represent the needs of many stakeholders in the Product Backlog.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> These are possible value indicators, not measurements mandated by the Scrum Guide.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #20."},{"query":"How often should customer satisfaction be measured? (choose the best answer)","type":"multiple-choice","options":[{"text":"Quarterly.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Annually.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Daily.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Frequently.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Frequently.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>How this is done may vary widely across organizations, Scrum Teams, and individuals.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Scrum Guide supports frequent inspection but does not set a customer-satisfaction survey cadence.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #21."},{"query":"Why would you expect a Product Owner to care that the Scrum Team adheres to its Definition of Done? (choose the best two answers)","type":"multiple-choice","options":[{"text":"To be able to punish the team when they do not meet their velocity goal for the Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner should not care about the Definition of Done, it is the Scrum Team's responsibility.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Definition of Done can affect the product's total cost of ownership.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"To have complete transparency into what has been done at the end of each Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"To forecast the team's productivity over time.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The Definition of Done can affect the product&#x27;s total cost of ownership.\u003c/li>\u003cli>To have complete transparency into what has been done at the end of each Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done creates transparency by providing everyone a shared understanding of what work was completed as part of the Increment.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #22."},{"query":"A product's success is measured by: (choose the best three answers)","type":"multiple-choice","options":[{"text":"The impact on customer satisfaction.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The impact on cost.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The impact on my boss's mood.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The delivery of upfront defend scope compared to the upfront planned time.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The impact on my performance rating.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The impact on revenue.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The impact on customer satisfaction.\u003c/li>\u003cli>The impact on cost.\u003c/li>\u003cli>The impact on revenue.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>How this is done may vary widely across organizations, Scrum Teams, and individuals.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Cost, revenue, and satisfaction metrics are not prescribed; value approaches vary by product.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #23."},{"query":"Scrum is based on empiricism. All of its artifacts must be transparent to ensure sufficient accuracy of inspection. How can the Scrum Team maintain the Product Backlog to maximize its transparency? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Product Backlog is only updated at a release planning meeting with the stakeholders and the change control board present.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Product Backlog Items must be sized such that the highest ordered items are no bigger than a Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Backlog is only updated at the Sprint Review, when both the Scrum Team and the stakeholders are available.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Product Backlog Items should hold no more than 8 points of work, which is the average in the range of acceptable sizes of 1, 2, 3, 5, 8, and 13.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Backlog is continually kept up to date with the most recent insights.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Backlog is continually kept up to date with the most recent insights.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>This is an ongoing activity to add details, such as a description, order, and size.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Transparency (p. 3):\u003c/strong> \u003cq>The emergent process and work must be visible to those performing the work as well as those receiving the work.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog, Transparency; original PSPO question #25."},{"query":"What is the responsibility of the Product Owner in crafting the Sprint Goal? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Product Owner has no responsibility in it. This is the Developers responsibility.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner defines the scope for a Sprint and therefore also the Sprint Goal.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner should not come to the Sprint Planning without a clearly defined Sprint Goal.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner should come to the Sprint Planning with a business objective in mind and work with the Developers to craft the Sprint Goal.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner must work with stakeholders to set each Sprint's Goal.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Owner should come to the Sprint Planning with a business objective in mind and work with the Developers to craft the Sprint Goal.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 8):\u003c/strong> \u003cq>Topic One: Why is this Sprint valuable?\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 8):\u003c/strong> \u003cq>This resulting plan is created by the collaborative work of the entire Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Planning; original PSPO question #26."},{"query":"When should the Product Owner update the project plan? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Product Backlog is the plan in Scrum. It is updated as new information and insights emerge.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The project plan must be updated prior to the Sprint Retrospective.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Before the Sprint Planning to know how much work will have to be done in the Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"After the Daily Scrum to ensure an accurate daily overview of project progress.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Backlog is the plan in Scrum. It is updated as new information and insights emerge.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>The Product Backlog is an emergent, ordered list\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>This is an ongoing activity to add details, such as a description, order, and size.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #27."},{"query":"A Product Backlog is: (choose the best three answers)","type":"multiple-choice","options":[{"text":"Managed by the Product Owner.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Only visible to the Product Owner and stakeholders.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"An exhaustive list of upfront approved requirements to be implemented.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Ordered based on priority, value, dependencies, and risk.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"An inventory of things to be done for the Product.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Managed by the Product Owner.\u003c/li>\u003cli>Ordered based on priority, value, dependencies, and risk.\u003c/li>\u003cli>An inventory of things to be done for the Product.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>It is the single source of work undertaken by the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Ordering Product Backlog items;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog, Product Owner; original PSPO question #28."},{"query":"True or False: The Sprint Review is the only time at which stakeholder feedback is taken into account.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The purpose of the Sprint Review is to inspect the outcome of the Sprint and determine future adaptations.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>from stakeholder collaboration, verification, maintenance, operation, experimentation, research and development, and anything else that might be required.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Review, Scrum Team; original PSPO question #4."},{"query":"How much time must a Product Owner spend with the Developers? (choose the best answer)","type":"multiple-choice","options":[{"text":"As much time as the Developers ask the Product Owner to be present.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"100%.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Enough so that the Product Owner is confident, the Increment will meet the intended value.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"40%, or more if the stakeholders agree.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Enough so that the Product Owner is confident, the Increment will meet the intended value.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #29."},{"query":"Which metrics will help a Product Owner determine if a product delivering value? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Velocity.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Productivity.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Time to market.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Customer satisfaction.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Percentage of scope implemented.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Time to market.\u003c/li>\u003cli>Customer satisfaction.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>How this is done may vary widely across organizations, Scrum Teams, and individuals.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> These are possible value metrics, not mandatory Scrum measures.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #30."},{"query":"What typically happens if the Product Backlog is not sufficiently clear at Sprint Planning? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Product Owner should select the Sprint Goal for the Scrum Team so that work can begin.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers will find it difficult to create a Sprint forecast they are confident they can meet.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Nothing in particular.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master should not allow this to happen. Look for a new Scrum Master and restart the Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Sprint Planning is cancelled so refinement can be done first.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers will find it difficult to create a Sprint forecast they are confident they can meet.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 8):\u003c/strong> \u003cq>The Product Owner ensures that attendees are prepared to discuss the most important Product Backlog items and how they map to the Product Goal.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Planning, Product Backlog; original PSPO question #32."},{"query":"True or False: The value delivered by a product can only be determined by revenue.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>How this is done may vary widely across organizations, Scrum Teams, and individuals.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Scrum Guide does not prescribe revenue as the only product-value measure.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #6."},{"query":"What might indicate to a Product Owner that she needs to work more with the Scrum Team? (choose the best answer)","type":"multiple-choice","options":[{"text":"People leave the Scrum Team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"She is not working fulltime with the Scrum Team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The acceptance criteria do not appear to be complete.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Increment presented at the Sprint Review does not reflect what she thought she had asked for.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Increment presented at the Sprint Review does not reflect what she thought she had asked for.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The Scrum Team presents the results of their work to key stakeholders and progress toward the Product Goal is discussed.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Review; original PSPO question #35."},{"query":"What are two effective ways for a Scrum Team to ensure security concerns are satisfied? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Delegate the work to the security department.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Postpone the work until a specialist can perform a security audit and create a list of security-related Product Backlog Items.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Add security concerns to the Definition of Done.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Add a Sprint to specifically resolve all security concerns.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Have the Scrum Team create Product Backlog Items for each concern.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Add security concerns to the Definition of Done.\u003c/li>\u003cli>Have the Scrum Team create Product Backlog Items for each concern.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>It is the single source of work undertaken by the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done, Product Backlog; original PSPO question #36."},{"query":"You are the Scrum Master for four Scrum Teams working from the same Product Backlog. Several of the Developers come to you complaining that work identified for the upcoming two Sprints will require full-time commitment from a specialist who is external to the teams. What should the Scrum Master consider in this situation? (choose the best two answers)","type":"multiple-choice","options":[{"text":"The need to have enough work to keep all Developers busy.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The ability of the Scrum Teams to produce integrated Increments.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The desire to maintain a stable velocity.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The benefit of Developers figuring out a solution for themselves.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The ability of the Scrum Teams to produce integrated Increments.\u003c/li>\u003cli>The benefit of Developers figuring out a solution for themselves.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Increment (p. 11):\u003c/strong> \u003cq>Each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Increment; original PSPO question #37."},{"query":"True or False: The Scrum Team must choose at least one high priority process improvement item, identified during the Sprint Retrospective, and place it in the Sprint Backlog.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>They may even be added to the Sprint Backlog for the next Sprint.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The most impactful improvements are addressed as soon as possible.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Retrospective; original PSPO question #7."},{"query":"In order to maximize the value of the product, a Product Owner needs awareness of the following: (choose the best answer)","type":"multiple-choice","options":[{"text":"Competitive reasearch.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Customer feedback.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Product vision.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Forecasting & feasibility","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"All of the above.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"None of the above.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>All of the above.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Product value considerations may be broader than this single quoted Scrum accountability.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #38."},{"query":"The Developers ask their Product Owner to re-order the Product Backlog. The team is waiting for an external supplier to deliver a component. Without that component there will not be enough work in the next Sprint to occupy the full team. As the Scrum Master, what advice would you give the Product Owner? (choose the best answer)","type":"multiple-choice","options":[{"text":"Tell the Product Owner that the Product Backog should be ordered to maximize utilization of the Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Tell the Product Owner to re-order the Product Backlog so the work involving the external component can be planned in a separate Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Remind the Product Owner that their primary concern is the flow of value reflected in the ordering of the Product Backlog.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Remind the Product Owner that their primary concern is the flow of value reflected in the ordering of the Product Backlog.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Ordering Product Backlog items;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #39."},{"query":"A Project Manager working with your Scrum Team has raised concerns about progress and money spent. What are the two best responses? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Show the Earned Value Analysis (EVA) report.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Scrum does not have Project Managers so disregard their concerns.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Promote transparency by sharing the Product Backlog and ensuring the Project Manager has access.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Share the last stakeholder briefing document prepared by the Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Have a discussion with the Project Manager, share the current impediments and forecast for the Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Promote transparency by sharing the Product Backlog and ensuring the Project Manager has access.\u003c/li>\u003cli>Have a discussion with the Project Manager, share the current impediments and forecast for the Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Transparency (p. 3):\u003c/strong> \u003cq>The emergent process and work must be visible to those performing the work as well as those receiving the work.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Inspection (p. 4):\u003c/strong> \u003cq>The Scrum artifacts and the progress toward agreed goals must be inspected frequently and diligently to detect potentially undesirable variances or problems.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Transparency, Inspection; original PSPO question #40."},{"query":"True or False: The Product Owner should have the entire Product Backlog documented in detail before the first Sprint can start?","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>The Product Backlog is an emergent, ordered list\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #10."},{"query":"The Product Owner is the person who will be held accountable if a product does not achieve its goals or deliver value. Does this mean that the Product Owner has final say over the Definition of Done? (choose the best answer)","type":"multiple-choice","options":[{"text":"Yes, the Product Owner decides the Definition of Done. The Developers may be consulted.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"No, the Scrum Team decides the Definition of Done. The Product Owner is just one member of the Scrum Team.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>No, the Scrum Team decides the Definition of Done. The Product Owner is just one member of the Scrum Team.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>the Scrum Team must create a Definition of Done appropriate for the product.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>all Scrum Teams must follow it as a minimum.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #41."},{"query":"Which statement best describes Scrum? (choose the best answer)","type":"multiple-choice","options":[{"text":"A defined and predictive process that conforms to the principles of Scientific Management.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"A framework to generate value through adaptive solutions for complex problems.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"A cookbook that defines best practices for software development.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"A complete methodology that defines how to develop software.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>A framework to generate value through adaptive solutions for complex problems.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Definition (p. 3):\u003c/strong> \u003cq>Scrum is a lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Theory (p. 3):\u003c/strong> \u003cq>Scrum is founded on empiricism and lean thinking.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Definition, Scrum Theory; original PSPO question #42."},{"query":"What is a Product Owner typically responsible for during a Sprint? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Nothing.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Working with the Scrum Team on Product Backlog Refinement.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Attending every Daily Scrum to answer questions about the Sprint Backlog items.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Updating the work plan for the Developers on a daily basis.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Collaborating with stakeholders, users and customers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Creating financial reporting upon the spent hours reported by the Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Working with the Scrum Team on Product Backlog Refinement.\u003c/li>\u003cli>Collaborating with stakeholders, users and customers.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>The Product Owner may represent the needs of many stakeholders in the Product Backlog.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>from stakeholder collaboration, verification, maintenance, operation, experimentation, research and development, and anything else that might be required.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner, Scrum Team; original PSPO question #43."},{"query":"True or False: The Sprint Backlog is a result of Sprint Planning, and it includes the Sprint Goal.","type":"multiple-choice","options":[{"text":"True.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"False.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Backlog (p. 11):\u003c/strong> \u003cq>The Sprint Backlog is composed of the Sprint Goal (why), the set of Product Backlog items selected for the Sprint (what), as well as an actionable plan for delivering the Increment (how).\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Backlog; original PSPO question #11."},{"query":"Who is accountable for tracking the remaining work toward the Sprint Goal? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Project Manager.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Developers (p. 5):\u003c/strong> \u003cq>Adapting their plan each day toward the Sprint Goal;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Developers; original PSPO question #45."},{"query":"The Scrum Team should have all the skills needed to: (choose the best answer)","type":"multiple-choice","options":[{"text":"Complete the project within the date and cost as calculated by the Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Turn Product Backlog Items into a valuable, useful Increment.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Do all of the development work, except for specialized testing that requires additional tools and environments.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Turn Product Backlog Items into a valuable, useful Increment.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #46."},{"query":"Which three of the following are timeboxed events in Scrum? (choose the best three answers)","type":"multiple-choice","options":[{"text":"Sprint 0.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Release Retrospective.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Sprint Retrospective.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Daily Scrum.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Sprint Planning.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Release Planning.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Sprint Testing.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Sprint Retrospective.\u003c/li>\u003cli>Daily Scrum.\u003c/li>\u003cli>Sprint Planning.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Events (p. 7):\u003c/strong> \u003cq>Each event in Scrum is a formal opportunity to inspect and adapt Scrum artifacts.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Events; original PSPO question #47."},{"query":"True or False: The Product Owner must write all of the Product Backlog Items (e.g. user stories, requirements, etc.) on the Product Backlog before handing them over to the Scrum Team.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>The Product Owner may do the above work or may delegate the responsibility to others.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #15."},{"query":"Who starts the Daily Scrum? (choose the best answer)","type":"multiple-choice","options":[{"text":"The person who has the token.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Whoever the Developers decide should start.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The person coming in last. This encourages people to be on time and helps to stay within the timebox.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master. This ensures that the Developers have the event, and it stays within the timebox.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Whoever the Developers decide should start.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>The Developers can select whatever structure and techniques they want\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Daily Scrum; original PSPO question #48."},{"query":"Which of the following services are appropriate for a Scrum Master in regard to the Daily Scrum? (choose the best answer)","type":"multiple-choice","options":[{"text":"Lead the discussions.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Make sure that all 3 questions have been answered by each member of the team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Keep track of whether each Developer has a chance to speak.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Teach the Developers to keep the Daily Scrum within 15 minutes.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"All of the above.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Teach the Developers to keep the Daily Scrum within 15 minutes.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>The purpose of the Daily Scrum is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, adjusting the upcoming planned work.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>for the Developers of the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Daily Scrum; original PSPO question #49."},{"query":"Who is on the Scrum Team? (choose all that apply)","type":"multiple-choice","options":[{"text":"Scrum Master.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Product Owner.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Developers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Project Manager.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"None of the above.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Scrum Master.\u003c/li>\u003cli>Product Owner.\u003c/li>\u003cli>Developers.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The Scrum Team consists of one Scrum Master, one Product Owner, and Developers.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #51."},{"query":"True or False: Product Owners must create clear and unambiguous acceptance criteria for each Product Backlog Item before it may be selected in Sprint Planning.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #19."},{"query":"What tactic should a Scrum Master use to divide a group of 100 people into multiple Scrum Teams? (choose the best answer)","type":"multiple-choice","options":[{"text":"Ask the people to divide themselves into teams.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Create teams based on their skills across multiple layers (such as database, UI, etc.).","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Ask the Product Owner to assign the people to teams.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Ask the people to divide themselves into teams.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning they internally decide who does what, when, and how.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>typically 10 or fewer people.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> No specific team-formation tactic is mandated; the Guide emphasizes self-management and cohesive teams.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #52."},{"query":"Which of the following are true about the length of the Sprint? (choose the best answer)","type":"multiple-choice","options":[{"text":"The length of the Sprint should be proportional to the work that is done in between Sprints.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Sprint length is determined during Sprint Planning, and should hold the time it will take to code the planned features in the upcoming Sprint, but does not include time for any testing.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Sprint length is determined during Sprint Planning, and should be long enough to make sure the Scrum Team can deliver what is to be accomplished in the upcoming Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"All Sprints must be one month or less.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>All Sprints must be one month or less.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>They are fixed lengthevents of one month or less to create consistency.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #53."},{"query":"Which are appropriate topics for discussion in a Sprint Retrospective? (choose the best three answers)","type":"multiple-choice","options":[{"text":"Definition of Done.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Arranging the Sprint Backlog for the next Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"How the Scrum Team does its work.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Team relations.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The value of work currently represented in the Product Backlog.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Definition of Done.\u003c/li>\u003cli>How the Scrum Team does its work.\u003c/li>\u003cli>Team relations.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The Scrum Team inspects how the last Sprint went with regar
