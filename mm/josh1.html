ready to start the first Sprint, but the Product Backlog is not ready yet?","type":"multiple-choice","options":[{"text":"The Product Owner should ask the Scrum Master to remove this impediment.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner should let the team start the Sprint and continue refining the Product Backlog.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner should not allow the team to Start the Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Owner should let the team start the Sprint and continue refining the Product Backlog.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>Product Backlog refinement is the act of breaking down and further defining Product Backlog items into smaller more precise items.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #159."},{"query":"Which of the following answers can be reasons for the Scrum Master to attend the Daily Scrum?","type":"multiple-choice","options":[{"text":"To be able to track the Sprint progress.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It is not necessary for the Scrum Master to attend the meeting.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"To support the Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers have asked the Scrum Master to facilitate the Daily Scrum.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>It is not necessary for the Scrum Master to attend the meeting.\u003c/li>\u003cli>The Developers have asked the Scrum Master to facilitate the Daily Scrum.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>for the Developers of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>The purpose of the Daily Scrum is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, adjusting the upcoming planned work.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Daily Scrum; original PSPO question #161."},{"query":"True or False: Only the Developers are influencing the Definition of Done, no one else.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>the Scrum Team must create a Definition of Done appropriate for the product.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>all Scrum Teams must follow it as a minimum.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #177."},{"query":"What is the main accountability of a Project Manager in Scrum?","type":"multiple-choice","options":[{"text":"Supporting the Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Tracking the progress of a Release.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"There are no Project Managers in Scrum.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Managing Risks.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>There are no Project Managers in Scrum.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>Scrum defines three specific accountabilities within the Scrum Team: the Developers, the Product Owner, and the Scrum Master.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #164."},{"query":"What does a burn-down chart measure in a project?","type":"multiple-choice","options":[{"text":"Work remaining across time.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Business value delivered by the team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Budget remaining across time.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Work remaining across time.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 8):\u003c/strong> \u003cq>While proven useful, these do not replace the importance of empiricism.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 8):\u003c/strong> \u003cq>In complex environments, what will happen is unknown.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Burn-down charts are an optional forecasting practice, not a required Scrum artifact.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #165."},{"query":"What may happen if the Scrum Teams composition changes during the project?","type":"multiple-choice","options":[{"text":"The productivity will increase due to new ideas.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The roles are clearly defined – nothing will happen.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Often a short-term reduction in productivity can be seen.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Often a short-term reduction in productivity can be seen.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning the members have all the skills necessary to create value each Sprint.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>typically 10 or fewer people.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Scrum does not guarantee a particular productivity outcome from membership changes.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #166."},{"query":"True or False: Scrum can only be used to develop products, not to maintain/sustain existing ones.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>from stakeholder collaboration, verification, maintenance, operation, experimentation, research and development, and anything else that might be required.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #184."},{"query":"How should the Developers react, when they realize that they have overcommitted themselves in a Sprint?","type":"multiple-choice","options":[{"text":"They should collaborate with the Product Owner and decide together how to adjust the Sprint Backlog.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"They should ask the Scrum Master to cancel the Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"They should keep this information to themselves until the next Sprint Review.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>They should collaborate with the Product Owner and decide together how to adjust the Sprint Backlog.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>Scope may be clarified and renegotiated with the Product Owner as more is learned.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Goal (p. 11):\u003c/strong> \u003cq>The Sprint Goal is the single objective for the Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint, Sprint Goal; original PSPO question #167."},{"query":"Which statements about the Product Backlog are correct?","type":"multiple-choice","options":[{"text":"The Product Backlog contains only items that are completely refined.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"In the Product Backlog, Items at the top are usually smaller than on the bottom.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Backlog is never baselined.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner is accountable for the Product Backlog.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>In the Product Backlog, Items at the top are usually smaller than on the bottom.\u003c/li>\u003cli>The Product Backlog is never baselined.\u003c/li>\u003cli>The Product Owner is accountable for the Product Backlog.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>This is an ongoing activity to add details, such as a description, order, and size.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>The Product Backlog is an emergent, ordered list\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #168."},{"query":"Which of the following statements are correct about \"technical debt\"?","type":"multiple-choice","options":[{"text":"If you have a high level of \"technical debt\", it could lead to false assumptions about the current state of the system.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"If you have \"technical debt\", no further features should be developed until the \"technical debt\" is fixed.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It creates uncertainty, because when you add more and more features more and more problems will occur.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"It is the task of the Product Owner to take it into account during the release planning.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>If you have a high level of &quot;technical debt&quot;, it could lead to false assumptions about the current state of the system.\u003c/li>\u003cli>It creates uncertainty, because when you add more and more features more and more problems will occur.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Transparency (p. 3):\u003c/strong> \u003cq>The emergent process and work must be visible to those performing the work as well as those receiving the work.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Technical debt is not formally defined in the Scrum Guide; the transparency and quality rules are relevant.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Transparency, Definition of Done; original PSPO question #169."},{"query":"True or False: The Scrum Master can decide which Scrum Events are required in the Scrum project.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — End Note (p. 13):\u003c/strong> \u003cq>The Scrum framework, as outlined herein, is immutable.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: End Note; original PSPO question #186."},{"query":"The Developers have some trouble to understand a Sprint Backlog item – what should they do?","type":"multiple-choice","options":[{"text":"Ask the Scrum Master to explain it to them.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Don't touch the item until the Sprint Review to discuss it with the Product Owner again.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Collaborate with the Product Owner immediately to receive a better understanding.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Collaborate with the Product Owner immediately to receive a better understanding.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>Scope may be clarified and renegotiated with the Product Owner as more is learned.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #170."},{"query":"What kind of testing should be done during the Sprint?","type":"multiple-choice","options":[{"text":"Test Driven Development.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Acceptance Tests.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Unit Tests.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"All kind of test required to create a working Increment.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>All kind of test required to create a working Increment.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Developers are required to conform to the Definition of Done.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #171."},{"query":"Which Scrum accountability consists of people committed to creating any aspect of a usable Increment each Sprint? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Developers.","explanation":"The 2020 Guide defines Developers as the people committed to creating any aspect of a usable Increment each Sprint.","correct":true},{"text":"The Product Owner.","explanation":"The Product Owner is accountable for maximizing product value and effective Product Backlog management.","correct":false},{"text":"The Scrum Master.","explanation":"The Scrum Master is accountable for establishing Scrum and enabling Scrum Team effectiveness.","correct":false},{"text":"The stakeholders.","explanation":"Stakeholders can collaborate with the Scrum Team, but they are not one of its three accountabilities.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>The whole Scrum Team is accountable for a valuable, useful Increment; this question asks which accountability performs the work.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #172."},{"query":"True or False: When n Scrum teams are working on a product, there are n Sprint Backlogs but only 1 Product Backlog.","type":"multiple-choice","options":[{"text":"True.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"False.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>Therefore, they should share the same Product Goal, Product Backlog, and Product Owner.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Backlog (p. 11):\u003c/strong> \u003cq>The Sprint Backlog is a plan by and for the Developers.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team, Sprint Backlog; original PSPO question #188."},{"query":"Yes or No: The Product Owner can ask a developer to order the Product Backlog Items instead of him/her – is that okay?","type":"multiple-choice","options":[{"text":"Yes.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"No.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Yes.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>The Product Owner may do the above work or may delegate the responsibility to others.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #174."},{"query":"Which accountability in Scrum is responsible for explaining the items of the Product Backlog?","type":"multiple-choice","options":[{"text":"The Developer.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Requirements Engineer.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Project Manager.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Owner.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Creating and clearly communicating Product Backlog items;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #175."},{"query":"Which two of the following services are expected from a Scrum Master to a Product Owner?","type":"multiple-choice","options":[{"text":"The Scrum Master should help the Product Owner to find techniques for managing the Product Backlog.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Scrum Master should help the Product Owner to do the documentation.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master should remove impediments for the Scrum Team (incl. Product Owner).","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Scrum Master should act as a \"middleman\" between the Product Owner and the Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The Scrum Master should help the Product Owner to find techniques for managing the Product Backlog.\u003c/li>\u003cli>The Scrum Master should remove impediments for the Scrum Team (incl. Product Owner).\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Master (p. 7):\u003c/strong> \u003cq>Helping find techniques for effective Product Goal definition and Product Backlog management;\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Master (p. 6):\u003c/strong> \u003cq>Causing the removal of impediments to the Scrum Team’s progress;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Master; original PSPO question #176."},{"query":"True or False: Sprint Review is not a formal meeting.","type":"multiple-choice","options":[{"text":"True.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"False.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The purpose of the Sprint Review is to inspect the outcome of the Sprint and determine future adaptations.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Guide designates the Sprint Review a formal event, while describing it as a working session rather than a presentation.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Review; original PSPO question #189."},{"query":"Which of the following are benefits of self-managing teams?","type":"multiple-choice","options":[{"text":"Increase of predictability.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Increase of respect.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Increase of individual buy-in.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Increase of creativity.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Increase of individual buy-in.\u003c/li>\u003cli>Increase of creativity.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning they internally decide who does what, when, and how.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> These are possible benefits of self-management, not outcomes guaranteed by the Guide.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #178."},{"query":"When can a Sprint be cancelled?","type":"multiple-choice","options":[{"text":"When the Sprint Goal becomes obsolete.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"When the Developers are asking the Product Owner to do it.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"When the Business Analyst is asking the Product Owner to do it.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"When the Sprint Goal becomes obsolete and no items are \"Done\" yet.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>When the Sprint Goal becomes obsolete.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 8):\u003c/strong> \u003cq>Only the Product Owner has the authority to cancel the Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #179."},{"query":"If the Product Owner has concerns about the Definition of Done (DoD) – what should the Product Owner do?","type":"multiple-choice","options":[{"text":"The Product Owner should discuss the Definition of Done with the Developers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner should change the Definition of Done.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner should ask the Scrum Master to change the Definition of Done.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Owner should discuss the Definition of Done with the Developers.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #180."},{"query":"True or False: When 3 products are developed using Scrum, there can be only a single Product Owner for all products.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>The Product Owner is one person, not a committee.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Scrum Guide requires one Product Owner for a product; it does not prohibit one person from serving as Product Owner for multiple products.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #192."},{"query":"Which of the following are not required by Scrum?","type":"multiple-choice","options":[{"text":"Using User Stories.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Have a Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Answering the \"three questions\" in the Daily Scrums.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Having time boxed Scrum Events.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Have a Sprint Backlog.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Using the concept of Story Points.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Using User Stories.\u003c/li>\u003cli>Answering the &quot;three questions&quot; in the Daily Scrums.\u003c/li>\u003cli>Using the concept of Story Points.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Definition (p. 3):\u003c/strong> \u003cq>Various processes, techniques and methods can be employed within the framework.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Definition (p. 3):\u003c/strong> \u003cq>The Scrum framework is purposefully incomplete, only defining the parts required to implement Scrum theory.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Guide does not prescribe User Stories, Story Points, or a three-question Daily Scrum format.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Definition; original PSPO question #181."},{"query":"What does it mean for a Scrum Team to be cross-functional? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Scrum Team collectively has all the skills necessary to create value each Sprint.","explanation":"The 2020 Guide defines cross-functional Scrum Teams as collectively having all the skills needed to create value each Sprint.","correct":true},{"text":"Every individual Developer must possess every skill used to build the product.","explanation":"Cross-functionality describes the team as a whole rather than every individual possessing all skills.","correct":false},{"text":"The Scrum Team relies on separate specialist sub-teams for development, testing, and integration.","explanation":"The 2020 Guide specifies no sub-teams or hierarchies within the Scrum Team.","correct":false},{"text":"The Scrum Team must contain an equal number of people from each department.","explanation":"Scrum defines no staffing quotas by organizational department.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Team collectively has all the skills necessary to create value each Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning the members have all the skills necessary to create value each Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Focus on the collective capability of the team, not identical individual skills or formal job titles.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #182."},{"query":"Which two of the following answers are not correct about the Product Owner accountability?","type":"multiple-choice","options":[{"text":"The Product Owner decides which developer does what.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner has to participate in the Daily Scrum.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner measures the progress of a release.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner is responsible for maximizing the value.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The Product Owner decides which developer does what.\u003c/li>\u003cli>The Product Owner has to participate in the Daily Scrum.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning they internally decide who does what, when, and how.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>for the Developers of the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team, Daily Scrum; original PSPO question #183."},{"query":"True or False: When two Scrum Teams are working on the same product you should normalize their estimations to be able to compare their performance.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 11):\u003c/strong> \u003cq>The Developers who will be doing the work are responsible for the sizing.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>How this is done may vary widely across organizations, Scrum Teams, and individuals.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Guide does not require estimates to be normalized for comparing teams.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog, Product Owner; original PSPO question #197."},{"query":"What can be done to reduce technical debt?","type":"multiple-choice","options":[{"text":"Improve the Definition of Done.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Include external QA.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Have hardening Sprints.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Improve the Definition of Done.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>Quality does not decrease;\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Improving the Definition of Done may help address quality-related debt, but the Guide does not prescribe a technical-debt reduction method.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done, The Sprint; original PSPO question #185."},{"query":"Which of the following is not a feedback loop in Scrum?","type":"multiple-choice","options":[{"text":"The Sprint Review.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Sprint Planning.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Backlog Grooming.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Daily Scrum.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Backlog Grooming.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>Product Backlog refinement is the act of breaking down and further defining Product Backlog items into smaller more precise items.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Events (p. 7):\u003c/strong> \u003cq>Each event in Scrum is a formal opportunity to inspect and adapt Scrum artifacts.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Product Backlog refinement is ongoing activity, not one of the five formal Scrum events.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog, Scrum Events; original PSPO question #187."},{"query":"When is it allowed for a Scrum Master to cancel a Sprint?","type":"multiple-choice","options":[{"text":"When the Sprint Goal is obsolete.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"When the Developers ask the Scrum Master to do so.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master does not have the authority to do this.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Master does not have the authority to do this.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 8):\u003c/strong> \u003cq>Only the Product Owner has the authority to cancel the Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #190."},{"query":"True or False: The Product Owner can nominate a \"Lead Developer\" as a single point of contact.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>Within a Scrum Team, there are no sub-teams or hierarchies. It is a cohesive unit of professionals focused on one objective at a time, the Product Goal.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning they internally decide who does what, when, and how.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Scrum prescribes no Lead Developer accountability or hierarchy; teams may still agree on communication practices.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #199."},{"query":"What happens usually between a Sprint Retrospective and the next Sprint Planning?","type":"multiple-choice","options":[{"text":"User Story \"grooming\".","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Nothing!","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Product Backlog Refinement.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Nothing!\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>A new Sprint starts immediately after the conclusion of the previous Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #191."},{"query":"Which of the following is correct about the Product Vision?","type":"multiple-choice","options":[{"text":"It is an old concept and overall not recommended.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It helps the Product Owner to decide when the product is releasable.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It gives an overall direction to all Sprints, makes it easier to prioritize Product Backlog Items and helps the team to stay focused.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>It gives an overall direction to all Sprints, makes it easier to prioritize Product Backlog Items and helps the team to stay focused.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Goal (p. 11):\u003c/strong> \u003cq>The Product Goal describes a future state of the product which can serve as a target for the Scrum Team to plan against.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Goal (p. 11):\u003c/strong> \u003cq>The Sprint Goal is the single objective for the Sprint.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The 2020 Guide defines the Product Goal; it does not prescribe a separate artifact named Product Vision.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Goal, Sprint Goal; original PSPO question #193."},{"query":"Which statement describes best how the Product Backlog is impacted by changes in the product environment?","type":"multiple-choice","options":[{"text":"The Product Backlog should always follow the Product Owners plan and should not reflect the changes at all.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Backlog should be very high level and therefore tolerate such changes.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Backlog should evolve and reflect the environment changes.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Backlog should evolve and reflect the environment changes.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>The Product Backlog is an emergent, ordered list\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #194."},{"query":"True or False: Two Scrum Teams are working on the same product. Do they have to share the same Definition of Ready?","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Definition (p. 3):\u003c/strong> \u003cq>Various processes, techniques and methods can be employed within the framework.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Guide does not prescribe a Definition of Ready, shared or otherwise.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog, Scrum Definition; original PSPO question #204."},{"query":"What does a Product Owner do in the Scrum Event Sprint Retrospective?","type":"multiple-choice","options":[{"text":"Answering the questions of the Developers and Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner does not have the permission to attend the meeting.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Participate as a Scrum Team member.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Participate as a Scrum Team member.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The Scrum Team consists of one Scrum Master, one Product Owner, and Developers.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team, Sprint Retrospective; original PSPO question #195."},{"query":"Which three practices would conflict with Scrum as defined in the 2020 Scrum Guide? (choose three)","type":"multiple-choice","options":[{"text":"Assigning two people jointly to the Product Owner accountability for one Scrum Team.","explanation":"The Product Owner is one person, not a committee; Scrum defines one Product Owner accountability in a Scrum Team.","correct":true},{"text":"Using a preparatory “Sprint 0” that replaces a normal Sprint and produces no valuable, useful Increment.","explanation":"The Guide requires a valuable, useful Increment every Sprint; using a setup-only phase in place of a real Sprint conflicts with that requirement.","correct":true},{"text":"Using a separate “Release Sprint” only to integrate and verify work left unfinished in earlier Sprints instead of creating Done Increments each Sprint.","explanation":"Work must meet the Definition of Done to be part of an Increment; dedicated post-development integration in place of Done Increments conflicts with Scrum.","correct":true},{"text":"Writing Product Backlog items as User Stories.","explanation":"Scrum does not mandate or prohibit User Stories as a Product Backlog item format.","correct":false},{"text":"Using Story Points as an optional sizing technique.","explanation":"Scrum does not prescribe a sizing unit, so a team may use Story Points as a complementary technique.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Assigning two people jointly to the Product Owner accountability for one Scrum Team.\u003c/li>\u003cli>Using a preparatory “Sprint 0” that replaces a normal Sprint and produces no valuable, useful Increment.\u003c/li>\u003cli>Using a separate “Release Sprint” only to integrate and verify work left unfinished in earlier Sprints instead of creating Done Increments each Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — End Note (p. 13):\u003c/strong> \u003cq>While implementing only parts of Scrum is possible, the result is not Scrum.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Labels such as “Sprint 0” or “Release Sprint” are not the issue by themselves; failing to create a valuable, usable, Done Increment each Sprint is.\u003c/p>","reference":"2020 Scrum Guide: End Note, Scrum Team; original PSPO question #196."},{"query":"Which statement about the Product Backlog is correct?","type":"multiple-choice","options":[{"text":"The Product Backlog must only contain small, detailed and clearly described items.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master is responsible for managing the Product Backlog.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner is responsible for managing the Product Backlog.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Owner is responsible for managing the Product Backlog.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Ordering Product Backlog items;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #198."},{"query":"True or False: It is not allowed that the Product Owner is a Developer (part of the \"Developers\") at the same time.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>for the Developers of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>If the Product Owner or Scrum Master are actively working on items in the Sprint Backlog, they participate as Developers.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Daily Scrum; original PSPO question #206."},{"query":"Which 3 of the following are time boxed Scrum events?","type":"multiple-choice","options":[{"text":"Sprint Planning.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Sprint Refinement.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Sprint Review.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Daily Scrum.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Sprint Planning.\u003c/li>\u003cli>Sprint Review.\u003c/li>\u003cli>Daily Scrum.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Events (p. 7):\u003c/strong> \u003cq>Each event in Scrum is a formal opportunity to inspect and adapt Scrum artifacts.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Events (p. 7):\u003c/strong> \u003cq>Events are used in Scrum to create regularity and to minimize the need for meetings not defined in Scrum.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Events; original PSPO question #200."},{"query":"Which of the following answers is correct about the Product Owner accountability?","type":"multiple-choice","options":[{"text":"The Product Owner is not part of the Scrum Team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner creates all items in the Product Backlog on his own.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner is responsible to explain Product Backlog Items and to answer questions.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Owner is responsible to explain Product Backlog Items and to answer questions.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Creating and clearly communicating Product Backlog items;\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Regardless, the Product Owner remains accountable.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #201."},{"query":"Which statement is correct about the Sprint Backlog?","type":"multiple-choice","options":[{"text":"It doesn't need to have detail.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It has just enough detail.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"It has all the details.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>It has just enough detail.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Backlog (p. 11):\u003c/strong> \u003cq>It should have enough detail that they can inspect their progress in the Daily Scrum.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Backlog (p. 11):\u003c/strong> \u003cq>The Sprint Backlog is a plan by and for the Developers.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Backlog; original PSPO question #202."},{"query":"True or False: To be self-management means, that it is okay for the Developers to don't do the Daily Scrum.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>The purpose of the Daily Scrum is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, adjusting the upcoming planned work.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Events (p. 7):\u003c/strong> \u003cq>Failure to operate any events as prescribed results in lost opportunities to inspect and adapt.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Daily Scrum, Scrum Events; original PSPO question #207."},{"query":"How much of the overall working time should the Product Owner spend with the Developers?","type":"multiple-choice","options":[{"text":"At least 15% of the time.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"As much as required.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Min. 50% of the time.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>As much as required.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #203."},{"query":"Based on which criteria should the Product Owner order the Product Backlog Items?","type":"multiple-choice","options":[{"text":"Based on size.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Based on value.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Based on risk.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Based on value.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Ordering Product Backlog items;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #205."},{"query":"Which of the following should a Scrum Master do to start a project?","type":"multiple-choice","options":[{"text":"Ask the Lead Developer to explain the IT architecture.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Ask the Developers to introduce themselves to each other and tell about their skills and background.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Ensure, that all team members have a first ticket assigned to them.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Ask the Developers to introduce themselves to each other and tell about their skills and background.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning they internally decide who does what, when, and how.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Master (p. 6):\u003c/strong> \u003cq>The Scrum Master is accountable for the Scrum Team’s effectiveness.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Introductions are a facilitation practice, not a mandated Scrum Master step.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team, Scrum Master; original PSPO question #208."},{"query":"True or False: All items in the Product Backlog have usually the same size.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>This is an ongoing activity to add details, such as a description, order, and size.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>The Product Backlog is an emergent, ordered list\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #209."},{"query":"Which statements describe best what happens in an organization if Scrum is introduced but the Scrum terminology is tailored to fit into the organizations environment?","type":"multiple-choice","options":[{"text":"The change might be not obvious to everyone and therefore little change will happen.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The organization will adapt the Scrum concepts faster due to the tailored approach.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The management may feel less enthusiastic about the new approach.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The change might not be obvious to every employee and some employees will not recognize it at all.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The change might be not obvious to everyone and therefore little change will happen.\u003c/li>\u003cli>The management may feel less enthusiastic about the new approach.\u003c/li>\u003cli>The change might not be obvious to every employee and some employees will not recognize it at all.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — End Note (p. 13):\u003c/strong> \u003cq>The Scrum framework, as outlined herein, is immutable.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — End Note (p. 13):\u003c/strong> \u003cq>While implementing only parts of Scrum is possible, the result is not Scrum.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> This is an assessment of likely consequences, not a result guaranteed by the Scrum Guide.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: End Note; original PSPO question #212."},{"query":"Which Scrum accountabilities have to attend the Daily Scrum?","type":"multiple-choice","options":[{"text":"The Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Project Manager.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Business Analyst.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>for the Developers of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>The purpose of the Daily Scrum is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, adjusting the upcoming planned work.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Daily Scrum; original PSPO question #213."},{"query":"The Developers have an internal conflict with one of the team members. What should the Product Owner do?","type":"multiple-choice","options":[{"text":"Remove the Developer from the team?","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Ask the Scrum Master to remove the Developer from the Team?","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Let the team handle the conflict internally – they are self-managing!","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Let the team handle the conflict internally – they are self-managing!\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning they internally decide who does what, when, and how.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>Scrum defines three specific accountabilities within the Scrum Team: the Developers, the Product Owner, and the Scrum Master.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #214."},{"query":"True or False: Does a Product Backlog Item have an item \"Owner\".","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>The Product Owner is one person, not a committee.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>The Product Owner may do the above work or may delegate the responsibility to others.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Guide establishes one Product Owner for the Product Backlog, not a mandatory individual owner per item.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #210."},{"query":"Which statement best describes the purpose of the Sprint Review in the 2020 Scrum Guide? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Scrum Team and stakeholders inspect the Sprint outcome, discuss progress toward the Product Goal, and determine future adaptations.","explanation":"The Guide defines the Sprint Review as inspecting the outcome and determining future adaptations, including discussion of progress toward the Product Goal.","correct":true},{"text":"The Product Owner formally accepts or rejects each Developer's work before any value can be released.","explanation":"The Sprint Review is not an acceptance gate or a prerequisite for releasing an Increment.","correct":false},{"text":"The Scrum Master evaluates individual Developer productivity and reports it to management.","explanation":"The Sprint Review is a collaborative working session, not an individual performance review.","correct":false},{"text":"The Scrum Team presents completed features without discussing changes or future work.","explanation":"The Guide says the event should not be limited to a presentation and emphasizes adapting to new opportunities.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Team and stakeholders inspect the Sprint outcome, discuss progress toward the Product Goal, and determine future adaptations.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The purpose of the Sprint Review is to inspect the outcome of the Sprint and determine future adaptations.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The Scrum Team presents the results of their work to key stakeholders and progress toward the Product Goal is discussed.\u003c/q>\u003c/p>","tip":"\u003cp>The Sprint Review is a working session with stakeholders for inspection and future adaptation.\u003c/p>","reference":"2020 Scrum Guide: Sprint Review; original PSPO question #215."},{"query":"Which two of the following contribute the most to the Scrum Value \"Focus\"?","type":"multiple-choice","options":[{"text":"Having a Burn-Down-Chart.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Having a Sprint Goal.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Using Story Points.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Having time boxed events.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Having a Sprint Goal.\u003c/li>\u003cli>Having time boxed events.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Goal (p. 11):\u003c/strong> \u003cq>The Sprint Goal is the single objective for the Sprint.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Values (p. 4):\u003c/strong> \u003cq>Commitment, Focus, Openness, Respect, and Courage\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Goal, Scrum Values; original PSPO question #218."},{"query":"Who is required to attend the Daily Scrum?","type":"multiple-choice","options":[{"text":"The Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Project Lead.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Scrum Master","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>for the Developers of the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Daily Scrum; original PSPO question #219."},{"query":"True or False: The Product Owner is not part of the Scrum Team.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The Scrum Team consists of one Scrum Master, one Product Owner, and Developers.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>Scrum defines three specific accountabilities within the Scrum Team: the Developers, the Product Owner, and the Scrum Master.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #211."},{"query":"How much time is needed between a Sprint Retrospective and the next Sprint Planning to prepare the Product Backlog?","type":"multiple-choice","options":[{"text":"As much as defined by the Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"As much as it is needed.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"None.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>None.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>A new Sprint starts immediately after the conclusion of the previous Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #220."},{"query":"Which of the following best describes the Scrum Pillar \"Transparency\"?","type":"multiple-choice","options":[{"text":"The whole process should be visible to everyone.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The process should be visible to the key stakeholders.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Significant aspect of the process must be visible to those responsible for the outcome.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Significant aspect of the process must be visible to those responsible for the outcome.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Transparency (p. 3):\u003c/strong> \u003cq>The emergent process and work must be visible to those performing the work as well as those receiving the work.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Inspection (p. 4):\u003c/strong> \u003cq>The Scrum artifacts and the progress toward agreed goals must be inspected frequently and diligently to detect potentially undesirable variances or problems.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Transparency, Inspection; original PSPO question #221."},{"query":"Which of the following are Scrum Values?","type":"multiple-choice","options":[{"text":"Respect.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Focus.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Inspection.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Collaboration.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Commitment.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Maximize Value.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Courage.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Openness.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Respect.\u003c/li>\u003cli>Focus.\u003c/li>\u003cli>Commitment.\u003c/li>\u003cli>Courage.\u003c/li>\u003cli>Openness.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Values (p. 4):\u003c/strong> \u003cq>Commitment, Focus, Openness, Respect, and Courage\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Values; original PSPO question #223."},{"query":"True or False: In each Sprint Backlog at least one high priority process improvement items is existing.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>They may even be added to the Sprint Backlog for the next Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Retrospective; original PSPO question #216."},{"query":"Which Scrum accountability is owning the Sprint Backlog?","type":"multiple-choice","options":[{"text":"The Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Backlog (p. 11):\u003c/strong> \u003cq>The Sprint Backlog is a plan by and for the Developers.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Backlog; original PSPO question #226."},{"query":"Which of the following are mandatory in Scrum?","type":"multiple-choice","options":[{"text":"Do Sprint Plannings.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Do Daily Scrums.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Have a Product Owner.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Use Story Points.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Use User Stories.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Do Sprint Plannings.\u003c/li>\u003cli>Do Daily Scrums.\u003c/li>\u003cli>Have a Product Owner.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Events (p. 7):\u003c/strong> \u003cq>Each event in Scrum is a formal opportunity to inspect and adapt Scrum artifacts.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The Scrum Team consists of one Scrum Master, one Product Owner, and Developers.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Events, Scrum Team; original PSPO question #227."},{"query":"The collaboration between the Developers and the Product Owner is very important for the product. Which of the following is the least productive way for the Scrum Master to improve this collaboration?","type":"multiple-choice","options":[{"text":"The Scrum Master should act as a go-between for them.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Scrum Master should teach them techniques to improve it.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master should suggest new collaboration tools.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Master should act as a go-between for them.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Master (p. 7):\u003c/strong> \u003cq>Facilitating stakeholder collaboration as requested or needed.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 8):\u003c/strong> \u003cq>This resulting plan is created by the collaborative work of the entire Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Master, Sprint Planning; original PSPO question #229."},{"query":"True or False: The Definition of Ready shows the team when Product Backlog Items are ready to be selected for the Sprint Backlog.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Pla
