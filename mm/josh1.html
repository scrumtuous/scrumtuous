nning event.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Definition (p. 3):\u003c/strong> \u003cq>Various processes, techniques and methods can be employed within the framework.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Guide does not define a mandatory Definition of Ready; it instead describes when a PBI is ready for selection.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog, Scrum Definition; original PSPO question #217."},{"query":"Which Scrum Event can be compared to the use of a \"lessons learned meeting\"?","type":"multiple-choice","options":[{"text":"The Sprint Review.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Daily Scrum.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Sprint Retrospective.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Sprint Planning.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Sprint Retrospective.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The Scrum Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Retrospective; original PSPO question #230."},{"query":"In the middle of the Sprint, the customer decides that there are two new features she wants. The Product Owner could: (choose the best two answers)","type":"multiple-choice","options":[{"text":"Ask the Developers to consider whether they can add these features to the current Sprint without endangering the Sprint Goal.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Introduce these features at the next Daily Scrum.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Have the Scrum Master add these features to the current Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Add these features to the Product Backlog.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Ask the Developers to consider whether they can add these features to the current Sprint without endangering the Sprint Goal.\u003c/li>\u003cli>Add these features to the Product Backlog.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>Scope may be clarified and renegotiated with the Product Owner as more is learned.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Goal (p. 11):\u003c/strong> \u003cq>The Sprint Goal is the single objective for the Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint, Sprint Goal; original PSPO question #232."},{"query":"Developers are self-managing, which of the following do they manage? (choose the best answer)","type":"multiple-choice","options":[{"text":"Product Backlog ordering.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"When to release, based on its progress.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Sprint Backlog.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Stakeholders for the Sprint Review.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Sprint length.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Sprint Backlog.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Backlog (p. 11):\u003c/strong> \u003cq>The Sprint Backlog is a plan by and for the Developers.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Backlog; original PSPO question #233."},{"query":"True or False: The Product Backlog is baselined before the Sprint 0.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>The Product Backlog is an emergent, ordered list\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>All the work necessary to achieve the Product Goal, including Sprint Planning, Daily Scrums, Sprint Review, and Sprint Retrospective, happen within Sprints.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog, The Sprint; original PSPO question #222."},{"query":"When the Developers determine that they will not be able to finish the complete forecast, who needs to be present when reviewing and adjusting the Sprint work selected? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Scrum Master and the Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner and all stakeholders.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner and the Developers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Scrum Master project manager and the Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Owner and the Developers.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>Scope may be clarified and renegotiated with the Product Owner as more is learned.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #234."},{"query":"A Scrum Team is a cohesive unit of professionals that consists of which of the following? (choose all that apply)","type":"multiple-choice","options":[{"text":"Developers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"One Product Owner.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Users.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"One Scrum Master.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Customers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Developers.\u003c/li>\u003cli>One Product Owner.\u003c/li>\u003cli>One Scrum Master.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The Scrum Team consists of one Scrum Master, one Product Owner, and Developers.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>Scrum defines three specific accountabilities within the Scrum Team: the Developers, the Product Owner, and the Scrum Master.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #235."},{"query":"Which of the following is required by Scrum? (choose the best answer)","type":"multiple-choice","options":[{"text":"Sprint Retrospective.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Developers must stand up at the Daily Scrum.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Sprint Burndown Chart.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Release Planning.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"All of the above.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Sprint Retrospective.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Events (p. 7):\u003c/strong> \u003cq>Failure to operate any events as prescribed results in lost opportunities to inspect and adapt.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Retrospective, Scrum Events; original PSPO question #236."},{"query":"True or False: Self-management means, that the team can decide which Scrum events are needed.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — End Note (p. 13):\u003c/strong> \u003cq>The Scrum framework, as outlined herein, is immutable.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: End Note; original PSPO question #224."},{"query":"A Scrum Master is working with a Scrum Team that has Developers in different physical locations. The Developers meet in a variety of meeting rooms and have much to do logistically (for example: reserve meeting rooms and set up conference calls) before the Daily Scrum. What action should the Scrum Master take? (choose the best answer)","type":"multiple-choice","options":[{"text":"Set up the meeting and tell the Scrum Team that is how it will be done.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Allow the Developers to self-manage and determine for themselves what to do.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Inform management and ask them to solve it.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Ask the Developers to alternate who is responsible for meeting setup.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Allow the Developers to self-manage and determine for themselves what to do.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning they internally decide who does what, when, and how.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>for the Developers of the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team, Daily Scrum; original PSPO question #237."},{"query":"What does it mean for a Scrum Team to be cross-functional? (choose the best answer)","type":"multiple-choice","options":[{"text":"Developers on the Scrum Team work closely with business analysts, architects, developers, and testers who are not on the team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Team includes skilled individuals who together have all the skills necessary to create value each Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Scrum Team is a virtual team drawing from separate teams of business analysts, architects, developers, and testers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Team includes not only developers but also business analysts, architects, and testers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Team includes skilled individuals who together have all the skills necessary to create value each Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning the members have all the skills necessary to create value each Sprint.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #238."},{"query":"When multiple Scrum Teams are working on the same product, should all of their Increments be integrated every Sprint? (choose the best answer)","type":"multiple-choice","options":[{"text":"Yes, but only for Scrum Teams whose work has dependencies.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Yes, in order to accurately inspect what is done.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"No, that's far too hard and must be done in a hardening Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"No, each Scrum Team stands alone.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Yes, in order to accurately inspect what is done.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Increment (p. 11):\u003c/strong> \u003cq>Each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Increment (p. 11):\u003c/strong> \u003cq>In order to provide value, the Increment must be usable.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Increment; original PSPO question #239."},{"query":"True or False: Following Scrum, there can be a maximum of one release per Sprint.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Increment (p. 12):\u003c/strong> \u003cq>Multiple Increments may be created within a Sprint.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Increment (p. 12):\u003c/strong> \u003cq>The Sprint Review should never be considered a gate to releasing value.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Increment; original PSPO question #225."},{"query":"Which statement best describes a Product Owner's responsibility? (choose the best answer)","type":"multiple-choice","options":[{"text":"Optimizing the value of the work the Scrum Team does.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Keep stakeholders from distracting the Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Directing the Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Ensuring that the work meets the commitments to the stakeholders.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Optimizing the value of the work the Scrum Team does.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Ordering Product Backlog items;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #240."},{"query":"Which two things should the Scrum Team do during the first Sprint? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Make up a plan for the rest of the project.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Create at least one valuable, useful Increment.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Build at least one piece of valuable functionality.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Define the major product features and a release plan architecture.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Analyze, describe, and document the requirements for the subsequent Sprints.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Create at least one valuable, useful Increment.\u003c/li>\u003cli>Build at least one piece of valuable functionality.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Increment (p. 12):\u003c/strong> \u003cq>Work cannot be considered part of an Increment unless it meets the Definition of Done.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team, Increment; original PSPO question #241."},{"query":"What is the timebox for the Sprint Planning event? (choose the best answer)","type":"multiple-choice","options":[{"text":"Whenever it is done.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Monthly.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"4 hours for a one-month Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"8 hours for a one-month Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>8 hours for a one-month Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 9):\u003c/strong> \u003cq>Sprint Planning is timeboxed to a maximum of eight hours\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 8):\u003c/strong> \u003cq>This resulting plan is created by the collaborative work of the entire Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Planning; original PSPO question #242."},{"query":"True or False: The Scrum Master can decide which Scrum Artifacts are required in the Scrum project.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — End Note (p. 13):\u003c/strong> \u003cq>The Scrum framework, as outlined herein, is immutable.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — End Note (p. 13):\u003c/strong> \u003cq>While implementing only parts of Scrum is possible, the result is not Scrum.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: End Note; original PSPO question #228."},{"query":"Who owns the Sprint Backlog? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Backlog (p. 11):\u003c/strong> \u003cq>The Sprint Backlog is a plan by and for the Developers.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Backlog (p. 11):\u003c/strong> \u003cq>It should have enough detail that they can inspect their progress in the Daily Scrum.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Backlog; original PSPO question #243."},{"query":"Which of the following are appropriate topics for discussion during a Sprint Retrospective? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Documenting acceptance criteria for items in the next Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The order of items in the Product Backlog.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Identifying high priority process improvements for the next Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"How the team collaborates.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Identifying high priority process improvements for the next Sprint.\u003c/li>\u003cli>How the team collaborates.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The Scrum Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The most impactful improvements are addressed as soon as possible.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Retrospective; original PSPO question #244."},{"query":"What is the Product Owner responsible for during the Sprint Retrospective? (choose the best answer)","type":"multiple-choice","options":[{"text":"Participating as a Scrum Team member.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner should not take part in Sprint Retrospective.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Capturing requirements for the Product Backlog.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Summarizing and reporting the discussions to the stakeholders that they represent in the Scrum Team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Participating as a Scrum Team member.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The Scrum Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The Scrum Team consists of one Scrum Master, one Product Owner, and Developers.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Retrospective, Scrum Team; original PSPO question #245."},{"query":"True or False: The Product Backlog should have just enough detail.","type":"multiple-choice","options":[{"text":"True.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"False.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>This is an ongoing activity to add details, such as a description, order, and size.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>The Product Backlog is an emergent, ordered list\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Guide says refinement adds details as needed; it does not impose a universal level of detail.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #231."}];

    const CURRENT_KEY = "josh1PspoReferenced2020Current_v2";
    const HISTORY_KEY = "josh1PspoReferenced2020History_v2";
    const EXAM_NAME = "PSPO Product Owner Exam";

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function isCorrect(question) {
      return question.options.every(option => Boolean(option.selected) === Boolean(option.correct));
    }

    function correctCount(question) {
      return question.options.filter(option => option.correct).length;
    }

    function formatDuration(ms) {
      if (!Number.isFinite(ms) || ms < 0) return "0:00";
      const total = Math.floor(ms / 1000);
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    class ExamQuestion extends HTMLElement {
      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { question, index, total, graded, cheating } = this._state;
        const reveal = graded || cheating;
        const choose = correctCount(question);

        this.innerHTML = `
          <section class="card" aria-labelledby="question-title">
            <div class="card-header">
              <span>Question ${index + 1} of ${total}</span>
              <span>${question.viewed ? "Viewed" : "New"}</span>
            </div>
            <div class="card-body">
              <p class="query" id="question-title"></p>
              <p class="choose-note">Choose ${choose}</p>
              <div class="options"></div>
              ${reveal ? `<div class="answer-panel"><strong>Answer</strong><div class="answer-html"></div></div>` : ""}
            </div>
          </section>
        `;

        this.querySelector(".query").textContent = question.query;
        const options = this.querySelector(".options");

        question.options.forEach((option, optionIndex) => {
          const label = document.createElement("label");
          label.className = "option";
          if (reveal && option.correct) label.classList.add("reveal-correct");
          if (reveal && option.selected && !option.correct) label.classList.add("reveal-wrong-selected");

          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = Boolean(option.selected);
          input.disabled = Boolean(graded);
          input.addEventListener("change", () => {
            this.dispatchEvent(new CustomEvent("option-toggle", {
              bubbles: true,
              detail: { optionIndex }
            }));
          });

          const textWrap = document.createElement("span");
          const text = document.createElement("span");
          text.textContent = option.text;
          textWrap.appendChild(text);

          if (reveal && option.explanation) {
            const explanation = document.createElement("small");
            explanation.textContent = option.explanation;
            textWrap.appendChild(explanation);
          }

          label.append(input, textWrap);
          options.appendChild(label);
        });

        const answer = this.querySelector(".answer-html");
        if (answer) answer.innerHTML = question.answer || "";
      }
    }
    customElements.define("exam-question", ExamQuestion);

    class QuestionJumper extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { questions, current, graded, cheating } = this._state;
        const reveal = graded || cheating;

        this.innerHTML = `
          <section class="card">
            <div class="card-header collapsible-title" role="button" tabindex="0">
              <span>Question Jumper</span>
              <span class="chevron">${this.collapsed ? "▼" : "▲"}</span>
            </div>
            <div class="card-body jumper-body" ${this.collapsed ? 'hidden' : ''}>
              <div class="jumper-grid"></div>
            </div>
          </section>
        `;

        const title = this.querySelector(".collapsible-title");
        const toggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        title.addEventListener("click", toggle);
        title.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });

        const grid = this.querySelector(".jumper-grid");
        questions.forEach((question, index) => {
          const button = document.createElement("button");
          button.className = "jump-btn";
          button.textContent = String(index + 1);
          button.title = question.query;

          if (question.viewed) button.classList.add("viewed");
          if (index === current) button.classList.add("current");

          if (reveal) {
            button.classList.remove("viewed", "current");
            button.classList.add(isCorrect(question) ? "correct" : "incorrect");
            if (index === current) button.style.outline = "3px solid #111827";
          }

          button.addEventListener("click", () => {
            this.dispatchEvent(new CustomEvent("jump", {
              bubbles: true,
              detail: { index }
            }));
          });
          grid.appendChild(button);
        });
      }
    }
    customElements.define("question-jumper", QuestionJumper);

    class ExamHistoryPanel extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        const history = this._state?.history || { exams: [] };
        const exams = Array.isArray(history.exams) ? history.exams : [];

        this.innerHTML = `
          <section class="card">
            <div class="card-header">
              <span class="collapsible-title" role="button" tabindex="0">Exam History</span>
              <div class="control-group">
                <button class="btn-secondary toggle-history">${this.collapsed ? "Show" : "Hide"}</button>
                <button class="btn-danger clear-history" ${exams.length ? "" : "disabled"}>Clear History</button>
              </div>
            </div>
            <div class="card-body history-body" ${this.collapsed ? "hidden" : ""}></div>
          </section>
        `;

        const doToggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        this.querySelector(".toggle-history").addEventListener("click", doToggle);
        this.querySelector(".collapsible-title").addEventListener("click", doToggle);
        this.querySelector(".clear-history").addEventListener("click", () => {
          this.dispatchEvent(new CustomEvent("history-clear", { bubbles: true }));
        });

        const body = this.querySelector(".history-body");
        if (!exams.length) {
          body.innerHTML = `<p class="history-empty">No completed exams are stored on this device.</p>`;
          return;
        }

        [...exams].reverse().forEach((exam, reverseIndex) => {
          const questions = Array.isArray(exam.questions) ? exam.questions : [];
          const score = questions.filter(isCorrect).length;
          const number = exams.length - reverseIndex;
          const finish = Number(exam.finish || exam.completedAt || 0);
          const start = Number(exam.start || 0);
          const stamp = finish ? new Date(finish).toLocaleString() : "Completed exam";
          const duration = finish && start ? formatDuration(finish - start) : "";

          const wrap = document.createElement("div");
          wrap.className = "history-exam";

          const summary = document.createElement("div");
          summary.className = "history-summary";
          summary.innerHTML = `<strong>Attempt ${number}: ${score} / ${questions.length}</strong><span>${stamp}${duration ? ` · ${duration}` : ""}</span>`;
          wrap.appendChild(summary);

          const dots = document.createElement("div");
          dots.className = "history-dots";
          questions.forEach((question, i) => {
            const dot = document.createElement("span");
            dot.className = "history-dot" + (isCorrect(question) ? " correct" : "");
            dot.textContent = String(i + 1);
            dot.title = question.query;
            dots.appendChild(dot);
          });
          wrap.appendChild(dots);
          body.appendChild(wrap);
        });
      }
    }
    customElements.define("exam-history-panel", ExamHistoryPanel);

    class ScrumExamApp extends HTMLElement {
      constructor() {
        super();
        this.state = null;
        this.timerHandle = null;
      }

      connectedCallback() {
        this.load();
        this.addEventListener("option-toggle", e => this.toggleOption(e.detail.optionIndex));
        this.addEventListener("jump", e => this.setCurrentQuestion(e.detail.index));
        this.addEventListener("history-clear", () => this.clearHistory());
        this.render();
        this.timerHandle = setInterval(() => this.updateTimer(), 1000);
      }

      disconnectedCallback() {
        clearInterval(this.timerHandle);
      }

      load() {
        let saved = null;
        try {
          saved = JSON.parse(localStorage.getItem(CURRENT_KEY));
        } catch (_) {}

        if (saved && Array.isArray(saved.questions) && saved.questions.length === QUESTION_BANK.length && !saved.graded) {
          this.state = saved;
        } else {
          const questions = clone(QUESTION_BANK).map(q => ({
            ...q,
            viewed: false,
            options: q.options.map(o => ({ ...o, selected: false }))
          }));
          questions[0].viewed = true;
          this.state = {
            name: EXAM_NAME,
            graded: false,
            start: Date.now(),
            finish: 0,
            questions,
            currentQuestionNumber: 0,
            cheating: new URLSearchParams(location.search).get("page") === "answer"
          };
          this.saveCurrent();
        }
      }

      saveCurrent() {
        if (!this.state.graded) {
          localStorage.setItem(CURRENT_KEY, JSON.stringify(this.state));
        }
      }

      getHistory() {
        try {
          const existing = JSON.parse(localStorage.getItem(HISTORY_KEY));
          if (existing && Array.isArray(existing.exams)) return existing;
        } catch (_) {}
        const history = { name: "Exam History", exams: [] };
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        return history;
      }

      clearHistory() {
        localStorage.setItem(HISTORY_KEY, JSON.stringify({ name: "Exam History", exams: [] }));
        this.render();
      }

      toggleOption(optionIndex) {
        if (this.state.graded) return;
        const q = this.state.questions[this.state.currentQuestionNumber];
        q.options[optionIndex].selected = !q.options[optionIndex].selected;
        q.viewed = true;
        this.saveCurrent();
        this.render();
      }

      setCurrentQuestion(index) {
        const next = Math.max(0, Math.min(index, this.state.questions.length - 1));
        this.state.currentQuestionNumber = next;
        this.state.questions[next].viewed = true;
        this.saveCurrent();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      toggleCheat() {
        this.state.cheating = !this.state.cheating;
        this.saveCurrent();
        this.render();
      }

      grade() {
        if (this.state.graded) return;
        this.state.graded = true;
        this.state.cheating = true;
        this.state.finish = Date.now();

        const history = this.getHistory();
        history.exams.push(clone(this.state));
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        localStorage.removeItem(CURRENT_KEY);
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      restart() {
        localStorage.removeItem(CURRENT_KEY);
        this.load();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      score() {
        return this.state.questions.filter(isCorrect).length;
      }

      answeredCount() {
        return this.state.questions.filter(q => q.options.some(o => o.selected)).length;
      }

      updateTimer() {
        const el = this.querySelector("[data-timer]");
        if (!el || !this.state) return;
        const end = this.state.finish || Date.now();
        el.textContent = formatDuration(end - this.state.start);
      }

      render() {
        if (!this.state) return;
        const qIndex = this.state.currentQuestionNumber;
        const total = this.state.questions.length;
        const answered = this.answeredCount();
        const score = this.score();

        this.innerHTML = `
          <main class="page-shell">
            <header class="hero">
              <div class="hero-top">
                <div>
                  <h1>PSPO Product Owner Exam</h1>
                  <p>245 PSPO questions · 2020 Scrum Guide quotes in answers · true/false evenly spaced</p>
                </div>
                <div class="pill">Elapsed <span data-timer>${formatDuration((this.state.finish || Date.now()) - this.state.start)}</span></div>
              </div>
              <div class="meta-row">
                <span class="pill">${total} questions</span>
                <span class="pill">${answered} answered</span>
                <span class="pill">${this.state.questions.filter(q => q.viewed).length} viewed</span>
                ${this.state.graded ? `<span class="pill">Score ${score} / ${total}</span>` : ""}
              </div>
            </header>

            ${this.state.graded ? `
              <section class="card results">
                <div class="card-body">
                  <strong>Your grade is ${score} out of ${total}.</strong>
                  <div class="status-line">Correct answers and option explanations are now visible. Your completed attempt has been saved to local storage.</div>
                </div>
              </section>
            ` : ""}

            <exam-question></exam-question>

            <div class="controls">
              <div class="control-group">
                <button class="btn-secondary previous" ${qIndex === 0 ? "disabled" : ""}>&lt;&lt; Back</button>
                <button class="btn-primary next" ${qIndex === total - 1 ? "disabled" : ""}>Next &gt;&gt;</button>
              </div>
              <div class="control-group">
                <button class="btn-warning cheat">${this.state.cheating ? "Be Honest" : "Cheat"}</button>
                ${this.state.graded
                  ? `<button class="btn-primary restart">Start New Attempt</button>`
                  : `<button class="btn-primary finish">Finish</button>`}
              </div>
            </div>

            <question-jumper></question-jumper>
            <exam-history-panel></exam-history-panel>

            <p class="footer-note">Progress and completed attempts are stored only in this browser's localStorage.</p>
          </main>
        `;

        const questionEl = this.querySelector("exam-question");
        questionEl.state = {
          question: this.state.questions[qIndex],
          index: qIndex,
          total,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const jumper = this.querySelector("question-jumper");
        jumper.state = {
          questions: this.state.questions,
          current: qIndex,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const history = this.querySelector("exam-history-panel");
        history.state = { history: this.getHistory() };

        this.querySelector(".previous").addEventListener("click", () => this.setCurrentQuestion(qIndex - 1));
        this.querySelector(".next").addEventListener("click", () => this.setCurrentQuestion(qIndex + 1));
        this.querySelector(".cheat").addEventListener("click", () => this.toggleCheat());

        const finish = this.querySelector(".finish");
        if (finish) finish.addEventListener("click", () => this.grade());

        const restart = this.querySelector(".restart");
        if (restart) restart.addEventListener("click", () => this.restart());
      }
    }
    customElements.define("scrum-exam-app", ScrumExamApp);
  </script>
</body>
</html>
