ds to individuals, interactions, processes, tools, and their Definition of Done.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Retrospective; original PSPO question #54."},{"query":"True or False: Dependencies could influence how the Product Owner orders Product Backlog Items.","type":"multiple-choice","options":[{"text":"True.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"False.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Ordering Product Backlog items;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #24."},{"query":"Who has the final decision about the order of items in the Product Backlog? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Scrum Team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Stakeholders.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Owner.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Ordering Product Backlog items;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #56."},{"query":"What are the two primary ways a Scrum Master helps a Scrum Team work at its highest level of productivity? (choose the best two answers)","type":"multiple-choice","options":[{"text":"By ensuring the meetings start and end at the proper time.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"By facilitating Scrum Team decisions.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"By keeping high value features high in the Product Backlog.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"By removing impediments that hinder the Scrum Team.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>By facilitating Scrum Team decisions.\u003c/li>\u003cli>By removing impediments that hinder the Scrum Team.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Master (p. 6):\u003c/strong> \u003cq>Causing the removal of impediments to the Scrum Team’s progress;\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Master (p. 6):\u003c/strong> \u003cq>The Scrum Master is accountable for the Scrum Team’s effectiveness.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Master; original PSPO question #57."},{"query":"During a Sprint, when is new work or further decomposition of work added to the Sprint Backlog? (choose the best answer)","type":"multiple-choice","options":[{"text":"When the Product Owner identifies new work.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"When the Scrum Master has time to enter it.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"As soon as possible after it is identified.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"During the Daily Scrum after the Developers approve it.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>As soon as possible after it is identified.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Backlog (p. 11):\u003c/strong> \u003cq>It should have enough detail that they can inspect their progress in the Daily Scrum.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Backlog; original PSPO question #58."},{"query":"True or False: All planned work for the Product done by the Scrum Team must originate from the Product Backlog.","type":"multiple-choice","options":[{"text":"True.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"False.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>It is the single source of work undertaken by the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #31."},{"query":"The Developers select a set of Product Backlog Items for a Sprint Backlog with the intent to get the selected items done by the end of the Sprint. Which three phrases best describe the purpose of a Definition of Done? (choose the best three answers)","type":"multiple-choice","options":[{"text":"It tracks the percentage complete of a Product Backlog Item.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It defines what it takes for an Increment to be ready for release.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"It creates transparency over the work inspected at the Sprint Review.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"It guides the Developers in creating a forecast at the Sprint Planning.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"It provides a template for elements that need to be included in the documentation.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It controls whether the Developers have performed their tasks.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>It defines what it takes for an Increment to be ready for release.\u003c/li>\u003cli>It creates transparency over the work inspected at the Sprint Review.\u003c/li>\u003cli>It guides the Developers in creating a forecast at the Sprint Planning.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done creates transparency by providing everyone a shared understanding of what work was completed as part of the Increment.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #60."},{"query":"What are three benefits of self-management? (choose the best three answers)","type":"multiple-choice","options":[{"text":"Increased self-accountability.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Increased rule compliance.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Increased creativity.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Increased commitment.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Increased accuracy of estimates.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Increased self-accountability.\u003c/li>\u003cli>Increased creativity.\u003c/li>\u003cli>Increased commitment.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning they internally decide who does what, when, and how.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> These are possible benefits of self-management, not guaranteed outcomes specified by the Guide.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #61."},{"query":"A Product Owner is accountable for maximizing the value of the product that is the result of the work of the Scrum Team. Which of the following can be delegated to others, while the Product Owner remains accountable for the work? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Attending the Sprint Review.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Ordering Product Backlog Items.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Developing and communicating the Product Goal.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Attending the Sprint Retrospective.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Ordering Product Backlog Items.\u003c/li>\u003cli>Developing and communicating the Product Goal.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>The Product Owner may do the above work or may delegate the responsibility to others.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #62."},{"query":"True or False: During the Sprint Review the stakeholder's role is to reorder the Product Backlog.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The Product Backlog may also be adjusted to meet new opportunities.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Review; original PSPO question #33."},{"query":"During a Sprint Retrospective, the Developers propose moving the Daily Scrum to only occur on Tuesdays and Thursdays. Which two are the most appropriate responses for the Scrum Master to recommend? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Consider the request and decide on which days the Daily Scrum should occur.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Coach the team on why the Daily Scrum is important as an opportunity to update the plan.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Acknowledge and support the self-managing team's decision.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Have the Developers vote.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Learn why the Developers want this and work with them to improve the outcome of the Daily Scrum.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Coach the team on why the Daily Scrum is important as an opportunity to update the plan.\u003c/li>\u003cli>Learn why the Developers want this and work with them to improve the outcome of the Daily Scrum.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>The purpose of the Daily Scrum is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, adjusting the upcoming planned work.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Events (p. 7):\u003c/strong> \u003cq>Failure to operate any events as prescribed results in lost opportunities to inspect and adapt.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Daily Scrum, Scrum Events; original PSPO question #63."},{"query":"During the Sprint Retrospective a Scrum Team has identified several high priority process improvements. Which of the following statements is most accurate? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Scrum Team may add the items to the Sprint Backlog for the next Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Scrum Team should choose at least one high priority process improvement to place in the Product Backlog.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Team should decline to add a process improvement to the Sprint Backlog when things are running smoothly.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master selects the most important process improvement and places it in the Sprint Backlog.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Team may add the items to the Sprint Backlog for the next Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>They may even be added to the Sprint Backlog for the next Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Retrospective; original PSPO question #64."},{"query":"How is management that is external to the Scrum Team involved in the Daily Scrum? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Product Owner represents their opinions.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Managers are not required at the Daily Scrum.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Scrum Master speaks on their behalf.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Management gives an update at the start of each Daily Scrum.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Managers are not required at the Daily Scrum.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>for the Developers of the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Daily Scrum; original PSPO question #65."},{"query":"True or False: A Product Owner can measure success by an increase in the team's velocity.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Velocity is not defined as a value metric by the Scrum Guide.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #34."},{"query":"How much time is required after a Sprint to prepare for the next Sprint? (choose the best answer)","type":"multiple-choice","options":[{"text":"The break between Sprints is timeboxed to one-week for a one-month Sprint, and usually less for shorter Sprints.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Enough time for the requirements for the next Sprint to be determined and documented.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Enough time for the Developers to finish the testing from the last Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"None. A new Sprint starts immediately following the end of the previous Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"All of the above are allowed depending on the situation.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>None. A new Sprint starts immediately following the end of the previous Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>A new Sprint starts immediately after the conclusion of the previous Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #66."},{"query":"How much work is required of the Developers to complete a Product Backlog Item selected during the Sprint Planning? (choose the best answer)","type":"multiple-choice","options":[{"text":"As much as they can fit into the Sprint, with remaining work deferred to the next Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"As much as is required to meet the Scrum Team's Definition of Done.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"All development work and at least some testing.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"A proportional amount of time on analysis, design, development, and testing.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>As much as is required to meet the Scrum Team&#x27;s Definition of Done.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Increment (p. 12):\u003c/strong> \u003cq>Work cannot be considered part of an Increment unless it meets the Definition of Done.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Increment; original PSPO question #67."},{"query":"How often should Scrum Team membership change? (choose the best answer)","type":"multiple-choice","options":[{"text":"Every Sprint to promote shared learning.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"As needed, with no special allowance for changes in productivity.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Never, it reduces productivity.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"As needed, while taking into account a short-term reduction in productivity.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>As needed, while taking into account a short-term reduction in productivity.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning the members have all the skills necessary to create value each Sprint.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning they internally decide who does what, when, and how.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Scrum does not prescribe a team-membership turnover schedule.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #68."},{"query":"True or False: Product Owners must specify complete acceptance criteria for a Product Backlog Item before the Developers can select the item in Sprint Planning.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #44."},{"query":"If Product Backlog Refinement is needed, when is the ideal time for refinement to take place and who should participate? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Business analysts in the organization should do this work for the Scrum Team 1-2 Sprints ahead of the development Sprints.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner must do this as essential work in Sprint 0.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Team on an ongoing basis, defining Product Backlog Items into smaller more precise items that are ready for selection.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Scrum Team during the current Sprint, if they have been unable during preceding Sprints to define Product Backlog Items with enough precision to begin work.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner takes the time between the end of one Sprint and the start of the next Sprint to complete refinement.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The Scrum Team on an ongoing basis, defining Product Backlog Items into smaller more precise items that are ready for selection.\u003c/li>\u003cli>The Scrum Team during the current Sprint, if they have been unable during preceding Sprints to define Product Backlog Items with enough precision to begin work.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>Product Backlog refinement is the act of breaking down and further defining Product Backlog items into smaller more precise items.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>This is an ongoing activity to add details, such as a description, order, and size.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #69."},{"query":"Scrum requires that the Product Owner must use which of the following items? (choose all that apply)","type":"multiple-choice","options":[{"text":"Burndown chart.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Feature burn-up.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Critical Path Analysis.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Project Gantt Chart.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"None of the above.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>None of the above.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Definition (p. 3):\u003c/strong> \u003cq>Various processes, techniques and methods can be employed within the framework.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Scrum Guide permits compatible supplementary techniques rather than requiring any particular tool.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Definition; original PSPO question #70."},{"query":"What are three advantages of a Product Owner sharing a clearly defined Product Goal with the Scrum Team? (choose the best three answers)","type":"multiple-choice","options":[{"text":"It helps the Scrum Team keep focus and they can weigh any decision against the Product Goal.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"It helps the Developers estimate the date that the Product Backlog will be complete.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It is easier to inspect Incremental progress at the Sprint Review.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"It is not mandatory in Scrum. There is no real advantage.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It provides a good overall direction so Sprints will feel less like isolated pieces of work.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>It helps the Scrum Team keep focus and they can weigh any decision against the Product Goal.\u003c/li>\u003cli>It is easier to inspect Incremental progress at the Sprint Review.\u003c/li>\u003cli>It provides a good overall direction so Sprints will feel less like isolated pieces of work.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Goal (p. 11):\u003c/strong> \u003cq>The Product Goal describes a future state of the product which can serve as a target for the Scrum Team to plan against.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Goal (p. 11):\u003c/strong> \u003cq>The Sprint Goal is the single objective for the Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Goal, Sprint Goal; original PSPO question #72."},{"query":"True or False: Sprint Reviews are an opportunity to collect stakeholder feedback.","type":"multiple-choice","options":[{"text":"True.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"False.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The Scrum Team presents the results of their work to key stakeholders and progress toward the Product Goal is discussed.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Review; original PSPO question #50."},{"query":"Which approach is best for Scrum Teams in order to produce valuable Increments? (choose the best answer)","type":"multiple-choice","options":[{"text":"Each Developer works on the component where they feel that they can contribute.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Each Scrum Team is accountable for developing functionality from beginning to end.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Each Scrum Team works on an independent set of components.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Each Scrum Member works only as an independent layer of the system.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Each Scrum Team is accountable for developing functionality from beginning to end.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning the members have all the skills necessary to create value each Sprint.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #73."},{"query":"Who is accountable for managing the progress of work during a Sprint? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The most junior member of the team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Developers (p. 5):\u003c/strong> \u003cq>Adapting their plan each day toward the Sprint Goal;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Developers; original PSPO question #74."},{"query":"Who is part of the discussion about which Product Backlog Items are selected for a Sprint? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Team.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Team.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 8):\u003c/strong> \u003cq>This resulting plan is created by the collaborative work of the entire Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Planning; original PSPO question #75."},{"query":"True or False: The Product Owner makes sure the correct stakeholders are invited to the Sprint Retrospective. They might have important instructions for team improvements.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Retrospective; original PSPO question #55."},{"query":"Why does the Product Owner want the Developers to adhere to its Definition of Done? (choose the best answer)","type":"multiple-choice","options":[{"text":"To predict the teams productivity over time.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"To have complete transparency into what has been done at the end of each Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"To know what the team will deliver over the next three Sprints.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"To be able to reprimand the team when they do not meet their velocity goal for the Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>To have complete transparency into what has been done at the end of each Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done creates transparency by providing everyone a shared understanding of what work was completed as part of the Increment.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #76."},{"query":"Your management has asked you to take the lead in the development of a new product. Six teams new to Scrum will build this product. You have gathered a number of requirements and ideas into an early form of a Product Backlog. How would you minimize dependencies between the Scrum Teams? (choose the best answer)","type":"multiple-choice","options":[{"text":"You work with the Developers on how to best analyze and break apart the work.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"You divide Product Backlog Items among the six Product Owners.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"You create an independent Product Backlog per Scrum Team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"You identify the dependencies and re-order the Product Backlog for the other five Product Owners.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"You raise this as an impediment with the Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>You work with the Developers on how to best analyze and break apart the work.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>Therefore, they should share the same Product Goal, Product Backlog, and Product Owner.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #77."},{"query":"What does it mean to say that an event has a timebox? (choose the best answer)","type":"multiple-choice","options":[{"text":"The event must take at least a minimum amount of time.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The event must happen at a set time.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The event can take no more than a maximum amount of time.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The event must happen by a given time.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The event can take no more than a maximum amount of time.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Events (p. 7):\u003c/strong> \u003cq>Each event in Scrum is a formal opportunity to inspect and adapt Scrum artifacts.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Events; original PSPO question #78."},{"query":"True or False: A high-performance Scrum Team ensures that each Increment is complete by running a Release Sprint.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Increment (p. 12):\u003c/strong> \u003cq>Work cannot be considered part of an Increment unless it meets the Definition of Done.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Increment; original PSPO question #59."},{"query":"Which statement about improving the Definition of Done is consistent with the 2020 Scrum Guide? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Scrum Team inspects the Definition of Done during the Sprint Retrospective and can address valuable improvements as soon as possible.","explanation":"The Sprint Retrospective includes inspecting the Definition of Done, and impactful improvements should be addressed as soon as possible.","correct":true},{"text":"The Definition of Done can only be changed during the Sprint Retrospective.","explanation":"The Sprint Retrospective is an important inspection opportunity, but the Guide does not say it is the only time improvements can occur.","correct":false},{"text":"The Product Owner can lower the Definition of Done whenever it would help more items finish.","explanation":"The Product Owner does not unilaterally lower the Definition of Done; organizational minimum standards still apply and quality does not decrease during a Sprint.","correct":false},{"text":"The Definition of Done should remain unchanged after the first Sprint.","explanation":"The Scrum Team can improve its practices, including the Definition of Done, as it learns.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Team inspects the Definition of Done during the Sprint Retrospective and can address valuable improvements as soon as possible.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The Scrum Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The most impactful improvements are addressed as soon as possible.\u003c/q>\u003c/p>","tip":"\u003cp>The Retrospective explicitly includes the Definition of Done, but Scrum also emphasizes timely adaptation.\u003c/p>","reference":"2020 Scrum Guide: Sprint Retrospective; original PSPO question #80."},{"query":"Why do the Developers need a Sprint Goal? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Developers are more focused with a common yet specific goal.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Sprint Goals are not valuable. Everything is known from the Product Backlog.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"A Sprint Goal only gives purpose to Sprint 0.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Sprint Goal ensures that all of the Product Backlog Items selected for the Sprint are implemented.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers are more focused with a common yet specific goal.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Goal (p. 11):\u003c/strong> \u003cq>The Sprint Goal is the single objective for the Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Goal; original PSPO question #82."},{"query":"Who creates a Product Backlog Item's estimate? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner with input from the Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers after clarifying requirements with the Product Owner.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The most senior people in the organization, including architects and subject matter experts.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers, alone.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers after clarifying requirements with the Product Owner.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 11):\u003c/strong> \u003cq>The Developers who will be doing the work are responsible for the sizing.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #83."},{"query":"True or False: A Product Owner with multiple teams working on one product should maintain separate Product Backlogs for each team.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>Therefore, they should share the same Product Goal, Product Backlog, and Product Owner.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #71."},{"query":"Which topics should be discussed in the Sprint Review? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Scrum process, and how it was used during the Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Coding and engineering practices.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The product Increment.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"All of the above.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The product Increment.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The purpose of the Sprint Review is to inspect the outcome of the Sprint and determine future adaptations.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Review; original PSPO question #85."},{"query":"Five new Scrum Teams have been created to build one product. A few of the Developers on one of the Scrum Teams ask the Scrum Master who will coordinate the work with the other teams. What should the Scrum Master do? (choose the best answer)","type":"multiple-choice","options":[{"text":"Collect the Sprint tasks from the teams at the end of their Sprint Planning and merge that into a consolidated plan for the entire Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Teach them that it is their responsibility to work with the other teams to create an Increment that is inclusive of all five team's work.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Teach the Product Owner to work with the Lead Developer on ordering Product Backlog in a way to avoid too much overlap during a Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Visit the five teams each day to inspect that their Sprint Backlogs are aligned.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Teach them that it is their responsibility to work with the other teams to create an Increment that is inclusive of all five team&#x27;s work.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Increment (p. 11):\u003c/strong> \u003cq>Each Increment is additive to all prior Increments and thoroughly verified, ensuring that all Increments work together.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Increment; original PSPO question #86."},{"query":"What are two responsibilities of Testers in a Scrum Team? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Tracking quality metrics.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Scrum has no \"Tester\" role.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Verifying the work of programmers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers are responsible for quality.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Finding bugs.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Scrum has no &quot;Tester&quot; role.\u003c/li>\u003cli>The Developers are responsible for quality.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Developers (p. 5):\u003c/strong> \u003cq>Instilling quality by adhering to a Definition of Done;\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>Scrum defines three specific accountabilities within the Scrum Team: the Developers, the Product Owner, and the Scrum Master.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Guide has no separate Tester accountability; testing expertise may still exist among Developers.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Developers, Scrum Team; original PSPO question #88."},{"query":"True or False: A Scrum Master fulfills the same role as a traditional Project Manager.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>Scrum defines three specific accountabilities within the Scrum Team: the Developers, the Product Owner, and the Scrum Master.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #79."},{"query":"Which two ways of creating Scrum Teams are consistent with Scrum's values? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Existing teams propose how they would like to go about organizing into the new structure.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Bring all people together and let them organize into Scrum Teams.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Managers personally re-assign current subordinates to new teams.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The chief Product Owner determines the new team structure and assignments.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Managers collaborate to assign individuals into specific teams.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Existing teams propose how they would like to go about organizing into the new structure.\u003c/li>\u003cli>Bring all people together and let them organize into Scrum Teams.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning they internally decide who does what, when, and how.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning the members have all the skills necessary to create value each Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #89."},{"query":"When does the next Sprint begin? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Monday following the Sprint Review.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Immediately after the conclusion of the previous Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Immediately following the next Sprint Planning.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"When the Product Owner is ready.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Immediately after the conclusion of the previous Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>A new Sprint starts immediately after the conclusion of the previous Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #91."},{"query":"What is the accountability of the Product Owner during Sprint 0? (choose the best answer)","type":"multiple-choice","options":[{"text":"There is no such thing as Sprint 0.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Create the overall release plan to ensure that organizational goals are met.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Determine the composition of the Scrum Team to meet the release plan.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Gathering, eliciting and analyzing the requirements to build the Product Backlog.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Make sure enough Product backlog items are refined to fill the first 3 Sprints.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>There is no such thing as Sprint 0.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>All the work necessary to achieve the Product Goal, including Sprint Planning, Daily Scrums, Sprint Review, and Sprint Retrospective, happen within Sprints.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Scrum Guide does not define a special preparatory event named Sprint 0.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint, Scrum Team; original PSPO question #93."},{"query":"True or False: A Product Owner should measure product value by the increase in the team's velocity.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Velocity is not defined as a product-value metric in the Scrum Guide.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #81."},{"query":"Which answer best describes the topics covered in Sprint Planning? (choose the best answer)","type":"multiple-choice","options":[{"text":"Who is the team and what team member roles will be.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"What to do and who will do it.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"What can be done, how to do it, and why to do it.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"What went wrong in the last Sprint and what to do differently this Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"How conditions have changed and how the Product Backlog should evolve.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>What can be done, how to do it, and why to do it.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 8):\u003c/strong> \u003cq>Topic One: Why is this Sprint valuable?\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 8):\u003c/strong> \u003cq>Topic Two: What can be Done this Sprint?\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 8):\u003c/strong> \u003cq>Topic Three: How will the chosen work get done?\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Planning; original PSPO question #95."},{"query":"Which of the following might the Scrum Team discuss during a Sprint Retrospective? (choose the best answer)","type":"multiple-choice","options":[{"text":"Methods of communication.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The way the Scrum Team does Sprint Planning.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Skills needed to improve the Scrum Teams ability to deliver.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Definition of Done.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"All of the above.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>All of the above.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The Scrum Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Retrospective; original PSPO question #96."},{"query":"An organization has decided to adopt Scrum, but management wants to change the terminology to fit with terminology already used. What will likely happen if this is done? (choose the best answer)","type":"multiple-choice","options":[{"text":"Without a new vocabulary as a reminder of the change, very little change may actually happen.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The organization may not understand what has changed with Scrum and the benefits of Scrum may be lost.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Management may feel less anxious.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"All of the above.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>All of the above.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — End Note (p. 13):\u003c/strong> \u003cq>The Scrum framework, as outlined herein, is immutable.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Scrum Guide prescribes its core terminology and framework, but does not predict specific emotional responses to renaming.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: End Note; original PSPO question #97."},{"query":"True or False: Every Scrum Team must have a Product Owner and a Scrum Master.","type":"multiple-choice","options":[{"text":"False, a Scrum Master is only required when asked for by the Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"True, outcomes are affected by their participation and availability.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"True, each must be 100% dedicated to their Scrum Team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False, a Product Owner can be replaced by a Business Analyst among Developer.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True, outcomes are affected by their participation and availability.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The Scrum Team consists of one Scrum Master, one Product Owner, and Developers.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #84."},{"query":"Which three of the following are feedback loops in Scrum? (choose the best three answers)","type":"multiple-choice","options":[{"text":"Release Planning.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Refinement Meeting.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Sprint Retrospective.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Sprint Review.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Daily Scrum.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Sprint Retrospective.\u003c/li>\u003cli>Sprint Review.\u003c/li>\u003cli>Daily Scrum.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Events (p. 7):\u003c/strong> \u003cq>Each event in Scrum is a formal opportunity to inspect and adapt Scrum artifacts.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Events; original PSPO question #98."},{"query":"What happens if the Scrum Team cannot complete its work by the end of the Sprint? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Sprint length is unchanged and the Scrum Team continuously learns and adapts.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Sprint is extended temporarily. Lessons are taken to ensure it does not happen again.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Sprint is extended and future Sprints use this new duration.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Sprint length is unchanged and the Scrum Team continuously learns and adapts.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>They are fixed lengthevents of one month or less to create consistency.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #99."},{"query":"User documentation is part of your Definition of Done. However, there are not enough Technical Writers for all teams. Your Scrum Team does not have a Technical Writer. What should the Scrum Team do? (choose the best answer)","type":"multiple-choice","options":[{"text":"Wait until you have a Technical Writer on your Scrum Team to take care of this.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Let the user documentation remain undone and accumulate until after the last development Sprint. It will then be done by any available Technical Writers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers on the Scrum Team should write the user documentation.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Form a separate team of Technical Writers that will work on an on-demand basis for the various Product Owners. Work order will be first in, first out.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers on the Scrum Team should write the user documentation.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Developers are required to conform to the Definition of Done.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #100."},{"query":"True or False: Cross-functional teams are optimized to work on one component or layer of a system only.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning the members have all the skills necessary to create value each Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #87."},{"query":"The Scrum Master observes the Product Owner is struggling with ordering the Product Backlog. What is an appropriate action for the Scrum Master to take? (choose the best answer)","type":"multiple-choice","options":[{"text":"Present the Product Owner with an ordered Product Backlog to use.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Suggest that the Developers order the Product Backlog to be sure that it is a feasible ordering of work.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Offer the Product Owner help in understanding that the goal of ordering the Product Backlog is to maximize value.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Encourage the Product Owner to work with the Developers to see which items technically are fastest to implement.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Suggest the Product Owner extend the Sprint, so he can have more time to order the Product Backlog.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Offer the Product Owner help in understanding that the goal of ordering the Product Backlog is to maximize value.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Master (p. 7):\u003c/strong> \u003cq>Helping find techniques for effective Product Goal definition and Product Backlog management;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Master; original PSPO question #101."},{"query":"When must the Product Owner be present at the Daily Scrum? (choose the best answer)","type":"multiple-choice","options":[{"text":"When they need to represent the stakeholders' point of view.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"When the Scrum Master asks them to attend.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"When there are impediments to discuss.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"When the Product Owner is actively working on items from the Sprint Backlog.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>When the Product Owner is actively working on items from the Sprint Backlog.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>for the Developers of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>If the Product Owner or Scrum Master are actively working on items in the Sprint Backlog, they participate as Developers.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Daily Scrum; original PSPO question #102."},{"query":"How much of the Sprint Backlog must be defined during the Sprint Planning event? (choose the best answer)","type":"multiple-choice","options":[{"text":"Just enough to understand design and architectural implications.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Just enough tasks for the Scrum Master to be confident in the Developers' understanding of the Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The entire Sprint Backlog must be identified and estimated by the end of Sprint Planning.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Enough so the Developers can create their forecast of what work they can do.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Enough so the Developers can create their forecast of what work they can do.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Backlog (p. 11):\u003c/strong> \u003cq>It should have enough detail that they can inspect their progress in the Daily Scrum.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Backlog (p. 11):\u003c/strong> \u003cq>The Sprint Backlog is composed of the Sprint Goal (why), the set of Product Backlog items selected for the Sprint (what), as well as an actionable plan for delivering the Increment (how).\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Backlog; original PSPO question #103."},{"query":"True or False: The Scrum Team is accountable for creating a valuable Increment every Sprint.","type":"multiple-choice","options":[{"text":"True.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"False.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #90."},{"query":"You are the Scrum Master of a new, to be developed Product. Development is going to require 45 people. What is a good first question for you to suggest the group thinks about when forming into teams? (choose the best answer)","type":"multiple-choice","options":[{"text":"What is the right mixture of senior and junior people on each team?","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"How will we make sure all teams have the right amount of expertise?","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Who are the subject matter experts on each team?","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Who are going to be the team leads?","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>How will we make sure all teams have the right amount of expertise?\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning the members have all the skills necessary to create value each Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #104."},{"query":"What activities would a Product Owner typically undertake in the period between the end of the current Sprint and the start of the next Sprint? (choose the best answer)","type":"multiple-choice","options":[{"text":"There are no such activities, the next Sprint starts immediately after the current Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Update the project plan with stakeholders.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Work with the Quality Assurance departments on the Increment of the current Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Refine the Product Backlog.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>There are no such activities, the next Sprint starts immediately after the current Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>A new Sprint starts immediately after the conclusion of the previous Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #105."},{"query":"Several Sprints into a project, the Product Owner tells the Scrum Master that a key stakeholder just started using the product. The stakeholder is unhappy with the quality of the product. What are two good options for the Scrum Master? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Explain to the Product Owner that it is up to the Developers to decide on acceptable quality standards.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Encourage the Product Owner to put quality specifications on the Product Backlog and express the stakeholder's concern to the Developers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Coach the Product Owner on how to talk with the Developers about this concern.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Bring the concern to the Testers to improve how the Product is verified.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Wait to bring this up until the Sprint Retrospective.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Encourage the Product Owner to put quality specifications on the Product Backlog and express the stakeholder&#x27;s concern to the Developers.\u003c/li>\u003cli>Coach the Product Owner on how to talk with the Developers about this concern.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>from stakeholder collaboration, verification, maintenance, operation, experimentation, research and development, and anything else that might be required.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done, Scrum Team; original PSPO question #106."},{"query":"True or False: An Increment must be released to customers or users at the end of each Sprint.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Increment (p. 12):\u003c/strong> \u003cq>The Sprint Review should never be considered a gate to releasing value.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Increment; original PSPO question #92."},{"query":"As the Developers start work during the Sprint, they realize they have selected too much work to finish the Sprint. What should they do? (choose the best answer)","type":"multiple-choice","options":[{"text":"Inform the Product Owner at the Sprint review, but prior to the demonstration.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Find another Scrum Team to give the excess work to.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Reduce the Definition of Done and get all of the Product Backlog Items done by the new definition.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"As soon as possible in the Sprint, work with the Product Owner to remove some work or Product Backlog Items.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>As soon as possible in the Sprint, work with the Product Owner to remove some work or Product Backlog Items.\u003c/li>\u003c/ul>\u
