003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>Scope may be clarified and renegotiated with the Product Owner as more is learned.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #107."},{"query":"Who does the work to make sure Product Backlog Items conform to the Definition of Done? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Quality Assurance Team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Scrum Team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Developers are required to conform to the Definition of Done.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The moment a Product Backlog item meets the Definition of Done, an Increment is born.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #108."},{"query":"The Scrum Team lacks the tools and environment needed to meet its Definition of Done. Which two actions are appropriate? (choose two)","type":"multiple-choice","options":[{"text":"Improve the tools, skills, and environment so the Scrum Team can consistently create Increments that meet the Definition of Done.","explanation":"The Scrum Master helps cause removal of impediments and supports the team in improving its practices to produce high-value Increments.","correct":true},{"text":"Follow any organizational Definition of Done as a minimum standard while working to address the impediments.","explanation":"The 2020 Guide explicitly requires organizational Definition of Done standards to be followed as a minimum.","correct":true},{"text":"Lower the Definition of Done below organizational quality requirements until better tools are available.","explanation":"An organizational Definition of Done cannot be weakened, and quality does not decrease during the Sprint.","correct":false},{"text":"Include partially Done work in the Increment if the Product Owner accepts the risk.","explanation":"Work that does not meet the Definition of Done cannot be considered part of an Increment.","correct":false},{"text":"Replace the next Sprint with an untimed infrastructure phase before attempting to create an Increment.","explanation":"Scrum uses fixed-length Sprints and expects a valuable, useful Increment each Sprint, rather than preparatory phases replacing Sprints.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Improve the tools, skills, and environment so the Scrum Team can consistently create Increments that meet the Definition of Done.\u003c/li>\u003cli>Follow any organizational Definition of Done as a minimum standard while working to address the impediments.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>all Scrum Teams must follow it as a minimum.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>the Scrum Team must create a Definition of Done appropriate for the product.\u003c/q>\u003c/p>","tip":"\u003cp>Improve the ability to meet quality standards rather than redefining incomplete work as Done.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #109."},{"query":"True or False: When there are multiple teams working on one product, each Scrum Team should have a separate Product Owner.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>Therefore, they should share the same Product Goal, Product Backlog, and Product Owner.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #94."},{"query":"For the purpose of transparency, when does Scrum say a valuable and useful Increment must be available? (choose the best answer)","type":"multiple-choice","options":[{"text":"Every 3 Sprints.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"When the Product Owner asks to create one.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"After the Acceptance Testing phase.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"At the end of every Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Before the Release Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>At the end of every Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #110."},{"query":"Who is accountable for clearly expressing Product Backlog Items? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Product Owner.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Business Analyst who represents the Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master, or the Scrum Master may have the Developers do it.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Owner.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Creating and clearly communicating Product Backlog items;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #111."},{"query":"Which statement best describes the Sprint Review? (choose the best answer)","type":"multiple-choice","options":[{"text":"It is a mechanism to control the Developers activities during a Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It is used to congratulate the Developers if they complete their forecast or to punish the Developers if they fail to meet their forecast.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It is when the Scrum Team and stakeholders inspect the outcome of a Sprint and figure out what to do next.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"It is a demo at the end of the Sprint for everyone in the organization to check on the work done","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>It is when the Scrum Team and stakeholders inspect the outcome of a Sprint and figure out what to do next.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The purpose of the Sprint Review is to inspect the outcome of the Sprint and determine future adaptations.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The Scrum Team presents the results of their work to key stakeholders and progress toward the Product Goal is discussed.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Review; original PSPO question #112."},{"query":"True or False: The Product Owner makes sure the Developers select enough from the Product Backlog for a Sprint to satisfy the stakeholders.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 8):\u003c/strong> \u003cq>This resulting plan is created by the collaborative work of the entire Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Planning; original PSPO question #115."},{"query":"Which three statements accurately describe Scrum as defined in the 2020 Scrum Guide? (choose three)","type":"multiple-choice","options":[{"text":"Scrum is a lightweight framework that helps people, teams, and organizations generate value through adaptive solutions for complex problems.","explanation":"This follows the 2020 Scrum Guide definition, which is broader than software development.","correct":true},{"text":"Scrum is founded on empiricism and lean thinking.","explanation":"The Scrum Theory section explicitly identifies empiricism and lean thinking as foundations.","correct":true},{"text":"Each element of the Scrum framework serves a purpose essential to the value and results of Scrum.","explanation":"The Purpose of the Scrum Guide states that every framework element serves a specific essential purpose.","correct":true},{"text":"Scrum is a detailed software development methodology that prescribes all technical practices.","explanation":"Scrum is a deliberately lightweight framework and does not prescribe all technical implementation practices.","correct":false},{"text":"Scrum permits teams to omit required events or accountabilities and still call the result Scrum.","explanation":"The 2020 Guide states that implementing only parts is possible, but the result is not Scrum.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Scrum is a lightweight framework that helps people, teams, and organizations generate value through adaptive solutions for complex problems.\u003c/li>\u003cli>Scrum is founded on empiricism and lean thinking.\u003c/li>\u003cli>Each element of the Scrum framework serves a purpose essential to the value and results of Scrum.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Definition (p. 3):\u003c/strong> \u003cq>Scrum is a lightweight framework that helps people, teams and organizations generate value through adaptive solutions for complex problems.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Theory (p. 3):\u003c/strong> \u003cq>Scrum is founded on empiricism and lean thinking.\u003c/q>\u003c/p>","tip":"\u003cp>Focus on Scrum as a lightweight framework for complex problems, not a prescriptive software methodology.\u003c/p>","reference":"2020 Scrum Guide: Scrum Definition, Scrum Theory; original PSPO question #113."},{"query":"As the Sprint Planning progresses, the Developers realize that the workload may be greater than their capacity to complete the work. Which two are valid actions? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Recruit additional Developers before the work can begin.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Developers ensure that the Scrum Team is aware, start the Sprint, and monitor progress.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Developers work overtime during this Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Cancel the Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Remove or change selected Product Backlog Items.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The Developers ensure that the Scrum Team is aware, start the Sprint, and monitor progress.\u003c/li>\u003cli>Remove or change selected Product Backlog Items.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 8):\u003c/strong> \u003cq>Topic Two: What can be Done this Sprint?\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 8):\u003c/strong> \u003cq>This resulting plan is created by the collaborative work of the entire Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Planning; original PSPO question #114."},{"query":"The Daily Scrum is an event that happens every day. What would be three key concerns if the frequency were to be lowered to every two or three days? (choose the best three answers)","type":"multiple-choice","options":[{"text":"The Scrum Master loses the ability to update the Gantt Chart properly.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Too much work is spent updating the Scrum board before the meeting.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Opportunities to inspect and adapt the Sprint Backlog are lost.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner cannot accurately report progress to the stakeholders.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Impediments are raised and resolved more slowly.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Sprint Backlog may become inaccurate.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Opportunities to inspect and adapt the Sprint Backlog are lost.\u003c/li>\u003cli>Impediments are raised and resolved more slowly.\u003c/li>\u003cli>The Sprint Backlog may become inaccurate.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>The purpose of the Daily Scrum is to inspect progress toward the Sprint Goal and adapt the Sprint Backlog as necessary, adjusting the upcoming planned work.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>Daily Scrums improve communications, identify impediments,\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Daily Scrum; original PSPO question #116."},{"query":"True or False: To get started in terms of what to build, Scrum requires no more than a Product Owner with enough ideas for a first Sprint, Developers to implement those ideas, and a Scrum Master to help guide the process.","type":"multiple-choice","options":[{"text":"True.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"False.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Definition (p. 3):\u003c/strong> \u003cq>The Scrum framework is purposefully incomplete, only defining the parts required to implement Scrum theory.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>The Product Backlog is an emergent, ordered list\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Definition, Product Backlog; original PSPO question #117."},{"query":"How should a Scrum Team deal with non-functional requirements? (choose the best answer)","type":"multiple-choice","options":[{"text":"Make sure the release department understands these requirements, but it's not the Scrum Team's responsibility.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Manage them during the Integration Sprint prior to the Release Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Assign them to the Lead Developers on the team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Ensure every Increment meets them.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Ensure every Increment meets them.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Developers are required to conform to the Definition of Done.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #118."},{"query":"At the end of a Sprint, a Product Backlog Item worked on during the Sprint does not meet the Definition of Done. What two things should happen with the undone Product Backlog Item? (choose the best two answers)","type":"multiple-choice","options":[{"text":"Do not include the item in the Increment this Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Put it on the Product Backlog for the Product Owner to decide what to do with it.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"If the stakeholders agree, the Product Owner can accept it and release it to the users.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Review the item, add the done part of the estimate to the velocity and create a Story for the remaining work.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Do not include the item in the Increment this Sprint.\u003c/li>\u003cli>Put it on the Product Backlog for the Product Owner to decide what to do with it.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>Instead, it returns to the Product Backlog for future consideration.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #119."},{"query":"Who should make sure everyone on the Scrum Team does their tasks for the Sprint? (choose the best answer)","type":"multiple-choice","options":[{"text":"The Project Manager.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Team.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"All of the above.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Team.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>meaning they internally decide who does what, when, and how.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #120."},{"query":"True or False: A Product Owner is essentially the same thing as a traditional Project Manager?","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>Scrum defines three specific accountabilities within the Scrum Team: the Developers, the Product Owner, and the Scrum Master.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #122."},{"query":"To create focus which of the following are most important to have ready when Sprint Planning begins? (choose the best two answers)","type":"multiple-choice","options":[{"text":"A fully refined Product Backlog.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"A clear cadence of when the Daily Scrum will take place.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"A Product Backlog with the most important items ready for discussion.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Formal budget approval to conduct another Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"A Product Goal communicated by the Product Owner.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"A clear and non-negotiable Sprint Goal.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>A Product Backlog with the most important items ready for discussion.\u003c/li>\u003cli>A Product Goal communicated by the Product Owner.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 8):\u003c/strong> \u003cq>The Product Owner ensures that attendees are prepared to discuss the most important Product Backlog items and how they map to the Product Goal.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Goal (p. 11):\u003c/strong> \u003cq>The Product Goal describes a future state of the product which can serve as a target for the Scrum Team to plan against.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Planning, Product Goal; original PSPO question #121."},{"query":"Which two statements explain why the Definition of Done is important to the Product Owner?","type":"multiple-choice","options":[{"text":"It identifies undone work that can be addressed in a separate Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It establishes the expected quality of the Increment reviewed at the Sprint Review.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"It creates transparency regarding progress within the Scrum Team.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"It helps the Product Owner track the open work during a Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>It establishes the expected quality of the Increment reviewed at the Sprint Review.\u003c/li>\u003cli>It creates transparency regarding progress within the Scrum Team.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done creates transparency by providing everyone a shared understanding of what work was completed as part of the Increment.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #123."},{"query":"When does a Developer become accountable for the value of a Product Backlog Item selected for the Sprint? (choose the best answer)","type":"multiple-choice","options":[{"text":"Whenever a team member can accomodate more work.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"At the Sprint Planning Event.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Never. The entire Scrum Team is accountable for creating value every Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"During the Daily Scrum.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Never. The entire Scrum Team is accountable for creating value every Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #124."},{"query":"True or False: A first Sprint can start before the Product Owner has a complete and exhaustive Product Backlog in place.","type":"multiple-choice","options":[{"text":"True.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"False.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>The Product Backlog is an emergent, ordered list\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #125."},{"query":"What is the Product Owner accountable for in Scrum?","type":"multiple-choice","options":[{"text":"Refining the top level Product Backlog Items until they are ready to be handed over to the Scrum Team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Describing an Increment at Sprint Planning and making sure that the Developers deliver it by the end of the Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Writing the User Stories so they are comprehensive enough for the stakeholders.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Maximizing the value of the product resulting from the work of the Scrum Team.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Maximizing the value of the product resulting from the work of the Scrum Team.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #126."},{"query":"The Product Owner's authority to change and update the Product Backlog is unlimited, except for:","type":"multiple-choice","options":[{"text":"High impact changes that have not been approved by the change request board.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Decisions by the chief program manager.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Decisions by the CFO, the CEO or the board of directors.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Technical and architectural work that needs to be done first, as indicated by the chief enterprise architect.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Items the Scrum Master has identified as impediments.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"There are no exceptions, the entire organization must respect a Product Owner's decisions.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>There are no exceptions, the entire organization must respect a Product Owner&#x27;s decisions.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>For Product Owners to succeed, the entire organization must respect their decisions.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>The Product Owner is one person, not a committee.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> This passage supports the Product Owner’s decision authority over the Product Backlog, not unlimited authority across the organization.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #127."},{"query":"The Developers find out during the Sprint that they are not likely to build everything they forecast. What would you expect a Product Owner to do?","type":"multiple-choice","options":[{"text":"Cancel the Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Skip Product Backlog Refinement activities.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Change the Sprint Goal.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Re-negotiate the selected Product Backlog Items with the Developers.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Inform management that more resources are needed.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Re-negotiate the selected Product Backlog Items with the Developers.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>Scope may be clarified and renegotiated with the Product Owner as more is learned.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Goal (p. 11):\u003c/strong> \u003cq>it provides flexibility in terms of the exact work needed to achieve it.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint, Sprint Goal; original PSPO question #128."},{"query":"True or False: The Definition of Done increases the transparency and is used by the Developers to forecast how many items can be picked from the Product Backlog.","type":"multiple-choice","options":[{"text":"True.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"False.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done creates transparency by providing everyone a shared understanding of what work was completed as part of the Increment.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #145."},{"query":"What should Developers do if the Product Owner is unavailable?","type":"multiple-choice","options":[{"text":"Wait until the Product Owner is available again.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Management should assign a substitue Product Owner to fill in where the Product Owner cannot be there.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Ask the Product Owner's manager to decide in the Product Owner's absence.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Within the Sprint, the Developers make the best decisions posssible to assure progress towards the Sprint Goal, re-aligning with the Product Owner once they are available again.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Within the Sprint, the Developers make the best decisions posssible to assure progress towards the Sprint Goal, re-aligning with the Product Owner once they are available again.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Developers (p. 5):\u003c/strong> \u003cq>Adapting their plan each day toward the Sprint Goal;\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>Scope may be clarified and renegotiated with the Product Owner as more is learned.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Developers, The Sprint; original PSPO question #129."},{"query":"What phrases best describe the relationship of the Product Owner and the Developers?","type":"multiple-choice","options":[{"text":"They should work apart as much as posssible in order to keep the concerns of business and technology separated.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"They collaborate often so the Developers build Increments keeping end-user and stakeholder concerns in mind.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"They collaborate often so the Product Owner can make informed decisions in balancing effort and value of Product Backlog Items.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"They should share no more than the Sprint Planning and the Sprint Review meeting.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner should be with the Developers full-time to grow a deep understanding of the technology being used.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>They collaborate often so the Developers build Increments keeping end-user and stakeholder concerns in mind.\u003c/li>\u003cli>They collaborate often so the Product Owner can make informed decisions in balancing effort and value of Product Backlog Items.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 8):\u003c/strong> \u003cq>This resulting plan is created by the collaborative work of the entire Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 11):\u003c/strong> \u003cq>The Developers who will be doing the work are responsible for the sizing.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Planning, Product Backlog; original PSPO question #130."},{"query":"What is the principal value of releasing an Increment?","type":"multiple-choice","options":[{"text":"To learn about the Scrum Team's productivity.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"To validate assumptions made when developing the product.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"To learn about the forecast of functionality that was developed.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>To validate assumptions made when developing the product.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Increment (p. 12):\u003c/strong> \u003cq>The Sprint Review should never be considered a gate to releasing value.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Increment (p. 11):\u003c/strong> \u003cq>In order to provide value, the Increment must be usable.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Increment; original PSPO question #131."},{"query":"True or False: Sprint Planning is time-boxed to a maximum of eight hours for a one-month Sprint.","type":"multiple-choice","options":[{"text":"True.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"False.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Planning (p. 9):\u003c/strong> \u003cq>Sprint Planning is timeboxed to a maximum of eight hours\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Planning; original PSPO question #146."},{"query":"What best describes the relationship of the Product Owner and the stakeholders?","type":"multiple-choice","options":[{"text":"The Product Owner provides the stakeholders with acceptance forms at the Sprint Review to record their formal agreement over the delivered software.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner actively asks for stakeholder input and expectations to incorporate into the Product Backlog.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner has the final call over the requirements and should involve the stakeholders as little as possible.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner rates the User Stories as provided by the stakeholders.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Owner actively asks for stakeholder input and expectations to incorporate into the Product Backlog.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>The Product Owner may represent the needs of many stakeholders in the Product Backlog.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The Scrum Team presents the results of their work to key stakeholders and progress toward the Product Goal is discussed.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner, Sprint Review; original PSPO question #132."},{"query":"What are typical activities for a Product Owner in a Sprint?","type":"multiple-choice","options":[{"text":"Update the work plan for the Developers on a daily basis.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Create financial reporting upon the spent hours reported by the Scrum Team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Work with the Developers on Product Backlog Refinement.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Attend every Daily Scrum to answer functional questions on the discussed Sprint Backlog items.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Collaborate with stakeholders, user communities, and subject matter experts.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Work with the Developers on Product Backlog Refinement.\u003c/li>\u003cli>Collaborate with stakeholders, user communities, and subject matter experts.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>The Product Owner may represent the needs of many stakeholders in the Product Backlog.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #133."},{"query":"Is the Product Owner required to be present at the Sprint Retrospective?","type":"multiple-choice","options":[{"text":"They are not allowed. The Sprint Retrosspective is an opportunity for the Developerss to improve.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"They are optional. Attendance is only required when the Product Owner gets invited by the Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Their attendance is mandatory. The Sprint Retrospective is an opportunity for the Scrum Team to assess and improve itself.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Their attendance is mandatory. The Sprint Retrospective is an opportunity for the Scrum Team to assess and improve itself.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The Scrum Team consists of one Scrum Master, one Product Owner, and Developers.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #134."},{"query":"True or False: The Definition of Ready is defined by the Product Owner.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>Product Backlog items that can be Done by the Scrum Team within one Sprint are deemed ready for selection in a Sprint Planning event.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Definition (p. 3):\u003c/strong> \u003cq>Various processes, techniques and methods can be employed within the framework.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Guide does not prescribe a Definition of Ready; its criterion for selecting work is whether the item can be Done within one Sprint.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog, Scrum Definition; original PSPO question #151."},{"query":"Adaptation requires regular inspection. In what ways does the Product Owner contribute to the results achieved by inspection?","type":"multiple-choice","options":[{"text":"The Product Owner invites stakeholders to the Sprint Review to learn how the current state of the marketplace influences what is the most valuable thing to do next.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner verifies the Sprint Backlog for completeness at the end of Sprint Planning in order to allow the Sprint to start.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner inspects the Sprint burn-down at the Daily Scrum for progress towards a complete Increment and re-planning the team's work.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner shares the current state of Product Backlog at the Sprint Review, which, combined with the inspection of the Increment, leads to an updated Product Backlog.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The Product Owner invites stakeholders to the Sprint Review to learn how the current state of the marketplace influences what is the most valuable thing to do next.\u003c/li>\u003cli>The Product Owner shares the current state of Product Backlog at the Sprint Review, which, combined with the inspection of the Increment, leads to an updated Product Backlog.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The Scrum Team presents the results of their work to key stakeholders and progress toward the Product Goal is discussed.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The Product Backlog may also be adjusted to meet new opportunities.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Review; original PSPO question #135."},{"query":"Which description best fits the role of the Product Owner?","type":"multiple-choice","options":[{"text":"Chief Business Analyst.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Requirements Collector.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Project Manager 2.0.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Scope Protector.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Value Maximizer.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Value Maximizer.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #136."},{"query":"Who creates the Definition of Done?","type":"multiple-choice","options":[{"text":"The Scrum Master as they are responsible for the Scrum Team's productivity.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The organization (or the Scrum Team if none is available from the organization).","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner as they are responsible for the product's success.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Team, in a collaborative effort where the result is the common denominator of all members' definitions.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The organization (or the Scrum Team if none is available from the organization).\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>the Scrum Team must create a Definition of Done appropriate for the product.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done; original PSPO question #137."},{"query":"True or False: The Sprint Review is considered as a \"formal meeting\".","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Review (p. 9):\u003c/strong> \u003cq>The Sprint Review is a working session and the Scrum Team should avoid limiting it to a presentation.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Events (p. 7):\u003c/strong> \u003cq>Each event in Scrum is a formal opportunity to inspect and adapt Scrum artifacts.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Guide calls the Sprint Review a formal Scrum event and a working session; it does not require a conventional formal meeting format.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Review, Scrum Events; original PSPO question #152."},{"query":"In order to make investment decisions, the Product Owner is likely to look at the Total Cost of Ownership (TCO) of the product being built. What costs will a Product Owner take into account?","type":"multiple-choice","options":[{"text":"The accumulated cost over the earned value of the product.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The money spent on development and delivery of the product.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"All investments required to conceive, develop, operate and maintain the product.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>All investments required to conceive, develop, operate and maintain the product.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>from stakeholder collaboration, verification, maintenance, operation, experimentation, research and development, and anything else that might be required.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Guide does not prescribe a Total Cost of Ownership formula; the Scrum Team handles product operation and maintenance.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #138."},{"query":"A Product Owner is entitled to postpone the start of a new Sprint after the conclusion of a previous Sprint for the following reason:","type":"multiple-choice","options":[{"text":"The Quality Assurance department needs more time to make the previous Increment complete.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The stakeholders are not happy with the value produced in the previous Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"There is no acceptable reason. A new Sprint starts immediately after the conclusion of the previous Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Product Owner has not identified a Sprint Goal.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Not enough Product Backlog Items are ready.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>There is no acceptable reason. A new Sprint starts immediately after the conclusion of the previous Sprint.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>A new Sprint starts immediately after the conclusion of the previous Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: The Sprint; original PSPO question #139."},{"query":"What two things best help the Product Owner manage the value of a product?","type":"multiple-choice","options":[{"text":"Devising a formula for a neutral calculation of value.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Setting value on individual Product Backlog Items using Value Poker.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The order of the Product Backlog.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Validating assumptions of value through frequent releases.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The order of the Product Backlog.\u003c/li>\u003cli>Validating assumptions of value through frequent releases.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Ordering Product Backlog items;\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #140."},{"query":"True or False: More Velocity means more Value!","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>How this is done may vary widely across organizations, Scrum Teams, and individuals.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> Velocity is not equated with value by the Scrum Guide.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #157."},{"query":"What is a Product Backlog?","type":"multiple-choice","options":[{"text":"It is a detailed lists of functionalities from which the Developers draw items, to be complemented by a separate Technology Backlog managed by the Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Backlog is an emergent, ordered list of what is needed to improve the product.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"It is a list of references to Use Case documents that are stored in a central repository. The references should be visible and clickable by anybody to enhance transparency.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It is a formally approved list of requirements to be implemented over a set period.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Backlog is an emergent, ordered list of what is needed to improve the product.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>The Product Backlog is an emergent, ordered list\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Backlog; original PSPO question #141."},{"query":"To what extent does technical debt limit the value a Product Owner can get from a product?","type":"multiple-choice","options":[{"text":"Technical debt does not influence the delivery of value.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The velocity at which new functionality can be created is reduced when you have technical debt.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Technical debt causes a greater percentage of the product's budget to be spent on maintenance of the product.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Technical debt is not a Product Owner concern, technical debt is only an issue for the Developers.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The velocity at which new functionality can be created is reduced when you have technical debt.\u003c/li>\u003cli>Technical debt causes a greater percentage of the product&#x27;s budget to be spent on maintenance of the product.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Developers (p. 5):\u003c/strong> \u003cq>Instilling quality by adhering to a Definition of Done;\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>Quality does not decrease;\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Guide does not define technical debt or quantify its effects, but its quality and transparency principles are relevant.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Developers, The Sprint; original PSPO question #142."},{"query":"How does an organization know that a product built using Scrum is successful?","type":"multiple-choice","options":[{"text":"By the Product Owner and stakeholders accepting the Increment at the Sprint Review.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"By releasing frequently, and measuring the value customers/users experience.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"By measuring the actual time spent on development versus the time estimated for development.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"By measuring the velocity has increased since the last release.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>By releasing frequently, and measuring the value customers/users experience.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Theory (p. 3):\u003c/strong> \u003cq>Scrum is founded on empiricism and lean thinking.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>How this is done may vary widely across organizations, Scrum Teams, and individuals.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Guide does not mandate a release cadence or a particular product-success metric.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Theory, Product Owner; original PSPO question #143."},{"query":"True or False: During a Sprint, the Scrum Team may improve its Definition of Done to strengthen product quality, provided organizational minimum standards are respected and quality does not decrease.","type":"multiple-choice","options":[{"text":"True.","explanation":"The Guide requires that quality not decrease during a Sprint, and the team can adapt improvements while respecting any organizational minimum Definition of Done.","correct":true},{"text":"False.","explanation":"The Guide does not categorically ban strengthening the Definition of Done during a Sprint.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>Quality does not decrease;\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>all Scrum Teams must follow it as a minimum.\u003c/q>\u003c/p>","tip":"\u003cp>Differentiate strengthening quality from weakening the Definition of Done to finish unfinished items.\u003c/p>","reference":"2020 Scrum Guide: The Sprint, Definition of Done; original PSPO question #160."},{"query":"What is the main reason for the Product Owner to be part of the Daily Scrum?","type":"multiple-choice","options":[{"text":"It is not required for the Product Owner to participate.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"To assign the Developers the daily tasks.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"To track the progress of the Project.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>It is not required for the Product Owner to participate.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>for the Developers of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>If the Product Owner or Scrum Master are actively working on items in the Sprint Backlog, they participate as Developers.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Daily Scrum; original PSPO question #144."},{"query":"Which of the following topics can be part of the Sprint Retrospective?","type":"multiple-choice","options":[{"text":"Plan the next Sprint.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Discuss the way the Team has communicated in the last Sprint.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Discuss the way the Developers have collaborated with the Product Owner.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Refine Product Backlog Items.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Discuss the way the Team has communicated in the last Sprint.\u003c/li>\u003cli>Discuss the way the Developers have collaborated with the Product Owner.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The Scrum Team inspects how the last Sprint went with regards to individuals, interactions, processes, tools, and their Definition of Done.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Retrospective (p. 10):\u003c/strong> \u003cq>The purpose of the Sprint Retrospective is to plan ways to increase quality and effectiveness.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Retrospective; original PSPO question #147."},{"query":"Which two statements are correct when four teams are working on one single product?","type":"multiple-choice","options":[{"text":"There can be only one Product Owner.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"There can be only one Product Backlog.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"There can be 4 Product Owners.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"There can be 4 Product Backlogs.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>There can be only one Product Owner.\u003c/li>\u003cli>There can be only one Product Backlog.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>Therefore, they should share the same Product Goal, Product Backlog, and Product Owner.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>The Product Owner is one person, not a committee.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team, Product Owner; original PSPO question #148."},{"query":"True or False: The Sprint Backlog content is emerging during the Sprint.","type":"multiple-choice","options":[{"text":"True.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"False.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Sprint Backlog (p. 11):\u003c/strong> \u003cq>It should have enough detail that they can inspect their progress in the Daily Scrum.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Sprint Backlog; original PSPO question #162."},{"query":"Who is the owner of the Product Backlog?","type":"multiple-choice","options":[{"text":"The Project Manager.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The whole Scrum Team.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Scrum Master.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"The Product Owner.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Owner.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Ordering Product Backlog items;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #149."},{"query":"Which of the following are required by Scrum?","type":"multiple-choice","options":[{"text":"Hardening Sprints.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Story Points.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Time boxed events.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Sprint Planning meetings.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"A Sprint 0.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Time boxed events.\u003c/li>\u003cli>Sprint Planning meetings.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Events (p. 7):\u003c/strong> \u003cq>Each event in Scrum is a formal opportunity to inspect and adapt Scrum artifacts.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Events (p. 7):\u003c/strong> \u003cq>Failure to operate any events as prescribed results in lost opportunities to inspect and adapt.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Events; original PSPO question #150."},{"query":"Please select the answer representing a responsibility of a Product Owner.","type":"multiple-choice","options":[{"text":"Ordering the items in the Product Backlog to best achieve goals and missions.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Defining the Definition of Done.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Defining the Definition of Ready.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Ordering the items in the Product Backlog to best achieve goals and missions.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 6):\u003c/strong> \u003cq>Ordering Product Backlog items;\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner; original PSPO question #153."},{"query":"True or False: When n Scrum teams are working on a product, there should always be only 1 Product Owner but 1-n Scrum Masters.","type":"multiple-choice","options":[{"text":"True.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"False.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>True.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>Therefore, they should share the same Product Goal, Product Backlog, and Product Owner.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The Scrum Team consists of one Scrum Master, one Product Owner, and Developers.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Team; original PSPO question #163."},{"query":"Which change is not permitted during a Sprint according to the 2020 Scrum Guide? (choose the best answer)","type":"multiple-choice","options":[{"text":"Reducing the product quality required to count unfinished work as part of a Done Increment.","explanation":"The Sprint section says quality does not decrease, and work must meet the Definition of Done to be part of an Increment.","correct":true},{"text":"Refining Product Backlog items as more is learned.","explanation":"The Product Backlog is refined as needed during the Sprint.","correct":false},{"text":"Updating the Developers' Sprint Backlog plan as new information becomes available.","explanation":"The Sprint Backlog is updated throughout the Sprint as more is learned.","correct":false},{"text":"Clarifying and renegotiating Sprint scope with the Product Owner without endangering the Sprint Goal.","explanation":"Scope may be clarified and renegotiated with the Product Owner without endangering the Sprint Goal.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Reducing the product quality required to count unfinished work as part of a Done Increment.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — The Sprint (p. 7):\u003c/strong> \u003cq>Quality does not decrease;\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>","tip":"\u003cp>The restriction concerns decreased quality and protecting the Sprint Goal, not a blanket freeze on all plans or standards.\u003c/p>","reference":"2020 Scrum Guide: The Sprint, Definition of Done; original PSPO question #154."},{"query":"Which of the following is a Scrum Value?","type":"multiple-choice","options":[{"text":"Creativity.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Inspection.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Adaption.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Focus.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Focus.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Values (p. 4):\u003c/strong> \u003cq>Commitment, Focus, Openness, Respect, and Courage\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Scrum Values; original PSPO question #155."},{"query":"Which statement is not correct about the Scrum Daily?","type":"multiple-choice","options":[{"text":"It is moderated by the Product Owner.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"The Developers have to participate in the meeting.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It is a time boxed event (15 min).","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"It should be held at the same time and place.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>It is moderated by the Product Owner.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Daily Scrum (p. 9):\u003c/strong> \u003cq>for the Developers of the Scrum Team.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Daily Scrum; original PSPO question #156."},{"query":"True or False: The Product Owner has to maximize the value – more features always bring more value. Therefore, the Product Owner has to maximize the number of features in a Sprint.","type":"multiple-choice","options":[{"text":"True.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"False.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true}],"answer":"\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Product Owner (p. 5):\u003c/strong> \u003cq>The Product Owner is accountable for maximizing the value of the product resulting from the work of the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Scrum Team (p. 5):\u003c/strong> \u003cq>The entire Scrum Team is accountable for creating a valuable, useful Increment every Sprint.\u003c/q>\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Product Owner, Scrum Team; original PSPO question #173."},{"query":"Which two of the following are not correct about non-functional requirements?","type":"multiple-choice","options":[{"text":"The Project Manager takes care of non-functional requirements.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Non-functional requirements can be added to the Product Backlog.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false},{"text":"Non-functional requirements are reflected in the Sprint Goal.","explanation":"Marked correct in the provided PSPO sample question bank.","correct":true},{"text":"Non-functional requirements can be added to the Definition of Done.","explanation":"Not marked correct in the provided PSPO sample question bank.","correct":false}],"answer":"\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The Project Manager takes care of non-functional requirements.\u003c/li>\u003cli>Non-functional requirements are reflected in the Sprint Goal.\u003c/li>\u003c/ul>\u003cp>\u003cstrong>2020 Scrum Guide — Definition of Done (p. 12):\u003c/strong> \u003cq>The Definition of Done is a formal description of the state of the Increment when it meets the quality measures required for the product.\u003c/q>\u003c/p>\u003cp>\u003cstrong>2020 Scrum Guide — Product Backlog (p. 10):\u003c/strong> \u003cq>It is the single source of work undertaken by the Scrum Team.\u003c/q>\u003c/p>\u003cp>\u003cem>Context:\u003c/em> The Guide does not categorize all non-functional requirements automatically as Sprint Goals; the Definition of Done describes product quality.\u003c/p>","tip":"\u003cp>Select the best answer or answers as directed by the question.\u003c/p>","reference":"2020 Scrum Guide: Definition of Done, Product Backlog; original PSPO question #158."},{"query":"What should the Product Owner do when the Developers are
