<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrum Exam - 2020 Scrum Guide</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #d9e0e8;
      --primary: #1769aa;
      --primary-dark: #0f4f85;
      --secondary: #667085;
      --success: #16803c;
      --success-bg: #eaf8ef;
      --danger: #b42318;
      --danger-bg: #fff0ee;
      --warning: #9a6700;
      --warning-bg: #fff7d6;
      --shadow: 0 10px 28px rgba(23, 32, 51, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      border-radius: 9px;
      padding: .62rem .92rem;
      cursor: pointer;
      font-weight: 650;
      transition: transform .08s ease, background .15s ease, opacity .15s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-secondary { background: #e8edf3; color: var(--text); }
    .btn-warning { background: #ffd96a; color: #4b3500; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }

    .page-shell {
      width: min(1040px, calc(100% - 28px));
      margin: 28px auto 60px;
    }

    .hero {
      background: linear-gradient(135deg, #12243b, #1e4f79);
      color: white;
      border-radius: 18px;
      padding: 24px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero-top {
      display: flex;
      gap: 18px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .hero h1 { margin: 0 0 6px; font-size: clamp(1.65rem, 4vw, 2.35rem); }
    .hero p { margin: 0; opacity: .88; }
    .meta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .pill {
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.1);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: .9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-top: 16px;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 18px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-weight: 750;
    }

    .card-body { padding: 18px; }

    .results {
      border-left: 5px solid var(--primary);
    }
    .results strong { font-size: 1.1rem; }

    .query {
      font-size: 1.08rem;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .choose-note {
      color: var(--muted);
      font-size: .9rem;
      margin: 0 0 16px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 11px 12px;
      margin: 8px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
    }

    .option input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--primary);
      flex: 0 0 auto;
    }

    .option.reveal-correct {
      border-color: #75c991;
      background: var(--success-bg);
    }

    .option.reveal-wrong-selected {
      border-color: #e9a7a0;
      background: var(--danger-bg);
    }

    .option small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .answer-panel {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--warning-bg);
      border: 1px solid #f0d783;
    }

    .answer-panel p:first-child { margin-top: 0; }
    .answer-panel ul { margin-bottom: 0; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .control-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .collapsible-title { cursor: pointer; user-select: none; }
    .chevron { font-size: .9rem; color: var(--muted); }

    .jumper-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .jump-btn {
      min-width: 38px;
      padding: 7px 9px;
      background: #eef2f6;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .jump-btn.viewed { background: #d7dee7; }
    .jump-btn.current { background: var(--primary); color: white; border-color: var(--primary); }
    .jump-btn.correct { background: var(--success); color: white; border-color: var(--success); }
    .jump-btn.incorrect { background: var(--danger); color: white; border-color: var(--danger); }

    .history-empty { color: var(--muted); margin: 0; }
    .history-exam {
      border-top: 1px solid var(--line);
      padding: 14px 0;
    }
    .history-exam:first-child { border-top: 0; padding-top: 0; }
    .history-summary {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }
    .history-dots { display: flex; flex-wrap: wrap; gap: 5px; }
    .history-dot {
      width: 26px; height: 26px; border-radius: 7px;
      display: grid; place-items: center;
      font-size: .76rem; color: white;
      background: var(--danger);
    }
    .history-dot.correct { background: var(--success); }

    .status-line {
      color: var(--muted);
      font-size: .92rem;
      margin-top: 10px;
    }

    .footer-note {
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
      margin-top: 22px;
    }

    @media (max-width: 640px) {
      .page-shell { width: min(100% - 16px, 1040px); margin-top: 8px; }
      .hero { border-radius: 12px; padding: 19px 17px; }
      .card-body { padding: 14px; }
      .card-header { padding: 12px 14px; }
      .controls { align-items: stretch; }
      .control-group { width: 100%; }
      .control-group button { flex: 1; }
    }
  </style>
</head>
<body>
  <scrum-exam-app></scrum-exam-app>

  <script>
    const QUESTION_BANK = [{"query": "You have just been hired by a company new to Scrum. Your management has assigned you to be the Scrum Master of six new Scrum Teams. These teams will build one product. Select two conditions you should strive for in this scenario. (choose two)", "type": "multiple-choice", "options": [{"text": "There should be six Product Owners, one for each Scrum Team.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "There should be six Product Owners, reporting to a chief Product Owner.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The product has one Product Backlog.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Each Scrum Team should have a separate Product Backlog.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "There should be only one Product Owner.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The product has one Product Backlog.\u003c/li>\u003cli>There should be only one Product Owner.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 2 correct options.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Which two statements describe Product Owner accountabilities in the 2020 Scrum Guide? (choose two)", "type": "multiple-choice", "options": [{"text": "Maximizing the value of the product resulting from the work of the Scrum Team.", "explanation": "The Product Owner is accountable for maximizing product value.", "correct": true, "selected": false}, {"text": "Effective Product Backlog management, including ordering Product Backlog items.", "explanation": "The Product Owner is accountable for effective Product Backlog management.", "correct": true, "selected": false}, {"text": "Assigning tasks to individual Developers during the Sprint.", "explanation": "The Scrum Team is self-managing; the Product Owner does not assign work to individual Developers.", "correct": false, "selected": false}, {"text": "Approving each Developer's technical design before implementation.", "explanation": "How selected work gets done is at the sole discretion of the Developers.", "correct": false, "selected": false}, {"text": "Serving as the Scrum Team's project manager.", "explanation": "Project Manager is not a Scrum accountability.", "correct": false, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Maximizing the value of the product resulting from the work of the Scrum Team.\u003c/li>\u003cli>Effective Product Backlog management, including ordering Product Backlog items.\u003c/li>\u003c/ul>", "tip": "\u003cp>Focus on the two areas for which the Product Owner is explicitly accountable.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "User documentation is part of your Definition of Done. However, there aren't enough technical writers for all teams. Your Developers don't have a technical writer. What should you do?", "type": "multiple-choice", "options": [{"text": "Form a separate team of technical writers that will work on an on-demand basis for the various Product Owners. Work order will be first in, first out.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Let the user documentation remain undone and accumulate until after the last development Sprint. It will then be done by any available technical writers.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Wait until you have a technical writer on your Scrum Team to take care of this.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Your Scrum Team is still responsible for creating user documentation. In this case, the Scrum Team members will write it.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Your Scrum Team is still responsible for creating user documentation. In this case, the Scrum Team members will write it.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "You are the Scrum Master for four Scrum Teams working from the same Product Backlog. Several of the Developers come to you complaining that work identified for the upcoming two Sprints will require full-time commitment from a technical specialist who is external to the teams. What are two key concerns for the Scrum Master to take into account in this situation? (choose two)", "type": "multiple-choice", "options": [{"text": "The desire to maintain a stable velocity.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The benefit of Developers figuring out a solution for themselves.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "The need to have enough work to keep all Developers busy.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The ability of the Developers to produce integrated Increments.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The benefit of Developers figuring out a solution for themselves.\u003c/li>\u003cli>The ability of the Developers to produce integrated Increments.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 2 correct options.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Who is accountable for ordering the Product Backlog?", "type": "multiple-choice", "options": [{"text": "The Product Owner.", "explanation": "The Product Owner is accountable for ordering Product Backlog items.", "correct": true, "selected": false}, {"text": "The Scrum Master.", "explanation": "The Scrum Master helps establish Scrum and may coach Product Backlog management, but is not accountable for its ordering.", "correct": false, "selected": false}, {"text": "The Developers.", "explanation": "Developers are responsible for sizing the work they will do, not for the Product Backlog ordering accountability.", "correct": false, "selected": false}, {"text": "The stakeholders.", "explanation": "Stakeholders can try to influence the Product Owner, but they do not own the ordering accountability.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Owner.\u003c/li>\u003c/ul>", "tip": "\u003cp>The 2020 Guide separates Product Backlog management accountability from sizing responsibility.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "What happens if the Scrum Team cannot complete its work by the end of the Sprint?", "type": "multiple-choice", "options": [{"text": "The Sprint is extended and future Sprints use this new duration.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Sprint length holds and the Scrum Team continuously learns what is actually possible to do within a Sprint of this length.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "The Sprint is extended temporarily. Lessons are taken to ensure it doesn't happen again.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Sprint length holds and the Scrum Team continuously learns what is actually possible to do within a Sprint of this length.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Which topics should be discussed in the Sprint Review?", "type": "multiple-choice", "options": [{"text": "The Scrum process, and how it was used during the Sprint.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Coding and engineering practices.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Sprint results.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "All of the above.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Sprint results.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "A member of the Scrum Team takes the Scrum Master aside to express his concerns about data security issues. What should the Scrum Master do?", "type": "multiple-choice", "options": [{"text": "Add security to the Definition of Done.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Tell the Product Owner to stop further development of features until the issues are fixed.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Create a Product Backlog item for security.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Go check with the testers.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Ask the person to share the issue with the team as soon as possible.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Ask the person to share the issue with the team as soon as possible.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "What does it mean for a Scrum Team to be cross-functional?", "type": "multiple-choice", "options": [{"text": "The Scrum Team collectively has all the skills necessary to create value each Sprint.", "explanation": "The 2020 Scrum Guide defines cross-functional this way.", "correct": true, "selected": false}, {"text": "Every individual Developer must personally possess every skill used by the team.", "explanation": "Cross-functionality applies to the Scrum Team collectively, not to every individual.", "correct": false, "selected": false}, {"text": "The Scrum Team is divided into specialist sub-teams for analysis, development, and testing.", "explanation": "The Scrum Team has no sub-teams or hierarchies.", "correct": false, "selected": false}, {"text": "The Scrum Team relies on external specialists to complete each Increment.", "explanation": "A cross-functional Scrum Team collectively has the skills needed to create value each Sprint.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Team collectively has all the skills necessary to create value each Sprint.\u003c/li>\u003c/ul>", "tip": "\u003cp>Cross-functional describes the capabilities of the whole Scrum Team.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "Sprint burndown charts are an efficient tracking tool, because they show:", "type": "multiple-choice", "options": [{"text": "An estimate of the total work remaining for the Sprint.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "How much effort has gone into a Sprint.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "How many hours have been worked by each Scrum Team member.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "How many Product Backlog items remain.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>An estimate of the total work remaining for the Sprint.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "When can work on a Product Backlog item be considered part of an Increment?", "type": "multiple-choice", "options": [{"text": "Only when the Product Backlog item meets the Definition of Done.", "explanation": "Work cannot be considered part of an Increment unless it meets the Definition of Done.", "correct": true, "selected": false}, {"text": "As soon as a Developer starts working on it.", "explanation": "Started work is not an Increment merely because work has begun.", "correct": false, "selected": false}, {"text": "When the Product Owner accepts the unfinished work.", "explanation": "An item that does not meet the Definition of Done cannot be released or presented as Done.", "correct": false, "selected": false}, {"text": "Automatically at the end of the Sprint, even if work remains.", "explanation": "The end of the Sprint does not make incomplete work Done.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Only when the Product Backlog item meets the Definition of Done.\u003c/li>\u003c/ul>", "tip": "\u003cp>The Definition of Done is the quality threshold that determines when an Increment is created.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "Which statement best describes the Sprint Backlog?", "type": "multiple-choice", "options": [{"text": "It is a plan by and for the Developers.", "explanation": "The 2020 Scrum Guide explicitly describes the Sprint Backlog as a plan by and for the Developers.", "correct": true, "selected": false}, {"text": "It is a task list assigned by the Product Owner.", "explanation": "The Product Owner does not assign Sprint Backlog work to Developers.", "correct": false, "selected": false}, {"text": "It is a fixed plan that cannot change during the Sprint.", "explanation": "The Sprint Backlog is updated throughout the Sprint as more is learned.", "correct": false, "selected": false}, {"text": "It is ordered and maintained by the Scrum Master.", "explanation": "The Sprint Backlog belongs to the Developers' planning and adaptation work.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>It is a plan by and for the Developers.\u003c/li>\u003c/ul>", "tip": "\u003cp>Think about who creates and adapts the actionable plan for the Sprint.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "If burndown charts are used to visualize progress, what does a trend line through a release burndown chart indicate? (choose the best answer)", "type": "multiple-choice", "options": [{"text": "The evolution of the cost spent on the project.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "When all work will be completed to the Scrum Team can be released for other work.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "When the work remaining will likely be completed if nothing changes on the Product Backlog or the Developers.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "When the project will be over if the Product Owner removes work that is equal in effort to any new work that is added.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>When the work remaining will likely be completed if nothing changes on the Product Backlog or the Developers.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Who is responsible for product-related stakeholder collaboration in the 2020 Scrum Guide?", "type": "multiple-choice", "options": [{"text": "The Scrum Team.", "explanation": "The 2020 Scrum Guide lists stakeholder collaboration among the product-related activities for which the Scrum Team is responsible.", "correct": true, "selected": false}, {"text": "Only the Product Owner.", "explanation": "The Product Owner may represent stakeholder needs, but stakeholder collaboration is a Scrum Team responsibility.", "correct": false, "selected": false}, {"text": "Only the Scrum Master.", "explanation": "The Scrum Master may facilitate stakeholder collaboration, but the responsibility is not solely theirs.", "correct": false, "selected": false}, {"text": "A Project Manager.", "explanation": "Project Manager is not one of Scrum's three accountabilities.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Team.\u003c/li>\u003c/ul>", "tip": "\u003cp>The 2020 Guide broadened responsibility beyond a single accountability.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "At the end of a Sprint, a Product Backlog item worked on during the Sprint does not meet the Definition of Done. What two things should happen with the undone Product Backlog item? (choose the best two answers)", "type": "multiple-choice", "options": [{"text": "If the stakeholders agree, the Product Owner can accept it and release it to the users.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Put it on the Product Backlog for the Product Owner to decide what to do with it.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Review the item, add the Done part of the estimate to the velocity and create a Story for the remaining work.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Do not include the item in the Increment this Sprint.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Put it on the Product Backlog for the Product Owner to decide what to do with it.\u003c/li>\u003cli>Do not include the item in the Increment this Sprint.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 2 correct options.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Which two statements describe Scrum Master accountabilities or services in the 2020 Scrum Guide? (choose two)", "type": "multiple-choice", "options": [{"text": "Ensuring Scrum events take place and are positive, productive, and kept within the timebox.", "explanation": "This is explicitly listed as a Scrum Master service to the Scrum Team.", "correct": true, "selected": false}, {"text": "Helping remove barriers between stakeholders and Scrum Teams.", "explanation": "The Scrum Master serves the organization by helping remove barriers between stakeholders and Scrum Teams.", "correct": true, "selected": false}, {"text": "Assigning tasks to Developers when work is available.", "explanation": "The Scrum Team is self-managing; the Scrum Master does not assign tasks.", "correct": false, "selected": false}, {"text": "Deciding which Product Backlog items enter the Sprint.", "explanation": "Developers select Product Backlog items through discussion with the Product Owner.", "correct": false, "selected": false}, {"text": "Approving whether an Increment meets the Definition of Done.", "explanation": "Developers are required to conform to the Definition of Done; Scrum does not give the Scrum Master an approval gate.", "correct": false, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Ensuring Scrum events take place and are positive, productive, and kept within the timebox.\u003c/li>\u003cli>Helping remove barriers between stakeholders and Scrum Teams.\u003c/li>\u003c/ul>", "tip": "\u003cp>Focus on enabling effective Scrum rather than directing the team's work.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "What are three benefits of self-management? (choose the best three answers)", "type": "multiple-choice", "options": [{"text": "Increased creativity.", "expla ncrements? (choose the best answer)", "type": "multiple-choice", "options": [{"text": "Each Scrum Team works only one technical layer of the system (e.g. GUI, database, middle tier, interfaces).", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Each Scrum Team develops functionality from beginning to end throughout all technical layers.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Each Scrum Team develops functionality from beginning to end throughout all technical layers.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "What does the 2020 Scrum Guide say about Product Owner participation in the Daily Scrum?", "type": "multiple-choice", "options": [{"text": "The Product Owner is not required to attend unless actively working on Sprint Backlog items; in that case, they participate as a Developer.", "explanation": "The Daily Scrum is for Developers. A Product Owner actively working on Sprint Backlog items participates as a Developer.", "correct": true, "selected": false}, {"text": "The Product Owner must attend every Daily Scrum to receive status.", "explanation": "The Daily Scrum is not a status meeting for the Product Owner.", "correct": false, "selected": false}, {"text": "The Product Owner may attend only to reprioritize the Sprint Backlog.", "explanation": "The Sprint Goal must not be endangered, and Developers adapt their Sprint plan.", "correct": false, "selected": false}, {"text": "The Product Owner is forbidden from attending the Daily Scrum.", "explanation": "A Product Owner who is actively working on Sprint Backlog items participates as a Developer.", "correct": false, "selected": false}], "answer": "\u003cp>Correct op , "selected": false}, {"text": "Reporting Sprint progress to the stakeholders daily", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Keeping track of and estimating all undone work to be completed in a separate Sprint.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Updating Sprint tasks properly in the electronic tracking tool.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Doing all work needed to meet the Definition of Done\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Who determines how work is performed during the Sprint? (choose the best answer)", "type": "multiple-choice", "options": [{"text": "Architects.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Scrum Team.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "The Scrum Master.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Subject matter experts.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Developers managers.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Team.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "When does the second Sprint start? (choose the best answer)", "type": "multiple-choice", "options": [{"text": "Once the architectural changes for the second Sprint have been approved by the senior architect.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "After the Product Backlog for the second Sprint has been selected.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Immediately after the first Sprint.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "After the customer completes acceptance testing of the first Sprint.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Immediately after the first Sprint.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "What three elements together make up the Sprint Backlog?", "type": "multiple-choice", "options": [{"text": "The Sprint Goal, the selected Product Backlog items, and an actionable plan for delivering the Increment.", "explanation": "The 2020 Scrum Guide defines the Sprint Backlog as why, what, and how: Sprint Goal, selected Product Backlog items, and the delivery plan.", "correct": true, "selected": false}, {"text": "Only the tasks identified during Sprint Planning.", "explanation": "The Sprint Backlog includes more than decomposed tasks.", "correct": false, "selected": false}, {"text": "The Product Goal, all Product Backlog items, and the release plan.", "explanation": "The Product Goal belongs to the Product Backlog, and the Sprint Backlog contains only selected items plus the Sprint Goal and plan.", "correct": false, "selected": false}, {"text": "The Definition of Done, stakeholder list, and Daily Scrum notes.", "explanation": "These are not the three components that define the Sprint Backlog.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Sprint Goal, the selected Product Backlog items, and an actionable plan for delivering the Increment.\u003c/li>\u003c/ul>", "tip": "\u003cp>Think in terms of why, what, and how.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "Which two statements are true about the Product Owner accountability? (choose two)", "type": "multiple-choice", "options": [{"text": "The Product Owner is one person.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "The Product Owner is accountable for ordering the Product Backlog.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Multiple people can share the Product Owner role on a Scrum Team.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Product Owner role can be played by a committee or a team of people.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The Product Owner is one person.\u003c/li>\u003cli>The Product Owner is accountable for ordering the Product Backlog.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 2 correct options.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "True or False: When multiple teams work together on the same product, each team should maintain a separate Product Backlog.", "type": "multiple-choice", "options": [{"text": "True.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "False.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "When multiple Scrum Teams work on the same product, which three things should they share? (choose three)", "type": "multiple-choice", "options": [{"text": "The same Product Goal.", "explanation": "Multiple Scrum Teams focused on the same product should share the same Product Goal.", "correct": true, "selected": false}, {"text": "The same Product Backlog.", "explanation": "Multiple Scrum Teams focused on the same product should share one Product Backlog.", "correct": true, "selected": false}, {"text": "The same Product Owner.", "explanation": "Multiple Scrum Teams focused on the same product should share one Product Owner.", "correct": true, "selected": false}, {"text": "The same Sprint Backlog.", "explanation": "Each set of Developers creates and adapts its own Sprint Backlog.", "correct": false, "selected": false}, {"text": "The same Daily Scrum.", "explanation": "The Guide does not require multiple Scrum Teams to share one Daily Scrum.", "correct": false, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The same Product Goal.\u003c/li>\u003cli>The same Product Backlog.\u003c/li>\u003cli>The same Product Owner.\u003c/li>\u003c/ul>", "tip": "\u003cp>The 2020 Guide explicitly lists three things shared by multiple Scrum Teams on one product.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "A Scrum Master is introducing Scrum to a new Scrum Team. The Scrum Team has decided that a Sprint Retrospective is unnecessary. What action should the Scrum Master take? (choose the best answer)", "type": "multiple-choice", "options": [{"text": "Call a meeting between the Scrum Team and senior management.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Comply with the decision of the self-managing team.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Consult with the Product Owner to see how he/she feels about the situation.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Begin facilitating productive and useful Sprint Retrospectives.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Begin facilitating productive and useful Sprint Retrospectives.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "The Scrum Team lacks tools or infrastructure needed to meet its Definition of Done reliably. Which two responses are most consistent with the 2020 Scrum Guide? (choose two)", "type": "multiple-choice", "options": [{"text": "Improve the team's practices, tools, and infrastructure so it can create valuable Increments that meet the Definition of Done.", "explanation": "The Scrum Master helps the Scrum Team improve its practices and focus on high-value Increments that meet the Definition of Done.", "correct": true, "selected": false}, {"text": "If the Definition of Done is an organizational standard, continue to follow it as a minimum.", "explanation": "An organizational Definition of Done is a minimum standard for all Scrum Teams.", "correct": true, "selected": false}, {"text": "Lower the Definition of Done whenever the current tools make it difficult to achieve.", "explanation": "An organizational standard cannot be weakened, and quality should not decrease during the Sprint.", "correct": false, "selected": false}, {"text": "Accept partially Done work as part of the Increment until the tools improve.", "explanation": "Work that does not meet the Definition of Done cannot be considered part of an Increment.", "correct": false, "selected": false}, {"text": "Stop using Scrum until perfect tooling is available.", "explanation": "Scrum does not require perfect tooling before a team can inspect, adapt, and improve.", "correct": false, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Improve the team&#x27;s practices, tools, and infrastructure so it can create valuable Increments that meet the Definition of Done.\u003c/li>\u003cli>If the Definition of Done is an organizational standard, continue to follow it as a minimum.\u003c/li>\u003c/ul>", "tip": "\u003cp>Quality does not decrease during the Sprint, and organizational Definition of Done standards are minimum requirements.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "When is a Product Backlog item considered Done?", "type": "multiple-choice", "options": [{"text": "When it meets the Definition of Done.", "explanation": "The moment a Product Backlog item meets the Definition of Done, an Increment is born.", "correct": true, "selected": false}, {"text": "When its assigned Developer reports that coding is complete.", "explanation": "Individual completion does not replace the Definition of Done.", "correct": false, "selected": false}, {"text": "At the end of the Sprint, whether or not quality work remains.", "explanation": "An incomplete item returns to the Product Backlog for future consideration.", "correct": false, "selected": false}, {"text": "When the Product Owner accepts work that is nearly complete.", "explanation": "The Product Owner cannot override the Definition of Done.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>When it meets the Definition of Done.\u003c/li>\u003c/ul>", "tip": "\u003cp>Done is determined by a shared quality standard, not by elapsed time or individual approval.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "Choose two responsibilities of a self-managing Scrum Team. (choose the best two answers)", "type": "multiple-choice", "options": [{"text": "Reorder the Product Backlog.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Pull Product Backlog items for the Sprint.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Do the work planned in the Sprint Backlog.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Increase velocity.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Report daily progress to stakeholders.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Pull Product Backlog items for the Sprint.\u003c/li>\u003cli>Do the work planned in the Sprint Backlog.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 2 correct options.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Every Scrum Team should have: (choose the best answer)", "type": "multiple-choice", "options": [{"text": "At least one representative from each major software engineering discipline (like QA, Dev, UX).", "expl
