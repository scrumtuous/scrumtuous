is part of creating a Done Increment, not a separate post-Sprint phase.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>A valuable, useful Increment.\u003c/li>\u003c/ul>", "tip": "\u003cp>Differentiate creating a usable Increment from releasing it to production.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "True or False: Multiple Scrum Teams working on the same project must have the same Sprint start date.", "type": "multiple-choice", "options": [{"text": "True.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "False.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "During a Sprint Retrospective, for what is the Product Owner responsible?", "type": "multiple-choice", "options": [{"text": "Participating as a Scrum Team member.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Summarizing and reporting the discussions to the stakeholders that he/she represents in the Scrum Team.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Capturing requirements for the Product Backlog.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Product Owner should not take part in Sprint Retrospectives.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Participating as a Scrum Team member.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "A Product Backlog item is only 90% complete at the end of the Sprint and does not meet the Definition of Done. What should happen?", "type": "multiple-choice", "options": [{"text": "It returns to the Product Backlog for future consideration.", "explanation": "The 2020 Scrum Guide explicitly says an item that does not meet the Definition of Done returns to the Product Backlog.", "correct": true, "selected": false}, {"text": "It automatically moves into the next Sprint Backlog.", "explanation": "The item is not automatically selected for the next Sprint; it returns to the Product Backlog.", "correct": false, "selected": false}, {"text": "Its completed percentage counts toward the Increment.", "explanation": "Work that does not meet the Definition of Done is not part of the Increment.", "correct": false, "selected": false}, {"text": "The Sprint is extended until the item reaches Done.", "explanation": "Sprints are fixed-length events and are not extended to finish incomplete work.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>It returns to the Product Backlog for future consideration.\u003c/li>\u003c/ul>", "tip": "\u003cp>Incomplete work is neither part of the Increment nor automatically committed to the next Sprint.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "The time-box for a Daily Scrum?", "type": "multiple-choice", "options": [{"text": "Two minutes per person.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "15 minutes.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "15 minutes for a 4 week sprint. For shorter Sprints it is usually shorter.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "4 hours.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The same time of day every day.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>15 minutes.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Which phrase best describes the Product Owner's primary accountability?", "type": "multiple-choice", "options": [{"text": "Maximizing the value of the product resulting from the work of the Scrum Team.", "explanation": "This is the Product Owner's primary accountability in the 2020 Scrum Guide.", "correct": true, "selected": false}, {"text": "Managing the Developers.", "explanation": "The Scrum Team is self-managing.", "correct": false, "selected": false}, {"text": "Approving every technical decision.", "explanation": "How selected work gets done is at the sole discretion of the Developers.", "correct": false, "selected": false}, {"text": "Acting as a project manager for the Scrum Team.", "explanation": "Project Manager is not a Scrum accountability.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Maximizing the value of the product resulting from the work of the Scrum Team.\u003c/li>\u003c/ul>", "tip": "\u003cp>The Product Owner is accountable for an outcome, not for managing people.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "Which statement about Sprint length is correct according to the 2020 Scrum Guide?", "type": "multiple-choice", "options": [{"text": "A Sprint is a fixed-length event of one month or less.", "explanation": "The 2020 Scrum Guide defines Sprints as fixed-length events of one month or less.", "correct": true, "selected": false}, {"text": "Every Sprint must be exactly two weeks.", "explanation": "Scrum does not prescribe a two-week Sprint.", "correct": false, "selected": false}, {"text": "A Sprint can be extended when selected work is unfinished.", "explanation": "Sprints are fixed length and are not extended to finish scope.", "correct": false, "selected": false}, {"text": "Sprint length is determined by the amount of work selected after Sprint Planning begins.", "explanation": "Sprint length is fixed rather than adjusted to fit selected work.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>A Sprint is a fixed-length event of one month or less.\u003c/li>\u003c/ul>", "tip": "\u003cp>The key constraints are fixed length and a maximum of one month.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "Which two statements about testing and quality are consistent with the 2020 Scrum Guide? (choose two)", "type": "multiple-choice", "options": [{"text": "Developers are accountable for instilling quality by adhering to the Definition of Done.", "explanation": "This is an explicit Developer accountability.", "correct": true, "selected": false}, {"text": "Scrum defines no separate tester accountability within the Scrum Team.", "explanation": "Scrum defines three accountabilities: Developers, Product Owner, and Scrum Master.", "correct": true, "selected": false}, {"text": "Testing must be performed by a separate QA sub-team.", "explanation": "The Scrum Team has no sub-teams and is cross-functional.", "correct": false, "selected": false}, {"text": "Only a Product Owner can decide whether quality work is complete.", "explanation": "The Definition of Done provides the quality standard; the Product Owner does not override it.", "correct": false, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Developers are accountable for instilling quality by adhering to the Definition of Done.\u003c/li>\u003cli>Scrum defines no separate tester accountability within the Scrum Team.\u003c/li>\u003c/ul>", "tip": "\u003cp>Individuals may have testing expertise, but Scrum defines accountabilities rather than specialist roles.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "The CEO asks the Developers to add a \"very important\" item to a Sprint that is in progress. What should the Developers do?", "type": "multiple-choice", "options": [{"text": "Add the item to the current Sprint and drop an item of equal size.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Add the item to the current Sprint without any adjustments.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Inform the Product Owner so he/she can work with the CEO.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Add the item to the next Sprint.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Inform the Product Owner so he/she can work with the CEO.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "What is the role of management in Scrum?", "type": "multiple-choice", "options": [{"text": "To facilitate the Scrum Teams with insights and resources that help them improve.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "To monitor the Scrum Team's productivity.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "To identify and remove people that aren't working hard enough.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "To continually monitor staffing levels of the Developers.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>To facilitate the Scrum Teams with insights and resources that help them improve.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Which technique is the best way the Scrum Master can ensure that the Developers communicates effectively with the Product Owner?", "type": "multiple-choice", "options": [{"text": "Monitor communications between them and facilitate direct collaboration.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Teach the Developers to talk in terms of business needs and objectives.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Teach the Product Owner about the technologies employed during the Sprints.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Act as a go-between for them.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Monitor communications between them and facilitate direct collaboration.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "How detailed must the Sprint Backlog be?", "type": "multiple-choice", "options": [{"text": "Detailed enough for the Developers to inspect progress in the Daily Scrum, while remaining updateable as more is learned.", "explanation": "The Sprint Backlog is a real-time plan and should have enough detail to inspect progress in the Daily Scrum.", "correct": true, "selected": false}, {"text": "Fully decomposed into every task before Sprint Planning ends.", "explanation": "The Sprint Backlog is updated throughout the Sprint as more is learned.", "correct": false, "selected": false}, {"text": "Detailed only enough for the Product Owner to report status.", "explanation": "The Sprint Backlog is a plan by and for the Developers.", "correct": false, "selected": false}, {"text": "Frozen after Sprint Planning so progress can be measured against the original plan.", "explanation": "The Sprint Backlog is adapted throughout the Sprint.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Detailed enough for the Developers to inspect progress in the Daily Scrum, while remaining updateable as more is learned.\u003c/li>\u003c/ul>", "tip": "\u003cp>It is an actionable, evolving plan rather than a frozen contract.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "Who is responsible for managing the progress of work during a Sprint?", "type": "multiple-choice", "options": [{"text": "The Scrum Master.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Developers.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "The Product Owner.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The most junior member of the Team.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Who is responsible for collaborating with stakeholders?", "type": "multiple-choice", "options": [{"text": "The Developers.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Team Manager.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Project Manager.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Scrum Team.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "The Business Analyst.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Team.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "What two factors are best considered when establishing the Sprint length? (choose two)", "type": "multiple-choice", "options": [{"text": "The organization has mandated similar length sprints.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The level of uncertainty over the technology to be used.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "The frequency at which team formation can be changed.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The risk of being disconnected from the stakeholders.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The level of uncertainty over the technology to be used.\u003c/li>\u003cli>The risk of being disconnected from the stakeholders.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 2 correct options.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Which of these may the Scrum Team create during a Sprint?", "type": "multiple-choice", "options": [{"text": "A usable Increment that meets the Definition of Done.", "explanation": "A Scrum Team creates valuable, useful Increments, and work is not part of an Increment unless it meets the Definition of Done.", "correct": true, "selected": false}, {"text": "An Increment containing known unfinished work that does not meet the Definition of Done.", "explanation": "Unfinished work cannot be part of an Increment.", "correct": false, "selected": false}, {"text": "A separate testing phase to be completed after the Sprint.", "explanation": "Quality is built into the work through the Definition of Done.", "correct": false, "selected": false}, {"text": "A partial Increment that becomes Done automatically when the Sprint ends.", "explanation": "Elapsed time does not make unfinished work Done.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>A usable Increment that meets the Definition of Done.\u003c/li>\u003c/ul>", "tip": "\u003cp>An Increment must be usable and conform to the Definition of Done.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "Who creates a Product Backlog item's estimate?", "type": "multiple-choice", "options": [{"text": "The Developers after clarifying requirements with the Product Owner.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "The Product Owner with input from the Developers.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The most senior people in the organization, including architects and subject matter experts.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Scrum Master.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Developers, alone.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers after clarifying requirements with the Product Owner.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Who starts the Daily Scrum?", "type": "multiple-choice", "options": [{"text": "The person coming in last. This encourages people to be on time and helps to stay within the time-box.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Whoever the Developers decides should start.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "The person who has the token.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Scrum Master. This ensures that the Developers have the meeting and stays within the time-box.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The person who last broke the build.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Whoever the Developers decides should start.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "You are the Scrum Master on a newly formed Scrum Team. Which three of the following activities would probably help the team in starting up? (choose three)", "type": "multiple-choice", "options": [{"text": "Introduce a bonus system for the top performers in the team.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Have the Scrum Team members introduce themselves to each other and give a brief background of their skills and work history.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Have the development managers for each Developer introduce their direct reports and go over their responsibilities on the Scrum Team.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Ensure the Scrum Team members have compatible personalities.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Ensure the team understands they need a Definition of Done.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Ask the Product Owner to discuss the product or project, its history, goals, and context, as well as answer questions.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Have the Scrum Team members introduce themselves to each other and give a brief background of their skills and work history.\u003c/li>\u003cli>Ensure the team understands they need a Definition of Done.\u003c/li>\u003cli>Ask the Product Owner to discuss the product or project, its history, goals, and context, as well as answer questions.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 3 correct options.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Which three statements describe the purpose or effect of the Definition of Done? (choose three)", "type": "multiple-choice", "options": [{"text": "It creates transparency by giving everyone a shared understanding of completed work.", "explanation": "The Definition of Done creates transparency through a shared understanding of completed work.", "correct": true, "selected": false}, {"text": "It describes the quality measures required for the product.", "explanation": "The 2020 Guide defines it as the formal description of the Increment's state when required quality measures are met.", "correct": true, "selected": false}, {"text": "Work cannot be considered part of an Increment unless it meets the Definition of Done.", "explanation": "This is an explicit rule in the 2020 Scrum Guide.", "correct": true, "selected": false}, {"text": "It fixes the exact number of Product Backlog items that must be selected in Sprint Planning.", "explanation": "The Definition of Done informs forecasting but does not dictate an exact item count.", "correct": false, "selected": false}, {"text": "It is a release approval granted by the Product Owner.", "explanation": "The Definition of Done is a quality standard, not a Product Owner approval gate.", "correct": false, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>It creates transparency by giving everyone a shared understanding of completed work.\u003c/li>\u003cli>It describes the quality measures required for the product.\u003c/li>\u003cli>Work cannot be considered part of an Increment unless it meets the Definition of Done.\u003c/li>\u003c/ul>", "tip": "\u003cp>Think about transparency, quality, and the boundary between unfinished work and an Increment.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "The Daily Scrum is an event that happens every day. What would be three key concerns if the frequency were to be lowered to every two or three days? (choose three)", "type": "multiple-choice", "options": [{"text": "Opportunities to inspect and adapt the Sprint Backlog are lost.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Impediments are raised and resolved more slowly.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "The Product Owner cannot accurately report progress to the stakeholders.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Too much work is spent updating the Scrum board before the meeting.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Scrum Master loses the ability to update the Gantt chart properly.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Sprint Backlog may become inaccurate.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Opportunities to inspect and adapt the Sprint Backlog are lost.\u003c/li>\u003cli>Impediments are raised and resolved more slowly.\u003c/li>\u003cli>The Sprint Backlog may become inaccurate.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 3 correct options.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Which statement best describes Scrum?", "type": "multiple-choice", "options": [{"text": "A lightweight framework that helps people, teams, and organizations generate value through adaptive solutions for complex problems.", "explanation": "This matches the 2020 Scrum Guide's definition.", "correct": true, "selected": false}, {"text": "A complete methodology that prescribes how to develop software.", "explanation": "Scrum is a lightweight framework and is not limited to software.", "correct": false, "selected": false}, {"text": "A predictive process that fixes scope and plans all work up front.", "explanation": "Scrum is founded on empiricism and adaptation.", "correct": false, "selected": false}, {"text": "A cookbook of technical best practices.", "explanation": "Scrum does not prescribe detailed technical practices.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>A lightweight framework that helps people, teams, and organizations generate value through adaptive solutions for complex problems.\u003c/li>\u003c/ul>", "tip": "\u003cp>Scrum deliberately leaves room for other practices inside a minimal framework.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "Which Scrum Values are exhibited by not building Product Backlog items that have low business value? (choose three)", "type": "multiple-choice", "options": [{"text": "Economic Value Added.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Respect.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Focus.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Earned Value.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Courage.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Respect.\u003c/li>\u003cli>Focus.\u003c/li>\u003cli>Courage.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 3 correct options.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "How should Product Backlog items be chosen when multiple Scrum Teams work from the same Product Backlog?", "type": "multiple-choice", "options": [{"text": "The Scrum Team with the highest velocity pulls Product Backlog items first.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Developers pull in work in agreement with the Product Owner.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "The Product Owner should provide each team with its own Product Backlog.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Each Scrum Team takes an equal numbers of items.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Product Owner decides.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers pull in work in agreement with the Product Owner.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "How often should Developers change?", "type": "multiple-choice", "options": [{"text": "As needed, while taking into account a short term reduction in productivity.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Never, because it reduces productivity.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "As needed, with no special allowance for changes in productivity.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Every Sprint to promote shared learning.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>As needed, while taking into account a short term reduction in productivity.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Who should make sure everyone on the Developers does his or her tasks for the Sprint?", "type": "multiple-choice", "options": [{"text": "The Project Manager.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Product Owner.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Scrum Master.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Developers.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "All of the above.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Which statement best describes how the Definition of Done may evolve?", "type": "multiple-choice", "options": [{"text": "The Scrum Team may improve it as more is learned, while any organizational Definition of Done remains a minimum standard.", "explanation": "The team inspects its Definition of Done and can improve its practices; organizational standards must be followed as a minimum.", "correct": true, "selected": false}, {"text": "It can be changed only during the Sprint Retrospective.", "explanation": "The Retrospective is a natural inspection point, but Scrum does not restrict Definition of Done changes to that event.", "correct": false, "selected": false}, {"text": "The Product Owner may lower it during a Sprint to finish more items.", "explanation": "Quality does not decrease during a Sprint, and the Definition of Done is not a scope lever.", "correct": false, "selected": false}, {"text": "It may be ignored when a deadline is at risk.", "explanation": "Work that does not meet the Definition of Done is not part of an Increment.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Team may improve it as more is learned, while any organizational Definition of Done remains a minimum standard.\u003c/li>\u003c/ul>", "tip": "\u003cp>The Retrospective can surface improvements, but the Guide does not make it the only moment for change.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "During Sprint Planning, the Developers realize they have selected more work than they can reasonably complete. Which two actions are appropriate? (choose two)", "type": "multiple-choice", "options": [{"text": "Discuss the selection with the Product Owner and adjust the Product Backlog items selected for the Sprint.", "explanation": "Developers select items through discussion with the Product Owner and can adjust the selection during planning.", "correct": true, "selected": false}, {"text": "Use knowledge of past performance, upcoming capacity, and the Definition of Done to make a more confident forecast.", "explanation": "The 2020 Guide explicitly identifies these as information that improves the Developers' Sprint forecast.", "correct": true, "selected": false}, {"text": "Keep all selected items and plan mandatory overtime.", "explanation": "Scrum promotes sustainable pace and does not prescribe overtime to preserve a forecast.", "correct": false, "selected": false}, {"text": "Extend the Sprint until all selected items are complete.", "explanation": "Sprints are fixed-length events.", "correct": false, "selected": false}, {"text": "Ask the Scrum Master to assign the excess work to specific Developers.", "explanation": "The Scrum Team is self-managing; the Scrum Master does not assign tasks.", "correct": false, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Discuss the selection with the Product Owner and adjust the Product Backlog items selected for the Sprint.\u003c/li>\u003cli>Use knowledge of past performance, upcoming capacity, and the Definition of Done to make a more confident forecast.\u003c/li>\u003c/ul>", "tip": "\u003cp>Sprint Planning is collaborative, and the selected scope is a forecast informed by capacity and the Definition of Done.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "Currently, your Developers are organized to address a single layer only (for example, front end, middle tier, back end, and interfaces). What are three things to consider when deciding to move away from such component teams toward feature teams? (choose three)", "type": "multiple-choice", "options": [{"text": "You cannot do Scrum without feature teams.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Productivity may suffer when making this kind of move.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Getting support from the business side first helps.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Feature teams have less communication overhead.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "With feature teams, it is easier to calculate the productivity per team.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Productivity may suffer when making this kind of move.\u003c/li>\u003cli>Getting support from the business side first helps.\u003c/li>\u003cli>Feature teams have less communication overhead.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 3 correct options.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "During a Sprint, when is new work or further decomposition of work added to the Sprint Backlog?", "type": "multiple-choice", "options": [{"text": "When the Product Owner identifies new work.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "As soon as possible after they are identified.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "When the Scrum Master has time to enter them.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "During the Daily Scrum after the Developers approves them.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>As soon as possible after they are identified.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "What is the main reason for the Scrum Master to be at the Daily Scrum?", "type": "multiple-choice", "options": [{"text": "To gather status and progress information to report to management.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "To write down any changes to the Sprint Backlog, including adding new items, and tracking progress on the burn-down.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "He or she does not have to be there; he or she only has to ensure the Developers have a Daily Scrum.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "To make sure every team member answers the three questions.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>He or she does not have to be there; he or she only has to ensure the Developers have a Daily Scrum.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "You have six teams using a traditional method to deliver a product. Your management has asked you to start using Scrum. In the initial project there were separate plans and teams for the layers of a software system, i.e. one for the frontend, one for the middle tier, one for the back-end, and one for the interfaces and services. This resembles what is known as component teams. But you have read that it's a good idea to have teams organized by feature. What are the advantages of keeping component teams while starting Scrum?", "type": "multiple-choice", "options": [{"text": "There's less initial disruption than organizing into new teams. As they start, they will discover what works best, and how to potentially re-organize towards this.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Component teams generally have the skills needed to create a working Increment of software that provides business value.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Because they have worked together for some time, they are likely able to start producing shippable Increments faster that new feature teams would.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "There are fewer cross-team dependencies than working in feature teams.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>There&#x27;s less initial disruption than organizing into new teams. As they start, they will discover what works best, and how to potentially re-organize towards this.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "True or False: A properly functioning Scrum Team will have at least one Release Sprint and may well have several.", "type": "multiple-choice", "options": [{"text": "True.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "False.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "True or False: Scrum is a methodology that tells in detail how to build software incrementally.", "type": "multiple-choice", "options": [{"text": "True.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "False.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>False.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "For what is the Scrum Master accountable?", "type": "multiple-choice", "options": [{"text": "Establishing Scrum as defined in the Scrum Guide and enabling the Scrum Team's effectiveness.", "explanation": "These are explicit Scrum Master accountabilities in the 2020 Scrum Guide.", "correct": true, "selected": false}, {"text": "Managing the performance of individual Developers.", "explanation": "The Scrum Team is self-managing; the Scrum Master is not a line manager.", "correct": false, "selected": false}, {"text": "Ordering the Product Backlog.", "explanation": "Product Backlog ordering is a Product Owner accountability.", "correct": false, "selected": false}, {"text": "Assigning Sprint Backlog tasks.", "explanation": "The Sprint Backlog is a plan by and for the Developers.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Establishing Scrum as defined in the Scrum Guide and enabling the Scrum Team&#x27;s effectiveness.\u003c/li>\u003c/ul>", "tip": "\u003cp>The Scrum Master establishes Scrum and enables effectiveness rather than managing people.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "The Developers asks their Product Owner to re-order the Product Backlog. The team is waiting for an external supplier to deliver a specific software component. Without that component there won't be enough work in the next Sprint to occupy the full team. The Product Owner asks the Scrum Master for help. What would be good advice to give the Product Owner?", "type": "multiple-choice", "options": [{"text": "Remind the Product Owner that his primary concern is the flow of value reflected in the ordering of the Product Backlog.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Tell the Product Owner to re-order the Product Backlog so the work involving the external component can be planned in a separate sprint.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Tell the Product Owner that the Product Backlog should be ordered to maximize utilization of the Developers.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Remind the Product Owner that his primary concern is the flow of value reflected in the ordering of the Product Backlog.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Which three statements reflect self-management in the 2020 Scrum Guide? (choose three)", "type": "multiple-choice", "options": [{"text": "The Scrum Team internally decides who does what, when, and how.", "explanation": "This is the 2020 Scrum Guide's description of self-management.", "correct": true, "selected": false}, {"text": "The Developers create the plan for the Sprint, the Sprint Backlog.", "explanation": "Creating the Sprint Backlog is an explicit Developer accountability.", "correct": true, "selected": false}, {"text": "The Developers adapt their plan each day toward the Sprint Goal.", "explanation": "Adapting the plan each day toward the Sprint Goal is an explicit Developer accountability.", "correct": true, "selected": false}, {"text": "The Product Owner assigns tasks to each Developer.", "explanation": "Self-management means work is not assigned this way by the Product Owner.", "correct": false, "selected": false}, {"text": "The Scrum Master approves all technical decisions.", "explanation": "How selected work gets done is at the sole discretion of the Developers.", "correct": false, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>The Scrum Team internally decides who does what, when, and how.\u003c/li>\u003cli>The Developers create the plan for the Sprint, the Sprint Backlog.\u003c/li>\u003cli>The Developers adapt their plan each day toward the Sprint Goal.\u003c/li>\u003c/ul>", "tip": "\u003cp>Look for decisions and planning that remain inside the Scrum Team and with the Developers.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "What is the key concern when multiple Scrum Teams are working from the same Product Backlog?", "type": "multiple-choice", "options": [{"text": "Minimizing dependencies between teams.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Clear definition of requirements.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Meeting original scope projections.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Making sure there's enough work for everyone on every team.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Maximizing velocity.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Minimizing dependencies between teams.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "What does it mean to say that an event has a time-box?", "type": "multiple-choice", "options": [{"text": "The event must happen at a set time.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The event must happen by a given time.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The event must take at least a minimum amount of time.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The event can take no more than a maximum amount of time.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The event can take no more than a maximum amount of time.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Which outcome is expected as Scrum Teams mature?", "type": "multiple-choice", "options": [{"text": "They will improve their Definition of Done to include more stringent criteria.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "The Sprint Retrospectives will grow to be longer than 4 hours.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "There is no need for a time-boxed Sprint, since time-boxes are only for new Scrum Teams.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Sprint Reviews will no longer be needed.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "A Scrum Master is no longer needed since they are a mature team now.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>They will improve their Definition of Done to include more stringent criteria.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "When must an Increment be released to stakeholders or production?", "type": "multiple-choice", "options": [{"text": "Scrum does not prescribe a fixed release time; an Increment may be delivered before the Sprint ends, and the Sprint Review is not a release gate.", "explanation": "The 2020 Guide explicitly says an Increment may be delivered before the Sprint ends and the Sprint Review should never be a gate to releasing value.", "correct": true, "selected": false}, {"text": "At the end of every Sprint without exception.", "explanation": "Creating a valuable, useful Increment every Sprint does not mean it must be released at Sprint end.", "correct": false, "selected": false}, {"text": "Only after the Sprint Review.", "explanation": "The Sprint Review is not a release gate.", "correct": false, "selected": false}, {"text": "Only when every known defect has been removed.", "explanation": "Scrum requires conformance to the Definition of Done, not an absolute zero-defect rule.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Scrum does not prescribe a fixed release time; an Increment may be delivered before the Sprint ends, and the Sprint Review is not a release gate.\u003c/li>\u003c/ul>", "tip": "\u003cp>Separate the requirement to create a usable Increment from the business decision to release it.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "Who creates the Definition of Done when it is not already an organizational standard?", "type": "multiple-choice", "options": [{"text": "The Scrum Team.", "explanation": "If the Definition of Done is not an organizational standard, the Scrum Team must create one appropriate for the product.", "correct": true, "selected": false}, {"text": "The Product Owner alone.", "explanation": "The Definition of Done is not solely a Product Owner decision.", "correct": false, "selected": false}, {"text": "The Scrum Master alone.", "explanation": "The Scrum Master helps establish Scrum but does not unilaterally define Done.", "correct": false, "selected": false}, {"text": "A development organization outside the Scrum Team.", "explanation": "If there is an organizational standard, it is followed as a minimum; otherwise the Scrum Team creates the Definition of Done.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Scrum Team.\u003c/li>\u003c/ul>", "tip": "\u003cp>An organizational standard is a minimum; otherwise the Scrum Team creates the Definition of Done.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "Five new Scrum Teams have been created to build one product. A few of the Developers on one of the Scrum Teams ask the Scrum Master how to coordinate their work with the order teams. What should the Scrum Master do?", "type": "multiple-choice", "options": [{"text": "Teach the Product Owner to work with the lead Developers on ordering Product Backlog in a way to avoid too much technical and development overlap during a Sprint.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Teach them that it is their responsibility to work with the other teams to create an integrated Increment.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Collect the Sprint tasks from the teams at the end of their Sprint Planning and merge that into a consolidated plan for the entire Sprint.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Visit the five teams each day to inspect that their Sprint Backlogs are aligned.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false rue.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "In the Sprint Planning meeting, the Product Owner and the Developers were unable to reach a clear understanding about the highest order Product Backlog items. Because of this, the Developers couldn't figure out how many Product Backlog items it could forecast for the upcoming Sprint. They were able to agree on a Sprint Goal, however. Which of the following two actions should the Scrum Master support? (choose two)", "type": "multiple-choice", "options": [{"text": "Cancel the Sprint. Send the entire team to an advanced Scrum training and then start a new Sprint.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Forecast the most likely Product Backlog items to meet the goal and create a Sprint Backlog based on a likely initial design and plan. Once the time-box for the Sprint Planning meeting is over, start the Sprint and continue to analyze, decompose, and create additional functionality during the Sprint.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Continue the Sprint Planning meeting past its time-box until an adequate number of Product Backlog items are well enough understood for the Developers to make a complete forecast. Then start the Sprint.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "Discuss in the upcoming Sprint Retrospective why this happened and what changes will make it less likely to recur.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "Ask everyone to take as much time as needed to analyze the Product Backlog first, er tasks.", "correct": false, "selected": false}, {"text": "The team failed to freeze the Product Backlog at the start of the project.", "explanation": "The Product Backlog is emergent and should change as more is learned.", "correct": false, "selected": false}, {"text": "The Product Owner did not produce a complete requirements specification before Sprint 1.", "explanation": "Scrum does not require a complete upfront requirements specification.", "correct": false, "selected": false}], "answer": "\u003cp>Correct options:\u003c/p>\u003cul>\u003cli>Insufficient ongoing stakeholder collaboration around the product.\u003c/li>\u003cli>Sprint Reviews were not being used effectively to inspect outcomes and determine future adaptations.\u003c/li>\u003c/ul>", "tip": "\u003cp>Scrum reduces this risk through frequent stakeholder collaboration and inspection of outcomes.\u003c/p>", "reference": "The 2020 Scrum Guide"}, {"query": "When a Scrum Team determines that it will not be able to finish the complete forecast, who has to be present when reviewing and adjusting the Sprint work selected? (choose the best answer)", "type": "multiple-choice", "options": [{"text": "The Developers.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Product Owner and all stakeholders.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Product Owner and the Developers.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "The Scrum Master, project manager and Developers.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Product Owner and the Developers.\u003c/li>\u  of experience to assign people to teams.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>Understanding the product, the product vision and the rules of the Scrum framework, the group divides itself into teams.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "Who is accountable for tracking the remaining work toward the Sprint Goal? (choose the best answer)", "type": "multiple-choice", "options": [{"text": "The Developers.", "explanation": "This option is marked as correct in the supplied Scrum exam question bank.", "correct": true, "selected": false}, {"text": "The Scrum Master.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Product Owner.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}, {"text": "The Project Manager.", "explanation": "This option is not marked as correct in the supplied Scrum exam question bank.", "correct": false, "selected": false}], "answer": "\u003cp>Correct option:\u003c/p>\u003cul>\u003cli>The Developers.\u003c/li>\u003c/ul>", "tip": "\u003cp>This question has 1 correct option.\u003c/p>", "reference": "Supplied Scrum exam question bank."}, {"query": "When must a Product Owner release an Increment?", "type": "multiple-choice", "options": [{"text": "Scrum does not prescribe a mandatory release point; an Increment may be delivered before the Sprint ends.", "explanation": "The Sprint Review is not a gate to releasing value, and Scrum does not require release at Sprint end.", "correct": true, "selected": false}, {"text": "At the end of every Sprint.", "explanation": "A usable Increment is required every Sprint, b     const CURRENT_KEY = "scrumExamCurrent";
    const HISTORY_KEY = "examHistory";
    const EXAM_NAME = "Scrum Exam";

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function isCorrect(question) {
      return question.options.every(option => Boolean(option.selected) === Boolean(option.correct));
    }

    function correctCount(question) {
      return question.options.filter(option => option.correct).length;
    }

    function formatDuration(ms) {
      if (!Number.isFinite(ms) || ms < 0) return "0:00";
      const total = Math.floor(ms / 1000);
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    class ExamQuestion extends HTMLElement {
      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { question, index, total, graded, cheating } = this._state;
        const reveal = graded || cheating;
        const choose = correctCount(question);

        this.innerHTML = `
          <section class="card" aria-labelledby="question-title">
            <div class="card-header">
              <span>Question ${index + 1} of ${total}</span>
              <span>${question.viewed ? "Viewed" : "New"}</span>
            </div>
            <div class="card-body">
              <p class="query" id="question-title"></p>
              <p class="choose-note">Choose ${choose}</p>
              <div class="options"></div>
              ${reveal ? `<div class="answer-panel"><strong>Answer</strong><div class="answer-html"></div></div>` : ""}
            </div>
          </section>
        `;

        this.querySelector(".query").textContent = question.query;
        const options = this.querySelector(".options");

        question.options.forEach((option, optionIndex) => {
          const label = document.createElement("label");
          label.className = "option";
          if (reveal && option.correct) label.classList.add("reveal-correct");
          if (reveal && option.selected && !option.correct) label.classList.add("reveal-wrong-selected");

          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = Boolean(option.selected);
          input.disabled = Boolean(graded);
          input.addEventListener("change", () => {
            this.dispatchEvent(new CustomEvent("option-toggle", {
              bubbles: true,
              detail: { optionIndex }
            }));
          });

          const textWrap = document.createElement("span");
          const text = document.createElement("span");
          text.textContent = option.text;
          textWrap.appendChild(text);

          if (reveal && option.explanation) {
            const explanation = document.createElement("small");
            explanation.textContent = option.explanation;
            textWrap.appendChild(explanation);
          }

          label.append(input, textWrap);
          options.appendChild(label);
        });

        const answer = this.querySelector(".answer-html");
        if (answer) answer.innerHTML = question.answer || "";
      }
    }
    customElements.define("exam-question", ExamQuestion);

    class QuestionJumper extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { questions, current, graded, cheating } = this._state;
        const reveal = graded || cheating;

        this.innerHTML = `
          <section class="card">
            <div class="card-header collapsible-title" role="button" tabindex="0">
              <span>Question Jumper</span>
              <span class="chevron">${this.collapsed ? "▼" : "▲"}</span>
            </div>
            <div class="card-body jumper-body" ${this.collapsed ? 'hidden' : ''}>
              <div class="jumper-grid"></div>
            </div>
          </section>
        `;

        const title = this.querySelector(".collapsible-title");
        const toggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        title.addEventListener("click", toggle);
        title.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });

        const grid = this.querySelector(".jumper-grid");
        questions.forEach((question, index) => {
          const button = document.createElement("button");
          button.className = "jump-btn";
          button.textContent = String(index + 1);
          button.title = question.query;

          if (question.viewed) button.classList.add("viewed");
          if (index === current) button.classList.add("current");

          if (reveal) {
            button.classList.remove("viewed", "current");
            button.classList.add(isCorrect(question) ? "correct" : "incorrect");
            if (index === current) button.style.outline = "3px solid #111827";
          }

          button.addEventListener("click", () => {
            this.dispatchEvent(new CustomEvent("jump", {
              bubbles: true,
              detail: { index }
            }));
          });
          grid.appendChild(button);
        });
      }
    }
    customElements.define("question-jumper", QuestionJumper);

    class ExamHistoryPanel extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        const history = this._state?.history || { exams: [] };
        const exams = Array.isArray(history.exams) ? history.exams : [];

        this.innerHTML = `
          <section class="card">
            <div class="card-header">
              <span class="collapsible-title" role="button" tabindex="0">Exam History</span>
              <div class="control-group">
                <button class="btn-secondary toggle-history">${this.collapsed ? "Show" : "Hide"}</button>
                <button class="btn-danger clear-history" ${exams.length ? "" : "disabled"}>Clear History</button>
              </div>
            </div>
            <div class="card-body history-body" ${this.collapsed ? "hidden" : ""}></div>
          </section>
        `;

        const doToggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        this.querySelector(".toggle-history").addEventListener("click", doToggle);
        this.querySelector(".collapsible-title").addEventListener("click", doToggle);
        this.querySelector(".clear-history").addEventListener("click", () => {
          this.dispatchEvent(new CustomEvent("history-clear", { bubbles: true }));
        });

        const body = this.querySelector(".history-body");
        if (!exams.length) {
          body.innerHTML = `<p class="history-empty">No completed exams are stored on this device.</p>`;
          return;
        }

        [...exams].reverse().forEach((exam, reverseIndex) => {
          const questions = Array.isArray(exam.questions) ? exam.questions : [];
          const score = questions.filter(isCorrect).length;
          const number = exams.length - reverseIndex;
          const finish = Number(exam.finish || exam.completedAt || 0);
          const start = Number(exam.start || 0);
          const stamp = finish ? new Date(finish).toLocaleString() : "Completed exam";
          const duration = finish && start ? formatDuration(finish - start) : "";

          const wrap = document.createElement("div");
          wrap.className = "history-exam";

          const summary = document.createElement("div");
          summary.className = "history-summary";
          summary.innerHTML = `<strong>Attempt ${number}: ${score} / ${questions.length}</strong><span>${stamp}${duration ? ` · ${duration}` : ""}</span>`;
          wrap.appendChild(summary);

          const dots = document.createElement("div");
          dots.className = "history-dots";
          questions.forEach((question, i) => {
            const dot = document.createElement("span");
            dot.className = "history-dot" + (isCorrect(question) ? " correct" : "");
            dot.textContent = String(i + 1);
            dot.title = question.query;
            dots.appendChild(dot);
          });
          wrap.appendChild(dots);
          body.appendChild(wrap);
        });
      }
    }
    customElements.define("exam-history-panel", ExamHistoryPanel);

    class ScrumExamApp extends HTMLElement {
      constructor() {
        super();
        this.state = null;
        this.timerHandle = null;
      }

      connectedCallback() {
        this.load();
        this.addEventListener("option-toggle", e => this.toggleOption(e.detail.optionIndex));
        this.addEventListener("jump", e => this.setCurrentQuestion(e.detail.index));
        this.addEventListener("history-clear", () => this.clearHistory());
        this.render();
        this.timerHandle = setInterval(() => this.updateTimer(), 1000);
      }

      disconnectedCallback() {
        clearInterval(this.timerHandle);
      }

      load() {
        let saved = null;
        try {
          saved = JSON.parse(localStorage.getItem(CURRENT_KEY));
        } catch (_) {}

        if (saved && Array.isArray(saved.questions) && saved.questions.length === QUESTION_BANK.length && !saved.graded) {
          this.state = saved;
        } else {
          const questions = clone(QUESTION_BANK).map(q => ({
            ...q,
            viewed: false,
            options: q.options.map(o => ({ ...o, selected: false }))
          }));
          questions[0].viewed = true;
          this.state = {
            name: EXAM_NAME,
            graded: false,
            start: Date.now(),
            finish: 0,
            questions,
            currentQuestionNumber: 0,
            cheating: new URLSearchParams(location.search).get("page") === "answer"
          };
          this.saveCurrent();
        }
      }

      saveCurrent() {
        if (!this.state.graded) {
          localStorage.setItem(CURRENT_KEY, JSON.stringify(this.state));
        }
      }

      getHistory() {
        try {
          const existing = JSON.parse(localStorage.getItem(HISTORY_KEY));
          if (existing && Array.isArray(existing.exams)) return existing;
        } catch (_) {}
        const history = { name: "Exam History", exams: [] };
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        return history;
      }

      clearHistory() {
        localStorage.setItem(HISTORY_KEY, JSON.stringify({ name: "Exam History", exams: [] }));
        this.render();
      }

      toggleOption(optionIndex) {
        if (this.state.graded) return;
        const q = this.state.questions[this.state.currentQuestionNumber];
        q.options[optionIndex].selected = !q.options[optionIndex].selected;
        q.viewed = true;
        this.saveCurrent();
        this.render();
      }

      setCurrentQuestion(index) {
        const next = Math.max(0, Math.min(index, this.state.questions.length - 1));
        this.state.currentQuestionNumber = next;
        this.state.questions[next].viewed = true;
        this.saveCurrent();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      toggleCheat() {
        this.state.cheating = !this.state.cheating;
        this.saveCurrent();
        this.render();
      }

      grade() {
        if (this.state.graded) return;
        this.state.graded = true;
        this.state.cheating = true;
        this.state.finish = Date.now();

        const history = this.getHistory();
        history.exams.push(clone(this.state));
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        localStorage.removeItem(CURRENT_KEY);
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      restart() {
        localStorage.removeItem(CURRENT_KEY);
        this.load();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      score() {
        return this.state.questions.filter(isCorrect).length;
      }

      answeredCount() {
        return this.state.questions.filter(q => q.options.some(o => o.selected)).length;
      }

      updateTimer() {
        const el = this.querySelector("[data-timer]");
        if (!el || !this.state) return;
        const end = this.state.finish || Date.now();
        el.textContent = formatDuration(end - this.state.start);
      }

      render() {
        if (!this.state) return;
        const qIndex = this.state.currentQuestionNumber;
        const total = this.state.questions.length;
        const answered = this.answeredCount();
        const score = this.score();

        this.innerHTML = `
          <main class="page-shell">
            <header class="hero">
              <div class="hero-top">
                <div>
                  <h1>Scrum Exam | 2020 Guide</h1>
                  <p>2020 Scrum Guide aligned · standalone Web Components edition · no React, no Bootstrap, no external dependencies</p>
                </div>
                <div class="pill">Elapsed <span data-timer>${formatDuration((this.state.finish || Date.now()) - this.state.start)}</span></div>
              </div>
              <div class="meta-row">
                <span class="pill">${total} questions</span>
                <span class="pill">${answered} answered</span>
                <span class="pill">${this.state.questions.filter(q => q.viewed).length} viewed</span>
                ${this.state.graded ? `<span class="pill">Score ${score} / ${total}</span>` : ""}
              </div>
            </header>

            ${this.state.graded ? `
              <section class="card results">
                <div class="card-body">
                  <strong>Your grade is ${score} out of ${total}.</strong>
                  <div class="status-line">Correct answers and option explanations are now visible. Your completed attempt has been saved to local storage.</div>
                </div>
              </section>
            ` : ""}

            <exam-question></exam-question>

            <div class="controls">
              <div class="control-group">
                <button class="btn-secondary previous" ${qIndex === 0 ? "disabled" : ""}>&lt;&lt; Back</button>
                <button class="btn-primary next" ${qIndex === total - 1 ? "disabled" : ""}>Next &gt;&gt;</button>
              </div>
              <div class="control-group">
                <button class="btn-warning cheat">${this.state.cheating ? "Be Honest" : "Cheat"}</button>
                ${this.state.graded
                  ? `<button class="btn-primary restart">Start New Attempt</button>`
                  : `<button class="btn-primary finish">Finish</button>`}
              </div>
            </div>

            <question-jumper></question-jumper>
            <exam-history-panel></exam-history-panel>

            <p class="footer-note">Progress and completed attempts are stored only in this browser's localStorage.</p>
          </main>
        `;

        const questionEl = this.querySelector("exam-question");
        questionEl.state = {
          question: this.state.questions[qIndex],
          index: qIndex,
          total,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const jumper = this.querySelector("question-jumper");
        jumper.state = {
          questions: this.state.questions,
          current: qIndex,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const history = this.querySelector("exam-history-panel");
        history.state = { history: this.getHistory() };

        this.querySelector(".previous").addEventListener("click", () => this.setCurrentQuestion(qIndex - 1));
        this.querySelector(".next").addEventListener("click", () => this.setCurrentQuestion(qIndex + 1));
        this.querySelector(".cheat").addEventListener("click", () => this.toggleCheat());

        const finish = this.querySelector(".finish");
        if (finish) finish.addEventListener("click", () => this.grade());

        const restart = this.querySelector(".restart");
        if (restart) restart.addEventListener("click", () => this.restart());
      }
    }
    customElements.define("scrum-exam-app", ScrumExamApp);
  </script>
</body>
</html>
