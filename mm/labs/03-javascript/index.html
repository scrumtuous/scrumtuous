<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Control - Login</title><link rel="stylesheet" href="styles.css"></head><body><h1>Mission Control</h1>
<form id="login-form" novalidate action="about:blank">
  <label for="username">Username</label>
  <input id="username" name="username" required minlength="3" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" type="password" required minlength="8" autocomplete="current-password">
  <button type="submit">Log In</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<footer>LEAP Mission Control</footer><script src="script.js"></script></body></html>
