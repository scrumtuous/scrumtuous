<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mission Control - Login</title><style>body { font: 16px/1.6 system-ui; color: #2e1732; background: #fff8ed; padding: 18px; }
button { background: #713b65; color: white; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; font: inherit; }
button:disabled { opacity: .55; cursor: wait; }
label { display:block; margin-top:10px; }
input, select { display:block; padding:8px; font:inherit; max-width:100%; }
.done { text-decoration: line-through; color: #4b763f; }
.invalid { border: 3px solid #b51d3a; }
.error { color:#a61431; } .success { color:#286e40; }
#message { min-height:2em; }</style></head><body><h1>Mission Control</h1>
<form id="login-form">
  <label for="username">Username</label>
  <input id="username" name="username" required minlength="3" autocomplete="username">
  <label for="password">Password</label>
  <input id="password" type="password" required minlength="8" autocomplete="current-password">
  <button type="submit">Log In</button>
</form>
<p id="message" role="status" aria-live="polite"></p>
<footer>LEAP Mission Control</footer><script>const AUTH_URL = "http://localhost:3000/auth/login";
const form = document.getElementById("login-form");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const submitBtn = form.querySelector("button[type=submit]");
const message = document.getElementById("message");
function showMessage(text, kind) {
  message.textContent = text;
  message.className = kind;
}
form.addEventListener("submit", async (event) => {
  event.preventDefault();
  if (submitBtn.disabled) return;
  submitBtn.disabled = true;
  showMessage("Logging in...", "");
  let stage = "request";
  try {
    const response = await fetch(AUTH_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: usernameInput.value,
        password: passwordInput.value,
      }),
    });
    stage = "response body";
    if (!response.ok) {
      const body = await response.json();
      showMessage(`Login failed: ${body.message ?? response.status}`, "error");
      return;
    }
    const data = await response.json();
    if (typeof data.accessToken !== "string") {
      throw new Error("The response did not contain an accessToken string.");
    }
    showMessage(`Logged in. Token starts: ${data.accessToken.slice(0, 20)}...`, "success");
  } catch (error) {
    console.error(`Failure during ${stage}:`, error);
    showMessage(`Could not complete ${stage}: ${error.message}`, "error");
  } finally {
    submitBtn.disabled = false;
  }
});</script></body></html>
