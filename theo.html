he physical servers for Amazon RDS and replaces and refreshes hardware as needed without customer involvement.\u003c/p\u003e\u003cp\u003e\u003ci\u003eDatabase server maintenance\u003c/i\u003e is incorrect because AWS handles database engine patching, minor version upgrades within the selected window, backups, and routine maintenance tasks for Amazon RDS instances.\u003c/p\u003e\u003cp\u003e\u003ci\u003ePower, networking, and cooling capacity planning\u003c/i\u003e is incorrect because AWS is responsible for the data center facilities and the physical infrastructure that provide power, networking, and cooling for managed services like Amazon RDS.\u003c/p\u003e","tip":"\u003cp\u003eWhen a service is \u003ci\u003emanaged\u003c/i\u003e like Amazon RDS, think AWS handles the infrastructure and platform tasks while you handle \u003ci\u003edata\u003c/i\u003e, \u003ci\u003eidentity and access\u003c/i\u003e, and \u003ci\u003eapplication-level configuration and optimization\u003c/i\u003e. Map each task to the shared responsibility model to find the right answer quickly.\u003c/p\u003e","references":[{"description":"What is Amazon RDS","url":"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html"}]},{"originalQuery":"Acompany wants its Amazon EC2 instances to operate in a highly available environment, even if there is a natural disaster in a particular geographic area.\nWhich approach will achieve this goal?","originalOptions":[{"text":"Use EC2 instances in multiple AWS Regions.","correct":true},{"text":"Use EC2 instances in multiple Amazon CloudFront locations.","correct":false},{"text":"Use EC2 instances in multiple edge locations.","correct":false},{"text":"Use EC2 instances in AWS Local Zones.","correct":false}],"source":"exam","query":"Scrumtuous Manufacturing needs its Amazon EC2 workloads to remain available if a major outage affects one broad geographic area. Which deployment approach supports this requirement?","options":[{"text":"Run EC2 instances in multiple AWS Regions","explanation":"This option distributes EC2 capacity across separate AWS geographic areas that are designed to operate independently.","correct":true,"selected":false},{"text":"Run EC2 instances in AWS Local Zones","explanation":"This option uses AWS infrastructure that extends selected Region services closer to specific metropolitan areas.","correct":false,"selected":false},{"text":"Run EC2 instances in multiple edge locations","explanation":"This option involves edge locations that are used by certain AWS edge services for low latency access to content and requests.","correct":false,"selected":false},{"text":"Run EC2 instances in multiple Amazon CloudFront locations","explanation":"This option refers to using locations associated with CloudFront content delivery rather than standard EC2 deployment targets.","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct answer is \u003cb\u003eRun EC2 instances in multiple AWS Regions\u003c/b\u003e because this design spreads your workload across independent Regions. If a major outage impacts one broad geographic area then the workload in the other Region can continue to serve users.\u003c/p\u003e\u003cp\u003eRegions are isolated fault domains with separate infrastructure and control planes. Distributing EC2 across at least two Regions and using DNS failover patterns with services such as Amazon Route 53 helps maintain availability during Regional disruptions. Replicating data between Regions using services like Amazon S3 replication or database replication enables a smooth failover so users can continue to access the application even if one Region experiences an outage.\u003c/p\u003e\u003cp\u003eThe option \u003ci\u003eRun EC2 instances in multiple Amazon CloudFront locations\u003c/i\u003e is incorrect because CloudFront edge locations provide content delivery and edge compute features like Lambda@Edge and CloudFront Functions. You cannot launch EC2 instances in CloudFront locations and using CloudFront does not provide Regional failover for EC2 workloads.\u003c/p\u003e\u003cp\u003eThe option \u003ci\u003eRun EC2 instances in multiple edge locations\u003c/i\u003e is incorrect for the same reason. Edge locations support edge services and caching rather than general purpose EC2 compute. They do not protect EC2 applications from a Regional outage.\u003c/p\u003e\u003cp\u003eThe option \u003ci\u003eRun EC2 instances in AWS Local Zones\u003c/i\u003e is incorrect because Local Zones are extensions of a parent Region that place compute closer to end users. They remain dependent on the parent Region so they do not provide isolation from a Regional failure.\u003c/p\u003e","tip":"\u003cp\u003eMatch the scope of failure to the scope of your design. If the question mentions a \u003ci\u003ebroad geographic outage\u003c/i\u003e then choose a \u003ci\u003emulti Region\u003c/i\u003e architecture rather than Availability Zones, Local Zones, or edge locations.\u003c/p\u003e","references":[{"description":"Regions and Availability Zones for Amazon EC2","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html"},{"description":"Disaster Recovery of Workloads on AWS","url":"https://docs.aws.amazon.com/whitepapers/latest/disaster-recovery-workloads-on-aws/welcome.html"},{"description":"Amazon CloudFront Developer Guide Introduction","url":"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html"},{"description":"What is AWS Local Zones","url":"https://docs.aws.amazon.com/local-zones/latest/ug/what-is-aws-local-zones.html"}]},{"originalQuery":"Acompany migrates to AWS and deploys an application to Amazon EC2 instances. The EC2 instances are over-provisioned. Average CPU utilization of the EC2 instances\nis 30%.\nThe company wants to minimize expenses.\nWhich solution will meet this requirement? \u003e","originalOptions":[{"text":"Move all workloads to a single medium instance to reduce management overhead.","correct":false},{"text":"Provision the highest performance instances for all workloads.","correct":false},{"text":"Rightsize the instances to match performance and capacity requirements.","correct":true},{"text":"Decouple the application into smaller, independent services.","correct":false}],"source":"exam","query":"Scrumtuous Publishing has moved an application to AWS and runs it on Amazon EC2 instances. The instances have more capacity than the workload uses, and average CPU utilization is 25 percent. Scrumtuous Publishing wants to reduce its AWS spending while still meeting the application's needs. Which approach should the company use?","options":[{"text":"Rightsize the EC2 instances based on performance and capacity needs","explanation":"Rightsizing uses observed resource utilization and workload requirements to guide instance selection.","correct":true,"selected":false},{"text":"Consolidate every workload onto one medium EC2 instance to reduce administrative effort","explanation":"This approach places multiple workloads on a single instance and focuses on operational simplicity.","correct":false,"selected":false},{"text":"Use the highest performance EC2 instances for all workloads","explanation":"This approach standardizes deployments on the most powerful instance choices available for the workloads.","correct":false,"selected":false},{"text":"Break the application into smaller independent services","explanation":"This approach changes the application design by separating functions into independently managed components.","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Cloud Concepts","answer":"\u003cp\u003eThe correct option is \u003cb\u003eRightsize the EC2 instances based on performance and capacity needs\u003c/b\u003e because the workload averages only 25 percent CPU utilization and is clearly overprovisioned. Rightsizing adjusts the instance size or moves to a better suited instance family so the application still meets its performance targets while compute costs go down.\u003c/p\u003e\u003cp\u003eRightsizing uses actual utilization data to choose smaller instance sizes or more efficient families. You can use AWS Compute Optimizer and AWS Cost Explorer rightsizing recommendations to identify candidates, then test and adjust to match real demand. This approach can include moving to burstable T instances for steady low usage or migrating to AWS Graviton based instances when compatible to gain better price performance, all without a major redesign.\u003c/p\u003e\u003cp\u003eThe choice \u003ci\u003eConsolidate every workload onto one medium EC2 instance to reduce administrative effort\u003c/i\u003e is not a sound cost optimization practice because it introduces a single point of failure and removes elasticity. It may also cause resource contention between components and does not directly solve the overprovisioning problem.\u003c/p\u003e\u003cp\u003eThe option \u003ci\u003eUse the highest performance EC2 instances for all workloads\u003c/i\u003e would raise costs with no benefit given the low utilization. Cost optimization focuses on matching capacity to need rather than maximizing performance where it is not required.\u003c/p\u003e\u003cp\u003eThe option \u003ci\u003eBreak the application into smaller independent services\u003c/i\u003e represents a major architectural change that is not necessary to reduce cost in this scenario. Microservices can improve agility and scalability for some use cases, yet they add refactoring effort and operational overhead and they do not inherently fix underutilized compute.\u003c/p\u003e","tip":"\u003cp\u003eWhen you see sustained low utilization, think \u003ci\u003erightsizing\u003c/i\u003e before architectural changes. Use AWS Compute Optimizer and Cost Explorer to find smaller or more efficient instance families, then validate performance and adjust gradually.\u003c/p\u003e","references":[{"description":"AWS Compute Optimizer User Guide: What is AWS Compute Optimizer","url":"https://docs.aws.amazon.com/compute-optimizer/latest/ug/what-is.html"},{"description":"AWS Well-Architected Framework Cost Optimization Pillar","url":"https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html"}]},{"originalQuery":"A company wants to detect unused user permissions across the company's AWS environment. Which AWS service or feature will meet these requirements?","originalOptions":[{"text":"AWS Identity and Access Management Access Analyzer findings","correct":true},{"text":"AWS Organizations service control policies (SCPs)","correct":false},{"text":"AWS Config managed rules","correct":false},{"text":"AWS Trusted Advisor","correct":false}],"source":"exam","query":"Scrumtuous Retailer needs to identify user permissions that are no longer being used across its AWS accounts. Which AWS service or feature should the company use to meet this need?","options":[{"text":"AWS Config managed rules","explanation":"This feature evaluates AWS resource configurations against predefined compliance checks.","correct":false,"selected":false},{"text":"AWS Identity and Access Management Access Analyzer findings","explanation":"This feature provides analysis results related to access and permissions for identities and resources in an AWS environment.","correct":true,"selected":false},{"text":"AWS Trusted Advisor","explanation":"This service provides checks and guidance across areas such as cost optimization, performance, security, fault tolerance, and service limits.","correct":false,"selected":false},{"text":"AWS Organizations service control policies","explanation":"This feature sets maximum available permissions for accounts that are managed within an AWS organization.","correct":false,"selected":false}],"answerCode":"2","type":"multiple-choice","geminiFlashAnswerCode":"2","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAWS Identity and Access Management Access Analyzer findings\u003c/b\u003e.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS Identity and Access Management Access Analyzer findings\u003c/b\u003e helps you detect permissions that are granted but not used, and it can do this across multiple accounts in your organization. It analyzes recent access activity and surfaces findings that show which actions in policies have not been exercised within the evaluation window. This enables you to remove unnecessary permissions and align policies with the principle of least privilege.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Organizations service control policies\u003c/i\u003e are used to set guardrails that limit the maximum permissions that accounts in your organization can use. They do not analyze actual usage and they do not produce findings about unused permissions.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Config managed rules\u003c/i\u003e evaluate resource configurations for compliance and drift. Although there are rules related to IAM hygiene such as unused credentials, these rules do not analyze policy permissions usage across accounts to identify unused permissions.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Trusted Advisor\u003c/i\u003e provides best practice checks for cost optimization, performance, service quotas, and some security configurations. It does not inspect IAM policy usage to identify unused permissions.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question asks you to find permissions that are not being used, think about \u003ci\u003eleast privilege\u003c/i\u003e and look for IAM Access Analyzer findings that use access activity to recommend policy reductions. Remember that service control policies restrict, Config evaluates configuration, and Trusted Advisor provides best practice checks.\u003c/p\u003e","references":[{"description":"What is IAM Access Analyzer","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/what-is-access-analyzer.html"},{"description":"Generate a policy based on access activity with IAM Access Analyzer","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/access-analyzer-policy-generation.html"},{"description":"Service control policies in AWS Organizations","url":"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html"},{"description":"AWS Config managed rules","url":"https://docs.aws.amazon.com/config/latest/developerguide/evaluate-config_use-managed-rules.html"},{"description":"AWS Trusted Advisor","url":"https://docs.aws.amazon.com/awssupport/latest/user/trusted-advisor.html"}]},{"originalQuery":"Accompany is launching an application in the AWS Cloud. The application will use Amazon S3 storage. A large team of researchers will have shared access to the data. The company must be able to recover data that is accidentally overwritten or deleted. Which S3 feature should the company turn on to meet this requirement?","originalOptions":[{"text":"Server access logging","correct":false},{"text":"S3 Versioning","correct":true},{"text":"S3 Lifecycle rules","correct":false},{"text":"Encryption in transit and at rest","correct":false}],"source":"exam","query":"Scrumtuous Research is deploying a new application on AWS that stores shared datasets in Amazon S3. Many analysts will update and access the same objects, and the organization needs a way to restore information if an object is accidentally replaced or removed. Which S3 feature should Scrumtuous Research enable to support this need?","options":[{"text":"Encryption in transit and at rest","explanation":"Encryption in transit and at rest helps protect data while it is being transmitted and while it is stored.","correct":false,"selected":false},{"text":"S3 Lifecycle rules","explanation":"S3 Lifecycle rules define actions that Amazon S3 applies to objects over time based on configured policies.","correct":false,"selected":false},{"text":"Server access logging","explanation":"Server access logging records requests that are made to an S3 bucket and stores the log files in another bucket.","correct":false,"selected":false},{"text":"S3 Versioning","explanation":"S3 Versioning keeps multiple variants of an object in the same bucket when object changes occur.","correct":true,"selected":false}],"answerCode":"4","type":"multiple-choice","geminiFlashAnswerCode":"4","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eS3 Versioning\u003c/b\u003e, which allows the organization to recover objects that are accidentally overwritten or deleted.\u003c/p\u003e\u003cp\u003e\u003cb\u003eS3 Versioning\u003c/b\u003e keeps multiple versions of each object in a bucket. When someone overwrites a file, Amazon S3 creates a new version rather than replacing the data permanently. When someone deletes an object, Amazon S3 adds a delete marker while the previous versions remain available. You can restore data by downloading or copying an older version, or by removing the delete marker to make the prior version the current one. This directly addresses the need to recover shared datasets when many analysts are updating the same objects.\u003c/p\u003e\u003cp\u003e\u003ci\u003eServer access logging\u003c/i\u003e only records details about requests made to the bucket and objects. It helps with auditing and troubleshooting but it does not preserve prior copies of data and it cannot be used to restore objects.\u003c/p\u003e\u003cp\u003e\u003ci\u003eS3 Lifecycle rules\u003c/i\u003e automate transitions to different storage classes and can expire objects or noncurrent versions to control costs. They do not provide a recovery mechanism for accidental overwrites or deletions and may even remove older versions over time.\u003c/p\u003e\u003cp\u003e\u003ci\u003eEncryption in transit and at rest\u003c/i\u003e protects data confidentiality with TLS for data in transit and with server-side or client-side encryption for data at rest. It does not create additional copies of objects and it does not enable rollbacks to earlier states.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question mentions a need to \u003ci\u003erecover\u003c/i\u003e from an \u003ci\u003eaccidental delete\u003c/i\u003e or an \u003ci\u003eoverwrite\u003c/i\u003e in Amazon S3, choose the feature that preserves prior copies of objects, which is S3 Versioning.\u003c/p\u003e","references":[{"description":"Amazon S3 Versioning overview","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Versioning.html"},{"description":"Deleting object versions and delete markers in Amazon S3","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/DeleteObject.html"},{"description":"Amazon S3 server access logging","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/ServerLogs.html"},{"description":"Managing your storage lifecycle in Amazon S3","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/object-lifecycle-mgmt.html"},{"description":"Protecting data using encryption in Amazon S3","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingEncryption.html"}]},{"originalQuery":"Which action should a company take to improve security in its AWS account?","originalOptions":[{"text":"Require Multi-factor authentication (MFA) for privileged users.","correct":true},{"text":"Remove the root user account.","correct":false},{"text":"Create an access key for the AWS account root user.","correct":false},{"text":"Create an access key for each privileged user.","correct":false}],"source":"exam","query":"What should Scrumtuous Manufacturing do to strengthen the security posture of its AWS account?","options":[{"text":"Require multi-factor authentication for privileged users","explanation":"Multi-factor authentication adds an additional sign-in verification step for users who have elevated permissions in an AWS account.","correct":true,"selected":false},{"text":"Delete the root user account","explanation":"The root user is the original identity that is created with an AWS account and has full access to account resources and settings.","correct":false,"selected":false},{"text":"Create an access key for the AWS account root user","explanation":"An access key allows programmatic requests to AWS services by using an access key ID and a secret access key.","correct":false,"selected":false},{"text":"Create an access key for every privileged user","explanation":"Privileged users can use access keys for programmatic access when credentials are configured for AWS tools or applications.","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct option is \u003cb\u003eRequire multi-factor authentication for privileged users\u003c/b\u003e.\u003c/p\u003e\u003cp\u003eRequiring MFA for administrators and other high permission identities adds a strong second factor beyond a password or access key. This greatly reduces the impact of stolen or phished credentials because an attacker would still need the one time code or hardware token to sign in. AWS recommends enabling MFA for the account root user and for all IAM users with elevated permissions. You can enforce MFA requirements by using IAM policies that check the aws:MultiFactorAuthPresent condition key or by using IAM Identity Center with MFA enabled for sign in.\u003c/p\u003e\u003cp\u003e\u003ci\u003eDelete the root user account\u003c/i\u003e is incorrect because you cannot delete the root user. Every AWS account has a single root user that must be protected with a strong password and MFA and it should not be used for everyday tasks.\u003c/p\u003e\u003cp\u003e\u003ci\u003eCreate an access key for the AWS account root user\u003c/i\u003e is incorrect because AWS explicitly recommends that you do not create or use root access keys. If a root access key exists you should remove it and use IAM users or roles for programmatic access instead.\u003c/p\u003e\u003cp\u003e\u003ci\u003eCreate an access key for every privileged user\u003c/i\u003e is incorrect because issuing long lived access keys broadly increases risk. Prefer IAM roles and temporary credentials for applications and automation and only issue access keys when there is a clear need for programmatic access that cannot use roles. You should still enforce MFA for console access.\u003c/p\u003e","tip":"\u003cp\u003eLook for answers that enable strong identity controls. Prefer \u003ci\u003eMFA\u003c/i\u003e for privileged access, restrict the use of the \u003ci\u003eroot user\u003c/i\u003e, avoid \u003ci\u003eroot access keys\u003c/i\u003e, and favor \u003ci\u003etemporary credentials\u003c/i\u003e from roles over long lived access keys.\u003c/p\u003e","references":[{"description":"Security best practices in IAM","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"},{"description":"AWS account root user","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_root-user.html"},{"description":"Using multi-factor authentication in AWS","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_mfa.html"},{"description":"Best practices for managing AWS access keys","url":"https://docs.aws.amazon.com/general/latest/gr/aws-access-keys-best-practices.html"}]},{"originalQuery":"Accompany has a set of databases that are stored on premises. The company wants to bring its existing Microsoft SQL Server licenses when the company moves the\ndatabases to run on Amazon EC2 instances.\nWhich EC2 instance purchasing option should the company use to meet these requirements?","originalOptions":[{"text":"Dedicated Instances N","correct":false},{"text":"Reserved Instances","correct":false},{"text":"Dedicated Hosts","correct":true},{"text":"Spot Instances","correct":false}],"source":"exam","query":"Scrumtuous Manufacturing currently runs several databases in its own data center. The company plans to migrate the databases to Amazon EC2 instances and wants to use its existing Microsoft SQL Server licenses in AWS. Which EC2 instance purchasing option should the company use for this requirement?","options":[{"text":"Spot Instances","explanation":"Spot Instances let customers use spare EC2 capacity and can be interrupted when AWS needs the capacity back.","correct":false,"selected":false},{"text":"Dedicated Hosts","explanation":"Dedicated Hosts provide physical servers for EC2 use and give customers additional visibility and control over the underlying host.","correct":true,"selected":false},{"text":"Reserved Instances","explanation":"Reserved Instances provide a billing discount in exchange for a commitment to use a specific instance configuration for a term.","correct":false,"selected":false},{"text":"Dedicated Instances","explanation":"Dedicated Instances run on hardware that is dedicated to a single customer account while the instance placement is managed by AWS.","correct":false,"selected":false}],"answerCode":"2","type":"multiple-choice","geminiFlashAnswerCode":"2","domain":"Billing, Pricing, and Support","answer":"\u003cp\u003eThe correct option is \u003cb\u003eDedicated Hosts\u003c/b\u003e because they allow the company to bring its existing Microsoft SQL Server licenses to Amazon EC2 while meeting Microsoft licensing requirements.\u003c/p\u003e\u003cp\u003e\u003cb\u003eDedicated Hosts\u003c/b\u003e allocate physical servers to your account and provide visibility into sockets and cores. This host level control is what many Microsoft SQL Server bring your own license models require because licenses are often tied to physical cores or sockets. \u003cb\u003eDedicated Hosts\u003c/b\u003e also integrate with AWS License Manager which helps track license usage and compliance, and they are the supported choice when you do not have License Mobility through Software Assurance.\u003c/p\u003e\u003cp\u003e\u003ci\u003eDedicated Instances\u003c/i\u003e run instances on hardware that is dedicated to a single customer, yet they do not expose host level details such as sockets and cores. This means they cannot satisfy many SQL Server bring your own license terms that depend on the underlying physical host.\u003c/p\u003e\u003cp\u003e\u003ci\u003eReserved Instances\u003c/i\u003e provide a pricing discount for long running instances. They do not change tenancy or licensing rights, so they do not enable the use of existing SQL Server licenses on their own.\u003c/p\u003e\u003cp\u003e\u003ci\u003eSpot Instances\u003c/i\u003e provide interruptible capacity for flexible and fault tolerant workloads. They do not address licensing requirements and they are not appropriate for persistent database servers.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question mentions using existing Microsoft licenses on EC2, think about host visibility and control. Choose \u003ci\u003eDedicated Hosts\u003c/i\u003e when physical cores and sockets or compliance tracking are required, and remember that \u003ci\u003eReserved Instances\u003c/i\u003e are \u003ci\u003epricing only\u003c/i\u003e.\u003c/p\u003e","references":[{"description":"Amazon EC2 Dedicated Hosts overview","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html"},{"description":"Amazon EC2 Dedicated Instances","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-instance.html"},{"description":"EC2 Reserved Instances","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-reserved-instances.html"},{"description":"Amazon EC2 Spot Instances","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html"}]},{"originalQuery":"Amazon Elastic File System (Amazon EFS) and Amazon FSx offer which type of storage?","originalOptions":[{"text":"Filestorage","correct":true},{"text":"Object storage","correct":false},{"text":"Block storage","correct":false},{"text":"Instance store","correct":false}],"source":"exam","query":"Which storage category is provided by Amazon Elastic File System and Amazon FSx?","options":[{"text":"Instance store","explanation":"This storage category uses temporary storage that is physically attached to certain Amazon EC2 hosts.","correct":false,"selected":false},{"text":"Block storage","explanation":"This storage category provides raw storage volumes that can be attached to compute resources.","correct":false,"selected":false},{"text":"File storage","explanation":"This storage category presents data through file systems that applications can access using file paths and directories.","correct":true,"selected":false},{"text":"Object storage","explanation":"This storage category stores data as objects with metadata in a flat namespace.","correct":false,"selected":false}],"answerCode":"3","type":"multiple-choice","geminiFlashAnswerCode":"3","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eFile storage\u003c/b\u003e because Amazon Elastic File System and Amazon FSx are managed services that provide shared file systems.\u003c/p\u003e\u003cp\u003eAmazon EFS offers a fully managed and elastic NFS file system that multiple Amazon EC2 instances can mount at the same time across multiple Availability Zones. It is designed for shared access, standard file permissions, directories, and files, which are the defining characteristics of \u003cb\u003eFile storage\u003c/b\u003e. Amazon FSx provides fully managed file systems such as FSx for Windows File Server, FSx for Lustre, FSx for NetApp ONTAP, and FSx for OpenZFS. These services deliver file based access over common protocols like SMB and NFS, so they clearly belong to the \u003cb\u003eFile storage\u003c/b\u003e category.\u003c/p\u003e\u003cp\u003e\u003ci\u003eObject storage\u003c/i\u003e is incorrect because it refers to a flat object store like Amazon S3 that manages objects in buckets rather than files in a hierarchical file system. Amazon EFS and Amazon FSx do not provide \u003ci\u003eObject storage\u003c/i\u003e.\u003c/p\u003e\u003cp\u003e\u003ci\u003eBlock storage\u003c/i\u003e is incorrect because that category is provided by Amazon EBS which exposes volumes as raw block devices to an instance. EFS and FSx are file systems and not \u003ci\u003eBlock storage\u003c/i\u003e.\u003c/p\u003e\u003cp\u003e\u003ci\u003eInstance store\u003c/i\u003e is incorrect because it is ephemeral storage that is physically attached to the host for an EC2 instance and it provides temporary block level storage that is not a managed file system service. EFS and FSx are network file systems and not \u003ci\u003eInstance store\u003c/i\u003e.\u003c/p\u003e","tip":"\u003cp\u003eQuickly map services to categories in your head. EFS and FSx mean \u003ci\u003efile\u003c/i\u003e, Amazon S3 means \u003ci\u003eobject\u003c/i\u003e, Amazon EBS means \u003ci\u003eblock\u003c/i\u003e, and instance store is \u003ci\u003eephemeral\u003c/i\u003e and not a managed file service.\u003c/p\u003e","references":[{"description":"Amazon EFS: What is Amazon Elastic File System","url":"https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html"},{"description":"Amazon S3 User Guide: What is Amazon S3","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html"},{"description":"Amazon EBS: Amazon Elastic Block Store","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/AmazonEBS.html"},{"description":"Amazon EC2 Instance Store","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/InstanceStorage.html"}]},{"originalQuery":"Which benefit of AWS Cloud computing provides lower latency between users and applications?","originalOptions":[{"text":"Agility","correct":false},{"text":"Economies of scale","correct":false},{"text":"Global reach","correct":true},{"text":"Pay-as-you-go pricing","correct":false}],"source":"exam","query":"Which advantage of using the AWS Cloud helps Scrumtuous deploy applications closer to customers so that users experience reduced latency?","options":[{"text":"Global reach","explanation":"Global reach describes the ability to use AWS infrastructure in many geographic locations around the world.","correct":true,"selected":false},{"text":"Pay-as-you-go pricing","explanation":"Pay-as-you-go pricing means customers pay for the AWS resources they use without long term commitments for many services.","correct":false,"selected":false},{"text":"Economies of scale","explanation":"Economies of scale relate to cost efficiencies that can result from AWS operating at very large scale.","correct":false,"selected":false},{"text":"Agility","explanation":"Agility refers to the ability to provision resources quickly and adapt to changing business needs.","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Cloud Concepts","answer":"\u003cp\u003eThe correct option is \u003cb\u003eGlobal reach\u003c/b\u003e because AWS provides a worldwide infrastructure that lets you place applications and data close to users so they experience lower network latency.\u003c/p\u003e\u003cp\u003eThis is correct because AWS operates multiple Regions and a large edge network that includes edge locations and regional edge caches. By deploying workloads in Regions that are geographically close to customers and by distributing static and dynamic content through services that use the edge network, organizations can shorten the distance data must travel. This proximity helps reduce round trip time and improves responsiveness for end users.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAgility\u003c/i\u003e refers to the ability to experiment quickly, iterate faster, and innovate without long procurement cycles. It improves development speed and time to market rather than directly addressing user latency through geographic placement.\u003c/p\u003e\u003cp\u003e\u003ci\u003eEconomies of scale\u003c/i\u003e describes cost advantages that arise from aggregated cloud usage which allow providers to pass savings to customers. It focuses on cost efficiency and not on placing applications closer to users to reduce latency.\u003c/p\u003e\u003cp\u003e\u003ci\u003ePay-as-you-go pricing\u003c/i\u003e is a consumption-based billing model that lets you pay only for what you use. It is a pricing benefit and does not determine where workloads run or how close they are to your customers.\u003c/p\u003e","tip":"\u003cp\u003eWhen you see a question about reducing \u003ci\u003elatency\u003c/i\u003e for end users, look for answers that point to the AWS global footprint such as Regions and edge locations. Options focused on \u003ci\u003epricing\u003c/i\u003e or \u003ci\u003ecost savings\u003c/i\u003e usually do not solve proximity or performance needs.\u003c/p\u003e","references":[{"description":"Amazon CloudFront Developer Guide: How CloudFront works and reduces latency","url":"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/Introduction.html"}]},{"originalQuery":"Acompany is running its application in the AWS Cloud and wants to protect against a DDoS attack. The company's security team wants near real-time visibility into DDoS\nattacks.\nWhich AWS service or traffic filter will meet these requirements with the MOST features for DDoS protection?","originalOptions":[{"text":"AWS Shield Advanced","correct":true},{"text":"AWS Shield","correct":false},{"text":"Amazon GuardDuty","correct":false},{"text":"Network ACLs","correct":false}],"source":"exam","query":"Scrumtuous Retailer hosts a customer facing application on AWS and needs protection from DDoS events. The security team also needs near real time insight into detected DDoS activity. Which AWS service or traffic filtering option provides the most feature rich DDoS protection for this requirement?","options":[{"text":"Amazon GuardDuty","explanation":"Amazon GuardDuty is a threat detection service that analyzes account activity, network activity, and selected AWS data sources for suspicious behavior","correct":false,"selected":false},{"text":"AWS Shield","explanation":"AWS Shield is a managed DDoS protection capability that is automatically applied to AWS customers at no additional charge","correct":false,"selected":false},{"text":"Network ACLs","explanation":"Network ACLs are stateless filtering controls that can allow or deny inbound and outbound traffic at the subnet level in a VPC","correct":false,"selected":false},{"text":"AWS Shield Advanced","explanation":"AWS Shield Advanced is a managed protection service that adds expanded DDoS detection, mitigation, visibility, and access to specialized response support for eligible AWS resources","correct":true,"selected":false}],"answerCode":"4","type":"multiple-choice","geminiFlashAnswerCode":"4","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAWS Shield Advanced\u003c/b\u003e because it provides the most comprehensive DDoS protections on AWS and delivers the near real time visibility that the security team needs.\u003c/p\u003e\u003cp\u003eWith \u003cb\u003eAWS Shield Advanced\u003c/b\u003e you can protect resources such as Amazon CloudFront, Amazon Route 53, AWS Global Accelerator, Elastic Load Balancing, and Elastic IP addresses. The service integrates with AWS WAF for application layer protections and provides detailed attack diagnostics, near real time CloudWatch metrics and alarms, and attack notifications. You also gain access to the AWS DDoS Response Team for expert help during events and receive DDoS cost protection. These capabilities exceed the baseline protections and directly address both protection and visibility requirements.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Shield\u003c/i\u003e refers to the standard protection that is included by default and it provides automatic network and transport layer DDoS protection for common infrastructure edge services. It does not include advanced features such as detailed near real time visibility, cost protection, or access to the DDoS Response Team, so it does not meet the stated need for the most feature rich option.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon GuardDuty\u003c/i\u003e is a threat detection service that analyzes AWS logs and network telemetry to identify suspicious activity. It does not mitigate DDoS attacks and it does not provide the real time DDoS protection features or attack dashboards required for this scenario.\u003c/p\u003e\u003cp\u003e\u003ci\u003eNetwork ACLs\u003c/i\u003e are stateless packet filters for VPC subnets and can allow or deny traffic based on rules. They are not designed for DDoS protection and they do not provide near real time detection insights or automated mitigations.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question asks for the most comprehensive DDoS protection and near real time visibility, think of \u003ci\u003eShield Advanced\u003c/i\u003e with its WAF integration, CloudWatch metrics, DDoS Response Team access, and cost protection. If the need is only baseline network layer protection at no extra cost, then the standard service is implied instead.\u003c/p\u003e","references":[{"description":"AWS best practices for DDoS resiliency","url":"https://docs.aws.amazon.com/whitepapers/latest/aws-best-practices-ddos-resiliency/welcome.html"},{"description":"What is Amazon GuardDuty","url":"https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html"},{"description":"VPC network ACLs","url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html"}]},{"originalQuery":"Which options are benefits of using third-party software from AWS Marketplace? (Select TWO.)","originalOptions":[{"text":"The software's data Rrovvetion is managed by a third-party vendor.","correct":false},{"text":"The software has been evaluated by vendors to ensure that it will run on AWS.","correct":true},{"text":"Users do not need to upgrade to newer software versions.","correct":false},{"text":"Users do not need to conduct security testing on the software.","correct":false},{"text":"Users can launch preconfigured software in only a few steps.","correct":true}],"source":"exam","query":"Which capabilities are advantages of obtaining third-party software through AWS Marketplace?","options":[{"text":"Customers are not required to move to newer versions of the software","explanation":"Software version management can depend on the product, deployment model, and update process chosen by the customer or vendor.","correct":false,"selected":false},{"text":"The software has been reviewed by vendors to confirm that it can operate on AWS","explanation":"Marketplace listings can include products that vendors package and make available for use in AWS environments.","correct":true,"selected":false},{"text":"Customers are not required to perform security testing for the software","explanation":"Security activities can vary based on the product, the deployment configuration, and the customer requirements for the workload.","correct":false,"selected":false},{"text":"The software provider manages all data protection responsibilities for the customer","explanation":"This statement refers to how responsibilities may be divided between a customer and an external software provider when a marketplace product is used.","correct":false,"selected":false},{"text":"Customers can deploy preconfigured software with only a few steps","explanation":"AWS Marketplace offerings can provide packaged software that is designed to simplify deployment into an AWS account.","correct":true,"selected":false}],"answerCode":"2,5","type":"multi-select","geminiFlashAnswerCode":"2,5","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct options are \u003cb\u003eThe software has been reviewed by vendors to confirm that it can operate on AWS\u003c/b\u003e and \u003cb\u003eCustomers can deploy preconfigured software with only a few steps\u003c/b\u003e.\u003c/p\u003e\u003cp\u003e\u003cb\u003eThe software has been reviewed by vendors to confirm that it can operate on AWS\u003c/b\u003e is correct because AWS Marketplace is a curated catalog of third party products that are designed to run on AWS. Independent software vendors list offerings that are built for AWS environments and the Marketplace onboarding and listing process helps ensure products meet technical and listing requirements so customers can confidently adopt solutions that run on AWS.\u003c/p\u003e\u003cp\u003e\u003cb\u003eCustomers can deploy preconfigured software with only a few steps\u003c/b\u003e is correct because AWS Marketplace provides preconfigured solutions such as AMI based products and container images. Customers can subscribe and launch with a streamlined workflow that often takes only a few clicks which reduces setup time and speeds adoption.\u003c/p\u003e\u003cp\u003e\u003ci\u003eThe software provider manages all data protection responsibilities for the customer\u003c/i\u003e is incorrect because AWS uses a shared responsibility model. The provider may secure the application they offer, yet customers remain responsible for protecting their data, managing identities and access, and configuring encryption and network controls in their own accounts.\u003c/p\u003e\u003cp\u003e\u003ci\u003eCustomers are not required to move to newer versions of the software\u003c/i\u003e is incorrect because remaining on old versions is not an advantage of AWS Marketplace. Customers choose when to update, however vendors may deprecate older versions and security best practices recommend updating to supported releases.\u003c/p\u003e\u003cp\u003e\u003ci\u003eCustomers are not required to perform security testing for the software\u003c/i\u003e is incorrect because customers must still assess and test how the software operates in their environment. Marketplace does not eliminate the customer’s responsibility to validate configurations, integrations, and controls that protect their workloads.\u003c/p\u003e","tip":"\u003cp\u003eWhen you see AWS Marketplace in a question, look for clues about a curated catalog and quick deployment of preconfigured solutions. Remember that under the \u003ci\u003eshared responsibility model\u003c/i\u003e, customers still own their data protection and security testing responsibilities.\u003c/p\u003e","references":[{"description":"What is AWS Marketplace","url":"https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-aws-marketplace.html"},{"description":"Launching Amazon Machine Image products from AWS Marketplace","url":"https://docs.aws.amazon.com/marketplace/latest/buyerguide/buyer-ami.html"}]},{"originalQuery":"Acompany needs to invoke an AWS Step Functions workflow each time an Amazon EC2 instance state changes to RUNNING. Which AWS service can the company use to meet this requirement?","originalOptions":[{"text":"Amazon SageMaker","correct":false},{"text":"Amazon Connect","correct":false},{"text":"Amazon EventBridge","correct":true},{"text":"AWS Fargate","correct":false}],"source":"exam","query":"Scrumtuous Media wants to start an AWS Step Functions workflow whenever an Amazon EC2 instance changes its state to RUNNING. Which AWS service can Scrumtuous Media use for this requirement?","options":[{"text":"AWS Fargate","explanation":"AWS Fargate is a serverless compute engine for running containers without managing servers.","correct":false,"selected":false},{"text":"Amazon EventBridge","explanation":"Amazon EventBridge is a serverless event bus service that works with events from AWS services and applications.","correct":true,"selected":false},{"text":"Amazon SageMaker","explanation":"Amazon SageMaker is an AWS service for building, training, and deploying machine learning models.","correct":false,"selected":false},{"text":"Amazon Connect","explanation":"Amazon Connect is an AWS cloud contact center service for customer engagement workflows.","correct":false,"selected":false}],"answerCode":"2","type":"multiple-choice","geminiFlashAnswerCode":"2","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAmazon EventBridge\u003c/b\u003e because it can detect Amazon EC2 state change events and invoke an AWS Step Functions state machine to start a workflow.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAmazon EventBridge\u003c/b\u003e receives events from AWS services such as Amazon EC2. You can create a rule that matches the EC2 instance state change event and filters for the state of running. You then configure the rule target as a Step Functions state machine so EventBridge calls StartExecution when the event arrives. This provides an event driven way to start workflows the moment an instance transitions to the RUNNING state without polling or custom code.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon SageMaker\u003c/i\u003e is a managed machine learning service for building and deploying models. It is not used to route AWS service events or to start Step Functions based on EC2 state changes.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Connect\u003c/i\u003e is a cloud contact center service. It does not monitor EC2 instance lifecycle events or trigger Step Functions workflows for this use case.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Fargate\u003c/i\u003e is a serverless compute engine for containers that runs tasks for Amazon ECS and Amazon EKS. It is not an event bus and it does not orchestrate workflows based on EC2 instance state changes.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question asks how to react to AWS service events and start workflows, think of \u003ci\u003eAmazon EventBridge\u003c/i\u003e. Look for keywords like event pattern, rule, and target that point to matching an event and invoking a Step Functions state machine.\u003c/p\u003e","references":[{"description":"What is Amazon EventBridge","url":"https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-what-is.html"},{"description":"Amazon EventBridge targets, including AWS Step Functions","url":"https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-targets.html"},{"description":"Amazon EventBridge service events from AWS services","url":"https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event.html"}]},{"originalQuery":"A company has a compliance requirement tp record and evaluate configuration changes, as well as perform remediation actions on AWS resources.\nWhich AWS service should the company use?","originalOptions":[{"text":"AWS Config","correct":true},{"text":"AWS Secrets Manager","correct":false},{"text":"AWS CloudTrail","correct":false},{"text":"AWS Trusted Advisor","correct":false}],"source":"exam","query":"Scrumtuous Financial must meet a governance requirement to track and assess configuration changes across its AWS resources and to apply remediation actions when resources drift from approved settings. Which AWS service should Scrumtuous Financial use?","options":[{"text":"AWS Trusted Advisor","explanation":"AWS Trusted Advisor provides recommendations based on AWS best practices across areas such as cost, performance, security, and fault tolerance.","correct":false,"selected":false},{"text":"AWS Config","explanation":"AWS Config records resource configuration details and supports rules for evaluating resource settings against desired conditions.","correct":true,"selected":false},{"text":"AWS CloudTrail","explanation":"AWS CloudTrail records account activity and API events for auditing actions taken in an AWS environment.","correct":false,"selected":false},{"text":"AWS Secrets Manager","explanation":"AWS Secrets Manager helps store, rotate, and retrieve sensitive values such as database credentials and API keys.","correct":false,"selected":false}],"answerCode":"2","type":"multiple-choice","geminiFlashAnswerCode":"2","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct answer is \u003cb\u003eAWS Config\u003c/b\u003e because it tracks resource configuration changes, evaluates them against defined rules, and can automatically remediate noncompliant resources when they drift from approved settings.\u003c/p\u003e\u003cp\u003eThis service delivers a detailed inventory and history of configuration changes across supported AWS resources. You can define rules that represent your approved baselines and it will continuously assess compliance. When drift is detected, you can attach remediation actions using Systems Manager Automation or managed remediation actions so that noncompliant resources are brought back into compliance automatically. This makes it the right choice for governance, continuous assessment, and remediation.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Secrets Manager\u003c/i\u003e is designed to securely store, retrieve, and rotate secrets such as database passwords and API keys. It does not track configuration state across resources or evaluate compliance against governance rules, and it does not provide configuration drift remediation workflows.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS CloudTrail\u003c/i\u003e records API calls and account activity for auditing and investigations. While its event history helps you see who did what and when, it does not evaluate resource configurations against compliance rules and it does not natively perform automatic remediation for configuration drift.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Trusted Advisor\u003c/i\u003e offers best practice checks and recommendations in areas such as cost, performance, service limits, and security. It does not maintain resource configuration histories or enforce rule-based compliance with automated remediation, so it is not suitable for this governance requirement.\u003c/p\u003e","tip":"\u003cp\u003eMap the words \u003ci\u003econfiguration changes\u003c/i\u003e, \u003ci\u003ecompliance\u003c/i\u003e, and \u003ci\u003eremediation\u003c/i\u003e to AWS Config. If the question focuses on API activity logging rather than configuration state, then think of CloudTrail instead.\u003c/p\u003e","references":[{"description":"What is AWS Config","url":"https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html"},{"description":"Remediating noncompliant resources with AWS Config","url":"https://docs.aws.amazon.com/config/latest/developerguide/remediation.html"},{"description":"What is AWS CloudTrail","url":"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html"},{"description":"What is AWS Secrets Manager","url":"https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html"},{"description":"Getting started with AWS Trusted Advisor","url":"https://docs.aws.amazon.com/awssupport/latest/user/getting-started-with-aws-trusted-advisor.html"}]},{"originalQuery":"Which statement is an AWS Cloud best practice that focuses on the elasticity and agility of cloud computing?","originalOptions":[{"text":"Provision capacity based on past usage and theoretical peaks.","correct":false},{"text":"Dynamically scale to meet usage demands.","correct":true},{"text":"Build the application and infrastructure in a data center that grants physical access.","correct":false},{"text":"Break apart the application into loosely coupled components.","correct":false}],"source":"exam","query":"Which AWS Cloud design practice best reflects the elasticity and agility benefits of cloud computing?","options":[{"text":"Deploy the application and supporting infrastructure in a facility that allows direct physical access","explanation":"This approach emphasizes control of physical infrastructure and on site access to hardware.","correct":false,"selected":false},{"text":"Allocate capacity by relying on historical usage patterns and estimated peak demand","explanation":"This approach plans resources in advance by using prior consumption data and projected maximum workloads.","correct":false,"selected":false},{"text":"Scale resources dynamically in response to current demand","explanation":"This approach adjusts available resources as workload levels change over time.","correct":true,"selected":false},{"text":"Separate the application into loosely coupled components","explanation":"This approach organizes an application so that individual components can operate with reduced dependency on each other.","correct":false,"selected":false}],"answerCode":"3","type":"multiple-choice","geminiFlashAnswerCode":"3","domain":"Cloud Concepts","answer":"\u003cp\u003eThe correct answer is \u003cb\u003eScale resources dynamically in response to current demand\u003c/b\u003e. This best represents the cloud benefits of elasticity and agility because capacity automatically adjusts up or down as workload needs change, which avoids idle resources and speeds delivery.\u003c/p\u003e\u003cp\u003eElasticity in AWS means you match supply of compute, storage, and throughput to demand in near real time. Services such as Amazon EC2 Auto Scaling and Application Auto Scaling add and remove capacity based on metrics and target tracking policies, and this automation lets you respond quickly to traffic spikes or lulls. This approach improves cost efficiency because you pay as you go for what you actually use and it improves agility because changes happen without manual provisioning cycles.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAllocate capacity by relying on historical usage patterns and estimated peak demand\u003c/i\u003e is incorrect because it describes traditional capacity planning. This approach leads to overprovisioning or underprovisioning and contradicts the cloud advantage of not having to guess capacity needs.\u003c/p\u003e\u003cp\u003e\u003ci\u003eDeploy the application and supporting infrastructure in a facility that allows direct physical access\u003c/i\u003e is incorrect because AWS customers do not manage or access the physical infrastructure. AWS operates Regions and Availability Zones and customers use logical access through APIs and consoles, which is what enables rapid scaling and agility.\u003c/p\u003e\u003cp\u003e\u003ci\u003eSeparate the application into loosely coupled components\u003c/i\u003e is a sound architectural practice for modularity, resilience, and independent scaling of services. However, it does not by itself express the elasticity and agility benefit as directly as automated dynamic scaling does, which is why it is not the best answer here.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question mentions \u003ci\u003eelasticity\u003c/i\u003e or \u003ci\u003eagility\u003c/i\u003e, look for answers that describe \u003ci\u003eautomatic scaling\u003c/i\u003e up and down based on real demand and metrics rather than planning for peak or manual provisioning.\u003c/p\u003e","references":[{"description":"What is Amazon EC2 Auto Scaling","url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html"},{"description":"Target tracking scaling policies for Amazon EC2 Auto Scaling","url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/as-scaling-target-tracking.html"}]},{"originalQuery":"A company Wants to run a production workload on AWS. The company needs to select an AWS Support Plan.\nWhich plan will provide the required level of support MOST cost-effectively?","originalOptions":[{"text":"Business Support","correct":true},{"text":"Developer Support","correct":false},{"text":"Enterprise Support","correct":false},{"text":"Enterprise On-Ramp","correct":false}],"source":"exam","query":"Scrumtuous Publishing plans to operate a production application on AWS and must choose an AWS Support plan. Which plan provides the needed support level at the lowest appropriate cost?","options":[{"text":"Developer Support","explanation":"This plan is designed for users who are building and testing on AWS and need general guidance during development.","correct":false,"selected":false},{"text":"Enterprise Support","explanation":"This plan includes the broadest support capabilities and account assistance for organizations with extensive AWS operations.","correct":false,"selected":false},{"text":"Enterprise On-Ramp","explanation":"This plan provides enhanced support and access to a pool of technical account management resources for growing cloud operations.","correct":false,"selected":false},{"text":"Business Support","explanation":"This plan includes technical support features that organizations commonly use for workloads that run in AWS environments.","correct":true,"selected":false}],"answerCode":"4","type":"multiple-choice","geminiFlashAnswerCode":"4","domain":"Billing, Pricing, and Support","answer":"\u003cp\u003e\u003cb\u003eBusiness Support\u003c/b\u003e is the correct choice because it is designed for production workloads and delivers the necessary 24 by 7 access and response times at the lowest appropriate cost.\u003c/p\u003e\u003cp\u003e\u003cb\u003eBusiness Support\u003c/b\u003e includes 24 by 7 access to AWS Cloud Support Engineers by phone, chat, and email. It offers a one hour response time for production system down issues, which is the minimum level typically required for running production applications. It also provides full AWS Trusted Advisor checks and allows unlimited cases and contacts, which helps operational teams support live environments without paying for the higher tier enterprise features.\u003c/p\u003e\u003cp\u003e\u003ci\u003eDeveloper Support\u003c/i\u003e is not suitable for production because it offers business hours email access only and has limited case severities and slower response times. It does not provide 24 by 7 phone and chat access, so it does not meet the typical requirements for a production workload.\u003c/p\u003e\u003cp\u003e\u003ci\u003eEnterprise Support\u003c/i\u003e includes a Technical Account Manager and the fastest response times along with proactive guidance, but it comes at a significantly higher cost. Since the question asks for the lowest appropriate cost for a production application, this plan exceeds the needs and budget for many standard production use cases.\u003c/p\u003e\u003cp\u003e\u003ci\u003eEnterprise On-Ramp\u003c/i\u003e provides enhanced guidance and faster response times than \u003cb\u003eBusiness Support\u003c/b\u003e, and it is positioned between Business and Enterprise. However, it still costs more than \u003cb\u003eBusiness Support\u003c/b\u003e and is intended for customers who need additional prescriptive guidance beyond standard production support, so it is not the lowest appropriate cost for this scenario.\u003c/p\u003e","tip":"\u003cp\u003eMatch the plan to the workload. For a \u003ci\u003eproduction\u003c/i\u003e application the lowest tier that offers \u003ci\u003e24x7\u003c/i\u003e access to support engineers and a one hour response for production down is Business Support.\u003c/p\u003e","references":[]},{"originalQuery":"Acompany needs to search for text in documents that are stored in Amazon S3.\nWhich AWS service will meet these requirements?","originalOptions":[{"text":"Amazon Kendra","correct":true},{"text":"Amazon Rekognition","correct":false},{"text":"Amazon Polly","correct":false},{"text":"Amazon Lex","correct":false}],"source":"exam","query":"Scrumtuous Publishing stores many reports and policy files in Amazon S3 and wants employees to find information by searching the text within those documents. Which AWS service should the company use?","options":[{"text":"Amazon Kendra","explanation":"Amazon Kendra is an AWS service that supports enterprise search across connected content repositories","correct":true,"selected":false},{"text":"Amazon Lex","explanation":"Amazon Lex is an AWS service for building conversational interfaces that use voice or text","correct":false,"selected":false},{"text":"Amazon Polly","explanation":"Amazon Polly is an AWS service that converts written text into lifelike speech","correct":false,"selected":false},{"text":"Amazon Rekognition","explanation":"Amazon Rekognition is an AWS service that analyzes images and videos for visual information","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAmazon Kendra\u003c/b\u003e because Scrumtuous Publishing needs to search the text within documents stored in Amazon S3.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAmazon Kendra\u003c/b\u003e is an intelligent enterprise search service that indexes content from sources such as Amazon S3 and supports full text and natural language queries. It can crawl S3 buckets, extract content from common document formats including PDF, Microsoft Word, PowerPoint, and plain text, and then return precise answers and ranked results. This makes it the right choice when users need to quickly find information across large collections of files.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Rekognition\u003c/i\u003e focuses on image and video analysis. It can detect objects, scenes, faces, and text in images or videos, yet it is not a document search engine for files stored in Amazon S3. It does not provide enterprise search across documents with relevance ranking and natural language queries.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Polly\u003c/i\u003e converts text into lifelike speech. It is used for text to speech applications and does not index or search the contents of documents in Amazon S3.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Lex\u003c/i\u003e is used to build conversational interfaces with speech and text. It powers chatbots and virtual assistants and it does not provide document indexing or search capabilities for files in Amazon S3.\u003c/p\u003e","tip":"\u003cp\u003eMap the requirement to the capability. If you need to \u003ci\u003esearch\u003c/i\u003e text across documents in Amazon S3 then choose \u003ci\u003eAmazon Kendra\u003c/i\u003e. If you see images or video then think \u003ci\u003eAmazon Rekognition\u003c/i\u003e. If you see text to speech then think \u003ci\u003eAmazon Polly\u003c/i\u003e. If you see chatbots then think \u003ci\u003eAmazon Lex\u003c/i\u003e.\u003c/p\u003e","references":[{"description":"What is Amazon Kendra","url":"https://docs.aws.amazon.com/kendra/latest/dg/what-is-kendra.html"},{"description":"Amazon Kendra Amazon S3 data source","url":"https://docs.aws.amazon.com/kendra/latest/dg/data-source-s3.html"},{"description":"What is Amazon Rekognition","url":"https://docs.aws.amazon.com/rekognition/latest/dg/what-is.html"},{"description":"What is Amazon Polly","url":"https://docs.aws.amazon.com/polly/latest/dg/what-is.html"},{"description":"What is Amazon Lex V2","url":"https://docs.aws.amazon.com/lexv2/latest/dg/what-is.html"}]},{"originalQuery":"Acompany must provide a list of its IAM users to an external auditor. The list must include the status of the users’ credentials and access keys.\nWhat is the MOST operationally efficient way to provide this information?","originalOptions":[{"text":"Create an IAM use? account for the auditor. Grant the auditor administrator permissions.","correct":false},{"text":"Download the IAM credential report. Provide the report to the auditor.","correct":true},{"text":"Download the AWS Trusted Advisor report. Provide the report to the auditor.","correct":false},{"text":"Take a screenshot of each user's page in the AWS Management Console. Provide the screenshots to the auditor.","correct":false}],"source":"exam","query":"Scrumtuous Publishing needs to give an outside auditor a list of all IAM users in its AWS account. The information must show each user's credential status and access key status. What is the most operationally efficient way to supply this information?","options":[{"text":"Download the IAM credential report and provide it to the auditor","explanation":"The IAM credential report contains account level details about IAM users and their password and access key information.","correct":true,"selected":false},{"text":"Capture a screenshot of each IAM user's page in the AWS Management Console and provide the screenshots to the auditor","explanation":"This approach collects information manually from individual user pages in the AWS Management Console.","correct":false,"selected":false},{"text":"Download the AWS Trusted Advisor report and provide it to the auditor","explanation":"AWS Trusted Advisor provides checks and recommendations across categories such as cost optimization, security, fault tolerance, performance, service limits, and operational excellence.","correct":false,"selected":false},{"text":"Create an IAM user account for the auditor and attach administrator permissions","explanation":"This approach gives the auditor direct access to the AWS account with broad permissions.","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct answer is \u003cb\u003eDownload the IAM credential report and provide it to the auditor\u003c/b\u003e because it delivers an account wide CSV that lists every IAM user along with each user's credential status and access key status.\u003c/p\u003e\u003cp\u003eWith the credential report you can generate and download a single file from the IAM console or with the AWS CLI. It includes whether a console password is enabled, when it was last changed and last used, whether MFA is active, and whether each access key is active with rotation and last used information. This satisfies the auditor's request in the most operationally efficient way because it is automated, comprehensive, and consistent.\u003c/p\u003e\u003cp\u003e\u003ci\u003eCreate an IAM user account for the auditor and attach administrator permissions\u003c/i\u003e is not appropriate because it grants broad access and does not directly produce the required report. A secure practice is to generate the needed evidence and share it without granting new standing permissions to an external party.\u003c/p\u003e\u003cp\u003e\u003ci\u003eDownload the AWS Trusted Advisor report and provide it to the auditor\u003c/i\u003e is not sufficient because Trusted Advisor focuses on checks and recommendations and it does not produce a per user listing of credential and access key status for all IAM users.\u003c/p\u003e\u003cp\u003e\u003ci\u003eCapture a screenshot of each IAM user's page in the AWS Management Console and provide the screenshots to the auditor\u003c/i\u003e is inefficient and error prone and it does not scale. It also makes it difficult to verify completeness and accuracy compared to an authoritative report.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question asks for per user credential or access key status for all users, think of the \u003ci\u003ecredential report\u003c/i\u003e. You can generate it quickly in the console or by using aws iam generate-credential-report followed by aws iam get-credential-report.\u003c/p\u003e","references":[{"description":"IAM: Generate and download a credential report","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/id_credentials_getting-report.html"},{"description":"Security best practices in IAM","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"},{"description":"AWS Trusted Advisor overview","url":"https://docs.aws.amazon.com/awssupport/latest/user/aws-trusted-advisor.html"}]},{"originalQuery":"Acompany wants to use an Amazon EC2 instance that has a pre-installed third-party firewall.\nWhich AWS service or feature can provide this solution?","originalOptions":[{"text":"Security groups","correct":false},{"text":"AWS Marketplace Le","correct":true},{"text":"AWS Systems Manager","correct":false},{"text":"AWS Certificate Manager (ACM)","correct":false}],"source":"exam","query":"Scrumtuous Retail wants to launch an Amazon EC2 instance that already includes a third party firewall package installed and ready to configure. Which AWS service or feature can provide this capability?","options":[{"text":"Security groups","explanation":"Security groups act as virtual firewalls that control inbound and outbound traffic for supported AWS resources.","correct":false,"selected":false},{"text":"AWS Systems Manager","explanation":"AWS Systems Manager helps users manage, automate, and configure operational tasks across AWS resources.","correct":false,"selected":false},{"text":"AWS Marketplace","explanation":"AWS Marketplace is a digital catalog where customers can find software offerings from independent vendors for use on AWS.","correct":true,"selected":false},{"text":"AWS Certificate Manager","explanation":"AWS Certificate Manager helps provision, manage, and deploy public and private SSL and TLS certificates for AWS services.","correct":false,"selected":false}],"answerCode":"3","type":"multiple-choice","geminiFlashAnswerCode":"3","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAWS Marketplace\u003c/b\u003e.\u003c/p\u003e\u003cp\u003eThis is the right choice because you can subscribe to AMI-based products from trusted vendors and then launch an Amazon EC2 instance that already has the third party firewall software installed. The vendor prepares the AMI and AWS handles metering and billing, which lets you start with the firewall ready to configure rather than performing manual installation steps after launch.\u003c/p\u003e\u003cp\u003e\u003ci\u003eSecurity groups\u003c/i\u003e are stateful virtual firewalls that control inbound and outbound traffic to EC2 instances. They do not provide AMIs and they cannot install third party software, so they cannot deliver an instance with a firewall package preinstalled.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Systems Manager\u003c/i\u003e can automate configuration and software installation after an instance launches. It does not supply prebuilt AMIs that already contain a third party firewall, so it is not the best way to start with the software already installed.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Certificate Manager\u003c/i\u003e issues and manages SSL and TLS certificates for services such as Elastic Load Balancing and Amazon CloudFront. It does not provide AMIs or install firewall software on EC2 instances.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question asks for an EC2 instance that comes with third party software already \u003ci\u003epreinstalled\u003c/i\u003e, think of an \u003ci\u003eAWS Marketplace AMI\u003c/i\u003e. Services like security groups or Systems Manager control access or automate configuration, but they do not provide prebuilt images with vendor software included.\u003c/p\u003e","references":[{"description":"Finding an AMI in the Amazon EC2 User Guide","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/finding-an-ami.html"},{"description":"What is AWS Marketplace","url":"https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-aws-marketplace.html"},{"description":"Amazon EC2 security groups for Linux instances","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-security-groups.html"},{"description":"AWS Systems Manager overview","url":"https://docs.aws.amazon.com/systems-manager/latest/userguide/what-is-systems-manager.html"},{"description":"AWS Certificate Manager overview","url":"https://docs.aws.amazon.com/acm/latest/userguide/acm-overview.html"}]},{"originalQuery":"Acompany wants to continuously improve processes and procedures to deliver business value.\nWhich pillar of the AWS Well-Architected FrameWork does this goal represent?","originalOptions":[{"text":"Performance efficiency","correct":false},{"text":"Operational excellence","correct":true},{"text":"Reliability","correct":false},{"text":"Sustainability","correct":false}],"source":"exam","query":"Scrumtuous Publishing wants to keep refining its operational processes and procedures so that its cloud workloads continue to support business outcomes. Which pillar of the AWS Well-Architected Framework is most closely associated with this goal?","options":[{"text":"Reliability","explanation":"This pillar addresses the ability of a workload to function as intended and recover from failures.","correct":false,"selected":false},{"text":"Operational excellence","explanation":"This pillar includes guidance related to running and monitoring systems and improving supporting processes.","correct":true,"selected":false},{"text":"Sustainability","explanation":"This pillar considers ways to reduce environmental impact while using cloud resources.","correct":false,"selected":false},{"text":"Performance efficiency","explanation":"This pillar focuses on using computing resources effectively as workload demand changes over time.","correct":false,"selected":false}],"answerCode":"2","type":"multiple-choice","geminiFlashAnswerCode":"2","domain":"Cloud Concepts","answer":"\u003cp\u003eThe correct option is \u003cb\u003eOperational excellence\u003c/b\u003e because the goal is to continually refine operational processes and procedures so that workloads keep supporting business outcomes.\u003c/p\u003e\u003cp\u003eThis pillar focuses on continuous improvement of how you run workloads through well-defined operating procedures, automation, observability, and frequent small changes. It emphasizes preparing, operating, and evolving workloads by using runbooks, playbooks, event and incident response, and post-incident learning. The outcome is that day-to-day operations are iterated and improved so the technology consistently delivers the desired business results.\u003c/p\u003e\u003cp\u003e\u003ci\u003ePerformance efficiency\u003c/i\u003e is not the best match because it is about selecting and using computing resources efficiently and scaling to meet demand rather than improving operational processes and procedures.\u003c/p\u003e\u003cp\u003e\u003ci\u003eReliability\u003c/i\u003e is not the best match because it centers on workload resilience, fault tolerance, and recovery so that the system performs its intended function, which is different from the ongoing refinement of operations.\u003c/p\u003e\u003cp\u003e\u003ci\u003eSustainability\u003c/i\u003e is not the best match because it focuses on minimizing environmental impact and optimizing resource usage for energy efficiency rather than continuous improvement of operational practices.\u003c/p\u003e","tip":"\u003cp\u003eMap keywords to pillars. When you see \u003ci\u003eprocesses\u003c/i\u003e, \u003ci\u003eprocedures\u003c/i\u003e, and \u003ci\u003econtinuous improvement\u003c/i\u003e think \u003ci\u003eOperational excellence\u003c/i\u003e. When you see \u003ci\u003euptime\u003c/i\u003e and \u003ci\u003erecovery\u003c/i\u003e think \u003ci\u003eReliability\u003c/i\u003e. When you see \u003ci\u003escaling\u003c/i\u003e and \u003ci\u003eresource selection\u003c/i\u003e think \u003ci\u003ePerformance efficiency\u003c/i\u003e. When you see \u003ci\u003eenvironmental impact\u003c/i\u003e think \u003ci\u003eSustainability\u003c/i\u003e.\u003c/p\u003e","references":[{"description":"AWS Well-Architected Framework overview","url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/wellarchitected-framework-overview.html"},{"description":"Operational Excellence Pillar - AWS Well-Architected Framework","url":"https://docs.aws.amazon.com/wellarchitected/latest/framework/operational-excellence-pillar.html"}]},{"originalQuery":"Auser wants to securely automate the management and rotation of credentials that are shared between applications, while spending the least amount of time on managing\ntasks.\nWhich AWS service or feature can be used to accomplish this?","originalOptions":[{"text":"AWS CloudHSM","correct":false},{"text":"AWS Key Management Service (AWS KMS)","correct":false},{"text":"AWS Secrets Manager","correct":true},{"text":"Server-side encryption","correct":false}],"source":"exam","query":"A developer at Scrumtuous Publishing needs to securely automate the storage, management, and rotation of credentials that multiple applications use. The team wants to minimize ongoing administrative work. Which AWS service or feature can help meet this need?","options":[{"text":"AWS Key Management Service","explanation":"AWS Key Management Service helps create and manage cryptographic keys that can be used with many AWS services and applications.","correct":false,"selected":false},{"text":"AWS CloudHSM","explanation":"AWS CloudHSM provides dedicated hardware security modules in the AWS Cloud for cryptographic key operations and key control.","correct":false,"selected":false},{"text":"AWS Secrets Manager","explanation":"AWS Secrets Manager stores sensitive values such as credentials and supports managed rotation workflows for application secrets.","correct":true,"selected":false},{"text":"Server-side encryption","explanation":"Server-side encryption protects data after it is received by an AWS service and stored at rest.","correct":false,"selected":false}],"answerCode":"3","type":"multiple-choice","geminiFlashAnswerCode":"3","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct answer is \u003cb\u003eAWS Secrets Manager\u003c/b\u003e because it securely stores, manages, and automatically rotates credentials for multiple applications while minimizing ongoing administrative effort.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS Secrets Manager\u003c/b\u003e is built to centralize secret storage and retrieval using SDKs and the console. It supports automatic rotation on a schedule for common databases such as Amazon RDS and Amazon Redshift. For other types of credentials you can attach a rotation function with AWS Lambda. It provides versioning and fine grained access control with IAM policies and integrates with AWS services so applications can fetch secrets securely at runtime. These capabilities reduce manual updates, remove hard coded secrets, and help maintain strong security with minimal operational burden.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS CloudHSM\u003c/i\u003e offers dedicated hardware security modules for cryptographic key operations and
