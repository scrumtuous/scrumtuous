o AWS. Which costs can the company eliminate as a result of this migration?","options":[{"text":"Data center facility costs","explanation":"These expenses include space, power, cooling, and physical infrastructure for company operated facilities.","correct":true,"selected":false},{"text":"Training and development costs","explanation":"These expenses relate to building employee skills and preparing teams to use services and tools effectively.","correct":false,"selected":false},{"text":"Monitoring costs","explanation":"These expenses relate to observing system health, performance, availability, and operational events.","correct":false,"selected":false},{"text":"Fixed capital costs","explanation":"These expenses involve upfront investments in hardware and other long term infrastructure resources.","correct":true,"selected":false},{"text":"Data security costs","explanation":"These expenses relate to protecting data, managing access, and meeting security requirements.","correct":false,"selected":false}],"answerCode":"1,4","type":"multi-select","geminiFlashAnswerCode":"1,4","domain":"Cloud Concepts","answer":"\u003cp\u003eThe correct options are \u003cb\u003eData center facility costs\u003c/b\u003e and \u003cb\u003eFixed capital costs\u003c/b\u003e.\u003c/p\u003e\u003cp\u003eWhen you migrate to AWS you no longer need to run your own physical data centers. AWS provides and operates the buildings, power, cooling, physical security, and hardware footprint that previously required significant ongoing spending. This removes the need for the company to pay for its own real estate and facility overhead for hosting infrastructure.\u003c/p\u003e\u003cp\u003eThe move to AWS also replaces upfront hardware purchases with a pay as you go model. Instead of buying servers, storage arrays, and networking gear and then depreciating them, you consume compute, storage, and database capacity as operational expense. This shift eliminates large upfront investments and other fixed capital expenditures tied to owning infrastructure.\u003c/p\u003e\u003cp\u003e\u003ci\u003eData security costs\u003c/i\u003e are not eliminated because security is a shared responsibility. AWS secures the infrastructure of the cloud, while customers must still manage identity and access, data classification and encryption, application hardening, and compliance activities. These ongoing responsibilities require tools, processes, and people.\u003c/p\u003e\u003cp\u003e\u003ci\u003eMonitoring costs\u003c/i\u003e are not eliminated because workloads still need observability for availability, performance, and cost control. You will continue to invest in metrics, logs, and alarms using services such as Amazon CloudWatch and in the staff time to respond to events.\u003c/p\u003e\u003cp\u003e\u003ci\u003eTraining and development costs\u003c/i\u003e persist because teams must learn AWS services, cloud architectures, and new operational practices. Most organizations plan for ongoing enablement to maintain skills as services and best practices evolve.\u003c/p\u003e","tip":"\u003cp\u003eWhen asked which costs are eliminated by moving to AWS, look for items tied to owning infrastructure such as facilities and upfront hardware. Costs tied to operating and governing workloads usually remain due to the \u003ci\u003eshared responsibility model\u003c/i\u003e.\u003c/p\u003e","references":[{"description":"How AWS Pricing Works whitepaper","url":"https://docs.aws.amazon.com/whitepapers/latest/how-aws-pricing-works/welcome.html"},{"description":"Total Cost of Ownership in AWS","url":"https://docs.aws.amazon.com/whitepapers/latest/how-aws-pricing-works/total-cost-of-ownership.html"}]},{"originalQuery":"Acompany is in the process of finding correct Amazon EC2 instance types and sizes to meet its performance and capacity requirements. The company wants to find the\nlowest possible cost.\nWhich option accurately characterizes the company's actions?","originalOptions":[{"text":"Auto Scaling","correct":false},{"text":"_ Storage tiering tS","correct":false},{"text":"Rightsizing","correct":true},{"text":"Instance scheduling","correct":false}],"source":"exam","query":"Scrumtuous Publishing is evaluating Amazon EC2 instance families and instance sizes so that its workloads meet performance and capacity needs while using the lowest practical cost. Which term best describes this activity?","options":[{"text":"Auto Scaling","explanation":"Auto Scaling adjusts compute capacity based on changing demand and defined scaling policies.","correct":false,"selected":false},{"text":"Storage tiering","explanation":"Storage tiering places data in different storage classes or tiers based on access patterns and cost considerations.","correct":false,"selected":false},{"text":"Rightsizing","explanation":"Rightsizing reviews resource usage and workload requirements to choose appropriately sized resources.","correct":true,"selected":false},{"text":"Instance scheduling","explanation":"Instance scheduling starts or stops compute resources according to planned operating hours.","correct":false,"selected":false}],"answerCode":"3","type":"multiple-choice","geminiFlashAnswerCode":"3","domain":"Billing, Pricing, and Support","answer":"\u003cp\u003eThe correct answer is \u003cb\u003eRightsizing\u003c/b\u003e. This activity matches compute resources to actual workload needs by choosing the most appropriate EC2 instance families and instance sizes so that performance and capacity requirements are met at the lowest practical cost.\u003c/p\u003e\u003cp\u003e\u003cb\u003eRightsizing\u003c/b\u003e focuses on analyzing utilization metrics such as CPU, memory, storage, and network to select the best fitting instance family and size. It aims to avoid both overprovisioning and underprovisioning, and it often uses recommendations from services like AWS Compute Optimizer and monitoring from Amazon CloudWatch. By continuously reviewing workload patterns and adjusting instance types and sizes, \u003cb\u003eRightsizing\u003c/b\u003e reduces waste while maintaining the required performance.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAuto Scaling\u003c/i\u003e is not correct because it automatically adds or removes instances based on demand in order to maintain performance and availability. While it helps control capacity over time, it does not decide which instance families or sizes are optimal for a given workload, which is the goal of \u003cb\u003eRightsizing\u003c/b\u003e.\u003c/p\u003e\u003cp\u003e\u003ci\u003eStorage tiering\u003c/i\u003e is not correct because it refers to moving data between storage classes, such as Amazon S3 Standard and Amazon S3 Glacier, based on access patterns and cost. This is a storage optimization technique and does not involve selecting EC2 instance families or sizes.\u003c/p\u003e\u003cp\u003e\u003ci\u003eInstance scheduling\u003c/i\u003e is not correct because it refers to starting and stopping instances on a schedule to save money during off hours. This can reduce runtime costs, but it does not determine the best instance family or size for the workload, which is addressed by \u003cb\u003eRightsizing\u003c/b\u003e.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question describes choosing the best EC2 family and size to meet requirements at the lowest cost, think \u003ci\u003erightsizing\u003c/i\u003e. If it talks about adding or removing instances in response to demand, think \u003ci\u003eAuto Scaling\u003c/i\u003e. If it focuses on moving data between storage classes, think \u003ci\u003estorage tiering\u003c/i\u003e. If it mentions turning instances off during idle periods, think \u003ci\u003einstance scheduling\u003c/i\u003e.\u003c/p\u003e","references":[{"description":"AWS Well-Architected Framework Cost Optimization Pillar","url":"https://docs.aws.amazon.com/wellarchitected/latest/cost-optimization-pillar/welcome.html"},{"description":"What is Amazon EC2 Auto Scaling","url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html"},{"description":"Instance Scheduler on AWS","url":"https://aws.amazon.com/solutions/implementations/instance-scheduler-on-aws/"}]},{"originalQuery":"Which AWS services or features form the AWS Cloud global infrastructure? (Select TWO.)","originalOptions":[{"text":"Availasility Zones","correct":true},{"text":"Amazon ElastiCache","correct":false},{"text":"AWS Regions","correct":true},{"text":"Amazon S3","correct":false},{"text":"Amazon VPC","correct":false}],"source":"exam","query":"Which AWS components are considered part of the AWS Cloud global infrastructure?","options":[{"text":"AWS Regions","explanation":"AWS Regions are separate geographic areas where AWS offers cloud resources to customers","correct":true,"selected":false},{"text":"Amazon ElastiCache","explanation":"Amazon ElastiCache is a managed caching service that supports Redis OSS and Memcached compatible workloads","correct":false,"selected":false},{"text":"Amazon VPC","explanation":"Amazon VPC lets customers define isolated virtual networks for AWS resources","correct":false,"selected":false},{"text":"Amazon S3","explanation":"Amazon S3 is an object storage service used to store and retrieve data at scale","correct":false,"selected":false},{"text":"Availability Zones","explanation":"Availability Zones are isolated locations within a geographic area that are designed to support resilient workloads","correct":true,"selected":false}],"answerCode":"1,5","type":"multi-select","geminiFlashAnswerCode":"1,5","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct options are \u003cb\u003eAvailability Zones\u003c/b\u003e and \u003cb\u003eAWS Regions\u003c/b\u003e. These are foundational components of the AWS Cloud global infrastructure that provide isolated fault domains and geographic partitions for high availability and low latency.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAvailability Zones\u003c/b\u003e are separate data center facilities within \u003cb\u003eAWS Regions\u003c/b\u003e that are connected through redundant, high speed networking. Using multiple \u003cb\u003eAvailability Zones\u003c/b\u003e lets you design highly available and fault tolerant architectures because workloads can continue operating if one zone experiences a failure.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS Regions\u003c/b\u003e are isolated geographic areas that contain multiple \u003cb\u003eAvailability Zones\u003c/b\u003e. Choosing the right \u003cb\u003eAWS Regions\u003c/b\u003e helps you place resources close to users and meet data residency and compliance requirements while limiting the impact of faults to a single Region boundary.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon ElastiCache\u003c/i\u003e is a managed in memory data store service that runs on AWS within \u003cb\u003eAWS Regions\u003c/b\u003e, yet it is a service built on top of the infrastructure and not a component of the AWS global infrastructure itself.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon S3\u003c/i\u003e is an object storage service that stores data within \u003cb\u003eAWS Regions\u003c/b\u003e and uses multiple \u003cb\u003eAvailability Zones\u003c/b\u003e for durability, but it is a service offering rather than a foundational global infrastructure component.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon VPC\u003c/i\u003e is a networking service that lets you define an isolated virtual network inside \u003cb\u003eAWS Regions\u003c/b\u003e. It uses \u003cb\u003eAvailability Zones\u003c/b\u003e to place subnets and resources, but \u003ci\u003eAmazon VPC\u003c/i\u003e is not itself part of the AWS global infrastructure.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question asks about the AWS \u003ci\u003eglobal infrastructure\u003c/i\u003e, think of the building blocks such as \u003ci\u003eRegions\u003c/i\u003e and \u003ci\u003eAvailability Zones\u003c/i\u003e. Services that run on top of these building blocks are not considered global infrastructure components.\u003c/p\u003e","references":[{"description":"Regions and Availability Zones in the EC2 User Guide","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-regions-availability-zones.html"},{"description":"What is Amazon VPC","url":"https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html"},{"description":"What is Amazon S3","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html"},{"description":"What is Amazon ElastiCache","url":"https://docs.aws.amazon.com/AmazonElastiCache/latest/red-ug/WhatIs.html"}]},{"originalQuery":"Which AWS service or resource can a company protect by using AWS WAF?","originalOptions":[{"text":"Amazon EC2 instancep,","correct":false},{"text":"Amazon DynamoDB table","correct":false},{"text":"Application Load Balancer","correct":true},{"text":"Network Load Balancer","correct":false}],"source":"exam","query":"Which AWS service or resource can Scrumtuous protect with AWS WAF?","options":[{"text":"Application Load Balancer","explanation":"An Application Load Balancer distributes application traffic across targets such as instances, containers, and IP addresses.","correct":true,"selected":false},{"text":"Amazon EC2 instance","explanation":"An Amazon EC2 instance is a virtual server that runs applications in the AWS Cloud.","correct":false,"selected":false},{"text":"Amazon DynamoDB table","explanation":"An Amazon DynamoDB table stores items for a managed NoSQL database workload.","correct":false,"selected":false},{"text":"Network Load Balancer","explanation":"A Network Load Balancer handles high performance traffic at the connection level for supported targets.","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct option is \u003cb\u003eApplication Load Balancer\u003c/b\u003e. AWS WAF can be associated with a web ACL that inspects HTTP and HTTPS traffic on an \u003cb\u003eApplication Load Balancer\u003c/b\u003e and it can block or allow requests based on your rules.\u003c/p\u003e\u003cp\u003eAWS WAF integrates with select layer 7 entry points so you attach a web ACL to resources such as Amazon CloudFront distributions, Amazon API Gateway APIs, and an \u003cb\u003eApplication Load Balancer\u003c/b\u003e. This lets you apply managed rule groups and custom rules that detect common exploits and unwanted traffic before it reaches your application.\u003c/p\u003e\u003cp\u003eAn \u003ci\u003eAmazon EC2 instance\u003c/i\u003e cannot have a web ACL attached directly. To use AWS WAF in this scenario you place the instance behind an \u003cb\u003eApplication Load Balancer\u003c/b\u003e or you rely on security groups and network ACLs for instance level traffic filtering.\u003c/p\u003e\u003cp\u003eAn \u003ci\u003eAmazon DynamoDB table\u003c/i\u003e is a database resource and it is not a web entry point for client HTTP or HTTPS requests. AWS WAF protects web applications and APIs at supported integration points and it does not attach to database tables.\u003c/p\u003e\u003cp\u003eA \u003ci\u003eNetwork Load Balancer\u003c/i\u003e operates at layer 4 for TCP and UDP traffic and AWS WAF performs layer 7 HTTP and HTTPS inspection. The service does not integrate with this type of load balancer.\u003c/p\u003e","tip":"\u003cp\u003eMatch AWS WAF with its \u003ci\u003elayer 7 supported\u003c/i\u003e integrations. If the option is CloudFront, Application Load Balancer, or Amazon API Gateway then it fits. If the option is EC2, DynamoDB, or Network Load Balancer then it does not.\u003c/p\u003e","references":[{"description":"What is AWS WAF and supported protected resources","url":"https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html"},{"description":"Using AWS WAF with Application Load Balancers","url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/load-balancer-waf.html"},{"description":"Introduction to Network Load Balancers","url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html"}]},{"originalQuery":"Acompany's application has high customer usage during certain times of the day. The company wants to reduce the number of Amazon EC2 instances that run when\napplication usage is low.\nWhich AWS service or instarice purchasing option should the company use to meet this requirement?","originalOptions":[{"text":"EC2 Instance Savings Plans","correct":false},{"text":"Spot Instances","correct":false},{"text":"Reserved Instances","correct":false},{"text":"Amazon EC2 Auto Scaling","correct":true}],"source":"exam","query":"Scrumtuous Retail runs an application that receives heavy customer traffic during predictable parts of the day. The company wants to decrease the number of Amazon EC2 instances that are running when demand drops. Which AWS service or instance purchasing option should the company use to meet this requirement?","options":[{"text":"Reserved Instances","explanation":"Reserved Instances provide discounted Amazon EC2 pricing for specific instance attributes when a customer makes a term commitment.","correct":false,"selected":false},{"text":"EC2 Instance Savings Plans","explanation":"EC2 Instance Savings Plans provide discounted pricing in exchange for a commitment to a consistent amount of compute usage over a term.","correct":false,"selected":false},{"text":"Spot Instances","explanation":"Spot Instances let customers use spare Amazon EC2 capacity at prices that can vary based on supply and demand.","correct":false,"selected":false},{"text":"Amazon EC2 Auto Scaling","explanation":"Amazon EC2 Auto Scaling adjusts the number of EC2 instances in an application environment based on defined scaling policies and demand signals.","correct":true,"selected":false}],"answerCode":"4","type":"multiple-choice","geminiFlashAnswerCode":"4","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAmazon EC2 Auto Scaling\u003c/b\u003e. This is the service that automatically reduces the number of running instances when demand falls and increases capacity when traffic rises.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAmazon EC2 Auto Scaling\u003c/b\u003e creates groups of instances and applies scaling policies that respond to metrics such as average CPU utilization or request count behind a load balancer. It can scale in to terminate instances when utilization drops so you avoid paying for idle capacity. Because the traffic pattern is predictable, you can also use scheduled scaling to proactively decrease capacity during known off peak times and then increase it before the rush periods. You can set minimum, maximum, and desired capacities so the application remains available while still optimizing cost.\u003c/p\u003e\u003cp\u003e\u003ci\u003eEC2 Instance Savings Plans\u003c/i\u003e provide a lower price in exchange for a one or three year commitment to a consistent amount of compute usage. This pricing option does not add or remove instances and it does not react to changing demand. It only affects billing for whatever capacity you choose to run.\u003c/p\u003e\u003cp\u003e\u003ci\u003eSpot Instances\u003c/i\u003e offer discounted access to spare capacity and can reduce costs, yet they can be interrupted by AWS and they do not by themselves scale your fleet up or down with demand. They can be combined with an Auto Scaling group, but on their own they do not meet the requirement to automatically decrease instance count when demand drops.\u003c/p\u003e\u003cp\u003e\u003ci\u003eReserved Instances\u003c/i\u003e provide billing discounts and in some cases capacity reservations, which are best for steady state usage. They do not automatically scale your capacity and they are not a mechanism to reduce instance count when traffic decreases.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question focuses on automatically changing the number of EC2 instances as demand rises or falls, think of \u003ci\u003escaling\u003c/i\u003e services like Amazon EC2 Auto Scaling rather than pricing models such as Savings Plans or Reserved Instances.\u003c/p\u003e","references":[{"description":"What is Amazon EC2 Auto Scaling","url":"https://docs.aws.amazon.com/autoscaling/ec2/userguide/what-is-amazon-ec2-auto-scaling.html"},{"description":"Savings Plans User Guide","url":"https://docs.aws.amazon.com/savingsplans/latest/userguide/what-is-savings-plans.html"},{"description":"Amazon EC2 Spot Instances","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html"},{"description":"Amazon EC2 Reserved Instances","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ec2-reserved-instances.html"}]},{"originalQuery":"Acompany wants to know more about the benefits offered by cloud computing. The company wants to understand the operational advantage of agility.\nHow does AWS provide agility for users?","originalOptions":[{"text":"The ability the ensure high availability by deploying workloads to multiple regions","correct":false},{"text":"pay-as-you-go model for many services and resources","correct":false},{"text":"The ability to transfer infrastructure management to the AWS Cloud","correct":false},{"text":"The ability to provision and deprovision resources quickly with minimal effort","correct":true}],"source":"exam","query":"Scrumtuous Publishing is reviewing the advantages of using cloud computing. The company wants to understand what agility means as an operational benefit in AWS. How does AWS provide agility to customers?","options":[{"text":"A pay as you go pricing model for many services and resources","explanation":"This pricing approach lets customers pay based on usage instead of purchasing capacity in advance.","correct":false,"selected":false},{"text":"The ability to provision and remove resources quickly with minimal effort","explanation":"This capability allows customers to adjust computing resources as business needs change.","correct":true,"selected":false},{"text":"The ability to shift infrastructure management responsibilities to the AWS Cloud","explanation":"This concept relates to reducing customer responsibility for maintaining certain underlying infrastructure components.","correct":false,"selected":false},{"text":"The ability to improve availability by running workloads in several AWS Regions","explanation":"This approach describes placing applications and services in multiple geographic locations for resilience planning.","correct":false,"selected":false}],"answerCode":"2","type":"multiple-choice","geminiFlashAnswerCode":"2","domain":"Cloud Concepts","answer":"\u003cp\u003eThe correct answer is \u003cb\u003eThe ability to provision and remove resources quickly with minimal effort\u003c/b\u003e. This captures agility in AWS because customers can create or tear down environments rapidly and adapt quickly as needs change.\u003c/p\u003e\u003cp\u003eAgility in the cloud comes from on demand provisioning, APIs, and automation that compress the time from idea to implementation. Customers can launch compute, storage, and database resources in minutes, automate environments with AWS CloudFormation, and scale with Amazon EC2 Auto Scaling. This removes long procurement cycles and enables rapid experimentation and iteration so teams can deliver features faster and stop resources just as quickly when they are no longer needed.\u003c/p\u003e\u003cp\u003e\u003ci\u003eThe ability to improve availability by running workloads in several AWS Regions\u003c/i\u003e is a reliability and resiliency benefit. Multi-Region architectures improve fault tolerance and can reduce latency for global users, yet they do not define agility because they focus on uptime and geographic redundancy rather than speed of change.\u003c/p\u003e\u003cp\u003e\u003ci\u003eA pay as you go pricing model for many services and resources\u003c/i\u003e is primarily a pricing benefit that aligns cost with usage. It can encourage experimentation, yet it is not the definition of agility because agility is about rapidly provisioning and deprovisioning resources rather than how billing is calculated.\u003c/p\u003e\u003cp\u003e\u003ci\u003eThe ability to shift infrastructure management responsibilities to the AWS Cloud\u003c/i\u003e reflects the managed services approach and the AWS Shared Responsibility Model. This reduces operational burden and lets teams focus on higher value work, yet it is not agility because it addresses who manages which layers rather than how quickly resources can be created or removed.\u003c/p\u003e","tip":"\u003cp\u003eWhen you see a question about \u003ci\u003eagility\u003c/i\u003e, look for answers that stress \u003ci\u003erapid provisioning\u003c/i\u003e and \u003ci\u003equick deprovisioning\u003c/i\u003e with minimal effort. Map options about \u003ci\u003epricing\u003c/i\u003e to cost benefits and options about \u003ci\u003emulti-Region availability\u003c/i\u003e to reliability rather than agility.\u003c/p\u003e","references":[]},{"originalQuery":"What is the primary use case for Amazon GuardDuty?","originalOptions":[{"text":"Prevention of DDoS attacks","correct":false},{"text":"Protection against SQL injection attacks","correct":false},{"text":"Automatic monitoring for threats to AWS workloads","correct":true},{"text":"Automatic provisioning of AWS resources","correct":false}],"source":"exam","query":"A company is reviewing AWS security services and wants to understand the main purpose of Amazon GuardDuty. Which use case best matches this service?","options":[{"text":"Defending applications from SQL injection attempts","explanation":"This capability relates to filtering malicious web requests that target application input handling","correct":false,"selected":false},{"text":"Continuously monitoring AWS workloads for potential threats","explanation":"This service analyzes activity and findings across supported AWS data sources to help identify suspicious behavior","correct":true,"selected":false},{"text":"Automatically creating AWS resources","explanation":"This capability involves deploying infrastructure or services without manual setup steps","correct":false,"selected":false},{"text":"Preventing DDoS attacks","explanation":"This approach focuses on reducing the impact of high volume traffic events against applications and network endpoints","correct":false,"selected":false}],"answerCode":"2","type":"multiple-choice","geminiFlashAnswerCode":"2","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct option is \u003cb\u003eContinuously monitoring AWS workloads for potential threats\u003c/b\u003e. Amazon GuardDuty is a continuous threat detection service that analyzes AWS account activity, network traffic, and DNS logs to identify malicious or unauthorized behavior, which matches this use case.\u003c/p\u003e\u003cp\u003eGuardDuty ingests AWS CloudTrail management and data events including S3 object level activity, Amazon VPC Flow Logs, Amazon Route 53 DNS query logs, and Amazon EKS audit logs. It uses machine learning, anomaly detection, and threat intelligence to generate actionable security findings. You can route findings to Amazon EventBridge to trigger AWS Lambda or ticketing workflows for investigation and automated response. This service focuses on continuous monitoring and detection rather than active blocking.\u003c/p\u003e\u003cp\u003eThe option \u003ci\u003ePreventing DDoS attacks\u003c/i\u003e is not the purpose of GuardDuty. Distributed denial of service protection is provided by AWS Shield Standard and AWS Shield Advanced, and application layer protections are configured with AWS WAF. GuardDuty can help detect suspicious activity but it does not block DDoS traffic.\u003c/p\u003e\u003cp\u003eThe option \u003ci\u003eDefending applications from SQL injection attempts\u003c/i\u003e is handled by AWS WAF using managed or custom rules that inspect HTTP requests and block malicious patterns. GuardDuty does not inspect application traffic to filter specific exploits.\u003c/p\u003e\u003cp\u003eThe option \u003ci\u003eAutomatically creating AWS resources\u003c/i\u003e describes provisioning and automation services such as AWS CloudFormation or the AWS CDK. GuardDuty does not create infrastructure and instead focuses on detecting threats in your existing environment.\u003c/p\u003e","tip":"\u003cp\u003eMatch each security service to its primary function. Use \u003ci\u003edetection\u003c/i\u003e for Amazon GuardDuty, use \u003ci\u003eDDoS protection\u003c/i\u003e for AWS Shield, use \u003ci\u003eweb exploit filtering\u003c/i\u003e for AWS WAF, and use \u003ci\u003eprovisioning\u003c/i\u003e for AWS CloudFormation.\u003c/p\u003e","references":[{"description":"Amazon GuardDuty - What is Amazon GuardDuty","url":"https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html"}]},{"originalQuery":"Acompany needs to process large amounts of data without managing infrastructure.\nWhich AWS service will meet these requirements?","originalOptions":[{"text":"Amazon EC2","correct":false},{"text":"Amazon WorkSpaces","correct":false},{"text":"AWS Batch","correct":true},{"text":"Amazon RDS \u003e","correct":false}],"source":"exam","query":"Scrumtuous Analytics wants to run high volume data processing jobs in AWS without having to provision or administer the underlying compute infrastructure. Which AWS service should the company use?","options":[{"text":"AWS Batch","explanation":"AWS Batch is designed to run batch computing jobs and can manage the required compute resources for those jobs.","correct":true,"selected":false},{"text":"Amazon EC2","explanation":"Amazon EC2 provides virtual servers that customers can configure and operate for a wide range of workloads.","correct":false,"selected":false},{"text":"Amazon RDS","explanation":"Amazon RDS provides managed relational database engines for applications that need structured data storage.","correct":false,"selected":false},{"text":"Amazon WorkSpaces","explanation":"Amazon WorkSpaces provides managed virtual desktops for users who need access to desktop environments in the cloud.","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAWS Batch\u003c/b\u003e because it allows the company to run high volume data processing jobs without provisioning or administering the underlying compute infrastructure.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS Batch\u003c/b\u003e is a fully managed batch computing service that plans, schedules, and runs jobs across the optimal quantity and type of compute resources. It can create and scale managed compute environments on your behalf and it can run jobs on AWS Fargate so you do not manage servers or container hosts. This matches the requirement to avoid infrastructure provisioning while supporting large scale data processing.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon EC2\u003c/i\u003e requires you to launch, configure, and maintain instances and scaling, which means you must provision and administer the servers, so it does not meet the stated need.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon WorkSpaces\u003c/i\u003e is a managed virtual desktop service for end users and it is not designed for running batch data processing jobs.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon RDS\u003c/i\u003e is a managed relational database service used for storing and querying data, and it is not a service for running batch compute workloads.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question says you want to \u003ci\u003eavoid provisioning or administering servers\u003c/i\u003e, look for fully managed or serverless compute options. For large scale batch workloads, match that phrasing to \u003ci\u003eAWS Batch\u003c/i\u003e because it manages capacity and scheduling for you.\u003c/p\u003e","references":[{"description":"What is AWS Batch","url":"https://docs.aws.amazon.com/batch/latest/userguide/what-is-aws-batch.html"},{"description":"What is Amazon EC2","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/concepts.html"},{"description":"What is Amazon RDS","url":"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Welcome.html"}]},{"originalQuery":"Which tasks are the customer's responsibility, according to the AWS shared responsibility model? (Select TWO.)","originalOptions":[{"text":"Establish the global infrastructure.","correct":false},{"text":"Perform client-side data encryption.","correct":true},{"text":"Configure IAM credentials.","correct":true},{"text":"Secure edge locations.","correct":false},{"text":"Patch Amazon RDS DB instances.","correct":false}],"source":"exam","query":"Under the AWS shared responsibility model, which activities belong to the customer rather than AWS?","options":[{"text":"Protect AWS edge locations","explanation":"This activity concerns the physical and operational security controls for locations that support AWS edge services.","correct":false,"selected":false},{"text":"Patch Amazon RDS DB instances","explanation":"This activity relates to applying maintenance updates to managed relational database resources that run through Amazon RDS.","correct":false,"selected":false},{"text":"Manage IAM credentials and access settings","explanation":"This activity includes creating identities, assigning permissions, and handling authentication settings for AWS account access.","correct":true,"selected":false},{"text":"Build and operate the global infrastructure","explanation":"This activity refers to the facilities, networking, hardware, and regional infrastructure that support AWS services.","correct":false,"selected":false},{"text":"Apply client-side encryption to data","explanation":"This activity involves protecting information before it is sent to an AWS service by using encryption methods managed by the user or application.","correct":true,"selected":false}],"answerCode":"3,5","type":"multi-select","geminiFlashAnswerCode":"3,5","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct options are \u003cb\u003eApply client-side encryption to data\u003c/b\u003e and \u003cb\u003eManage IAM credentials and access settings\u003c/b\u003e. These activities fall under the customer’s responsibility because they relate to securing data and managing identities within the customer’s use of AWS services.\u003c/p\u003e\u003cp\u003e\u003cb\u003eApply client-side encryption to data\u003c/b\u003e is a customer task because customers decide how their data is protected before it enters AWS and as it moves between services. Customers choose encryption approaches, manage keys when using client-side methods or customer managed keys, and ensure proper handling of sensitive information. AWS provides tools such as AWS KMS and service features, yet the responsibility to enable and correctly use them for data protection in the customer’s workloads remains with the customer.\u003c/p\u003e\u003cp\u003e\u003cb\u003eManage IAM credentials and access settings\u003c/b\u003e is a customer responsibility because customers create and govern IAM users, roles, policies, and permission boundaries. Customers enforce multi factor authentication, rotate credentials, apply least privilege, and protect the root user. AWS secures the IAM service itself, but customers control who can do what within their accounts.\u003c/p\u003e\u003cp\u003e\u003ci\u003eBuild and operate the global infrastructure\u003c/i\u003e is not a customer responsibility. AWS is responsible for the physical facilities, hardware, networking, Regions, Availability Zones, and the global network that provide security of the cloud.\u003c/p\u003e\u003cp\u003e\u003ci\u003eProtect AWS edge locations\u003c/i\u003e is not a customer responsibility. AWS secures its edge sites and the global network and provides services such as AWS Shield Standard and AWS WAF integration, while customers focus on configuring their distributions and security policies rather than protecting the edge facilities themselves.\u003c/p\u003e\u003cp\u003e\u003ci\u003ePatch Amazon RDS DB instances\u003c/i\u003e is not a customer responsibility in the way it is phrased. For managed services like Amazon RDS, AWS handles patching of the underlying infrastructure and database engine during maintenance windows, while customers choose versions, maintenance timing, and configuration. The direct patching of the instances is part of security of the cloud.\u003c/p\u003e","tip":"\u003cp\u003eLink each task to the shared responsibility model. AWS owns \u003ci\u003esecurity of the cloud\u003c/i\u003e such as data centers, global infrastructure, and managed service patching, while customers own \u003ci\u003esecurity in the cloud\u003c/i\u003e such as identity and access, configuration, and encryption choices.\u003c/p\u003e","references":[{"description":"IAM best practices","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"},{"description":"Client-side encryption with Amazon S3","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/UsingClientSideEncryption.html"},{"description":"Amazon RDS maintenance and software updates","url":"https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/Concepts.DBMaintenance.html"}]},{"originalQuery":"A business analyst needs to investigate a billing charge for Amazon S3 in an AWS account.\nWhich AWS service or tool can the business analyst use to investigate the charge?","originalOptions":[{"text":"Amazon CroyaWatch","correct":false},{"text":"AWS Pricing Calculator","correct":false},{"text":"AWS Cost Explorer","correct":true},{"text":"Savings Plans coverage report","correct":false}],"source":"exam","query":"A finance analyst at McKenzie Inc sees an unexpected Amazon S3 line item on the monthly AWS bill. Which AWS service or tool can the analyst use to review and investigate the charge?","options":[{"text":"AWS Cost Explorer","explanation":"AWS Cost Explorer provides visual reports and filtering options for analyzing AWS spending and usage over time.","correct":true,"selected":false},{"text":"Savings Plans coverage report","explanation":"The Savings Plans coverage report shows how much eligible compute usage is covered by active Savings Plans.","correct":false,"selected":false},{"text":"AWS Pricing Calculator","explanation":"AWS Pricing Calculator helps estimate the cost of planned AWS architectures and service usage before deployment.","correct":false,"selected":false},{"text":"Amazon CloudWatch","explanation":"Amazon CloudWatch provides monitoring data, logs, metrics, and alarms for AWS resources and applications.","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Billing, Pricing, and Support","answer":"\u003cp\u003eThe correct answer is \u003cb\u003eAWS Cost Explorer\u003c/b\u003e because it is the dedicated billing analysis tool that lets you review and investigate unexpected charges on your AWS bill.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS Cost Explorer\u003c/b\u003e provides interactive charts and detailed reports so you can filter and group your costs by service, usage type, Region, account, and tags. You can focus on Amazon S3 charges by grouping by service, switch to a daily view to spot spikes, and apply cost allocation tags to pinpoint which workloads or teams contributed to the line item. You can also save filtered views and export data to support finance reviews and chargeback processes.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon CloudWatch\u003c/i\u003e is used for monitoring metrics, logs, and alarms for resources and applications. It is not designed for detailed billing analysis or for drilling into invoice line items, so it will not help investigate a specific S3 charge.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Pricing Calculator\u003c/i\u003e is for estimating costs before you deploy and it does not access your actual billing data. It cannot analyze charges that already appear on your bill.\u003c/p\u003e\u003cp\u003e\u003ci\u003eSavings Plans coverage report\u003c/i\u003e focuses on Savings Plans utilization and coverage for eligible compute services such as Amazon EC2, AWS Fargate, and AWS Lambda. Savings Plans do not apply to Amazon S3, so this report cannot explain an S3 line item.\u003c/p\u003e","tip":"\u003cp\u003eMatch the task to the right tool. Use \u003ci\u003eCost Explorer\u003c/i\u003e to analyze \u003ci\u003ecurrent charges\u003c/i\u003e on real bills, use \u003ci\u003eAWS Pricing Calculator\u003c/i\u003e to \u003ci\u003eestimate\u003c/i\u003e costs before deployment, and remember that \u003ci\u003eSavings Plans\u003c/i\u003e apply to compute services and not to Amazon S3.\u003c/p\u003e","references":[{"description":"What is AWS Cost Explorer","url":"https://docs.aws.amazon.com/cost-management/latest/userguide/ce-what-is.html"},{"description":"Visualize your AWS costs with Cost Explorer","url":"https://docs.aws.amazon.com/cost-management/latest/userguide/ce-visualize.html"},{"description":"AWS Pricing Calculator","url":"https://calculator.aws/"},{"description":"What are AWS Savings Plans","url":"https://docs.aws.amazon.com/savingsplans/latest/userguide/what-is-savings-plans.html"}]},{"originalQuery":"Which AWS service can help provide low-latency application experiences by running workloads on premises?","originalOptions":[{"text":"AWS Outposts","correct":true},{"text":"Amazon Connect","correct":false},{"text":"Amazon Lightsail","correct":false},{"text":"AWS Direct Connect","correct":false}],"source":"exam","query":"Which AWS service can Scrumtuous Manufacturing use to deliver low latency application performance by placing AWS workloads in its own data center?","options":[{"text":"AWS Direct Connect","explanation":"AWS Direct Connect provides dedicated network connectivity between a customer environment and AWS.","correct":false,"selected":false},{"text":"AWS Outposts","explanation":"AWS Outposts is a fully managed AWS offering that extends AWS infrastructure and selected AWS services to supported customer locations.","correct":true,"selected":false},{"text":"Amazon Lightsail","explanation":"Amazon Lightsail provides simplified compute, storage, and networking resources for common application deployments.","correct":false,"selected":false},{"text":"Amazon Connect","explanation":"Amazon Connect is an AWS contact center service that supports customer service and communication workflows.","correct":false,"selected":false}],"answerCode":"2","type":"multiple-choice","geminiFlashAnswerCode":"2","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAWS Outposts\u003c/b\u003e because it places AWS infrastructure and services in your own data center so your applications can run locally and achieve consistently low latency to on premises users and systems.\u003c/p\u003e\u003cp\u003eWith \u003cb\u003eAWS Outposts\u003c/b\u003e, AWS delivers and manages the hardware in your facility and you use the same APIs, tools, and services as in the Region. This hybrid approach keeps data and processing close to factory systems, helps meet data residency and latency needs, and integrates with services in the nearest AWS Region for control plane operations and broader capabilities.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Connect\u003c/i\u003e is a cloud contact center service for voice and omnichannel customer engagement and it does not place AWS compute or storage in your data center.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Lightsail\u003c/i\u003e provides simplified virtual private servers and managed application stacks in AWS Regions and it does not extend AWS hardware into your on premises environment.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Direct Connect\u003c/i\u003e provides a dedicated network connection between your network and AWS which can improve network performance, but your workloads still run in AWS Regions and it does not place AWS infrastructure in your data center.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question asks about running AWS services in your data center for very low latency, map it to \u003ci\u003eOutposts\u003c/i\u003e. If a choice only improves connectivity without placing compute on premises, think of \u003ci\u003eDirect Connect\u003c/i\u003e and eliminate it.\u003c/p\u003e","references":[{"description":"What is AWS Outposts","url":"https://docs.aws.amazon.com/outposts/latest/userguide/what-is-outposts.html"}]},{"originalQuery":"What is one advantage of migrating on-premises applications to Amazon EC2 instances in the AWS Cloud?","originalOptions":[{"text":"Users no longer have fe manage patches of guest operating systems.","correct":false},{"text":"Users can benefit from using a fully managed service.","correct":false},{"text":"Users can benefit from flexible pricing models.","correct":true},{"text":"Users can benefit from automatic storage cost optimization.","correct":false}],"source":"exam","query":"What is a benefit for Scrumtuous Publishing when it moves applications from its local data center to Amazon EC2 instances in the AWS Cloud?","options":[{"text":"The company can use Amazon EC2 as a fully managed application service","explanation":"A fully managed service handles many operational tasks for customers as part of the service experience.","correct":false,"selected":false},{"text":"The company no longer needs to manage guest operating system patches","explanation":"Guest operating system patching involves applying updates to the operating systems that run on compute resources.","correct":false,"selected":false},{"text":"The company can take advantage of flexible pricing options","explanation":"Flexible pricing options let customers choose purchasing approaches that align with usage patterns and business needs.","correct":true,"selected":false},{"text":"The company receives automatic optimization of storage costs for all attached volumes","explanation":"Storage cost optimization focuses on matching storage choices and configurations to workload requirements.","correct":false,"selected":false}],"answerCode":"3","type":"multiple-choice","geminiFlashAnswerCode":"3","domain":"Cloud Concepts","answer":"\u003cp\u003eThe correct option is \u003cb\u003eThe company can take advantage of flexible pricing options\u003c/b\u003e.\u003c/p\u003e\u003cp\u003eAmazon EC2 offers \u003cb\u003eflexible pricing options\u003c/b\u003e that let you match cost to usage patterns. You can pay On-Demand for variable or short term needs. You can commit with Savings Plans or Reserved Instances to reduce costs for predictable usage. You can choose Spot Instances for interruptible workloads at significant discounts. These choices help optimize spending compared to fixed capacity and fixed costs in a local data center.\u003c/p\u003e\u003cp\u003eThe option \u003ci\u003eThe company no longer needs to manage guest operating system patches\u003c/i\u003e is incorrect. Under the AWS Shared Responsibility Model, AWS secures the infrastructure while you are responsible for the guest operating system and applications on your Amazon EC2 instances. You must still patch and update the operating system, although services like AWS Systems Manager Patch Manager can help automate the process.\u003c/p\u003e\u003cp\u003eThe option \u003ci\u003eThe company can use Amazon EC2 as a fully managed application service\u003c/i\u003e is incorrect. Amazon EC2 is infrastructure as a service that provides virtual servers. You manage the operating system, runtime, and application. Fully managed application services are different offerings such as AWS Lambda or AWS Elastic Beanstalk.\u003c/p\u003e\u003cp\u003eThe option \u003ci\u003eThe company receives automatic optimization of storage costs for all attached volumes\u003c/i\u003e is incorrect. Amazon EBS volumes attached to EC2 do not automatically change types or sizes to lower cost. You select and adjust volume types and configurations to meet performance and price needs, and tools like AWS Compute Optimizer provide recommendations rather than automatic changes.\u003c/p\u003e","tip":"\u003cp\u003eLink benefits to \u003ci\u003epricing models\u003c/i\u003e and cost alignment for EC2, and remember the \u003ci\u003eshared responsibility\u003c/i\u003e model means you still patch the guest operating system on instances.\u003c/p\u003e","references":[{"description":"Compute Optimizer EBS volume recommendations","url":"https://docs.aws.amazon.com/compute-optimizer/latest/ug/ebs-volumes.html"},{"description":"Amazon EBS volume types","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/ebs-volume-types.html"}]},{"originalQuery":"Asecurity engineer wants a single-tenant AWS solution to create, control, and manage their own cryptographic keys to meet regulatory compliance requirements for data\nsecurity.\nWhich AWS service should the engineer use?","originalOptions":[{"text":"AWS Key Management Service (AWS KMS)","correct":false},{"text":"AWS Certificate Manager (ACM)","correct":false},{"text":"AWS CloudHSM","correct":true},{"text":"AWS Systems Manager","correct":false}],"source":"exam","query":"A security engineer at Scrumtuous Financial Services must use an AWS offering that provides a single tenant environment for creating, controlling, and administering cryptographic keys in support of data protection compliance requirements. Which AWS service should the engineer choose?","options":[{"text":"AWS Certificate Manager (ACM)","explanation":"AWS Certificate Manager (ACM) helps provision, manage, and renew public and private SSL/TLS certificates for AWS integrated resources","correct":false,"selected":false},{"text":"AWS Systems Manager","explanation":"AWS Systems Manager provides operational tools for managing AWS resources, applications, patching, automation, and configuration visibility","correct":false,"selected":false},{"text":"AWS CloudHSM","explanation":"AWS CloudHSM is an AWS service associated with cloud based hardware security modules for cryptographic processing and key related workloads","correct":true,"selected":false},{"text":"AWS Key Management Service (AWS KMS)","explanation":"AWS Key Management Service (AWS KMS) is a managed AWS service for creating and controlling cryptographic keys that integrate with many AWS services","correct":false,"selected":false}],"answerCode":"3","type":"multiple-choice","geminiFlashAnswerCode":"3","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAWS CloudHSM\u003c/b\u003e. It is the AWS offering that provides a dedicated single tenant hardware security module environment so you can create, control, and administer cryptographic keys to meet strict data protection and compliance requirements.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS CloudHSM\u003c/b\u003e gives you exclusive access to HSMs that run in your VPC and it lets you manage HSM users and key material directly. Because it is a single tenant and FIPS 140-2 Level 3 validated HSM service, organizations that need customer controlled keys and strict isolation can satisfy compliance frameworks that require dedicated cryptographic modules.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Key Management Service (AWS KMS)\u003c/i\u003e is incorrect because it is a fully managed multi tenant key management service where AWS operates the underlying HSM fleet. While you can use a custom key store in \u003ci\u003eAWS Key Management Service (AWS KMS)\u003c/i\u003e that is backed by \u003cb\u003eAWS CloudHSM\u003c/b\u003e, the question asks for an offering that itself provides a single tenant environment, which points directly to \u003cb\u003eAWS CloudHSM\u003c/b\u003e.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Certificate Manager (ACM)\u003c/i\u003e is incorrect because it manages the provisioning and renewal of SSL or TLS certificates for use with AWS services and your internal resources and it does not provide a single tenant HSM environment for generating and managing encryption keys for data at rest.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Systems Manager\u003c/i\u003e is incorrect because it is an operations service for automating patching, configuration, and fleet management tasks and it is not used to create or manage cryptographic keys.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question emphasizes \u003ci\u003esingle-tenant\u003c/i\u003e HSMs and customer control of key material, choose \u003ci\u003eAWS CloudHSM\u003c/i\u003e. When it emphasizes a fully \u003ci\u003emanaged\u003c/i\u003e key service and easy integration with AWS services, think \u003ci\u003eAWS KMS\u003c/i\u003e.\u003c/p\u003e","references":[{"description":"What is AWS CloudHSM","url":"https://docs.aws.amazon.com/cloudhsm/latest/userguide/introduction.html"},{"description":"AWS KMS overview","url":"https://docs.aws.amazon.com/kms/latest/developerguide/overview.html"},{"description":"Using an AWS KMS custom key store backed by CloudHSM","url":"https://docs.aws.amazon.com/kms/latest/developerguide/custom-key-store-overview.html"},{"description":"AWS Certificate Manager overview","url":"https://docs.aws.amazon.com/acm/latest/userguide/acm-overview.html"},{"description":"AWS Systems Manager overview","url":"https://docs.aws.amazon.com/systems-manager/latest/userguide/what-is-systems-manager.html"}]},{"originalQuery":"Which of the following is a fully managed MySQL-compatible database?","originalOptions":[{"text":"Amazon $3","correct":false},{"text":"Amazon DynamoDB","correct":false},{"text":"Amazon Redshift","correct":false},{"text":"Amazon Aurora","correct":true}],"source":"exam","query":"Which AWS service offers a fully managed relational database option with MySQL compatibility?","options":[{"text":"Amazon DynamoDB","explanation":"Amazon DynamoDB is a managed NoSQL database service designed for key value and document data models.","correct":false,"selected":false},{"text":"Amazon Aurora","explanation":"Amazon Aurora is a managed relational database engine that is available through Amazon RDS.","correct":true,"selected":false},{"text":"Amazon Redshift","explanation":"Amazon Redshift is a managed data warehouse service used for analytics workloads.","correct":false,"selected":false},{"text":"Amazon S3","explanation":"Amazon S3 is an object storage service used to store and retrieve data at scale.","correct":false,"selected":false}],"answerCode":"2","type":"multiple-choice","geminiFlashAnswerCode":"2","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAmazon Aurora\u003c/b\u003e.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAmazon Aurora\u003c/b\u003e is a fully managed relational database service that is compatible with MySQL. It is part of the Amazon RDS family and supports MySQL clients and tools while providing high performance, high availability, and automated management tasks such as backups and patching. This makes it the right choice when the requirement is a managed relational database with MySQL compatibility.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon S3\u003c/i\u003e is an object storage service for storing and retrieving any amount of data, and it is not a relational database. It does not provide SQL querying for relational workloads and it is not MySQL compatible.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon DynamoDB\u003c/i\u003e is a fully managed NoSQL database service that offers key value and document data models. It is not a relational database and it is not compatible with MySQL.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Redshift\u003c/i\u003e is a fully managed data warehouse service designed for analytical workloads at scale. It uses a columnar engine and its own SQL dialect for analytics and it is not a MySQL compatible relational database for transactional workloads.\u003c/p\u003e","tip":"\u003cp\u003eWhen you see the phrase \u003ci\u003eMySQL compatibility\u003c/i\u003e with a \u003ci\u003efully managed relational\u003c/i\u003e database, think of the Amazon RDS family and choose \u003ci\u003eAmazon Aurora\u003c/i\u003e if it is listed. Match keywords like object storage to S3, NoSQL to DynamoDB, and data warehouse to Redshift.\u003c/p\u003e","references":[{"description":"What is Amazon Aurora","url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Overview.Aurora.html"},{"description":"Amazon Aurora MySQL-Compatible Edition","url":"https://docs.aws.amazon.com/AmazonRDS/latest/AuroraUserGuide/Aurora.AuroraMySQL.html"},{"description":"What is Amazon S3","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html"},{"description":"What is Amazon DynamoDB","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/Introduction.html"},{"description":"What is Amazon Redshift","url":"https://docs.aws.amazon.com/redshift/latest/mgmt/welcome.html"}]},{"originalQuery":"Which AWS service ofjfeature provides a firewall at the subnet level within a VPC?","originalOptions":[{"text":"Security group","correct":false},{"text":"Network ACL","correct":true},{"text":"Elastic network interface","correct":false},{"text":"AWS WAF","correct":false}],"source":"exam","query":"Which AWS networking feature acts as a firewall for traffic entering and leaving subnets in a VPC?","options":[{"text":"Network ACL","explanation":"A network ACL is a VPC networking component that contains rules for inbound and outbound traffic evaluation at a subnet boundary.","correct":true,"selected":false},{"text":"Elastic network interface","explanation":"An elastic network interface is a virtual network adapter that can be attached to supported resources in a VPC.","correct":false,"selected":false},{"text":"AWS WAF","explanation":"AWS WAF is a web application firewall service that can be associated with supported web resources such as Amazon CloudFront distributions and Application Load Balancers.","correct":false,"selected":false},{"text":"Security group","explanation":"A security group is a virtual firewall that is associated with supported AWS resources such as Amazon EC2 instances and network interfaces.","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eNetwork ACL\u003c/b\u003e because it acts as a firewall for traffic entering and leaving subnets in a VPC.\u003c/p\u003e\u003cp\u003eA \u003cb\u003eNetwork ACL\u003c/b\u003e is associated with a subnet and filters both inbound and outbound traffic at the subnet boundary. It is stateless, which means return traffic must be explicitly allowed by rules in the opposite direction. It supports allow and deny rules and evaluates them in order using rule numbers, so the first matching rule determines whether the traffic is allowed or denied. This makes \u003cb\u003eNetwork ACL\u003c/b\u003e the right choice when the question focuses on subnet level filtering.\u003c/p\u003e\u003cp\u003e\u003ci\u003eSecurity group\u003c/i\u003e is incorrect because it operates at the instance or elastic network interface level rather than the subnet level. Unlike a \u003cb\u003eNetwork ACL\u003c/b\u003e, \u003ci\u003esecurity groups\u003c/i\u003e are stateful and only support allow rules, and they do not act as a firewall for traffic entering and leaving entire subnets.\u003c/p\u003e\u003cp\u003e\u003ci\u003eElastic network interface\u003c/i\u003e is incorrect because it is a virtual network adapter that you attach to an EC2 instance. While \u003ci\u003eelastic network interfaces\u003c/i\u003e can have \u003ci\u003esecurity groups\u003c/i\u003e associated with them, the interface itself is not a firewall and it does not control subnet level traffic like a \u003cb\u003eNetwork ACL\u003c/b\u003e does.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS WAF\u003c/i\u003e is incorrect because it is a web application firewall that protects HTTP and HTTPS traffic at services such as Amazon CloudFront, Application Load Balancer, and Amazon API Gateway. It does not filter VPC subnet traffic the way a \u003cb\u003eNetwork ACL\u003c/b\u003e does.\u003c/p\u003e","tip":"\u003cp\u003eWhen you see the question mention a \u003ci\u003esubnet\u003c/i\u003e boundary or filtering both inbound and outbound at the subnet level, choose a network ACL. When it points to the \u003ci\u003einstance\u003c/i\u003e or elastic network interface and mentions stateful behavior, choose a security group.\u003c/p\u003e","references":[{"description":"VPC network ACLs","url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-network-acls.html"},{"description":"VPC security groups","url":"https://docs.aws.amazon.com/vpc/latest/userguide/vpc-security-groups.html"},{"description":"Elastic network interfaces","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-eni.html"},{"description":"What is AWS WAF","url":"https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html"}]},{"originalQuery":"According to the AWS shared responsibility model, which task is the customer's responsibility?","originalOptions":[{"text":"Maintaining the infrastructure (eeded to run AWS Lambda","correct":false},{"text":"Updating the operating system of Amazon DynamoDB instances","correct":false},{"text":"Maintaining Amazon S3 infrastructure","correct":false},{"text":"Updating the guest operating system on Amazon EC2 instances","correct":true}],"source":"exam","query":"Under the AWS shared responsibility model, which activity is handled by the customer?","options":[{"text":"Maintaining the infrastructure that supports Amazon S3","explanation":"This activity refers to the physical and service infrastructure used to deliver object storage in AWS.","correct":false,"selected":false},{"text":"Patching the guest operating system on Amazon EC2 instances","explanation":"This activity involves managing software inside virtual server instances that a customer launches.","correct":true,"selected":false},{"text":"Applying operating system updates to Amazon DynamoDB instances","explanation":"This activity describes patching operating system software for a fully managed database service.","correct":false,"selected":false},{"text":"Maintaining the infrastructure required to operate AWS Lambda","explanation":"This activity involves the underlying environment that supports running serverless functions in AWS.","correct":false,"selected":false}],"answerCode":"2","type":"multiple-choice","geminiFlashAnswerCode":"2","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct option is \u003cb\u003ePatching the guest operating system on Amazon EC2 instances\u003c/b\u003e.\u003c/p\u003e\u003cp\u003eThis is correct because under the shared responsibility model AWS secures the infrastructure that runs the services while customers secure what they run in the services. With Amazon EC2 the customer controls the guest operating system and applications. That means the customer must install patches and updates on the instance operating system and can use tools such as AWS Systems Manager Patch Manager to automate this work.\u003c/p\u003e\u003cp\u003e\u003ci\u003eMaintaining the infrastructure required to operate AWS Lambda\u003c/i\u003e is incorrect because AWS operates and maintains the servers, runtimes, and scaling for Lambda. Customers provide code and manage configuration and permissions while AWS handles the underlying compute infrastructure.\u003c/p\u003e\u003cp\u003e\u003ci\u003eApplying operating system updates to Amazon DynamoDB instances\u003c/i\u003e is incorrect because DynamoDB is a fully managed service. AWS manages the servers and operating systems that run the service while customers focus on data modeling, access controls, and throughput configuration.\u003c/p\u003e\u003cp\u003e\u003ci\u003eMaintaining the infrastructure that supports Amazon S3\u003c/i\u003e is incorrect because S3 is a managed storage service. AWS maintains the storage infrastructure and durability mechanisms while customers are responsible for access controls, bucket policies, and data management.\u003c/p\u003e","tip":"\u003cp\u003eMap the service type to responsibility. For \u003ci\u003eEC2\u003c/i\u003e you manage the guest operating system and patches. For \u003ci\u003emanaged or serverless services\u003c/i\u003e such as S3, DynamoDB, and Lambda AWS handles the infrastructure and operating systems. Remember \u003ci\u003esecurity of the cloud\u003c/i\u003e is AWS and \u003ci\u003esecurity in the cloud\u003c/i\u003e is the customer.\u003c/p\u003e","references":[{"description":"Shared responsibility for AWS Lambda","url":"https://docs.aws.amazon.com/lambda/latest/dg/security-responsibility.html"},{"description":"Amazon S3 User Guide","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html"},{"description":"AWS Systems Manager Patch Manager","url":"https://docs.aws.amazon.com/systems-manager/latest/userguide/systems-manager-patch.html"}]},{"originalQuery":"Acompany migrated its core application onto multiple workloads in the AWS Cloud. The company wants to improve the application's reliability.\nWhich cloud design principle should the company implement to achieve this goal?","originalOptions":[{"text":"Maximize utilization.","correct":false},{"text":"Decouple the components.","correct":true},{"text":"Rightsize the resources.","correct":false},{"text":"Adopt a consumption model.","correct":false}],"source":"exam","query":"Scrumtuous Publishing has moved a business critical application to several workloads in the AWS Cloud. The company wants to make the application more dependable. Which cloud design principle should the company apply to meet this requirement?","options":[{"text":"Increase utilization as much as possible","explanation":"This principle focuses on keeping provisioned capacity highly used across the environment.","correct":false,"selected":false},{"text":"Use a consumption based model","explanation":"This principle emphasizes paying for resources based on actual usage rather than fixed long term capacity.","correct":false,"selected":false},{"text":"Separate the application components","explanation":"This principle organizes application parts so they interact through defined interfaces rather than tight dependencies.","correct":true,"selected":false},{"text":"Right size the resources","explanation":"This principle involves matching resource capacity to the needs of the workload.","correct":false,"selected":false}],"answerCode":"3","type":"multiple-choice","geminiFlashAnswerCode":"3","domain":"Cloud Concepts","answer":"\u003cp\u003eThe correct option is \u003cb\u003eSeparate the application components\u003c/b\u003e. This choice aligns with the reliability design principle of building loosely coupled architectures so failures are isolated, components can scale independently, and the overall application becomes more dependable.\u003c/p\u003e\u003cp\u003eDecoupling improves reliability because each service or tier can continue operating even when a dependency is impaired. Using asynchronous communication with services like Amazon SQS or Amazon SNS helps buffer traffic and smooth demand so sudden spikes do not cascade into failures. Independent scaling and deployment of components also reduce the likelihood that a change or fault in one part will affect the entire system. These patterns are central to the Reliability Pillar of the AWS Well-Architected Framework.\u003c/p\u003e\u003cp\u003e\u003ci\u003eIncrease utilization as much as possible\u003c/i\u003e is not a reliability principle. Maximizing utilization reduces headroom and can lead to throttling or resource exhaustion during traffic spikes, which lowers dependability.\u003c/p\u003e\u003cp\u003e\u003ci\u003eRight size the resources\u003c/i\u003e focuses on cost and efficiency. While resource sizing is important, it does not by itself make an application more dependable. Reliability comes from fault isolation, redundancy, and recovery strategies rather than only adjusting instance sizes.\u003c/p\u003e\u003cp\u003e\u003ci\u003eUse a consumption based model\u003c/i\u003e relates to cloud pricing and cost management. Paying for what you use does not inherently improve the resilience or fault tolerance of an application.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question asks about application dependability or \u003ci\u003ereliability\u003c/i\u003e, look for answers that emphasize loose coupling, fault isolation, and the ability to scale or recover independently rather than cost or pricing models.\u003c/p\u003e","references":[{"description":"AWS Well-Architected Framework Reliability Pillar - Design Principles","url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/design-principles.html"},{"description":"Amazon SQS Developer Guide - What is Amazon SQS","url":"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/welcome.html"},{"description":"Amazon SNS Developer Guide - What is Amazon SNS","url":"https://docs.aws.amazon.com/sns/latest/dg/welcome.html"}]},{"originalQuery":"Acompany is migrating to the AWS Cloud and plans to run experimental workloads for 3 to 6 months on AWS.\nWhich pricing model will meet these requirements?","originalOptions":[{"text":"Use Savings Plans for a 3-year term.","correct":false},{"text":"Use Dedicated Hosts.","correct":false},{"text":"Buy Reserved Instances.","correct":false},{"text":"Use On-Demand Instances.","correct":true}],"source":"exam","query":"Scrumtuous Analytics is moving several proof of concept applications to AWS and expects to run them for about 2 to 5 months. Which pricing model should Scrumtuous Analytics choose for this temporary and uncertain usage?","options":[{"text":"Use Dedicated Hosts","explanation":"Dedicated Hosts provide physical servers with instance capacity dedicated for use by a single customer.","correct":false,"selected":false},{"text":"Purchase Reserved Instances","explanation":"Reserved Instances provide discounted instance pricing when capacity is reserved for a specified term.","correct":false,"selected":false},{"text":"Use Savings Plans with a 3 year term","explanation":"Savings Plans provide discounted compute pricing in exchange for a committed amount of usage over a one year or three year term.","correct":false,"selected":false},{"text":"Use On-Demand Instances","explanation":"On-Demand Instances let customers pay for compute capacity by the second or hour without a long term commitment.","correct":true,"selected":false}],"answerCode":"4","type":"multiple-choice","geminiFlashAnswerCode":"4","domain":"Billing, Pricing, and Support","answer":"\u003cp\u003eThe correct option is \u003cb\u003eUse On-Demand Instances\u003c/b\u003e. This model fits temporary and unpredictable workloads that will run for only two to five months because you pay only for what you use without any long term commitment and you can start or stop instances as needs change.\u003c/p\u003e\u003cp\u003eThis choice is designed for flexibility. You can launch quickly for a proof of concept and then shut down when testing ends. Costs align with actual runtime so there is no need to forecast steady usage or commit to a term. This reduces the risk of overcommitting when the duration and scale are uncertain.\u003c/p\u003e\u003cp\u003e\u003ci\u003eUse Savings Plans with a 3 year term\u003c/i\u003e is not suitable because Savings Plans require a one or three year commitment to a consistent hourly spend. They work best when you can predict steady usage for a long period, which does not match a short lived and uncertain proof of concept.\u003c/p\u003e\u003cp\u003e\u003ci\u003eUse Dedicated Hosts\u003c/i\u003e is unnecessary in this scenario because Dedicated Hosts allocate physical servers for compliance or bring your own license needs. They are typically more expensive and are intended for long running workloads rather than brief tests.\u003c/p\u003e\u003cp\u003e\u003ci\u003ePurchase Reserved Instances\u003c/i\u003e is not appropriate because Reserved Instances require a one or three year commitment. They provide savings only when you have predictable and steady usage, which is not the case for a two to five month proof of concept.\u003c/p\u003e","tip":"\u003cp\u003eWhen usage is \u003ci\u003eshort term\u003c/i\u003e and \u003ci\u003eunpredictable\u003c/i\u003e, choose on-demand pricing. When usage is \u003ci\u003esteady\u003c/i\u003e and you can commit to a term, consider Reserved Instances or Savings Plans for lower cost.\u003c/p\u003e","references":[]},{"originalQuery":"Which AWS service or feature provides high availability and low latency by enabling failover across multiple AWS Regions?","originalOptions":[{"text":"Network Lqad Balancer","correct":false},{"text":"Amazon S3 Transfer Acceleration","correct":false},{"text":"AWS Global Accelerator","correct":true},{"text":"Application Load Balancer","correct":false}],"source":"exam","query":"Scrumtuous Retail needs users to access an application with low latency and remain connected if service in one AWS Region becomes unavailable. Which AWS service or feature can help provide this capability across AWS Regions?","options":[{"text":"Network Load Balancer","explanation":"This service distributes connection traffic at the transport layer for targets such as Amazon EC2 instances and IP addresses.","correct":false,"selected":false},{"text":"Application Load Balancer","explanation":"This service distributes HTTP and HTTPS traffic to targets based on request attributes such as paths and host names.","correct":false,"selected":false},{"text":"AWS Global Accelerator","explanation":"This service provides static IP addresses and uses the AWS global network for traffic to configured application endpoints.","correct":true,"selected":false},{"text":"Amazon S3 Transfer Acceleration","explanation":"This feature is associated with moving objects into Amazon S3 by using optimized network paths.","correct":false,"selected":false}],"answerCode":"3","type":"multiple-choice","geminiFlashAnswerCode":"3","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAWS Global Accelerator\u003c/b\u003e. It is designed to provide low latency access over the AWS global network and it automatically directs users to healthy endpoints in another AWS Region if the primary Region becomes unavailable.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS Global Accelerator\u003c/b\u003e gives you two static anycast IP addresses that front your application. User traffic enters at the closest AWS edge location and travels over the AWS backbone to the nearest healthy endpoint. The service continuously monitors health and performance, then performs rapid failover across Regions when needed. This global routing and health awareness help users experience lower latency and stay connected to a working endpoint even if an entire Region has an outage.\u003c/p\u003e\u003cp\u003e\u003ci\u003eNetwork Load Balancer\u003c/i\u003e is a highly performant load balancer that operates within a single AWS Region across multiple Availability Zones. It does not provide global anycast entry points or automatic cross Region failover, so it cannot meet the requirement to remain connected when a Region becomes unavailable.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon S3 Transfer Acceleration\u003c/i\u003e speeds transfers to and from Amazon S3 buckets using the AWS edge network. It is focused on object storage transfers and does not distribute traffic to application endpoints across Regions, so it does not solve low latency application access with cross Region failover.\u003c/p\u003e\u003cp\u003e\u003ci\u003eApplication Load Balancer\u003c/i\u003e provides HTTP and HTTPS Layer 7 load balancing within a single AWS Region. It improves availability across multiple Availability Zones but it does not offer global routing or automatic failover to endpoints in other Regions.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question asks for low latency for users around the world and resilience across Regions, think of \u003ci\u003eglobal entry points\u003c/i\u003e and \u003ci\u003ehealth based routing\u003c/i\u003e. Regional load balancers improve availability within a Region, while \u003ci\u003eAWS Global Accelerator\u003c/i\u003e provides global ingress and cross Region failover.\u003c/p\u003e","references":[{"description":"What is AWS Global Accelerator","url":"https://docs.aws.amazon.com/global-accelerator/latest/dg/what-is-global-accelerator.html"},{"description":"AWS Global Accelerator features and benefits","url":"https://docs.aws.amazon.com/global-accelerator/latest/dg/introduction-benefits.html"},{"description":"Network Load Balancer documentation","url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/network/introduction.html"},{"description":"Application Load Balancer documentation","url":"https://docs.aws.amazon.com/elasticloadbalancing/latest/application/introduction.html"},{"description":"Amazon S3 Transfer Acceleration","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/transfer-acceleration.html"}]},{"originalQuery":"Acompany wants to migrate a database from an on-premises environment to Amazon RDS.\nAfter the migration is complete, which management task will the company still be responsible for?","originalOptions":[{"text":"Hardware lifequcle management","correct":false},{"text":"Application optimization","correct":true},{"text":"Server maintenance","correct":false},{"text":"Power, network, and cooling provisioning","correct":false}],"source":"exam","query":"Scrumtuous Retail plans to move its customer database from a local data center to Amazon RDS. After the migration is finished, which management responsibility will remain with Scrumtuous Retail?","options":[{"text":"Database server maintenance","explanation":"This activity includes operating system updates, host upkeep, and routine care for the server that runs the database engine.","correct":false,"selected":false},{"text":"Power, networking, and cooling capacity planning","explanation":"This activity involves preparing data center facilities so infrastructure can operate with sufficient utilities and connectivity.","correct":false,"selected":false},{"text":"Application performance tuning","explanation":"This activity focuses on improving how the company’s software uses the database and responds to business workloads.","correct":true,"selected":false},{"text":"Hardware lifecycle management","explanation":"This activity includes planning, replacing, and retiring the physical equipment that supports a database environment.","correct":false,"selected":false}],"answerCode":"3","type":"multiple-choice","geminiFlashAnswerCode":"3","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct option is \u003cb\u003eApplication performance tuning\u003c/b\u003e. After moving to Amazon RDS, the customer continues to be responsible for how the application queries the database and how the schema and indexes are designed to meet performance goals.\u003c/p\u003e\u003cp\u003eIn Amazon RDS, AWS manages the undifferentiated heavy lifting for the database environment. AWS provisions and maintains the underlying hardware and networking, installs and patches the database engine and operating system, performs automated backups if configured, and handles routine maintenance during the defined maintenance window. The customer still owns data modeling, query design, indexing strategy, connection management, and the use of tools like Performance Insights and Amazon CloudWatch to monitor and tune performance. This is why \u003cb\u003eApplication performance tuning\u003c/b\u003e remains a customer responsibility in the shared responsibility model for managed services.\u003c/p\u003e\u003cp\u003e\u003ci\u003eHardware lifecycle management\u003c/i\u003e is incorrect because AWS owns and operates t
