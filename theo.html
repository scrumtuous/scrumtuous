<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Theo | AWS Cloud Practice Exam</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #d9e0e8;
      --primary: #1769aa;
      --primary-dark: #0f4f85;
      --secondary: #667085;
      --success: #16803c;
      --success-bg: #eaf8ef;
      --danger: #b42318;
      --danger-bg: #fff0ee;
      --warning: #9a6700;
      --warning-bg: #fff7d6;
      --shadow: 0 10px 28px rgba(23, 32, 51, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      border-radius: 9px;
      padding: .62rem .92rem;
      cursor: pointer;
      font-weight: 650;
      transition: transform .08s ease, background .15s ease, opacity .15s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-secondary { background: #e8edf3; color: var(--text); }
    .btn-warning { background: #ffd96a; color: #4b3500; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }

    .page-shell {
      width: min(1040px, calc(100% - 28px));
      margin: 28px auto 60px;
    }

    .hero {
      background: linear-gradient(135deg, #12243b, #1e4f79);
      color: white;
      border-radius: 18px;
      padding: 24px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero-top {
      display: flex;
      gap: 18px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .hero h1 { margin: 0 0 6px; font-size: clamp(1.65rem, 4vw, 2.35rem); }
    .hero p { margin: 0; opacity: .88; }
    .meta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .pill {
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.1);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: .9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-top: 16px;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 18px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-weight: 750;
    }

    .card-body { padding: 18px; }

    .results {
      border-left: 5px solid var(--primary);
    }
    .results strong { font-size: 1.1rem; }

    .query {
      font-size: 1.08rem;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .choose-note {
      color: var(--muted);
      font-size: .9rem;
      margin: 0 0 16px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 11px 12px;
      margin: 8px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
    }

    .option input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--primary);
      flex: 0 0 auto;
    }

    .option.reveal-correct {
      border-color: #75c991;
      background: var(--success-bg);
    }

    .option.reveal-wrong-selected {
      border-color: #e9a7a0;
      background: var(--danger-bg);
    }

    .option small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .answer-panel {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--warning-bg);
      border: 1px solid #f0d783;
    }

    .answer-panel p:first-child { margin-top: 0; }
    .answer-panel ul { margin-bottom: 0; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .control-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .collapsible-title { cursor: pointer; user-select: none; }
    .chevron { font-size: .9rem; color: var(--muted); }

    .jumper-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .jump-btn {
      min-width: 38px;
      padding: 7px 9px;
      background: #eef2f6;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .jump-btn.viewed { background: #d7dee7; }
    .jump-btn.current { background: var(--primary); color: white; border-color: var(--primary); }
    .jump-btn.correct { background: var(--success); color: white; border-color: var(--success); }
    .jump-btn.incorrect { background: var(--danger); color: white; border-color: var(--danger); }

    .history-empty { color: var(--muted); margin: 0; }
    .history-exam {
      border-top: 1px solid var(--line);
      padding: 14px 0;
    }
    .history-exam:first-child { border-top: 0; padding-top: 0; }
    .history-summary {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }
    .history-dots { display: flex; flex-wrap: wrap; gap: 5px; }
    .history-dot {
      width: 26px; height: 26px; border-radius: 7px;
      display: grid; place-items: center;
      font-size: .76rem; color: white;
      background: var(--danger);
    }
    .history-dot.correct { background: var(--success); }

    .status-line {
      color: var(--muted);
      font-size: .92rem;
      margin-top: 10px;
    }

    .footer-note {
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
      margin-top: 22px;
    }

    @media (max-width: 640px) {
      .page-shell { width: min(100% - 16px, 1040px); margin-top: 8px; }
      .hero { border-radius: 12px; padding: 19px 17px; }
      .card-body { padding: 14px; }
      .card-header { padding: 12px 14px; }
      .controls { align-items: stretch; }
      .control-group { width: 100%; }
      .control-group button { flex: 1; }
    }
  </style>
</head>
<body>
  <scrum-exam-app></scrum-exam-app>

  <script>
    const QUESTION_BANK = [{"originalQuery":"Which AWS service gives users the ability to store, share, and deploy container images?","originalOptions":[{"text":"Amazon Elastic Container Registry (Amazon ECR)","correct":true},{"text":"Amazon Elastic Kubernetes Service (Amazon EKS)","correct":false},{"text":"Amazon Elastic Container Service (Amazon ECS)","correct":false},{"text":"AWS Fargate","correct":false}],"source":"exam","query":"Which AWS service can Scrumtuous use to store, share, and deploy container images for its applications?","options":[{"text":"Amazon Elastic Kubernetes Service","explanation":"This service provides a managed Kubernetes environment for running containerized workloads on AWS","correct":false,"selected":false},{"text":"Amazon Elastic Container Service","explanation":"This service provides orchestration for running and managing containers on AWS","correct":false,"selected":false},{"text":"AWS Fargate","explanation":"This service provides a serverless compute option for running containers without managing servers","correct":false,"selected":false},{"text":"Amazon Elastic Container Registry","explanation":"This service provides a managed registry that integrates with AWS container workflows","correct":true,"selected":false}],"answerCode":"4","type":"multiple-choice","geminiFlashAnswerCode":"4","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAmazon Elastic Container Registry\u003c/b\u003e because it is the AWS managed container image registry that lets teams store, share, and deploy container images for their applications.\u003c/p\u003e\u003cp\u003eThis registry provides private and public repositories for Docker and Open Container Initiative compliant images, and it integrates directly with AWS Identity and Access Management for fine grained access control. Teams can push and pull images using the AWS CLI or Docker CLI, use lifecycle policies to clean up old tags, enable vulnerability scanning to improve security posture, and take advantage of encryption at rest and in transit. It works seamlessly with container runtimes on AWS so your services can pull images efficiently during deployments.\u003c/p\u003e\u003cp\u003eThe option \u003ci\u003eAmazon Elastic Kubernetes Service\u003c/i\u003e is a managed Kubernetes control plane that is used to run and orchestrate containers. It does not function as an image registry, and it instead pulls container images from a separate repository service such as \u003cb\u003eAmazon Elastic Container Registry\u003c/b\u003e.\u003c/p\u003e\u003cp\u003eThe option \u003ci\u003eAmazon Elastic Container Service\u003c/i\u003e is a fully managed container orchestration service that schedules and runs containers on AWS. It requires a registry to store images and it retrieves those images at runtime rather than hosting them itself.\u003c/p\u003e\u003cp\u003eThe option \u003ci\u003eAWS Fargate\u003c/i\u003e is a serverless compute engine for containers that removes the need to manage servers. It runs tasks or pods for your workloads but it is not a place to store or share container images and it pulls images from a registry when starting containers.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question emphasizes \u003ci\u003estore\u003c/i\u003e, \u003ci\u003eshare\u003c/i\u003e, or \u003ci\u003edeploy images\u003c/i\u003e, think of the image registry service. Choose Amazon Elastic Container Registry for image storage and choose ECS, EKS, or Fargate when the task is to run containers.\u003c/p\u003e","references":[{"description":"What is Amazon Elastic Container Registry","url":"https://docs.aws.amazon.com/AmazonECR/latest/userguide/what-is-ecr.html"},{"description":"What is Amazon Elastic Kubernetes Service","url":"https://docs.aws.amazon.com/eks/latest/userguide/what-is-eks.html"},{"description":"Amazon Elastic Container Service Developer Guide","url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html"},{"description":"What is AWS Fargate","url":"https://docs.aws.amazon.com/AmazonECS/latest/userguide/what-is-fargate.html"}]},{"originalQuery":"Which AWS service or feature is used to troubleshoot network connectivity issues between Amazon EC2 instances?","originalOptions":[{"text":"AWS Certificate Manager (ASM)","correct":false},{"text":"Internet gateway","correct":false},{"text":"VPC Flow Logs","correct":true},{"text":"AWS CloudHSM","correct":false}],"source":"exam","query":"A cloud team at Golden Jacket Manufacturing needs to investigate communication problems between two Amazon EC2 instances in the same AWS environment. Which AWS service or feature can help the team analyze the network traffic for troubleshooting?","options":[{"text":"AWS CloudHSM","explanation":"AWS CloudHSM provides managed hardware security modules for generating and using cryptographic keys in AWS.","correct":false,"selected":false},{"text":"AWS Certificate Manager","explanation":"AWS Certificate Manager provides a way to request, manage, and deploy public and private SSL and TLS certificates for AWS resources.","correct":false,"selected":false},{"text":"VPC Flow Logs","explanation":"VPC Flow Logs capture information about IP traffic going to and from network interfaces in a VPC.","correct":true,"selected":false},{"text":"Internet gateway","explanation":"An internet gateway is a VPC component that supports communication between resources in a VPC and the internet.","correct":false,"selected":false}],"answerCode":"3","type":"multiple-choice","geminiFlashAnswerCode":"3","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct option is \u003cb\u003eVPC Flow Logs\u003c/b\u003e.\u003c/p\u003e\u003cp\u003e\u003cb\u003eVPC Flow Logs\u003c/b\u003e capture IP traffic metadata for network interfaces, subnets, and VPCs, which enables the team to analyze connectivity between the two Amazon EC2 instances. The logs include source and destination IP addresses, ports, protocol, packet and byte counts, and the action that indicates whether the traffic was accepted or rejected. The team can publish these logs to Amazon CloudWatch Logs or Amazon S3 and filter by the instances’ private IP addresses to see whether security groups or network ACLs are allowing or denying the traffic. This helps pinpoint rule or routing issues without deploying agents. Flow Logs do not capture packet payloads, yet they are ideal for high level troubleshooting of connectivity and reachability in a VPC.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Certificate Manager\u003c/i\u003e is for provisioning and managing public and private SSL/TLS certificates for use with services such as Elastic Load Balancing, Amazon CloudFront, and Amazon API Gateway. It does not capture or analyze VPC network flows or help trace traffic between EC2 instances.\u003c/p\u003e\u003cp\u003e\u003ci\u003eInternet gateway\u003c/i\u003e is a VPC networking component that enables communication between a VPC and the internet. It is not a diagnostic or logging tool, and communication between two EC2 instances in the same environment often does not require internet access. It provides no traffic analysis capability.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS CloudHSM\u003c/i\u003e is a managed hardware security module service that provides dedicated HSM appliances for cryptographic key storage and operations. It is unrelated to network traffic analysis or troubleshooting between EC2 instances.\u003c/p\u003e","tip":"\u003cp\u003eWhen you need to see whether traffic was allowed or denied and want metadata such as source, destination, ports, and action, choose \u003ci\u003eVPC Flow Logs\u003c/i\u003e. If a question asks for packet capture and deep inspection, think of \u003ci\u003eVPC Traffic Mirroring\u003c/i\u003e.\u003c/p\u003e","references":[{"description":"Amazon VPC Flow Logs overview","url":"https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs.html"},{"description":"Flow log record fields and examples","url":"https://docs.aws.amazon.com/vpc/latest/userguide/flow-logs-records.html"},{"description":"Internet gateway for VPC","url":"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Internet_Gateway.html"},{"description":"AWS Certificate Manager overview","url":"https://docs.aws.amazon.com/acm/latest/userguide/acm-overview.html"},{"description":"AWS CloudHSM introduction","url":"https://docs.aws.amazon.com/cloudhsm/latest/userguide/introduction.html"}]},{"originalQuery":"What is a benefit of using AWS serverless computing?","originalOptions":[{"text":"Application depiqyment and management are not required.","correct":false},{"text":"Application security will be fully managed by AWS.","correct":false},{"text":"Monitoring and logging are not needed.","correct":false},{"text":"Management of infrastructure is offloaded to AWS.","correct":true}],"source":"exam","query":"Which advantage can a company gain by using serverless computing on AWS?","options":[{"text":"Infrastructure management is shifted to AWS","explanation":"Serverless computing allows customers to focus more on application logic because AWS operates the underlying servers and related infrastructure.","correct":true,"selected":false},{"text":"Application deployment and application management are no longer required","explanation":"Serverless services can simplify deployment workflows, but applications still need to be released, configured, and managed by the customer.","correct":false,"selected":false},{"text":"Application security is fully handled by AWS","explanation":"AWS manages security for the underlying service infrastructure while customers remain responsible for securing their application code, data, and access settings.","correct":false,"selected":false},{"text":"Monitoring and logging are unnecessary","explanation":"Serverless applications still benefit from observability tools that capture performance data, operational events, and troubleshooting information.","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Cloud Concepts","answer":"\u003cp\u003eThe correct answer is \u003cb\u003eInfrastructure management is shifted to AWS\u003c/b\u003e.\u003c/p\u003e\u003cp\u003eServerless computing on AWS such as AWS Lambda means AWS handles provisioning, scaling, patching, and high availability of the underlying infrastructure. This reduces undifferentiated heavy lifting so teams can focus on writing code and delivering features. You still control your code, runtime configuration, and permissions, while AWS operates the servers and capacity behind the service.\u003c/p\u003e\u003cp\u003e\u003ci\u003eApplication deployment and application management are no longer required\u003c/i\u003e is incorrect because you still package and deploy your code and you manage versions, configuration, and integrations. You can automate these tasks with services such as AWS CodePipeline and AWS CodeDeploy, but they remain your responsibility.\u003c/p\u003e\u003cp\u003e\u003ci\u003eApplication security is fully handled by AWS\u003c/i\u003e is incorrect because security follows the shared responsibility model. AWS secures the cloud infrastructure while you must secure your code, data, IAM roles and policies, encryption choices, and network access.\u003c/p\u003e\u003cp\u003e\u003ci\u003eMonitoring and logging are unnecessary\u003c/i\u003e is incorrect because you still need observability to operate reliably. You use services such as Amazon CloudWatch Logs, metrics, and tracing to monitor performance, errors, and cost, and to troubleshoot issues.\u003c/p\u003e","tip":"\u003cp\u003eWhen you see a question about \u003ci\u003eserverless\u003c/i\u003e, look for answers that emphasize that AWS runs and scales the infrastructure while you still own code, deployment, monitoring, and security configuration. Tie your reasoning back to the \u003ci\u003eshared responsibility model\u003c/i\u003e.\u003c/p\u003e","references":[{"description":"AWS Lambda Developer Guide","url":"https://docs.aws.amazon.com/lambda/latest/dg/welcome.html"}]},{"originalQuery":"What is the LEAST expensive AWS Support plan that includes infrastructure event management without additional cost?","originalOptions":[{"text":"AWS Business Support","correct":false},{"text":"AWS Enterprise Support","correct":true},{"text":"AWS Developer Support","correct":false},{"text":"AWS Basic Support","correct":false}],"source":"exam","query":"Which AWS Support plan is the least costly choice that provides infrastructure event management without a separate fee?","options":[{"text":"AWS Basic Support","explanation":"This plan is included for AWS customers and provides account support resources and access to documentation.","correct":false,"selected":false},{"text":"AWS Developer Support","explanation":"This plan is intended for customers who are experimenting with AWS or building early stage applications.","correct":false,"selected":false},{"text":"AWS Enterprise Support","explanation":"This plan is intended for organizations that need the most comprehensive support experience for large scale and critical AWS environments.","correct":true,"selected":false},{"text":"AWS Business Support","explanation":"This plan is designed for production workloads and provides access to AWS Support engineers with faster response times than entry level plans.","correct":false,"selected":false}],"answerCode":"3","type":"multiple-choice","geminiFlashAnswerCode":"3","domain":"Billing, Pricing, and Support","answer":"\u003cp\u003eThe correct answer is \u003cb\u003eAWS Enterprise Support\u003c/b\u003e because it is the least costly plan among the options that includes Infrastructure Event Management without a separate fee.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS Enterprise Support\u003c/b\u003e includes Infrastructure Event Management at no additional charge. This provides proactive planning and guidance for significant launches and migrations, which is exactly what the question asks for. Other plans either do not include this feature or require you to pay extra for it, so they do not meet the requirement of no separate fee.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Business Support\u003c/i\u003e does not include Infrastructure Event Management at no charge. Customers on this plan can purchase IEM as a separate paid engagement, which means it does not satisfy the requirement for a plan that includes it without a separate fee.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Developer Support\u003c/i\u003e focuses on best practice and architectural guidance for development use cases and does not provide Infrastructure Event Management, so it does not meet the requirement.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Basic Support\u003c/i\u003e offers access to documentation, forums, and customer service but does not include Infrastructure Event Management, so it is not a correct choice.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question asks for Infrastructure Event Management with \u003ci\u003eno additional charge\u003c/i\u003e, choose Enterprise Support. If the plan mentions IEM as a paid engagement, then it is not correct for this type of question.\u003c/p\u003e","references":[]},{"originalQuery":"Acompany needs to deploy and scale containerized applications.\nWhich AWS service or resource will meet these requirements?","originalOptions":[{"text":"Amazon Aurora","correct":false},{"text":"Amazon Elastic Container Registry (Amazon ECR)","correct":false},{"text":"Amazon Elastic Container Service (Amazon ECS)","correct":true},{"text":"Amazon Polly","correct":false}],"source":"exam","query":"Scrumtuous Retail wants to run its application in containers and have AWS manage scaling as demand changes. Which AWS service or resource should Scrumtuous Retail use?","options":[{"text":"Amazon Aurora","explanation":"Amazon Aurora is a relational database service that is compatible with MySQL and PostgreSQL workloads.","correct":false,"selected":false},{"text":"Amazon Elastic Container Registry","explanation":"Amazon Elastic Container Registry stores and manages container images for deployment workflows.","correct":false,"selected":false},{"text":"Amazon Elastic Container Service","explanation":"Amazon Elastic Container Service supports running and managing containerized application workloads on AWS.","correct":true,"selected":false},{"text":"Amazon Polly","explanation":"Amazon Polly converts text into lifelike speech for applications that need voice output.","correct":false,"selected":false}],"answerCode":"3","type":"multiple-choice","geminiFlashAnswerCode":"3","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAmazon Elastic Container Service\u003c/b\u003e because it runs containerized applications on AWS and automatically scales services as demand changes.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAmazon Elastic Container Service\u003c/b\u003e is a fully managed container orchestration service that lets you deploy containers on AWS Fargate or Amazon EC2 and use Service Auto Scaling to adjust the number of tasks based on target tracking or step scaling policies driven by Amazon CloudWatch metrics. This gives you managed scaling for your containerized workloads without having to operate your own control plane.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Aurora\u003c/i\u003e is a relational database engine compatible with MySQL and PostgreSQL and it does not orchestrate containers or manage container service scaling.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Elastic Container Registry\u003c/i\u003e is a managed container image registry that stores and manages your Docker images and it does not run or scale containers. It is commonly used together with \u003cb\u003eAmazon Elastic Container Service\u003c/b\u003e or Amazon EKS to pull images at deployment time.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Polly\u003c/i\u003e converts text to lifelike speech and it is unrelated to running or scaling containers.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question says run containers and AWS manages the scaling, map it to a managed container orchestration service. Think \u003ci\u003eAmazon Elastic Container Service\u003c/i\u003e with Service Auto Scaling or AWS Fargate for serverless compute, and do not confuse it with \u003ci\u003eAmazon Elastic Container Registry\u003c/i\u003e which only stores images.\u003c/p\u003e","references":[{"description":"Amazon ECS Service Auto Scaling","url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/service-auto-scaling.html"}]},{"originalQuery":"A company is migrating its applications from on-premises to the AWS Cloud. The company wants to ensure that the applications are assigned only the minimum permissions that are needed to perform all operations. Which AWS service will meet these requirements?","originalOptions":[{"text":"AWS Identity and Access Management (IAM)","correct":true},{"text":"Amazon CloudWatch","correct":false},{"text":"Amazon Macie","correct":false},{"text":"Amazon GuardDuty","correct":false}],"source":"exam","query":"Scrumtuous Publishing is moving several internal applications from its data center to the AWS Cloud. The security team wants each application to receive only the permissions required to complete its intended tasks. Which AWS service should the company use to manage this requirement?","options":[{"text":"Amazon Macie","explanation":"This service helps discover and classify sensitive data stored in Amazon S3.","correct":false,"selected":false},{"text":"Amazon CloudWatch","explanation":"This service collects monitoring data, metrics, logs, and alarms for AWS resources and applications.","correct":false,"selected":false},{"text":"Amazon GuardDuty","explanation":"This service analyzes account activity and network events to identify potential threats in AWS environments.","correct":false,"selected":false},{"text":"AWS Identity and Access Management","explanation":"This service is used to create and manage access controls for AWS users, groups, roles, and permissions.","correct":true,"selected":false}],"answerCode":"4","type":"multiple-choice","geminiFlashAnswerCode":"4","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAWS Identity and Access Management\u003c/b\u003e because it is the service that lets you define and enforce least privilege so each application receives only the permissions required to perform its tasks.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS Identity and Access Management\u003c/b\u003e enables you to create policies that specify allowed actions on specific resources and to attach those policies to roles that applications assume. This lets you scope access precisely to the AWS services, API actions, and resources an application needs and nothing more. You can also use permission boundaries and resource based policies to add further controls. This is the core of the least privilege model that the question describes.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon CloudWatch\u003c/i\u003e is a monitoring and observability service that collects metrics, logs, and events and can trigger alarms. It does not manage or grant permissions for applications.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Macie\u003c/i\u003e is a data security and privacy service that discovers and protects sensitive data in Amazon S3 using machine learning. It does not control access permissions for applications.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon GuardDuty\u003c/i\u003e is a threat detection service that continuously monitors AWS accounts and workloads for malicious activity and anomalies. It does not provide mechanisms to assign or enforce application permissions.\u003c/p\u003e","tip":"\u003cp\u003eWhen you see requirements about \u003ci\u003eleast privilege\u003c/i\u003e and granting only the permissions an application needs, map that to \u003ci\u003eidentity and access management\u003c/i\u003e with policies and roles. Monitoring and threat detection services provide visibility and alerts, not permission control.\u003c/p\u003e","references":[{"description":"What is IAM","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html"},{"description":"Security best practices in IAM","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/best-practices.html"},{"description":"What is Amazon CloudWatch","url":"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/WhatIsCloudWatch.html"},{"description":"What is Amazon Macie","url":"https://docs.aws.amazon.com/macie/latest/user/what-is-macie.html"},{"description":"What is Amazon GuardDuty","url":"https://docs.aws.amazon.com/guardduty/latest/ug/what-is-guardduty.html"}]},{"originalQuery":"Acompany needs to set up a petabyte-scale data warehouse in the AWS Cloud.\nWhich AWS service will meet this requirement?","originalOptions":[{"text":"Amazon DynamoDB","correct":false},{"text":"Amazon RDS","correct":false},{"text":"Amazon Redshift","correct":true},{"text":"Amazon ElastiCache","correct":false}],"source":"exam","query":"Scrumtuous Retailer wants to deploy a large scale data warehouse in the AWS Cloud for enterprise analytics and reporting. Which AWS service should the company use for this need?","options":[{"text":"Amazon Redshift","explanation":"Amazon Redshift is an AWS analytics service used to store and query large volumes of structured and semi structured data.","correct":true,"selected":false},{"text":"Amazon ElastiCache","explanation":"Amazon ElastiCache is a managed in memory caching service that supports Redis OSS and Memcached compatible workloads.","correct":false,"selected":false},{"text":"Amazon DynamoDB","explanation":"Amazon DynamoDB is a fully managed NoSQL database service that stores key value and document data for applications at scale.","correct":false,"selected":false},{"text":"Amazon RDS","explanation":"Amazon RDS is a managed relational database service that supports several common database engines for transactional workloads.","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAmazon Redshift\u003c/b\u003e for deploying a large scale data warehouse in the AWS Cloud.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAmazon Redshift\u003c/b\u003e is a fully managed data warehouse service that is built for petabyte scale analytics. It uses columnar storage and massively parallel processing to run complex SQL queries quickly across large datasets. It integrates with data in Amazon S3 and common business intelligence tools, which makes it ideal for enterprise analytics and reporting where performance and scalability are essential.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon DynamoDB\u003c/i\u003e is a managed NoSQL database for key value and document data that is optimized for high throughput transactional workloads. It is not designed for complex analytical queries across large datasets like a data warehouse.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon RDS\u003c/i\u003e is a managed relational database service that is best for transactional or operational databases. While it supports SQL engines, it is not optimized for large scale analytical workloads that benefit from columnar storage and massively parallel processing.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon ElastiCache\u003c/i\u003e provides in memory caching to accelerate application performance. It is not a storage or analytics platform and it does not serve as a data warehouse for large scale reporting.\u003c/p\u003e","tip":"\u003cp\u003eMatch the workload pattern to the service. Choose \u003ci\u003eAmazon Redshift\u003c/i\u003e when you see needs for a cloud data warehouse, large scale analytics, and complex SQL over big datasets. Choose transactional databases like \u003ci\u003eAmazon RDS\u003c/i\u003e or \u003ci\u003eAmazon DynamoDB\u003c/i\u003e for OLTP use cases, and pick \u003ci\u003eAmazon ElastiCache\u003c/i\u003e when the need is low latency caching.\u003c/p\u003e","references":[{"description":"What is Amazon Redshift","url":"https://docs.aws.amazon.com/redshift/latest/mgmt/welcome.html"}]},{"originalQuery":"Acompany wants its workload to perform consistently and correctly.\nWhich benefit of AWS Clouq computing does this goal represent?","originalOptions":[{"text":"Security","correct":false},{"text":"Elasticity","correct":false},{"text":"Pay-as-you-go pricing","correct":false},{"text":"Reliability","correct":true}],"source":"exam","query":"Scrumtuous Retail wants an application workload on AWS to operate in a dependable manner and produce accurate results over time. Which benefit of AWS Cloud computing does this objective represent?","options":[{"text":"Security","explanation":"Security focuses on protecting systems, data, identities, and access within an AWS environment.","correct":false,"selected":false},{"text":"Elasticity","explanation":"Elasticity refers to adjusting cloud resources as demand changes so capacity can expand or contract.","correct":false,"selected":false},{"text":"Reliability","explanation":"Reliability describes the ability of a workload to function as intended and recover from disruptions.","correct":true,"selected":false},{"text":"Pay as you go pricing","explanation":"Pay as you go pricing lets customers pay for the cloud resources they use instead of making large upfront commitments.","correct":false,"selected":false}],"answerCode":"3","type":"multiple-choice","geminiFlashAnswerCode":"3","domain":"Cloud Concepts","answer":"\u003cp\u003eThe correct answer is \u003cb\u003eReliability\u003c/b\u003e. This benefit describes a system that operates dependably and returns correct results consistently over time, which matches the requirement in the scenario.\u003c/p\u003e\u003cp\u003eThis benefit focuses on design principles that build fault tolerance, automatic recovery, and consistent operations. On AWS you achieve this with multiple Availability Zones, health checks, self healing and automation with services like Elastic Load Balancing, Amazon EC2 Auto Scaling, Amazon Route 53 health checks, and managed database services that support Multi-AZ deployments. These practices help the workload remain dependable and continue to return accurate results as conditions change over time.\u003c/p\u003e\u003cp\u003e\u003ci\u003eSecurity\u003c/i\u003e is primarily about protecting data and systems through identity and access management, encryption, and monitoring. While good security contributes to overall system health, it does not directly define whether a workload produces correct results consistently over time.\u003c/p\u003e\u003cp\u003e\u003ci\u003eElasticity\u003c/i\u003e describes the ability to automatically match resources to demand by scaling up or down. Although elasticity can improve performance and cost efficiency during variable load, it is not the core benefit that ensures dependable operation and consistent correctness over time.\u003c/p\u003e\u003cp\u003e\u003ci\u003ePay as you go pricing\u003c/i\u003e is a cost model that lets you pay only for the resources you use. Pricing flexibility does not determine whether the workload remains dependable or produces accurate results over time.\u003c/p\u003e","tip":"\u003cp\u003eMatch scenario keywords to the named AWS benefit. Words like \u003ci\u003edependable\u003c/i\u003e, \u003ci\u003econsistent\u003c/i\u003e, and \u003ci\u003eaccurate results over time\u003c/i\u003e point to the reliability benefit rather than security, elasticity, or pricing.\u003c/p\u003e","references":[{"description":"Reliability Pillar - AWS Well-Architected Framework","url":"https://docs.aws.amazon.com/wellarchitected/latest/reliability-pillar/welcome.html"}]},{"originalQuery":"Acompany runs an application behind an Application Load Balancer. The company wants to filter web traffic for the application. Which AWS service will meet this requirement?","originalOptions":[{"text":"AWS Fargate","correct":false},{"text":"AWS WAF","correct":true},{"text":"AWS X-Ray","correct":false},{"text":"Amazon Inspector","correct":false}],"source":"exam","query":"Scrumtuous Publishing hosts a web application behind an Application Load Balancer. The company needs an AWS service that can inspect and filter incoming web requests for the application. Which AWS service should the company use?","options":[{"text":"AWS WAF","explanation":"AWS WAF is a web application firewall service that supports rules for controlling HTTP and HTTPS requests.","correct":true,"selected":false},{"text":"Amazon Inspector","explanation":"Amazon Inspector is a vulnerability management service that scans supported workloads for software vulnerabilities and network exposure.","correct":false,"selected":false},{"text":"AWS Fargate","explanation":"AWS Fargate is a serverless compute engine for running containers without managing the underlying servers.","correct":false,"selected":false},{"text":"AWS X-Ray","explanation":"AWS X-Ray helps developers analyze and trace requests as they travel through distributed applications.","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAWS WAF\u003c/b\u003e because it is designed to inspect and filter incoming web requests and it integrates directly with an Application Load Balancer to protect the application.\u003c/p\u003e\u003cp\u003eWith \u003cb\u003eAWS WAF\u003c/b\u003e you attach a web ACL to the Application Load Balancer so each HTTP and HTTPS request is evaluated before it reaches your targets. You can allow, block, or count requests based on rules that match patterns such as IP addresses, URI paths, headers, query strings, or size constraints. \u003cb\u003eAWS WAF\u003c/b\u003e also offers managed rule groups for common threats like the OWASP Top 10 and supports rate-based rules to mitigate bots and simple denial of service patterns, which makes it the right fit for request inspection and filtering.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Fargate\u003c/i\u003e is a serverless compute engine for containers on Amazon ECS and Amazon EKS. It runs tasks and pods without managing servers and it does not provide web request inspection or filtering capabilities.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS X-Ray\u003c/i\u003e is used for distributed tracing and application performance analysis. It helps you visualize service maps and troubleshoot latency and errors, but it does not filter or block incoming web traffic.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Inspector\u003c/i\u003e is an automated vulnerability management service that scans resources such as EC2 instances, container images in Amazon ECR, and Lambda functions. It does not inspect live web requests behind a load balancer.\u003c/p\u003e","tip":"\u003cp\u003eMap the need to \u003ci\u003einspect\u003c/i\u003e and \u003ci\u003efilter\u003c/i\u003e web requests for an Application Load Balancer to \u003ci\u003eAWS WAF\u003c/i\u003e. Differentiate it from services that run containers, trace requests, or scan for vulnerabilities so you quickly eliminate distractors.\u003c/p\u003e","references":[{"description":"What is AWS WAF","url":"https://docs.aws.amazon.com/waf/latest/developerguide/what-is-aws-waf.html"},{"description":"AWS WAF service integrations with Application Load Balancer","url":"https://docs.aws.amazon.com/waf/latest/developerguide/waf-service-integrations.html"},{"description":"What is AWS X-Ray","url":"https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html"},{"description":"What is AWS Fargate","url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/what-is-fargate.html"},{"description":"What is Amazon Inspector","url":"https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html"}]},{"originalQuery":"A company needs to create and manage a portfolio of IT workloads that the company approves for use on AWS. Which AWS service provides this functionality?","originalOptions":[{"text":"AWS Config","correct":false},{"text":"AWS Service Catalog","correct":true},{"text":"AWS Systems Manager","correct":false},{"text":"AWS CloudFormation","correct":false}],"source":"exam","query":"Scrumtuous Manufacturing wants to define and administer a curated collection of IT workloads that its teams are allowed to use on AWS. Which AWS service supports this requirement?","options":[{"text":"AWS Systems Manager","explanation":"AWS Systems Manager provides operational tools for managing AWS resources and application environments.","correct":false,"selected":false},{"text":"AWS Config","explanation":"AWS Config records AWS resource configurations and evaluates them against configuration rules.","correct":false,"selected":false},{"text":"AWS CloudFormation","explanation":"AWS CloudFormation provisions AWS infrastructure by using templates that describe resources.","correct":false,"selected":false},{"text":"AWS Service Catalog","explanation":"AWS Service Catalog helps organizations manage catalogs of approved AWS products for end users.","correct":true,"selected":false}],"answerCode":"4","type":"multiple-choice","geminiFlashAnswerCode":"4","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAWS Service Catalog\u003c/b\u003e. \u003cb\u003eAWS Service Catalog\u003c/b\u003e lets an organization define and manage a curated catalog of approved IT services and workloads that teams can discover and launch, which directly matches the requirement.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS Service Catalog\u003c/b\u003e enables administrators to create portfolios of products that represent approved applications, infrastructure patterns, and images. These products are typically backed by \u003ci\u003eAWS CloudFormation\u003c/i\u003e templates, and administrators can apply constraints, tagging standards, and role based access so teams get self service with governance. With \u003cb\u003eAWS Service Catalog\u003c/b\u003e you can standardize deployments, control costs, and enforce compliance while still allowing users to deploy what they need from a controlled catalog.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Config\u003c/i\u003e is incorrect because it focuses on recording, auditing, and evaluating resource configurations over time. It helps you track configuration changes and assess compliance, but it does not provide a curated catalog that users can browse and launch from.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Systems Manager\u003c/i\u003e is incorrect because it is an operations and management service that helps with tasks such as patching, automation, inventory, and parameter storage. It does not create or publish a portfolio of approved workloads for teams to choose and deploy.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS CloudFormation\u003c/i\u003e is incorrect because it provides infrastructure as code to model and provision resources. While \u003cb\u003eAWS Service Catalog\u003c/b\u003e products are commonly built on \u003ci\u003eAWS CloudFormation\u003c/i\u003e templates, \u003ci\u003eAWS CloudFormation\u003c/i\u003e alone does not offer a curated catalog, product portfolios, or governance features such as launch constraints and entitlement management that the requirement calls for.\u003c/p\u003e","tip":"\u003cp\u003eWhen you see a requirement for a preapproved catalog of deployable workloads with governance and access controls, choose \u003ci\u003eAWS Service Catalog\u003c/i\u003e. If the focus is configuration auditing choose \u003ci\u003eAWS Config\u003c/i\u003e, operations management choose \u003ci\u003eAWS Systems Manager\u003c/i\u003e, or infrastructure as code choose \u003ci\u003eAWS CloudFormation\u003c/i\u003e.\u003c/p\u003e","references":[{"description":"What is AWS Service Catalog","url":"https://docs.aws.amazon.com/servicecatalog/latest/adminguide/what-is_service-catalog.html"},{"description":"What is AWS Config","url":"https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html"},{"description":"What is AWS Systems Manager","url":"https://docs.aws.amazon.com/systems-manager/latest/userguide/what-is-systems-manager.html"},{"description":"AWS CloudFormation User Guide","url":"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.html"}]},{"originalQuery":"Acompany uses Amazon WorkSpaces.\nWhich task is the responsibility of AWS, according to the AWS shared responsibility model?","originalOptions":[{"text":"Set up multi-factor authentication (MFA) for each WorkSpaces user account.","correct":false},{"text":"Ensure the environmental safety and security of the AWS infrastructure that hosts WorkSpaces.","correct":true},{"text":"Provide security for WorkSpaces user accounts through AWS Identity and Access Management (IAM).","correct":false},{"text":"Configure AWS CloudTrail to log API calls and user activity.","correct":false}],"source":"exam","query":"Scrumtuous Consulting uses Amazon WorkSpaces for remote employees. Under the AWS shared responsibility model, which task does AWS manage?","options":[{"text":"Enable MFA for every Amazon WorkSpaces user account","explanation":"This task involves requiring an additional authentication step when users access their WorkSpaces accounts.","correct":false,"selected":false},{"text":"Secure Amazon WorkSpaces user accounts by using AWS Identity and Access Management","explanation":"This task involves creating permissions and access controls that govern how identities interact with AWS resources.","correct":false,"selected":false},{"text":"Configure AWS CloudTrail to record API calls and user activity","explanation":"This task involves enabling an AWS service that captures account activity and event history for auditing.","correct":false,"selected":false},{"text":"Maintain the environmental safety and physical security of the AWS infrastructure that hosts Amazon WorkSpaces","explanation":"This task concerns the facilities, hardware, and controls that support the AWS data centers where the service runs.","correct":true,"selected":false}],"answerCode":"4","type":"multiple-choice","geminiFlashAnswerCode":"4","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct option is \u003cb\u003eMaintain the environmental safety and physical security of the AWS infrastructure that hosts Amazon WorkSpaces\u003c/b\u003e. Under the shared responsibility model AWS protects the infrastructure that runs services like WorkSpaces, including the data centers, hardware, and global network.\u003c/p\u003e\u003cp\u003eAWS is responsible for security of the cloud. This includes the physical security of data centers, environmental controls, and the foundational infrastructure such as compute, storage, and networking. For a managed desktop service like WorkSpaces, AWS ensures the hosts and facilities are secure while customers secure their data, identities, and configurations within their accounts.\u003c/p\u003e\u003cp\u003e\u003ci\u003eEnable MFA for every Amazon WorkSpaces user account\u003c/i\u003e is a customer responsibility. Customers choose and configure multi factor authentication through AWS Directory Service integrations or their identity provider, and they enforce MFA based on their organizational requirements.\u003c/p\u003e\u003cp\u003e\u003ci\u003eSecure Amazon WorkSpaces user accounts by using AWS Identity and Access Management\u003c/i\u003e is not managed by AWS for the customer. Customers create and manage IAM users, roles, and policies to control access to AWS resources, and they also manage how end users authenticate to their WorkSpaces through their chosen directory service.\u003c/p\u003e\u003cp\u003e\u003ci\u003eConfigure AWS CloudTrail to record API calls and user activity\u003c/i\u003e is a customer task. AWS provides the CloudTrail service, but customers must configure trails, choose regions and event types, and set up destinations such as Amazon S3 to meet their logging and compliance needs.\u003c/p\u003e","tip":"\u003cp\u003eMap tasks to the shared responsibility model by asking who controls that layer. AWS owns \u003ci\u003esecurity of the cloud\u003c/i\u003e such as physical facilities and core infrastructure, while customers own \u003ci\u003esecurity in the cloud\u003c/i\u003e such as identity, MFA, logging, and service configuration.\u003c/p\u003e","references":[{"description":"AWS CloudTrail User Guide","url":"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html"},{"description":"IAM User Guide Introduction","url":"https://docs.aws.amazon.com/IAM/latest/UserGuide/introduction.html"}]},{"originalQuery":"Acompany wants to reduce the cost of its Amazon EC2 instances. The applications that run on the instances cannot tolerate interruptions. The instances must remain in\noperation for at least 1 year.\nWhich purchasing options should the company use to meet these requirements? (Select TWO.)","originalOptions":[{"text":"Reserved Instances","correct":true},{"text":"Spot Instances","correct":false},{"text":"AWS Marketplace subscriptions","correct":false},{"text":"Savings Plans","correct":true},{"text":"Dedicated Hosts","correct":false}],"source":"exam","query":"Scrumtuous Retail wants to lower the cost of its Amazon EC2 usage for applications that must keep running without interruption. The company expects these instances to be in use continuously for at least one year. Which purchasing options can help the company meet these requirements?","options":[{"text":"Dedicated Hosts","explanation":"Dedicated Hosts provide physical servers with Amazon EC2 instance capacity that is dedicated to a single customer account.","correct":false,"selected":false},{"text":"Reserved Instances","explanation":"Reserved Instances provide discounted Amazon EC2 pricing in exchange for a commitment to a specific term and configuration attributes.","correct":true,"selected":false},{"text":"Savings Plans","explanation":"Savings Plans offer reduced pricing for eligible compute usage when a customer commits to a consistent amount of usage for a term.","correct":true,"selected":false},{"text":"Spot Instances","explanation":"Spot Instances use spare Amazon EC2 capacity and pricing that can vary based on supply and demand.","correct":false,"selected":false},{"text":"AWS Marketplace subscriptions","explanation":"AWS Marketplace subscriptions allow customers to procure software, data products, and related services from third party sellers.","correct":false,"selected":false}],"answerCode":"2,3","type":"multi-select","geminiFlashAnswerCode":"2,3","domain":"Billing, Pricing, and Support","answer":"\u003cp\u003eThe correct options are \u003cb\u003eReserved Instances\u003c/b\u003e and \u003cb\u003eSavings Plans\u003c/b\u003e because both are designed to reduce the cost of predictable, steady usage when applications must run continuously for at least one year.\u003c/p\u003e\u003cp\u003e\u003cb\u003eReserved Instances\u003c/b\u003e provide significant discounts compared to On-Demand pricing when you commit to a one year or three year term. They are a strong fit for steady state workloads that must remain available without interruption. Zonal \u003cb\u003eReserved Instances\u003c/b\u003e can also provide capacity reservation in a specific Availability Zone, while Regional \u003cb\u003eReserved Instances\u003c/b\u003e provide a billing discount across the Region. Standard and Convertible options let you balance maximum discount with flexibility to change attributes within the term.\u003c/p\u003e\u003cp\u003e\u003cb\u003eSavings Plans\u003c/b\u003e reduce costs by committing to a consistent amount of compute usage measured in dollars per hour over a one year or three year term. They automatically apply to eligible usage and provide more flexibility than \u003cb\u003eReserved Instances\u003c/b\u003e because they can cover different instance families, sizes, and even other compute services depending on the plan type. This makes \u003cb\u003eSavings Plans\u003c/b\u003e an excellent choice for always-on workloads where you want discounts without locking into specific instance attributes.\u003c/p\u003e\u003cp\u003e\u003ci\u003eSpot Instances\u003c/i\u003e are not appropriate because they can be interrupted by Amazon EC2 whenever capacity is needed which makes them unsuitable for applications that must keep running without interruption.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Marketplace subscriptions\u003c/i\u003e refer to purchasing third-party software and data products and they do not serve as a purchasing model to systematically lower the underlying EC2 compute cost for continuous usage.\u003c/p\u003e\u003cp\u003e\u003ci\u003eDedicated Hosts\u003c/i\u003e allocate physical servers for your exclusive use for compliance or licensing needs. They are typically more expensive and are not a cost optimization mechanism for always-on workloads that simply need lower compute prices.\u003c/p\u003e","tip":"\u003cp\u003eWhen a workload is \u003ci\u003esteady\u003c/i\u003e and must run without interruption for a year or more, think about committing to usage with \u003ci\u003eReserved Instances\u003c/i\u003e or \u003ci\u003eSavings Plans\u003c/i\u003e. If a workload can be interrupted, then consider \u003ci\u003eSpot Instances\u003c/i\u003e for maximum savings.\u003c/p\u003e","references":[{"description":"Amazon EC2 Reserved Instances","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/reserved-instances-overview.html"},{"description":"AWS Savings Plans","url":"https://docs.aws.amazon.com/savingsplans/latest/userguide/what-is-savings-plans.html"},{"description":"Amazon EC2 Spot Instances","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/using-spot-instances.html"},{"description":"Amazon EC2 Dedicated Hosts","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/dedicated-hosts-overview.html"},{"description":"What is AWS Marketplace","url":"https://docs.aws.amazon.com/marketplace/latest/buyerguide/what-is-marketplace.html"}]},{"originalQuery":"Acompany wants to automate infrastructure deployment by using infrastructure as code (laC). The company wants to scale production stacks so the stacks can be\ndeployed in multiple AWS Regions.\nWhich AWS service will meet these rd yuirements?","originalOptions":[{"text":"Amazon CloudWatch","correct":false},{"text":"AWS Config","correct":false},{"text":"AWS Trusted Advisor","correct":false},{"text":"AWS CloudFormation","correct":true}],"source":"exam","query":"Scrumtuous Manufacturing plans to use infrastructure as code to standardize its application environments. The company needs a service that can help deploy repeatable production stacks across several AWS Regions. Which AWS service should the company use?","options":[{"text":"AWS Config","explanation":"AWS Config records resource configurations and evaluates them against rules for compliance and change tracking.","correct":false,"selected":false},{"text":"Amazon CloudWatch","explanation":"Amazon CloudWatch collects metrics, logs, and events from AWS resources and applications for monitoring and operational visibility.","correct":false,"selected":false},{"text":"AWS Trusted Advisor","explanation":"AWS Trusted Advisor provides recommendations that can help review an AWS environment for cost, security, performance, fault tolerance, and service quota considerations.","correct":false,"selected":false},{"text":"AWS CloudFormation","explanation":"AWS CloudFormation uses templates to define and provision AWS resources as repeatable stacks.","correct":true,"selected":false}],"answerCode":"4","type":"multiple-choice","geminiFlashAnswerCode":"4","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAWS CloudFormation\u003c/b\u003e because it enables infrastructure as code and can deploy consistent, repeatable stacks across multiple AWS Regions.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS CloudFormation\u003c/b\u003e lets you define your infrastructure in templates so you can create and update stacks in a controlled and repeatable way. It supports multi account and multi Region deployments through StackSets, which allows you to roll out the same production stack to many Regions with consistent configuration and governance. This directly matches the requirement for standardized environments and repeatable production stacks across several Regions.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon CloudWatch\u003c/i\u003e is incorrect because it is primarily a monitoring and observability service for metrics, logs, and alarms. It does not provision infrastructure or deploy stacks as code across Regions.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Config\u003c/i\u003e is incorrect because it records configuration changes and evaluates compliance against rules. It can help detect configuration drift, yet it does not create or manage infrastructure stacks as code across Regions.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Trusted Advisor\u003c/i\u003e is incorrect because it provides best practice checks and recommendations for cost optimization, performance, security, fault tolerance, and service quotas. It does not deploy or manage infrastructure.\u003c/p\u003e","tip":"\u003cp\u003eWhen you see requirements for \u003ci\u003einfrastructure as code\u003c/i\u003e and \u003ci\u003erepeatable stacks\u003c/i\u003e across multiple Regions, map that to \u003ci\u003eCloudFormation\u003c/i\u003e and think of StackSets for multi Region rollout.\u003c/p\u003e","references":[{"description":"AWS CloudFormation - What is AWS CloudFormation","url":"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/Welcome.html"},{"description":"AWS CloudFormation StackSets - Concepts","url":"https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/stacksets-concepts.html"},{"description":"What is AWS Config","url":"https://docs.aws.amazon.com/config/latest/developerguide/WhatIsConfig.html"},{"description":"Getting started with AWS Trusted Advisor","url":"https://docs.aws.amazon.com/awssupport/latest/user/getting-started-with-aws-trusted-advisor.html"}]},{"originalQuery":"Which of the following is an advantage of cloud computing?","originalOptions":[{"text":"Trade variable expenses for capital expenses.","correct":false},{"text":"Benefit from economies of scale.","correct":true},{"text":"Increase focus on managing hardware infrastructure.","correct":false},{"text":"Over-provision resources to ensure capacity.","correct":false}],"source":"exam","query":"A company is evaluating whether to move several internal applications to AWS. Which benefit is commonly associated with cloud computing?","options":[{"text":"Provision more resources than needed to guarantee capacity","explanation":"This option describes allocating excess capacity in advance of actual demand","correct":false,"selected":false},{"text":"Spend more time managing physical hardware infrastructure","explanation":"This option refers to operational work related to maintaining servers and data center equipment","correct":false,"selected":false},{"text":"Exchange variable expenses for upfront capital expenses","explanation":"This option refers to changing the financial model used to pay for technology resources","correct":false,"selected":false},{"text":"Gain from economies of scale","explanation":"This option describes a pricing benefit that can come from large scale service operations","correct":true,"selected":false}],"answerCode":"4","type":"multiple-choice","geminiFlashAnswerCode":"4","domain":"Cloud Concepts","answer":"\u003cp\u003eThe correct option is \u003cb\u003eGain from economies of scale\u003c/b\u003e. This is a core cloud advantage because AWS operates at massive scale and passes cost efficiencies to customers.\u003c/p\u003e\u003cp\u003eThis benefit exists because AWS aggregates demand across many customers and uses large scale purchasing and highly efficient operations. As usage grows, customers often pay a lower price per unit through tiered pricing and sustained innovation, which reduces overall costs compared to running small, self-managed environments.\u003c/p\u003e\u003cp\u003e\u003ci\u003eExchange variable expenses for upfront capital expenses\u003c/i\u003e is incorrect because the cloud model does the opposite. With AWS you typically avoid large capital purchases and instead pay for what you use as an operating expense.\u003c/p\u003e\u003cp\u003e\u003ci\u003eSpend more time managing physical hardware infrastructure\u003c/i\u003e is incorrect because AWS reduces the need to procure, install, and maintain servers and facilities. This lets teams focus more on applications and business outcomes rather than undifferentiated infrastructure work.\u003c/p\u003e\u003cp\u003e\u003ci\u003eProvision more resources than needed to guarantee capacity\u003c/i\u003e is incorrect because AWS enables elasticity so you can provision the right amount of resources and scale on demand. This avoids expensive overprovisioning that is common in traditional data centers.\u003c/p\u003e","tip":"\u003cp\u003eLink each cloud advantage to a simple phrase. If an option reverses a known benefit such as \u003ci\u003etrade capital expense for variable expense\u003c/i\u003e or \u003ci\u003estop guessing capacity\u003c/i\u003e then eliminate it quickly.\u003c/p\u003e","references":[{"description":"AWS Whitepaper: How AWS Pricing Works","url":"https://docs.aws.amazon.com/whitepapers/latest/how-aws-pricing-works/welcome.html"}]},{"originalQuery":"Acompany needs to create a hierarchical grouping of accounts to meet budgetary, security, and compliance needs.\nWhich AWS service or tool will meet these requirements?","originalOptions":[{"text":"AWS Organizations le","correct":true},{"text":"AWS Cost Explorer","correct":false},{"text":"AWS Security Hub","correct":false},{"text":"AWS Systems Manager","correct":false}],"source":"exam","query":"Scrumtuous Manufacturing wants to arrange multiple AWS accounts into a hierarchy so teams can apply budgeting controls, security governance, and compliance requirements consistently. Which AWS service or tool should the company use?","options":[{"text":"AWS Security Hub","explanation":"AWS Security Hub centralizes security findings from supported AWS services and partner tools.","correct":false,"selected":false},{"text":"AWS Organizations","explanation":"AWS Organizations provides account management features for environments that use multiple AWS accounts.","correct":true,"selected":false},{"text":"AWS Systems Manager","explanation":"AWS Systems Manager provides operational tools for managing AWS resources and supported workloads.","correct":false,"selected":false},{"text":"AWS Cost Explorer","explanation":"AWS Cost Explorer helps users view, analyze, and forecast AWS costs and usage over time.","correct":false,"selected":false}],"answerCode":"2","type":"multiple-choice","geminiFlashAnswerCode":"2","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct answer is \u003cb\u003eAWS Organizations\u003c/b\u003e. \u003cb\u003eAWS Organizations\u003c/b\u003e lets you group multiple AWS accounts into a hierarchy so you can consistently apply budgeting controls, security governance, and compliance requirements across accounts.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS Organizations\u003c/b\u003e enables you to create organizational units to reflect your business structure and to attach service control policies that set permission guardrails across member accounts. It supports consolidated billing and integrates with services such as AWS Budgets and AWS Config so finance and security teams can apply controls and monitoring consistently. This is the foundational service for multi account governance and centralized management.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Cost Explorer\u003c/i\u003e is used to analyze and visualize costs and usage. It can help you understand spending trends and forecast costs, but it does not create an account hierarchy or enforce governance policies across accounts.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Security Hub\u003c/i\u003e centralizes and prioritizes security findings and can aggregate results across accounts when used with \u003cb\u003eAWS Organizations\u003c/b\u003e. However, it is not the tool that arranges accounts into a hierarchy or applies organization wide permission guardrails.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Systems Manager\u003c/i\u003e provides operational tooling for managing resources such as EC2 instances, patching, and parameters. It does not manage the structure of multiple AWS accounts or provide organization wide governance policies.\u003c/p\u003e","tip":"\u003cp\u003eLook for keywords like \u003ci\u003emultiple accounts\u003c/i\u003e, \u003ci\u003ehierarchy\u003c/i\u003e, \u003ci\u003eorganizational units\u003c/i\u003e, \u003ci\u003econsolidated billing\u003c/i\u003e, and \u003ci\u003eservice control policies\u003c/i\u003e. These point to \u003ci\u003eAWS Organizations\u003c/i\u003e as the multi account governance service.\u003c/p\u003e","references":[{"description":"What is AWS Organizations","url":"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_introduction.html"},{"description":"Service control policies in AWS Organizations","url":"https://docs.aws.amazon.com/organizations/latest/userguide/orgs_manage_policies_scps.html"},{"description":"What is AWS Security Hub","url":"https://docs.aws.amazon.com/securityhub/latest/userguide/what-is-securityhub.html"},{"description":"What is AWS Systems Manager","url":"https://docs.aws.amazon.com/systems-manager/latest/userguide/what-is-systems-manager.html"}]},{"originalQuery":"Which AWS service or feature can a company use to create a private, secured, and scalable network environment in the AWS Cloud?","originalOptions":[{"text":"Amazon Elastic Container Service (Amazon ECS)","correct":false},{"text":"Amazon S3","correct":false},{"text":"Amazon VPC","correct":true},{"text":"Route tables","correct":false}],"source":"exam","query":"Which AWS service or feature can Scrumtuous use to build an isolated, secure, and scalable networking environment in the AWS Cloud?","options":[{"text":"Route tables","explanation":"Route tables contain rules that direct network traffic from subnets or gateways.","correct":false,"selected":false},{"text":"Amazon VPC","explanation":"Amazon VPC lets customers define virtual networking resources within an AWS account.","correct":true,"selected":false},{"text":"Amazon Elastic Container Service","explanation":"Amazon Elastic Container Service runs and manages containerized applications on AWS.","correct":false,"selected":false},{"text":"Amazon S3","explanation":"Amazon S3 stores objects in buckets and provides access management for stored data.","correct":false,"selected":false}],"answerCode":"2","type":"multiple-choice","geminiFlashAnswerCode":"2","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct answer is \u003cb\u003eAmazon VPC\u003c/b\u003e. \u003cb\u003eAmazon VPC\u003c/b\u003e lets you create an isolated, secure, and scalable virtual network in the AWS Cloud that you fully control.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAmazon VPC\u003c/b\u003e is designed for network isolation because you define your own IP ranges and create subnets across multiple Availability Zones for high availability. You manage routing with route tables and control traffic with security groups and network ACLs. It is scalable because you can add more subnets, attach internet or NAT gateways, and use VPC endpoints to privately connect to AWS services as your environment grows.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Elastic Container Service\u003c/i\u003e is a container orchestration service that runs and scales containers. It uses networking provided by a VPC but it does not build the isolated network itself.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon S3\u003c/i\u003e is an object storage service for storing and retrieving data. It does not create or manage a virtual network environment.\u003c/p\u003e\u003cp\u003e\u003ci\u003eRoute tables\u003c/i\u003e control how traffic is directed within a VPC. They are a component of a VPC and do not by themselves provide a complete isolated and scalable networking environment.\u003c/p\u003e","tip":"\u003cp\u003eWhen you see keywords like \u003ci\u003eisolated network\u003c/i\u003e, \u003ci\u003econtrol over IP addressing\u003c/i\u003e, and \u003ci\u003escalable connectivity\u003c/i\u003e, map them to \u003ci\u003eAmazon VPC\u003c/i\u003e rather than to compute, storage, or a single networking component.\u003c/p\u003e","references":[{"description":"What is Amazon VPC","url":"https://docs.aws.amazon.com/vpc/latest/userguide/what-is-amazon-vpc.html"},{"description":"VPC Route Tables","url":"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Route_Tables.html"},{"description":"Amazon ECS Developer Guide","url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/Welcome.html"},{"description":"Amazon S3 User Guide","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html"}]},{"originalQuery":"Which AWS service offers a scalable, high-performance file system for applications that require SMB protocol support?","originalOptions":[{"text":"Amazon $3","correct":false},{"text":"Amazon Elastic File System (Amazon EFS)","correct":false},{"text":"Amazon FSx for Windows File Server","correct":true},{"text":"AWS Snowball Edge","correct":false}],"source":"exam","query":"Scrumtuous Publishing is selecting an AWS storage service for Windows based applications that need a scalable and high performance shared file system with SMB protocol compatibility. Which AWS service should the company use?","options":[{"text":"Amazon Elastic File System","explanation":"This service provides a managed elastic file system that can be mounted by multiple compute resources.","correct":false,"selected":false},{"text":"Amazon FSx for Windows File Server","explanation":"This service provides a managed file system offering for Microsoft Windows environments.","correct":true,"selected":false},{"text":"Amazon S3","explanation":"This service provides object storage for storing and retrieving data at virtually any scale.","correct":false,"selected":false},{"text":"AWS Snowball Edge","explanation":"This service provides a physical device for moving data and running some edge workloads.","correct":false,"selected":false}],"answerCode":"2","type":"multiple-choice","geminiFlashAnswerCode":"2","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAmazon FSx for Windows File Server\u003c/b\u003e because it provides a fully managed and highly performant Windows native shared file system that is compatible with the SMB protocol and is designed for Windows based applications.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAmazon FSx for Windows File Server\u003c/b\u003e delivers native Windows file system features such as NTFS permissions, integration with Microsoft Active Directory, and support for user quotas and data deduplication. It offers elastic performance and capacity and provides deployment across multiple Availability Zones for resiliency. It uses the SMB protocol so Windows instances and users can mount it easily and share files with consistent performance.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon S3\u003c/i\u003e is object storage and is accessed through APIs or the S3 console rather than through a Windows file share. It does not natively support the SMB protocol and it is not a managed Windows file system.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Elastic File System\u003c/i\u003e provides a scalable shared file system for Linux workloads by using the NFS protocol. It does not support SMB and it is not designed for Windows native features.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Snowball Edge\u003c/i\u003e is a physical edge and data transfer device that is used for offline migrations or edge processing. It is not a cloud hosted managed shared file system for Windows applications.\u003c/p\u003e","tip":"\u003cp\u003eMatch protocols to services. Choose \u003ci\u003eAmazon FSx for Windows File Server\u003c/i\u003e for \u003ci\u003eWindows\u003c/i\u003e with \u003ci\u003eSMB\u003c/i\u003e, choose \u003ci\u003eAmazon EFS\u003c/i\u003e for \u003ci\u003eLinux\u003c/i\u003e with \u003ci\u003eNFS\u003c/i\u003e, and remember \u003ci\u003eAmazon S3\u003c/i\u003e is object storage without file sharing protocols.\u003c/p\u003e","references":[{"description":"What is Amazon FSx for Windows File Server","url":"https://docs.aws.amazon.com/fsx/latest/WindowsGuide/what-is.html"},{"description":"What is Amazon EFS","url":"https://docs.aws.amazon.com/efs/latest/ug/whatisefs.html"},{"description":"Amazon S3 User Guide","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/Welcome.html"},{"description":"What is AWS Snowball Edge","url":"https://docs.aws.amazon.com/snowball/latest/developer-guide/whatisedge.html"}]},{"originalQuery":"Acompany must keep records of all resource changes that are made through the AWS Management Console and AWS APIs.\nWhich AWS service should the company use to meet this requirement?","originalOptions":[{"text":"Amazon CloudWatch","correct":false},{"text":"AWS CloudTrail","correct":true},{"text":"AWS X-Ray","correct":false},{"text":"Amazon Inspector","correct":false}],"source":"exam","query":"Scrumtuous Manufacturing needs to retain a history of changes to AWS resources when users make updates by using the AWS Management Console or AWS APIs. Which AWS service should the company use to support this requirement?","options":[{"text":"AWS CloudTrail","explanation":"AWS CloudTrail records account activity and API events for supported actions across AWS environments","correct":true,"selected":false},{"text":"AWS X-Ray","explanation":"AWS X-Ray helps analyze and trace requests as they move through distributed applications","correct":false,"selected":false},{"text":"Amazon CloudWatch","explanation":"Amazon CloudWatch collects metrics, logs, and events that help monitor AWS resources and applications","correct":false,"selected":false},{"text":"Amazon Inspector","explanation":"Amazon Inspector is a vulnerability management service that assesses workloads for software vulnerabilities and unintended network exposure","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAWS CloudTrail\u003c/b\u003e because it records and retains a history of management events from the AWS Management Console, SDKs, and APIs, which lets you see who made changes to resources and when.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS CloudTrail\u003c/b\u003e captures management events for create, modify, and delete operations across AWS services. You can view recent activity in Event history and you can create a trail to deliver logs to Amazon S3 for long term retention and analysis. It supports logging across multiple Regions and integrates with Amazon CloudWatch Logs and Amazon Athena so you can monitor and query activity for auditing and compliance.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon CloudWatch\u003c/i\u003e focuses on metrics, logs, and alarms for monitoring system performance and application health. It does not provide an account wide record of who called which API or which console user changed a resource, so it is not the right choice for an audit trail of changes.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS X-Ray\u003c/i\u003e provides distributed tracing for analyzing requests as they flow through microservices and it helps find performance bottlenecks and errors in applications. It does not track management events or retain a change history of AWS resources.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Inspector\u003c/i\u003e is a vulnerability management service that scans workloads and reports findings for security issues. It does not record API activity or console actions, so it cannot meet the requirement to retain a history of changes.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question asks for a record of who did what and when, look for the service that logs management events from the console and APIs. Think \u003ci\u003eaudit trail\u003c/i\u003e, \u003ci\u003eAPI activity\u003c/i\u003e, and \u003ci\u003echange history\u003c/i\u003e to quickly identify the correct choice.\u003c/p\u003e","references":[{"description":"What is AWS CloudTrail","url":"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html"},{"description":"View CloudTrail event history","url":"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/view-cloudtrail-events.html"},{"description":"What is Amazon CloudWatch","url":"https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/WhatIsCloudWatch.html"},{"description":"What is AWS X-Ray","url":"https://docs.aws.amazon.com/xray/latest/devguide/aws-xray.html"},{"description":"What is Amazon Inspector","url":"https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html"}]},{"originalQuery":"Acompany is migrating their workload from an on-premises environment to AWS.\nWhich costs will the company be able to eliminate with this migration? (Select TWO.)","originalOptions":[{"text":"8. Data center costs","correct":true},{"text":"Data security costs","correct":false},{"text":"_ Fixed costs","correct":true},{"text":"Monitoring costs","correct":false},{"text":"Training development costs","correct":false}],"source":"exam","query":"Scrumtuous Retail is planning to move an application from its own on premises environment t
