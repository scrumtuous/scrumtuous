 requires specialized management. It does not provide managed storage and rotation of application credentials for multiple applications, so it does not meet the goal of reducing ongoing administration.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Key Management Service\u003c/i\u003e manages encryption keys that protect data at rest. It does not store application passwords or API keys and it does not natively rotate those credentials for you, so it is not the right choice for secret rotation and retrieval.\u003c/p\u003e\u003cp\u003e\u003ci\u003eServer-side encryption\u003c/i\u003e is an encryption feature for data at rest in services such as Amazon S3. It does not provide a secrets repository or automatic credential rotation for applications, so it does not satisfy the requirement in this scenario.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question highlights \u003ci\u003estore\u003c/i\u003e, \u003ci\u003emanage\u003c/i\u003e, and \u003ci\u003eautomatic rotation\u003c/i\u003e of application \u003ci\u003esecrets\u003c/i\u003e with a need to \u003ci\u003eminimize administration\u003c/i\u003e, choose AWS Secrets Manager rather than key management or at-rest encryption features.\u003c/p\u003e","references":[{"description":"AWS Secrets Manager User Guide - What is AWS Secrets Manager","url":"https://docs.aws.amazon.com/secretsmanager/latest/userguide/intro.html"},{"description":"AWS Secrets Manager User Guide - Rotating secrets","url":"https://docs.aws.amazon.com/secretsmanager/latest/userguide/rotating-secrets.html"},{"description":"AWS Key Management Service Developer Guide - Overview","url":"https://docs.aws.amazon.com/kms/latest/developerguide/overview.html"},{"description":"AWS CloudHSM User Guide - Introduction","url":"https://docs.aws.amazon.com/cloudhsm/latest/userguide/introduction.html"},{"description":"Amazon S3 User Guide - Server-side encryption","url":"https://docs.aws.amazon.com/AmazonS3/latest/userguide/serv-side-encryption.html"}]},{"originalQuery":"A developer wants to deploy an application on a container-based service. The service must automatically provision and manage the backend instances. The service must\nprovision only the necessary resources.\nWhich AWS service will meet these requirements?","originalOptions":[{"text":"Amazon EC2","correct":false},{"text":"Amazon Lightsail","correct":false},{"text":"Amazon Elastic Kubernetes Service (Amazon EKS)","correct":false},{"text":"AWS Fargate","correct":true}],"source":"exam","query":"A developer at Scrumtuous Media plans to launch a containerized application. The platform must handle provisioning and administration of the underlying compute capacity, and it must allocate only the resources that the application needs. Which AWS service should the developer use?","options":[{"text":"Amazon Elastic Kubernetes Service","explanation":"Amazon Elastic Kubernetes Service is a managed service for running Kubernetes workloads on AWS","correct":false,"selected":false},{"text":"Amazon Lightsail","explanation":"Amazon Lightsail offers simplified virtual private servers, storage, networking, and managed databases for straightforward applications","correct":false,"selected":false},{"text":"Amazon EC2","explanation":"Amazon EC2 provides resizable virtual server capacity for running a wide range of workloads in AWS","correct":false,"selected":false},{"text":"AWS Fargate","explanation":"AWS Fargate is a serverless compute option for running containers with Amazon ECS or Amazon Elastic Kubernetes Service","correct":true,"selected":false}],"answerCode":"4","type":"multiple-choice","geminiFlashAnswerCode":"4","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAWS Fargate\u003c/b\u003e because it runs containers without the need to manage servers, it provisions and administers the underlying compute on your behalf, and it allocates and bills only for the vCPU and memory that each containerized task or pod requests.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS Fargate\u003c/b\u003e is a serverless compute engine for containers that works with Amazon ECS and Amazon EKS. It removes the need to choose instance types, right size clusters, or patch hosts. You specify the CPU and memory for each task or pod and \u003cb\u003eAWS Fargate\u003c/b\u003e launches the containers with that exact capacity and scales as tasks run. You pay only for the resources that your containers request while they are running, which satisfies the requirement to allocate only what the application needs.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon EC2\u003c/i\u003e is incorrect because you must launch and manage instances, handle scaling and capacity, and perform patching and maintenance. It does not automatically allocate only the resources that each container needs and you can easily over or under provision.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Lightsail\u003c/i\u003e is incorrect because its container service uses fixed bundles and you still choose the capacity plan. It simplifies setup but it is not serverless for containers and it does not automatically provision just the exact resources per task.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Elastic Kubernetes Service\u003c/i\u003e is incorrect on its own because it provides a managed Kubernetes control plane while you still need to manage the worker nodes and their capacity. It only meets the requirement when you run pods on \u003cb\u003eAWS Fargate\u003c/b\u003e, and the question asks for the service that directly handles provisioning and allocates only what the application needs.\u003c/p\u003e","tip":"\u003cp\u003eWhen a container question highlights not managing servers and paying only for vCPU and memory requested per task, think of \u003ci\u003eserverless\u003c/i\u003e containers and choose AWS Fargate.\u003c/p\u003e","references":[{"description":"Amazon ECS on AWS Fargate","url":"https://docs.aws.amazon.com/AmazonECS/latest/developerguide/AWS_Fargate.html"},{"description":"Amazon EKS on AWS Fargate","url":"https://docs.aws.amazon.com/eks/latest/userguide/fargate.html"}]},{"originalQuery":"Which options are AWS Cloud Adoption Framework (AWS CAF) security perspective capabilities? (Select TWO.)","originalOptions":[{"text":"Observability","correct":false},{"text":"Incident and problem management","correct":false},{"text":"Incident response","correct":true},{"text":"Infrastructure protection","correct":true},{"text":"Availability and continuity","correct":false}],"source":"exam","query":"Scrumtuous is using the AWS Cloud Adoption Framework to plan its cloud transformation and is focusing on the security perspective. Which items are capabilities associated with that perspective?","options":[{"text":"Infrastructure protection","explanation":"Infrastructure protection relates to safeguards that help protect networks, systems, and workload components","correct":true,"selected":false},{"text":"Observability","explanation":"Observability focuses on collecting and using operational data to understand the behavior of workloads and systems","correct":false,"selected":false},{"text":"Incident response","explanation":"Incident response covers preparation and processes for detecting, analyzing, and responding to security events","correct":true,"selected":false},{"text":"Availability and continuity","explanation":"Availability and continuity focuses on maintaining service access and recovering operations during disruptions","correct":false,"selected":false},{"text":"Incident and problem management","explanation":"Incident and problem management addresses how an organization handles service disruptions and recurring operational issues","correct":false,"selected":false}],"answerCode":"1,3","type":"multi-select","geminiFlashAnswerCode":"1,3","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct options are \u003cb\u003eIncident response\u003c/b\u003e and \u003cb\u003eInfrastructure protection\u003c/b\u003e. Both are core capabilities in the AWS Cloud Adoption Framework Security perspective.\u003c/p\u003e\u003cp\u003eThe \u003cb\u003eIncident response\u003c/b\u003e capability focuses on preparing for, detecting, containing, eradicating, and recovering from security events. In AWS you establish runbooks and playbooks, test your processes regularly, and use services such as Amazon GuardDuty, AWS Security Hub, AWS CloudTrail, and AWS Config to support rapid detection, triage, and investigation.\u003c/p\u003e\u003cp\u003eThe \u003cb\u003eInfrastructure protection\u003c/b\u003e capability addresses defense in depth across network and compute layers. It includes segmentation with Amazon VPC, subnets, security groups, and network ACLs, along with protective controls such as AWS WAF, AWS Shield, and Amazon Inspector to reduce the attack surface and help prevent unauthorized access.\u003c/p\u003e\u003cp\u003e\u003ci\u003eObservability\u003c/i\u003e is not a Security perspective capability. In AWS CAF it belongs to the Operations perspective where service monitoring and observability focus on telemetry and operational health rather than security protection and response.\u003c/p\u003e\u003cp\u003e\u003ci\u003eIncident and problem management\u003c/i\u003e is part of the Operations perspective. It concentrates on restoring services and addressing root causes for operational issues, which is different from the Security perspective capabilities.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAvailability and continuity\u003c/i\u003e belongs to the Operations perspective and centers on resilience, backup, and disaster recovery planning. It is not listed under the Security perspective capabilities.\u003c/p\u003e","tip":"\u003cp\u003eLink the AWS CAF \u003ci\u003eSecurity perspective\u003c/i\u003e to capabilities that protect identities, data, and infrastructure, that enable threat detection, and that guide \u003ci\u003eincident response\u003c/i\u003e. If an option sounds like operational health or reliability, think of the \u003ci\u003eOperations perspective\u003c/i\u003e instead.\u003c/p\u003e","references":[]},{"originalQuery":"Acompany plans to move its test workloads to Amazon EC2. The test workloads can be interrupted and are not required to start at a particular time.\nWhich EC2 instance purchasing option is MOST cost-effective for this use case?","originalOptions":[{"text":"On-Demand Instances","correct":false},{"text":"Spot Instances","correct":true},{"text":"Reserved Instances","correct":false},{"text":"Dedicated Hosts","correct":false}],"source":"exam","query":"Scrumtuous Testing plans to run development validation workloads on Amazon EC2. These workloads can stop unexpectedly and do not need to begin at a specific time. Which EC2 instance purchasing option provides the lowest cost for this use case?","options":[{"text":"Spot Instances","explanation":"Spot Instances use spare Amazon EC2 capacity and are commonly considered for flexible workloads that can tolerate interruptions","correct":true,"selected":false},{"text":"Reserved Instances","explanation":"Reserved Instances provide a pricing discount in exchange for a commitment to use a specific instance configuration over a term","correct":false,"selected":false},{"text":"Dedicated Hosts","explanation":"Dedicated Hosts provide physical servers for a customer's exclusive use and can support certain licensing or compliance requirements","correct":false,"selected":false},{"text":"On-Demand Instances","explanation":"On-Demand Instances let customers pay for compute capacity by the second or hour without a long term commitment","correct":false,"selected":false}],"answerCode":"1","type":"multiple-choice","geminiFlashAnswerCode":"1","domain":"Billing, Pricing, and Support","answer":"\u003cp\u003eThe correct option is \u003cb\u003eSpot Instances\u003c/b\u003e because it delivers the lowest cost for workloads that can be interrupted and do not need to start at a specific time.\u003c/p\u003e\u003cp\u003e\u003cb\u003eSpot Instances\u003c/b\u003e let you use spare Amazon EC2 capacity at deep discounts that can reach up to ninety percent off the On-Demand price. They are designed for fault tolerant and flexible tasks that can pause and resume because AWS can reclaim the capacity with a two minute interruption notice. Development validation jobs that can stop unexpectedly and that have flexible start times are a classic fit, which is why this option offers the lowest cost for the described use case.\u003c/p\u003e\u003cp\u003e\u003ci\u003eOn-Demand Instances\u003c/i\u003e are priced pay as you go without long term commitments and are great for short term or unpredictable workloads that cannot be interrupted. They are not the lowest cost when you can tolerate interruptions, so they are not the best fit here.\u003c/p\u003e\u003cp\u003e\u003ci\u003eReserved Instances\u003c/i\u003e provide significant discounts compared to On-Demand in exchange for a one or three year commitment and they are best for steady state and predictable usage. They are not ideal for interruptible and flexible validation jobs and they generally do not beat the pricing of Spot for such workloads.\u003c/p\u003e\u003cp\u003e\u003ci\u003eDedicated Hosts\u003c/i\u003e allocate physical servers for your use and are chosen for compliance, licensing, or tenancy needs. They are typically the most expensive option and do not match a lowest cost objective for interruptible development validation tasks.\u003c/p\u003e","tip":"\u003cp\u003eMatch the workload tolerance for interruption to the purchasing option. Choose \u003ci\u003eSpot\u003c/i\u003e for flexible and interruptible jobs, choose \u003ci\u003eOn-Demand\u003c/i\u003e for immediate and noninterruptible needs, choose commitments like \u003ci\u003eReserved Instances\u003c/i\u003e or \u003ci\u003eSavings Plans\u003c/i\u003e for steady usage, and choose \u003ci\u003eDedicated Hosts\u003c/i\u003e for licensing or compliance requirements.\u003c/p\u003e","references":[{"description":"Instance purchasing options in Amazon EC2","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/instance-purchasing-options.html"},{"description":"Spot Instance interruptions","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/spot-interruptions.html"}]},{"originalQuery":"Acompany needs to connect on-premises applications to AWS Cloud storage by using industry-standard internet Small Computer Systems Interface (iSCSI) connectivity.\nWhich AWS solution can the company use to meet this requirement?","originalOptions":[{"text":"AWS Storage Gateway file gateway","correct":false},{"text":"Amazon API Gateway","correct":false},{"text":"AWS Storage Gateway volume gateway","correct":true},{"text":"AWS Transit Gateway","correct":false}],"source":"exam","query":"Scrumtuous Manufacturing wants to connect its on-premises business applications to AWS Cloud storage by using standard internet Small Computer Systems Interface connectivity. Which AWS solution can support this requirement?","options":[{"text":"AWS Storage Gateway file gateway","explanation":"This gateway configuration provides file based access to cloud storage for on-premises environments.","correct":false,"selected":false},{"text":"AWS Transit Gateway","explanation":"This service connects multiple virtual private clouds and on-premises networks through a central hub.","correct":false,"selected":false},{"text":"Amazon API Gateway","explanation":"This service helps teams create, publish, monitor, and secure APIs for applications.","correct":false,"selected":false},{"text":"AWS Storage Gateway volume gateway","explanation":"This gateway configuration provides block storage integration between local environments and AWS storage services.","correct":true,"selected":false}],"answerCode":"4","type":"multiple-choice","geminiFlashAnswerCode":"4","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAWS Storage Gateway volume gateway\u003c/b\u003e.\u003c/p\u003e\u003cp\u003eThe \u003cb\u003eAWS Storage Gateway volume gateway\u003c/b\u003e presents cloud backed block storage to on-premises servers over the iSCSI protocol, which is the standard internet Small Computer Systems Interface connectivity that the question describes. Applications connect to the gateway as if it were a local iSCSI target while data is stored in Amazon S3 and you can take point in time snapshots to Amazon EBS for backup and recovery. This directly fulfills the requirement to use iSCSI from on-premises business applications to reach AWS Cloud storage.\u003c/p\u003e\u003cp\u003eThe \u003ci\u003eAWS Storage Gateway file gateway\u003c/i\u003e is incorrect because it provides file interfaces that use NFS or SMB, not iSCSI. It is designed for file based workloads and cannot satisfy a requirement that explicitly calls for iSCSI connectivity.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon API Gateway\u003c/i\u003e is incorrect because it is a fully managed service for creating and managing REST and WebSocket APIs. It does not provide storage or block protocols and cannot bridge on-premises iSCSI applications to AWS storage.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Transit Gateway\u003c/i\u003e is incorrect because it is a networking hub that connects VPCs and on-premises networks through VPN or AWS Direct Connect. It does not present storage or support iSCSI endpoints, so it does not meet the stated storage connectivity requirement.\u003c/p\u003e","tip":"\u003cp\u003eMatch the protocol requirement to the gateway type. When you see a need for \u003ci\u003eiSCSI\u003c/i\u003e from on-premises servers, choose the volume gateway. When you see \u003ci\u003eNFS\u003c/i\u003e or \u003ci\u003eSMB\u003c/i\u003e file shares, choose the file gateway.\u003c/p\u003e","references":[]},{"originalQuery":"Accompany is preparing to move its infrastructure to the AWS Cloud. The company needs to collect and assess on-premises server and application inventory. Which AWS service will meet these requirements?","originalOptions":[{"text":"Amazon Connect","correct":false},{"text":"AWS Migration Hub","correct":true},{"text":"Amazon QuickSight","correct":false},{"text":"AWS Step Functions","correct":false}],"source":"exam","query":"Scrumtuous Manufacturing is planning a migration of its data center workloads to the AWS Cloud. The company wants to gather and evaluate information about its on-premises servers and application portfolio before migration. Which AWS service will meet this requirement?","options":[{"text":"AWS Step Functions","explanation":"AWS Step Functions is a service for coordinating distributed application components by using visual workflows","correct":false,"selected":false},{"text":"AWS Migration Hub","explanation":"AWS Migration Hub provides tools for tracking migration activities and viewing information related to application migration efforts","correct":true,"selected":false},{"text":"Amazon QuickSight","explanation":"Amazon QuickSight is a business intelligence service for creating dashboards and analyzing data from multiple sources","correct":false,"selected":false},{"text":"Amazon Connect","explanation":"Amazon Connect is an AWS service that organizations can use to build and operate cloud-based contact center experiences","correct":false,"selected":false}],"answerCode":"2","type":"multiple-choice","geminiFlashAnswerCode":"2","domain":"Cloud Concepts","answer":"\u003cp\u003eThe correct answer is \u003cb\u003eAWS Migration Hub\u003c/b\u003e.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAWS Migration Hub\u003c/b\u003e provides a central place to discover on premises servers and applications, collect inventory and performance data through AWS Application Discovery Service, and evaluate the application portfolio before migration. Organizations can use \u003cb\u003eAWS Migration Hub\u003c/b\u003e Strategy Recommendations to analyze application dependencies and determine suitable migration and modernization paths. The service helps you plan and track migrations across multiple tools in one location, which directly meets the requirement to gather and evaluate information prior to moving workloads to AWS.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Connect\u003c/i\u003e is a cloud contact center service and it does not discover or assess on premises servers or application portfolios for migration planning.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon QuickSight\u003c/i\u003e is a business intelligence service used to analyze and visualize data, and it does not inventory or evaluate on premises environments for migration.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Step Functions\u003c/i\u003e orchestrates workflows for applications and automation, and it does not perform discovery or portfolio assessments for migration readiness.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question asks about how to \u003ci\u003ediscover\u003c/i\u003e and \u003ci\u003eassess\u003c/i\u003e an on premises application \u003ci\u003eportfolio\u003c/i\u003e before migrating, choose the service that centralizes discovery, assessment, and planning. That is \u003ci\u003eAWS Migration Hub\u003c/i\u003e.\u003c/p\u003e","references":[{"description":"What is AWS Migration Hub","url":"https://docs.aws.amazon.com/migrationhub/latest/ug/what-is-migration-hub.html"},{"description":"What is AWS Application Discovery Service","url":"https://docs.aws.amazon.com/application-discovery/latest/userguide/what-is-appdiscovery.html"},{"description":"Migration Hub Strategy Recommendations","url":"https://docs.aws.amazon.com/migrationhub-strategy/latest/userguide/what-is-strategy.html"}]},{"originalQuery":"Which tasks are the customer's responsibility in the AWS Cloud? (Select TWO.)","originalOptions":[{"text":"Configure VPC subnets.","correct":true},{"text":"Configure security groups for Amazon EC2 instances.","correct":true},{"text":"Manage and maintain AWS Regions.","correct":false},{"text":"Patch and maintain Amazon CloudFront.","correct":false},{"text":"Patch the operating system in Amazon DynamoDB.","correct":false}],"source":"exam","query":"Under the AWS shared responsibility model, which activities should McKenzie Inc handle when it runs workloads in the AWS Cloud?","options":[{"text":"Patch the operating system for Amazon DynamoDB","explanation":"Amazon DynamoDB is a managed NoSQL database service that abstracts the underlying database infrastructure from users.","correct":false,"selected":false},{"text":"Configure subnets within a VPC","explanation":"Subnet configuration includes defining network segments, IP address ranges, and routing associations within a virtual network.","correct":true,"selected":false},{"text":"Patch and maintain Amazon CloudFront","explanation":"Amazon CloudFront is an AWS service that delivers content through a globally distributed edge network.","correct":false,"selected":false},{"text":"Configure security groups for Amazon EC2 instances","explanation":"Security groups control allowed inbound and outbound traffic for associated Amazon EC2 resources.","correct":true,"selected":false},{"text":"Operate and maintain AWS Regions","explanation":"AWS Regions are separate geographic areas that contain multiple Availability Zones for running cloud services.","correct":false,"selected":false}],"answerCode":"2,4","type":"multi-select","geminiFlashAnswerCode":"2,4","domain":"Security and Compliance","answer":"\u003cp\u003eThe correct options are \u003cb\u003eConfigure subnets within a VPC\u003c/b\u003e and \u003cb\u003eConfigure security groups for Amazon EC2 instances\u003c/b\u003e. Under the shared responsibility model, customers configure resources they deploy and control the security settings within their AWS accounts while AWS secures the underlying cloud infrastructure.\u003c/p\u003e\u003cp\u003eConfiguring subnets inside a VPC is a customer task because you design your network layout. You choose CIDR ranges and create public or private subnets and then associate route tables and network ACLs to control how traffic flows. These are configuration choices that determine how your workload is segmented and how it reaches the internet or other networks, so they fall under customer responsibility.\u003c/p\u003e\u003cp\u003eSecurity groups for Amazon EC2 are virtual firewalls at the instance level and you define the inbound and outbound rules. You decide which ports and protocols are allowed and from which sources. This is part of securing workloads in the cloud and it is clearly a customer responsibility in the shared responsibility model.\u003c/p\u003e\u003cp\u003e\u003ci\u003eOperate and maintain AWS Regions\u003c/i\u003e is incorrect because AWS is responsible for the physical facilities, power, networking hardware, and the operation of Regions and Availability Zones. Customers do not run or maintain the global infrastructure.\u003c/p\u003e\u003cp\u003e\u003ci\u003ePatch and maintain Amazon CloudFront\u003c/i\u003e is incorrect because CloudFront is a fully managed service and AWS handles patching and maintenance of the service infrastructure. Customers focus on configuration such as distributions, origins, TLS settings, and edge security features.\u003c/p\u003e\u003cp\u003e\u003ci\u003ePatch the operating system for Amazon DynamoDB\u003c/i\u003e is incorrect because DynamoDB is a fully managed serverless database and AWS operates and patches the underlying operating systems and infrastructure. Customers manage data modeling, access policies, and configuration, not operating system maintenance.\u003c/p\u003e","tip":"\u003cp\u003eRemember the difference between \u003ci\u003esecurity of the cloud\u003c/i\u003e and \u003ci\u003esecurity in the cloud\u003c/i\u003e. AWS secures and operates the infrastructure while you configure network controls, identity and access, and service level settings for your workloads.\u003c/p\u003e","references":[{"description":"Your VPC and Subnets","url":"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_Subnets.html"},{"description":"Security groups for your VPC","url":"https://docs.aws.amazon.com/vpc/latest/userguide/VPC_SecurityGroups.html"},{"description":"Security in Amazon CloudFront","url":"https://docs.aws.amazon.com/AmazonCloudFront/latest/DeveloperGuide/security.html"},{"description":"Security in Amazon DynamoDB","url":"https://docs.aws.amazon.com/amazondynamodb/latest/developerguide/security.html"}]},{"originalQuery":"Which AWS service reports any failed status checks for an Amazon EC2 instance?","originalOptions":[{"text":"AWS CloudTrail","correct":false},{"text":"Amazon CloudWatch","correct":true},{"text":"AWS Trusted Advisor","correct":false},{"text":"Amazon Inspector","correct":false}],"source":"exam","query":"Which AWS service can show failed status checks for an Amazon EC2 instance?","options":[{"text":"Amazon Inspector","explanation":"Amazon Inspector is used to run automated security assessments for supported workloads and container images.","correct":false,"selected":false},{"text":"AWS Trusted Advisor","explanation":"AWS Trusted Advisor provides checks and recommendations that can help review an AWS environment against best practices.","correct":false,"selected":false},{"text":"AWS CloudTrail","explanation":"AWS CloudTrail records API activity and account events for auditing and governance across AWS environments.","correct":false,"selected":false},{"text":"Amazon CloudWatch","explanation":"Amazon CloudWatch collects metrics, logs, and events from AWS resources and applications for monitoring purposes.","correct":true,"selected":false}],"answerCode":"4","type":"multiple-choice","geminiFlashAnswerCode":"4","domain":"Cloud Technology and Services","answer":"\u003cp\u003eThe correct option is \u003cb\u003eAmazon CloudWatch\u003c/b\u003e.\u003c/p\u003e\u003cp\u003e\u003cb\u003eAmazon CloudWatch\u003c/b\u003e provides the EC2 instance status check metrics that indicate instance and system health. You can see failures through the StatusCheckFailed, StatusCheckFailed_Instance, and StatusCheckFailed_System metrics. You can also create alarms to notify you when these metrics indicate a failure, which directly addresses the need to show failed status checks for an instance.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS CloudTrail\u003c/i\u003e records API activity for auditing and governance and it does not present EC2 instance status check results or operational health metrics.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAWS Trusted Advisor\u003c/i\u003e offers account level recommendations across cost optimization, performance, security, fault tolerance, and service limits and it does not display per instance EC2 status check failures.\u003c/p\u003e\u003cp\u003e\u003ci\u003eAmazon Inspector\u003c/i\u003e performs automated security assessments to find software vulnerabilities and network exposure and it does not report EC2 operational status checks.\u003c/p\u003e","tip":"\u003cp\u003eWhen a question mentions EC2 \u003ci\u003estatus checks\u003c/i\u003e or alarms on instance health, map it to the monitoring and metrics capabilities of \u003ci\u003eCloudWatch\u003c/i\u003e.\u003c/p\u003e","references":[{"description":"Amazon EC2 monitoring metrics in CloudWatch, including StatusCheckFailed","url":"https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/viewing_metrics_with_cloudwatch.html"},{"description":"What is AWS CloudTrail","url":"https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-user-guide.html"},{"description":"AWS Trusted Advisor","url":"https://docs.aws.amazon.com/awssupport/latest/user/trusted-advisor.html"},{"description":"What is Amazon Inspector","url":"https://docs.aws.amazon.com/inspector/latest/user/what-is-inspector.html"}]}];

    const CURRENT_KEY = "theoAwsExamCurrent2026";
    const HISTORY_KEY = "theoAwsExamHistory2026";
    const EXAM_NAME = "Theo AWS Cloud Practice Exam";

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function isCorrect(question) {
      return question.options.every(option => Boolean(option.selected) === Boolean(option.correct));
    }

    function correctCount(question) {
      return question.options.filter(option => option.correct).length;
    }

    function formatDuration(ms) {
      if (!Number.isFinite(ms) || ms < 0) return "0:00";
      const total = Math.floor(ms / 1000);
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    class ExamQuestion extends HTMLElement {
      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { question, index, total, graded, cheating } = this._state;
        const reveal = graded || cheating;
        const choose = correctCount(question);

        this.innerHTML = `
          <section class="card" aria-labelledby="question-title">
            <div class="card-header">
              <span>Question ${index + 1} of ${total}</span>
              <span>${question.viewed ? "Viewed" : "New"}</span>
            </div>
            <div class="card-body">
              <p class="query" id="question-title"></p>
              <p class="choose-note">Choose ${choose}</p>
              <div class="options"></div>
              ${reveal ? `<div class="answer-panel"><strong>Answer</strong><div class="answer-html"></div></div>` : ""}
            </div>
          </section>
        `;

        this.querySelector(".query").textContent = question.query;
        const options = this.querySelector(".options");

        question.options.forEach((option, optionIndex) => {
          const label = document.createElement("label");
          label.className = "option";
          if (reveal && option.correct) label.classList.add("reveal-correct");
          if (reveal && option.selected && !option.correct) label.classList.add("reveal-wrong-selected");

          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = Boolean(option.selected);
          input.disabled = Boolean(graded);
          input.addEventListener("change", () => {
            this.dispatchEvent(new CustomEvent("option-toggle", {
              bubbles: true,
              detail: { optionIndex }
            }));
          });

          const textWrap = document.createElement("span");
          const text = document.createElement("span");
          text.textContent = option.text;
          textWrap.appendChild(text);

          if (reveal && option.explanation) {
            const explanation = document.createElement("small");
            explanation.textContent = option.explanation;
            textWrap.appendChild(explanation);
          }

          label.append(input, textWrap);
          options.appendChild(label);
        });

        const answer = this.querySelector(".answer-html");
        if (answer) answer.innerHTML = question.answer || "";
      }
    }
    customElements.define("exam-question", ExamQuestion);

    class QuestionJumper extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { questions, current, graded, cheating } = this._state;
        const reveal = graded || cheating;

        this.innerHTML = `
          <section class="card">
            <div class="card-header collapsible-title" role="button" tabindex="0">
              <span>Question Jumper</span>
              <span class="chevron">${this.collapsed ? "▼" : "▲"}</span>
            </div>
            <div class="card-body jumper-body" ${this.collapsed ? 'hidden' : ''}>
              <div class="jumper-grid"></div>
            </div>
          </section>
        `;

        const title = this.querySelector(".collapsible-title");
        const toggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        title.addEventListener("click", toggle);
        title.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });

        const grid = this.querySelector(".jumper-grid");
        questions.forEach((question, index) => {
          const button = document.createElement("button");
          button.className = "jump-btn";
          button.textContent = String(index + 1);
          button.title = question.query;

          if (question.viewed) button.classList.add("viewed");
          if (index === current) button.classList.add("current");

          if (reveal) {
            button.classList.remove("viewed", "current");
            button.classList.add(isCorrect(question) ? "correct" : "incorrect");
            if (index === current) button.style.outline = "3px solid #111827";
          }

          button.addEventListener("click", () => {
            this.dispatchEvent(new CustomEvent("jump", {
              bubbles: true,
              detail: { index }
            }));
          });
          grid.appendChild(button);
        });
      }
    }
    customElements.define("question-jumper", QuestionJumper);

    class ExamHistoryPanel extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        const history = this._state?.history || { exams: [] };
        const exams = Array.isArray(history.exams) ? history.exams : [];

        this.innerHTML = `
          <section class="card">
            <div class="card-header">
              <span class="collapsible-title" role="button" tabindex="0">Exam History</span>
              <div class="control-group">
                <button class="btn-secondary toggle-history">${this.collapsed ? "Show" : "Hide"}</button>
                <button class="btn-danger clear-history" ${exams.length ? "" : "disabled"}>Clear History</button>
              </div>
            </div>
            <div class="card-body history-body" ${this.collapsed ? "hidden" : ""}></div>
          </section>
        `;

        const doToggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        this.querySelector(".toggle-history").addEventListener("click", doToggle);
        this.querySelector(".collapsible-title").addEventListener("click", doToggle);
        this.querySelector(".clear-history").addEventListener("click", () => {
          this.dispatchEvent(new CustomEvent("history-clear", { bubbles: true }));
        });

        const body = this.querySelector(".history-body");
        if (!exams.length) {
          body.innerHTML = `<p class="history-empty">No completed exams are stored on this device.</p>`;
          return;
        }

        [...exams].reverse().forEach((exam, reverseIndex) => {
          const questions = Array.isArray(exam.questions) ? exam.questions : [];
          const score = questions.filter(isCorrect).length;
          const number = exams.length - reverseIndex;
          const finish = Number(exam.finish || exam.completedAt || 0);
          const start = Number(exam.start || 0);
          const stamp = finish ? new Date(finish).toLocaleString() : "Completed exam";
          const duration = finish && start ? formatDuration(finish - start) : "";

          const wrap = document.createElement("div");
          wrap.className = "history-exam";

          const summary = document.createElement("div");
          summary.className = "history-summary";
          summary.innerHTML = `<strong>Attempt ${number}: ${score} / ${questions.length}</strong><span>${stamp}${duration ? ` · ${duration}` : ""}</span>`;
          wrap.appendChild(summary);

          const dots = document.createElement("div");
          dots.className = "history-dots";
          questions.forEach((question, i) => {
            const dot = document.createElement("span");
            dot.className = "history-dot" + (isCorrect(question) ? " correct" : "");
            dot.textContent = String(i + 1);
            dot.title = question.query;
            dots.appendChild(dot);
          });
          wrap.appendChild(dots);
          body.appendChild(wrap);
        });
      }
    }
    customElements.define("exam-history-panel", ExamHistoryPanel);

    class ScrumExamApp extends HTMLElement {
      constructor() {
        super();
        this.state = null;
        this.timerHandle = null;
      }

      connectedCallback() {
        this.load();
        this.addEventListener("option-toggle", e => this.toggleOption(e.detail.optionIndex));
        this.addEventListener("jump", e => this.setCurrentQuestion(e.detail.index));
        this.addEventListener("history-clear", () => this.clearHistory());
        this.render();
        this.timerHandle = setInterval(() => this.updateTimer(), 1000);
      }

      disconnectedCallback() {
        clearInterval(this.timerHandle);
      }

      load() {
        let saved = null;
        try {
          saved = JSON.parse(localStorage.getItem(CURRENT_KEY));
        } catch (_) {}

        if (saved && Array.isArray(saved.questions) && saved.questions.length === QUESTION_BANK.length && !saved.graded) {
          this.state = saved;
        } else {
          const questions = clone(QUESTION_BANK).map(q => ({
            ...q,
            viewed: false,
            options: q.options.map(o => ({ ...o, selected: false }))
          }));
          questions[0].viewed = true;
          this.state = {
            name: EXAM_NAME,
            graded: false,
            start: Date.now(),
            finish: 0,
            questions,
            currentQuestionNumber: 0,
            cheating: new URLSearchParams(location.search).get("page") === "answer"
          };
          this.saveCurrent();
        }
      }

      saveCurrent() {
        if (!this.state.graded) {
          localStorage.setItem(CURRENT_KEY, JSON.stringify(this.state));
        }
      }

      getHistory() {
        try {
          const existing = JSON.parse(localStorage.getItem(HISTORY_KEY));
          if (existing && Array.isArray(existing.exams)) return existing;
        } catch (_) {}
        const history = { name: "Exam History", exams: [] };
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        return history;
      }

      clearHistory() {
        localStorage.setItem(HISTORY_KEY, JSON.stringify({ name: "Exam History", exams: [] }));
        this.render();
      }

      toggleOption(optionIndex) {
        if (this.state.graded) return;
        const q = this.state.questions[this.state.currentQuestionNumber];
        q.options[optionIndex].selected = !q.options[optionIndex].selected;
        q.viewed = true;
        this.saveCurrent();
        this.render();
      }

      setCurrentQuestion(index) {
        const next = Math.max(0, Math.min(index, this.state.questions.length - 1));
        this.state.currentQuestionNumber = next;
        this.state.questions[next].viewed = true;
        this.saveCurrent();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      toggleCheat() {
        this.state.cheating = !this.state.cheating;
        this.saveCurrent();
        this.render();
      }

      grade() {
        if (this.state.graded) return;
        this.state.graded = true;
        this.state.cheating = true;
        this.state.finish = Date.now();

        const history = this.getHistory();
        history.exams.push(clone(this.state));
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        localStorage.removeItem(CURRENT_KEY);
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      restart() {
        localStorage.removeItem(CURRENT_KEY);
        this.load();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      score() {
        return this.state.questions.filter(isCorrect).length;
      }

      answeredCount() {
        return this.state.questions.filter(q => q.options.some(o => o.selected)).length;
      }

      updateTimer() {
        const el = this.querySelector("[data-timer]");
        if (!el || !this.state) return;
        const end = this.state.finish || Date.now();
        el.textContent = formatDuration(end - this.state.start);
      }

      render() {
        if (!this.state) return;
        const qIndex = this.state.currentQuestionNumber;
        const total = this.state.questions.length;
        const answered = this.answeredCount();
        const score = this.score();

        this.innerHTML = `
          <main class="page-shell">
            <header class="hero">
              <div class="hero-top">
                <div>
                  <h1>Theo | AWS Cloud Practice Exam</h1>
                  <p>AWS Cloud concepts &amp; services · standalone practice exam · no external dependencies</p>
                </div>
                <div class="pill">Elapsed <span data-timer>${formatDuration((this.state.finish || Date.now()) - this.state.start)}</span></div>
              </div>
              <div class="meta-row">
                <span class="pill">${total} questions</span>
                <span class="pill">${answered} answered</span>
                <span class="pill">${this.state.questions.filter(q => q.viewed).length} viewed</span>
                ${this.state.graded ? `<span class="pill">Score ${score} / ${total}</span>` : ""}
              </div>
            </header>

            ${this.state.graded ? `
              <section class="card results">
                <div class="card-body">
                  <strong>Your grade is ${score} out of ${total}.</strong>
                  <div class="status-line">Correct answers and option explanations are now visible. Your completed attempt has been saved to local storage.</div>
                </div>
              </section>
            ` : ""}

            <exam-question></exam-question>

            <div class="controls">
              <div class="control-group">
                <button class="btn-secondary previous" ${qIndex === 0 ? "disabled" : ""}>&lt;&lt; Back</button>
                <button class="btn-primary next" ${qIndex === total - 1 ? "disabled" : ""}>Next &gt;&gt;</button>
              </div>
              <div class="control-group">
                <button class="btn-warning cheat">${this.state.cheating ? "Be Honest" : "Cheat"}</button>
                ${this.state.graded
                  ? `<button class="btn-primary restart">Start New Attempt</button>`
                  : `<button class="btn-primary finish">Finish</button>`}
              </div>
            </div>

            <question-jumper></question-jumper>
            <exam-history-panel></exam-history-panel>

            <p class="footer-note">Progress and completed attempts are stored only in this browser's localStorage.</p>
          </main>
        `;

        const questionEl = this.querySelector("exam-question");
        questionEl.state = {
          question: this.state.questions[qIndex],
          index: qIndex,
          total,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const jumper = this.querySelector("question-jumper");
        jumper.state = {
          questions: this.state.questions,
          current: qIndex,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const history = this.querySelector("exam-history-panel");
        history.state = { history: this.getHistory() };

        this.querySelector(".previous").addEventListener("click", () => this.setCurrentQuestion(qIndex - 1));
        this.querySelector(".next").addEventListener("click", () => this.setCurrentQuestion(qIndex + 1));
        this.querySelector(".cheat").addEventListener("click", () => this.toggleCheat());

        const finish = this.querySelector(".finish");
        if (finish) finish.addEventListener("click", () => this.grade());

        const restart = this.querySelector(".restart");
        if (restart) restart.addEventListener("click", () => this.restart());
      }
    }
    customElements.define("scrum-exam-app", ScrumExamApp);
  </script>
</body>
</html>
