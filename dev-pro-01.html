n the two groups.","explanation":"Random assignment in the same period gives both prompts about the same mix of contracts, including the same share of easy template renewals. The prompt is then the only systematic difference between the two groups, so the team can attribute a difference in scores to the prompt. Grading both groups with the LLM grader and with the lawyers' sample also shows whether the two measures agree.","correct":true},{"text":"Remove the template renewals from the data for both two-week periods, then recompute the grader's average score for the remaining contracts before and after the prompt change.","explanation":"This removes one known difference between the two periods, so the comparison becomes less biased. The two periods can still differ in other ways, such as which other clients sent contracts, and the team can remove only the differences that it already knows about. The result is still a comparison of different contracts at different times.","correct":false},{"text":"Ask the senior lawyers to grade a larger weekly sample of contracts processed with the revised prompt, and report their grades in place of the grader's average.","explanation":"More expert grades give a more accurate measure of the quality of the revised prompt's output on the contracts it processed. However, the old prompt was graded on a different set of contracts, with fewer easy renewals, so the two sets of grades still cannot be compared fairly. The weakness is in the design of the comparison, and better grading alone does not fix it.","correct":false},{"text":"Keep the revised prompt in place for a full quarter so that the sample is larger, then compare its grader average with the average for the previous quarter.","explanation":"A larger sample makes the average more stable, but it does not make a before-and-after comparison fair. Two quarters can contain different clients and different contract types, so the same problem remains at a larger scale. The team would also wait three months for an answer that is still unclear.","correct":false}],"answer":"<p>Correct answer: <strong>Run both prompts during the same weeks, assigning each incoming contract to one of them at random, and compare grader scores and lawyer grades between the two groups.</strong></p><p>A before-and-after comparison changes two things at the same time: the prompt and the contracts. In the two weeks after the change, about 1,500 contracts were renewals of one standard template, and these renewals rarely contain unusual clauses. These contracts are easy for any prompt, so they raise the grader&#x27;s average even if the revised prompt is no better than the old one. The team cannot tell how much of the higher score comes from the prompt and how much comes from the easier contracts. A second difference of this kind, which could also explain the result, is called a confound.</p><p>An A/B test removes this problem. Both prompt versions run during the same weeks, and each incoming contract is assigned to one version at random. On average, each group then receives the same share of template renewals, the same clients and the same contract types, and the same grader scores both groups. The only systematic difference between the groups is the prompt. With about 30,000 contracts a quarter, the overnight flow gives each group thousands of contracts within a few weeks. The team can draw the lawyers&#x27; weekly sample from both groups. This gives expert grades for each version and shows whether the grader&#x27;s result agrees with expert judgment. An A/B test has limits. It needs enough traffic and some time to show a clear difference. During the test, an unproven version processes part of the live work. And the result shows which version scores better but not why. Reading a sample of outputs from each group answers the question of why. Anthropic&#x27;s evaluation guidance lists A/B testing against a baseline or earlier version as a quantitative measurement method in Define success criteria and build evaluations.</p><p>Each of the other approaches improves one part of the measurement, but each still compares different contracts from different periods. Removing the template renewals corrects for one known difference. Other differences between the periods remain, and the team can correct only for differences that it has noticed. Running the revised prompt for a full quarter gives more data, but a larger sample makes a biased comparison more precise without making it correct. Asking the lawyers to grade more contracts makes the grades for the revised prompt more accurate. However, the old prompt was graded on a different mix of contracts, so the comparison is still unfair.</p>","tip":"","reference":"Supplied Claude practice questions, question 40. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"},{"query":"Scenario: A law firm reviews about 30,000 supplier contracts each quarter for its corporate clients. A Claude pipeline extracts key terms, flags unusual clauses and gives each contract a risk score. Most contracts are processed overnight, but a partner (a senior lawyer) sometimes needs one reviewed within minutes. Senior lawyers grade a weekly sample of the output, and an LLM grader scores the rest.\n\nQuestion: The pipeline now reads the firm's clause library from a remote MCP server through the MCP connector. The overnight job obtains one OAuth access token at its start and reuses it for about five hours, and firm security policy limits these tokens to one hour. Traces show clause library calls failing with authentication errors after the first hour, while urgent partner reviews succeed. Which change best fixes the cause?","type":"multiple-choice","options":[{"text":"Retry each failed clause library call with exponential backoff, and raise the retry limit for the overnight job so that more calls succeed later in the run.","explanation":"Backoff and retry help with temporary failures, such as rate limits or a server that is unavailable for a short time. An expired token is not temporary: every retry sends the same expired token and gets the same authentication error. The job would run longer and send more failing calls without completing more clause comparisons.","correct":false},{"text":"Ask the identity team for a long-lived access token used only by the overnight job, and store it in the firm's secrets manager with restricted access.","explanation":"A token that lasts as long as the run would stop the errors, but the firm's security policy limits these tokens to one hour. Short token lifetimes limit how long someone can use a leaked token against the clause library, and careful storage does not replace that limit. The job should work within the policy by renewing the token.","correct":false},{"text":"Have the overnight job request a new access token before the current one expires, and send the current token in the MCP server definition of each request.","explanation":"With the MCP connector, the caller supplies the OAuth bearer token in each request and is responsible for refreshing it. A job that runs for five hours with a token that is valid for one hour must renew the token during the run. Sending the current token with each request removes the authentication errors and keeps the one-hour limit that the security policy sets.","correct":true},{"text":"Add a check that marks a contract as failed when its response contains a tool error, and place that contract in the queue for the next overnight run.","explanation":"This check is a useful addition, because it stops contracts that were scored without a clause comparison from reaching clients. It does not fix the cause. On the next night the token still expires after one hour, so most queued contracts fail again and the queue keeps growing. The check detects the failure, but the token handling must change to prevent it.","correct":false}],"answer":"<p>Correct answer: <strong>Have the overnight job request a new access token before the current one expires, and send the current token in the MCP server definition of each request.</strong></p><p>When a request uses the MCP connector, the Messages API connects to the remote MCP server for the caller. The connection details are part of each request. The mcp_servers array names the server and its URL, and the optional authorization_token field carries the OAuth bearer token that the server requires. The API passes this token to the server. It does not run the OAuth flow, and it does not renew the token. The application that calls the API must obtain the token and refresh it when needed.</p><p>The traces match this design. The overnight job reads one token at its start and reuses it for about five hours, but the firm&#x27;s policy makes each token valid for one hour. Calls succeed during the first hour and fail with authentication errors after it. Urgent reviews for partners finish within minutes, so the token they use is still valid. The model, the prompt and the MCP server are all working. The fault is in how the job manages the token.</p><p>The fix is to manage the token inside the job. The job should request a new token before the current one expires, and it should build each request with the token that is valid at that moment. The token is a field of each request, so no restart or redeployment is needed during the run. Short token lifetimes are a deliberate security choice: if a token leaks from a log or a cache, someone can use it only for a short time. A long-running job should be designed to work with that limit.</p><p>Retrying with backoff is the right response to temporary errors such as rate limits. An expired token returns the same error on every attempt, so retries add time and load without fixing anything. A long-lived token would stop the errors, but it breaks the firm&#x27;s one-hour policy, and a leaked token would stay usable for much longer. Marking contracts with tool errors as failed is good practice, and the team should also reprocess contracts that were already scored without a clause comparison. However, that check only detects the problem: the next overnight run would fail in the same way after its first hour.</p><p>See MCP connector for the mcp_servers fields and authentication, and Remote MCP servers for connecting to servers that have their own authentication requirements.</p>","tip":"","reference":"Supplied Claude practice questions, question 41. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: A consulting firm runs a multi-agent system, built on the Agent SDK, that produces market research reports. A lead agent plans the work and assigns subagents to search the web, analyze company filings that consultants upload, and build comparison tables. The lead agent then writes the report with citations. Producing a report takes between twenty minutes and two hours, and each run records a trace of every subagent's tool calls and outputs.\n\nQuestion: Two months of traces show that the web-search and filings subagents rarely duplicate work, and their findings are graded well. The five parallel table subagents each choose a market definition and fiscal period during their work, and the lead agent spends a third of each run's tokens correcting tables that do not agree. Fixed definitions in the task descriptions did not help, because the right choices depend on each run's findings. Which architecture change best fits this evidence?","type":"multiple-choice","options":[{"text":"Add a reviewer subagent that checks the five tables after they are built and sends each table back to its table subagent for correction where they differ.","explanation":"A review step is useful when someone can check the work against clear criteria, but in this system it leaves the cause in place. The five subagents would still make different choices in separate contexts. The correction work would move from the lead agent to the reviewer and to repeated table runs. Token cost would probably rise, because the system would build tables, compare them and rebuild them.","correct":false},{"text":"Replace the lead agent and all subagents with one agent that searches, analyzes filings, builds the tables and writes the report in a single context.","explanation":"A single context would make the tables consistent, but it also removes the parallel search and filings work, which the traces show is performing well. One agent would have to do all the searches and filing reviews one after another and hold all of that material in one context. That is slower, and it can lower quality on long reports. The evidence points to a problem in one stage, not in the whole design.","correct":false},{"text":"Keep the parallel subagents for web search and filings analysis, and assign all the comparison tables to one agent that builds them in a single context.","explanation":"The table tasks depend on each other, because every table must use the same market definition and fiscal period, and separate contexts hide each subagent's choices from the others. One agent in one context makes each choice once and applies it to all tables. This removes the cause of the disagreement and most of the correction cost. The search and filings stages stay parallel, because the traces show that parallel work is effective there.","correct":true},{"text":"Keep the five parallel table subagents, move them to the most capable tier with a higher effort level, and leave the search and filings subagents unchanged.","explanation":"A more capable model does not let one subagent see what another subagent is choosing at the same time. Each table subagent can make a reasonable choice and still disagree with the other four, so the tables would continue to differ. The change would raise the cost of each run without removing the dependency between the table tasks.","correct":false}],"answer":"<p>Correct answer: <strong>Keep the parallel subagents for web search and filings analysis, and assign all the comparison tables to one agent that builds them in a single context.</strong></p><p>Each subagent works in its own context window. This is useful when the pieces of work are independent: several agents can explore different directions at the same time, and each returns a short result to the lead agent. It is a poor match when the pieces depend on each other, because one subagent cannot see the choices that another subagent is making while both are running.</p><p>The traces show both situations in one system. The web-search and filings subagents rarely duplicate work, and their findings are graded well, so parallel subagents are the right pattern for those stages. The table subagents are different. Each one chooses a market definition and a fiscal period during its work, and every table in a report must use the same choices. The five table tasks therefore share a dependency. Splitting them across five contexts causes the disagreement, and the lead agent then spends a third of each run&#x27;s tokens correcting it. Fixed definitions in the task descriptions did not help, because the right choices come from each run&#x27;s findings. One agent that builds all the tables in a single context makes each choice once and applies it to every table. That removes the cause and most of the correction work.</p><p>Anthropic&#x27;s guidance in Building effective agents is to use the simplest design that works, and to add agentic complexity only where it measurably improves the result. Agentic and multi-agent designs usually cost more tokens and more time, so each stage should show a benefit that justifies the cost. The same rule can give different answers for different stages of one system. For this reason, the team makes the decision stage by stage, from trace, cost and quality data, and not once for the whole system.</p><p>Each of the other changes helps with something, but none fits the evidence. Moving everything to one agent would make the tables consistent. However, it would also remove parallel search and filings analysis, which are working well, and it would put all the source material for a long report into one context. A reviewer subagent finds the differences after they exist. The five subagents still choose separately, so the system pays to build, compare and rebuild tables. A higher model tier for the table subagents improves each subagent&#x27;s reasoning, but the problem is not weak reasoning. Each subagent cannot see the other four, and a stronger model does not change that.</p>","tip":"","reference":"Supplied Claude practice questions, question 42. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: A consulting firm runs a multi-agent system, built on the Agent SDK, that produces market research reports. A lead agent plans the work and assigns subagents to search the web, analyze company filings that consultants upload, and build comparison tables. The lead agent then writes the report with citations. Producing a report takes between twenty minutes and two hours, and each run records a trace of every subagent's tool calls and outputs.\n\nQuestion: Eleven days ago, the document parsing tool's vendor changed its service, and the tool began returning empty text for scanned filings. The lead agent wrote the affected reports from web sources alone, and runs still finished in the usual time with citations. The team made no release in that period and learned of the problem from a consultant's complaint. Which change best helps the team detect a similar failure sooner?","type":"multiple-choice","options":[{"text":"Instruct each subagent in its prompt to state in its final message when a tool returned no usable content, and have the lead agent add a data-quality note to the report.","explanation":"Telling the lead agent about unusable tool results can improve the report. However, this control depends on the model noticing and reporting the problem in every run. The note also appears in a report that consultants read, not in an alert for the engineers. So the team would still depend on a consultant to report the problem.","correct":false},{"text":"Add the scanned filings from the incident to the regression evaluation suite, with checks that the report cites them, and run the suite before every prompt or tool release.","explanation":"Adding the incident cases to the regression suite is a good step, and it protects against the team's own future changes. However, the suite runs only when the team releases something. This failure began with a vendor change at a time when the team made no release, so the suite would not have run.","correct":false},{"text":"Alert when a report run ends with an error or takes longer than two hours, and page the on-call engineer so that the engineer can inspect that run's trace for the failing subagent.","explanation":"Alerts on failed or very long runs are useful for crashes and for agents that stop making progress. In this incident every affected run ended normally and in the usual time. Neither condition would have been met, and nobody would have been paged.","correct":false},{"text":"Compute from each run's trace how often each tool returns empty or error results and what share of citations come from filings, and alert when either value leaves its normal range.","explanation":"The failure produced no error and no delay, so the best way to detect it is production monitoring built from tool-level and run-level signals. The traces already record every tool call and output. So the team can measure, for each run, the parser's rate of empty results and the share of citations from filings, and compare them with their normal values. An alert on either number would have reported this incident within the first few affected runs.","correct":true}],"answer":"<p>Correct answer: <strong>Compute from each run&#x27;s trace how often each tool returns empty or error results and what share of citations come from filings, and alert when either value leaves its normal range.</strong></p><p>The parser did not return an error. It returned empty text, so the filing subagents had little to report, and the lead agent still wrote a complete report with citations from web sources. A failure of this kind produces no error and no delay. Monitoring that only checks whether a run finished and how long it took cannot detect it. This is why the team learned of the problem from a consultant eleven days later.</p><p>The best way to detect this kind of failure is production monitoring built from signals inside the run, such as tool results and citation sources. The system already records a trace of every subagent&#x27;s tool calls and outputs. So the team can calculate numbers from those traces for each run: how often each tool returns an empty or error result, and what share of the report&#x27;s citations point to uploaded filings and not to web pages. Each number is compared with its baseline, which is the normal value measured during healthy runs. An alert when the parser&#x27;s rate of empty results rises, or when the share of filing citations falls, would have reported this incident within the first few affected runs. This is the role of production monitoring: it finds failures that begin after launch, including failures caused by changes outside the team&#x27;s control. Other production checks can also detect a change caused by a vendor, for example a scheduled test run on a known scanned filing.</p><p>Each of the other changes helps with a different problem. Alerts on run errors and long runs detect crashes and agents that stop making progress, but the affected runs ended normally and on time. A regression evaluation suite (a fixed set of test tasks that is run before a change is released) protects against the team&#x27;s own changes. The team should add the scanned filings to it. However, the vendor&#x27;s change came when the team made no release, so the suite would not have run. A prompt instruction that asks subagents to mention unusable tool results gives the lead agent better information. However, it depends on the model reporting the problem every time, and the note goes to consultants in the report, not to the engineers as an alert.</p><p>Operational measures such as these belong in the team&#x27;s success criteria next to answer quality; see the guidance on defining success criteria and building evaluations. The OpenTelemetry span reference documents request-level attributes such as status code, stop reason and error type. Those request-level attributes would look normal in this incident, because the model requests themselves succeeded. The tool-level numbers can come from the system&#x27;s own run traces, or from telemetry that is configured to capture tool-call and tool-result details.</p>","tip":"","reference":"Supplied Claude practice questions, question 43. Domain: Advanced Debugging and Incident Response.","answerStatus":"source"},{"query":"Scenario: A consulting firm runs a multi-agent system, built on the Agent SDK, that produces market research reports. A lead agent plans the work and assigns subagents to search the web, analyze company filings that consultants upload, and build comparison tables. The lead agent then writes the report with citations. Producing a report takes between twenty minutes and two hours, and each run records a trace of every subagent's tool calls and outputs.\n\nQuestion: Subagents write filing analyses and comparison tables to the worker's local disk and return short file references, a design chosen after compaction dropped table details from the lead agent's context. After a worker is replaced mid-run, the session resumes from its durably stored transcript with full history, but the referenced files are gone, so the lead agent runs the same subagents again. Which change best lets an interrupted run continue without repeating completed work?","type":"multiple-choice","options":[{"text":"Enable file checkpointing on the lead agent's session, and after a worker is replaced, rewind the files to the most recent checkpoint before resuming the session.","explanation":"File checkpointing backs up files before the Write, Edit and NotebookEdit tools change them, so that those files can be returned to an earlier state. It does not track edits made by subagents. Its purpose is to undo changes, not to keep artifacts available after a worker's disk is lost.","correct":false},{"text":"Store subagent artifacts in durable shared storage under the run's ID, and restore them to the worker's working directory before resuming the lead agent's session.","explanation":"A session stores the conversation, not the files that subagents wrote, so the artifacts need their own durable store. When the files are restored to the same paths before the resume, the file references in the lead agent's history are valid again. Then no subagent has to run a second time.","correct":true},{"text":"Have each subagent return its full analysis or table in its final message to the lead agent, and stop writing these artifacts to separate files.","explanation":"This would put the content in the transcript, so the content would still be available after a worker replacement. However, the team moved to file references because compaction removed table details from the lead agent's context. This change would bring that problem back in long runs.","correct":false},{"text":"Add a step after each resume that checks every file reference in the lead agent's history and dispatches the original subagent again for each missing file.","explanation":"This check would stop the lead agent from citing tables that no longer exist, and the final report would be correct. However, it still repeats subagent work that was already finished, and that repeated work is the cost the team wants to remove.","correct":false}],"answer":"<p>Correct answer: <strong>Store subagent artifacts in durable shared storage under the run&#x27;s ID, and restore them to the worker&#x27;s working directory before resuming the lead agent&#x27;s session.</strong></p><p>An Agent SDK session stores the conversation: the prompt, each tool call, each tool result and each response. It does not store the files that the agent or its subagents wrote. A SessionStore adapter copies that transcript to durable storage, so the lead agent can resume on a new worker with its full history. The files on the old worker&#x27;s local disk are a separate kind of state, and they are lost when the worker is replaced.</p><p>The subagents in this system return short file references so that the lead agent&#x27;s context stays small. That is a good design for runs of up to two hours, because large tables and analyses stay out of the conversation and compaction cannot remove their details. The limit of this design is that a reference is useful only while the file exists. A durable run therefore needs two stores: one for the transcript and one for the artifacts. The fix is to write each artifact to shared storage under the run&#x27;s ID, and to copy the artifacts back to the same paths before the session is resumed. This makes the references in the history valid again. The lead agent can then continue from the point of interruption without running the subagents again.</p><p>File checkpointing has a different purpose. It backs up files before the Write, Edit and NotebookEdit tools change them, so that a later call can return those files to an earlier state. It does not track edits that subagents make. It is a way to undo changes, not a way to keep files available on a new machine. Returning the full content in subagent messages would put that content in the transcript. However, it would also bring back the problem that the file references solved: large results in the lead agent&#x27;s context, and details lost at compaction. Checking for missing files and dispatching the subagents again produces a correct report, but it repeats finished work, which costs time and tokens on every interruption.</p><p>For more detail, see Work with sessions, Session storage, and Rewind file changes with checkpointing.</p>","tip":"","reference":"Supplied Claude practice questions, question 44. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: A consulting firm runs a multi-agent system, built on the Agent SDK, that produces market research reports. A lead agent plans the work and assigns subagents to search the web, analyze company filings that consultants upload, and build comparison tables. The lead agent then writes the report with citations. Producing a report takes between twenty minutes and two hours, and each run records a trace of every subagent's tool calls and outputs.\n\nQuestion: Since mid-morning, every model request from the lead agent and its subagents has returned HTTP 429, and an hour of retries with exponential backoff has produced no success. Several reports more than an hour into their runs are stalled. The traces show that the responses have the error code \"enforced_spend_limit_reached\" and no \"retry-after\" header, while per-minute token use is well below its limits. Which action should the team take first?","type":"multiple-choice","options":[{"text":"Route the web search and table-building subagents to the fastest, lowest-cost tier so that the stalled runs can finish at a lower cost for each report.","explanation":"A smaller model lowers the cost of future requests, and the team could consider it as a cost control after the incident. It does not help during the incident, because the limit is on the organization's total spend, so the API also refuses requests to a cheaper model. Changing the model in the middle of a run could also change report quality.","correct":false},{"text":"Stop the retries, pause the stalled runs so that they can resume later, and have an organization administrator get the spend limit raised.","explanation":"The error code and the missing retry-after header show that the organization reached a spend limit, which is not a short-term rate limit. Requests keep failing until the limit is raised or access resumes, so more retries cannot succeed. Pausing the stalled runs keeps the subagent work already done for each report, and raising the limit removes the cause.","correct":true},{"text":"Widen the backoff window and add random jitter to the retry logic so that requests from the lead agent and its subagents stop arriving at the same moment.","explanation":"A wider backoff window with jitter (a small random delay added to each wait) helps when a per-minute rate limit refills after a short wait. A spend limit does not refill within minutes. The hour of failed retries already shows that waiting longer between attempts does not produce a success.","correct":false},{"text":"Lower the number of subagents that the lead agent runs in parallel so that the system's input and output token use per minute falls further.","explanation":"Running fewer subagents in parallel lowers token use per minute, which helps when a per-minute token limit causes the 429 responses. The evidence shows that per-minute use is already well below those limits. The cause is a spend limit, and the number of parallel subagents does not change it.","correct":false}],"answer":"<p>Correct answer: <strong>Stop the retries, pause the stalled runs so that they can resume later, and have an organization administrator get the spend limit raised.</strong></p><p>An HTTP 429 from the Claude API does not always mean the same thing. It can be a per-minute rate limit on requests or tokens, a ramp limit on how fast token use grows, or a spend limit on the organization. The first step in triage (deciding what kind of problem this is and what to do first) is to read the error details and the response headers to find which kind applies, because each kind needs a different response.</p><p>A per-minute rate limit uses a token bucket that refills continuously. A short wait followed by a retry usually succeeds, and the response usually tells the client how long to wait in a retry-after header. Exponential backoff (waiting longer after each failed attempt) is the correct response for that case. A spend-limit 429 is different. It has no retry-after header, the Messages API reports enforced_spend_limit_reached in the error details, and requests keep failing until the limit is raised or access resumes. The evidence in the traces matches this case, and the evidence shows that a per-minute limit is not the cause.</p><p>The response has three parts. First, the team stops the retries, because they cannot succeed and they fill the traces with failed requests. Second, the team pauses the stalled runs instead of letting them fail, because a report can take up to two hours and the subagent work already done is expensive to repeat. Third, an administrator gets the spend limit raised. The team should also tell the consultants who are waiting that their reports are delayed and why, because communication is part of incident response.</p><p>The other actions are correct for other kinds of 429. A wider backoff window with jitter helps with per-minute limits. Running fewer parallel subagents lowers token use per minute. A smaller model lowers future cost, but it cannot get a request accepted while the organization is blocked. After the incident, the postmortem (the written review of the incident) should record two findings. First, the retry logic should check the error code and stop on a spend-limit error, instead of treating every 429 as an error that can be retried. Second, monitoring should alert when spend approaches the limit, so that the team can act before requests are refused.</p><p>For the error types and retry behavior, see Errors. For per-minute limits, ramp limits and spend limits, see Rate limits.</p>","tip":"","reference":"Supplied Claude practice questions, question 45. Domain: Advanced Debugging and Incident Response.","answerStatus":"source"},{"query":"Scenario: A consulting firm runs a multi-agent system, built on the Agent SDK, that produces market research reports. A lead agent plans the work and assigns subagents to search the web, analyze company filings that consultants upload, and build comparison tables. The lead agent then writes the report with citations. Producing a report takes between twenty minutes and two hours, and each run records a trace of every subagent's tool calls and outputs.\n\nQuestion: The firm requires every figure in euros on a calendar-year basis, and the team put this rule in the lead agent's system prompt. Reports still mix currencies and periods. Traces show that the lead agent's task prompts to the filings subagent list only company names and metrics, and that the subagent's own outputs already use US dollars and fiscal years. Which change best addresses the cause?","type":"multiple-choice","options":[{"text":"Rewrite the currency and period rule in the lead agent's system prompt with stronger wording and add worked examples of correct euro figures.","explanation":"The lead agent already has the rule. The traces show that the wrong figures come from the filings subagent, which does not inherit the lead agent's system prompt. Stronger wording in a prompt that the subagent never reads does not change what the subagent returns. Converting fiscal-year totals to calendar-year totals afterwards usually needs quarterly data, and the subagent's summary may not include it.","correct":false},{"text":"Add the currency and period rule to the filings subagent's own system prompt, and have the lead agent restate it in each task prompt.","explanation":"A normal subagent does not inherit the lead agent's system prompt, conversation history or tool results. The only content passed from the lead agent is the task prompt that it writes. The traces show that the rule never reached the filings subagent. This change gives the subagent the instruction at the step where the figures are extracted.","correct":true},{"text":"Move the filings subagent to a larger, more capable model so that it applies currency conversion and calendar-year adjustment more accurately to each filing.","explanation":"A more capable model can follow an instruction better, but nobody gave the filings subagent this instruction. Its task prompts list only company names and metrics, so a larger model would still have no reason to convert to euros or calendar years. Each run would also cost more.","correct":false},{"text":"Have the filings subagent save its tables to files and return only references, so the lead agent inserts the figures without retyping them.","explanation":"Writing outputs to files and returning references is useful when the lead agent changes figures while it copies them into the report. The traces show a different problem: the subagent's own outputs already use US dollars and fiscal years. Files would keep those wrong figures unchanged.","correct":false}],"answer":"<p>Correct answer: <strong>Add the currency and period rule to the filings subagent&#x27;s own system prompt, and have the lead agent restate it in each task prompt.</strong></p><p>Each subagent in the Agent SDK is a separate agent instance with its own context window. A normal (non-fork) subagent does not inherit the parent&#x27;s system prompt, the parent&#x27;s conversation history, or the parent&#x27;s tool results. The only content that passes from the lead agent to the subagent is the task prompt string that the lead agent writes when it calls the Agent tool. The subagent also loads its own configuration, such as the system prompt from its definition, its tool definitions, and any project context that the application is set up to load (for example, a project CLAUDE.md file). This context isolation is intentional. It keeps the subagent focused on one task, and it keeps large tool outputs out of the lead agent&#x27;s context. The cost of this design is that a rule written only in the lead agent&#x27;s system prompt does not reach a subagent. The lead agent must include the rule in the task prompt, or the team must put it in the subagent&#x27;s own prompt or in project context that the subagent loads. See Subagents in the Agent SDK.</p><p>The traces contain two facts that show where the fault is. First, the lead agent&#x27;s task prompts list only company names and metrics, so the rule was not passed down. Second, the filings subagent&#x27;s outputs already use US dollars and fiscal years, so the figures were wrong before the lead agent handled them. Together these facts show that the rule exists only in a prompt that the subagent never reads. Subagent tool calls and outputs appear under the lead agent&#x27;s delegation in the trace, so an engineer can compare what was sent with what came back, as described in Agent SDK observability.</p><p>The fix puts the rule where the subagent can read it. A standing rule that applies to every report belongs in the filings subagent&#x27;s own system prompt, because that prompt loads every time the subagent runs. The lead agent should also restate the currency and period in each task prompt. This covers the per-task part of delegation: a good task prompt gives the subagent an objective, an output format and clear boundaries, and it does not assume that the subagent already knows what the lead agent knows.</p><p>Each of the other changes improves something, but none fixes the cause. Stronger wording in the lead agent&#x27;s system prompt changes only the lead agent, which already knows the rule. Saving tables to files and returning references prevents copy errors by the lead agent, but the figures were already wrong when the subagent produced them. A larger model for the filings subagent raises cost and still leaves the subagent without the instruction.</p>","tip":"","reference":"Supplied Claude practice questions, question 46. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: A consulting firm runs a multi-agent system, built on the Agent SDK, that produces market research reports. A lead agent plans the work and assigns subagents to search the web, analyze company filings that consultants upload, and build comparison tables. The lead agent then writes the report with citations. Producing a report takes between twenty minutes and two hours, and each run records a trace of every subagent's tool calls and outputs.\n\nQuestion: In roughly one report in ten, a comparison table shows revenue figures that differ from the cited filing. Traces of the failing runs show the filing reader tool returning the correct table and the filing-analysis subagent reporting the correct figures. The wrong values first appear in the task description that the lead agent writes for the table-building subagent. Which change most directly removes the cause of these errors?","type":"multiple-choice","options":[{"text":"Run the lead agent on a larger model tier and add an instruction to its system prompt to copy all figures exactly when it writes subagent tasks.","explanation":"This change acts on the correct step, and it may lower the error rate. However, the lead agent would still generate every figure again as new text, so a copy error is still possible on any run. The change also raises cost on the agent that runs for the whole report, and it does not remove the copy step itself.","correct":false},{"text":"Replace the filing reader tool's parser with one that keeps table rows and columns intact, and re-run the failing reports against the same uploaded filings.","explanation":"A better parser helps when the tool returns a damaged or incomplete table. In the failing runs, the trace shows the tool returning the correct table, so the figures do not change in the tool. The lead agent would still type the figures again and could still change them.","correct":false},{"text":"Add a verification step to the filing-analysis subagent that compares each figure it reports with the quoted filing text before it returns its result to the lead agent.","explanation":"This check is useful when a subagent misreads a filing. The trace shows that the filing-analysis subagent already reports the correct figures, so the check would pass in every failing run. The error appears after this subagent returns its result, at a step that the check does not cover.","correct":false},{"text":"Have the filing-analysis subagent save its extracted figures to a shared file, and have the lead agent pass the table-building subagent a reference to that file.","explanation":"The trace shows that the figures are correct until the lead agent types them again in a task description. If the figures are stored in a file and the lead agent passes only a reference, the lead agent no longer writes the numbers, so it cannot change them. The table-building subagent then reads the same values that the filing-analysis subagent extracted.","correct":true}],"answer":"<p>Correct answer: <strong>Have the filing-analysis subagent save its extracted figures to a shared file, and have the lead agent pass the table-building subagent a reference to that file.</strong></p><p>To find where a wrong value comes from in a multi-agent run, follow that value through the trace and find the first step where it is wrong. Every step before that point is shown to be correct. The filing reader tool returned the correct table, so the tool and the uploaded filing are not the cause. The filing-analysis subagent reported the correct figures, so its reading of the filing is not the cause. The wrong values first appear in text that the lead agent wrote. So the error starts in the lead agent&#x27;s model output, at the handoff between two subagents.</p><p>This handoff is a weak point because of how subagents work in the Agent SDK. A subagent runs in its own context. It does not see the other subagents&#x27; results. It receives the task that the lead agent writes for it. When the lead agent includes a table of figures in that task, the model generates each number again as new output. A model that rewrites many numbers will sometimes swap or change one, and the trace shows this happening in about one report in ten. Each extra copy of the data through an agent&#x27;s output is another chance for an error. Later steps then build on the error without any sign that something is wrong.</p><p>The fix is to stop sending the data through the lead agent&#x27;s output. The filing-analysis subagent writes its extracted figures to a shared file, and the lead agent passes only a short reference to that file. The table-building subagent reads the figures directly, so the lead agent&#x27;s copy step no longer exists. The cost is that the subagents need file tools and an agreed file location and format. The table-building subagent must still read the file correctly. A later check of the finished table against the file is therefore a useful addition, but it is a separate control.</p><p>The other changes act on steps that the trace has already shown to be correct, or they reduce the error without removing it. A new parser fixes a tool that is already returning correct output. A verification step inside the filing-analysis subagent checks an output that is already correct. A larger model and a stricter instruction for the lead agent act on the correct step, but the lead agent still writes every number again, so some runs can still fail.</p><p>This kind of diagnosis depends on traces that record each tool call and each agent&#x27;s output, so that the value can be compared at every step. See OpenTelemetry for the Claude API for how to set up tracing, and Handle tool calls for how tool results are returned to the model.</p>","tip":"","reference":"Supplied Claude practice questions, question 47. Domain: Advanced Debugging and Incident Response.","answerStatus":"source"},{"query":"Scenario: A consulting firm runs a multi-agent system, built on the Agent SDK, that produces market research reports. A lead agent plans the work and assigns subagents to search the web, analyze company filings that consultants upload, and build comparison tables. The lead agent then writes the report with citations. Producing a report takes between twenty minutes and two hours, and each run records a trace of every subagent's tool calls and outputs.\n\nQuestion: On runs longer than an hour, the lead agent's context is compacted several times before it writes the report. Traces show the subagents returned correct page references for each filing, but reports from these runs cite wrong pages or omit sources, mostly for findings returned early. An instruction telling compaction to keep citations reduced the errors but did not remove them. Which change best fixes the citation errors?","type":"multiple-choice","options":[{"text":"Move the lead agent to a model with a larger context window, so that compaction runs later and less often and more subagent findings stay in context during writing.","explanation":"A larger context window can delay compaction and reduce how often it runs. However, any compaction that still happens on a long run can drop the same page references. A larger context also raises the cost of each request, and recall of specific details becomes less accurate as the context grows.","correct":false},{"text":"Rewrite the compaction instruction as a detailed list of the citation fields each summary must keep, including the filing name, the page number and the source URL.","explanation":"This would probably keep more citation details, but compaction would still be a model writing a shorter version of the history. The instruction that the team already added reduced the errors without removing them, and a longer instruction is the same kind of control. It does not guarantee that every page number and URL is copied correctly through several summaries.","correct":false},{"text":"Have each subagent save its findings and source references to files and return a short file reference, which the lead agent reads when it writes each section.","explanation":"The traces show that the page references were correct when the subagents returned them, so the loss happens when compaction summarizes the lead agent's context. Storing the findings and references in files keeps the exact data outside the context that is summarized. The lead agent reads the stored text when it writes, so the citations do not depend on what a summary keeps.","correct":true},{"text":"Clear older subagent results from the lead agent's context and keep only the most recent few, so that the context grows more slowly and compaction runs less often.","explanation":"Clearing old tool results is a good choice when those results are no longer needed. In this system, the old results are the subagent findings that contain the page references, and the oldest results are removed first. The early findings, which already cause most of the errors, would be lost completely.","correct":false}],"answer":"<p>Correct answer: <strong>Have each subagent save its findings and source references to files and return a short file reference, which the lead agent reads when it writes each section.</strong></p><p>Compaction replaces older turns with a summary so that a long task can continue inside the context window. A summary is shorter than the text it replaces, so some details are dropped. Exact values such as page numbers, filing names and URLs are easy to lose or change, because a summary keeps the meaning of a finding and not every identifier attached to it. On a long run, the earliest findings are summarized again each time compaction runs. This explains why most of the wrong citations come from findings returned early.</p><p>The traces show that the subagents returned correct page references. The data was correct when it entered the lead agent&#x27;s context, and it was lost afterwards. The fix is to stop keeping the only copy of the exact references in a context that will be summarized. Each subagent writes its findings and source references to a file and returns a short file reference. The lead agent&#x27;s context then holds only short references, and the exact citation data no longer passes through any summary. At writing time, the lead agent reads the file for the section it is working on and takes the citation from the stored text. This is the purpose of persistent memory used together with compaction: compaction keeps the active context small, and storage outside the context keeps the information that must still be exact after summarization. The Memory tool documentation describes this pairing. The cost is an extra read step and some file management, and the storage location needs the same access controls as any other data store.</p><p>The other changes reduce the problem without removing its cause. A more detailed compaction instruction is still a request to a model that writes a summary, and the team has already seen that an instruction lowers the error rate but does not remove the errors. A larger context window can delay compaction, but any compaction that still happens can drop the same details. Each request also costs more as the context grows, and recall of specific details becomes less accurate in very long contexts. Clearing old tool results is useful when those results are no longer needed, as described in Context editing. In this system, the old results are the subagent findings that hold the citations, and the oldest ones are cleared first. The lead agent would have even less source data when it writes the report.</p>","tip":"","reference":"Supplied Claude practice questions, question 48. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: An insurance company runs a long-running Claude agent, built on the Agent SDK, that reconciles policy records between an old mainframe system and a new cloud database. Each night, scripts find records that do not match. The agent investigates a few thousand mismatches with about a dozen internal tools and writes corrections to the cloud database. A run takes several hours and exports traces for the engineers.\n\nQuestion: Engineers find that some corrections overwrite the cloud value with the mainframe value on policies for which the cloud database is the authoritative source. The rule naming the authoritative source is given only in the run's opening user message. Traces show every wrong correction came after the first of several automatic compactions, the tool results for those records were accurate, and the same records are corrected properly when replayed in a new session. Which change best addresses the cause?","type":"multiple-choice","options":[{"text":"Add a step to the write tool that reads each record back after the correction and reports any difference from the value the agent sent.","explanation":"A read-back check confirms that the database holds the value that the agent sent. The traces show that the tools returned accurate data, and that the error is the agent choosing the wrong source. So the check would pass on every wrong correction.","correct":false},{"text":"Move the rule that names the authoritative source for each policy out of the opening user message and into the agent's system prompt.","explanation":"Every wrong correction came after the first compaction. The same records are handled correctly in a new session, where the opening message is still in context. This shows that the rule was lost when compaction replaced the early messages with a summary. The system prompt is not part of that history, and it is sent with every request, so the rule stays available for the whole run.","correct":true},{"text":"Raise the token threshold at which automatic compaction starts, so that the first compaction happens later in each nightly run.","explanation":"Starting compaction later keeps the opening message in context for more of the run, so fewer records would be affected. However, the traces show several compactions in a run of several hours. The opening message would still be replaced by a summary, and the rule could still be lost. The rule would stay in a place that compaction can remove.","correct":false},{"text":"Run the agent on the most capable tier at a higher effort level, so that it applies the rule more consistently across a run of several hours.","explanation":"A more capable model at a higher effort level reasons better over the context it has. The same model already applies the rule correctly in a new session, so the model's ability is not the cause. After compaction the rule may be missing from the context, and no model can follow an instruction that it does not have.","correct":false}],"answer":"<p>Correct answer: <strong>Move the rule that names the authoritative source for each policy out of the opening user message and into the agent&#x27;s system prompt.</strong></p><p>To diagnose a failure in a long agent run, you decide which part produced the error: the model&#x27;s reasoning, the agent harness (the code and settings that manage context, tools and the loop), a tool, or the input data. The evidence in the traces excludes three of these. The tool results for the affected records were accurate, so the tools did not cause the error. The same records are corrected properly in a new session, so the data is valid, and the model can apply the rule when the rule is in its context. The remaining cause is the harness, and the timing confirms it: every wrong correction came after the first automatic compaction.</p><p>Compaction keeps a long run inside the context window by replacing older messages with a summary. The summary is shorter than the history, so it can leave out a detail from an early message. An instruction that exists only in the opening user message is part of that history. After compaction the agent may no longer have the rule, and it then chooses a source by its own judgment. The system prompt is different. It is not part of the message history, and it is sent with every request, so an instruction placed there is still present after any number of compactions. Rules that must apply for a whole run of several hours belong there, or in another place that the harness loads again on each request.</p><p>The other changes do not remove the cause. A read-back check in the write tool confirms that the database holds the value that the agent sent, but the agent sent the wrong value. A more capable model at a higher effort level reasons better over the context it has, but it cannot follow a rule that is missing from that context. Raising the compaction threshold delays the first compaction, so fewer records would be affected. However, the run still compacts several times, and the opening message is still replaced by a summary. Replaying failed records in a new session, as the engineers did, is a useful diagnostic step for long runs, because it separates problems in the record from problems in the state of the run.</p><p>See Compaction for how summaries replace earlier history, and OpenTelemetry for the Claude API for the traces used in this kind of diagnosis.</p>","tip":"","reference":"Supplied Claude practice questions, question 49. Domain: Advanced Debugging and Incident Response.","answerStatus":"source"},{"query":"Scenario: An insurance company runs a long-running Claude agent, built on the Agent SDK, that reconciles policy records between an old mainframe system and a new cloud database. Each night, scripts find records that do not match. The agent investigates a few thousand mismatches with about a dozen internal tools and writes corrections to the cloud database. A run takes several hours and exports traces for the engineers.\n\nQuestion: Three hours into tonight's run, an engineer sees in the traces that a mainframe lookup tool, changed yesterday, now returns dates in day-month order instead of month-day order. The agent has already written about 300 date corrections from that tool's output, and the cloud database has also received customer updates during the night. The claims system reads the database at 06:00. Which action should the team take first?","type":"multiple-choice","options":[{"text":"Stop the run, restore the cloud database from yesterday evening's backup, and start the run again once the lookup tool has been fixed.","explanation":"Restoring the whole database from the backup would remove the wrong dates. However, it would also remove the customer updates received during the night and every valid correction from this run. The damage is limited to about 300 records that the traces can identify, so a full restore undoes far more than the incident needs.","correct":false},{"text":"Pause the run, list from the traces the corrections that used that tool's output, and restore only those records before 06:00.","explanation":"The agent is still writing wrong dates, so the run must stop before more correct records are overwritten. The traces show which corrections came from the changed tool's output. So the team can repair those records and leave the customer updates and the other valid corrections in place. Doing this before 06:00 stops the claims system from reading the wrong dates.","correct":true},{"text":"Tell the agent in its instructions that the lookup tool now returns dates in day-month order, and let the run continue with the remaining mismatches.","explanation":"An instruction might help the agent read later dates correctly, but the result would depend on the model applying it to every remaining record, with no check outside the model. It also does nothing for the 300 records that already hold wrong dates, and the claims system would still read those records at 06:00.","correct":false},{"text":"Let the run finish, then add this date-format case to the evaluation suite and an alert on date corrections before tomorrow night's run.","explanation":"A regression case and an alert are the right follow-up work, but they protect later runs, not tonight's data. If the run finishes, it writes more wrong date corrections, and the 300 existing ones would still be in the database when the claims system reads it.","correct":false}],"answer":"<p>Correct answer: <strong>Pause the run, list from the traces the corrections that used that tool&#x27;s output, and restore only those records before 06:00.</strong></p><p>An incident in an agent that writes to a live database has a fixed order of work: contain the damage, find how much is affected, repair it, and only then learn from it. The agent in this incident is still running, and it is still writing date corrections from a tool whose output format changed. Each further correction can overwrite a correct date, so the first step is to pause the run. Pausing costs some of the night&#x27;s progress, but the team can process the remaining mismatches after it has handled the date problem.</p><p>The second step uses the traces. A trace records each tool call that the agent made and what the tool returned. So the engineers can list every correction that was written after a call to the changed lookup tool. That list shows the real size of the incident: about 300 records, not the whole database. A repair of only those records keeps everything else that happened during the night, including the customer updates and the corrections that did not depend on the lookup tool. The claims system reads the database at 06:00, so the repair must be finished before then.</p><p>Restoring the full database from the evening backup also removes the wrong dates, and a backup restore is a normal recovery method when nobody can find which records are damaged. It is the wrong choice when the affected records can be identified, because it deletes the customer updates and the valid corrections together with the bad ones. Telling the agent about the new date order depends on the model applying the rule correctly to every remaining record, and it leaves the 300 wrong records in place. A write to an insurance record needs a control that does not depend on the model&#x27;s behavior, such as a format check in the tool or in the write path.</p><p>The evaluation case and the alert belong to the learning step. After the data is repaired, the team should write a postmortem (the written review of an incident) and turn the failure into a test. Define success criteria and build evaluations describes this: it recommends evaluations that match the real task distribution and that include edge cases such as unexpected input formats. This work prevents a repeat on later nights. It does not protect the records that are wrong tonight, so it comes after containment and repair.</p>","tip":"","reference":"Supplied Claude practice questions, question 50. Domain: Advanced Debugging and Incident Response.","answerStatus":"source"},{"query":"Scenario: An insurance company runs a long-running Claude agent, built on the Agent SDK, that reconciles policy records between an old mainframe system and a new cloud database. Each night, scripts find records that do not match. The agent investigates a few thousand mismatches with about a dozen internal tools and writes corrections to the cloud database. A run takes several hours and exports traces for the engineers.\n\nQuestion: The team connected three more MCP servers to cover billing and claims records, adding about 180 tools, and every tool definition is loaded when a run starts. Traces now show compaction running about twice as often, and the agent sometimes calls a similarly named billing tool in place of one of its original tools. The new tools are needed on about 2 percent of mismatches. Which change best addresses both problems?","type":"multiple-choice","options":[{"text":"Defer loading of the new servers' tools behind a tool search tool, and keep the original dozen tools loaded in every request.","explanation":"Both symptoms come from loading about 180 rarely needed definitions into every request. Deferring them removes those tokens from the context window, and on most mismatches the agent then chooses only among its dozen usual tools. The original tools stay loaded because the agent uses them all the time, and a search step before each of those calls would only add delay.","correct":true},{"text":"Move the agent to a larger, more capable model for stronger tool selection, and add a system prompt section that says when to use each tool.","explanation":"A more capable model and clearer guidance may reduce some wrong tool calls. However, the full catalog would still fill the context window from the first request, and the new prompt section would add more tokens. So compaction would run at least as often as it does now.","correct":false},{"text":"Clear older tool results from the conversation at a lower token threshold, and keep only the results of the most recent tool calls.","explanation":"Clearing old tool results frees some space, so compaction might run less often. However, the 180 extra definitions would still be in every request, so the agent would still choose among many similar tool names. The team would also remove investigation data to make room for definitions that the agent almost never uses.","correct":false},{"text":"Place a cache breakpoint after the tool definitions, and extend the cache lifetime to keep the full catalog cached for the whole run.","explanation":"Prompt caching lowers the cost and latency of processing a repeated prefix again, but cached tokens still count toward the context window. The agent would still see all of the definitions on every request. So compaction would run as often as before, and the agent would still confuse the similar tool names.","correct":false}],"answer":"<p>Correct answer: <strong>Defer loading of the new servers&#x27; tools behind a tool search tool, and keep the original dozen tools loaded in every request.</strong></p><p>A tool definition that is loaded at the start takes space in the context window on every request, before the agent has read a single policy record. When the catalog grew from about a dozen tools to almost 200, much less of the window was left for the investigation work. The conversation therefore reaches the compaction threshold sooner, and compaction runs more often. A large catalog with similar names also makes it harder for the model to pick the right tool. Both symptoms in the traces have the same cause: too many definitions in context that the agent almost never needs.</p><p>The tool search tool is designed for this situation. Tools marked for deferred loading are not placed in the context at the start. Claude searches the catalog (tool names, descriptions, argument names and argument descriptions) and loads only the definitions that match the current task. This adds a search step before the agent can call a deferred tool, so the documentation advises keeping the few most frequently used tools loaded and deferring the rest. The agent uses its original dozen tools on almost every mismatch and the new tools on about 2 percent of them. So the original tools should stay loaded, and the new servers&#x27; tools should be deferred. See Tool search tool.</p><p>Each of the other changes improves something, but none removes the cause. Prompt caching makes a repeated prefix cheaper and faster to process, but it does not reduce context-window usage. The model still receives every definition, so neither symptom changes (see Prompt caching). Tool result clearing removes old tool results from the conversation, which can delay compaction. However, the definitions stay in every request, and the wrong-tool calls continue (see Context editing). A larger model with a longer system prompt may select tools more accurately. However, it adds tokens to a context that is already too full, and it costs more per request for the whole run of several hours.</p><p>When a tool catalog starts to use more of the context, first ask how often each tool is needed. Tools used on nearly every step should stay loaded. Tools used rarely should be found and loaded only when they are needed.</p>","tip":"","reference":"Supplied Claude practice questions, question 51. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: An insurance company runs a long-running Claude agent, built on the Agent SDK, that reconciles policy records between an old mainframe system and a new cloud database. Each night, scripts find records that do not match. The agent investigates a few thousand mismatches with about a dozen internal tools and writes corrections to the cloud database. A run takes several hours and exports traces for the engineers.\n\nQuestion: A downstream audit reverts about 4 percent of the agent's nightly corrections as wrong. Engineers read forty traces of reverted corrections in two rounds, and each round gave the same picture: every tool call succeeded, durations looked normal, and many investigations called the mainframe lookup tool twice. The engineers suspect the repeated lookup matters. Which next step best finds and measures the cause?","type":"multiple-choice","options":[{"text":"Have engineers read a further two hundred traces of reverted corrections in full, and record each pattern that they notice in a shared document for the team.","explanation":"Reading traces is useful for forming ideas, and two rounds of reading have already produced one. However, more reading of only the reverted corrections cannot show whether the repeated lookup is also common in corrections that passed. Notes in a document also do not give a measured rate for any pattern.","correct":false},{"text":"Add a system prompt instruction that limits the agent to one mainframe lookup per record, then track whether the audit's revert rate falls over the following week.","explanation":"This changes the agent's behavior because of a pattern that nobody has compared with passing corrections, so it may remove a step that correct investigations also use. It tests only one idea, and it takes a week to give a result. The stored traces can answer the question now, without any change to production.","correct":false},{"text":"Tag every investigation in the stored traces as reverted or passed, then compare the two groups on each tool's error rate and execution time.","explanation":"Grouping the traces by audit outcome is the right structure for the analysis. However, the forty traces already read showed that every tool call in reverted corrections succeeded and that durations looked normal. So error rate and execution time are unlikely to differ between the two groups. This comparison would leave out the attributes that the evidence points to, such as how many times each tool was called.","correct":false},{"text":"Tag every investigation in the stored traces as reverted or passed, then compare the two groups on tools called, call counts, and record type.","explanation":"A pattern seen in reverted corrections means something only when its rate is compared with the rate in corrections that passed the audit. The agent handles a few thousand mismatches each night. Grouping the traces by audit outcome and counting attributes in each group shows which attributes are much more common in the reverted group. The same counts show what share of the reverts each attribute accounts for.","correct":true}],"answer":"<p>Correct answer: <strong>Tag every investigation in the stored traces as reverted or passed, then compare the two groups on tools called, call counts, and record type.</strong></p><p>Reading a single trace shows what happened in one investigation. It cannot show whether a detail is unusual. The engineers saw the mainframe lookup tool called twice in many reverted corrections, but that fact has no meaning until they know how often the same thing happens in corrections that passed the audit. If 70 percent of reverted investigations repeat the lookup and 68 percent of passing ones also repeat it, the repeated lookup is normal behavior and not the cause. If only 5 percent of passing investigations repeat it, the repeated lookup is a strong candidate.</p><p>Failure-cohort analysis answers this question. A cohort is a group of traces that share an outcome or an attribute. The team joins the audit result to each investigation&#x27;s trace, which gives a reverted cohort and a passing cohort. The passing cohort is the baseline, which means the normal rate to compare against. The team then counts attributes in each group: which tools ran, how many times each tool ran, how many model requests the investigation used, and facts from the nightly mismatch scripts such as record type. An attribute that is much more common in the reverted cohort is a candidate cause, and the counts also show what share of all reverts it accounts for. With a few thousand mismatches a night, a 4 percent revert rate gives roughly a hundred reverted cases each night, which is enough for these comparisons. After the comparison points to a group, the engineers can read a few traces from that group to understand how the failure happens.</p><p>The exported traces already hold most of the needed data. Agent SDK sessions export Claude Code&#x27;s spans. Each prompt starts a claude_code.interaction span, and each tool call is a claude_code.tool span with attributes such as the tool name and duration. The team&#x27;s own application must supply the link to the audit result, for example by recording the policy record identifier with each investigation. See Agent SDK observability and Claude Code monitoring for the span hierarchy and attributes.</p><p>Reading two hundred more reverted traces repeats a method that has already given the same result twice, and it still looks at only one cohort. Comparing the two cohorts only on tool error rate and execution time uses the right grouping but the wrong attributes. The reverted traces already read showed successful calls and normal durations. Those two measures would probably look the same in both cohorts, and the comparison would miss call counts and record type. A prompt instruction that limits lookups acts on an idea that nobody has tested against the passing group. It could remove a step that correct investigations need, it tests only one idea, and a prompt instruction is not an enforced limit.</p>","tip":"","reference":"Supplied Claude practice questions, question 52. Domain: Observability and Production Monitoring.","answerStatus":"source"},{"query":"Scenario: An insurance company runs a long-running Claude agent, built on the Agent SDK, that reconciles policy records between an old mainframe system and a new cloud database. Each night, scripts find records that do not match. The agent investigates a few thousand mismatches with about a dozen internal tools and writes corrections to the cloud database. A run takes several hours and exports traces for the engineers.\n\nQuestion: During a run, the team's control code rewrites a status section at the top of the system prompt every twenty minutes, to tell the agent which mainframe tables have finished their nightly refresh. Traces show that the first request after each rewrite reads almost nothing from the prompt cache and writes the full conversation history again. Run cost has risen by 40 percent. Which change best lowers the cost while still delivering the status updates?","type":"multiple-choice","options":[{"text":"Move the status section to the end of the system prompt, and set a cache breakpoint on the unchanging instructions that come before it.","explanation":"Putting stable content first is good practice, and this change would let the system read the fixed instructions from the cache. However, the conversation history still comes after the system prompt in the prefix, so every rewrite of the status section still stops the history from matching. The traces show that the history is the large part that is written again, so most of the extra cost would remain.","correct":false},{"text":"Keep the system prompt identical for the whole run, and append each notice as a new message at the current end of the conversation.","explanation":"The cache matches a request against a stored prefix that is built in the order tools, system prompt, then messages. If the system prompt never changes and each notice is added after the existing history, the earlier prefix still matches and is read from the cache. Only the new notice and the turns after it are processed as new input.","correct":true},{"text":"Compact the conversation at a lower token threshold, so that less history has to be written to the cache again after each rewrite.","explanation":"A shorter history makes each full cache write smaller, so the cost of each rewrite would fall somewhat. However, the cache would still miss after every rewrite. Earlier compaction also replaces more of the agent's detailed investigation history with summaries, which can lose details that the agent needs later. The cause, a change at the start of the cached prefix, would remain.","correct":false},{"text":"Switch the prompt cache to the one-hour lifetime, so that cached entries are still available when the request after each rewrite arrives.","explanation":"A longer lifetime helps when cache entries expire during long pauses between requests. In this run the agent sends requests continuously. The miss happens immediately after each rewrite because the start of the prompt changed, not because an entry expired. A longer lifetime would raise the price of cache writes, and the rewritten prompt still would not match.","correct":false}],"answer":"<p>Correct answer: <strong>Keep the system prompt identical for the whole run, and append each notice as a new message at the current end of the conversation.</strong></p><p>Prompt caching stores a prefix of the request and reuses it only when a later request begins with the same content. The prefix is built in a fixed order: tools, then system, then messages. When any part of the prefix changes, everything after that part no longer matches. The status section is in the system prompt, which comes before the whole conversation history. So each rewrite forces the next request to process and write the full history again. In a run that lasts several hours and investigates thousands of mismatches, the history is by far the largest part of each request. That explains the pattern in the traces and the 40 percent rise in cost.</p><p>The fix is to treat the conversation as append-only: new content is added only at the end, and earlier content is never changed. The system prompt stays the same from the first request to the last, and each status update is added after the existing history, at the point where it starts to apply. The earlier prefix still matches, so it is billed at the cache-read rate, and only the new notice is new input. On the Messages API, the documented form of this is a role: &quot;system&quot; message placed inside messages. This message keeps system priority without editing the top-level system field. See Mid-conversation system messages. The same rule applies in any harness: new information goes after the cached prefix, not into it.</p><p>Moving the status section to the end of the system prompt, with a breakpoint on the fixed instructions, saves only those instructions. The history still comes after the changed section, so it is still written again after every rewrite. The one-hour cache lifetime solves a different problem: entries that expire during long gaps between requests. This agent sends requests continuously, and the miss comes from changed content, not from expiry. See Prompt caching for how invalidation and lifetimes work. Compacting earlier makes each full write smaller, but the cache still misses every twenty minutes, and summaries replace more of the agent&#x27;s detailed history. Note also that prompt caching lowers the cost of repeated input but does not reduce how much of the context window the
