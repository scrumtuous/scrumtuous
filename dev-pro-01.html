<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Developer Professional | Practice Exam 01</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #d9e0e8;
      --primary: #a65435;
      --primary-dark: #804027;
      --secondary: #667085;
      --success: #16803c;
      --success-bg: #eaf8ef;
      --danger: #b42318;
      --danger-bg: #fff0ee;
      --warning: #9a6700;
      --warning-bg: #fff7d6;
      --shadow: 0 10px 28px rgba(23, 32, 51, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      border-radius: 9px;
      padding: .62rem .92rem;
      cursor: pointer;
      font-weight: 650;
      transition: transform .08s ease, background .15s ease, opacity .15s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-secondary { background: #e8edf3; color: var(--text); }
    .btn-warning { background: #ffd96a; color: #4b3500; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }

    .page-shell {
      width: min(1040px, calc(100% - 28px));
      margin: 28px auto 60px;
    }

    .hero {
      background: linear-gradient(135deg, #222236, #6b4039);
      color: white;
      border-radius: 18px;
      padding: 24px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero-top {
      display: flex;
      gap: 18px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .hero h1 { margin: 0 0 6px; font-size: clamp(1.55rem, 3.1vw, 2rem); }
    .hero p { margin: 0; opacity: .88; }
    .meta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .pill {
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.1);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: .9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-top: 16px;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 18px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-weight: 750;
    }

    .card-body { padding: 18px; }

    .results {
      border-left: 5px solid var(--primary);
    }
    .results strong { font-size: 1.1rem; }

    .query {
      white-space: pre-line;
      font-size: 1.08rem;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .query .scenario-text {
      display: block;
      padding: 12px 14px;
      margin-bottom: 14px;
      border-left: 4px solid var(--primary);
      border-radius: 8px;
      background: #f5f7fa;
      color: #3e4b60;
      font-size: .96rem;
      font-weight: 450;
      line-height: 1.6;
    }

    .query .question-text { display: block; font-weight: 700; }

    .choose-note {
      color: var(--muted);
      font-size: .9rem;
      margin: 0 0 16px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 11px 12px;
      margin: 8px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
    }

    .option input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--primary);
      flex: 0 0 auto;
    }

    .option.reveal-correct {
      border-color: #75c991;
      background: var(--success-bg);
    }

    .option.reveal-wrong-selected {
      border-color: #e9a7a0;
      background: var(--danger-bg);
    }

    .option small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .answer-panel {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--warning-bg);
      border: 1px solid #f0d783;
    }

    .answer-panel p:first-child { margin-top: 0; }
    .answer-panel ul { margin-bottom: 0; }
    .answer-panel .tip-html { margin-top: 12px; }
    .answer-panel .reference-note { margin: 14px 0 0; color: var(--muted); font-size: .84rem; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .control-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .collapsible-title { cursor: pointer; user-select: none; }
    .chevron { font-size: .9rem; color: var(--muted); }

    .jumper-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .jump-btn {
      min-width: 38px;
      padding: 7px 9px;
      background: #eef2f6;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .jump-btn.viewed { background: #d7dee7; }
    .jump-btn.current { background: var(--primary); color: white; border-color: var(--primary); }
    .jump-btn.correct { background: var(--success); color: white; border-color: var(--success); }
    .jump-btn.incorrect { background: var(--danger); color: white; border-color: var(--danger); }

    .history-empty { color: var(--muted); margin: 0; }
    .history-exam {
      border-top: 1px solid var(--line);
      padding: 14px 0;
    }
    .history-exam:first-child { border-top: 0; padding-top: 0; }
    .history-summary {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }
    .history-dots { display: flex; flex-wrap: wrap; gap: 5px; }
    .history-dot {
      width: 26px; height: 26px; border-radius: 7px;
      display: grid; place-items: center;
      font-size: .76rem; color: white;
      background: var(--danger);
    }
    .history-dot.correct { background: var(--success); }

    .status-line {
      color: var(--muted);
      font-size: .92rem;
      margin-top: 10px;
    }

    .footer-note {
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
      margin-top: 22px;
    }

    @media (max-width: 640px) {
      .page-shell { width: min(100% - 16px, 1040px); margin-top: 8px; }
      .hero { border-radius: 12px; padding: 19px 17px; }
      .card-body { padding: 14px; }
      .card-header { padding: 12px 14px; }
      .controls { align-items: stretch; }
      .control-group { width: 100%; }
      .control-group button { flex: 1; }
    }
  </style>
</head>

  <claude-exam-app></claude-exam-app>

  <script>
    const QUESTION_BANK = [{"query":"Scenario: A regional hospital network runs a Claude assistant that drafts visit summaries and answers clinicians' questions from the network's clinical guidelines and each patient's chart. It is built on the Messages API with a retrieval pipeline over those documents. Every answer must cite its source. The assistant serves 4,000 clinicians at 30 sites, and patient data must stay under the network's privacy controls, including in logs and traces.\n\nQuestion: The assistant's backend services at all 30 sites share one static API key, stored in each site's deployment configuration. After the key leaked at one site, rotating it stopped the assistant everywhere, and usage records could not show which site sent which requests. The security team now requires that a copied credential expire within an hour and that every request be traceable to one site's workload. Which change best meets these requirements?","type":"multiple-choice","options":[{"text":"Set up workload identity federation: each site's service exchanges an identity provider token for a short-lived access token bound to that site's own service account.","explanation":"Workload identity federation replaces the stored key with a short-lived access token that Anthropic issues after it validates an identity token from the network's identity provider. The token lifetime is set on the federation rule, so a copied token stops working when that lifetime ends. Because each site's rule points to that site's own service account, every request is attributed to one named non-human identity for that site.","correct":true},{"text":"Move the shared key into one central vault, have each site's service fetch it at startup, and record a site identifier with every request in the service's own request logs.","explanation":"A central vault makes the place where the key is stored safer, but the key is still one shared, long-lived credential, so a copy taken from a running service works until someone revokes it. A site identifier that the service writes in its own logs does not identify someone who uses a copied key from another place. Rotating the key would also still affect all 30 sites at once.","correct":false},{"text":"Issue a separate API key for each of the 30 sites, store each key in that site's secrets manager, and rotate all 30 keys automatically on a monthly schedule.","explanation":"Separate keys would give attribution for each site and would limit a rotation to one site, so this is a useful improvement. However, each key is still a long-lived credential, and a copied key keeps working until the next monthly rotation. That does not meet the requirement that a copied credential expire within an hour.","correct":false},{"text":"Enable the Compliance API Activity Feed, export its events to the security team's monitoring system, and review them daily for unusual activity across the organization.","explanation":"The Activity Feed is a useful audit record of organization activity, but reviewing events detects misuse after it happens and does not make a copied key expire. All 30 sites would still send the same key, so their requests still could not be separated by site. The credential itself has to change to meet the two requirements.","correct":false}],"answer":"<p>Correct answer: <strong>Set up workload identity federation: each site&#x27;s service exchanges an identity provider token for a short-lived access token bound to that site&#x27;s own service account.</strong></p><p>A static API key is a bearer credential: anyone who holds a copy can use it until someone revokes it. When 30 sites share one key, two problems follow. Revoking the key interrupts every site at once, and every request looks the same in the usage records, because all sites present the same credential.</p><p>Workload identity federation removes the stored key. Each site&#x27;s service obtains a signed identity token from an identity provider that the network already runs (for example a cloud IAM service, Kubernetes, or Microsoft Entra ID). The service sends that token to Anthropic, which checks it against a federation rule and returns a short-lived access token bound to a service account. The rule sets the lifetime of the access token, from one minute up to one day, so the team can choose a value under one hour. A copied token stops working when that lifetime ends, and no long-lived Anthropic key remains at the sites to rotate. A service account is a named non-human identity with no email, password, or Console login. The documentation describes the difference this way: a workspace API key is a credential, while a service account has credentials. With one service account and one rule for each site, every request is attributed to one site&#x27;s workload. See Workload Identity Federation.</p><p>Federation has two limits that the team must plan for. First, it is only as secure as the identity provider it trusts, so each rule should match one site&#x27;s workload identity (not a broad pattern), and the identity provider&#x27;s own audit logging should stay on. Second, the SDK gives ANTHROPIC_API_KEY higher precedence than the federation settings. If the old key remains in the environment at any site, that site keeps using the key and reports no error. The migration is complete only after the variable is unset at all 30 sites and the old key is deleted.</p><p>The other approaches each improve one thing but leave a long-lived key in use. A separate key for each site gives attribution and limits a rotation to one site, but a copied key works until the next monthly rotation. A central vault protects the place where the key is stored, but the key is still shared, and a site identifier written by the service does not identify someone who uses a copied key. The Activity Feed in the Compliance API is a useful audit record, but audit records help the team detect a problem after it happens. They do not shorten the life of the key or separate the sites that share it.</p>","tip":"","reference":"Supplied Claude practice questions, question 1. Domain: Runtime Guardrails and Production Security.","answerStatus":"source"},{"query":"Scenario: A regional hospital network runs a Claude assistant that drafts visit summaries and answers clinicians' questions from the network's clinical guidelines and each patient's chart. It is built on the Messages API with a retrieval pipeline over those documents. Every answer must cite its source. The assistant serves 4,000 clinicians at 30 sites, and patient data must stay under the network's privacy controls, including in logs and traces.\n\nQuestion: Nine days after the team moved the assistant to a newer model version, clinicians at several sites reported answers whose cited guideline passages do not support the claims. Latency, error-rate and token-cost dashboards stayed normal, and the pre-release evaluation set passed. The monitoring platform is run by an outside vendor that is not approved to hold patient data. Which change would best detect this kind of regression within a day?","type":"multiple-choice","options":[{"text":"Add questions about the reported guideline topics to the pre-release evaluation set, raise its pass threshold, and require the larger set to pass before any future model change.","explanation":"Adding the reported cases to the evaluation set is good practice and helps prevent the same failure from returning. However, the set passed while live answers were wrong, and it runs only before a change, on a fixed list of questions. It cannot report a drop in live answer quality within a day, and it covers only the topics that clinicians have already reported.","correct":false},{"text":"Turn on prompt and response capture in the traces sent to the monitoring platform, limit trace access to the on-call engineers, and review a daily sample of answers by hand.","explanation":"Reading full prompts and answers is a useful debugging practice in many systems, but these prompts and answers contain chart content. The vendor that runs the monitoring platform is not approved to hold patient data, and limiting who can open the traces does not change where the data is stored. Reading a small sample by hand also produces no number that an alert can use.","correct":false},{"text":"Score a daily sample of live answers for citation support inside the network's own environment, export only the scores tagged by model version, and alert on drops.","explanation":"This adds the measurement that was missing: a direct measure of whether cited passages support the claims in real answers. The scoring runs where patient data is allowed to be, and only numbers leave that environment, so the vendor platform never holds chart content. Tagging scores by model version lets the team link a drop to a specific model change within a day.","correct":true},{"text":"Lower the alert thresholds on latency, error rate and output tokens per answer, and add a per-site view of each metric to catch smaller shifts after a model change.","explanation":"These metrics stayed normal while the citation problem was happening, so they do not measure it. Tighter thresholds on them would produce more alerts about speed and volume, but an answer with an unsupported citation can be fast, error-free and of normal length. The per-site view adds detail to metrics that tell the team nothing about whether answers are correct.","correct":false}],"answer":"<p>Correct answer: <strong>Score a daily sample of live answers for citation support inside the network&#x27;s own environment, export only the scores tagged by model version, and alert on drops.</strong></p><p>A service level indicator (SLI) is a measured value that describes how well a service is working, and a service level objective (SLO) is the target the team sets for that value. Latency, error rate and token cost are operational SLIs. They show that the service is responding and what it costs. They do not show that an answer is correct. A model update can change how the assistant reads retrieved passages while every operational number stays the same, which is what the team saw for nine days.</p><p>The fix is to add a quality SLI that measures the failure directly. For this assistant, a good choice is the share of sampled live answers in which the cited passage supports the claim. A grader produces this number: a code check can confirm that the cited passage exists and was retrieved, and an LLM grader can judge whether the passage supports the claim. The LLM grader should first be compared against labels from clinicians, so the team knows its scores agree with expert judgment. Anthropic&#x27;s guidance on defining success criteria and building evaluations lists context utilization and privacy preservation among the dimensions a team should measure, next to latency and price.</p><p>The privacy rule decides where the grading runs. The sampled answers and chart passages stay inside the network&#x27;s environment, and only the scores and labels such as model version and site are sent to the vendor&#x27;s platform. Exporting scores in aggregate or minimized form, without patient or clinician identifiers, reduces what the vendor holds. A score is not automatically free of patient data, because scores combined with detailed timestamps or identifiers could still point to a patient. The network&#x27;s privacy controls and approval process should therefore confirm which fields may be exported. Because each score carries the model version, a drop after an update is visible the next day and can be compared with the baseline from the previous version.</p><p>Capturing full prompt and response text in traces would help engineers read failures, but it would place chart content with a vendor that is not approved to hold it, and access limits do not change that. Lower thresholds on latency, errors and tokens make existing alerts more sensitive to signals that did not move. Expanding the pre-release evaluation set is a useful later step, because production failures should become test cases. But a pre-release set runs only when a change is made and only on a fixed list of questions, and it already passed once while the quality of live answers was low. Offline evaluation and production monitoring cover different stages, and this incident showed that the production stage had no quality measurement.</p>","tip":"","reference":"Supplied Claude practice questions, question 2. Domain: Observability and Production Monitoring.","answerStatus":"source"},{"query":"Scenario: A regional hospital network runs a Claude assistant that drafts visit summaries and answers clinicians' questions from the network's clinical guidelines and each patient's chart. It is built on the Messages API with a retrieval pipeline over those documents. Every answer must cite its source. The assistant serves 4,000 clinicians at 30 sites, and patient data must stay under the network's privacy controls, including in logs and traces.\n\nQuestion: Clinicians at several sites report answers whose citation points to a guideline passage that does not support the statement. Each request currently produces one span with latency and token counts, exported to a hosted observability service that is not approved to hold patient data. Engineers cannot tell whether retrieval returned the wrong passages or the model cited the wrong one. Which instrumentation change should the team make?","type":"multiple-choice","options":[{"text":"Add a span for each pipeline stage in one trace, recording the IDs and scores of the retrieved passages and the IDs each answer cites, with no passage text.","explanation":"A span for each stage shows what retrieval returned and what the model cited, so engineers can compare the two lists and see which stage failed. Recording only IDs, scores and counts keeps chart text out of the hosted service, which is not approved to hold patient data. Engineers can read the passage text by looking up the IDs inside the network's own document store.","correct":true},{"text":"Turn on full content capture for the exported spans, so that each trace holds the prompt, the retrieved passages and the final answer text for comparison.","explanation":"Full content capture is a common debugging choice and would show the failing stage. However, the prompts and retrieved passages contain patient chart text, and the receiving service is not approved to hold patient data. After export, that text would be stored under the service's own retention and access rules, outside the network's privacy controls.","correct":false},{"text":"Keep the single request span and add a site attribute and a hashed clinician ID, so that the reported answers can be grouped by site without exposing identities.","explanation":"Grouping by site and by a hashed user ID is good practice that protects privacy, and it helps the team find where the reports are most common. It still leaves one span for the whole request, with no record of which passages were retrieved or cited. The engineers would still not know whether retrieval or the model caused a wrong citation.","correct":false},{"text":"Add a system prompt instruction that the model must list, in each answer, the retrieved passages it relied on and a confidence score for every citation it gives.","explanation":"This asks the model to report on its own behavior, and that report is not a measurement of what the pipeline did. It does not record the full set of passages that retrieval returned, so nobody would see a retrieval failure. A confidence score written by the model can be high even when the citation is wrong.","correct":false}],"answer":"<p>Correct answer: <strong>Add a span for each pipeline stage in one trace, recording the IDs and scores of the retrieved passages and the IDs each answer cites, with no passage text.</strong></p><p>A wrong citation can come from two different stages. Retrieval may return passages that do not support the statement. Or retrieval may return the right passage, and the model attaches the citation to a different one. One span for the whole request records only latency and token counts, so it cannot separate these two cases. The team needs one trace per request with a separate span for each stage: the search step, any reranking step, and the Messages API call.</p><p>The privacy constraint decides what the spans may contain. Chart text appears in the prompt, in the retrieved passages and in the answer. Once a span is exported, the data is held by the receiving service under that service&#x27;s retention and access controls, and this service is not approved to hold patient data. The spans should therefore contain metadata only: passage IDs that reveal no content, rank, score, index version, token counts, and the passage IDs that the answer cites. The IDs must not include patient names or record numbers. With these attributes, an engineer can compare two lists. If the ID of the supporting passage is missing from the retrieved list, retrieval failed. If that ID is present but the answer cites a different ID, the generation step failed. To read the text, the engineer looks up the IDs inside the network&#x27;s own document store, where the existing access controls and audit records apply.</p><p>Claude API tracing offers the same choice through its Metadata only and Full content content modes, and organizations under HIPAA restrictions export metadata only regardless of the mode. API spans are in their own traces by default, so the application should pass W3C trace context to place them under the same trace as the retrieval spans. See OpenTelemetry for the Claude API: API tracing and the OpenTelemetry overview.</p><p>The other approaches each help in some way, but they do not solve this problem. Full content capture would make the comparison easy, but it would put patient text in a service that may not hold it. A site attribute and a hashed clinician ID help to group the reports, but they add no information about the stages inside a request. An instruction that tells the model to list its passages and give a confidence score produces a self-report. A self-report does not record what retrieval returned, and it can be wrong in the same way as the citation.</p>","tip":"","reference":"Supplied Claude practice questions, question 3. Domain: Observability and Production Monitoring.","answerStatus":"source"},{"query":"Scenario: A regional hospital network runs a Claude assistant that drafts visit summaries and answers clinicians' questions from the network's clinical guidelines and each patient's chart. It is built on the Messages API with a retrieval pipeline over those documents. Every answer must cite its source. The assistant serves 4,000 clinicians at 30 sites, and patient data must stay under the network's privacy controls, including in logs and traces.\n\nQuestion: Since last week's release, which changed how requests are assembled, the cost per answer has risen by half. Usage metrics at all 30 sites show cache-read tokens near zero and cache-write tokens on almost every request, while traffic patterns are unchanged. Prompts contain chart excerpts, so the privacy rules do not allow request text in logs or traces. Which action should the team take first to find the cause?","type":"multiple-choice","options":[{"text":"Use cache diagnostics on consecutive requests in a sample of sessions, and read in each report where the prompt prefix stopped matching.","explanation":"With cache diagnostics, the API compares a request with an earlier one and reports where the prompt prefix diverged (stopped matching). It stores only hashes and token-count estimates, not prompt text, so the team can find the changed block without putting chart excerpts into logs or traces.","correct":true},{"text":"Set the cached prefix to use the longer cache lifetime, and check over the next day whether cache-read tokens return to the level seen before the release.","explanation":"A longer cache lifetime helps when entries expire between requests, but traffic patterns did not change and the drop started with a release that changed request assembly. If the prefix differs on every request, no later request matches the stored entry, however long the entry is kept. This change also does not show which part of the prompt changed.","correct":false},{"text":"Capture full request bodies in traces for a small sample of sessions, and compare consecutive prompts in the tracing backend to see where they differ.","explanation":"Comparing two full prompts would show the difference, and in many systems this is a normal debugging step. In this system, the prompts contain chart excerpts, and the privacy rules do not allow request text in logs or traces, so even a small sample breaks the rule.","correct":false},{"text":"Break down the cache-read and cache-write token metrics by site and by model, and add an alert that pages the on-call engineer when the read share falls.","explanation":"The metrics already show the same pattern at all 30 sites, so a breakdown by site or model adds no new information about the cause. An alert would tell the team sooner that cache reads have dropped, but it cannot show which block of the prompt stopped matching.","correct":false}],"answer":"<p>Correct answer: <strong>Use cache diagnostics on consecutive requests in a sample of sessions, and read in each report where the prompt prefix stopped matching.</strong></p><p>The team can check prompt-cache health with three usage fields on each response: cache_read_input_tokens, cache_creation_input_tokens, and input_tokens (the tokens after the last cache breakpoint). When writes appear on almost every request and reads are near zero, each request stores a new cache entry that no later request matches. Because traffic did not change and the drop began with a release that changed how requests are built, the likely cause is content inside the cached prefix that now differs from one request to the next, for example a timestamp, per-request context placed before the breakpoint, or tool-use JSON whose key order is not stable. The usage counters show that the prefix no longer matches. They do not show which block changed.</p><p>Cache diagnostics answers that second question. The API compares the current request with an earlier response, identified by its response ID, and reports where the prompt prefix diverged. It is available for the Messages API, which this assistant uses. For the comparison it stores only hashes and token-count estimates, not raw prompt content, so the chart excerpts in the prompts never enter a log or a trace. The feature is best-effort, so the team should run it on a sample of consecutive request pairs and not depend on a single comparison. See Cache diagnostics for the response format and limits, and API and data retention for how its retention behavior is classified.</p><p>The other actions each do something useful but do not find the cause within the stated limits. Capturing full request bodies and comparing them would show the difference, but it copies patient data into the tracing backend, which the privacy rules forbid. A longer cache lifetime fixes entries that expire between requests; it does nothing when every request writes a prefix that the next request does not repeat, and it gives no information about the changed block. A breakdown by site and model with an alert improves detection, but the pattern is already visible at every site, and detecting a problem does not find its cause. After the diagnostic report names the diverging block, the usual fix is to move the changing content after the cache breakpoint or make it stable, and then confirm with the same usage counters that cache reads have returned.</p>","tip":"","reference":"Supplied Claude practice questions, question 4. Domain: Observability and Production Monitoring.","answerStatus":"source"},{"query":"Scenario: A regional hospital network runs a Claude assistant that drafts visit summaries and answers clinicians' questions from the network's clinical guidelines and each patient's chart. It is built on the Messages API with a retrieval pipeline over those documents. Every answer must cite its source. The assistant serves 4,000 clinicians at 30 sites, and patient data must stay under the network's privacy controls, including in logs and traces.\n\nQuestion: The team screens each retrieved chart passage with a call to a small, fast model that returns a boolean \"injection_suspected\" verdict, then sends cleared passages to the assistant in tool result blocks. In a red-team test, a scanned referral letter containing hidden instructions altered a drafted visit summary. Traces show the letter's screening call ended with \"stop_reason\" set to \"refusal\", and the pipeline forwards any passage that lacks a verdict. Which change most directly closes this gap?","type":"multiple-choice","options":[{"text":"Add a system prompt policy stating that retrieved chart and guideline text is untrusted data and must not override the clinician's request.","explanation":"Stating that retrieved content is untrusted is recommended, and it helps the assistant treat embedded instructions with caution. This protection depends on the model's behavior. It also does not change the pipeline rule that forwards a passage when the screen gives no verdict.","correct":false},{"text":"Rewrite the screening prompt to judge only whether redirecting instructions are present, then re-measure its miss rate on labelled injected letters.","explanation":"Improving the prompt and measuring the miss rate helps when the screen returns a wrong verdict. In this test the screen returned no verdict, because the call was refused. A better prompt does not change the pipeline rule that forwards a passage with no verdict.","correct":false},{"text":"JSON-encode each passage with its source and document type before placing it in the tool result, which gives the letter text unambiguous delimiters.","explanation":"JSON encoding gives untrusted text clear delimiters (markers for where the text starts and ends) and is a recommended practice for tool results. It lowers the chance that embedded text is read as an instruction. The letter would still reach the assistant unscreened whenever the screening call is refused.","correct":false},{"text":"Treat a screening response whose \"stop_reason\" is \"refusal\" as a suspected injection, and return an error or a cleaned summary in the tool result.","explanation":"The traces show that the screen produced no verdict because the screening model declined the request, and the pipeline treated the missing verdict as a pass. Treating a refusal as a suspected injection makes the control fail closed, which means it blocks when it cannot decide. The raw letter text is then replaced by an error or a cleaned summary before the assistant reads it.","correct":true}],"answer":"<p>Correct answer: <strong>Treat a screening response whose &quot;stop_reason&quot; is &quot;refusal&quot; as a suspected injection, and return an error or a cleaned summary in the tool result.</strong></p><p>A screening step is a guardrail only if the application handles every result the screen can produce. The hospital team&#x27;s screen has three possible results: a verdict of false, a verdict of true, and no verdict. The pipeline handled the first two and forwarded the passage in the third case. A control that allows content when it cannot decide is called fail-open. A control that blocks in that case is called fail-closed. For untrusted documents that can change a clinical summary, the screen must fail closed.</p><p>The missing verdict has a specific cause. The screening model runs safety classifiers that can decline the screening request itself. When that happens, the call does not raise an API error. It returns normally with stop_reason: &quot;refusal&quot; and without the JSON object the code expects. Content that causes the screening model to refuse is more likely to be harmful, not less, so it is the content the pipeline should block. Anthropic&#x27;s guidance is to treat a refused screening call the same way as injection_suspected: true: return an error or a cleaned summary in the tool_result block instead of the raw content, and consider telling the user that a document was withheld. See Mitigate jailbreaks and prompt injections. The team should also count these refusals separately from errors in its monitoring, as described in Handle streaming refusals, so that a rise in refused screens is visible.</p><p>The other three changes are all recommended practices for indirect prompt injection, and each is useful as an additional layer. None of them removes the cause that the traces show. Rewriting the screening prompt and measuring its miss rate is the correct response when the screen returns false for an injected document. That did not happen in this test, because the screen returned nothing. JSON-encoding the passage gives the untrusted text clear delimiters, and a system prompt policy tells the assistant that retrieved text is data and not a command. Both make an injection less likely to succeed, but both depend on how the model reads the content. The scanned letter would still be forwarded unscreened each time the screening call is refused.</p><p>When a guardrail fails, first read the trace to find which code path the request took, and only then change the guardrail. If the classifier gave a wrong answer, tune the classifier. If the classifier gave no answer and the request passed anyway, fix the application code that handles the missing answer.</p>","tip":"","reference":"Supplied Claude practice questions, question 5. Domain: Runtime Guardrails and Production Security.","answerStatus":"source"},{"query":"Scenario: A regional hospital network runs a Claude assistant that drafts visit summaries and answers clinicians' questions from the network's clinical guidelines and each patient's chart. It is built on the Messages API with a retrieval pipeline over those documents. Every answer must cite its source. The assistant serves 4,000 clinicians at 30 sites, and patient data must stay under the network's privacy controls, including in logs and traces.\n\nQuestion: The platform team added the server-side \"fallbacks\" parameter, expecting a second model to serve any request the primary model could not. During 25 minutes of overloaded errors last week, traces show the SDK's retries all failed and clinicians at every site received errors, with no fallback attempt. Two requests the primary model declined that week were served by the second model. Which change best keeps the assistant answering during the next overload?","type":"multiple-choice","options":[{"text":"Alert on the overloaded error rate and page the on-call engineer, who changes the primary model in the assistant's configuration by hand during the incident.","explanation":"Alerting on the error rate is useful, and the team should have it. But a person needs several minutes to receive the page, check the cause and change the configuration. During that time, clinicians at all 30 sites receive errors. An automatic switch in the client removes that delay.","correct":false},{"text":"Handle overloaded errors in the client: after a brief backoff, a circuit breaker sends requests to an approved second model or platform.","explanation":"The traces show two different failure types. Declined requests are the only case that the server-side fallback covers, and the second model served them. Overloaded errors are returned to the caller unchanged. Client code must therefore detect overloaded errors and send the requests to another approved target. A circuit breaker stops each request from first waiting on a primary model that is still failing.","correct":true},{"text":"Raise the SDK's \"max_retries\" value and widen the backoff window so that each request keeps trying until the primary model accepts it again.","explanation":"More retries help when an overload lasts a few seconds. Last week's overload lasted 25 minutes, so each request would wait a long time and many would still fail, and the extra retries add load to a model that is already overloaded. A clinician during a patient visit cannot wait that long for an answer.","correct":false},{"text":"Extend the server-side \"fallbacks\" list with two more models, and alert when a response shows that a fallback model produced the answer.","explanation":"Server-side fallback is triggered only when a safety classifier declines a request. A longer list gives more alternatives for declined requests, but an overloaded error on the primary model is still returned as it is, so the next overload would have the same result. The alert would also never be triggered during an overload, because no fallback model would be used.","correct":false}],"answer":"<p>Correct answer: <strong>Handle overloaded errors in the client: after a brief backoff, a circuit breaker sends requests to an approved second model or platform.</strong></p><p>Server-side fallback and availability failover are two different mechanisms. The beta fallbacks parameter on the Messages API retries a request on another model only when a safety classifier declines it. A declined request is a normal HTTP 200 response with stop_reason: &quot;refusal&quot;. Rate limits, overloaded errors and other server errors on the requested model are returned to the caller as they are. The traces match this behavior: the two declined requests were served by the second model, and the overloaded errors reached clinicians with no fallback attempt. See Refusals and fallback.</p><p>Overloaded errors must be handled in client code. The official SDKs already retry connection errors, rate limits and 5xx server errors twice by default with exponential backoff, which is enough for an overload that lasts a few seconds. For a 25-minute overload the team needs two more parts. The first is a client-side fallback: when retries fail with an overloaded error, the client sends the request to a second model or a second platform. The second is a circuit breaker: a component that counts recent failures and, after a set number, stops sending requests to the failing target for a period and sends them directly to the fallback. Without a circuit breaker, every request from 4,000 clinicians would first wait through its own retries on the primary model. The circuit breaker later sends a few test requests to the primary model and returns traffic to it when they succeed. See Errors.</p><p>The team should choose and test the fallback target before the next incident. Patient data must stay under the network&#x27;s privacy controls, including in logs and traces, so the second model or platform needs the same approval as the primary one. Every answer must cite its source, so the team should confirm that the fallback request works with citations and with every other feature the request uses. Platforms differ in what they support. For example, Amazon Bedrock does not support the server-side fallbacks parameter, so a request sent there must leave it out and handle declined requests in client code.</p><p>The other choices each improve something but do not fix the cause. A longer fallbacks list helps only with declined requests, and an alert on fallback use would not be triggered during an overload. A higher max_retries value makes each request wait longer and adds load to a model that is already overloaded. Paging an engineer to change the configuration by hand is a useful extra step, but clinicians receive errors until that person acts.</p>","tip":"","reference":"Supplied Claude practice questions, question 6. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: A regional hospital network runs a Claude assistant that drafts visit summaries and answers clinicians' questions from the network's clinical guidelines and each patient's chart. It is built on the Messages API with a retrieval pipeline over those documents. Every answer must cite its source. The assistant serves 4,000 clinicians at 30 sites, and patient data must stay under the network's privacy controls, including in logs and traces.\n\nQuestion: The network's platform team reviews 200 guideline answers that clinicians marked as wrong. First-stage search combines BM25 and embedding results with rank fusion, returns 150 candidates, and passes the 10 highest-ranked passages to Claude. In 170 cases, the correct passage was among the 150 candidates but not among those 10, and the answer cited a related passage. Which change best addresses the cause?","type":"multiple-choice","options":[{"text":"Raise the first-stage candidate count from 150 to 300, and keep passing the 10 passages with the highest fused rank to Claude.","explanation":"A larger candidate set helps when the correct passage is missing from the candidates, but in 170 of the 200 cases it was already among the 150. The order of the top 10 by fused rank stays the same, so Claude would still receive the related passage and not the correct one.","correct":false},{"text":"Split the guidelines into smaller chunks with more overlap, then rebuild the embedding index and the BM25 index from them.","explanation":"Chunk size and overlap do affect retrieval quality, and this change could help the 30 cases where first-stage search missed the passage. In the other 170 cases, the chunk with the correct passage was already retrieved, so the evidence points to the selection of the top 10, not to how the documents were indexed.","correct":false},{"text":"Add a reranking step that scores the 150 candidates against the question, and pass the 10 highest-scoring passages to Claude.","explanation":"In 170 of the 200 cases, first-stage search already found the correct passage, and the passage was lost when the pipeline kept only 10 candidates by fused rank. A reranker scores each candidate together with the question, so the most relevant passages are more likely to be among the 10 that Claude receives. This changes the stage where the passage was lost.","correct":true},{"text":"Add a system prompt instruction that tells Claude to say when the supplied passages do not contain enough information to answer.","explanation":"Allowing Claude to say that it lacks enough information is good grounding practice and can reduce confident wrong answers. It does not give Claude the correct passage, so the best result is that the clinician gets no answer, and a related passage that looks relevant may still lead to a wrong answer.","correct":false}],"answer":"<p>Correct answer: <strong>Add a reranking step that scores the 150 candidates against the question, and pass the 10 highest-scoring passages to Claude.</strong></p><p>A retrieval pipeline has several stages, and a wrong answer can start at any of them. Indexing decides how documents are split into chunks and embedded. First-stage search returns a wide set of candidates. Selection decides which few candidates are given to Claude. Generation is the step where Claude writes the answer and cites a passage. To find the failing stage, the team checks where the correct passage was lost. Was it in the candidate set? Was it in the passages given to Claude? Did the answer use it?</p><p>The review answers these questions. In 170 of the 200 wrong answers, the correct passage was among the 150 candidates, so indexing and first-stage search worked for those questions. The passage was lost when the pipeline kept only the 10 candidates with the highest fused rank. Rank fusion combines the positions from the BM25 list and the embedding list. It does not read the question and a passage together. A reranker does this: it takes the question and each candidate, gives each pair a relevance score, and the pipeline keeps the passages with the highest scores. Anthropic&#x27;s guidance describes the same pattern: retrieve a wide set (150 in its example), rerank, and pass a smaller set to the model. See Contextual Retrieval. The Embeddings page lists reranker models that a team can call for this step.</p><p>Reranking adds latency and cost to every question, and that matters for a service with 4,000 clinicians. The team should run its evaluation set before release and measure how often the correct passage reaches the final 10, together with the added response time.</p><p>The other changes act on stages that the evidence does not point to. A larger candidate count improves recall (how often the correct passage is found at all), but the passage was already found, and the same 10 passages would still be selected. New chunk sizes and overlap change the index. That may help the 30 cases where first-stage search missed the passage, but it does not explain the 170. An instruction that lets Claude say it lacks enough information is good practice for grounding, but the correct passage is still missing from the prompt, and a related passage can look like a complete answer.</p><p>The citations in the wrong answers also show something important. A citation points to text that Claude was given, so it shows that the answer is based on a supplied passage. It does not show that the pipeline supplied the right passage. See Citations. For this reason, a team that requires a source on every answer still needs to measure retrieval quality stage by stage.</p>","tip":"","reference":"Supplied Claude practice questions, question 7. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: A payments company runs a Claude agent, built on the Agent SDK, that investigates and decides card disputes. It gathers transaction records and merchant evidence through internal tools and a card-network API with strict rate limits. It issues refunds below a set amount on its own; larger refunds need a human analyst's approval. A dispute can stay open for days, and every action must be traceable for regulators.\n\nQuestion: On the 27th of the month, the dispute agent stopped completing investigations. Traces show every Claude API call returning a 429 with no \"retry-after\" header and the error code \"enforced_spend_limit_reached\". The team's retry wrapper, which backs off and retries every 429, has been retrying for six hours, and nobody was alerted. Which change best improves how the agent handles this failure?","type":"multiple-choice","options":[{"text":"Branch on the 429 error code: for the code shown in the traces, hold traffic at the level where calls succeed, then raise it by one step per minute while open disputes wait.","explanation":"Holding traffic where calls succeed and raising it slowly is the right response to a ramp limit, which the API returns after a sharp rise in usage and marks with a different error code. The traces show the spend-limit code and every call is rejected, so there is no traffic level at which calls succeed. This change also does not tell anyone that the agent has stopped working.","correct":false},{"text":"Route investigations that receive a 429 to a smaller model tier in the same API organization, reducing the tokens each dispute consumes until errors stop.","explanation":"A cheaper model lowers the cost of each dispute, which could help before the limit is reached. Once the organization's spend limit is enforced, requests to another model under the same organization are rejected in the same way, so the fallback also returns 429 responses.","correct":false},{"text":"Lower the agent's concurrency, add jitter to the backoff, and alert the on-call engineer when request or token rates near the per-minute limits.","explanation":"Lower concurrency, jitter, and rate alerts are good practice for ordinary rate limits, where requests or tokens per minute are too high. The traces show a spend limit, which rejects calls at any request rate. This change would not let even one call succeed, and its alert would not be triggered.","correct":false},{"text":"Branch on the 429 error code: for the code shown in the traces, stop retrying, pause new investigations while leaving disputes open, and page the on-call engineer.","explanation":"The error code and the missing retry-after header show a spend limit, not a short-term rate limit, so waiting inside a retry loop will not make the calls succeed. Stopping the retries, pausing new work, and paging a person is the correct response to this failure. Disputes can stay open for days without harm, and only a person can restore access to the API.","correct":true}],"answer":"<p>Correct answer: <strong>Branch on the 429 error code: for the code shown in the traces, stop retrying, pause new investigations while leaving disputes open, and page the on-call engineer.</strong></p><p>An HTTP 429 from the Claude API does not always mean the same thing. An ordinary rate limit means the organization sent too many requests or tokens in a minute. That response includes a retry-after header, and waiting that long usually lets the next attempt succeed. A spend limit also returns a 429, but it has no retry-after header and keeps failing until access resumes. On the Messages API, the field error.details.error_code with the value enforced_spend_limit_reached separates this case from ordinary rate limiting.</p><p>Retry with backoff is only useful for failures that end without anyone acting. The team&#x27;s wrapper treats every 429 as that kind of failure, which is why it retried for six hours without success and without telling anyone. The fix is to classify the error before choosing a response. Rate-limit 429s keep the backoff handling. The spend-limit code gets different handling: stop retrying, stop starting new investigations, and page a person, because only a person can raise the limit or decide to wait until access resumes. This is a form of graceful degradation, which means the system reduces what it does in a controlled way when a dependency is unavailable. It is safe for this agent because a dispute can stay open for days. The pause can also be recorded in each dispute&#x27;s trace, so the delay can be explained to regulators.</p><p>The other changes each help with a different problem. Lower concurrency, jitter, and alerts on per-minute rates are the right response to ordinary rate limits, but a spend limit rejects calls at any rate. Holding traffic at the level where calls succeed and raising it by at most one step per minute is the guidance for a ramp limit, a 429 that follows a sharp rise in usage and carries the code ramp_limit_exceeded. The traces show a different code, and no call succeeds at any traffic level, so there is no traffic level to hold or raise. A smaller model tier lowers the cost per dispute before a limit is reached, but once the organization&#x27;s spend limit is enforced, a different model under the same organization is rejected too. The official SDKs already retry rate limits and server errors a small number of times and follow retry-after when it is present, so custom retry logic should add classification, not more attempts. See Errors and Rate limits for the details of each 429 type.</p>","tip":"","reference":"Supplied Claude practice questions, question 8. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: A payments company runs a Claude agent, built on the Agent SDK, that investigates and decides card disputes. It gathers transaction records and merchant evidence through internal tools and a card-network API with strict rate limits. It issues refunds below a set amount on its own; larger refunds need a human analyst's approval. A dispute can stay open for days, and every action must be traceable for regulators.\n\nQuestion: During a red-team exercise, hidden text in a receipt uploaded by a cardholder makes the dispute agent settle one large dispute through several partial refunds to the original card. Each refund is below the set amount, so no analyst reviews the case. The team already screens uploaded documents with a small classifier model, but reworded payloads passed the screen in some runs. Which control most directly closes this exploit path?","type":"multiple-choice","options":[{"text":"Lower the set amount below which the dispute agent refunds on its own, and add a system prompt rule that forbids splitting one dispute into several partial refunds.","explanation":"A lower amount makes each automatic refund smaller, but the agent can still reach the same total with more partial refunds. The system prompt rule depends on the model following it while it reads hostile text written by an attacker, so it is not an enforced limit. The analyst approval can still be avoided.","correct":false},{"text":"Restrict the refund tool in code so that it pays only to the card on the disputed transaction, and reject any call that names a different card or account.","explanation":"Fixing the destination in code is a good deterministic control against an injection that sends money to an attacker's account. In the red-team result, every partial refund already went to the original card, so this check would allow all of them. It does not address the missing analyst approval.","correct":false},{"text":"Enforce in the refund tool's code a running total of refunds for each dispute, and hold any refund that takes the total above the set amount for analyst approval.","explanation":"The attack works because the approval limit is checked for each refund call, while the business rule is about the whole dispute. A running total kept in code outside the model applies the limit to the dispute, so splitting a large refund into small parts no longer avoids analyst review. The check gives the same result whatever the hidden text says.","correct":true},{"text":"Add the red team's reworded payloads as examples in the screening classifier's prompt, and block any uploaded document that the classifier flags from reaching the dispute agent.","explanation":"Better examples will help the screen detect more of the known payloads, and screening is a useful layer of defense. The screen is still a model-based filter, and the exercise already showed that new wording can pass it. A document that passes can still make the agent split the refund, because nothing in code stops the split.","correct":false}],"answer":"<p>Correct answer: <strong>Enforce in the refund tool&#x27;s code a running total of refunds for each dispute, and hold any refund that takes the total above the set amount for analyst approval.</strong></p><p>The receipt is third-party content that the agent reads while it works, so the hidden text is an indirect prompt injection. The injected text did not need a new tool or a new destination. It used the refund tool the agent is already allowed to call, several times. The weakness is in how the approval rule is enforced: the limit is checked for each call, but the business rule is about the whole dispute. An agent with permission to move money, where the limit can be avoided by repeating a small action, is also an example of the excessive agency risk category.</p><p>The fix is to enforce the rule where the model cannot change it. In an Agent SDK system, the refund tool&#x27;s own handler or a PreToolUse hook can do this. The code reads the total already refunded for the dispute from a durable store, adds the requested amount, and holds the call for an analyst if the result is above the set amount. The total must be stored outside the conversation, because a dispute can stay open for days and continue across sessions. Each hold and each approval can be written to the audit record, which supports the requirement that every action is traceable. The Claude Code permissions documentation makes the same distinction: instructions shape what Claude attempts, while permission rules and hooks decide what runs.</p><p>This control has a limit. An injected document can still influence a refund when the dispute total stays under the set amount. For that reason the other layers described in Mitigate jailbreaks and prompt injections still matter: passing untrusted content only in tool results, screening tool output with a small model, least privilege, red-team tests before each release, and monitoring.</p><p>The other choices each improve something but do not remove the cause. Fixing the destination card in code is a good deterministic control, but the refunds in this exercise already went to the original card. Adding the red team&#x27;s payloads to the classifier makes the screen better against known wording, but the exercise showed that new wording can pass a model-based screen. Lowering the amount only makes each part smaller, so the agent needs more partial refunds to reach the same total, and a system prompt rule against splitting is an instruction that the model may not follow when it reads hostile text.</p>","tip":"","reference":"Supplied Claude practice questions, question 9. Domain: Runtime Guardrails and Production Security.","answerStatus":"source"},{"query":"Scenario: A payments company runs a Claude agent, built on the Agent SDK, that investigates and decides card disputes. It gathers transaction records and merchant evidence through internal tools and a card-network API with strict rate limits. It issues refunds below a set amount on its own; larger refunds need a human analyst's approval. A dispute can stay open for days, and every action must be traceable for regulators.\n\nQuestion: Three months of traces show that 68 percent of disputes are duplicate-charge or cancelled-subscription claims. In 97 percent of those runs the dispute agent calls the same four tools in the same order; in the rest it makes extra card-network calls and sometimes reaches a different decision on identical evidence. The other disputes take widely varying paths, and analysts rate those decisions highly. Which architecture change best fits this data?","type":"multiple-choice","options":[{"text":"Classify each dispute at intake, run the two predictable types through a fixed coded sequence of tool calls, and keep the agent loop for the other types.","explanation":"The traces show two groups with different needs. The two predictable claim types already follow one tool sequence, so a coded path makes the same calls in every run and uses a known number of card-network requests. The other disputes need steps that depend on the evidence found, so the agent loop is still the right design for them.","correct":true},{"text":"Replace the agent loop with a fixed coded sequence of tool calls for every dispute type, and add a coded branch for each pattern of merchant evidence seen so far.","explanation":"A coded path for every dispute type would make the predictable claims consistent, but the other disputes take paths that depend on what the merchant evidence shows. A branch for each pattern seen so far cannot handle a new pattern. It would also replace the part of the system that analysts already rate highly.","correct":false},{"text":"Keep the agent loop for every dispute, and add the standard four-tool order to the system prompt as the required sequence for the two predictable types.","explanation":"A required order in the system prompt would probably reduce the number of runs that do not follow the order, but the model still chooses each step, so some runs can still differ. Refund decisions that regulators review need an order that code enforces. This option also keeps the full cost of the agent loop for claims that do not need it.","correct":false},{"text":"Change the single agent into a lead agent with subagents that each gather evidence from one source in parallel, each in a separate context window.","explanation":"Subagents are useful when a task has many independent directions to explore or more information than one context window can hold. The predictable claims need only four tool calls in a known order, so subagents would add token cost and more parallel requests against the rate-limited card-network API. They would not make decisions on identical evidence more consistent.","correct":false}],"answer":"<p>Correct answer: <strong>Classify each dispute at intake, run the two predictable types through a fixed coded sequence of tool calls, and keep the agent loop for the other types.</strong></p><p>Anthropic&#x27;s guidance separates two kinds of system by what controls the steps. In a workflow, code decides the order of model calls and tool calls. In an agent, the model decides its own next step and which tool to use. Neither design is better in general. The guidance is to use the simplest design that works and to add agentic behavior only where it measurably improves results, because an agent loop usually costs more and takes longer than a fixed path. See Building effective agents.</p><p>The traces give the team the data needed to apply that rule. For duplicate-charge and cancelled-subscription claims, the agent already follows one four-tool sequence in almost every run. Letting the model choose the steps adds no value for these claims. It only adds risk: in a few runs the agent makes extra calls against the rate-limited card-network API and decides differently on the same evidence. That is a serious problem when the decision is a refund and regulators must be able to follow each action. A coded sequence makes the same calls in the same order every time and uses a known number of card-network requests. The decision step can then be a small, fixed check, which is much easier to test and audit than a full agent run. A fixed path does not by itself guarantee identical decisions if a model still makes the final judgment, but it removes the variation in which steps are taken.</p><p>The other disputes are different. Their paths depend on what the merchant evidence shows, so the steps cannot be listed in advance, and analysts already rate these decisions highly. This is the kind of task where an agent loop is useful. The routing pattern joins the two designs: a classification step at intake sends each dispute to the path that fits it. Routing works when the categories can be classified accurately, and a dispute normally arrives with a stated reason, so its type is usually clear at intake.</p><p>Each of the other approaches fixes only part of the problem or creates a new one. Moving every dispute type to coded paths makes the simple claims consistent, but a list of branches written from past evidence patterns fails when a new pattern appears, and it removes the agent from the disputes where it performs well. Writing the four-tool order into the system prompt is an instruction, not an enforced control: the model will follow it in most runs, but it can still deviate, and the team still pays for an agent loop on claims that never needed one. A lead agent with subagents is designed for broad tasks with many independent directions or more information than one context window can hold. A four-call claim is not that kind of task, and multi-agent systems use many more tokens and would send more parallel requests to an API that already has strict limits.</p>","tip":"","reference":"Supplied Claude practice questions, question 10. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: A payments company runs a Claude agent, built on the Agent SDK, that investigates and decides card disputes. It gathers transaction records and merchant evidence through internal tools and a card-network API with strict rate limits. It issues refunds below a set amount on its own; larger refunds need a human analyst's approval. A dispute can stay open for days, and every action must be traceable for regulators.\n\nQuestion: The team moved the dispute agent to an autoscaled container pool that removes idle containers overnight. Since then, when an analyst approves a large refund a day or two after the agent requested it, the approval handler passes the stored session ID to \"resume\", but the agent starts with none of the dispute's history and repeats its evidence requests to the card-network API. Which change best fixes this failure?","type":"multiple-choice","options":[{"text":"Cache card-network API responses in a shared store keyed by dispute ID, so that repeated evidence requests are answered without new calls to the card network.","explanation":"A shared cache would reduce repeated calls to the rate-limited card-network API. The agent would still start with no record of its earlier tool calls, its reasoning, or the refund it asked the analyst to approve. It would repeat the investigation in a new, unconnected session, which also makes the dispute harder to trace for regulators.","correct":false},{"text":"Mirror session transcripts to durable shared storage through a \"SessionStore\" adapter, and resume each dispute by its stored session ID from the same working directory.","explanation":"The Agent SDK writes each session transcript to the local disk of the container that runs the agent, and resume needs that transcript to exist on the current machine. When the pool removes the idle container, the transcript is lost. A SessionStore adapter mirrors (copies) the transcript to durable storage, so any container can load the dispute's history. The working directory must match because the store's project key is derived from it.","correct":true},{"text":"Enable file checkpointing, store a checkpoint ID with each approval request, and rewind to that checkpoint on the new container before calling \"resume\" with the session ID.","explanation":"File checkpointing tracks file changes made through the Write, Edit and NotebookEdit tools and restores those files on disk. It does not store or restore conversation history, and a checkpoint belongs to the session that created it. It cannot bring back a transcript that was on a container the pool has removed.","correct":false},{"text":"Route every request for a dispute to one container by consistent hashing on the session ID, so that the approval reaches the container that wrote the transcript.","explanation":"Pinning a session to one container, so that all its requests go there, is a valid practice while that container keeps running. In this scenario the pool removes idle containers overnight and approvals arrive a day or two later. The pinned container and its local transcript no longer exist when the approval arrives, so routing alone cannot restore the history.","correct":false}],"answer":"<p>Correct answer: <strong>Mirror session transcripts to durable shared storage through a &quot;SessionStore&quot; adapter, and resume each dispute by its stored session ID from the same working directory.</strong></p><p>An Agent SDK session is the conversation history: the prompt, every tool call, every tool result and every response. The SDK writes this transcript as a JSONL file on the local disk of the machine that runs the agent, and resume with a session ID only works when that file exists on the current machine. On an autoscaled pool (a pool that adds and removes containers as load changes), local disk is lost when a container is removed, restarted or replaced. A dispute that waits one or two days for an analyst will often last longer than the container that started it. The handler then calls resume on a container that has no transcript for that ID, and the agent begins with an empty history.</p><p>The fix is to make the transcript independent of any single container. A SessionStore adapter mirrors transcript entries to durable storage, such as an object store or a database, and loads them back in the same order on whichever container handles the next request. The handler still passes the stored session ID to resume. The store&#x27;s project key is derived from the working directory, so the resuming container should run from the same working directory. With the history restored, the agent knows which evidence it already gathered and which refund it asked the analyst to approve. It does not need to call the card-network API again, and the dispute remains one continuous session that regulators can follow. See Work with sessions and Session storage.</p><p>The other changes each improve something but do not restore the lost history. Consistent hashing is a routing method that always sends the same key to the same container. It keeps a session on the container that holds its transcript, but only while that container exists, and this pool removes idle containers during the wait for approval. A shared cache for card-network responses lowers the pressure on the rate limit, but the agent still restarts the investigation with no memory of its earlier steps, and its new conclusion may differ from the one the analyst approved. File checkpointing is a different feature. Sessions persist the conversation and not the filesystem. Checkpointing does the opposite: it restores files that were changed through the Write, Edit and NotebookEdit tools and leaves the conversation unchanged, as described in Rewind file changes with checkpointing.</p>","tip":"","reference":"Supplied Claude practice questions, question 11. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: A payments company runs a Claude agent, built on the Agent SDK, that investigates and decides card disputes. It gathers transaction records and merchant evidence through internal tools and a card-network API with strict rate limits. It issues refunds below a set amount on its own; larger refunds need a human analyst's approval. A dispute can stay open for days, and every action must be traceable for regulators.\n\nQuestion: Open disputes tripled this week, so the team raised the number of parallel dispute agent sessions from 50 to 200. Traces show no 429 errors from the Claude API, but one in three card-network tool calls now fails with a rate-limit error. Each session retries on its own, and the average dispute now uses twice as many model turns. Which change best improves throughput?","type":"multiple-choice","options":[{"text":"Request higher Claude API rate limits from Anthropic, and give the dispute agent its own workspace with a custom rate limit for the 200 parallel sessions.","explanation":"Higher limits are a good step when the Messages API returns 429 errors, but the traces show none, so the Claude API is not the limit that slows the work. A workspace limit also only caps what a workspace may use; it does not add capacity. The card-network API would still reject the same share of calls.","correct":false},{"text":"Raise the retry count in each session and widen the exponential backoff window with jitter, so that more card-network calls succeed before a session gives up.","explanation":"Wider backoff in each session reduces how often retries collide, but each session still learns about the limit only by failing. The total demand from 200 sessions stays above the network's quota, and each rejected call can still cost a model turn. More retries also add more failed attempts to the trace without adding capacity.","correct":false},{"text":"Move the evidence-gathering steps to the Message Batches API, since a dispute can stay open for days and batch requests cost less than synchronous ones.","explanation":"The Message Batches API lowers the price of Claude requests that do not need an immediate answer, and its limits are separate from the Messages API limits. It does not change how many calls the card network accepts per minute, and the agent still needs the same evidence from that API. The cost problem in the traces comes from failed tool calls and the extra model turns they cause, not from the synchronous price.","correct":false},{"text":"Send every card-network call through one shared rate limiter set to the network's quota, so that sessions wait in a queue instead of failing and retrying.","explanation":"The traces show that the card-network quota is the limit that is being reached, and 200 sessions that cannot see each other's calls keep exceeding it. One shared limiter counts all calls in one place and releases them at a rate the network accepts, so calls succeed on the first attempt and the extra model turns spent on failed calls stop. Waiting in a queue is acceptable because a dispute can stay open for days.","correct":true}],"answer":"<p>Correct answer: <strong>Send every card-network call through one shared rate limiter set to the network&#x27;s quota, so that sessions wait in a queue instead of failing and retrying.</strong></p><p>The first step in any throughput problem is to find which limit is being reached. The traces answer this: the Claude API returns no 429 errors, and the card-network API rejects one in three calls. The binding constraint (the limit that stops more work from finishing) is the card network&#x27;s quota, not Claude&#x27;s requests per minute, input tokens per minute or output tokens per minute.</p><p>Raising the session count from 50 to 200 increased demand on a dependency whose capacity did not change. Each session sees only its own calls, so it cannot know that the other 199 sessions are using the same quota. When a call is rejected, the error goes back to the model as a tool result, the model spends another turn deciding to try again, and the retry competes with the retries of every other session. This explains why the number of model turns per dispute doubled: the company pays for Claude tokens that produce no progress.</p><p>A shared rate limiter fixes this because it is one place that counts all calls against the network&#x27;s quota. Calls wait in a queue and are released at a rate the network accepts, so they succeed on the first attempt. This is backpressure: when a downstream system is at capacity, the upstream work is slowed instead of being sent and rejected. Waiting is acceptable for this workload because a dispute can stay open for days. The control is also deterministic: it runs in the tool layer and does not depend on the model choosing to wait. The trace kept for regulators becomes easier to read too, because it records successful calls and not long chains of failed attempts.</p><p>The other changes each address a limit that the evidence does not show. Higher Claude API limits and a custom workspace limit are useful when the Messages API returns 429 errors, as described in Rate limits, but no such errors appear in the traces. The Message Batches API lowers the price of Claude requests that do not need an immediate response, and its limits are separate from the Messages API limits, but the agent would still need the same number of card-network calls. More retries with wider backoff inside each session reduce collisions a little, but total demand stays above the quota and each failed call can still cost a model turn.</p>","tip":"","reference":"Supplied Claude practice questions, question 12. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: A payments company runs a Claude agent, built on the Agent SDK, that investigates and decides card disputes. It gathers transaction records and merchant evidence through internal tools and a card-network API with strict rate limits. It issues refunds below a set amount on its own; larger refunds need a human analyst's approval. A dispute can stay open for days, and every action must be traceable for regulators.\n\nQuestion: The team released a new system prompt with a new version of the internal evidence tools that renames several required input fields. The release passed the evaluation suite, which runs each test dispute from start to finish on one version. Traces show that disputes opened before the release reuse the old field names when they resume and fail validation, and some were decided with incomplete evidence. Which change best prevents this in future releases?","type":"multiple-choice","options":[{"text":"Add a section to the new system prompt t
