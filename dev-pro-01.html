nthropic&#x27;s evaluation guidance also treats latency as one of several measurable success criteria that a team should define for its own use case: Define success criteria and build evaluations.</p><p>Lowering the threshold of the platform-wide alert keeps the same wrong measurement. The percentile still reflects the large customers, and a threshold taken from the strictest contract can trigger for replies that are within their own customers&#x27; limits, which produces false alerts without showing which customer is in breach. Splitting the alert by region helps when one region is slow, but the traces show slow chats in both regions, and the large customers still produce most of the traffic inside each region. An alert on 429 rate-limit errors and 529 overloaded errors is a good capacity signal (see Errors), but error rates were normal during these breaches, and an error count does not say whether a reply met a contract limit.</p>","tip":"","reference":"Supplied Claude practice questions, question 26. Domain: Observability and Production Monitoring.","answerStatus":"source"},{"query":"Scenario: A SaaS vendor sells a Claude-based support agent to about 900 business customers. Each customer has its own knowledge base, tone settings and monthly usage allowance, and each contract sets a maximum time to the first reply. A few large customers send most of the traffic. The agent runs on the Claude API in two cloud regions, and the platform team reports cost and quality for each customer.\n\nQuestion: To limit storage cost, the platform team keeps a uniform random 2 percent of request traces. The fleet-wide dashboard shows the 95th-percentile time to first reply inside every contract limit, but eleven small customers in both regions report breaches this month. The retained sample holds fewer than ten traces for most of them. Which change best lets the team find and measure the problem?","type":"multiple-choice","options":[{"text":"Keep the uniform 2 percent sample, turn on full content capture for retained traces, and have engineers read the twenty slowest traces each week to find causes.","explanation":"Reading traces with prompts and replies helps to explain why one request was slow. The slow requests from small customers are mostly missing from the 2 percent sample, so the engineers would mainly read traces from large customers. Reading twenty traces also does not give a count of breaches for each customer.","correct":false},{"text":"Raise the uniform sampling rate to 10 percent, add a 99th-percentile line to the fleet-wide dashboard, and alert when that line crosses the strictest contract limit.","explanation":"A fivefold increase in the uniform rate increases storage cost about five times, but most of the affected customers would still have fewer than fifty traces. The fleet-wide percentile is still decided by the large customers' traffic, whichever percentile is drawn. The alert measures the whole fleet and does not compare each customer with its own contract limit.","correct":false},{"text":"Sample by region with an equal number of traces kept for each region, keep every trace that ends in an error, and compare first-reply time by region.","explanation":"Equal sampling by region still lets the large customers supply most of each region's traces, so the small customers remain almost absent. The reports come from both regions and are about slow replies, which normally finish with a successful status. Keeping error traces and comparing regions therefore does not separate out the affected customers.","correct":false},{"text":"Sample by customer with a minimum number of traces kept for each one, keep every trace that breaches its contract limit, and compare first-reply time by customer.","explanation":"A uniform sample has the same customer mix as the traffic, so the few large customers supply most of it and each small customer has too few traces to measure. A guaranteed minimum per customer gives every customer enough data for its own percentile, and keeping every trace that is slower than the contract limit means no breach is discarded. Grouping first-reply time by customer then shows which customers are affected and by how much.","correct":true}],"answer":"<p>Correct answer: <strong>Sample by customer with a minimum number of traces kept for each one, keep every trace that breaches its contract limit, and compare first-reply time by customer.</strong></p><p>A uniform random sample keeps the same mix of customers as the traffic. On this platform a few large customers send most of the requests, so they also supply most of the retained traces and most of the data points behind any fleet-wide percentile. A customer with a small share of traffic can breach its contract on many of its requests, and the fleet-wide 95th percentile will hardly change. The evidence matches this pattern: the dashboard looks healthy, yet most of the eleven customers have fewer than ten retained traces, which is too few to calculate a percentile for any of them.</p><p>The fix has two parts. Stratified sampling means choosing the sample separately for each group, in this case each customer, with a guaranteed minimum for each group. Every customer then has enough traces for its own measurement. The second part is a rule based on the result: keep every trace whose first reply was slower than that customer&#x27;s contract limit. This rule can only be applied after the request has finished, because the latency is not known earlier. This is called tail-based sampling, and teams usually apply it in their own collector or application code. A decision made at the start of a request (head-based sampling) can set a different rate for each customer, but it cannot select slow requests. One detail of Claude API tracing matters for this design: the API reads the sampled flag in the request&#x27;s traceparent header and does not emit that request&#x27;s span, or the spans under it, when the flag is off (see Claude API tracing setup). A request that was sampled out at the start has no API-side spans to keep later.</p><p>With this data the team can do failure-cohort analysis. A cohort is a group of traces that share a property, such as &quot;breached the contract limit&quot;. The team groups the breaching traces by customer, region, model and other attributes, and compares them with the traces that met the limit. This shows what the slow requests have in common and how many customers are affected, which no single trace can show. Request spans carry attributes that support this grouping, such as the HTTP status, the stop reason and, for streamed responses, the time to the first chunk (see the span reference). Because the new sample is not uniform, the team should store the sampling rate with each trace so that fleet-wide totals can be weighted correctly.</p><p>The other changes each improve something but do not remove the cause. Sampling equally by region balances the two regions, but large customers still supply most of each region&#x27;s traces, and the complaints come from both regions. Keeping error traces also misses the problem, because a slow reply that completes has a successful status. A higher uniform rate with a 99th-percentile line and alert costs more storage and still reports one number for the whole fleet. Weekly reading of the slowest traces is a useful habit for finding causes, but the traces the team needs are mostly not in the sample, and reading does not produce a breach count for each customer. Full content capture is also not needed to measure latency, because timing and status are already in the default metadata-only mode.</p>","tip":"","reference":"Supplied Claude practice questions, question 27. Domain: Observability and Production Monitoring.","answerStatus":"source"},{"query":"Scenario: A state government agency offers residents a Claude assistant that explains benefit programs, such as food and housing support, and helps them fill in applications from documents they upload, such as payslips and letters. Agency caseworkers, the staff who handle each application, make every final decision. The agency must show auditors that applicants in the same situation are treated the same way.\n\nQuestion: After a red-team test in which hidden text in an uploaded letter changed a drafted application, the team added a call to a small, fast model that screens the text extracted from each upload, and the pipeline rejects any flagged document. Eight percent of uploads are now rejected. Caseworkers checked 300 rejected documents and found 280 genuine letters, mostly eviction notices with wording such as \"disregard the earlier notice\". Which change best addresses this problem?","type":"multiple-choice","options":[{"text":"Build a labeled set of real uploads and seeded injections, measure both error rates by document type, tune the screen against that set, and send flagged documents to caseworker review.","explanation":"The caseworker check shows that most rejected documents are genuine, so the screen has a high false-positive rate that is concentrated in eviction notices. A labeled set with real uploads and seeded injections lets the team reduce wrong flags while confirming that attacks are still caught, and the rates for each document type give auditors evidence about whether applicants are treated equally. Sending flagged documents to a caseworker means a wrong flag delays an application and does not reject a genuine letter.","correct":true},{"text":"Remove the screening call, and state in the system prompt that text from uploaded documents is untrusted data that must not change the assistant's task or its tool calls.","explanation":"Removing the screen stops the wrong rejections, but it also removes the check that was added after hidden text changed a drafted application. A system prompt policy about untrusted content is a useful layer of defense, but it depends on the model's behavior and gives the team no measured protection against that kind of text. The change replaces a false-positive problem with a false-negative risk.","correct":false},{"text":"Extend the red-team set with new seeded injections, measure the screen's miss rate by document type, add a phrase-matching second screen where misses appear, and keep rejecting flagged documents.","explanation":"Regular testing with seeded injections and a second detection layer are good practice when the evidence shows that attacks pass the screen. The caseworker check shows the opposite failure: 280 of 300 rejected documents were genuine letters. This change measures only missed injections, so wrong flags stay unmeasured, and a second screen can only add rejections of genuine letters.","correct":false},{"text":"Move the screening call to a larger, more capable model tier, keep rejecting every flagged document, and compare the new weekly rejection rate with the current eight percent.","explanation":"A larger model might flag fewer genuine documents, but the team cannot know that without labeled examples. A lower rejection rate can mean fewer false positives or more missed injections, and the rejection rate alone does not show which one happened. Every remaining wrong flag would still reject a genuine document.","correct":false}],"answer":"<p>Correct answer: <strong>Build a labeled set of real uploads and seeded injections, measure both error rates by document type, tune the screen against that set, and send flagged documents to caseworker review.</strong></p><p>A guardrail that screens content makes two kinds of mistake. A false positive is a genuine document that the screen flags. A false negative is an injected instruction that the screen misses. The caseworker check found 280 genuine letters among 300 rejected documents, so the main problem is false positives, and they are concentrated in one document type. Eviction notices often tell the reader to disregard an earlier notice, and that wording resembles an instruction aimed at the reader, which is what the screen is asked to detect.</p><p>The team cannot fix this by watching the rejection rate alone. The rejection rate falls when the screen makes fewer wrong flags, and it also falls when the screen misses more attacks. A labeled set separates these two cases. It should contain real uploads marked as genuine and documents with seeded injections, such as the hidden text from the red-team test. With that set, the team can measure both error rates for each document type, change the screening prompt (for example, by adding examples of normal letter wording), and confirm that the seeded injections are still caught. The numbers for each document type also support the agency&#x27;s audit duty. Residents who apply for housing support upload eviction notices more often than other applicants, so a screen that wrongly rejects those letters does not treat applicants equally.</p><p>The action taken on a flag is a separate design choice from the accuracy of the screen. Tuning reduces errors but does not remove all of them, so each wrong flag should cost the resident as little as possible. Anthropic&#x27;s guidance for screening tool output is to keep flagged content away from the model by returning an error or a cleaned summary, and to consider reporting the attempt to the user. A caseworker already handles every application in this system, so the pipeline can send the flagged document to that caseworker. The hidden text does not reach the assistant, and a genuine letter still counts toward the application. The same guidance recommends regular monitoring to refine validation and filtering over time. See Mitigate jailbreaks and prompt injections.</p><p>Each of the other approaches improves one thing but does not remove the cause. Testing the screen with new seeded injections and adding a second screen where misses appear is the right response when attacks pass the screen. That is not the failure the caseworkers found. This approach leaves wrong flags unmeasured, and a second screen can only flag more documents. Removing the screen ends the wrong rejections but leaves only a system prompt policy, which depends on the model&#x27;s behavior. Moving to a larger model might reduce wrong flags, but without labels the team cannot tell whether a lower rejection rate means better accuracy or more missed injections.</p>","tip":"","reference":"Supplied Claude practice questions, question 28. Domain: Runtime Guardrails and Production Security.","answerStatus":"source"},{"query":"Scenario: A state government agency offers residents a Claude assistant that explains benefit programs, such as food and housing support, and helps them fill in applications from documents they upload, such as payslips and letters. Agency caseworkers, the staff who handle each application, make every final decision. The agency must show auditors that applicants in the same situation are treated the same way.\n\nQuestion: The agency's quality team plans to have an LLM judge label each answer the assistant gives as consistent or inconsistent with program rules, and to report the monthly totals to auditors. On 600 answers that caseworkers also labeled, the judge matches their label 94 percent of the time. Caseworkers marked 42 answers inconsistent; the judge flagged 8, including 6 of those 42. Which action should the team take first?","type":"multiple-choice","options":[{"text":"Move the judge to a larger model tier with thinking turned on, and begin reporting its totals once agreement with the caseworkers' labels passes 96 percent.","explanation":"A stronger judge that reasons before it labels may improve the labels, but this plan still uses raw agreement to decide when to report. A judge can pass 96 percent raw agreement on this data and still miss most of the 42 inconsistent answers, so the team would not know whether the change fixed anything.","correct":false},{"text":"Run the judge three times on every answer and report the majority label, so that run-to-run variation does not change the totals that auditors receive.","explanation":"Majority voting reduces random differences between runs of the same judge. Missing 36 of 42 inconsistent answers is a systematic error, the same mistake in the same direction each time, so three runs would mostly repeat the same wrong label and the majority would keep it.","correct":false},{"text":"Extend the comparison to 6,000 caseworker-labeled answers sampled the same way, so that the 94 percent agreement figure has a narrower margin of error before auditors see it.","explanation":"A sample ten times larger makes the estimate of raw agreement more precise, but raw agreement is the wrong measure when one label covers 93 percent of the answers. The new sample would have the same uneven mix of labels, so the figure would stay high while the judge still missed most inconsistent answers.","correct":false},{"text":"Measure Cohen's kappa and the share of caseworker-marked inconsistent answers the judge catches, and report no judge totals to auditors until both are acceptable.","explanation":"Caseworkers marked 558 of 600 answers consistent, so a judge that labels almost everything consistent reaches about 94 percent agreement without finding the problem answers. Cohen's kappa removes the agreement expected by chance, and recall on the inconsistent answers (the share of them that the judge flags) shows the judge found only 6 of 42. Both numbers must be acceptable before auditors can rely on the judge's totals.","correct":true}],"answer":"<p>Correct answer: <strong>Measure Cohen&#x27;s kappa and the share of caseworker-marked inconsistent answers the judge catches, and report no judge totals to auditors until both are acceptable.</strong></p><p>The 94 percent figure looks good, but it mostly reflects how uneven the two labels are. Caseworkers marked 558 of the 600 answers consistent, so a judge that labeled every answer consistent would agree with them 93 percent of the time and would find no problems at all. Raw agreement cannot separate a useful judge from that one.</p><p>Cohen&#x27;s kappa measures agreement between two raters after removing the agreement expected by chance, given how often each rater uses each label. With these counts, kappa is about 0.2, which is low: the judge agrees with the caseworkers only a little more than chance would predict. The second number to check is recall on the inconsistent answers. The judge caught 6 of the 42 answers that caseworkers marked inconsistent, about 14 percent. Those 42 answers matter most to auditors, because they are the cases where residents in the same situation may have been told different things. The judge flagged 8 answers where caseworkers flagged 42, so its monthly totals would report far less inconsistency than caseworkers find.</p><p>Anthropic&#x27;s guidance on LLM-based grading is to test the grader for reliability first and scale it afterwards. The first step is therefore to measure the judge with metrics that fit an uneven label mix, and to hold its totals back until those metrics are acceptable. After that, the team can improve the rubric with detailed definitions of an inconsistent answer, let the judge reason before it outputs a label, add more inconsistent examples to the labeled set, and measure again. See Define success criteria and build evaluations and the Building evals cookbook.</p><p>The other approaches each improve something, but none of them shows or removes the cause. A sample of 6,000 answers drawn the same way gives a narrower margin of error for a number that hides the problem. A larger model with thinking may label better, but a reporting rule based on raw agreement can be passed by a judge that rarely flags anything. Majority voting over three runs reduces random variation, but a judge that misses inconsistent answers in the same direction every time will produce the same wrong majority.</p>","tip":"","reference":"Supplied Claude practice questions, question 29. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"},{"query":"Scenario: A state government agency offers residents a Claude assistant that explains benefit programs, such as food and housing support, and helps them fill in applications from documents they upload, such as payslips and letters. Agency caseworkers, the staff who handle each application, make every final decision. The agency must show auditors that applicants in the same situation are treated the same way.\n\nQuestion: The assistant reaches a document-extraction vendor's remote MCP server through the MCP connector, and the agency's toolset configuration enables every tool that the server offers. After a vendor release, traces show the assistant calling a new tool named \"archive_copy\", whose description tells the model to call it after each extraction. Applicants' payslips are now stored in the vendor's systems. Which change most directly removes the cause?","type":"multiple-choice","options":[{"text":"Add \"archive_copy\" to the toolset's denylist and keep the server's other tools enabled, so the model no longer receives that tool's description.","explanation":"A denylist removes this one tool, so it stops the calls seen in the traces. The default stays enabled, so the next vendor release can add another tool under a different name and the model will receive it. The cause is the enable-everything default, and this change does not remove it.","correct":false},{"text":"Send every MCP tool call, with its tool name and arguments, to the security team's alerting system so that calls to unfamiliar tools are investigated.","explanation":"Alerting on tool calls is a useful extra layer and helps the agency give auditors a record. It only detects the call after the payslip has already been sent to the vendor's tool. The model still receives every tool the server publishes, so the same thing can happen again after the next release.","correct":false},{"text":"Add a system prompt rule that the assistant may call only the extraction tool and must ignore instructions that appear in tool descriptions.","explanation":"A system prompt rule makes it less likely that the model follows the poisoned description, but the tool is still sent to the model and can still be called. A rule that depends on model behavior is not an enforced limit. It is not enough when applicants' personal documents can leave the agency's control.","correct":false},{"text":"Change the toolset to an allowlist: disable the server's tools by default and enable only the text extraction tool by name in the configuration.","explanation":"The cause is that every tool the vendor publishes is sent to the model automatically, so a vendor release can add a tool without the agency's approval. With tools disabled by default and only the extraction tool enabled by name, a new tool, or any other tool that is not enabled by name, is not sent to the model, so the model cannot call it. The agency enforces this in its own request, so it does not depend on how the model reacts to a tool description.","correct":true}],"answer":"<p>Correct answer: <strong>Change the toolset to an allowlist: disable the server&#x27;s tools by default and enable only the text extraction tool by name in the configuration.</strong></p><p>The toolset configuration enabled every tool that the vendor&#x27;s server offers. With that setting, the vendor decides which tools the model receives, and the agency does not. When the release added archive_copy, its name and description were sent to the model automatically, and the description contained an instruction to call the tool after each extraction. This is tool poisoning: an indirect prompt injection that arrives through a tool definition, not through a user message. It is also a supply-chain risk, because the change came from a third party&#x27;s release.</p><p>The MCP connector lets the agency control tool exposure in its own request. In the mcp_toolset entry, setting default_config.enabled to false and then enabling tools by name creates an allowlist. A tool that is not on the list is never sent to the model, so the model cannot call it, and the text of its description has no effect. A new tool in a later release stays disabled until the agency reviews it and enables it. The assistant needs only text extraction from this server, so one enabled tool is also the least privilege configuration. See MCP connector for the allowlist and denylist patterns.</p><p>A denylist entry for archive_copy stops the calls in the traces, but every other tool stays enabled by default, including tools the vendor has not yet added. A denylist is a good choice when the team trusts the server&#x27;s full tool list and wants to remove a few known write tools. It is a bad choice when the list can change without the team&#x27;s approval. The system prompt rule reduces the chance that the model follows a poisoned description, but it depends on model behavior and leaves the tool callable. The guidance in Mitigate jailbreaks and prompt injections treats a hardened prompt as one layer and recommends limiting access to data and actions so that a successful injection can do little damage. Alerting on tool calls gives the agency a record and faster detection, but the document has left the agency&#x27;s control before anyone reads the alert.</p><p>Two limits apply. First, Anthropic does not security-audit or manage MCP servers, as the Claude Code security page states, so the team that connects a server is responsible for what that server can expose. Second, an allowlist controls which tools the model can call. It does not control what the vendor&#x27;s extraction tool does with a document after it receives one, and it does not stop the vendor from changing the description of a tool that is already enabled. The agency therefore still needs its vendor agreement and its own review of the tool it enables, including after vendor releases.</p>","tip":"","reference":"Supplied Claude practice questions, question 30. Domain: Runtime Guardrails and Production Security.","answerStatus":"source"},{"query":"Scenario: A state government agency offers residents a Claude assistant that explains benefit programs, such as food and housing support, and helps them fill in applications from documents they upload, such as payslips and letters. Agency caseworkers, the staff who handle each application, make every final decision. The agency must show auditors that applicants in the same situation are treated the same way.\n\nQuestion: The assistant runs on Claude Managed Agents with \"unrestricted\" networking, and no caseworker is involved until an application is submitted. Its \"bash\" tool converts uploads to text, and \"web_fetch\" has \"allowed_domains\" set to the agency's program pages. In a red-team test, hidden text in an uploaded letter passed the team's injection screen and made the agent send the applicant's uploads to an outside host with a shell command. Which change most directly closes this exploit path?","type":"multiple-choice","options":[{"text":"Change the environment networking to \"limited\" and list only the agency hosts that sessions need in \"allowed_hosts\".","explanation":"The uploads are residents' payslips and letters, and a shell command sent them to the outside host. The sandbox network setting is the control that applies to shell commands. With \"limited\" networking and a short \"allowed_hosts\" list, a request to an outside host fails, whatever the hidden text tells the agent to do. The list should contain only hosts that the agency controls, because a shell command can still send uploads to any allowed host.","correct":true},{"text":"Narrow the \"allowed_domains\" list on \"web_fetch\" to the single agency domain that hosts the benefit program pages.","explanation":"The \"allowed_domains\" list restricts only the web tool that it is set on. It does not limit the \"bash\" tool, and in the red-team test a shell command sent the request. A shorter list would leave shell commands still able to reach outside hosts.","correct":false},{"text":"Set the permission policy of the \"bash\" tool to \"always_ask\", which pauses every shell command until the session receives a confirmation.","explanation":"An approval step is a valid control when a person who can judge the command reviews each call. The people in these sessions are residents. The caseworkers, who make every final decision, start their work only after an application is submitted. So the confirmation would come either from a resident who cannot assess shell commands or from client code that approves every paused call. The second case gives the same result as \"always_allow\".","correct":false},{"text":"Add a second screening call on a larger model for the text extracted from each upload, and reject uploads that either screen flags.","explanation":"A second screen would catch more injection attempts, but it would also reject more real documents. It is still a classifier, so some hidden text will get through, as the red-team letter already did with the first screen. When that happens, the shell can still send sandbox data to any host.","correct":false}],"answer":"<p>Correct answer: <strong>Change the environment networking to &quot;limited&quot; and list only the agency hosts that sessions need in &quot;allowed_hosts&quot;.</strong></p><p>The assistant combines three things: private data (residents&#x27; payslips and letters in the sandbox), untrusted input (the text inside those uploads), and a way to send data out (a shell with open network access). Hidden instructions in an upload are called indirect prompt injection. A screening call lowers how often such text reaches the agent, but a classifier misses some attempts, as the red-team letter showed. The step that sends data out needs a control that does not depend on the model or on a classifier. See Mitigate jailbreaks and prompt injections for the layered approach.</p><p>In Claude Managed Agents, allowed_domains on web_fetch limits only that web tool. It does not limit the bash tool, which can send any request that the sandbox network permits. With unrestricted networking, code in the sandbox can reach almost any host, so files and tool outputs in the sandbox can be sent out. Setting the environment networking to limited with an explicit allowed_hosts list applies to the whole sandbox, including shell commands, and it also limits the web tools. A request to a host that is not on the list fails, whatever the injected text says. The secure deployment guide describes this setting.</p><p>This control has a limit that an engineer must plan for. Network access is granted by host, not by operation, so a shell command can still upload data to any host on the list. If a host is added so that the web tools can read it, sandbox code can also reach that host. The list should therefore contain only hosts that the agency controls and that the sessions need, including the host of the program pages.</p><p>Each of the other changes improves something, but each leaves a way for data to leave the sandbox. An always_ask policy on bash works when a person who can judge the command reviews each call. Residents use the assistant themselves. The caseworkers make every final decision, but they start their review only after an application is submitted. Their decision controls the eligibility outcome. It does not stop data from leaving the sandbox during a session. So either a resident approves commands that they cannot assess, or the client approves every paused call, which gives the same result as always_allow (see Permission policies). A shorter web_fetch list does not apply to shell commands. A second screen reduces missed injections, but it also rejects more real letters by mistake, and it cannot guarantee that no hidden text reaches the agent.</p>","tip":"","reference":"Supplied Claude practice questions, question 31. Domain: Runtime Guardrails and Production Security.","answerStatus":"source"},{"query":"Scenario: A state government agency offers residents a Claude assistant that explains benefit programs, such as food and housing support, and helps them fill in applications from documents they upload, such as payslips and letters. Agency caseworkers, the staff who handle each application, make every final decision. The agency must show auditors that applicants in the same situation are treated the same way.\n\nQuestion: An LLM judge approves or blocks each prompt release by checking that the assistant's answers apply program rules consistently, and it was calibrated last year against 500 caseworker-labeled answers. When its model was deprecated, the team moved the judge to the newer model in the same tier and kept the rubric. On the same stored answers, its pass rate rose from 81 to 93 percent. Which action should the team take first?","type":"multiple-choice","options":[{"text":"Rewrite the rubric with more detailed criteria for each program rule, and turn on thinking for the new judge before it gives each verdict.","explanation":"Detailed rubrics and a grader that reasons before it scores are both recommended practices, and the team may need them later. At this point the team does not know where the new judge disagrees with caseworkers, so it has no evidence to guide a rubric change. Changing the rubric now would also create another new judge that has never been compared with the caseworker labels.","correct":false},{"text":"Score the stored answers five times with the new judge and measure how often its verdicts agree across runs before using its scores for any release decision.","explanation":"Measuring agreement across repeated runs is a useful reliability check when a judge's verdicts change from run to run while nothing about the judge has changed. In this case the shift appeared when the judge model changed, on answers that did not change. A judge can give the same verdict in every run and still be more lenient (pass more answers) than caseworkers. So stability across runs does not show that its verdicts are correct.","correct":false},{"text":"Freeze the stored answers and the new judge's settings as a regression baseline, and flag any later prompt release that scores below 93 percent.","explanation":"A frozen baseline is good practice for comparing later releases with each other, but it is useful only after someone has checked the judge's verdicts. If the new judge is more lenient than caseworkers, a 93 percent baseline would accept answers that treat similar applicants differently. The team needs to measure agreement with caseworker labels before it trusts any number from the new judge.","correct":false},{"text":"Score the 500 caseworker-labeled answers with the new judge and measure its agreement with those labels before using its scores for any release decision.","explanation":"The stored answers did not change, so the 12-point rise comes from the judge. The earlier calibration describes only the old judge model. Scoring the caseworker-labeled set again shows whether the new judge still agrees with caseworkers, and whether it now passes answers that they marked as inconsistent. The team already has this labeled set, so the check is fast. It should come before any release decision depends on the new scores.","correct":true}],"answer":"<p>Correct answer: <strong>Score the 500 caseworker-labeled answers with the new judge and measure its agreement with those labels before using its scores for any release decision.</strong></p><p>An LLM judge is the combination of a model, a rubric and its settings. When the team moved the judge to a newer model, it created a new judge, even though the rubric text stayed the same. Last year&#x27;s calibration measured only the old judge. The pass rate rose from 81 to 93 percent on the same stored answers, so the assistant cannot be the cause. Either the new judge is more lenient than the old one, or the old judge was too strict. The pass rate alone cannot show which of these is true. This problem is called judge drift: the meaning of a score changes because the grader changed, not because the product changed.</p><p>The 500 answers that caseworkers labeled can show which is true. The team should score them with the new judge and measure how often the judge and the caseworkers agree. For example, it can use a simple agreement rate and Cohen&#x27;s kappa, which corrects for agreement that happens by chance. The team should also read the disagreements and check their direction. The most important cases are answers that caseworkers marked as inconsistent and that the new judge now passes. The agency must show auditors that applicants in the same situation are treated the same way, so a lenient judge could approve a prompt release that breaks this requirement. Until the agreement result is acceptable, the new judge&#x27;s scores should not decide releases.</p><p>Anthropic&#x27;s guidance on LLM-based grading says to test a grader for reliability first and only then use it at scale; see Define success criteria and build evaluations. The model deprecations page tells teams to test their applications thoroughly with the replacement model before the old model is retired. A judge that controls releases is part of the application, so the same rule applies to it. Each model ID identifies a pinned (fixed) version (see Model IDs and versions), so a judge&#x27;s behaviour changes mainly when the team moves it to a different model. Serving infrastructure can also change and cause minor differences, which is one reason to repeat the calibration check from time to time. A calibration run against human labels should be a required step in every judge migration.</p><p>The other actions are good practice in other situations, but they do not answer whether the team can trust the new judge. A frozen regression baseline lets the team compare later releases with each other, but it is useful only after the judge has been checked. Setting the baseline at 93 percent accepts the new judge&#x27;s verdicts without evidence. Rewriting the rubric and turning on thinking are useful grader improvements. However, the team does not yet know where the new judge disagrees with caseworkers, and the rewritten judge would also need calibration. Measuring agreement across repeated runs shows whether the judge is consistent with itself. That is the right check when scores change between runs of the same judge. In this case the change started with the model change, and a judge that is stable across runs can still be more lenient than caseworkers in every run.</p>","tip":"","reference":"Supplied Claude practice questions, question 32. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"},{"query":"Scenario: A state government agency offers residents a Claude assistant that explains benefit programs, such as food and housing support, and helps them fill in applications from documents they upload, such as payslips and letters. Agency caseworkers, the staff who handle each application, make every final decision. The agency must show auditors that applicants in the same situation are treated the same way.\n\nQuestion: Residents sign in to use the assistant, and the backend session holds each resident's verified ID. The assistant saves draft answers to the agency's case system through a backend tool that uses one service credential, so auditors cannot link a logged write to a resident. The team told the assistant to add the resident's ID to a notes field, but sampled writes had missing IDs or IDs of other residents named in uploaded letters. Which change best gives auditors a reliable record of each write?","type":"multiple-choice","options":[{"text":"Move the service credential into a secrets manager, rotate it on a short schedule, and log each time the backend retrieves it, so credential use is traceable.","explanation":"Storing the credential in a secrets manager and rotating it shortens the time that a copied credential can be used, and the retrieval log shows which service fetched it. Every write still reaches the case system under the same service identity. Nothing in this change records which resident a write belongs to.","correct":false},{"text":"Require the resident's ID in the tool's input schema and have the backend reject IDs that are not in the case system, so every write carries a known resident ID.","explanation":"Requiring the field stops the missing IDs, and the backend check stops IDs that do not exist. The wrong IDs in the sample belonged to other real residents named in uploaded letters, so they are in the case system and pass the check. The model still chooses the value, and audit evidence should not depend on a value that the model supplies.","correct":false},{"text":"Have the tool's backend code write an audit record for each call, taking the resident's ID from the signed-in session, so each write is tied to one resident.","explanation":"Residents sign in before they use the assistant, so the backend session already holds a verified resident ID, and the code does not need to ask the model for it. If this code writes a record for every call, every write has a record. The record also stays correct when the model makes an error or when an uploaded document names another person. This gives auditors a link from each draft write to one resident.","correct":true},{"text":"Turn on the Compliance API Activity Feed and export its events to the agency's log platform, so auditors can search a record of the assistant's activity.","explanation":"The Activity Feed records activity on resources in the agency's Anthropic organization, and it does not contain prompt text or model responses. The draft writes are made by the agency's own tool to the agency's case system, so they do not appear in that feed. The feed is a good audit source for administrative activity, but it cannot link a case-system write to a resident.","correct":false}],"answer":"<p>Correct answer: <strong>Have the tool&#x27;s backend code write an audit record for each call, taking the resident&#x27;s ID from the signed-in session, so each write is tied to one resident.</strong></p><p>An audit record is reliable evidence only when the system that performs the action writes it, using identity information that the system has verified. Residents sign in before they use the assistant, and the backend session holds each resident&#x27;s verified ID. The tool also runs in the agency&#x27;s backend. The backend code can therefore write one record for each tool call, with the resident&#x27;s ID from the session, the tool name, the arguments and the time. The model takes no part in producing that record. The record stays correct when the model makes a mistake. It also stays correct when an uploaded payslip or letter names another person or contains text that tries to change what the model does.</p><p>The team&#x27;s first attempt failed because it asked the model to report the identity. A model can leave a value out, or it can copy the ID of another person from an uploaded letter. Making the field required and rejecting IDs that are not in the case system is a stricter form of the same approach: the model still chooses the value. That check stops missing IDs and IDs that do not exist. The wrong IDs in the sample belonged to other real residents, so they are in the case system and would pass the check.</p><p>The Compliance API Activity Feed is a real audit source, but it covers a different part of the system. It records activity on resources in the Anthropic organization, and it does not record prompt text or model responses. When the agency&#x27;s own tool writes to the agency&#x27;s case system, the write happens inside the agency&#x27;s infrastructure, so the feed has no event for it. See Compliance API access. The Managed Agents secure deployment guide divides responsibility in the same way: it states that custom tools are governed by the application&#x27;s own code. When an application runs a tool, the application must also produce the audit record for that tool.</p><p>A secrets manager with rotation is good credential practice. It shortens the time that a copied credential can be used, and a retrieval log shows which service fetched the credential. It does not change what the case system sees: every write still arrives under one service identity. Giving each workload its own service account, as described in Workload Identity Federation, links each action to a workload. Linking each action to a resident is a separate need, and only the application that holds the resident&#x27;s session can record that link.</p>","tip":"","reference":"Supplied Claude practice questions, question 33. Domain: Runtime Guardrails and Production Security.","answerStatus":"source"},{"query":"Scenario: A law firm reviews about 30,000 supplier contracts each quarter for its corporate clients. A Claude pipeline extracts key terms, flags unusual clauses and gives each contract a risk score. Most contracts are processed overnight, but a partner (a senior lawyer) sometimes needs one reviewed within minutes. Senior lawyers grade a weekly sample of the output, and an LLM grader scores the rest.\n\nQuestion: Overnight contracts already run through the Message Batches API, and most requests read the shared instructions from the prompt cache. Usage fields logged from each response show that output tokens are about 80 percent of the cost per contract, and most of those output tokens are thinking tokens. The pipeline has used the model's highest effort level since launch. Which change should the team test first to reduce cost?","type":"multiple-choice","options":[{"text":"Add a first pass on a smaller, lower-cost model that escalates a contract to the current model when it reports low confidence, and check results against the lawyers' grades.","explanation":"A two-model cascade adds a second model and a routing rule before the team has tried the effort setting on the current model. Every escalated contract pays for both models. Also, a model's own report of its confidence is not a measured signal of which contracts it gets wrong. A cascade may be useful later if effort tuning alone does not reach the cost target.","correct":false},{"text":"Instruct the model to write shorter clause explanations and risk-score rationales, and compare output tokens per contract before and after.","explanation":"Asking for shorter explanations reduces the visible text in the response, and measuring before and after is good practice. However, most of the output tokens in this pipeline are thinking tokens, and an instruction about answer length does not directly reduce them. The saving would be small compared with the total output cost.","correct":false},{"text":"Rerun contracts from the lawyers' graded samples at lower effort levels, and adopt the lowest level that keeps the quality the lawyers accepted.","explanation":"Thinking tokens are billed as output tokens, and the effort level is the main control for how much the model thinks. The pipeline has never been tested below the highest level. Rerunning lawyer-graded contracts at lower levels shows how much thinking the team can remove without lowering quality. This change acts on the largest cost category, and it uses a human-graded measure to decide whether to accept the change.","correct":true},{"text":"Change the cache on the shared instructions to the one-hour duration, and track the share of input tokens read from cache in the usage report.","explanation":"A longer cache duration may increase cache reads for the shared instructions, which lowers input cost. However, input is the smaller part of the cost in this pipeline, and most requests already read the instructions from the cache. Prompt caching also does not change how many output or thinking tokens the model generates.","correct":false}],"answer":"<p>Correct answer: <strong>Rerun contracts from the lawyers&#x27; graded samples at lower effort levels, and adopt the lowest level that keeps the quality the lawyers accepted.</strong></p><p>A cost change should act on the token category that makes up most of the bill. Each response reports its usage in separate categories: uncached input, cache writes, cache reads and output. These categories have different prices, so a cost model has to price them separately. In this pipeline the overnight work already receives the Message Batches API discount, and most requests already read the shared instructions from the cache. The largest remaining cost is output, and most of that output is thinking.</p><p>Thinking tokens are billed as output tokens, and the effort setting is the main control for how much the model thinks. The pipeline has run at the highest effort level since launch, and nobody has tested lower levels, so the team does not know how much of that thinking the task needs. Anthropic&#x27;s guidance is to tune effort on the current model before adding a second model, and to judge each level with an evaluation set built from real work. The firm already has that set: the contracts that the senior lawyers grade each week. Rerunning those contracts at lower effort levels shows the lowest level at which quality stays the same. Plan for one side effect: changing the effort value can invalidate cached prefixes, so the shared instructions may be written to the cache again at the new setting. See Optimizing for cost and intelligence.</p><p>The other changes are useful in other situations, but they do not reduce thinking. A cascade (a cheaper model handles each request first and passes hard cases to a stronger model) adds a second model and a routing rule before the team has tried the simpler setting. Every escalated contract pays for both models, and the model&#x27;s own statement of confidence is not a measured signal of when it is wrong. A one-hour cache duration may help batch jobs get more cache reads, but prompt caching only lowers the price of repeated input tokens; it has no effect on output generation. Asking for shorter explanations reduces the visible text, which is the smaller part of the output in this pipeline. See Prompt caching.</p>","tip":"","reference":"Supplied Claude practice questions, question 34. Domain: Cost and Latency Optimization at Scale.","answerStatus":"source"},{"query":"Scenario: A law firm reviews about 30,000 supplier contracts each quarter for its corporate clients. A Claude pipeline extracts key terms, flags unusual clauses and gives each contract a risk score. Most contracts are processed overnight, but a partner (a senior lawyer) sometimes needs one reviewed within minutes. Senior lawyers grade a weekly sample of the output, and an LLM grader scores the rest.\n\nQuestion: After the team moved overnight reviews from a larger, more capable model tier to a smaller, lower-cost tier to reduce cost, the senior lawyers' weekly grades stayed the same for contracts on a client's standard template, about 85 percent of volume. For supplier-drafted contracts, which the intake step already labels, the smaller tier misses unusual clauses far more often, and rerunning those samples at the smaller tier's highest effort level did not reduce the misses. Which change best restores quality while keeping most of the saving?","type":"multiple-choice","options":[{"text":"Keep the smaller tier for every contract, and use the intake label to run supplier-drafted contracts at a higher effort level than template contracts.","explanation":"Tuning effort before adding a second model is the recommended first step, and this option targets the correct group of contracts. However, the team already reran the graded samples at the smaller tier's highest effort level, and the misses did not decrease. More thinking on the same model adds output cost and does not fix the missed clauses.","correct":false},{"text":"Keep the smaller tier for contracts on a client template, and send the contracts that the intake step labels as supplier-drafted to the larger tier.","explanation":"The lawyers' grades show that the smaller tier is as good as the larger tier on template contracts, and that the quality loss is only in supplier-drafted contracts. The intake label exists before any model call, so the pipeline code can choose the model without depending on the model's own judgment. Most of the volume stays at the smaller tier's price, and the hard contracts go back to the model that the lawyers already accepted.","correct":true},{"text":"Move all overnight reviews back to the larger tier until the lawyers' weekly grades for supplier-drafted contracts return to their earlier level.","explanation":"This would restore quality on supplier-drafted contracts. However, it also pays the larger tier's price for the 85 percent of contracts where the lawyers found no difference. The evidence shows that the problem is limited to one labelled group. Reversing the change for every contract gives up almost all of the saving.","correct":false},{"text":"Have the smaller tier return a confidence score with each contract, and send contracts below a chosen confidence threshold to the larger tier for a second review.","explanation":"A model that did not notice an unusual clause has no reason to report low confidence about that contract, so the misses may never reach the larger tier. The score is the model's own report, and nobody has measured it against the lawyers' grades. The intake label already identifies the affected contracts without depending on the model.","correct":false}],"answer":"<p>Correct answer: <strong>Keep the smaller tier for contracts on a client template, and send the contracts that the intake step labels as supplier-drafted to the larger tier.</strong></p><p>Model routing means sending each request to the lowest-cost model tier that still meets the quality standard for that kind of request. Anthropic&#x27;s guidance is to tune the current model first, mainly with the effort setting, and to add a second model only when the combination gives better quality for the same spend than one model alone. The team has already done the first step: rerunning the lawyers&#x27; graded samples at the smaller tier&#x27;s highest effort level did not reduce the missed clauses. That result shows that the misses on supplier-drafted contracts come from a limit of the smaller model on unfamiliar wording, not from too little thinking.</p><p>The weekly grades also show where the problem is. Template contracts, about 85 percent of the volume, receive the same grades on the smaller tier as they did on the larger tier, so paying the larger tier&#x27;s price for them does not improve quality. The quality loss is only in supplier-drafted contracts, and the intake step labels those contracts before any model is called. A label that exists before the request is a deterministic routing signal: the pipeline code chooses the model, and the choice does not depend on what the model says about its own work. Sending only the labelled contracts to the larger tier gives the hard cases the model that the lawyers already accepted, and it keeps the smaller tier&#x27;s price for most of the volume.</p><p>Each of the other approaches fixes only part of the problem. Raising effort for supplier-drafted contracts targets the correct group, but it uses a setting that the team has already tested without success. Moving everything back to the larger tier restores quality but gives up the saving on the 85 percent of contracts where the smaller tier is equally good. Escalating on a confidence score that the smaller-tier model reports about itself is unreliable. A model that did not notice an unusual clause has no reason to report low confidence, and nobody has measured that score against the lawyers&#x27; grades.</p><p>After the change, the team should confirm the result with the next weekly sample graded by the senior lawyers. It should also check the spend for each model, for example by grouping usage and cost reports by model. See Optimizing for cost and intelligence and the Usage and Cost Analytics API.</p>","tip":"","reference":"Supplied Claude practice questions, question 35. Domain: Cost and Latency Optimization at Scale.","answerStatus":"source"},{"query":"Scenario: A law firm reviews about 30,000 supplier contracts each quarter for its corporate clients. A Claude pipeline extracts key terms, flags unusual clauses and gives each contract a risk score. Most contracts are processed overnight, but a partner (a senior lawyer) sometimes needs one reviewed within minutes. Senior lawyers grade a weekly sample of the output, and an LLM grader scores the rest.\n\nQuestion: On long contracts, the pipeline splits the text into fixed-size chunks, retrieves 100 candidates per key term with BM25 and embedding search, and passes the top 15 to Claude. Senior lawyers' weekly sample shows missed exceptions to liability caps. In the traces, the chunks holding those exceptions, such as \"This limit does not apply to Clause 14\", are absent from the 100 candidates. Which change best addresses the cause?","type":"multiple-choice","options":[{"text":"Add a reranking model that scores the 100 candidates against each key-term query, and pass its 15 highest-scoring chunks to Claude for extraction.","explanation":"A reranker only reorders the chunks that first-stage search has already returned. The traces show that the exception chunks are not among the 100 candidates. So the reranker never sees them, and it cannot move them into the 15 chunks that reach Claude. Reranking helps when search retrieves the right chunk but ranks it too low, which is a different failure from the one in the traces.","correct":false},{"text":"Generate a short note for each chunk, from the full contract, naming its section and subject, and add it to the chunk before embedding and BM25 indexing.","explanation":"The exception chunks are missing from the first-stage candidates because their text does not say what they are about. They contain no word such as liability or cap for BM25 to match, and the embedding of a short reference sentence with no context carries little meaning. Adding chunk-specific context before both kinds of indexing gives the keyword search and the embedding search the terms and meaning they need to find these chunks. This reduces retrieval failures at the stage where the traces show that they happen.","correct":true},{"text":"Require Claude to quote the contract text that supports each extracted term, and to report a term as not found when no supporting quote exists.","explanation":"Requiring supporting quotes is a good grounding practice that stops Claude from reporting values that the text does not support. It does not help with this failure. Claude can still quote the cap sentence that it received, so the check passes while the exception is still missing. The exception never reached the prompt, so the cause is in retrieval and not in generation.","correct":false},{"text":"Pass the 40 highest-ranked of the 100 candidates to Claude instead of 15, so that more of each long contract reaches the extraction prompt.","explanation":"Passing more candidates helps only when the needed chunk is among the candidates but below the cutoff. The exception chunks are absent from all 100 candidates, so choosing 40 of them instead of 15 still leaves those chunks out. It also adds more unrelated text to the prompt, which can distract the model.","correct":false}],"answer":"<p>Correct answer: <strong>Generate a short note for each chunk, from the full contract, naming its section and subject, and add it to the chunk before embedding and BM25 indexing.</strong></p><p>A retrieval pipeline has separate stages: indexing (chunking, embedding, building the BM25 index), first-stage search, selection of the chunks passed to the model, and generation. A wrong answer should be traced to the stage that lost the information. The traces show that the exception chunks are missing from the 100 first-stage candidates. Every later stage can only work with what first-stage search returns, so the fix must change what is indexed or how it is searched.</p><p>Search missed the chunks because fixed-size splitting separated each exception sentence from its heading and from the cap that it modifies. A chunk that says only &quot;This limit does not apply to Clause 14&quot; contains no word such as liability or cap. BM25 matches exact terms, so it has nothing to match. The embedding of such a short reference sentence also says little about liability. Contextual Retrieval addresses this problem. For each chunk, a model reads the full document and writes a short chunk-specific context (usually 50 to 100 tokens). That context is added to the start of the chunk before both embedding and BM25 indexing. In Anthropic&#x27;s tests, contextual embeddings combined with contextual BM25 reduced the top-20 retrieval failure rate by 49 percent. The method reduces failures but does not remove them, so the team should measure retrieval recall again on the lawyers&#x27; graded sample after the change. The extra work happens when a contract is indexed, not on each query, and prompt caching of the contract text keeps the indexing cost low. See Introducing Contextual Retrieval.</p><p>The other changes act on later stages. A reranker is a second-stage filter that scores the retrieved candidates and keeps the best ones. It is the right fix when search retrieves the correct chunk but ranks it too low. Passing 40 chunks instead of 15 has the same limit: it selects from the same 100 candidates. Requiring a supporting quote for each extracted term, and allowing a &quot;not found&quot; answer, is a recommended way to reduce unsupported claims (see Reduce hallucinations). However, Claude cannot quote text that it never received. The cap value would still have a valid quote, and the exception would still be missed.</p>","tip":"","reference":"Supplied Claude practice questions, question 36. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: A law firm reviews about 30,000 supplier contracts each quarter for its corporate clients. A Claude pipeline extracts key terms, flags unusual clauses and gives each contract a risk score. Most contracts are processed overnight, but a partner (a senior lawyer) sometimes needs one reviewed within minutes. Senior lawyers grade a weekly sample of the output, and an LLM grader scores the rest.\n\nQuestion: The team added the MCP connector to read the firm's clause library from a remote MCP server. The release passed in staging, which calls the Claude API directly, but the overnight run failed in production, where requests pass through the firm's gateway for client cost records and audit logs. The gateway drops headers and body fields outside its approved list, and two earlier releases failed the same way. Which change best prevents this kind of failure?","type":"multiple-choice","options":[{"text":"Extend the evaluation suite with contracts that need clause-library lookups, and block any release where the LLM grader scores them below the current baseline.","explanation":"Evaluation cases for clause-library lookups are useful for measuring output quality. However, they run in staging, which calls the Claude API directly, so they would pass again while production still fails. The failure is in the request path between the pipeline and the API, not in the quality of the answers.","correct":false},{"text":"Change the gateway to forward Anthropic headers and request fields it does not recognize, and run staging through the same gateway configuration as production.","explanation":"This removes both causes of the repeated failure. A gateway that forwards unrecognized Anthropic headers and fields does not break when the team adopts a new API feature. A staging path through the same gateway shows any remaining gateway problem before the release. The gateway can still write client cost records and audit logs, because neither task needs it to remove fields.","correct":true},{"text":"Add the MCP connector's beta header and the \"mcp_servers\" field to the gateway's approved list, then rerun the failed contracts through production on the following night.","explanation":"This repairs the current release, and the rerun recovers the night of processing that was lost. However, the gateway still drops anything that is not yet on its list, and staging still does not pass through the gateway. The next feature that needs a new header or field will fail in production in the same way as these three releases.","correct":false},{"text":"Send the pipeline's requests directly to the Claude API, and write the client cost records and audit entries from the pipeline's own application logs.","explanation":"Direct calls would stop the gateway from removing fields, so this failure would not repeat. However, the firm depends on the gateway as the one place that records client cost and audit entries. Moving those records into one pipeline's logs creates a second record that must be kept consistent with the gateway. The real problem is a gateway setting, and the team can change that setting.","correct":false}],"answer":"<p>Correct answer: <strong>Change the gateway to forward Anthropic headers and request fields it does not recognize, and run staging through the same gateway configuration as production.</strong></p><p>The MCP connector lets a Messages API request call tools on a remote MCP server. Each request must carry a beta value in the anthropic-beta header, an mcp_servers list, and a matching mcp_toolset entry in tools. Any component between the pipeline and the API has to pass all three through unchanged. The firm&#x27;s gateway removes headers and body fields that are not on its approved list, so production requests arrived at the API without the parts that the connector needs. See MCP connector.</p><p>Two separate weaknesses allowed the same failure to reach production three times. First, the gateway treats its list of known fields as complete. The Claude API adds new headers and request fields over time, often behind beta values, so a gateway built this way breaks each time a team adopts a new feature. Anthropic&#x27;s gateway guidance for Claude Code gives the same advice: forward anthropic-beta, anthropic-version and request fields as open lists (pass on what the gateway does not recognize), instead of allowing only the fields that exist today. The same reasoning applies to a gateway in front of a Messages API pipeline. A gateway whose job is cost records and audit logs does not need to remove fields to do that job, and it can still log the unrecognized fields for review. See LLM gateway configuration.</p><p>Second, staging and production use different request paths. Staging calls the API directly, so no staging test can show a gateway problem. A release test only gives information about the parts of the path that it shares with production. When staging runs through the same gateway configuration, any remaining gateway problem appears before the release and not during the overnight run.</p><p>Adding the beta header and mcp_servers to the approved list repairs this release only, and the next new field fails in the same way. Calling the API directly avoids the gateway, but the firm loses the central cost and audit record that it depends on. More evaluation cases measure the quality of the output, but they run in staging and would pass while production still fails.</p>","tip":"","reference":"Supplied Claude practice questions, question 37. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: A law firm reviews about 30,000 supplier contracts each quarter for its corporate clients. A Claude pipeline extracts key terms, flags unusual clauses and gives each contract a risk score. Most contracts are processed overnight, but a partner (a senior lawyer) sometimes needs one reviewed within minutes. Senior lawyers grade a weekly sample of the output, and an LLM grader scores the rest.\n\nQuestion: Partners need a complete urgent review, including the risk score, within three minutes. Traces for urgent requests show the first token arriving two seconds after submission and the full response finishing after about seven minutes. About 80 percent of the output tokens are thinking tokens, and the urgent path uses the \"max\" effort level chosen for the overnight jobs. Which change best addresses the missed target?","type":"multiple-choice","options":[{"text":"Send urgent contracts through a separate workspace with its own rate limits, so that they never wait behind the overnight jobs.","explanation":"Separate capacity helps when rate limits or queues delay urgent requests, and that delay would appear before the first token. The first token arrives two seconds after submission, so the request is not waiting. The delay comes after generation starts, and a separate workspace does not change it.","correct":false},{"text":"Cache the review instructions with a one-hour lifetime, and track the cache hit rate of urgent requests during the working day.","explanation":"Prompt caching reduces the time and cost of processing the input prefix, which mainly improves the time to the first token. That time is already two seconds, so input processing is not the slow part. Caching has no effect on how long the model takes to generate output, and output generation is where the seven minutes are spent.","correct":false},{"text":"Show the streamed text on the partner's screen as it arrives, so that the partner can start reading before the review is complete.","explanation":"Streaming makes the wait feel shorter, but it does not make the model finish sooner. The target is a complete review with the risk score, and that still arrives after about seven minutes. Most of the output is thinking, so the readable review text also starts late in the response.","correct":false},{"text":"Test lower effort levels for the urgent path against the lawyer-graded sample, and use the lowest level that keeps review quality.","explanation":"The traces show that almost all of the seven minutes is output generation, and that most of that output is thinking. Effort is the setting that controls how much the model thinks, so a lower level shortens the total response time. Checking each level against the lawyer-graded sample shows how far the team can lower effort before review quality falls.","correct":true}],"answer":"<p>Correct answer: <strong>Test lower effort levels for the urgent path against the lawyer-graded sample, and use the lowest level that keeps review quality.</strong></p><p>A latency target can refer to two different measurements. Time to first token (TTFT) is the time from sending the request until the model starts to produce output. Total latency is the time until the full response is complete. The partner needs a finished review with a risk score, so the target is about total latency. The traces show a TTFT of two seconds and a total of about seven minutes. This means that the request starts quickly and that almost all of the time is spent generating output. See Reducing latency for both definitions.</p><p>Output generation time grows with the number of output tokens, and thinking tokens are output tokens. They are billed as output, they count toward max_tokens, and the model must generate them before or between the visible parts of the answer. When about 80 percent of the output is thinking, the amount of thinking is the main cause of the long response. The effort parameter (output_config.effort) is the main control for this. Lower levels are faster and cheaper, but they can reduce capability. The team chose the max level for overnight jobs, where nobody is waiting for the result. The urgent path has a different latency need, so it should have its own effort level. The documentation advises using the highest levels only where evaluations show a quality gain. Senior lawyers at the firm already grade a sample, so the team can run that sample at each lower level and choose the lowest level that keeps the same review quality. One operating note: changing effort can invalidate the prompt cache. So set one fixed level for the urgent path and another for the overnight jobs, and do not vary the level between requests of the same workload.</p><p>The other changes improve a part of the request that is already fast, or they change how the wait feels and not how long it lasts. Prompt caching shortens input processing and has no effect on output generation, so a longer cache lifetime could only reduce the two seconds before the first token. A separate workspace with its own rate limits removes waiting for capacity. However, that waiting would appear as a slow first token, and the traces show a fast one. Showing the streamed text lets the partner see progress, but the model still needs about seven minutes to finish, and the risk score is available only when the review is complete.</p>","tip":"","reference":"Supplied Claude practice questions, question 38. Domain: Cost and Latency Optimization at Scale.","answerStatus":"source"},{"query":"Scenario: A law firm reviews about 30,000 supplier contracts each quarter for its corporate clients. A Claude pipeline extracts key terms, flags unusual clauses and gives each contract a risk score. Most contracts are processed overnight, but a partner (a senior lawyer) sometimes needs one reviewed within minutes. Senior lawyers grade a weekly sample of the output, and an LLM grader scores the rest.\n\nQuestion: The team draws the lawyers' weekly sample from the Monday overnight batch. The LLM grader gives one overall score per contract, and its weekly average has stayed level for two months. In that period, partners reported several missed unusual clauses in contracts sent for urgent review, which are a small share of volume. Which change best improves the team's measurement of quality on live traffic?","type":"multiple-choice","options":[{"text":"Run an A/B test of a revised clause-flagging prompt on live contracts, and compare the weekly average of the overall grader score between the two groups.","explanation":"An A/B test is a good way to compare two versions on live traffic, but it needs a metric that can detect the problem. The overall grader score stayed level while clauses were being missed. So comparing that same score between two groups would not show whether the revised prompt helps. The team has to fix the measurement before it tests changes with it.","correct":false},{"text":"Draw a random weekly sample for the lawyers from the urgent path as well as the overnight path, and report the rate of missed unusual clauses for each path.","explanation":"The current sample never includes an urgent contract, and overnight contracts make up most of the overall average, so neither measure can show a problem on the urgent path. Sampling within each path guarantees that lawyers grade urgent reviews every week. A separate rate of missed clauses for each path is a metric that changes when the reported failure happens.","correct":true},{"text":"Move the LLM grader to a larger model tier with thinking turned on, so that its overall score responds better to subtle problems in clause handling.","explanation":"A stronger grader that reasons before it scores may judge clause handling better. However, the team has no lawyer labels on urgent contracts to check whether it does. The weekly average would also still be one overall score made mostly of overnight contracts, so a failure limited to a small share of volume would change it very little.","correct":false},{"text":"Double the number of contracts the senior lawyers grade from each Monday overnight batch, so that the weekly quality estimate has a narrower margin of error.","explanation":"A larger sample gives a more precise estimate, but only for the contracts that the sample is drawn from. Every graded contract would still come from the Monday overnight batch. The urgent reviews, where partners found missed clauses, would still not be measured.","correct":false}],"answer":"<p>Correct answer: <strong>Draw a random weekly sample for the lawyers from the urgent path as well as the overnight path, and report the rate of missed unusual clauses for each path.</strong></p><p>A quality measure on live traffic can only be as good as the sample behind it. The lawyers&#x27; weekly sample comes from the Monday overnight batch, so it never contains an urgent contract. The grader&#x27;s weekly average covers all contracts, but urgent reviews are a small share of volume, so a problem limited to them changes the average very little. Both measures can stay level while quality on the urgent path gets worse. The partners&#x27; reports were the only signal that reached the team. Reports like these are few, depend on who chooses to report, and arrive after the harm.</p><p>The fix has two parts. First, the sample must represent every segment of live traffic that could behave differently. Sampling at random within each path (often called stratified sampling) guarantees that lawyers grade a small segment such as urgent reviews every week. This follows the principle that evaluations should match the real task distribution, including the less common cases. Second, the metric must match the task. Flagging unusual clauses is a detection task, so the useful measures are how many real unusual clauses were missed (recall) and how many flags were wrong (precision). One overall score per contract mixes extraction, flagging and risk scoring, and a single missed clause in an otherwise good review may lower it only slightly. Most applications need several success criteria measured separately, as described in Define success criteria and build evaluations. Reporting the rate of missed clauses for each path gives the team a number that changes when the reported failure happens.</p><p>Grading more contracts from the Monday batch narrows the margin of error, but only for overnight contracts, so the urgent path stays unmeasured. A larger grader with thinking turned on may score clause handling better, and reasoning before scoring is recommended for LLM graders. However, the team has no lawyer labels on urgent contracts to confirm that the grader is right on them, and overnight volume would still make up most of the average. An A/B test is useful after the team has a metric that detects missed clauses. If the test compares the same overall score that stayed level during the failures, it cannot show whether a revised prompt fixes them. The correct order is to fix the sampling and the metric first, and then use them to test changes.</p>","tip":"","reference":"Supplied Claude practice questions, question 39. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"},{"query":"Scenario: A law firm reviews about 30,000 supplier contracts each quarter for its corporate clients. A Claude pipeline extracts key terms, flags unusual clauses and gives each contract a risk score. Most contracts are processed overnight, but a partner (a senior lawyer) sometimes needs one reviewed within minutes. Senior lawyers grade a weekly sample of the output, and an LLM grader scores the rest.\n\nQuestion: The team moved all overnight processing to a revised clause-flagging prompt at the start of the month. The LLM grader's average score for the next two weeks was higher than for the two weeks before the change. In those same two weeks, one client sent about 1,500 renewals of a standard template, which rarely contain unusual clauses. Which approach gives the team the most reliable evidence of whether the revised prompt improved quality?","type":"multiple-choice","options":[{"text":"Run both prompts during the same weeks, assigning each incoming contract to one of them at random, and compare grader scores and lawyer grades betwee
