alid request. See Claude on Amazon Bedrock for the features that platform does and does not support.</p><p>A 400 error means that the request itself is invalid. This is different from a rate limit, an overloaded error or a 5xx server error. Those errors are transient (temporary), and the request can succeed after backoff and retry. Sending the same invalid request again returns the same rejection, as described in the API errors documentation. The fallback therefore needs a different request shape: a request built only from features that Bedrock supports.</p><p>Client-side tool use is supported on Bedrock, so the fallback request can define a search tool. When Claude returns a tool_use block, application code runs the query against the retrieval pipeline and returns the passages in a tool_result block. Claude still chooses its own search queries, and its answers still come from the current internal documents. The retrieval pipeline was healthy during the incident; only the connector that reached it was unsupported on Bedrock. The same principle appears in the refusals and fallback documentation, which tells teams on platforms without server-side fallback to implement the fallback in client code.</p><p>The fallback path uses a different request and a different platform, so its answer quality can differ from the primary path. The search team already runs an evaluation suite before every release. Running the same suite against the fallback path shows whether a prompt or retrieval change has broken that path, before a real overload happens. Without this check, the fallback is code that runs only during an incident, and an incident is the worst time to learn that it fails.</p><p>A circuit breaker is a component that stops sending requests to a failing service after repeated errors, and sends them to another service until the first one recovers. The other choices leave the main problem in place. Bedrock accepts a weekly snapshot of the most-requested documents in a cached system prompt, and the snapshot gives Claude some documents to base its answers on. However, the snapshot holds only a small part of two million documents, and documents change daily, so the snapshot soon becomes out of date. Questions that contain an exact product name or error code often need a document that is not in the snapshot. A weekly failover drill is useful for detection, but it would report the same rejection each week until the request is changed. Removing the fallback and queueing requests stops the 400 errors, but employees then get no answers for the whole overload period.</p>","tip":"","reference":"Supplied Claude practice questions, question 67. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: An enterprise software company gives its 12,000 employees a Claude assistant that answers questions from about two million internal documents, including design notes, runbooks, HR policies and sales material. A retrieval pipeline built on an embedding index finds the passages for each answer. Documents change daily, and questions often contain product names and error codes. The search team runs an evaluation suite before every release.\n\nQuestion: After the search team raised the number of passages sent with each question from 20 to 80, about 3 percent of answers end in the middle of a sentence and lack citations for their last claims. Traces show these are successful responses with \"stop_reason\" set to \"model_context_window_exceeded\" and output well below \"max_tokens\". The retry wrapper acts only on HTTP errors. Which change best improves reliability?","type":"multiple-choice","options":[{"text":"Check \"stop_reason\" on each successful response; for this value, resend the question without the lowest-ranked passages so the answer has room to finish.","explanation":"The stop reason shows that the 80 passages plus the partial answer filled the model's context window, so the request needs a smaller input. Reading the stop reason on successful responses detects the cut-off answer. Removing the lowest-ranked passages leaves space for the answer and keeps the passages that are most likely to contain it.","correct":true},{"text":"Have the wrapper treat this stop reason as a failure and retry the same request with exponential backoff, as it already does for rate-limit and overloaded errors.","explanation":"Backoff and retry work for temporary conditions such as rate limits and overloaded errors, which can clear with time. The same request with the same 80 passages fills the context window in the same way on each attempt. Retries therefore add cost and delay and still return a cut-off answer.","correct":false},{"text":"Raise \"max_tokens\" on the answer request so that responses that were cut off have a larger output budget and can finish their final claims and citations.","explanation":"A larger output limit is the correct fix when the stop reason is max_tokens. In these traces, the output is well below max_tokens and the stop reason names the context window. The window is full, so a higher output limit adds no space.","correct":false},{"text":"Add a system prompt instruction that tells the assistant to keep answers short and to place each citation directly after the claim that it supports.","explanation":"Shorter answers may reduce how often the window fills, but an instruction cannot guarantee space when the passages alone use almost all of the window. Also, the wrapper does not read the stop reason, so it would still pass any cut-off answer to employees as if it were complete.","correct":false}],"answer":"<p>Correct answer: <strong>Check &quot;stop_reason&quot; on each successful response; for this value, resend the question without the lowest-ranked passages so the answer has room to finish.</strong></p><p>A Messages API response can succeed at the HTTP level and still be incomplete. Every successful response includes a stop_reason that says why generation ended. end_turn means the model finished its answer. max_tokens means the output reached the limit set in the request. model_context_window_exceeded means the input plus the output generated so far filled the model&#x27;s context window, so generation had to stop. None of these is a 4xx or 5xx error. A wrapper that only checks the HTTP status therefore passes a cut-off answer to the employee as if it were complete. See Handling stop reasons for the full list of values and how to respond to each one.</p><p>The traces show which case applies. The output is well below max_tokens, so the output limit did not end the answer. The stop reason names the context window, and the problem started when the team moved from 20 to 80 passages. When the retrieved passages are long, 80 of them use almost all of the window and leave too little space for the answer. The fix has two parts. First, read stop_reason on successful responses so that a cut-off answer is detected. Second, make the input smaller and send the question again. Removing the lowest-ranked passages keeps the passages most likely to hold the answer. It also keeps the benefit of 80 passages for the roughly 97 percent of questions that fit. The team can also count tokens before sending and remove passages before the first request, which avoids paying for an incomplete first attempt.</p><p>Each of the other changes handles a different failure. Raising max_tokens is the correct response to a max_tokens stop, but in this case the window is full, so a higher output limit gives no extra space. Retrying with backoff is correct for rate limits and server errors, which are temporary, and the official SDKs already retry those automatically (see Errors). A request with the same 80 passages fills the window the same way every time, so retries only add cost and delay. A system prompt instruction to answer briefly may lower how often answers are cut off. However, it cannot guarantee space when the passages alone nearly fill the window, and the wrapper would still be unable to detect the incomplete answers that do occur.</p>","tip":"","reference":"Supplied Claude practice questions, question 68. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: An enterprise software company gives its 12,000 employees a Claude assistant that answers questions from about two million internal documents, including design notes, runbooks, HR policies and sales material. A retrieval pipeline built on an embedding index finds the passages for each answer. Documents change daily, and questions often contain product names and error codes. The search team runs an evaluation suite before every release.\n\nQuestion: A release candidate fails the evaluation gate because 34 golden questions that passed last month now fail. The search team reruns the suite on the current production build, and the same 34 questions fail. In the transcripts, the assistant quotes the current text of runbooks and HR policies, while the reference answers match earlier versions of those documents. Which change best keeps the gate valid over time?","type":"multiple-choice","options":[{"text":"Store the source document and version with each golden question, and flag the reference answer for review whenever that document is revised.","explanation":"The same questions fail on the unchanged production build, and the assistant's answers match the current documents while the reference answers match older versions. This means that the reference answers are out of date, and the assistant is not at fault. When each question is linked to its source document and version, a document revision can trigger a review. The reference answers then stay correct as the documents change daily.","correct":true},{"text":"Score the production build on the same day as each release candidate, and block the release only when the candidate's score is lower than production's.","explanation":"Comparing the candidate with production on the same day would stop out-of-date questions from blocking a release, because both builds fail them equally. However, those questions would then measure nothing, and a build that returned outdated passages would score higher on them. As more documents change, a growing part of the suite would stop giving useful information.","correct":false},{"text":"Have document owners label a sample of graded answers, measure the grader's agreement with those labels, and revise the grading rubric until agreement is high.","explanation":"Checking a grader against human labels is the right step when the grader's judgments are in doubt. In this scenario, the grader correctly reports that the answers do not match the reference answers, and the reference answers are the part that is wrong. Changing the rubric does not update them, and new mismatches would appear each time more documents are revised.","correct":false},{"text":"Run each golden question five times for every build, and count a question as failed only when the majority of its five trials fail.","explanation":"Running several trials per question is a good way to reduce noise when results vary between runs. These 34 failures repeat on both builds and have one consistent cause, so a majority vote over five trials would still fail the same questions. The reference answers would remain out of date.","correct":false}],"answer":"<p>Correct answer: <strong>Store the source document and version with each golden question, and flag the reference answer for review whenever that document is revised.</strong></p><p>A golden question has two parts: the question and a reference answer. The reference answer is correct only for the version of the document it was written from. In a corpus where documents change daily, some reference answers become wrong every week even though nobody edits the suite. Anthropic&#x27;s guidance on evaluating research and retrieval systems names this problem: the ground truth (the set of correct answers) changes as the reference content changes.</p><p>The two observations in the question identify this cause. The production build did not change, and it fails the same 34 questions, so the release candidate did not introduce the failures. The transcripts show the assistant quoting current document text while the reference answers match older text, so the assistant is right and the suite is out of date. A release gate in this state blocks good releases. It would also pass a build that returns outdated passages, which is the opposite of what the team wants.</p><p>The fix is to make each golden question traceable to its source. When the suite stores the source document and version for each question, a document revision can automatically mark the question as needing review. A person who knows the content then updates the reference answer, or stops using it, before the next run. This is ongoing maintenance work, and it needs a clear owner, in the same way that unit tests need an owner when the code changes. The search team read the transcripts before it trusted a score, and that habit is what finds this kind of problem.</p><p>The other changes are useful practices for different problems. Running several trials per question reduces noise from variation between runs, but these failures are consistent, not random, so a majority vote returns the same result. Measuring the grader&#x27;s agreement with human labels helps when the grader&#x27;s judgments are in doubt. In this case the grader correctly reports a mismatch, and the reference answer is the part that is wrong. Comparing the candidate with production on the same day stops the release from being blocked, but the out-of-date questions then give no information, and their number grows as more documents change. See Demystifying evals for AI agents and Define success criteria and build evaluations.</p>","tip":"","reference":"Supplied Claude practice questions, question 69. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"},{"query":"Scenario: An enterprise software company gives its 12,000 employees a Claude assistant that answers questions from about two million internal documents, including design notes, runbooks, HR policies and sales material. A retrieval pipeline built on an embedding index finds the passages for each answer. Documents change daily, and questions often contain product names and error codes. The search team runs an evaluation suite before every release.\n\nQuestion: The search team adds BM25 keyword search beside the embedding index. The release gate requires an overall pass rate of 88 percent on the golden set, and the candidate scores 92 percent, up from 89 in production. By document type, runbook questions rose from 80 to 95 percent, but HR policy questions fell from 94 to 81 percent. Which change to the release criteria best stops a release like this from passing?","type":"multiple-choice","options":[{"text":"Replace pass-or-fail grading with a 1 to 5 rubric score, and block a release when the average score falls below the production average.","explanation":"A graded scale gives more detail about each answer, but the release decision would still use one average across all document types. The improvement on runbook questions would raise that average and hide the decline on HR policy questions, in the same way as the current pass rate does.","correct":false},{"text":"Run each golden question three times per build, and block a release when the averaged overall pass rate falls below the threshold.","explanation":"Repeated trials reduce variation between runs, which helps when a result is close to the threshold. A 13-point drop on HR policy questions is not random variation, and the averaged overall rate would still be well above 88 percent, so the release would pass.","correct":false},{"text":"Compute the pass rate per document type, and block a release when any type drops more than a set margin from production.","explanation":"The overall rate rose because, in the average, the gain on runbook questions was larger than the loss on HR policy questions. A check on each document type compares HR policy questions with their own production result. The 13-point drop then blocks the release, even though the overall rate improved.","correct":true},{"text":"Raise the required overall pass rate to 91 percent, and block a release when the candidate scores below the current production build.","explanation":"The candidate scores 92 percent overall, which is above a 91 percent threshold and above the 89 percent production result, so it would still pass both checks. A rule that looks only at the overall rate cannot detect a loss in one document type when another type gains more.","correct":false}],"answer":"<p>Correct answer: <strong>Compute the pass rate per document type, and block a release when any type drops more than a set margin from production.</strong></p><p>A single overall pass rate is an average, and an average can rise while one part of it falls. In the candidate, runbook questions gained 15 points and HR policy questions lost 13 points. In the average, the gain was larger than the loss, so the overall rate moved from 89 to 92 percent and the release gate passed. Employees who ask HR policy questions would still get clearly worse answers after this release.</p><p>Release criteria should check each group of questions that matters to users for a regression, which is a behavior that worked before and now works worse. The team computes the pass rate for each document type on the production build (the baseline) and on the candidate. It blocks the release when any type drops by more than a set margin. The margin should be larger than the normal variation between two runs of the same build for a group of that size. Otherwise, a small group could block a release by chance. This follows the guidance that most production use cases need evaluation along several dimensions instead of one combined score; see Define success criteria and build evaluations.</p><p>The other changes keep a single combined number, so they do not remove the cause. A higher overall threshold of 91 percent, together with a comparison against production, still passes a candidate that scores 92. Running each question three times makes the result more stable, which is useful when a score is close to the threshold. However, a 13-point drop is not random variation, and the averaged overall rate stays far above 88 percent. A 1 to 5 rubric gives more detail for each answer, but the average of those scores is still taken across all document types, so the runbook gain hides the HR policy loss again.</p><p>A breakdown by document type also makes debugging faster. BM25 is good at exact terms such as error codes and product names, which explains the runbook gain. A drop that affects only HR policy questions tells the team to inspect how keyword results and embedding results are combined for questions written in plain language.</p>","tip":"","reference":"Supplied Claude practice questions, question 70. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"}];

    const CURRENT_KEY = "devPro01ExamCurrentV1";
    const HISTORY_KEY = "devPro01ExamHistoryV1";
    const EXAM_NAME = "Claude Developer Professional Practice Exam 01";

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function isCorrect(question) {
      return question.options.every(option => Boolean(option.selected) === Boolean(option.correct));
    }

    function correctCount(question) {
      return question.options.filter(option => option.correct).length;
    }

    function formatDuration(ms) {
      if (!Number.isFinite(ms) || ms < 0) return "0:00";
      const total = Math.floor(ms / 1000);
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    class ExamQuestion extends HTMLElement {
      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { question, index, total, graded, cheating } = this._state;
        const reveal = graded || cheating;
        const choose = correctCount(question);

        this.innerHTML = `
          <section class="card" aria-labelledby="question-title">
            <div class="card-header">
              <span>Question ${index + 1} of ${total}</span>
              <span>${question.viewed ? "Viewed" : "New"}</span>
            </div>
            <div class="card-body">
              <p class="query" id="question-title"></p>
              <p class="choose-note">Choose ${choose}</p>
              <div class="options"></div>
              ${reveal ? `<div class="answer-panel"><strong>Answer</strong><div class="answer-html"></div><div class="tip-html"></div><p class="reference-note"></p></div>` : ""}
            </div>
          </section>
        `;

        const queryEl = this.querySelector(".query");
        const separator = "\n\nQuestion: ";
        const splitAt = question.query.indexOf(separator);
        if (splitAt >= 0 && question.query.startsWith("Scenario: ")) {
          const scenario = document.createElement("span");
          scenario.className = "scenario-text";
          scenario.textContent = question.query.slice(0, splitAt);
          const questionText = document.createElement("span");
          questionText.className = "question-text";
          questionText.textContent = question.query.slice(splitAt + separator.length);
          queryEl.append(scenario, questionText);
        } else {
          queryEl.textContent = question.query;
        }
        const options = this.querySelector(".options");

        question.options.forEach((option, optionIndex) => {
          const label = document.createElement("label");
          label.className = "option";
          if (reveal && option.correct) label.classList.add("reveal-correct");
          if (reveal && option.selected && !option.correct) label.classList.add("reveal-wrong-selected");

          const input = document.createElement("input");
          input.type = choose === 1 ? "radio" : "checkbox";
          if (choose === 1) input.name = `question-${index}`;
          input.checked = Boolean(option.selected);
          input.disabled = Boolean(graded);
          input.addEventListener("change", () => {
            this.dispatchEvent(new CustomEvent("option-toggle", {
              bubbles: true,
              detail: { optionIndex }
            }));
          });

          const textWrap = document.createElement("span");
          const text = document.createElement("span");
          text.textContent = option.text;
          textWrap.appendChild(text);

          if (reveal && option.explanation) {
            const explanation = document.createElement("small");
            explanation.textContent = option.explanation;
            textWrap.appendChild(explanation);
          }

          label.append(input, textWrap);
          options.appendChild(label);
        });

        const answer = this.querySelector(".answer-html");
        if (answer) answer.innerHTML = question.answer || "";
        const tip = this.querySelector(".tip-html");
        if (tip) tip.innerHTML = question.tip || "";
        const reference = this.querySelector(".reference-note");
        if (reference) reference.textContent = question.reference || "";
      }
    }
    customElements.define("exam-question", ExamQuestion);

    class QuestionJumper extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { questions, current, graded, cheating } = this._state;
        const reveal = graded || cheating;

        this.innerHTML = `
          <section class="card">
            <div class="card-header collapsible-title" role="button" tabindex="0">
              <span>Question Jumper</span>
              <span class="chevron">${this.collapsed ? "▼" : "▲"}</span>
            </div>
            <div class="card-body jumper-body" ${this.collapsed ? 'hidden' : ''}>
              <div class="jumper-grid"></div>
            </div>
          </section>
        `;

        const title = this.querySelector(".collapsible-title");
        const toggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        title.addEventListener("click", toggle);
        title.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });

        const grid = this.querySelector(".jumper-grid");
        questions.forEach((question, index) => {
          const button = document.createElement("button");
          button.className = "jump-btn";
          button.textContent = String(index + 1);
          button.title = question.query;

          if (question.viewed) button.classList.add("viewed");
          if (index === current) button.classList.add("current");

          if (reveal) {
            button.classList.remove("viewed", "current");
            button.classList.add(isCorrect(question) ? "correct" : "incorrect");
            if (index === current) button.style.outline = "3px solid #111827";
          }

          button.addEventListener("click", () => {
            this.dispatchEvent(new CustomEvent("jump", {
              bubbles: true,
              detail: { index }
            }));
          });
          grid.appendChild(button);
        });
      }
    }
    customElements.define("question-jumper", QuestionJumper);

    class ExamHistoryPanel extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        const history = this._state?.history || { exams: [] };
        const exams = Array.isArray(history.exams) ? history.exams : [];

        this.innerHTML = `
          <section class="card">
            <div class="card-header">
              <span class="collapsible-title" role="button" tabindex="0">Exam History</span>
              <div class="control-group">
                <button class="btn-secondary toggle-history">${this.collapsed ? "Show" : "Hide"}</button>
                <button class="btn-danger clear-history" ${exams.length ? "" : "disabled"}>Clear History</button>
              </div>
            </div>
            <div class="card-body history-body" ${this.collapsed ? "hidden" : ""}></div>
          </section>
        `;

        const doToggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        this.querySelector(".toggle-history").addEventListener("click", doToggle);
        this.querySelector(".collapsible-title").addEventListener("click", doToggle);
        this.querySelector(".clear-history").addEventListener("click", () => {
          this.dispatchEvent(new CustomEvent("history-clear", { bubbles: true }));
        });

        const body = this.querySelector(".history-body");
        if (!exams.length) {
          body.innerHTML = `<p class="history-empty">No completed exams are stored on this device.</p>`;
          return;
        }

        [...exams].reverse().forEach((exam, reverseIndex) => {
          const questions = Array.isArray(exam.questions) ? exam.questions : [];
          const score = questions.filter(isCorrect).length;
          const number = exams.length - reverseIndex;
          const finish = Number(exam.finish || exam.completedAt || 0);
          const start = Number(exam.start || 0);
          const stamp = finish ? new Date(finish).toLocaleString() : "Completed exam";
          const duration = finish && start ? formatDuration(finish - start) : "";

          const wrap = document.createElement("div");
          wrap.className = "history-exam";

          const summary = document.createElement("div");
          summary.className = "history-summary";
          summary.innerHTML = `<strong>Attempt ${number}: ${score} / ${questions.length}</strong><span>${stamp}${duration ? ` · ${duration}` : ""}</span>`;
          wrap.appendChild(summary);

          const dots = document.createElement("div");
          dots.className = "history-dots";
          questions.forEach((question, i) => {
            const dot = document.createElement("span");
            dot.className = "history-dot" + (isCorrect(question) ? " correct" : "");
            dot.textContent = String(i + 1);
            dot.title = question.query;
            dots.appendChild(dot);
          });
          wrap.appendChild(dots);
          body.appendChild(wrap);
        });
      }
    }
    customElements.define("exam-history-panel", ExamHistoryPanel);

    class ClaudeExamApp extends HTMLElement {
      constructor() {
        super();
        this.state = null;
        this.timerHandle = null;
      }

      connectedCallback() {
        this.load();
        this.addEventListener("option-toggle", e => this.toggleOption(e.detail.optionIndex));
        this.addEventListener("jump", e => this.setCurrentQuestion(e.detail.index));
        this.addEventListener("history-clear", () => this.clearHistory());
        this.render();
        this.timerHandle = setInterval(() => this.updateTimer(), 1000);
      }

      disconnectedCallback() {
        clearInterval(this.timerHandle);
      }

      load() {
        let saved = null;
        try {
          saved = JSON.parse(localStorage.getItem(CURRENT_KEY));
        } catch (_) {}

        if (saved && Array.isArray(saved.questions) && saved.questions.length === QUESTION_BANK.length && !saved.graded) {
          this.state = saved;
        } else {
          const questions = clone(QUESTION_BANK).map(q => ({
            ...q,
            viewed: false,
            options: q.options.map(o => ({ ...o, selected: false }))
          }));
          questions[0].viewed = true;
          this.state = {
            name: EXAM_NAME,
            graded: false,
            start: Date.now(),
            finish: 0,
            questions,
            currentQuestionNumber: 0,
            cheating: new URLSearchParams(location.search).get("page") === "answer"
          };
          this.saveCurrent();
        }
      }

      saveCurrent() {
        if (!this.state.graded) {
          localStorage.setItem(CURRENT_KEY, JSON.stringify(this.state));
        }
      }

      getHistory() {
        try {
          const existing = JSON.parse(localStorage.getItem(HISTORY_KEY));
          if (existing && Array.isArray(existing.exams)) return existing;
        } catch (_) {}
        const history = { name: "Exam History", exams: [] };
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        return history;
      }

      clearHistory() {
        localStorage.setItem(HISTORY_KEY, JSON.stringify({ name: "Exam History", exams: [] }));
        this.render();
      }

      toggleOption(optionIndex) {
        if (this.state.graded) return;
        const q = this.state.questions[this.state.currentQuestionNumber];
        if (correctCount(q) === 1) {
          q.options.forEach((option, i) => { option.selected = i === optionIndex; });
        } else {
          q.options[optionIndex].selected = !q.options[optionIndex].selected;
        }
        q.viewed = true;
        this.saveCurrent();
        this.render();
      }

      setCurrentQuestion(index) {
        const next = Math.max(0, Math.min(index, this.state.questions.length - 1));
        this.state.currentQuestionNumber = next;
        this.state.questions[next].viewed = true;
        this.saveCurrent();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      toggleCheat() {
        this.state.cheating = !this.state.cheating;
        this.saveCurrent();
        this.render();
      }

      grade() {
        if (this.state.graded) return;
        this.state.graded = true;
        this.state.cheating = true;
        this.state.finish = Date.now();

        const history = this.getHistory();
        history.exams.push(clone(this.state));
        history.exams = history.exams.slice(-15);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        localStorage.removeItem(CURRENT_KEY);
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      restart() {
        localStorage.removeItem(CURRENT_KEY);
        this.load();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      score() {
        return this.state.questions.filter(isCorrect).length;
      }

      answeredCount() {
        return this.state.questions.filter(q => q.options.some(o => o.selected)).length;
      }

      updateTimer() {
        const el = this.querySelector("[data-timer]");
        if (!el || !this.state) return;
        const end = this.state.finish || Date.now();
        el.textContent = formatDuration(end - this.state.start);
      }

      render() {
        if (!this.state) return;
        const qIndex = this.state.currentQuestionNumber;
        const total = this.state.questions.length;
        const answered = this.answeredCount();
        const score = this.score();

        this.innerHTML = `
          <main class="page-shell">
            <header class="hero">
              <div class="hero-top">
                <div>
                  <h1>Claude Developer Professional Practice Exam</h1>
                  <p>70 questions · Developer Professional · standalone and offline</p>
                </div>
                <div class="pill">Elapsed <span data-timer>${formatDuration((this.state.finish || Date.now()) - this.state.start)}</span></div>
              </div>
              <div class="meta-row">
                <span class="pill">${total} questions</span>
                <span class="pill">${answered} answered</span>
                <span class="pill">${this.state.questions.filter(q => q.viewed).length} viewed</span>
                ${this.state.graded ? `<span class="pill">Score ${score} / ${total}</span>` : ""}
              </div>
            </header>

            ${this.state.graded ? `
              <section class="card results">
                <div class="card-body">
                  <strong>Your grade is ${score} out of ${total}.</strong>
                  <div class="status-line">Correct answers and option explanations are now visible. Your completed attempt has been saved to local storage.</div>
                </div>
              </section>
            ` : ""}

            <exam-question></exam-question>

            <div class="controls">
              <div class="control-group">
                <button class="btn-secondary previous" ${qIndex === 0 ? "disabled" : ""}>Back</button>
                <button class="btn-primary next" ${qIndex === total - 1 ? "disabled" : ""}>Next</button>
              </div>
              <div class="control-group">
                <button class="btn-warning cheat">${this.state.cheating ? "Be Honest" : "Cheat"}</button>
                ${this.state.graded
                  ? `<button class="btn-primary restart">Start New Attempt</button>`
                  : `<button class="btn-primary finish">Finish</button>`}
              </div>
            </div>

            <question-jumper></question-jumper>
            <exam-history-panel></exam-history-panel>

            <p class="footer-note">Progress and completed attempts are stored only in this browser. Question source: supplied 70-question Claude Developer Professional practice set.</p>
          </main>
        `;

        const questionEl = this.querySelector("exam-question");
        questionEl.state = {
          question: this.state.questions[qIndex],
          index: qIndex,
          total,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const jumper = this.querySelector("question-jumper");
        jumper.state = {
          questions: this.state.questions,
          current: qIndex,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const history = this.querySelector("exam-history-panel");
        history.state = { history: this.getHistory() };

        this.querySelector(".previous").addEventListener("click", () => this.setCurrentQuestion(qIndex - 1));
        this.querySelector(".next").addEventListener("click", () => this.setCurrentQuestion(qIndex + 1));
        this.querySelector(".cheat").addEventListener("click", () => this.toggleCheat());

        const finish = this.querySelector(".finish");
        if (finish) finish.addEventListener("click", () => this.grade());

        const restart = this.querySelector(".restart");
        if (restart) restart.addEventListener("click", () => this.restart());
      }
    }
    customElements.define("claude-exam-app", ClaudeExamApp);
  </script>
