 history uses. Caching and compaction solve different problems, so the team should tune them separately.</p>","tip":"","reference":"Supplied Claude practice questions, question 53. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: An insurance company runs a long-running Claude agent, built on the Agent SDK, that reconciles policy records between an old mainframe system and a new cloud database. Each night, scripts find records that do not match. The agent investigates a few thousand mismatches with about a dozen internal tools and writes corrections to the cloud database. A run takes several hours and exports traces for the engineers.\n\nQuestion: The run dashboard counts a mismatch as resolved when the agent's final message says a correction was written; this rate has stayed near 99 percent. Since a model upgrade two weeks ago, about 12 percent of corrected records reappear in the next night's mismatch list, up from under 1 percent. Tool error rates, tokens and tool calls per mismatch are unchanged. Which monitoring change would best detect this regression?","type":"multiple-choice","options":[{"text":"Define success as the share of corrected records that the comparison scripts find matching after each run, and alert when that share falls below its target.","explanation":"The agent's job is done only when the cloud record matches the mainframe, and the comparison scripts can check that state directly. An indicator built on that check does not depend on what the agent says about its own work. It would have dropped from about 99 percent to about 88 percent on the first night after the upgrade.","correct":true},{"text":"Alert when tokens or tool calls per mismatch move away from the levels recorded before the upgrade, and show both measures on the dashboard by model version.","explanation":"Tokens and tool calls per mismatch are good signals for loops, cost changes and some behavior changes after a model update. However, the evidence says that both measures are unchanged since the upgrade, so this alert would not have triggered. The agent does the same amount of work per record, but it produces more wrong corrections.","correct":false},{"text":"Add an alert on the error rate of the database write tool, taken from the exported traces, and page the engineers when the rate rises above its normal level.","explanation":"A write-tool error alert is useful for detecting a failing tool or a database outage. In this case the tool error rates did not change, because a write that succeeds with the wrong value or on the wrong field is not a tool error. The alert would not have triggered at any point during the regression.","correct":false},{"text":"Have an LLM grader score each final message for how clearly it states the fields corrected, calibrate it against engineer labels, and alert on score drops.","explanation":"Calibrating a grader against human labels is good practice, but this grader reads the same final message that the dashboard already trusts. A message can describe a correction clearly while the record in the database is still wrong. The score measures how the agent reports its work, not whether the correction is right.","correct":false}],"answer":"<p>Correct answer: <strong>Define success as the share of corrected records that the comparison scripts find matching after each run, and alert when that share falls below its target.</strong></p><p>A service level indicator (SLI) is the measured number that shows whether a service is doing its job, and a service level objective (SLO) is the target set for that number. For an agent that writes corrections, the job is done when the record in the cloud database matches the mainframe. The agent&#x27;s final message is only a statement about that result. The dashboard counted the statement, so it stayed near 99 percent while about 12 percent of the corrections were wrong.</p><p>Agent monitoring separates two things: the transcript (what the agent said and which tools it called) and the outcome (the state of the environment when the work ends). A model upgrade can change what the agent writes to the database, or how easily it reports success, without changing error counts, run time or token use. An indicator based on the outcome still shows such a change. This team already has a source of ground truth, because the nightly comparison scripts decide whether two records match. Running the scripts on the corrected records after each run gives a success rate that does not depend on the model. An alert on that rate reports the regression after one night, not after two weeks.</p><p>Each of the other changes adds a useful signal, but each one measures the process and not the result. An alert on write-tool errors detects a failing tool or database. A write that completes with a wrong value is not an error, and the error rates did not change. Tokens and tool calls per mismatch show loops, cost growth and some behavior changes after a model update, but the evidence says they are unchanged. An LLM grader that scores the clarity of the final message still reads the agent&#x27;s own report, even when it is calibrated against engineer labels. A clear report can describe a wrong correction. Keep the process signals from the Agent SDK&#x27;s OpenTelemetry export on the dashboard to help find the cause. Use the verified outcome as the main indicator and as the alert condition.</p><p>For guidance on defining measurable success criteria, see Define success criteria and build evaluations. For the token, cost, tool and error signals that the telemetry export provides, see Monitoring.</p>","tip":"","reference":"Supplied Claude practice questions, question 54. Domain: Observability and Production Monitoring.","answerStatus":"source"},{"query":"Scenario: An insurance company runs a long-running Claude agent, built on the Agent SDK, that reconciles policy records between an old mainframe system and a new cloud database. Each night, scripts find records that do not match. The agent investigates a few thousand mismatches with about a dozen internal tools and writes corrections to the cloud database. A run takes several hours and exports traces for the engineers.\n\nQuestion: On three nights this month, the run stopped partway through and nobody noticed until morning. The exported events contain a similar number of \"api_error\" events on those nights and on nights when the run finished, and in both cases the \"attempt\" values ranged from low to high. An alert on a high \"attempt\" value missed two of the three stalls. Which change gives the engineers a reliable alert for a stalled run?","type":"multiple-choice","options":[{"text":"Add an alert that pages the on-call engineer when the count of \"api_error\" events in one run rises above the average count of recent nights.","explanation":"An alert on error count is useful when a failure raises the number of errors. However, the events show a similar number of api_error events on finished nights and on stalled nights. The count does not show whether the session made another request after its last error. A stalled run with a normal error count would not trigger this alert.","correct":false},{"text":"Raise the retry limit in \"CLAUDE_CODE_MAX_RETRIES\" so that more failed requests recover, and keep the existing alert on a high \"attempt\" value.","explanation":"More retries can help some temporary failures recover, but this change does not tell the engineers when a run has stopped. The existing alert stays unreliable, because the attempt count starts again from 1 after a streaming failure. So a stalled run can still show a low attempt value, and it can go unnoticed until morning.","correct":false},{"text":"Group the events by \"session.id\" and alert when an \"api_error\" event has no later \"api_request\" event in that session within a set time.","explanation":"Claude Code retries a failed API request internally, and it emits one api_error event only after it stops retrying. The event shows that a request ended in failure, but it does not show whether the session continued. A later api_request event in the same session means that the run recovered, and no such event means that the run stalled. This check separates the two cases that the attempt value mixes together.","correct":true},{"text":"Lower the threshold of the existing alert so that \"api_error\" events with smaller \"attempt\" values also page the on-call engineer during a run.","explanation":"The attempt count starts again from 1 when Claude Code re-issues a request after a streaming failure, so a low value can still mean that the retries ran out. The events show the same range of attempt values on finished nights and on stalled nights. A lower threshold would page the engineer during healthy runs, and it would still not identify which sessions stopped.","correct":false}],"answer":"<p>Correct answer: <strong>Group the events by &quot;session.id&quot; and alert when an &quot;api_error&quot; event has no later &quot;api_request&quot; event in that session within a set time.</strong></p><p>An agent built on the Agent SDK emits the same OpenTelemetry log events as Claude Code, because the SDK takes its telemetry configuration from the environment. Two of these events matter for detecting a stalled run. claude_code.api_request is logged for each API request to Claude. claude_code.api_error is logged when a request fails, but only once: Claude Code retries the request internally and emits the event after it stops retrying. The retries in between are not logged as separate events.</p><p>An api_error event therefore means that one request ended in failure. It does not say what the session did next. A run that takes several hours can continue after a failed request, or it can stop. The attempt attribute does not separate these two cases. It records how many attempts were made, but the count starts again from 1 each time Claude Code re-issues the request after a streaming failure. So a low value can still mean that the retries ran out. This is why the events from finished nights and stalled nights look alike, and why the alert on a high value missed two of the three stalls.</p><p>The reliable signal is what happens after the error. Events carry session.id by default, so the engineers can group events by session and check whether a later api_request event exists after each api_error. If one exists, the session recovered. If none arrives within a time limit that the team chooses, the run has stalled, and the alerting system should page the on-call engineer (send an urgent notification to the engineer on duty). The team must choose the time limit carefully, because a long tool call can also produce a gap between API requests.</p><p>The other changes keep the same weak signal. A lower threshold on attempt produces more alerts on healthy nights, because finished runs show the same values. An alert on the number of api_error events fails for the same reason: the counts are similar on both kinds of night. A higher retry limit may reduce how often a request fails permanently, which is a real improvement. However, it is not a detection method, and the old alert stays unreliable. For the event definitions and the guidance on retry exhaustion (the point where all retries have failed), see Monitoring.</p>","tip":"","reference":"Supplied Claude practice questions, question 55. Domain: Observability and Production Monitoring.","answerStatus":"source"},{"query":"Scenario: A retail company's platform group is moving 400 services from an old internal web framework to a supported one. Claude Code agents run in parallel in headless mode, one per service, each on its own git worktree, and a separate agent owns each shared library. A coordinating script assigns the work and collects pull requests. Human reviewers can check about forty pull requests a day.\n\nQuestion: The coordinating script assigned all 400 services on the first day. Sixty-two service pull requests now each add their own version of the same adapter code to the shared library that manages user sessions, and these pull requests conflict with one another. The migration pull request from the agent that owns this library already contains that adapter, but it is waiting for review behind about 300 service pull requests. Which change best addresses the cause?","type":"multiple-choice","options":[{"text":"Have the coordinating script assign a service only after the migrations of its shared libraries are merged, and move library pull requests to the front of the review queue.","explanation":"The service agents wrote the adapter because their services need it, and the library's own migration was not merged when they started. If the script assigns a service only after its libraries are merged, the service no longer needs its own adapter. Reviewers can check only about forty pull requests a day. Reviewing library pull requests first spends that limited capacity on the work that every dependent service is waiting for.","correct":true},{"text":"Add an instruction to every service agent's prompt stating that shared libraries belong to other agents and that library files must stay unchanged during the migration.","explanation":"An instruction depends on the model following it, and it does not give the service agents the adapter code that their services need. The agents would still start before the library migration is merged. So the order of the work, which is the cause, stays the same.","correct":false},{"text":"Add a permission rule to the service agents' settings that denies Claude Code's file-editing tools on shared library paths, so that library changes are left to the owning agent's pull request.","explanation":"A deny rule is enforced outside the model. It blocks Claude Code's file-editing tools and recognized Bash file operations on those paths, although a script that writes files itself may need OS-level sandboxing to stop it. It is a good addition after the order of work is fixed. Used alone, it leaves the 62 services without the adapter that they need, because the library's pull request will not be reviewed for more than a week. So those agents could not complete a working migration.","correct":false},{"text":"Have the coordinating script rebase each service worktree onto the main branch and rerun that service's tests before opening its pull request, and hold any pull request that fails.","explanation":"Rebasing and retesting before opening a pull request is good practice when the main branch already contains the code that the service depends on. In this situation the adapter is not on the main branch, and the conflicts are between 62 pull requests that are all still open. A rebase onto main does not remove those conflicts.","correct":false}],"answer":"<p>Correct answer: <strong>Have the coordinating script assign a service only after the migrations of its shared libraries are merged, and move library pull requests to the front of the review queue.</strong></p><p>Parallel dispatch works well only when the tasks are independent. The services in this migration depend on the shared libraries: a service cannot finish its move to the new framework until the library it calls supports that framework. The coordinating script treated all 400 services as independent and started them at the same time. Each of the 62 service agents then found the same missing adapter and wrote its own copy. A git worktree keeps each agent&#x27;s files separate on disk, but it does not stop two agents from changing the same file in different ways. The conflict appears later, when the pull requests are compared with each other.</p><p>The human review step is the second part of the cause. Reviewers can check about forty pull requests a day, and the library&#x27;s pull request is behind about 300 others, so it would wait more than seven working days. A human approval step with fixed capacity is part of the orchestration design, and the coordinating script should decide which work enters that queue first. Dependency-ordered dispatch does this: library migrations are reviewed and merged first, and the script assigns a service only when its libraries are ready. The service agent then starts from a main branch that already contains the adapter, so it has no reason to write one. The agents do not produce the 62 duplicate edits, and reviewers do not spend their daily capacity on pull requests that cannot be merged.</p><p>A permission deny rule on library paths is a real control that is enforced outside the model. It blocks Claude Code&#x27;s file-editing tools, and the file operations that Claude Code recognizes in Bash commands, on those paths. A script or subprocess that writes files itself is not necessarily covered, so complete enforcement also needs OS-level sandboxing. The rule is a useful addition after the order is fixed (see Configure permissions). Used alone, it stops most of the conflicting edits, but the service agents cannot complete services that depend on code that is not merged yet. A prompt instruction has the same weakness, and it also depends on the model following it. Rebasing onto the main branch before opening a pull request is good practice. However, the main branch does not contain the adapter, and the conflicting pull requests are all still open, so the rebase finds nothing to resolve.</p><p>The general rule for large groups of coding agents is that each shared set of files needs one owner, and work that depends on another agent&#x27;s output needs an explicit order. Agents that run in separate contexts do not see each other&#x27;s work, as described for delegated agents in Subagents in the SDK. So the coordinator must supply the order, because the agents cannot find it out themselves.</p>","tip":"","reference":"Supplied Claude practice questions, question 56. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: A retail company's platform group is moving 400 services from an old internal web framework to a supported one. Claude Code agents run in parallel in headless mode, one per service, each on its own git worktree, and a separate agent owns each shared library. A coordinating script assigns the work and collects pull requests. Human reviewers can check about forty pull requests a day.\n\nQuestion: The coordinating script now runs each service agent on a short-lived CI runner with a job time limit, and large services need several jobs. After a timeout, the script copies the session transcript to a new runner and resumes the session there, with the worktree recreated from the service's remote branch. Pull requests from resumed runs lack edits that the agent's summary reports as complete. Which change best fixes this failure?","type":"multiple-choice","options":[{"text":"Enable file checkpointing for the headless runs, and after each resume rewind the worktree on the new runner to the most recent checkpoint before the agent continues.","explanation":"File checkpointing lets a session return files to their state at an earlier turn, and its purpose is to undo edits. It does not track changes made through Bash commands. Returning to an earlier state also does not recreate edits that were lost with the old runner. The remote branch would still hold none of the unfinished work.","correct":false},{"text":"Require each agent to commit and push after every completed migration step, and have a resumed run check the branch against its record of the work before it continues.","explanation":"A resumed session restores only the conversation history; it does not restore files. Edits that were never pushed are lost with the old runner, but the history still records them as done. Pushing after each step makes the remote branch the durable record of the files. The check at resume lets the agent find and redo any step that the branch does not contain.","correct":true},{"text":"Keep the session transcripts in a shared session store that every runner reads directly, and resume each session by its ID from that store instead of from a copied file.","explanation":"A shared store is a valid way to make transcripts available to short-lived runners, but in this setup the transcript already reaches the new runner. The missing part is the file state, which a session does not save. The resumed agent would still read a history that describes edits that the worktree does not contain.","correct":false},{"text":"Stop resuming sessions: after a timeout, start a new session on the new runner with the original task prompt, a higher turn limit and a note that earlier work may be missing.","explanation":"A new session has no false record of completed edits, so its summary would match the files. However, the remote branch still holds no partial progress. So each new job starts a large service from the beginning and reaches the job time limit again. A higher turn limit does not change that time limit.","correct":false}],"answer":"<p>Correct answer: <strong>Require each agent to commit and push after every completed migration step, and have a resumed run check the branch against its record of the work before it continues.</strong></p><p>A session in the Agent SDK and in headless Claude Code is the saved conversation: the prompt, the tool calls, the tool results and the responses. It is written to disk automatically and can be resumed by ID, and the documentation states that it does not save or snapshot the filesystem. See Work with sessions. When the script copies the transcript to a new runner, the agent gets back its record of the work but not the work itself. The history contains successful Edit calls, so the agent treats those steps as finished. The worktree was recreated from the remote branch, which never received the uncommitted edits. The pull request then contains fewer changes than the summary describes.</p><p>An unattended run that can be stopped at any time needs two durable records: one for what the agent knows, and one for the state of the files. The transcript is the first record. For a coding agent, git is the obvious choice for the second record. If the agent commits and pushes after each completed migration step, a timeout can lose only the step in progress. The resumed run should also compare the branch (for example with git log or a progress file in the repository) with what its history claims. After a move to another machine, the files, not the conversation, show what work exists. So any step that is missing from the branch must be done again.</p><p>File checkpointing is a different feature from session history. It tracks changes made through Write, Edit and NotebookEdit so that a session can return files to an earlier state, and it does not track changes made by Bash commands. See Rewind file changes with checkpointing. It is a tool for undoing edits. It does not make unfinished work durable across runners that are destroyed after each job.</p><p>A shared session store is the documented way to resume on another host. However, it solves a problem that this team does not have, because the transcript already arrives on the new runner. Starting a new session after every timeout removes the false record of finished edits. However, nothing is pushed between jobs, so a large service that needs several jobs starts from the beginning each time and does not finish. A higher turn limit has no effect on the job time limit.</p>","tip":"","reference":"Supplied Claude practice questions, question 57. Domain: Agent Fleet Operations for Software Delivery.","answerStatus":"source"},{"query":"Scenario: A retail company's platform group is moving 400 services from an old internal web framework to a supported one. Claude Code agents run in parallel in headless mode, one per service, each on its own git worktree, and a separate agent owns each shared library. A coordinating script assigns the work and collects pull requests. Human reviewers can check about forty pull requests a day.\n\nQuestion: To report model cost per service, the platform group committed an \"env\" block to \".claude/settings.json\" in all 400 service repositories, setting \"CLAUDE_CODE_ENABLE_TELEMETRY=1\" and the collector's OTLP endpoint. The collector receives nothing from the fleet. A headless test session on the same runner does send metrics when an engineer exports the same variables in the shell. Which change best gives the group telemetry from every agent?","type":"multiple-choice","options":[{"text":"Keep the committed block and add a shorter metric export interval to it, so that each headless run sends its data before the agent process exits.","explanation":"A shorter interval can help very short runs that end before a periodic export, but that is not the cause in this case. The test session on the same runner sent metrics when the variables came from the shell, so the timing of the export is not the problem. An interval setting also has no effect while export is not turned on.","correct":false},{"text":"Have the coordinating script write the same \"env\" block to \".claude/settings.local.json\" in each worktree before it starts that service's agent, replacing the committed copy.","explanation":"The project-local settings file has the same restriction as the shared project settings file. Neither file can turn telemetry export on or set the export destination. The agents would still send nothing to the collector.","correct":false},{"text":"Deploy managed settings that set \"OTEL_LOG_TOOL_DETAILS=1\" on the machines running the agents, so that their exported events include full tool and MCP server names.","explanation":"This variable adds detail to events that are already being exported. It does not turn export on, and it does not set a destination. The collector would still receive nothing from the agents.","correct":false},{"text":"Move the telemetry variables out of the repositories and into the \"env\" block of the managed settings file that is deployed to the machines running the agents.","explanation":"Claude Code does not let repository settings turn telemetry export on or choose where the data goes, so the committed block has no effect. Managed settings are the administrator-level place for these variables. One deployment then applies to every agent session on those machines, for all 400 services.","correct":true}],"answer":"<p>Correct answer: <strong>Move the telemetry variables out of the repositories and into the &quot;env&quot; block of the managed settings file that is deployed to the machines running the agents.</strong></p><p>Claude Code exports usage data through OpenTelemetry. When CLAUDE_CODE_ENABLE_TELEMETRY=1, an exporter and an OTLP endpoint are set, each session sends metrics such as claude_code.cost.usage and claude_code.token.usage to a collector. The important detail is where those variables are allowed to come from. A repository&#x27;s .claude/settings.json and .claude/settings.local.json cannot turn telemetry export on, and they cannot choose the export destination. Claude Code accepts these variables from managed settings, from user settings, or from the shell environment. This rule prevents a repository from sending session data to a collector that the organization did not choose.</p><p>The evidence in the question matches this rule. Claude Code ignores the committed block in all 400 repositories, so the collector receives nothing. The same variables work when they are exported in the shell on the same runner. This shows that the values and the network path are correct, and that only the source of the values is wrong.</p><p>The fix is to put the variables in managed settings on the machines that run the agents. Managed settings are the top level of the settings hierarchy, and they exist for organization policy. They apply to every session on the machine, whichever repository or worktree the agent works in. So the platform group configures telemetry once, and it does not maintain a copy in each repository. See Monitoring usage for the telemetry variables and Managed settings for how the file is delivered to machines.</p><p>Writing the block to .claude/settings.local.json fails for the same reason as the committed file: the local project file has the same restriction. A shorter export interval is a real setting that helps when a run ends before a periodic export. However, the shell test already shows that data arrives without it, and an interval does nothing while export is off. OTEL_LOG_TOOL_DETAILS=1 is useful later for audits, because it adds tool and MCP server names to events, but it only adds detail to data that is already being exported. The general settings hierarchy is described in Claude Code settings.</p>","tip":"","reference":"Supplied Claude practice questions, question 58. Domain: Agent Fleet Operations for Software Delivery.","answerStatus":"source"},{"query":"Scenario: A retail company's platform group is moving 400 services from an old internal web framework to a supported one. Claude Code agents run in parallel in headless mode, one per service, each on its own git worktree, and a separate agent owns each shared library. A coordinating script assigns the work and collects pull requests. Human reviewers can check about forty pull requests a day.\n\nQuestion: Model spend for the migration doubled in one week, and rate-limit errors now interrupt runs. Traces show that most service agents finish with few or no subagents, but in about thirty runs, subagents started further subagents, with more than eighty subagents started during one service's run. Each prompt already tells the agent to delegate only when asked. Which change most reliably limits how large a single run can grow?","type":"multiple-choice","options":[{"text":"Add an alert on the estimated cost of each run, and have an engineer review the traces of every run that passes the alert threshold.","explanation":"An alert tells the team that a run has grown large, but only after the subagents have started and the tokens are spent. Reviewing the traces afterward helps explain the growth, but it does not stop it. The question asks for a control that limits growth while the run is in progress.","correct":false},{"text":"Have the coordinating script start fewer service agents at the same time, so that fewer runs compete for the same rate limit.","explanation":"Running fewer service agents in parallel lowers the total request rate, which is a common way to reduce rate-limit errors. However, the traces show that the growth happens inside about thirty individual runs, and each of those runs could still start the same tree of subagents. This change slows the whole migration without limiting the size of any single run.","correct":false},{"text":"Rewrite the delegation instruction in stronger wording and have the coordinating script repeat it in every task prompt it sends to a service agent.","explanation":"A prompt instruction only influences the model's decision to delegate. The team already has one, and about thirty runs did not follow it. Stronger wording may reduce how often the model delegates, but it cannot guarantee a maximum. The runtime has to enforce a limit on run size; asking the model for it is not enough.","correct":false},{"text":"Have the coordinating script set a subagent depth limit, a concurrent subagent limit and a spend cap on every headless run it starts.","explanation":"Claude Code enforces these limits itself, so they apply whatever the model decides about delegation. The depth limit restricts how many layers of subagents can exist. The concurrency limit restricts how many subagents run at the same time, although it does not limit the total number started during a run. The spend cap stops a run when Claude Code's client-side cost estimate reaches the set amount. So the cap is approximate, and the actual spend can be higher than the cap.","correct":true}],"answer":"<p>Correct answer: <strong>Have the coordinating script set a subagent depth limit, a concurrent subagent limit and a spend cap on every headless run it starts.</strong></p><p>Claude decides for itself when to start a subagent and how many to start. Each subagent sends its own API requests, and a subagent can start subagents of its own, so one prompt can grow into a tree of agents. The traces show this pattern. Most service agents stay small, but about thirty runs grew through nested delegation, and those runs account for the extra spend and the rate-limit errors.</p><p>A prompt instruction only influences the delegation decision. It can lower how often the model delegates, but nothing stops a run that delegates anyway, and the team already has such an instruction in every prompt. Claude Code also provides limits that the runtime enforces, whatever the model decides. CLAUDE_CODE_MAX_SUBAGENT_SPAWN_DEPTH limits how many layers of subagents can exist below the main agent. CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS limits how many subagents run at the same time. It does not limit the total number of subagents started during a whole run. When a run reaches this limit, the Agent tool returns a result that says so, and the agent continues with the subagents it already has. A spend cap (maxBudgetUsd in the Agent SDK, or --max-budget-usd for a headless claude -p run) stops the run when Claude Code&#x27;s estimate of its cost reaches the set amount. Claude Code calculates this estimate on the client, and a stopped run can report a cost at or above the cap. So the cap is approximate and is not an exact dollar limit.</p><p>These three controls do not give a strict maximum for the size of a run. They give enforced limits on nesting and on concurrent subagents, and an approximate limit on estimated spend, and none of them depends on the model&#x27;s choice. The coordinating script starts every headless run, so it can apply the same limits to all 400 services. The subagents guide describes these limits and states that a delegation instruction should be combined with them.</p><p>Starting fewer service agents in parallel is a useful step when many runs together exceed a rate limit. It does not fit this evidence, because the problem is the size of a few runs, not the number of runs. Each large run would still build the same tree of subagents, and the migration of the other services would become slower.</p><p>A cost alert followed by trace review is good monitoring practice, and the cost figure that Claude Code reports includes subagent requests. That figure is a client-side estimate, as the cost tracking guide explains, and an alert only reports growth that has already happened. Stronger wording in the prompt is the same kind of control that the team already has, so it has the same weakness: the model can still choose to delegate, and no limit is enforced.</p>","tip":"","reference":"Supplied Claude practice questions, question 59. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: A retail company's platform group is moving 400 services from an old internal web framework to a supported one. Claude Code agents run in parallel in headless mode, one per service, each on its own git worktree, and a separate agent owns each shared library. A coordinating script assigns the work and collects pull requests. Human reviewers can check about forty pull requests a day.\n\nQuestion: Four teams in the platform group have each copied the coordinating script's migration prompt and edited it, and reviewers now reject a third of pull requests because the same step is done differently across services. Each copy holds instructions for all twelve migration patterns, but a typical service needs three, and traces show agents applying steps from patterns their service does not use. Which standard should the platform group adopt?","type":"multiple-choice","options":[{"text":"Add a review agent that compares every pull request with a reference migration and comments on each difference before the human reviewers see the pull request.","explanation":"A review agent finds inconsistent work after an agent has already produced it, so the rejected work must still be redone. It helps reviewers, who can check only about forty pull requests a day. However, the four different prompts and the unneeded instructions in context remain, and they keep producing the same defects.","correct":false},{"text":"Move the instructions for all twelve patterns into one \"CLAUDE.md\" file in version control, so that every agent starts each run with the same complete instructions.","explanation":"A shared file in version control ends the differences between the four copies, so it fixes one of the two problems. However, the file is loaded in full at the start of every session, so all twelve patterns stay in every agent's context. The traces show that this condition leads agents to apply steps from patterns that their service does not use.","correct":false},{"text":"Package each migration pattern as a Skill in shared version control, so that every agent loads only the instructions for the patterns its service uses.","explanation":"This fixes both causes shown in the evidence. One shared copy of each pattern ends the differences between the four edited prompts. Skills load only a short description at the start and load the full instructions when the task matches. So an agent is much less likely to hold instructions for patterns that its service does not use.","correct":true},{"text":"Run every service agent on the most capable tier at a higher effort level, so that each agent judges more reliably which of the twelve patterns apply to its own service.","explanation":"A more capable model may choose the right patterns more often, but it raises the cost of every one of the 400 service runs. The four teams would still maintain four different versions of the instructions, so the same step would still be done differently across services.","correct":false}],"answer":"<p>Correct answer: <strong>Package each migration pattern as a Skill in shared version control, so that every agent loads only the instructions for the patterns its service uses.</strong></p><p>The evidence shows two separate problems. First, four edited copies of one prompt describe the same migration step in four ways, so agents produce different code for the same step and reviewers reject it. Second, every copy puts all twelve patterns into the agent&#x27;s context, although a typical service needs three, and the traces show agents applying steps that do not belong to their service. A good standard must give every agent one shared source of instructions and keep unneeded instructions out of the context.</p><p>Agent Skills do both. A Skill is a folder that contains a short description, a file of instructions, and optional scripts or reference files. Skills use progressive disclosure: at the start, only the name and description of each Skill are loaded, which costs roughly 100 tokens per Skill. The full instructions are loaded when the task matches the description, and extra files use no context until the agent reads or runs them. With one Skill per migration pattern in version control, the service agents and the shared-library agents all read the same text. A change is made once and reviewed like code. An agent that migrates a service with three patterns loads three sets of instructions, not twelve. The model decides which Skills to load from their descriptions. So each description must state clearly when its pattern applies, and the team should check in the traces which Skills each agent loaded. See the Agent Skills overview.</p><p>A single CLAUDE.md file in version control is a normal place for conventions that apply to every run, and it would end the differences between the four copies. But the file is loaded in full at the start of each session, so all twelve patterns stay in context for every service. The traces link that condition to the wrong steps. Moving to the most capable tier at higher effort may improve pattern selection. However, it costs more on each of the 400 runs, and four different instruction texts stay in use. A review agent finds differences after the work is finished. It reduces the work for reviewers, who can check about forty pull requests a day, but the agents keep producing inconsistent work that must be redone.</p><p>Two general points apply. Context is a limited resource, and adding instructions that a task does not need can lower accuracy. Also, a team should choose the smallest change that fixes the measured cause before it adds cost or new components. Building effective agents gives the same advice for architecture decisions: add complexity only when the data shows that it improves results.</p>","tip":"","reference":"Supplied Claude practice questions, question 60. Domain: Advanced Agent Architecture and Orchestration.","answerStatus":"source"},{"query":"Scenario: A retail company's platform group is moving 400 services from an old internal web framework to a supported one. Claude Code agents run in parallel in headless mode, one per service, each on its own git worktree, and a separate agent owns each shared library. A coordinating script assigns the work and collects pull requests. Human reviewers can check about forty pull requests a day.\n\nQuestion: Fleet telemetry shows that test steps fail in 2 percent of agent runs when ten agents share a build host and in 30 percent when sixty share it. A failed service passes when its agent is rerun alone. Traces show the failed tests loading generated client files from a build cache in the host's home directory while another agent's build was writing them. Which change removes the cause of these failures?","type":"multiple-choice","options":[{"text":"Set each agent's build to use a cache directory inside its own worktree, so that no two agents read or write the same generated files.","explanation":"The traces show two agents using the same cache files at the same time, and that cache is outside every worktree. When each agent's build uses a cache directory inside its own worktree, one agent's build can no longer change the files that another agent's tests are reading. This removes the shared state that causes the failures, no matter how many agents run on the host.","correct":true},{"text":"Move the fleet to build hosts with more CPU and memory, so that sixty agents can build at once without competing for resources.","explanation":"A failure rate that rises with the number of agents can point to a shortage of CPU or memory, and larger hosts fix that kind of problem. The traces show a different cause: tests read generated files while another agent's build is writing them. More CPU and memory do not stop sixty agents from writing to one cache directory.","correct":false},{"text":"Limit the coordinating script to ten agents on each build host, the level at which the telemetry shows few failed test steps.","explanation":"With fewer agents on a host, fewer builds collide, so the failure rate would drop. The cache is still shared, so the collisions that cause the 2 percent failure rate at ten agents would continue. The team would also need about six times as many hosts, or about six times as long, to migrate the 400 services.","correct":false},{"text":"Have the coordinating script rerun each failed test step up to three times before the agent treats the failure as a real migration error.","explanation":"Retries help when a failure is random and rare, and in this case they would hide many of these failures. The shared cache would still be overwritten during builds, so collisions would continue, and each retry would add build time and tokens. A retry may pass only because no other build was writing to the cache at that moment, so the cause remains.","correct":false}],"answer":"<p>Correct answer: <strong>Set each agent&#x27;s build to use a cache directory inside its own worktree, so that no two agents read or write the same generated files.</strong></p><p>A git worktree gives each Claude Code session its own working directory and branch, while all worktrees share the same repository history. This separation covers only the files in the checkout. It does not cover anything outside the checkout. A build cache in the home directory, a temporary folder, a network port or a local test database is still one resource that every agent on the host uses. The worktrees documentation also notes that the isolation check does not track every file that a shell command writes, so it does not stop a build tool from writing to a cache in the home directory.</p><p>The telemetry shows the usual pattern of shared state in a fleet of parallel agents. The failure rate rises with the number of agents on one host, not with how difficult a service is, and a failed service passes when its agent runs alone. The traces then identify the resource: tests load generated files while another agent&#x27;s build is writing them. Claude Code can export metrics, events and optional traces through OpenTelemetry (see Monitoring usage). Comparing the failure rate with the number of agents that run at the same time is a quick way to tell a problem in the whole fleet from a problem in one agent&#x27;s work.</p><p>The fix is to give each agent its own copy of the shared resource. When the build cache is a directory inside the agent&#x27;s worktree, no two agents use the same generated files. This uses more disk space and makes first builds slower, because an agent can no longer reuse cached output from other agents&#x27; builds. That cost is small compared with 400 migrations whose test results cannot be trusted.</p><p>Each of the other changes improves a number but leaves the shared cache in place. Rerunning failed test steps hides many failures, but builds still overwrite each other&#x27;s files, and every retry adds time and tokens. Larger build hosts fix competition for CPU and memory, and the traces do not show that problem. A limit of ten agents per host lowers the number of collisions but does not end them, and the same work then needs about six times as many hosts or about six times as long.</p>","tip":"","reference":"Supplied Claude practice questions, question 61. Domain: Agent Fleet Operations for Software Delivery.","answerStatus":"source"},{"query":"Scenario: A retail company's platform group is moving 400 services from an old internal web framework to a supported one. Claude Code agents run in parallel in headless mode, one per service, each on its own git worktree, and a separate agent owns each shared library. A coordinating script assigns the work and collects pull requests. Human reviewers can check about forty pull requests a day.\n\nQuestion: The fleet opens about 120 pull requests a day. Telemetry shows each pull request is free of merge conflicts when opened, but 6 percent of those reviewed within a day conflict with the main branch, compared with 48 percent of those that wait five days or more. The conflicts are in shared dependency files that merged migrations also changed. Which change to how the coordinating script hands out work removes the cause of these conflicts?","type":"multiple-choice","options":[{"text":"Add a step to each agent's prompt to fetch the main branch, rebase its worktree branch and rerun tests just before it opens its pull request.","explanation":"Rebasing before opening a pull request is good practice when branches are already out of date at the moment they are opened. The telemetry shows that these pull requests have no conflicts when they are opened. The conflicts appear later, during the days the pull requests wait for review, and this step does not shorten that wait.","correct":false},{"text":"Have the coordinating script close each conflicting pull request and reassign that service to a new agent on a fresh worktree from main.","explanation":"This repairs a pull request after the conflict has already happened, and the team pays for the same migration work twice. The replacement pull request goes to the end of a queue that still grows by about 80 a day, so it waits again and is likely to conflict again. The rate at which the fleet opens pull requests, which causes the long wait, does not change.","correct":false},{"text":"Raise the number of agents running at once so that all 400 pull requests are open before more migrations merge into the main branch.","explanation":"Opening all pull requests at once makes the queue longer. Reviewers still merge about 40 a day, so most pull requests would wait many days while earlier ones merge and change the same shared dependency files. The telemetry shows that longer waits produce more conflicts.","correct":false},{"text":"Have the coordinating script cap open pull requests near one day of review capacity, starting a new service agent only when one merges.","explanation":"The telemetry links conflicts to waiting time. Waiting time grows because the fleet opens about 120 pull requests a day while reviewers check about 40. With a cap near one day of review capacity, each new worktree starts from a recent version of the main branch, and its pull request is reviewed before many other migrations merge. The migration does not finish later, because the review rate already limits how fast services can merge.","correct":true}],"answer":"<p>Correct answer: <strong>Have the coordinating script cap open pull requests near one day of review capacity, starting a new service agent only when one merges.</strong></p><p>A git worktree gives each agent a separate checkout on its own branch, so parallel agents do not overwrite each other&#x27;s files while they work. A worktree does not merge anything. Each branch starts from one commit (by default, Claude Code creates a worktree from the repository&#x27;s default branch on the remote). After that moment, the branch and the main branch change separately. Keeping the work separate while the agents work (isolation) and combining the work afterwards (integration) are two different problems. See Run parallel sessions with worktrees.</p><p>The telemetry shows which of the two problems the fleet has. Pull requests have no conflicts when they are opened, so the agents and their worktrees work correctly. The conflict rate depends on how long a pull request waits: 6 percent for pull requests reviewed within a day, and 48 percent for those that wait five days or more. The fleet opens about 120 pull requests a day and reviewers check about 40, so the queue grows by about 80 a day and the average wait keeps increasing. While a pull request waits, other migrations merge and change the same shared dependency files. The cause is that the script hands out work faster than reviewers can merge it.</p><p>The fix is a work-in-progress limit, which is a form of backpressure: the slowest stage (human review) controls how fast the earlier stage (the agents) may produce work. When the coordinating script starts a new agent only after a pull request merges, each new worktree starts from a main branch that already contains the merged migrations, and each pull request is reviewed within about a day. This does not slow the migration. Reviewers can merge about 40 pull requests a day, so 400 services need about ten review days however fast the script hands out work. The limit also avoids spending tokens on work that would later need to be redone.</p><p>The other changes leave the wait in place. A rebase just before opening improves the pull requests at a moment when they already have no conflicts. Closing conflicting pull requests and redoing them on fresh worktrees pays for the same migration twice, and it sends the new pull request to the end of a queue that is still growing. Running more agents at once opens all 400 pull requests early, but they still merge at about 40 a day, so the later ones wait longest and conflict with everything that merged before them.</p>","tip":"","reference":"Supplied Claude practice questions, question 62. Domain: Agent Fleet Operations for Software Delivery.","answerStatus":"source"},{"query":"Scenario: An enterprise software company gives its 12,000 employees a Claude assistant that answers questions from about two million internal documents, including design notes, runbooks, HR policies and sales material. A retrieval pipeline built on an embedding index finds the passages for each answer. Documents change daily, and questions often contain product names and error codes. The search team runs an evaluation suite before every release.\n\nQuestion: The suite's 400 golden questions were written at launch, mostly from HR and sales FAQ pages, and have passed at 97 percent or higher for eight releases in a row. Meanwhile, employee reports of wrong answers have risen, and nearly all involve questions containing error codes or product names. Only nine golden questions contain either. Which change to the suite best restores its value as a release gate?","type":"multiple-choice","options":[{"text":"Have Claude write several paraphrases of each launch question so that the set grows to about 2,000 questions and small quality changes become measurable.","explanation":"A larger set does make small quality changes easier to detect, and Claude can help write test cases. However, paraphrases of the launch questions keep the same mix of HR and sales topics. The set would be five times larger and would still contain almost no questions with error codes or product names.","correct":false},{"text":"Add questions sampled from recent employee queries and reported failures to match real traffic, and keep the launch questions as a regression suite.","explanation":"Almost all reported failures involve questions with error codes or product names, and only nine of the 400 golden questions contain either. The suite therefore cannot measure the behavior that is failing. Sampling real queries and reported failures makes the set match what employees ask, so the release decision is based on a useful measurement. The launch questions are still useful as a regression suite, which checks that behavior that already worked continues to work.","correct":true},{"text":"Measure how well the suite's automated grader agrees with human reviewers by using Cohen's kappa, and suspend the release gate until agreement is acceptable.","explanation":"Checking a grader against human labels is the right step when there is evidence that the grader's verdicts are wrong. In this scenario, the evidence points to missing questions, not wrong verdicts. The failing question types are about 2 percent of the set, so even a grader that agreed fully with human reviewers would still report a high pass rate.","correct":false},{"text":"Run each golden question five times per release, and count a question as passed only when the grader accepts the answer in all five trials.","explanation":"Repeated trials measure how consistent the assistant is on each question, which is useful when answers vary between runs. The suite would still ask the same 400 launch questions, so the error-code and product-name questions that employees report would remain almost untested.","correct":false}],"answer":"<p>Correct answer: <strong>Add questions sampled from recent employee queries and reported failures to match real traffic, and keep the launch questions as a regression suite.</strong></p><p>An offline evaluation suite is useful as a release gate only when its questions are similar to the questions that real users ask. Anthropic&#x27;s guidance on building evaluations says to design them to mirror the real-world task distribution and to include edge cases. The launch set was written from HR and sales FAQ pages, but employees often ask about product names and error codes. Only nine of 400 golden questions (about 2 percent) contain either, so the suite has a coverage gap: the assistant can fail on most of these questions and the pass rate will still be high.</p><p>The suite is also saturated. A set that passes at 97 percent or more for eight releases in a row can no longer show whether a change made the assistant better or worse. A saturated set is still useful as a regression suite. A regression suite is a set of tasks that should pass almost every time, and its purpose is to detect that something that used to work has stopped working. It should not be the only evidence for a release. The team also needs questions that the assistant currently finds difficult, and the best source of these questions is production: recent employee queries and the reports of wrong answers. When reported failures become test cases, the suite stays connected to how employees use the assistant. After those questions are in the suite, the team can measure whether a retrieval change helps. One example is adding BM25 keyword search next to the embedding index, because embedding search often handles exact strings such as error codes less well than keyword search does.</p><p>The other changes are good practices in other situations, but they do not remove this cause. Running five trials per question measures consistency on the same launch questions, and it adds no questions with error codes. Checking the grader against human reviewers with Cohen&#x27;s kappa (a measure of agreement between raters that corrects for agreement by chance) is the right step when the grader&#x27;s verdicts are in doubt. For this suite, the failing question types are almost absent from the set, so a perfect grader would report the same high score. Asking Claude to write paraphrases does increase the number of questions, and a larger number is valuable, but paraphrases of HR and sales questions keep the same topic mix. More test cases help only when they are generated from examples that cover the real distribution of questions.</p><p>See Define success criteria and build evaluations for the design principles on task-specific test sets, edge cases and grader selection.</p>","tip":"","reference":"Supplied Claude practice questions, question 63. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"},{"query":"Scenario: An enterprise software company gives its 12,000 employees a Claude assistant that answers questions from about two million internal documents, including design notes, runbooks, HR policies and sales material. A retrieval pipeline built on an embedding index finds the passages for each answer. Documents change daily, and questions often contain product names and error codes. The search team runs an evaluation suite before every release.\n\nQuestion: Before each release, the search team sends its evaluation suite of 9,000 questions through the Messages API at high concurrency, on the same organization and model as the live assistant. During each run, employees receive 429 errors, and response headers show the input-token limit used up. The release review takes place two days after a run starts. Which change best protects the assistant during evaluation runs?","type":"multiple-choice","options":[{"text":"Add a cache breakpoint after the evaluation prompt's shared instructions so that those tokens are read from the cache.","explanation":"Tokens read from the cache do not count toward the input-token limit, so this change would remove part of the run's load. However, the retrieved passages are different for every question and cannot be read from the cache, and the run would still use the same limit as the assistant. The two workloads would compete less for capacity, but the competition would not end.","correct":false},{"text":"Submit the evaluation requests through the Message Batches API and collect the results in time for the release review.","explanation":"Usage of the Message Batches API does not count toward Messages API rate limits, so the evaluation run no longer takes input-token capacity from employees. The review is two days after the run starts, so the team does not need immediate responses. Batch requests also cost less than the same requests sent synchronously.","correct":true},{"text":"Give the evaluation suite its own workspace and API key, and report its token usage apart from the assistant's traffic.","explanation":"A workspace that has no rate limit of its own inherits the organization limit, and the organization limit always applies. The evaluation run and the assistant would still use the same input-token capacity, so employees would still receive 429 errors. Separate reporting shows which workload used the tokens, but it does not stop the two workloads from competing for them.","correct":false},{"text":"Add exponential backoff with jitter to the assistant's client so that employee requests retry until the token limit has room.","explanation":"Backoff with jitter is good practice for 429 errors, and it would turn some failed requests into slow answers. However, it does not remove the cause, because the evaluation run keeps using the input-token limit for the whole time that it runs. Employees would wait longer, and many retries would still fail.","correct":false}],"answer":"<p>Correct answer: <strong>Submit the evaluation requests through the Message Batches API and collect the results in time for the release review.</strong></p><p>The Messages API applies three limits to each model class in an organization: requests per minute, input tokens per minute and output tokens per minute. A request that exceeds any one of them receives a 429 error. The response headers show that the input-token limit is the one that is used up. The evaluation run and the live assistant use the same organization and the same model, so they take input tokens from the same limit. The errors are caused by two workloads that compete for one limit, not by a fault in the assistant.</p><p>The two workloads have different needs. Employees need an answer within seconds. The evaluation scores are not needed until a review two days later. The Message Batches API is designed for the second kind of work. It processes requests asynchronously, its usage does not affect Messages API rate limits, and batch requests cost 50 percent less. Most batches finish in under an hour, and a batch ends after at most 24 hours. The team therefore has time to run one batch for the answers and then one batch for grading before the review. Each result has a type, so the team should check for expired or errored results and submit those requests again. The details are in Batch processing and Rate limits.</p><p>A separate workspace and API key is useful for cost reports, but it does not give the evaluation run its own capacity. A workspace without its own rate limit inherits the organization limit, and the organization limit always applies. A workspace rate limit set below the organization limit would cap the evaluation run&#x27;s share. The run would then be slower, and it would still use Messages API capacity that employees need.</p><p>Exponential backoff with jitter (waiting longer after each failed attempt, with a random delay added) is the correct way for a client to handle a 429 error. It only changes how the assistant reacts when there is not enough capacity. The evaluation run continues to use the limit, so employees get slower answers and many retries still fail.</p><p>Prompt caching does lower the load on the input-token limit, because cache reads are not counted toward that limit. However, only the shared instructions can be cached. The retrieved passages change with every question, so they are counted in full, and the run still shares one limit with the assistant. Caching is a useful later improvement to the batch job, but it does not separate the two workloads.</p>","tip":"","reference":"Supplied Claude practice questions, question 64. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: An enterprise software company gives its 12,000 employees a Claude assistant that answers questions from about two million internal documents, including design notes, runbooks, HR policies and sales material. A retrieval pipeline built on an embedding index finds the passages for each answer. Documents change daily, and questions often contain product names and error codes. The search team runs an evaluation suite before every release.\n\nQuestion: Reviewing failed cases from the evaluation suite, the search team finds that questions naming an exact error code, such as \"ERR-4417\", fail three times as often as other questions. In the traces, the 100 candidates from the embedding index describe similar errors with different codes, and the runbook section for the asked code is absent. When the team supplies that section directly, Claude answers correctly. Which change best addresses the cause?","type":"multiple-choice","options":[{"text":"Add a BM25 keyword index over the same chunks, and combine its results with the embedding results by rank fusion before choosing passages for Claude.","explanation":"The traces show that the embedding index returns sections about similar errors but not the section with the asked code, so the failure is in first-stage retrieval. BM25 ranks passages by how well they match the terms in the question, and it gives high weight to rare terms such as an error code. Combining BM25 results with embedding results adds the missing section to the candidates and keeps semantic matching (matching by meaning) for questions in plain language.","correct":true},{"text":"Add a reranking step that scores the 100 embedding candidates against the question, and pass only the highest-scoring passages to Claude for the answer.","explanation":"A reranker only changes the order of the candidates that first-stage retrieval returns. The traces show that the correct runbook section is not among the 100 candidates, so no ordering of them can give that section to Claude. Reranking becomes useful after the candidate set contains the right section.","correct":false},{"text":"Instruct Claude to say that it lacks enough information whenever none of the retrieved passages contains the error code that appears in the question.","explanation":"Allowing Claude to say that it lacks information is good grounding practice, and it would reduce wrong answers on these questions. It does not change what retrieval returns, so employees would still get no answer even though the runbook section exists. The cause is the missing candidate, not the way Claude uses the passages.","correct":false},{"text":"Replace the embedding model with a larger general-purpose one, re-embed all two million documents, and rerun the evaluation suite on the new index.","explanation":"A larger embedding model still compares passages by their meaning, and sections that describe similar errors with different codes have almost the same meaning. The new model may change some rankings, but it does not add matching on the exact code string. Re-embedding two million documents is also a large cost for a change that leaves the cause in place.","correct":false}],"answer":"<p>Correct answer: <strong>Add a BM25 keyword index over the same chunks, and combine its results with the embedding results by rank fusion before choosing passages for Claude.</strong></p><p>A wrong answer from a retrieval pipeline can come from one of three stages. First-stage retrieval may not return the right passage. The ranking step may not place it among the passages sent to the model. Or the model may have the passage and use it badly. The traces show which stage failed. The runbook section for the asked code is not among the 100 candidates, and Claude answers correctly when the team supplies that section. The failure is therefore in first-stage retrieval, and the fix must change which passages enter the candidate set.</p><p>Embedding search compares the meaning of the question with the meaning of each chunk. Two runbook sections that describe similar errors have almost the same meaning, and a code such as ERR-4417 adds very little to the embedding vector. This is why the candidates describe similar errors with different codes. BM25 is a lexical ranking method, which means that it works with the words themselves. It scores a chunk by how well its words match the words in the question, and it gives more weight to words that are rare in the collection. An error code or a product name is a rare term, so the chunk that contains it receives a high score. In hybrid search, the pipeline runs both searches, merges the two result lists with rank fusion, removes duplicates, and then selects the top passages. Questions in plain language still benefit from the embedding results, and questions with exact identifiers benefit from the BM25 results. See Introducing Contextual Retrieval for the combined BM25 and embedding flow. Before release, the team should confirm the improvement on the error-code cases in the evaluation suite. The BM25 index must also be updated with the daily document changes, in the same way as the embedding index.</p><p>The other changes improve a different stage or leave the cause in place. A reranker scores the candidates again and changes their order, so it helps when the right passage is retrieved but ranked too low. It cannot add a passage that first-stage retrieval never returned. Telling Claude to state that it lacks enough information is good grounding practice, and it would replace some wrong answers with an honest refusal. However, the employee still gets no answer, even though the runbook section exists. A larger embedding model may separate some similar passages better, but it still matches by meaning and does not add matching on the exact code string. Re-embedding two million documents is also a high cost for an uncertain gain. The embeddings guide covers embedding model choice and rerankers, which are useful to tune after the candidate set contains the right passages.</p>","tip":"","reference":"Supplied Claude practice questions, question 65. Domain: Production Integration, Reliability, and Knowledge Grounding.","answerStatus":"source"},{"query":"Scenario: An enterprise software company gives its 12,000 employees a Claude assistant that answers questions from about two million internal documents, including design notes, runbooks, HR policies and sales material. A retrieval pipeline built on an embedding index finds the passages for each answer. Documents change daily, and questions often contain product names and error codes. The search team runs an evaluation suite before every release.\n\nQuestion: The search team wants an LLM judge to label each answer in the evaluation suite as correct or incorrect. Two engineers labeled the same 400 answers; their Cohen's kappa against each other is only 0.38, and the judge's kappa against each engineer is about the same. Most disagreements are on answers that correctly quote a document version that has since been replaced. Which action should the team take first?","type":"multiple-choice","options":[{"text":"Move the judge to a larger, more capable model with thinking turned on, then measure its kappa against each engineer's labels again before it scores answers for any release.","explanation":"A more capable model with thinking turned on can improve complex judgments, but the judge would still follow a rubric that does not cover replaced document versions. It would also still be compared with labels on which the two engineers do not agree, so its kappa would remain hard to interpret. The cause is the case that the rubric does not define, not the capability of the judge.","correct":false},{"text":"Add one engineer's labeled answers that quote replaced document versions to the judge prompt as examples, then tune the prompt until kappa against that engineer is acceptable.","explanation":"Examples can make a judge agree more closely with a rater, and that helps when the rater's labels are reliable. With these labels, the examples would make the judge copy one engineer's unwritten way of judging answers that quote replaced versions, and the other engineer does not judge them the same way. The team would get high agreement with one person and still have no agreed definition of a correct answer.","correct":false},{"text":"Remove the answers on which the two engineers disagree from the labeled set, then calibrate the judge on the remaining answers and use its scores for release decisions.","explanation":"Calibrating only on labels that both engineers agree on is reasonable when disagreements are rare and spread across many kinds of answers. In this set, the disagreements are concentrated on answers that quote replaced versions, and documents change daily. The judge would therefore never be checked on a case that it will see often. The measured agreement would rise, but nobody would know how reliable the judge is on those answers.","correct":false},{"text":"Add a rubric rule for answers that quote a replaced document version, have both engineers relabel the set, then calibrate the judge once their kappa is acceptable.","explanation":"The engineers' low kappa against each other shows that the human labels are not a reliable reference, and the disputed answers share one case that the rubric does not define. Writing the rule and relabeling the set gives a reference that two people can reproduce. The team needs that reference before the judge's agreement with it means anything. Because documents change daily, this case is common and must be defined.","correct":true}],"answer":"<p>Correct answer: <strong>Add a rubric rule for answers that quote a replaced document version, have both engineers relabel the set, then calibrate the judge once their kappa is acceptable.</strong></p><p>Cohen&#x27;s kappa measures how often two raters give the same label, after removing the agreement they would reach by chance. When an LLM judge has a low kappa against a human, a team usually changes the judge. The evidence in this question points to a different cause, because the two engineers also have a low kappa against each other. The human labels are the reference that the judge is measured against. If two people who know the system cannot give the same label to the same answer, the reference is not reliable. The judge&#x27;s agreement with either engineer then cannot show whether the judge is good or bad.</p><p>The pattern in the disagreements shows the cause. The disputed answers correctly quote a document version that was later replaced. One engineer can judge such an answer as correct because it matches its source. The other engineer can judge it as incorrect because the content is out of date. The rubric does not say which judgment applies. Documents in this corpus change daily, so this case will appear often in every evaluation run and cannot stay undefined. The first step is to write the rule into the rubric, have both engineers relabel the set with the new rule, and confirm that their agreement has risen. After that, the team can calibrate the judge, with the same rubric text in the judge prompt. Anthropic&#x27;s guidance on LLM-based grading asks for detailed, clear rubrics and says to test a grader for reliability before using it at scale. It also lists ambiguous cases, where humans find it hard to agree, as an edge case that an evaluation set must account for. See Define success criteria and build evaluations.</p><p>The other actions change the judge while the reference stays unreliable. A more capable model with thinking turned on can help with complex judgments, but it receives the same unclear rubric and is compared with the same inconsistent labels. Examples taken from one engineer make the judge copy that person&#x27;s unwritten way of judging, which the team has not agreed on. Removing the disputed answers raises the measured agreement, but then the judge is never checked on answers that quote replaced versions, and these answers are common in this system. The Building evals cookbook makes a related point: a team learns whether a model-based grader works only by trying it and reading samples of its grades. That check needs labels that the team can trust.</p>","tip":"","reference":"Supplied Claude practice questions, question 66. Domain: Evaluation Engineering and Quality Assurance.","answerStatus":"source"},{"query":"Scenario: An enterprise software company gives its 12,000 employees a Claude assistant that answers questions from about two million internal documents, including design notes, runbooks, HR policies and sales material. A retrieval pipeline built on an embedding index finds the passages for each answer. Documents change daily, and questions often contain product names and error codes. The search team runs an evaluation suite before every release.\n\nQuestion: The search team's assistant reaches the retrieval pipeline through the MCP connector on the Claude API. A circuit breaker sends traffic to Amazon Bedrock when the API returns overloaded errors. During last week's first real failover, the retrieval pipeline stayed healthy, but every Bedrock request was rejected with a 400 invalid request error; Bedrock does not support the MCP connector. Which change best makes the fallback reliable?","type":"multiple-choice","options":[{"text":"Schedule a weekly drill that opens the circuit breaker for a small share of production traffic and alerts the search team whenever fallback requests are rejected.","explanation":"A regular failover drill is good practice, and it would have found this problem before a real overload. However, a drill only detects the failure. The fallback request still contains a feature that Bedrock does not support, so every drill would report the same rejection until the request itself is changed.","correct":false},{"text":"Give the fallback request a client-side search tool that application code runs against the retrieval pipeline, and run the evaluation suite on that path before each release.","explanation":"Bedrock supports client-side tool use, so Bedrock accepts this fallback request. The retrieval pipeline stayed healthy during the overload, so Claude can still search the current internal documents. Running the evaluation suite on the fallback path before each release confirms that the path still works and that answer quality is acceptable after each prompt or retrieval change.","correct":true},{"text":"Give the fallback request a weekly snapshot of the most-requested internal documents inside a cached system prompt, and run the evaluation suite on that path before each release.","explanation":"Bedrock accepts this request, and a snapshot would be a reasonable fallback for a small corpus that rarely changes. This corpus has about two million documents that change daily. A weekly snapshot of the most-requested ones soon becomes out of date, and it misses most questions that contain a specific product name or error code. The retrieval pipeline stayed healthy during the overload, so the fallback does not need to give up live search.","correct":false},{"text":"Remove the Bedrock fallback and hold requests in a queue with a longer backoff window until the Claude API stops returning overloaded errors.","explanation":"This stops the 400 errors, but it also removes the only path that could answer employees during an overload. Employees would wait for the whole overload period, and that is the failure the fallback was built to prevent.","correct":false}],"answer":"<p>Correct answer: <strong>Give the fallback request a client-side search tool that application code runs against the retrieval pipeline, and run the evaluation suite on that path before each release.</strong></p><p>A fallback to another platform helps only if that platform accepts the request that is sent to it. Claude on Amazon Bedrock does not support every feature of the first-party Claude API, and the MCP connector is one of the features listed as not supported. The assistant&#x27;s normal request includes mcp_servers, so Bedrock rejects it as an inv
