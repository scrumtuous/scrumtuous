sts from the same viewer. How should the prompt be organized for cross-viewer caching?","type":"multiple-choice","options":[{"text":"Put the shared system prompt first with a breakpoint, then the viewer's profile with a second one.","explanation":"The cache matches a prefix, so content that is the same for everyone must come before content that differs. With the shared tools and system prompt first, that part is read from the cache by every request from every viewer. A second breakpoint after the profile caches the personal part for that viewer's later requests.","correct":true},{"text":"Keep the order, and extend the cache duration to 1 hour so that each viewer's entry stays available for longer.","explanation":"A longer duration helps a viewer who returns within the hour. The first request of every viewer session would still miss, because the cached prefix begins with that viewer's profile.","correct":false},{"text":"Remove the viewing profile from all requests so that every request has the same prefix.","explanation":"This would make the prefix shared, but it removes the personal information that makes recommendations useful. Reordering achieves sharing with no loss of the profile.","correct":false},{"text":"Add a cache breakpoint after every message in the conversation so that more of each request is cached.","explanation":"Breakpoints inside the conversation do not help while the prefix begins with content that differs for each viewer. A request also has a limit on the number of breakpoints.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003ePut the shared system prompt first with a breakpoint, then the viewer\u0026#x27;s profile with a second one.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003ePrompt caching matches a \u003cstrong\u003eprefix\u003c/strong\u003e exactly. If content that is specific to one viewer comes first, every viewer has a different prefix, and the 5,000-token system prompt that all viewers share is cached again for each person. The rule for ordering is: \u003cstrong\u003emost widely shared and most stable content first\u003c/strong\u003e, then content shared by fewer requests, and the most variable content last.\u003c/p\u003e\n\u003cp\u003eCache breakpoints act as \u003cstrong\u003echeckpoints\u003c/strong\u003e along this order. A request can have up to four. A first breakpoint after the tools and the shared system prompt creates an entry that every request can read. With 8 million requests a day, this entry is always in use. A second breakpoint after the viewer's profile creates an entry for that viewer's session. The conversation follows. A cache read is priced at a small fraction of normal input and also lowers \u003cstrong\u003etime to first token\u003c/strong\u003e, because the cached prefix is not processed again. That is the stage this team needs to improve.\u003c/p\u003e\n\u003cp\u003eA longer duration and more breakpoints inside the conversation do not correct an order that places personal content first. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\"\u003ePrompt caching\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-use-with-prompt-caching\"\u003eTool use with prompt caching\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Cost and Latency Optimization at Scale — source question 42","answerStatus":"source"},{"query":"A voice copilot handles mostly simple one-tool commands, but all requests use an expensive model at high effort and load 22 tool definitions; five tools serve 97% of requests. Which TWO changes reduce cost without weakening open-ended requests? (Select TWO.)","type":"multiple-choice","options":[{"text":"Route simple commands to a smaller model at low effort.","explanation":"This is correct. Simple commands are a large part of the traffic, are easy to check, and do not need deep reasoning. A smaller model at low effort handles them at much lower cost and with less delay, and open requests keep the configuration that their quality depends on.","correct":true},{"text":"Send all requests through the Message Batches API, which processes them asynchronously, to obtain the 50% discount.","explanation":"This is incorrect. Batch processing is asynchronous and can take up to 24 hours. A viewer who is waiting to hear a reply needs an answer in about a second.","correct":false},{"text":"Enable fast mode on all requests so that replies are generated more quickly.","explanation":"This is incorrect. Fast mode gives higher output speed at a higher price. It increases cost, which is the opposite of what finance has asked for.","correct":false},{"text":"Raise max_tokens on all requests so that replies are never cut off.","explanation":"This is incorrect. A higher output limit does not reduce cost. Replies to simple commands are short and are not close to the limit.","correct":false},{"text":"Keep the 5 common tools loaded, and defer the 17 rarely used tools behind tool search.","explanation":"This is correct. Tool definitions are input tokens on every request. Deferring the tools that are seldom needed removes most of those tokens from 97% of requests, and the tools can still be loaded when a request needs them.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answers:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eRoute simple commands to a smaller model at low effort.\u003c/li\u003e\u003cli\u003eKeep the 5 common tools loaded, and defer the 17 rarely used tools behind tool search.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAt fleet scale, cost depends on a small number of decisions that apply to every request: which \u003cstrong\u003emodel and effort\u003c/strong\u003e handle it, and how many \u003cstrong\u003einput tokens\u003c/strong\u003e it carries. The usage data points to both.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eRouting\u003c/strong\u003e: 80% of the traffic consists of simple commands with one tool. Anthropic's cost guidance describes smaller models as suited to high-volume work with outputs that can be checked, and describes effort as the main control for speed and cost within a model. A router, which can use a small model or a rule on the transcript, sends simple commands to the inexpensive configuration, and open requests continue to use the stronger one. A \u003cstrong\u003ecascade\u003c/strong\u003e is a variation: try the inexpensive configuration first and escalate when a checker reports that the result is not good enough. \u003cstrong\u003eTool context\u003c/strong\u003e: the 22 definitions are sent with every request. The guidance on managing tool context is to keep the few most-used tools loaded and to defer the others with tool search, so that their definitions enter the context only when they are needed.\u003c/p\u003e\n\u003cp\u003eThe batch API and fast mode solve other problems: work that can wait, and work that needs output speed whatever the cost. Routing should be confirmed by measuring cost for each completed request and quality for each segment. See \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\"\u003eOptimizing for cost and intelligence\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/manage-tool-context\"\u003eManage tool context\u003c/a\u003e. See also \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-search-tool\"\u003eTool search tool\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect TWO answers.\u003c/p\u003e","reference":"Cost and Latency Optimization at Scale — source question 43","answerStatus":"source"},{"query":"A proposed recommendation explanation adds about 400 output tokens to 20% of requests. Finance wants monthly cost estimates and uncertainty ranges. How should the team forecast the impact?","type":"multiple-choice","options":[{"text":"Multiply the current monthly bill by 1.2, because the feature affects 20% of requests.","explanation":"The current bill is mostly input tokens for the existing prompt. The feature adds output tokens, which have a different and higher price, so a simple percentage of the current bill has no clear relation to the real cost.","correct":false},{"text":"Launch the feature to all viewers, and read the cost from the first monthly invoice.","explanation":"This gives the true cost one month late and with no chance to adjust. A forecast is meant to support a decision before the money is spent.","correct":false},{"text":"Model cost from tokens by type, prices, and volume, with ranges, and run a canary.","explanation":"A cost model built from token counts for each type of token, the price of each type, and the expected volume shows what the feature adds and why. Ranges for uncertain inputs, such as how often the feature is used and how long the explanations are, give finance a low and a high figure. A canary on a small share of traffic confirms the assumptions.","correct":true},{"text":"Ask the model to estimate how much the new feature will cost for each month.","explanation":"The model has no information about Lumen's traffic, prices, or usage patterns. Its answer would be a guess with no basis in data.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eModel cost from tokens by type, prices, and volume, with ranges, and run a canary.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eCost modeling\u003c/strong\u003e for a Claude workload starts from unit costs. The cost of a request is the sum over token types (uncached input, cache writes, cache reads, and output) of the token count multiplied by the price for that type. Output tokens cost several times more than input tokens, and cache reads cost a small fraction of normal input. A feature that adds 400 output tokens therefore affects cost very differently from one that adds 400 cached input tokens.\u003c/p\u003e\n\u003cp\u003eA useful \u003cstrong\u003eforecast\u003c/strong\u003e has three parts. The first is the model: cost for each request with the feature, multiplied by the expected number of requests that use it. The second is \u003cstrong\u003eranges\u003c/strong\u003e. The uncertain inputs are the share of requests that trigger the feature, the real length of the explanations, and the cache-read share. Low, expected, and high values for each give finance a range. The third is \u003cstrong\u003evalidation\u003c/strong\u003e. A canary on a small share of traffic records real usage with the feature on, and the forecast is updated before the full launch. The same telemetry later supports alerts on the budget.\u003c/p\u003e\n\u003cp\u003eScaling the present bill and waiting for the invoice both ignore the difference between token types. See \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\"\u003eOptimizing for cost and intelligence\u003c/a\u003e, which shows how to calculate the price of a request from its usage fields.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Cost and Latency Optimization at Scale — source question 44","answerStatus":"source"},{"query":"At peak, a voice app gets 429 errors. Requests-per-minute usage is 97%, while input/output token limits are only 35%/30%. Every user request makes one classification call and one action call. What is the binding limit and best remedy?","type":"multiple-choice","options":[{"text":"Input tokens are the constraint, so the team should shorten the system prompt by removing rarely used instructions.","explanation":"Input tokens are at 35% of their limit, so they are not the constraint. A shorter prompt would not reduce the number of requests.","correct":false},{"text":"Output tokens are the constraint, so the team should ask the model to give shorter spoken replies.","explanation":"Output tokens are at 30% of their limit. Shorter replies would not change the number of requests that the application sends.","correct":false},{"text":"Requests per minute are the constraint, so the team should remove the separate classification call and request a higher limit with this data.","explanation":"The headers show the request limit at 97%, with both token limits far below their maximum. The count of requests is therefore the constraint. Two calls for each viewer request double that count. Combining classification with the main call, or classifying with a rule, reduces it by half, and the measured peak supports a request for a higher limit.","correct":true},{"text":"No limit is the constraint yet, so the team should add retries with no delay to push the failed requests through.","explanation":"The headers show that the request limit is almost used up. Retries with no delay add more requests to that limit and increase the failures.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eRequests per minute are the constraint, so the team should remove the separate classification call and request a higher limit with this data.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eCapacity planning begins with identifying the \u003cstrong\u003ebinding constraint\u003c/strong\u003e. The Claude API limits requests per minute (RPM), input tokens per minute (ITPM), and output tokens per minute (OTPM) separately, and the \u003ccode\u003eanthropic-ratelimit-*\u003c/code\u003e headers report the remaining amount for each. Here RPM is almost used up while both token limits have a large margin. This pattern is typical of an application that sends many small requests.\u003c/p\u003e\n\u003cp\u003eThe effective response reduces the \u003cstrong\u003enumber of requests\u003c/strong\u003e. Lumen makes two calls for each viewer request. The classification can be merged into the main call, so that the model chooses its tools directly, or it can be done by a rule for the common commands. Either change halves the RPM usage at once. If growth requires more, the team can ask for a higher limit, and the measured peak RPM, ITPM, and OTPM are the evidence that the request needs. Limits are also enforced over short intervals, so a burst within a few seconds can raise 429 errors although the average for the minute is below the limit. Smoothing the bursts helps.\u003c/p\u003e\n\u003cp\u003eShorter prompts and shorter replies act on limits that are not binding. See \u003ca href=\"https://platform.claude.com/docs/en/api/rate-limits\"\u003eRate limits\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/api/errors\"\u003eClaude API errors\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 45","answerStatus":"source"},{"query":"A failover from the Claude API to a second cloud provider rejected every request because it used an unsupported beta feature and model ID. How should a reliable cross-provider fallback be prepared?","type":"multiple-choice","options":[{"text":"Remove the fallback path, because it failed at the moment when it was needed.","explanation":"The fallback failed because it was not configured and tested for its platform. Removing it would leave the service with no protection during the next incident.","correct":false},{"text":"Keep a tested configuration for each platform, and exercise the fallback path regularly.","explanation":"Platforms differ in model identifiers, supported features, and beta headers. A fallback needs its own request configuration that uses only what the fallback platform supports. Regular exercises, such as sending a small share of real traffic through the fallback, show that it works before an incident.","correct":true},{"text":"Send the same requests to the fallback, and retry each failed request five times with exponential backoff.","explanation":"A validation error means that the request is not valid for that platform. The same request will fail on every retry, however long the wait.","correct":false},{"text":"Move the primary deployment to the cloud platform, and use the direct API as the fallback.","explanation":"Exchanging the roles leaves the same weakness. The two paths would still have different capabilities, and the new fallback would be untested in the same manner.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eKeep a tested configuration for each platform, and exercise the fallback path regularly.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA \u003cstrong\u003ecross-platform fallback\u003c/strong\u003e protects against an outage of one provider path, but only if the fallback path works. Claude is available on the first-party API and on several cloud platforms, and these do not have identical capabilities. Model identifiers have different formats. New and beta features may arrive later on a cloud platform or may not be available there. Some request parameters also differ. A request that is valid on one platform can be rejected on another.\u003c/p\u003e\n\u003cp\u003eA resilient design therefore keeps a \u003cstrong\u003econfiguration for each platform\u003c/strong\u003e: the model ID, the supported features, and the headers for each path. Where the fallback platform lacks a feature, the application \u003cstrong\u003edegrades gracefully\u003c/strong\u003e. For example, it serves the request without an optional feature and does not fail. The design also includes \u003cstrong\u003eregular testing\u003c/strong\u003e. An automated check validates the fallback configuration when either configuration changes, and a small share of production traffic is sent through the fallback from time to time. A fallback that has never carried real traffic cannot be relied on.\u003c/p\u003e\n\u003cp\u003eRetries do not help with a validation error, which is the same on every attempt. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/claude-in-amazon-bedrock\"\u003eClaude in Amazon Bedrock\u003c/a\u003e for feature availability on that platform, and \u003ca href=\"https://platform.claude.com/docs/en/api/errors\"\u003eClaude API errors\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 46","answerStatus":"source"},{"query":"The mean total latency is steady, but users in two regions sometimes wait five seconds before hearing the first word. Which production metric best reflects this tail-latency problem?","type":"multiple-choice","options":[{"text":"The 95th percentile of time to first spoken word, by region.","explanation":"The target is about when the viewer first hears a reply, so the indicator should measure that moment. High percentiles show the experience of the slowest requests, which a mean hides. A division by region reveals the two affected regions.","correct":true},{"text":"The mean total request time, calculated each minute in place of each hour.","explanation":"A mean hides slow requests at any time interval. A few five-second requests among many fast ones change the mean very little.","correct":false},{"text":"The maximum total request time seen in each day, shown as a single number.","explanation":"One maximum value reflects a single extreme request and changes unpredictably. It does not show how many viewers are affected or where they are.","correct":false},{"text":"The number of requests served in each hour, divided by region.","explanation":"The number of requests measures demand, not speed. It could not reveal slow replies.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe 95th percentile of time to first spoken word, by region.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA service level indicator should measure \u003cstrong\u003ewhat the user experiences\u003c/strong\u003e. The product target is \u0026quot;first spoken word within 1.2 seconds,\u0026quot; so the indicator is the time to the first spoken word. Total request time is a different quantity, because it includes the generation of the rest of the reply after the viewer has begun to hear it.\u003c/p\u003e\n\u003cp\u003eA \u003cstrong\u003emean\u003c/strong\u003e is also a poor statistic for latency. Latency distributions have a long tail. Most requests are fast, and a few are much slower. The mean changes little when the tail becomes worse, and the tail is what causes complaints. \u003cstrong\u003ePercentiles\u003c/strong\u003e such as the 95th and 99th describe the slowest requests directly. Dividing the indicator by \u003cstrong\u003eregion\u003c/strong\u003e prevents a problem in two regions from being hidden by the global figure, and a breakdown by \u003cstrong\u003estage\u003c/strong\u003e (speech-to-text, model time to first token, tools, text-to-speech) points to the component that is responsible.\u003c/p\u003e\n\u003cp\u003eWith these in place, the objective can be written precisely, for example \u0026quot;95% of requests in every region reach the first spoken word within 1.2 seconds,\u0026quot; and alerts can be based on it. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency\"\u003eReducing latency\u003c/a\u003e, which distinguishes time to first token from total latency, and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/streaming\"\u003eStreaming messages\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 47","answerStatus":"source"},{"query":"A fraud agent suddenly clears 91% of flagged transactions, with potentially irreversible losses. The cause is unknown, and human analysts are available. What is the safest first incident action?","type":"multiple-choice","options":[{"text":"Watch the clearing rate for another two hours to see whether it returns to 62% without action.","explanation":"Each minute at a 91% clearing rate may allow fraudulent payments that cannot be reversed. Waiting accepts loss that is continuing, in the hope that an unknown cause will disappear.","correct":false},{"text":"Begin to read the agent's recent transcripts one by one to understand what has changed in its reasoning.","explanation":"Investigation is necessary, but it should not come first while the agent is still clearing transactions. The harm continues during every minute of reading.","correct":false},{"text":"Lower the agent's effort level so that it clears fewer transactions for the rest of the night.","explanation":"Effort changes how thoroughly the model works. It is not a control on decisions, and there is no reason to expect that it would return the clearing rate to normal.","correct":false},{"text":"Stop automatic clearing and send all flagged transactions to the analysts, and then investigate.","explanation":"The first duty in an incident is to stop the harm. Clearing a fraudulent transaction cannot be undone, and analysts have capacity, so sending every flagged transaction to them is a safe temporary state. With the agent no longer clearing, the cause can be investigated with no further loss.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eStop automatic clearing and send all flagged transactions to the analysts, and then investigate.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eIncident response has a fixed order: \u003cstrong\u003etriage, mitigate, diagnose\u003c/strong\u003e. Triage establishes that the problem is real, serious, and continuing. A sudden change from 62% to 91% in a decision that cannot be reversed meets all three conditions. Mitigation stops the harm with the safest action available, and it does not need a diagnosis.\u003c/p\u003e\n\u003cp\u003eFor an agent that takes consequential actions, the safest mitigation is usually a \u003cstrong\u003esafe mode\u003c/strong\u003e: the autonomous action is switched off and every case goes to the human path. Systems should be built with this switch in advance, so that one configuration change turns \u0026quot;clear or hold\u0026quot; into \u0026quot;always hold for an analyst.\u0026quot; The cost of the mitigation is a longer queue for the analysts, which is small and recoverable. The cost of delay is completed fraud, which is not recoverable. That difference decides the action.\u003c/p\u003e\n\u003cp\u003eAfter mitigation, the team keeps the evidence (traces, tool results, and the model version in the responses) and diagnoses without time pressure. See \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/permission-policies\"\u003ePermission policies\u003c/a\u003e for holding actions for approval, and \u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\"\u003eBuilding effective agents\u003c/a\u003e on human checkpoints for consequential actions.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Debugging and Incident Response — source question 48","answerStatus":"source"},{"query":"A fraud agent's decision rate shifted at 02:10 without a deployment. Possible causes include a model alias change, MCP server change, or upstream rules update. How should investigators locate the cause reliably?","type":"multiple-choice","options":[{"text":"Ask the agent to explain why its clearing rate has risen since 02:10.","explanation":"The agent has no view of its own aggregate behavior or of changes in systems outside it. Its answer would be a plausible account that is not based on evidence.","correct":false},{"text":"Compare each dependency's change records with the time of the change.","explanation":"With no change of Halcyon's own, the cause is in a dependency. Each dependency leaves evidence: the model field in each response shows which version answered, the MCP server has deployment records, and the rules engine has its own releases and its mix of flagged transactions. Matching these against 02:10 identifies the change.","correct":true},{"text":"Assume that the model version changed, because the alias is the only automatic change in the system.","explanation":"The alias is one possible cause, but an assumption is not evidence. Acting on it could mean fixing the model version while the real cause, in another dependency, remains.","correct":false},{"text":"Re-run yesterday's transactions through the agent, and see whether the clearing rate is 62% or 91%.","explanation":"A replay can show whether the agent now behaves differently on old inputs, which is useful. It does not show which dependency changed, and it would use the current tool behavior and not yesterday's.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eCompare each dependency\u0026#x27;s change records with the time of the change.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eWhen a system changes behavior with no deployment of its own, the cause is in something that it \u003cstrong\u003edepends on\u003c/strong\u003e. An agent has several kinds of dependency: the model (especially through an alias that moves), the tools and the services behind them, the data that those tools return, and the inputs that arrive from upstream. Diagnosis means collecting \u003cstrong\u003eevidence of change\u003c/strong\u003e for each dependency and matching it to the time at which the behavior changed.\u003c/p\u003e\n\u003cp\u003eThe evidence exists if the telemetry was designed well. Each API response includes the exact model that served it, so a version change appears in the traces. The MCP server has deployment records, and its responses can be compared before and after 02:10. The rules engine has release records, and the mix of flagged transactions can be compared. A change that matches the time is the first suspect, and a replay of affected inputs can then confirm it.\u003c/p\u003e\n\u003cp\u003eA model's explanation of its own aggregate behavior is not evidence, and an assumption about one dependency may leave the real cause in place. This incident also shows why dependencies should be pinned and why their versions should be recorded in every trace. See \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/overview\"\u003eModels overview\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions\"\u003eModel IDs and versioning\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/observability\"\u003eObservability with OpenTelemetry\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Debugging and Incident Response — source question 49","answerStatus":"source"},{"query":"At 02:05, an MCP tool silently began returning only the ten newest events, hiding old fraud flags; unsafe clearing followed. Leadership has not been told. What should the incident lead communicate now?","type":"multiple-choice","options":[{"text":"Wait until a complete root cause report is written, and then send it to all stakeholders on Monday.","explanation":"Stakeholders need to know now that transactions may have been cleared wrongly, so that they can begin to review them. A report on Monday delays that work by two days.","correct":false},{"text":"Send a factual update now: impact, mitigation, open questions, and the time of the next update.","explanation":"Communication during an incident should be timely, factual, and useful for action. Stakeholders need the confirmed facts, the period and number of affected transactions, the current mitigation, the open questions, and the time of the next update. With this, the fraud team can review the affected transactions and compliance can assess its duties.","correct":true},{"text":"Send a short message saying that there was a minor technical problem and that it has been resolved.","explanation":"The message hides the impact. Transactions were cleared with incomplete information for almost an hour, and the people responsible for fraud losses and for compliance need to know that.","correct":false},{"text":"Send every engineer and executive the complete trace data, and let each person form an opinion.","explanation":"Raw traces are not communication. Most recipients cannot interpret them, and the important facts would be lost in the volume.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eSend a factual update now: impact, mitigation, open questions, and the time of the next update.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eCommunication\u003c/strong\u003e is part of incident response. It should start as soon as the impact is understood, not when the investigation is finished. The people who must act on the incident, here the fraud operations director who has to review cleared transactions and the compliance team that has to assess reporting duties, cannot begin until they are informed.\u003c/p\u003e\n\u003cp\u003eA good incident update is short and has a fixed structure. It states \u003cstrong\u003ewhat happened\u003c/strong\u003e in plain language, the \u003cstrong\u003eimpact\u003c/strong\u003e (which decisions were affected, in what period, and about how many), the \u003cstrong\u003emitigation\u003c/strong\u003e that is in place, \u003cstrong\u003ewhat is known and what is not yet known\u003c/strong\u003e, and \u003cstrong\u003ewhen the next update will come\u003c/strong\u003e. It contains facts and does not speculate or assign blame. Updates continue at the stated times until the incident is closed. The full analysis comes later, in the postmortem.\u003c/p\u003e\n\u003cp\u003eA message that makes the impact seem smaller damages trust and delays the response. Raw data sent to everyone moves the work of analysis to people who cannot do it. A record of affected transactions for the period, taken from traces, is the first item that the fraud team will need. See \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e on turning production failures into tests after an incident.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Debugging and Incident Response — source question 50","answerStatus":"source"},{"query":"A fraud agent silently changes its decision mix while HTTP errors and latency remain normal. What monitoring detects this kind of behavioral regression within minutes?","type":"multiple-choice","options":[{"text":"A stricter latency alert, because slow tool responses often come before incorrect tool results.","explanation":"Latency was normal during the incident. The tool answered quickly and returned incomplete data, so a latency alert of any strictness would have stayed silent.","correct":false},{"text":"A daily email that lists the number of transactions that the agent processed on the day before.","explanation":"The number of transactions does not show how they were decided. The email would also arrive many hours after a change that needed a response within minutes.","correct":false},{"text":"A rule that the other team must send an email before any deployment of the MCP server.","explanation":"Notice of a change is helpful, but it covers one cause and depends on people remembering. It would not detect a model change, a data problem, or a change that was thought to be harmless.","correct":false},{"text":"An alert on the mix of the agent's decisions, and probe transactions with known outcomes.","explanation":"The incident was a change in what the agent decided, with no error. An alert that is raised when the clearing rate leaves its normal range detects such a change from any cause. Probe transactions with known answers, sent through the live system on a schedule, add a direct test: if a known fraudulent case is cleared, something is wrong.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eAn alert on the mix of the agent\u0026#x27;s decisions, and probe transactions with known outcomes.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThe lesson is that an agent can fail \u003cstrong\u003esilently\u003c/strong\u003e. Every request succeeds, latency is normal, and the decisions are wrong. Monitoring of health signals cannot detect this. Two kinds of monitoring can, and they do not depend on the cause.\u003c/p\u003e\n\u003cp\u003eThe first is \u003cstrong\u003ebehavioral monitoring\u003c/strong\u003e. The agent's outputs have a distribution that is stable in normal operation: the share cleared and the share held, the number of tool calls for each case, and the length of the assessments. An alert that is raised when a distribution leaves its normal range detects drift whether it comes from a tool, a model version, a prompt, or the data. The clearing rate here would have raised an alert within minutes of 02:10. The second is \u003cstrong\u003esynthetic probes\u003c/strong\u003e. Cases with known correct outcomes are sent through the production path at regular intervals, and a wrong outcome raises an alert at once. Probes test the whole chain, including dependencies that another team owns.\u003c/p\u003e\n\u003cp\u003eThe postmortem should also turn the incident into \u003cstrong\u003eregression tests\u003c/strong\u003e, such as accounts whose fraud flags are older than the ten most recent events, and into a contract test with the MCP server. A notice by email covers one cause and depends on people. See \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e and \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/observability\"\u003eObservability with OpenTelemetry\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Debugging and Incident Response — source question 51","answerStatus":"source"},{"query":"An agent may irreversibly clear flagged transfers of any amount; it has cleared transfers above $50,000. How can small transactions stay automated while large ones require human oversight?","type":"multiple-choice","options":[{"text":"Tell the agent in its system prompt to take extra care with transactions above $50,000.","explanation":"An instruction asks for care but enforces nothing. During the incident the agent believed, from incomplete data, that the accounts were clean, and extra care would not have changed that belief.","correct":false},{"text":"Enforce in code that the agent can clear only transactions below a set amount, and require analyst approval above it.","explanation":"An action that cannot be reversed needs a limit that does not depend on the model's judgment. A check in the tool or the harness that allows automatic clearing only below a threshold, and holds larger amounts for approval, limits the possible loss from any failure. The agent continues to handle the small transactions.","correct":true},{"text":"Remove the agent's ability to clear any transaction, and send every flagged transaction to an analyst.","explanation":"This is safe, but it gives up the automation for the large number of small transactions that the director wants the agent to keep handling. The risk is concentrated in large amounts.","correct":false},{"text":"Have the agent state its confidence in each decision, and allow it to clear a transaction when the stated confidence is high.","explanation":"Confidence that the model states about itself is not a reliable measure. During the incident, the agent would have been confident, because the data that it saw looked clean.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eEnforce in code that the agent can clear only transactions below a set amount, and require analyst approval above it.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eUnsafe autonomy\u003c/strong\u003e exists when an agent can take an action that has a large effect and cannot be reversed, on its own judgment alone, with no limit outside the model. The agent's judgment depends on its inputs, and this incident shows that inputs can be wrong with no warning. The protection must therefore not depend on judgment.\u003c/p\u003e\n\u003cp\u003eThe control is \u003cstrong\u003edeterministic enforcement in proportion to risk\u003c/strong\u003e. The clear_transaction tool, or a hook in front of it, checks the amount in code. Below a threshold, the action proceeds. Above it, the action is held for approval by a human analyst. Other deterministic conditions can be added, for example that a transaction may not be cleared automatically when the account history response is marked as incomplete. This limits the \u003cem\u003eblast radius\u003c/em\u003e: whatever goes wrong with the model, the tools, or the data, the largest automatic loss is limited by a rule that does not fail in the same way as the agent.\u003c/p\u003e\n\u003cp\u003ePrompt instructions and stated confidence both depend on the reasoning that failed. Removing all autonomy gives up value where the risk is low. See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/hooks\"\u003eAgent SDK hooks\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/permissions\"\u003eAgent SDK permissions\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/permission-policies\"\u003ePermission policies\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 52","answerStatus":"source"},{"query":"An MCP team silently changed an account-history tool to return only ten records, breaking its fraud-agent consumer. Which integration practice prevents incompatible tool changes?","type":"multiple-choice","options":[{"text":"Require the fraud team to read the MCP server's source code each week to look for changes.","explanation":"Reading code by hand each week is slow and easy to miss, and it finds a change only after deployment. It also does not scale to more consumers and more servers.","correct":false},{"text":"Stop all changes to the MCP server, so that its behavior stays the same permanently.","explanation":"A server that can never change cannot be improved or corrected. The need is for controlled change, not for no change.","correct":false},{"text":"Version the tools and schemas, and run consumer contract tests in the server's pipeline.","explanation":"A tool is an interface with consumers. Versioning makes a breaking change explicit: the old behavior remains while consumers move to the new version. Contract tests written by consumers, such as \"the history includes every fraud flag,\" run in the server's pipeline and fail before a breaking change is deployed.","correct":true},{"text":"Have the agent call account_history twice on each transaction and compare the two results.","explanation":"Two calls to the same changed tool return the same shortened list. The comparison would show no difference and would add cost.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eVersion the tools and schemas, and run consumer contract tests in the server\u0026#x27;s pipeline.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAn MCP server is a \u003cstrong\u003eshared interface\u003c/strong\u003e. Its tools have consumers whose behavior depends on what the tools return, and for an agent that includes meaning, such as the completeness of a list, as well as the form of the data. A change that seems harmless to the provider can change the consumer's decisions with no error, as it did here.\u003c/p\u003e\n\u003cp\u003eChange management for production MCP has several practices. \u003cstrong\u003eTool and schema versioning\u003c/strong\u003e: a change that removes data, changes meaning, or alters required fields is a breaking change. It is released as a new tool version or under a new name, and the old one stays available for a period of deprecation. \u003cstrong\u003eExplicit signals in results\u003c/strong\u003e: when a result is cut short or paged, the response says so, so that a consumer never takes a partial list for a complete one. \u003cstrong\u003eConsumer contract tests\u003c/strong\u003e: each consumer supplies tests that state what it relies on, and these run in the provider's release pipeline. \u003cstrong\u003eStaged rollout with rollback\u003c/strong\u003e: a new server version first serves a small share of traffic and is watched before it serves all of it.\u003c/p\u003e\n\u003cp\u003eA fixed server and code review by consumers are not workable, and repeated calls cannot detect a consistent change. See the \u003ca href=\"https://modelcontextprotocol.io/specification/2026-07-28/server/tools\"\u003eMCP Tools specification\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/writing-tools-for-agents\"\u003eWriting effective tools for agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 53","answerStatus":"source"},{"query":"A university tutoring copilot must explain writing techniques without producing graded assignments, but students bypass a one-line prompt ban through role-play or incremental requests. Which layered guardrail design fits?","type":"multiple-choice","options":[{"text":"A longer and stricter system prompt that lists every known role-play phrase and forbids each one.","explanation":"A list of phrases is always incomplete, and students will find new wording. One layer in the prompt remains the only defense, however long it is.","correct":false},{"text":"A filter that blocks every message that contains the words \"essay,\" \"write,\" or \"assignment.\"","explanation":"A keyword filter blocks many legitimate requests, such as \"help me understand the essay question,\" and misses requests that avoid those words. It has many false positives and many false negatives.","correct":false},{"text":"Removal of the draft feedback feature, so that the copilot never works with assignment text.","explanation":"This removes one of the most useful legitimate functions for all students. The misuse can be controlled without removing the feature.","correct":false},{"text":"Several layers: request screening, a clear prompt policy, an output check, and abuse monitoring.","explanation":"No single control stops every attempt, so layers are used. A light screening step classifies requests, the system prompt states the policy with examples of help that is allowed, and an output check detects a complete assignment that the earlier layers did not stop. Monitoring identifies accounts that try repeatedly. Each layer covers weaknesses of the others.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eSeveral layers: request screening, a clear prompt policy, an output check, and abuse monitoring.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA \u003cstrong\u003elayered guardrail architecture\u003c/strong\u003e, also called defense in depth, accepts that each control has weaknesses and arranges several controls so that one detects what another misses. Anthropic's guidance on mitigating jailbreaks recommends this combination and does not rely on one prompt instruction.\u003c/p\u003e\n\u003cp\u003eFor this copilot, the layers are as follows. \u003cstrong\u003eInput screening\u003c/strong\u003e: a fast and inexpensive model call or classifier labels each request, for example as a legitimate tutoring request or as a request to produce graded work, before the main model answers. \u003cstrong\u003eClear policy in the system prompt\u003c/strong\u003e: the prompt says what is allowed and what is not, with examples of the boundary. Explaining structure is allowed, and writing the essay is not. \u003cstrong\u003eOutput checking\u003c/strong\u003e: before a response is shown, a check asks whether it is a complete piece of work that could be submitted. This detects requests that were divided into parts or disguised. \u003cstrong\u003eMonitoring\u003c/strong\u003e: repeated attempts by one account are recorded and can lead to a warning or a limit.\u003c/p\u003e\n\u003cp\u003eEach layer has false positives and false negatives, so the system is tuned with labeled examples of allowed and forbidden requests. A longer prompt and a keyword filter are single layers with known weaknesses. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks\"\u003eMitigate jailbreaks and prompt injections\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 54","answerStatus":"source"},{"query":"A student can make a tutoring copilot's read_file tool open another student's essay by specifying its storage path. Which TWO access controls prevent cross-student data disclosure? (Select TWO.)","type":"multiple-choice","options":[{"text":"Add a system prompt rule that the copilot must never open, read, or describe files that belong to any other student.","explanation":"This is incorrect. The model cannot reliably know which files belong to whom, and a student can word a request so that it seems legitimate. A prompt rule is not access control.","correct":false},{"text":"Have the tool take the student's identity from the authenticated session and reject any path outside that student's area.","explanation":"This is correct. Access must be decided by the application from the authenticated identity of the user, and not from an argument that the model supplies and a user can influence. A check in the tool's code refuses any path that does not belong to the student in the current session.","correct":true},{"text":"Give each student a separate storage area with credentials limited to it.","explanation":"This is correct. Isolation in the storage layer is a second, independent barrier. If a session's credentials can read only one student's area, a request for another student's file fails in the store, even if the check in the tool has a fault.","correct":true},{"text":"Rename the files with long random names so that paths are difficult to guess.","explanation":"This is incorrect. Names that are hard to guess are not access control. A path can leak, or the copilot can be asked to list files, and any path that is found would still open.","correct":false},{"text":"Record every file that the copilot opens, and review the record each month.","explanation":"This is incorrect. A record shows afterward that another student's essay was shown. It does not prevent the disclosure.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answers:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eHave the tool take the student\u0026#x27;s identity from the authenticated session and reject any path outside that student\u0026#x27;s area.\u003c/li\u003e\u003cli\u003eGive each student a separate storage area with credentials limited to it.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThe underlying fault is that an \u003cstrong\u003eauthorization decision was left to the model\u003c/strong\u003e. The tool opens any path that it receives, and the model chooses the path from a conversation that the student controls. A request from a user must never be able to widen that user's access. This is a classic access control weakness, and tool-using agents make it easy to introduce.\u003c/p\u003e\n\u003cp\u003eThe fix follows two principles. First, \u003cstrong\u003eidentity comes from the session and not from the model\u003c/strong\u003e. The application knows which student is authenticated. The tool's code uses that identity to decide what may be read and ignores or rejects any path outside the student's own area. The model can still choose \u003cem\u003ewhich of the student's own files\u003c/em\u003e to open. Second, \u003cstrong\u003eisolation for each tenant in the data layer\u003c/strong\u003e: each student's files are in a separate area, and the credentials that a session uses are limited to that area. This is least privilege applied to data, and it holds even if the tool's logic has a fault.\u003c/p\u003e\n\u003cp\u003ePrompt rules, file names that are hard to guess, and logs do not enforce access. See \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools\"\u003eDefine tools\u003c/a\u003e, \u003ca href=\"https://www.anthropic.com/engineering/writing-tools-for-agents\"\u003eWriting effective tools for agents\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/secure-deployment\"\u003eSecurely deploying AI agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect TWO answers.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 55","answerStatus":"source"},{"query":"A tutoring copilot sometimes returns a blank message on an API refusal and sometimes continues essay feedback when a student mentions self-harm. University policy requires support and human-help information. How should this path work?","type":"multiple-choice","options":[{"text":"Detect crisis messages and refusals, and send both to a prepared reply with counseling contacts.","explanation":"A crisis is a known situation that needs a designed path, and not default behavior. A dedicated check for crisis content, and explicit handling of the refusal stop reason, lead to a response prepared with the counseling service that gives supportive wording and real contacts. Escalation to people follows university policy.","correct":true},{"text":"Treat a refusal as an error, and show the standard message \"Something went wrong. Please try again.\"","explanation":"A generic error message tells a student in distress to repeat the message and offers no help. It treats a sensitive situation as a technical fault.","correct":false},{"text":"Block the student's account for 24 hours whenever a message mentions self-harm.","explanation":"Blocking the account punishes a student who may need help and removes a channel of support at the worst time. It is the opposite of a safe response.","correct":false},{"text":"Add a system prompt line that tells the copilot to stay on academic topics in all conversations.","explanation":"An instruction to stay on academic topics produces the second failure seen now: the copilot continues with essay feedback and ignores the student's distress.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eDetect crisis messages and refusals, and send both to a prepared reply with counseling contacts.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eSafety-critical situations need a \u003cstrong\u003edesigned fallback path\u003c/strong\u003e. The two current behaviors, a blank message and a continuation of the essay feedback, are what happens when a rare and serious case is left to default handling. Two mechanisms are involved.\u003c/p\u003e\n\u003cp\u003eFirst, \u003cstrong\u003erefusal handling\u003c/strong\u003e. A refusal is returned as a successful response with \u003ccode\u003estop_reason: \u0026quot;refusal\u0026quot;\u003c/code\u003e and may have no content. An application must branch on that value. If it shows whatever content came back, the student sees a blank message. Second, \u003cstrong\u003edetection and routing\u003c/strong\u003e. A screening step identifies messages that indicate a personal crisis and sends them to a path prepared with the university's counseling service. That path gives a supportive reply, clear information on where to get help immediately, and escalation as the university's policy requires. Because some users are under 18, the path should be reviewed by the people responsible for student welfare.\u003c/p\u003e\n\u003cp\u003eThe path should be tested with prepared cases, and refusals and crisis routings should be recorded as separate events, because they do not appear as errors. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback\"\u003eRefusals and fallback\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons\"\u003eStop reasons and fallback\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 56","answerStatus":"source"},{"query":"A web page's hidden instructions cause a tutoring copilot to recommend a phishing link; the application incorrectly places retrieved page text in a system-role message. Which safeguards reduce this prompt-injection risk?","type":"multiple-choice","options":[{"text":"Keep web content in tool results, restrict search to allowed domains, and check links in the output.","explanation":"Text from the web is untrusted and must not be given the authority of a system message. Keeping it in tool results marks it as data. An allowlist of scholarly and educational domains removes most hostile pages before they are read, and a check on links in the output stops a link that is not on the list.","correct":true},{"text":"Turn web search off for students under 18, and leave it unchanged for all other students.","explanation":"Adult students are equally exposed to the phishing link. Limiting the change to younger students leaves the fault in place for most users.","correct":false},{"text":"Ask the model to rate how trustworthy each web page is, and use only pages that it rates as trustworthy.","explanation":"The page is written to deceive the model, so the model's rating of it is not reliable. The injected text could also influence the rating.","correct":false},{"text":"Add a warning under every answer that web results may be inaccurate.","explanation":"A general warning does not stop the copilot from presenting a malicious link as a recommendation, and most users do not read such warnings.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eKeep web content in tool results, restrict search to allowed domains, and check links in the output.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eWeb content is \u003cstrong\u003euntrusted input\u003c/strong\u003e. A page can contain text that is written to be read as instructions by a model. This is indirect prompt injection. The application here made the attack stronger by putting page text into a system-role message, which gave it the authority of the operator. Anthropic's documentation says directly that untrusted content, such as raw tool output, retrieved documents, and web content, should be kept in tool result blocks and not placed in system messages. Current Claude models are also trained to treat instructions that arrive in tool results with suspicion.\u003c/p\u003e\n\u003cp\u003eDefense in depth adds controls around the model. \u003cstrong\u003eRestricting sources\u003c/strong\u003e: the web search and web fetch tools accept allowed and blocked domain lists, and for a tutoring product an allowlist of educational and scholarly sources removes most hostile pages. \u003cstrong\u003eChecking outputs\u003c/strong\u003e: before an answer is shown, the links in it are compared with the allowlist, and others are removed or flagged. This is a deterministic check on the path by which the harm reaches the student. \u003cstrong\u003eLimiting capability\u003c/strong\u003e: the session that reads web pages needs no tools that can act for the student.\u003c/p\u003e\n\u003cp\u003eA rating by the model can be manipulated by the same page, and a general warning protects nobody. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks\"\u003eMitigate jailbreaks and prompt injections\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/mid-conversation-system-messages\"\u003eMid-conversation system messages and tool changes\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/web-search-tool\"\u003eWeb search tool\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 57","answerStatus":"source"},{"query":"A tutoring guardrail wrongly refuses benign requests but still fulfills disguised assignment-writing requests. One-off prompt changes keep shifting the errors. How should it be tested and improved systematically?","type":"multiple-choice","options":[{"text":"Continue to adjust the screening prompt after each complaint, because complaints show the real problems.","explanation":"Reacting to one complaint at a time is what the team does now, and each fix breaks another case. With no fixed test set, nobody can see the overall effect of a change.","correct":false},{"text":"Build a labeled set that includes borderline requests, and measure both error rates for every change.","explanation":"A guardrail is a classifier and should be evaluated like one. A labeled set that includes clear cases and the difficult borderline cases gives two figures for each version: legitimate requests that were blocked, and forbidden requests that were allowed. Each change is then judged on both figures.","correct":true},{"text":"Ask the screening model to explain each decision, and trust the decisions that have convincing explanations.","explanation":"An explanation that reads well is not evidence that the decision is correct. The model can justify a wrong decision persuasively.","correct":false},{"text":"Measure only how many requests are blocked in each week, and aim to keep that number constant.","explanation":"The number of blocked requests does not show whether the right ones were blocked. It can stay the same while both kinds of error increase.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eBuild a labeled set that includes borderline requests, and measure both error rates for every change.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA guardrail is a \u003cstrong\u003eclassifier\u003c/strong\u003e, and it has two error rates. A \u003cstrong\u003efalse positive\u003c/strong\u003e blocks a legitimate request, such as the teacher's question. A \u003cstrong\u003efalse negative\u003c/strong\u003e allows a forbidden one, such as the student's \u0026quot;example\u0026quot; conclusion. Changes that reduce one rate often raise the other. Without measurement, tuning moves the problem from one case to another, as the team has found.\u003c/p\u003e\n\u003cp\u003eThe discipline is the same as for any evaluation. Build a \u003cstrong\u003elabeled test set\u003c/strong\u003e that reflects real traffic and the boundary: clearly allowed requests, clearly forbidden ones, and many \u003cstrong\u003eborderline cases\u003c/strong\u003e, which is where the rule is difficult. Complaints from teachers and students are a good source of new cases, and each one is added to the set and not corrected alone. Every change to the screening prompt, the model, or the threshold is run on the whole set, and both error rates are reported. The university can then choose the operating point on purpose. For this product, wrongly blocking a study question and wrongly writing an assignment have different costs, and the choice between them is a policy decision.\u003c/p\u003e\n\u003cp\u003eAnthropic's evaluation guidance recommends edge cases in test sets and automated grading where the label is clear. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks\"\u003eMitigate jailbreaks and prompt injections\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 58","answerStatus":"source"},{"query":"Semester-long tutoring conversations cost 30 times the median and approach the context limit, but students value continuity of progress. What memory and compaction strategy meets both needs?","type":"multiple-choice","options":[{"text":"End each conversation after 50 messages, and require the student to start a new one with no history.","explanation":"This controls cost, but it discards what the copilot knows about the student's progress, which students value. A policy can control cost and keep that knowledge.","correct":false},{"text":"Send only the 10 most recent messages with each request, and discard everything earlier.","explanation":"A fixed window of recent messages is inexpensive, but it loses earlier goals, feedback, and decisions without warning. The copilot would repeat itself and contradict its earlier advice.","correct":false},{"text":"Move these students to a model with the largest context window, and keep the full history.","explanation":"A larger window allows a longer history but does not reduce cost. Every message would still pay for the whole semester of context, and the cost ceiling would be exceeded sooner.","correct":false},{"text":"Compact older history at a threshold, and keep notes on the student's progress in persistent memory.","explanation":"Two mechanisms together meet both needs. Compaction replaces old turns with a summary when the conversation passes a threshold, which limits context size and cost. Notes about the student's goals and progress, stored outside the conversation and loaded when needed, keep the long-term knowledge and do not depend on any one summary.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eCompact older history at a threshold, and keep notes on the student\u0026#x27;s progress in persistent memory.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA conversation that never ends needs a \u003cstrong\u003econtext policy\u003c/strong\u003e that separates two things: the \u003cem\u003eworking context\u003c/em\u003e for the current topic, and the \u003cem\u003elong-term knowledge\u003c/em\u003e that should last. A history that only grows makes every message pay for everything that came before, and it eventually reaches the context limit.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCompaction\u003c/strong\u003e manages the working context. When the conversation passes a token threshold, older turns are replaced by a summary. The Claude API can do this on the server, and the instructions for the summary can say what must be kept. \u003cstrong\u003ePersistent memory\u003c/strong\u003e manages the long-term knowledge. Facts that matter over the semester, such as the student's course, goals, recurring difficulties, and feedback already given, are written as structured notes outside the conversation and loaded when they are relevant. With both mechanisms, cost per message is bounded and the copilot still knows the student.\u003c/p\u003e\n\u003cp\u003eThe design should also consider prompt caching. Compaction changes the prefix, so a cache write follows it. Compaction should therefore happen at a sensible threshold and not on every turn. A hard limit on turns, or a window of the last ten messages, controls cost by discarding the knowledge that students value. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/compaction-threshold\"\u003eCompaction at a token threshold\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool\"\u003eMemory tool\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/context-windows\"\u003eContext windows\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 59","answerStatus":"source"},{"query":"A router sends every abnormal model outcome to another region, including 529 overloads, 429 rate limits, and full-context failures. Which outcomes should trigger failover, and which need different handling?","type":"multiple-choice","options":[{"text":"Send all three kinds to the fallback, but only after three attempts on the primary deployment.","explanation":"Three attempts before fallback add delay and cost for every kind of stop, and a session that has filled its context window still fails four times in total. The handling is still the same for different conditions.","correct":false},{"text":"Remove the fallback, and return an error to the technician for every request that does not complete.","explanation":"Company policy requires a fallback, and it is useful during an outage. The fault is in how the router decides to use it.","correct":false},{"text":"Send only the context-window stops to the fallback, because the second region has more capacity.","explanation":"Capacity in a region is not related to the context window, which is a property of the model. These requests would fail in the same way, and the outages that the fallback exists for would no longer be covered.","correct":false},{"text":"Classify each condition, and use the fallback only for overload or outage of the primary deployment.","explanation":"The three conditions have different causes and need different responses. An overloaded or unavailable primary is the case for which a fallback in another region exists. A rate limit caused by the company's own bursts is solved by backoff and smoothing of traffic. A full context window fails in the same way on any deployment, so the session needs compaction or trimming.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eClassify each condition, and use the fallback only for overload or outage of the primary deployment.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA fallback is useful only when the fallback path can succeed where the primary could not. That depends on the \u003cstrong\u003eclass of failure\u003c/strong\u003e, and a resilient router distinguishes these classes. The exam guide lists three that should be separated: rate limits, safety refusals, and context-window stops. Outages and overload form a fourth.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eOverload and outage\u003c/strong\u003e (a 529 \u003ccode\u003eoverloaded_error\u003c/code\u003e, server errors, timeouts) are conditions of the primary deployment. A deployment in another region or on another platform may be healthy, so failover is correct. \u003cstrong\u003eRate limits\u003c/strong\u003e (429) that come from the organization's own bursts are a matter of traffic shaping. The response is to wait for the \u003ccode\u003eretry-after\u003c/code\u003e time, queue, and smooth the bursts. \u003cstrong\u003eContext-window stops\u003c/strong\u003e and \u003ccode\u003emax_tokens\u003c/code\u003e stops are properties of the request, and the same request fails in the same way everywhere. The response is to reduce or compact the context, or to raise the output limit. A \u003cstrong\u003erefusal\u003c/strong\u003e is a decision of the model's safety systems and goes to a refusal-handling path, not to a copy of the same model in another region.\u003c/p\u003e\n\u003cp\u003eThe same handling for every condition wastes money and still fails. This is the pattern in the cost reports. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons\"\u003eStop reasons and fallback\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/api/errors\"\u003eClaude API errors\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback\"\u003eRefusals and fallback\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 60","answerStatus":"source"},{"query":"A mobile maintenance app times out after calling create_work_order and retries when connectivity returns; duplicate work orders, crews, and parts are dispatched. How should the write tool prevent duplicates?","type":"multiple-choice","options":[{"text":"Turn off retries for all tool calls, so that no tool is ever called twice.","explanation":"Without retries, a lost response leaves the technician unsure whether the order exists. Tools that only read data are safe to retry, and their reliability would suffer for no reason.","correct":false},{"text":"Tell the model in the system prompt to check for an existing order before it creates a new one.","explanation":"A check before creation helps in some cases, but it is not certain to be followed, and two attempts close together can both find no order and both create one. It does not make the operation safe.","correct":false},{"text":"Make create_work_order idempotent by sending a unique key that the server checks for repeats.","explanation":"A retry after a lost response cannot know whether the first call succeeded. An idempotency key identifies the intended order. If the server has already created an order for that key, it returns that order and does not create another. Retries are then safe, however poor the connection is.","correct":true},{"text":"Increase the timeout on the tablet to five minutes so that slow responses have more time to arrive.","explanation":"A longer timeout does not help when the connection is lost completely. The response still does not arrive, and the technician waits longer before the same duplicate is created.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eMake create_work_order idempotent by sending a unique key that the server checks for repeats.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eOn an unreliable network, a client often cannot tell two situations apart: the request never arrived, or the request succeeded and the response was lost. A retry is correct in the first case and creates a duplicate in the second. For a tool that only reads data, this is of no importance. For a tool with \u003cstrong\u003eside effects in the real world\u003c/strong\u003e, such as sending crews and parts, the tool has to be designed for it.\u003c/p\u003e\n\u003cp\u003eThe standard solution is \u003cstrong\u003eidempotency\u003c/strong\u003e: the same operation, sent twice, has the same effect as when it is sent once. The client creates a unique key for each intended action and sends it with the call. The server records the key with the result. If the key arrives again, the server returns the first result and does not perform the action a second time. The harness can then retry freely, and the technician receives a reliable answer. This belongs in the \u003cstrong\u003eMCP server and the work-order system\u003c/strong\u003e, not in the prompt, because it has to hold whatever the model does.\u003c/p\u003e\n\u003cp\u003eRemote MCP servers that are used over mobile networks should be designed for retries in general, with stateless request handling where that is possible and safe re-execution. See the \u003ca href=\"https://modelcontextprotocol.io/specification/2026-07-28/server/tools\"\u003eMCP Tools specification\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/writing-tools-for-agents\"\u003eWriting effective tools for agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 61","answerStatus":"source"},{"query":"An MCP work-order tool suddenly requires a new site_id field, breaking 40% of deployed tablet clients that lack it. How should the schema change be rolled out compatibly?","type":"multiple-choice","options":[{"text":"Deploy the required parameter to all servers at once, and send technicians an email asking them to update their tablets.","explanation":"This is what happened on Tuesday. A fleet in the field does not update at the same moment, so a breaking change that is deployed to all servers breaks every tablet that has not yet updated.","correct":false},{"text":"Have the server fill in a random site identifier when the parameter is missing, so that old tablets continue to work.","explanation":"A random site identifier would send crews and parts to the wrong place. A plausible wrong value is worse than a clear failure.","correct":false},{"text":"Add the parameter as optional or under a new tool version first, move clients to it, and make it required only after the old version is no longer in use.","explanation":"A new required parameter is a breaking change for existing clients. Introducing it in a backward-compatible form, as an optional field or as a new version of the tool, lets old and new tablets work during the move. When telemetry shows that no client uses the old form, the parameter can become required.","correct":true},{"text":"Never change the tool's parameters, and ask technicians to type the site identifier into the description field.","explanation":"Free text in a description field cannot be validated or used reliably by the work-order system. Tools have to be able to change, and the requirement is to change them safely.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eAdd the parameter as optional or under a new tool version first, move clients to it, and make it required only after the old version is no longer in use.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eTool and schema versioning\u003c/strong\u003e is central to operating MCP servers in production, because a tool's schema is a contract with every client and every prompt that uses it. Changes are of two kinds. \u003cem\u003eBackward-compatible\u003c/em\u003e changes, such as adding an optional parameter or adding a field to a result, do not break existing clients. \u003cem\u003eBreaking\u003c/em\u003e changes, such as adding a required parameter, renaming or removing a field, or changing meaning, make existing clients fail or behave differently.\u003c/p\u003e\n\u003cp\u003eA breaking change is introduced in \u003cstrong\u003ephases\u003c/strong\u003e. First, the server accepts both forms: the new parameter is optional, perhaps with a value that the server can work out from the tablet's identity, or a new tool version is published next to the old one. Next, clients are moved, and the agent is \u003cstrong\u003etested against the new schema\u003c/strong\u003e with updated descriptions and examples. Usage of the old form is measured in telemetry. Last, the old form is retired after an announced deprecation period. The server is released with a staged rollout and a path for rollback.\u003c/p\u003e\n\u003cp\u003eWith a fleet of tablets in the field, clients and servers can never be assumed to update together. See the \u003ca href=\"https://modelcontextprotocol.io/specification/2026-07-28/server/tools\"\u003eMCP Tools specification\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools\"\u003eDefine tools\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/mcp\"\u003eConnect Claude Code to tools via MCP\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 62","answerStatus":"source"},{"query":"Technicians sometimes lose network connectivity for hours. The model cannot be reached, but maintenance manuals are available for local storage. How should the tablet remain useful without pretending the service is online?","type":"multiple-choice","options":[{"text":"Display a permanent notice on the tablet that the copilot requires a network connection at all times.","explanation":"A notice explains the limitation but gives the technician no help at the site. The copilot is still of no use during the periods with no connection.","correct":false},{"text":"Keep retrying each request with no notice to the technician until the connection returns, however long that takes.","explanation":"Silent retries are the present behavior: a spinner with no information. The technician cannot decide whether to wait or to work in another way.","correct":false},{"text":"Have the tablet show an answer that was saved from a similar earlier question, with no indication that it is a saved answer.","explanation":"An old answer presented as a new one co
