<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Developer Professional | Practice Exam 06</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #d9e0e8;
      --primary: #1769aa;
      --primary-dark: #0f4f85;
      --secondary: #667085;
      --success: #16803c;
      --success-bg: #eaf8ef;
      --danger: #b42318;
      --danger-bg: #fff0ee;
      --warning: #9a6700;
      --warning-bg: #fff7d6;
      --shadow: 0 10px 28px rgba(23, 32, 51, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      border-radius: 9px;
      padding: .62rem .92rem;
      cursor: pointer;
      font-weight: 650;
      transition: transform .08s ease, background .15s ease, opacity .15s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-secondary { background: #e8edf3; color: var(--text); }
    .btn-warning { background: #ffd96a; color: #4b3500; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }

    .page-shell {
      width: min(1040px, calc(100% - 28px));
      margin: 28px auto 60px;
    }

    .hero {
      background: linear-gradient(135deg, #12243b, #1e4f79);
      color: white;
      border-radius: 18px;
      padding: 24px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero-top {
      display: flex;
      gap: 18px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .hero h1 { margin: 0 0 6px; font-size: clamp(1.65rem, 4vw, 2.35rem); }
    .hero p { margin: 0; opacity: .88; }
    .meta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .pill {
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.1);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: .9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-top: 16px;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 18px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-weight: 750;
    }

    .card-body { padding: 18px; }

    .results {
      border-left: 5px solid var(--primary);
    }
    .results strong { font-size: 1.1rem; }

    .query {
      font-size: 1.08rem;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .choose-note {
      color: var(--muted);
      font-size: .9rem;
      margin: 0 0 16px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 11px 12px;
      margin: 8px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
    }

    .option input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--primary);
      flex: 0 0 auto;
    }

    .option.reveal-correct {
      border-color: #75c991;
      background: var(--success-bg);
    }

    .option.reveal-wrong-selected {
      border-color: #e9a7a0;
      background: var(--danger-bg);
    }

    .option small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .answer-panel {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--warning-bg);
      border: 1px solid #f0d783;
    }

    .answer-panel p:first-child { margin-top: 0; }
    .answer-panel ul { margin-bottom: 0; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .controls-top {
      position: sticky;
      top: 8px;
      z-index: 20;
      margin: 10px 0 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,.97);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 5px 24px rgba(23,32,51,.12);
      backdrop-filter: blur(8px);
    }

    .controls-top + exam-question .card { margin-top: 0; }

    .control-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .collapsible-title { cursor: pointer; user-select: none; }
    .chevron { font-size: .9rem; color: var(--muted); }

    .jumper-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .jump-btn {
      min-width: 38px;
      padding: 7px 9px;
      background: #eef2f6;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .jump-btn.viewed { background: #d7dee7; }
    .jump-btn.current { background: var(--primary); color: white; border-color: var(--primary); }
    .jump-btn.correct { background: var(--success); color: white; border-color: var(--success); }
    .jump-btn.incorrect { background: var(--danger); color: white; border-color: var(--danger); }

    .history-empty { color: var(--muted); margin: 0; }
    .history-exam {
      border-top: 1px solid var(--line);
      padding: 14px 0;
    }
    .history-exam:first-child { border-top: 0; padding-top: 0; }
    .history-summary {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }
    .history-dots { display: flex; flex-wrap: wrap; gap: 5px; }
    .history-dot {
      width: 26px; height: 26px; border-radius: 7px;
      display: grid; place-items: center;
      font-size: .76rem; color: white;
      background: var(--danger);
    }
    .history-dot.correct { background: var(--success); }

    .status-line {
      color: var(--muted);
      font-size: .92rem;
      margin-top: 10px;
    }

    .footer-note {
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
      margin-top: 22px;
    }

    @media (max-width: 640px) {
      .page-shell { width: min(100% - 16px, 1040px); margin-top: 8px; }
      .hero { border-radius: 12px; padding: 19px 17px; }
      .card-body { padding: 14px; }
      .card-header { padding: 12px 14px; }
      .controls { align-items: stretch; }
      .control-group { width: 100%; }
      .control-group button { flex: 1; }
      .controls-top { top: 0; padding: 10px; }
    }
  </style>
</head>

  <script>
    const QUESTION_BANK = [{"query":"A coordinator tells its property, financial, and compliance agents only to 'review this application.' Two agents order the same paid credit report, and none checks claims history, although each agent's own work is good. What should change?","type":"multiple-choice","options":[{"text":"Have the coordinator give each specialist a brief with its objective, its boundaries, and the expected output format.","explanation":"The specialists do good work but do not know where their task begins and ends. A clear brief for each one states what to produce, in which format, and what belongs to another specialist. This prevents duplicated work and missing coverage.","correct":true},{"text":"Add a fourth specialist agent that reviews the other three and repeats any work that it finds missing.","explanation":"A reviewing agent adds cost to every application and still depends on unclear task boundaries. The duplication and the gap come from the delegation messages, which this option leaves unchanged.","correct":false},{"text":"Let the three specialists message each other directly so that they can agree among themselves who orders each report.","explanation":"Negotiation between specialists adds messages and delay to every application, and the result can differ from one application to the next. The coordinator already knows the full task and can divide it once.","correct":false},{"text":"Move all three specialists to a more capable model so that they infer the division of work from the application.","explanation":"The quality of each specialist's work is already good. A stronger model still receives the same vague message and still has to guess what the other specialists are doing.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eHave the coordinator give each specialist a brief with its objective, its boundaries, and the expected output format.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eIn a supervisor/worker design, the supervisor's \u003cstrong\u003edelegation message\u003c/strong\u003e is the worker's whole understanding of its task. Anthropic's account of its multi-agent research system reports the same failure that Kestrel sees: with short, vague instructions, subagents duplicated each other's work, left gaps, or misunderstood the task. The remedy was to give each subagent an objective, an output format, guidance on the tools and sources to use, and clear task boundaries.\u003c/p\u003e\n\u003cp\u003eA good brief for the property specialist would state the goal (assess property risk for this application), what to return (a structured risk summary with evidence), which tools to use, and what it should not do (order credit reports, which belong to the financial specialist). The coordinator is the only agent that sees the whole application, so it is the right place to divide the work.\u003c/p\u003e\n\u003cp\u003eA reviewing agent, direct negotiation between specialists, and a stronger model all leave the unclear boundaries in place. See \u003ca href=\"https://www.anthropic.com/engineering/multi-agent-research-system\"\u003eHow we built our multi-agent research system\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/multiagent-orchestration\"\u003eMultiagent orchestration\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 1","answerStatus":"source"},{"query":"A compliance agent in an isolated thread must apply stricter checks to properties above $10 million, but it never receives the valuation found by the property agent. How can it use the actual value without merging the threads?","type":"multiple-choice","options":[{"text":"Have the coordinator pass the property specialist's valuation to the compliance thread as part of its task.","explanation":"Each thread is isolated in context, so a specialist knows only what the coordinator sends to it. The coordinator receives the property result and can include the valuation, as a clear field, in the compliance specialist's task. The threads stay separate, and the required fact crosses the boundary explicitly.","correct":true},{"text":"Merge the property and compliance specialists into one agent so that both tasks share a single context.","explanation":"Merging gives the compliance work the valuation, but it also puts all of the property analysis into the same context and removes the separation of roles and tools. The need is for one fact to cross the boundary, not for the boundary to be removed.","correct":false},{"text":"Instruct the compliance specialist in its system prompt to estimate the property value from the application text.","explanation":"An estimate is what produced the wrong screening. The exact valuation already exists in the property specialist's result, so there is no reason to guess it.","correct":false},{"text":"Run the compliance specialist first, before any property work begins, so that it finishes sooner.","explanation":"Running compliance first makes the problem certain, because the valuation would not exist yet. The compliance task depends on the property result and must come after it.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eHave the coordinator pass the property specialist\u0026#x27;s valuation to the compliance thread as part of its task.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eIn Claude Managed Agents, each agent in a multi-agent session runs in its own \u003cstrong\u003esession thread\u003c/strong\u003e: an event stream that is isolated in context and has its own conversation history. Isolation keeps each specialist focused and keeps long tool output out of the other agents' contexts. It also means that \u003cstrong\u003enothing is shared by default\u003c/strong\u003e. A fact that one specialist needs from another must be passed on purpose.\u003c/p\u003e\n\u003cp\u003eThe coordinator is the route for this. It receives each specialist's result and decides what the next specialist needs. For a dependency such as \u0026quot;compliance needs the valuation,\u0026quot; the coordinator runs the property work first and then gives the compliance thread a task that contains the valuation as a structured value. Threads are persistent, so the coordinator can also send a follow-up message to a thread that it used earlier, and that agent keeps everything from its earlier turns.\u003c/p\u003e\n\u003cp\u003eMerging the agents removes the benefits of isolation, and an estimate replaces a known fact with a guess. See \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/session-threads\"\u003eSession threads\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/multiagent-orchestration\"\u003eMultiagent orchestration\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 2","answerStatus":"source"},{"query":"An insurance agent checks every minute for broker documents that may take hours to arrive. The document service can send an upload notification. How should the agent wait without wasting tokens or losing progress?","type":"multiple-choice","options":[{"text":"Keep the polling, but reduce its cost by sending the question every 10 minutes and not every 60 seconds.","explanation":"Polling less often reduces the cost but does not remove it, and it adds up to 10 minutes of delay after a document arrives. The session still does paid work that produces nothing.","correct":false},{"text":"End the session when the wait begins, and create a new session from the start when the documents arrive.","explanation":"A new session has none of the analysis that the agents completed before the wait. That work would have to be repeated and paid for again, although the platform could have kept it.","correct":false},{"text":"Let the session go idle, and send it a new event when the document system reports that the upload is complete.","explanation":"A Managed Agents session keeps its state on the server and resumes cleanly after a pause. An idle session makes no model requests, so it costs nothing in tokens while it waits. When the document system calls Kestrel's service, that service sends an event to the session and the agents continue with their earlier work intact.","correct":true},{"text":"Keep one model request open for the whole wait so that the agent can continue as soon as the documents arrive.","explanation":"A model request is not a way to wait for hours. Requests have time limits, and holding one open ties up resources and fails at the first network interruption.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eLet the session go idle, and send it a new event when the document system reports that the upload is complete.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eLong-running agents spend much of their time \u003cstrong\u003ewaiting\u003c/strong\u003e for people and for other systems. A durable design makes waiting free. Claude Managed Agents sessions are stateful: the conversation history, the sandbox state, and the outputs are stored on the server, and the service is designed for long-running and asynchronous work that resumes cleanly after pauses. When an agent has nothing more to do, the session becomes idle.\u003c/p\u003e\n\u003cp\u003eThe efficient pattern is \u003cstrong\u003eevent-driven resumption\u003c/strong\u003e. The agent finishes what it can and reports that it is waiting for documents. The session goes idle, and no model requests are made. When the outside event occurs (here, the document system calls a URL on Kestrel's integration service), the service sends a new user event to the same session. The agents continue with their full history. Kestrel can also subscribe to webhooks to learn about changes in a session's state without holding a connection open.\u003c/p\u003e\n\u003cp\u003ePolling uses tokens on questions whose answer is known to be \u0026quot;not yet.\u0026quot; Ending the session discards completed work. See \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/sessions\"\u003eStart a session\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/events-and-streaming\"\u003eSession event stream\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/webhooks\"\u003eSubscribe to webhooks\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 3","answerStatus":"source"},{"query":"Regulations require a licensed underwriter to approve every quote before the issue_quote tool runs. A system-prompt instruction has already been bypassed. What control reliably enforces human approval?","type":"multiple-choice","options":[{"text":"Strengthen the instruction in the system prompt, and add a second instruction to the description of the issue_quote tool.","explanation":"Both are instructions to the model, and the tests have shown that the model does not always follow such an instruction. The regulator's rule needs a control that does not depend on the model's behavior.","correct":false},{"text":"Let the server evaluate each issue_quote call automatically and decide whether the call seems safe to run.","explanation":"Automatic evaluation is useful for reducing the number of approvals on routine tools. The regulator's rule is not about whether a call seems safe: it requires a licensed person to approve every quote, without exception.","correct":false},{"text":"Allow quotes to be issued automatically, and have an underwriter review all issued quotes at the end of each day.","explanation":"A review at the end of the day takes place after the quotes have been issued. The rule requires approval before issue, so this design breaks it for every quote.","correct":false},{"text":"Set a permission policy that makes every issue_quote call wait for confirmation, and have the underwriter send the confirmation.","explanation":"A permission policy is applied by the platform, not by the model. With the tool set to require confirmation, each call pauses the session until Kestrel's application sends an approval or a denial from the underwriter. The model cannot skip this step, so the rule holds for every quote.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eSet a permission policy that makes every issue_quote call wait for confirmation, and have the underwriter send the confirmation.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eWhen a rule says that a human must approve an action \u003cem\u003ebefore\u003c/em\u003e it happens, the approval has to be enforced \u003cstrong\u003eoutside the model\u003c/strong\u003e. In Claude Managed Agents this is done with \u003cstrong\u003epermission policies\u003c/strong\u003e. For each built-in tool or MCP tool, a policy decides whether calls run automatically, wait for approval, or are evaluated by the server. For a tool that is set to wait for approval, the session pauses on each call until the application sends a confirmation event that approves or denies it.\u003c/p\u003e\n\u003cp\u003eThis gives the standard \u003cstrong\u003eapproval flow\u003c/strong\u003e for a durable agent. The agent prepares the quote and calls \u003ccode\u003eissue_quote\u003c/code\u003e. The platform holds the call. Kestrel's application shows the quote to a licensed underwriter. The underwriter's decision is sent back as a tool confirmation, and the session continues. Because sessions are stateful, the pause can last for hours without loss of work, and the approval is recorded in the session's events.\u003c/p\u003e\n\u003cp\u003eThe \u003ccode\u003eauto\u003c/code\u003e policy, in which the server evaluates each call, suits lower-risk tools. It does not replace a legal requirement for human approval. See \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/permission-policies\"\u003ePermission policies\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/events-and-streaming\"\u003eSession event stream\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 4","answerStatus":"source"},{"query":"For 60% of insurance applications, a single agent matches multi-agent quality at one-quarter the cost and half the latency. Complex applications benefit from the specialists' risk checks. Which architecture fits both groups?","type":"multiple-choice","options":[{"text":"Move every application to the single agent, because it is cheaper and faster for most applications.","explanation":"This would save money on the small applications but would lose the additional risks that the multi-agent path finds on large and unusual ones, where an error is most expensive.","correct":false},{"text":"Keep the multi-agent path for every application, because one architecture is simpler to operate than two.","explanation":"One path is simpler, but the data shows a fourfold cost and a double delay on 60% of the volume with no gain in quality. That is a large and continuing cost for simplicity.","correct":false},{"text":"Add two more specialist agents to the multi-agent path so that quality on small applications also improves.","explanation":"Quality on small applications is already equal on both paths, so more specialists would add cost where there is no quality problem to solve.","correct":false},{"text":"Route small standard applications to a single agent, and keep the multi-agent path for large and unusual applications.","explanation":"The data shows two groups with different needs. The single agent matches the quality of the multi-agent path on small standard applications at a quarter of the cost, and the multi-agent path earns its cost on complex ones. Routing by application type gives each group the design that fits it.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eRoute small standard applications to a single agent, and keep the multi-agent path for large and unusual applications.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eArchitecture is a decision that should be reviewed against \u003cstrong\u003eproduction data\u003c/strong\u003e on cost, reliability, and quality. Multi-agent systems use more tokens than single agents, because each agent has its own context and the coordination itself has a cost. Anthropic's guidance is that the pattern is worth this cost when the task is valuable and complex enough to benefit: when the work can be divided, is too large for one context, or needs separate specialist roles. For simpler tasks, a single agent, or a fixed workflow, is usually the better choice.\u003c/p\u003e\n\u003cp\u003eKestrel's data shows this division. For small standard policies, the extra agents add cost and delay and no quality. For large and unusual applications, they find risks that would otherwise be missed. The decision that follows is to \u003cstrong\u003eroute by complexity\u003c/strong\u003e: a simple rule or classifier sends each application to the least expensive design that meets the quality standard, and the team continues to measure both paths.\u003c/p\u003e\n\u003cp\u003eThe measure to compare is cost for each completed task at equal quality, not cost for each token. See \u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\"\u003eBuilding effective agents\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\"\u003eOptimizing for cost and intelligence\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 5","answerStatus":"source"},{"query":"Specialist agents read untrusted broker documents but have access to all MCP servers, including tools that issue and cancel policies; only the coordinator needs those tools. How should least privilege be enforced?","type":"multiple-choice","options":[{"text":"Keep the configuration, and add a system prompt line telling the specialists not to call the policy administration tools.","explanation":"The specialists read documents from outside the company, which may contain instructions. A prompt line does not remove the tools, so a specialist that is misled could still issue or cancel a policy.","correct":false},{"text":"Declare on each agent only the MCP servers that its role needs, so that specialists have no policy administration tools.","explanation":"MCP servers are declared for each agent, so each agent can be given only the servers that its role requires. A specialist that has no policy administration tools cannot issue or cancel a policy, whatever it reads. The most powerful tools are then held by one agent, which does not read untrusted documents directly.","correct":true},{"text":"Keep the configuration, and record every policy administration call so that misuse by a specialist can be investigated.","explanation":"Logs support an investigation after misuse has happened. They do not prevent a specialist from making a harmful call.","correct":false},{"text":"Remove the policy administration server from all four agents, and have underwriters enter every policy by hand.","explanation":"This removes the risk and also removes the automation for the one agent that needs the server. Least privilege means the minimum access that the task needs, not no access.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eDeclare on each agent only the MCP servers that its role needs, so that specialists have no policy administration tools.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eLeast privilege\u003c/strong\u003e means that each agent has only the tools and data that its role needs. In a multi-agent system this is applied \u003cstrong\u003efor each agent\u003c/strong\u003e. A specialist that reads untrusted broker documents has the highest exposure to prompt injection, so it should have the least power. An agent that can issue and cancel policies should not be the one that reads raw documents from outside.\u003c/p\u003e\n\u003cp\u003eClaude Managed Agents supports this structure. Each agent definition declares its own MCP servers and tools, so the property specialist can have the property data server and nothing else. One detail matters for the design: in a multi-agent session, all agents share the same sandbox, file system, and vault credentials, which belong to the session. Tool scope for each agent is therefore the main means of separation, and credentials should be as narrow as possible, with limited network access for the environment.\u003c/p\u003e\n\u003cp\u003eA prompt instruction does not remove a capability, and logging only detects. See \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/secure-deployment\"\u003eSecure your Managed Agents deployment\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/vaults\"\u003eVaults\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/session-threads\"\u003eSession threads\u003c/a\u003e. See also \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/multiagent-orchestration\"\u003eMultiagent orchestration\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 6","answerStatus":"source"},{"query":"A regulator must reconstruct who called each tool, what inputs were used, and who approved a quote eight months later. A model-written summary is the only current record. Which TWO audit-log safeguards are needed? (Select TWO.)","type":"multiple-choice","options":[{"text":"A longer and more detailed summary of its own reasoning, which the coordinator writes at the end of each application.","explanation":"This is incorrect. A summary written by the model is its own description of events and may leave out or misstate steps. It is not a record of the actions that took place.","correct":false},{"text":"A record of each tool call and approval, with the actor, the inputs, and the time.","explanation":"This is correct. An audit record must show who did what, with which inputs, and when. Recording each tool call with the identity of the agent, and each approval with the identity of the underwriter, linked to the application, allows a decision to be reconstructed step by step.","correct":true},{"text":"A weekly screenshot of the session list in the Console, saved to a shared folder.","explanation":"This is incorrect. A screenshot of a list shows that sessions existed. It contains none of the actions, inputs, or approvals inside each session.","correct":false},{"text":"A file in the agents' shared sandbox to which each agent adds a note when it finishes a task.","explanation":"This is incorrect. A file in the shared sandbox can be changed by any agent in the session, and it holds only what the agents choose to write. It is not independent evidence.","correct":false},{"text":"Storage for these records that the agents cannot change or delete, kept for the period that the regulator requires.","explanation":"This is correct. An audit log has value only if it can be trusted. If an agent, or someone who misleads an agent, could edit or delete records, the log would prove nothing. Append-only storage outside the agents' permissions, with a defined retention period, protects it.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answers:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eA record of each tool call and approval, with the actor, the inputs, and the time.\u003c/li\u003e\u003cli\u003eStorage for these records that the agents cannot change or delete, kept for the period that the regulator requires.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eAudit logging\u003c/strong\u003e for agents answers the question \u0026quot;who did what, with which authority, and what happened?\u0026quot; for every security-relevant action. It differs from debugging telemetry in two respects: it must be \u003cstrong\u003ecomplete\u003c/strong\u003e for the actions that matter, and it must be \u003cstrong\u003etrustworthy\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eComplete means that there is a structured record for each tool call that reads sensitive data or changes state, and for each approval or denial. The record holds the identity of the actor (which agent, and under which service identity), the human approver where there is one, the inputs, the result, the time, and a link to the business object, in this case the application. In Claude Managed Agents, the session's event stream already contains tool use events and confirmation events, and Kestrel can copy these into its own audit store. Trustworthy means that the store is outside the agents' reach: append-only, with access controls and a retention period that matches the regulation.\u003c/p\u003e\n\u003cp\u003eA model's summary of its own reasoning is not evidence, and a file in the shared sandbox can be changed by the agents that it is supposed to record. See \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/session-observability\"\u003eInspect sessions and track usage\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/secure-deployment\"\u003eSecure your Managed Agents deployment\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect TWO answers.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 7","answerStatus":"source"},{"query":"An unreliable credit-bureau MCP tool sometimes hangs or fails, causing an agent to retry it over 100 times and block independent work. What integration design prevents retry storms while allowing other checks to continue?","type":"multiple-choice","options":[{"text":"Raise the timeout on the credit tool to 10 minutes so that slow responses have time to arrive.","explanation":"A longer timeout makes each failed attempt take longer and does not stop the repetition. The session would wait even longer, and the other work would stay blocked.","correct":false},{"text":"Tell the financial specialist in its prompt to call the credit tool no more than three times.","explanation":"A limit in the prompt is likely to be followed but is not certain. The agent also cannot tell whether a failure is temporary, so three attempts may be too many for one failure and too few for another.","correct":false},{"text":"Remove the credit check from the workflow, and let underwriters order the report by hand when they need one.","explanation":"This removes a useful automated step because of failures that happen only sometimes. A resilient integration keeps the automation and handles the failures.","correct":false},{"text":"Give the MCP server a timeout and a circuit breaker, and continue with the credit check pending.","explanation":"Resilience belongs in the integration layer. A timeout and a circuit breaker in the server stop repeated calls to a service that is failing. Marking the check as pending lets the other work continue, which is graceful degradation.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eGive the MCP server a timeout and a circuit breaker, and continue with the credit check pending.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAn agent that calls an unreliable service needs the same \u003cstrong\u003eresilience patterns\u003c/strong\u003e as any other client, and they should be built into the tool layer and not left to the model's judgment. Three patterns apply here. A \u003cstrong\u003etimeout\u003c/strong\u003e bounds how long one call can take. A \u003cstrong\u003ecircuit breaker\u003c/strong\u003e counts failures and, after a threshold, rejects further calls for a period, which protects the budget and the failing service. A \u003cstrong\u003estructured error\u003c/strong\u003e returned as the tool result tells the agent what happened: the category of the failure and whether a retry may help.\u003c/p\u003e\n\u003cp\u003eWith that information, the agent can \u003cstrong\u003edegrade gracefully\u003c/strong\u003e. It records the credit check as pending, finishes the parts of the application that do not depend on it, and reports clearly what is still to be done. The session can then go idle and continue when the service recovers. This is much better than a loop that blocks the whole application.\u003c/p\u003e\n\u003cp\u003eA longer timeout and a limit in the prompt do not give the agent the information that it needs, and removing the step gives up the automation. See \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls\"\u003eHandle tool calls\u003c/a\u003e for returning errors in tool results, and the \u003ca href=\"https://modelcontextprotocol.io/specification/2026-07-28/server/tools\"\u003eMCP Tools specification\u003c/a\u003e for tool execution errors.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 8","answerStatus":"source"},{"query":"An insurance application spans an agent session, four MCP servers, and integration-service logs with inconsistent identifiers. How can engineers trace the full sequence across all components?","type":"multiple-choice","options":[{"text":"Ask each MCP server team to keep its logs for longer so that slow investigations do not lose data.","explanation":"Longer retention keeps the data available, but an engineer would still have to search each system by hand and match records by guessing. The investigation would be no faster.","correct":false},{"text":"Have the coordinator write a paragraph at the end of each session that describes what happened.","explanation":"A description written by the model may leave out or misstate what the MCP servers and other systems did. It is not a record that can be joined to their logs.","correct":false},{"text":"Attach one correlation ID to each application, and record it in every component.","explanation":"A shared identifier that every component records lets all events for one application be collected with a single query. When the identifier is a trace context that is passed on each call, the events also form one distributed trace that shows order and duration across the session and the MCP servers.","correct":true},{"text":"Copy all logs from every system into one large file each night, and search that file by time.","explanation":"One file puts the data in one place, but the records still have no common identifier. Matching by time is unreliable when many applications are processed during the same minutes.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eAttach one correlation ID to each application, and record it in every component.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAn agent system is a \u003cstrong\u003edistributed system\u003c/strong\u003e. One application passes through the integration service, a multi-agent session with several threads, and MCP servers that different teams own. Each component can log well and the whole can still be impossible to follow if no shared identifier connects the records.\u003c/p\u003e\n\u003cp\u003eThe solution is \u003cstrong\u003ecorrelation and trace propagation\u003c/strong\u003e. At the start of an application, a correlation ID, preferably a standard trace context, is created and attached everywhere: in the session's metadata, in the request headers of each MCP tool call, and in the structured logs of every service. Each component records it. A single query then returns the full timeline for application K-88213, and a tracing backend can show it as one \u003cstrong\u003edistributed trace\u003c/strong\u003e with spans for agent turns, tool calls, and the time inside each MCP server. Questions such as \u0026quot;where did nine hours go?\u0026quot; become simple to answer.\u003c/p\u003e\n\u003cp\u003eClaude Managed Agents sends session, span, and agent events for observability, and these can be joined to the same identifier. Longer retention and merged files do not create the missing link. See \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/session-observability\"\u003eInspect sessions and track usage\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/events-and-streaming\"\u003eSession event stream\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 9","answerStatus":"source"},{"query":"Extraction specialists mostly copy facts from long documents, and code validates their outputs; the coordinator makes complex underwriting judgments. All agents use the most expensive model. How can cost fall with minimal quality risk?","type":"multiple-choice","options":[{"text":"Move the coordinator to the smallest model, and keep the specialists on the most capable model.","explanation":"This places the weakest model on the task that needs the most judgment and keeps the most expensive model on the work that is easiest to check. It is the opposite of what the data suggests.","correct":false},{"text":"Give the extraction specialists a smaller model, and keep the coordinator's model.","explanation":"Each agent has its own model configuration. Extraction work with outputs that code can check suits a smaller, cheaper model, and the judgment in the coordinator justifies the stronger one.","correct":true},{"text":"Reduce the number of documents that the specialists are allowed to read for each application.","explanation":"Reading fewer documents saves tokens by removing evidence. Underwriting decisions depend on that evidence, so this change puts quality at risk.","correct":false},{"text":"Set a low session budget so that every application stops when it reaches a fixed spending limit.","explanation":"A budget is a useful limit against sessions that run out of control. It does not make normal sessions cheaper, and a low limit would pause large applications before they are complete.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eGive the extraction specialists a smaller model, and keep the coordinator\u0026#x27;s model.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eIn a multi-agent system, \u003cstrong\u003emodel routing\u003c/strong\u003e can be applied for each role. The agents do different kinds of work, and the least expensive model that performs a role well is the right one for that role. Anthropic's cost guidance describes this as the orchestrator pattern: a stronger model plans and makes judgments, and it delegates to cheaper subagents. Smaller models suit high-volume work whose outputs can be checked.\u003c/p\u003e\n\u003cp\u003eKestrel's data fits this pattern. The specialists read and extract, and validation code checks their output, so an error is detected and can be retried or passed to the stronger model. The coordinator's reasoning sets the final decision and has no simple check, so it keeps the stronger model. In Claude Managed Agents, each agent definition has its own model configuration, including an effort level, so the change is a matter of configuration.\u003c/p\u003e\n\u003cp\u003eThe comparison should be made on cost for each completed application at equal quality, measured on real applications, because a cheaper model that fails more often may not save money. A session budget limits the worst case but does not reduce the normal cost. See \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\"\u003eOptimizing for cost and intelligence\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/multiagent-orchestration\"\u003eMultiagent orchestration\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Cost and Latency Optimization at Scale — source question 10","answerStatus":"source"},{"query":"An embedding model accepts at most 512 tokens. A pipeline chunks documents at 2,000 characters, and the ends of technical or multilingual chunks cannot be retrieved. What is causing this, and how should chunking change?","type":"multiple-choice","options":[{"text":"The vector database has reached its storage limit and drops the last part of each vector. Add storage capacity.","explanation":"A vector has a fixed number of dimensions, and a database does not shorten vectors when it is full. This would also not explain why only chunks with chemical names, other languages, or numbers are affected.","correct":false},{"text":"The embedding model does not understand chemical names or other languages. Translate all documents into English first.","explanation":"The content at the start of the same chunks can be retrieved, so the model handles the material. Translation also adds a risk of errors to medical text and does not address the length limit.","correct":false},{"text":"The similarity threshold is too strict for technical content. Lower the threshold for documents that contain chemical names.","explanation":"A lower threshold returns more chunks but cannot find text that was never included in an embedding. The end of each affected chunk is missing from its vector.","correct":false},{"text":"These chunks are longer than 512 tokens and are cut off without notice. Size chunks by counting tokens with the embedding model's tokenizer.","explanation":"The number of tokens for a given number of characters is not fixed. Rare words, text in other languages, and numbers are divided into many more tokens than plain English. A 2,000-character chunk of such text can be far longer than 512 tokens, and the model then embeds only the first 512 and ignores the rest. Measuring chunks in tokens removes the silent cut.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThese chunks are longer than 512 tokens and are cut off without notice. Size chunks by counting tokens with the embedding model\u0026#x27;s tokenizer.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eTokenization\u003c/strong\u003e is the step in which text is divided into the units that a model processes. A common estimate is that one token is about four characters of English, but the real ratio depends on the content. Chemical names, identifiers, long numbers, and many languages other than English are divided into several tokens for each word. A chunk size that is defined in characters therefore produces chunks whose length in tokens varies widely.\u003c/p\u003e\n\u003cp\u003eEvery embedding model has a \u003cstrong\u003emaximum input length\u003c/strong\u003e in tokens. Many embedding services cut off an input that is too long and return a vector for the first part only, without an error. The text after the cut is then missing from the index. That is the symptom here: the start of a chunk can be found, the end cannot, and the affected chunks are those with content that uses many tokens.\u003c/p\u003e\n\u003cp\u003eThe fix is to measure chunks with the \u003cem\u003esame tokenizer as the embedding model\u003c/em\u003e, keep a safety margin below the limit, and add a check to the indexing job that fails when an input is cut off. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/embeddings\"\u003eEmbeddings\u003c/a\u003e, which lists the context length of each embedding model, and \u003ca href=\"https://www.anthropic.com/engineering/contextual-retrieval\"\u003eIntroducing Contextual Retrieval\u003c/a\u003e, which notes that chunk size and boundaries affect retrieval.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 11","answerStatus":"source"},{"query":"A medical retrieval system splits dosage tables into fixed-size chunks, leaving some rows without column headings or patient-group captions. It consequently retrieves adult doses for child-related questions. How should tables be chunked?","type":"multiple-choice","options":[{"text":"Reduce the chunk size to 100 tokens so that each chunk contains only one or two rows of a table.","explanation":"Smaller chunks separate the rows from their headings and caption even more. A chunk with one row and nothing else is the most ambiguous piece possible.","correct":false},{"text":"Remove all tables from the documents before indexing, and index only the paragraphs of ordinary text.","explanation":"The dosage tables contain the information that doctors ask about most often. Removing them would prevent the copilot from answering dosage questions from the source.","correct":false},{"text":"Increase the overlap between neighboring chunks to 50% so that each row appears in two chunks.","explanation":"Overlap repeats rows in neighboring pieces, but the headings appear only at the top of a 60-row table. Pieces from the middle would still have no headings, and the index would be larger.","correct":false},{"text":"Split on the document's structure, keep rows whole, and repeat caption and headings in each piece.","explanation":"A table row has meaning only together with its headings and the title of its table. Chunking that respects structure does not cut through a row and adds the caption and column headings to every piece of a long table. Each piece can then be understood, and matched, by itself.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eSplit on the document\u0026#x27;s structure, keep rows whole, and repeat caption and headings in each piece.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eChunking strategy\u003c/strong\u003e has a direct effect on retrieval quality, and fixed-size chunking is weakest on structured content. A table is a two-dimensional structure: a cell has meaning because of its row, its column heading, and the caption that says what the table describes. When a table is cut by size alone, most pieces lose that context.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eStructure-aware chunking\u003c/strong\u003e uses the layout of the document. It splits at headings and section boundaries, keeps lists and table rows whole, and for a long table produces several pieces that each begin with the caption and the column headings. This follows the same principle as contextual retrieval: each chunk carries enough of its surroundings to be understood alone. For this copilot, the patient group in the caption (\u0026quot;Dosage in children aged 6 to 12\u0026quot;) is the key fact.\u003c/p\u003e\n\u003cp\u003eSmaller chunks and more overlap do not bring the headings back, and removing tables removes the most important content. In a domain where a wrong dosage is a safety event, the document date and patient group can also be stored as metadata and used as filters. See \u003ca href=\"https://www.anthropic.com/engineering/contextual-retrieval\"\u003eIntroducing Contextual Retrieval\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/search-results\"\u003eSearch results\u003c/a\u003e for passing source metadata with retrieved content.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 12","answerStatus":"source"},{"query":"A fixed one-search retrieval pipeline answers 90% of medical questions quickly, but multi-product comparisons require several dependent searches. Which retrieval design balances speed and completeness?","type":"multiple-choice","options":[{"text":"Replace the pipeline with agentic search for every question, so that all questions are handled in the same manner.","explanation":"Agentic search uses several model turns for each question. Applying it to the 90% of simple lookups would add cost and several seconds of latency with no gain in quality for those questions.","correct":false},{"text":"Keep the fixed pipeline for simple lookups, and give Claude a search tool for multi-step questions.","explanation":"The two kinds of question have different needs. A single retrieval step is fast and cheap for a lookup. A comparison across products needs several searches, each formed from what the previous one found, which is what agentic search provides. Using each method where it fits gives complete answers without slowing the common case.","correct":true},{"text":"Keep the single retrieval step for all questions, and raise the number of chunks from 10 to 200.","explanation":"More chunks from one query still reflect one wording of the question. Chunks about the other two products may not rank in the top 200, and the model has to read a very large input for every question.","correct":false},{"text":"Ask doctors to split multi-product questions into separate single-product questions.","explanation":"This moves the work to the user and removes a valuable function of the copilot. The system can do the splitting itself.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eKeep the fixed pipeline for simple lookups, and give Claude a search tool for multi-step questions.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThere are two broad retrieval architectures. In a \u003cstrong\u003efixed retrieval pipeline\u003c/strong\u003e, the application runs one search and passes the results to the model. This is fast, cheap, and predictable, and it works well when one query can find the answer. In \u003cstrong\u003eagentic search\u003c/strong\u003e, the model has a search tool and decides what to search for, reads the results, and searches again as needed. This handles questions that need several pieces of evidence or a second query that depends on the first, at the cost of more model turns, more tokens, and more latency.\u003c/p\u003e\n\u003cp\u003eThe tradeoff is the same as the general choice between workflows and agents: use the simple, predictable design where it is sufficient, and add autonomy where the task needs it. For this copilot, a router (by question type, or a first attempt with a completeness check) sends lookups down the fast path and comparisons to the agentic path. Both paths use the same index and the same citation rules.\u003c/p\u003e\n\u003cp\u003eRaising the number of chunks does not make one query cover three products. See \u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\"\u003eBuilding effective agents\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\"\u003eEffective context engineering for AI agents\u003c/a\u003e, which discusses retrieval before the request and retrieval by the agent at run time.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 13","answerStatus":"source"},{"query":"A newer safety bulletin supersedes an old dosage limit, but semantic search still ranks the older document first. Documents change weekly. What retrieval control keeps answers grounded in current guidance?","type":"multiple-choice","options":[{"text":"Store version, effective date, and superseded status as metadata, and exclude superseded content at query time.","explanation":"The retrieval system must know which document is current. Metadata for the version and effective date, with a status that marks a document as superseded when a newer one replaces it, lets the system filter out outdated content before ranking. The weekly indexing job updates this status as documents arrive.","correct":true},{"text":"Tell the copilot in the system prompt always to prefer the most cautious dose that it finds in the retrieved passages.","explanation":"This rule would help only if both documents were retrieved, and the lower dose is not always the current one. It replaces document control with a guess.","correct":false},{"text":"Rebuild the whole index from the beginning once a year so that outdated documents are removed.","explanation":"A yearly rebuild leaves outdated guidance in the index for up to a year after it has been replaced. Documents change every week, and a wrong dose is a safety event.","correct":false},{"text":"Add the words \"latest version\" to every query before it is sent to the retrieval system.","explanation":"The words in a query do not tell the retrieval system which document replaces another. The older document does not describe itself as outdated, so it can still rank first.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eStore version, effective date, and superseded status as metadata, and exclude superseded content at query time.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA knowledge base that changes needs \u003cstrong\u003edocument lifecycle management\u003c/strong\u003e in the retrieval system. Similarity search has no concept of time or authority. An older document that matches the question well ranks above a newer bulletin, and the model, which is told to answer from the retrieved text, then repeats outdated guidance and cites it correctly.\u003c/p\u003e\n\u003cp\u003eThe control is \u003cstrong\u003emetadata\u003c/strong\u003e. Each chunk carries its document ID, version, effective date, and a status. When a new version or a superseding bulletin is indexed, the earlier content is marked as superseded or is removed in the same job. Queries then filter on status before ranking, so only current content can be returned. Showing the document's date in each citation gives the reader one more check. With weekly updates, this has to be part of the incremental indexing job and not an occasional clean-up.\u003c/p\u003e\n\u003cp\u003ePrompt rules about cautious doses, and extra words in the query, do not give the system the missing fact, which is the relationship between the two documents. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/search-results\"\u003eSearch results\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/citations\"\u003eCitations\u003c/a\u003e for keeping source information with the content that Claude cites.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 14","answerStatus":"source"},{"query":"A medical copilot must not present unsupported dosages, and its retrieved sources can conflict or omit a dose. Which TWO grounding behaviors should be required? (Select TWO.)","type":"multiple-choice","options":[{"text":"Ask the copilot to rate its confidence in each dosage from 1 to 10, and show the user only the dosages that it rates 8 or higher.","explanation":"This is incorrect. A rating that the model gives to its own answer is generated text and is not calibrated. A wrong dosage can receive a high rating.","correct":false},{"text":"Set the temperature to 0 so that the copilot gives the same dosage every time for the same question.","explanation":"This is incorrect. Repeatable output is not the same as correct output. The copilot could give the same wrong dosage every time.","correct":false},{"text":"Require an exact quoted passage for each dosage, and verify in code that the quote exists in the cited source before the answer is shown.","explanation":"This is correct. A quotation can be checked by a machine: code can confirm that the quoted text is in the cited document. A dosage with no quote that can be verified is not shown, which turns the citation requirement into a control.","correct":true},{"text":"Tell the copilot to write longer answers so that each dosage is surrounded by more explanation.","explanation":"This is incorrect. More text does not connect a dosage to its source. It also adds more statements that need support and may have none.","correct":false},{"text":"When passages conflict or lack the answer, have the copilot say so and refer the user to experts.","explanation":"This is correct. Stating uncertainty is a grounding practice. Explicit permission to say that the sources are unclear or do not answer removes the pressure to produce a dose, and a route to human experts handles these cases safely.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answers:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eRequire an exact quoted passage for each dosage, and verify in code that the quote exists in the cited source before the answer is shown.\u003c/li\u003e\u003cli\u003eWhen passages conflict or lack the answer, have the copilot say so and refer the user to experts.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eFor high-risk content, grounding should be something that the system can \u003cstrong\u003everify\u003c/strong\u003e. Two practices do this. The first is \u003cstrong\u003equote-based citation with a check\u003c/strong\u003e. The model must support each critical claim, here each dosage, with a word-for-word passage from a source. The Claude API citations feature returns the cited text and its location with the answer, and application code can confirm that the passage is in the document and contains the number. Claims that fail the check are not shown. Anthropic's guidance on reducing hallucinations describes this pattern: base answers on direct quotes, and withdraw any claim that has no supporting quote.\u003c/p\u003e\n\u003cp\u003eThe second is \u003cstrong\u003euncertainty declaration\u003c/strong\u003e. Retrieval sometimes returns passages that conflict, for example an old document and a new one, or passages that do not answer the question. The copilot must have explicit permission, and an instruction, to say so and to pass the question to people. In a medical setting, \u0026quot;the sources do not give a clear answer, please contact medical information\u0026quot; is a correct answer.\u003c/p\u003e\n\u003cp\u003eSelf-rated confidence, temperature, and longer answers do not connect a claim to evidence. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations\"\u003eReduce hallucinations\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/citations\"\u003eCitations\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect TWO answers.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 15","answerStatus":"source"},{"query":"An LLM judge rates medical answers for relevance, yet seven audited answers contain claims unsupported by their citations, even though each received a perfect relevance score. What metric should the evaluation add?","type":"multiple-choice","options":[{"text":"Add a groundedness metric for each cited statement.","explanation":"The evaluation measures the wrong property for a retrieval-grounded task. An answer can be relevant and unsupported. A groundedness metric tests whether each statement follows from the cited passage.","correct":true},{"text":"Raise the passing threshold for the relevance score from 4.0 to 4.8.","explanation":"The unsupported answers each scored 5, so they would pass any threshold. The relevance score does not measure whether statements are supported.","correct":false},{"text":"Double the number of test questions so that the relevance score is more stable.","explanation":"A more stable relevance score is still a relevance score. More questions would give a more precise measurement of the wrong property.","correct":false},{"text":"Replace the LLM judge with a count of how many words the answer shares with a reference answer.","explanation":"Word overlap rewards similar wording, not correct support. An answer with a wrong dosage shares almost all of its words with a correct reference answer.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eAdd a groundedness metric for each cited statement.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThe metric for an evaluation must fit the \u003cstrong\u003etype of task\u003c/strong\u003e. For a retrieval-grounded application, the main question is \u0026quot;is each statement supported by the source that it cites?\u0026quot; and not \u0026quot;is this answer about the right topic?\u0026quot; This property is called \u003cstrong\u003egroundedness\u003c/strong\u003e or faithfulness. Relevance is a different property, and an answer can score perfectly on relevance while it contains an invented or misread fact. The audit shows this.\u003c/p\u003e\n\u003cp\u003eA sound evaluation for this copilot has several metrics. \u003cstrong\u003eRetrieval metrics\u003c/strong\u003e (precision and recall of the retrieved passages against labeled passages) test the retrieval stage. \u003cstrong\u003eGroundedness\u003c/strong\u003e tests generation: each statement in the answer is checked against the cited passage, usually by an LLM judge with a narrow rubric. \u003cstrong\u003eCitation correctness\u003c/strong\u003e tests that the cited passage exists and is the passage that supports the claim. For critical values, a \u003cstrong\u003ecode-based check\u003c/strong\u003e is better than a judge: the dosage in the answer is compared with the dosage in the source. Anthropic's guidance prefers code-based grading where it is possible, because it is fast and reliable.\u003c/p\u003e\n\u003cp\u003eA higher threshold and more questions refine a metric that cannot see the failure. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations\"\u003eReduce hallucinations\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 16","answerStatus":"source"},{"query":"After 40 of 400 evaluation questions and answers were copied into the system prompt, the test score rose from 81% to 93%, but production quality did not improve. How should this evaluation problem be corrected?","type":"multiple-choice","options":[{"text":"The production feedback is unreliable, so the team should trust the 93% score and stop collecting doctors' feedback.","explanation":"The production feedback is consistent with the copilot being unchanged on new questions. Discarding it would remove the signal that revealed the problem.","correct":false},{"text":"The judge has become too lenient, so the team should replace it with a stricter judge model.","explanation":"Nothing indicates that the judge changed. The score rose because some of the test questions are now answered in the prompt.","correct":false},{"text":"The examples are too few, so the team should copy all 400 questions and answers into the system prompt.","explanation":"With every test question in the prompt, the score would approach 100% and would carry no information about questions that the copilot has not seen.","correct":false},{"text":"The test set is contaminated by its own examples. Keep a held-out test set that is never used in prompts or tuning.","explanation":"Forty test questions and their answers are now part of the prompt, so the copilot is tested on material that it has been given. The score measures recall of the examples, not ability on new questions. Examples for the prompt must come from a separate development set, and the test set must be kept apart.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe test set is contaminated by its own examples. Keep a held-out test set that is never used in prompts or tuning.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAn evaluation estimates how a system will perform on inputs that it has \u003cstrong\u003enot seen\u003c/strong\u003e. That estimate is valid only when the test data is independent of everything used to build the system. \u003cstrong\u003eContamination\u003c/strong\u003e occurs when test items enter the system, as examples in a prompt, as data for tuning, or through repeated adjustment to the same items. The score then rises while real performance does not. A rise in the offline score with no change in production feedback is the typical sign.\u003c/p\u003e\n\u003cp\u003eThe discipline is the same as in machine learning generally: separate the data. A \u003cstrong\u003edevelopment set\u003c/strong\u003e is used for writing prompts, choosing examples, and debugging. A \u003cstrong\u003eheld-out test set\u003c/strong\u003e is used only to measure, and its items never appear in a prompt. Anthropic's evaluation guidance includes this step in its prompt development workflow: test the improved prompt against held-out evals before release. When contamination has occurred, the affected items should be removed from the test set or replaced, and the baseline measured again.\u003c/p\u003e\n\u003cp\u003eSuite validity needs continuing attention. Contamination, saturation, and coverage gaps all reduce it over time. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 17","answerStatus":"source"},{"query":"A copilot gives an adult dose for a seven-year-old. The question stated the age, retrieval returned only an adult table fragment without headings, and generation cited it faithfully. Where did the error begin, and what should change?","type":"multiple-choice","options":[{"text":"It started in retrieval, which returned an adult chunk with no context. Correct the chunking and add the case to the regression suite.","explanation":"The trace shows where the information went wrong. The question was clear, the retrieved chunk was from the wrong patient group and did not say so, and the generation step was faithful to it. The origin is the retrieval stage, in particular chunks that have lost their context. Correcting chunking and metadata addresses the cause, and a regression case prevents its return.","correct":true},{"text":"It started in generation, because the copilot gave a wrong dose. Add a prompt rule to check the patient's age.","explanation":"The copilot repeated its source accurately, and the source did not state a patient group. A prompt rule cannot make the copilot use a children's dose that it was never given.","correct":false},{"text":"It started in the user's question, which should have named the section of the document. Train pharmacists to ask more precise questions.","explanation":"The question stated the patient's age clearly. Users cannot be expected to know how documents are organized internally.","correct":false},{"text":"It started in the model version. Move the copilot to a more capable model that would notice the mismatch.","explanation":"A stronger model might notice more often that the chunk does not mention children, but it still would not have the correct dose. The missing information is a retrieval problem.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eIt started in retrieval, which returned an adult chunk with no context. Correct the chunking and add the case to the regression suite.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA wrong answer from a retrieval-grounded system is diagnosed \u003cstrong\u003eby stage\u003c/strong\u003e. Read the trace in order and ask at each step whether the output was correct for the input. Here the question was clear. The retrieval output was wrong: an adult chunk, with no context, for a question about a child. The generation output was faithful to its input. The first stage with a wrong output for a correct input is the origin, and that is retrieval.\u003c/p\u003e\n\u003cp\u003eThis distinction decides the fix. If the team treated the incident as a generation error, it would add prompt rules that cannot supply the missing children's dose. Treated as a \u003cstrong\u003eretrieval-grounding failure\u003c/strong\u003e, the fix goes to the cause: chunking that respects structure and keeps captions and headings with table rows, context added to each chunk, and metadata for the patient group that can be used as a filter. A second line of defense in generation is still worth adding. The copilot should state when a retrieved passage does not match the patient group in the question, and should not answer from it.\u003c/p\u003e\n\u003cp\u003eThe incident also becomes a \u003cstrong\u003eregression case\u003c/strong\u003e: this question, with the expected source section, is added to the evaluation suite. See \u003ca href=\"https://www.anthropic.com/engineering/contextual-retrieval\"\u003eIntroducing Contextual Retrieval\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations\"\u003eReduce hallucinations\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Debugging and Incident Response — source question 18","answerStatus":"source"},{"query":"A developer copilot receives customer source code. Company policy forbids sending prompts or code to a third-party observability vendor but allows operational metrics. How should its telemetry be configured?","type":"multiple-choice","options":[{"text":"Turn on all content options, and ask the vendor to sign an agreement to delete the data after 14 days.","explanation":"The policy forbids storing prompts and source code in any third-party system. An agreement about deletion does not change the fact that the content would be stored there.","correct":false},{"text":"Export metrics, events, and traces with content capture left off, and keep any content needed for debugging in a first-party store.","explanation":"The export redacts prompt and tool content by default, and sends token counts, timing, tool names, and identifiers. This data is allowed by the policy and is enough for most debugging. If the text of a conversation is needed, it can be kept in a store that Orbitline controls and linked to the trace by an ID.","correct":true},{"text":"Turn telemetry off for all customers, and investigate problems by asking customers to describe what they saw.","explanation":"With no telemetry, the team cannot see latency, cost, tool failures, or errors. The policy allows token counts and timing data, so this gives up much more than the policy requires.","correct":false},{"text":"Turn on all content options for free customers only, because the privacy policy matters most to paying customers.","explanation":"The policy applies to customers' code and prompts without regard to the plan that they are on. Free customers' source code is also customer data.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eExport metrics, events, and traces with content capture left off, and keep any content needed for debugging in a first-party store.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eTelemetry for an agent has \u003cstrong\u003estructure\u003c/strong\u003e (which request, which tool, how long, how many tokens, which outcome) and \u003cstrong\u003econtent\u003c/strong\u003e (the text of prompts, responses, and tool results). Privacy rules usually restrict content, and structure is enough for most operational questions. A good configuration therefore exports structure widely and treats content capture as a separate decision.\u003c/p\u003e\n\u003cp\u003eThe Agent SDK uses the same OpenTelemetry export as Claude Code. Telemetry is enabled with \u003ccode\u003eCLAUDE_CODE_ENABLE_TELEMETRY\u003c/code\u003e, and it sends metrics (tokens, cost, sessions), events (API requests, tool results, errors), and traces if tracing is enabled. \u003cstrong\u003ePrompt, response, and tool content is redacted by default.\u003c/strong\u003e Separate settings turn on prompt text, response text, tool details, tool output, and full API bodies. The option for full API bodies includes the whole conversation history, so it must not be sent to a system that is not approved to hold that content.\u003c/p\u003e\n\u003cp\u003eIf content is really needed, it should go to a store that the company controls, with access rules and a retention period, and it should be joined to the trace by an identifier. See \u003ca href=\"https://code.claude.com/docs/en/monitoring-usage\"\u003eMonitoring\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/observability\"\u003eObservability with OpenTelemetry\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/data-usage\"\u003eData usage\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 19","answerStatus":"source"},{"query":"After a release reordered tools and altered the system prompt, the prompt-cache read rate fell from 85% to 30%. How can engineers identify the exact prompt-prefix difference causing cache misses?","type":"multiple-choice","options":[{"text":"Change the cache duration to 1 hour, and see whether the cache-read share returns to 85%.","explanation":"Requests in a conversation arrive seconds apart, so the entries are not expiring. A longer duration would not change a prefix that differs between requests, and it raises the price of each cache write.","correct":false},{"text":"Remove prompt caching from the service until the next release, so that the cache-read metric no longer applies.","explanation":"Removing caching hides the metric and makes every request pay the full input price. The cost would rise further, and the cause would still be unknown.","correct":false},{"text":"Use the API's cache diagnostics, which report where the prefix diverged from the previous request.","explanation":"Cache diagnostics are built for this question. The request names the previous message, the server compares the two prompts, and the response reports the reason for a cache miss, including the point at which
