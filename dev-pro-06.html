 the prefix first differed. This identifies which change is responsible.","correct":true},{"text":"Roll back the library version first, because library upgrades are the most frequent cause of regressions.","explanation":"This is a guess about one of three changes. A rollback takes time and may not be the cause, and a direct diagnostic can identify the cause without trial and error.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eUse the API\u0026#x27;s cache diagnostics, which report where the prefix diverged from the previous request.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eCache-performance diagnostics\u003c/strong\u003e start with the usage fields on each response: \u003ccode\u003ecache_read_input_tokens\u003c/code\u003e and \u003ccode\u003ecache_creation_input_tokens\u003c/code\u003e. A dashboard of the cache-read share shows that something is wrong, as it did here. It does not show what changed in the prompt.\u003c/p\u003e\n\u003cp\u003eA cache hit needs an exact match of the prefix, in the order tools, system prompt, messages. Typical causes of a sudden fall are a change in tool definitions or their order, content in the system prompt that changes on each request (such as a status line or a timestamp), a change in thinking or effort settings, and keys in JSON that are not written in a stable order. The Claude API provides \u003cstrong\u003ecache diagnostics\u003c/strong\u003e to find the cause directly. The request includes a \u003ccode\u003ediagnostics\u003c/code\u003e object with the ID of the previous message. This is a beta feature of the Claude API (Messages API) and is not available on Amazon Bedrock or Google Cloud. The server compares the fingerprints of the two prompts, and the response reports a cache miss reason. This identifies the first point of divergence without a manual comparison.\u003c/p\u003e\n\u003cp\u003eWith the cause known, the fix is usually to move changing content to the end of the newest user turn and to keep tool definitions stable. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/cache-diagnostics\"\u003eCache diagnostics\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\"\u003ePrompt caching\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 20","answerStatus":"source"},{"query":"On-call receives dozens of alerts for individual slow requests or tool errors, yet a two-hour incident affecting 6% of paid conversations was missed. Which alerting strategy emphasizes actionable customer impact?","type":"multiple-choice","options":[{"text":"Alert on how fast the error budget of an aggregated objective is used, for each tier.","explanation":"An alert should mean that users are being harmed at a rate that matters. An objective on an aggregated indicator, with an alert on how fast the error budget is being used, ignores single slow requests and reacts quickly to a sustained 6% failure. Separating the indicator by tier makes a problem for paid customers visible.","correct":true},{"text":"Lower the latency threshold to 5 seconds so that slow requests are found earlier.","explanation":"A lower threshold would raise even more pages for single requests. The volume of pages is the reason that the real problem was missed.","correct":false},{"text":"Send all alerts to a chat channel that nobody is paged for, and review the channel once a week.","explanation":"This removes the interruptions and also removes timely response. A failure that affects 6% of paid conversations for two hours needs attention within minutes.","correct":false},{"text":"Page the on-call engineer only when the service returns HTTP 500 errors.","explanation":"A sandbox failure inside a conversation may not produce an HTTP 500 from the service. This rule would miss the kind of problem that happened last week.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eAlert on how fast the error budget of an aggregated objective is used, for each tier.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eGood alerting follows one principle: an alert should mean that \u003cstrong\u003eusers are affected enough for a person to act\u003c/strong\u003e. Alerts on single events, one slow request or one tool error, do not meet this standard in a system with 60,000 conversations a day. They produce alert fatigue, and real incidents are then lost among them.\u003c/p\u003e\n\u003cp\u003eThe standard design is based on \u003cstrong\u003eSLIs and SLOs\u003c/strong\u003e. An SLI (service level indicator) is an aggregated measure of what users experience, for example the share of conversations that complete without a tool failure, or the 95th percentile time to first token. An SLO is the target, such as 99% of conversations succeeding over 30 days. The difference between the target and 100% is the \u003cstrong\u003eerror budget\u003c/strong\u003e. Alerts are raised on the \u003cstrong\u003eburn rate\u003c/strong\u003e: how fast the budget is being used. A fast burn (6% failures for an hour) pages someone at once, and a slow burn opens a ticket. Dividing the indicator by customer tier, tool, and model keeps a problem in one segment from being hidden by the total.\u003c/p\u003e\n\u003cp\u003eFor services backed by an LLM, the indicators should include quality and behavior (tool success, refusal rate, task completion) and token and cost measures, in addition to HTTP status. See \u003ca href=\"https://code.claude.com/docs/en/monitoring-usage\"\u003eMonitoring\u003c/a\u003e and \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/observability\"\u003eObservability with OpenTelemetry\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 21","answerStatus":"source"},{"query":"One customer sends 50,000 requests in a loop, doubling service-wide token usage before anyone notices. How can the team detect customer-specific abuse promptly and limit its impact?","type":"multiple-choice","options":[{"text":"An alert on total service tokens for each day, which is raised when the total passes twice the daily average.","explanation":"A total for the service shows that usage is high, a day late, and does not show who caused it. A smaller abuse of the same kind would not reach the threshold.","correct":false},{"text":"A daily email to every customer that reports how many requests the customer sent on the day before.","explanation":"Customers who run an uncontrolled script are unlikely to act on an email, and the report arrives a day later. Nothing in this design limits the usage.","correct":false},{"text":"Usage metrics labeled by customer, alerts on departure from each customer's baseline, and rate limits.","explanation":"Unusual usage by one customer is visible only in data that is divided by customer. An alert on a sharp departure from that customer's normal pattern detects the loop within minutes, and a rate limit for each customer in the service's own gateway stops one account from using shared capacity.","correct":true},{"text":"A lower monthly budget alert, so that the finance team is told about overspending sooner.","explanation":"A monthly budget alert reacts to total spending over weeks. It is too slow and too coarse to detect one customer's loop on one day.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eUsage metrics labeled by customer, alerts on departure from each customer\u0026#x27;s baseline, and rate limits.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eAnomalous usage\u003c/strong\u003e is detected by comparing an actor with its own normal behavior. Totals for the whole service hide individual actors: a customer that sends a hundred times its usual traffic may be a small change in the total, or may double it, and in both cases the total does not show the cause.\u003c/p\u003e\n\u003cp\u003eThe instrumentation need is simple. Every request's token and request counts carry a \u003cstrong\u003ecustomer identifier\u003c/strong\u003e as a label, and a tier label is also useful. Dashboards can then rank customers by usage, and an \u003cstrong\u003eanomaly alert\u003c/strong\u003e is raised when a customer's rate departs sharply from its own recent baseline or from the normal range for its tier. Detection should be combined with control. \u003cstrong\u003eRate limits and quotas for each customer\u003c/strong\u003e, applied in Orbitline's own gateway, keep one account from using the shared API rate limits and budget. This is the same isolation principle as in any multi-tenant system.\u003c/p\u003e\n\u003cp\u003eToken and cost telemetry is useful for security as well as for finance. Unusual patterns of use can indicate automation, abuse, or a compromised account. See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/cost-tracking\"\u003eTrack cost and usage\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/api/rate-limits\"\u003eRate limits\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 22","answerStatus":"source"},{"query":"Logs contain free-form messages such as 'Tool failed!! retrying...', making it hard to group failures by tool or session. How should the service log events for reliable analysis?","type":"multiple-choice","options":[{"text":"Emit structured events with fixed fields, such as trace ID, session ID, tool name, status, and duration.","explanation":"A structured event is a record with named fields. With the same fields on every event, a query can count failures by tool, list the affected sessions, and add up tokens for failed conversations. Shared IDs also link each event to its trace.","correct":true},{"text":"Add more detail to each sentence, for example \"Tool failed!! The sandbox tool returned an error after a long wait.\"","explanation":"Longer sentences are easier for a person to read, but they are still free text. Counting and grouping by tool or session would still need fragile text patterns.","correct":false},{"text":"Raise the log level to debug in production so that every internal step is written to the logs.","explanation":"More lines of free text make the logs larger and harder to search. The problem is the form of the log lines, not how many there are.","correct":false},{"text":"Keep the current lines, and ask Claude to read the log files during incidents and summarize them.","explanation":"A summary by a model can help with reading, but it is not an exact count and may leave out lines. The questions that the team asks need exact grouping and counting.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eEmit structured events with fixed fields, such as trace ID, session ID, tool name, status, and duration.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eLogs written as sentences are made for a person who reads one line at a time. Operating a production system needs \u003cstrong\u003eaggregation\u003c/strong\u003e: counts, rates, and groups across millions of events. That requires \u003cstrong\u003estructured log events\u003c/strong\u003e, which are records with a fixed set of named fields.\u003c/p\u003e\n\u003cp\u003eFor an agent, a useful event schema includes the identifiers that link events (trace ID, session ID, request ID), the kind of event (API request, tool result, error), and the measures: model, tool name, status, error category, duration, and input, output, and cache token counts. With this structure, the questions from the incident become one-line queries, and the same events supply dashboards and alerts. Claude Code and the Agent SDK emit events of this kind through OpenTelemetry. Examples are API request, API error, and tool result events, with attributes such as model, cost, duration, and token counts, and with identifiers that connect all events from one prompt.\u003c/p\u003e\n\u003cp\u003eMore text, more lines, and summaries by a model do not make free text reliable to query. Structured events also make privacy easier to manage, because content fields are separate from metadata and can be left out or redacted. See \u003ca href=\"https://code.claude.com/docs/en/monitoring-usage\"\u003eMonitoring\u003c/a\u003e and \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/observability\"\u003eObservability with OpenTelemetry\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 23","answerStatus":"source"},{"query":"A copilot gives API v2 examples at turn 14 although the customer uses v3. The trace shows a stale v2 search result first appeared at turn 3. Where should engineers fix the cause?","type":"multiple-choice","options":[{"text":"On turn 14, where the wrong code appeared. Add an instruction to the system prompt to check the API version before writing code.","explanation":"Turn 14 is where the problem was noticed. The wrong assumption entered at turn 3, so a rule that applies at the time of writing code acts on a context that already contains wrong information.","correct":false},{"text":"On the model, which should have asked the customer for the API version. Move the copilot to a more capable model.","explanation":"A clarifying question could have helped, but the copilot was given a documentation page that appeared authoritative. A stronger model would also trust the page that its search tool returned.","correct":false},{"text":"On turn 3, where a stale tool result first introduced the wrong version. Repair the search index and show the version in results.","explanation":"In a multi-turn failure, the visible error is often far from its cause. Reading the trace backward finds the first point at which wrong information entered the context: the search result at turn 3. The origin is stale data served by a tool, so the fix is to correct the index and to label each result with its version.","correct":true},{"text":"On the customer, who did not state the API version at the start. Add a required version field to the chat window.","explanation":"A required field is a product decision that could reduce the problem, but the origin is an outdated index. Other customers would receive stale pages for other reasons.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eOn turn 3, where a stale tool result first introduced the wrong version. Repair the search index and show the version in results.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eMulti-turn failures have a specific difficulty: the \u003cstrong\u003esymptom and the cause are separated in time\u003c/strong\u003e. Everything that enters a conversation stays in the context and affects later turns. One wrong tool result early in the conversation can make many later answers wrong, and each of those answers is consistent with what the model was told.\u003c/p\u003e\n\u003cp\u003eThe method is to \u003cstrong\u003etrace backward to the first appearance\u003c/strong\u003e of the wrong information. Starting from the turn where the failure was noticed, read back through the trace until the first turn at which the wrong fact is present, and identify how it entered: through the user, the model's own output, a tool result, or the harness. Here it entered through a tool result at turn 3, and that result came from stale data. The origin is therefore the tool and data layer, not the model's reasoning at turn 14.\u003c/p\u003e\n\u003cp\u003eThe repair goes to the origin. Update the index and add a freshness check, and return the documentation version as a clear field in each search result so that a mismatch is visible. A prompt rule at the point of writing code would act on a context that is already wrong. See \u003ca href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\"\u003eEffective context engineering for AI agents\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/writing-tools-for-agents\"\u003eWriting effective tools for agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Debugging and Incident Response — source question 24","answerStatus":"source"},{"query":"Long conversations lose user constraints after the harness compacts history; the compaction summaries omit constraints such as 'no external dependencies.' What should be fixed?","type":"multiple-choice","options":[{"text":"The origin is the model's memory, which weakens in long conversations. Limit conversations to 20 turns.","explanation":"The constraints are missing from the context after compaction, so the model has nothing to remember. A limit of 20 turns would stop long conversations that customers value and would not repair compaction.","correct":false},{"text":"The origin is the harness's compaction step, which drops the constraints. Instruct it to keep them, or store them separately.","explanation":"The same model and prompt behave correctly until compaction replaces the history with a summary that leaves out the constraints. The loss happens in the harness. Instructions for the summary that list what must be kept, or a separate store of constraints that is added to the context again after compaction, repair the cause.","correct":true},{"text":"The origin is the customers, who should repeat their constraints. Add a reminder in the chat window to repeat important requirements.","explanation":"This asks customers to work around a fault in the system. The constraints were stated clearly once, and the system lost them.","correct":false},{"text":"The origin is the context window, which is too small. Turn compaction off, and let conversations run until the limit.","explanation":"With compaction off, long conversations would reach the context limit and fail completely. Compaction is needed, and it has to keep the right information.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe origin is the harness\u0026#x27;s compaction step, which drops the constraints. Instruct it to keep them, or store them separately.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eCompaction\u003c/strong\u003e replaces older conversation history with a summary so that a long session can continue. A summary loses information by design. After compaction, the summary is all that the model has from the earlier turns. If a fact is not in the summary, the model does not have it. The model then appears to ignore the customer, when in fact the harness has removed the instruction.\u003c/p\u003e\n\u003cp\u003eThe diagnosis follows from a controlled comparison. The model and prompt are the same in short and long conversations, and the failure begins after compaction. The origin is the \u003cstrong\u003eagent harness\u003c/strong\u003e, in particular what the compaction step keeps. There are two fixes, and they can be combined. The first is to \u003cstrong\u003einstruct the compaction\u003c/strong\u003e: say what the summary must always keep, such as user constraints, decisions, version numbers, and open tasks. The second is to keep durable facts \u003cstrong\u003eoutside the history\u003c/strong\u003e, in a notes file or memory, and add them to the context after each compaction, so that they do not depend on the summary.\u003c/p\u003e\n\u003cp\u003eAnthropic's guidance on context engineering describes the same care: compaction should be tuned to keep critical details, and structured notes kept outside the context window complement it. See \u003ca href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\"\u003eEffective context engineering for AI agents\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/context-editing\"\u003eContext editing\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/agent-loop\"\u003eHow the agent loop works\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Debugging and Incident Response — source question 25","answerStatus":"source"},{"query":"Simple lookups are 65% of requests but average nine seconds at high effort; complex debugging requests can remain slow. How should effort settings be tuned to speed up lookups without harming debugging quality?","type":"multiple-choice","options":[{"text":"Lower the effort level for all conversations, because most of the traffic is simple lookups.","explanation":"This would make lookups faster, but debugging questions benefit from deeper reasoning. Lower effort for all conversations puts at risk the quality that the team wants to protect.","correct":false},{"text":"Change the effort level several times inside each conversation, according to how difficult each message appears.","explanation":"Changing effort in the middle of a session can invalidate the prompt cache, which adds cost and latency. It also makes behavior less predictable.","correct":false},{"text":"Keep high effort, and reduce max_tokens to 200 so that all answers are short.","explanation":"A limit on output does not reduce the reasoning before the answer, and it would cut debugging answers that need code and explanation.","correct":false},{"text":"Test effort levels by question type, and lower the level for lookups.","explanation":"Effort controls how much the model spends on thinking, text, and tool calls. Simple lookups rarely need high effort, so a lower level reduces their latency and cost. Testing each question type on real traffic shows which level keeps quality.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eTest effort levels by question type, and lower the level for lookups.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThe \u003cstrong\u003eeffort\u003c/strong\u003e setting controls how thorough the model is, which in terms of tokens means how much it spends on thinking, text, and tool calls. Higher effort gives more complete work on hard problems and takes longer. Lower effort responds faster and costs less. It is one of the main controls for latency and cost.\u003c/p\u003e\n\u003cp\u003eEffort should be tuned \u003cstrong\u003efor each type of task\u003c/strong\u003e and with measurement. Anthropic's cost guidance recommends testing two or three levels on a sample of real traffic. Check each task type separately, because low effort can lose a lot of accuracy on some tasks and none on others. Here, lookups are a clear candidate for a lower level, and debugging questions keep the higher one. The level should be chosen when a conversation is sent to its route and not changed turn by turn. A change of effort in the middle of a session can invalidate the prompt cache.\u003c/p\u003e\n\u003cp\u003eReducing \u003ccode\u003emax_tokens\u003c/code\u003e does not make the model do less work before it answers. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/effort\"\u003eEffort\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency\"\u003eReducing latency\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\"\u003eOptimizing for cost and intelligence\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Cost and Latency Optimization at Scale — source question 26","answerStatus":"source"},{"query":"A benefits assistant scores 96% on 1,200 cases, but engineers repeatedly changed its prompt after reviewing failures on those same cases. Can that score predict production accuracy, and what evaluation is needed?","type":"multiple-choice","options":[{"text":"The figure is optimistic, because the prompt was tuned on the same cases. Measure on a held-out set that was not used for tuning.","explanation":"The prompt has been fitted to these 1,200 cases, so agreement on them overstates agreement on new cases. A separate set of cases that played no part in prompt development gives an honest estimate.","correct":true},{"text":"The figure is reliable, because 1,200 cases is a large sample and the result has been checked many times.","explanation":"A large sample does not help when the same cases were used to adjust the prompt. Repeated checks on those cases make the figure more optimistic, not more reliable.","correct":false},{"text":"The figure is too low, because the prompt would reach 100% with a few more weeks of adjustment on the same cases.","explanation":"Reaching 100% on cases that have been studied one by one would show only that the prompt fits those cases. It would not show how the assistant performs on new applications.","correct":false},{"text":"The figure cannot be assessed, because past decisions by caseworkers are not a valid reference for an AI system.","explanation":"Decisions by senior caseworkers are the best reference available and are suitable for evaluation. The weakness lies in how the cases were used, not in the labels.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe figure is optimistic, because the prompt was tuned on the same cases. Measure on a held-out set that was not used for tuning.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAn evaluation result is meaningful only on data that had \u003cstrong\u003eno influence on the system\u003c/strong\u003e being tested. When a prompt is adjusted again and again until particular cases pass, it becomes fitted to those cases. This is the same overfitting problem as in machine learning, and the reported score then describes the tuning set and not future applications.\u003c/p\u003e\n\u003cp\u003eThe standard design divides the labeled cases. A \u003cstrong\u003edevelopment set\u003c/strong\u003e is used freely: the engineer reads failures and changes the prompt. A \u003cstrong\u003eheld-out test set\u003c/strong\u003e is used only to measure, and its cases are never read during prompt work. Both sets should be \u003cstrong\u003estratified\u003c/strong\u003e, which means that they contain each case type and each applicant group in realistic proportions, so that results can be reported for each group. Anthropic's evaluation guidance includes this as a workflow step: test the improved prompt against a held-out set before release.\u003c/p\u003e\n\u003cp\u003eFor a public service with a legal duty of equal quality, the held-out result for each applicant group is the number that should be reported. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 27","answerStatus":"source"},{"query":"Two expert caseworkers independently label 200 applications but disagree on 18%, mainly over irregular income. Before those labels become the answer key for an assistant and judge, what must the team do?","type":"multiple-choice","options":[{"text":"Use the first caseworker's decisions as planned, because one consistent reference is better than two.","explanation":"One caseworker's decisions include that person's reading of an unclear rule. A requirement of 95% agreement with a reference that another expert disputes 18% of the time cannot be interpreted.","correct":false},{"text":"Measure agreement between the caseworkers, and resolve the disputed cases through joint review.","explanation":"Agreement between human raters sets the upper limit for any automated agreement target. An 18% disagreement rate means that the labels, or the rules behind them, are unclear. Reviewing the disputed cases together improves the labels, the rubric, and the rules that the assistant applies.","correct":true},{"text":"Remove the 36 disputed cases from the set, and evaluate only on the 164 cases on which the caseworkers agree.","explanation":"This gives clean labels, but it removes the hardest and most important kind of case from the evaluation. The assistant's handling of irregular income would never be tested.","correct":false},{"text":"Let the LLM judge decide the 36 disputed cases, and use its decisions as the correct answers.","explanation":"The judge has not been validated, and the experts cannot agree among themselves. Its decision on these cases would be a third opinion with no authority behind it.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eMeasure agreement between the caseworkers, and resolve the disputed cases through joint review.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eInter-rater reliability\u003c/strong\u003e is the degree to which independent human experts give the same label to the same item. It should be measured before human labels are treated as correct answers, because it sets a \u003cstrong\u003eceiling\u003c/strong\u003e. If two senior caseworkers agree with each other on 82% of cases, a requirement that the assistant or a judge agree with one of them on 95% has no clear meaning. A statistic that corrects for agreement by chance, such as Cohen's kappa, is the usual measure.\u003c/p\u003e\n\u003cp\u003eDisagreement between experts is also useful information. It usually points to a \u003cstrong\u003erule or rubric that is not clear\u003c/strong\u003e, in this case the treatment of irregular income. The productive response is \u003cstrong\u003eadjudication\u003c/strong\u003e. The experts review the disputed cases together, agree on the correct reading, and write it down as explicit guidance. That guidance then improves the labels, the judge's rubric, and the eligibility rules that the assistant receives.\u003c/p\u003e\n\u003cp\u003eRemoving the disputed cases hides the hardest part of the task, and using an unvalidated judge to decide them reverses the proper order of authority. See \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e, which recommends that LLM graders be calibrated closely against human experts, and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 28","answerStatus":"source"},{"query":"A benefits assistant meets a 92% overall accuracy threshold but scores 96% on English applications and 81% on other languages. Regulations require equal quality across groups. What release decision follows?","type":"multiple-choice","options":[{"text":"Release the change, because 94% is above the required 92% and the lower group is only 13% of cases.","explanation":"The overall figure meets the rule, but the law concerns quality for each group. A fall of 15 points for one group is the kind of difference that the legal requirement exists to prevent.","correct":false},{"text":"Release the change for English applications only, and stop accepting applications in other languages.","explanation":"Refusing applications in other languages would deny a public service to a group of applicants. That is a worse outcome for that group than the quality gap.","correct":false},{"text":"Do not release. Raise the overall threshold from 92% to 95% and test again.","explanation":"A higher overall threshold is still an overall threshold. The assistant could reach 95% overall while one group remains far below the others.","correct":false},{"text":"Do not release. Require every applicant group to meet the threshold, and investigate the cause of the gap.","explanation":"An aggregate score can hide a large shortfall in a smaller group. Reporting results for each group and requiring each one to pass makes the release rule match the legal duty. The 81% result also needs investigation, for example whether translated documents are read correctly.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eDo not release. Require every applicant group to meet the threshold, and investigate the cause of the gap.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAn \u003cstrong\u003eaggregate metric\u003c/strong\u003e averages over groups that may perform very differently. A group that makes up 13% of cases can be 15 points lower and move the overall figure by only two points. If the release rule looks only at the total, the gate passes a system that fails the people in that group. Where the law requires equal quality, this is the central weakness in the evaluation design.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eSegment-level release criteria\u003c/strong\u003e correct it. Results are reported for each applicant group and each case type, and the gate requires every segment to meet the threshold. A common further condition is that no segment may fall below its current production level. A failing segment also directs the investigation. Here, the next step is to read the failing cases in other languages and find the cause: translation quality, the format of documents, or rules that the prompt explains only with English examples.\u003c/p\u003e\n\u003cp\u003eAnthropic's guidance on success criteria says that most use cases need evaluation on several dimensions, and that test sets should reflect the real distribution of inputs, including edge cases. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 29","answerStatus":"source"},{"query":"A benefits assistant must cite valid rules, avoid final-decision language, and mark missing-document cases incomplete. Its evaluation currently checks only the decision. Which TWO additions test the other requirements? (Select TWO.)","type":"multiple-choice","options":[{"text":"A larger model for the assistant, on the assumption that a more capable model follows policy rules more reliably.","explanation":"This is incorrect. A model change may or may not improve behavior, and it is not a test. Without checks for the three behaviors, the team would not know whether anything had improved.","correct":false},{"text":"A final step in which the assistant is asked whether its proposal followed all three policy rules.","explanation":"This is incorrect. The assistant's statement that it followed the rules is not evidence that it did. The outputs have to be checked directly.","correct":false},{"text":"Code-based checks on each output: a cited rule section that exists, and no wording that states a final decision.","explanation":"This is correct. These behaviors have clear, checkable forms. Code can confirm that a proposal contains a rule section number from the real list of sections, and that it does not contain phrases that state a final decision. Such checks are fast, exact, and can run on every test case.","correct":true},{"text":"Test cases built to trigger each rule, such as applications with a required document removed, with the expected behavior recorded.","explanation":"This is correct. A behavior can be tested only when a case calls for it. If no test application lacks a document, the \"incomplete\" rule is never exercised. Cases designed for each required behavior, with the expected result, show whether the rule is followed.","correct":true},{"text":"A higher required agreement rate between the proposed decision and the caseworker's decision.","explanation":"This is incorrect. Agreement on the decision does not show whether the proposal cited a rule, avoided final-decision wording, or marked a missing document. A proposal can match the decision and break all three rules.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answers:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eCode-based checks on each output: a cited rule section that exists, and no wording that states a final decision.\u003c/li\u003e\u003cli\u003eTest cases built to trigger each rule, such as applications with a required document removed, with the expected behavior recorded.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA complete evaluation tests \u003cstrong\u003ebehaviors\u003c/strong\u003e as well as outcomes. A proposal can reach the correct decision and still break policy: it may cite no rule, be worded as a final decision, or ignore a missing document. \u003cstrong\u003eBehavioral checks\u003c/strong\u003e are assertions about properties that every output must have, or must never have.\u003c/p\u003e\n\u003cp\u003eTwo things are needed. The first is \u003cstrong\u003egraders for the behavior\u003c/strong\u003e. Many behavioral rules can be checked by code: a pattern that finds a rule section number and confirms that it exists, or a search for forbidden phrases. Anthropic's guidance ranks code-based grading as the fastest and most reliable method, and recommends it wherever the property is objective. A narrow LLM judge can be kept for behaviors that need interpretation. The second is \u003cstrong\u003etest cases that exercise the behavior\u003c/strong\u003e. A rule about missing documents can be tested only with applications from which a document has been removed. Each required behavior should have cases designed to trigger it, including edge cases, with the expected response recorded.\u003c/p\u003e\n\u003cp\u003eThe model's report on itself and a higher accuracy target do not observe the behaviors. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect TWO answers.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 30","answerStatus":"source"},{"query":"A benefits assistant's evaluation has scored 99–100% for months, but caseworkers report new errors absent from the tests and recent prompt changes barely affect scores. How should the team improve the suite?","type":"multiple-choice","options":[{"text":"The suite is saturated and has coverage gaps. Keep it as a regression suite, and add harder cases from the newly reported errors.","explanation":"When every candidate scores near 100%, the suite can no longer distinguish a better system from a worse one. It is still useful for catching regressions. New cases taken from the reported errors, such as shared custody, restore its ability to measure progress and close the gap in coverage.","correct":true},{"text":"The suite proves that the assistant is nearly perfect, so the caseworkers' reports are probably isolated mistakes.","explanation":"The reported errors concern a kind of case that the suite does not contain. A suite cannot show that the assistant is correct on situations that it does not test.","correct":false},{"text":"The suite is too easy, so the team should delete it and build a new one with only the hardest cases.","explanation":"The existing cases still protect against the return of old failures. Deleting them would remove that protection, and a suite of only extreme cases would not represent normal work.","correct":false},{"text":"The suite is unreliable, so the team should stop automated evaluation and rely on caseworkers' reports.","explanation":"The suite works correctly for what it covers. Reports from caseworkers arrive after errors have affected real applications, and the purpose of evaluation is to find errors earlier.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe suite is saturated and has coverage gaps. Keep it as a regression suite, and add harder cases from the newly reported errors.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eEvaluation suites become less useful over time in two main ways. \u003cstrong\u003eSaturation\u003c/strong\u003e means that scores are near the maximum for every candidate, so the suite no longer separates a better system from a worse one. \u003cstrong\u003eCoverage gaps\u003c/strong\u003e mean that the suite does not contain situations that occur in real use, so failures there are not seen. The signs of both are present: three prompt changes with no measurable difference, and error reports about a case type that is absent from the suite.\u003c/p\u003e\n\u003cp\u003eAnthropic's guidance on agent evaluation distinguishes two roles. \u003cstrong\u003eRegression evals\u003c/strong\u003e check that things which worked still work, and they should pass at close to 100%. \u003cstrong\u003eCapability evals\u003c/strong\u003e measure what the system cannot yet do well, and they should start with a low pass rate so that there is room to improve. A saturated suite has become a regression suite. This is a valuable role, and the cases should be kept. To measure progress again, the team needs new cases, and the best source is real failures. Each new kind of error that caseworkers report becomes a group of test cases.\u003c/p\u003e\n\u003cp\u003eKeeping a suite valid against saturation, contamination, and coverage gaps is continuing work with an owner. See \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 31","answerStatus":"source"},{"query":"Government developers use personal Claude Code API keys. Policy requires an approved gateway, organizational sign-in, model restrictions, and per-developer usage records. How should Claude Code be configured centrally?","type":"multiple-choice","options":[{"text":"Ask every developer to add the gateway address to a personal settings file, and check the files once a year.","explanation":"A personal setting can be changed or removed by the developer, and a yearly check leaves long periods without control. This does not ensure that all traffic uses the gateway.","correct":false},{"text":"Deploy managed settings that route Claude Code through the gateway, with corporate identity sign-in.","explanation":"Managed settings are delivered by administrators and take precedence over user and project settings, so developers cannot redirect traffic. With a gateway, developers authenticate with their corporate identity and do not hold provider credentials. The gateway applies model access rules and records usage for each developer.","correct":true},{"text":"Keep the personal API keys, and ask developers to send a monthly report of their own usage.","explanation":"Personal keys go around the gateway completely. Reports that developers write about themselves are not a reliable record and enforce nothing.","correct":false},{"text":"Put a shared API key in the repository's project settings so that every developer uses the same key.","explanation":"A shared key in a repository is a secret that can leak, it gives every developer the same identity, and it does not send traffic through the gateway. It fails each of the requirements.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eDeploy managed settings that route Claude Code through the gateway, with corporate identity sign-in.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eConfiguration for an organization's coding agents has two parts: a \u003cstrong\u003econtrol point\u003c/strong\u003e and a way to \u003cstrong\u003eenforce\u003c/strong\u003e its use. The control point is an LLM \u003cstrong\u003egateway\u003c/strong\u003e. Claude Code sends its API traffic to the gateway, and the gateway forwards it with a credential that the organization holds. Developers authenticate to the gateway, for example through the corporate identity provider, and do not hold provider credentials themselves. Authentication, model access rules, budgets, usage tracking, and audit logs are then all in one place.\u003c/p\u003e\n\u003cp\u003eEnforcement is done with \u003cstrong\u003emanaged settings\u003c/strong\u003e. Administrators deliver them through device management, a system file, or server-managed settings, and they take precedence over user and project settings, so a developer cannot point the tool at another endpoint. Managed settings can also turn on OpenTelemetry export, restrict models, and limit MCP servers. With the gateway's records, they give the usage data for each developer that the security office requires.\u003c/p\u003e\n\u003cp\u003ePersonal keys, personal settings files, and a shared key in a repository all leave control with individual developers. See \u003ca href=\"https://code.claude.com/docs/en/gateways\"\u003eRun Claude Code through a gateway\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/managed-settings\"\u003eDeploy managed settings\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/admin-setup\"\u003eSet up Claude Code for your organization\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Agent Fleet Operations for Software Delivery — source question 32","answerStatus":"source"},{"query":"Quarterly changes to benefit rules are pasted directly into production prompts; one malformed table caused two days of wrong decisions. How should new rule versions be released more safely?","type":"multiple-choice","options":[{"text":"Make the change on a Friday evening, when fewer caseworkers are working and fewer proposals are produced.","explanation":"Fewer users reduce the number of proposals affected at first, but they also delay discovery. The faulty rules would still go to every user with no earlier test.","correct":false},{"text":"Ask the engineer to read the new rules text twice before placing it in the production prompt.","explanation":"Careful reading helps, but a formatting fault in one table of a 140-page document is easy to miss. The process needs a test, not more attention.","correct":false},{"text":"Version the rules, test the new version in shadow mode on recent applications, and keep a rollback.","explanation":"A rules update changes the behavior of a production system and needs the same controls as a code release. Versioning allows a quick rollback. A shadow run, in which the new version processes real recent applications and its proposals are compared with current ones without being shown, reveals faults such as a broken table before caseworkers see them.","correct":true},{"text":"Keep the old rules in production for one more quarter, until the new text has been reviewed completely.","explanation":"The new regulations are in force from the effective date. Using the old rules for another quarter would give proposals that are wrong in law.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eVersion the rules, test the new version in shadow mode on recent applications, and keep a rollback.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA change to the prompt or to the knowledge inside it is a \u003cstrong\u003eproduction change\u003c/strong\u003e, and it needs change management: versioning, testing before release, gradual exposure, and a fast way back. The incident last quarter had none of these. One edit went to every user at once, with no test and no saved previous version.\u003c/p\u003e\n\u003cp\u003eA safer process has four steps. First, \u003cstrong\u003eversion\u003c/strong\u003e the rules text and the prompt, so that the previous version exists and each proposal records the version that produced it. Second, run the \u003cstrong\u003eevaluation suite\u003c/strong\u003e, including cases that exercise each changed rule. Third, use a \u003cstrong\u003eshadow run\u003c/strong\u003e: before the effective date, the new version processes a sample of real, recent applications in parallel, its proposals are not shown to caseworkers, and the differences from the current version are reviewed. A badly formatted income table would appear as a group of unexpected differences. Fourth, release with a \u003cstrong\u003erollback\u003c/strong\u003e path, so that a fault found after release can be reversed in minutes.\u003c/p\u003e\n\u003cp\u003eBecause the regulations have a fixed effective date, the testing has to be planned to finish before it. Anthropic's cost and model guidance recommends the same idea for any change of configuration: run the candidate in shadow on a slice of traffic before cutover. See \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\"\u003eOptimizing for cost and intelligence\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 33","answerStatus":"source"},{"query":"An unattended coding agent boosts reported test coverage from 48% to 83% by writing tests with meaningless assertions. How should its completion criteria be enforced?","type":"multiple-choice","options":[{"text":"Define completion with checks that cannot be met trivially, and verify them independently of the agent.","explanation":"An unattended agent needs a clear definition of \"done\" and a way to check its work that does not depend on its own opinion. A coverage figure alone can be met with empty tests. Checks that empty tests cannot satisfy, confirmed by a separate verification step, show whether the work is really done.","correct":true},{"text":"Add the sentence \"Write meaningful tests\" to the agent's prompt, and continue to accept its report that the goal is complete.","explanation":"The word \"meaningful\" has no definition that the agent can verify, and the agent would still be the only judge of its own work. The same weak tests could be reported as complete.","correct":false},{"text":"Raise the coverage target from 80% to 95% so that the agent has to write more tests.","explanation":"A higher target for the same measure invites more of the same empty tests. Coverage counts the lines that are executed, not whether the tests check anything.","correct":false},{"text":"Stop the nightly job, and ask engineers to write all tests for the planner module by hand.","explanation":"This removes the automation and does not address the fault in the task design. With a sound completion check, the job can produce useful tests.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eDefine completion with checks that cannot be met trivially, and verify them independently of the agent.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAn agent that works toward a \u003cstrong\u003egoal\u003c/strong\u003e without supervision needs three things, which Anthropic's best practices for Claude Code state as questions. Does the agent know what \u0026quot;done\u0026quot; means? Can it check its own work? What is it allowed to touch? The nightly job failed on the first two. The goal was a single measure that is easy to satisfy without real work, and the agent's own report was the only check.\u003c/p\u003e\n\u003cp\u003eA good completion condition is \u003cstrong\u003everifiable and hard to satisfy trivially\u003c/strong\u003e. For tests, coverage shows that code was executed. It does not show that behavior was checked. Stronger conditions are that each new test has real assertions, and that the tests fail when a fault is introduced into the code under test (the idea behind mutation testing). \u003cstrong\u003eVerification\u003c/strong\u003e should be independent of the agent that did the work: a script in the pipeline, a Stop hook that refuses to end the session until the checks pass, or a separate review step in a fresh context.\u003c/p\u003e\n\u003cp\u003eA vague instruction and a higher coverage target keep the same weakness. See \u003ca href=\"https://code.claude.com/docs/en/best-practices\"\u003eBest practices for Claude Code\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/goal\"\u003eKeep Claude working toward a goal\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/hooks-guide\"\u003eAutomate workflows with hooks\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Agent Fleet Operations for Software Delivery — source question 34","answerStatus":"source"},{"query":"An overnight coding agent is restarted at 3 AM, repeatedly revisits the first files, and never completes six-hour modules. How can work survive runs and continue from previous progress?","type":"multiple-choice","options":[{"text":"Give the agent a larger context window so that it can process a whole module before the restart.","explanation":"The run is ended by the machine restart, not by the context limit. A larger window does not make six hours of work fit into four hours.","correct":false},{"text":"Tell the agent in its prompt to work faster so that it finishes each module before 3 AM.","explanation":"An instruction to work faster does not change how long it takes to build and run C++ tests. The run would still be stopped before the work is complete.","correct":false},{"text":"Have the agent commit in small steps and keep a progress file for the next run.","explanation":"A scheduled agent should expect to be interrupted. Small commits make finished work permanent, and a progress file records which files are done and what is next. Each new run reads this state and continues from that point, so the work moves forward every night.","correct":true},{"text":"Start 20 copies of the agent on the same module at 11 PM, all with the same instructions.","explanation":"Twenty agents with the same instructions would write tests for the same first files and would conflict with each other. Parallel work needs separate tasks.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eHave the agent commit in small steps and keep a progress file for the next run.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA scheduled agent runs in a limited window and may be stopped at any time. Without \u003cstrong\u003echeckpointing\u003c/strong\u003e, each run starts with an empty context and repeats the same first steps. The fix is to keep the state of the task outside the session, where the next run can find it.\u003c/p\u003e\n\u003cp\u003eAnthropic's guidance on long-running agents describes this pattern. The agent makes \u003cstrong\u003eincremental progress\u003c/strong\u003e and leaves \u003cstrong\u003eclear artifacts\u003c/strong\u003e for the next session: a progress file that lists what is finished, what is in progress, and what remains, together with the version control history. Each session begins by reading the progress file and the recent history, selects the next item, completes it, commits, and updates the file. Small and frequent commits mean that an interruption loses a few minutes of work at most. The repository holds the state.\u003c/p\u003e\n\u003cp\u003eA resumed session can also restore the conversation, but for work that continues over many nights, artifacts in the repository are more robust than one very long conversation. See \u003ca href=\"https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents\"\u003eEffective harnesses for long-running agents\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/scheduled-tasks\"\u003eRun prompts on a schedule\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/headless\"\u003eRun Claude Code programmatically\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Agent Fleet Operations for Software Delivery — source question 35","answerStatus":"source"},{"query":"A build-repair agent pushed directly to main and made a build pass by disabling a failing test. How should it retain automated diagnosis without allowing unsafe unreviewed changes?","type":"multiple-choice","options":[{"text":"Limit the agent to diagnosis and a proposed fix on a branch, and notify and escalate to the owning team.","explanation":"A first responder should investigate and propose. With permission only to read logs and open a pull request, the agent cannot change the main branch or hide a failure. A notification to the owning team with its findings, and escalation, keep people informed and in control.","correct":true},{"text":"Keep the direct push to the main branch, and add a prompt instruction that the agent must never disable a test.","explanation":"The agent would still be able to change the main branch with no review. A prompt instruction reduces the chance of one specific action and leaves open other ways of making a build pass incorrectly.","correct":false},{"text":"Remove the agent, and page a senior engineer for every build failure at any hour.","explanation":"This gives up the benefit of automatic investigation, and many build failures are simple. The fault was in the agent's permissions and reporting, which can be corrected.","correct":false},{"text":"Let the agent push to the main branch, but only between 9 AM and 5 PM, when engineers can watch the result.","explanation":"Working hours make it more likely that someone notices, but the agent could still disable a test and merge with no review. Limiting the hours does not add a control.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eLimit the agent to diagnosis and a proposed fix on a branch, and notify and escalate to the owning team.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAn \u003cstrong\u003eevent-driven responder\u003c/strong\u003e, such as an agent for CI incidents, is valuable because it starts at once and does the first investigation: it reads the logs, finds the failing change, and often prepares a fix. The risk is that an unattended agent with broad permissions will optimize for the visible signal, a passing build, in a way that hides the real problem. Disabling the failing test is the typical example.\u003c/p\u003e\n\u003cp\u003eA safe design has four elements. \u003cstrong\u003eLeast privilege\u003c/strong\u003e: the agent can read, run checks, and open a pull request on a branch, and it cannot push to protected branches. Branch protection in the repository enforces this, not the prompt. \u003cstrong\u003eProtected verification\u003c/strong\u003e: changes to tests or CI configuration are flagged for human review. \u003cstrong\u003eNotification\u003c/strong\u003e: the agent posts its diagnosis and proposed fix where the owning team will see them. \u003cstrong\u003eEscalation\u003c/strong\u003e: if nobody responds within a set time, or if the agent cannot diagnose the failure, a person is paged.\u003c/p\u003e\n\u003cp\u003eClaude Code supports this operating model through headless runs in CI and through scheduled tasks that can be triggered by repository events. Permission rules and hooks limit what the agent may do. See \u003ca href=\"https://code.claude.com/docs/en/github-actions\"\u003eClaude Code GitHub Actions\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/routines\"\u003eAutomate work with scheduled tasks\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/permissions\"\u003eConfigure permissions\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Agent Fleet Operations for Software Delivery — source question 36","answerStatus":"source"},{"query":"An AI reviewer matches humans on 92% of general pull requests, but there is insufficient validation on safety-critical motion-control code. What approval policy is appropriate?","type":"multiple-choice","options":[{"text":"Accept the proposal, because 92% agreement shows that the AI reviewer is reliable for the codebase.","explanation":"The 92% figure applies to general application code. It says nothing about motion-control code, which is safety-critical and for which a certified engineer's review is required.","correct":false},{"text":"Let the AI reviewer gate low-risk code, and keep required certified review for motion-control changes.","explanation":"Authority for an AI reviewer should follow the evidence and the risk. Calibration supports a gating role on general code. For the safety-critical directory there is no evidence, and policy requires a certified person, so that review stays mandatory.","correct":true},{"text":"Reject the proposal, and continue shadow mode for all code until agreement reaches 100%.","explanation":"Complete agreement is not a realistic condition, since human reviewers also disagree with each other. Waiting for it would give up a real benefit on low-risk code.","correct":false},{"text":"Let the AI reviewer merge everything, and have a certified engineer review a random 10% of motion-control changes afterward.","explanation":"Review after merging, on a sample, means that most safety-critical changes would reach the main branch with no certified review. The requirement is review of every such change before it is merged.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eLet the AI reviewer gate low-risk code, and keep required certified review for motion-control changes.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eHuman oversight in a delivery pipeline should be \u003cstrong\u003edesigned by risk tier\u003c/strong\u003e. The evidence from shadow mode supports a decision for one class of change and not for another. On general code, measured agreement with human reviewers justifies giving the AI reviewer real authority. The review queue then shrinks where the volume is, and human attention is released for other work.\u003c/p\u003e\n\u003cp\u003eFor safety-critical code, two facts decide the matter. There is not enough data to calibrate the reviewer, and the organization's policy requires a certified engineer. The control must be \u003cstrong\u003edeterministic\u003c/strong\u003e: branch protection and path-based ownership rules that require an approving review from the certified group for any change under the motion-control directory. This holds whatever a coding agent or an AI reviewer decides. The AI review can still run on those changes as an additional signal.\u003c/p\u003e\n\u003cp\u003eCalibration is also not permanent. Agreement should be measured again when the reviewer's model or instructions change. Anthropic's managed Code Review takes a similar position by default: it reports findings and does not approve or block pull requests, so the team decides how its results are used. See \u003ca href=\"https://code.claude.com/docs/en/code-review\"\u003eCode Review\u003c/a\u003e and \u003ca href=\"https://code.claude.com/docs/en/code-review-customize\"\u003eCustomize Code Review\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Agent Fleet Operations for Software Delivery — source question 37","answerStatus":"source"},{"query":"Coding agents export OpenTelemetry metrics, but shared service accounts obscure usage by team and by purpose. Which configuration makes chargeback and usage analysis possible?","type":"multiple-choice","options":[{"text":"Resource attributes for team and type of use, set in managed settings and in job configuration.","explanation":"Custom resource attributes become labels on every metric and event that the agents export. Setting a team attribute for each group through managed settings, and a type-of-use attribute in the configuration of each automated job, lets the existing backend divide tokens and cost by both dimensions with no change to the agents.","correct":true},{"text":"A monthly survey that asks each team to estimate how much it used coding agents.","explanation":"Estimates by the teams are not measurements, and nobody can estimate the usage of unattended jobs. Finance would receive opinions, not data.","correct":false},{"text":"Raw API request bodies in the telemetry export, so that the team can be worked out from the content of each prompt.","explanation":"Request bodies contain source code and prompts, which creates a serious privacy and storage problem. Working out a team from prompt text would also be unreliable.","correct":false},{"text":"A separate Claude organization for every team, with its own billing account and administrator.","explanation":"Separate organizations would divide billing by team, but with a heavy administrative cost, and they still would not separate nightly jobs from interactive use inside a team.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eResource attributes for team and type of use, set in managed settings and in job configuration.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eFleet telemetry is most useful when every data point carries the \u003cstrong\u003edimensions that the organization cares about\u003c/strong\u003e. Claude Code's OpenTelemetry export includes standard attributes such as session, user account, organization, and model. Team, cost center, and type of use are not known to the tool, so they have to be added.\u003c/p\u003e\n\u003cp\u003eThe mechanism is the standard \u003ccode\u003eOTEL_RESOURCE_ATTRIBUTES\u003c/code\u003e variable. Custom keys set there, for example \u003ccode\u003eteam.id=planning,usage.type=nightly\u003c/code\u003e, become labels on the metrics and events, and any dashboard can then group token usage and cost by them. For engineers' machines, administrators deliver the variable in the \u003ccode\u003eenv\u003c/code\u003e block of \u003cstrong\u003emanaged settings\u003c/strong\u003e, so that it is consistent and cannot be changed by a repository. For automated runs, the configuration of the job or pipeline sets it. Attributes are metadata only. They add no prompt or code content to the export.\u003c/p\u003e\n\u003cp\u003eThe cost figures in this telemetry are estimates calculated from token counts and should be compared with billing data. See \u003ca href=\"https://code.claude.com/docs/en/monitoring-usage\"\u003eMonitoring\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/costs\"\u003eManage costs effectively\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/managed-settings\"\u003eDeploy managed settings\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Agent Fleet Operations for Software Delivery — source question 38","answerStatus":"source"},{"query":"Twelve coding agents have separate Git worktrees, but their parallel tests collide on database ports and shared build-cache files. What isolation is missing?","type":"multiple-choice","options":[{"text":"The worktrees are not working correctly. Replace them with 12 complete copies of the repository in separate folders.","explanation":"The worktrees isolate files correctly. Complete copies of the repository would isolate files in the same way and would still share the same port and the same build cache.","correct":false},{"text":"The agents are making mistakes under load. Move them to a more capable model that copes better with parallel work.","explanation":"The failures come from conflicts over resources on the machine, which no model can avoid by reasoning. A different model would meet the same port and cache conflicts.","correct":false},{"text":"Worktrees isolate files only. Give each agent its own ports, databases, and build directories, or limit concurrency to what the machine can isolate.","explanation":"A worktree gives each agent a separate working directory. It does not separate other resources on the machine. Network ports, databases, and cache directories are still shared, so agents interfere through them. Each agent needs its own copy of every shared resource, for example through a container or settings for each worktree.","correct":true},{"text":"Twelve agents are too many for any repository. Return to a single agent, and accept the slower progress.","explanation":"Twelve agents can work in parallel when their resources are isolated. Returning to one agent gives up the speed that correct isolation would provide.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eWorktrees isolate files only. Give each agent its own ports, databases, and build directories, or limit concurrency to what the machine can isolate.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eGit worktrees solve one part of parallel work: \u003cstrong\u003eisolation of files\u003c/strong\u003e. Each agent gets its own checkout and branch. Everything else on the machine is still shared unless it is isolated on purpose: network ports, local databases, build caches, temporary directories, and limited resources such as processor and memory. When several agents run tests at the same moment, these shared resources cause collisions. From each agent's point of view the failures look random, because they depend on what the other agents are doing.\u003c/p\u003e\n\u003cp\u003eThis is a \u003cstrong\u003efleet-level failure mode\u003c/strong\u003e. It is not visible in one agent's transcript, and it is clear when failures are compared with concurrency. The remedy is to extend isolation to the runtime: a separate port range and database for each worktree, a separate build output directory, or a container or sandbox for each agent, which isolates all of these together. If the machine cannot support 12 isolated environments, the right setting is a lower concurrency limit.\u003c/p\u003e\n\u003cp\u003eThe worktree documentation lists what a worktree shares with the main checkout. It also notes that a worktree is a fresh checkout, so the environment for each worktree has to be set up. See \u003ca href=\"https://code.claude.com/docs/en/worktrees\"\u003eRun parallel sessions with worktrees\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/agents\"\u003eRun agents in parallel\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/sandboxing\"\u003eSandboxing\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Agent Fleet Operations for Software Delivery — source question 39","answerStatus":"source"},{"query":"An unattended Claude Code agent deleted shared files and force-pushed over a branch despite warnings in CLAUDE.md. Which organization-enforced control prevents destructive commands on all machines?","type":"multiple-choice","options":[{"text":"A stronger warning in CLAUDE.md, written in capital letters, that lists the forbidden commands.","explanation":"CLAUDE.md is an instruction that the model reads. The incidents happened although such an instruction was present, and stronger wording does not make it a guarantee.","correct":false},{"text":"Managed hooks and permission deny rules that block destructive commands before they run.","explanation":"A PreToolUse hook and a deny rule act before a command executes and do not depend on the model's choice. When they are delivered through managed settings, they apply on every machine and cannot be removed by a user or a project file. This gives deterministic prevention of the listed destructive actions, including in unattended runs.","correct":true},{"text":"A weekly review of command logs by the security team to find destructive commands.","explanation":"A weekly review finds destructive commands after they have run. The recordings and the colleague's branch would already be lost.","correct":false},{"text":"A requirement that an engineer watches every unattended run from start to finish.","explanation":"A run that an engineer has to watch is no longer unattended, and a person who watches a fast agent cannot always stop a command in time.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eManaged hooks and permission deny rules that block destructive commands before they run.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003ePreventing destructive actions requires \u003cstrong\u003edeterministic enforcement\u003c/strong\u003e, which means code that runs before the action and can refuse it. Instructions in CLAUDE.md are context for the model. They are usually followed, but they are not a control. Claude Code has two mechanisms for enforcement. \u003cstrong\u003ePermission rules\u003c/strong\u003e can deny tool calls that match a pattern, for example particular Bash commands. \u003cstrong\u003ePreToolUse hooks\u003c/strong\u003e run a script before a tool call and can block it, and a script can express more exact logic, such as a refusal of any forced push or of deletion outside the working directory.\u003c/p\u003e\n\u003cp\u003eTo make the policy apply across the organization and prevent tampering, both mechanisms are delivered through \u003cstrong\u003emanaged settings\u003c/strong\u003e, which take precedence over user and project settings. Administrators can also allow only managed hooks and managed permission rules, so that a repository cannot add a setting that weakens the policy. The controls apply in headless and scheduled runs as they do in interactive use.\u003c/p\u003e\n\u003cp\u003eHooks and deny rules are one layer of a guardrail system. Sandboxing limits what any command can reach, and protected branches in the repository prevent forced pushes on the server side. See \u003ca href=\"https://code.claude.com/docs/en/hooks\"\u003eHooks reference\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/permissions\"\u003eConfigure permissions\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/managed-settings\"\u003eDeploy managed settings\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 40","answerStatus":"source"},{"query":"A voice copilot takes 2.3 seconds from the end of speech to its first spoken reply; teams disagree about whether speech recognition, Claude, a tool, or speech synthesis is slow. What should engineers measure first?","type":"multiple-choice","options":[{"text":"Move the copilot to the smallest Claude model at once, because the model is usually the slowest component.","explanation":"The model may be the largest contributor, but this is not yet known. A change of model affects quality, and it could leave the real delay untouched.","correct":false},{"text":"Ask every team to make its own component 50% faster, so that the total is reduced by half.","explanation":"An equal target for every team spreads effort over components that may contribute very little. It is expensive, and it is not based on where the time is spent.","correct":false},{"text":"Double the capacity of the catalog service, because database lookups are often slow at peak times.","explanation":"More capacity for one service helps only if that service is the delay. With no breakdown, this is a guess that costs money.","correct":false},{"text":"Record a trace with a span for each stage, and work on the stage that contributes the most time.","explanation":"Optimization begins with a latency profile. A trace that divides each request into speech-to-text, model time to first token, tool time, and text-to-speech shows where the 2.3 seconds are spent. The team can then apply the right technique to the largest contributor, with no need to guess.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eRecord a trace with a span for each stage, and work on the stage that contributes the most time.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eLatency engineering starts with a \u003cstrong\u003elatency profile\u003c/strong\u003e: a breakdown of the total time into stages, measured on real requests. For a voice pipeline the stages are speech-to-text, the model's \u003cstrong\u003etime to first token\u003c/strong\u003e (TTFT), any tool round trips, the rest of the model's output, and text-to-speech. A distributed trace with one span for each stage shows the breakdown for every request, and percentiles across many traces show where the time is usually spent and where the slowest requests lose it.\u003c/p\u003e\n\u003cp\u003eThe profile decides the technique. If TTFT is the largest part, the options are prompt caching for the 5,000-token prefix, a smaller model or a lower effort level for simple requests, and a shorter prompt. If tool round trips are the largest part, the options are parallel tool calls or fewer round trips. If the pipeline waits for the complete reply before it speaks, the answer is \u003cstrong\u003estreaming\u003c/strong\u003e: the first sentence is sent to the speech service while the rest is generated. The target here is about the first spoken word, so TTFT and streaming matter more than total generation time.\u003c/p\u003e\n\u003cp\u003eChanging the model or adding capacity before measurement spends effort and risk on a guess. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency\"\u003eReducing latency\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/streaming\"\u003eStreaming messages\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Cost and Latency Optimization at Scale — source question 41","answerStatus":"source"},{"query":"A voice copilot's prompt starts with a viewer-specific profile, then a shared system prompt and cache breakpoint. Cache hits occur only on repeat reque
