uld describe a different fault or turbine. In maintenance work, an answer that looks current and is not is a safety risk.","correct":false},{"text":"Detect that the service cannot be reached, say so clearly, offer search of manuals stored on the tablet, and queue requests to send later.","explanation":"Graceful degradation means a reduced service that is useful and that is honest about its state. A clear message tells the technician that the copilot is offline. Search of manuals stored on the tablet still gives access to procedures, and queued requests are sent when the connection returns.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eDetect that the service cannot be reached, say so clearly, offer search of manuals stored on the tablet, and queue requests to send later.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eGraceful degradation\u003c/strong\u003e is the principle that when a dependency fails, a system should provide a reduced service that is still useful, and should be clear about what it is doing. For a copilot in the field, losing the connection is a normal condition, so the behavior with no connection has to be designed.\u003c/p\u003e\n\u003cp\u003eA good design has three parts. \u003cstrong\u003eDetection and honesty\u003c/strong\u003e: the client applies timeouts, recognizes that the service cannot be reached, and tells the technician plainly. A spinner with no end is silent failure. \u003cstrong\u003eA degraded mode\u003c/strong\u003e: the functions that do not need the model continue to work. Manuals that change each quarter can be stored on the tablet and searched with a simple local index, so that the technician still has the procedures. \u003cstrong\u003eQueueing\u003c/strong\u003e: requests that need the model are stored and sent when the connection returns, and operations that create work orders use idempotency keys so that a retry cannot create a duplicate.\u003c/p\u003e\n\u003cp\u003eThe degraded mode must never show content as a current answer from the model when it is not one. An old answer shown as new is a hidden failure and can be dangerous in maintenance work. See \u003ca href=\"https://platform.claude.com/docs/en/api/errors\"\u003eClaude API errors\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\"\u003eBuilding effective agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 63","answerStatus":"source"},{"query":"A maintenance copilot receives up to 50,000 raw sensor rows per tool call, exhausting context although diagnosis needs only a few statistics and trends. How should sensor data enter the model context?","type":"multiple-choice","options":[{"text":"Move the copilot to a model with a larger context window so that more sensor rows fit in the context.","explanation":"A larger window accepts more rows, but the cost rises with them, and the model still has to find a few statistics among tens of thousands of lines.","correct":false},{"text":"Ask the model in the system prompt to ignore sensor rows that are not relevant to the fault.","explanation":"The rows are already in the context and have been paid for before the model can ignore them. An instruction does not reduce the tokens or the loss of focus.","correct":false},{"text":"Have the data filtered and aggregated before it enters the context, by the tool or by code.","explanation":"The model needs the result of an analysis and not the raw rows. A tool that accepts parameters for a time range and for aggregation, or a code execution step in which the model's code processes the rows outside the context, returns only the statistics. The context stays small and focused, and cost falls sharply.","correct":true},{"text":"Limit the tool to the first 100 rows of every query, whatever the technician asks.","explanation":"The first 100 rows are an arbitrary part of the data and may not include the hour or the sensor that matters. This removes data without regard to its value.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eHave the data filtered and aggregated before it enters the context, by the tool or by code.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eTool results are part of the context. A tool that returns unprocessed data fills the window with tokens that the model has to read, and that the application has to pay for on every later turn, in order to find a few facts. Anthropic's guidance on writing tools for agents recommends that tools return \u003cstrong\u003ehigh-signal, token-efficient\u003c/strong\u003e results. It recommends filtering, pagination, and truncation with sensible defaults, and tools that match the task (\u0026quot;maximum vibration for turbine T in the last hour\u0026quot;) in place of tools that return everything.\u003c/p\u003e\n\u003cp\u003eThere are two ways to do this. The \u003cstrong\u003etool can do the work\u003c/strong\u003e: it accepts parameters for time range, sensor, and aggregation, and returns a short summary. Or the \u003cstrong\u003emodel's code can do the work\u003c/strong\u003e: with code execution, or with programmatic tool calling, Claude writes a short program that calls the tool, processes the rows in a sandbox, and returns only the computed result to the context. The raw data is never placed in the conversation. Anthropic's cost guidance reports large reductions in tokens, and better accuracy, when tables are analyzed with code and not pasted into the prompt.\u003c/p\u003e\n\u003cp\u003eA larger window and an instruction to ignore rows both leave the data in the context, and an arbitrary limit on rows may remove the rows that matter. See \u003ca href=\"https://www.anthropic.com/engineering/writing-tools-for-agents\"\u003eWriting effective tools for agents\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/manage-tool-context\"\u003eManage tool context\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 64","answerStatus":"source"},{"query":"A mobile copilot sometimes takes 20 seconds end-to-end, though server-side model and MCP timing looks healthy. Tablets can go offline before uploading telemetry. What tracing setup locates the delay?","type":"multiple-choice","options":[{"text":"A survey that asks technicians each week how many seconds they waited for answers.","explanation":"A survey gives impressions and not measurements. It cannot divide the wait between the network, the gateway, the model, and the tools.","correct":false},{"text":"More detailed logs on the MCP servers, with a line for every internal function call.","explanation":"The MCP servers are already known to be healthy. More detail inside them adds nothing about the part of the path that has not been measured, between the tablet and the gateway.","correct":false},{"text":"One trace for each request that begins on the tablet, with tablet spans stored and sent later.","explanation":"The missing measurement is the part of the path that the servers cannot see. A trace that begins on the tablet and carries one identifier through every stage shows the time in each stage, including the network. Storing spans on the tablet until a connection is available means that data from poorly connected sites is not lost.","correct":true},{"text":"A second dashboard that shows the model's server-side response time for each hour of the day and each region.","explanation":"The model's response time is already measured at a median of 3 seconds. A second view of the same server-side figure does not explain a 20-second wait on the tablet.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eOne trace for each request that begins on the tablet, with tablet spans stored and sent later.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eServer-side metrics measure only what the servers can see. When a user's experience differs from the server's view, the difference lies in the part of the path that is \u003cstrong\u003enot instrumented\u003c/strong\u003e. Here that is the tablet and the mobile network. Instrumentation has to cover the whole path, from the client to the last service.\u003c/p\u003e\n\u003cp\u003eThe method is a \u003cstrong\u003edistributed trace\u003c/strong\u003e that begins at the client. The tablet starts a trace when the technician sends a request and passes the trace context in the request headers. The gateway, the model call, and each MCP tool call continue the same trace with their own spans. The result is a single timeline for one request: time on the device, time on the network before the gateway, time in the gateway, the model's time to first token and total time, and the time in each tool. For a fleet in the field, client spans must be \u003cstrong\u003estored on the device and sent when a connection is available\u003c/strong\u003e. If they are not, the sites with the worst connection, which are the sites of most interest, produce no data.\u003c/p\u003e\n\u003cp\u003eWith these traces, the question of where the 20 seconds go can be answered with data, and it can be grouped by site and by network type. See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/observability\"\u003eObservability with OpenTelemetry\u003c/a\u003e and \u003ca href=\"https://code.claude.com/docs/en/monitoring-usage\"\u003eMonitoring\u003c/a\u003e for the trace and event model that Claude's tooling exports.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 65","answerStatus":"source"},{"query":"An Agent SDK service loses resumable editor sessions whenever a deployment replaces its containers, because session transcripts are on local disk. How can any new container resume an existing session?","type":"multiple-choice","options":[{"text":"Deploy new software versions only once a quarter, so that sessions are lost less often.","explanation":"Fewer deployments reduce how often sessions are lost, but they do not remove the cause. Each deployment, and each container failure, would still destroy every session.","correct":false},{"text":"Persist session transcripts to external storage, and resume by session ID.","explanation":"The state of a session must outlast the container that created it. With transcripts written to a shared external store, a new container can load a session by its ID and continue. Deployments and container failures then have no effect on resumption.","correct":true},{"text":"Ask editors to copy the conversation and paste it into the first message of each new session.","explanation":"This gives editors a manual and error-prone task, and pasted text does not restore tool results or the structure of the session. The system should keep its own state.","correct":false},{"text":"Give each container a larger local disk so that more session transcripts can be stored on it.","explanation":"The disk is not full. It is discarded with the container at each deployment, and a larger disk would be discarded in the same manner.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003ePersist session transcripts to external storage, and resume by session ID.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eSessions in the Claude Agent SDK are stored as transcripts, by default on the local file system of the machine that runs the agent. Resuming a session by its ID restores the conversation: prompts, tool calls, tool results, and responses. This works well on a developer's machine. In an \u003cstrong\u003eephemeral environment\u003c/strong\u003e such as a container that is replaced at each deployment, the local disk is lost with the container, and the sessions are lost with it.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eDurable session persistence\u003c/strong\u003e separates the session from the compute. The SDK can persist sessions to external storage, so that transcripts are written to a shared store such as a database or an object store, in addition to local files. Any container can then resume any session by its ID. This is a requirement for long-running work in an environment where containers are replaced frequently.\u003c/p\u003e\n\u003cp\u003eOne limit applies: a session stores the \u003cem\u003econversation\u003c/em\u003e, not the \u003cem\u003efile system\u003c/em\u003e. The manuscript files in the working directory need their own durable storage, and file checkpoints are written to local disk and are not copied to the session store. See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/sessions\"\u003eWork with sessions\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/session-storage\"\u003ePersist sessions to external storage\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/hosting\"\u003eHosting the Agent SDK\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 66","answerStatus":"source"},{"query":"After accepting manuscript edits, an editor wants the files restored exactly to their state before that agent turn. Undoing from the model's memory failed. Which recovery mechanism should be used?","type":"multiple-choice","options":[{"text":"Resume an earlier session from before the edits, on the assumption that resuming also restores the files.","explanation":"Resuming a session restores the conversation and not the files in the working directory. The manuscript would stay in its edited state.","correct":false},{"text":"Ask the agent to reverse the edits a second time, with a more detailed description of each change.","explanation":"The agent would again reconstruct earlier text from what it remembers, which has already left the files in a mixed state. A more detailed request does not make the reconstruction exact.","correct":false},{"text":"Enable file checkpointing, and rewind the files to the checkpoint taken before the turn that applied the edits.","explanation":"File checkpointing records the state of files before the agent changes them. A rewind to the checkpoint for a given turn restores those files exactly. It is a mechanical operation and does not depend on the model reconstructing text from memory.","correct":true},{"text":"Start a new session, and ask the agent to rewrite chapter 12 in the style of the original.","explanation":"A rewrite in the style of the original produces new text. It is not the author's earlier text, and the editor asked for the files exactly as they were.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eEnable file checkpointing, and rewind the files to the checkpoint taken before the turn that applied the edits.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eTwo kinds of state exist when an agent edits files: the \u003cstrong\u003econversation\u003c/strong\u003e and the \u003cstrong\u003efile system\u003c/strong\u003e. They are stored separately. Sessions store the conversation, and the SDK documentation says directly that sessions do not snapshot the files. To snapshot and revert the changes that the agent made to files, the SDK provides \u003cstrong\u003efile checkpointing\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eWith file checkpointing enabled, the SDK saves the state of a file before the agent's editing tools change it, and it connects checkpoints to user messages in the conversation. The application can later call the rewind function with the identifier of a message, and the files return to their state at that point. This is exact and deterministic. Asking the model to \u0026quot;undo\u0026quot; is a new generation task in which the model tries to reproduce earlier text and can make mistakes.\u003c/p\u003e\n\u003cp\u003eThere are limits to know. Checkpoints cover changes made through the agent's file editing tools, not changes made by shell commands or by other programs. For important work, the working directory should also be under version control. See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/file-checkpointing\"\u003eRewind file changes with checkpointing\u003c/a\u003e and \u003ca href=\"https://code.claude.com/docs/en/checkpointing\"\u003eCheckpointing\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 67","answerStatus":"source"},{"query":"An editor wants to explore an alternate book ending with the agent's current context, while keeping the main session and manuscript unchanged. How should the experiment be isolated and reversible?","type":"multiple-choice","options":[{"text":"Continue in the main session, and ask the agent to remember which edits belong to the experiment.","explanation":"Experimental turns and edits would be mixed into the main conversation and the main files. Separating them later would depend on the agent's memory, which is not a reliable record.","correct":false},{"text":"Fork the main session into a new session, and run the fork on a separate copy of the manuscript files.","explanation":"A fork creates a new session with its own ID that starts from the full history of the original. The original session is not changed. The experiment therefore begins with everything that the agent knows. A separate working copy of the files keeps the experiment's edits away from the main manuscript.","correct":true},{"text":"Start a new session with no history, and give the agent a one-paragraph summary of the book so far.","explanation":"A new session with a short summary loses the detailed knowledge of characters and plot threads that the main session has built up. The editor wants the experiment to begin from that knowledge.","correct":false},{"text":"Copy the whole conversation into the system prompt of a new agent that is used only for the experiment.","explanation":"Pasting a long transcript into a system prompt does not reproduce the structure of the session, including its tool results, and it creates a very large prompt. The SDK has a function that is designed for this purpose.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eFork the main session into a new session, and run the fork on a separate copy of the manuscript files.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eExploring an alternative without losing the present state is a \u003cstrong\u003ebranching\u003c/strong\u003e problem, and it applies to both kinds of state. For the conversation, the Claude Agent SDK provides \u003cstrong\u003esession forking\u003c/strong\u003e. A fork creates a new session with a new ID that begins with a copy of the original's history. The two sessions then develop independently, and the original can be resumed later exactly as it was.\u003c/p\u003e\n\u003cp\u003eFor the files, the fork needs its own \u003cstrong\u003eworking copy\u003c/strong\u003e. A session stores the conversation and not the file system, so two sessions that point at the same directory would overwrite each other's edits. A copy of the manuscript directory, or a branch and a separate worktree if the manuscript is under version control, gives the experiment its own files. If the editor chooses the new ending, the changes can be merged. If she does not, the copy is discarded, and the main line has not been touched.\u003c/p\u003e\n\u003cp\u003eContinuing in the main session mixes the two lines of work, and a new session with a summary loses the knowledge that has been built up. See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/sessions\"\u003eWork with sessions\u003c/a\u003e and \u003ca href=\"https://code.claude.com/docs/en/worktrees\"\u003eRun parallel sessions with worktrees\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 68","answerStatus":"source"},{"query":"An editing agent forgets enduring decisions—British spelling, a character rename, and untouched dialect—after compaction and model upgrades. Where should these instructions persist?","type":"multiple-choice","options":[{"text":"In the conversation history only, because compaction is designed to keep the important points.","explanation":"Compaction produces a summary, and a summary can leave out details. After several rounds of compaction, the decisions have already been lost, as the agent's behavior shows.","correct":false},{"text":"In the model itself, because a model learns an editor's preferences after working with the editor for several weeks.","explanation":"A model does not learn from its conversations. Each request contains only what is sent with it, and a move to a newer model version makes this even clearer.","correct":false},{"text":"In a reminder that the editor types at the start of each working day.","explanation":"A daily reminder depends on the editor remembering every decision exactly. It moves the system's responsibility to the user, and it will fail when one decision is forgotten.","correct":false},{"text":"In a persistent project memory file that is loaded in every session.","explanation":"Lasting decisions belong in durable memory outside the conversation. A project instruction or memory file that the harness loads at the start of each session presents the decisions exactly, on every turn. It is not affected by compaction and does not depend on the model version.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eIn a persistent project memory file that is loaded in every session.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA long-running agent has several places in which information can be kept, and they differ in how long they last. The \u003cstrong\u003econversation history\u003c/strong\u003e lasts until compaction summarizes it, and a summary keeps the main points and not every detail. \u003cstrong\u003ePersistent memory\u003c/strong\u003e is a file or store outside the conversation that is loaded into the context on purpose. It lasts until someone changes it, and it does not depend on the model that reads it.\u003c/p\u003e\n\u003cp\u003eThe rule for memory architecture is to match the information to the store. Standing decisions and conventions such as spelling, names, and rules about what not to change must hold for weeks. They belong in persistent memory. In the Claude Agent SDK and Claude Code, a project memory file such as \u003ccode\u003eCLAUDE.md\u003c/code\u003e is loaded at the start of every session and is loaded again after compaction, so its content is always present in exact form. For decisions that the agent records as work proceeds, a notes file or the memory tool has the same function.\u003c/p\u003e\n\u003cp\u003eThis design also handles a \u003cstrong\u003echange of model version\u003c/strong\u003e. The new model reads the same file and applies the same decisions, with no reliance on anything that came from the earlier model's conversation. See \u003ca href=\"https://code.claude.com/docs/en/memory\"\u003eHow Claude remembers your project\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool\"\u003eMemory tool\u003c/a\u003e, and \u003ca href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\"\u003eEffective context engineering for AI agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 69","answerStatus":"source"},{"query":"Three teams have separately built Claude Messages API agent loops with inconsistent tool handling, retries, context management, and permissions. They also need local file and custom-tool access. What common agent harness should they adopt?","type":"multiple-choice","options":[{"text":"Adopt the Claude Agent SDK as the common harness, and share reusable components such as Skills, subagent definitions, and hooks.","explanation":"The SDK supplies the agent loop, tool execution, context management, sessions, and permissions as maintained infrastructure, so teams no longer write these parts. It runs in the organization's own containers with access to local files and supports custom tools. Shared Skills, subagent definitions, and hooks let teams reuse proven patterns.","correct":true},{"text":"Let each team keep its own loop, and write a shared document that describes good practice for agent loops.","explanation":"A document does not remove three implementations of the same infrastructure, each with its own defects. Each team would still have to maintain a loop.","correct":false},{"text":"Rewrite all three agents as a fixed sequence of prompts with no tools, in order to avoid the difficulty of agent loops.","explanation":"The agents need to read and edit files and to use the publishing database. A fixed sequence of prompts with no tools cannot do this work.","correct":false},{"text":"Have a central team write a fourth custom loop from the beginning, and require the three teams to adopt it.","explanation":"A fourth custom loop would repeat the same work and would probably meet the same kinds of defect in compaction, retries, and permissions. A maintained harness already provides these functions.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eAdopt the Claude Agent SDK as the common harness, and share reusable components such as Skills, subagent definitions, and hooks.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eChoosing an \u003cstrong\u003eagent harness\u003c/strong\u003e is a decision about build or adopt. A harness is the system around the model: the loop that calls the model and runs tools, context management, session storage, error handling, and permissions. These parts are harder than they appear, and three teams with three sets of defects in the same areas show that custom construction is not paying for itself.\u003c/p\u003e\n\u003cp\u003eThe requirements point to the \u003cstrong\u003eClaude Agent SDK\u003c/strong\u003e. It provides the tools, agent loop, and context management that Claude Code uses, as a library in Python and TypeScript. This includes automatic compaction, sessions, hooks, permissions, subagents, and support for custom tools and MCP servers. It runs inside the organization's own containers, so the agents can work directly with local manuscript files. Claude Managed Agents would be the alternative if the organization wanted Anthropic to host the loop and the sandbox. Raw Messages API loops remain suitable for simple, fixed workflows.\u003c/p\u003e\n\u003cp\u003eA standard also allows \u003cstrong\u003ereusable patterns\u003c/strong\u003e: Skills for procedures such as house style checks, shared subagent definitions, and hooks for policy. These are reviewed once and used by every team. See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/overview\"\u003eAgent SDK overview\u003c/a\u003e, \u003ca href=\"https://claude.com/resources/articles/building-agents-with-the-claude-agent-sdk\"\u003eBuilding agents with the Claude Agent SDK\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/overview\"\u003eClaude Managed Agents overview\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 70","answerStatus":"source"}];

    const CURRENT_KEY = "devPro06RevisedCurrentV1";
    const HISTORY_KEY = "devPro06RevisedHistoryV1";
    const EXAM_NAME = "Claude Developer Professional 06";

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function isCorrect(question) {
      return question.options.every(option => Boolean(option.selected) === Boolean(option.correct));
    }

    function correctCount(question) {
      return question.options.filter(option => option.correct).length;
    }

    function formatDuration(ms) {
      if (!Number.isFinite(ms) || ms < 0) return "0:00";
      const total = Math.floor(ms / 1000);
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    class ExamQuestion extends HTMLElement {
      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { question, index, total, graded, cheating } = this._state;
        const reveal = graded || cheating;
        const choose = correctCount(question);

        this.innerHTML = `
          <section class="card" aria-labelledby="question-title">
            <div class="card-header">
              <span>Question ${index + 1} of ${total}</span>
              <span>${question.viewed ? "Viewed" : "New"}</span>
            </div>
            <div class="card-body">
              <p class="query" id="question-title"></p>
              <p class="choose-note">Choose ${choose}</p>
              <div class="options"></div>
              ${reveal ? `<div class="answer-panel"><strong>Answer</strong><div class="answer-html"></div></div>` : ""}
            </div>
          </section>
        `;

        this.querySelector(".query").textContent = question.query;
        const options = this.querySelector(".options");

        question.options.forEach((option, optionIndex) => {
          const label = document.createElement("label");
          label.className = "option";
          if (reveal && option.correct) label.classList.add("reveal-correct");
          if (reveal && option.selected && !option.correct) label.classList.add("reveal-wrong-selected");

          const input = document.createElement("input");
          input.type = choose === 1 ? "radio" : "checkbox";
          if (choose === 1) input.name = `exam-q-${index}`;
          input.checked = Boolean(option.selected);
          input.disabled = Boolean(graded);
          input.addEventListener("change", () => {
            this.dispatchEvent(new CustomEvent("option-toggle", {
              bubbles: true,
              detail: { optionIndex }
            }));
          });

          const textWrap = document.createElement("span");
          const text = document.createElement("span");
          text.textContent = option.text;
          textWrap.appendChild(text);

          if (reveal && option.explanation) {
            const explanation = document.createElement("small");
            explanation.textContent = option.explanation;
            textWrap.appendChild(explanation);
          }

          label.append(input, textWrap);
          options.appendChild(label);
        });

        const answer = this.querySelector(".answer-html");
        if (answer) answer.innerHTML = question.answer || "";
      }
    }
    customElements.define("exam-question", ExamQuestion);

    class QuestionJumper extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { questions, current, graded, cheating } = this._state;
        const reveal = graded || cheating;

        this.innerHTML = `
          <section class="card">
            <div class="card-header collapsible-title" role="button" tabindex="0">
              <span>Question Jumper</span>
              <span class="chevron">${this.collapsed ? "▼" : "▲"}</span>
            </div>
            <div class="card-body jumper-body" ${this.collapsed ? 'hidden' : ''}>
              <div class="jumper-grid"></div>
            </div>
          </section>
        `;

        const title = this.querySelector(".collapsible-title");
        const toggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        title.addEventListener("click", toggle);
        title.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });

        const grid = this.querySelector(".jumper-grid");
        questions.forEach((question, index) => {
          const button = document.createElement("button");
          button.className = "jump-btn";
          button.textContent = String(index + 1);
          button.title = question.query;

          if (question.viewed) button.classList.add("viewed");
          if (index === current) button.classList.add("current");

          if (reveal) {
            button.classList.remove("viewed", "current");
            button.classList.add(isCorrect(question) ? "correct" : "incorrect");
            if (index === current) button.style.outline = "3px solid #111827";
          }

          button.addEventListener("click", () => {
            this.dispatchEvent(new CustomEvent("jump", {
              bubbles: true,
              detail: { index }
            }));
          });
          grid.appendChild(button);
        });
      }
    }
    customElements.define("question-jumper", QuestionJumper);

    class ExamHistoryPanel extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        const history = this._state?.history || { exams: [] };
        const exams = Array.isArray(history.exams) ? history.exams : [];

        this.innerHTML = `
          <section class="card">
            <div class="card-header">
              <span class="collapsible-title" role="button" tabindex="0">Exam History</span>
              <div class="control-group">
                <button class="btn-secondary toggle-history">${this.collapsed ? "Show" : "Hide"}</button>
                <button class="btn-danger clear-history" ${exams.length ? "" : "disabled"}>Clear History</button>
              </div>
            </div>
            <div class="card-body history-body" ${this.collapsed ? "hidden" : ""}></div>
          </section>
        `;

        const doToggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        this.querySelector(".toggle-history").addEventListener("click", doToggle);
        this.querySelector(".collapsible-title").addEventListener("click", doToggle);
        this.querySelector(".clear-history").addEventListener("click", () => {
          this.dispatchEvent(new CustomEvent("history-clear", { bubbles: true }));
        });

        const body = this.querySelector(".history-body");
        if (!exams.length) {
          body.innerHTML = `<p class="history-empty">No completed exams are stored on this device.</p>`;
          return;
        }

        [...exams].reverse().forEach((exam, reverseIndex) => {
          const questions = Array.isArray(exam.questions) ? exam.questions : [];
          const score = questions.filter(isCorrect).length;
          const number = exams.length - reverseIndex;
          const finish = Number(exam.finish || exam.completedAt || 0);
          const start = Number(exam.start || 0);
          const stamp = finish ? new Date(finish).toLocaleString() : "Completed exam";
          const duration = finish && start ? formatDuration(finish - start) : "";

          const wrap = document.createElement("div");
          wrap.className = "history-exam";

          const summary = document.createElement("div");
          summary.className = "history-summary";
          summary.innerHTML = `<strong>Attempt ${number}: ${score} / ${questions.length}</strong><span>${stamp}${duration ? ` · ${duration}` : ""}</span>`;
          wrap.appendChild(summary);

          const dots = document.createElement("div");
          dots.className = "history-dots";
          questions.forEach((question, i) => {
            const dot = document.createElement("span");
            dot.className = "history-dot" + (isCorrect(question) ? " correct" : "");
            dot.textContent = String(i + 1);
            dot.title = question.query;
            dots.appendChild(dot);
          });
          wrap.appendChild(dots);
          body.appendChild(wrap);
        });
      }
    }
    customElements.define("exam-history-panel", ExamHistoryPanel);

    class ScrumExamApp extends HTMLElement {
      constructor() {
        super();
        this.state = null;
        this.timerHandle = null;
      }

      connectedCallback() {
        this.load();
        this.addEventListener("option-toggle", e => this.toggleOption(e.detail.optionIndex));
        this.addEventListener("jump", e => this.setCurrentQuestion(e.detail.index));
        this.addEventListener("history-clear", () => this.clearHistory());
        this.render();
        this.timerHandle = setInterval(() => this.updateTimer(), 1000);
      }

      disconnectedCallback() {
        clearInterval(this.timerHandle);
      }

      load() {
        let saved = null;
        try {
          saved = JSON.parse(localStorage.getItem(CURRENT_KEY));
        } catch (_) {}

        if (saved && Array.isArray(saved.questions) && saved.questions.length === QUESTION_BANK.length && !saved.graded) {
          this.state = saved;
        } else {
          const questions = clone(QUESTION_BANK).map(q => ({
            ...q,
            viewed: false,
            options: q.options.map(o => ({ ...o, selected: false }))
          }));
          questions[0].viewed = true;
          this.state = {
            name: EXAM_NAME,
            graded: false,
            start: Date.now(),
            finish: 0,
            questions,
            currentQuestionNumber: 0,
            cheating: new URLSearchParams(location.search).get("page") === "answer"
          };
          this.saveCurrent();
        }
      }

      saveCurrent() {
        if (!this.state.graded) {
          localStorage.setItem(CURRENT_KEY, JSON.stringify(this.state));
        }
      }

      getHistory() {
        try {
          const existing = JSON.parse(localStorage.getItem(HISTORY_KEY));
          if (existing && Array.isArray(existing.exams)) return existing;
        } catch (_) {}
        const history = { name: "Exam History", exams: [] };
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        return history;
      }

      clearHistory() {
        localStorage.setItem(HISTORY_KEY, JSON.stringify({ name: "Exam History", exams: [] }));
        this.render();
      }

      toggleOption(optionIndex) {
        if (this.state.graded) return;
        const q = this.state.questions[this.state.currentQuestionNumber];
        const oneAnswer = correctCount(q) === 1;
        if (oneAnswer) {
          q.options.forEach((option, i) => { option.selected = i === optionIndex; });
        } else {
          q.options[optionIndex].selected = !q.options[optionIndex].selected;
        }
        q.viewed = true;
        this.saveCurrent();
        this.render();
      }

      setCurrentQuestion(index) {
        const next = Math.max(0, Math.min(index, this.state.questions.length - 1));
        this.state.currentQuestionNumber = next;
        this.state.questions[next].viewed = true;
        this.saveCurrent();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      toggleCheat() {
        this.state.cheating = !this.state.cheating;
        this.saveCurrent();
        this.render();
      }

      grade() {
        if (this.state.graded) return;
        this.state.graded = true;
        this.state.cheating = true;
        this.state.finish = Date.now();

        const history = this.getHistory();
        history.exams.push(clone(this.state));
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        localStorage.removeItem(CURRENT_KEY);
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      restart() {
        localStorage.removeItem(CURRENT_KEY);
        this.load();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      score() {
        return this.state.questions.filter(isCorrect).length;
      }

      answeredCount() {
        return this.state.questions.filter(q => q.options.some(o => o.selected)).length;
      }

      updateTimer() {
        const el = this.querySelector("[data-timer]");
        if (!el || !this.state) return;
        const end = this.state.finish || Date.now();
        el.textContent = formatDuration(end - this.state.start);
      }

      render() {
        if (!this.state) return;
        const qIndex = this.state.currentQuestionNumber;
        const total = this.state.questions.length;
        const answered = this.answeredCount();
        const score = this.score();

        this.innerHTML = `
          <main class="page-shell">
            <header class="hero">
              <div class="hero-top">
                <div>
                  <h1>Claude Developer Professional | Exam 06</h1>
                  <p>70 concise exam questions · standalone and offline · answer explanations included</p>
                </div>
                <div class="pill">Elapsed <span data-timer>${formatDuration((this.state.finish || Date.now()) - this.state.start)}</span></div>
              </div>
              <div class="meta-row">
                <span class="pill">${total} questions</span>
                <span class="pill">${answered} answered</span>
                <span class="pill">${this.state.questions.filter(q => q.viewed).length} viewed</span>
                ${this.state.graded ? `<span class="pill">Score ${score} / ${total}</span>` : ""}
              </div>
            </header>

            ${this.state.graded ? `
              <section class="card results">
                <div class="card-body">
                  <strong>Your grade is ${score} out of ${total}.</strong>
                  <div class="status-line">Correct answers and option explanations are now visible. Your completed attempt has been saved to local storage.</div>
                </div>
              </section>
            ` : ""}

            <div class="controls controls-top" role="navigation" aria-label="Exam controls">
              <div class="control-group">
                <button class="btn-secondary previous" ${qIndex === 0 ? "disabled" : ""}>&larr; Back</button>
                <button class="btn-primary next" ${qIndex === total - 1 ? "disabled" : ""}>Next &rarr;</button>
                <button class="btn-warning cheat">${this.state.cheating ? "Hide Answers" : "Cheat"}</button>
              </div>
              <div class="control-group">
                ${this.state.graded
                  ? `<button class="btn-primary restart">Start New Attempt</button>`
                  : `<button class="btn-success finish">Finish &amp; Grade</button>`}
              </div>
            </div>

            <exam-question></exam-question>

            <question-jumper></question-jumper>
            <exam-history-panel></exam-history-panel>

            <p class="footer-note">Progress and completed attempts are stored only in this browser's localStorage.</p>
          </main>
        `;

        const questionEl = this.querySelector("exam-question");
        questionEl.state = {
          question: this.state.questions[qIndex],
          index: qIndex,
          total,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const jumper = this.querySelector("question-jumper");
        jumper.state = {
          questions: this.state.questions,
          current: qIndex,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const history = this.querySelector("exam-history-panel");
        history.state = { history: this.getHistory() };

        this.querySelector(".previous").addEventListener("click", () => this.setCurrentQuestion(qIndex - 1));
        this.querySelector(".next").addEventListener("click", () => this.setCurrentQuestion(qIndex + 1));
        this.querySelector(".cheat").addEventListener("click", () => this.toggleCheat());

        const finish = this.querySelector(".finish");
        if (finish) finish.addEventListener("click", () => this.grade());

        const restart = this.querySelector(".restart");
        if (restart) restart.addEventListener("click", () => this.restart());
      }
    }
    customElements.define("scrum-exam-app", ScrumExamApp);
  </script>
</body>
