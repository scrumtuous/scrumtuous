<!DOCTYPE html>
<!-- index.html: Player interface for joining, answering, and following the live Fight Quiz multiplayer game. -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fight Quiz | On a long enough timeline, the survival rate for every quiz drops to zero</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet" />
  <style>
    :root {
      --night: #0f0b16;
      --plum-dark: #21142b;
      --plum-mid: #3a2148;
      --rose: #d392b2;
      --lavender: #c8afd9;
      --pink: #f7dde9;
      --silver: #d2d5e0;
      --danger: #ff6b88;
      --ok: #56d79f;
      --warn: #ff9d74;
      --card: rgba(29, 18, 38, 0.82);
      --shadow: 0 18px 40px rgba(0, 0, 0, 0.42);
      --radius: 20px;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--pink);
      font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background:
        radial-gradient(circle at 15% 10%, rgba(211, 146, 178, 0.28), transparent 28%),
        radial-gradient(circle at 82% 24%, rgba(200, 175, 217, 0.23), transparent 30%),
        radial-gradient(circle at 50% 78%, rgba(211, 146, 178, 0.15), transparent 36%),
        linear-gradient(165deg, var(--night), var(--plum-dark) 44%, var(--plum-mid));
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("fight-landing-bg.svg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
    }

    .shell {
      max-width: 980px;
      margin: 0 auto;
      padding: 0.9rem;
      position: relative;
      z-index: 1;
    }

    .title-font {
      font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 800;
      letter-spacing: 0;
    }

    .glass {
      background: var(--card);
      border: 1px solid rgba(247, 221, 233, 0.24);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }

    .small-note { color: rgba(247, 221, 233, 0.82); }

    .landing-card {
      position: relative;
      overflow: hidden;
    }

    .landing-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("fight-landing-bg.svg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      opacity: 0.08;
      filter: contrast(0.95);
      pointer-events: none;
      z-index: 0;
    }

    .join-landing::before {
      background-image:
        linear-gradient(rgba(58, 33, 72, 0.85), rgba(58, 33, 72, 0.85)),
        url("fight-landing-bg.svg");
      background-repeat: no-repeat;
      background-position: center;
      background-size: cover;
      background-blend-mode: multiply;
      opacity: 0.35;
    }

    .landing-card > * {
      position: relative;
      z-index: 1;
    }

    .conn-badge {
      border-radius: 999px;
      border: 1px solid rgba(210, 213, 224, 0.3);
      padding: 0.3rem 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
    }

    .socket-control {
      position: relative;
      display: inline-flex;
    }

    .socket-pill-btn {
      border-radius: 999px;
      border: 1px solid rgba(210, 213, 224, 0.3);
      padding: 0.3rem 0.7rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.85rem;
      background: rgba(0, 0, 0, 0.16);
      color: var(--pink);
      cursor: pointer;
    }

    .socket-pill-btn:hover,
    .socket-pill-btn:focus-visible {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }

    .socket-menu {
      position: absolute;
      top: calc(100% + 0.45rem);
      right: 0;
      width: min(94vw, 420px);
      z-index: 80;
      border-radius: 14px;
      border: 1px solid rgba(247, 221, 233, 0.28);
      background: rgba(24, 15, 32, 0.96);
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.45);
      padding: 0.7rem;
    }

    .socket-row {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 0.5rem;
      border: 1px solid rgba(247, 221, 233, 0.15);
      border-radius: 10px;
      padding: 0.45rem 0.55rem;
      margin-bottom: 0.42rem;
      background: rgba(255, 255, 255, 0.02);
    }

    .socket-health-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #7b7b7b;
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
      flex-shrink: 0;
    }

    .socket-health-dot.ok {
      background: var(--ok);
      box-shadow: 0 0 10px rgba(86, 215, 159, 0.62);
    }

    .socket-health-dot.fail {
      background: var(--danger);
      box-shadow: 0 0 10px rgba(255, 107, 136, 0.62);
    }

    .socket-health-dot.testing {
      background: var(--warn);
      box-shadow: 0 0 10px rgba(255, 157, 116, 0.62);
    }

    .socket-label {
      font-weight: 700;
      font-size: 0.86rem;
      color: #ffe7f1;
      display: block;
      line-height: 1.2;
    }

    .socket-url {
      font-size: 0.73rem;
      color: rgba(247, 221, 233, 0.8);
      word-break: break-all;
      display: block;
      line-height: 1.25;
      margin-top: 0.1rem;
    }

    .new-fight-pill {
      border-radius: 999px;
      border: 1px solid rgba(247, 221, 233, 0.4);
      background: rgba(60, 36, 79, 0.7);
      color: #ffe7f0;
      font-weight: 700;
      padding: 0.28rem 0.75rem;
      font-size: 0.84rem;
      line-height: 1.2;
    }

    .new-fight-pill:hover,
    .new-fight-pill:focus-visible {
      color: #fff;
      border-color: rgba(247, 221, 233, 0.6);
      background: rgba(93, 56, 122, 0.8);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #888;
    }

    .dot.connected { background: var(--ok); box-shadow: 0 0 12px rgba(86, 215, 159, 0.65); }
    .dot.reconnecting { background: var(--warn); box-shadow: 0 0 12px rgba(255, 157, 116, 0.65); }
    .dot.disconnected { background: var(--danger); box-shadow: 0 0 12px rgba(255, 107, 136, 0.65); }

    .moon-btn {
      border-radius: 14px;
      border: 1px solid rgba(247, 221, 233, 0.35);
      color: var(--pink);
      background: linear-gradient(140deg, rgba(163, 96, 132, 0.45), rgba(92, 61, 124, 0.42));
      font-weight: 800;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    .moon-btn:hover,
    .moon-btn:focus-visible {
      color: #fff;
      transform: translateY(-1px);
      box-shadow: 0 9px 20px rgba(211, 146, 178, 0.33);
    }

    .moon-btn:disabled {
      opacity: 0.5;
      transform: none;
      box-shadow: none;
    }

    .outline-moon {
      border-radius: 14px;
      border: 1px solid rgba(247, 221, 233, 0.35);
      color: var(--pink);
      background: transparent;
      font-weight: 700;
    }

    .join-input,
    .join-input:focus {
      border-radius: 12px;
      background: rgba(8, 6, 12, 0.65);
      color: #fff;
      border-color: rgba(247, 221, 233, 0.35);
      box-shadow: 0 0 0 0.12rem rgba(211, 146, 178, 0.2);
    }

    .score-box {
      border-radius: 14px;
      border: 1px solid rgba(247, 221, 233, 0.3);
      background: rgba(0, 0, 0, 0.36);
      padding: 0.7rem;
      text-align: center;
    }

    .question-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 0.6rem;
      flex-wrap: wrap;
      margin-bottom: 0.6rem;
    }

    .question-status-lane {
      display: grid;
      gap: 0.45rem;
      grid-template-columns: repeat(2, minmax(92px, 1fr));
      width: 100%;
    }

    @media (min-width: 820px) {
      .question-status-lane {
        width: auto;
        grid-template-columns: repeat(5, minmax(92px, 108px));
      }
    }

    .status-tile {
      border-radius: 14px;
      border: 1px solid rgba(247, 221, 233, 0.3);
      background: rgba(0, 0, 0, 0.36);
      min-height: 84px;
      padding: 0.55rem 0.45rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.22rem;
      text-align: center;
    }

    .status-tile .label {
      font-size: 0.68rem;
      color: rgba(247, 221, 233, 0.78);
      line-height: 1.2;
    }

    .status-tile .status-icon {
      font-size: 1.25rem;
      line-height: 1;
      color: rgba(247, 221, 233, 0.88);
    }

    .status-tile.is-on {
      border-color: rgba(255, 224, 144, 0.6);
      background: rgba(98, 65, 21, 0.3);
    }

    .status-tile.is-on .status-icon {
      color: #ffe4a3;
    }

    .status-tile.is-shield.is-on {
      border-color: rgba(145, 240, 211, 0.58);
      background: rgba(25, 95, 73, 0.31);
    }

    .status-tile.is-shield.is-on .status-icon {
      color: #cffff0;
    }

    .status-tile.is-attack.is-on {
      border-color: rgba(255, 141, 160, 0.62);
      background: rgba(112, 44, 66, 0.34);
    }

    .status-tile.is-attack.is-on .status-icon {
      color: #ffd4dd;
    }

    .status-tile.question-action-tile {
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
      font: inherit;
      color: inherit;
    }

    .status-tile.question-action-tile:hover:not(:disabled),
    .status-tile.question-action-tile:focus-visible:not(:disabled) {
      border-color: rgba(255, 224, 144, 0.75);
      background: rgba(98, 65, 21, 0.36);
      color: #fff;
      transform: translateY(-1px);
    }

    .status-tile.question-action-tile:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }

    .status-tile.is-fifty.is-on {
      border-color: rgba(255, 224, 144, 0.7);
      background: rgba(98, 65, 21, 0.34);
    }

    .timer {
      font-family: "Poppins", "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 700;
      font-size: clamp(2.1rem, 7vw, 3.5rem);
      text-align: center;
      line-height: 1;
      border: 1px solid rgba(247, 221, 233, 0.45);
      border-radius: 16px;
      background: rgba(0, 0, 0, 0.42);
      padding: 0.45rem 0.9rem;
      min-width: 180px;
      margin: 0 auto;
      animation: pulse-soft 1300ms ease-in-out infinite;
    }

    .timer.warn {
      border-color: rgba(255, 157, 116, 0.6);
      color: #ffd4c2;
    }

    .timer.danger {
      border-color: rgba(255, 107, 136, 0.75);
      color: #ffdbe5;
      animation: pulse-hot 760ms ease-in-out infinite;
    }

    @keyframes pulse-soft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    @keyframes pulse-hot {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(1, minmax(0, 1fr));
      gap: 0.7rem;
    }

    @media (min-width: 768px) {
      .options-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    .ans-btn {
      text-align: left;
      border: none;
      border-radius: 16px;
      min-height: 88px;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      width: 100%;
      padding: 0.8rem;
      font-weight: 700;
      transition: transform 130ms ease, box-shadow 130ms ease, filter 130ms ease;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .ans-btn .letter {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.7);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.18);
      font-size: 1.15rem;
      flex-shrink: 0;
    }

    .ans-btn:hover,
    .ans-btn:focus-visible {
      transform: translateY(-1px) scale(1.01);
      filter: brightness(1.06);
    }

    .ans-btn.selected {
      outline: 3px solid rgba(247, 221, 233, 0.88);
      box-shadow: 0 0 0 4px rgba(247, 221, 233, 0.22), 0 14px 28px rgba(0, 0, 0, 0.45);
      animation: select-glow 680ms ease;
    }

    .ans-btn.locked {
      opacity: 0.64;
      transform: none;
      filter: grayscale(0.12);
    }

    .ans-btn.fifty-fifty-removed {
      opacity: 0.42;
      filter: grayscale(0.9) brightness(0.82);
      box-shadow: none;
      cursor: not-allowed;
    }

    .ans-btn.fifty-fifty-removed:hover,
    .ans-btn.fifty-fifty-removed:focus-visible {
      transform: none;
      filter: grayscale(0.9) brightness(0.82);
    }

    .ans-btn.reveal-wrong {
      background: linear-gradient(145deg, #54545d, #3f3f46) !important;
      filter: grayscale(0.25);
      opacity: 0.66;
    }

    .ans-btn.reveal-correct {
      border: 2px solid rgba(255, 246, 194, 0.95);
      box-shadow: 0 0 0 4px rgba(255, 235, 150, 0.2), 0 0 30px rgba(255, 214, 122, 0.55);
      animation: correct-throb 950ms ease-in-out infinite;
      position: relative;
      overflow: hidden;
    }

    .ans-btn.reveal-correct:hover,
    .ans-btn.reveal-correct:focus-visible {
      transform: scale(1.03) rotate(-0.4deg);
      filter: brightness(1.12) saturate(1.15);
      box-shadow: 0 0 0 6px rgba(255, 232, 144, 0.24), 0 0 40px rgba(255, 214, 122, 0.8);
    }

    @keyframes correct-throb {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.018); }
    }

    .answer-reveal-blast {
      animation: reveal-blast 700ms cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes reveal-blast {
      0% { transform: scale(0.94); opacity: 0; }
      60% { transform: scale(1.02); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }

    .confetti-wrap {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 14px;
      opacity: 0.95;
      animation: confetti-fall 900ms ease-out forwards;
      border-radius: 2px;
    }

    @keyframes confetti-fall {
      from { transform: translateY(-8px) rotate(0deg); opacity: 1; }
      to { transform: translateY(88px) rotate(320deg); opacity: 0; }
    }

    .double-down-banner {
      border-radius: 12px;
      border: 1px solid rgba(255, 194, 145, 0.8);
      background: rgba(130, 73, 37, 0.28);
      color: #ffe8c5;
      font-weight: 800;
      padding: 0.58rem 0.72rem;
      margin-bottom: 0.8rem;
      animation: danger-throb 920ms ease-in-out infinite;
    }

    @keyframes danger-throb {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 194, 145, 0.28); }
      50% { box-shadow: 0 0 0 8px rgba(255, 194, 145, 0); }
    }

    .double-down-note {
      border-radius: 10px;
      border: 1px solid rgba(247, 221, 233, 0.22);
      background: rgba(0, 0, 0, 0.26);
      color: rgba(247, 221, 233, 0.9);
      padding: 0.55rem 0.65rem;
      font-size: 0.9rem;
      line-height: 1.3;
      text-align: center;
    }

    .double-down-note.warn {
      border-color: rgba(255, 194, 145, 0.62);
      color: #ffe2c5;
      background: rgba(123, 63, 32, 0.28);
    }

    .double-down-note.ok {
      border-color: rgba(130, 235, 186, 0.52);
      color: #d9ffed;
      background: rgba(30, 96, 71, 0.26);
    }

    .double-down-note.bad {
      border-color: rgba(255, 132, 158, 0.58);
      color: #ffdce7;
      background: rgba(114, 41, 61, 0.32);
    }

    .streak-prize {
      border-radius: 16px;
      border: 2px solid rgba(255, 231, 142, 0.92);
      background: linear-gradient(145deg, rgba(120, 74, 20, 0.38), rgba(98, 45, 26, 0.45));
      box-shadow: 0 0 0 2px rgba(255, 214, 102, 0.2), 0 0 34px rgba(255, 204, 97, 0.35);
      padding: 0.85rem;
      margin-bottom: 0.9rem;
      animation: prize-pop 680ms ease;
    }

    .streak-prize-title {
      font-weight: 800;
      letter-spacing: 0.03em;
      color: #ffeab7;
      font-size: 1.12rem;
    }

    .streak-prize-note {
      color: #fff0d4;
      font-size: 0.92rem;
    }

    @keyframes prize-pop {
      0% { transform: scale(0.96); opacity: 0.3; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes select-glow {
      0% { box-shadow: 0 0 0 0 rgba(247, 221, 233, 0.45); }
      100% { box-shadow: 0 0 0 9px rgba(247, 221, 233, 0); }
    }

    .c-red { background: linear-gradient(145deg, #cc384f, #a12545); }
    .c-green { background: linear-gradient(145deg, #2aa467, #1f8450); }
    .c-blue { background: linear-gradient(145deg, #3377e2, #2b52b9); }
    .c-purple { background: linear-gradient(145deg, #8451cf, #6943af); }
    .c-orange { background: linear-gradient(145deg, #ea7f2b, #ca5e18); }
    .c-pink { background: linear-gradient(145deg, #d14b8d, #a53672); }

    .lock-state {
      border-radius: 12px;
      border: 1px solid rgba(86, 215, 159, 0.5);
      background: rgba(36, 99, 72, 0.2);
      padding: 0.65rem;
      font-weight: 700;
      animation: pop-msg 280ms ease;
    }

    @keyframes pop-msg {
      from { opacity: 0; transform: translateY(6px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .shake {
      animation: wrong-shake 420ms ease;
    }

    @keyframes wrong-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      50% { transform: translateX(7px); }
      75% { transform: translateX(-4px); }
    }

    .celebrate {
      animation: win-pop 520ms ease;
    }

    @keyframes win-pop {
      0% { transform: scale(0.95); opacity: 0.5; }
      100% { transform: scale(1); opacity: 1; }
    }

    .rank-row {
      border-radius: 12px;
      border: 1px solid rgba(247, 221, 233, 0.2);
      background: rgba(47, 30, 60, 0.75);
      padding: 0.58rem 0.72rem;
      margin-bottom: 0.45rem;
      animation: rise 280ms ease both;
    }

    .sort-btn {
      border: 1px solid rgba(247, 221, 233, 0.35);
      border-radius: 10px;
      background: rgba(85, 54, 108, 0.55);
      color: var(--pink);
      padding: 0.2rem 0.55rem;
      font-size: 0.8rem;
      font-weight: 700;
    }

    .sort-btn:hover,
    .sort-btn:focus-visible {
      background: rgba(132, 83, 168, 0.6);
      color: #fff;
    }

    .stats-table-wrap {
      border: 1px solid rgba(247, 221, 233, 0.2);
      border-radius: 12px;
      overflow: hidden;
      background: rgba(10, 7, 14, 0.45);
    }

    .stats-table {
      margin-bottom: 0;
      color: var(--pink);
    }

    .final-results-view .stats-table,
    .final-results-view .stats-table th,
    .final-results-view .stats-table td,
    .final-results-view .podium-card,
    .final-results-view .score-box,
    .final-results-view .glass,
    .final-results-view .small-note,
    .final-results-view .fw-bold,
    .final-results-view .stats-empty,
    .final-results-view .final-action-summary {
      color: #d6d8e2;
    }

    .final-results-view .stats-table th {
      color: #e1e4ef;
    }

    .final-results-view .podium-card,
    .final-results-view .stats-table-wrap,
    .final-results-view .stats-empty,
    .final-results-view .final-action-summary {
      border-color: rgba(214, 216, 226, 0.24);
    }

    .final-results-view .sort-btn {
      color: #d6d8e2;
      border-color: rgba(214, 216, 226, 0.36);
      background: rgba(55, 45, 72, 0.62);
    }

    .final-results-view .sort-btn:hover,
    .final-results-view .sort-btn:focus-visible {
      color: #f2f4fb;
    }

    .stats-table th,
    .stats-table td {
      background: transparent !important;
      border-color: rgba(247, 221, 233, 0.18) !important;
      vertical-align: middle;
      white-space: nowrap;
    }

    .stats-table th {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--lavender);
    }

    .stats-empty {
      border: 1px dashed rgba(247, 221, 233, 0.24);
      border-radius: 12px;
      padding: 0.75rem;
      color: rgba(247, 221, 233, 0.75);
    }

    .podium {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.65rem;
    }

    .podium-card {
      border-radius: 12px;
      text-align: center;

      function formatScore(v) { return Number(v || 0).toLocaleString(); }
      function formatTime(ms) {
        const safe = Math.max(0, ms);
        const sec = Math.floor(safe / 1000);
        const mm = String(Math.floor(sec / 60)).padStart(2, "0");
        const ss = String(sec % 60).padStart(2, "0");
        return mm + ":" + ss;

      function formatMs(ms) {
        if (ms == null || !isFinite(ms)) return "-";
        return Math.round(ms) + " ms";
      }
      function normalizeNames(value) {
        if (!Array.isArray(value)) return [];
        const seen = new Set();
        const out = [];
        value.forEach((item) => {
          const txt = sanitizeName(item);
          if (!txt) return;
          const key = txt.toLowerCase();
          if (seen.has(key)) return;
          seen.add(key);
          out.push(txt);
        });

      function sanitizeName(name) {
        return String(name || "").trim().replace(/\s+/g, " ").slice(0, 30);

        return /^wss?:\/\/.+/i.test(normalizeSocketUrl(value));

      function dedupeByUrl(items) {
        const seen = new Set();
        const out = [];
        items.forEach((item) => {
          const url = String(item && item.url ? item.url : "");
          if (!url || seen.has(url)) return;
          seen.add(url);
          out.push(item);
        });
        return out;
      }

      function probeSocketUrl(url, timeoutMs) {
        const target = normalizeSocketUrl(url);
        if (!isValidSocketUrl(target)) return Promise.resolve(false);
        return new Promise((resolve) => {
          let settled = false;
          let ws;
          const finish = (ok) => {
            if (settled) return;
            settled = true;
            clearTimeout(timer);
            try {
              if (ws && ws.readyState === WebSocket.OPEN) ws.close();
            } catch (err) {
              // ignore close failures in probe mode
            }
            resolve(!!ok);
          };
          const timer = setTimeout(() => finish(false), timeoutMs || 2200);
          try {
            ws = new WebSocket(target);
          } catch (err) {
            finish(false);
            return;
          }
          ws.onopen = () => finish(true);
          ws.onerror = () => finish(false);
          ws.onclose = () => finish(false);
        });
      }

      const STUDENT_PHASE_VIDEOS = {

      class LocalStore {
        static readJson(key, fallback) {
          try {
            const raw = localStorage.getItem(key);
            if (!raw) return fallback;
            return JSON.parse(raw);
          } catch (err) {

      class SocketManager {
        constructor(onMessage, onState, getSocketCandidates, onConnectedUrl) {
          this.onMessage = onMessage;
          this.onState = onState;
          this.getSocketCandidates = getSocketCandidates;
          this.onConnectedUrl = onConnectedUrl;
          this.ws = null;
          this.retries = 0;
          this.manual = false;
          this.seen = new Map();
          this.status = "disconnected";
          this.activeUrl = "";
        }

        connect() {
          this.manual = false;
          this._open();
          if (!this.pruneTimer) {
            this.pruneTimer = setInterval(() => this.pruneSeen(), 9000);
          }
        }

        _open() {
          this.onState("connecting");
          const candidates = dedupeByUrl(typeof this.getSocketCandidates === "function" ? this.getSocketCandidates() : []);
          if (!candidates.length) {
            this.scheduleReconnect();
            return;
          }

          const tryCandidate = (idx) => {
            if (this.manual) return;
            if (idx >= candidates.length) {
              this.scheduleReconnect();
              return;
            }

            const target = candidates[idx];
            let probeWs = null;
            let settled = false;
            const fail = () => {
              if (settled) return;
              settled = true;
              clearTimeout(openTimer);
              try {
                if (probeWs) probeWs.close();
              } catch (err) {
                // ignore close failures while rotating fallbacks
              }
              tryCandidate(idx + 1);
            };

            let openTimer = null;
            try {
              probeWs = new WebSocket(target.url);
            } catch (err) {
              tryCandidate(idx + 1);
              return;
            }

            openTimer = setTimeout(() => fail(), 3200);

            probeWs.onopen = () => {
              if (settled || this.manual) {
                try {
                  probeWs.close();
                } catch (err) {
                  // ignore
                }
                return;
              }
              settled = true;
              clearTimeout(openTimer);
              this.ws = probeWs;
              this.activeUrl = target.url;
              this.retries = 0;
              if (typeof this.onConnectedUrl === "function") this.onConnectedUrl(target);
              this.onState("connected");

              this.ws.onclose = () => {
                if (this.manual) {
                  this.onState("disconnected");
                  return;
                }
                this.scheduleReconnect();
              };
              this.ws.onerror = () => {
                this.onState("reconnecting");
              };
              this.ws.onmessage = (evt) => {
                const msg = this.parse(evt.data);
                if (!msg) return;
                if (!this.validate(msg)) return;
                if (this.isDup(msg.messageId)) return;
                this.onMessage(msg);
              };
            };

            probeWs.onerror = () => fail();
            probeWs.onclose = () => fail();
          };

          tryCandidate(0);
        }

        scheduleReconnect() {
          this.onState("reconnecting");
          const delay = Math.min(10000, 900 * Math.pow(1.6, this.retries));
          this.retries += 1;
          setTimeout(() => {
            if (!this.manual) this._open();
          }, delay);
        }

        close() {
          this.manual = true;
          if (this.pruneTimer) clearInterval(this.pruneTimer);
          this.activeUrl = "";
          if (this.ws) this.ws.close();
        }

        send(message) {
          if (!this.ws || this.ws.readyState !== WebSocket.OPEN) return false;
          this.ws.send(JSON.stringify(message));
          return true;
        }

        parse(raw) {
          try { return JSON.parse(raw); } catch (err) { return null; }
        }

        validate(msg) {
          return !!(msg && typeof msg.type === "string" && typeof msg.messageId === "string" && typeof msg.gameId === "string" && typeof msg.senderRole === "string");
        }

        isDup(id) {
          if (!id) return false;
          if (this.seen.has(id)) return true;
          this.seen.set(id, nowTs());
          if (this.seen.size > 1500) this.pruneSeen(true);
          return false;
        }

        pruneSeen(force) {
          const cutoff = nowTs() - 8 * 60 * 1000;
          for (const [k, v] of this.seen.entries()) {
            if (force || v < cutoff) this.seen.delete(k);
          }
        }
      }

        renderQuestion(model, handlers) {
          this.app.innerHTML = "";
          const q = model.question;
          const rem = Math.max(0, q.endsAt - nowTs());
          const questionOpen = rem > 0;
          const timerClass = rem <= 10000 ? "danger" : rem <= 30000 ? "warn" : "";
          const fiftyFiftyUsed = Number(model.fiftyFiftyQuestionIndex) === Number(q.questionIndex) && Array.isArray(model.fiftyFiftyRemovedOptionIds) && model.fiftyFiftyRemovedOptionIds.length >= 2;
          const fiftyFiftyDisabled = !!model.hasSubmitted || !questionOpen || fiftyFiftyUsed || Number(model.playerScore || 0) < FIFTY_FIFTY_COST || !!this.fiftyFiftyInFlight;
          const removedOptionIds = new Set(Array.isArray(model.fiftyFiftyRemovedOptionIds) ? model.fiftyFiftyRemovedOptionIds.map(String) : []);
          const power = q.powerInPlay || {};
          const strikeCount = Math.max(0, Number(power.strikeCount || 0));
          const shieldCount = Math.max(0, Number(power.shieldCount || 0));
          const reflectiveShieldCount = Math.max(0, Number(power.reflectiveShieldCount || 0));
          const doubleDownCount = Math.max(0, Number(power.doubleDownCount || 0));

          const iconGroup = (count, cls, iconHtml, label) => {
            if (!count) return "";
            let out = "";
            for (let i = 0; i < count; i += 1) {
              out += "<span class='power-pill " + cls + "' title='" + label + "'>" + iconHtml + "</span>";
            }
            return out;
          };

          const inPlayIcons =
            iconGroup(doubleDownCount, "ready", "<span aria-hidden='true'>x2</span>", "Double Down in play")

            + iconGroup(reflectiveShieldCount, "shield", "✨", "Reflective shield in play")
            + iconGroup(strikeCount, "rocket", "💥", "Shadow Strike in play");

          const shieldOn = Number(model.pointShieldArmedForQuestionIndex) === Number(q.questionIndex);
          const attackerNames = normalizeNames(model.strikeAttackers);
          const underAttack = Number(model.strikeCount || 0) > 0 || attackerNames.length > 0;
          const attackTitle = underAttack
            ? (attackerNames.length

          const wrap = document.createElement("section");
          wrap.className = "glass p-3";
          wrap.innerHTML = ""
            + "<div class='question-header-row'>"

            + "<div class='question-status-lane'>"
            + "<div class='status-tile is-shield" + (shieldOn ? " is-on" : "") + "' title='" + (shieldOn ? "Shield active for this question" : "No shield active") + "'><div class='status-icon'><i class='lni lni-shield'></i></div><div class='label'>Shield</div></div>"

            + "<div class='status-tile is-attack" + (underAttack ? " is-on" : "") + "' title='" + safeText(attackTitle) + "'><div class='status-icon'>💥</div><div class='label'>Attack</div></div>"
            + "<button id='fiftyFiftyBtn' class='score-box status-tile question-action-tile is-fifty" + (fiftyFiftyUsed ? " is-on" : "") + " focus-ring' type='button'" + (fiftyFiftyDisabled ? " disabled" : "") + " aria-label='Use 50/50 for " + formatScore(FIFTY_FIFTY_COST) + " points'><div class='small-note'>50/50</div><div class='fw-bold fs-5'>" + formatScore(FIFTY_FIFTY_COST) + " points</div></button>"
            + "<div class='score-box status-tile'><div class='small-note'>Your Score</div><div id='scoreValue' class='fw-bold fs-5'>" + formatScore(model.playerScore) + "</div></div>"
            + "</div>"
            + "</div>"
            + (model.strikeNotice ? "<div class='double-down-note warn mb-2'>" + safeText(model.strikeNotice) + "</div>" : "")
            + "<div class='fw-bold mb-2'>" + safeText(q.query) + "</div>"
            + "<div id='timerView' class='timer " + timerClass + " mb-3'>" + formatTime(rem) + "</div>"

            + "<div id='multiHint' class='small-note mb-2'></div>"
            + "<div id='optionsGrid' class='options-grid mb-2'></div>"

          this.app.appendChild(wrap);

          const grid = document.getElementById("optionsGrid");
          const submitted = model.hasSubmitted;

          }

          q.options.forEach((opt) => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "ans-btn c-" + opt.color + " focus-ring";
            btn.setAttribute("data-opt-id", opt.id);
            btn.setAttribute("aria-label", "Option " + opt.letter + ": " + opt.text);
            btn.innerHTML = "<span class='letter'>" + opt.letter + "</span><span>" + safeText(opt.text) + "</span>";
            if (submitted) btn.classList.add("locked");
            const removed = removedOptionIds.has(String(opt.id));
            if (removed) btn.classList.add("fifty-fifty-removed");
            if (model.selectedIds && model.selectedIds.includes(opt.id) && !removed) btn.classList.add("selected");
            btn.disabled = submitted || removed;
            btn.addEventListener("click", () => handlers.onOptionClick(opt.id));

          if (submitted) {
            document.getElementById("questionStatus").innerHTML = "<div class='lock-state'><i class='lni lni-lock-alt me-1'></i>Answer locked in! Waiting for everyone else...</div>";

            document.getElementById("questionStatus").textContent = model.fiftyFiftyNotice;

          const fiftyFiftyBtn = document.getElementById("fiftyFiftyBtn");
          if (fiftyFiftyBtn) {
            fiftyFiftyBtn.addEventListener("click", handlers.onFiftyFifty);
          }
        }

        refreshTimer(question) {
          const timer = document.getElementById("timerView");
          if (!timer || !question) return;

          timer.textContent = formatTime(rem);

        updateLockedBanner() {

        renderReveal(model) {

          scoreRow.appendChild(scoreBox);

          const canArmDoubleDown = !!model.hasNextQuestion && !model.doubleDownArmed && !!model.doubleDownEligible;

          const ddDisabled = !canArmDoubleDown && !canBuyDoubleDown;

          cardHtml += "<div id='pointShieldStatus' class='power-status-note " + ((model.canBuyPointShield || model.pointShieldNext) ? "ok" : "bad") + "'>" + safeText(model.pointShieldStatusText || "") + "</div>";

          cardHtml += "</div>";

          cardHtml += "<button id='buyPointShieldBtn' class='power-pill-btn shield focus-ring" + ((!!model.pointShieldNext && String(model.pointShieldMode || "").toUpperCase() !== "REFLECTIVE") ? " active" : "") + "' type='button'" + ((!!model.pointShieldNext || !model.canBuyPointShield) ? " disabled" : "") + "><i class='lni lni-shield'></i><span>Shield</span></button>";
          cardHtml += "<button id='buyReflectiveShieldBtn' class='power-pill-btn shield focus-ring" + ((!!model.pointShieldNext && String(model.pointShieldMode || "").toUpperCase() === "REFLECTIVE") ? " active" : "") + "' type='button'" + ((!!model.pointShieldNext || !model.canBuyReflectiveShield) ? " disabled" : "") + "><span aria-hidden='true'>✨</span><span>Reflective</span></button>";
          cardHtml += "</div>";

            cardHtml += "<button id='powerStealthBtn' class='power-pill-btn attack focus-ring' type='button'><i class='lni lni-target'></i><span>Stealth Attack</span></button>";

          cardHtml += "<div id='pointShieldNotice' class='small-note mt-1'>" + safeText(model.pointShieldNotice || "") + "</div>";
          card.innerHTML = cardHtml;

          const colors = ["#ffd86b", "#ff8bb3", "#a2f2c0", "#d9c2ff", "#9bd1ff"];
          for (let i = 0; i < 18; i += 1) {
            const c = document.createElement("span");
            c.className = "confetti";
            c.style.left = Math.floor(Math.random() * 100) + "%";
            c.style.top = Math.floor(Math.random() * 25) + "%";
            c.style.background = colors[i % colors.length];
            c.style.animationDelay = (Math.random() * 140) + "ms";

        animateCount(id, from, to, duration) {
          const el = document.getElementById(id);
          if (!el) return;
          const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (reduce) {
            el.textContent = formatScore(to);
            return;
          }
          const start = nowTs();
          const diff = to - from;
          const frame = () => {
            const t = Math.min(1, (nowTs() - start) / duration);
            const eased = 1 - Math.pow(1 - t, 3);
            const val = Math.round(from + diff * eased);
            el.textContent = formatScore(val);
            if (t < 1) requestAnimationFrame(frame);
          };
          frame();
        }
      }

          .replace(/\"/g, "&quot;")
          .replace(/'/g, "&#39;");

        queueRender(joinMsg) {
          if (typeof joinMsg === "string") this.pendingJoinMsg = joinMsg;
          if (this.renderQueued) return;
          this.renderQueued = true;
          requestAnimationFrame(() => {
            this.renderQueued = false;
            const msg = this.pendingJoinMsg;

          });

        shouldRenderAfterMessage(msgType, before) {
          if (!before) return true;
          const nowPhase = this.game.phase;

          const reveal = this.game.reveal;
          const revealKey = reveal && reveal.questionIndex != null ? Number(reveal.questionIndex) : (reveal ? "present" : null);
          if (msgType === MSG.QUESTION_STARTED) {
            return before.phase !== PHASES.QUESTION || before.questionIndex !== questionIndex;
          }

          if (msgType === MSG.ANSWER_REVEALED) {
            return before.phase !== PHASES.ANSWER_REVEAL || before.revealKey !== revealKey;
          }

          if (msgType === MSG.GAME_FINISHED) {
            return before.phase !== PHASES.FINISHED;
          }

          if (msgType === MSG.PLAYER_REMOVED) {
            return before.playerRemoved !== !!this.game.playerRemoved;
          }

          if (msgType === MSG.QUESTION_ENDED) {
            return before.phase !== nowPhase;
          }

          if (msgType === MSG.DOUBLE_DOWN_SET || msgType === MSG.DOUBLE_DOWN_BUY_RESULT || msgType === MSG.POINT_SHIELD_BUY_RESULT || msgType === MSG.STREAK_PRIZE_RESULT || msgType === MSG.FIFTY_FIFTY_RESULT) {
            return false;
          }

          if (msgType === MSG.SCORE_UPDATED || msgType === MSG.SCORE_RESET) {
            return false;
          }

          if (msgType === MSG.LEADERBOARD) {
            return before.phase !== PHASES.LEADERBOARD;
          }

          if (msgType === MSG.STATE_SNAPSHOT) {
            if (before.phase !== nowPhase) return true;
            if (before.questionIndex !== questionIndex) return true;
            if (before.revealKey !== revealKey) return true;
            if (before.playerRemoved !== !!this.game.playerRemoved) return true;
            return false;
          }

          return false;
        }

              fiftyFiftyBtn.disabled = !!this.game.hasSubmitted || used || !!this.fiftyFiftyInFlight || Number(this.game.playerScore || 0) < FIFTY_FIFTY_COST;
              fiftyFiftyBtn.classList.toggle("is-on", used);
            }

            const removedIds = new Set(Array.isArray(this.game.fiftyFiftyRemovedOptionIds) ? this.game.fiftyFiftyRemovedOptionIds.map(String) : []);
            document.querySelectorAll(".ans-btn[data-opt-id]").forEach((button) => {
              const removed = removedIds.has(String(button.getAttribute("data-opt-id") || ""));
              button.classList.toggle("fifty-fifty-removed", removed);
              if (removed) button.classList.remove("selected");
              button.disabled = !!this.game.hasSubmitted || removed;
            });

            const questionStatus = document.getElementById("questionStatus");

              submitButton.textContent = "Answer Locked";
            }
            return;
          }

          if (this.game.phase === PHASES.ANSWER_REVEAL) {
            const hasNextQuestion = !!(this.game.question && this.game.question.questionNumber < this.game.question.questionCount);
            const scoreEl = document.getElementById("countingScore");

              const canBuy = hasNextQuestion && !this.game.doubleDownArmed && !this.game.doubleDownEligible && !!this.game.canBuyDoubleDown;
              doubleDownBtn.disabled = !canArm && !canBuy;
              doubleDownBtn.classList.toggle("active", !!this.game.doubleDownArmed);
              doubleDownBtn.classList.toggle("is-disabled", doubleDownBtn.disabled);

            const pointStatus = document.getElementById("pointShieldStatus");
            if (pointStatus) {
              pointStatus.textContent = this.getPointShieldStatusText(hasNextQuestion);
              pointStatus.classList.toggle("ok", !!(this.game.pointShieldNext || this.game.canBuyPointShield));
              pointStatus.classList.toggle("bad", !this.game.pointShieldNext && !this.game.canBuyPointShield);

            if (reflectiveStatus) {

              reflectiveStatus.textContent = this.getReflectiveShieldStatusText(hasNextQuestion);

              reflectiveStatus.classList.toggle("bad", !(reflectiveArmed || this.game.canBuyReflectiveShield));

            const shieldBtn = document.getElementById("buyPointShieldBtn");

            ["lbPowerBonusBtn", "lbPowerCloakBtn", "lbPowerStealthBtn"].forEach((id) => {

                ? "Real score: " + formatScore(this.game.playerScore || 0) + " pts. Leaderboard shows: " + formatScore(this.game.playerDisplayedScore || 0) + " pts for " + Number(this.game.fakeScoreTurnsRemaining || 0) + " more turn" + (Number(this.game.fakeScoreTurnsRemaining || 0) === 1 ? "" : "s") + "."
                : "";
            }

            const pointNoticeEl = document.getElementById("lbPointShieldNotice");
            if (pointNoticeEl) pointNoticeEl.textContent = this.game.pointShieldNotice || "";

            const hasNextFromBoard = !!(this.game.question && this.game.question.questionNumber < this.game.question.questionCount);
            const pointStatusEl = document.getElementById("lbPointShieldStatus");
            if (pointStatusEl) {
              pointStatusEl.textContent = this.getPointShieldStatusText(hasNextFromBoard);

              reflectiveStatusEl.textContent = this.getReflectiveShieldStatusText(hasNextFromBoard);
              reflectiveStatusEl.classList.toggle("ok", !!(reflectiveArmed || this.game.canBuyReflectiveShield));
              reflectiveStatusEl.classList.toggle("bad", !(reflectiveArmed || this.game.canBuyReflectiveShield));

            if (pointShieldBtn) {
              if (this.game.pointShieldNext) pointShieldBtn.textContent = "Shield Armed For Next Question";

              pointShieldBtn.disabled = !!this.game.pointShieldNext || !this.game.canBuyPointShield;
