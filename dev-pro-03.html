al level is still a clear sign that something changed. Labels such as sender type, prompt version and model version on the metric help the team find the cause quickly.\u003c/p>\n\u003cp>The March incident was \u003cem>input drift\u003c/em>: the cause was a change in the incoming emails. A fixed release test set cannot detect this, because it contains the old layouts and the model still sorts those correctly. Offline evaluations are valuable before a release, and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">Anthropic's guidance on developing tests\u003c/a> says they should mirror the real distribution of tasks, but live inputs keep changing after the set is written. A confidence score that the model reports about its own decision is not a calibrated measurement, and the model can be confident and wrong. Lower thresholds on error rate and latency produce more pages about availability and speed, and they still say nothing about folder accuracy.\u003c/p>\n\u003cp>Good monitoring combines several layers: offline evaluations before release, outcome indicators with alerts in production, and regular human review of samples. After an incident like this one, the team should also add examples of the new layouts to the test set, so that the same failure is found before the next release.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 14; Domain: Observability and Production Monitoring","answerStatus":"source"},{"query":"A prompt template puts each user's changing emails before 5,000 tokens of reusable instructions and examples. A cache breakpoint follows the instructions, yet almost every request is a cache miss. How should the prompt be reordered?","type":"multiple-choice","options":[{"text":"Put the shared instructions first with a breakpoint after them, so that all requests share one cached prefix.","explanation":"For a cache read, the request must match an earlier request from its first token up to the breakpoint. When the identical instructions are at the start, every drafting request has the same prefix. The model then reads those 5,000 tokens from the cache and processes only the emails as new input. This shortens the wait before the first token.","correct":true},{"text":"Keep the template order, and add a second breakpoint after the emails so that the two sections are cached separately.","explanation":"Caching does not store sections independently. A breakpoint marks the end of a prefix, and everything before it must be identical for a cache read. The instructions would still come after emails that change, so the model would still process them as new input.","correct":false},{"text":"Keep the template order, and use the 1-hour cache duration so that each cached prompt stays available longer.","explanation":"The cache entries are not expiring too early. The problem is that no request can match them. Each entry starts with one user's latest emails, so a request with different emails does not read it, however long the entry is kept. The 1-hour duration also costs more for every cache write.","correct":false},{"text":"Lower the effort level on drafting requests, and keep the current level for summaries and sorting.","explanation":"Effort controls how much the model thinks and writes, and that is output. In this scenario, the delay comes from the model processing an uncached prompt before it produces anything. A lower effort level does not shorten that step. It could also lower draft quality without fixing the cause.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Put the shared instructions first with a breakpoint after them, so that all requests share one cached prefix.\u003c/p>\n\u003cp>Prompt caching works on a \u003cstrong>prefix\u003c/strong>. The API compares the request, from its first token up to a cache breakpoint, with entries that earlier requests wrote, and the content must be identical. If anything before the breakpoint is different, the request does not read the cache, and the model processes the whole prompt as new input. In Inkwell's template, the user's latest emails come first, so the prefix is different on almost every request. The 5,000 tokens of instructions and examples are the same for 6 million users. However, they come \u003cem>after\u003c/em> content that changes, so they are never reused.\u003c/p>\n\u003cp>Placing the shared instructions and examples at the start, with a breakpoint after them, gives every drafting request the same prefix. Requests in the same workspace can then read one cache entry, and the model has to process only the emails as new input. This shortens \u003cstrong>time to first token\u003c/strong>, which is the time from sending the request to the first generated token. With streaming, that is the delay that the user sees before the draft starts. Drafting requests arrive all the time, so the entry is read again within the default cache lifetime, and each read renews that lifetime at no extra charge. Cache reads are also billed at a fraction of the normal input price, which helps with Inkwell's spend. The same reordering can help summarizing and sorting, because they use the same template.\u003c/p>\n\u003cp>The other changes keep the order that causes the problem. A longer cache duration keeps entries available for more time. However, each entry starts with one user's emails, so other requests still cannot match it, and 1-hour cache writes cost more than 5-minute writes. A second breakpoint after the emails does not make the instructions cacheable on their own, because everything before a breakpoint must still match. A lower effort level reduces how much the model thinks and writes, and that is output. It does not reduce the time that the model spends reading an uncached prompt.\u003c/p>\n\u003cp>See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">Prompt caching\u003c/a> for how prefixes and breakpoints are matched, and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency\">Reducing latency\u003c/a> for the definition of time to first token.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 15; Domain: Cost and Latency Optimization at Scale","answerStatus":"source"},{"query":"A sanctions-check tool returns an empty list both when there are no matches and when its API times out. Some applications were approved without a completed check. Where is the defect, and how should timeouts be handled?","type":"multiple-choice","options":[{"text":"The origin is the lead agent, which approves on thin evidence. Instruct it to reject any application with an empty sanctions result.","explanation":"An empty list is the normal result for a business with no sanctions matches. So this rule would reject every clean application. The lead agent cannot tell a failed check from a clean one, because the wrapper gives both the same output. A prompt instruction cannot recover information that the tool layer has already removed.","correct":false},{"text":"The origin is the sanctions subagent, which reports clean results too readily. Have it attach a confidence score to every result.","explanation":"The subagent received an empty list with no error and reported no matches. That is an accurate reading of its input. The subagent has no information about the timeout, so its confidence score would be high for the failed checks as well. A score that the model reports about itself is not a reliable control for a compliance decision.","correct":false},{"text":"The origin is the tool wrapper, which turns a timeout into an empty list. Return timeouts as errors and block approval on them.","explanation":"The wrapper replaces a failed check with the same value that a clean check returns. So neither the subagent nor the lead agent can tell that the check never ran. Returning the timeout as an error result (is_error set to true) separates the two cases. A check in code that requires a completed sanctions result before approval does not depend on the model's behavior.","correct":true},{"text":"The origin is the sanctions API, which fails under month-end load. Raise the wrapper's timeout and retry each call up to five times.","explanation":"More retries and a longer timeout would reduce how often a check fails at the end of the month. However, when the last retry also times out, the wrapper still returns an empty list. So the application is still approved without a sanctions check. The API timeout starts the problem, but the wrapper is what turns it into a false clean result.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> The origin is the tool wrapper, which turns a timeout into an empty list. Return timeouts as errors and block approval on them.\u003c/p>\n\u003cp>The failure begins in the tool layer. The sanctions wrapper receives a timeout from the external API and replaces it with an empty list of matches. An empty list is also the normal output of a completed check on a clean business. So two different events now look identical to every component that reads the result. The sanctions subagent saw an empty list with no error and reported no matches, which is an accurate reading of what it received. The lead agent then recommended approval for an application whose sanctions check never ran.\u003c/p>\n\u003cp>The fix is to separate the two cases at the place where they were combined. When a client tool fails, the tool result should say so. The documented pattern is to return a \u003ccode>tool_result\u003c/code> with \u003ccode>is_error\u003c/code> set to \u003ccode>true\u003c/code> and a short description of the failure, as described in \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls\">Handle tool calls\u003c/a>. The subagent can then see that the check did not complete, and it can retry or report the failure to the lead agent.\u003c/p>\n\u003cp>A missed sanctions match is a serious compliance failure, so the team should not depend only on the agents to act on that error. Code in the harness should require a completed sanctions check before any approval recommendation reaches the compliance officer. An application without a completed check waits for a retry, or it goes to the officer marked as \u003cem>sanctions check not completed\u003c/em>. This also gives regulators a record that shows whether each check ran, which the traceability requirement needs.\u003c/p>\n\u003cp>The other approaches each improve something, but they leave the cause in place. A longer timeout and more retries reduce the number of failed checks at the end of the month. However, when the final retry fails, the wrapper still returns an empty list, and the application is still approved. Telling the lead agent to reject on an empty result would reject every clean business, because an empty list is what a successful clean check returns. A confidence score from the subagent is a self-report from a model that never saw the timeout. So the score would be high for the nine failed checks too.\u003c/p>\n\u003cp>A tool failure must reach the model and the harness as a failure. When a tool returns a normal-looking value after it fails, the fault appears at a later step, where it can look like a model mistake. When a diagnosis shows that each agent read its input correctly, the next place to check is what the tools and the harness gave the agents.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 16; Domain: Advanced Debugging and Incident Response","answerStatus":"source"},{"query":"A director-extraction subagent returns HTTP 200 with stop_reason 'refusal' and a partial director list. The harness treats it as complete, so some directors never receive sanctions checks. What should the harness change?","type":"multiple-choice","options":[{"text":"Have the harness check each subagent's stop reason, discard a refused response, and mark the extraction as incomplete.","explanation":"The response reported through its stop reason that the extraction did not finish. The harness ignored that signal and passed the partial output on as a complete result. Checking the stop reason in code keeps a partial director list away from the sanctions and identity checks. It also records in the trace why the application could not continue.","correct":true},{"text":"Add a rule to the lead agent's prompt to confirm that every director was checked before it recommends approval.","explanation":"The lead agent receives only the partial list, so every director that it knows about was checked. It cannot detect names that were never extracted. Also, a prompt rule depends on the model's behavior, and a sanctions control needs enforcement in code.","correct":false},{"text":"Add retries with a longer backoff to the extraction subagent's API calls, so that failed extractions are attempted again.","explanation":"Retry and backoff logic responds to API errors such as rate limits, overload and timeouts. A refusal arrives as a successful HTTP 200 response, so the retry code never runs. The harness would still pass the partial list on as a finished extraction.","correct":false},{"text":"Raise the extraction subagent's output token limit, so that responses with long director lists are not cut short.","explanation":"A response that is cut short by the output limit ends with the stop reason max_tokens. These responses ended with the stop reason refusal, which means that a safety classifier declined the request. A larger token limit would not change that result.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Have the harness check each subagent&#x27;s stop reason, discard a refused response, and mark the extraction as incomplete.\u003c/p>\n\u003cp>Every successful Messages API response carries a \u003cstrong>stop reason\u003c/strong>, and a stop reason is not an error. When a safety classifier declines a request, the API still returns HTTP 200, with the stop reason \u003ccode>refusal\u003c/code>. A refusal can arrive after the model has already written part of its answer. That partial output should be treated as incomplete and discarded. Error-rate dashboards and retry code react only to 4xx and 5xx responses, so they showed nothing unusual in these 14 cases.\u003c/p>\n\u003cp>The evidence points to the agent harness. The extraction subagent did not finish, and the response said so through its stop reason. The harness ignored that signal and passed a partial director list to the lead agent as if it were complete. In a multi-agent system, each later step trusts what it receives. The sanctions and identity subagents checked only the directors on the short list, and the lead agent could not know that names were missing. The fix is to make the code act on the stop reason: discard a refused response, record the extraction as incomplete, and stop the application from reaching an approval recommendation. This also gives regulators a trace that shows why the application stopped. All 14 applications came from laboratory supply and biotechnology companies. This fits the diagnosis, because it suggests that content in their documents caused the classifier to decline.\u003c/p>\n\u003cp>The other changes address causes that the traces do not show. Retries with backoff help with temporary API errors, but a refusal is a successful response, so the retry code never runs. A larger output token limit helps when the stop reason is \u003ccode>max_tokens\u003c/code>, which is a different stop reason from the one in these traces. A rule in the lead agent's prompt asks the model to verify something that it cannot see, because the missing directors never reached it. A prompt instruction is also the wrong kind of control for a sanctions check, which should be enforced in code.\u003c/p>\n\u003cp>When the harness detects refusals, the team can decide what to do with those applications, for example send them to a compliance officer. The documentation also describes a fallback mechanism that is triggered by classifier declines and not by rate limits or overload. Even with a fallback, the harness must still check the final stop reason before it treats any result as complete. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons\">Handling stop reasons\u003c/a> and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback\">Refusals and fallback\u003c/a>.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 17; Domain: Advanced Debugging and Incident Response","answerStatus":"source"},{"query":"Automatic context compaction omitted the fact that sanctions checks timed out for two directors in a large application. How can the system keep context small without losing the status of required checks?","type":"multiple-choice","options":[{"text":"Move the lead agent to a model with a larger context window, and turn compaction off for these large applications.","explanation":"A larger window delays the limit. However, with compaction off, a large enough application has no way to continue when the window is full. Recall also becomes less accurate as a context grows, so the model can still miss one timeout among hundreds of results. The check statuses would still exist only in the conversation, with no stored record for regulators.","correct":false},{"text":"Add instructions to the compaction step that tell it to keep every sanctions and identity result in each summary.","explanation":"Instructions can improve what a summary keeps. However, the summary is still text written by a model, and it can still leave out or shorten a result on an application with 60 directors. The status of each check would still exist only inside the conversation. The team needs the status stored in a place where a summary cannot remove it.","correct":false},{"text":"Have the lead agent save each check's status to a persistent record, and read that record before it recommends.","explanation":"When compaction replaces older turns with a summary, it does not change a record stored outside the conversation. So a timed-out sanctions check is still marked as timed out when the lead agent writes its recommendation. Compaction can continue to keep the context small. The record also gives regulators a stored status for every check behind each recommendation.","correct":true},{"text":"Cache the lead agent's conversation prefix with prompt caching, and raise the threshold at which compaction starts.","explanation":"Prompt caching lowers the cost and latency of processing a repeated prefix again, but cached tokens still count toward the context window. A higher threshold only makes compaction start later. When compaction does start, the summary can lose a timeout in the same way. Neither step keeps the check statuses safe.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Have the lead agent save each check&#x27;s status to a persistent record, and read that record before it recommends.\u003c/p>\n\u003cp>\u003cstrong>Compaction\u003c/strong> keeps a long run inside the context window. It replaces older turns with a summary that the model writes. A summary is shorter than the original, so some details are lost, and nothing guarantees that a specific detail remains. In the incident, the lost detail was that the sanctions check had timed out for two directors. After the summary, the lead agent had no sign that those checks were incomplete, so it recommended approval.\u003c/p>\n\u003cp>The fix is to store the facts that must not be lost outside the conversation. With the \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool\">memory tool\u003c/a>, Claude requests file operations, and the application runs them against storage that the application controls. Suppose the lead agent writes each check's status (passed, matched, timed out) to a record for the application when the result arrives. Compaction can then summarize the conversation freely. Before the lead agent recommends, it reads the record. So its decision is based on the stored status of every check, not on what remained in a summary. The memory tool documentation describes this combination for long-running agents: compaction keeps the active context small, and memory keeps the information that must survive summarization. The same record helps Oriel meet its requirement that every recommendation is traceable. The harness can also write the record itself from each subagent's result. Then the system does not depend on the lead agent remembering to write it.\u003c/p>\n\u003cp>Adding instructions to the compaction step is a real improvement, and it is the closest alternative. It makes the summary more likely to keep check results. However, the summary is still text written by a model, and the status still exists only in the conversation. For a result that controls an approval at a bank, the status should be stored in a place where the summary cannot remove it.\u003c/p>\n\u003cp>\u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">Prompt caching\u003c/a> reduces the cost and latency of processing a repeated prefix again. It does not reduce context window usage, because cached tokens still count toward the window. Raising the compaction threshold only delays the same step, which can still lose details.\u003c/p>\n\u003cp>A larger context window with compaction turned off avoids the summary. However, it leaves no way to continue when a very large application fills the window. Long contexts also reduce recall, so the model can still miss a single timeout among many results. For related options, see \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/compaction\">Compaction\u003c/a> and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/context-editing\">Context editing\u003c/a>. Context editing clears old tool results by rule, and it can also be combined with the memory tool.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 18; Domain: Advanced Agent Architecture and Orchestration","answerStatus":"source"},{"query":"An extraction subagent writes results to an application record while reading a 400-page file. Clearing a tiny amount of tool output almost every turn has reduced cache hits and increased cost. How should result clearing be adjusted?","type":"multiple-choice","options":[{"text":"Require each clearing to remove a large minimum number of tokens, so that clearing runs on far fewer turns.","explanation":"Each clearing changes content in the middle of the prompt, so the cached prefix after that point must be written again. When each clearing removes a large number of tokens, one request pays for a cache write, and the following requests read the new prefix from the cache. The context still stays within its limit, because old page text is still removed.","correct":true},{"text":"Extend the cache lifetime from the default to one hour, so that the cached prefix stays available between the subagent's turns.","explanation":"The cache entries are not expiring. They stop matching because clearing changes the prompt content on almost every turn. A longer lifetime keeps an entry available for more time, but an entry that no longer matches the prompt is never read. The longer lifetime also costs more for each cache write.","correct":false},{"text":"Move the cache breakpoint to the newest tool result on every request, so that the latest page text is always cached.","explanation":"For a cache read, the whole prefix before the breakpoint must match an earlier request. When an old tool result is cleared, that prefix is different. So no breakpoint position after the cleared content can produce a cache read. The cost stays high because clearing still happens on almost every turn.","correct":false},{"text":"Keep fewer recent tool results after each clearing, so that every request sends a smaller context to the model.","explanation":"A smaller context reduces the tokens in each request, but clearing would still run on almost every turn and invalidate the cache each time. Most of each request would still be processed without cache reads. Also, keeping fewer recent results can remove page text that the subagent still needs for the field it is extracting.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Require each clearing to remove a large minimum number of tokens, so that clearing runs on far fewer turns.\u003c/p>\n\u003cp>\u003cstrong>Prompt caching\u003c/strong> works on a prefix. The API processes \u003ccode>tools\u003c/code>, then \u003ccode>system\u003c/code>, then \u003ccode>messages\u003c/code>. A request reads from the cache only when everything up to a cached point is identical to an earlier request. \u003cstrong>Tool result clearing\u003c/strong> (a context editing strategy) replaces old tool results with a short placeholder before the prompt reaches the model. This changes content in the middle of the prompt. So everything after the cleared result no longer matches the cache and must be written to it again.\u003c/p>\n\u003cp>In the extraction subagent, clearing runs on almost every turn and removes only a small amount each time. So nearly every request pays for a new cache write. Cache writes cost more than normal input tokens, and cache reads cost much less. As a result, a change that was meant to reduce cost increased it. The context editing documentation recommends clearing enough tokens each time to justify the cache invalidation. It provides a setting for the minimum number of tokens that each clearing must remove (\u003ccode>clear_at_least\u003c/code>). With a large minimum, clearing is skipped until that many tokens can be removed. One request then pays for a cache write, and the requests after it read the new prefix from the cache until the next clearing. The context stays within a limit because old page text is still removed, only in larger and less frequent steps.\u003c/p>\n\u003cp>Clearing is a safe policy for this subagent, because each extracted field is already in the application record before the subagent reads the next page. Context editing is applied on the server. So the harness can also keep the full, unchanged history on its own side for the regulators' audit trail.\u003c/p>\n\u003cp>The other changes do not remove the cause. Moving the cache breakpoint cannot help, because the content \u003cem>before\u003c/em> any later breakpoint has changed. A one-hour cache lifetime addresses expiry, but the entries are not expiring; they no longer match the prompt. Keeping fewer recent tool results makes each request smaller. However, clearing still happens on almost every turn, so the cache is still invalidated each time, and the subagent may lose page text that it still needs.\u003c/p>\n\u003cp>See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/context-editing\">Context editing\u003c/a> and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">Prompt caching\u003c/a>.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 19; Domain: Advanced Agent Architecture and Orchestration","answerStatus":"source"},{"query":"A faulty extraction prompt misidentified directors for roughly 400 applications before rollback. Later identity and sanctions checks relied on that list, and many decisions were already made. What remediation should follow?","type":"multiple-choice","options":[{"text":"Compare the two prompts to learn why shareholders were listed as directors, and decide about the earlier applications after that.","explanation":"The team needs to find the cause for the postmortem. However, it does not need the cause to correct the affected applications, because the restored prompt is known to work. While the team waits for the analysis, accounts stay open for directors who were never checked against sanctions lists.","correct":false},{"text":"Ask the compliance officers to report any other recommendation from those four days that looks wrong, and re-run each reported application.","explanation":"This depends on people noticing the error, and officers had already decided most of the 400 applications without noticing it. A recommendation that leaves out a director can look complete, so many affected cases would never be reported. With the traces, the team can find the affected applications directly.","correct":false},{"text":"Use the traces to find every application that the Monday prompt processed, re-run those applications, and give compliance each result that changed.","explanation":"Restoring the old prompt stops new errors, but it does not correct the roughly 400 recommendations that the faulty prompt already produced. Every recommendation is traceable. So the team can list the affected applications by prompt version, repeat the checks on the correct directors, and give compliance the cases where a decision may need to change.","correct":true},{"text":"Add the three applications that the officer noticed to the regression suite, and close the incident when the suite passes.","explanation":"Adding the failing cases to the regression suite is a good follow-up step, because it helps catch the same error before a future release. However, it does nothing for the decisions already made on wrong director lists. Closing the incident at that point would leave unchecked directors on open accounts.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Use the traces to find every application that the Monday prompt processed, re-run those applications, and give compliance each result that changed.\u003c/p>\n\u003cp>A \u003cstrong>rollback\u003c/strong> (returning to the previous version) is a mitigation. It stops the system from producing more wrong output. It does not change the output that the faulty version already produced. After mitigation, the next step in incident response is to \u003cstrong>find the full set of affected cases\u003c/strong> and correct them. Only after that should the team study the cause in depth and write the postmortem (the written review of what happened and what will change).\u003c/p>\n\u003cp>The three applications that the officer noticed are the cases that a person happened to see. They do not show the full amount of damage. About 400 applications went through the Monday prompt. For each one, the sanctions and identity checks ran on whatever director list the extraction subagent returned. If a real director was left out, that person was never checked, and the recommendation still looked complete. This is why the team cannot rely on officers to find the remaining cases: the officers already decided most of these applications without seeing the problem.\u003c/p>\n\u003cp>Oriel Bank must be able to trace every recommendation, so the team's records can show which prompt version produced each one. The team can select all applications from the four-day window, run them again with the restored prompt, and compare the director lists and the final recommendations. Claude's output can be a little different between runs. So the comparison should look at the important facts (who the directors are, and whether the recommendation changed), not at the exact wording. Each changed result goes to compliance, because only a compliance officer can decide what to do about an account that is already open. Request-level tracing supports this kind of work. The \u003ca href=\"https://platform.claude.com/docs/en/api/opentelemetry/spans\">OpenTelemetry span reference\u003c/a> describes request spans that carry attributes such as the request ID and the requested model. A team can join these with its own record of prompt versions.\u003c/p>\n\u003cp>The other choices are useful steps, but they come at the wrong time or cover too little. Waiting for officers to report more cases finds only what people notice. The regression suite is the set of tests that runs before each release. Adding the three known cases to it is the right way to protect future releases from the same error, and the \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">evaluation guidance\u003c/a> recommends tests that reflect real cases and edge cases. However, adding these cases does not correct past decisions. The team will need to compare the two prompts to find the cause later, but the correction does not depend on it, because the old prompt already gives correct director lists.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 20; Domain: Advanced Debugging and Incident Response","answerStatus":"source"},{"query":"Every application needs the same three compliance checks, yet a lead agent replans them and sometimes recommends approval without sanctions results. Regulators also question the inconsistent sequence. Which orchestration design fits better?","type":"multiple-choice","options":[{"text":"Have code run all three checks for every application, and start the lead agent only once all three results exist.","explanation":"The traces show that the steps are the same for every application. So code can control them, and the model does not need to plan them. Code can also confirm that the sanctions result exists before any recommendation is written, and it can retry or hold the application after a timeout. Every application then follows one fixed sequence that regulators can trace.","correct":true},{"text":"Add a rule to the lead agent's system prompt that it must receive all three results before it writes a recommendation.","explanation":"A prompt rule makes a skipped check less likely, but the model can still fail to follow it, especially after a tool timeout. Sanctions screening is a legal control, so it needs enforcement that does not depend on the model's behavior. Also, the lead agent would still plan the steps again for each application, so the steps would continue to be different.","correct":false},{"text":"Add a fourth subagent that reads each finished application's trace and reports any check that the lead agent skipped.","explanation":"This finds a missing sanctions result only after the recommendation has been written. So it detects the problem but does not prevent it. It also adds model cost to all 3,000 applications a month, and it depends on the judgment of another model. The lead agent would still choose its own steps, so the differences that regulators asked about would remain.","correct":false},{"text":"Move the agents to Claude Managed Agents so that each application's session keeps a persistent event history for regulators.","explanation":"Claude Managed Agents does provide stateful sessions with a persistent event history, and this would improve record keeping. However, a harness records what the lead agent did. It does not decide which checks run. A recommendation written without a sanctions result would be stored in the history, but it would still be written.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Have code run all three checks for every application, and start the lead agent only once all three results exist.\u003c/p>\n\u003cp>Anthropic's guidance separates two kinds of agentic system by who controls the steps. In a \u003cstrong>workflow\u003c/strong>, code follows a predefined path and calls the model at fixed points. In an \u003cstrong>agent\u003c/strong>, the model decides its own steps and its own tool use. The guidance is to use the simplest design that works, and to add control by the model only when the task needs it. That control costs more, takes longer, and makes results vary between runs.\u003c/p>\n\u003cp>Oriel's traces show that the steps are known in advance: every application needs document extraction, a sanctions check and identity verification. Nothing is gained when the lead agent plans these steps again for each application. The traces also show the cost of that freedom: about 2% of recommendations were written with no sanctions result, usually after a timeout. If code runs the three checks, the same steps happen for all 3,000 applications a month. Code can also confirm that each result exists before the lead agent is called. When the sanctions API times out, the code can retry the call or hold the application, and the recommendation is not written until the result arrives. Claude still does the work that needs judgment: it reads the documents, and it weighs the three results in a recommendation for the compliance officer. Regulators then see one fixed sequence for every application.\u003c/p>\n\u003cp>The other changes each help with part of the problem. A system prompt rule makes a skipped check less likely, but the model can still fail to follow it, and a bank cannot depend on that for sanctions screening. A fourth subagent that reads traces finds a missing check \u003cem>after\u003c/em> the recommendation is written. It also adds cost to every application, and it leaves the order of steps to the lead agent. Claude Managed Agents does provide stateful sessions with a persistent event history, which helps with records. However, a harness stores what the lead agent did; it does not decide which checks run.\u003c/p>\n\u003cp>Further reading: \u003ca href=\"https://www.anthropic.com/research/building-effective-agents\">Building effective agents\u003c/a> and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/overview\">Claude Managed Agents overview\u003c/a>.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 21; Domain: Advanced Agent Architecture and Orchestration","answerStatus":"source"},{"query":"A restart erased in-memory subagent results for 140 applications, forcing all checks to run again and producing inconsistent re-extractions. What should be persisted so work resumes from completed stages?","type":"multiple-choice","options":[{"text":"Enable file checkpointing for the lead agent, and rewind each open application to its latest checkpoint when the process starts again.","explanation":"File checkpointing records changes that the agent makes to files through its file editing tools, and a rewind restores those files on disk. It does not store or restore the conversation or the results that subagents returned. After a restart, the lead agent would still have nothing to continue from.","correct":false},{"text":"Give the sanctions check more retries with a longer backoff window, so that fewer applications are still open when a restart happens.","explanation":"More retries can help the sanctions check finish during the timeouts at the end of the month. This shortens the time that an application stays open. However, the results would still exist only in process memory. Any restart or crash during a wait would lose them and repeat every step.","correct":false},{"text":"Save each subagent's result in durable storage by application ID, and have the lead agent run only the missing checks after a restart.","explanation":"The results were lost because they existed only in the memory of one process. When each finished result is saved in storage outside that process, under the application ID, a new lead agent process can read what is already done and run only the remaining checks. Identity verification is then not repeated, and the first extraction stays the one on record. The stored results also support the requirement that every recommendation be traceable.","correct":true},{"text":"Freeze deployments during the last week of each month, and keep each application's results in the lead agent's conversation until it finishes.","explanation":"Stopping deployments at the end of the month removes one cause of restarts during the busiest period. However, a crash, a host failure, or a restart at another time of the month would still erase the results, because they remain only in the lead agent's conversation. The design does not let an open application continue after an interruption.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Save each subagent&#x27;s result in durable storage by application ID, and have the lead agent run only the missing checks after a restart.\u003c/p>\n\u003cp>An agent that waits on an external service can be interrupted at any moment, for example by a deployment, a crash, or a host failure. If the only record of its progress is the conversation held in process memory, every interruption sends the work back to the start. \u003cstrong>Durable execution\u003c/strong> means that each completed step is recorded outside the process. A new process can then read the record and continue from the first step that is not finished.\u003c/p>\n\u003cp>The three subagents at Oriel Bank produce independent results: extracted document data, a sanctions result, and an identity verification result. Suppose each result is saved as a structured record under the application ID as soon as the subagent finishes. A restarted lead agent can then load the record, see that extraction and identity verification are done, and run only the sanctions check that was still waiting. This is important for more than cost. Claude's output can be different between identical runs, so a second extraction may not match the first. If the first result is stored and reused, the recommendation always refers to one fixed set of inputs. Regulators need this when they trace a recommendation back to its evidence.\u003c/p>\n\u003cp>The Agent SDK has related features, and they do different jobs. A \u003cstrong>session\u003c/strong> holds the conversation history, and the SDK writes it to local disk by default. A \u003ccode>SessionStore\u003c/code> adapter can copy that transcript to external storage so that another host can resume it by session ID (see \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/sessions\">Work with sessions\u003c/a> and \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/session-storage\">Session storage\u003c/a>). \u003cstrong>File checkpointing\u003c/strong> is a separate feature. It tracks file changes made through the Write, Edit and NotebookEdit tools and can rewind those files, but it does not rewind or restore the conversation (see \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/file-checkpointing\">Rewind file changes with checkpointing\u003c/a>). Because of the similar name, people expect it to save agent progress, but it does not.\u003c/p>\n\u003cp>The other approaches each reduce how often the failure happens, but they do not change what happens when it does. More retries on the sanctions check shorten the time that an application stays open. A deployment freeze at the end of the month removes one cause of restarts. In both cases, the subagent results are still held only in memory. So the next interruption of any kind repeats the identity checks and produces a second extraction again.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 22; Domain: Advanced Agent Architecture and Orchestration","answerStatus":"source"},{"query":"An eligibility-violation judge was calibrated only on English, but it passes harmful Vietnamese answers in an 11-language assistant. How should the team establish whether the judge works reliably in every language?","type":"multiple-choice","options":[{"text":"Add examples of eligibility statements in all 11 languages to the judge's prompt, and run the gate again on last week's release.","explanation":"Examples in each language may improve the judge, and the rerun may now catch the Vietnamese answers that the adviser found. However, catching a few known answers does not show how often the judge agrees with advisers in Vietnamese or in any other language. Without labeled samples for each language, the team cannot tell whether the new prompt fixed the problem or only those cases.","correct":false},{"text":"Translate every non-English answer into English before the judge reads it, so the judge works in the language it was checked in.","explanation":"Translation may help, but it is a change to the judging pipeline that nobody has measured. Machine translation can soften or change the wording that turns a general explanation into an eligibility statement. So the English agreement figure does not apply to translated text. The team would still need adviser labels in each language to know whether this approach works.","correct":false},{"text":"Have advisers label a sample of answers in each language, and measure the judge's agreement with them language by language.","explanation":"The team compared the judge with human labels only on English answers, so its accuracy in the other ten languages is unknown. Adviser labels for each language show where the judge agrees with licensed advisers and where it does not. The team can then decide, language by language, whether the judge is allowed to pass a release.","correct":true},{"text":"Have advisers label a random sample of all production answers, and require one overall agreement figure of at least 90%.","explanation":"This option does use adviser labels, but about two thirds of a random sample would be English answers, where the judge already performs well. One overall figure could pass 90% while the judge still misses most eligibility statements in Vietnamese or another small language. To show those gaps, the team must report the result separately for each language.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Have advisers label a sample of answers in each language, and measure the judge&#x27;s agreement with them language by language.\u003c/p>\n\u003cp>An LLM judge is a measuring tool. Its agreement with human labels is known only for the kind of data that it was compared on. The team checked the judge on English answers, so the high agreement figure describes English and nothing else. A sentence that tells a user they qualify can be worded very differently in Vietnamese, Arabic or Spanish. A judge that catches the English wordings may miss the others. The answers that the Vietnamese-reading adviser found are direct evidence of this: the judge passed answers that a licensed adviser rejects.\u003c/p>\n\u003cp>The first step is to collect adviser labels for a sample of answers in each of the 11 languages, and to compare the judge with those labels \u003cstrong>one language at a time\u003c/strong>. The result shows in which languages the judge's verdicts are reliable. Until a language reaches acceptable agreement, the judge should not decide releases for that language, and human review should cover it. Answers that break the eligibility rule are rare, so raw agreement can look high even when the judge misses most of them. Two measures give more information: an agreement measure that corrects for chance, such as \u003cstrong>Cohen's kappa\u003c/strong>, and the share of adviser-rejected answers that the judge also rejects.\u003c/p>\n\u003cp>Translating answers into English and adding examples in every language are both reasonable ways to try to improve the judge. However, each one changes the judge without measuring the effect. Translation can also change the exact wording that makes a sentence an eligibility statement. Rerunning the gate on last week's release tests only the few failures that the team already knows about. Labeling a random sample of production answers does bring in adviser judgment, but about two thirds of the sample would be English. A single overall figure from that sample could meet a 90% target while the judge fails in the smaller languages. The regulatory risk is the same in every language, so each language needs its own result.\u003c/p>\n\u003cp>Anthropic's guidance on LLM-based grading says to \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">test the grader for reliability first, then scale\u003c/a>. It also says to design evaluations that match the real distribution of tasks, which for this assistant includes all 11 languages. The \u003ca href=\"https://platform.claude.com/cookbook/misc-building-evals\">Building evals cookbook\u003c/a> makes the same point: the only way to know that a model-based grader works for a task is to try it on that task and read samples.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 23; Domain: Evaluation Engineering and Quality Assurance","answerStatus":"source"},{"query":"A shared long-lived API key leaked through a build log, and its rotation disrupted other workloads. The platform can issue signed workload identity tokens. How can the team eliminate shared permanent credentials and attribute API usage?","type":"multiple-choice","options":[{"text":"Add a pipeline step that masks the key in build logs, and alert the on-call engineer whenever the key's prefix appears in a log.","explanation":"Masking and alerting reduce the chance that the key is exposed through a build log, and they shorten the time before someone reacts. However, the long-lived key still exists and can leak in other ways, such as an error message or a debug file. This change also does nothing to show which of the three workloads made a call.","correct":false},{"text":"Create a service account for each workload, and have each one exchange its platform identity token for a short-lived access token.","explanation":"This is workload identity federation. Each workload proves who it is with a signed token from the hosting platform. In return, it receives an Anthropic access token that expires after a short time, so no long-lived Claude key is stored for a job to print. Each workload acts as its own named service account, so its calls can be attributed to that workload.","correct":true},{"text":"Keep the shared key, and have each workload write its name, the request ID and the time of every call to a central audit log.","explanation":"A central log would help Haverly match calls to workloads, but only if every workload reports honestly and completely. The shared long-lived key remains in all three workloads, so last week's leak can happen again. Also, anyone who obtains the key can call the API without writing to the log.","correct":false},{"text":"Issue a separate API key for each workload, keep each key in a secrets manager, and rotate all of the keys every 30 days.","explanation":"Separate keys do show which workload made a call, and rotation limits how long a leaked key stays useful. However, each key is still a long-lived secret that the job reads at run time and could print, and a printed key stays valid until the next rotation. The security lead asked for no long-lived credential, but this design keeps three of them.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Create a service account for each workload, and have each one exchange its platform identity token for a short-lived access token.\u003c/p>\n\u003cp>An API key is a static, long-lived secret. It can have an expiration date, but until it expires or is revoked, it continues to work for anyone who holds it. Any process that can read the key can also print it. When three workloads share one key, a leak in the least important workload forces a replacement in all of them. That is what caused the 40-minute failure of the website assistant.\u003c/p>\n\u003cp>\u003cstrong>Workload identity federation\u003c/strong> removes the stored key. The hosting platform acts as an identity provider and gives each workload a signed identity token (a JWT). The workload sends that JWT to Anthropic, which checks it against a \u003cstrong>federation rule\u003c/strong> that the organization has configured. If the claims match, Anthropic returns a short-lived Anthropic access token associated with a \u003cstrong>service account\u003c/strong>. Three resources are involved: the service account, the federation issuer, and the federation rule. The federation rule has a token lifetime setting. When a rule is created through the API, the default is one hour, and the Console setup fills in a shorter value. The lifetime of the issued access token can also be limited by the lifetime of the identity token that the workload presented. If a job prints this access token, the token expires soon afterward, and there is no stored key that must be replaced in every workload.\u003c/p>\n\u003cp>A service account is a named identity that is not a person. A workspace API key \u003cem>is\u003c/em> a credential, while a service account \u003cem>has\u003c/em> credentials. When the website assistant, the index update job and the evaluation runs each have their own service account, every call is made under a separate identity. So attribution does not depend on each workload reporting its own name.\u003c/p>\n\u003cp>Two limits are important. First, federation is only as strong as the identity provider behind it. So the federation rule should match one specific workload, not a broad pattern. Second, the Anthropic SDKs give \u003ccode>ANTHROPIC_API_KEY\u003c/code> higher priority than the federation settings. During the migration, the team must unset the old key in every workload and then delete it. Otherwise, the workloads will continue to use it without any visible error.\u003c/p>\n\u003cp>The other approaches each improve one part of the situation. Separate keys with rotation give attribution and a shorter exposure period, but the secrets remain long-lived and can be printed. Log masking and alerts cover one way that a key can leak, and they act only after the leak. Audit logging that each workload reports itself helps attribution. However, it leaves the shared key in place, and anyone who holds the key can skip the log.\u003c/p>\n\u003cp>See \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/workload-identity-federation\">Workload Identity Federation\u003c/a> for the setup steps and the migration from API keys.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 24; Domain: Runtime Guardrails and Production Security","answerStatus":"source"},{"query":"An assistant reads private uploaded files through a shared document-store service account. After cross-user information appeared in an answer, its logs could not identify which session read the file. What audit data should the tool capture?","type":"multiple-choice","options":[{"text":"Query the Compliance API Activity Feed for the organization, and search its events for the passport file ID.","explanation":"The Activity Feed records activity in the Claude organization, and it does not record prompt text or model responses. The file reads happen in Haverly's own tool code and document store. So they do not appear in that feed.","correct":false},{"text":"Instruct the assistant to end each reply with a list of the files it opened, and store that list.","explanation":"A list written by the model is generated text, not a record of what the tool code did. The model can leave out a file or name the wrong one, and hidden text in an uploaded document could change the list. An audit record must come from the code that performs the action.","correct":false},{"text":"Have the tool code write an audit record for each file read, with the session ID, file ID, and time.","explanation":"On the Messages API, Haverly's application runs the tool. So the tool code is the one place that knows both which session asked and which file was read. A record that this code writes does not depend on what the model says, so every read can be traced to a session.","correct":true},{"text":"Extend how long the document store keeps its access log, and add an index on the file ID to speed up searches.","explanation":"Longer retention and faster search give Haverly more of the same records. Each record still names the single shared service login. So the log cannot show which session caused a read.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Have the tool code write an audit record for each file read, with the session ID, file ID, and time.\u003c/p>\n\u003cp>An audit record for an agent action must say \u003cstrong>who\u003c/strong> acted, \u003cstrong>what\u003c/strong> was done, \u003cstrong>which resource\u003c/strong> was touched, and \u003cstrong>when\u003c/strong>. When an agent reaches a downstream system through one shared service login, that system sees only the agent. It cannot see the person or session for whom the agent acted. The document store's log is complete, but it records the wrong level of detail to answer the privacy officer's question.\u003c/p>\n\u003cp>With a client tool on the Messages API, Claude returns a request to use the tool, and Haverly's application carries it out. At the moment of the read, that tool code holds the session identity and the file ID, so it is the correct place to write the record. Because code writes the record, a record is produced for every call. This includes calls where the model reasons incorrectly or follows hidden text in an uploaded document. Good practice is to store identifiers, not file contents, so that the audit log does not become another copy of passport data. The log should also be kept where the assistant cannot change it. Passing the session ID to the document store with each request has the same effect on the store's own log.\u003c/p>\n\u003cp>A list written by the model is not an audit record. It is output text, and it can be incomplete or wrong. Keeping the existing access log longer or indexing it does not add the missing field: every row still shows the shared login. The \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/compliance-api-access\">Compliance API Activity Feed\u003c/a> is a real audit source. However, it covers activity in the Claude organization and does not record prompt text or model responses. It cannot see a file read that happens inside Haverly's own systems.\u003c/p>\n\u003cp>The same idea appears at the workload level in \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/workload-identity-federation\">workload identity federation\u003c/a>, where a named service account lets a team tell which workload made a call. That attribution goes only as far as the workload. Attribution to a single user session inside one workload is the application's responsibility. Note also that an audit record supports investigation after an incident. Stopping one session from reading another session's upload is a separate control. It is enforced by limiting the tool's access to the session's own files.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 25; Domain: Runtime Guardrails and Production Security","answerStatus":"source"},{"query":"Hidden text in uploaded job-offer letters instructs an assistant to declare visa eligibility and promote an unapproved website. The application inserts the extracted document text into the system prompt. What risk and mitigation fit this case?","type":"multiple-choice","options":[{"text":"Classify it as misinformation. Require each reply to cite a retrieved guidance passage, and add a notice that only licensed advisers can decide eligibility.","explanation":"Misinformation describes false or unsupported output that the model produces without an attacker, and that users trust too much. In this case, instructions in the letter caused the false eligibility statement, not a gap in the guidance. A citation rule and a notice leave the hidden text in the system prompt, so the assistant can still follow it.","correct":false},{"text":"Classify it as prompt injection. Add a system prompt rule, written in all 11 languages, that instructions found inside uploaded files must not be followed.","explanation":"The risk is named correctly, and stating this policy in the system prompt is a useful extra layer. However, the letter's text would still be in the system prompt next to the rule. So the fix depends on the model choosing one instruction over the other. A new wording of the hidden text could still succeed, and nothing outside the model would block the link.","correct":false},{"text":"Classify it as prompt injection. Pass the extracted file text as tool results marked as uploaded content, and block reply links outside approved domains.","explanation":"The letter is third-party content with hidden instructions, which is indirect prompt injection. Moving the extracted text out of the system prompt and into labeled tool results removes the operator-level authority that the text had. Claude also treats instructions in tool results with skepticism. The link check runs in code, so it blocks the fraudulent website whatever the hidden text says.","correct":true},{"text":"Classify it as data and model poisoning. Rebuild the retrieval index from verified government pages, and review each monthly update before it goes live.","explanation":"Data and model poisoning is about corrupted training, fine-tuning or embedding data, such as a hostile page that enters the retrieval index. In this case, the hostile text arrived in a file uploaded during the conversation, and the index of government guidance did not change. Rebuilding and reviewing the index is good practice, but it does not affect uploaded letters.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Classify it as prompt injection. Pass the extracted file text as tool results marked as uploaded content, and block reply links outside approved domains.\u003c/p>\n\u003cp>The hidden text in the job offer letter is a case of \u003cstrong>prompt injection\u003c/strong>, one of the categories in the OWASP Top 10 for LLM Applications. This category covers inputs that change the model's behavior in ways that the operator did not intend. Anthropic's guidance separates two forms. In \u003cem>direct\u003c/em> injection, the user is the attacker. In \u003cem>indirect\u003c/em> injection, the user is honest, but the model reads third-party content (an email, a web page, text extracted from an uploaded file) that contains hostile instructions. In this case, the applicant is the victim, and the recruiter's letter is the hostile content.\u003c/p>\n\u003cp>The cause is the place where the application puts that content. The system prompt is the place for the operator's own instructions, so the model reads text copied there with the operator's authority. The documented fix is to deliver third-party content only inside \u003ccode>tool_result\u003c/code> blocks, never in the system prompt or in plain user text. The tool description or the result should also state what the content is and where it came from. Claude is trained to treat instructions inside tool results with skepticism, so this change lowers the chance that the model follows the hidden text. It does not make injection impossible. So a second control is enforced in code: the application blocks any link in a reply that is not on a list of approved domains. That check gives the same result whatever the hidden text says and whatever language it uses. A full defense adds more layers. Examples are screening extracted text with a small, fast model tier before it reaches the assistant, checking replies for eligibility statements, and keeping this letter as a red-team case (an attack test case) that a named owner runs before each release.\u003c/p>\n\u003cp>A system prompt rule against following instructions in files names the right risk, and the guidance does recommend stating such a policy. Used alone, however, it leaves the letter's text in the system prompt, and it depends on the model obeying one instruction over another. \u003cstrong>Data and model poisoning\u003c/strong> covers corrupted training, fine-tuning or embedding data. The retrieval index of government guidance was not the way the attack entered, so rebuilding it does not change what happens to uploaded letters. \u003cstrong>Misinformation\u003c/strong> covers false or unsupported output that the model produces without an attacker, and that users trust too much. Citations and a notice do not stop the assistant from following the hidden text.\u003c/p>\n\u003cp>Further reading: \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks\">Mitigate jailbreaks and prompt injections\u003c/a>.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 26; Domain: Runtime Guardrails and Production Security","answerStatus":"source"},{"query":"An LLM safety judge changed models without recalibration. With the exact same candidate answers, its detected violation rate fell from 3.1% to 0.8%, crossing the release threshold. What should the team check before shipping?","type":"multiple-choice","options":[{"text":"Make the new judge's prompt stricter until it again marks about 3.1% of the candidate's answers.","explanation":"This tunes the new judge to match one total number from the old judge, not the advisers' labels. Two judges can mark the same share of answers and still mark different answers. The tuned judge could miss real eligibility statements and mark permitted answers, and the team would not know about it.","correct":false},{"text":"Run the new judge on the 600 adviser-labeled answers, and count the labeled violations it now misses.","explanation":"The advisers' labels are the only reference that shows which answers really tell a user whether they qualify. A judge on a different model is a different measuring tool, even with the same prompt. So the team must measure its missed violations and false marks again on those labels. Only this check shows whether 0.8% means fewer violations or a judge that no longer notices them.","correct":true},{"text":"Run the new judge five times on each answer, and use the majority verdict to cancel random variation.","explanation":"A majority vote reduces random differences between runs of the same judge. The change in the score followed a move to a different model, which can cause a consistent shift, not random noise. A judge that consistently misses one kind of eligibility statement will miss it in every run, and the vote will repeat the miss.","correct":false},{"text":"Lower the gate's limit from 2% to 0.5%, so that the candidate is held to a standard as strict as before.","explanation":"A new limit assumes that the new judge marks the same kinds of answers as the old judge, only less often, and nobody has checked that. If the new judge does not recognize some eligibility statements at all, no limit will catch them. Also, the advisers' labels give no basis for the figure of 0.5%.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Run the new judge on the 600 adviser-labeled answers, and count the labeled violations it now misses.\u003c/p>\n\u003cp>An LLM judge is a measuring tool, and its accuracy belongs to one combination of prompt and model version. The agreement that the team measured last year described the old model. When the judge moves to a replacement model, that measurement no longer applies, even though the prompt is the same. The candidate's answers did not change, but the share of marked answers fell from 3.1% to 0.8%. So the judge changed its verdicts, and the team does not yet know which set of verdicts is right. This is called \u003cstrong>judge drift\u003c/strong>.\u003c/p>\n\u003cp>To find out, the team should run the new judge on the 600 answers that the advisers labeled and compare its verdicts with theirs. The team should count two kinds of error: violations that the judge misses, and permitted answers that it marks by mistake. Missed violations are the more important error for this assistant, because only licensed advisers may tell a person whether they qualify. If the new judge misses many labeled violations, the 0.8% result is not evidence that the candidate is safe. After this check, the team can revise the judge's rubric if needed, and set the release limit again from the measured error rates.\u003c/p>\n\u003cp>The other approaches each address something else. Tuning the prompt until the rate returns to 3.1% copies a total from the old judge, but the same total can come from marking different answers. Majority voting over several runs reduces random variation between runs, but a change of model can cause a consistent shift that appears in every run. Moving the limit to 0.5% assumes that the new judge behaves like the old judge, only on a smaller scale, and no one has tested that.\u003c/p>\n\u003cp>Anthropic's guidance is that teams must test LLM-based grading for reliability before they use it at scale. It also says that teams should test thoroughly with a replacement model well before a deprecated model is retired. A deprecated model still works until its retirement date, so the team can run both judges on the labeled set and compare them directly. Each model ID identifies a pinned version, so a judge that stays on one ID keeps the same model. Any change of ID is a reason to repeat the comparison with human labels. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">Define success criteria and build evaluations\u003c/a>, \u003ca href=\"https://platform.claude.com/docs/en/about-claude/model-deprecations\">Model deprecations\u003c/a>, and \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/model-ids-and-versions\">Model IDs and versions\u003c/a>.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 27; Domain: Evaluation Engineering and Quality Assurance","answerStatus":"source"},{"query":"A general-purpose adviser hand-off tool has a token that can read and modify every client's case. Hidden instructions in an uploaded file caused it to fetch another client's notes. What capability-level change prevents this misuse?","type":"multiple-choice","options":[{"text":"Log each case system request with its session ID, and alert the security team on reads of other clients' cases.","explanation":"Logging and alerts tell the team that a wrong read happened, and they help the team investigate it. However, they act after the case notes are already in the assistant's context, where the notes can appear in a reply to the user. The security lead asked for a control that prevents the read, and this one only detects it.","correct":false},{"text":"Screen each uploaded file with a small classifier model, and withhold any file that it flags as containing instructions.","explanation":"Screening untrusted content is a real and useful layer, and it will stop some injected files. However, a classifier can miss an injection, and Haverly receives files in 11 languages and many formats. When it misses one, the assistant still has a tool and a token that can read every case. So this control does not hold when the assistant follows hidden text.","correct":false},{"text":"Move the back-office token out of the code into a secrets manager, and rotate it automatically every seven days.","explanation":"A secrets manager and rotation protect the token from theft, and they shorten the time that a stolen copy works. In the test, nobody stole the token. The assistant used it through the tool as designed. A newly rotated token with the same permissions would allow the same read.","correct":false},{"text":"Replace the general tool with one that only creates a hand-off request, using a credential limited to that action.","explanation":"The tool code and the case system enforce this limit, so it does not depend on what the model decides. If hidden text controls the assistant, the only action available is creating a hand-off request, and the credential cannot read or change any case. The injection can still happen, but it can no longer reach other clients' data.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Replace the general tool with one that only creates a hand-off request, using a credential limited to that action.\u003c/p>\n\u003cp>The test showed two separate facts. First, text in an uploaded file can change what the assistant does. This is \u003cstrong>prompt injection\u003c/strong>, and no filter or instruction stops every case of it. Second, when that happens, the assistant can reach every client's case, because its tool accepts any request and its token allows any action. The OWASP Top 10 for LLM Applications calls the second problem \u003cstrong>excessive agency\u003c/strong>: the system has more functions and more permissions than its task needs.\u003c/p>\n\u003cp>The security lead asked for a control that holds when the assistant follows hidden text. Only a limit outside the model can do that. With the Messages API, Haverly's own application code runs each tool. The model only sends a tool request, and the code decides what the request may do and which credential it uses. So the team can apply \u003cstrong>least privilege\u003c/strong> (giving only the access that the task needs) in two places. First, the tool should offer one operation, creating a hand-off request, and the code should take the user's identity from the session, not from the arguments that the model sends. Second, the credential should be one that the case system accepts for that operation and nothing else. After this change, the worst result of a successful injection is an unwanted hand-off request, which an adviser can close. Anthropic's guidance gives the same advice: enable only the tools that an agent needs, and limit its access to sensitive data and actions, so that a successful injection can do little damage. See \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/secure-deployment\">Securely deploying Managed Agents\u003c/a> and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks\">Mitigate jailbreaks and prompt injections\u003c/a>.\u003c/p>\n\u003cp>The other three changes are good practice, but each one leaves the cause in place. A classifier that screens uploaded files will stop some attacks. However, it can also miss one, and files arrive in 11 languages. When it misses, the assistant still has full access to the case system. A secrets manager with weekly rotation protects the token against theft, but the test did not involve theft. The assistant used the token through the tool, and a new token with the same permissions allows the same read. Logging each request with a session ID and sending alerts helps the team detect and investigate a wrong read, but by then the case notes have already reached the assistant. Haverly can keep all three as extra layers. None of them replaces a reduction in what the tool and its credential are able to do.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 28; Domain: Runtime Guardrails and Production Security","answerStatus":"source"},{"query":"A randomized prompt test improves thumbs-up ratings, but advisers find prohibited visa-eligibility claims in highly rated answers. What evaluation should determine whether the new prompt is safe to release?","type":"multiple-choice","options":[{"text":"Extend the test by two weeks, so that the thumbs-up difference is based on more ratings before the release decision is made.","explanation":"More ratings make the thumbs-up difference more certain, but they do not change what a thumbs-up measures. Users who are told that they qualify will continue to give positive ratings. So a longer test would confirm the same misleading result.","correct":false},{"text":"Add the checklist completion rate as a second measure, and release the new prompt only if it leads on both measures.","explanation":"Checklist completion is a useful measure of whether the assistant does its main task. However, it does not record whether the assistant made an eligibility statement. So a prompt that breaks the rule could lead on both measures and still be released.","correct":false},{"text":"Grade a random sample of conversations from both prompts for eligibility statements, and require the new prompt to pass that check.","explanation":"The thumbs-up rate measures whether users liked an answer. Users like being told that they qualify, so the rate can rise because of the forbidden behavior. Grading a random sample from both prompts measures the rule directly on live traffic, and it shows whether the new prompt breaks the rule more often than the current one. When that rate is a release condition, a higher thumbs-up rate cannot justify a prompt that breaks the rule.","correct":true},{"text":"Add an instruction against eligibility statements to the new prompt, and continue the test with thumbs-up as the deciding measure.","explanation":"The instruction may reduce the statements, but the test still would not measure them, so nobody would know how many remain. Thumbs-up would also continue to reward any eligibility statement that the assistant still makes. Also, ratings collected before and after the edit would describe two different prompts.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Grade a random sample of conversations from both prompts for eligibility statements, and require the new prompt to pass that check.\u003c/p>\n\u003cp>An online metric is useful only if it rises when the product does what it should. A thumbs-up records whether the user liked the answer. For most assistants that is close to quality. However, this assistant has a rule that conflicts with what users want: it must not tell anyone whether they qualify for a visa. A user who reads &quot;you should qualify&quot; is pleased and gives a thumbs-up. So the new prompt's seven-point lead may come partly from the behavior that only licensed advisers are allowed to perform.\u003c/p>\n\u003cp>The standard design for an \u003cstrong>A/B test\u003c/strong> (two variants on randomly assigned live traffic) is to choose one primary metric and one or more \u003cstrong>guardrail metrics\u003c/strong>. A guardrail metric is a measure that must not get worse, even when the primary metric improves. The guardrail for this assistant is the rate of eligibility statements. User ratings cannot provide it, so the team has to measure it directly. It should take a random sample of conversations from each prompt and grade each one for an eligibility statement. The grading should use an LLM judge that has been checked against advisers' labels, with advisers reviewing part of the sample. The adviser's few conversations prove that the problem exists. Only a random sample from both prompts shows how often it happens and whether the new prompt is worse than the current one.\u003c/p>\n\u003cp>Running the test longer makes a number more precise, but the number measures the wrong thing. Checklist completion is a good measure of tas
