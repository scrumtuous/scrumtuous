ated anyway.\u003c/p>\n\u003cp>The other actions each repair less than this. A new prompt line that cancels the rule leaves the old summary in the context. The result then depends on which text the model follows, and the 300 closed mismatches stay closed. Running compaction again builds the new summary from a context that still contains the old one, so the wrong conclusions are likely to be carried forward. Starting a new audit from the beginning does give a correct result. But it repeats 20 hours of valid work at full cost, when a saved state from before the edit is available. A full restart is the right choice only when no such saved state exists.\u003c/p>\n\u003cp>After the run is recovered, the incident should become a test and a process change. The team can add a regression task in which a device is missing from the monitoring database but is still in service. The correct outcome is that the agent proposes no deletion. Anthropic's guidance on \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">defining success criteria and building evaluations\u003c/a> recommends test cases that reflect real tasks and include edge cases, and this incident supplies one. The team should also apply prompt changes at the start of a run or from a saved state, not in the middle of a run. And it should review again the proposals that the agent made after hour 22.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 60; Domain: Advanced Debugging and Incident Response","answerStatus":"source"},{"query":"Three database lookups run in parallel, but the harness assigns results to calls in completion order. Some proposed corrections swap data between systems. What is the failure and how should results be matched?","type":"multiple-choice","options":[{"text":"The origin is the data, which changes between the run and the rerun. Take a snapshot of all three databases before each run.","explanation":"A snapshot makes a run and a rerun easier to compare, and data can change during a two-day audit. However, the failing traces show results attached to the wrong calls inside a single turn. A snapshot would not change how the harness pairs results with calls.","correct":false},{"text":"The origin is the harness, which pairs results with calls by arrival order. Match each result to its call by the call's ID.","explanation":"The agent made the correct three calls. However, whenever the responses arrived out of order, the harness gave the agent one database's record under another database's call. Each tool result must carry the ID of the call it answers. Pairing results with calls by ID removes the fault, and the lookups can still run at the same time. Response timing changes between runs, and that is why the reruns mostly succeed.","correct":true},{"text":"The origin is the model, which confuses three results in one turn. Turn off parallel tool calls so each turn makes one lookup.","explanation":"The traces show that the model received wrongly labeled results, so the fault was not in its reasoning from them. One lookup per turn would stop the swap from happening. However, the pairing fault would stay in the harness, and a run of about 6,000 tool calls would take longer.","correct":false},{"text":"The origin is the lookup tools, whose descriptions are too similar. Rewrite them so that each one names its database clearly.","explanation":"Clearer descriptions help when an agent chooses the wrong tool or the wrong arguments. In the failing traces, the agent called the correct tool for each of the three databases. The results were swapped after the tools returned them.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> The origin is the harness, which pairs results with calls by arrival order. Match each result to its call by the call&#x27;s ID.\u003c/p>\n\u003cp>When Claude asks for several tools in one turn, the response contains several \u003ccode>tool_use\u003c/code> blocks, and each block has its own ID. The API does not decide whether the application runs those calls one after another or at the same time. The harness makes that choice. The API does require one \u003ccode>tool_result\u003c/code> for each call. All the results must be returned together in the next user message, and each result must carry the \u003ccode>tool_use_id\u003c/code> of the call it answers. The ID is the only thing that tells the model which result belongs to which call. See \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/parallel-tool-use\">Parallel tool use\u003c/a> and \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls\">Handle tool calls\u003c/a>.\u003c/p>\n\u003cp>Copperline's harness ran the three lookups concurrently (at the same time). This is a reasonable way to save time in a run with about 6,000 tool calls. The fault is in the next step. The harness gave the first result that arrived to the first call, the second result to the second call, and so on. When the databases answered in the same order as the calls, the pairing was correct by chance. When one database answered late, the agent received that database's record under another database's call. All three records described the same device, so nothing in the content showed the swap. The agent then reasoned correctly from wrongly labeled evidence and proposed to overwrite the correct value.\u003c/p>\n\u003cp>This also explains why the failure looks random. The order of arrival depends on how fast each database responds, and that changes from one run to the next. The source is not the model's own variation from run to run. A failure that appears on some runs and not on others can still have a deterministic cause (one that always produces the same result from the same conditions) in the harness. The traces are where the team can see it: for each call ID, compare what the tool returned with what the model was given.\u003c/p>\n\u003cp>The fix is to keep each call's ID together with its lookup inside the harness and to write that ID into the result, in whatever order the results arrive. A test that delays one database's response on purpose would confirm the fix and protect against the same fault in the future.\u003c/p>\n\u003cp>Each of the other changes improves something, but the cause stays in place. Turning off parallel tool calls would prevent the swap, because a single call per turn cannot be paired with the wrong result. However, the run would become slower, and the pairing fault would stay in the harness and would come back with any later change that runs calls concurrently again. Rewriting tool descriptions helps when an agent picks the wrong tool, and this agent picked the correct three. A database snapshot makes reruns comparable, but the mismatch between calls and results happens inside one turn, and the data did not change during that turn.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 61; Domain: Advanced Debugging and Incident Response","answerStatus":"source"},{"query":"After compaction, an audit agent repeats previously finished mismatches without tool errors, doubling cost and delaying completion. What efficiency metric would detect repeat work early?","type":"multiple-choice","options":[{"text":"For each run, read total cost from the organization's usage and cost reports, and alert when it passes the usual cost of a run.","explanation":"This alert is raised only after the run has already spent the budget of a full run. That can be many hours or days after the repeated work began. Also, the data in the organization's usage and cost reports is not real-time and can arrive hours after the requests. The alert confirms the overspend, but it does not meet the goal of detection within an hour or two.","correct":false},{"text":"For each hour of a run, record input and output tokens used, and alert when the hourly total rises above its usual range.","explanation":"The agent worked at its normal pace, so each hour used about the same number of tokens as a healthy hour. An hourly token total measures how busy the agent is, not whether the work is new. This alert would not have been triggered at any point in the incident.","correct":false},{"text":"For each compaction in a run, record token counts before and after, and alert when compactions become more frequent than in past runs.","explanation":"Compaction happens when the context fills. The context filled at the usual rate, because the agent used tokens at its normal pace. So the number of compactions per hour would look normal while the agent repeated work. Compaction records help a later investigation find out what a summary lost, but they do not detect the repeated work.","correct":false},{"text":"For each hour of a run, record tokens used and mismatches closed for the first time, and alert when their ratio rises sharply.","explanation":"This alert relates cost to completed work, and that relationship is the only thing that changed during the incident. When the agent repeats finished investigations, first-time closures fall toward zero while token use continues. Tokens per new closure therefore rise far above the baseline within the hour. The alert is raised during the run, when engineers can still stop or correct it.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> For each hour of a run, record tokens used and mismatches closed for the first time, and alert when their ratio rises sharply.\u003c/p>\n\u003cp>A long-running agent can use tokens at a normal rate while it makes no progress. That happened in this run. The agent repeated investigations that it had already finished, so each hour looked like any other hour. Signals that measure activity, such as tokens per hour, tool calls per hour or tool error rate, cannot tell useful work from repeated work.\u003c/p>\n\u003cp>The signal that does change is an \u003cstrong>efficiency indicator\u003c/strong>: cost divided by completed work. A service level indicator (SLI) is a measured value that shows whether a service is doing its job. For this agent, a good SLI is \u003cem>tokens per mismatch closed for the first time\u003c/em>. It is important to count only first-time closures. If the count included every closure, the repeated closures would keep the ratio normal. When the agent starts to repeat work, new closures fall toward zero within the hour while token use continues. The ratio then rises far above the baseline taken from past runs, and an alert can be raised while the run is still in progress. The token counts come from the usage data of each response. The team can record them in its own telemetry together with the run ID. See \u003ca href=\"https://code.claude.com/docs/en/monitoring-usage\">Monitoring\u003c/a> for the token and cost signals that are available through OpenTelemetry.\u003c/p>\n\u003cp>Each of the other designs measures something real, but not the cause. An alert on hourly tokens is not triggered, because the hourly total did not change. An alert on compaction frequency is also not triggered, because compaction happens when the context fills, and the context filled at the usual rate. An alert on total run cost from the organization's usage and cost reports does detect the overspend. However, it does so only after the run has already used the budget of a full run, and that report data can arrive hours after the requests (see the \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/usage-cost-analytics-api\">Usage and Cost Analytics API\u003c/a>). Those reports are meant for historical analysis and for assigning costs, not for alerts during a run.\u003c/p>\n\u003cp>For agents that run for hours or days, the general rule is to monitor progress as well as spending. Define the unit of completed work (a mismatch closed, a ticket opened, a document tagged). Measure the cost per unit over short time windows, and raise an alert when it moves away from the baseline.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 62; Domain: Observability and Production Monitoring","answerStatus":"source"},{"query":"An audit agent delegates mismatch investigations to isolated subagents, but a crucial rule about which database is authoritative exists only in the parent system prompt. Subagents now propose incorrect corrections. What should change at delegation time?","type":"multiple-choice","options":[{"text":"Return mismatch investigation to the audit agent, and rely on compaction to control the size of its context.","explanation":"The rule would apply again, because the audit agent would write every proposal with its own system prompt in context. However, the raw results of about 6,000 tool calls would return to the audit agent's context, and that is the problem the delegation was meant to solve. More frequent compaction also increases the chance that a summary drops details of earlier mismatches.","correct":false},{"text":"Have the audit agent include the port-assignment rule in the task that it writes for each subagent.","explanation":"A subagent starts with its own context. It does not receive the parent agent's system prompt or conversation history. The task that the parent writes is the only content that passes from the parent to the subagent, so the rule must be in that task. The investigation still runs inside the subagent, so the raw tool results stay out of the audit agent's context.","correct":true},{"text":"Move the port-assignment rule to the top of the audit agent's system prompt and mark it as critical.","explanation":"This changes how much weight the audit agent itself gives the rule. However, the subagents do not receive the audit agent's system prompt. Each subagent would still see only the mismatch ID and the three records, so its proposals would not change.","correct":false},{"text":"Add a reviewer subagent that checks each proposed correction before it is sent to the engineers.","explanation":"A reviewer subagent also starts with only the task it is given, so it would not know the rule unless the rule were passed to it. It adds another model run for every correction, and it checks the output only after the work is done. Meanwhile, the investigating subagents still do not have the information they need.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Have the audit agent include the port-assignment rule in the task that it writes for each subagent.\u003c/p>\n\u003cp>A subagent is a \u003cstrong>separate agent instance\u003c/strong>. It has its own context window, its own system prompt and its own set of tools. It does not receive the parent agent's conversation history, the parent's tool results or the parent's system prompt. In the Claude Agent SDK, the only content that passes from the parent to a normal subagent is the task prompt that the parent writes when it delegates. This isolation is the reason that delegation keeps thousands of raw tool results out of the audit agent's context. It also means that an instruction that exists only in the parent's system prompt never reaches the subagent.\u003c/p>\n\u003cp>That is what happened in the audit. Each subagent received a mismatch ID and three conflicting records. Nothing in that task said which database takes priority for port assignments. Without the rule, a subagent chooses a value from the records alone, and its choice often goes against the provisioning database. The fix is to put the rule where the subagent can read it: in the task that the audit agent writes for each mismatch. A good delegation task states the goal, the rules and limits that apply, and the output format that the parent expects. If a rule applies to every investigation, the team could also put it in the subagent's own definition, because that definition becomes the subagent's system prompt. See \u003ca href=\"https://docs.claude.com/en/api/agent-sdk/subagents\">Subagents in the SDK\u003c/a> for what a subagent does and does not inherit.\u003c/p>\n\u003cp>Giving the rule more emphasis in the audit agent's system prompt changes nothing for the subagents, because they never see that prompt. Moving the investigations back into the audit agent would restore the rule. However, it would also bring the raw tool results back into one context, with more compaction and higher input cost, on a run that already costs twice as much as before. A reviewer subagent has the same missing information as the investigators, because it knows only what its task tells it. It would also add a model run for every correction, and it would check the result after the work is done, but the cause is missing information at the start of the work.\u003c/p>\n\u003cp>When a team splits work across agents, it should decide, for each rule or fact, which agent needs it. Then it should pass that rule or fact to the subagent on purpose when it delegates. Context isolation keeps unneeded content out of the parent's context. But it also keeps out everything the parent knows, unless the parent writes it into the task.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 63; Domain: Advanced Agent Architecture and Orchestration","answerStatus":"source"},{"query":"A code-compliance assistant's release evaluation contains only questions with definite answers. A new prompt scores higher offline but invents confident load values for cases the code does not address. How should the evaluation set be expanded?","type":"multiple-choice","options":[{"text":"Run each golden question three times, and pass a release only when all three answers are rated correct.","explanation":"Repeated trials show whether the assistant answers a question correctly every time. This helps when results change between identical runs. The production failure is not random variation, because the new prompt gives firm answers every time. All three runs on answerable questions would pass, and the suite would still contain no question that the codes leave unsettled.","correct":false},{"text":"On the 300 golden questions, add a groundedness check that verifies each cited section supports the value.","explanation":"A groundedness check is a useful addition, because it would catch values on the answerable questions that the cited section does not support. However, it would run on the same 300 questions, and none of them is a question that the codes leave open. The failure seen in production would still have no test case, so the release would pass again.","correct":false},{"text":"Re-check the judge against senior engineers' labels on a sample of golden answers before each release.","explanation":"Checking the judge against human labels is good practice, and a judge should not decide releases without this check. In this case, the judge's verdicts on the 300 answers are not the cause, because the assistant probably did answer more of those questions correctly. A well-calibrated judge would report the same rise, because the set has no question where a firm answer is the wrong behavior.","correct":false},{"text":"Add questions that the codes do not settle, and require the gate to pass on each group separately.","explanation":"The golden set contains only questions with a definite answer, so a prompt that makes the assistant more direct can only gain points on it. The team should add questions that the codes do not settle, with the expected answer that the codes leave them open. Then the suite has cases where a firm value is wrong. Scoring the two groups separately prevents a large gain on answerable questions from hiding a drop on the unsettled ones.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Add questions that the codes do not settle, and require the gate to pass on each group separately.\u003c/p>\n\u003cp>An evaluation set that tests a behavior in only one direction rewards any change that moves the system in that direction. All 300 golden questions have a definite answer, so the suite could measure only one case: \u003cem>did the assistant give the right value when one exists\u003c/em>. It could not measure the opposite case: \u003cem>did the assistant say that the codes do not settle the question when that is true\u003c/em>. A prompt that makes the assistant more direct gains points on the first kind of question and loses nothing, because the second kind is missing. The rise from 84% to 91% was probably real for answerable questions. The suite had a \u003cstrong>coverage gap\u003c/strong>, and the release gate (the automated check that a change must pass before release) could not detect the harm.\u003c/p>\n\u003cp>The fix is a \u003cstrong>balanced set\u003c/strong>: it has cases where a behavior should occur and cases where it should not. The team should add questions that the codes leave open, with the expected answer that the codes do not settle them. It should also report the two groups separately. A single combined score is risky, because the unsettled group will be small. A prompt could fail most of the unsettled questions and still raise the overall number. Anthropic's guidance on \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">defining success criteria and building evaluations\u003c/a> says that evaluations should match the real distribution of tasks. It also says they should include edge cases, such as input data that does not exist and ambiguous cases. The guidance on \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations\">reducing hallucinations\u003c/a> recommends allowing Claude to say that it does not have enough information. For this assistant, that behavior is a product requirement, so it needs its own test cases.\u003c/p>\n\u003cp>The other three changes are real improvements, but each one keeps the same 300 answerable questions. A groundedness check would find unsupported values on those questions, but no question in the set is one that the codes leave open. Running each question three times measures consistency between identical runs. The new prompt is direct every time, so all three runs would pass. Checking the judge against the senior engineers' labels confirms that the judge's verdicts can be trusted. However, a trustworthy judge would report the same rise in score on this set. When a release passes the gate and then fails in production on a kind of input that the set does not contain, the first fix is to add that kind of input to the set.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 64; Domain: Evaluation Engineering and Quality Assurance","answerStatus":"source"},{"query":"When the retrieval index times out, an engineering-code assistant calls Claude without source chunks and invents load values and citations. What failure behavior should replace this fallback?","type":"multiple-choice","options":[{"text":"When retrieval fails, skip the model call, tell the engineer the code documents are unavailable, and open a circuit breaker on the index.","explanation":"Without retrieved passages, the assistant has no code section to cite, so the only reply that meets the citation requirement is a clear statement that the documents cannot be reached. The service code makes this decision, so it does not depend on how the model behaves. The circuit breaker stops new queries to the failing index for a period, so engineers get this message quickly and are not left waiting for timeouts.","correct":true},{"text":"Keep the fallback, but show each reply to the engineer only after the LLM judge has rated that reply as a correct answer.","explanation":"During an outage the judge has no retrieved passages either, so it can only compare the reply with its own general knowledge. A load value with a plausible but invented section number can pass that check. The reply would still have no real source behind its citation.","correct":false},{"text":"Keep the fallback, and add a system prompt rule that Claude must say the codes do not settle the question whenever no chunks are provided.","explanation":"This reports an infrastructure failure as a finding about the codes. An engineer who reads that the codes do not settle a question may use their own judgment for a load value that the code does specify. It also relies on the model following an instruction, when the service already knows that retrieval failed and can decide in code.","correct":false},{"text":"Retry each failed retrieval call up to ten times with exponential backoff, and raise the retrieval timeout from 5 seconds to 30 seconds.","explanation":"Retries with backoff help when a failure lasts a few seconds. This outage lasted 40 minutes, so every retry would fail, each engineer would wait much longer, and the extra queries would add load to an index that is being rebuilt. The fallback that sends questions with no chunks would still run after the last retry.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> When retrieval fails, skip the model call, tell the engineer the code documents are unavailable, and open a circuit breaker on the index.\u003c/p>\n\u003cp>\u003cstrong>Graceful degradation\u003c/strong> means that when a dependency fails, the service gives a reduced result that is still honest. What counts as an acceptable reduced result depends on the product's requirements. For this assistant, every answer must cite a code section. With no retrieved passages there is nothing to cite, so the only acceptable reduced result is a message that the code documents cannot be reached at the moment. A reply with load values from the model's general knowledge is not a weaker version of the product. It breaks the main requirement, and the invented section numbers show the result.\u003c/p>\n\u003cp>The error handler failed because it treated two different situations as one. A retrieval call that \u003cem>fails\u003c/em> is different from a retrieval call that \u003cem>succeeds\u003c/em> and returns passages that do not answer the question. The assistant has three possible states: passages were found and support an answer, passages were found but the codes do not settle the question, and retrieval could not run. The third state is a fact about the infrastructure, and the service code already knows it from the timeout. The service should make that decision in code and skip the model call, because a prompt instruction can be ignored and code cannot.\u003c/p>\n\u003cp>A \u003cstrong>circuit breaker\u003c/strong> is a counter around a dependency. After a number of failures in a row it opens, and the service stops calling the dependency for a period and returns the fallback message at once. From time to time it sends one test request, and it closes again when the dependency answers. During a 40-minute rebuild, this means engineers see the unavailable message in under a second and the index receives almost no traffic while it recovers.\u003c/p>\n\u003cp>The other approaches each fix part of the problem. Telling Claude to say that the codes do not settle the question removes the invented values, but it gives engineers a false statement about the codes. Using the LLM judge as a filter adds a second model opinion with no source passages, so it cannot confirm a citation. More retries and a longer timeout suit short failures, which is why the Anthropic SDKs retry connection errors, rate limits and server errors only a small number of times by default, as described in \u003ca href=\"https://platform.claude.com/docs/en/api/errors\">Errors\u003c/a>. They do not help with an outage of many minutes. The same principle of handling each outcome in its own way applies to model responses, as shown in \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons\">Handling stop reasons\u003c/a>.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 65; Domain: Production Integration, Reliability, and Knowledge Grounding","answerStatus":"source"},{"query":"After new building-code editions were indexed, answer accuracy dropped. Engineers disagree whether retrieval returns incomplete tables or the model misreads complete ones. How should the evaluation separate those failure modes?","type":"multiple-choice","options":[{"text":"Report the weekly correct rate separately for each state, and compare the 12 states with new editions against the other 38 states.","explanation":"This breakdown would show whether the drop is mostly in the states with new code editions, which is useful to know. However, it does not show why answers in those states are wrong. New documents could produce tables that retrieval splits, or tables that the model misreads. Both explanations are still possible after this change.","correct":false},{"text":"Raise the sample from 3% to 15% of live answers, so that a change in the weekly correct rate can be told apart from random variation.","explanation":"A larger sample makes the weekly correct rate more stable. This helps confirm that the drop from 90% to 82% is real. However, it still produces one number that counts retrieval failures and reading failures as the same event. The engineers would have a more precise figure and the same disagreement.","correct":false},{"text":"Check that each sampled answer cites a code section that exists, and report that citation rate next to the weekly correct rate.","explanation":"A citation check confirms that answers refer to real code sections, which the firm requires. However, an answer can cite a real section and still give a wrong load value. That can happen whether retrieval returned half of a table or the model misread a complete one. So the citation rate does not separate the two causes.","correct":false},{"text":"Grade each sampled answer in two parts: whether the retrieved chunks held the needed table, and whether the answer follows them.","explanation":"The single correct rate mixes the two possible causes together, and this change separates them. Suppose wrong answers mostly come from requests where the full table was not retrieved. Then the cause is retrieval and the 300-token chunking. If the full table was retrieved and the answer still disagrees with it, the cause is how the model reads the table.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Grade each sampled answer in two parts: whether the retrieved chunks held the needed table, and whether the answer follows them.\u003c/p>\n\u003cp>An answer that is based on retrieved text can be wrong for two different reasons. The retrieval pipeline may fail to return the text that contains the answer. Or the model may receive the right text and still state something that the text does not support. A single correct rate counts both failures as the same event. It can show that quality fell, but not why.\u003c/p>\n\u003cp>The fix is to measure each step separately on the same sample of live answers. The first check asks whether the retrieved chunks contained the complete table or section that the question needs. This is a \u003cstrong>retrieval\u003c/strong> measure. The second check asks whether the answer agrees with the chunks that the model received. This is a \u003cstrong>groundedness\u003c/strong> measure. Ashgrove's pipeline cuts text into 300-token chunks that often split a load table, so the first check tests the retrieval explanation directly. If most wrong answers come from requests where only half of a table was retrieved, the team should change the chunking. If the tables arrived complete and the answers still disagree with them, the team should work on how the model reads tables. Anthropic's guidance on \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">defining success criteria and building evaluations\u003c/a> recommends several specific, measurable criteria that match the task, instead of one general quality score. The \u003ca href=\"https://platform.claude.com/docs/en/about-claude/use-case-guides/customer-support-chat\">customer support guide\u003c/a> also lists accuracy against the provided context and citation relevance as separate quality metrics.\u003c/p>\n\u003cp>This measurement needs the retrieved chunks to be stored with each answer. \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/opentelemetry\">OpenTelemetry tracing\u003c/a> for the Claude API can record the full content of prompts and responses when a team turns that mode on. The default mode records only metadata, such as timing, status and token counts. With full content recording on, the chunks that the application places in the prompt are part of the recorded content, and the team can build evaluations from that real traffic.\u003c/p>\n\u003cp>Each of the other changes improves the measurement, but the disagreement stays open. A larger sample makes the correct rate more stable from week to week, but it is still one number that mixes both failures. A correct rate for each state shows whether the drop is mostly in the 12 states with new editions. However, new documents could cause either split tables or misread tables. A citation check confirms that answers refer to a real code section. However, an answer can cite a real section and still give a wrong load value, whichever step caused the error.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 66; Domain: Evaluation Engineering and Quality Assurance","answerStatus":"source"},{"query":"An in-place prompt edit rolled out at different times on different servers and caused incorrect citations. Engineers cannot tell which past answers used the edited version. What prompt versioning and logging practice would enable an audit?","type":"multiple-choice","options":[{"text":"Have the judge rate the logged answers again after an incident, and re-check designs behind answers it rates incorrect.","explanation":"The judge rated the affected answers as correct when they were produced, because it rates correctness and not whether a section is cited. Rating the same answers again would most likely give the same ratings. It also still would not show which prompt produced each answer.","correct":false},{"text":"Save each prompt as a numbered version that is never edited, and log that number with every answer it produces.","explanation":"The server that produced each answer writes the version number with it. This links each answer to one fixed prompt text, even while different servers run different prompts. The team can then list all answers from a faulty version with one log query. Numbered versions are never edited, so the earlier text also stays available for a rollback.","correct":true},{"text":"Require a second developer to approve each prompt edit, and run the evaluation set through the judge before release.","explanation":"A second approval and an evaluation run reduce the chance that a bad edit is released, which is useful. However, they do not record which prompt produced each answer, so they cannot find affected answers when a bad edit is released anyway. The evaluation run also depends on the judge, and the judge rated these answers as correct.","correct":false},{"text":"Record the time of each prompt edit in a change log, and match every answer to a prompt by its timestamp.","explanation":"A change log shows when an edit was made, but the servers reload the prompt at different times. For two days after each edit, answers from the old prompt and the new prompt are mixed. So a timestamp cannot show which prompt produced a given answer.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Save each prompt as a numbered version that is never edited, and log that number with every answer it produces.\u003c/p>\n\u003cp>A prompt is part of the production system, so a change to it needs the same record keeping as a code change. The most useful record is a link between each output and the prompt text that produced it. A team gets that link by treating every prompt as an \u003cstrong>immutable version\u003c/strong>: once a version has a number, its text is never edited, and any change creates a new number. Each server then writes the number of the version it loaded into the log entry for every answer. After a bad change, one query on the log returns all answers from the faulty version. The earlier version still exists without changes, so the team can return to it (a rollback) without having to rewrite the text from memory.\u003c/p>\n\u003cp>This is important for Ashgrove, because structural designs depend on the answers. When a prompt change removes section citations, the firm has to find every affected answer, not only stop new ones. Two facts in the incident show why weaker records fail. First, the servers reload the prompt at different times. So for two days after any edit, some answers come from the old text and some come from the new text. A change log with edit times cannot separate those answers. Only a version number written by the server that produced the answer can do that. Second, the judge rated the affected answers as correct, because it rates correctness and not whether a section is cited. If the team asked the same judge to rate the logged answers again, the judge would most likely give the same ratings and miss the same answers.\u003c/p>\n\u003cp>A second approver and an evaluation run before release are good controls, and they reduce the number of bad edits that reach engineers. However, they act before release, so they do not help the team find affected answers when a bad edit is released anyway. The evaluation run also depends on the same judge that did not detect this failure. Version records and release checks work together. The guidance on how to \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">define success criteria and build evaluations\u003c/a> describes comparing a change against a baseline or an earlier version. That comparison is possible only when the earlier version is stored and can be identified by name.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 67; Domain: Production Integration, Reliability, and Knowledge Grounding","answerStatus":"source"},{"query":"Correct load values sometimes cite the wrong building-code section because retrieved table chunks lack their section heading. How should indexing and citations preserve the source section?","type":"multiple-choice","options":[{"text":"Add a system prompt rule that Claude may cite a section number only when that exact number appears in a retrieved chunk.","explanation":"The wrong numbers came from text inside the retrieved chunks, such as cross-references and the headings of other chunks. So this rule would accept them. The rule also works only if the model follows it. And it does not give Claude the correct section for a chunk taken from the middle of a table.","correct":false},{"text":"Raise the overlap between neighboring chunks to 50% so that more chunks carry the heading of the section they belong to.","explanation":"More overlap helps only the chunks that are next to a heading. A large table covers many 300-token chunks, so after the change, the chunks in the middle of the table still contain no heading. The index becomes larger, but those chunks still have no section number.","correct":false},{"text":"Add a second Claude call that checks each cited section against the retrieved chunks and removes any citation that it cannot confirm.","explanation":"A checking call reads the same chunks as the first call, and those chunks do not contain the correct section for the table rows. It may confirm a cross-referenced number, because that number is in the text. When it removes a citation, the answer no longer meets the requirement to cite the code section.","correct":false},{"text":"Store each chunk's section number at indexing time, pass chunks as citable search results, and display the cited chunk's section.","explanation":"The indexing job knows which section every chunk came from. So it can record that section with the chunk, even when the chunk text has no heading. When chunks are passed as search results with citations turned on, each citation points to the result that supports the statement. The application can then show the section stored for that result. Claude no longer has to write the section number, and that is the step that failed.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Store each chunk&#x27;s section number at indexing time, pass chunks as citable search results, and display the cited chunk&#x27;s section.\u003c/p>\n\u003cp>A code section number is a fact about where a chunk came from. It is not always part of the chunk's text. A heading appears once at the start of a section, and a large load table can cover many 300-token chunks. So most chunks from that table contain rows of values and no heading. When Claude must write the section number itself, it can use only what it sees: a cross-reference inside the rows, or the heading of a different retrieved chunk. The result is a correct value with a wrong citation.\u003c/p>\n\u003cp>The indexing job does know where every chunk came from. It can record the state, the code and the section number as \u003cstrong>metadata\u003c/strong> when it creates the chunk. At query time, the application passes each retrieved chunk to Claude as a \u003cstrong>search result\u003c/strong> block. The stored section goes in the block's source and title, and citations are enabled. Citations are off by default, and they must be enabled on all search results in a request or on none of them. Claude then attaches citations that point to the results its statements are based on, together with the cited text. The application reads which result was cited and displays the section stored for it. The section number that the engineer sees now comes from the index, and Claude does not have to write it. See \u003ca href=\"https://docs.anthropic.com/en/docs/build-with-claude/search-results\">Search results\u003c/a> and \u003ca href=\"https://docs.anthropic.com/en/docs/build-with-claude/citations\">Citations\u003c/a>.\u003c/p>\n\u003cp>This control has a limit. It makes the displayed section agree with the chunk that Claude cited. It does not make retrieval find the right chunk, and it does not repair a table that was cut in half. Those are separate problems in chunking and retrieval, and the team should measure them separately.\u003c/p>\n\u003cp>The other changes do not remove the cause. A prompt rule that allows only numbers found in the retrieved chunks would accept the wrong numbers, because the cross-references and the other chunks' headings are part of the retrieved text. A 50% overlap adds the heading to chunks near the start of a section, but chunks in the middle of a large table still have no heading. A second Claude call that checks citations reads the same chunks, so it has no source for the correct section. It may confirm a cross-referenced number. Also, each citation that it removes leaves an answer that breaks the rule that every answer cites a code section.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 68; Domain: Production Integration, Reliability, and Knowledge Grounding","answerStatus":"source"},{"query":"Two human reviewers agree on 82% of answers, and an LLM judge agrees with one reviewer on 84%. Most labels are 'correct.' What agreement analysis is needed before trusting the judge as a release gate?","type":"multiple-choice","options":[{"text":"Have a third senior engineer label the same 300 answers, and use the majority label as the reference for the judge.","explanation":"A third rater settles each disputed answer by vote, but it does not test whether 82% and 84% show real agreement or mostly chance agreement. If the engineers apply different definitions of a correct answer, the majority label keeps that ambiguity. The team still needs a chance-corrected measure before it can make any claim about the judge.","correct":false},{"text":"Measure the judge on the 246 answers on which both engineers agree, and require at least 90% agreement on that subset.","explanation":"About 93% of the answers the engineers agree on are labeled correct, so a judge that marks every answer correct would pass a 90% requirement on that subset. This approach also removes the 54 disputed answers, which are the difficult ones the judge most needs to handle. The result would look strong without showing that the judge can find incorrect answers.","correct":false},{"text":"Run the judge three times on each of the 300 answers, and compare its majority verdict with the first engineer's labels.","explanation":"Repeated runs reduce the random variation in the judge's verdicts, which is useful when verdicts change between identical runs. The lead's claim does not fail because of random variation. A stable judge that marks almost every answer correct would still reach about 85% raw agreement with an engineer.","correct":false},{"text":"Calculate Cohen's kappa for the two engineers and for the judge against each engineer, and compare those values.","explanation":"Each engineer marks about 85% of the answers as correct, so two raters would agree on about three quarters of the answers by chance alone. Cohen's kappa removes that chance agreement. It shows that the engineers' 82% is only weak agreement, and it tests whether the judge's 84% reflects any real ability to find incorrect answers.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Calculate Cohen&#x27;s kappa for the two engineers and for the judge against each engineer, and compare those values.\u003c/p>\n\u003cp>Raw agreement is misleading when one label is much more common than the other. Each engineer marks about 85% of the answers as correct. Two raters who gave labels at random with those rates would both say &quot;correct&quot; on about 72% of answers and both say &quot;incorrect&quot; on about 2%, so they would agree on about 74.5% by chance. \u003cstrong>Cohen's kappa\u003c/strong> measures how far the observed agreement is above that chance level: (observed agreement minus chance agreement) divided by (1 minus chance agreement). For the two engineers this gives (0.82 - 0.745) / 0.255, which is about 0.29. That is a low value. The same reasoning applies to the judge. A judge that marks \u003cem>every\u003c/em> answer correct would agree with either engineer on about 85% of answers, which is more than the real judge's 84%, and its kappa would be 0. The lead's comparison of 84% with 82% therefore says nothing yet about reliability.\u003c/p>\n\u003cp>A low kappa between the two engineers also tells the team that the engineers do not share one definition of a correct answer. The human labels are not yet a firm reference. The usual next step is for the engineers to review the 54 disputed answers together, write the rules they agree on into the judge's rubric (for example, how to label an answer that says the codes do not settle the question), and then measure the judge against the agreed labels with kappa again. Anthropic's guidance on LLM-based grading says to test a grader for reliability before using it at scale, and to give it a detailed rubric with a fixed output such as correct or incorrect. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">Define success criteria and build evaluations\u003c/a> and the \u003ca href=\"https://platform.claude.com/cookbook/misc-building-evals\">Building evals cookbook\u003c/a>.\u003c/p>\n\u003cp>The other actions each improve something, but none of them tests the claim. A third engineer and a majority vote produce one label per answer, but they do not show whether the raters agree more than chance, and they keep the unclear definition of &quot;correct&quot;. Measuring only on the 246 agreed answers removes the difficult cases, and about 93% of those answers are labeled correct, so a judge with no ability to find errors would pass a 90% requirement. Running the judge three times reduces random variation between runs, but the comparison is still raw agreement on a set where most answers are correct, so the result has the same weakness.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 69; Domain: Evaluation Engineering and Quality Assurance","answerStatus":"source"},{"query":"An engineering-code assistant gives specific load values for cases beyond a table's coverage, then cites that table as evidence. How should it handle values that are not supported by any retrieved passage?","type":"multiple-choice","options":[{"text":"Require the assistant to quote the passage that supports each value, and to say when no retrieved passage covers the case.","explanation":"A quote requirement links every value to text that is present in the retrieved chunks. When the case is beyond the table, there is no row to quote. So the allowed response is to state that the codes do not settle the question. This reduces invented values and meets both of Ashgrove's answer requirements.","correct":true},{"text":"Set a minimum similarity score for retrieved chunks, and report that the codes do not cover the case when no chunk reaches it.","explanation":"A similarity score measures how close a chunk is to the topic of the question, not whether the chunk contains the answer. In these cases, the chunks came from the correct table, so they would score high and the threshold would not be triggered. A stricter threshold would also block valid answers on other questions.","correct":false},{"text":"Ask the assistant to rate its confidence in each value from 1 to 10, and replace answers rated below 7 with a notice for the engineer.","explanation":"A confidence number that the model reports about its own answer is not a check against the source text. A model that has just estimated a value from a closely related table can still give itself a high rating. So the rating does not reliably separate supported values from unsupported ones.","correct":false},{"text":"Pass twice as many retrieved chunks to the assistant so that a passage covering the engineer's case is more likely to be included.","explanation":"More chunks help when the answer exists in the index but was ranked too low to be passed to the model. In these 17 answers, the codes do not cover the case, so there is no such passage to retrieve. The extra chunks would add more related text from which the assistant could estimate a value.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Require the assistant to quote the passage that supports each value, and to say when no retrieved passage covers the case.\u003c/p>\n\u003cp>Retrieval returns the chunks that are closest to the question. It does not tell the model whether those chunks answer the question. When an engineer asks about a roof steeper than any row in the table, the chunks from that table are a very close match by topic. The assistant receives text that looks relevant. It then produces a value by estimating beyond the last row or by using general knowledge. The citation points to a real section that does not contain the value.\u003c/p>\n\u003cp>The fix is to change what the assistant must do before it states a value. Two practices from Anthropic's guidance on \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations\">reducing hallucinations\u003c/a> work together. The first is to give Claude clear permission to say that it does not have enough information. The second is to require a direct quote from the provided text for each claim, and to tell Claude to withdraw any claim that has no supporting quote. With both practices in place, a question about a case that the codes do not cover has no row that can be quoted. So the correct response is to report that the codes do not settle the question. This matches Ashgrove's two requirements: cite the code section, and say when the codes give no answer. The \u003ca href=\"https://docs.anthropic.com/en/docs/build-with-claude/citations\">Citations\u003c/a> feature supports the same practice. It returns the source passage that each statement is based on, and a reviewer or a program can compare that passage with the stated value. These practices \u003cem>reduce\u003c/em> unsupported answers. They do not remove all of them, so the team should still measure the rate on a labeled set of questions about cases that the codes do not cover.\u003c/p>\n\u003cp>A minimum similarity score is a useful filter for questions that are completely off topic, but it measures only how close the topic is. Chunks from the correct table score high even when the needed row does not exist, so the threshold is not triggered in these cases. A \u003cstrong>self-reported confidence score\u003c/strong> has a similar weakness. It is the model's opinion of its own answer, not a comparison with the source text, and a model that has estimated a value from a related table can still rate itself highly. Passing more chunks improves answers when the right passage exists but was ranked too low. In these cases, no such passage exists, and more related text gives the assistant more material from which to estimate a value.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 70","answerStatus":"source"}];

    const CURRENT_KEY = "devPro05RevisedCurrentV1";
    const HISTORY_KEY = "devPro05RevisedHistoryV1";
    const EXAM_NAME = "Claude Developer Professional 05";

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function isCorrect(question) {
      return question.options.every(option => Boolean(option.selected) === Boolean(option.correct));
    }

    function correctCount(question) {
      return question.options.filter(option => option.correct).length;
    }

    function formatDuration(ms) {
      if (!Number.isFinite(ms) || ms < 0) return "0:00";
      const total = Math.floor(ms / 1000);
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    class ExamQuestion extends HTMLElement {
      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { question, index, total, graded, cheating } = this._state;
        const reveal = graded || cheating;
        const choose = correctCount(question);

        this.innerHTML = `
          <section class="card" aria-labelledby="question-title">
            <div class="card-header">
              <span>Question ${index + 1} of ${total}</span>
              <span>${question.viewed ? "Viewed" : "New"}</span>
            </div>
            <div class="card-body">
              <p class="query" id="question-title"></p>
              <p class="choose-note">Choose ${choose}</p>
              <div class="options"></div>
              ${reveal ? `<div class="answer-panel"><strong>Answer</strong><div class="answer-html"></div></div>` : ""}
            </div>
          </section>
        `;

        this.querySelector(".query").textContent = question.query;
        const options = this.querySelector(".options");

        question.options.forEach((option, optionIndex) => {
          const label = document.createElement("label");
          label.className = "option";
          if (reveal && option.correct) label.classList.add("reveal-correct");
          if (reveal && option.selected && !option.correct) label.classList.add("reveal-wrong-selected");

          const input = document.createElement("input");
          input.type = choose === 1 ? "radio" : "checkbox";
          if (choose === 1) input.name = `exam-q-${index}`;
          input.checked = Boolean(option.selected);
          input.disabled = Boolean(graded);
          input.addEventListener("change", () => {
            this.dispatchEvent(new CustomEvent("option-toggle", {
              bubbles: true,
              detail: { optionIndex }
            }));
          });

          const textWrap = document.createElement("span");
          const text = document.createElement("span");
          text.textContent = option.text;
          textWrap.appendChild(text);

          if (reveal && option.explanation) {
            const explanation = document.createElement("small");
            explanation.textContent = option.explanation;
            textWrap.appendChild(explanation);
          }

          label.append(input, textWrap);
          options.appendChild(label);
        });

        const answer = this.querySelector(".answer-html");
        if (answer) answer.innerHTML = question.answer || "";
      }
    }
    customElements.define("exam-question", ExamQuestion);

    class QuestionJumper extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { questions, current, graded, cheating } = this._state;
        const reveal = graded || cheating;

        this.innerHTML = `
          <section class="card">
            <div class="card-header collapsible-title" role="button" tabindex="0">
              <span>Question Jumper</span>
              <span class="chevron">${this.collapsed ? "▼" : "▲"}</span>
            </div>
            <div class="card-body jumper-body" ${this.collapsed ? 'hidden' : ''}>
              <div class="jumper-grid"></div>
            </div>
          </section>
        `;

        const title = this.querySelector(".collapsible-title");
        const toggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        title.addEventListener("click", toggle);
        title.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });

        const grid = this.querySelector(".jumper-grid");
        questions.forEach((question, index) => {
          const button = document.createElement("button");
          button.className = "jump-btn";
          button.textContent = String(index + 1);
          button.title = question.query;

          if (question.viewed) button.classList.add("viewed");
          if (index === current) button.classList.add("current");

          if (reveal) {
            button.classList.remove("viewed", "current");
            button.classList.add(isCorrect(question) ? "correct" : "incorrect");
            if (index === current) button.style.outline = "3px solid #111827";
          }

          button.addEventListener("click", () => {
            this.dispatchEvent(new CustomEvent("jump", {
              bubbles: true,
              detail: { index }
            }));
          });
          grid.appendChild(button);
        });
      }
    }
    customElements.define("question-jumper", QuestionJumper);

    class ExamHistoryPanel extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        const history = this._state?.history || { exams: [] };
        const exams = Array.isArray(history.exams) ? history.exams : [];

        this.innerHTML = `
          <section class="card">
            <div class="card-header">
              <span class="collapsible-title" role="button" tabindex="0">Exam History</span>
              <div class="control-group">
                <button class="btn-secondary toggle-history">${this.collapsed ? "Show" : "Hide"}</button>
                <button class="btn-danger clear-history" ${exams.length ? "" : "disabled"}>Clear History</button>
              </div>
            </div>
            <div class="card-body history-body" ${this.collapsed ? "hidden" : ""}></div>
          </section>
        `;

        const doToggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        this.querySelector(".toggle-history").addEventListener("click", doToggle);
        this.querySelector(".collapsible-title").addEventListener("click", doToggle);
        this.querySelector(".clear-history").addEventListener("click", () => {
          this.dispatchEvent(new CustomEvent("history-clear", { bubbles: true }));
        });

        const body = this.querySelector(".history-body");
        if (!exams.length) {
          body.innerHTML = `<p class="history-empty">No completed exams are stored on this device.</p>`;
          return;
        }

        [...exams].reverse().forEach((exam, reverseIndex) => {
          const questions = Array.isArray(exam.questions) ? exam.questions : [];
          const score = questions.filter(isCorrect).length;
          const number = exams.length - reverseIndex;
          const finish = Number(exam.finish || exam.completedAt || 0);
          const start = Number(exam.start || 0);
          const stamp = finish ? new Date(finish).toLocaleString() : "Completed exam";
          const duration = finish && start ? formatDuration(finish - start) : "";

          const wrap = document.createElement("div");
          wrap.className = "history-exam";

          const summary = document.createElement("div");
          summary.className = "history-summary";
          summary.innerHTML = `<strong>Attempt ${number}: ${score} / ${questions.length}</strong><span>${stamp}${duration ? ` · ${duration}` : ""}</span>`;
          wrap.appendChild(summary);

          const dots = document.createElement("div");
          dots.className = "history-dots";
          questions.forEach((question, i) => {
            const dot = document.createElement("span");
            dot.className = "history-dot" + (isCorrect(question) ? " correct" : "");
            dot.textContent = String(i + 1);
            dot.title = question.query;
            dots.appendChild(dot);
          });
          wrap.appendChild(dots);
          body.appendChild(wrap);
        });
      }
    }
    customElements.define("exam-history-panel", ExamHistoryPanel);

    class ScrumExamApp extends HTMLElement {
      constructor() {
        super();
        this.state = null;
        this.timerHandle = null;
      }

      connectedCallback() {
        this.load();
        this.addEventListener("option-toggle", e => this.toggleOption(e.detail.optionIndex));
        this.addEventListener("jump", e => this.setCurrentQuestion(e.detail.index));
        this.addEventListener("history-clear", () => this.clearHistory());
        this.render();
        this.timerHandle = setInterval(() => this.updateTimer(), 1000);
      }

      disconnectedCallback() {
        clearInterval(this.timerHandle);
      }

      load() {
        let saved = null;
        try {
          saved = JSON.parse(localStorage.getItem(CURRENT_KEY));
        } catch (_) {}

        if (saved && Array.isArray(saved.questions) && saved.questions.length === QUESTION_BANK.length && !saved.graded) {
          this.state = saved;
        } else {
          const questions = clone(QUESTION_BANK).map(q => ({
            ...q,
            viewed: false,
            options: q.options.map(o => ({ ...o, selected: false }))
          }));
          questions[0].viewed = true;
          this.state = {
            name: EXAM_NAME,
            graded: false,
            start: Date.now(),
            finish: 0,
            questions,
            currentQuestionNumber: 0,
            cheating: new URLSearchParams(location.search).get("page") === "answer"
          };
          this.saveCurrent();
        }
      }

      saveCurrent() {
        if (!this.state.graded) {
          localStorage.setItem(CURRENT_KEY, JSON.stringify(this.state));
        }
      }

      getHistory() {
        try {
          const existing = JSON.parse(localStorage.getItem(HISTORY_KEY));
          if (existing && Array.isArray(existing.exams)) return existing;
        } catch (_) {}
        const history = { name: "Exam History", exams: [] };
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        return history;
      }

      clearHistory() {
        localStorage.setItem(HISTORY_KEY, JSON.stringify({ name: "Exam History", exams: [] }));
        this.render();
      }

      toggleOption(optionIndex) {
        if (this.state.graded) return;
        const q = this.state.questions[this.state.currentQuestionNumber];
        const oneAnswer = correctCount(q) === 1;
        if (oneAnswer) {
          q.options.forEach((option, i) => { option.selected = i === optionIndex; });
        } else {
          q.options[optionIndex].selected = !q.options[optionIndex].selected;
        }
        q.viewed = true;
        this.saveCurrent();
        this.render();
      }

      setCurrentQuestion(index) {
        const next = Math.max(0, Math.min(index, this.state.questions.length - 1));
        this.state.currentQuestionNumber = next;
        this.state.questions[next].viewed = true;
        this.saveCurrent();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      toggleCheat() {
        this.state.cheating = !this.state.cheating;
        this.saveCurrent();
        this.render();
      }

      grade() {
        if (this.state.graded) return;
        this.state.graded = true;
        this.state.cheating = true;
        this.state.finish = Date.now();

        const history = this.getHistory();
        history.exams.push(clone(this.state));
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        localStorage.removeItem(CURRENT_KEY);
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      restart() {
        localStorage.removeItem(CURRENT_KEY);
        this.load();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      score() {
        return this.state.questions.filter(isCorrect).length;
      }

      answeredCount() {
        return this.state.questions.filter(q => q.options.some(o => o.selected)).length;
      }

      updateTimer() {
        const el = this.querySelector("[data-timer]");
        if (!el || !this.state) return;
        const end = this.state.finish || Date.now();
        el.textContent = formatDuration(end - this.state.start);
      }

      render() {
        if (!this.state) return;
        const qIndex = this.state.currentQuestionNumber;
        const total = this.state.questions.length;
        const answered = this.answeredCount();
        const score = this.score();

        this.innerHTML = `
          <main class="page-shell">
            <header class="hero">
              <div class="hero-top">
                <div>
                  <h1>Claude Developer Professional | Exam 05</h1>
                  <p>70 concise exam questions · standalone and offline · answer explanations included</p>
                </div>
                <div class="pill">Elapsed <span data-timer>${formatDuration((this.state.finish || Date.now()) - this.state.start)}</span></div>
              </div>
              <div class="meta-row">
                <span class="pill">${total} questions</span>
                <span class="pill">${answered} answered</span>
                <span class="pill">${this.state.questions.filter(q => q.viewed).length} viewed</span>
                ${this.state.graded ? `<span class="pill">Score ${score} / ${total}</span>` : ""}
              </div>
            </header>

            ${this.state.graded ? `
              <section class="card results">
                <div class="card-body">
                  <strong>Your grade is ${score} out of ${total}.</strong>
                  <div class="status-line">Correct answers and option explanations are now visible. Your completed attempt has been saved to local storage.</div>
                </div>
              </section>
            ` : ""}

            <div class="controls controls-top" role="navigation" aria-label="Exam controls">
              <div class="control-group">
                <button class="btn-secondary previous" ${qIndex === 0 ? "disabled" : ""}>&larr; Back</button>
                <button class="btn-primary next" ${qIndex === total - 1 ? "disabled" : ""}>Next &rarr;</button>
                <button class="btn-warning cheat">${this.state.cheating ? "Hide Answers" : "Cheat"}</button>
              </div>
              <div class="control-group">
                ${this.state.graded
                  ? `<button class="btn-primary restart">Start New Attempt</button>`
                  : `<button class="btn-success finish">Finish &amp; Grade</button>`}
              </div>
            </div>

            <exam-question></exam-question>

            <question-jumper></question-jumper>
            <exam-history-panel></exam-history-panel>

            <p class="footer-note">Progress and completed attempts are stored only in this browser's localStorage.</p>
          </main>
        `;

        const questionEl = this.querySelector("exam-question");
        questionEl.state = {
          question: this.state.questions[qIndex],
          index: qIndex,
          total,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const jumper = this.querySelector("question-jumper");
        jumper.state = {
          questions: this.state.questions,
          current: qIndex,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const history = this.querySelector("exam-history-panel");
        history.state = { history: this.getHistory() };

        this.querySelector(".previous").addEventListener("click", () => this.setCurrentQuestion(qIndex - 1));
        this.querySelector(".next").addEventListener("click", () => this.setCurrentQuestion(qIndex + 1));
        this.querySelector(".cheat").addEventListener("click", () => this.toggleCheat());

        const finish = this.querySelector(".finish");
        if (finish) finish.addEventListener("click", () => this.grade());

        const restart = this.querySelector(".restart");
        if (restart) restart.addEventListener("click", () => this.restart());
      }
    }
    customElements.define("scrum-exam-app", ScrumExamApp);
  </script>
