<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Developer Professional | Practice Exam 05</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #d9e0e8;
      --primary: #1769aa;
      --primary-dark: #0f4f85;
      --secondary: #667085;
      --success: #16803c;
      --success-bg: #eaf8ef;
      --danger: #b42318;
      --danger-bg: #fff0ee;
      --warning: #9a6700;
      --warning-bg: #fff7d6;
      --shadow: 0 10px 28px rgba(23, 32, 51, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      border-radius: 9px;
      padding: .62rem .92rem;
      cursor: pointer;
      font-weight: 650;
      transition: transform .08s ease, background .15s ease, opacity .15s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-secondary { background: #e8edf3; color: var(--text); }
    .btn-warning { background: #ffd96a; color: #4b3500; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }

    .page-shell {
      width: min(1040px, calc(100% - 28px));
      margin: 28px auto 60px;
    }

    .hero {
      background: linear-gradient(135deg, #12243b, #1e4f79);
      color: white;
      border-radius: 18px;
      padding: 24px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero-top {
      display: flex;
      gap: 18px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .hero h1 { margin: 0 0 6px; font-size: clamp(1.65rem, 4vw, 2.35rem); }
    .hero p { margin: 0; opacity: .88; }
    .meta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .pill {
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.1);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: .9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-top: 16px;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 18px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-weight: 750;
    }

    .card-body { padding: 18px; }

    .results {
      border-left: 5px solid var(--primary);
    }
    .results strong { font-size: 1.1rem; }

    .query {
      font-size: 1.08rem;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .choose-note {
      color: var(--muted);
      font-size: .9rem;
      margin: 0 0 16px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 11px 12px;
      margin: 8px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
    }

    .option input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--primary);
      flex: 0 0 auto;
    }

    .option.reveal-correct {
      border-color: #75c991;
      background: var(--success-bg);
    }

    .option.reveal-wrong-selected {
      border-color: #e9a7a0;
      background: var(--danger-bg);
    }

    .option small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .answer-panel {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--warning-bg);
      border: 1px solid #f0d783;
    }

    .answer-panel p:first-child { margin-top: 0; }
    .answer-panel ul { margin-bottom: 0; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .controls-top {
      position: sticky;
      top: 8px;
      z-index: 20;
      margin: 10px 0 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,.97);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 5px 24px rgba(23,32,51,.12);
      backdrop-filter: blur(8px);
    }

    .controls-top + exam-question .card { margin-top: 0; }

    .control-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .collapsible-title { cursor: pointer; user-select: none; }
    .chevron { font-size: .9rem; color: var(--muted); }

    .jumper-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .jump-btn {
      min-width: 38px;
      padding: 7px 9px;
      background: #eef2f6;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .jump-btn.viewed { background: #d7dee7; }
    .jump-btn.current { background: var(--primary); color: white; border-color: var(--primary); }
    .jump-btn.correct { background: var(--success); color: white; border-color: var(--success); }
    .jump-btn.incorrect { background: var(--danger); color: white; border-color: var(--danger); }

    .history-empty { color: var(--muted); margin: 0; }
    .history-exam {
      border-top: 1px solid var(--line);
      padding: 14px 0;
    }
    .history-exam:first-child { border-top: 0; padding-top: 0; }
    .history-summary {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }
    .history-dots { display: flex; flex-wrap: wrap; gap: 5px; }
    .history-dot {
      width: 26px; height: 26px; border-radius: 7px;
      display: grid; place-items: center;
      font-size: .76rem; color: white;
      background: var(--danger);
    }
    .history-dot.correct { background: var(--success); }

    .status-line {
      color: var(--muted);
      font-size: .92rem;
      margin-top: 10px;
    }

    .footer-note {
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
      margin-top: 22px;
    }

    @media (max-width: 640px) {
      .page-shell { width: min(100% - 16px, 1040px); margin-top: 8px; }
      .hero { border-radius: 12px; padding: 19px 17px; }
      .card-body { padding: 14px; }
      .card-header { padding: 12px 14px; }
      .controls { align-items: stretch; }
      .control-group { width: 100%; }
      .control-group button { flex: 1; }
      .controls-top { top: 0; padding: 10px; }
    }
  </style>
</head>

  <script>
    const QUESTION_BANK = [{"query":"A smaller model handles 20% of live financial filings. Both models have a 1.1% analyst correction rate, but analysts review only selected companies and mostly headline figures. How should the team assess accuracy across all 120 fields, including footnotes?","type":"multiple-choice","options":[{"text":"Have analysts label all 120 fields on a random sample of filings from each tier, and report footnote fields separately.","explanation":"A random sample with every field labeled removes the analysts' choice of which filings to open and which fields to check. Reporting the footnote fields as their own group shows the smaller tier's known weak point. A single combined number would hide it.","correct":true},{"text":"Have an LLM judge read every live filing with its extracted values, and give each extraction an overall score from 1 to 5.","explanation":"A judge can cover every filing, but one overall score per filing hides which of the 120 fields are wrong. The judge has also not been checked against human labels. It may miss the same footnote figures that the smaller tier misses.","correct":false},{"text":"Compare the tiers by the share of live filings in which all 120 fields contain a value in the expected number format.","explanation":"A format check is cheap and can run on every filing, but it only shows that a value is present and in the correct format. A figure taken from the wrong place still passes this check. So does a footnote figure that was replaced by a different number.","correct":false},{"text":"Extend the comparison to the whole quarter, including the two peak weeks, and recompute the correction rate on all filings.","explanation":"More filings make the correction rate more stable, but they do not change what the rate measures. Analysts would still open only the companies they cover and would still check mostly headline fields. Errors in footnote fields would still go uncounted for both tiers.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Have analysts label all 120 fields on a random sample of filings from each tier, and report footnote fields separately.\u003c/p>\n\u003cp>The correction rate is a form of \u003cstrong>user feedback\u003c/strong>. Feedback is useful because it comes from real work. However, it is sparse (it covers few items) and self-selected: it covers only the items that users chose to look at. Basalt's analysts open only the filings of companies they cover, and they mostly check headline fields. A field that no analyst checks can never be corrected, so an error in that field is never counted. For this reason, the equal 1.1% rate for both tiers describes headline fields on a non-random set of filings. It says very little about figures that appear only in footnotes. The earlier test found that those figures are where the smaller tier is weak.\u003c/p>\n\u003cp>To measure quality on live traffic, the team needs a sample that it controls. Drawing filings at random from each tier removes the analysts' choice of what to open. Labeling all 120 fields removes their choice of what to check. For an extraction task, the matching metric is \u003cstrong>field-level accuracy against human values\u003c/strong>, and the team should report it by field group. One combined number would hide the footnote fields, because they are a small share of the 120. The 20% split is already random, so the two labeled samples can be compared directly. This is an A/B test: two variants run on randomly assigned live traffic, and the team compares the same measure between them.\u003c/p>\n\u003cp>The other approaches each improve something, but they do not remove the selection problem. Running the comparison for the whole quarter gives a more stable correction rate, but the rate still counts only what analysts chose to check. A format check is a fast, code-based grader that can run on every filing. However, it confirms only that a value is present and in the correct format, not that it is the right figure. An LLM judge can also cover every filing, but a single score from 1 to 5 hides errors in individual fields. Also, a judge must be calibrated against human labels before anyone can trust its scores. That calibration needs the same labeled sample that the team does not have yet.\u003c/p>\n\u003cp>See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">Define success criteria and build evaluations\u003c/a> for guidance on choosing metrics that match the task, on using A/B tests and user feedback as measurement methods, and on when to use code-based, human, or LLM-based grading.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 1; Domain: Evaluation Engineering and Quality Assurance","answerStatus":"source"},{"query":"Financial filings must be processed within 24 hours. A daily midnight batch causes a 16-hour submission wait plus 10 hours of processing, but batch discounts are important. How should the pipeline meet the deadline while retaining most savings?","type":"multiple-choice","options":[{"text":"Submit a small batch every hour as filings arrive, and send any filing that nears its deadline through the real-time API.","explanation":"The 26-hour delay had two parts: 16 hours of waiting before submission and 10 hours of batch processing. Hourly submission reduces the wait to about one hour at most, so most filings finish in the batch path at the discounted price. A batch can take up to 24 hours. For this reason, the pipeline sends a filing through a real-time call when its batch has not ended near the deadline. This covers the cases where a batch is slow.","correct":true},{"text":"Send all filings through real-time API calls during the two peak weeks, and keep the midnight batch for the quieter weeks.","explanation":"This would meet the deadline, but about 70% of the quarter's filings arrive in those two weeks. Those filings would be billed at the full real-time price. As a result, most of the batch saving that the finance team wants would be lost.","correct":false},{"text":"Keep the midnight batch, and ask for a higher limit on queued batch requests so that the batch starts processing sooner.","explanation":"The limit on queued batch requests controls how many requests may wait for processing. It does not control how quickly they are processed. Nothing in the situation shows that the team reached this limit. The delay came from the 16-hour wait before submission and from the processing time of the batch itself.","correct":false},{"text":"Keep the midnight submission, and split each day's filings into several equal batches that are processed in parallel.","explanation":"A filing that arrived at 08:00 would still wait 16 hours before any batch is submitted. Splitting may let some batches end sooner, but it does not remove that wait. Also, a slow batch can still pass the deadline, and its filings would have no second path.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Submit a small batch every hour as filings arrive, and send any filing that nears its deadline through the real-time API.\u003c/p>\n\u003cp>The \u003cstrong>Message Batches API\u003c/strong> processes requests asynchronously at half the price of standard calls. That is why it suits a workload like this one. In return for the discount, the team gives up control over timing. Most batches finish within an hour, but a batch may take up to 24 hours, and requests that are not processed by then expire. Results can be retrieved when every request in the batch has finished or after 24 hours, whichever comes first. For this reason, a pipeline with a 24-hour deadline cannot spend most of that time waiting before it submits the batch.\u003c/p>\n\u003cp>The 26-hour result had two parts: 16 hours of waiting for the midnight job and 10 hours of processing. The team controls only the first part directly. Submitting a batch every hour reduces the wait to about one hour at most. Also, a small batch has fewer requests that must finish before its results become available. Each request carries a \u003ccode>custom_id\u003c/code>, so the pipeline can match the results to filings after a batch has ended. The pipeline cannot read the results of a batch one request at a time while the batch is still processing. If a batch has not ended when its filings are close to the deadline, the pipeline sends the filings in that batch through the real-time Messages API as a second path. Because each hourly batch is small, a slow batch affects few filings. Batch usage does not count against the Messages API rate limits, so this second path has its own capacity. The team pays the full price only for the filings whose batch did not end in time.\u003c/p>\n\u003cp>Moving all peak traffic to real-time calls would meet the deadline. However, about 70% of the quarter's filings arrive in those two weeks, so most of the saving would be lost. Splitting the midnight job into several parallel batches does not help a filing that arrived at 08:00, because it still waits 16 hours before anything is submitted. A higher limit on queued batch requests changes how many requests may wait in the processing queue, not how fast they are processed. At about 1,500 filings a day in the peak weeks, nothing suggests that the team reached this limit. The \u003cem>binding constraint\u003c/em> (the limit that actually caused the delay) was the submission schedule, not a rate limit.\u003c/p>\n\u003cp>For details, see \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/batch-processing\">Batch processing\u003c/a> and \u003ca href=\"https://platform.claude.com/docs/en/api/rate-limits\">Rate limits\u003c/a>.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 2; Domain: Production Integration, Reliability, and Knowledge Grounding","answerStatus":"source"},{"query":"Four concurrent extraction requests share the same filing prefix and cache breakpoint, but all four write to the prompt cache instead of reading it. How should requests be scheduled so the later three can reuse the cached filing?","type":"multiple-choice","options":[{"text":"Send one request per filing first, and send the other three when its response starts, so that the cache entry already exists.","explanation":"A request can read a cache entry only after the response to the request that writes the entry has started. If one request goes first, the other three find the filing in the cache and pay the lower read price for it. The short wait is small compared with the 24-hour deadline.","correct":true},{"text":"Put each group's instructions before the filing, so that each request begins with text that is reused across filings.","explanation":"Caching matches the prompt from its beginning. With this change, the filing would follow a different block of instructions in each of the four requests, so the requests could not share it. At best, the short instructions would be read from the cache. The filing is the large part of the prompt, and the model would process it in full four times.","correct":false},{"text":"Set the 1-hour cache duration on the breakpoint, so that the filing's entry stays available to all four requests.","explanation":"The entry is not expiring. It does not exist yet when the four requests, sent at the same moment, look for it, so a longer lifetime changes nothing. All four requests would still write the filing, and a 1-hour write costs more than a 5-minute write.","correct":false},{"text":"Submit the four requests for each filing in one Message Batches API batch, so that they are processed together.","explanation":"Requests in a batch can be processed concurrently and in any order, so cache hits inside a batch are not guaranteed. The four requests could still all miss and all write the filing. The batch discount is a separate cost decision, and it does not fix the missing cache reads.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Send one request per filing first, and send the other three when its response starts, so that the cache entry already exists.\u003c/p>\n\u003cp>\u003cstrong>Prompt caching\u003c/strong> matches on the start of the prompt. The first request that processes a prefix writes a cache entry at the breakpoint, and later requests with the identical prefix read that entry. The timing is important: an entry becomes available only after the response to the writing request has \u003cem>started\u003c/em>. When four requests with the same filing are sent at the same moment, each one looks for the entry before any of them has created it. All four miss, and all four pay the cache write price, which is higher than the normal input price. This matches the usage data: \u003ccode>cache_creation_input_tokens\u003c/code> is large on every request, and \u003ccode>cache_read_input_tokens\u003c/code> is zero.\u003c/p>\n\u003cp>The fix is to change the order in which the requests are sent, not the prompt. The pipeline sends one of the four requests, waits until its response begins, and then sends the other three. The filing is written once and read three times, and a cache read costs a small fraction of the normal input price. The three later requests arrive seconds after the first one, so the default 5-minute lifetime is long enough. Analysts need each filing within 24 hours, so a wait of a few seconds per filing has no effect on the deadline. The prompt layout is already correct: the shared filing comes first, and the group instructions, which are different in each request, come after the breakpoint.\u003c/p>\n\u003cp>A 1-hour cache duration helps when requests arrive more than five minutes apart. These requests arrive together, so the entry is missing, not expired. The longer duration would only raise the write price on four writes. Moving the instructions to the front follows the common advice to put stable content first. However, it gives each of the four requests a different prefix, so the requests can no longer share the filing. Putting the four requests in one batch does not help either. Batch requests can run concurrently and in any order, and cache hits in a batch are best-effort (the system tries, but does not guarantee them). Batch pricing may still be useful for this workload. The team would need to check it against the 24-hour deadline, because a batch can take up to 24 hours to finish.\u003c/p>\n\u003cp>See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">Prompt caching\u003c/a> for how entries are written and read, and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/batch-processing\">Batch processing\u003c/a> for how caching behaves inside a batch.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 3; Domain: Cost and Latency Optimization at Scale","answerStatus":"source"},{"query":"A priority filing needs six independent extraction calls. Each takes about two minutes; running them sequentially takes 12 minutes against a five-minute deadline. Which change reduces latency without lowering extraction quality?","type":"multiple-choice","options":[{"text":"Stream all six responses, so that the pipeline starts to receive each call's field values before the call ends.","explanation":"Streaming changes when the first output arrives, not when the last output arrives. The analysts need the complete set of 120 fields, and the six calls would still run one after another for about 12 minutes in total. Streaming helps when a person reads text while it is generated. That is not the case in this pipeline.","correct":false},{"text":"Lower the effort level on all six calls, so that each call spends less time on reasoning before it answers.","explanation":"A lower effort level does shorten generation, but it also reduces how much the model reasons about each field. In the scenario, the test with a smaller tier missed figures that appear only in footnotes. This suggests that these fields need careful reasoning. The team would need to test this change against the human values first. Another option reaches the target with no effect on quality.","correct":false},{"text":"Cache the filing as a shared prefix and keep the sequence, so that calls two to six do not process it again.","explanation":"Caching the filing reduces the input processing time and the input cost of the later calls, but it has no effect on output generation. Most of each two-minute call is generation, so six calls in sequence would still need more than six minutes. Caching is a useful way to lower cost in this pipeline, but it does not reach the 5-minute target by itself.","correct":false},{"text":"Send a priority filing's six calls at the same time, so that the filing takes about as long as one call.","explanation":"The six calls are independent, so the only reason a filing takes 12 minutes is that each call waits for the one before it. Running the calls concurrently brings the total close to the two minutes of the slowest call. Each call still receives the same filing, the same instructions, the same model tier and the same effort level. For this reason, the model produces the extracted values in the same way as before.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Send a priority filing&#x27;s six calls at the same time, so that the filing takes about as long as one call.\u003c/p>\n\u003cp>A latency target must be compared with the right measurement. \u003cstrong>Time to first token\u003c/strong> is the delay before the model starts to produce output. \u003cstrong>Total latency\u003c/strong> is the time until the whole response is complete. The priority path has a target for complete data: analysts cannot use a filing until all 120 fields are stored. So the measurement that matters is the total time for the six calls. The first step is to ask where those 12 minutes come from.\u003c/p>\n\u003cp>The 12 minutes come from two facts: each call takes about two minutes, and the calls run one after another. The calls do not depend on each other, so the waiting is not needed. When the application sends the six requests concurrently, the filing is finished when the slowest call returns, which is after about two minutes. Nothing about each request changes, so the model produces the values in the same way as before. This is the same principle as running independent tool calls at the same time: work that does not depend on other work should not be placed in a sequence.\u003c/p>\n\u003cp>\u003cstrong>Streaming\u003c/strong> delivers output while it is generated. This makes an application feel faster to a person who is reading. It does not make generation finish earlier, as the \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency\">guide to reducing latency\u003c/a> and the \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/streaming\">streaming guide\u003c/a> describe. A pipeline that writes complete records to a database gets no benefit from streaming for this target.\u003c/p>\n\u003cp>\u003cstrong>Prompt caching\u003c/strong> stores a prompt prefix so that later requests with the same prefix can read it at lower cost and start faster. The \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">prompt caching documentation\u003c/a> states that caching has no effect on output token generation. Most of each call is generation, so five cache reads cannot remove enough time from a 12-minute sequence. The team can still combine caching with concurrency to save cost, with one condition: a cache entry becomes available only after the first response has started. The team would send one call first and send the other five when that response begins.\u003c/p>\n\u003cp>The \u003cstrong>effort level\u003c/strong> controls how many tokens the model spends on reasoning and output, so a lower level is faster and cheaper. The \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/effort\">effort documentation\u003c/a> also says that lower effort can reduce capability, and it recommends testing on the specific use case. The footnote figures were already difficult in the smaller-tier test. So lowering effort is a change that needs evaluation against the human values. Concurrency reaches the target without that risk.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 4; Domain: Cost and Latency Optimization at Scale","answerStatus":"source"},{"query":"An LLM judge agrees with human labels on 96% of 2,000 extracted fields, but only 5% of fields are wrong and the judge labels almost everything correct. What should be measured before using the judge to route failures?","type":"multiple-choice","options":[{"text":"Have the analysts label 8,000 more randomly chosen fields, and confirm that the judge's agreement with them stays close to 96%.","explanation":"A larger random sample has the same mix of about 95% correct fields, so raw agreement will stay high, for the same reason as before. The number becomes more precise, but it still does not show whether the judge detects wrong fields.","correct":false},{"text":"Run the judge three times on every field and route by the majority verdict, so that variation between runs is removed.","explanation":"Majority voting reduces random differences between runs. The judge's problem is a consistent tendency to answer \"correct\". Three runs with the same tendency produce the same verdict three times.","correct":false},{"text":"Report Cohen's kappa in place of raw agreement, and measure what share of the analyst-marked wrong fields the judge flagged.","explanation":"Because 95% of the fields are correct, a judge that marks nearly everything correct reaches about 95% agreement without detecting any errors. Cohen's kappa removes the agreement that is expected by chance. The share of wrong fields that the judge caught shows directly whether it can do the job that routing needs.","correct":true},{"text":"Add a prompt instruction that tells the judge to be strict about footnote figures, and begin routing with the revised judge.","explanation":"A footnote instruction may help, because the smaller tier's known errors are footnote figures. However, if the team starts routing without measuring the revised judge against the analysts' labels, it repeats the same mistake: nobody knows how many wrong fields the judge catches.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Report Cohen&#x27;s kappa in place of raw agreement, and measure what share of the analyst-marked wrong fields the judge flagged.\u003c/p>\n\u003cp>Raw agreement is a weak measure when one label is much more common than the other. The smaller tier matches the human values on most fields, so about 95% of the labeled fields are correct. A judge that answers &quot;correct&quot; for every field would agree with the analysts on 95% of them and would catch no errors at all. So the 96% figure is only one point better than a judge that does nothing.\u003c/p>\n\u003cp>\u003cstrong>Cohen's kappa\u003c/strong> measures agreement between two raters after it removes the agreement they would reach by chance, given how often each rater uses each label. Consider one case that fits the numbers: the analysts marked 100 of the 2,000 fields as wrong, and the judge flagged 20 fields, all of them truly wrong. Agreement is 96%, but kappa is only about 0.32, and the judge caught 20 of the 100 wrong fields. The second measurement is the share of analyst-marked wrong fields that the judge flagged (its recall on the wrong class). This is the most important measurement for routing. The judge exists to find the fields that the smaller tier got wrong, and those are mostly figures that appear only in footnotes. Every wrong field that the judge misses stays on the cheaper path and reaches the analysts as bad data.\u003c/p>\n\u003cp>Anthropic's guidance on LLM-based grading is to test the grader for reliability first, then use it at scale, and to read samples of its verdicts. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">Define success criteria and build evaluations\u003c/a> and the \u003ca href=\"https://platform.claude.com/cookbook/misc-building-evals\">Building evals cookbook\u003c/a>. For a judge with two classes of very different size, that test should include an agreement measure that corrects for chance and the error rate on each class. The labeled set should contain enough wrong fields to measure.\u003c/p>\n\u003cp>The other approaches each improve something, but they leave the main question unanswered. Labeling 8,000 more random fields makes the 96% figure more precise, but the correct fields still make up most of that figure. Running the judge three times and taking the majority reduces random variation between runs. However, the judge's weakness is a consistent tendency to answer &quot;correct&quot;, so the majority verdict will be the same. Telling the judge to be strict about footnotes is a reasonable rubric change, because it targets the known error type. The team should follow it with a new measurement against the analysts' labels, not with an immediate start to routing. When kappa and the recall on wrong fields are acceptable, the team can trust the judge to decide which filings go to the most capable tier.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 5; Domain: Evaluation Engineering and Quality Assurance","answerStatus":"source"},{"query":"A cheaper model costs one-fifth as much and misses only 20 of 120 fields, leaving those fields empty in 18% of filings. Input text dominates cost. Which processing design saves the most while preserving accuracy on those fields?","type":"multiple-choice","options":[{"text":"Keep the most capable tier for every filing, and return the 120 fields in a compact JSON format with shorter key names.","explanation":"A more compact output format reduces output tokens, but output is a small part of the cost of each request. The filing text sent as input is about 95% of the cost, and this change does not affect it. Every filing would still be read at the most capable tier's input price.","correct":false},{"text":"Keep the most capable tier for every filing, and cache the extraction instructions and field list as a shared prefix.","explanation":"Prompt caching helps only for a prefix that is identical across requests, and the only identical part is the instructions and field list. That part is a small share of each request. The filing text is about 95% of the cost, and it is different for every filing. The saving is real but small.","correct":false},{"text":"Extract the other 100 fields with the smaller tier, and send every filing to the most capable tier for the 20 fields.","explanation":"Splitting by field does not reduce what the most capable tier has to read. That tier still receives the full text of every filing, and the filing text is about 95% of the cost of a request. The team would pay almost the full current cost. It would then add the smaller tier's cost, about one-fifth more, for every filing.","correct":false},{"text":"Run every filing on the smaller tier, then re-run filings with one of the 20 fields empty on the most capable tier.","explanation":"This design pays the smaller tier's price, about one-fifth of today's cost, to read every filing. It pays the most capable tier's price for only about 18% of the filings. Code can check for an empty field, so the filings that may hide a missed footnote figure are the ones that go to the stronger model. The escalated filings are paid for twice, but the total is about 38% of today's cost per filing. The cost stays low as long as the escalation rate stays low.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Run every filing on the smaller tier, then re-run filings with one of the 20 fields empty on the most capable tier.\u003c/p>\n\u003cp>Before choosing a cost design, find out which token category the money is spent on. In this pipeline the answer is clear: about 95% of the cost of each request is the filing text sent as input. If the most capable tier still reads every filing, a change can reduce only the remaining 5%. That is why a compact output format and a cached instruction prefix both give small savings. Prompt caching needs an identical prefix across requests, and the only identical part is the instructions and field list. Each filing is different, so requests for different filings cannot share the large part of each request.\u003c/p>\n\u003cp>The field-split design looks like routing, but it routes the wrong unit. The most capable tier is billed for the tokens it reads, not for the number of fields it is asked to fill. Sending every filing to it for 20 fields costs almost the same as sending every filing for 120 fields. The cost of the smaller tier's pass is then added to that.\u003c/p>\n\u003cp>A \u003cstrong>cascade\u003c/strong> routes by filing instead. The smaller tier reads every filing at its lower price. Code then checks a simple signal, and only the filings that show the signal go to the most capable tier. The cost per filing is roughly the smaller tier's cost plus 18% of the most capable tier's cost. The smaller tier costs about one-fifth as much as the most capable tier, so the total is about 20% plus 18%, or roughly 38% of today's cost per filing. Escalated filings are paid for twice. So the design saves money only when the escalation rate is low and the price difference between the tiers is large. Both conditions are true in this case.\u003c/p>\n\u003cp>A cascade works only as well as its escalation signal. It works for this team because the test showed that a miss appears as an empty field in a known set of 20 fields. If the smaller tier wrote a wrong number instead of leaving the field empty, this check would not catch it. The team should continue to compare a sample of the smaller tier's accepted filings with human values. It should also watch the escalation rate, because a rise in that rate changes the cost forecast.\u003c/p>\n\u003cp>See \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\">Optimizing for cost and intelligence\u003c/a> for pricing each token category separately and for strategies that use several models, and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">Prompt caching\u003c/a> for why only an identical prefix can be read from the cache.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 6; Domain: Cost and Latency Optimization at Scale","answerStatus":"source"},{"query":"A no-deadline historical backfill shares an API workspace with time-sensitive filings and consumes most of the organization's input-token limit. Live filings receive 429 errors. How can the backfill continue without threatening live deadlines?","type":"multiple-choice","options":[{"text":"Request a higher organization rate limit from Anthropic, sized for the backfill and the peak-week filings running together.","explanation":"A higher limit adds capacity, but both jobs would still share it, and nothing would divide it between them. A backfill of 400,000 filings can raise its own rate to use the new capacity, and new filings would compete with it again. Also, an increase is not guaranteed, and it may not arrive during the peak weeks.","correct":false},{"text":"Add exponential backoff with jitter to the new-filing pipeline, and raise its retry limit so that each filing eventually succeeds.","explanation":"Backoff is the correct way to retry after a 429 error, but it does not give new filings any capacity of their own. Each retry still competes with a backfill that can use every available token for weeks. A filing can wait many hours and miss the 24-hour deadline.","correct":false},{"text":"Give the backfill its own API key in the current workspace, and build a dashboard of each job's token usage per minute.","explanation":"Rate limits apply to the organization and to workspaces, not to single API keys. So a second key in the same workspace still uses the same capacity. The dashboard would show which job uses the tokens, but only after new filings have started to fail. It reports the problem but does not prevent it.","correct":false},{"text":"Move the backfill to its own workspace, and set that workspace's rate limit well below the organization's limit.","explanation":"A workspace can have its own rate limit, and the API enforces the lower of the workspace limit and the organization limit. When the backfill is limited to part of the organization's capacity, the rest stays available to new filings, however much work the backfill has waiting. The backfill has no deadline, so it can run more slowly.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Move the backfill to its own workspace, and set that workspace&#x27;s rate limit well below the organization&#x27;s limit.\u003c/p>\n\u003cp>Messages API rate limits are measured for each model class as requests per minute, input tokens per minute and output tokens per minute. They apply to the whole organization. Every API key and every workspace uses the same organization limits unless a workspace has its own limit. The backfill and the quarterly pipeline use the same model tier and the same workspace, so they take input tokens from one shared allowance. The backfill has 400,000 filings waiting and can use all of that allowance at any hour. The 429 errors on new filings are the result.\u003c/p>\n\u003cp>\u003cstrong>Workspace rate limits\u003c/strong> are the documented control for separating workloads in this way. A workspace with no custom limit inherits the organization limit. So moving the backfill to a new workspace is not enough: the team must also set a lower limit. When a workspace limit is set, the API enforces the lower of the workspace limit and the organization limit. If the backfill's workspace is limited to part of the organization's input tokens per minute, the remaining part is always available to the pipeline that has the 24-hour deadline. The backfill will receive 429 errors when it reaches its own limit, and it should slow down and retry. That is acceptable because it has no deadline. Workspace limits can be set in the Console or through the Rate Limits API, and a change can take up to about an hour to apply. See \u003ca href=\"https://platform.claude.com/docs/en/api/rate-limits\">Rate limits\u003c/a> and the \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/rate-limits-api\">Rate Limits API guide\u003c/a>.\u003c/p>\n\u003cp>The other changes each help a little, but they keep the shared allowance. A separate API key does not create a separate limit, and a usage dashboard shows the conflict only after it has happened. Exponential backoff with jitter means waiting longer after each failed attempt, with a random variation so that retries do not all arrive together. It is the right way to retry. However, the new filings would still wait behind a job that does not stop, and \u003cem>eventually succeeds\u003c/em> is not the same as \u003cem>succeeds within 24 hours\u003c/em>. A higher organization limit gives both jobs more capacity, but nothing reserves any of it for new filings, and the backfill can increase its rate to use it.\u003c/p>\n\u003cp>The general rule is to give work that has a deadline and work that has no deadline separate, enforced limits. Then neither job can use the other's capacity. The Message Batches API is another documented way to separate work that has no deadline, because its usage does not count against the Messages API rate limits.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 7; Domain: Production Integration, Reliability, and Knowledge Grounding","answerStatus":"source"},{"query":"A retrieval pipeline sends the eight most relevant filing chunks to a smaller model, but footnote figures remain wrong. Engineers disagree on whether retrieval omits the relevant text or extraction misreads it. What should they inspect first?","type":"multiple-choice","options":[{"text":"Report exact-match accuracy separately for each of the 120 fields across the quarter, and rank the fields by how often they are wrong.","explanation":"Accuracy per field is an end-to-end measure. It shows which fields fail, but the team already knows that the footnote-only fields fail. It cannot show whether each wrong value came from the search step or from the model.","correct":false},{"text":"Send the footnote-only fields to the most capable tier with the same eight chunks, and keep the smaller tier for the other fields.","explanation":"A more capable model can read only the text it receives. If the footnote chunk is not among the eight, the most capable tier fails in the same way, and the team has added back the cost that the finance team questions. This change is a good choice only after the team has confirmed that the chunk reaches the model.","correct":false},{"text":"Raise the number of chunks passed to the smaller tier for each field from eight to forty across all filings.","explanation":"Forty chunks means about five times as much retrieved text for every field in 30,000 filings. The extra unrelated text can also distract the model. The change helps only if the footnote chunk is ranked between ninth and fortieth. It does not help if the model already receives the chunk and extracts the wrong number.","correct":false},{"text":"For a sample of the wrong values, check whether the chunk that holds the footnote figure was among the eight retrieved.","explanation":"The two engineers describe failures at two different stages: the search step and the extraction step. Human values exist for these filings, so the team can find the passage that holds each correct figure and see whether it reached the model. This one low-cost check shows which stage needs the fix.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> For a sample of the wrong values, check whether the chunk that holds the footnote figure was among the eight retrieved.\u003c/p>\n\u003cp>A retrieval pipeline has several stages. The filing is split into chunks, a search ranks the chunks for each field, and the model extracts a value from the chunks it receives. A wrong value at the end can come from any of these stages, and an end-to-end score cannot show which one. The two engineers describe two different stages. So the team needs a measurement that separates the stages before it pays for a fix.\u003c/p>\n\u003cp>Basalt has human values for these filings, so a reviewer can find the passage that contains each correct footnote figure. The team then checks whether that chunk was among the eight sent to the model. This is a \u003cstrong>retrieval recall\u003c/strong> check: it measures the share of cases in which the needed passage is in the top results. Anthropic's retrieval experiments use the same idea and report the share of relevant chunks that are missing from the top 20.\u003c/p>\n\u003cp>The result tells the team which fix to choose:\u003c/p>\n\u003cul>\n\u003cli>If the chunk is usually missing, the fault is in retrieval. Possible fixes are to keep each footnote together with the table it explains, to add a short context to each chunk before indexing, to add BM25 keyword search next to the embedding search, or to retrieve a larger set and rerank it.\u003c/li>\n\u003cli>If the chunk is usually present, the fault is in generation. The team should then look at the prompt, at requiring the model to quote the passage it used, or at a larger tier for these fields only.\u003c/li>\n\u003c/ul>\n\u003cp>The other choices act before this check. Sending the footnote-only fields to the most capable tier raises cost again, and it changes nothing if the footnote text never reaches the model. Passing forty chunks multiplies the retrieved text for every field. It can lower extraction quality because of the extra unrelated text, and it does not help if the model already has the passage. A table of accuracy per field repeats what the team knows: the footnote-only fields fail. It does not show \u003cem>why\u003c/em> they fail.\u003c/p>\n\u003cp>See \u003ca href=\"https://www.anthropic.com/research/contextual-retrieval\">Contextual Retrieval\u003c/a> for how retrieval failure is measured and for the hybrid search, chunk context and reranking techniques, and \u003ca href=\"https://docs.anthropic.com/en/docs/build-with-claude/embeddings\">Embeddings\u003c/a> for embedding and reranking models.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 8; Domain: Production Integration, Reliability, and Knowledge Grounding","answerStatus":"source"},{"query":"During a Claude API 529 overload, a shared six-retry policy makes interactive drafting slow and background email sorting add traffic. Drafting needs quick failure feedback, while sorting must eventually finish. What retry strategy fits both?","type":"multiple-choice","options":[{"text":"Turn on streaming for the drafting feature to show its first words within one second, and keep the shared wrapper for the other two features.","explanation":"Streaming shows text sooner only when the request is accepted and the model starts to generate. During the incident, the API rejected the requests with an overloaded error. So there was no text to stream while the wrapper waited between retries. The sorting retries would also continue to keep request volume high.","correct":false},{"text":"Split the policy by feature: drafting shows a \"try again\" message after one quick retry, and sorting waits in a queue behind a circuit breaker.","explanation":"Drafting has a user waiting and a one-second target. So it should fail quickly with a clear message and not run a long backoff sequence. Sorting has no user waiting, but it runs on every new email. Holding it in a queue until the circuit breaker allows traffic again removes most of the retry volume. Every email is still sorted after the overload ends.","correct":true},{"text":"Keep one wrapper for all three features, but add jitter to the backoff and lower its limit from six retries to two retries on every call.","explanation":"Fewer retries would reduce volume and shorten the wait for drafting, but one policy still cannot fit both features. Drafting would still wait through backoff delays that are longer than one second. Sorting would stop trying after two attempts during a twelve-minute overload, so many emails would stay unsorted.","correct":false},{"text":"Ask Anthropic to raise the organization's rate limits so that drafting and sorting both have enough capacity during the Monday morning peak.","explanation":"A rate limit controls how much one organization may send, and going over it produces a 429 error. The incident produced 529 overloaded errors, which mean that the service itself was temporarily short of capacity. A higher limit for Inkwell would not stop those errors or change how the wrapper reacts to them.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Split the policy by feature: drafting shows a &quot;try again&quot; message after one quick retry, and sorting waits in a queue behind a circuit breaker.\u003c/p>\n\u003cp>An overloaded error means that the API is temporarily short of capacity. It is different from a 429 rate limit error, which means that one organization has gone over its own limits. During an overload, each extra request from a client adds load and has a low chance of success. So the main design question for a client is this: which requests can wait, and which should fail quickly?\u003c/p>\n\u003cp>The Inkwell features give different answers to that question. A user who clicks the draft button is watching the screen, and the product target is text within one second. Six retries with \u003cstrong>exponential backoff\u003c/strong> (a wait that doubles after each failure) cannot meet that target. The useful behavior is one fast retry and then a clear message that lets the user try again. This is called \u003cstrong>graceful degradation\u003c/strong>: the feature gives a smaller but honest result when the full result is not available.\u003c/p>\n\u003cp>Sorting is the opposite case. No user waits for it, but it runs on every new email, so its retries are the largest source of request volume. Sorting work should go into a \u003cstrong>queue\u003c/strong> behind a \u003cstrong>circuit breaker\u003c/strong>. A circuit breaker stops sending calls after repeated failures, sends a small test call after a pause, and allows normal traffic again when the test succeeds. The queued emails are sorted after the overload ends. So no email is skipped, and the retries no longer keep volume high.\u003c/p>\n\u003cp>Lowering the retry limit for every call helps a little, but it keeps one policy for two different needs. Drafting still waits too long, and sorting drops emails that could have been processed a few minutes later. \u003cem>Jitter\u003c/em> (a small random change to each wait) is a good addition to any backoff, because it stops many clients from retrying at the same moment. However, it does not decide which work should wait. A higher rate limit does not help, because the organization's limits did not cause the errors. Streaming does not help either, because a rejected request produces no text to show.\u003c/p>\n\u003cp>The official SDKs also retry connection errors, rate limit errors and 5xx errors with backoff, two times by default. A wrapper that adds its own retries multiplies the number of attempts. So the team should count both layers when it sets the limits. See \u003ca href=\"https://platform.claude.com/docs/en/api/errors\">Errors\u003c/a> for the error types and SDK retry behavior, and \u003ca href=\"https://platform.claude.com/docs/en/api/rate-limits\">Rate limits\u003c/a> for how 429 responses are different.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 9; Domain: Production Integration, Reliability, and Knowledge Grounding","answerStatus":"source"},{"query":"After an outage, sorting workers release their whole backlog at once. The API returns 429 acceleration-related errors despite usage being under per-minute token limits, and simultaneous retries prolong the spike. How should workers ramp up safely?","type":"multiple-choice","options":[{"text":"Lower \"max_tokens\" on every sorting request so that each request reserves less of the output tokens per minute limit.","explanation":"The value of max_tokens does not reserve output capacity. The output tokens per minute limit is measured against the tokens that are actually generated. Also, the output limit was not the limit reached in this incident, so this change would not stop the errors.","correct":false},{"text":"Honor the \"retry-after\" time, hold sorting at a rate that succeeds, and raise that rate by one step each minute.","explanation":"The error says that usage grew too quickly. This is a limit on how fast usage can grow, not on the steady volume per minute. The documented response is to wait for the retry-after time, keep traffic at a level where requests succeed, and increase it by at most one step per minute. Sorting can wait a few minutes. So slowing the backlog also leaves capacity for draft requests, which have a one-second target.","correct":true},{"text":"Retry each failed sorting request up to ten times with a fixed two-second delay until the backlog has cleared.","explanation":"This keeps every worker sending at full concurrency, and it ignores the wait time that the API returns with the error. The total demand on the model stays as high as before, so usage keeps trying to grow faster than allowed, and the 429 errors continue. Draft requests on the same model would keep failing while the retries run.","correct":false},{"text":"Ask Anthropic to raise the per-minute input and output token limits before the workers send the backlog again.","explanation":"The scenario says that usage stayed below the per-minute input and output token limits, so those limits did not cause the 429 errors. A higher steady-state limit does not change how quickly usage for the model may grow. If the workers send the backlog again at full concurrency, the same sudden rise in usage would happen again.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Honor the &quot;retry-after&quot; time, hold sorting at a rate that succeeds, and raise that rate by one step each minute.\u003c/p>\n\u003cp>A 429 error from the Messages API does not always mean that a per-minute limit was reached. The API has three steady-state limits for each model class: requests per minute, input tokens per minute, and output tokens per minute. It also has \u003cstrong>ramp limits\u003c/strong>, which cap how quickly token usage for a model can grow. A workload can be well below its per-minute token limits and still receive a 429 error if its usage rises from a low level to a high level in a very short time. The error details state which limit applied. So the first step in any 429 incident is to read those details before choosing a fix.\u003c/p>\n\u003cp>That is what happened after the intake outage. Sorting runs on every new email, so 40 minutes of mail arrived at the model at once, and usage rose far faster than normal. For a ramp limit, the documented response is to honor the \u003ccode>retry-after\u003c/code> value, hold traffic at a level where requests succeed, and raise it by at most one step per minute. This is a form of \u003cem>backpressure\u003c/em>: the sender slows down when the service signals that it cannot accept more, and the waiting work stays in a queue. Sorting can be a few minutes late without harm. Drafting, however, must show text within one second and uses the same model. So slowing the sorting backlog also protects the feature that cannot wait.\u003c/p>\n\u003cp>Asking for higher per-minute token limits treats the wrong limit, because usage never reached those limits. Lowering \u003ccode>max_tokens\u003c/code> is based on a false idea: the output limit counts tokens that are actually generated, and \u003ccode>max_tokens\u003c/code> is not part of the calculation. Retrying with a short fixed delay keeps total demand at the same level and ignores the wait time that the API gives, so the errors continue. This leads to a general rule for recovery procedures: after any outage, release a backlog gradually through a rate-controlled queue, never at full concurrency.\u003c/p>\n\u003cp>See \u003ca href=\"https://docs.anthropic.com/en/api/rate-limits\">Rate limits\u003c/a> for the per-minute limits, ramp limits and the retry-after header, and \u003ca href=\"https://docs.anthropic.com/en/api/errors\">Errors\u003c/a> for the format of the 429 error.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 10; Domain: Production Integration, Reliability, and Knowledge Grounding","answerStatus":"source"},{"query":"Raising the shared reasoning effort improved email summaries but delayed the first streamed draft text by more than two seconds. The team wants to keep summary quality while restoring drafting speed. What should change?","type":"multiple-choice","options":[{"text":"Lower the output token limit on drafting requests so that each draft is shorter and finishes generating sooner.","explanation":"A lower output token limit stops a response earlier, so it can shorten total generation time. However, it does not change how soon the first draft word appears. Thinking tokens also count toward that limit, so a low limit could cut the draft off before it is complete. The delay before the first word would stay the same.","correct":false},{"text":"Set a lower effort level on drafting requests only, so that the model thinks less before writing the draft.","explanation":"The delay comes after the model has started responding: the model generates thinking before the first word of the draft. The effort level is the main control for how much the model thinks. Effort is set on each request, so drafting can use a lower level while summary requests keep the higher level that improved them. Before release, the team should still measure draft quality and the time to the first draft text at the lower level.","correct":true},{"text":"Add a cache breakpoint after the shared instructions so that drafting requests read that prefix from the cache.","explanation":"Reading a prompt prefix from the cache shortens the time that the model needs to process the input before it starts responding. That stage already takes less than half a second. Also, caching has no effect on output generation, and output includes thinking. The 2 seconds of thinking before the draft text would remain.","correct":false},{"text":"Return the shared effort setting to its earlier level, and improve summaries by revising the summary prompt instead.","explanation":"Returning the shared setting to its earlier level would make drafts fast again. However, it would also remove the summary improvement that the team wants to keep. A prompt revision is an untested replacement for a gain that the team has already measured. The effort level does not need to be the same for all three features.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Set a lower effort level on drafting requests only, so that the model thinks less before writing the draft.\u003c/p>\n\u003cp>A latency target such as &quot;text within one second&quot; is about the first \u003cem>visible\u003c/em> text. That is not always the same moment as the first token. \u003cstrong>Time to first token\u003c/strong> is the time from sending the request until the model begins to generate. When thinking is active, the model generates its thinking first and the answer text second. In a streamed response, the thinking content arrives before the text content. So the user waits for the time to first token plus the thinking time. Streaming is already in place for drafts, and the model begins responding in half a second. So the 2 seconds of thinking are the stage to reduce.\u003c/p>\n\u003cp>The \u003cstrong>effort level\u003c/strong> controls how much the model spends on a response, including how often and how deeply it thinks. A lower level is faster and cheaper, but it may reduce capability, so the team should test the choice on real drafting inputs. Effort is a setting on each request (\u003ccode>output_config.effort\u003c/code>), so one application can use different levels for different workloads. Summaries of long threads benefit from more reasoning and have no one-second target. A short reply draft usually needs less reasoning and has a strict target. Giving drafting its own lower level fixes the delay and keeps the summary gain. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/effort\">Effort\u003c/a> and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/thinking\">Thinking\u003c/a>.\u003c/p>\n\u003cp>Returning the shared setting to its earlier level would also make drafts fast. However, it gives up a measured improvement in summaries in exchange for a prompt change that has not been tested. The real problem is that three features with different needs share one setting. Separating the setting removes the conflict.\u003c/p>\n\u003cp>Prompt caching is useful when the time before the first token is the slow stage, because the model does not need to process a cached prefix again. It has no effect on output generation, and thinking is output. In this scenario, the model already begins responding in half a second, so a cache read cannot remove the 2 seconds that follow. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">Prompt caching\u003c/a>.\u003c/p>\n\u003cp>A lower output token limit is a hard limit on total output. It can end a response sooner, but it does not make the first draft word appear earlier. Thinking tokens count toward the same limit, so a low limit can leave too little room for the draft and cut it off. The general guidance on these measures is in \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency\">Reducing latency\u003c/a>, and the order of streamed events is described in \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/streaming\">Streaming messages\u003c/a>.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 11; Domain: Cost and Latency Optimization at Scale","answerStatus":"source"},{"query":"Three features use one Claude API key, and finance cannot attribute spending by feature or subscription plan. External telemetry cannot contain email text. What request-level measurements should the team collect?","type":"multiple-choice","options":[{"text":"Capture the full prompt and response in each trace with email addresses masked, and count tokens per feature from the stored text.","explanation":"Masking the addresses still leaves the body of each email in the vendor's storage, and the privacy policy forbids that. The stored text is also not needed, because every response already reports its own token counts.","correct":false},{"text":"Give each of the three features its own API key, and read the usage reported for each key in the Claude Console.","explanation":"Separate keys would split usage by feature, which answers half of the question. They would not split usage by plan. So the team still could not say how much of each feature's cost comes from free users.","correct":false},{"text":"Record each response's usage token counts, including cache reads and writes, as metrics labeled with feature and plan.","explanation":"Inkwell exports only the numeric token-count fields from the usage data of each response: input tokens, output tokens, and prompt-cache read and write tokens. These numbers contain no email text, so they can go to the vendor. Labels for feature and plan let the team calculate the cost for each combination. The cache counts are needed because cached and uncached input tokens have different prices.","correct":true},{"text":"Label the request counter with feature and plan, and multiply each count by the invoice's average cost per request.","explanation":"The labels are useful, but one average cost per request hides the differences between the features. A long thread summary uses far more input tokens than a sorting call. So this estimate would assign the wrong share of spend to each feature and plan.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Record each response&#x27;s usage token counts, including cache reads and writes, as metrics labeled with feature and plan.\u003c/p>\n\u003cp>Every Messages API response includes a \u003ccode>usage\u003c/code> block. It reports the number of input tokens, output tokens, tokens written to the prompt cache, and tokens read from it. These token counts are numbers, not content. So Inkwell can export only these fields to an outside metrics vendor without sending any email text. Inkwell's own service knows which feature made the call and which plan the user is on, so it can attach both as labels when it records the counts. A dashboard can then show spend for each feature, for each plan, and for each combination of the two. This works from the day the labels are added. It cannot rebuild last quarter's split, because nobody recorded the per-request data for that period. So the team should add the instrumentation now, so that it can answer the next question of this kind.\u003c/p>\n\u003cp>The cache counts are a necessary part of the answer, not an extra. The \u003ccode>input_tokens\u003c/code> field covers only the tokens after the last cache breakpoint. So the full input of a request is \u003ccode>input_tokens\u003c/code> plus \u003ccode>cache_read_input_tokens\u003c/code> plus \u003ccode>cache_creation_input_tokens\u003c/code>. Cache reads are billed at a lower rate than normal input, and cache writes at a higher rate. A cost calculation that ignores them gives the wrong figure. Recording the cache counts by feature also shows whether one feature has stopped reading from the cache, which is a common reason for a sudden rise in spend.\u003c/p>\n\u003cp>One API key for each feature is a real improvement, because the Console reports usage by key. However, it goes only as far as the feature level, and the main business problem is that free users cost more than they bring in. Only a label that Inkwell adds itself can separate free and paid usage inside each feature. Capturing full prompts and responses breaks the privacy policy even with the addresses masked, because the vendor still stores the email body. After delivery, the vendor's retention and access rules control that data. Full capture is also not needed for cost work, because the token counts arrive with every response. Multiplying labeled request counts by an average cost per request assumes that every request costs the same. The three features are very different: summaries read long threads, drafts produce more output, and sorting is small but runs on every new email.\u003c/p>\n\u003cp>The same principle applies to tracing: export timing, token counts and labels, and leave content capture off unless the destination is approved to hold the content. See \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/opentelemetry\">OpenTelemetry for the Claude API\u003c/a> for the metadata-only and full-content modes, and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/cache-diagnostics\">Cache diagnostics\u003c/a> for how to read the cache usage fields.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 12; Domain: Observability and Production Monitoring","answerStatus":"source"},{"query":"Three percent of free users generate half the free-tier AI cost through heavy thread summarization. Finance needs a firm per-user monthly ceiling without affecting ordinary users. Where should the limit be enforced?","type":"multiple-choice","options":[{"text":"Move free users' requests to a separate workspace, and set a monthly spend limit on that workspace in the Console.","explanation":"A workspace spend limit caps the combined spend of all free users, not the spend of one user. The 3% of heavy users would use most of the shared amount. When the limit is reached, requests from that workspace are rejected for every free user. Free users with ordinary use would lose summaries because of other users' activity.","correct":false},{"text":"Track each free user's token use in Inkwell's request layer, and pause that user's summaries at a monthly allowance.","explanation":"Finance asked for a limit per user, and Anthropic's spend limits do not apply to one end user of an application. Inkwell's own request layer identifies the user behind each request. So a counter for each user, checked before each summary request, stops the heavy users at the allowance. Free users who request a few summaries a week do not reach it, so nothing changes for them.","correct":true},{"text":"Lower the maximum output length on free users' summary requests, so that each summary costs less to produce.","explanation":"Most of the cost of summarizing a long thread is the input, so a shorter output saves little. The lower maximum would also cut off summaries for every free user, including users with ordinary use. A user who summarizes hundreds of threads a day would still have no limit.","correct":false},{"text":"Send free users' summaries through the Message Batches API, and show each summary in the inbox when its batch completes.","explanation":"Batch processing lowers the price of each request, but it is asynchronous. So every free user would wait for a summary that now appears as soon as they ask for it. It reduces the cost of each summary, but it sets no limit on how many summaries one user can run. The heavy users would still spend without a limit, only at a lower rate.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Track each free user&#x27;s token use in Inkwell&#x27;s request layer, and pause that user&#x27;s summaries at a monthly allowance.\u003c/p>\n\u003cp>A budget limits only the unit that it is measured on. Finance asked for a limit per free user, so both the counting and the decision to stop must happen per user. Inkwell can pass an opaque identifier for the end user (an ID that does not reveal who the user is) in a request's \u003ccode>metadata.user_id\u003c/code> field. However, that field is used for abuse detection, not for budgets. Anthropic's spend limits apply to a workspace or an organization, and they do not cap the spend of one end user of an application. Inkwell's own request layer already identifies the user behind each request, so the allowance has to be enforced there.\u003c/p>\n\u003cp>The mechanism is small. Every Messages API response includes a \u003ccode>usage\u003c/code> object with separate counts for uncached input, cache writes, cache reads and output tokens. The request layer adds these counts to a counter for the user and prices each token type separately, as described in \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\">Optimizing for cost and intelligence\u003c/a>. Before it sends the next summary request, it checks the counter. When a user reaches the monthly allowance, the layer pauses summaries for that user only. It can also show a message that offers a paid plan. Because 3% of free users produce half of the free-tier spend, an allowance set above ordinary use affects only that small group. The check runs before the request is sent, so it prevents the spend instead of reporting it afterwards.\u003c/p>\n\u003cp>A separate workspace with a spend limit looks similar, but it limits a different unit. \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/workspaces\">Workspaces\u003c/a> separate projects, environments and teams, and each workspace has its own API keys, costs and limits. A spend limit on a free-tier workspace caps the total for all free users together. The heavy users would use most of that shared amount. When the limit is reached, requests from the workspace are rejected for everyone in it. That is the opposite of what the product team asked for. The \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/spend-limits-api\">Spend Limits API\u003c/a> does not help either: it sets limits for members of a Claude Enterprise organization, not for the end users of an application built on the API.\u003c/p>\n\u003cp>The two remaining approaches lower the average cost of a summary, but neither one limits what one user can spend. A lower maximum output length saves little, because most of the cost of a long thread is input. Also, \u003ccode>max_tokens\u003c/code> cuts the summary off for every free user. The \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/batch-processing\">Message Batches API\u003c/a> costs 50% less than standard requests, but it is asynchronous. Most batches finish in under an hour, but a batch can take up to 24 hours. That is too slow for a summary that a user requests on screen. A user who summarizes hundreds of threads a day would still do so, at half the price per summary and with no upper limit.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 13; Domain: Cost and Latency Optimization at Scale","answerStatus":"source"},{"query":"Email sorting accuracy declined after retailers changed their message layouts, but latency and API error metrics stayed normal. How can the team detect sorting-quality degradation within hours rather than waiting for support tickets?","type":"multiple-choice","options":[{"text":"Rerun the sorting release test set against the production model each night, and alert when its score falls.","explanation":"A nightly rerun would detect a change in how the model handles the examples in the test set. The set was written before the retailers changed their layouts, so the model still passes it and the score does not move when the live emails change.","correct":false},{"text":"Lower the thresholds on the error rate and latency alerts for sorting calls, and page the on-call engineer sooner.","explanation":"Error rate and latency show whether sorting calls complete and how fast they complete. A call that returns the wrong folder completes normally, so stricter thresholds would add pages about availability and speed and still would not detect wrong folders.","correct":false},{"text":"Have the model return a confidence score with every sorting decision, and alert when the hourly average falls.","explanation":"A confidence value that the model writes about its own decision is not a calibrated measure of accuracy. The model can be confident and wrong on a layout it misreads, so the hourly average may stay level while sorting quality falls.","correct":false},{"text":"Track the share of sorted emails that users move to another folder, and alert when it departs from baseline.","explanation":"A user who moves a sorted email is correcting the sorter, so this share measures the outcome of sorting on live mail. Sorting runs on every new email, so the signal arrives in large numbers within hours. A rise against the usual level shows a fall in quality even when every API call succeeds.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Track the share of sorted emails that users move to another folder, and alert when it departs from baseline.\u003c/p>\n\u003cp>A wrong folder is still a successful API call. The request returns HTTP 200 at normal speed, so error-rate and latency alerts measure whether the service is available and fast, not whether its answers are correct. To detect a fall in quality, the team needs a \u003cstrong>service level indicator (SLI)\u003c/strong>, which is a number measured from live traffic that shows how well the service does its job. The team also needs a baseline or objective for that number, and an alert when the number moves away from it.\u003c/p>\n\u003cp>Sorting has no label in production that says which folder was correct, so the team must use a signal that users already produce. When a user moves a sorted email to a different folder, the user is correcting the sorter. Because sorting runs on every new email for 6 million users, these corrections arrive in large numbers every hour. The share of sorted emails that users move is therefore a frequent outcome signal. It is not a perfect measure: many users never correct a wrong folder, so the value understates the true error rate. A sudden rise against the usu
