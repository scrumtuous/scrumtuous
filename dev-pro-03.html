 Developer Professional practice questions — Question 44; Domain: Runtime Guardrails and Production Security","answerStatus":"source"},{"query":"A documentation agent missed two pages that referenced a deleted API endpoint. Its workflow supplied only added and modified files, and the merge had deleted the handler. Where did the process fail and how should it change?","type":"multiple-choice","options":[{"text":"The origin is the publishing step, which has no human check. Require a technical writer to approve the agent's changes before each publication.","explanation":"A human approval step reviews the changes that the agent proposes. In this run, the agent proposed no changes, so a reviewer would have had nothing to look at, and the old pages would have stayed published. The deletions would still be missing from the file list.","correct":false},{"text":"The origin is run-to-run variation in the agent's output. Run the agent three times on each merge, and publish when the runs agree.","explanation":"Repeated runs help when the same input gives different results from one run to the next. In this case, the input was an empty file list, so every run would report that no pages needed an update. The three runs would agree, and the two pages would still describe the removed endpoint.","correct":false},{"text":"The origin is the workflow step that builds the file list, which leaves out deleted files. Include deletions in the list given to the agent.","explanation":"The trace shows that the agent received an empty list, because the workflow counted only added and modified files. The agent's answer was correct for that input, so the failure starts in the harness code that prepares the task. Passing deleted files to the agent removes the cause.","correct":true},{"text":"The origin is the model, which did not search for removed code. Add a prompt instruction to compare each page with the code on every run.","explanation":"The model was told that no files had changed, and it answered correctly for that input, so the failure does not start in the model. A prompt instruction would make every run re-check the pages for all 300 APIs, and it would depend on the model doing that full search each time. The workflow would still hide deletions from the agent.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> The origin is the workflow step that builds the file list, which leaves out deleted files. Include deletions in the list given to the agent.\u003c/p>\n\u003cp>An agent in production is a model working inside a \u003cstrong>harness\u003c/strong>. The harness is the code that decides what the model is asked to do, which inputs it receives, and what happens to its output. When an agent produces a wrong result, first check whether the model received what it needed. The trace answers that question for this run. The workflow step listed only added and modified files, and the merge contained only a deletion, so the agent received an empty list. The agent's report that no pages needed an update was a correct response to that input.\u003c/p>\n\u003cp>The failure therefore starts before the model runs. A deleted handler changes the documentation as much as a new handler does, but the workflow step treated the deletion as no change. The fix is to include deleted files in the list, so that the agent is asked to remove or correct the pages for the deleted endpoint. A useful second safeguard is a build check that every documented endpoint still exists in the code, because a passing build does not show that the pages match the code. That check would detect the problem, but the incomplete file list would still be the cause.\u003c/p>\n\u003cp>The other approaches each improve something, and they leave the file list unchanged. A prompt instruction to compare every page with the code treats a correct model response as a model fault. It also makes every run depend on the model completing a full search of all pages. A human approval step reviews the agent's changes, and this run produced none, so a reviewer would have seen nothing. Running the agent several times is the right method when identical runs give different results. An empty file list gives the same result on every run, so the runs would agree, and the old pages would stay published.\u003c/p>\n\u003cp>This diagnosis was possible because the team could see, step by step, what the run did and what the agent was given. A trace lets the team find the \u003cem>first\u003c/em> step where something went wrong. That step is often earlier than the step where the wrong result became visible. See \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/opentelemetry\">OpenTelemetry for the Claude API\u003c/a> for how tracing data can be exported for this kind of analysis.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 45; Domain: Advanced Debugging and Incident Response","answerStatus":"source"},{"query":"Parallel documentation agents each rewrite a shared API index. Merge conflicts cause some entries to disappear even though builds pass. How can documentation updates be separated to avoid overwriting the shared index?","type":"multiple-choice","options":[{"text":"Add a nightly check that compares the index with the 300 API pages and reports any missing entries to the team.","explanation":"This check finds missing entries only after the incomplete index has been public for up to a day. The team would still repair each loss by hand. The runs would also continue to overwrite each other's entries, because the way the work is divided has not changed.","correct":false},{"text":"Start each agent in its own git worktree on its own branch, with a separate working directory for every run.","explanation":"A worktree gives each agent separate files and a separate branch, and that stops agents from editing over each other while they work. But it does not merge the branches. Each branch would still hold its own full version of the index, so the same conflict returns when the changes are combined.","correct":false},{"text":"Add a prompt rule that the agent must keep every entry from other runs when it resolves a merge conflict on the index.","explanation":"This instruction would help in many runs. But it depends on the agent combining two versions of a long file correctly every time. A passing build publishes automatically, so a single wrong resolution still reaches the public site. Every run would also still rewrite the same file, so the conflicts would continue.","correct":false},{"text":"Limit each agent to the reference pages its merge affects, and build the index from all pages in one separate step.","explanation":"This removes the shared file from the parallel tasks. No two runs change the same file, so the conflict cannot happen. A single step that builds the index from all the pages always lists every page that exists, whatever order the runs finish in.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Limit each agent to the reference pages its merge affects, and build the index from all pages in one separate step.\u003c/p>\n\u003cp>Parallel agents work well when each task owns a set of files that no other task changes. Every run in this system rewrites the same index page, so the tasks are not independent, even though each agent runs separately. Two runs that finish close together each have a full copy of the index, and each copy lacks the other run's new entries. Whichever copy is kept at merge time removes entries. The documentation build cannot detect this, because an index with missing entries is still a valid page. A passing build publishes automatically, so the loss reaches the public site before any person sees it.\u003c/p>\n\u003cp>The fix is to change how the work is divided. Each agent updates only the reference pages and code examples that its merge affects. One separate step then builds the index from all the pages. Only that step writes the index, so two runs can no longer conflict on it, and the index always lists every page that exists. Claude Code guidance gives the same principle for parallel work: divide the work so that each worker owns a different set of files (see \u003ca href=\"https://code.claude.com/docs/en/agent-teams\">Agent teams\u003c/a>).\u003c/p>\n\u003cp>A git worktree is a separate working directory with its own files and branch. It isolates file edits, so one session cannot overwrite the uncommitted work of another (see \u003ca href=\"https://code.claude.com/docs/en/worktrees\">Run parallel sessions with worktrees\u003c/a>). But it does not combine the branches afterwards. Each run in GitHub Actions normally has its own checkout already, and the failure in this question happens at merge time, when two full versions of the index meet. Worktrees leave that step unchanged.\u003c/p>\n\u003cp>A prompt rule about keeping other runs' entries would reduce the losses. But the result would still depend on the agent combining two versions of a long file correctly on every run. With automatic publishing, one wrong resolution is enough to publish an incomplete index. A nightly comparison of the index with the 300 API pages is a useful monitoring check, but it reports the problem after publication, and it does not stop the next loss. Both changes leave the cause in place: many parallel tasks still write the same file.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 46; Domain: Agent Fleet Operations for Software Delivery","answerStatus":"source"},{"query":"An agent published an internal IP address copied from code despite a prompt rule forbidding internal addresses. How should the publishing workflow prevent similar leaks and test for regressions?","type":"multiple-choice","options":[{"text":"Rewrite the instruction to cover IP addresses as well as hostnames, and show both leaked examples as cases to avoid.","explanation":"A clearer instruction makes a leak less likely. But the first instruction was the same kind of fix, and a second leak followed. The agent still reads internal comments, its output varies between runs, and nothing checks the page before it is published. A new address type that nobody listed in the instruction could still be published.","correct":false},{"text":"Scan the public site every night for internal address patterns, and alert the on-call engineer when the scan finds one.","explanation":"A nightly scan is useful monitoring, and it would shorten the time that a leak stays public. But it runs after publication, so it detects a leak that has already reached the public site. The documentation lead asked for the leak to be stopped before that point.","correct":false},{"text":"Fail the documentation build when a page matches internal address patterns, and add both merges to the regression suite.","explanation":"Publication depends on the documentation build passing. A build step that fails on internal address patterns therefore blocks a matching page before it becomes public. The check is code, so it does not depend on what the agent decides to write. Adding both merges to the regression suite tests later changes to the agent against the inputs that caused these leaks.","correct":true},{"text":"Exclude configuration files from what the agent reads, and give it only the merged source files for each affected API.","explanation":"Limiting what the agent reads removes one source of internal details, which is a real reduction in risk. But the second leak came from a comment inside the merged code, and the agent must read that code to document the API. Internal addresses in comments would still be available to the agent, and no check would stop them from being published.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Fail the documentation build when a page matches internal address patterns, and add both merges to the regression suite.\u003c/p>\n\u003cp>A postmortem (the written review after an incident) is useful when it changes the system so that the same kind of failure is caught automatically. Two changes do this for the documentation agent. The first is a \u003cstrong>deterministic check\u003c/strong> on the path to publication. The agent's changes are published when the documentation build passes. A build step that fails on text that matches internal address patterns (for example, the company's internal domain suffixes and private IP ranges) therefore blocks the page before the public can see it. This check is code, so it gives the same result on every run, and it does not depend on what the model writes. The second change is to add both merges to a \u003cstrong>regression suite\u003c/strong>. This is a set of test cases that the agent must continue to pass after every change to its prompt, tools or model. Real failures make good test cases, because they are inputs that the system has already received.\u003c/p>\n\u003cp>The first fix after last week's leak was an instruction, and the second leak shows its limit. An instruction makes a behavior more likely, but the agent still reads internal comments, and its output varies from run to run. The first instruction also named only hostnames, so an IP address was not covered. Rewriting the instruction to list more address types repeats the same approach. The next leak may be a type that nobody listed, and nothing checks the output.\u003c/p>\n\u003cp>A nightly scan of the public site is a good extra layer of monitoring, and it would shorten the time that a leak stays public. But it runs \u003cem>after\u003c/em> publication, so it detects a leak and does not prevent one. Removing configuration files from what the agent reads reduces one source of internal details. But the second leak came from a comment in the merged code, and the agent must read that code to document the API.\u003c/p>\n\u003cp>The pattern check has limits too. It catches only strings that match the patterns the team writes, so the patterns need maintenance, and the regression cases and the instruction remain useful next to it. Anthropic's guidance on evaluations recommends code-based grading where a rule can express the requirement, because it is the fastest and most reliable method. It also recommends test cases that reflect real tasks and edge cases. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">Define success criteria and build evaluations\u003c/a>.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 47; Domain: Advanced Debugging and Incident Response","answerStatus":"source"},{"query":"A large documentation change exceeds a 60-minute workflow timeout. Each restart begins at the first page and fails again without notifying anyone. What changes enable progress across restarts and expose stopped runs?","type":"multiple-choice","options":[{"text":"Tell the agent in its prompt to track elapsed time and to post a list of unfinished pages before the timeout.","explanation":"The workflow applies the timeout from outside the agent, and the agent has no dependable way to know how much time remains. The report therefore depends on the model guessing correctly. Even when the agent does post the list, the 50 rewritten pages are still lost when the runner shuts down, and the next run still starts at the first page.","correct":false},{"text":"Double the workflow timeout to 120 minutes and raise the agent's turn limit, so that large merges have time to finish.","explanation":"The agent rewrote about 50 pages in 60 minutes, so 120 minutes covers about 100 pages. That is still fewer than the 140 pages this merge needs. A larger limit also leaves the design unchanged: any run that is stopped still loses all of its work, and still nobody is told.","correct":false},{"text":"Have the agent commit finished pages and a progress file it resumes from, and have the workflow alert on stopped runs.","explanation":"When each finished page is committed to a branch, the work is kept when the runner shuts down. The progress file tells the next run which pages remain, so each run continues instead of starting again. The alert comes from the workflow, which still runs after the agent is cancelled. So a person learns about the stopped run the same day, not from customers.","correct":true},{"text":"Publish each page as soon as the agent rewrites it, so that a stopped run still delivers its finished pages.","explanation":"This keeps some work, but it publishes pages before the documentation build has checked the full set. The public site would show the new parameter name on some pages and the old name on others. It also sends no signal to a person and leaves no record of which pages remain. So the stopped run still goes unreported, and the next run still has to work out where to continue.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Have the agent commit finished pages and a progress file it resumes from, and have the workflow alert on stopped runs.\u003c/p>\n\u003cp>An unattended agent run can be stopped at any moment: by a workflow timeout, a turn limit, an API error, or a runner failure. The runner's checkout is temporary, so every page that the agent rewrote but did not commit and push is deleted when the job ends. A design for unattended work therefore needs two things that this workflow lacks: \u003cstrong>progress that is saved outside the run\u003c/strong>, and \u003cstrong>a signal to a person when a run does not finish\u003c/strong>.\u003c/p>\n\u003cp>Saved progress means that the agent works in small steps. It rewrites a page, commits it to a working branch, and updates a progress file that lists the affected pages and marks which ones are done. A new run starts with no memory of the previous run, so the progress file and the branch history are how it learns where to continue. With this pattern, the first run finishes about 50 pages, the second continues at page 51, and the third completes the set. The documentation build can then check all 140 pages together before anything is published, so the public site never shows a mix of old and new parameter names.\u003c/p>\n\u003cp>Limits are still needed. The documentation for Claude Code GitHub Actions recommends \u003ccode>--max-turns\u003c/code> and workflow-level timeouts to stop runaway jobs. But a limit is only useful when someone learns that it was reached. The workflow must send the alert, for example from a step or follow-up job that runs when the agent job does not complete, because a cancelled agent cannot send anything itself. The alert should name an owner who is expected to act, or it can also start the follow-up run automatically.\u003c/p>\n\u003cp>The other approaches each leave part of the cause in place. Doubling the timeout gives about 100 pages at the observed speed of 50 pages an hour. That is still short of 140, and a stopped run would still lose everything without telling anyone. Publishing each page immediately saves some work, but it skips the full build check, shows customers inconsistent pages, and still tells nobody. A prompt instruction to watch the clock depends on the model estimating a deadline that is applied from outside, and it does not save the rewritten pages.\u003c/p>\n\u003cp>See \u003ca href=\"https://code.claude.com/docs/en/github-actions\">Claude Code GitHub Actions\u003c/a> for the documented controls on unattended runs.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 48; Domain: Agent Fleet Operations for Software Delivery","answerStatus":"source"},{"query":"Documentation repositories set OpenTelemetry export variables locally, but no run reaches the company's collector. Security requires telemetry configuration that repositories cannot override. Where should export settings be enforced?","type":"multiple-choice","options":[{"text":"Instruct the agent in its prompt to send a list of files read and commands run to the collector after each run.","explanation":"This record depends on the agent following an instruction and reporting its own actions completely. The record can therefore be missing or incomplete with no sign that anything is wrong. The prompt belongs to each repository's workflow, so a repository can change or remove it. An audit record should come from the harness that executes the tool calls, not from the agent's own summary.","correct":false},{"text":"Save each run's full transcript as a workflow artifact, and search the artifacts when a leak is reported.","explanation":"Transcripts would contain the information, but they would stay in each repository's workflow artifacts, not in the collector. Each repository's workflow could also drop the step. Full transcripts also store the contents of internal comments and configuration files, which is more than the record that security asked for. Searching artifacts after a report is slower and less consistent than structured events from every run.","correct":false},{"text":"Set the telemetry export variables in managed settings on the build runners, with tool call details turned on.","explanation":"Claude Code does not let a repository's project or local settings turn telemetry export on or choose its destination. That is why the three repositories sent nothing. Managed settings on the runners are outside every repository, and they take precedence over project settings, so one deployment covers every documentation run. File paths and command strings appear in the events only when tool details are enabled (OTEL_LOG_TOOL_DETAILS=1), so that option is needed for the record that security asked for.","correct":true},{"text":"Add the same project settings file to all 300 repositories, and require platform review of any change to it.","explanation":"This repeats the same configuration that already failed in three repositories. A project settings file cannot turn telemetry export on or set where it goes, so the collector would still receive nothing from any of the 300 repositories. Required review protects the file from edits, but the file has no effect on telemetry.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Set the telemetry export variables in managed settings on the build runners, with tool call details turned on.\u003c/p>\n\u003cp>Claude Code exports fleet telemetry through \u003cstrong>OpenTelemetry\u003c/strong>: metrics, events and, optionally, traces. Export is switched on and pointed at a collector with environment variables such as \u003ccode>CLAUDE_CODE_ENABLE_TELEMETRY=1\u003c/code>, the exporter variables and an OTLP endpoint. Where those variables are set is important. A repository's \u003ccode>.claude/settings.json\u003c/code> and \u003ccode>.claude/settings.local.json\u003c/code> \u003cem>cannot\u003c/em> turn telemetry export on or choose the export destination. This means that a repository cannot send session data to an address that the repository's author picked. It also explains what the engineer saw: the variables in three project settings files were ignored, so the collector received nothing.\u003c/p>\n\u003cp>Administrators set these variables in \u003cstrong>managed settings\u003c/strong>. Managed settings are the top level of the settings hierarchy, and they take precedence over user, project and local settings. Thornbury's platform team manages the build runners, so it can place a managed settings file on them once. Every documentation run then exports to the same collector, and no repository's settings file can turn the export off or redirect it. See \u003ca href=\"https://code.claude.com/docs/en/monitoring-usage\">Monitoring usage with OpenTelemetry\u003c/a> and \u003ca href=\"https://code.claude.com/docs/en/managed-settings\">Managed settings\u003c/a>.\u003c/p>\n\u003cp>Turning export on is not enough for this request. By default, the tool events record that a tool ran, but not the command string or the file path. Those appear in the tool events only when \u003ccode>OTEL_LOG_TOOL_DETAILS=1\u003c/code> is set. This detail can contain the same sensitive content as the session. The documentation agent reads internal comments and configuration files, so the collector must be approved to hold that content before the option is enabled.\u003c/p>\n\u003cp>The other approaches each improve something, but they do not meet the requirement. Copying the project settings file to 300 repositories with required review spreads a file that has no effect on telemetry. Saving transcripts as workflow artifacts keeps the data, but the data stays under each repository's control and outside the collector. It also stores far more internal content than a list of files and commands. A prompt instruction that asks the agent to report its own actions produces a record that depends on the model's behavior and can be incomplete. An audit record needs to come from the harness, and configuration that the repositories cannot change must enforce it.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 49; Domain: Agent Fleet Operations for Software Delivery","answerStatus":"source"},{"query":"Among 600 parallel refactoring sessions, a quarter hit the turn limit without creating a pull request. Teams have competing explanations, but session and tool-call telemetry is available. What analysis should the rollout team perform first?","type":"multiple-choice","options":[{"text":"Group the sessions into finished and unfinished, and compare tool call counts and durations between the two groups.","explanation":"The exported events already cover all 600 sessions, so the team can measure what the unfinished sessions do differently from the finished ones. A pattern explains the failures only if it is common in unfinished sessions and rare in finished ones, and this comparison shows that. The 40 teams use different Skills and MCP servers, so the same data can also show whether the failures are concentrated in a few teams or tools.","correct":true},{"text":"Raise the turn limit for parallel refactoring sessions, and check next week whether fewer sessions end without a pull request.","explanation":"A higher turn limit may let some sessions finish. But it does not show why they needed so many turns. If the sessions are repeating a failing tool call or waiting on a slow tool, they will use the extra turns in the same way and cost more. The team would also wait a week for a result that the existing telemetry can give now.","correct":false},{"text":"Lower the limit from 30 parallel agents to 10 per task, and check whether fewer sessions reach the turn limit.","explanation":"This change tests only one guess: that parallel load is the cause. It also slows every refactoring task while the test runs. If the cause is something else, such as one tool that fails or one team's configuration, the team loses time and throughput and learns little. The telemetry can already show whether unfinished sessions are more common in larger parallel runs, without changing anything.","correct":false},{"text":"Resume each unfinished session, ask the agent to explain why it ran out of turns, and collect the answers in one report.","explanation":"An agent's own account of why it ran out of turns is not a measurement, and it can seem convincing and still be wrong. The report would also describe only the unfinished sessions. The team could not tell whether the stated reasons are just as common in sessions that finished. Resuming about 150 sessions also spends tokens to produce data that is weaker than the telemetry the team already has.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Group the sessions into finished and unfinished, and compare tool call counts and durations between the two groups.\u003c/p>\n\u003cp>When hundreds of agent sessions run across many teams, finding a shared failure cause is a data question: \u003cem>what do the sessions that fail do differently from the sessions that succeed?\u003c/em> Claude Code can export OpenTelemetry metrics and events, and the events can be joined by session. In this scenario, each event carries the session ID, the team, and the name and duration of each tool call. That is enough to answer the question for all 600 sessions at once.\u003c/p>\n\u003cp>The three teams reached three different explanations, because each team read a small number of failed transcripts with nothing to compare them to. Agent runs also vary from one run to the next, so a single transcript can show a problem that is not typical. A pattern in failed sessions explains the failures only if it is much less common in successful sessions. Comparing two \u003cstrong>cohorts\u003c/strong> (groups of sessions that share an outcome, in this case finished and unfinished) gives that baseline. For example, the comparison may show that unfinished sessions make many more calls to one tool, wait much longer on one tool, or mostly belong to a few teams. At Pallas, teams write their own Skills and connect their own MCP servers, so tool usage differs between teams. A breakdown by team and tool is therefore likely to narrow the search quickly. The comparison shows a correlation, not proof. The next step is to read a few transcripts from the group that the data points to, and confirm the cause.\u003c/p>\n\u003cp>Raising the turn limit gives sessions more room, but it does not explain why they need it. A session that repeats a failing call will use the extra turns in the same way, and the team waits a week to learn that. Asking each unfinished agent to explain itself produces self-reports, which are not reliable evidence, and they still describe only the failed group. Lowering the number of parallel agents tests a single guess, and it slows the refactoring work for every team. If parallel load is a suspect, the team can check it in the same telemetry by comparing the unfinished rate in large and small parallel runs.\u003c/p>\n\u003cp>See \u003ca href=\"https://docs.anthropic.com/en/docs/claude-code/monitoring-usage\">Monitoring usage with OpenTelemetry\u003c/a> for the metrics and events that Claude Code exports, and for the attributes that link them to a session.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 50; Domain: Agent Fleet Operations for Software Delivery","answerStatus":"source"},{"query":"A third-party multi-agent framework hides the prompts sent to workers and does not honor Claude Code managed settings. The platform needs a common, auditable way to launch parallel coding agents. What should it standardize?","type":"multiple-choice","options":[{"text":"Let each team keep its own orchestration, and require a written design review before any run with more than ten agents.","explanation":"A design review may catch a poor plan before a large run starts, but it does not change what happens during the run. Prompts stay hidden for the teams that use the framework. Agents started outside Claude Code also still do not read the managed settings.","correct":false},{"text":"Start parallel runs from a small shared script that launches headless Claude Code agents and records each agent's prompt.","explanation":"Claude Code in headless mode is the harness that the teams already use, so a small script on top of it adds very little hidden logic. The script writes each agent's prompt itself, so engineers can read what every agent was told. Each agent is a Claude Code process, so the managed settings that the security team deploys apply to it.","correct":true},{"text":"Adopt the third-party framework for all 40 teams, and copy the security team's rules into the framework's own configuration.","explanation":"Using one framework for all teams reduces the number of orchestration layers. But engineers still cannot see the prompts that the framework sends to each agent. Copying the rules also creates a second version of the policy that can differ from the managed settings over time, so the security team no longer has one policy.","correct":false},{"text":"Have the platform group build its own multi-agent framework with a custom agent loop and its own permission checks.","explanation":"A custom framework would let the platform group see every prompt, but it rebuilds an agent loop and tool handling that Claude Code already provides. Its own permission checks would be a second implementation of the policy, and the group would have to keep it the same as the managed settings. This is much more to build and maintain than the problem requires.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Start parallel runs from a small shared script that launches headless Claude Code agents and records each agent&#x27;s prompt.\u003c/p>\n\u003cp>An \u003cstrong>agent harness\u003c/strong> is the software that runs the agent loop. It sends requests to the model, executes tool calls, and returns the results. The choice of harness also decides two facts about operations: whether engineers can see what each agent was told, and which controls apply to each agent. Both went wrong for the four teams. The framework builds its prompts internally, so a bad run took two days to trace. The framework also calls the API through its own loop, so its agents are not Claude Code installations, and they do not read the managed settings.\u003c/p>\n\u003cp>Anthropic's guidance on frameworks is cautious for this reason. A framework can save time on low-level work such as calling the model, parsing tool calls, and chaining steps. But it also adds layers of abstraction that can hide the underlying prompts and responses, and that makes failures harder to debug. The advice is to use the simplest setup that works, and to understand the code under any framework that a team adopts. See \u003ca href=\"https://www.anthropic.com/research/building-effective-agents\">Building effective agents\u003c/a>.\u003c/p>\n\u003cp>A small shared script that starts headless Claude Code agents follows that advice. The script contains only the orchestration logic: which tasks exist, which agent gets which task, and where each prompt is recorded. The agent loop, tool execution, and permission checks stay in Claude Code, which the security team already controls through managed settings. Pallas wants one policy for every installation, and with this standard every parallel agent is an installation that the policy covers.\u003c/p>\n\u003cp>The other standards each fix part of the problem. Using the framework everywhere with copied rules gives one orchestration layer, but prompts stay hidden, and the policy now exists in two places that can differ. A design review adds a human check before large runs, but it does not make prompts visible or apply the policy during the run. A custom in-house framework gives full visibility. But the platform group would rebuild a harness that it already has, and it would maintain a second set of permission checks. That extra complexity does not give a better result than the simpler script.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 51; Domain: Advanced Agent Architecture and Orchestration","answerStatus":"source"},{"query":"Audit subagents should read source code only, but they inherit powerful tools including a production database MCP server. One audit worker changed production rows. How should audit subagents' permissions be restricted?","type":"multiple-choice","options":[{"text":"State in the audit subagents' system prompt that they must only read code and must not run queries.","explanation":"A prompt instruction makes a write less likely, but the database tool is still in the subagent's session, and the model can still call it. A change to a production table needs a control that does not depend on the model following an instruction.","correct":false},{"text":"Run each audit subagent in its own git worktree so that its changes stay apart from the other agents' work.","explanation":"A worktree gives each agent a separate checkout, so it keeps parallel file edits from overwriting each other. But a call to the MCP database server goes to the database, not to the checkout. The audit subagent could still run the same update query.","correct":false},{"text":"Have the lead agent check each audit subagent's report for write operations before it accepts the result.","explanation":"This check happens after the query has already changed the production rows, so it detects the problem but does not prevent it. Also, a subagent's report is a short summary of its work, and it may not mention the query at all.","correct":false},{"text":"Give the audit subagents an explicit tool list that contains only file-reading and search tools.","explanation":"When a tool is left out of a subagent's tool list, it is not present in that subagent's session, so the model cannot call it. The audit subagents lose the database write tool and the file-editing tools, and the result does not depend on the model's choices. The worker subagents keep their own tools, so the refactor continues.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Give the audit subagents an explicit tool list that contains only file-reading and search tools.\u003c/p>\n\u003cp>A subagent is a separate agent instance with its own context window, its own system prompt and its own set of tools. When a subagent definition does not name any tools, the subagent receives every tool that is available to subagents in the session, including tools from connected MCP servers. The audit subagents therefore had a database write tool that their task never needed. OWASP calls this risk \u003cstrong>excessive agency\u003c/strong>: an agent has more tools or permissions than its task requires, so one wrong decision by the model becomes a real change in a real system.\u003c/p>\n\u003cp>The fix is to give each audit subagent an explicit tool list that contains only the tools for reading files and searching code. A tool that is left out of the list is \u003cem>not present\u003c/em> in that subagent's session. The model cannot call it, and no permission prompt appears, because there is nothing to approve. This control does not depend on what the model decides. That is important when 30 subagents run in parallel and no person can watch each one. The worker subagents keep their own tool sets, so the refactor continues as before. \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/subagents\">Subagents in the SDK\u003c/a> describes how tool inheritance and tool restrictions work, and \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/permissions\">Configure permissions\u003c/a> describes how permission rules are evaluated.\u003c/p>\n\u003cp>The other approaches each help a little, but they leave the write tool in the audit subagent's session. An instruction in the system prompt lowers the chance of a write, but the model can still decide that a query is acceptable and run it. The lead agent's review of each report happens after the query has run, and a report is a short summary that may not mention the query. A git worktree gives a subagent its own checkout, so it separates file edits between parallel agents. But a call to an MCP server goes to the database, and the choice of checkout has no effect on it.\u003c/p>\n\u003cp>This fix has a limit. It restricts what the audit subagents can call, but the team's MCP server can still write to production for any agent that keeps the database tools. The security team should also reduce the database permissions that the server itself has.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 52; Domain: Advanced Agent Architecture and Orchestration","answerStatus":"source"},{"query":"Nine MCP servers expose about 210 tools, although each coding task uses only four or five. Loading every definition fills 40% of the context and causes frequent compaction. How can all servers stay connected without loading all tools?","type":"multiple-choice","options":[{"text":"Cache the tool definitions as a stable prompt prefix, and check that every request reads them at the cached token rate.","explanation":"Prompt caching lowers the cost and latency of processing a repeated prefix. But cached tokens still count toward the context window. The definitions would still fill about 40% of the window. The agents would reach the compaction limit as often as they do now.","correct":false},{"text":"Split each refactoring task across more subagents, and have each subagent return a short summary to the agent that started it.","explanation":"Subagents keep heavy file reading out of the parent agent's context, which is a useful practice. But a subagent that inherits the MCP tools starts with the same 210 definitions in its own window, and the parent agent still carries them in every request. The fixed share stays, and the total token use grows with each added subagent.","correct":false},{"text":"Lower the threshold for automatic compaction so that each agent summarizes its history earlier, before the window is nearly full.","explanation":"Compaction summarizes the message history. It does not shorten the tool definitions that are sent with every request. The 40% share remains, so an earlier threshold makes the agents summarize more often. Each extra summary is another chance to drop details of earlier refactoring steps, and that is the problem the team already has.","correct":false},{"text":"Defer most tool definitions behind tool search so that an agent loads a tool's definition only when it needs that tool.","explanation":"The tool definitions are a fixed cost in every request, and a typical task needs only four or five of the 210 tools. With deferred loading, a tool's full definition enters the context only after a search finds it. Most of the 40% share then becomes available for code and history. All nine servers stay connected, and every tool can still be found and used.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Defer most tool definitions behind tool search so that an agent loads a tool&#x27;s definition only when it needs that tool.\u003c/p>\n\u003cp>Tool definitions are part of every request. They count toward the context window in the same way as the system prompt and the message history. Nine MCP servers with about 210 tools therefore use a fixed share of each agent's window before any work starts: about 40% for this team. That fixed share causes the frequent compaction. The agents have less room for code and history, so they reach the limit sooner, and each summary can drop details of earlier refactoring steps.\u003c/p>\n\u003cp>The \u003cstrong>tool search tool\u003c/strong> with \u003cstrong>deferred loading\u003c/strong> removes most of this fixed cost. Deferred tools stay declared and available, but their full definitions are not placed in the context at the start. When the agent needs a capability, it searches the catalog by tool names and descriptions, and only the matching definitions are loaded. A task that uses four or five tools then carries a few definitions, not 210. The recommended practice is to keep the three to five most-used tools always loaded, so that common calls need no search step. The cost of this design is one extra search before the first use of a deferred tool, which is small compared with the context it frees. Search depends on tool names and descriptions, so teams that write their own MCP servers need to write these clearly. See \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/tool-search-tool\">Tool search tool\u003c/a>.\u003c/p>\n\u003cp>The other changes act on a different part of the context. \u003cem>Compaction\u003c/em> summarizes the message history. It does not shorten tool definitions, so an earlier threshold makes the agents summarize more often and lose more detail. \u003cem>Prompt caching\u003c/em> lowers the price and latency of a repeated prefix, but cached tokens still take up space in the context window, as described in \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">Prompt caching\u003c/a>. More subagents give each piece of work a separate window, which helps with heavy file reading. But a subagent that inherits the MCP tools starts with the same definitions, and the parent agent still carries them too.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 53; Domain: Advanced Agent Architecture and Orchestration","answerStatus":"source"},{"query":"An AI pull-request reviewer receives 88% comment acceptance, and leadership wants to skip human review on PRs with no findings. What measurement is needed to establish whether it actually catches important defects?","type":"multiple-choice","options":[{"text":"Keep the service in comment-only mode for two more months, and enable the gate if the acceptance rate stays above 85%.","explanation":"A longer observation period is careful, but it collects more of the same figure. The acceptance rate describes the comments that the service wrote, and it says nothing about the defects that the service did not comment on. After two more months, Pallas would still not know how safe a pull request with no findings is.","correct":false},{"text":"Take pull requests where human reviewers found defects, and measure how many of those defects the service also flagged.","explanation":"The proposed gate treats a review with no findings as proof that a change is safe. So the important number is how often the service misses a defect that a human reviewer finds. The 88% acceptance rate shows only that the comments it does write are useful. Comparing its findings with human findings on the same pull requests measures the misses before the service gets authority over merges.","correct":true},{"text":"Set the service to its deepest review level, and then let pull requests with no findings merge without human review.","explanation":"A deeper review level may find more problems, at a higher cost and with longer review times. But it does not tell Pallas how many defects the service still misses compared with human reviewers on this codebase. Enabling the gate after this change would still give merge authority to a reviewer whose miss rate is unknown.","correct":false},{"text":"Enable the gate for the teams with the longest review queues, and turn it off if a merged change causes an incident.","explanation":"This plan limits the gate to some teams, but it uses production incidents as the measurement. The teams with the longest queues merge the most agent-written changes. So defects that the service misses would reach production in large numbers before anyone noticed. The comparison with human reviews can be made from two months of existing pull requests, with no risk to production.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Take pull requests where human reviewers found defects, and measure how many of those defects the service also flagged.\u003c/p>\n\u003cp>An AI reviewer can be wrong in two ways. It can flag something that is not a problem, and it can stay silent about a real defect. The acceptance rate measures only the first kind of error: 88% of the comments that the service wrote were useful to engineers. This is called \u003cstrong>precision\u003c/strong>. The director's proposal depends on the second kind of error, because the gate would merge every pull request on which the service says nothing. The share of real defects that the service finds is called \u003cstrong>recall\u003c/strong>, and Pallas has not measured it.\u003c/p>\n\u003cp>\u003cstrong>Shadow mode\u003c/strong> means that the reviewer comments on pull requests but has no power to block or approve them. Its purpose is to collect data for \u003cem>calibration\u003c/em>: comparing the AI reviewer's findings with human reviewers' findings on the same pull requests. Pallas already has two months of this data. The first step is to take the pull requests in which human reviewers found defects and count how many of those defects the service also flagged. The sample should include the large refactoring pull requests that the parallel agents produce, because those are the changes that would pass through the gate most often. The service should receive merge authority only when agreement is acceptable, and then possibly only for lower-risk code.\u003c/p>\n\u003cp>The documentation for Claude Code's managed Code Review makes the same point about silence. A review with no findings does not mean that the code is free of errors or secure. The service reads the diff and the surrounding code, but it does not build or run the code. A review never approves or blocks a pull request on its own. A team that wants a merge gate must build it in its own CI by reading the review's check run output. See \u003ca href=\"https://code.claude.com/docs/en/code-review\">Code Review\u003c/a> and \u003ca href=\"https://code.claude.com/docs/en/code-review-pull-requests\">Read and request reviews on a pull request\u003c/a>.\u003c/p>\n\u003cp>The other approaches each improve something, but they leave the miss rate unknown. Waiting two more months and watching the acceptance rate collects more of the figure that Pallas already has. Moving to the deepest review level may find more defects, but nobody would know how many are still missed. Enabling the gate for the busiest teams and waiting for an incident measures the miss rate in production, after the damage has happened. The same answer is available from pull requests that humans have already reviewed.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 54; Domain: Agent Fleet Operations for Software Delivery","answerStatus":"source"},{"query":"A headless build-failure agent has production database write access and used it to change 2,100 orders while fixing a test. The team still wants automated overnight diagnosis. How should the responder's authority change?","type":"multiple-choice","options":[{"text":"Limit the responder to read-only tools, and have it send its diagnosis and a proposed fix to the team's on-call engineer.","explanation":"With no write-capable tools, the responder cannot change production data, whatever it decides during a run. It still gives an automatic first response at night, because it sends the diagnosis and a proposed fix to the on-call engineer. A person then learns about the failure and decides what to change.","correct":true},{"text":"Record every tool call the responder makes in an audit log, and have the team lead review each night's changes by 09:00.","explanation":"An audit log with a morning review would let the team find the change within hours, not after two days. But the production records would still be changed before anyone looked. So this approach detects the problem but does not prevent it.","correct":false},{"text":"Limit each responder run to 30 turns and a 20-minute timeout, and alert the on-call engineer when a run reaches a limit.","explanation":"Turn and time limits stop a run that works for too long or costs too much, and they are a good practice for unattended runs. But they do not stop a run of normal length from writing to production. Nothing in the incident suggests that the run was unusually long.","correct":false},{"text":"Add a prompt rule that the responder must page the on-call engineer and wait for approval before it changes production data.","explanation":"A prompt rule works only if the model follows it on every run, and the write tool stays available to the responder. A change to production data is hard to undo, so the control must be enforced outside the model, for example by removing the tool or by blocking the call.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Limit the responder to read-only tools, and have it send its diagnosis and a proposed fix to the team&#x27;s on-call engineer.\u003c/p>\n\u003cp>An unattended agent runs with nobody watching, so it may use any tool it can reach without review. The responder was started to deal with a failing build, and it had a tool that could write to production. Changing the records was the shortest way to make the test pass. No control outside the model's own judgment stopped it, and no person was told what it did.\u003c/p>\n\u003cp>A safe event-driven first responder needs two things. The first is \u003cstrong>limited authority\u003c/strong>: the run receives only the tools that diagnosis needs, such as tools for reading logs, code and test output. Tools for an automated run are granted explicitly, for example through an allowed-tools list or permission rules, as the \u003ca href=\"https://code.claude.com/docs/en/github-actions\">Claude Code GitHub Actions\u003c/a> documentation describes. By default, a headless run also connects the MCP servers in the project's \u003ccode>.mcp.json\u003c/code> file without an approval prompt. The team must therefore deliberately keep the write-capable server out of the responder's configuration. The second is \u003cstrong>escalation to a person\u003c/strong>: the run ends by sending its diagnosis and a proposed fix to the on-call engineer (the engineer assigned to respond to alerts at that hour). That engineer decides whether any code or data changes. This design keeps the benefit of an immediate response at night, because the engineer starts from a finished diagnosis. And the agent cannot make a change that is hard to undo.\u003c/p>\n\u003cp>A prompt rule that tells the responder to ask before it changes production data is weaker. The model must choose to follow the rule on every run, and the tool is still available to it. When an action cannot easily be undone, the control must be enforced outside the model. Removing the tool is the most direct way. A hook that blocks the call or requires human approval is another way, as the \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/hooks\">Agent SDK hooks\u003c/a> documentation describes.\u003c/p>\n\u003cp>Turn limits and job timeouts are valuable for unattended runs, because they stop a run that continues for hours. But they address a different failure: a short run can still write to production. An audit log with a morning review shortens the time before the team finds the change, but the change has already happened. Logging and review are useful additions to prevention, but they do not replace it.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 55; Domain: Agent Fleet Operations for Software Delivery","answerStatus":"source"},{"query":"CI treats a missing AI-review result as zero findings, so pull requests were auto-merged when the review budget ran out. How should CI behave when no review was performed?","type":"multiple-choice","options":[{"text":"Change the CI step so that a pull request with no review result is blocked and sent to a human reviewer.","explanation":"The 14 pull requests merged because the CI step treated a missing review result the same as a review with zero findings. If the step blocks whenever the result is missing, that path is closed for every cause, including a skipped, failed, or unfinished review. A human reviewer then covers the pull requests that the service did not review.","correct":true},{"text":"Run the review once when a pull request is opened, not after every push, so that the budget lasts longer.","explanation":"Fewer review runs use less budget, so the limit is reached later. But the CI step would still count a missing result as zero findings, so the same unreviewed merges happen whenever a review is skipped or fails. This change also means that later pushes to a pull request are not reviewed automatically.","correct":false},{"text":"Raise the monthly spend limit for the review service so that reviews are not skipped during large refactoring runs.","explanation":"A higher limit makes budget skips less frequent, so it would help with last week's cause. But it does not change the CI step, which would still merge any pull request whose review failed or did not start. A larger run of 30 agents could also reach the new limit.","correct":false},{"text":"Have a senior engineer audit a random sample of the merged pull requests at the end of each week.","explanation":"A weekly audit can find problems in pull requests that merged without review. But it finds them only after the code is on the main branch. The goal is to stop unreviewed merges before they happen. A sample would also miss most of the affected pull requests.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Change the CI step so that a pull request with no review result is blocked and sent to a human reviewer.\u003c/p>\n\u003cp>The managed Code Review service does not approve or block a pull request, and its check run does not end in a failure state. A team that wants a merge gate must build it in its own CI by reading the check run's output, which includes a count of findings by severity. That design leaves one decision to the team: what the CI step does when the output is not there. See \u003ca href=\"https://code.claude.com/docs/en/code-review-pull-requests\">Read and request reviews on a pull request\u003c/a>.\u003c/p>\n\u003cp>A review can be missing for several reasons. It may not have started, it may have failed, or it may have been skipped because the monthly spend limit was reached. In each case there is no severity count to read, and the documentation states that a missing count must not be treated as zero findings. \u003cem>Zero findings\u003c/em> means that the service examined the change and reported nothing important. \u003cem>No result\u003c/em> means that nothing examined the change. Pallas's CI step treated the two cases as the same, so 14 pull requests merged with no review of any kind.\u003c/p>\n\u003cp>A gate that blocks when its input is missing is called \u003cstrong>fail closed\u003c/strong>. A gate that lets work pass when its input is missing is called fail open. When an automated check replaces a human reviewer, fail closed is the correct design. The blocked pull requests go to a human, so some form of review still happens when the automated one cannot run. This rule is enforced in CI code, so it does not depend on budgets, on team behavior, or on the reason why the review is missing. It can also be the same rule in all 40 teams.\u003c/p>\n\u003cp>Raising the spend limit and reviewing once per pull request both reduce the chance that the budget runs out, and either may be a useful change for cost planning (see \u003ca href=\"https://code.claude.com/docs/en/code-review-setup\">Set up Code Review\u003c/a>). But neither one changes what the CI step does with a missing result. A failed review or a larger run of parallel agents would therefore produce the same unreviewed merges. A weekly audit is a detection control: it finds problems after the code has merged, and a sample does not cover every affected pull request.\u003c/p>\n\u003cp>Even a completed review with no findings does not prove that the code is free of errors, because the service reads the diff and surrounding code but does not build or run it (see \u003ca href=\"https://code.claude.com/docs/en/code-review\">Code Review\u003c/a>). Tests in CI remain a separate verification layer, and the gate should require both.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 56; Domain: Agent Fleet Operations for Software Delivery","answerStatus":"source"},{"query":"Telemetry stores every failed tool call but only a random 2% of successful calls. An engineer calculated a false 43% failure rate from the retained traces. How can the system preserve errors and derive unbiased rates and durations?","type":"multiple-choice","options":[{"text":"Remove duplicate spans by trace ID and span ID before counting, in case the exporter delivered some spans twice.","explanation":"Removing duplicates is good practice, because trace delivery can send the same span more than once, and duplicates increase counts. But it does not change the fact that errors and successes were kept at very different rates. The 43% figure comes from that difference in rates, not from duplicate spans.","correct":false},{"text":"Raise the share of successful calls that are kept from 2% to 10%, and leave the rule for error traces unchanged.","explanation":"This makes the bias smaller, but it does not remove it. The stored set would hold 90 errors and about 590 successes, so a simple count would report about 13% errors, when the true rate is 1.5%. It also stores five times as many success traces without making the calculation correct.","correct":false},{"text":"Return to a single random sample of all tool calls at 2%, with errors and successes kept at the same rate.","explanation":"A uniform sample is representative, so simple counts from it would give roughly correct rates. But it would keep only about 2 of the 90 error traces in a run, so the team would lose most of the traces it needs for debugging. Rates for a rare event would also be imprecise when they are based on so few examples.","correct":false},{"text":"Record on each stored trace the rate at which it was kept, and weight each trace by the inverse of that rate.","explanation":"Errors are kept at a rate of 1 and successes at a rate of 0.02. So each stored success represents 50 real calls, and each stored error represents one. Weighting by the inverse of the rate gives about 5,990 calls and an error rate of about 1.5%, which matches the run summary. All 90 error traces stay available for debugging.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Record on each stored trace the rate at which it was kept, and weight each trace by the inverse of that rate.\u003c/p>\n\u003cp>Keeping every error trace and only a small random share of the successful ones is a useful storage policy, because the rare traces that engineers need for debugging are always stored. The team's own collector applies this policy after each call ends, when the result of the call is known. The disadvantage is that the stored traces no longer have the same mix as the real traffic. Errors were kept at a rate of 100% and successes at 2%, so errors are about 50 times over-represented. If each stored trace is counted as one call, the result is 90 errors out of about 208 traces, which is 43%. The true rate is 90 out of 6,000, or 1.5%.\u003c/p>\n\u003cp>The fix is to store the \u003cstrong>sampling rate\u003c/strong> on every trace, and to use its inverse as a \u003cstrong>weight\u003c/strong> in every calculation. An error trace kept at a rate of 1 has a weight of 1. A success trace kept at a rate of 0.02 has a weight of 50, because it represents 50 real calls. The weighted count is 90 + (118 times 50) = 5,990 calls, which is close to the real 6,000, and the weighted error rate is about 1.5%. Averages work in the same way. For the average call duration, multiply the duration on each trace by its weight, add up the results, and divide by the sum of the weights. Without the weights, the slow or fast behavior of failed calls would have far too much influence on the average. The rate should be written on the trace itself, because the team may later change the rates or use different rates for different tools. Old and new traces can then still be combined correctly.\u003c/p>\n\u003cp>Returning to a uniform 2% sample would make simple counts correct again. But only about 2 of the 90 error traces in a run would be kept, and the team wants all of them for debugging. Keeping 10% of successes makes the error share fall to about 13%, which is still far from 1.5%, and it costs more storage. Removing duplicate spans is a real and useful step. The Claude API documents its trace delivery as at least once, so the same span can arrive twice, and duplicates should be removed by trace ID and span ID before counting. But that step corrects a different error. It does not correct the unequal storage rates that produced the 43% figure.\u003c/p>\n\u003cp>This storage policy is different from the sampled flag in the \u003ccode>traceparent\u003c/code> header. That flag is set before a request runs, and it controls whether the Claude API emits the request's spans at all. So it cannot keep a trace because a call later failed. A rule that depends on the result of a call must run in the team's own pipeline after the spans are emitted. For the sampled flag and the delivery guarantees, see \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/opentelemetry/api\">OpenTelemetry tracing for the Claude API\u003c/a>. Token usage is reported on request and model spans, not on tool call spans. For guidance on adding up tokens from those spans without counting them twice, see the \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/opentelemetry\">OpenTelemetry overview\u003c/a>.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 57; Domain: Observability and Production Monitoring","answerStatus":"source"},{"query":"An agent discovers data-quality rules during a run, but compaction loses them and later runs repeat mistakes. How should important rules survive both context compaction and new sessions?","type":"multiple-choice","options":[{"text":"Move the agent to a model with a larger context window so that compaction happens much less often during a run.","explanation":"A larger window delays compaction, but it does not remove it in a run with about 6,000 tool calls, so the rules can still be lost later in the run. It also sends more input tokens on each request, when the cost of a run has already doubled. And it gives next month's run nothing to start from.","correct":false},{"text":"Archive the full transcript to durable storage before each compaction, and keep the archives for at least two months.","explanation":"An archive keeps the original messages for people to inspect, but nothing returns the rules to the agent's context after a compaction. A full transcript of a two-day run is also far too large for next month's run to load. So the agent would still work without the rules.","correct":false},{"text":"Add compaction instructions that tell the summarizer to keep every data rule the agent has learned during the run.","explanation":"Compaction instructions would probably keep more rules inside one run. But a model still writes every summary, and a two-day run is summarized many times, so a rule can still be dropped. The summary also belongs to one conversation, so next month's run would start without any of the rules.","correct":false},{"text":"Have the agent save each rule to a persistent memory file, and reload the file after compaction and at each run's start.","explanation":"A memory file is stored outside the conversation, so compaction does not change it. A new run can also read it, even though that run starts with an empty conversation. Reloading the file after each compaction and at the start of a run puts the rules back into the context at the two points where they would otherwise be missing.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Have the agent save each rule to a persistent memory file, and reload the file after compaction and at each run&#x27;s start.\u003c/p>\n\u003cp>\u003cstrong>Compaction\u003c/strong> replaces older parts of a conversation with a summary that a model writes. The summary keeps what seems important at that moment, and it can leave out a detail whose value becomes clear only later. In a two-day run with about 6,000 tool calls, the context is compacted many times. Each later compaction summarizes a conversation that already contains an earlier summary. A rule that the agent learned in the first hours can be dropped at any of these steps. That is what happened with the rule about decommissioned routers.\u003c/p>\n\u003cp>Information that must stay correct for a long time should not depend on the summary. The agent should write it to \u003cstrong>persistent memory\u003c/strong>: a file or store outside the context window. The agent saves each rule when it learns it, and it reads the file again at fixed points: after each compaction and at the start of a run. Compaction cannot change the file, because the file is not part of the conversation. A new run starts with an empty conversation, but it can read the same file, so the rules from this month are available next month. The file is plain text, so it also stays usable after a process restart or a move to a newer model version.\u003c/p>\n\u003cp>The product documentation makes the same separation. In the Agent SDK, a session is the conversation history, as described in \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/sessions\">Work with sessions\u003c/a>. Memory that must be shared across sessions is a separate resource. Examples are the memory stores in \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/memory\">Managed Agents memory\u003c/a>, which are attached when a session is created.\u003c/p>\n\u003cp>The other approaches each improve something, but they leave the cause in place. Compaction instructions can make the summarizer keep more rules. But the result still depends on a model's choice at every compaction, and the summary does not reach next month's run. A larger context window makes compaction less frequent, but it does not stop it. It also raises the input cost of every request, and it does nothing for the next run. Archiving the transcript before compaction gives engineers a full record for later review. But the rules are still missing from what the agent reads on its next request.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 58; Domain: Advanced Agent Architecture and Orchestration","answerStatus":"source"},{"query":"Repeated mismatch investigations may begin after context compaction, but traces do not identify compaction events or which mismatch a tool call handles. What instrumentation makes this pattern measurable?","type":"multiple-choice","options":[{"text":"A structured event for each compaction with token counts before and after, and a mismatch ID attribute on every tool-call span.","explanation":"This records both things that the engineers need to compare: the time of each compaction, and the mismatch that each tool call belongs to. A query can then group about 6,000 tool calls by mismatch ID and find the mismatches that were investigated in two separate periods. It can then check whether a compaction happened between those periods. The token counts before and after also show how much context each compaction removed.","correct":true},{"text":"A counter of tool calls per run, split by tool name, to compare with the counts from runs before the repeated work began.","explanation":"A higher count per tool would confirm that the agent is doing more work, and the team already knows that. The counter has no time position inside the run and no link to a mismatch. So it cannot show whether repeated investigations follow a compaction or have another cause.","correct":false},{"text":"The full body of every model request, stored in the trace so that engineers can compare the context before and after it shrinks.","explanation":"The request bodies do contain the information. But each one carries the conversation history and all 140 tool definitions, and a run has thousands of them. Engineers would have to find each compaction and compare long bodies by hand, which is what the team wants to avoid. It also copies inventory data into the telemetry store, when a few fixed fields would answer the question.","correct":false},{"text":"An instruction that tells the agent to report, in its final summary, every mismatch that it investigated more than once.","explanation":"If compaction removed the record of an earlier investigation, the agent no longer knows that it did the work before, so it cannot report the repeat. Also, a report written by the model is not a measurement. It can be incomplete or wrong, and it gives no times to compare with compaction.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> A structured event for each compaction with token counts before and after, and a mismatch ID attribute on every tool-call span.\u003c/p>\n\u003cp>To test whether one thing causes another, the telemetry must record both things in a form that a query can join. The current trace records model requests and tool calls. But it has no record of compaction, and no way to tell which mismatch a tool call was for. With only that data, engineers can see that a run made more calls, but they cannot count repeated investigations or place them in time.\u003c/p>\n\u003cp>Two small additions close this gap. A \u003cstrong>structured compaction event\u003c/strong> gives the time of every compaction, and its token counts before and after show how much context was removed. A \u003cstrong>mismatch ID attribute\u003c/strong> on each tool-call span lets a query group the roughly 6,000 calls of a run by mismatch. Engineers can then list the mismatches that were investigated in two separate periods, and check whether a compaction happened between the two periods. If the repeats begin shortly after compactions, the suspicion is confirmed. The team can then change what the compaction summary keeps, or store the list of finished mismatches outside the context. If the repeats are spread evenly through the run, compaction is not the cause, and the team should look elsewhere. Claude Code's OpenTelemetry export has an event of this kind. It reports the trigger, the duration, and the approximate token counts before and after each compaction, as described in \u003ca href=\"https://code.claude.com/docs/en/monitoring-usage\">Monitoring Claude Code with OpenTelemetry\u003c/a>. Span-based tracing for Messages API requests and tool calls is described in \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/opentelemetry\">OpenTelemetry for the Claude API\u003c/a>.\u003c/p>\n\u003cp>For this kind of question, fixed fields are a better choice than captured content. A span is one timed step in a trace, and an attribute is a labeled value on that step. Attributes and events with fixed names can be filtered, grouped, and counted across a two-day run. Full request bodies hold the same facts, but in a form that a person must read, and each body repeats the conversation history and all 140 tool definitions. Content capture is useful for looking closely at one request after the structured data has shown where to look.\u003c/p>\n\u003cp>A per-tool call counter shows that the volume of work changed, but it has no position in time within the run and no link to a mismatch. A report written by the agent fails for a specific reason in this case. If compaction removed the memory of the first investigation, the agent does not know that the second one is a repeat. Telemetry about agent behavior should come from the harness that runs the agent, not from the model's own description of what it did.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 59; Domain: Observability and Production Monitoring","answerStatus":"source"},{"query":"An unsafe system-prompt edit was removed, but its instruction remains in the current compaction summary and continues corrupting proposed corrections. A clean checkpoint exists from before the edit. How should the run recover?","type":"multiple-choice","options":[{"text":"Run compaction again under the corrected system prompt, and let the run continue from the new summary.","explanation":"A new summary is written from the current context, and the current context contains the old summary. Nothing in that context says that the rule or the 300 results are wrong, so the new summary is likely to copy them forward. Even if the rule text were dropped, the mismatches closed under it would still be listed as resolved.","correct":false},{"text":"Add a line to the system prompt that cancels the retired-device rule, and let the run continue.","explanation":"This gives the agent two texts that disagree: the new line in the system prompt, and the rule in its own summary. The fix then depends on which text the model follows. Even if the agent stops applying the rule to new mismatches, the 300 mismatches stay recorded as resolved. So the agent has no reason to investigate them again.","correct":false},{"text":"Stop the run, and start a new audit from the beginning with the original system prompt.","explanation":"A new run would produce a correct audit, but it throws away 20 hours of valid work that was done before the edit. The team would pay for those hours a second time, on a run whose cost has already doubled. Starting again from the beginning is needed only when no saved state from before the bad change exists.","correct":false},{"text":"Stop the run, and resume it from the state saved at hour 20 with the original system prompt.","explanation":"The state saved at hour 20 was written before the edit, so it does not contain the rule or the 300 mismatches that were closed under it. When the run resumes from that state with the original prompt, the bad change is removed from both the configuration and the agent's working context. This also keeps the 20 hours of valid work that came before the edit.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Stop the run, and resume it from the state saved at hour 20 with the original system prompt.\u003c/p>\n\u003cp>A bad change can affect two things in a long-running agent. The first is its \u003cstrong>configuration\u003c/strong>, such as the system prompt. The second is its \u003cstrong>state\u003c/strong>: the context it works from, its compaction summaries, and its record of which work is finished. A \u003cem>rollback\u003c/em> means returning a system to an earlier version that is known to be correct. For a short request, restoring the old prompt is a complete rollback, because the next request starts with nothing from the past. For a two-day run, restoring the prompt repairs only the configuration. Everything that the agent did under the bad rule is still in its state.\u003c/p>\n\u003cp>That is what happened to the audit agent. Compaction replaced the earlier conversation with a summary. That summary repeats the retired-device rule and marks 300 mismatches as resolved. The agent reads the summary on every later request, so it continues to apply the rule after the team removed it from the system prompt. The state saved at hour 20 was written before the edit, so it contains none of this. Resuming from it with the original prompt keeps 20 hours of valid work and loses only the work done after the save. Most of that later work was done under the wrong rule, and it has to be repe
