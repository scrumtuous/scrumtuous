k success, and Anthropic's guidance lists task completion as a form of user feedback. However, checklist completion says nothing about eligibility statements. Adding a prompt instruction against those statements is a reasonable change. Without a measurement, however, the team cannot tell whether the instruction worked, and thumbs-up would still decide the test.\u003c/p>\n\u003cp>Anthropic's evaluation guidance asks for success criteria that are specific, measurable and multidimensional (covering several aspects). It lists A/B testing and user feedback as separate measurement methods: \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">Define success criteria and build evaluations\u003c/a>. The customer support guide shows the same split between user-facing measures, such as satisfaction, and behavior measures, such as topic adherence and escalation accuracy: \u003ca href=\"https://platform.claude.com/docs/en/about-claude/use-case-guides/customer-support-chat\">Customer support agent guide\u003c/a>.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 29; Domain: Evaluation Engineering and Quality Assurance","answerStatus":"source"},{"query":"Some pension-rule answers stop at the output-token limit; others end in refusals. The service treats all HTTP 200 responses as complete and its traces hide the difference. What response handling and tracing should be added?","type":"multiple-choice","options":[{"text":"Retry any reply that does not end in a complete sentence up to three times, with exponential backoff and jitter between attempts.","explanation":"Backoff and jitter help with temporary errors such as rate limits and overload. A reply that reached the output limit will reach it again when the same request is sent with the same limit, and a refusal usually ends in a complete sentence, so this check would miss it. The approach adds cost and still leaves both cases invisible in the traces.","correct":false},{"text":"Branch on the stop reason and record it in the trace: raise the output limit on length stops, and hand refusals to staff.","explanation":"Both problems arrive as HTTP 200 responses, and only the stop reason tells them apart. A length stop needs more output room, while a refusal usually repeats if the same request is sent again, so it needs a separate path such as a staff hand-off. The stop reason is a fixed value and not member data, so Calder can record it in traces under its policy.","correct":true},{"text":"Add a system prompt instruction that tells the assistant to keep answers short and to answer every question about the scheme.","explanation":"Shorter answers would reach the output limit less often, but an instruction does not guarantee length, and it does not reliably stop refusals. The service would still treat a cut-off or refused reply as finished, and the traces would still show a normal 200 status.","correct":false},{"text":"Double the output token limit on every request, and resend a request once when the member rates the reply as unhelpful.","explanation":"A higher limit on every request would reduce cut-off answers, but an answer longer than the new limit is still cut off with no signal to the service. Sending a refused request again normally produces another refusal, and waiting for a rating means the member has already received a bad reply. Nothing in this approach lets on-call engineers count either case.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Branch on the stop reason and record it in the trace: raise the output limit on length stops, and hand refusals to staff.\u003c/p>\n\u003cp>An HTTP status code tells the caller whether the API processed the request. It does not say why Claude stopped writing. Every successful Messages API response also carries a \u003cstrong>stop reason\u003c/strong>, and two of its values explain what Calder's members saw: \u003ccode>max_tokens\u003c/code> means the reply reached the output limit and was cut off, and \u003ccode>refusal\u003c/code> means the request was declined. Both arrive with HTTP 200, which is why traces that hold only timings and status codes look normal. The page \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons\">Handling stop reasons\u003c/a> describes each value.\u003c/p>\n\u003cp>These two cases need different handling. A length stop is fixed by giving the reply more room: the service can send the request again with a higher output limit, or ask Claude to continue the partial answer. A refusal is different, because sending the same request again usually produces the same result and uses more tokens. It needs its own path, such as a hand-off to Calder staff. The documentation also describes sending refused requests to a fallback model; see \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback\">Refusals and fallback\u003c/a>. Retries with exponential backoff belong to a third group: temporary errors such as rate limits and overload. The official SDKs already retry those a small number of times, as described in \u003ca href=\"https://platform.claude.com/docs/en/api/errors\">Errors\u003c/a>.\u003c/p>\n\u003cp>The stop reason is one of a small set of fixed values. It contains no member data, so Calder can add it to each trace without breaking its policy. On-call engineers can then count length stops and refusals, and they can set alerts on those counts.\u003c/p>\n\u003cp>The other approaches each help a little but leave the cause in place. Retrying replies that do not end in a full sentence repeats the cut-off, because the output limit has not changed, and it misses refusals. Doubling the limit on every request lowers the number of cut-off answers, but a longer answer is still cut off without any signal, and a resent refusal is refused again. A prompt instruction to write short answers makes length stops less frequent, but it is not a guarantee, and it does not make either case visible to the service or to the engineers.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 30; Domain: Production Integration, Reliability, and Knowledge Grounding","answerStatus":"source"},{"query":"A pasted letter contained instructions to replace a pension beneficiary, and the assistant executed the account change without the member's approval. Members should still be able to make legitimate changes. What safeguard is needed?","type":"multiple-choice","options":[{"text":"Screen each member message with a lightweight classifier model, and block messages that it flags as containing injected instructions.","explanation":"Screening messages with a small model is a useful extra layer, but a classifier misses some attacks. When it misses one, the beneficiary change can still run. It would also block this member's message, although the member only wanted to ask whether the letter was real. The update tool would still be able to run without the member's agreement.","correct":false},{"text":"Hold each beneficiary update in application code until the member confirms the old and new names on a confirmation screen.","explanation":"This check runs in application code, so it works the same way no matter what text the model has read. On the Messages API, the application executes every tool call. It can therefore hold the beneficiary update and show the member the old and new names before anything changes. The member in this incident would have seen the stranger's name and refused the change.","correct":true},{"text":"Write each beneficiary change to an audit table in the account system, and have staff review the previous day's changes every morning.","explanation":"An audit table would let staff find a wrong change within a day instead of after three weeks, which is a real improvement in detection. But the change would still be made, and the stranger would be the recorded beneficiary until staff found the error. The question asks for prevention, and a review after the change does not stop the tool call.","correct":false},{"text":"State in the system prompt that text pasted by members is untrusted data and must not lead to account-update tool calls.","explanation":"Telling the model that pasted text is data is good practice, and it lowers how often the model follows such text. But it is still an instruction to the model, and the model can reason incorrectly or be misled by persuasive text. A change to who receives a member's pension needs a check that does not depend on how the model behaves.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Hold each beneficiary update in application code until the member confirms the old and new names on a confirmation screen.\u003c/p>\n\u003cp>The member is a trusted user, but the letter is third-party content. This is \u003cstrong>indirect prompt injection\u003c/strong>: text that the model reads for a user contains instructions, and the model acts on them. The letter arrived inside the member's own chat message, so the model had no reliable way to separate the member's question from the letter's instruction. The assistant could also change a beneficiary with no further check. The OWASP Top 10 for LLM Applications calls this \u003cem>excessive agency\u003c/em>: the system can take a high-impact action based only on the model's decision.\u003c/p>\n\u003cp>On the Messages API, Claude does not run tools. It returns a tool call, and Calder's application decides whether to execute it. A deterministic control (one that gives the same result every time) should be placed at that decision point. The application can hold every beneficiary update and build a confirmation screen from the tool call's arguments and the account record. It executes the update only after the member confirms the old and new names. Application code builds this screen, not the model, so injected text cannot change what the screen shows and cannot skip it. Anthropic's guidance in \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks\">Mitigate jailbreaks and prompt injections\u003c/a> recommends limiting what a successful injection can do. It describes screening and confirmation steps as the layers that catch the injected instructions that the model does not ignore. The \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/secure-deployment\">Managed Agents secure deployment guide\u003c/a> applies the same principle. It says to require a person's review for tools whose effects cannot be undone, and for tools where relayed end-user text should not be enough to run the tool.\u003c/p>\n\u003cp>The other three controls are real layers, and Calder could keep all of them, but none of them stops the update. A screening call with a lightweight model is a documented technique, but it is a classifier, and it has false negatives and false positives. A missed injection still changes the beneficiary. A correct detection blocks a member who only wanted to ask about a suspicious letter. A system prompt policy that treats pasted text as untrusted data is also documented, and it reduces how often the model follows such text. But it depends on how the model behaves on every request. An audit table fixes a different weakness. Calder's traces record only timings and status codes, so a wrong update looks the same as a correct one. A record of old and new values in the account system would shorten detection from weeks to a day, and it would not put member data in the tracing system. But detection after the change is still not prevention.\u003c/p>\n\u003cp>The general rule for layered guardrails is this: prompt policies and classifiers lower the rate of bad attempts, and monitoring finds what happened. A check in code before the tool runs is what guarantees that a high-stakes action has the agreement of the right person.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 31; Domain: Runtime Guardrails and Production Security","answerStatus":"source"},{"query":"A pension assistant changes another member's account because its tool accepts a member ID supplied by the model, despite a system-prompt rule limiting updates to the signed-in user. What weakness and code-level fix apply?","type":"multiple-choice","options":[{"text":"Classify it as improper output handling. Enforce a strict schema on the tool input, so every call carries a well-formed member ID.","explanation":"A strict schema checks the format of the arguments, and the tester's call was already well formed. The problem is that the call named an account that the signed-in member has no right to change. That is an authorization failure. Improper output handling covers model output that is passed to other systems without validation or sanitization, which is a different weakness.","correct":false},{"text":"Classify it as excessive agency. Add the member ID of each update call to the traces, and review cross-account changes every week.","explanation":"The classification is correct. But a weekly review finds a wrong beneficiary change only after it is saved, and a beneficiary record decides who is paid. The tool keeps its authority over every record, so the same request would succeed again. Putting member IDs in traces also conflicts with Calder's policy against storing member data in its tracing system.","correct":false},{"text":"Classify it as prompt injection. Screen each message with a small model tier, and block requests to change another member's account.","explanation":"A screening call is a useful extra layer, but it is another model judgment, and a request worded differently can pass it. The tool would still accept any member ID from the model, so the cause remains. Also, the tester's message was a plain request, not hidden or manipulative text.","correct":false},{"text":"Classify it as excessive agency. Have the application set the member ID from the signed-in session, not from the model's tool call.","explanation":"The tool has more permission than the task needs: it can write to any record, and the model chooses which one. When the application takes the member ID from the authenticated session, a request about another member's account cannot succeed, however it is worded. This enforces the single-account rule in code, and it does not depend on the model following the system prompt.","correct":true}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Classify it as excessive agency. Have the application set the member ID from the signed-in session, not from the model&#x27;s tool call.\u003c/p>\n\u003cp>The assistant did what an ordinary message asked. The damage happened because the account-update tool was able to do it. OWASP calls this \u003cstrong>excessive agency\u003c/strong>: an LLM application has more functionality, more permissions, or more autonomy than its task needs, so a wrong model decision becomes a harmful action. The category applies no matter what made the model decide wrongly: a trick, an unclear request, or a plain mistake. In this case, the excess is in permissions. The tool can write to any of 1.2 million records, and the model chooses which one.\u003c/p>\n\u003cp>The fix is to take that choice away from the model. The application already knows who signed in. If the application fills in the member ID from the session and ignores any ID in the tool call, a request about another member's account cannot succeed, however it is worded. This is \u003cstrong>least privilege\u003c/strong> enforced in code. The rule in the system prompt describes the intended behavior, but a prompt does not enforce anything, and the tester's result shows that. Anthropic's guidance gives the same advice: limit Claude's access to sensitive data and actions, so that a wrong step can do little damage. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks\">Mitigate jailbreaks and prompt injections\u003c/a>.\u003c/p>\n\u003cp>The other approaches each help a little, but they leave the tool's authority unchanged. A screening call with a small model tier is a useful extra layer, but it is another model judgment, and a request phrased differently can pass it. A strict input schema checks the format of the arguments. The tester's call was well formed, but it named an account that the member had no right to change. That is why OWASP separates \u003cstrong>improper output handling\u003c/strong> (model output passed to other systems without validation or sanitization) from excessive agency. Recording member IDs in traces and reviewing them weekly finds a wrong change after it is saved. It also conflicts with Calder's policy against member data in its tracing system. A beneficiary record decides who is paid, so the control must prevent the change before it is saved.\u003c/p>\n\u003cp>Calder should also add this case to a test suite that runs before each release, with a named person who is accountable for the result. The NIST AI Risk Management Framework is based on this idea: risk is handled as a repeatable process of identifying, measuring and managing it.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 32; Domain: Runtime Guardrails and Production Security","answerStatus":"source"},{"query":"Members marked 4,200 of 900,000 pension answers wrong. Some retrieved rule sections occur in nearly half of all answers. How can the team identify sections disproportionately associated with wrong responses?","type":"multiple-choice","options":[{"text":"Count how often each rule section appears in the 4,200 marked traces, and investigate the sections that have the highest counts first.","explanation":"A count inside the marked group mostly repeats how often each section is retrieved in all traffic. The general sections that appear in almost half of all answers would be at the top of the list, even if they cause no errors. A section that is rarely retrieved but has a very high error rate would stay near the bottom and be missed.","correct":false},{"text":"For each rule section, calculate the share of answers using it that were marked wrong, and compare it with the overall share.","explanation":"A rate for each section takes into account how often the section is retrieved, so a popular section does not look bad only because it is popular. Comparing each rate with the overall rate of about 0.47% shows which sections are linked to wrong answers far more often than normal. The analysis uses only section IDs and the wrong-answer mark, so no member data enters the tracing system.","correct":true},{"text":"Record the full question and answer text on the marked traces, so that engineers can read each wrong answer and group the causes.","explanation":"Questions and answers contain member data, and Calder's policy forbids storing member data in its tracing system. Reading 4,200 conversations one at a time would also be slow, and it would not produce a rate for each section. The section IDs that are already in the traces are enough to measure where the wrong answers are concentrated.","correct":false},{"text":"Compare the retrieval timings and status codes of the marked traces with those of the traces that members did not mark.","explanation":"This compares the failure group with normal traffic, but it uses the wrong attributes. A wrong answer usually returns a success status with normal timing, so these fields are unlikely to differ between the two groups. They also say nothing about which rule sections were retrieved, and that is what the team wants to learn.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> For each rule section, calculate the share of answers using it that were marked wrong, and compare it with the overall share.\u003c/p>\n\u003cp>\u003cstrong>Failure-cohort analysis\u003c/strong> takes the group of traces that share a bad outcome (in this case, the 4,200 marked answers) and asks how that group differs from normal traffic. The comparison with normal traffic is the important part. A count inside the failure group alone mostly shows what is common everywhere. For example, take a rule section that is retrieved for 400,000 of the 900,000 answers. The overall share of marked answers is about 0.47%, so that section would appear in about 1,900 marked traces even if it never caused a wrong answer.\u003c/p>\n\u003cp>A rate for each section removes that effect. For each section ID, divide the number of marked answers that retrieved it by the total number of answers that retrieved it. Then compare the result with the 0.47% baseline. A section retrieved 6,000 times with 300 marks has a rate of 5%, which is about ten times the baseline, although its raw count is far below the count of a general section. The same method works for any other attribute on the trace, such as the index version or the prompt version. Member marks are sparse, and members choose when to give them, so a high rate tells engineers where to look first. They can then inspect that section's text and chunks in the index. These hold scheme rules, not member data.\u003c/p>\n\u003cp>This analysis fits Calder's limits because it needs only identifiers and an outcome flag. That matches how tracing for the Claude API is designed. The default content mode is \u003cem>metadata only\u003c/em> (identifiers, timing, status, and token counts), and prompts and responses are added only if a team chooses full content. See \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/opentelemetry\">OpenTelemetry for the Claude API\u003c/a> and the \u003ca href=\"https://platform.claude.com/docs/en/api/opentelemetry/spans\">span reference\u003c/a>. The section IDs come from the team's own retrieval instrumentation, and they are recorded as attributes next to those fields.\u003c/p>\n\u003cp>The other approaches each improve something, but they do not answer the question. Ranking sections by their count in the marked traces is fast, but it puts the most popular sections first and hides a rare section with a high error rate. Comparing timings and status codes between marked and unmarked traces is a real cohort comparison. But a wrong answer normally completes successfully and at normal speed, so those fields do not separate the groups. Recording the full text on marked traces would let engineers read the failures, but it stores member data in the tracing system, against Calder's policy. Under the ZDR arrangement, Anthropic does not keep the prompts or responses either, so the content cannot be requested later. And reading thousands of conversations would not measure how often each section is involved.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 33; Domain: Observability and Production Monitoring","answerStatus":"source"},{"query":"A pension scheme has three sections with similarly worded rules but different retirement ages. The assistant sometimes cites a genuine rule from the wrong section; the member's section is known from their account. How should retrieval change?","type":"multiple-choice","options":[{"text":"Tag each chunk with its section at indexing time, and filter each search by the section in the member's account record.","explanation":"The section is a known fact in the account record, so the search does not need to guess it from the question. Each chunk has a section tag, and the filter is applied before ranking, so rules from other sections cannot be returned, whatever their wording. This removes the cause at the retrieval stage, and it does not depend on how the model behaves.","correct":true},{"text":"Retrieve a wider set of candidate chunks, and add a reranker that scores each chunk against the member's question.","explanation":"A reranker orders candidate chunks by how well each one answers the question. The question does not name a section, and the three rule books use nearly the same wording, so the reranker gives the three versions nearly the same score. A reranker improves ranking for other kinds of question, but it cannot tell which section applies to this member.","correct":false},{"text":"Put the member's section in the system prompt, and tell the assistant to answer only from the rule book of that section.","explanation":"This helps when the retrieved chunks include the rule from the member's section, because the model can then choose it. But the search still ranks the near-identical chunks from all three rule books almost equally, so the correct rule is sometimes missing from what the model receives. The result also depends on the model following the instruction every time. A filter in the search applies the same way on every request.","correct":false},{"text":"Add a BM25 keyword search to the retrieval index, and merge its results with the current results by rank fusion.","explanation":"BM25 matches exact words in the question, which helps with terms such as rule numbers or product names. A question like the example contains no word that separates one section from another, and the three rule books share almost all their wording. So the keyword results would contain the same mix of sections as the current results.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Tag each chunk with its section at indexing time, and filter each search by the section in the member&#x27;s account record.\u003c/p>\n\u003cp>A retrieval search compares the text of the question with the text of each chunk. The member's question, &quot;When can I retire on a full pension?&quot;, says nothing about a section. The three rule books use nearly the same wording, so their chunks get nearly the same score, and which section's rule ranks first is close to random. The assistant then answers from the chunk it received and cites it. The citation is real, but the rule does not apply to this member. The failure happens at the retrieval stage, before the model writes anything.\u003c/p>\n\u003cp>The missing information is not in the question, but Calder already has it: the account record states the member's section. The reliable fix is to use that fact as a \u003cstrong>metadata filter\u003c/strong>. At indexing time, each chunk is stored with a section tag. At query time, the application reads the section from the account record and limits the search to chunks with that tag \u003cem>before\u003c/em> ranking. Chunks from other sections then cannot be returned at all. This control runs in Calder's own code, outside the model, so it works the same way on every request. It has limits: the tags and the account record must be correct, and a member with benefits in two sections needs a filter that allows both.\u003c/p>\n\u003cp>Putting the section in the system prompt is a partial fix. The model can only choose among the chunks it receives, and the unfiltered search may return the rule from the wrong section and leave out the correct one. The result also depends on the model following the instruction each time. Reranking and hybrid search with BM25 are both useful techniques, and Anthropic's \u003ca href=\"https://www.anthropic.com/research/contextual-retrieval\">Contextual Retrieval\u003c/a> article describes them. BM25 finds exact terms that embeddings can miss, and a reranker picks the most relevant chunks from a wider set of candidates. But both still work only from the question text. When the question has no word that separates the sections, neither one can tell the three versions apart.\u003c/p>\n\u003cp>A citation shows which passage supports an answer. The \u003ca href=\"https://docs.anthropic.com/en/docs/build-with-claude/citations\">Citations\u003c/a> feature returns pointers to passages in the documents that were provided. It does not check that a passage applies to the person who asked. The retrieval design is responsible for making sure that only applicable sources reach the model.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 34; Domain: Production Integration, Reliability, and Knowledge Grounding","answerStatus":"source"},{"query":"A prompt release introduced incorrect address changes for members overseas, but all update tool calls completed successfully. How can production monitoring detect a similar quality regression by release and region?","type":"multiple-choice","options":[{"text":"Alert when the account-update tool's error rate or response time leaves its normal range in the week after each release.","explanation":"Each wrong address was saved by a tool call that succeeded at normal speed. That is why the traces looked normal for two weeks. An alert on tool errors and response time watches the same two signals, so the alert would not have been raised.","correct":false},{"text":"Track how often assistant-made updates are corrected soon afterwards, by release version and member region, and alert on a rise.","explanation":"A correction soon after an update is an outcome signal: it shows that the update was wrong, even though the tool call succeeded. The rate is built from counts with coarse labels, so no member's details enter the tracing system. When the rate is split by release version and region, a fault that affects only overseas members becomes visible. The overall average would hide it.","correct":true},{"text":"Add overseas address cases to the release evaluation, and require a higher pass score before each prompt or model release.","explanation":"These cases would stop this same fault from being released again, which is useful. But an evaluation tests only the cases that the team wrote before the release, and the next fault may affect a different group of members or a different kind of update. To detect that fault after release, the team needs a signal from production.","correct":false},{"text":"Record the old and new values of each account update in the trace, and have engineers review them in the week after each release.","explanation":"Old and new addresses and beneficiary names are member data, so writing them to traces breaks Calder's policy. Manual review by engineers is also slow, and it stops after one week, so a problem that starts later would not be seen.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Track how often assistant-made updates are corrected soon afterwards, by release version and member region, and alert on a rise.\u003c/p>\n\u003cp>A tool call that succeeds is not the same as a task that was done correctly. The account-update tool accepted every request and returned a success status, so the timings and status codes showed nothing unusual. The fault was in \u003cem>what\u003c/em> the assistant saved, and only an indicator that measures the result of the work can show that. A service level indicator (SLI) is a number that describes how well a service is doing its job. For an assistant that changes records, a useful SLI is an \u003cstrong>outcome\u003c/strong> measure: the share of assistant-made updates that a member or a staff member has to correct soon afterwards.\u003c/p>\n\u003cp>This indicator needs no conversation content. Calder's account system already knows which updates came from the assistant and when the same field was changed again. It can produce counts, and only the counts and their labels go to dashboards and alerts. The labels are the release version (the prompt version and the model version) and a coarse category such as domestic or overseas. None of this identifies a member, so the tracing policy is followed. The team compares each new release with the \u003cstrong>baseline\u003c/strong>, which is the normal correction rate from earlier releases, and raises an alert when the rate rises above it.\u003c/p>\n\u003cp>The split by region is important. Suppose overseas members make 5 of every 100 address updates. If the correction rate for that group rises from 2% to 40%, the overall rate moves only from 2% to about 3.9%. That change is easy to miss in one overall number, but it is obvious in the group's own number. A fault that affects one segment is found by comparing segments, not by watching an average.\u003c/p>\n\u003cp>The other approaches help less. Writing old and new values to traces would give engineers detail, but it puts member data in the tracing system, and review by hand is slow and temporary. Alerts on the tool's error rate and response time watch signals that stayed normal during the whole incident. Adding overseas address cases to the release evaluation is good practice, as described in \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">Define success criteria and build evaluations\u003c/a>, and it would block this same fault next time. But it is a check before release on a fixed set of cases, so it cannot show a fault that the team did not expect. Offline evaluation and production monitoring work together: the first reduces how many faults are released, and the second detects the faults that are released anyway.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 35; Domain: Observability and Production Monitoring","answerStatus":"source"},{"query":"About 3% of account-update calls fail, but traces show only duration and a generic error status. At high request volume, engineers cannot identify common causes. Which structured trace attributes would make failures diagnosable?","type":"multiple-choice","options":[{"text":"Capture full prompts and tool inputs for failed calls only, so that engineers can read what each failing request contained.","explanation":"Prompts and tool inputs contain members' names, addresses and beneficiaries, and Calder's policy forbids storing member data in the tracing system. Limiting capture to failed calls still stores that data. Reading requests one at a time also does not measure where the failures concentrate.","correct":false},{"text":"Add an alert on the account-update tool's error rate, and page the on-call engineer when it rises above 3 percent.","explanation":"An alert tells the team that failures are happening and when the rate rises. The team already knows the rate is about 3%. The alert does not show which update type, error or release the failures belong to, so it does not help find a shared cause.","correct":false},{"text":"Tag each tool span with update type, error code and release version, then compare failure rates across those groups.","explanation":"Update type, error code and release version are categories, not member data, so Calder's policy allows them in the tracing system. With these labels on every tool span, the team can calculate a failure rate for each group across hundreds of thousands of calls. That shows whether the failures concentrate in one group, for example one update type after one release.","correct":true},{"text":"Export a trace for every failed tool call and a small random sample of the rest, so that no failure is missing.","explanation":"Keeping every failed trace is a useful sampling practice when failures are missing from the stored data. That is not the problem the team has: the engineers already have failed traces, and each one holds only a duration and a status. More traces of the same kind add no field that the team could group by.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Tag each tool span with update type, error code and release version, then compare failure rates across those groups.\u003c/p>\n\u003cp>One trace describes one request. A cause that affects 3% of calls is usually not visible in any single trace. It becomes visible when many traces are grouped and the groups are compared. This method is called \u003cstrong>failure-cohort analysis\u003c/strong>: a cohort is a group of traces that share a value, such as the same release version, and the team compares the failure rate of each cohort with the others. If beneficiary updates fail at 20% and address updates fail at 0.1%, the team knows where to look.\u003c/p>\n\u003cp>Grouping needs something to group by. Calder's traces hold only timings and status codes, so every failed trace looks the same and there is no field to split on. The fix is to add \u003cstrong>attributes that are not member data\u003c/strong> to each span: the type of update, the error code the tool returned (a code, not a free-text message that might contain a name), the release or prompt version, and the index version. These are categories. They say nothing about any member, so they fit both the ZDR arrangement and Calder's own policy. Anthropic's OpenTelemetry tracing for the Claude API follows the same idea: its default content mode is metadata only (identifiers, timing, status and token counts), and prompts and responses are added only when full content is turned on. See \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/opentelemetry\">OpenTelemetry tracing for the Claude API\u003c/a> and the \u003ca href=\"https://platform.claude.com/docs/en/api/opentelemetry/spans\">span reference\u003c/a>, which lists attributes such as stop reason, model and \u003ccode>error.type\u003c/code> that are useful for this kind of grouping.\u003c/p>\n\u003cp>The labels must be on successful calls as well as failed ones. A failure \u003cem>rate\u003c/em> needs both the number of failures and the total number of calls in each group. Without the successful calls, the team can only see that most failures are beneficiary updates. It cannot tell whether that is unusual or whether most calls are beneficiary updates.\u003c/p>\n\u003cp>The other approaches each help with a different problem. Capturing full prompts and tool inputs for failed calls would put names, addresses and beneficiaries into the tracing system, which the policy forbids, and it still leaves engineers reading requests one at a time. Keeping every failed trace and a sample of the rest is a good sampling design when rare failures are missing from the stored data, but the team already has failed traces, and more traces with only a duration and a status add nothing to compare. An alert on the tool's error rate detects that failures are happening, which the team already knows. It does not show where they concentrate. Once the labels exist, better sampling and alerts for each group become useful next steps.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 36; Domain: Observability and Production Monitoring","answerStatus":"source"},{"query":"A warranty agent's MCP server gained a new credit-issuing tool, and a wildcard permission let the agent call it without review. How can the team prevent future tools on that server from becoming automatically available?","type":"multiple-choice","options":[{"text":"Ask the finance systems team to version each server release and announce new tools to the warranty team beforehand.","explanation":"Version numbers and announcements are good practice, because they tell consumers that something changed. But they do not block anything. With the wildcard rule in place, the new tool can be called as soon as it is deployed, whether or not the warranty team has read the announcement and acted on it.","correct":false},{"text":"Replace the wildcard rule with a list of reviewed tool names, and add each new tool only after review.","explanation":"A list of named tools refuses anything that is not on the list. A tool added to the server later therefore cannot be called until someone adds its name. This makes the review a required step. The agent's configuration enforces it, so it does not depend on the model's behavior or on another team's communication.","correct":true},{"text":"Add a system prompt rule that the agent must use only the tools that the prompt describes by name.","explanation":"This asks the model to enforce the restriction on itself, while the permission rule still allows every tool on the server. Claude usually follows such a rule. But dealers write the claims as free text, and a prompt rule is not a guarantee when the tool moves money. The $3,000 limit is already a control that exists only in the prompt, and this change would add a second control of the same kind.","correct":false},{"text":"Run the agent's claim evaluation suite against each new release of the payments server before that release is deployed.","explanation":"Testing a consumer against each server release finds changes that break existing behavior, such as a renamed field or a changed result. An added tool does not change any existing tool, so the suite can pass. Also, Claude's choices vary between runs, so the agent may not call the new tool during the test. Afterward, the tool would still be permitted in production.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Replace the wildcard rule with a list of reviewed tool names, and add each new tool only after review.\u003c/p>\n\u003cp>An MCP server is a shared dependency, and its owner can add tools at any time for reasons that are unrelated to any one consumer. A wildcard permission rule such as \u003ccode>mcp__payments__*\u003c/code> means &quot;permit whatever this server offers, now and later&quot;. With that rule, every deployment by the finance systems team is also a change to the warranty agent, but nobody on the warranty team approves it. The dealer-credit tool could be called on the day it was deployed. The only control on the amount was the $3,000 limit in the system prompt, and that control depends on the model applying it to a tool that the prompt never mentions.\u003c/p>\n\u003cp>Listing the permitted tools by name changes the default. This kind of list is called an \u003cstrong>allowlist\u003c/strong>: anything that is not on the list is refused. In the Agent SDK, an MCP tool needs explicit permission before Claude can call it. Without that permission, Claude can see that the tool exists, but it cannot call it. A tool added later therefore stays blocked until someone reviews it and adds its full name to the list. The list is part of the agent's own configuration, so the warranty team can version it, and each addition is a recorded decision. The MCP connector in the Messages API supports the same pattern: turn every tool off in the toolset's \u003ccode>default_config\u003c/code>, then enable named tools in \u003ccode>configs\u003c/code>. See \u003ca href=\"https://code.claude.com/docs/en/mcp\">Connect Claude Code to tools via MCP\u003c/a> and \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/mcp-connector\">MCP connector\u003c/a>.\u003c/p>\n\u003cp>The other approaches each improve something, but they leave the new tool callable. A prompt rule that says &quot;use only the tools named in the prompt&quot; depends on the model following it on every claim. That includes claims whose text was written by a dealer who wants a payment. Versioned releases and announcements tell the warranty team that a change is coming, but the wildcard rule grants the tool whether or not anyone reads the announcement in time. Running the claim evaluation suite against each server release is useful for finding broken contracts, such as a renamed field. But an added tool breaks nothing that the suite checks, and the agent may not choose the new tool during a test run.\u003c/p>\n\u003cp>The allowlist controls which tools the agent can reach. It does not check amounts. After a payment or credit tool has been reviewed and added, the $3,000 manager approval should still be enforced in code outside the model. The OWASP Top 10 for LLM Applications calls this risk \u003cem>excessive agency\u003c/em>: an agent has more tools or permissions than its task needs, so a model error or a manipulated input can cause real harm.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 37; Domain: Production Integration, Reliability, and Knowledge Grounding","answerStatus":"source"},{"query":"A payment hook enforces a $3,000 limit on each claim, but dealers split repairs into multiple smaller claims for the same machine. How should the check address cumulative payments?","type":"multiple-choice","options":[{"text":"Lower the limit in the hook from $3,000 to $1,000, and send every payment above it to a manager.","explanation":"A lower limit keeps the per-call check that dealers already avoid, so a dealer can divide the repair into smaller claims again. It also sends every ordinary payment between $1,000 and $3,000 to a manager. That adds review work, and it does not remove the gap.","correct":false},{"text":"Have the hook add up recent payments per machine, and pause for a manager if the sum passes $3,000.","explanation":"The hook checks one payment call at a time, but the policy limits how much is paid for a repair without a warranty manager. When the hook adds up the payments for the same machine in code, the check matches the policy. Dividing a repair into several claims then no longer avoids the manager. The check does not depend on the claim text or on the model's reasoning.","correct":true},{"text":"Add a system prompt rule that tells the agent to treat several claims for one machine as one repair.","explanation":"A system prompt rule depends on the model noticing the pattern. Also, the dealers who divide the claims are the same people who write the text that the agent reads. Each claim can be handled as a separate case, so the agent may not see the earlier claims at all. A limit on money needs enforcement in code, not an instruction.","correct":false},{"text":"Run a daily report of machines with several payments under $3,000, and have managers recover the money.","explanation":"A daily report is a useful monitoring layer, but it finds the divided claims after the payments have been made. Managers would then need to recover money from dealers. That is slower and less certain than pausing the payment before it runs.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Have the hook add up recent payments per machine, and pause for a manager if the sum passes $3,000.\u003c/p>\n\u003cp>A deterministic control enforces only the rule that its code checks. The hook in this scenario checks one number: the amount in a single payment call. Corbel's policy covers something larger: how much money is paid for one repair without a warranty manager's agreement. Dealers write the claims, so a dealer decides how a repair is divided into claims. When the check looks at one call at a time, a dealer can stay below the limit by dividing the repair. The hook then works as written on every call, and the policy is still broken.\u003c/p>\n\u003cp>The fix is to make the check match the policy. A \u003cstrong>PreToolUse hook\u003c/strong> runs before a tool call and receives the tool's arguments. Its handler is ordinary code, so it can also read the payment records. The hook can add the payments approved for the same machine over a recent period to the new amount. It can then pause for a warranty manager when the total passes $3,000. This check gives the same result whatever the claim text says and however the model reasons about it. The \u003ca href=\"https://code.claude.com/docs/en/hooks\">Hooks reference\u003c/a> describes how a hook can block or pause a tool call before it runs.\u003c/p>\n\u003cp>Lowering the limit to $1,000 keeps the same per-call design. A dealer can divide the repair into smaller claims, and managers must now review many ordinary payments between $1,000 and $3,000. A system prompt rule depends on the model seeing the pattern. But each claim can arrive as a separate case, and the dealer writes the text that the agent reads. Prompt instructions can change what the model attempts, but they do not enforce a limit, as the \u003ca href=\"https://code.claude.com/docs/en/permissions\">permissions documentation\u003c/a> explains for rules and hooks. A daily report is a good monitoring layer to keep, but it finds the payments after the money has been paid.\u003c/p>\n\u003cp>When you review any guardrail on money, compare two things: the unit that the check looks at, and the unit that the policy protects. If an outside party controls how work is divided into requests, a per-request limit must be combined with a limit on the total for the same machine, dealer, or period.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 38; Domain: Runtime Guardrails and Production Security","answerStatus":"source"},{"query":"Claims pause while awaiting manager approval. When new workers resume from a shared working directory, one claim has resumed another claim's conversation. What session-state change prevents cross-claim continuation?","type":"multiple-choice","options":[{"text":"Save each claim's session ID with the claim record when it pauses, and resume that session by ID.","explanation":"Continuing the most recent session works only when one conversation uses the directory, and dozens of claims are paused there at the same time. When the session ID is stored on the claim record, code can pick the conversation that belongs to the approved claim. The approval then cannot reach another dealer's claim.","correct":true},{"text":"Mirror the session transcripts to external storage so that every new worker can load the full history.","explanation":"External transcript storage helps when a new worker runs on a different host or when the local disk is replaced. It does not change which session the worker opens, so the worker would still continue the claim that paused most recently.","correct":false},{"text":"Put the claim number in the approval message, and instruct the agent to check it before paying.","explanation":"This depends on the model noticing a mismatch before it sends money, and that is not a reliable control for payments. Even when the agent notices, the worker is still in the wrong conversation, so the approved claim is not paid.","correct":false},{"text":"Fork the most recent session when an approval arrives so that the original conversation stays unchanged.","explanation":"A fork starts a new session with a copy of an existing history, and it leaves the original unchanged. But the copy would still be of the most recent session, which is another dealer's claim. So the approval would still reach the wrong claim.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Save each claim&#x27;s session ID with the claim record when it pauses, and resume that session by ID.\u003c/p>\n\u003cp>An Agent SDK \u003cstrong>session\u003c/strong> is the saved conversation: the prompt, every tool call, every tool result and every response. The SDK gives three ways to return to a session. \u003cstrong>Continue\u003c/strong> opens the most recent session in the current working directory, and it needs no ID. \u003cstrong>Resume\u003c/strong> opens one specific session, named by its session ID. \u003cstrong>Fork\u003c/strong> starts a new session with a copy of an existing history, and it leaves the original unchanged.\u003c/p>\n\u003cp>Continue is safe only when one conversation uses a directory. The warranty agent has many claims waiting for a manager at the same time, all in one shared directory. &quot;The most recent session&quot; is therefore whichever claim paused last, not the claim that the manager approved. The approval message then arrives in another dealer's conversation, and the agent pays that dealer.\u003c/p>\n\u003cp>The fix is to make the choice of session a lookup in code. When the claim pauses, the harness reads the session ID from the result message and stores it on the claim record. When the approval for that claim arrives, the harness passes that ID to resume. The model never has to work out which conversation it is in. Production code should also handle a run that crashes before it produces any result message, because in that case no ID was captured.\u003c/p>\n\u003cp>The other approaches leave the wrong selection in place. Mirroring transcripts to external storage through a \u003ccode>SessionStore\u003c/code> adapter is the right step when workers run on different hosts or when containers are replaced. But it only makes transcripts available; it does not choose among them. Forking the most recent session copies the same wrong history. A claim number in the approval message, with an instruction to compare it, depends on the model noticing a mismatch before it sends money. Even when the model notices, the worker is still in the wrong conversation, and the approved claim stays unpaid. Payments need a control that code enforces.\u003c/p>\n\u003cp>See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/sessions\">Work with sessions\u003c/a> and \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/session-storage\">Session storage\u003c/a>.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 39; Domain: Advanced Agent Architecture and Orchestration","answerStatus":"source"},{"query":"A single all-day session covers dozens of warranty claims for unrelated machines, causing high context costs and cross-claim confusion. Only the dealer's labor rate needs to carry across claims. What session design is appropriate?","type":"multiple-choice","options":[{"text":"Have compaction run at a much lower token threshold, so that finished claims are summarized sooner in the session.","explanation":"Earlier compaction would reduce the token count, so cost would fall. However, the summary still describes many other machines in the same conversation, and a summary can drop or change details such as serial numbers. The agent does not need anything from the finished claims except the labor rate, so summarizing them keeps content that has no use.","correct":false},{"text":"Run each claim in its own session, and read the dealer's labor rate from a persistent memory store at the start.","explanation":"The claims are independent, so a new session per claim contains only that claim's photos and that machine's service history. This removes the old tokens that raise the cost and removes the other machines' records that the agent mixed up. The one detail that must carry over, the labor rate, is small and can be kept in storage outside the conversation.","correct":true},{"text":"Use a longer prompt-cache lifetime, so that earlier photos and histories are read again at the cached rate.","explanation":"A longer cache lifetime can lower the price of reading the repeated prefix when there are pauses between claims. Prompt caching does not reduce how much of the context window is used, so the model still reads every finished claim on every turn. The records of different machines stay together in one context, so the mix-ups would continue.","correct":false},{"text":"Have the service history tool return a short summary of each machine's record in place of the full history.","explanation":"Shorter tool results are a real improvement and would reduce one source of tokens. The photos from finished claims would still fill the context, and the summaries of many machines would still be in one conversation. The cost would rise more slowly, but the cause of the mix-ups would remain.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Run each claim in its own session, and read the dealer&#x27;s labor rate from a persistent memory store at the start.\u003c/p>\n\u003cp>A long-running agent sends its whole conversation with every request. In a session that covers 60 claims, claim 40 is processed together with the photos and service histories of the 39 claims before it. The team pays for those tokens on every turn, and the model must find the current machine's details among many similar records. Recall becomes less accurate as a context grows, which is called \u003cstrong>context rot\u003c/strong>. This explains why one machine's service history was applied to another machine's claim.\u003c/p>\n\u003cp>The deciding fact is that the claims are independent. Each one concerns a different machine, and the agent reuses only the dealer's agreed labor rate. When tasks do not depend on each other, the simplest context policy is to give each task its own context and to keep the small amount of shared information outside the conversation. A new session per claim starts with only the system prompt, the tools and that one claim. A \u003cstrong>persistent memory store\u003c/strong> keeps the labor rate in storage that the application controls, so every new session can read it at the start. The \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool\">memory tool documentation\u003c/a> describes how memory files persist across sessions when the same store is used.\u003c/p>\n\u003cp>The other approaches each improve something, but they leave finished claims in the context. Earlier compaction replaces old claims with a summary. The summary still describes other machines, it can drop or change details such as serial numbers, and writing it costs tokens each time. A longer cache lifetime lowers the price of reading a repeated prefix after a pause, but prompt caching does \u003cem>not\u003c/em> reduce how much of the context window is used, so the model still reads every old record. The \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\">prompt caching documentation\u003c/a> explains this difference between cost and context size. Shorter service history results reduce one source of tokens, but the photos remain, and the records of many machines are still together in one conversation.\u003c/p>\n\u003cp>Compaction and tool result clearing are the right tools when one task is too long for a single context and its later steps depend on its earlier steps. A dealer's day of claims is not one long task. It is many short tasks that share one small fact, so a separate context for each claim with a small persistent note is the better fit.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 40; Domain: Advanced Agent Architecture and Orchestration","answerStatus":"source"},{"query":"Warranty, returns, and recall agents copied a large shared rule prompt. The copies have diverged, and agents sometimes apply rules for the wrong machine family. How should the 38 families' rules be managed and loaded?","type":"multiple-choice","options":[{"text":"Package each machine family's rules as a versioned Skill in one shared repository, loaded when a claim needs it.","explanation":"A Skill keeps only its short name and description in context, and it loads its full instructions when the agent finds it relevant. So a claim brings in the rules for one family, not all 38. Skills are files, so one repository under version control can supply the same rules to all three agents built on the Agent SDK. A withdrawn rule is then removed in one place.","correct":true},{"text":"Give each agent one subagent per machine family, and have each team write the rule prompts for its own subagents.","explanation":"Separate subagents would keep each family's rules in a separate context, and that reduces the mixing between families. But each team would still write its own rule text. Three agents with 38 subagents each would create more copies to keep the same, and the error with the withdrawn rule could happen again.","correct":false},{"text":"Keep each team's own copy of the rules, and have an owner compare every copy with the policy document each month.","explanation":"A monthly comparison finds differences only after an agent may have used a wrong rule on real claims or returns. It also depends on a person doing the check each time. And it leaves the rules for all 38 families in the warranty agent's context, so the mixing between families continues.","correct":false},{"text":"Keep all coverage rules in one shared prompt file, and have every agent include the whole file in its system prompt.","explanation":"A single shared file does stop the copies from differing, because every agent reads the same text. But the rules for all 38 families stay in context on every claim. The agent can therefore still apply one family's rule to a machine from another family.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Package each machine family&#x27;s rules as a versioned Skill in one shared repository, loaded when a claim needs it.\u003c/p>\n\u003cp>This situation contains two separate problems. First, three teams each have their own copy of the coverage rules, so a rule that Corbel withdrew stayed active in the returns agent. Second, the warranty agent has the rules for all 38 machine families in its context on every claim, although one claim concerns one machine. A model recalls instructions less accurately when its context is full of similar text that is not relevant to the task, so it sometimes applies a rule from the wrong family.\u003c/p>\n\u003cp>\u003cstrong>Agent Skills\u003c/strong> address both problems. A Skill is a folder that holds metadata (a name and a description), instructions, and optional resource files or scripts. Skills use \u003cem>progressive disclosure\u003c/em>. Only the short metadata of each Skill is in context all the time (about 100 tokens per Skill). The instructions load when the agent decides that the Skill matches the task, and resource files use no context until the agent opens them. With one Skill per machine family, a tractor claim loads the tractor rules, and the rules of the other 37 families are usually not in context. Skills are files, so Corbel can keep them in one repository under version control. All three agents built on the Claude Agent SDK can load the same files, so a withdrawn rule is removed once for every agent.\u003c/p>\n\u003cp>This standard has limits that the team should plan for. The agent chooses a Skill from its description, so each description must clearly name the machine family, and the team should test with real claims that the correct Skill loads. A Skill also contains instructions only. It does not enforce anything, so the rule that payments above $3,000 need a warranty manager should not move into a Skill. That rule needs a control outside the model.\u003c/p>\n\u003cp>The other approaches each fix one problem and leave the other. One shared prompt file gives every agent the same rules, but all 38 families stay in context. The mixing continues, and every request carries text it does not need. One subagent per family keeps the families apart, but each team still writes its own rule text, and the number of copies grows. A monthly comparison finds differences after wrong decisions have already been made, and it does nothing about the mixing. Anthropic's general guidance is to choose the least complex design that solves the measured problem. See the \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/agent-skills/overview\">Agent Skills overview\u003c/a> for how Skills load, and \u003ca href=\"https://www.anthropic.com/research/building-effective-agents\">Building effective agents\u003c/a> for the guidance on adding complexity.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 41; Domain: Advanced Agent Architecture and Orchestration","answerStatus":"source"},{"query":"A slow parts-ordering service causes retries after timeouts; some timed-out requests actually succeeded, creating duplicate orders. How can retries remain safe without losing orders?","type":"multiple-choice","options":[{"text":"Add a system prompt rule that tells the agent to look up existing orders for a claim before ordering a part.","explanation":"The duplicate orders came from retries inside the tool wrapper. These retries run without the model seeing them, so a prompt rule does not act at the step that failed. A lookup can also miss an order that the slow service is still processing. An action that orders parts needs a control enforced in code, not one that depends on the model following an instruction.","correct":false},{"text":"Open a circuit breaker after repeated timeouts, and hold new part orders in a queue until the service recovers.","explanation":"A circuit breaker with a queue protects the slow service, and it stops the tool from sending more calls during an outage. But the calls that timed out before the breaker opened still have an unknown result. Sending them again from the queue creates the same duplicates. It is a useful addition, but it does not make a repeated order safe.","correct":false},{"text":"Attach an idempotency key built from the claim and part number, so the ordering service creates each order only once.","explanation":"A timeout does not tell the caller whether the order was created, so every retry must be safe to repeat. The key is the same for all attempts of one order, so the service recognizes a repeated call and returns the existing order. The tool can then keep retrying through slow periods without creating duplicates.","correct":true},{"text":"Raise the tool's timeout to three minutes, and add exponential backoff with jitter so that slow calls have time to finish.","explanation":"A longer timeout and spaced retries reduce how many calls time out, and they lower the load on the slow service. But any call that still takes longer than the new timeout is retried, and the retry creates a second order. The number of duplicates falls, but the cause remains.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Attach an idempotency key built from the claim and part number, so the ordering service creates each order only once.\u003c/p>\n\u003cp>A timeout tells the caller only that no answer arrived in time. It does not say whether the work was done. During the slow period, the ordering service finished several orders after the tool had stopped waiting, so each retry created a second or third order. A retry policy for any call that changes something must assume that the first attempt may have succeeded.\u003c/p>\n\u003cp>An \u003cstrong>idempotency key\u003c/strong> makes a repeated call safe. The tool builds a key that is the same for every attempt of the same order, for example from the claim ID and the part number, and sends it with the call. The ordering service stores the key with the order. When a call arrives with a key that the service has already seen, the service returns the existing order and does not create a new one. The tool can then retry as often as its policy allows, because a retry can no longer add an order. The check runs in the service, so it does not depend on what the model does. This is a general reliability pattern for any operation with a side effect, and it is not specific to Claude.\u003c/p>\n\u003cp>The other changes improve something, but they leave the cause in place. A longer timeout with \u003cstrong>exponential backoff and jitter\u003c/strong> (waiting longer after each failure, with a random offset so that clients do not all retry at the same moment) lowers the load and the number of timeouts. But a call that is slower than the new timeout is still retried and duplicated. A \u003cstrong>circuit breaker\u003c/strong> (a switch that stops calls to a failing dependency for a period) with a queue protects the service during an outage. But the calls that timed out before it opened have an unknown result, and replaying them creates duplicates again. A system prompt rule does not help, because the retries happen in the tool wrapper, where the model is not involved. Also, a lookup can miss an order that is still being processed. Actions that order parts or approve payments need a control that code enforces.\u003c/p>\n\u003cp>Retries also exist at another layer. The Anthropic SDKs automatically retry connection errors, rate limits and 5xx server errors with exponential backoff, twice by default, as described in \u003ca href=\"https://platform.claude.com/docs/en/api/errors\">Errors\u003c/a>. Those retries resend a request to the model. They do not cover the calls that the agent's tool wrapper makes to the ordering service. Retries of the agent's own tools are the team's design, and each tool with a side effect needs its own protection against repeated calls.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 42; Domain: Production Integration, Reliability, and Knowledge Grounding","answerStatus":"source"},{"query":"A warranty-agent model retires in ten weeks. The replacement passes historical evaluations, but the team plans a full switch on the final day during peak claim season. What rollout change reduces live-traffic risk?","type":"multiple-choice","options":[{"text":"Move a small share of dealers to the replacement model now, and widen the share while the current model is still available.","explanation":"If the team starts with a small share of dealers, a difference in payment or parts decisions affects only a few claims. The current model still answers requests during these ten weeks, so the team can send those dealers back to it while it corrects the prompt. Switching on the last day removes that possibility, because requests to a retired model fail.","correct":true},{"text":"Switch all dealers on the planned date, and set the current model as the fallback for requests that fail on the replacement.","explanation":"A fallback that starts when a request fails does not see a claim that the replacement model answers successfully but decides differently. An example is a payment that the new model approves but the old model would have sent to a manager. Also, one day after the planned date the current model is retired, and requests to a retired model fail. So the fallback protects against neither problem.","correct":false},{"text":"Run the evaluation set three more times before the planned date, and switch all dealers only if every run passes.","explanation":"Repeating the evaluation shows whether the pass result is stable between runs. That is useful, because output can vary on identical inputs. But it still tests the same past claims, and it tells the team nothing new about live claims from 700 dealers. It also leaves the switch on a date after which no rollback is possible.","correct":false},{"text":"Switch all dealers on the planned date, and have warranty managers audit a sample of approved payments each week for a month.","explanation":"A weekly audit finds wrong payments after the money has been approved for the dealer, and a sample misses some of them. It also does not cover replacement parts that the agent has ordered. When the audit finds a problem, every dealer is on the replacement model and the old model is retired, so the team cannot go back.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Move a small share of dealers to the replacement model now, and widen the share while the current model is still available.\u003c/p>\n\u003cp>An evaluation set of past claims shows how the replacement model behaves on the cases that the team collected. It cannot show every case that 700 dealers will send as free text with photos and documents. A model migration therefore needs two protections: testing before the switch, and a way to limit and undo harm after the switch. The team has the first protection. Its plan removes the second one, because of how model retirement works.\u003c/p>\n\u003cp>When a model is \u003cstrong>retired\u003c/strong>, requests to it fail. Until that date, the old model still answers requests, so the team can send traffic back to it. This is called a \u003cstrong>rollback\u003c/strong>. If the team switches on the last day before retirement, there is almost no time in which a rollback is possible. If the replacement model then approves payments or orders parts differently, every dealer is affected, and the team must repair the prompt while the errors continue. Anthropic recommends testing replacement models well before the retirement date; see \u003ca href=\"https://platform.claude.com/docs/en/about-claude/model-deprecations\">Model deprecations\u003c/a>.\u003c/p>\n\u003cp>A \u003cstrong>progressive rollout\u003c/strong> (also called a canary release) moves a small share of traffic first, for example a few dozen dealers. The team compares the agent's decisions for those dealers with its decisions for the other dealers. It widens the share only when the results meet its success criteria. If something is wrong, only a small number of claims are affected, and the old model can take those dealers back. Starting now gives the team ten weeks for these steps. The extra work during the busy season is small: a routing rule by dealer and a comparison of outcomes. \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\">Define success criteria and build evaluations\u003c/a> describes how to measure a change against a baseline version.\u003c/p>\n\u003cp>The other plans each help a little. Running the evaluation set again confirms that the pass result is not caused by run-to-run variation. But it tests the same past claims, and it adds no protection on live claims. A fallback that starts on failed requests does not notice a claim that the new model answers successfully but decides differently. And after the retirement date, the old model cannot answer at all. Weekly audits by warranty managers find wrong payments after they were approved, and they do not cover parts orders. By then, no rollback exists.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude Developer Professional practice questions — Question 43; Domain: Production Integration, Reliability, and Knowledge Grounding","answerStatus":"source"},{"query":"A document-injection screening model returned stop_reason 'refusal' and no verdict, but the harness treated the missing verdict as clean. The agent then obeyed malicious text. How should inconclusive screening results be handled?","type":"multiple-choice","options":[{"text":"Add a system prompt rule that the warranty agent must treat instructions in dealer documents as data.","explanation":"This rule is a useful layer, and stating the policy on untrusted content is recommended practice. But it still depends on the model following the rule on every document, and this agent can approve payments. It also leaves the screen unchanged, so documents that were never judged still reach the agent as if they had passed.","correct":false},{"text":"Treat a refusal or a missing verdict as a suspected injection, and send the document to a reviewer.","explanation":"A screen that returns no verdict has not cleared the document, so the code must handle that case as a block, not as a pass. The documented guidance for a screening model is to treat a refusal as a harmful or injection-suspected result, because the refusal leaves no verdict to read. Sending the document to a reviewer lets legitimate claims continue, and it keeps the unscreened document away from the agent that can pay dealers.","correct":true},{"text":"Retry the screening call up to three times with backoff before the document goes to the warranty agent.","explanation":"Retries help with temporary faults, such as a timeout or an overloaded error. A refusal is a successful response, and the same document is likely to be refused again. When the retries are used up, the harness still has no verdict, and it still passes the document to the agent.","correct":false},{"text":"Constrain the screening model's reply to a JSON schema with one required true-or-false field for the verdict.","explanation":"A schema controls the format of the reply when the model produces one, and it makes the verdict easy for code to read. But it does not guarantee a verdict, because a refusal ends the response before any verdict is written. The harness would still receive nothing to read, and it would still treat the document as clean.","correct":false}],"answer":"\u003cp>\u003cstrong>Correct answer:\u003c/strong> Treat a refusal or a missing verdict as a suspected injection, and send the document to a reviewer.\u003c/p>\n\u003cp>Dealer documents are third-party content. Text inside them that tries to direct the agent is therefore \u003cstrong>indirect prompt injection\u003c/strong>. A screening call on that content is a real guardrail layer, but only if the code around it handles every result that the call can produce. A screen has three possible results: a verdict of clean, a verdict of suspected injection, and \u003cem>no verdict at all\u003c/em>. The harness in this incident mapped the third result to &quot;clean&quot;. That design is called \u003cstrong>fail open\u003c/strong>: when the check cannot answer, the content passes. For an agent that can pay dealers, the check should \u003cstrong>fail closed\u003c/strong>: when the check cannot answer, the content is held.\u003c/p>\n\u003cp>A refusal is the most important no-verdict case to plan for. The API returns it as a successful response with \u003ccode>stop_reason: &quot;refusal&quot;\u003c/code>, not as an error, so error handling and retry logic do not catch it. The model used for screening runs safety classifiers that can decline the screening request itself. The content most likely to cause this is the content that the screen was built to catch. The guidance in \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks\">Mitigate jailbreaks and prompt injections\u003c/a> is direct: treat a refusal from the screen as a harmful or injection-suspected verdict, and return an error or a stripped summary to the agent instead of the raw content. \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/handle-streaming-refusals\">Handle streaming refusals\u003c/a> also advises tracking refusals separately from errors, so that the team can see how often the screen declines.\u003c/p>\n\u003cp>Failing closed has a cost. Some legitimate claim documents will go to a reviewer, so the team should measure how often that happens, and adjust the screen if the review queue grows. That cost is acceptable, because the alternative is an unscreened document reaching an agent that has payment authority. The $2,900 amount shows why this layer matters. The payment was below the $3,000 manager limit, so no approval step would have stopped it.\u003c/p>\n\u003cp>The other changes each improve something, but they leave the cause in place. Retries address temporary faults, but the same document is likely to be refused again, and the harness still passes it afterward. A JSON schema makes a verdict easy to parse when one exists, but a refusal ends the response without one. A system prompt rule about untrusted content is a recommended layer. But it depends on the model's behavior, and it does not correct a screen that passes documents it never judged.\u003c/p>","tip":"\u003cp>Choose the best answer.\u003c/p>","reference":"Uploaded Claude
