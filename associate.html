 the style guide pasted into each chat as and when it is needed for a particular release.","explanation":"The style guide belongs in the Project, not re-pasted.","correct":false}],"answer":"<p>Correct answer: <strong>Role, house style and release structure in the instructions; the style guide and three approved releases as knowledge.</strong></p><p>A well-configured Project pairs concise instructions (role, style, structure) with a small set of authoritative knowledge files.</p>","tip":"<p>Why not the others: A background without any instruction on what to produce; B volume without guidance; old releases will contain superseded style; D the style guide belongs in the Project, not re-pasted.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 5.1.","answerStatus":"source"},{"query":"An HR team's Project instructions read, in full, \"Be helpful and accurate.\" Outputs vary widely in format and tone. Which revision is most likely to improve consistency?","type":"multiple-choice","options":[{"text":"Add \"be consistent in format and tone\" to the existing instruction, so that both requirements are explicit.","explanation":"Another vague virtue.","correct":false},{"text":"Remove the instructions altogether so that Claude can use its own judgement about what each request needs.","explanation":"Removes the only lever for consistency.","correct":false},{"text":"Replace the instruction with a detailed description of the HR team's responsibilities and the services it provides.","explanation":"Describes the team, not the output.","correct":false},{"text":"State the audience, tone, standard output structure, and what to do when information is missing.","explanation":"System-level instructions work when they define the audience, tone, structure and behaviour under uncertainty. Vague virtues produce vague results.","correct":true}],"answer":"<p>Correct answer: <strong>State the audience, tone, standard output structure, and what to do when information is missing.</strong></p><p>System-level instructions work when they define the audience, tone, structure and behaviour under uncertainty. Vague virtues produce vague results.</p>","tip":"<p>Why not the others: A another vague virtue; B removes the only lever for consistency; C describes the team, not the output.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 5.2.","answerStatus":"source"},{"query":"A sales enablement manager at Orlo Office Supplies built a Project in February with the product catalogue as knowledge. In August, Claude is still quoting prices that changed in June. What is the most appropriate action?","type":"multiple-choice","options":[{"text":"Replace the catalogue in the Project with the current version and have Claude state the catalogue date in each answer.","explanation":"Knowledge sources must be maintained. Replacing the stale file fixes the cause; the date instruction makes staleness visible next time.","correct":true},{"text":"Add the new price list alongside the old catalogue in the Project so that Claude has both versions available.","explanation":"Leaves two conflicting sources for Claude to choose between.","correct":false},{"text":"Tell Claude at the start of each chat that prices changed in June and that any figures from the old catalogue should be ignored.","explanation":"A per-chat workaround that leaves the wrong source in place.","correct":false},{"text":"Delete the Project and use a plain chat with the current price list pasted in whenever a price is needed.","explanation":"Abandons a useful configuration for a maintenance task.","correct":false}],"answer":"<p>Correct answer: <strong>Replace the catalogue in the Project with the current version and have Claude state the catalogue date in each answer.</strong></p><p>Knowledge sources must be maintained. Replacing the stale file fixes the cause; the date instruction makes staleness visible next time.</p>","tip":"<p>Why not the others: B leaves two conflicting sources for Claude to choose between; C a per-chat workaround that leaves the wrong source in place; D abandons a useful configuration for a maintenance task.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 5.3.","answerStatus":"source"},{"query":"A project coordinator wants Claude to answer questions using the team's project documents, which live in Google Drive and change weekly. Which approach is most appropriate?","type":"multiple-choice","options":[{"text":"Copy the text of each document into the Project's instructions and update it when the documents change.","explanation":"Instructions are for guidance, not bulk content, and the copies go stale.","correct":false},{"text":"Download the documents each week and upload the latest versions to the chat as attachments.","explanation":"Works, but is manual, weekly and easy to forget.","correct":false},{"text":"Connect Google Drive so that Claude can reference the current documents when asked.","explanation":"A connector is the right tool when the source of truth lives elsewhere and keeps changing.","correct":true},{"text":"Upload the documents once and ask Claude to remember their contents for future conversations.","explanation":"A one-time upload is a snapshot; it will not track weekly changes.","correct":false}],"answer":"<p>Correct answer: <strong>Connect Google Drive so that Claude can reference the current documents when asked.</strong></p><p>A connector is the right tool when the source of truth lives elsewhere and keeps changing.</p>","tip":"<p>Why not the others: A instructions are for guidance, not bulk content, and the copies go stale; B works, but is manual, weekly and easy to forget; D a one-time upload is a snapshot; it will not track weekly changes.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 5.4.","answerStatus":"source"},{"query":"An operations team is choosing which files to add as knowledge to a Project that answers staff questions about procedures. Which two files are appropriate to include? (Choose two.)","type":"multiple-choice","options":[{"text":"The current standard operating procedures manual.","explanation":"Project knowledge should be current, authoritative and relevant to the questions the Project answers.","correct":true},{"text":"Every email the team has received in the past year, so that Claude has the full context.","explanation":"Volume without relevance.","correct":false},{"text":"A spreadsheet of staff home addresses used for emergency contact.","explanation":"Personal data with no bearing on procedures.","correct":false},{"text":"A short glossary of internal terms and system names.","explanation":"Project knowledge should be current, authoritative and relevant to the questions the Project answers.","correct":true},{"text":"The complete archive of superseded procedures, in case they are needed for comparison.","explanation":"Superseded content invites wrong answers.","correct":false}],"answer":"<p>Correct answers: <strong>The current standard operating procedures manual.; A short glossary of internal terms and system names.</strong></p><p>Project knowledge should be current, authoritative and relevant to the questions the Project answers.</p>","tip":"<p>Why not the others: B volume without relevance; C personal data with no bearing on procedures; E superseded content invites wrong answers.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 5.5.","answerStatus":"source"},{"query":"A marketing lead is writing Project instructions for a social-media drafting assistant. Which two instructions are well formed? (Choose two.)","type":"multiple-choice","options":[{"text":"\"Be creative and engaging, and make every post something that people will want to share.\"","explanation":"Aspirational, not actionable.","correct":false},{"text":"\"If a request needs a product fact that is not in the knowledge files, say so rather than guessing.\"","explanation":"Good instructions are specific about audience, tone and length, and tell Claude how to behave when it lacks information.","correct":true},{"text":"\"Use your best judgement about tone, length and audience for each post, depending on the request.\"","explanation":"Delegates the decisions the instructions exist to make.","correct":false},{"text":"\"Write for small-business owners in a warm, plain-English tone; keep each post under 80 words.\"","explanation":"Good instructions are specific about audience, tone and length, and tell Claude how to behave when it lacks information.","correct":true},{"text":"\"Always include at least ten hashtags to maximise reach, whatever the platform or the subject of the post.\"","explanation":"A rigid rule that is wrong for most platforms.","correct":false}],"answer":"<p>Correct answers: <strong>&quot;If a request needs a product fact that is not in the knowledge files, say so rather than guessing.&quot;; &quot;Write for small-business owners in a warm, plain-English tone; keep each post under 80 words.&quot;</strong></p><p>Good instructions are specific about audience, tone and length, and tell Claude how to behave when it lacks information.</p>","tip":"<p>Why not the others: A aspirational, not actionable; C delegates the decisions the instructions exist to make; E a rigid rule that is wrong for most platforms.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 5.6.","answerStatus":"source"},{"query":"You are the owner of a shared Project used by a team of twelve. A policy the Project relies on has changed. Which is the correct order of steps? (1) Update the instructions where they describe the old policy. (2) Tell the team what changed and the date it took effect. (3) Identify which knowledge files and instructions refer to the old policy. (4) Test with a few typical prompts to confirm that answers reflect the new policy. (5) Replace the outdated files with the current version.","type":"multiple-choice","options":[{"text":"3, 5, 1, 4, 2","explanation":"Maintenance is find, replace, update, verify, then communicate. Testing before telling the team avoids announcing a change that has not actually worked.","correct":true},{"text":"5, 3, 1, 4, 2","explanation":"Replaces files before knowing which ones are affected.","correct":false},{"text":"3, 5, 1, 2, 4","explanation":"Notifies the team before the change has been tested.","correct":false},{"text":"3, 1, 5, 2, 4","explanation":"Notifies the team before the change has been tested.","correct":false}],"answer":"<p>Correct answer: <strong>3, 5, 1, 4, 2</strong></p><p>Maintenance is find, replace, update, verify, then communicate. Testing before telling the team avoids announcing a change that has not actually worked.</p>","tip":"<p>Why not the others: B replaces files before knowing which ones are affected; C notifies the team before the change has been tested; D notifies the team before the change has been tested.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 5.7.","answerStatus":"source"},{"query":"A payroll officer wants Claude to find patterns in overtime claims. The spreadsheet contains employee names, tax file numbers and bank details. Policy prohibits sharing identifiable personal data with AI tools. What is the most appropriate action?","type":"multiple-choice","options":[{"text":"Upload the spreadsheet but instruct Claude not to read or use the columns that contain personal details.","explanation":"The data has already been shared once it is uploaded.","correct":false},{"text":"Upload only the first 50 rows so that the exposure is limited while the pattern analysis is tested.","explanation":"Shares less identifiable data, but still shares it.","correct":false},{"text":"Remove names, tax file numbers and bank details, keep an anonymised ID with each claim, and proceed.","explanation":"De-identify before upload. The analysis needs the claims, not the identities, so the policy and the task are both satisfied.","correct":true},{"text":"Ask Claude to anonymise the spreadsheet first, then analyse the anonymised version it has produced.","explanation":"Shares all of it in order to anonymise it.","correct":false}],"answer":"<p>Correct answer: <strong>Remove names, tax file numbers and bank details, keep an anonymised ID with each claim, and proceed.</strong></p><p>De-identify before upload. The analysis needs the claims, not the identities, so the policy and the task are both satisfied.</p>","tip":"<p>Why not the others: A the data has already been shared once it is uploaded; B shares less identifiable data, but still shares it; D shares all of it in order to anonymise it.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 6.1.","answerStatus":"source"},{"query":"A team leader in a government agency is considering tasks to hand to Claude. Which task is an appropriate use?","type":"multiple-choice","options":[{"text":"Producing a legal opinion on a contract dispute that will be relied on without a lawyer's review.","explanation":"Removes the professional review the output depends on.","correct":false},{"text":"Drafting a plain-language version of a published policy for the website, for review before publication.","explanation":"Drafting from public material with human review is squarely appropriate. The others are consequential decisions about people that require human accountability.","correct":true},{"text":"Determining whether an individual's application for a benefit should be approved, from the submitted form.","explanation":"An administrative decision with legal effect.","correct":false},{"text":"Making the final decision on which staff members receive a performance bonus this year, from their reviews.","explanation":"A personnel decision with significant impact on individuals.","correct":false}],"answer":"<p>Correct answer: <strong>Drafting a plain-language version of a published policy for the website, for review before publication.</strong></p><p>Drafting from public material with human review is squarely appropriate. The others are consequential decisions about people that require human accountability.</p>","tip":"<p>Why not the others: A removes the professional review the output depends on; C an administrative decision with legal effect; D a personnel decision with significant impact on individuals.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 6.2.","answerStatus":"source"},{"query":"A marketing associate at Tallowood Credit Union finds that Claude drafts customer emails much faster than the current approved tool. The organisation's AI policy requires new AI uses to be registered and assessed before use. What should she do?","type":"multiple-choice","options":[{"text":"Start using Claude for internal drafts only, since the policy is aimed at external communications.","explanation":"Reinterprets the policy to avoid it.","correct":false},{"text":"Use Claude for the emails now and register the use once the benefit has been proven.","explanation":"Inverts the order the policy requires.","correct":false},{"text":"Register the proposed use and complete the assessment before using Claude for customer emails.","explanation":"Governance processes exist to catch risks before they materialise. Following them is not optional because the tool is better.","correct":true},{"text":"Ask her manager for verbal approval and proceed while the assessment is scheduled.","explanation":"Substitutes informal approval for the required process.","correct":false}],"answer":"<p>Correct answer: <strong>Register the proposed use and complete the assessment before using Claude for customer emails.</strong></p><p>Governance processes exist to catch risks before they materialise. Following them is not optional because the tool is better.</p>","tip":"<p>Why not the others: A reinterprets the policy to avoid it; B inverts the order the policy requires; D substitutes informal approval for the required process.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 6.3.","answerStatus":"source"},{"query":"A communications team is using Claude to help draft a public awareness campaign. Which practice best reflects ethical use?","type":"multiple-choice","options":[{"text":"Avoid mentioning the AI involvement, since a person reviewed and approved the content before it was published and is named on it.","explanation":"Review does not remove the question of disclosure.","correct":false},{"text":"Attribute the campaign to Claude in the credits so that the audience knows that a person did not write it.","explanation":"Misplaces accountability on the tool.","correct":false},{"text":"Use Claude only for the first draft and rewrite it substantially so that disclosure is not required.","explanation":"Structures the work to dodge transparency rather than to meet it.","correct":false},{"text":"Disclose AI assistance where policy or audience expectations call for it, and keep a named person accountable.","explanation":"Ethical use rests on transparency where it matters and clear human accountability for what is published.","correct":true}],"answer":"<p>Correct answer: <strong>Disclose AI assistance where policy or audience expectations call for it, and keep a named person accountable.</strong></p><p>Ethical use rests on transparency where it matters and clear human accountability for what is published.</p>","tip":"<p>Why not the others: A review does not remove the question of disclosure; B misplaces accountability on the tool; C structures the work to dodge transparency rather than to meet it.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 6.4.","answerStatus":"source"},{"query":"A health-promotion officer is preparing to use Claude to analyse free-text responses from a community survey. Which two considerations are most important before the responses are uploaded? (Choose two.)","type":"multiple-choice","options":[{"text":"Whether the survey's privacy notice allowed the responses to be processed by a third-party tool.","explanation":"Identifiability and the terms under which the data was collected are the two privacy questions that decide whether the upload is permissible.","correct":true},{"text":"Whether the responses contain information that could identify an individual respondent.","explanation":"Identifiability and the terms under which the data was collected are the two privacy questions that decide whether the upload is permissible.","correct":true},{"text":"Whether the responses were collected through an online form or on paper at community events.","explanation":"The collection channel is irrelevant to the privacy obligation.","correct":false},{"text":"Whether the responses are long and detailed enough for Claude to find meaningful themes in them.","explanation":"A quality question, not a privacy one.","correct":false},{"text":"Whether Claude's analysis is likely to agree with the conclusions the officer has already reached.","explanation":"Confirmation is not the goal of analysis.","correct":false}],"answer":"<p>Correct answers: <strong>Whether the survey&#x27;s privacy notice allowed the responses to be processed by a third-party tool.; Whether the responses contain information that could identify an individual respondent.</strong></p><p>Identifiability and the terms under which the data was collected are the two privacy questions that decide whether the upload is permissible.</p>","tip":"<p>Why not the others: C the collection channel is irrelevant to the privacy obligation; D a quality question, not a privacy one; E confirmation is not the goal of analysis.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 6.5.","answerStatus":"source"},{"query":"An operations manager is reviewing Claude use cases proposed by her team. Which two should she decline or refer for further assessment? (Choose two.)","type":"multiple-choice","options":[{"text":"Summarising a client's unredacted contract that carries a confidentiality clause.","explanation":"Automated decisions about people and confidential third-party material are the two categories that need governance review before use.","correct":true},{"text":"Screening job applicants and automatically rejecting those Claude scores below a threshold.","explanation":"Automated decisions about people and confidential third-party material are the two categories that need governance review before use.","correct":true},{"text":"Drafting agendas and summarising the notes for the weekly team meeting, for the manager to check.","explanation":"Routine, internal and low risk.","correct":false},{"text":"Explaining an unfamiliar spreadsheet formula that a team member found in an inherited workbook.","explanation":"A learning task with no data concern.","correct":false},{"text":"Suggesting alternative wording for an internal staff newsletter before it goes to the editor.","explanation":"Routine drafting.","correct":false}],"answer":"<p>Correct answers: <strong>Summarising a client&#x27;s unredacted contract that carries a confidentiality clause.; Screening job applicants and automatically rejecting those Claude scores below a threshold.</strong></p><p>Automated decisions about people and confidential third-party material are the two categories that need governance review before use.</p>","tip":"<p>Why not the others: C routine, internal and low risk; D a learning task with no data concern; E routine drafting.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 6.6.","answerStatus":"source"},{"query":"A regional manager at Halden Insurance is rolling out Claude to 40 staff. Which two actions best support compliance with the organisation's AI governance standards? (Choose two.)","type":"multiple-choice","options":[{"text":"Restrict Claude to managers for the first year, since they are more accountable than other staff.","explanation":"Seniority is not a governance mechanism.","correct":false},{"text":"Provide a short guide listing approved use cases and the categories of data that must not be entered.","explanation":"Clear guidance and a defined review path are what turn a policy into practice.","correct":true},{"text":"Nominate a contact who reviews new use cases and records them in the organisation's AI register.","explanation":"Clear guidance and a defined review path are what turn a policy into practice.","correct":true},{"text":"Allow staff to use personal Claude accounts so that the rollout is not held up by the procurement process.","explanation":"Personal accounts sit outside the organisation's controls.","correct":false},{"text":"Ask staff to agree informally not to enter sensitive data, and trust them to apply common sense.","explanation":"Informal agreement is not a control.","correct":false}],"answer":"<p>Correct answers: <strong>Provide a short guide listing approved use cases and the categories of data that must not be entered.; Nominate a contact who reviews new use cases and records them in the organisation&#x27;s AI register.</strong></p><p>Clear guidance and a defined review path are what turn a policy into practice.</p>","tip":"<p>Why not the others: A seniority is not a governance mechanism; D personal accounts sit outside the organisation&#x27;s controls; E informal agreement is not a control.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 6.7.","answerStatus":"source"},{"query":"You are a team leader deciding whether a proposed Claude use case that involves customer records can go ahead. Which is the correct order of steps? (1) Work out who would be affected if an output were wrong, and whether the error could be undone. (2) List the data fields the use case needs and flag any that identify a person. (3) Write up the outcome and the reasons for it. (4) Compare the proposal with the AI policy and the privacy obligations that apply. (5) Approve it, approve it with changes such as removing identifiers, or decline it.","type":"multiple-choice","options":[{"text":"2, 4, 1, 3, 5","explanation":"Writes up an outcome that has not yet been decided.","correct":false},{"text":"2, 1, 4, 5, 3","explanation":"Understand the data and the impact first, then test against policy, then decide, then record.","correct":true},{"text":"2, 1, 5, 4, 3","explanation":"Approves or declines before the policy comparison.","correct":false},{"text":"4, 2, 1, 5, 3","explanation":"Compares the proposal with policy before knowing what data is involved.","correct":false}],"answer":"<p>Correct answer: <strong>2, 1, 4, 5, 3</strong></p><p>Understand the data and the impact first, then test against policy, then decide, then record.</p>","tip":"<p>Why not the others: A writes up an outcome that has not yet been decided; C approves or declines before the policy comparison; D compares the proposal with policy before knowing what data is involved.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 6.8.","answerStatus":"source"},{"query":"You are a communications officer who has discovered that a colleague pasted a customer list containing personal details into Claude last week. Which is the correct order of steps? (1) Record what data was entered, when, and in which account. (2) Stop any further use and ask the colleague not to repeat it. (3) Support any assessment of harm and any notifications that are required. (4) Report the incident, with that record, through the organisation's privacy or AI incident process. (5) Share the lesson with the team and update the guidance.","type":"multiple-choice","options":[{"text":"2, 1, 5, 4, 3","explanation":"Shares the lesson before the incident has been reported or assessed.","correct":false},{"text":"2, 4, 1, 3, 5","explanation":"Reports before there is a record of what happened.","correct":false},{"text":"2, 1, 4, 3, 5","explanation":"Contain, record, report, support, then learn. Containment comes first because it limits further exposure; the record is what the report is based on.","correct":true},{"text":"1, 2, 4, 3, 5","explanation":"Records before containing, allowing further exposure meanwhile.","correct":false}],"answer":"<p>Correct answer: <strong>2, 1, 4, 3, 5</strong></p><p>Contain, record, report, support, then learn. Containment comes first because it limits further exposure; the record is what the report is based on.</p>","tip":"<p>Why not the others: A shares the lesson before the incident has been reported or assessed; B reports before there is a record of what happened; D records before containing, allowing further exposure meanwhile.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 6.9.","answerStatus":"source"},{"query":"A recruitment coordinator asked Claude to \"review this position description\" and received a general comment on readability. She wanted specific gaps against the selection criteria. What is the most likely root cause?","type":"multiple-choice","options":[{"text":"The prompt did not state what to review for or what the output should contain.","explanation":"\"Review\" without criteria or an output specification leaves Claude to guess the purpose. The fix is in the prompt.","correct":true},{"text":"The position description was too long for Claude to analyse properly.","explanation":"A single position description is well within limits.","correct":false},{"text":"The model chosen was too light for a review task.","explanation":"Any tier can do a criteria check if asked for one.","correct":false},{"text":"Claude cannot compare a document against criteria unless they are presented in a table.","explanation":"Format is not a prerequisite for comparison.","correct":false}],"answer":"<p>Correct answer: <strong>The prompt did not state what to review for or what the output should contain.</strong></p><p>&quot;Review&quot; without criteria or an output specification leaves Claude to guess the purpose. The fix is in the prompt.</p>","tip":"<p>Why not the others: B a single position description is well within limits; C any tier can do a criteria check if asked for one; D format is not a prerequisite for comparison.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 7.1.","answerStatus":"source"},{"query":"Readers have described an analyst's weekly Claude-drafted dashboard commentary as \"too long and too hedged\". Which approach to adjusting is most effective?","type":"multiple-choice","options":[{"text":"Ask Claude to write the commentary twice in different styles and send whichever version is shorter.","explanation":"Picks between two unguided outputs instead of fixing the guidance.","correct":false},{"text":"Switch to a different model, since length and tone are characteristics of the model rather than the prompt.","explanation":"Length and hedging are controlled by the prompt, not the tier.","correct":false},{"text":"Turn the feedback into prompt constraints, such as a word limit, and check the next output against the complaint.","explanation":"Feedback becomes improvement when it is translated into specific instructions and the next result is checked against the original complaint.","correct":true},{"text":"Remove all constraints from the prompt so that Claude can decide on an appropriate length and level of certainty.","explanation":"Removes the levers that control length and tone.","correct":false}],"answer":"<p>Correct answer: <strong>Turn the feedback into prompt constraints, such as a word limit, and check the next output against the complaint.</strong></p><p>Feedback becomes improvement when it is translated into specific instructions and the next result is checked against the original complaint.</p>","tip":"<p>Why not the others: A picks between two unguided outputs instead of fixing the guidance; B length and hedging are controlled by the prompt, not the tier; D removes the levers that control length and tone.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 7.2.","answerStatus":"source"},{"query":"A policy team spends 20 minutes at the start of every Claude session pasting the same background documents and explaining the house style. Which change best optimises the workflow?","type":"multiple-choice","options":[{"text":"Move the documents and style guidance into a Project so that every session starts with them in place.","explanation":"Repeated setup is the signal that reference material belongs in a Project. The 20 minutes disappears for everyone.","correct":true},{"text":"Ask Claude at the end of each session to remember the documents and the style guidance for next time.","explanation":"Memory may retain stated preferences, but it does not carry whole background documents between sessions; a Project does.","correct":false},{"text":"Shorten the background documents so that pasting them and explaining the style takes less time.","explanation":"Reduces the waste slightly instead of removing it.","correct":false},{"text":"Assign one team member to do all of the pasting so that the others can start their work immediately.","explanation":"Moves the waste to one person.","correct":false}],"answer":"<p>Correct answer: <strong>Move the documents and style guidance into a Project so that every session starts with them in place.</strong></p><p>Repeated setup is the signal that reference material belongs in a Project. The 20 minutes disappears for everyone.</p>","tip":"<p>Why not the others: B memory may retain stated preferences, but it does not carry whole background documents between sessions; a Project does; C reduces the waste slightly instead of removing it; D moves the waste to one person.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 7.3.","answerStatus":"source"},{"query":"A prompt asked for \"a summary of the attached report, the three main risks, and a recommended next step\". Claude's response contains only the summary. Which two changes are most likely to fix the problem? (Choose two.)","type":"multiple-choice","options":[{"text":"Ask Claude to confirm that it has understood the request before answering.","explanation":"Adds a turn without clarifying the structure.","correct":false},{"text":"Replace \"summary\" with \"overview\", since the word may have narrowed the response.","explanation":"A vocabulary change that does not expose the three parts.","correct":false},{"text":"List the three required parts as numbered items in the prompt and ask for a heading for each.","explanation":"Multi-part requests buried in one sentence get partial answers. Enumerating the parts or supplying a template makes each one explicit.","correct":true},{"text":"Give the required output structure as a short template showing the three sections.","explanation":"Multi-part requests buried in one sentence get partial answers. Enumerating the parts or supplying a template makes each one explicit.","correct":true},{"text":"Attach the report twice so that Claude has it in context for each part of the answer.","explanation":"Duplicates the input and changes nothing about the output.","correct":false}],"answer":"<p>Correct answers: <strong>List the three required parts as numbered items in the prompt and ask for a heading for each.; Give the required output structure as a short template showing the three sections.</strong></p><p>Multi-part requests buried in one sentence get partial answers. Enumerating the parts or supplying a template makes each one explicit.</p>","tip":"<p>Why not the others: A adds a turn without clarifying the structure; B a vocabulary change that does not expose the three parts; E duplicates the input and changes nothing about the output.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 7.4.","answerStatus":"source"},{"query":"A team's Claude-drafted customer replies have improved after several prompt changes, but the team leader wants to know which change actually helped. Which two practices make that clear? (Choose two.)","type":"multiple-choice","options":[{"text":"Judge improvement by whether the team leader prefers the latest draft to the previous one.","explanation":"Preference without criteria is not measurement.","correct":false},{"text":"Score each output against the same checklist of criteria before and after a change.","explanation":"Attribution needs a controlled comparison: one variable, fixed inputs, fixed criteria.","correct":true},{"text":"Change one element of the prompt at a time and keep the test inputs the same.","explanation":"Attribution needs a controlled comparison: one variable, fixed inputs, fixed criteria.","correct":true},{"text":"Ask Claude which of the changes it found most helpful.","explanation":"The model cannot observe its own improvement.","correct":false},{"text":"Make all of the changes at once so that the improvement is as large as possible.","explanation":"Destroys attribution.","correct":false}],"answer":"<p>Correct answers: <strong>Score each output against the same checklist of criteria before and after a change.; Change one element of the prompt at a time and keep the test inputs the same.</strong></p><p>Attribution needs a controlled comparison: one variable, fixed inputs, fixed criteria.</p>","tip":"<p>Why not the others: A preference without criteria is not measurement; D the model cannot observe its own improvement; E destroys attribution.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 7.5.","answerStatus":"source"},{"query":"You are a project officer troubleshooting a Claude prompt that keeps producing an off-target weekly status report. Which is the correct order of steps? (1) Make one targeted change to the prompt. (2) Compare the output with what was expected and name the specific gap. (3) Keep the change if it helped; otherwise revert it and try the next hypothesis. (4) Check whether the prompt actually states the missing expectation. (5) Run the prompt again on the same inputs and compare it with the original expectation.","type":"multiple-choice","options":[{"text":"2, 4, 5, 1, 3","explanation":"Re-runs before anything has been changed.","correct":false},{"text":"4, 2, 1, 5, 3","explanation":"Inspects the prompt before the gap has been named.","correct":false},{"text":"2, 1, 4, 5, 3","explanation":"Changes the prompt before checking whether it is the cause.","correct":false},{"text":"2, 4, 1, 5, 3","explanation":"Diagnosis before treatment: name the gap, find its cause in the prompt, change one thing, re-test on the same inputs, then decide.","correct":true}],"answer":"<p>Correct answer: <strong>2, 4, 1, 5, 3</strong></p><p>Diagnosis before treatment: name the gap, find its cause in the prompt, change one thing, re-test on the same inputs, then decide.</p>","tip":"<p>Why not the others: A re-runs before anything has been changed; B inspects the prompt before the gap has been named; C changes the prompt before checking whether it is the cause.</p>","reference":"Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0), source question 7.6.","answerStatus":"source"}];

    const CURRENT_KEY = "ccaoFExamCurrentV1";
    const HISTORY_KEY = "ccaoFExamHistoryV1";
    const EXAM_NAME = "Claude Associate Foundations Practice Exam";

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function isCorrect(question) {
      return question.options.every(option => Boolean(option.selected) === Boolean(option.correct));
    }

    function correctCount(question) {
      return question.options.filter(option => option.correct).length;
    }

    function formatDuration(ms) {
      if (!Number.isFinite(ms) || ms < 0) return "0:00";
      const total = Math.floor(ms / 1000);
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    class ExamQuestion extends HTMLElement {
      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { question, index, total, graded, cheating } = this._state;
        const reveal = graded || cheating;
        const choose = correctCount(question);

        this.innerHTML = `
          <section class="card" aria-labelledby="question-title">
            <div class="card-header">
              <span>Question ${index + 1} of ${total}</span>
              <span>${question.viewed ? "Viewed" : "New"}</span>
            </div>
            <div class="card-body">
              <p class="query" id="question-title"></p>
              <p class="choose-note">Choose ${choose}</p>
              <div class="options"></div>
              ${reveal ? `<div class="answer-panel"><strong>Answer</strong><div class="answer-html"></div><div class="tip-html"></div><p class="reference-note"></p></div>` : ""}
            </div>
          </section>
        `;

        this.querySelector(".query").textContent = question.query.replace(/\s+(?=\([1-5]\)\s)/g, "\n");
        const options = this.querySelector(".options");

        question.options.forEach((option, optionIndex) => {
          const label = document.createElement("label");
          label.className = "option";
          if (reveal && option.correct) label.classList.add("reveal-correct");
          if (reveal && option.selected && !option.correct) label.classList.add("reveal-wrong-selected");

          const input = document.createElement("input");
          input.type = choose === 1 ? "radio" : "checkbox";
          if (choose === 1) input.name = `question-${index}`;
          input.checked = Boolean(option.selected);
          input.disabled = Boolean(graded);
          input.addEventListener("change", () => {
            this.dispatchEvent(new CustomEvent("option-toggle", {
              bubbles: true,
              detail: { optionIndex }
            }));
          });

          const textWrap = document.createElement("span");
          const text = document.createElement("span");
          text.textContent = option.text;
          textWrap.appendChild(text);

          if (reveal && option.explanation) {
            const explanation = document.createElement("small");
            explanation.textContent = option.explanation;
            textWrap.appendChild(explanation);
          }

          label.append(input, textWrap);
          options.appendChild(label);
        });

        const answer = this.querySelector(".answer-html");
        if (answer) answer.innerHTML = question.answer || "";
        const tip = this.querySelector(".tip-html");
        if (tip) tip.innerHTML = question.tip || "";
        const reference = this.querySelector(".reference-note");
        if (reference) reference.textContent = question.reference || "";
      }
    }
    customElements.define("exam-question", ExamQuestion);

    class QuestionJumper extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { questions, current, graded, cheating } = this._state;
        const reveal = graded || cheating;

        this.innerHTML = `
          <section class="card">
            <div class="card-header collapsible-title" role="button" tabindex="0">
              <span>Question Jumper</span>
              <span class="chevron">${this.collapsed ? "▼" : "▲"}</span>
            </div>
            <div class="card-body jumper-body" ${this.collapsed ? 'hidden' : ''}>
              <div class="jumper-grid"></div>
            </div>
          </section>
        `;

        const title = this.querySelector(".collapsible-title");
        const toggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        title.addEventListener("click", toggle);
        title.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });

        const grid = this.querySelector(".jumper-grid");
        questions.forEach((question, index) => {
          const button = document.createElement("button");
          button.className = "jump-btn";
          button.textContent = String(index + 1);
          button.title = question.query;

          if (question.viewed) button.classList.add("viewed");
          if (index === current) button.classList.add("current");

          if (reveal) {
            button.classList.remove("viewed", "current");
            button.classList.add(isCorrect(question) ? "correct" : "incorrect");
            if (index === current) button.style.outline = "3px solid #111827";
          }

          button.addEventListener("click", () => {
            this.dispatchEvent(new CustomEvent("jump", {
              bubbles: true,
              detail: { index }
            }));
          });
          grid.appendChild(button);
        });
      }
    }
    customElements.define("question-jumper", QuestionJumper);

    class ExamHistoryPanel extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        const history = this._state?.history || { exams: [] };
        const exams = Array.isArray(history.exams) ? history.exams : [];

        this.innerHTML = `
          <section class="card">
            <div class="card-header">
              <span class="collapsible-title" role="button" tabindex="0">Exam History</span>
              <div class="control-group">
                <button class="btn-secondary toggle-history">${this.collapsed ? "Show" : "Hide"}</button>
                <button class="btn-danger clear-history" ${exams.length ? "" : "disabled"}>Clear History</button>
              </div>
            </div>
            <div class="card-body history-body" ${this.collapsed ? "hidden" : ""}></div>
          </section>
        `;

        const doToggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        this.querySelector(".toggle-history").addEventListener("click", doToggle);
        this.querySelector(".collapsible-title").addEventListener("click", doToggle);
        this.querySelector(".clear-history").addEventListener("click", () => {
          this.dispatchEvent(new CustomEvent("history-clear", { bubbles: true }));
        });

        const body = this.querySelector(".history-body");
        if (!exams.length) {
          body.innerHTML = `<p class="history-empty">No completed exams are stored on this device.</p>`;
          return;
        }

        [...exams].reverse().forEach((exam, reverseIndex) => {
          const questions = Array.isArray(exam.questions) ? exam.questions : [];
          const score = questions.filter(isCorrect).length;
          const number = exams.length - reverseIndex;
          const finish = Number(exam.finish || exam.completedAt || 0);
          const start = Number(exam.start || 0);
          const stamp = finish ? new Date(finish).toLocaleString() : "Completed exam";
          const duration = finish && start ? formatDuration(finish - start) : "";

          const wrap = document.createElement("div");
          wrap.className = "history-exam";

          const summary = document.createElement("div");
          summary.className = "history-summary";
          summary.innerHTML = `<strong>Attempt ${number}: ${score} / ${questions.length}</strong><span>${stamp}${duration ? ` · ${duration}` : ""}</span>`;
          wrap.appendChild(summary);

          const dots = document.createElement("div");
          dots.className = "history-dots";
          questions.forEach((question, i) => {
            const dot = document.createElement("span");
            dot.className = "history-dot" + (isCorrect(question) ? " correct" : "");
            dot.textContent = String(i + 1);
            dot.title = question.query;
            dots.appendChild(dot);
          });
          wrap.appendChild(dots);
          body.appendChild(wrap);
        });
      }
    }
    customElements.define("exam-history-panel", ExamHistoryPanel);

    class ClaudeExamApp extends HTMLElement {
      constructor() {
        super();
        this.state = null;
        this.timerHandle = null;
      }

      connectedCallback() {
        this.load();
        this.addEventListener("option-toggle", e => this.toggleOption(e.detail.optionIndex));
        this.addEventListener("jump", e => this.setCurrentQuestion(e.detail.index));
        this.addEventListener("history-clear", () => this.clearHistory());
        this.render();
        this.timerHandle = setInterval(() => this.updateTimer(), 1000);
      }

      disconnectedCallback() {
        clearInterval(this.timerHandle);
      }

      load() {
        let saved = null;
        try {
          saved = JSON.parse(localStorage.getItem(CURRENT_KEY));
        } catch (_) {}

        if (saved && Array.isArray(saved.questions) && saved.questions.length === QUESTION_BANK.length && !saved.graded) {
          this.state = saved;
        } else {
          const questions = clone(QUESTION_BANK).map(q => ({
            ...q,
            viewed: false,
            options: q.options.map(o => ({ ...o, selected: false }))
          }));
          questions[0].viewed = true;
          this.state = {
            name: EXAM_NAME,
            graded: false,
            start: Date.now(),
            finish: 0,
            questions,
            currentQuestionNumber: 0,
            cheating: new URLSearchParams(location.search).get("page") === "answer"
          };
          this.saveCurrent();
        }
      }

      saveCurrent() {
        if (!this.state.graded) {
          localStorage.setItem(CURRENT_KEY, JSON.stringify(this.state));
        }
      }

      getHistory() {
        try {
          const existing = JSON.parse(localStorage.getItem(HISTORY_KEY));
          if (existing && Array.isArray(existing.exams)) return existing;
        } catch (_) {}
        const history = { name: "Exam History", exams: [] };
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        return history;
      }

      clearHistory() {
        localStorage.setItem(HISTORY_KEY, JSON.stringify({ name: "Exam History", exams: [] }));
        this.render();
      }

      toggleOption(optionIndex) {
        if (this.state.graded) return;
        const q = this.state.questions[this.state.currentQuestionNumber];
        if (correctCount(q) === 1) {
          q.options.forEach((option, i) => { option.selected = i === optionIndex; });
        } else {
          q.options[optionIndex].selected = !q.options[optionIndex].selected;
        }
        q.viewed = true;
        this.saveCurrent();
        this.render();
      }

      setCurrentQuestion(index) {
        const next = Math.max(0, Math.min(index, this.state.questions.length - 1));
        this.state.currentQuestionNumber = next;
        this.state.questions[next].viewed = true;
        this.saveCurrent();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      toggleCheat() {
        this.state.cheating = !this.state.cheating;
        this.saveCurrent();
        this.render();
      }

      grade() {
        if (this.state.graded) return;
        this.state.graded = true;
        this.state.cheating = true;
        this.state.finish = Date.now();

        const history = this.getHistory();
        history.exams.push(clone(this.state));
        history.exams = history.exams.slice(-15);
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        localStorage.removeItem(CURRENT_KEY);
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      restart() {
        localStorage.removeItem(CURRENT_KEY);
        this.load();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      score() {
        return this.state.questions.filter(isCorrect).length;
      }

      answeredCount() {
        return this.state.questions.filter(q => q.options.some(o => o.selected)).length;
      }

      updateTimer() {
        const el = this.querySelector("[data-timer]");
        if (!el || !this.state) return;
        const end = this.state.finish || Date.now();
        el.textContent = formatDuration(end - this.state.start);
      }

      render() {
        if (!this.state) return;
        const qIndex = this.state.currentQuestionNumber;
        const total = this.state.questions.length;
        const answered = this.answeredCount();
        const score = this.score();

        this.innerHTML = `
          <main class="page-shell">
            <header class="hero">
              <div class="hero-top">
                <div>
                  <h1>Claude Certified Associate - Foundations Practice Exam</h1>
                  <p>CCAO-F practice questions · standalone Web Components exam · works offline</p>
                </div>
                <div class="pill">Elapsed <span data-timer>${formatDuration((this.state.finish || Date.now()) - this.state.start)}</span></div>
              </div>
              <div class="meta-row">
                <span class="pill">${total} questions</span>
                <span class="pill">${answered} answered</span>
                <span class="pill">${this.state.questions.filter(q => q.viewed).length} viewed</span>
                ${this.state.graded ? `<span class="pill">Score ${score} / ${total}</span>` : ""}
              </div>
            </header>

            ${this.state.graded ? `
              <section class="card results">
                <div class="card-body">
                  <strong>Your grade is ${score} out of ${total}.</strong>
                  <div class="status-line">Correct answers and option explanations are now visible. Your completed attempt has been saved to local storage.</div>
                </div>
              </section>
            ` : ""}

            <exam-question></exam-question>

            <div class="controls">
              <div class="control-group">
                <button class="btn-secondary previous" ${qIndex === 0 ? "disabled" : ""}>Back</button>
                <button class="btn-primary next" ${qIndex === total - 1 ? "disabled" : ""}>Next</button>
              </div>
              <div class="control-group">
                <button class="btn-warning cheat">${this.state.cheating ? "Be Honest" : "Cheat"}</button>
                ${this.state.graded
                  ? `<button class="btn-primary restart">Start New Attempt</button>`
                  : `<button class="btn-primary finish">Finish</button>`}
              </div>
            </div>

            <question-jumper></question-jumper>
            <exam-history-panel></exam-history-panel>

            <p class="footer-note">Progress and completed attempts are stored only in this browser. Question source: Matthew Purcell, CCAO-F Practice Questions v2 (CC BY-NC 4.0).</p>
          </main>
        `;

        const questionEl = this.querySelector("exam-question");
        questionEl.state = {
          question: this.state.questions[qIndex],
          index: qIndex,
          total,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const jumper = this.querySelector("question-jumper");
        jumper.state = {
          questions: this.state.questions,
          current: qIndex,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const history = this.querySelector("exam-history-panel");
        history.state = { history: this.getHistory() };

        this.querySelector(".previous").addEventListener("click", () => this.setCurrentQuestion(qIndex - 1));
        this.querySelector(".next").addEventListener("click", () => this.setCurrentQuestion(qIndex + 1));
        this.querySelector(".cheat").addEventListener("click", () => this.toggleCheat());

        const finish = this.querySelector(".finish");
        if (finish) finish.addEventListener("click", () => this.grade());

        const restart = this.querySelector(".restart");
        if (restart) restart.addEventListener("click", () => this.restart());
      }
    }
    customElements.define("claude-exam-app", ClaudeExamApp);
  </script>
</body>
</html>
