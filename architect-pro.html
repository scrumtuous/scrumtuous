<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Architect Practice Exam | CCAR-P</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #d9e0e8;
      --primary: #a65435;
      --primary-dark: #804027;
      --secondary: #667085;
      --success: #16803c;
      --success-bg: #eaf8ef;
      --danger: #b42318;
      --danger-bg: #fff0ee;
      --warning: #9a6700;
      --warning-bg: #fff7d6;
      --shadow: 0 10px 28px rgba(23, 32, 51, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      border-radius: 9px;
      padding: .62rem .92rem;
      cursor: pointer;
      font-weight: 650;
      transition: transform .08s ease, background .15s ease, opacity .15s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-secondary { background: #e8edf3; color: var(--text); }
    .btn-warning { background: #ffd96a; color: #4b3500; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }

    .page-shell {
      width: min(1040px, calc(100% - 28px));
      margin: 28px auto 60px;
    }

    .hero {
      background: linear-gradient(135deg, #222236, #6b4039);
      color: white;
      border-radius: 18px;
      padding: 24px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero-top {
      display: flex;
      gap: 18px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .hero h1 { margin: 0 0 6px; font-size: clamp(1.65rem, 4vw, 2.35rem); }
    .hero p { margin: 0; opacity: .88; }
    .meta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .pill {
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.1);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: .9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-top: 16px;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 18px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-weight: 750;
    }

    .card-body { padding: 18px; }

    .results {
      border-left: 5px solid var(--primary);
    }
    .results strong { font-size: 1.1rem; }

    .query {
      font-size: 1.08rem;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .choose-note {
      color: var(--muted);
      font-size: .9rem;
      margin: 0 0 16px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 11px 12px;
      margin: 8px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
    }

    .option input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--primary);
      flex: 0 0 auto;
    }

    .option.reveal-correct {
      border-color: #75c991;
      background: var(--success-bg);
    }

    .option.reveal-wrong-selected {
      border-color: #e9a7a0;
      background: var(--danger-bg);
    }

    .option small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .answer-panel {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--warning-bg);
      border: 1px solid #f0d783;
    }

    .answer-panel p:first-child { margin-top: 0; }
    .answer-panel ul { margin-bottom: 0; }
    .answer-panel .tip-html { margin-top: 12px; }
    .answer-panel .reference-note { margin: 14px 0 0; color: var(--muted); font-size: .84rem; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .control-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .collapsible-title { cursor: pointer; user-select: none; }
    .chevron { font-size: .9rem; color: var(--muted); }

    .jumper-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .jump-btn {
      min-width: 38px;
      padding: 7px 9px;
      background: #eef2f6;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .jump-btn.viewed { background: #d7dee7; }
    .jump-btn.current { background: var(--primary); color: white; border-color: var(--primary); }
    .jump-btn.correct { background: var(--success); color: white; border-color: var(--success); }
    .jump-btn.incorrect { background: var(--danger); color: white; border-color: var(--danger); }

    .history-empty { color: var(--muted); margin: 0; }
    .history-exam {
      border-top: 1px solid var(--line);
      padding: 14px 0;
    }
    .history-exam:first-child { border-top: 0; padding-top: 0; }
    .history-summary {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }
    .history-dots { display: flex; flex-wrap: wrap; gap: 5px; }
    .history-dot {
      width: 26px; height: 26px; border-radius: 7px;
      display: grid; place-items: center;
      font-size: .76rem; color: white;
      background: var(--danger);
    }
    .history-dot.correct { background: var(--success); }

    .status-line {
      color: var(--muted);
      font-size: .92rem;
      margin-top: 10px;
    }

    .footer-note {
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
      margin-top: 22px;
    }

    @media (max-width: 640px) {
      .page-shell { width: min(100% - 16px, 1040px); margin-top: 8px; }
      .hero { border-radius: 12px; padding: 19px 17px; }
      .card-body { padding: 14px; }
      .card-header { padding: 12px 14px; }
      .controls { align-items: stretch; }
      .control-group { width: 100%; }
      .control-group button { flex: 1; }
    }
  </style>
</head>
<body>
  <claude-exam-app></claude-exam-app>

  <script>
    const QUESTION_BANK = [{"query":"You are comparing architectural patterns for a nightly batch job that processes supplier invoices. Every invoice follows the same steps: extract header fields, match to a purchase order, flag discrepancies, and persist the result. Which pattern is the best fit and why?","type":"multiple-choice","options":[{"text":"A workflow pattern, because the steps are well-defined and predictable per-invoice token cost matters more than flexibility.","explanation":"When the steps are known in advance and identical for every input, a workflow gives predictability, per-step validation and a stable cost profile. Autonomy adds planning overhead the task does not need.","correct":true},{"text":"An agentic pattern, because open-ended planning produces more consistent structured output than a fixed graph on matching tasks.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"An agentic pattern, because agents are categorically more accurate than workflows and should be preferred regardless of step predictability.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"A workflow pattern, because agentic patterns cannot invoke tools and therefore cannot execute the persist step that writes to the ledger.","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>A workflow pattern, because the steps are well-defined and predictable per-invoice token cost matters more than flexibility.</strong></p><p>When the steps are known in advance and identical for every input, a workflow gives predictability, per-step validation and a stable cost profile. Autonomy adds planning overhead the task does not need.</p>","tip":"<p>Why not the others: B and C assert that agents are inherently more accurate, which is false and ignores the fixed-step nature of the job. D reaches the right pattern for the wrong reason: agents can call tools.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 1.1.","answerStatus":"source"},{"query":"A platform team at Halvorsen Logistics operates a self-hosted multi-agent system that coordinates five specialised agents for customs documentation. Roughly 35 percent of engineering capacity goes to message-bus reliability, agent state recovery and cluster upkeep. The COO has asked you to evaluate moving to managed agent infrastructure. The compliance officer requires that all shipment manifests remain within an approved regional boundary. Which factor should most heavily influence your recommendation?","type":"multiple-choice","options":[{"text":"whether the managed offering supports the message-bus topology the team built","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"whether the managed offering reduces per-manifest token cost at current volume","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"whether the five existing agents map cleanly onto the managed offering's supported patterns","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"whether the managed offering's data handling satisfies the regional boundary compliance requires","explanation":"A hard compliance constraint is a gate, not a trade-off. If the managed offering cannot keep manifests inside the approved boundary, no amount of reclaimed engineering capacity makes it viable.","correct":true}],"answer":"<p>Correct answer: <strong>whether the managed offering&#x27;s data handling satisfies the regional boundary compliance requires</strong></p><p>A hard compliance constraint is a gate, not a trade-off. If the managed offering cannot keep manifests inside the approved boundary, no amount of reclaimed engineering capacity makes it viable.</p>","tip":"<p>Why not the others: A, B and C are legitimate inputs to the evaluation, but each can be worked around or costed. The boundary requirement cannot.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 1.2.","answerStatus":"source"},{"query":"You are reviewing a solution that uses one prompt to read a 70-page tender, assess it against 35 internal policies, score the opportunity and draft a go/no-go recommendation. Output quality is inconsistent: policies are skipped and the scoring rationale is thin. The prompt wording has already been refined twice. Which change is most likely to resolve the problem?","type":"multiple-choice","options":[{"text":"Switch to the largest available model and raise the maximum output tokens so nothing is truncated.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Decompose the task into sequenced subtasks (extract, assess, score, synthesise) that pass structured output between steps.","explanation":"Skipped items and shallow reasoning on a long multi-part task is a decomposition failure. Sequenced subtasks give each step a focused context and a verifiable intermediate output.","correct":true},{"text":"Add several complete examples of well-written go/no-go recommendations, covering different tender types, to the existing prompt so the model has a clearer target.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Lower the temperature so the model follows the long instruction list more deterministically.","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Decompose the task into sequenced subtasks (extract, assess, score, synthesise) that pass structured output between steps.</strong></p><p>Skipped items and shallow reasoning on a long multi-part task is a decomposition failure. Sequenced subtasks give each step a focused context and a verifiable intermediate output.</p>","tip":"<p>Why not the others: A treats capacity as the problem when structure is. C adds guidance where the gap is structural. D changes sampling randomness, not coverage.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 1.3.","answerStatus":"source"},{"query":"You are selecting a pattern for an internal policy assistant that must answer HR questions with citations to the authoritative policy set. Latency, cost and audit predictability are the stated priorities. Which pattern is the best fit?","type":"multiple-choice","options":[{"text":"a pure agent loop with open web-browsing tools so the assistant can surface the most current guidance","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"multi-agent orchestration with planner, researcher and writer agents on every query","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"an augmented LLM with retrieval over the indexed policy corpus and citation rendering on each answer","explanation":"Retrieval over an authoritative index gives grounded, citable answers in a single model call, which is the cheapest, fastest and most auditable shape for closed-corpus Q&A.","correct":true},{"text":"a static prompt with the entire policy corpus concatenated into every request","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>an augmented LLM with retrieval over the indexed policy corpus and citation rendering on each answer</strong></p><p>Retrieval over an authoritative index gives grounded, citable answers in a single model call, which is the cheapest, fastest and most auditable shape for closed-corpus Q&amp;A.</p>","tip":"<p>Why not the others: A abandons the authoritative source. B adds coordination cost with no benefit for a bounded lookup task. D is expensive, slow and degrades as the corpus grows.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 1.4.","answerStatus":"source"},{"query":"An executive sponsor at a retail group wants to \"put AI across the whole business\" and asks you to pick the first project from twelve candidates proposed by different departments. Which consideration should most strongly drive the selection?","type":"multiple-choice","options":[{"text":"the use case that demonstrates the most advanced agentic capability to the board","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"measurable business value balanced against feasible data access and manageable risk","explanation":"First projects earn durable sponsorship by delivering value that can be measured against a business pillar, within reach of the data and risk appetite the organisation actually has.","correct":true},{"text":"the department whose stakeholders are most enthusiastic, to guarantee adoption","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"the use case that can go live fastest, regardless of impact, to build early momentum","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>measurable business value balanced against feasible data access and manageable risk</strong></p><p>First projects earn durable sponsorship by delivering value that can be measured against a business pillar, within reach of the data and risk appetite the organisation actually has.</p>","tip":"<p>Why not the others: A optimises for spectacle. C optimises for politics. D optimises for speed over demonstrable value.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 1.5.","answerStatus":"source"},{"query":"A managed agent deployment for employee IT support has grown from 8 tools to 29 tools over a year as teams added capabilities. First-contact resolution has fallen from 88 percent to 74 percent, and tool-selection latency has risen by 1.9 seconds. A junior engineer proposes adding a router agent in front of the current agent to filter the tool list per request. Which two findings should you present to justify capability decomposition before adding the router? (Choose two.)","type":"multiple-choice","options":[{"text":"The 29 tools serve three distinct support domains: access, hardware and software licensing.","explanation":"Distinct domains inside one agent and overlapping descriptions are the two findings that show the problem is structural: the agent is doing three jobs with a confusing tool set. Decomposing by domain fixes the cause; a router only masks it.","correct":true},{"text":"The router pattern is well documented across publicly available agent literature.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Tool descriptions overlap across several domains within the current tool set.","explanation":"Distinct domains inside one agent and overlapping descriptions are the two findings that show the problem is structural: the agent is doing three jobs with a confusing tool set. Decomposing by domain fixes the cause; a router only masks it.","correct":true},{"text":"The proposed router adds an additional model call to every incoming request.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Several tools have not been invoked across the most recent 60 days of traffic.","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answers: <strong>The 29 tools serve three distinct support domains: access, hardware and software licensing.; Tool descriptions overlap across several domains within the current tool set.</strong></p><p>Distinct domains inside one agent and overlapping descriptions are the two findings that show the problem is structural: the agent is doing three jobs with a confusing tool set. Decomposing by domain fixes the cause; a router only masks it.</p>","tip":"<p>Why not the others: B is irrelevant to this deployment. D is a cost of the router, not a reason to decompose. E supports pruning dead tools, which is worth doing but does not by itself justify splitting the agent.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 1.6.","answerStatus":"source"},{"query":"You are assessing whether a complex due-diligence task warrants a multi-agent design instead of a single augmented agent. Which two characteristics of the task most strongly indicate that multiple agents are warranted? (Choose two.)","type":"multiple-choice","options":[{"text":"The overall request volume is expected to be very high, with sharp peaks at month end.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Distinct sub-tasks need different specialisations, tools and context that would overload one agent.","explanation":"Multi-agent designs earn their complexity when sub-tasks genuinely need different specialists, and when independent sub-tasks can run concurrently.","correct":true},{"text":"Stakeholders have asked for the most sophisticated architecture available so the platform is future-proof.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"The project budget is large enough to absorb the cost of several agents.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Several sub-tasks are independent and can run in parallel to shorten end-to-end time.","explanation":"Multi-agent designs earn their complexity when sub-tasks genuinely need different specialists, and when independent sub-tasks can run concurrently.","correct":true}],"answer":"<p>Correct answers: <strong>Distinct sub-tasks need different specialisations, tools and context that would overload one agent.; Several sub-tasks are independent and can run in parallel to shorten end-to-end time.</strong></p><p>Multi-agent designs earn their complexity when sub-tasks genuinely need different specialists, and when independent sub-tasks can run concurrently.</p>","tip":"<p>Why not the others: A is a scaling concern solvable within any pattern. C is prestige, not an architectural driver. D is a budget fact, not a reason.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 1.7.","answerStatus":"source"},{"query":"A document-triage solution has been in production for four months. The team has latency and cost dashboards but no way of knowing whether classifications are correct in production. Which two additions most directly close the feedback-loop gap in the architecture? (Choose two.)","type":"multiple-choice","options":[{"text":"Capture downstream corrections made by operators and link each one to the original model output.","explanation":"The missing stage is feedback: correctness signals from production flowing back into something evaluable. Captured corrections and a sampled, labelled set are the two mechanisms that create that signal.","correct":true},{"text":"Alert when daily token consumption deviates from its rolling average.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Move to a larger model, since classification accuracy generally improves with capability and the cost is within budget.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Route a sample of production outputs into a labelled evaluation set that is re-scored on a schedule.","explanation":"The missing stage is feedback: correctness signals from production flowing back into something evaluable. Captured corrections and a sampled, labelled set are the two mechanisms that create that signal.","correct":true},{"text":"Review the system prompt weekly to confirm the instructions are still current.","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answers: <strong>Capture downstream corrections made by operators and link each one to the original model output.; Route a sample of production outputs into a labelled evaluation set that is re-scored on a schedule.</strong></p><p>The missing stage is feedback: correctness signals from production flowing back into something evaluable. Captured corrections and a sampled, labelled set are the two mechanisms that create that signal.</p>","tip":"<p>Why not the others: B monitors cost, not correctness. C changes the model without measuring anything. E monitors configuration, not outcomes.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 1.8.","answerStatus":"source"},{"query":"You are a solution architect evaluating candidate use cases for a Claude-based program. For each scenario, select Yes if Claude is appropriate as the primary solution at the architectural level. Otherwise, select No. Statement: drafting first-pass root-cause narratives from semi-structured incident logs for engineer review","type":"multiple-choice","options":[{"text":"Yes","explanation":"Language-heavy tasks with tolerance for review (narratives, clause extraction, reasoned routing) are Claude's sweet spot. Hard real-time scoring, serving as an index, and exact deterministic arithmetic are jobs for purpose-built components; Claude may orchestrate or call them but should not be them.","correct":true},{"text":"No","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Yes</strong></p><p>Language-heavy tasks with tolerance for review (narratives, clause extraction, reasoned routing) are Claude&#x27;s sweet spot. Hard real-time scoring, serving as an index, and exact deterministic arithmetic are jobs for purpose-built components; Claude may orchestrate or call them but should not be them.</p>","tip":"","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 1.9, row 1.","answerStatus":"source"},{"query":"You are a solution architect evaluating candidate use cases for a Claude-based program. For each scenario, select Yes if Claude is appropriate as the primary solution at the architectural level. Otherwise, select No. Statement: long-context lease review with structured clause extraction and deviation flagging","type":"multiple-choice","options":[{"text":"Yes","explanation":"Language-heavy tasks with tolerance for review (narratives, clause extraction, reasoned routing) are Claude's sweet spot. Hard real-time scoring, serving as an index, and exact deterministic arithmetic are jobs for purpose-built components; Claude may orchestrate or call them but should not be them.","correct":true},{"text":"No","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Yes</strong></p><p>Language-heavy tasks with tolerance for review (narratives, clause extraction, reasoned routing) are Claude&#x27;s sweet spot. Hard real-time scoring, serving as an index, and exact deterministic arithmetic are jobs for purpose-built components; Claude may orchestrate or call them but should not be them.</p>","tip":"","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 1.9, row 2.","answerStatus":"source"},{"query":"You are a solution architect evaluating candidate use cases for a Claude-based program. For each scenario, select Yes if Claude is appropriate as the primary solution at the architectural level. Otherwise, select No. Statement: computing per-transaction fraud scores at sub-50-millisecond latency on a streaming pipeline","type":"multiple-choice","options":[{"text":"Yes","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"No","explanation":"Language-heavy tasks with tolerance for review (narratives, clause extraction, reasoned routing) are Claude's sweet spot. Hard real-time scoring, serving as an index, and exact deterministic arithmetic are jobs for purpose-built components; Claude may orchestrate or call them but should not be them.","correct":true}],"answer":"<p>Correct answer: <strong>No</strong></p><p>Language-heavy tasks with tolerance ate pattern. Choose from: Single augmented LLM call, Fixed workflow, Autonomous agent, Multi-agent system. Item: translating each incoming document into English with a glossary of approved terminology supplied as context","type":"multiple-choice","options":[{"text":"Single augmented LLM call","explanation":"Single transformations with supplied context are one augmented call. A stable repeating sequence is a workflow. A path that only emerges during execution is an autonomous agent. Distinct specialists coordinated into one output is multi-agent.","correct":true},{"text":"Fixed workflow","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Autonomous agent","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Multi-agent system","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Single augmented LLM call</strong></p><p>Single transformations with supplied context are one augmented call. A stable repeating sequence is a workflow. A path that only emerges during execution is an autonomous agent. Distinct specialists coordinated into one output is multi-agent.</p>","tip":"","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 1.11, row 4.","answerStatus":"source"},{"query":"You are matching scenarios to architectural patterns for a proposal. For each scenario, select the most appropriate pattern. Choose from: Single augmented LLM call, Fixed workflow, Autonomous agent, Multi-agent system. Item: a monthly compliance report produced through the same five steps every time: gather, validate, analyse, format, distribute","type":"multiple-choice","options":[{"text":"Single augmented LLM call","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Fixed workflow","explanation":"Single transformations with supplied context are one augmented call. A stable repeating sequence is a workflow. A path that only emerges during execution is an autonomous agent. Distinct specialists coordinated into one output is multi-agent.","correct":true},{"text":"Autonomous agent","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Multi-agent system","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Fixed workflow</strong></p><p>Single transformations with supplied context are one augmented call. A stable repeating sequence is a workflow. A path that only emerges during execution is an autonomous agent. Distinct specialists coordinated into one output is multi-agent.</p>","tip":"","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 1.11, row 5.","answerStatus":"source"},{"query":"You are designing a comment-moderation classifier that processes high volumes of user-generated posts under a tight per-message latency budget, using a fixed set of well-defined labels. Which model selection best aligns with the workload?","type":"multiple-choice","options":[{"text":"Opus, because every moderation decision warrants maximum reasoning depth regardless of label complexity.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Sonnet with extended thinking enabled, so deeper reasoning is applied to every post to improve edge-case handling.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Sonnet, because a larger general-purpose model is preferred even when latency requirements are strict.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Haiku, because its latency and cost profile matches high-volume classification that needs limited reasoning depth.","explanation":"High volume, strict latency and a closed label set is the profile the smallest, fastest tier is built for. Validate the choice with a representative sample, then keep it under evaluation.","correct":true}],"answer":"<p>Correct answer: <strong>Haiku, because its latency and cost profile matches high-volume classification that needs limited reasoning depth.</strong></p><p>High volume, strict latency and a closed label set is the profile the smallest, fastest tier is built for. Validate the choice with a representative sample, then keep it under evaluation.</p>","tip":"<p>Why not the others: A and C pay for capability the task does not use and may miss the latency budget. B adds thinking tokens to every request for a task that does not require multi-step reasoning.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 2.1.","answerStatus":"source"},{"query":"An application prepends the current timestamp and a request ID to the top of its system prompt, followed by 9,000 tokens of static policy content, then the user's message. Prompt caching is enabled but the cache hit rate is near zero. What is the most likely cause?","type":"multiple-choice","options":[{"text":"Dynamic values at the start of the prompt change the prefix on every request, so no cached prefix can match.","explanation":"Caching matches on the prompt prefix. A timestamp and request ID at position zero make every prefix unique. Moving dynamic values after the static block restores cacheability.","correct":true},{"text":"The policy content exceeds the maximum length that is eligible for caching.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Prompt caching applies only to user messages, not to the system prompt.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"The cache is being evicted because requests arrive more frequently than the cache's time-to-live window allows it to persist.","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Dynamic values at the start of the prompt change the prefix on every request, so no cached prefix can match.</strong></p><p>Caching matches on the prompt prefix. A timestamp and request ID at position zero make every prefix unique. Moving dynamic values after the static block restores cacheability.</p>","tip":"<p>Why not the others: B is not a real restriction at this size. C misstates how caching applies. D would not reduce the hit rate to zero.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 2.2.","answerStatus":"source"},{"query":"You are reviewing a peer's draft system prompt. One section says to answer only from the supplied source documents, and a later section says to fill any gaps confidently from general knowledge. Which response is most appropriate?","type":"multiple-choice","options":[{"text":"Keep both instructions and rely on the model to choose the right one per request, accepting some inconsistency.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Add a priority-ordering instruction telling the model to evaluate all available instructions and apply whichever is most contextually appropriate on each request.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Remove or reword the gap-filling instruction so the prompt consistently constrains the model to source-supported content.","explanation":"Contradictory instructions produce inconsistent behaviour by design. The fix is to remove the contradiction, keeping the grounding rule that reflects the system's purpose.","correct":true},{"text":"Raise the temperature so output variation masks the contradiction.","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Remove or reword the gap-filling instruction so the prompt consistently constrains the model to source-supported content.</strong></p><p>Contradictory instructions produce inconsistent behaviour by design. The fix is to remove the contradiction, keeping the grounding rule that reflects the system&#x27;s purpose.</p>","tip":"<p>Why not the others: A and B leave the contradiction in place and delegate the decision to the model on every call. D makes behaviour less predictable, not more.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 2.3.","answerStatus":"source"},{"query":"A document-analysis service at Okonkwo & Reyes processes engineering change orders averaging 60,000 tokens each. Each order is queried by three reviewers roughly ten times each, in bursts over the same afternoon and typically minutes apart. The current design sends the full order on every query. The CFO wants per-query cost reduced without losing response quality, and the security lead requires that order contents never be stored outside the firm's tenancy. Which optimisation should you recommend?","type":"multiple-choice","options":[{"text":"Index the orders in a vector store and retrieve only the passages relevant to each query.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Cache the order as the prompt prefix so it is reused across the reviewers' queries.","explanation":"A large, stable document queried many times in a short window is the textbook prompt-caching case: full fidelity is preserved, the repeated prefix is billed at the cached rate (the one-hour cache option covers the gaps between bursts), and no new copy of the order is persisted outside the tenancy.","correct":true},{"text":"Summarise each order once at intake and run all subsequent queries against the summary.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Move the workload to a smaller model to reduce the per-token price paid.","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Cache the order as the prompt prefix so it is reused across the reviewers&#x27; queries.</strong></p><p>A large, stable document queried many times in a short window is the textbook prompt-caching case: full fidelity is preserved, the repeated prefix is billed at the cached rate (the one-hour cache option covers the gaps between bursts), and no new copy of the order is persisted outside the tenancy.</p>","tip":"<p>Why not the others: A introduces a new store and risks missing cross-references in a document that needs to be read whole. C loses detail reviewers will ask about. D trades quality for price without addressing the repeated 60,000-token cost.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 2.4.","answerStatus":"source"},{"query":"You are selecting a model for a new production workload and must complete the upstream steps before testing candidate models empirically. Which two steps must be completed BEFORE running a representative sample through a candidate model? (Choose two.)","type":"multiple-choice","options":[{"text":"Sign off the production rollout plan with the platform and security teams.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Select the lightest model that consistently clears the quality bar across the sample.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Choose a candidate model from the requirements profile and the model family's known capabilities.","explanation":"You cannot judge a sample run without a defined bar to judge it against, and you cannot run it without a candidate chosen on the requirements profile. Both precede the empirical test.","correct":true},{"text":"Re-test the choice when a new model version becomes available.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Define the quality bar, latency tolerance and expected volume for the workload.","explanation":"You cannot judge a sample run without a defined bar to judge it against, and you cannot run it without a candidate chosen on the requirements profile. Both precede the empirical test.","correct":true}],"answer":"<p>Correct answers: <strong>Choose a candidate model from the requirements profile and the model family&#x27;s known capabilities.; Define the quality bar, latency tolerance and expected volume for the workload.</strong></p><p>You cannot judge a sample run without a defined bar to judge it against, and you cannot run it without a candidate chosen on the requirements profile. Both precede the empirical test.</p>","tip":"<p>Why not the others: A and D are downstream of the decision. B is the outcome of the sample run, not a prerequisite for it.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 2.5.","answerStatus":"source"},{"query":"You are evaluating prompting claims in a peer's design document. For each claim, select Yes if the claim reflects sound practice. Otherwise, select No. Statement: Zero-shot prompting is an appropriate starting point for closed-set classification when the categories and their descriptions are supplied in the prompt.","type":"multiple-choice","options":[{"text":"Yes","explanation":"Zero-shot with clear category descriptions and few-shot with exact field names are both standard, evidence-based techniques. Chain-of-thought adds cost and latency with no benefit on simple tasks; mid-context placement is where attention is weakest; and behaviour across model versions must be re-validated, never assumed.","correct":true},{"text":"No","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Yes</strong></p><p>Zero-shot with clear category descriptions and few-shot with exact field names are both standard, evidence-based techniques. Chain-of-thought adds cost and latency with no benefit on simple tasks; mid-context placement is where attention is weakest; and behaviour across model versions must be re-validated, never assumed.</p>","tip":"","reference":"Matthew Purcell, CCAR-P Practic ntext is assembled (ordering, history compaction). Output handling deals with what comes back (validation, streaming, persistence).","correct":true}],"answer":"<p>Correct answer: <strong>Output Handling</strong></p><p>Input preparation shapes what goes in (trimming, redaction). Prompt construction decides how context is assembled (ordering, history compaction). Output handling deals with what comes back (validation, streaming, persistence).</p>","tip":"","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 2.8, row 1.","answerStatus":"source"},{"query":"You are classifying token-management tactics by where in the request lifecycle each applies. For each tactic, select the stage of the request lifecycle where it applies. Choose from: Input Preparation, Prompt Construction, Output Handling. Item: trim retrieved passages to the spans relevant to the user's question","type":"multiple-choice","options":[{"text":"Input Preparation","explanation":"Input preparation shapes what goes in (trimming, redaction). Prompt construction decides how context is assembled (ordering, history compaction). Output handling deals with what comes back (validation, streaming, persistence).","correct":true},{"text":"Prompt Construction","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Output Handling","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Input Preparation</strong></p><p>Input preparation shapes what goes in (trimming, redaction). Prompt construction decides how context is assembled (ordering, history compaction). Output handling deals with what comes back (validation, streaming, persistence).</p>","tip":"","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 2.8, row 2.","answerStatus":"source"},{"query":"You are classifying token-management tactics by where in the request lifecycle each applies. For each tactic, select the stage of the request lifecycle where it applies. Choose from: Input Preparation, Prompt Construction, Output Handling. Item: compact prior conversation turns into a summary once the full history is no longer needed","type":"multiple-choice","options":[{"text":"Input Preparation","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Prompt Construction","explanation":"Input preparation shapes what goes in (trimming, redaction). Prompt construction decides how context is assembled (ordering, history compaction). Output handling deals with what comes back (validation, streaming, persistence).","correct":true},{"text":"Output Handling","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Prompt Construction</strong></p><p>Input preparation shapes what goes in (trimming, redaction). Prompt construction decides how context is assembled (ordering, history compaction). Output handling deals with what comes back (validation, streaming, persistence).</p>","tip":"","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 2.8, row 3.","answerStatus":"source"},{"query":"You are classifying token-management tactics by where in the request lifecycle each applies. For each tactic, select the stage of the request lifecycle where it applies. Choose from: Input Preparation, Prompt Construction, Output Handling. Item: stream partial tokens to the interface so users see progress before completion","type":"multiple-choice","options":[{"text":"Input Preparation","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Prompt Construction","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Output Handling","explanation":"Input preparation shapes what goes in (trimming, redaction). Prompt construction decides how context is assembled (ordering, history compaction). Output handling deals with what comes back (validation, streaming, persistence).","correct":true}],"answer":"<p>Correct answer: <strong>Output Handling</strong></p><p>Input preparation shapes what goes in (trimming, redaction). Prompt construction decides how context is assembled (ordering, history compaction). Output handling deals with what comes back (validation, streaming, persistence).</p>","tip":"","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 2.8, row 4.","answerStatus":"source"},{"query":"You are classifying token-management tactics by where in the request lifecycle each applies. For each tactic, select the stage of the request lifecycle where it applies. Choose from: Input Preparation, Prompt Construction, Output Handling. Item: order prompt sections so cacheable content sits before per-request content","type":"multiple-choice","options":[{"text":"Input Preparation","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Prompt Construction","explanation":"Input preparation shapes what goes in (trimming, redaction). Prompt construction decides how context is assembled (ordering, history compaction). Output handling deals with what comes back (validation, streaming, persistence).","correct":true},{"text":"Output Handling","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Prompt Construction</strong></p><p>Input preparation shapes what goes in (trimming, redaction). Prompt construction decides how context is assembled (ordering, history compaction). Output handling deals with what comes back (validation, streaming, persistence).</p>","tip":"","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 2.8, row 5.","answerStatus":"source"},{"query":"You are classifying token-management tactics by where in the request lifecycle each applies. For each tactic, select the stage of the request lifecycle where it applies. Choose from: Input Preparation, Prompt Construction, Output Handling. Item: redact personal identifiers from the source text before invocation","type":"multiple-choice","options":[{"text":"Input Preparation","explanation":"Input preparation shapes what goes in (trimming, redaction). Prompt construction decides how context is assembled (ordering, history compaction). Output handling deals with what comes back (validation, streaming, persistence).","correct":true},{"text":"Prompt Construction","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Output Handling","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Input Preparation</strong></p><p>Input preparation shapes what goes in (trimming, redaction). Prompt construction decides how context is assembled (ordering, history compaction). Output handling deals with what comes back (validation, streaming, persistence).</p>","tip":"","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 2.8, row 6.","answerStatus":"source"},{"query":"You are selecting an integration mechanism for a single low-latency, stateless stock-availability lookup from a Claude-based assistant to an internal inventory service that already exposes a stable HTTP API. Which mechanism is the most appropriate?","type":"multiple-choice","options":[{"text":"a long-lived stateful session protocol wrapped around the single-call interaction","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"an agent-to-agent handoff that places another Claude-based agent in front of the inventory service","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"a bespoke streaming protocol layered over the organisation's asynchronous message bus","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"a direct API call to the existing endpoint using appropriately scoped credentials","explanation":"A stateless, latency-sensitive call to an existing stable API needs nothing between the tool and the endpoint. Direct integration is the simplest, fastest and most debuggable choice.","correct":true}],"answer":"<p>Correct answer: <strong>a direct API call to the existing endpoint using appropriately scoped credentials</strong></p><p>A stateless, latency-sensitive call to an existing stable API needs nothing between the tool and the endpoint. Direct integration is the simplest, fastest and most debuggable choice.</p>","tip":"<p>Why not the others: A and C add session or transport machinery the interaction does not need. B introduces a second model call and a second failure surface for a lookup.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 3.1.","answerStatus":"source"},{"query":"A Claude-based assistant queries an HR system on behalf of employees. It authenticates with a single service account that has organisation-wide read access, and the system prompt instructs the model to return only the requesting employee's own data. A security review flags the design. What is the core problem?","type":"multiple-choice","options":[{"text":"The prompt, not the access-control layer, is enforcing authorisation, so any prompt failure or injection can expose other employees' data.","explanation":"Instructions are not a security boundary. Access control must be enforced by the system layer, through per-user scoped credentials or pass-through authorisation, so the model cannot return what it cannot retrieve.","correct":true},{"text":"Service accounts are prohibited for AI workloads under most compliance frameworks.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"The service account should also have write access so that the audit trail is complete.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"The model should authenticate to the HR system directly with each employee's own password so that every query carries that employee's identity.","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>The prompt, not the access-control layer, is enforcing authorisation, so any prompt failure or injection can expose other employees&#x27; data.</strong></p><p>Instructions are not a security boundary. Access control must be enforced by the system layer, through per-user scoped credentials or pass-through authorisation, so the model cannot return what it cannot retrieve.</p>","tip":"<p>Why not the others: B is not a real rule. C widens the blast radius. D is a credential-handling anti-pattern.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 3.2.","answerStatus":"source"},{"query":"Adding a re-ranking stage to a support assistant's retrieval pipeline lifts answer accuracy from 86 percent to 93 percent on the evaluation set but adds 500 milliseconds of latency. The contractual SLA is a 3-second response, and current p95 latency is 1.6 seconds. How should you reason about the trade-off?","type":"multiple-choice","options":[{"text":"Reject re-ranking, since latency increases should never be accepted in a customer-facing system.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Defer the decision until the SLA is renegotiated to allow for slower responses.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Adopt re-ranking: the accuracy gain is material and the added latency still leaves clear headroom within the SLA.","explanation":"Quantify both sides against the SLA. A 7-point accuracy gain for 500 milliseconds lands at roughly 2.1 seconds p95 against a 3-second SLA, which is a clear adopt-and-monitor decision.","correct":true},{"text":"Adopt re-ranking only for the subset of queries where the SLA does not apply.","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Adopt re-ranking: the accuracy gain is material and the added latency still leaves clear headroom within the SLA.</strong></p><p>Quantify both sides against the SLA. A 7-point accuracy gain for 500 milliseconds lands at roughly 2.1 seconds p95 against a 3-second SLA, which is a clear adopt-and-monitor decision.</p>","tip":"<p>Why not the others: A is dogma, not analysis. B defers a decision the data already supports. D fragments behaviour arbitrarily.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 3.3.","answerStatus":"source"},{"query":"A platform runs tens of thousands of agent sessions a day. Engineers currently log every full prompt, response and tool payload, which is expensive and still leaves failures hard to locate. Which observability strategy is more appropriate at this scale?","type":"multiple-choice","options":[{"text":"Disable payload logging in production and reproduce any reported failure in a staging environment that mirrors production configuration.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Structured traces with correlation IDs and key metrics on every session, with full payloads captured by sampling and on error.","explanation":"At scale, observability means lightweight structured traces on everything, with expensive full-payload capture applied selectively so failures remain findable without logging everything.","correct":true},{"text":"Log only the final response of each session and discard the intermediate steps.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Rely on user complaints as the primary mechanism for detecting failures.","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Structured traces with correlation IDs and key metrics on every session, with full payloads captured by sampling and on error.</strong></p><p>At scale, observability means lightweight structured traces on everything, with expensive full-payload capture applied selectively so failures remain findable without logging everything.</p>","tip":"<p>Why not the others: A loses the production context that caused the failure. C discards the intermediate steps where agents fail. D is lagging and reputationally costly.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 3.4.","answerStatus":"source"},{"query":"You are designing a Claude-based assistant with access to 48 internal tools across several business domains. Loading every tool definition on every request increases token usage and time to first response. Which design best addresses the problem without sacrificing capability breadth?","type":"multiple-choice","options":[{"text":"Apply progressive tool discovery so a curated initial subset is exposed and further tools are loaded on demand based on the task.","explanation":"Progressive discovery keeps the per-request tool surface small while leaving the full catalogue reachable, which is the only option that reduces tokens and latency without reducing capability.","correct":true},{"text":"Hard-code a fixed set of five tools per request to reduce token usage, regardless of whether they are relevant to the task.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Use a separate model call to summarise all 48 tool definitions before each user turn.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Increase the maximum context length and load all 48 definitions on every request, accepting the higher cost and latency.","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Apply progressive tool discovery so a curated initial subset is exposed and further tools are loaded on demand based on the task.</strong></p><p>Progressive discovery keeps the per-request tool surface small while leaving the full catalogue reachable, which is the only option that reduces tokens and latency without reducing capability.</p>","tip":"<p>Why not the others: B sacrifices breadth. C adds a model call and still produces a large context. D accepts the problem rather than solving it.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 3.5.","answerStatus":"source"},{"query":"You are compiling the factors that should drive the choice between Model Context Protocol (MCP), direct API integration and agent-to-agent handoff. Which two factors belong on the list? (Choose two.) Each correct answer presents a complete solution.","type":"multiple-choice","options":[{"text":"whether the interaction is stateless and latency-sensitive, or stateful and longer-running","explanation":"The shape of the interaction (stateless call versus stateful, longer-running collaboration) and the need for reuse across many clients are the properties that separate direct calls, MCP servers and agent-to-agent handoffs.","correct":true},{"text":"whether the vendor publishes detailed reference documentation for each candidate protocol","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"whether the team has prior implementation experience with any of the candidate protocols","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"whether the underlying transport supports encryption in transit between the integrated services","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"whether the integration must be portable across multiple AI clients and applications","explanation":"The shape of the interaction (stateless call versus stateful, longer-running collaboration) and the need for reuse across many clients are the properties that separate direct calls, MCP servers and agent-to-agent handoffs.","correct":true}],"answer":"<p>Correct answers: <strong>whether the interaction is stateless and latency-sensitive, or stateful and longer-running; whether the integration must be portable across multiple AI clients and applications</strong></p><p>The shape of the interaction (stateless call versus stateful, longer-running collaboration) and the need for reuse across many clients are the properties that separate direct calls, MCP servers and agent-to-agent handoffs.</p>","tip":"<p>Why not the others: B and C are delivery-team conveniences, not architectural drivers. D is a requirement every option must satisfy, so it does not discriminate between them.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 3.6.","answerStatus":"source"},{"query":"After a nightly documentation refresh, a RAG assistant intermittently answers from superseded content. Which two measures most directly address this? (Choose two.)","type":"multiple-choice","options":[{"text":"A larger context window so more documents, including both current and prior versions, can be retrieved per query.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"An automated re-indexing pipeline that validates completeness and embedding consistency after every content refresh.","explanation":"A validated re-index stops stale embeddings entering the index, and version-aware retrieval stops superseded chunks being served even if they linger.","correct":true},{"text":"Document-version metadata in the index, with retrieval filtering out superseded versions.","explanation":"A validated re-index stops stale embeddings entering the index, and version-aware retrieval stops superseded chunks being served even if they linger.","correct":true},{"text":"A weekly manual spot-check of ten randomly selected answers.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"A lower temperature so the model relies less on the retrieved content.","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answers: <strong>An automated re-indexing pipeline that validates completeness and embedding consistency after every content refresh.; Document-version metadata in the index, with retrieval filtering out superseded versions.</strong></p><p>A validated re-index stops stale embeddings entering the index, and version-aware retrieval stops superseded chunks being served even if they linger.</p>","tip":"<p>Why not the others: A retrieves more of the same stale content. D is too slow and sparse to catch nightly issues. E does not change what is retrieved.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 3.7.","answerStatus":"source"},{"query":"An agent frequently invokes the wrong tool when several tools have related purposes. Which two changes most directly reduce tool-selection errors? (Choose two.)","type":"multiple-choice","options":[{"text":"Add more granular tools so every edge case has its own dedicated tool.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Instruct the model to prefer the first tool in the list whenever it is uncertain.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Route all tool calls through a single generic execute tool that accepts free-text commands.","explanation":"Not selected in the supplied answer key.","correct":false},{"text":"Rewrite tool descriptions so each tool's purpose, inputs and boundaries are explicit and non-overlapping.","explanation":"Selection errors between related tools come from overlap and ambiguity. Make each boundary explicit and eliminate the overlaps.","correct":true},{"text":"Consolidate or remove tools whose functionality overlaps.","explanation":"Selection errors between related tools come from overlap and ambiguity. Make each boundary explicit and eliminate the overlaps.","correct":true}],"answer":"<p>Correct answers: <strong>Rewrite tool descriptions so each tool&#x27;s purpose, inputs and boundaries are explicit and non-overlapping.; Consolidate or remove tools whose functionality overlaps.</strong></p><p>Selection errors between related tools come from overlap and ambiguity. Make each boundary explicit and eliminate the overlaps.</p>","tip":"<p>Why not the others: A increases the confusion surface. B institutionalises wrong choices. C discards typed interfaces and makes errors harder to catch.</p>","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 3.8.","answerStatus":"source"},{"query":"You are evaluating retrieval-strategy claims used by a peer team. For each claim, select Yes if the statement is generally accurate. Otherwise, select No. Statement: Dense vector retrieval is well suited to recovering paraphrased intent against unstructured text.","type":"multiple-choice","options":[{"text":"Yes","explanation":"Dense retrieval captures meaning, sparse retrieval captures exact tokens, and structured queries serve filter-and-aggregate questions; hybrid retrieval combines dense and sparse precisely because they differ. More chunks past the point of relevance add noise and cost, not quality.","correct":true},{"text":"No","explanation":"Not selected in the supplied answer key.","correct":false}],"answer":"<p>Correct answer: <strong>Yes</strong></p><p>Dense retrieval captures meaning, sparse retrieval captures exact tokens, and structured queries serve filter-and-aggregate questions; hybrid retrieval combines dense and sparse precisely because they differ. More chunks past the point of relevance add noise and cost, not quality.</p>","tip":"","reference":"Matthew Purcell, CCAR-P Practice Questions v2 (CC BY-NC 4.0), source question 3.9, row 1.","answerStatus":"source"},{"query":"You are evaluating retrieval-strategy claims used by a peer team. For each claim, select Yes if the statement is generally accurate. Otherwise, sel
