m the response headers, keeps a queue, and releases requests in \u003cstrong\u003eorder of priority\u003c/strong\u003e, here by the severity of the incident. A \u003cstrong\u003econcurrency limit\u003c/strong\u003e keeps the total request and token rate below the limits, so that 429 errors become rare and are not the normal means of control. When capacity is short, low-priority work is \u003cstrong\u003edelayed or shed\u003c/strong\u003e: minor investigations are paused and resumed later. This is the backpressure principle applied with priorities.\u003c/p\u003e\n\u003cp\u003eThe same design can reserve capacity through workspace-level limits, for example a separate workspace for work on critical incidents. Separate keys do not create separate limits, and longer waits slow everything equally. See \u003ca href=\"https://platform.claude.com/docs/en/api/rate-limits\"\u003eRate limits\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/api/errors\"\u003eClaude API errors\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 62","answerStatus":"source"},{"query":"An AI gateway buffers streamed replies until completion and prepends a changing audit timestamp to each system prompt; streaming stops and prompt-cache hits collapse. What two implementation changes correct this?","type":"multiple-choice","options":[{"text":"Keep the gateway as it is, and ask teams to turn off streaming and prompt caching in their applications.","explanation":"This would make every application slower and more expensive in order to suit the gateway. A gateway should preserve the behavior that applications depend on.","correct":false},{"text":"Keep audit metadata out of the prompt, and pass streamed responses through as they arrive.","explanation":"The line that the gateway adds changes the start of every prompt on every request, so no cached prefix can match. Audit information belongs in request metadata and in the gateway's logs, where it does not alter the prompt. The gateway also has to forward streaming events as it receives them, or users lose the fast first response.","correct":true},{"text":"Move the team name and time to the end of the system prompt, and keep collecting each response before forwarding it.","explanation":"A changing time at the end of the system prompt still changes the prefix ahead of the messages, so conversation history could not be read from the cache. Streaming would still be broken.","correct":false},{"text":"Abandon the gateway project, because a gateway will always break streaming and caching.","explanation":"A gateway that is designed correctly preserves both. The problems come from two specific choices in the implementation, and both can be corrected.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eKeep audit metadata out of the prompt, and pass streamed responses through as they arrive.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA gateway is useful because it is a single point of control for authentication, quotas, routing, and audit. It must also be \u003cstrong\u003etransparent to the features that applications rely on\u003c/strong\u003e. Two of those features are damaged easily.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003ePrompt caching\u003c/strong\u003e needs the prompt prefix to be exactly the same between requests. A gateway that changes the body of the request, by adding text to the system prompt, writing JSON keys in a different order, or changing tool definitions, breaks the match for every request. Metadata for audit belongs outside the prompt: in HTTP headers, in the gateway's own structured logs, or in fields that are not part of the cached prefix. \u003cstrong\u003eStreaming\u003c/strong\u003e needs the gateway to forward server-sent events as they arrive. A gateway that collects the complete response turns a fast first token into a wait for the whole response, which changes the user's experience and can cause timeouts in clients on long responses.\u003c/p\u003e\n\u003cp\u003eThe general requirement for a gateway and routing architecture is fidelity. Request bodies, headers such as beta feature flags, and streamed responses pass through unchanged, and the gateway adds its controls around them. Claude Code's documentation on gateways states similar requirements for the endpoints and headers that must be forwarded. See \u003ca href=\"https://code.claude.com/docs/en/llm-gateway\"\u003eOther LLM gateways\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\"\u003ePrompt caching\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/streaming\"\u003eStreaming messages\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 63","answerStatus":"source"},{"query":"A company has four months to migrate from a retiring Claude model but cannot identify applications using it across aliases, fixed IDs, and cloud providers. How should its gateway support migration?","type":"multiple-choice","options":[{"text":"Use the gateway's usage data to find every caller of the model, and migrate each with evaluation.","explanation":"The gateway sees every request and the model that it names, so it can produce a complete list of applications and teams that use the deprecated model on each platform. Each one is tested on the replacement model with its own evaluation suite. The gateway's data then shows when no traffic to the old model remains.","correct":true},{"text":"Send an email to all 900 staff asking anyone who uses the model to reply, and wait for the answers.","explanation":"An email depends on people knowing which model their application uses and remembering to reply. Applications that nobody maintains actively would be missed, as happened a year ago.","correct":false},{"text":"Wait until the retirement date, and repair the applications that fail on that day.","explanation":"This repeats the failure of a year ago for every affected application at once. A deprecation notice exists so that the migration can happen before the retirement.","correct":false},{"text":"Configure the gateway to rewrite the old model name to the new one for all teams on the retirement date.","explanation":"Silent rewriting moves every application to a model on which it has not been tested, on one day. Differences in behavior would appear in production with no warning to the owners.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eUse the gateway\u0026#x27;s usage data to find every caller of the model, and migrate each with evaluation.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eModels have a published \u003cstrong\u003elifecycle\u003c/strong\u003e. A model is active, then deprecated with a recommended replacement and a retirement date, and then retired, after which requests to it fail. Anthropic publishes the dates and provides a way to audit usage. An organization's task is to turn each deprecation notice into a managed migration.\u003c/p\u003e\n\u003cp\u003eThe first requirement is an \u003cstrong\u003einventory\u003c/strong\u003e: which applications, on which platform, call the model. This is one of the main benefits of central telemetry. A gateway, or request logs with the model as an attribute, answers the question with data and not with a survey. Identifiers differ between the first-party API and the cloud platforms, so the inventory has to map each platform's identifier to the same underlying model. Each caller then follows the usual \u003cstrong\u003emigration process\u003c/strong\u003e. It has an owner. It runs its evaluation suite on the replacement model. It adjusts prompts and parameters where the migration guide indicates a change. It rolls out in stages while the old model is still available as a path for rollback.\u003c/p\u003e\n\u003cp\u003ePolicy on \u003cstrong\u003epinning\u003c/strong\u003e also matters. A fixed model ID gives stable behavior and requires a planned migration. A moving alias changes behavior without any action by the team. See \u003ca href=\"https://platform.claude.com/docs/en/about-claude/model-deprecations\"\u003eModel deprecations\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/overview\"\u003eModels overview\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 64","answerStatus":"source"},{"query":"A shared gateway hard-stops each team's monthly budget; an experimental run consumes the allowance and disables production traffic. How should it enforce budgets without shutting down customer-facing services?","type":"multiple-choice","options":[{"text":"Remove all budget enforcement, and send finance a report of each team's spending at the end of the month.","explanation":"A report at the end of the month informs finance only after the money has been spent. Finance asked for budgets to be respected, which needs action during the month.","correct":false},{"text":"Keep the hard stop, and tell teams that an outage is the consequence of poor planning.","explanation":"A hard stop that takes a customer-facing service offline because of an internal experiment causes harm far greater than the overspending. Enforcement should distinguish between kinds of traffic.","correct":false},{"text":"Staged alerts, separate budgets for production and experiments, and throttling of experiments first.","explanation":"Budget enforcement should give warning early and should fail in the least harmful way. Alerts at set shares of the budget give teams time to react. Separate budgets, or workspaces, for production and for experiments prevent one from using the other's allowance. When a limit is close, experimental traffic is slowed or stopped first, and the production service continues.","correct":true},{"text":"Give every team a budget that is ten times larger, so that no team reaches its limit.","explanation":"A budget that can never be reached controls nothing. The experiment that ran out of control would have spent much more before anyone noticed.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eStaged alerts, separate budgets for production and experiments, and throttling of experiments first.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eBudget enforcement for each team\u003c/strong\u003e is a necessary cost control, but the manner of enforcement decides whether it protects the organization or harms it. A hard stop treats a research experiment and a customer-facing service in the same way, and the incident on the 24th is the result.\u003c/p\u003e\n\u003cp\u003eA better design has three parts. \u003cstrong\u003eEarly warning\u003c/strong\u003e: alerts at, for example, 50%, 75%, and 90% of the budget, sent to the team and to finance, with a forecast of the date on which the budget will be reached at the present rate. \u003cstrong\u003eSeparation by importance\u003c/strong\u003e: production and experimental traffic have separate budgets, which can be implemented as separate workspaces with their own spend limits or as separate quotas in the gateway. An experiment then cannot use the allowance of a production service. \u003cstrong\u003eGraduated response\u003c/strong\u003e: as a limit approaches, the gateway slows or blocks the lowest-priority traffic first, and a hard stop is kept for traffic that is not critical. Overspending in production raises an urgent alert and a decision by people, not an outage.\u003c/p\u003e\n\u003cp\u003eThe Claude API supports spend limits and rate limits at the level of the workspace, and an organization-level limit can serve as a final backstop. A gateway adds finer control for each team. See \u003ca href=\"https://platform.claude.com/docs/en/api/rate-limits\"\u003eRate limits\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/costs\"\u003eManage costs effectively\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\"\u003eOptimizing for cost and intelligence\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Cost and Latency Optimization at Scale — source question 65","answerStatus":"source"},{"query":"An enterprise AI gateway needs cost allocation, security auditability, and latency diagnosis but serves sensitive research and participant data. What information should it log by default?","type":"multiple-choice","options":[{"text":"The full text of every prompt and response, encrypted, for every team, for one year.","explanation":"Storing all content creates a large store of sensitive research and personal data, which is a risk of its own, and most of the stated purposes do not need content.","correct":false},{"text":"Only the total number of requests for each team for each day.","explanation":"A daily count cannot support cost allocation by token type, the diagnosis of latency, or an audit of which application called which model.","correct":false},{"text":"Structured metadata for each request, such as team, model, tokens, and latency.","explanation":"Cost allocation needs token counts by type with the team and the model. Audit needs who called what and when. Reliability needs latency, stop reasons, and classes of error. All of these are metadata. Recording them for every request serves the three purposes and stores no research or personal data.","correct":true},{"text":"Whatever each team decides to send, with no common format.","explanation":"Without a common format, data from different teams cannot be combined for finance or for security, which is the reason for building a central gateway.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eStructured metadata for each request, such as team, model, tokens, and latency.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA central gateway is the natural place for \u003cstrong\u003econsistent telemetry\u003c/strong\u003e, and the default should be \u003cstrong\u003emetadata without content\u003c/strong\u003e. For each request, the gateway can record who called (team, application, and user or service identity), what was called (platform, model, and features used), what it cost (input, cache write, cache read, and output tokens), how it performed (time to first token and total latency), and how it ended (stop reason, including refusals, or the class of error, such as a rate limit or an overload).\u003c/p\u003e\n\u003cp\u003eThis one structured event serves all three audiences. \u003cstrong\u003eFinance\u003c/strong\u003e sums cost by team and model. \u003cstrong\u003eSecurity\u003c/strong\u003e audits access and detects unusual usage. \u003cstrong\u003eReliability engineering\u003c/strong\u003e builds SLIs, alerts, and analysis by cohort across platforms. None of these purposes needs the text of prompts or responses. Content is the sensitive part, and it should be captured only where a team has a defined need, with access controls, a limited retention period, and redaction. Claude's own tooling applies the same rule: its OpenTelemetry export redacts content unless an administrator enables it explicitly.\u003c/p\u003e\n\u003cp\u003eContent stored for a year and formats that differ for each team both fail the stated aims. See \u003ca href=\"https://code.claude.com/docs/en/monitoring-usage\"\u003eMonitoring\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/gateways\"\u003eRun Claude Code through a gateway\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/api-and-data-retention\"\u003eAPI and data retention\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 66","answerStatus":"source"},{"query":"A weekly coding agent opens hundreds of unexplained dependency-update pull requests, hiding a critical payment-library vulnerability among minor fixes. How should unattended maintenance report and prioritize results?","type":"multiple-choice","options":[{"text":"Have the agent group and explain its changes, rank them by severity, and escalate critical ones.","explanation":"An unattended agent has to report in a form that people can act on. One explained pull request for each repository, in place of many small ones, reduces noise. A summary ranked by severity tells each owner what matters. A critical vulnerability goes immediately to a named person or to the on-call channel, so that it does not wait in a queue.","correct":true},{"text":"Have the agent merge all of its own pull requests automatically, so that owners do not have to act.","explanation":"Automatic merging of dependency updates with no review can break applications, and it removes human oversight from changes to every repository. The need is for better reporting, not for less oversight.","correct":false},{"text":"Run the agent every day and not every week, so that updates are smaller.","explanation":"A daily run would open even more pull requests with the same lack of explanation and priority. The critical item would still be hidden.","correct":false},{"text":"Stop the scheduled agent, and ask each repository owner to check dependencies by hand.","explanation":"Manual checks in 200 repositories will be done inconsistently, which is why the agent was created. The schedule is useful, and its reporting needs to change.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eHave the agent group and explain its changes, rank them by severity, and escalate critical ones.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA scheduled agent that works across many repositories is a strong form of \u003cstrong\u003eunattended operation\u003c/strong\u003e, and its value depends on what happens to its output. Work that nobody reads has no value, and a critical finding that is hidden among routine items is a risk. The design of \u003cstrong\u003enotification and escalation\u003c/strong\u003e is as important as the design of the task.\u003c/p\u003e\n\u003cp\u003eThree principles apply. \u003cstrong\u003eReduce noise\u003c/strong\u003e: related changes are grouped, each pull request explains what it changes and why, and minor updates are combined. \u003cstrong\u003eRank and summarize\u003c/strong\u003e: each run produces a short summary for each owner, ordered by severity, with what was found, what was prepared, and what needs a decision. \u003cstrong\u003eEscalate by severity\u003c/strong\u003e: critical findings do not wait for someone to read a summary. They go at once to a named owner or to the on-call channel, with the evidence, and they are followed until someone acknowledges them. Routine items follow the normal review process, and merging remains a human decision.\u003c/p\u003e\n\u003cp\u003eClaude Code supports scheduled and event-driven runs of this kind, in the cloud or in CI, and the prompt of the task defines what the agent reports and where. Permissions should limit the agent to opening pull requests and posting summaries. See \u003ca href=\"https://code.claude.com/docs/en/routines\"\u003eAutomate work with scheduled tasks\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/github-actions\"\u003eClaude Code GitHub Actions\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/best-practices\"\u003eBest practices for Claude Code\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Agent Fleet Operations for Software Delivery — source question 67","answerStatus":"source"},{"query":"A tax-preparation agent's custom Messages API loop runs on an office PC, loses state on restart, and may wait days for documents. It needs a sandbox but not access to the PC's files. What hosting approach supports durable sessions?","type":"multiple-choice","options":[{"text":"Write a custom system for persistence, checkpointing, and resumption around the existing loop.","explanation":"This would work in principle, but it is a large amount of infrastructure for one developer to build and maintain, and it repeats what a managed harness already provides.","correct":false},{"text":"Keep the script, and ask staff not to restart the office computer while a return is in progress.","explanation":"A return can wait for days for a client, and restarts and power failures cannot be prevented by a rule. The state would still be lost.","correct":false},{"text":"Move the agent to a managed harness with sessions that persist on the server.","explanation":"A managed harness provides the agent loop, a sandbox, and stateful sessions as a service. A session keeps its history and files on the server, goes idle while it waits for a client, and continues when the document arrives. The developer writes the instructions and tools, and does not build infrastructure for durability.","correct":true},{"text":"Buy a more reliable computer with a backup power supply for the script.","explanation":"Better hardware reduces some interruptions but not software restarts or updates, and it does not help with waits of several days. The design would still keep its state in one process.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eMove the agent to a managed harness with sessions that persist on the server.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eSelecting a \u003cstrong\u003eharness\u003c/strong\u003e means matching the requirements to the amount of infrastructure that a team can own. A custom loop on the Messages API gives full control, and it leaves every operational concern with the developer: persistence of state, resumption, sandboxing, compaction, and retries. For one developer with little time, each of these is a risk.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eClaude Managed Agents\u003c/strong\u003e is designed for this profile of work: long-running and asynchronous tasks, in which Anthropic hosts the agent loop and the sandbox. An agent definition holds the model, the instructions, and the tools. Each tax return is a \u003cstrong\u003esession\u003c/strong\u003e, whose conversation history, sandbox state, and outputs are stored on the server. When the agent needs a document from the client, the session becomes idle and uses no model tokens. When the document is uploaded, the application sends an event and the session continues from the same point. Prompt caching and compaction are built in.\u003c/p\u003e\n\u003cp\u003eThe decision has a compliance side. Managed Agents sessions persist until they are deleted, and they are not eligible for zero data retention, so the firm should confirm that this is consistent with its duties to clients. If the agent needed files on the firm's own machines, the Claude Agent SDK with external session storage would be the alternative. See \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/overview\"\u003eClaude Managed Agents overview\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/sessions\"\u003eStart a session\u003c/a\u003e, and \u003ca href=\"https://www.anthropic.com/engineering/managed-agents\"\u003eScaling Managed Agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 68","answerStatus":"source"},{"query":"A tax agent reads 40 documents and sometimes forgets exact extracted amounts after compaction or rereads them. What simple durable record should preserve figures and sources during a return?","type":"multiple-choice","options":[{"text":"Read all 40 documents again at the start of each new stage of the return.","explanation":"Reading every document again at each stage multiplies the cost and the time, and it fills the context with document text, which causes more compaction.","correct":false},{"text":"Rely on the compaction summary, and ask for the summary to be as long as possible.","explanation":"A summary reduces detail by design, and a longer summary still gives no guarantee that every figure is kept exactly. Tax figures must not depend on a summary.","correct":false},{"text":"Move the agent to a model with a larger context window, so that compaction never happens.","explanation":"A larger window delays compaction, but a return with 40 documents and 300 tool calls can still fill it, and every turn then costs more. The figures would still exist only in the conversation.","correct":false},{"text":"Keep a worksheet file of extracted figures with their source documents.","explanation":"Exact values that are needed throughout a long task belong in a file outside the conversation. A worksheet that records each figure with the document from which it came is not affected by compaction. The agent writes to it as each document is processed and reads from it when it calculates, so every number can be traced to its source.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eKeep a worksheet file of extracted figures with their source documents.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eCompaction and context editing allow a long task to continue, and they work by \u003cstrong\u003ediscarding detail\u003c/strong\u003e. Anything that must remain exact for the whole task should therefore not exist only in the conversation. Anthropic's guidance on context engineering calls the remedy \u003cstrong\u003estructured note-taking\u003c/strong\u003e: the agent writes important information to persistent storage outside the context window and reads it again when it is needed.\u003c/p\u003e\n\u003cp\u003eFor a tax return, the natural form is a \u003cstrong\u003eworksheet file\u003c/strong\u003e. It has one entry for each figure, with the value, the type, the tax year, and the source document and page. The agent adds entries as it processes each document and reads the worksheet when it calculates. After compaction, the conversation may have lost the details of a document from two hours earlier, and the worksheet still holds every number exactly. The record of sources also makes the draft return \u003cstrong\u003eauditable\u003c/strong\u003e: an accountant can check each figure against its document.\u003c/p\u003e\n\u003cp\u003eThe file can be in the session's sandbox or can be managed through the memory tool. Reading documents again and using a larger context window treat the symptom at a higher cost. See \u003ca href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\"\u003eEffective context engineering for AI agents\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool\"\u003eMemory tool\u003c/a\u003e, and \u003ca href=\"https://www.anthropic.com/engineering/effective-harnesses-for-long-running-agents\"\u003eEffective harnesses for long-running agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 69","answerStatus":"source"},{"query":"A small tax practice wants to know each AI return's cost, why one took nine hours, and when a session has stalled. It has no telemetry and wants minimal implementation effort. What should it instrument first?","type":"multiple-choice","options":[{"text":"Build the full observability platform before any more returns are processed.","explanation":"Two months of infrastructure work is out of proportion to three specific questions for a small firm. Simpler means can answer them now, and more can be added if the need grows.","correct":false},{"text":"Read the complete transcript of each return after it has finished.","explanation":"Reading transcripts answers some questions about a single return at a high cost in time. It gives no cost figure and no warning about a return that has stopped.","correct":false},{"text":"Ask the agent to state at the end of each return how much it cost and how long it took.","explanation":"The agent does not have reliable knowledge of its own cost or of elapsed time. Its statement would be a guess, and a return that has stopped would produce no statement at all.","correct":false},{"text":"Use the platform's session timeline and usage data, and add one alert for stalls.","explanation":"The three questions correspond to three simple capabilities. Usage data for each session gives the cost of each return. The session timeline shows where the time went in a slow return. One alert on sessions that fail, or that are idle or active for longer than expected, detects a return that has stopped. A managed platform provides the first two, and the third is a small addition.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eUse the platform\u0026#x27;s session timeline and usage data, and add one alert for stalls.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eObservability should be \u003cstrong\u003ein proportion to the questions that it has to answer\u003c/strong\u003e. A small team does not need a large platform to operate one agent responsibly. It needs three basic capabilities, and a managed harness provides most of them directly.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eCost for each unit of work\u003c/strong\u003e: every session reports its token usage, and Claude Managed Agents shows cumulative cost for each session in the Console and through the API. Recording this figure with the client reference for each return answers the first question, and a session budget can limit the worst case. \u003cstrong\u003eA timeline for each run\u003c/strong\u003e: the session's event history lists each model turn and tool call with its timing. Reading it for the nine-hour return shows whether the time was spent waiting for a client, in a slow tool, or in a loop. \u003cstrong\u003eOne alert on progress\u003c/strong\u003e: a scheduled check, or a webhook on changes of session state, notifies the developer when a session ends with an error or stays in one state for longer than expected.\u003c/p\u003e\n\u003cp\u003eThis is instrumentation at the level that fits the need: structured data that already exists, one stored record for each return, and one alert. More can be added when the firm's questions go beyond it. See \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/session-observability\"\u003eInspect sessions and track usage\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/webhooks\"\u003eSubscribe to webhooks\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/budgets\"\u003eSession budgets\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 70","answerStatus":"source"}];

    const CURRENT_KEY = "devPro07RevisedCurrentV1";
    const HISTORY_KEY = "devPro07RevisedHistoryV1";
    const EXAM_NAME = "Claude Developer Professional 07";

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function isCorrect(question) {
      return question.options.every(option => Boolean(option.selected) === Boolean(option.correct));
    }

    function correctCount(question) {
      return question.options.filter(option => option.correct).length;
    }

    function formatDuration(ms) {
      if (!Number.isFinite(ms) || ms < 0) return "0:00";
      const total = Math.floor(ms / 1000);
      const minutes = Math.floor(total / 60);
      const seconds = total % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }

    class ExamQuestion extends HTMLElement {
      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { question, index, total, graded, cheating } = this._state;
        const reveal = graded || cheating;
        const choose = correctCount(question);

        this.innerHTML = `
          <section class="card" aria-labelledby="question-title">
            <div class="card-header">
              <span>Question ${index + 1} of ${total}</span>
              <span>${question.viewed ? "Viewed" : "New"}</span>
            </div>
            <div class="card-body">
              <p class="query" id="question-title"></p>
              <p class="choose-note">Choose ${choose}</p>
              <div class="options"></div>
              ${reveal ? `<div class="answer-panel"><strong>Answer</strong><div class="answer-html"></div></div>` : ""}
            </div>
          </section>
        `;

        this.querySelector(".query").textContent = question.query;
        const options = this.querySelector(".options");

        question.options.forEach((option, optionIndex) => {
          const label = document.createElement("label");
          label.className = "option";
          if (reveal && option.correct) label.classList.add("reveal-correct");
          if (reveal && option.selected && !option.correct) label.classList.add("reveal-wrong-selected");

          const input = document.createElement("input");
          input.type = choose === 1 ? "radio" : "checkbox";
          if (choose === 1) input.name = `exam-q-${index}`;
          input.checked = Boolean(option.selected);
          input.disabled = Boolean(graded);
          input.addEventListener("change", () => {
            this.dispatchEvent(new CustomEvent("option-toggle", {
              bubbles: true,
              detail: { optionIndex }
            }));
          });

          const textWrap = document.createElement("span");
          const text = document.createElement("span");
          text.textContent = option.text;
          textWrap.appendChild(text);

          if (reveal && option.explanation) {
            const explanation = document.createElement("small");
            explanation.textContent = option.explanation;
            textWrap.appendChild(explanation);
          }

          label.append(input, textWrap);
          options.appendChild(label);
        });

        const answer = this.querySelector(".answer-html");
        if (answer) answer.innerHTML = question.answer || "";
      }
    }
    customElements.define("exam-question", ExamQuestion);

    class QuestionJumper extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        if (!this._state) return;
        const { questions, current, graded, cheating } = this._state;
        const reveal = graded || cheating;

        this.innerHTML = `
          <section class="card">
            <div class="card-header collapsible-title" role="button" tabindex="0">
              <span>Question Jumper</span>
              <span class="chevron">${this.collapsed ? "▼" : "▲"}</span>
            </div>
            <div class="card-body jumper-body" ${this.collapsed ? 'hidden' : ''}>
              <div class="jumper-grid"></div>
            </div>
          </section>
        `;

        const title = this.querySelector(".collapsible-title");
        const toggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        title.addEventListener("click", toggle);
        title.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });

        const grid = this.querySelector(".jumper-grid");
        questions.forEach((question, index) => {
          const button = document.createElement("button");
          button.className = "jump-btn";
          button.textContent = String(index + 1);
          button.title = question.query;

          if (question.viewed) button.classList.add("viewed");
          if (index === current) button.classList.add("current");

          if (reveal) {
            button.classList.remove("viewed", "current");
            button.classList.add(isCorrect(question) ? "correct" : "incorrect");
            if (index === current) button.style.outline = "3px solid #111827";
          }

          button.addEventListener("click", () => {
            this.dispatchEvent(new CustomEvent("jump", {
              bubbles: true,
              detail: { index }
            }));
          });
          grid.appendChild(button);
        });
      }
    }
    customElements.define("question-jumper", QuestionJumper);

    class ExamHistoryPanel extends HTMLElement {
      constructor() {
        super();
        this.collapsed = false;
      }

      set state(value) {
        this._state = value;
        this.render();
      }

      render() {
        const history = this._state?.history || { exams: [] };
        const exams = Array.isArray(history.exams) ? history.exams : [];

        this.innerHTML = `
          <section class="card">
            <div class="card-header">
              <span class="collapsible-title" role="button" tabindex="0">Exam History</span>
              <div class="control-group">
                <button class="btn-secondary toggle-history">${this.collapsed ? "Show" : "Hide"}</button>
                <button class="btn-danger clear-history" ${exams.length ? "" : "disabled"}>Clear History</button>
              </div>
            </div>
            <div class="card-body history-body" ${this.collapsed ? "hidden" : ""}></div>
          </section>
        `;

        const doToggle = () => {
          this.collapsed = !this.collapsed;
          this.render();
        };
        this.querySelector(".toggle-history").addEventListener("click", doToggle);
        this.querySelector(".collapsible-title").addEventListener("click", doToggle);
        this.querySelector(".clear-history").addEventListener("click", () => {
          this.dispatchEvent(new CustomEvent("history-clear", { bubbles: true }));
        });

        const body = this.querySelector(".history-body");
        if (!exams.length) {
          body.innerHTML = `<p class="history-empty">No completed exams are stored on this device.</p>`;
          return;
        }

        [...exams].reverse().forEach((exam, reverseIndex) => {
          const questions = Array.isArray(exam.questions) ? exam.questions : [];
          const score = questions.filter(isCorrect).length;
          const number = exams.length - reverseIndex;
          const finish = Number(exam.finish || exam.completedAt || 0);
          const start = Number(exam.start || 0);
          const stamp = finish ? new Date(finish).toLocaleString() : "Completed exam";
          const duration = finish && start ? formatDuration(finish - start) : "";

          const wrap = document.createElement("div");
          wrap.className = "history-exam";

          const summary = document.createElement("div");
          summary.className = "history-summary";
          summary.innerHTML = `<strong>Attempt ${number}: ${score} / ${questions.length}</strong><span>${stamp}${duration ? ` · ${duration}` : ""}</span>`;
          wrap.appendChild(summary);

          const dots = document.createElement("div");
          dots.className = "history-dots";
          questions.forEach((question, i) => {
            const dot = document.createElement("span");
            dot.className = "history-dot" + (isCorrect(question) ? " correct" : "");
            dot.textContent = String(i + 1);
            dot.title = question.query;
            dots.appendChild(dot);
          });
          wrap.appendChild(dots);
          body.appendChild(wrap);
        });
      }
    }
    customElements.define("exam-history-panel", ExamHistoryPanel);

    class ScrumExamApp extends HTMLElement {
      constructor() {
        super();
        this.state = null;
        this.timerHandle = null;
      }

      connectedCallback() {
        this.load();
        this.addEventListener("option-toggle", e => this.toggleOption(e.detail.optionIndex));
        this.addEventListener("jump", e => this.setCurrentQuestion(e.detail.index));
        this.addEventListener("history-clear", () => this.clearHistory());
        this.render();
        this.timerHandle = setInterval(() => this.updateTimer(), 1000);
      }

      disconnectedCallback() {
        clearInterval(this.timerHandle);
      }

      load() {
        let saved = null;
        try {
          saved = JSON.parse(localStorage.getItem(CURRENT_KEY));
        } catch (_) {}

        if (saved && Array.isArray(saved.questions) && saved.questions.length === QUESTION_BANK.length && !saved.graded) {
          this.state = saved;
        } else {
          const questions = clone(QUESTION_BANK).map(q => ({
            ...q,
            viewed: false,
            options: q.options.map(o => ({ ...o, selected: false }))
          }));
          questions[0].viewed = true;
          this.state = {
            name: EXAM_NAME,
            graded: false,
            start: Date.now(),
            finish: 0,
            questions,
            currentQuestionNumber: 0,
            cheating: new URLSearchParams(location.search).get("page") === "answer"
          };
          this.saveCurrent();
        }
      }

      saveCurrent() {
        if (!this.state.graded) {
          localStorage.setItem(CURRENT_KEY, JSON.stringify(this.state));
        }
      }

      getHistory() {
        try {
          const existing = JSON.parse(localStorage.getItem(HISTORY_KEY));
          if (existing && Array.isArray(existing.exams)) return existing;
        } catch (_) {}
        const history = { name: "Exam History", exams: [] };
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        return history;
      }

      clearHistory() {
        localStorage.setItem(HISTORY_KEY, JSON.stringify({ name: "Exam History", exams: [] }));
        this.render();
      }

      toggleOption(optionIndex) {
        if (this.state.graded) return;
        const q = this.state.questions[this.state.currentQuestionNumber];
        const oneAnswer = correctCount(q) === 1;
        if (oneAnswer) {
          q.options.forEach((option, i) => { option.selected = i === optionIndex; });
        } else {
          q.options[optionIndex].selected = !q.options[optionIndex].selected;
        }
        q.viewed = true;
        this.saveCurrent();
        this.render();
      }

      setCurrentQuestion(index) {
        const next = Math.max(0, Math.min(index, this.state.questions.length - 1));
        this.state.currentQuestionNumber = next;
        this.state.questions[next].viewed = true;
        this.saveCurrent();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      toggleCheat() {
        this.state.cheating = !this.state.cheating;
        this.saveCurrent();
        this.render();
      }

      grade() {
        if (this.state.graded) return;
        this.state.graded = true;
        this.state.cheating = true;
        this.state.finish = Date.now();

        const history = this.getHistory();
        history.exams.push(clone(this.state));
        localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        localStorage.removeItem(CURRENT_KEY);
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      restart() {
        localStorage.removeItem(CURRENT_KEY);
        this.load();
        this.render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      score() {
        return this.state.questions.filter(isCorrect).length;
      }

      answeredCount() {
        return this.state.questions.filter(q => q.options.some(o => o.selected)).length;
      }

      updateTimer() {
        const el = this.querySelector("[data-timer]");
        if (!el || !this.state) return;
        const end = this.state.finish || Date.now();
        el.textContent = formatDuration(end - this.state.start);
      }

      render() {
        if (!this.state) return;
        const qIndex = this.state.currentQuestionNumber;
        const total = this.state.questions.length;
        const answered = this.answeredCount();
        const score = this.score();

        this.innerHTML = `
          <main class="page-shell">
            <header class="hero">
              <div class="hero-top">
                <div>
                  <h1>Claude Developer Professional | Exam 07</h1>
                  <p>70 concise exam questions · standalone and offline · answer explanations included</p>
                </div>
                <div class="pill">Elapsed <span data-timer>${formatDuration((this.state.finish || Date.now()) - this.state.start)}</span></div>
              </div>
              <div class="meta-row">
                <span class="pill">${total} questions</span>
                <span class="pill">${answered} answered</span>
                <span class="pill">${this.state.questions.filter(q => q.viewed).length} viewed</span>
                ${this.state.graded ? `<span class="pill">Score ${score} / ${total}</span>` : ""}
              </div>
            </header>

            ${this.state.graded ? `
              <section class="card results">
                <div class="card-body">
                  <strong>Your grade is ${score} out of ${total}.</strong>
                  <div class="status-line">Correct answers and option explanations are now visible. Your completed attempt has been saved to local storage.</div>
                </div>
              </section>
            ` : ""}

            <div class="controls controls-top" role="navigation" aria-label="Exam controls">
              <div class="control-group">
                <button class="btn-secondary previous" ${qIndex === 0 ? "disabled" : ""}>&larr; Back</button>
                <button class="btn-primary next" ${qIndex === total - 1 ? "disabled" : ""}>Next &rarr;</button>
                <button class="btn-warning cheat">${this.state.cheating ? "Hide Answers" : "Cheat"}</button>
              </div>
              <div class="control-group">
                ${this.state.graded
                  ? `<button class="btn-primary restart">Start New Attempt</button>`
                  : `<button class="btn-success finish">Finish &amp; Grade</button>`}
              </div>
            </div>

            <exam-question></exam-question>

            <question-jumper></question-jumper>
            <exam-history-panel></exam-history-panel>

            <p class="footer-note">Progress and completed attempts are stored only in this browser's localStorage.</p>
          </main>
        `;

        const questionEl = this.querySelector("exam-question");
        questionEl.state = {
          question: this.state.questions[qIndex],
          index: qIndex,
          total,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const jumper = this.querySelector("question-jumper");
        jumper.state = {
          questions: this.state.questions,
          current: qIndex,
          graded: this.state.graded,
          cheating: this.state.cheating
        };

        const history = this.querySelector("exam-history-panel");
        history.state = { history: this.getHistory() };

        this.querySelector(".previous").addEventListener("click", () => this.setCurrentQuestion(qIndex - 1));
        this.querySelector(".next").addEventListener("click", () => this.setCurrentQuestion(qIndex + 1));
        this.querySelector(".cheat").addEventListener("click", () => this.toggleCheat());

        const finish = this.querySelector(".finish");
        if (finish) finish.addEventListener("click", () => this.grade());

        const restart = this.querySelector(".restart");
        if (restart) restart.addEventListener("click", () => this.restart());
      }
    }
    customElements.define("scrum-exam-app", ScrumExamApp);
  </script>
</body>
</html>
