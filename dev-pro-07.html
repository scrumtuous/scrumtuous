 with no validation the errors would be found only when the game loads the items.","correct":false},{"text":"Have a script divide the files into batches, run a headless agent on each batch in parallel, and validate every output.","explanation":"The list of files is known, so code should own it. A script divides the files into batches, starts a headless agent for each batch in parallel, and runs the validator on every output. Coverage is then guaranteed, and the work completes in a fraction of the time.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eHave a script divide the files into batches, run a headless agent on each batch in parallel, and validate every output.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eLarge mechanical tasks suit a \u003cstrong\u003efan-out pattern\u003c/strong\u003e in which \u003cstrong\u003ecode controls the list and agents do the items\u003c/strong\u003e. An agent is not a reliable bookkeeper for thousands of items in one context. Items are skipped or repeated as the context fills and is compacted. A script is a reliable bookkeeper. It lists the files, groups them into batches, starts one headless run of Claude Code for each batch, and records the result of each file.\u003c/p\u003e\n\u003cp\u003eThree details make the pattern dependable. \u003cstrong\u003eBatches of a suitable size\u003c/strong\u003e keep each agent's context small and share the start-up cost. \u003cstrong\u003eControlled concurrency\u003c/strong\u003e respects the machine and the API rate limits. \u003cstrong\u003eAutomatic verification\u003c/strong\u003e of each item, here the schema validator, gives an objective pass or fail, and failed items go to a retry list or to a person. The script can stop and resume at any point, because the state is its own record and not an agent's memory.\u003c/p\u003e\n\u003cp\u003eClaude Code supports this with headless mode (\u003ccode\u003eclaude -p\u003c/code\u003e), which works as a command in a script, and with worktrees to isolate the edits of parallel runs. See \u003ca href=\"https://code.claude.com/docs/en/headless\"\u003eRun Claude Code programmatically\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/agents\"\u003eRun agents in parallel\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/large-codebases\"\u003eSet up Claude Code in a monorepo or large codebase\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Agent Fleet Operations for Software Delivery — source question 20","answerStatus":"source"},{"query":"An agent team with 20 communicating teammates converts independent files, but uses four times the tokens of isolated headless runs because teammates mostly exchange status messages. Which orchestration fits this workload?","type":"multiple-choice","options":[{"text":"Keep the agent team, and enlarge it to 60 teammates so that the 3,000 files are finished sooner.","explanation":"More teammates increase the coordination messages further. The trial already shows that this coordination adds cost and nothing else for this task.","correct":false},{"text":"Keep the agent team, and instruct the teammates not to send messages to each other.","explanation":"A team whose members may not communicate is a set of independent sessions with the extra machinery of a team. It is simpler to use independent runs directly.","correct":false},{"text":"Use independent parallel runs, and keep agent teams for work that needs real discussion.","explanation":"The files are independent, so the agents have nothing to tell each other. Messaging and a shared task list then add tokens with no benefit. Independent runs, such as headless sessions or subagents that report only their result, do the same work at a quarter of the cost. Agent teams are worth their overhead when teammates need to share findings or challenge each other.","correct":true},{"text":"Use a single agent with no parallel work, in order to avoid coordination costs completely.","explanation":"A single agent avoids coordination and also loses the parallel speed that 3,000 independent files allow. It was the approach that failed in the first attempt.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eUse independent parallel runs, and keep agent teams for work that needs real discussion.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eClaude Code has several ways to run work in parallel, and they differ in \u003cstrong\u003ehow much the agents communicate\u003c/strong\u003e. \u003cstrong\u003eSubagents\u003c/strong\u003e work inside one session and report only to the agent that started them. \u003cstrong\u003eIndependent sessions\u003c/strong\u003e, for example headless runs in separate worktrees, do not communicate at all. \u003cstrong\u003eAgent teams\u003c/strong\u003e are several sessions coordinated by a lead, with a shared task list and direct messages between teammates.\u003c/p\u003e\n\u003cp\u003eThe right choice depends on the task. Communication is valuable when the pieces of work \u003cstrong\u003edepend on each other\u003c/strong\u003e: teammates who investigate competing explanations for a bug, or who review each other's designs, benefit from discussion. Communication is pure overhead when the pieces are \u003cstrong\u003eindependent\u003c/strong\u003e, as in a conversion of 3,000 separate files. The documentation notes that agent teams use significantly more tokens than a single session, because each teammate has its own context and the coordination has a cost. For independent work, the least expensive structure that isolates edits is the correct one.\u003c/p\u003e\n\u003cp\u003eThe trial data already answers the question: four times the tokens, with messages that carried no useful information. See \u003ca href=\"https://code.claude.com/docs/en/agent-teams\"\u003eOrchestrate teams of Claude Code sessions\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/agents\"\u003eRun agents in parallel\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/sub-agents\"\u003eCreate custom subagents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Agent Fleet Operations for Software Delivery — source question 21","answerStatus":"source"},{"query":"A managed code reviewer floods pull requests with minor findings and comments on generated files; engineers ignore its feedback. Before making reviews mandatory, which TWO steps will improve usefulness and validate quality? (Select TWO.)","type":"multiple-choice","options":[{"text":"Make the review check a required status immediately, so that engineers have to read the findings.","explanation":"This is incorrect. Blocking merges on findings that engineers already consider to be noise would stop work and increase resentment. Gating should follow calibration.","correct":false},{"text":"Add a REVIEW\\.md file that states what to flag, at what severity, and which paths to skip.","explanation":"This is correct. The service reads review instructions from the repository. A REVIEW\\.md file can lower the severity of style points, exclude generated files, and name the checks that the team values. This reduces the noise that causes engineers to ignore the reviews.","correct":true},{"text":"Measure which findings engineers act on and which they dismiss, and compare the findings with human review.","explanation":"This is correct. Before a reviewer is given authority, its accuracy must be known. Recording which findings lead to a fix and which are dismissed, and comparing them with the comments of human reviewers on the same pull requests, shows where it is reliable.","correct":true},{"text":"Turn the service off for all repositories, because engineers have stopped reading its comments.","explanation":"This is incorrect. The service has not yet been configured for these repositories. Turning it off gives up its value before the simple step of tuning has been tried.","correct":false},{"text":"Ask engineering managers to remind their teams each week to read every review comment.","explanation":"This is incorrect. Reminders do not make noisy comments useful. The quality of the signal has to improve before people will pay attention to it.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answers:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eAdd a REVIEW\\.md file that states what to flag, at what severity, and which paths to skip.\u003c/li\u003e\u003cli\u003eMeasure which findings engineers act on and which they dismiss, and compare the findings with human review.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAn AI reviewer earns attention through its \u003cstrong\u003esignal-to-noise ratio\u003c/strong\u003e. When most comments are minor or wrong, engineers learn to ignore all of them, and the important findings are lost with the rest. Two steps come before any discussion of gating.\u003c/p\u003e\n\u003cp\u003eThe first is \u003cstrong\u003ecustomization\u003c/strong\u003e. Claude Code's managed Code Review reads instructions that are committed to the repository. \u003ccode\u003eCLAUDE.md\u003c/code\u003e gives project context, and \u003ccode\u003eREVIEW.md\u003c/code\u003e is for reviews specifically: what to flag, at what severity, and what to skip, such as generated files. This is the documented way to reduce the number of minor comments and to add checks that the team cares about. The second is \u003cstrong\u003ecalibration\u003c/strong\u003e. The team measures how the findings compare with human judgment: which findings engineers fix, which they dismiss, and what human reviewers find that the service misses. The analytics for the service and the pull request history supply this data.\u003c/p\u003e\n\u003cp\u003eBy design, the managed service does not approve or block pull requests, and its check run does not conclude as a failure. The decision to merge stays with the team, and any gating policy is something that the team builds deliberately after it trusts the signal. See \u003ca href=\"https://code.claude.com/docs/en/code-review-customize\"\u003eCustomize Code Review\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/code-review\"\u003eCode Review\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/code-review-pull-requests\"\u003eRead and request reviews on a pull request\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect TWO answers.\u003c/p\u003e","reference":"Agent Fleet Operations for Software Delivery — source question 22","answerStatus":"source"},{"query":"About 150 automated conversion pull requests pass CI separately but fail as other PRs update a shared index on main. How should merges be tested against the latest main branch?","type":"multiple-choice","options":[{"text":"Merge all 150 pull requests at the same moment, before any of them can become out of date.","explanation":"Merging at the same moment does not remove the conflicts in the shared index file. It produces all of the conflicts together and leaves the main branch broken.","correct":false},{"text":"Use a merge queue that tests each pull request against the current main branch.","explanation":"A merge queue merges changes one at a time and tests each one against the main branch as it will be at that moment, so a pull request cannot be merged on the basis of an old test.","correct":true},{"text":"Turn CI off for the seasonal content pull requests, because each one passed when it was opened.","explanation":"The test at opening time no longer describes the code after other merges. Without CI, broken combinations would reach the main branch unnoticed.","correct":false},{"text":"Ask one engineer to merge the pull requests by hand in alphabetical order over several days.","explanation":"Manual merging in any fixed order still meets the same conflicts, uses days of an engineer's time, and delays the release.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eUse a merge queue that tests each pull request against the current main branch.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eWith many agents, the limiting step moves from writing code to \u003cstrong\u003eintegrating\u003c/strong\u003e it. A pull request that passed CI an hour ago was tested against an older main branch. After other merges, the combination may conflict or fail. With 150 pull requests that touch one shared file, this is certain to happen.\u003c/p\u003e\n\u003cp\u003eA \u003cstrong\u003emerge and conflict strategy\u003c/strong\u003e for a fleet has three parts. First, a \u003cstrong\u003emerge queue\u003c/strong\u003e: pull requests enter a queue, and each is tested against the main branch plus the changes ahead of it, and is merged only if that combination passes. Second, \u003cstrong\u003econflicts go back to the owner\u003c/strong\u003e: when a pull request cannot be merged cleanly, the agent that produced it is asked to rebase and fix it in its own worktree, with the test results as its guide. Third, \u003cstrong\u003ereduce the overlap at the source\u003c/strong\u003e: a file that every task edits, such as the shared index, should be generated in one final step and not edited by 150 tasks.\u003c/p\u003e\n\u003cp\u003eThe third point is the most effective. Good task decomposition gives each agent files that no other agent touches. See \u003ca href=\"https://code.claude.com/docs/en/worktrees\"\u003eRun parallel sessions with worktrees\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/agents\"\u003eRun agents in parallel\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/github-actions\"\u003eClaude Code GitHub Actions\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Agent Fleet Operations for Software Delivery — source question 23","answerStatus":"source"},{"query":"An unattended Claude Code build-triage job runs for three hours and costs $400 on a flaky test, although typical jobs take ten minutes. How should execution and spending be bounded with notifications?","type":"multiple-choice","options":[{"text":"A sentence in the prompt that asks the agent to stop when it has worked for a long time.","explanation":"The agent has no reliable sense of elapsed time or cost, and an instruction is not enforced. A run that is in a loop would probably continue.","correct":false},{"text":"A larger GitHub Actions runner, so that long investigations complete in less time.","explanation":"A faster machine does not limit a run that repeats the same investigation. The run could use the same number of turns and tokens, or more.","correct":false},{"text":"Limits on turns and spending for each run, a job timeout, and a notification at a limit.","explanation":"An unattended run needs hard bounds that do not depend on the agent's judgment. A maximum number of turns and a spending limit end a run that is not converging, and a job timeout bounds elapsed time. A notification tells the team that a failure needs a person.","correct":true},{"text":"A rule that an engineer must start every triage run by hand and watch it until it completes.","explanation":"This removes the automatic response at night, which is the purpose of the workflow. Limits allow the run to remain unattended and safe.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eLimits on turns and spending for each run, a job timeout, and a notification at a limit.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAn unattended agent must have \u003cstrong\u003ebounds that are enforced from outside\u003c/strong\u003e. Most runs end normally, but one that meets a flaky test or a confusing error can loop for hours. Without limits, the first sign is the bill.\u003c/p\u003e\n\u003cp\u003eClaude Code's headless mode provides the controls. A \u003cstrong\u003emaximum number of turns\u003c/strong\u003e ends a run after a fixed number of agent turns. A \u003cstrong\u003emaximum budget\u003c/strong\u003e ends it when the estimated cost reaches a limit. The CI system's own \u003cstrong\u003ejob timeout\u003c/strong\u003e bounds elapsed time. An \u003cstrong\u003eallowlist of tools\u003c/strong\u003e and a permission mode restrict what the run may do, which matters for safety as well as cost. The run's result states why it ended, so the workflow can distinguish a finished triage from a run that reached a limit, and can \u003cstrong\u003enotify\u003c/strong\u003e the team in the second case. Reaching a limit is itself a useful signal: this failure is not routine, and a person should look at it.\u003c/p\u003e\n\u003cp\u003eA request in the prompt to stop is not a control, and a manual start removes the value of the automation. See \u003ca href=\"https://code.claude.com/docs/en/headless\"\u003eRun Claude Code programmatically\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/cli-reference\"\u003eCLI reference\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/github-actions\"\u003eClaude Code GitHub Actions\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Agent Fleet Operations for Software Delivery — source question 24","answerStatus":"source"},{"query":"Teams have made nine drifting copies of a release-checklist Skill, including versions with a dangerous retired step. How should they distribute and maintain a single trusted Skill?","type":"multiple-choice","options":[{"text":"Keep the copies, and ask each team to compare its copy with the original once a month.","explanation":"Manual comparison of nine copies each month is work that will be skipped, and it finds drift only after the fact. The copies would still differ between checks.","correct":false},{"text":"Forbid teams from using Skills that another team has written.","explanation":"This stops the drift by stopping the sharing. Teams would write the same Skill again separately, with more differences and more defects.","correct":false},{"text":"Publish the Skill as a versioned plugin in an internal marketplace with an owner.","explanation":"One published source with versions replaces nine diverging copies. Teams install the plugin and do not copy files, so a correction reaches everyone through an update. A named owner is responsible for quality, and the version history shows what changed and when.","correct":true},{"text":"Paste the full text of the Skill into every repository's CLAUDE.md file.","explanation":"This creates even more copies and loads the checklist into every session, whether or not it is needed. An update would still have to be made in every repository.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003ePublish the Skill as a versioned plugin in an internal marketplace with an owner.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eSharing by \u003cstrong\u003ecopying\u003c/strong\u003e produces drift. Every copy can change independently, corrections do not reach the other copies, and nobody owns the result. This problem is familiar from shared code, and the answer is the same: \u003cstrong\u003epublish once, install everywhere, and version the releases\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eClaude Code packages Skills, subagents, hooks, and MCP server configurations as \u003cstrong\u003eplugins\u003c/strong\u003e, and distributes plugins through \u003cstrong\u003emarketplaces\u003c/strong\u003e. An organization can host an internal marketplace. A shared Skill then has one source, a version number, and an owner. Teams install it, and updates are delivered to them. Governance adds a \u003cstrong\u003equality and safety standard\u003c/strong\u003e for anything that is published for use across teams: a named owner, a review of what the Skill does and what it can access, tests or evaluations where they are practical, and a way to deprecate old versions. Administrators can also restrict which marketplaces may be used.\u003c/p\u003e\n\u003cp\u003eThe standard matters because a Skill is a set of instructions that agents follow. A wrong step in a release checklist, repeated across nine teams, is an operational risk. See \u003ca href=\"https://code.claude.com/docs/en/skills\"\u003eExtend Claude with skills\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/plugins/create-marketplace\"\u003eCreate a marketplace\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/plugins/org\"\u003eManage Claude Code plugins for your organization\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Agent Fleet Operations for Software Delivery — source question 25","answerStatus":"source"},{"query":"Claude Code CI jobs use long-lived API keys in GitHub repository secrets; a prior misconfigured workflow exposed a secret. How can CI avoid holding reusable Claude credentials?","type":"multiple-choice","options":[{"text":"Use workload identity federation, so that each run exchanges its GitHub identity token for a short-lived Claude API token.","explanation":"With workload identity federation, no Claude API key is stored in the repository. Each workflow run obtains a signed identity token from GitHub and exchanges it for an access token that expires within minutes, under trust rules that can be limited to particular repositories and workflows. There is no long-lived secret to leak.","correct":true},{"text":"Rotate the API key every 30 days, and update the repository secret after each rotation.","explanation":"Rotation limits how long a leaked key is useful, but a key that is printed to a log can be used at once. A long-lived secret is still stored in CI and can still leak.","correct":false},{"text":"Add a step at the end of each workflow that searches the build log for the key and deletes the log if the key is found.","explanation":"A check after the run acts when the key has already been exposed, and it depends on every workflow including the step. It does not remove the secret from CI.","correct":false},{"text":"Store the API key in an organization-level secret in place of a repository-level secret.","explanation":"An organization-level secret is still a long-lived key that workflows can read and print. It is available to more repositories, which increases the exposure.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eUse workload identity federation, so that each run exchanges its GitHub identity token for a short-lived Claude API token.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA static API key in CI is a \u003cstrong\u003elong-lived secret\u003c/strong\u003e: it is valid until someone revokes it, and any workflow that can read it can leak it. Careful workflow authors reduce the risk, but they do not remove it. \u003cstrong\u003eWorkload identity federation (WIF)\u003c/strong\u003e removes the secret itself.\u003c/p\u003e\n\u003cp\u003eEvery GitHub Actions run can request a signed OpenID Connect identity token from GitHub. The token states which repository, workflow, and branch the run belongs to. With WIF, the workflow presents this token to Anthropic. Anthropic validates it against \u003cstrong\u003etrust rules\u003c/strong\u003e that the organization has configured, for example \u0026quot;only the triage workflow in this repository,\u0026quot; and returns a \u003cstrong\u003eshort-lived access token\u003c/strong\u003e bound to a service account. The workflow then calls the Claude API with no \u003ccode\u003eANTHROPIC_API_KEY\u003c/code\u003e stored anywhere. A token that appears in a log by accident expires within minutes and cannot be renewed by an attacker.\u003c/p\u003e\n\u003cp\u003eRotation, log scanning, and moving the secret to another level all leave a long-lived key in CI. The rules for federation can also limit a workflow to one workspace, which applies least privilege. See \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/wif-providers/github-actions\"\u003eUse WIF with GitHub Actions\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/workload-identity-federation\"\u003eWorkload Identity Federation\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 26","answerStatus":"source"},{"query":"Coding-agent token consumption and spending have tripled, but executives disagree whether this reflects value. What should telemetry report to judge business outcomes rather than usage alone?","type":"multiple-choice","options":[{"text":"Usage and cost together with outcome measures, such as merged pull requests, by team.","explanation":"Cost has meaning only in relation to what it produces. The telemetry includes outcome signals, such as whether proposed edits were accepted, commits, and pull requests. Reported with cost and divided by team, these show cost for each merged change and reveal where the tool works well and where it does not.","correct":true},{"text":"The total number of tokens for each month, shown beside the number of engineers who have a license.","explanation":"Tokens for each licensed engineer show how much the tool is used. They do not show whether the use produces anything of value.","correct":false},{"text":"A survey in which engineers rate their own productivity with the agents from 1 to 10.","explanation":"Ratings by engineers of their own productivity are opinions and tend to be optimistic. They can add to measured outcomes but cannot replace them.","correct":false},{"text":"The number of sessions started for each day, as evidence that engineers are adopting the tool.","explanation":"The number of sessions shows adoption. A session can also be abandoned or produce nothing, so this figure cannot show value.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eUsage and cost together with outcome measures, such as merged pull requests, by team.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eToken and cost figures are \u003cstrong\u003einput metrics\u003c/strong\u003e. They rise with success and also with waste, which is why the two executives read the same chart in opposite ways. A decision needs \u003cstrong\u003eoutcome metrics\u003c/strong\u003e and the ratio between the two.\u003c/p\u003e\n\u003cp\u003eClaude Code's OpenTelemetry export includes both kinds. The input metrics are token usage and estimated cost. The outcome signals include the \u003cstrong\u003edecisions on code edits\u003c/strong\u003e (whether a proposed edit was accepted or rejected), \u003cstrong\u003elines of code\u003c/strong\u003e added and removed, \u003cstrong\u003ecommits\u003c/strong\u003e, and \u003cstrong\u003epull requests\u003c/strong\u003e created. With resource attributes for team, these can be divided by team. A report can then show cost for each merged pull request, the acceptance rate of edits, and the trend over time, for each team. The differences are informative: a team with high cost and a low acceptance rate needs help with its setup or its tasks, and a team with a low cost for each merged change shows what works.\u003c/p\u003e\n\u003cp\u003eThese measures should be combined with quality signals from the delivery pipeline, such as review findings and reverted changes, so that speed is not counted without correctness. Counts of sessions and tokens measure adoption only. See \u003ca href=\"https://code.claude.com/docs/en/monitoring-usage\"\u003eMonitoring\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/analytics\"\u003eTrack team usage with analytics\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/costs\"\u003eManage costs effectively\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 27","answerStatus":"source"},{"query":"A banking copilot claims 92% positive feedback, but 97% of conversations are unrated and some failed users cannot rate at all. How should it measure quality across all conversations?","type":"multiple-choice","options":[{"text":"Make the rating compulsory, so that every customer must choose thumbs up or down before closing the chat.","explanation":"A forced rating annoys customers and produces careless answers. It also still fails for customers who leave the app or are locked out, so the worst cases remain unmeasured.","correct":false},{"text":"Report the 92% figure with a note that it is based on a 3% response rate.","explanation":"The note is honest, but the figure still describes only the customers who chose to rate. The committee asked for a measure of all conversations.","correct":false},{"text":"Grade a random sample of all conversations with a calibrated judge and human review.","explanation":"A random sample of all conversations represents the whole population, including customers who never rate. Grading the sample against a rubric, with a judge that has been checked against human reviewers, gives a quality figure that can be defended. Ratings remain useful for finding problem areas and new test cases.","correct":true},{"text":"Assume that conversations with no rating were satisfactory, and report 99.8% positive.","explanation":"The absence of a rating is not evidence of satisfaction. This assumption would hide failures such as the locked-out customers.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eGrade a random sample of all conversations with a calibrated judge and human review.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eCustomer ratings are a \u003cstrong\u003efeedback loop with a strong selection effect\u003c/strong\u003e. Only a small share of customers respond, they are not typical of all customers, and some failures prevent a response completely. A figure calculated from ratings alone describes the people who rate and not the service.\u003c/p\u003e\n\u003cp\u003eA measure that represents all traffic needs \u003cstrong\u003erandom sampling\u003c/strong\u003e. Each week the team draws a random sample of all conversations, stratified by intent so that rare but important intents such as card freezing are included. It grades the sample against a rubric for correctness, completeness, and policy compliance. At this volume the grading is done by an LLM judge that has been \u003cstrong\u003ecalibrated against human reviewers\u003c/strong\u003e, and people review a part of the sample again to confirm that the judge is still accurate. The result is a quality figure with a known basis, which is what a risk committee and a regulator need.\u003c/p\u003e\n\u003cp\u003eRatings are still valuable as one signal among several. A thumbs down is a good source of cases for review and for the regression suite. Anthropic's evaluation guidance describes automated evals, production monitoring, user feedback, and manual review of transcripts as complementary methods. See \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 28","answerStatus":"source"},{"query":"A bank's 'freeze my card' evaluation passes whenever the agent says 'your card has been frozen,' even when the tool failed or froze the wrong card. How should task success be graded?","type":"multiple-choice","options":[{"text":"Check the final state in the test environment: the correct card is frozen, and no other card has changed.","explanation":"For a task that takes an action, success means that the world is in the right state. In a test environment, the grader can read the card system after the conversation and confirm that the intended card is frozen and that the customer's other card is not. This detects a false statement of success and an action on the wrong card.","correct":true},{"text":"Check for a longer list of phrases, such as \"frozen,\" \"blocked,\" and \"disabled,\" in the final message.","explanation":"A longer list of phrases still grades what the copilot says and not what happened. The copilot can use any of these words when the card is not frozen.","correct":false},{"text":"Have an LLM judge read the final message and decide whether it sounds confident and clear.","explanation":"A confident and clear message can describe an action that failed. The tone of the message is not evidence of the state of the card.","correct":false},{"text":"Count the number of tool calls in the conversation, and pass the task if there is at least one.","explanation":"A tool call may have failed or may have acted on the wrong card. The existence of a call does not show the correct result.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eCheck the final state in the test environment: the correct card is frozen, and no other card has changed.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThe metric must fit the \u003cstrong\u003etype of task\u003c/strong\u003e. For an \u003cstrong\u003eagentic task\u003c/strong\u003e that changes something, the correct question is \u0026quot;did the right thing happen?\u0026quot; and not \u0026quot;did the agent say that it happened?\u0026quot; Anthropic's guidance on agent evaluation makes this distinction between the \u003cstrong\u003etranscript\u003c/strong\u003e, which is what the agent said and did, and the \u003cstrong\u003eoutcome\u003c/strong\u003e, which is the final state of the environment. An agent can state that an action succeeded when it did not, and only a check of the outcome reveals this.\u003c/p\u003e\n\u003cp\u003eAn outcome-based grader runs each test conversation in a \u003cstrong\u003etest environment\u003c/strong\u003e with a known starting state, for example a test customer with two active cards. After the conversation, code reads the state: the intended card must be frozen, the other card must be unchanged, and no unexpected transfer may exist. This is a code-based grader, so it is exact and inexpensive. A second assertion can compare the state with the transcript: if the agent says that the action succeeded, the state must agree.\u003c/p\u003e\n\u003cp\u003eEach test must start from a clean state so that the tests do not affect each other. Graders that read phrases, tone, or the number of tool calls measure appearances. See \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 29","answerStatus":"source"},{"query":"A banking copilot completes transfers in 90% of one-off tests. Customers repeat transfers over time, so the team needs a better measure of reliable execution. Which TWO testing changes are needed? (Select TWO.)","type":"multiple-choice","options":[{"text":"Run each task for several trials, and report a pass if at least one of the trials succeeds.","explanation":"This is incorrect. Counting a pass when any one trial succeeds makes the figure higher as the number of trials grows. It answers the question \"can the copilot ever do this?\" and hides inconsistency.","correct":false},{"text":"Run each task for several trials, and report how often all of the trials succeed.","explanation":"This is correct. For an action that customers repeat and rely on, consistency matters more than success on one occasion. The share of tasks on which every one of several trials succeeds is a much stricter measure, and it reflects what a customer who uses the feature repeatedly will experience.","correct":true},{"text":"Set the temperature to 0, and report that the copilot now gives the same result on every run.","explanation":"This is incorrect. A low temperature reduces variation but does not guarantee identical behavior. It also changes the test conditions away from production.","correct":false},{"text":"Start every trial from a clean, identical state, so that the trials are independent of each other.","explanation":"This is correct. If one trial leaves a transfer in place, the next trial runs under different conditions, and its result means something different. Resetting the environment before each trial makes the trials comparable and the measured rate meaningful.","correct":true},{"text":"Remove the hardest transfer tasks from the suite, so that the reported success rate is higher.","explanation":"This is incorrect. Removing difficult tasks improves the number and not the product. The hardest tasks are the most informative ones for reliability.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answers:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eRun each task for several trials, and report how often all of the trials succeed.\u003c/li\u003e\u003cli\u003eStart every trial from a clean, identical state, so that the trials are independent of each other.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAgent behavior varies between runs, so one run of each task is a weak measurement. Anthropic's guidance on agent evaluation describes two ways to summarize several \u003cstrong\u003etrials\u003c/strong\u003e. \u003cstrong\u003epass@k\u003c/strong\u003e is the probability that at least one of k trials succeeds. It rises as k grows, and it suits cases in which one success is sufficient. \u003cstrong\u003epass^k\u003c/strong\u003e is the probability that all k trials succeed. It falls as k grows, and it suits agents that customers use repeatedly and expect to work every time. With a 90% success rate on single runs, the chance of ten successes in a row is about 35%. The risk officer's point is exactly this.\u003c/p\u003e\n\u003cp\u003eFor a consequential action such as a transfer, \u003cstrong\u003epass^k is the correct headline measure\u003c/strong\u003e, and the release criteria should set a threshold on it. The measurement is valid only if the trials are \u003cstrong\u003eindependent\u003c/strong\u003e. Each trial must start from the same clean state, with no accounts, transfers, or cached data left from the previous one. Shared state can make failures appear or disappear for reasons that are not related to the agent.\u003c/p\u003e\n\u003cp\u003eChanging the temperature and removing hard tasks alter the measurement and not the reliability. See \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect TWO answers.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 30","answerStatus":"source"},{"query":"During a live A/B test, an analyst wants to stop on day three after seeing a favorable completion rate. No sample size, primary metric, duration, or escalation guardrail was specified beforehand. How should the experiment be run?","type":"multiple-choice","options":[{"text":"Stop the test on the first day on which the new prompt is ahead, in order to give customers the benefit sooner.","explanation":"Daily results vary by chance. If the test is stopped the first time that one side is ahead, a difference that is only noise will often be taken for a real improvement.","correct":false},{"text":"Extend the test to 100% of traffic for one week, and compare that week with the week before.","explanation":"This is no longer an A/B test. A comparison of two different weeks includes every other difference between those weeks, such as salary dates or a marketing campaign.","correct":false},{"text":"Define the primary metric, guardrail metrics, and sample size in advance, and decide at the end.","explanation":"A test gives reliable evidence only if its rules are fixed before the data is seen. One primary metric decides the result. Guardrail metrics confirm that the change does no harm elsewhere, for example by raising escalations. A sample size chosen in advance prevents a decision on an early difference that is due to chance.","correct":true},{"text":"Let the analyst choose, at the end of the test, whichever metric shows the largest improvement.","explanation":"If the metric is chosen after the results are known, some metric will almost always appear to improve by chance. The conclusion would not be reliable.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eDefine the primary metric, guardrail metrics, and sample size in advance, and decide at the end.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAn A/B test on live traffic is the strongest evidence that a change helps real users, but only when it is run with discipline. Two common errors make the result invalid. The first is \u003cstrong\u003epeeking and stopping early\u003c/strong\u003e. Results vary from day to day, and stopping on the first day that looks good selects a moment of favorable noise. The second is \u003cstrong\u003echoosing the metric afterward\u003c/strong\u003e. With many metrics, one of them will improve by chance.\u003c/p\u003e\n\u003cp\u003eA sound design fixes four things before the test begins. The \u003cstrong\u003eprimary metric\u003c/strong\u003e is the single measure that decides the result, chosen to fit the task. For an agent that performs actions, a verified task completion rate is suitable. \u003cstrong\u003eGuardrail metrics\u003c/strong\u003e are measures that must not become worse, such as the rate of escalation to human agents, complaints, error rates, and cost for each conversation. The \u003cstrong\u003esample size or duration\u003c/strong\u003e must be sufficient to detect the expected effect and to cover a full weekly cycle. The \u003cstrong\u003edecision rule\u003c/strong\u003e states what will be done for each outcome. Random assignment should be by customer or by conversation, so that one conversation does not change versions.\u003c/p\u003e\n\u003cp\u003eFor a regulated bank, the plan written in advance is also the record that shows how the decision was made. See \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 31","answerStatus":"source"},{"query":"An evaluation gate runs only after prompt-file changes. A new transfer-tool description changed agent behavior and caused errors without triggering tests. What changes should trigger the gate?","type":"multiple-choice","options":[{"text":"Run the gate only for prompt changes, and require a code review by a second engineer for tool descriptions.","explanation":"A second engineer may also fail to predict how a shorter description changes the model's choice of tool. A description is part of what the model reads, and its effect has to be tested.","correct":false},{"text":"Run the gate once a month on whatever version is in production at that time.","explanation":"A monthly run finds a regression weeks after customers have met it. A gate has to run before each release in order to prevent the regression.","correct":false},{"text":"Run the gate for prompt changes and for changes of more than 50 lines in any other file.","explanation":"The size of a change does not predict its effect. One sentence in a tool description changed the agent's behavior here, and a rule based on line count would not have run the gate.","correct":false},{"text":"Run the gate for any change that can alter behavior, including tool definitions and model version.","explanation":"The model's behavior depends on everything that enters its context and on the system around it. Tool names and descriptions, the model version, and settings such as limits and compaction can all change behavior as much as a prompt edit. The gate should run whenever any of them changes.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eRun the gate for any change that can alter behavior, including tool definitions and model version.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA CI/CD evaluation gate has to cover the \u003cstrong\u003ewhole agent\u003c/strong\u003e and not only the prompt file. An agent's behavior is produced by the model together with everything that it is given: the system prompt, the \u003cstrong\u003etool definitions\u003c/strong\u003e (names, descriptions, and schemas), examples, and the harness around it, which includes the loop, the limits, and context management. Anthropic's guidance on tools calls the description the most important factor in how well a tool is used, so an edit to a description is a change in behavior.\u003c/p\u003e\n\u003cp\u003eThe release rule should therefore say that \u003cstrong\u003eany change to a component that affects behavior runs the gate\u003c/strong\u003e: prompts, tool definitions, the model version or alias, harness configuration, retrieval settings, and guardrail settings. A simple way to implement this is to treat all of these as one versioned agent configuration and to run the suite whenever the configuration changes. The suite itself should contain agent-level tasks, including tool selection cases such as \u0026quot;a payment to another person must not use the internal transfer tool.\u0026quot;\u003c/p\u003e\n\u003cp\u003eReview by a second person, a monthly run, and a threshold on line count all leave routes by which a change in behavior reaches production untested. See \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools\"\u003eDefine tools\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 32","answerStatus":"source"},{"query":"A 14,000-token cached prompt prefix is often rewritten when customers resume after 5–20-minute pauses; most pauses are under one hour. Which cache-duration change best fits the usage pattern?","type":"multiple-choice","options":[{"text":"Use the 1-hour cache duration from the start of each conversation, because pauses of 5 to 60 minutes are frequent.","explanation":"A 1-hour entry costs more to write but survives the pauses that now cause a full rewrite. When one turn in eight follows a pause of 5 to 60 minutes, which is far more often than the break-even of about one turn in twenty to thirty, the longer duration is cheaper overall. It should be set when the conversation begins.","correct":true},{"text":"Keep the 5-minute duration, and ask customers in the chat window to reply more quickly.","explanation":"Customers stop for good reasons, and a request to reply faster would harm the experience. The cache configuration should fit real behavior.","correct":false},{"text":"Turn caching off, because the cache expires too often to be useful in these conversations.","explanation":"Seven turns in eight still read from the cache. Turning it off would make every turn pay the full input price, which costs far more.","correct":false},{"text":"Switch to the 1-hour duration in the middle of a conversation, when a customer has been silent for four minutes.","explanation":"A change of duration in the middle of a conversation writes the whole prompt to the cache again once, and the harness would need a timer for each conversation. Choosing the duration at the start avoids both.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eUse the 1-hour cache duration from the start of each conversation, because pauses of 5 to 60 minutes are frequent.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThe choice of cache duration is an economic decision that depends on the \u003cstrong\u003epattern of gaps between requests\u003c/strong\u003e. The default entry lasts 5 minutes, is renewed at no cost each time it is read, and costs 1.25 times the input price to write. The 1-hour entry costs 2 times the input price to write. If requests always arrive within 5 minutes, the default is cheaper. If requests often arrive after longer pauses, each pause forces a full write at 1.25 times, and the 1-hour option becomes cheaper.\u003c/p\u003e\n\u003cp\u003eAnthropic's cost guidance gives a rule of thumb. The 1-hour duration is worth using when about one turn in twenty follows a pause of between 5 minutes and an hour, and few pauses are longer than an hour. The break-even is about one in thirty on some current models. Brindle's data, one turn in eight with few pauses above an hour, is well beyond that point. The guidance also says to \u003cstrong\u003echoose the duration when a conversation starts\u003c/strong\u003e, because a switch in the middle of a conversation writes the whole prompt again once.\u003c/p\u003e\n\u003cp\u003eWhen durations are mixed in one request, a breakpoint with the longer duration must come before any with the shorter duration. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\"\u003ePrompt caching\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\"\u003eOptimizing for cost and intelligence\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Cost and Latency Optimization at Scale — source question 33","answerStatus":"source"},{"query":"A transfer tool returns HTTP 200, with status 'FAILED' at the end of a long response. The harness truncates tool results to the first 200 characters and sets no error flag, so Claude says the transfer succeeded. What failed?","type":"multiple-choice","options":[{"text":"In the model, which invents a successful outcome. A more capable model would not make this error.","explanation":"The model receives a result with no error flag and no status, and reasonably takes the call to have worked. No model can read a field that was removed before the result reached it.","correct":false},{"text":"In the harness, which removes the status and sets no error flag on the result.","explanation":"The tool reported the failure, and the model never received it. The component between them, the harness, cut the result before the status field and did not mark it as an error. The harness should read the status, set the error flag, and place the outcome at the start of the result.","correct":true},{"text":"In the customers, who should check their account balance after every transfer.","explanation":"Customers are entitled to rely on the copilot's statement. The system told them that the transfer had succeeded when it had failed.","correct":false},{"text":"In the bank's transfer system, which should not allow any transfer to fail.","explanation":"Transfers can fail for legitimate reasons, such as a daily limit. The tool reported the failure correctly in its body, and the information was lost after that.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eIn the harness, which removes the status and sets no error flag on the result.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThe four possible origins of an agent failure are the \u003cstrong\u003emodel's output\u003c/strong\u003e, the \u003cstrong\u003eharness\u003c/strong\u003e, the \u003cstrong\u003etools\u003c/strong\u003e, and the \u003cstrong\u003edata\u003c/strong\u003e. The trace decides between them. The tool returned the correct information, a failed status. The model acted reasonably on what it was given, a result with no sign of failure. The fault lies in what happened between them. The harness shortened the result and removed the one field that mattered, and it did not use the mechanism that exists for reporting a failed tool call.\u003c/p\u003e\n\u003cp\u003eThere are two corrections. First, \u003cstrong\u003esignal errors explicitly\u003c/strong\u003e. A tool result has an error flag (\u003ccode\u003eis_error\u003c/code\u003e in the Messages API), and the harness should set it when the operation failed, with a short message that states what failed and whether a retry may help. An HTTP status of 200 from the bank's API does not mean that the business operation succeeded. Second, \u003cstrong\u003edesign results for the model\u003c/strong\u003e. If results must be shortened, the important fields, the outcome above all, come first, and shortening is done by a rule that understands the structure and not by cutting characters. Anthropic's guidance on tools recommends concise, high-signal results with the key information stated clearly.\u003c/p\u003e\n\u003cp\u003eThe incident also supplies a regression test: a failed transfer must never be described as completed. See \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/handle-tool-calls\"\u003eHandle tool calls\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/writing-tools-for-agents\"\u003eWriting effective tools for agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Debugging and Incident Response — source question 34","answerStatus":"source"},{"query":"A regulator wants evidence of a banking copilot's production quality after each weekly release. The bank has offline-test scores and thumbs-up ratings, but no release-tagged live quality assessments or alert history. What monitoring should it add?","type":"multiple-choice","options":[{"text":"A larger offline test suite, run before each release, with its results stored for seven years.","explanation":"The offline suite shows what was tested before release. The regulator asked about quality in production, where real customers and real data may differ from the tests.","correct":false},{"text":"A monthly report written by the product manager that describes the copilot's quality in general terms.","explanation":"A description in general terms is not a measurement. It cannot show how quality changed after a particular release or when a problem was detected.","correct":false},{"text":"Scheduled evaluation of sampled live conversations, stored by release version, with logged alerts.","explanation":"Continuous monitoring means that quality is measured on production traffic at regular intervals and recorded. Storing each result with the version that produced the conversations shows the effect of each release. Alerts on these measures, with a record of when each was raised and how it was handled, show that the monitoring is acted on.","correct":true},{"text":"A copy of every conversation, kept in an archive so that the regulator can read any of them on request.","explanation":"An archive of conversations is material that could be measured. It is not a measurement of quality over time or evidence that anyone is monitoring.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eScheduled evaluation of sampled live conversations, stored by release version, with logged alerts.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eEvidence of \u003cstrong\u003econtinuous monitoring\u003c/strong\u003e is different from evidence of testing before release. A regulator wants to see that quality in production is \u003cstrong\u003emeasured, recorded, and acted on\u003c/strong\u003e as time passes. This needs three things.\u003c/p\u003e\n\u003cp\u003eThe first is \u003cstrong\u003eonline evaluation on a schedule\u003c/strong\u003e. Each day or each week, a sample of live conversations is graded for the quality dimensions that matter, such as correct information, correct actions, and policy compliance, by a calibrated judge with human review of a part. The second is \u003cstrong\u003equality SLIs stored as time series\u003c/strong\u003e, labeled with the release version, the model version, and the segment. A chart can then show quality before and after each weekly release, and a regression can be traced to the release that caused it. The third is \u003cstrong\u003ealerting with a record\u003c/strong\u003e: thresholds on the indicators, and a log of each alert, when it was raised, who responded, and what was done. This closes the loop from detection to action.\u003c/p\u003e\n\u003cp\u003eThe offline gate remains necessary, but it answers a different question. An archive and a report in general terms are not measurements. See \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e, which describes production monitoring after launch for drift and failures that were not anticipated, and \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/observability\"\u003eObservability with OpenTelemetry\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 35","answerStatus":"source"},{"query":"A document-processing service promises results within four hours. In trials, 97% of Message Batches API jobs finish within one hour, but batches can take up to 24 hours. How can it use batch discounts without missing the deadline?","type":"multiple-choice","options":[{"text":"Use the batch API for the main stream, and tell customers that results now take up to 24 hours.","explanation":"This weakens a promise that customers rely on in order to save cost. A design with a fallback keeps the four-hour promise and most of the saving.","correct":false},{"text":"Send the main stream as batches, and at a set cutoff time process any unfinished requests synchronously.","explanation":"Batch processing gives the 50% discount on the great majority of documents, which finish well inside the window. A monitor checks each batch against a cutoff, for example two and a half hours after submission. Requests that are still unfinished are canceled and sent through the synchronous API, so the four-hour promise is kept for every document.","correct":true},{"text":"Use the batch API for the urgent stream as well, because urgent documents are a small share of the volume.","explanation":"Urgent documents need a result within one minute. Batch processing is asynchronous and gives no guarantee about minutes, so it cannot serve this stream.","correct":false},{"text":"Keep everything on synchronous requests, because any risk of a late result is not acceptable.","explanation":"This pays double for 1.5 million documents a day in order to avoid a risk that can be managed. The data shows that almost all batches finish early, and a fallback covers the remainder.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eSend the main stream as batches, and at a set cutoff time process any unfinished requests synchronously.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThe economics of batch against real-time processing depend on \u003cstrong\u003ehow much delay the work can accept\u003c/strong\u003e. The Message Batches API costs half the standard price and has a processing window of up to 24 hours, with no guarantee of an earlier time, although most batches finish in less than an hour. Work with a four-hour limit is between the two extremes: it can wait, but not for a day.\u003c/p\u003e\n\u003cp\u003eThe design that obtains most of the saving safely is \u003cstrong\u003ebatch first, with a deadline fallback\u003c/strong\u003e. The main stream is submitted as batches as documents arrive. A monitor follows each batch. At a cutoff that leaves enough time, the application cancels the batch, takes the results that are complete, and sends the remaining requests through the synchronous API. Results are matched to documents by \u003ccode\u003ecustom_id\u003c/code\u003e, and each result type (succeeded, errored, canceled, expired) is handled. The urgent stream stays synchronous at all times.\u003c/p\u003e\n\u003cp\u003eThe expected cost is the batch price for the large majority and the standard price for a small remainder, and that share should be measured and reported. The design should also allow for periods of high demand, when batch processing can be slower. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/batch-processing\"\u003eBatch processing\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\"\u003eOptimizing for cost and intelligence\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Cost and Latency Optimization at Scale — source question 36","answerStatus":"source"},{"query":"Concurrent batch requests share a 12,000-token rulebook and default 5-minute cache, but only 30% get cache hits; processing takes up to 50 minutes and request order varies. How can shared cache hits be improved?","type":"multiple-choice","options":[{"text":"Remove the cache breakpoint from batch requests, because the batch discount already reduces the price.","explanation":"The two discounts are applied together. Without caching, every request would pay the batch price for 12,000 rulebook tokens that could have been read at a small fraction of that price.","correct":false},{"text":"Use the 1-hour cache duration with an identical prefix in every request, and write the cache with one synchronous request first.","explanation":"A batch runs for longer than five minutes and processes its requests in any order, so a 5-minute entry often expires between requests. A 1-hour entry lasts for the whole batch. An identical prefix and breakpoint in every request allows all of them to match it, and one synchronous request sent first writes the entry before the batch begins.","correct":true},{"text":"Send each document as a separate batch that contains one request, so that every batch is processed quickly.","explanation":"A million batches of one request each add a very large management cost and do nothing to make requests share a cache entry. The requests would still be processed at unpredictable times.","correct":false},{"text":"Place the document before the rulebook in each request, so that the rulebook is nearer to the end of the prompt.","explanation":"The cache matches a prefix. If each request begins with a different document, no two requests share a prefix, and the rulebook could never be read from the cache.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eUse the 1-hour cache duration with an identical prefix in every request, and write the cache with one synchronous request first.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003ePrompt caching and batch processing \u003cstrong\u003ecombine\u003c/strong\u003e: a cache read inside a batch receives both price reductions. Batch requests are processed concurrently and in any order, however, so cache hits are \u003cstrong\u003ebest-effort\u003c/strong\u003e. The documentation gives typical hit rates from 30% to 98%, depending on how the requests are built. A result of 30% indicates that the configuration can be improved.\u003c/p\u003e\n\u003cp\u003eThree practices raise the rate. First, use the \u003cstrong\u003e1-hour cache duration\u003c/strong\u003e. A batch often runs for longer than 5 minutes, and the documentation recommends the longer duration for content shared across a batch. Second, make the prefix \u003cstrong\u003eidentical\u003c/strong\u003e in every request: the same rulebook text, in the same position, with the same \u003ccode\u003ecache_control\u003c/code\u003e block. Third, \u003cstrong\u003ewrite the cache before the batch starts\u003c/strong\u003e. An entry can be read only after the first response that writes it has begun, so many requests that start together may all miss. A single synchronous request with the rulebook, sent before submission, writes the entry in advance. This warm-up is a design choice and not documented batch guidance; the documented advice is to use the 1-hour cache duration and identical prefixes. This warm-up request cannot be placed inside the batch, because a request with \u003ccode\u003emax_tokens\u003c/code\u003e of zero is not accepted there.\u003c/p\u003e\n\u003cp\u003eFor 1.5 million documents a day, the difference between a 30% and a 95% read share on a 12,000-token prefix is a large part of the bill. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/batch-processing\"\u003eBatch processing\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\"\u003ePrompt caching\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Cost and Latency Optimization at Scale — source question 37","answerStatus":"source"},{"query":"A smaller extraction model costs one-fifth as much and passes deterministic validation on 92% of documents; the remaining 8% fail. A capable model is available for retries. Which routing strategy reduces cost without lowering validated quality?","type":"multiple-choice","options":[{"text":"Extract with the smaller model first, and run only the documents that fail validation again on the more capable model.","explanation":"The validation code is a reliable checker, so a cascade is safe. The smaller model handles the 92% that pass at a fifth of the cost. Only the 8% that fail are sent to the more capable model. The total cost is far lower than with the capable model for everything, and the validation standard is the same.","correct":true},{"text":"Keep the most capable model for all documents, because 8% of documents fail validation with the smaller model.","explanation":"This pays the highest price for all documents in order to avoid a second attempt on 8% of them. The validation code makes the failures visible, so they can be handled separately.","correct":false},{"text":"Move all documents to the smaller model, and accept the extractions that fail validation as they are.","explanation":"Accepting extractions that are known to be invalid would send wrong data to customs and to customers. The failures need a second step.","correct":false},{"text":"Run every document on both models, and keep the result from the more capable model when the two differ.","explanation":"Running both models on every document costs more than the capable model alone. The cascade needs the second model only when the first result fails a check.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eExtract with the smaller model first, and run only the documents that fail validation again on the more capable model.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA \u003cstrong\u003ecascade\u003c/strong\u003e is a routing strategy that tries the inexpensive option first and escalates only when necessary. It depends on a \u003cstrong\u003ereliable checker\u003c/strong\u003e: a way to know, for each item, whether the inexpensive result is good enough. Nimbus already has one. The validation code tests totals, check digits, and required fields, and it produces a clear pass or fail.\u003c/p\u003e\n\u003cp\u003eThe arithmetic is simple. With the smaller model at about one fifth of the cost and a 92% pass rate, the cascade costs about 0.2 plus 0.08, or roughly 28% of the cost of the capable model for everything. Anthropic's cost guidance describes this pattern and reports a similar result for effort levels: with a checker, running at the low setting and running only the failures again at the high setting cost substantially less than running everything at the high setting, with the same pass rate. The guidance also recommends comparing options by \u003cstrong\u003ecost for each completed task\u003c/strong\u003e, which is the calculation shown here.\u003c/p\u003e\n\u003cp\u003eThe checker has limits. It detects structural and arithmetic errors, but it does not detect a field that is wrong and still plausible. Quality on a labeled sample should therefore be measured for both paths. See \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\"\u003eOptimizing for cost and intelligence\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/overview\"\u003eModels overview\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Cost and Latency Optimization at Scale — source question 38","answerStatus":"source"},{"query":"A burst of document uploads triples intake, creating an unlimited queue that will break a four-hour completion promise without warning customers. What capacity-aware intake control is needed?","type":"multiple-choice","options":[{"text":"Admission control that compares queue depth with capacity and reports an expected time.","explanation":"Backpressure means that when the system cannot keep up, this is communicated to the source of the work and is not hidden in a growing queue. A comparison of the queue with the measured processing rate shows whether a new document can be finished in time. The customer receives an honest estimate, and intake is slowed before the promise is broken.","correct":true},{"text":"A larger queue with more storage, so that no upload is ever rejected.","explanation":"The queue already has no limit, and storage is not the difficulty. More capacity to hold documents does not process them faster or tell customers anything.","correct":false},{"text":"A fixed limit of 100 documents for each customer for each day, at all times.","explanation":"A fixed limit restricts customers on normal days, when capacity is available, and it is not related to the actual load on a busy day. Admission should depend on the current state of the system.","correct":false},{"text":"An automatic email that apologizes to each customer after the four-hour promise has been broken.","explanation":"An apology afterward does not help a customer to plan. The system has the information to give a warning at the time of upload.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eAdmission control that compares queue depth with capacity and reports an expected time.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA queue with no limit turns overload into \u003cstrong\u003ehidden latency\u003c/strong\u003e. Every upload is accepted, nothing fails at once, and the failure appears hours later as a broken promise. \u003cstrong\u003eBackpressure\u003c/strong\u003e is the opposite design: when demand is greater than capacity, the system communicates this to the source of the work early.\u003c/p\u003e\n\u003cp\u003eFor a pipeline with a fixed processing capacity, which is set by the model rate limits and the batch throughput, the method is \u003cstrong\u003eadmission control\u003c/strong\u003e. The system knows its current queue depth and its measured processing rate, so it can estimate when a new document will be finished. If the estimate is inside the promise, the document is accepted and the customer sees the expected time. If it is not, the system gives an honest later estimate, asks the customer to mark which documents are really urgent, or slows intake. Priority classes ensure that the one-minute stream always has capacity reserved for it.\u003c/p\u003e\n\u003cp\u003eThe same analysis shows the \u003cstrong\u003ebinding constraint\u003c/strong\u003e. If the processing rate is limited by per-minute token limits, the remedy is a higher limit or more use of batch processing. If it is limited by the batch queue, the remedy is different. See \u003ca href=\"https://platform.claude.com/docs/en/api/rate-limits\"\u003eRate limits\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/batch-processing\"\u003eBatch processing\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 39","answerStatus":"source"},{"query":"An asynchronous batch of 80,000 requests has errors and expirations. The app assumes results arrive in submission order and misassigns extractions after the first failure. How should it associate outcomes with documents?","type":"multiple-choice","options":[{"text":"Submit documents in batches of one, so that the order of results can never be wrong.","explanation":"Batches of one remove the ordering problem by removing batching, with a very large management cost. The intended mechanism for matching results is simpler.","correct":false},{"text":"Match each result to its document by custom_id, and handle each result type.","explanation":"Results from a batch are not guaranteed to be in submission order, and each request succeeds or fails independently. The custom_id that is set on each request is the supported way to connect a result to its document. The code must also read the type of each result and resubmit the requests that errored for a temporary reason or expired.","correct":true},{"text":"Sort the results by the time at which each one was completed, and assign them to documents in that order.","explanation":"Requests in a batch are processed concurrently, so the order of completion has no relation to the order of submission. This would produce a different wrong assignment.","correct":false},{"text":"Run every batch twice, and use only the results that are the same in both runs.","explanation":"Two runs double the cost and still do not show which result belongs to which document. Errored and expired requests would also still need handling.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eMatch each result to its document by custom_id, and handle each result type.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA batch is a set of \u003cstrong\u003eindependent requests\u003c/strong\u003e and not an ordered list. The documentation states that results can be returned in any order and that a failure in one request does not affect the others. Two rules for reading results follow from this.\u003c/p\u003e\n\u003cp\u003eFirst, \u003cstrong\u003ematch by \u003ccode\u003ecustom_id\u003c/code\u003e\u003c/strong\u003e. Each request in a batch carries a \u003ccode\u003ecustom_id\u003c/code\u003e that the application chooses and that is unique in the batch. A document identifier is a suitable value. Each line of the results file contains that ID, and it is the only reliable connection between a result and its source. Second, \u003cstrong\u003ehandle each result type\u003c/strong\u003e. A result is \u003ccode\u003esucceeded\u003c/code\u003e, \u003ccode\u003eerrored\u003c/code\u003e, \u003ccode\u003ecanceled\u003c/code\u003e, or \u003ccode\u003eexpired\u003c/code\u003e. Errored results carry an error: an invalid request must be corrected before it is sent again, and other errors can be retried directly. Expired requests did not reach the model within 24 hours and should be submitted again. Only succeeded requests are billed.\u003c/p\u003e\n\u003cp\u003eA succeeded result still has a \u003ccode\u003estop_reason\u003c/code\u003e that must be checked. A response that ended because it reached the output limit is truncated, and a refused request appears as succeeded with a refusal stop reason. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/batch-processing\"\u003eBatch processing\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons\"\u003eStop reasons and fallback\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 40","answerStatus":"source"},{"query":"Before a Claude model is retired, an extraction workflow must migrate. The new model's notes require replacing forced specific-tool calls with automatic choice plus strict tool use. An engineer proposes changing only the model ID. What's the safer plan?","type":"multiple-choice","options":[{"text":"Change the model name and release, and correct any problems that customers report during the following week.","explanation":"The migration notes describe a change that affects the way every extraction request is built. Releasing without tests makes customers and customs filings the test.","correct":false},{"text":"Remain on the current model after its retirement date, in order to avoid changing the requests.","explanation":"A retired model stops serving requests, so remaining on it is not possible. Deprecation notices give time for a planned migration.","correct":false},{"text":"Update the requests as the migration notes describe, and run the full evaluation on the new model.","explanation":"A model migration can include breaking changes to request parameters as well as changes in behavior. The notes name one that affects this pipeline directly. The requests should be changed as documented, the evaluation suite should confirm field-level accuracy and structural validity on the new model.","correct":true},{"text":"Remove the tool from the requests, and ask the new model to return the fields as plain text.","explanation":"Plain text gives up the guaranteed structure that the validation code and downstream systems depend on. The notes recommend a structured alternative, not the removal of structure.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eUpdate the requests as the migration notes describe, and run the full evaluation on the new model.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA model migration is a \u003cstrong\u003echange project\u003c/strong\u003e with three kinds of risk. The first is \u003cstrong\u003ebreaking changes to the API surface\u003c/strong\u003e: parameters and features that a new model no longer accepts or handles differently. In this scenario, the migration notes describe one. Requests that force a particular tool are to be replaced with automatic tool choice and \u003cstrong\u003estrict tool use\u003c/strong\u
