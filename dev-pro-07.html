003e, in which the tool input is guaranteed to match the schema. The second is \u003cstrong\u003ebehavioral change\u003c/strong\u003e: the new model may follow instructions more literally or format output differently. The third is \u003cstrong\u003eoperational change\u003c/strong\u003e: different rate limits, prices, and latency.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eMigration testing\u003c/strong\u003e covers each of these. Read the migration guide for the target model and apply the documented request changes. Run the complete evaluation suite on the new model and compare the results field by field with the current model, including structural validity, because a structure that is no longer forced must be shown to hold. Then release with a \u003cstrong\u003estaged rollout\u003c/strong\u003e on a share of traffic, with a path for rollback while the old model is still available. The work should start well before the published retirement date and not in the final week.\u003c/p\u003e\n\u003cp\u003eSee \u003ca href=\"https://platform.claude.com/docs/en/about-claude/model-deprecations\"\u003eModel deprecations\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/strict-tool-use\"\u003eStrict tool use\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/structured-outputs\"\u003eStructured outputs\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 41","answerStatus":"source"},{"query":"A fixed classify–extract–validate workflow handles 94% of shipments, but unusual handwritten and combined documents repeatedly fail and need human review. What architecture best handles both standard and exceptional cases?","type":"multiple-choice","options":[{"text":"Keep the workflow for standard documents, and add an agent with tools for the unusual ones, with human review of its results.","explanation":"The standard documents follow steps that are known in advance, which is the case for a workflow. The unusual ones need steps that depend on what the document turns out to contain, such as dividing a bundle or finding an earlier shipment. An agent with tools can decide these steps. Sending only the 6% to it, with human review while it is being measured, adds flexibility where the data shows a need.","correct":true},{"text":"Replace the workflow with an autonomous agent for all documents, so that every document receives flexible handling.","explanation":"The fixed workflow handles 94% of documents well, at a predictable cost. An agent for all documents would add cost and variation to the large majority that do not need it.","correct":false},{"text":"Add more fixed steps to the workflow, with one new branch for every kind of unusual document that has been seen.","explanation":"The unusual documents vary in ways that cannot be predicted. A new fixed branch for each case would grow without end and would still miss the next new kind.","correct":false},{"text":"Keep the architecture unchanged, and hire more people for the team that handles the unusual documents.","explanation":"More people handle the present volume at a rising cost, and the cost grows with the business. The data suggests that part of this work can be automated.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eKeep the workflow for standard documents, and add an agent with tools for the unusual ones, with human review of its results.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eArchitecture should \u003cstrong\u003echange in response to production data\u003c/strong\u003e, and the change does not have to be a choice between two extremes. Anthropic's guidance distinguishes \u003cstrong\u003eworkflows\u003c/strong\u003e, in which code defines the path, from \u003cstrong\u003eagents\u003c/strong\u003e, in which the model directs its own steps. It recommends the simplest design that works and more autonomy only where it gives a clear benefit. The data here shows where that benefit is.\u003c/p\u003e\n\u003cp\u003eFor the 94% of standard documents, the steps are the same every time. A workflow gives predictable cost, stable latency, and simple debugging, and nothing would be gained by replacing it. For the 6% of unusual documents, the steps \u003cstrong\u003ecannot be listed in advance\u003c/strong\u003e. A bundle has to be divided, a handwritten amendment has to be reconciled with the printed text, and a reference to an earlier shipment requires a lookup. That is the kind of task that suits an agent with tools. The workflow's own validation failures identify which documents to send to it.\u003c/p\u003e\n\u003cp\u003eThe new path should be introduced with care. Its results are reviewed by the existing team at first, and its accuracy and its cost for each document are measured against manual handling. See \u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\"\u003eBuilding effective agents\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\"\u003eOptimizing for cost and intelligence\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 42","answerStatus":"source"},{"query":"Engineers receive 340 varied copilot complaints—bad dates, refusals, language errors, wrong tools, and slowness—but prioritize their personal annoyances. Traces exist. How should the team decide what to fix first?","type":"multiple-choice","options":[{"text":"Roll back all three changes from two weeks ago, and release them again together next month.","explanation":"A rollback may be justified if the harm is severe, but releasing the same three changes together later would bring back the same problems. The team would still not know which problems matter most or what causes them.","correct":false},{"text":"Ask the model to read all 340 complaints and to state the single root cause.","explanation":"The complaints describe several different problems, so one root cause probably does not exist. A summary by a model is also not a count, and it is not connected to what the traces show.","correct":false},{"text":"Continue with the present approach, in which each engineer works on a different problem, because all of the problems need fixing.","explanation":"Effort chosen by personal preference may go to rare problems while frequent ones continue. Without counts, nobody knows which fix will reduce complaints the most.","correct":false},{"text":"Link a sample of complaints to their traces, sort the failures into categories, and count how many fall in each.","explanation":"With many different symptoms, the first step is to understand how the failures are distributed. Reading the trace behind each sampled complaint and giving it a category produces a list of failure types with counts. The team can then work on the most frequent and most harmful categories first.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eLink a sample of complaints to their traces, sort the failures into categories, and count how many fall in each.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eWhen a system fails in many ways at once, the first task is \u003cstrong\u003eclassification\u003c/strong\u003e. A \u003cstrong\u003efailure taxonomy\u003c/strong\u003e is built by taking a sample of failing cases, reading the trace for each one, and assigning a category that describes what went wrong: wrong date calculated, wrong tool selected, declined a legitimate question, replied in the wrong language, and so on. The categories come from the evidence and are refined as more cases are read. Counting the cases in each category then turns a confusing set of complaints into a list of priorities.\u003c/p\u003e\n\u003cp\u003eThis is failure-cohort analysis for diagnosis. It usually shows that a small number of categories account for most of the complaints, and that each category has a different origin: a prompt, a tool, the data, or the harness. Each can then be investigated properly. The taxonomy also provides the labels for later monitoring and the cases for a regression suite.\u003c/p\u003e\n\u003cp\u003eAnthropic's evaluation guidance recommends the same practice: read many transcripts to understand how a system fails before deciding what to change or measure. A fix without counts is a guess. See \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Debugging and Incident Response — source question 43","answerStatus":"source"},{"query":"A council agent books 'next Tuesday' in the wrong week, especially near month-end. Its prompt lacks today's date, and its booking tool accepts unchecked dates. Where should relative-date handling be fixed?","type":"multiple-choice","options":[{"text":"The model is weak at calendar arithmetic. Move the agent to a more capable model.","explanation":"Any model has to guess the date if it is not told, and a stronger model would guess as well. The missing input is the problem, not the reasoning.","correct":false},{"text":"Residents phrase dates unclearly. Require them to choose a date from a calendar before they can chat.","explanation":"\"Next Tuesday\" is a clear and normal request. A compulsory calendar would correct this one case by making the service harder to use, and the agent would still not know the date for other questions.","correct":false},{"text":"The booking tool is too permissive. Have it reject every date that is more than seven days in the future.","explanation":"A range check would stop some wrong bookings, but it would also reject legitimate bookings for later dates, and a wrong date within seven days would still pass.","correct":false},{"text":"The harness does not supply the current date. Provide it, and resolve relative dates in code.","explanation":"The agent cannot know which day it is unless the request states it, so \"next Tuesday\" is calculated from a guess. The guess varies, which explains the different results. Providing the current date and time zone removes the guess. Converting phrases such as \"next Tuesday\" to a date in the tool's code makes the result exact.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe harness does not supply the current date. Provide it, and resolve relative dates in code.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA model does not know the current date. If the harness does not supply it, the model estimates it, and the estimate can differ from one run to the next. Any task that depends on \u0026quot;today\u0026quot; then becomes \u003cstrong\u003enon-deterministic\u003c/strong\u003e in a way that looks like a reasoning error and is in fact a \u003cstrong\u003emissing input\u003c/strong\u003e. The pattern in the evidence, with different answers to the same request and more errors near the end of a month, is typical.\u003c/p\u003e\n\u003cp\u003eThe origin is the \u003cstrong\u003eharness\u003c/strong\u003e, which builds the request. The fix has two parts. First, \u003cstrong\u003esupply the current date and time zone\u003c/strong\u003e in every request. To keep prompt caching effective, a value that changes each day belongs at the end of the newest user turn or in a message that is appended, and not at the top of the cached system prompt. Second, move date arithmetic into \u003cstrong\u003ecode\u003c/strong\u003e where that is possible. The tool can accept a phrase such as \u0026quot;next Tuesday\u0026quot; together with the reference date and return the resolved date for the agent to confirm with the resident. Deterministic work should be done by deterministic code.\u003c/p\u003e\n\u003cp\u003eA validation rule in the booking tool is a reasonable additional layer, but it does not supply the missing fact. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\"\u003ePrompt caching\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/writing-tools-for-agents\"\u003eWriting effective tools for agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Debugging and Incident Response — source question 44","answerStatus":"source"},{"query":"After adding 'Never give legal advice' to a council copilot's prompt, it refuses routine council-tax questions with normal text and stop_reason 'end_turn'. What is the likely diagnosis and correction?","type":"multiple-choice","options":[{"text":"A safety classifier is declining these requests, so the team should configure a fallback model for refusals.","explanation":"A refusal by the model's safety systems is reported with the stop reason \"refusal.\" These responses end normally with text, so that mechanism is not involved, and a fallback model would receive the same instruction.","correct":false},{"text":"The cloud platform is blocking the requests, so the team should move the agent to another platform.","explanation":"A block by the platform would appear as an error or as a different stop reason. It would not appear as a normal completion with a polite sentence written by the model.","correct":false},{"text":"The new prompt sentence is too broad and the model applies it to these questions, so the instruction should be narrowed with examples.","explanation":"The responses end normally, so the model is following its instructions and declining in its own words. The new sentence about legal advice is broad, and the model reads questions about unpaid tax as legal questions. The instruction should state what is meant, with examples of council information that the agent should give.","correct":true},{"text":"The residents' questions are inappropriate, so the agent's behavior is correct and nothing should change.","explanation":"A question about what happens when council tax is unpaid is one of the most common questions for a council. Declining it sends residents to the telephone and causes the complaints.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe new prompt sentence is too broad and the model applies it to these questions, so the instruction should be narrowed with examples.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThe term \u0026quot;refusal\u0026quot; covers \u003cstrong\u003etwo different mechanisms\u003c/strong\u003e, and the diagnosis depends on distinguishing them. An \u003cstrong\u003eAPI-level refusal\u003c/strong\u003e is produced by the model's safety systems. It is reported with \u003ccode\u003estop_reason: \u0026quot;refusal\u0026quot;\u003c/code\u003e, often with no content, and it is handled with a fallback path. A \u003cstrong\u003emodel declining in text\u003c/strong\u003e is ordinary output. The response completes with \u003ccode\u003eend_turn\u003c/code\u003e, and the model, following its instructions as it understands them, writes that it cannot help.\u003c/p\u003e\n\u003cp\u003eThe stop reason in the trace settles the matter here. These are normal completions, so the cause is in the \u003cstrong\u003eprompt\u003c/strong\u003e. The sentence \u0026quot;Never give legal advice\u0026quot; was added two weeks ago and has no stated scope. Current models follow instructions precisely, and a broad prohibition is applied broadly. The fix is to say what is intended: the agent should explain the council's published procedures, including what happens when a bill is unpaid, and should not interpret the law for an individual's dispute. Examples on both sides of the line, with the reason for the rule, help the model to apply it correctly.\u003c/p\u003e\n\u003cp\u003eTreating this as a safety refusal would send the team to fallback models and to the platform, where nothing is wrong. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons\"\u003eStop reasons and fallback\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback\"\u003eRefusals and fallback\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-engineering/claude-prompting-best-practices\"\u003eClaude prompting best practices\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Debugging and Incident Response — source question 45","answerStatus":"source"},{"query":"A council-tax agent starts calling a new parking-account tool because both it and the existing council-tax tool have vague, overlapping names and descriptions. How should this tool-choice problem be resolved?","type":"multiple-choice","options":[{"text":"The two tools have overlapping names and descriptions. Rename them, and state when each applies.","explanation":"The model chooses a tool from its name and description. Two tools that both \"look up an account\" give it nothing to distinguish them, so the choice is unreliable. Names that state the domain, and descriptions that say what each tool is for and what it is not for, remove the ambiguity at its source.","correct":true},{"text":"The model selects tools at random under load. Add a retry so that a second attempt selects the correct tool.","explanation":"The selection is not random. It follows from two tools that look the same to the model. A retry would meet the same ambiguity and would add delay and cost.","correct":false},{"text":"The prompt needs a rule. Add \"For council tax, always use get_account\" to the system prompt.","explanation":"A rule in the prompt can reduce this one confusion, but the two tools would still describe themselves in almost the same words. The next similar tool would cause the same problem.","correct":false},{"text":"The parking tool is faulty. Remove it, and handle parking questions by telephone.","explanation":"The parking tool works correctly when it is called for parking questions. Removing it would take away a function that residents use in order to avoid a problem with descriptions.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe two tools have overlapping names and descriptions. Rename them, and state when each applies.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA model chooses among tools mainly from their \u003cstrong\u003enames and descriptions\u003c/strong\u003e. When a new tool is added with a description that overlaps an existing one, tool selection becomes ambiguous for the whole agent. The timing in the evidence shows this. The council tax tool worked until the parking tool arrived, and the existing tool was not changed.\u003c/p\u003e\n\u003cp\u003eThe origin is the \u003cstrong\u003etool definitions\u003c/strong\u003e, and the fix is made there. Anthropic's guidance on defining tools calls detailed descriptions the most important factor in tool performance. A description should say what the tool does, when it should be used, and when it should not be used. Names should also state the domain: for example \u003ccode\u003eget_council_tax_account\u003c/code\u003e and \u003ccode\u003elookup_parking_permit_account\u003c/code\u003e, with descriptions such as \u0026quot;Use for questions about council tax bills and balances. Do not use for parking permits.\u0026quot; Anthropic's guidance on writing tools also recommends clear namespaces as the number of tools grows.\u003c/p\u003e\n\u003cp\u003eA rule in the prompt corrects one pair of tools and leaves the general weakness. The incident also gives a process lesson. Connecting a new tool changes the behavior of the existing tools, so the evaluation suite should include tool selection cases and should run whenever a tool is added. See \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools\"\u003eDefine tools\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/writing-tools-for-agents\"\u003eWriting effective tools for agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Debugging and Incident Response — source question 46","answerStatus":"source"},{"query":"Engineers need to compare copilot failures by language and correlate them with prompt and tool releases. Traces currently lack those attributes. What should be added to each trace?","type":"multiple-choice","options":[{"text":"Keep the instrumentation, and assign two more engineers to read conversations and record the language by hand.","explanation":"Manual labeling is slow and inconsistent, and it has to be repeated for every new question. The system knows these values when each request is made and can record them.","correct":false},{"text":"Record language, prompt version, tool versions, and model version as attributes on every trace.","explanation":"These values are known to the application at the time of each request. Recording them as structured attributes makes every trace searchable and countable by them. Questions about language or version then become simple queries.","correct":true},{"text":"Store the full text of every conversation in the trace, so that the language can be detected later.","explanation":"The full text would allow the language to be detected afterward, but it would not give the prompt or tool versions. It also adds residents' personal data to the telemetry store with no need.","correct":false},{"text":"Add the language of each conversation to a spreadsheet that is updated at the end of each week.","explanation":"A weekly spreadsheet is a manual record that is separate from the traces, and it is out of date for most of the week. It also leaves out the prompt and tool versions.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eRecord language, prompt version, tool versions, and model version as attributes on every trace.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eTelemetry can answer only the questions for which it has \u003cstrong\u003edimensions\u003c/strong\u003e. A trace that records what happened, such as tool calls, tokens, and timing, but not \u003cstrong\u003ewhich configuration and which segment\u003c/strong\u003e it belongs to, cannot be grouped in the ways that diagnosis needs. Each new question then requires someone to read conversations.\u003c/p\u003e\n\u003cp\u003eThe fix costs very little, because the application already knows the values. Every trace, and every structured event, should carry \u003cstrong\u003eattributes for configuration\u003c/strong\u003e: prompt version, model version, and the versions of the tools or MCP servers. It should also carry \u003cstrong\u003eattributes for the segment\u003c/strong\u003e: language, channel, type of request, and customer tier where that applies. These are small pieces of metadata. They contain no personal content, and they make cohort analysis a query. The two questions in the scenario then have direct answers, and the attributes also let a dashboard compare quality before and after each release.\u003c/p\u003e\n\u003cp\u003eThe general rule is to decide the attributes when a feature is designed. A Welsh-language option should arrive with a language attribute in the telemetry. See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/observability\"\u003eObservability with OpenTelemetry\u003c/a\u003e and \u003ca href=\"https://code.claude.com/docs/en/monitoring-usage\"\u003eMonitoring\u003c/a\u003e, which describes standard and custom attributes for segmentation.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 47","answerStatus":"source"},{"query":"Welsh messages are only 2% of a council copilot's traffic, so a 41% Welsh resolution rate is hidden by nearly stable overall performance. How can monitoring detect small-language-segment failures early?","type":"multiple-choice","options":[{"text":"Track the indicator for each language, and run scheduled test conversations in Welsh.","explanation":"A segment of 2% is invisible in a total. An indicator for each language makes its quality visible. Because the number of real Welsh conversations is small, scheduled test conversations with known outcomes give a steady signal that does not depend on traffic volume, and they detect a failure on the first day.","correct":true},{"text":"Lower the alert threshold on the overall resolution rate, so that a fall of one point raises an alert.","explanation":"An alert on a one-point change in the overall rate would be raised by normal daily variation and would soon be ignored. It still would not show that the cause was the Welsh segment.","correct":false},{"text":"Wait until Welsh conversations reach 20% of traffic before they are monitored separately.","explanation":"The duty to provide an equal service applies now, at any share of traffic. Waiting would leave the segment unmonitored for as long as it stays small.","correct":false},{"text":"Ask Welsh-speaking residents to fill in a satisfaction survey at the end of each conversation.","explanation":"A survey reaches only the residents who choose to answer, and it arrives after poor service has been given. It adds to monitoring and does not replace it.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eTrack the indicator for each language, and run scheduled test conversations in Welsh.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAn overall indicator is dominated by the largest segments. A segment that is 2% of the traffic can fail almost completely and move the total by about one point, which is inside normal variation. \u003cstrong\u003eIndicators for each segment\u003c/strong\u003e are the only way to see such a failure, and the segments to watch are those that matter for legal, safety, or commercial reasons, whatever their size.\u003c/p\u003e\n\u003cp\u003eSmall segments have a second difficulty: \u003cstrong\u003elow volume\u003c/strong\u003e. With few real conversations each day, the measured rate varies widely, and an alert on it is unreliable. The complement is \u003cstrong\u003esynthetic monitoring\u003c/strong\u003e. A fixed set of test conversations in Welsh, with known correct outcomes, is run through the production system on a schedule. The results do not depend on traffic, they can be compared from day to day, and a failure raises an alert at once. The same set can be run before the release of any change, as a gate for that segment.\u003c/p\u003e\n\u003cp\u003eFor a legal duty of equal service, the release criteria and the monitoring should both be stated for each language. A lower threshold on the overall rate produces false alerts, and a survey measures only those who respond. See \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e and \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/observability\"\u003eObservability with OpenTelemetry\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 48","answerStatus":"source"},{"query":"A council will release prompt, tool-name, and Welsh-language changes. It wants to limit impact, attribute regressions to a change, and keep an active conversation on one version. What rollout strategy should it use?","type":"multiple-choice","options":[{"text":"Release all three changes to all residents at 2 AM, when few residents are using the service.","explanation":"A release at night reduces the number of users at first, but every resident receives all three changes by morning. A fault would still reach everyone, and its cause would still be unclear.","correct":false},{"text":"Release the three changes to the staff of the council only, and never to residents.","explanation":"An internal trial is a useful first stage, but a release that never reaches residents delivers none of the improvements. The process needs further stages.","correct":false},{"text":"Release all three changes together to half of the residents, and compare complaints after one month.","explanation":"Half of all residents is a large exposure for a first step, a month is a long time to wait, and with three changes combined a fault could still not be traced to its cause.","correct":false},{"text":"Release each change separately behind a flag, to a small share of new conversations first.","explanation":"Separate flags mean that a fault can be traced to one change and that one change can be reversed alone. A small share of traffic limits the number of residents affected. Assigning the version when a conversation starts keeps each conversation on one version from start to finish.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eRelease each change separately behind a flag, to a small share of new conversations first.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eProgressive delivery\u003c/strong\u003e for an agent has the same aims as for any service: limit the effect of a bad change, find it quickly, and reverse it easily. Four practices achieve this. \u003cstrong\u003eOne change at a time\u003c/strong\u003e: each change (prompt, tool definitions, language configuration) has its own version and its own flag, so that a regression has one possible cause and one switch. \u003cstrong\u003eStaged exposure\u003c/strong\u003e: internal users first, then a small percentage of real traffic as a canary, then wider release, with the quality indicators for each segment compared at every stage. \u003cstrong\u003eRollback criteria fixed in advance\u003c/strong\u003e: for example, \u0026quot;if the resolution rate in the canary is three points below the control for an hour, turn the flag off.\u0026quot; \u003cstrong\u003eRecorded versions\u003c/strong\u003e: every trace carries the versions that were in use.\u003c/p\u003e\n\u003cp\u003eConversational agents need one more rule: \u003cstrong\u003eassign the version for each conversation and not for each request\u003c/strong\u003e. If a conversation changes prompt or tool versions in the middle, the resident sees inconsistent behavior, the results of the comparison are mixed, and the prompt cache for that conversation is lost, because the prefix changes.\u003c/p\u003e\n\u003cp\u003eA release at night and a release to half of all residents change the timing or the size of the exposure, but they do not make the cause of a fault clear or the rollback fast. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\"\u003ePrompt caching\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\"\u003eOptimizing for cost and intelligence\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 49","answerStatus":"source"},{"query":"A hotel agent routes each guest message to only one specialist. A guest asking for dinner and late checkout gets the dinner booking but loses the checkout request. How should orchestration handle multiple intents?","type":"multiple-choice","options":[{"text":"Add a fifth specialist that is called \"general\" and that receives every message with more than one request.","explanation":"One general specialist for all combined requests would need the tools and instructions of all the others. This removes the benefit of having specialists and creates one very large prompt.","correct":false},{"text":"Have the orchestrator divide a message into its requests, and send each to the right specialist.","explanation":"A message can contain several tasks, so one label is the wrong unit. An orchestrator that first identifies each request, delegates each one to the specialist for it, and then joins the answers into one reply handles any combination. Independent requests can also be processed at the same time.","correct":true},{"text":"Ask guests in the welcome message to send only one request in each message.","explanation":"This puts the system's limitation on the guest. People naturally combine requests, and a concierge service is expected to handle that.","correct":false},{"text":"Have the router choose the label of the request that appears first in the message, and ignore the remainder.","explanation":"This makes the present fault into a rule. The second request would always be dropped.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eHave the orchestrator divide a message into its requests, and send each to the right specialist.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eRouting\u003c/strong\u003e and \u003cstrong\u003eorchestration\u003c/strong\u003e are different patterns. A router classifies an input and sends it down one path. This works when each input is one kind of task. An \u003cstrong\u003eorchestrator\u003c/strong\u003e breaks an input into subtasks, delegates each to a worker, and combines the results. This is needed when an input can contain several tasks, or tasks that cannot be predicted in advance. Anthropic's guidance on agent patterns describes both and notes that the orchestrator-workers pattern suits inputs in which the subtasks depend on the particular input.\u003c/p\u003e\n\u003cp\u003eThe data here, 15% of messages with more than one request, shows that classification into one label does not fit the traffic. The orchestrator's first step becomes \u003cstrong\u003edecomposition\u003c/strong\u003e: list the separate requests in the message. Each request is then delegated to its specialist with the context that it needs. Requests that do not depend on each other, such as dinner and late checkout, can be dispatched \u003cstrong\u003ein parallel\u003c/strong\u003e. The orchestrator then writes one reply that covers every request, including any that could not be completed.\u003c/p\u003e\n\u003cp\u003eA specialist for everything recreates one large agent, and a rule that selects one request guarantees that the others are lost. See \u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\"\u003eBuilding effective agents\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/multi-agent-research-system\"\u003eHow we built our multi-agent research system\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 50","answerStatus":"source"},{"query":"A hotel agent stores old preferences such as 'vegetarian' without dates or sources and treats third-party comments as guest facts. A guest's preferences have since changed. How should memory entries be managed?","type":"multiple-choice","options":[{"text":"Treat every memory entry as a firm rule that takes priority over what the guest says in the current conversation.","explanation":"This is how the copilot behaved with the returning guest. An old entry was placed above a clear present request, which is the cause of the complaint.","correct":false},{"text":"Store each entry with its date and source, and treat entries as information to confirm with the guest.","explanation":"A preference is a fact about a person at a point in time. Recording when and how each entry was learned lets the copilot judge how much weight to give it. Old or uncertain entries are confirmed with the guest, and what the guest says now takes priority and updates the memory.","correct":true},{"text":"Delete the guest memory feature, so that the copilot never uses information from an earlier stay.","explanation":"Memory of real preferences and allergies is valuable to guests and to the hotel. The fault is in how entries are stored and applied, and it can be corrected.","correct":false},{"text":"Store the complete transcript of every stay, and load all of it at the start of each new conversation.","explanation":"Complete transcripts are large, and they include passing remarks that are not preferences. The copilot would have more unverified material to apply wrongly, at a high cost in tokens.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eStore each entry with its date and source, and treat entries as information to confirm with the guest.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003ePersistent memory needs a \u003cstrong\u003epolicy\u003c/strong\u003e as well as a store. Three questions shape it: what may be written, how reliable each entry is, and how entries are applied. The memory here failed on the second and third. Entries had no date and no source, and all of them were applied as firm rules.\u003c/p\u003e\n\u003cp\u003eA sound design treats each entry as a \u003cstrong\u003estatement with provenance\u003c/strong\u003e: what was said, when, by whom, and in what context. The copilot can then reason about it. A dietary preference that the guest stated directly last month deserves more weight than an inference from two years ago. Entries are applied as \u003cstrong\u003einformation\u003c/strong\u003e. The copilot uses them to offer something or to confirm (\u0026quot;Last time you asked for vegetarian options. Is that still your preference?\u0026quot;), and \u003cstrong\u003ethe present conversation takes priority\u003c/strong\u003e. When a guest contradicts an entry, the entry is updated. Entries also need rules for writing: explicit statements by the guest about themselves are stored, and inferences or remarks about other people are not.\u003c/p\u003e\n\u003cp\u003eEntries that matter for safety, such as allergies, justify a stricter class: they are always shown to the specialist and confirmed before food is ordered. See \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool\"\u003eMemory tool\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\"\u003eEffective context engineering for AI agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 51","answerStatus":"source"},{"query":"A hotel copilot's context is cluttered with old tool outputs, while editing its top-level system prompt for daily notices causes cache misses across active sessions. Which TWO changes reduce token costs without losing useful context? (Select TWO.)","type":"multiple-choice","options":[{"text":"Clear old tool results, such as menus, from the context when it passes a threshold.","explanation":"This is correct. Old menus and lists of times are large, out of date, and easy to fetch again. Clearing them with context editing when the context passes a threshold reduces the input tokens for every later message, and the record that the calls were made is kept.","correct":true},{"text":"Send every restaurant menu and list of times again with each message, so that the copilot always has current information.","explanation":"This is incorrect. Sending all menus with every message would multiply the input tokens. The copilot can fetch a menu at the time it is needed.","correct":false},{"text":"Deliver hotel notices as system messages appended to the conversation, and leave the top-level system prompt unchanged.","explanation":"This is correct. An edit to the top-level system prompt changes the cached prefix near its start, so the whole conversation has to be written to the cache again. A system message appended at the end of the messages leaves the prefix unchanged, so earlier content is still read from the cache.","correct":true},{"text":"Raise max_tokens for each response, so that the copilot has room to repeat earlier details.","explanation":"This is incorrect. The output limit does not reduce the input that has built up, and repeating details in responses would add more tokens to the conversation.","correct":false},{"text":"Start a new conversation with no history every morning, so that the context is always small.","explanation":"This is incorrect. A daily reset keeps the context small by discarding what the copilot knows about the stay, such as bookings already made. Selective clearing and stored notes keep that knowledge.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answers:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eClear old tool results, such as menus, from the context when it passes a threshold.\u003c/li\u003e\u003cli\u003eDeliver hotel notices as system messages appended to the conversation, and leave the top-level system prompt unchanged.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eTwo separate sources of cost appear in a conversation that lasts for days, and each has its own technique. The first is \u003cstrong\u003eaccumulated tool results\u003c/strong\u003e. Results from early in the stay are large and mostly out of date, and they are sent again with every message. \u003cstrong\u003eContext editing\u003c/strong\u003e addresses this. The tool result clearing strategy removes older tool results when the context passes a configured threshold and keeps a record that the calls happened. Results that can be fetched again are the best candidates. Anything that must be kept, such as a confirmed booking, should be in notes or memory before it is cleared.\u003c/p\u003e\n\u003cp\u003eThe second is \u003cstrong\u003ecache invalidation by edits to the system prompt\u003c/strong\u003e. The cache matches a prefix in the order tools, system prompt, messages. A change to the top-level system prompt invalidates everything after it, for every active conversation. On supported models, the \u003cstrong\u003ecache-safe\u003c/strong\u003e alternative is a \u003cstrong\u003emid-conversation system message\u003c/strong\u003e: an entry with the system role that is appended to the messages array at the point where the notice starts to apply. The earlier prefix is unchanged and is still read from the cache. Anthropic's cost guidance notes that mid-conversation changes cost many times more when they are made in the system prompt.\u003c/p\u003e\n\u003cp\u003eSee \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/context-editing\"\u003eContext editing\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/mid-conversation-system-messages\"\u003eMid-conversation system messages and tool changes\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/prompt-caching\"\u003ePrompt caching\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect TWO answers.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 52","answerStatus":"source"},{"query":"After scaling a hotel's orchestration service from 2 to 12 instances, guests lose pending bookings and must repeat details because conversation state lives only in each server's memory. What should change?","type":"multiple-choice","options":[{"text":"The load balancer is faulty. Replace it with a different product.","explanation":"The load balancer is distributing requests across instances, which is its purpose. The fault is that the application's state cannot follow a request to another instance.","correct":false},{"text":"Twelve instances are too many. Return to two instances with more memory in each.","explanation":"Two instances have the same fault at a lower frequency, and a restart of either one would lose its conversations. They also could not carry the summer load.","correct":false},{"text":"The model forgets earlier messages. Move the copilot to a model with a larger context window.","explanation":"The model receives only what the orchestrator sends. When the request reaches an instance that does not have the history, the history is not sent, so the size of the context window makes no difference.","correct":false},{"text":"State lives in one process. Store conversation state in a shared external store.","explanation":"With 12 instances, a guest's next message usually arrives at an instance that has never seen the conversation. State that is kept in a shared store and loaded by conversation ID can be used by any instance. An instance that restarts or is removed then loses nothing.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eState lives in one process. Store conversation state in a shared external store.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThe Messages API is \u003cstrong\u003estateless\u003c/strong\u003e. The application owns the conversation and sends it with each request. The state of an agent therefore has to be kept somewhere, and where it is kept decides whether the system can scale and survive failures. State in the \u003cstrong\u003ememory of one process\u003c/strong\u003e works with a single instance and fails as soon as requests can reach another instance, or as soon as that process restarts.\u003c/p\u003e\n\u003cp\u003eDurable execution requires \u003cstrong\u003eexternalized state\u003c/strong\u003e. The conversation history, pending actions, and routing state are written to a shared store, such as a database or a cache with persistence, under the conversation ID. Each instance is then \u003cstrong\u003estateless\u003c/strong\u003e: for each request it loads the state, calls the model, writes the new state, and responds. Any instance can serve any guest, instances can be added or removed freely, and a crash loses only the request that was in progress. Pending bookings should also be recorded with idempotency keys, so that a repeated request does not book twice.\u003c/p\u003e\n\u003cp\u003eThis is the same principle that managed harnesses apply with sessions stored on the server. Session affinity in the load balancer would hide the problem and would still lose state at every restart. See \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/how-tool-use-works\"\u003eHow tool use works\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/session-storage\"\u003ePersist sessions to external storage\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/sessions\"\u003eStart a session\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 53","answerStatus":"source"},{"query":"A hotel copilot loops between its dining and room-service specialists, making 180 calls without answering. What safeguards should the orchestrator enforce to stop infinite handoffs?","type":"multiple-choice","options":[{"text":"Limits on handoffs and turns for each request, loop detection, and a fallback to a person.","explanation":"An orchestrator needs conditions for ending that do not depend on the agents' agreement. A maximum number of handoffs and turns for each request stops a loop early. Detecting that the same handoff has occurred before identifies the loop directly. When a limit is reached, the request goes to a person, so the guest receives an answer.","correct":true},{"text":"A larger server timeout, so that the specialists have more time to reach an agreement.","explanation":"The specialists are not converging, so more time would add more calls and more cost. The loop would end only at the new and longer timeout.","correct":false},{"text":"A prompt instruction to each specialist that it must be very sure before it hands a request back.","explanation":"An instruction may reduce the number of handbacks, but two specialists can still each be sure that the request belongs to the other. Nothing would stop the loop when it does occur.","correct":false},{"text":"A rule that hides the cost of these conversations from the daily cost report.","explanation":"Hiding the cost removes the signal and leaves the loop and the unanswered guests. The loop itself has to be prevented.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eLimits on handoffs and turns for each request, loop detection, and a fallback to a person.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAny system in which agents can hand work to each other can form a \u003cstrong\u003edelegation loop\u003c/strong\u003e. Each agent behaves reasonably from its own point of view, and no agent sees the whole pattern. This is a failure between agents and cannot be removed completely by better prompts, so the orchestrator needs \u003cstrong\u003estructural protection\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eThree protections are standard. \u003cstrong\u003eHard limits\u003c/strong\u003e: a maximum number of handoffs, turns, or tokens for each guest request, enforced in code. \u003cstrong\u003eLoop detection\u003c/strong\u003e: the orchestrator records the sequence of handoffs for a request and recognizes a repeat, for example dining to room service to dining. On the second occurrence it stops routing and makes a decision itself or escalates. \u003cstrong\u003eA defined fallback\u003c/strong\u003e: when a limit is reached, the request is passed to a member of staff with the context, and the guest is told. Ending the request without an answer, which is what the timeout did, is the worst outcome.\u003c/p\u003e\n\u003cp\u003eThe loop also points to an unclear boundary between the two specialists, such as a request for dinner to be served in the room. This should be resolved in their instructions, and the orchestrator can decide ownership when a request is handed back. Managed platforms provide similar limits, such as turn limits and session budgets. See \u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\"\u003eBuilding effective agents\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/budgets\"\u003eSession budgets\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 54","answerStatus":"source"},{"query":"A hotel agent calls cancel_reservation with a guest's stay reference to cancel dinner, accidentally canceling the entire hotel stay. What tool-level controls make cancellations safer?","type":"multiple-choice","options":[{"text":"A prompt instruction that tells the copilot to read every cancellation request twice before it calls the tool.","explanation":"The copilot misunderstood which reservation the tool acts on. Reading the request again does not change what the tool does or make the action reversible.","correct":false},{"text":"A daily report to the hotel manager that lists all cancellations made by the copilot on the day before.","explanation":"A report on the following day arrives after the room has been sold to someone else. It records the error and does not prevent it.","correct":false},{"text":"A rule that the copilot may never cancel anything, so that all cancellations are made by telephone.","explanation":"This removes the risk and a useful function with it. Dinner cancellations are frequent and low in risk when the tool is designed safely.","correct":false},{"text":"Separate, narrow cancellation tools, a confirmation that names the item, and a period for undoing it.","explanation":"One tool that can cancel anything makes a wrong target possible. A tool for dining cancellations cannot cancel a room. A confirmation step that states the exact item gives the guest a chance to stop a mistake, and a period in which the cancellation can be reversed makes the action recoverable.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eSeparate, narrow cancellation tools, a confirmation that names the item, and a period for undoing it.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003ePreventing destructive actions\u003c/strong\u003e starts with the design of the tools. A tool that accepts any reference and acts on it immediately puts the whole burden of correctness on the model's choice of argument. Three design choices reduce that risk, and they work together.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eNarrow scope\u003c/strong\u003e: separate tools for separate actions, such as \u003ccode\u003ecancel_dining_reservation\u003c/code\u003e and \u003ccode\u003ecancel_room_booking\u003c/code\u003e. A request about dinner then cannot reach the room booking. The more dangerous tool can have stricter rules or can be withheld from the copilot. \u003cstrong\u003eExplicit confirmation of the target\u003c/strong\u003e: before the action is carried out, the system states exactly what will be canceled (\u0026quot;your table for four at 8 PM tonight at the Harbor Grill\u0026quot;) and waits for the guest to agree. For high-impact actions this is an approval gate, and it is enforced by the harness and not left to the model. \u003cstrong\u003eReversibility\u003c/strong\u003e: where the business permits it, the action is first recorded as pending and can be undone for a short period, so that an irreversible action becomes a recoverable one.\u003c/p\u003e\n\u003cp\u003eInstructions to be careful and reports after the event do not change what the tool can do. See \u003ca href=\"https://www.anthropic.com/engineering/writing-tools-for-agents\"\u003eWriting effective tools for agents\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/define-tools\"\u003eDefine tools\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/permissions\"\u003eAgent SDK permissions\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 55","answerStatus":"source"},{"query":"A hotel copilot's high-effort router adds 2.1 seconds before specialists run, though its job is only to classify a short message. How should models and effort be allocated to meet a 3-second response target?","type":"multiple-choice","options":[{"text":"Remove the specialists, and let the router answer every guest message directly.","explanation":"The specialists provide the quality that guests value. Removing them would sacrifice that quality in order to solve a delay that comes from the routing step.","correct":false},{"text":"Move the specialists to the smallest model, and keep the router on the most capable model.","explanation":"This reduces capability where it is needed and keeps the expensive, slow configuration on the simple step. It is the reverse of what the measurements suggest.","correct":false},{"text":"Run the router on the smallest model at low effort, and keep the specialists unchanged.","explanation":"Identifying the requests in a short message is a simple classification task with a short output. The smallest model at low effort does this much faster and at much lower cost, which removes most of the 2.1 seconds. The specialists keep the configuration that gives their quality.","correct":true},{"text":"Run the router twice in parallel, and use whichever result arrives first.","explanation":"Two calls of the same slow configuration cost twice as much and save very little time. The step is slow because of the model and effort that it uses.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eRun the router on the smallest model at low effort, and keep the specialists unchanged.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eIn a pipeline of several steps, \u003cstrong\u003eeach step should use the least expensive and fastest configuration that performs it well\u003c/strong\u003e. Latency adds up across sequential steps, so a slow first step delays everything after it. The measurements show a simple step, classification with a few words of output, running on the most capable model at high effort.\u003c/p\u003e\n\u003cp\u003eAnthropic's latency guidance recommends the smallest model in the family for work where speed is critical, and describes \u003cstrong\u003eeffort\u003c/strong\u003e as its main control for speed and cost, with the low level being the fastest. Routing is a typical case: a short input, a small set of possible outputs, and a result that is easy to check. Moving the router to that configuration reduces its time to first token and its total time, and reduces its cost for every message. The specialists do the work in which quality matters and keep their configuration. Their replies should be streamed, so that the guest sees the first words as early as possible.\u003c/p\u003e\n\u003cp\u003eThe change should be verified. Routing accuracy is measured on a labeled sample of guest messages, including messages with several requests, before and after. A further option is to give the routing decision to the specialist-facing orchestrator call, which removes one round trip. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-latency\"\u003eReducing latency\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/effort\"\u003eEffort\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/about-claude/models/optimizing-for-cost-and-intelligence\"\u003eOptimizing for cost and intelligence\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Cost and Latency Optimization at Scale — source question 56","answerStatus":"source"},{"query":"A network-repair agent applies an erroneous configuration to 40 routers at once, disconnecting them. How should its change tool enforce a safe rollout and recovery path?","type":"multiple-choice","options":[{"text":"A change tool that applies changes immediately, with a prompt instruction to the agent to check its work carefully.","explanation":"This is the present design with an added instruction. The agent believed that its change was correct, so more care in its own reasoning would probably not have found the error.","correct":false},{"text":"A change tool that is removed from the agent, so that engineers apply every remedy by hand.","explanation":"This is safe but gives up the fast remedy that management wants to keep. A tool with enforced stages allows automation with protection.","correct":false},{"text":"A change tool that enforces validation, approval, application to one router first, and automatic rollback.","explanation":"Each stage limits the damage that an error can do, and none depends on the agent's judgment. Validation finds errors in form. Approval puts an engineer in the decision. Application to a single router first limits the effect of a wrong change to one device. Automatic rollback restores service if health checks fail.","correct":true},{"text":"A change tool that applies changes to all routers but only between 2 AM and 4 AM, when traffic is low.","explanation":"A period of low traffic reduces the number of customers affected by an outage, but a wrong change would still reach all 40 routers together. The time of day does not make the change safer.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eA change tool that enforces validation, approval, application to one router first, and automatic rollback.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eFor an action that can cause an outage, safety should be \u003cstrong\u003ebuilt into the tool\u003c/strong\u003e and not requested in the prompt. The principle is deterministic enforcement for actions that have a large effect. Four stages, each enforced in code, turn one dangerous step into a controlled process.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eValidation or dry run\u003c/strong\u003e: the tool checks the change against the device's syntax and against policy before anything is applied. \u003cstrong\u003eApproval gate\u003c/strong\u003e: the change, with its rollback plan, is presented to an engineer, and the tool does not proceed without the approval. Change-management policy requires this. \u003cstrong\u003eCanary application\u003c/strong\u003e: the change is applied to one device first, and to more only if that device stays healthy. This limits the blast radius, which is the extent of the damage from one error. \u003cstrong\u003eAutomatic rollback\u003c/strong\u003e: health checks run after each step, and a failure restores the earlier configuration without waiting for anyone.\u003c/p\u003e\n\u003cp\u003eWith these stages, an error of the kind seen in the test would have affected one router for a short time. An instruction to be careful and a restriction on the time of day do not change what one call to the tool can do. See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/hooks\"\u003eAgent SDK hooks\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/permissions\"\u003eAgent SDK permissions\u003c/a\u003e, and \u003ca href=\"https://www.anthropic.com/engineering/writing-tools-for-agents\"\u003eWriting effective tools for agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 57","answerStatus":"source"},{"query":"A network agent must research vendor web advisories and test proposed changes, but must not let hostile web content lead to production-router access. Which environment isolates these experiments?","type":"multiple-choice","options":[{"text":"Allow web access and production access together, with a system prompt that tells the agent to ignore instructions on web pages.","explanation":"A prompt instruction lowers the chance that the agent follows hostile text but cannot guarantee it. With both kinds of access in one place, one failure is enough to reach production.","correct":false},{"text":"Forbid all web access, and give the agent a copy of the vendor advisories from last year.","explanation":"Old advisories lack the most recent faults and fixes, which are often the relevant ones. This gives up a useful capability, and isolation can remove the risk in another way.","correct":false},{"text":"Allow experiments on production routers that carry little traffic, such as those in small towns.","explanation":"A router with little traffic still serves real customers, and a misled agent would still have production credentials. Fewer customers does not make this a test environment.","correct":false},{"text":"Give the agent a sandbox with a simulated network and web access but no production credentials.","explanation":"A sandbox lets the agent run commands, test changes on a simulated network, and read the web, while it holds nothing that can reach production. If hostile content misleads the agent there, the damage stays in the sandbox. Production can be changed only through the separate tool with validation and approval.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eGive the agent a sandbox with a simulated network and web access but no production credentials.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eSandboxing\u003c/strong\u003e gives an agent room to work, including running code, trying changes, and using the web, without giving it the means to cause harm. The design principle is \u003cstrong\u003eseparation of capability\u003c/strong\u003e. The environment in which the agent is exposed to untrusted content and makes experiments contains no production credentials and has no network route to production systems. The route to production is a narrow, gated tool that is separate from that environment.\u003c/p\u003e\n\u003cp\u003eFor this agent, the sandbox contains a simulated or laboratory network, the diagnostic data that the agent needs, and outbound web access limited to vendor sites. The agent can test whether a proposed configuration behaves as expected. If a hostile advisory page contains instructions, the worst result is a wrong experiment in the laboratory. The agent's proposal is then submitted through the change tool, where validation, approval by an engineer, and staged application apply.\u003c/p\u003e\n\u003cp\u003eAnthropic's guidance on secure deployment describes the same pattern: isolate the agent's execution environment, restrict its network access, and keep credentials outside the boundary of the agent. Claude Managed Agents provides managed and self-hosted sandboxes with configurable networking for this purpose. See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/secure-deployment\"\u003eSecurely deploying AI agents\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/sandboxing\"\u003eSandboxing\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/managed-agents/secure-deployment\"\u003eSecure your Managed Agents deployment\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 58","answerStatus":"source"},{"query":"An attacker can inject instructions into a network device log, and the agent may propose arbitrary router configurations after reading it. Which control most limits unsafe tool actions?","type":"multiple-choice","options":[{"text":"A filter that removes any log line that contains the words \"operator\" or \"note\" before the agent reads the logs.","explanation":"An attacker can use other words, and real log lines may contain these words. A keyword filter is easy to avoid and removes useful data.","correct":false},{"text":"A change tool that accepts only actions from an approved list of predefined remedies with checked parameters.","explanation":"If the agent can send any configuration text, hostile text in a log can lead to any change. A tool that offers only a fixed set of approved remedies, each with parameters that are checked, removes that freedom. \"Disable the access list\" is not on the list, so the agent cannot carry it out whatever it reads.","correct":true},{"text":"A second model that reads each log line and estimates the probability that an attacker wrote it.","explanation":"A second model is another probabilistic check and can be misled by text that is written with care. It may be a useful additional layer, but it does not limit what the agent can do.","correct":false},{"text":"A notice in the system prompt that device logs are always accurate and can be trusted.","explanation":"This would make the attack more effective, because it tells the agent to trust the content that the attacker controls.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eA change tool that accepts only actions from an approved list of predefined remedies with checked parameters.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eDevice logs, alarm text, and web pages are \u003cstrong\u003euntrusted input\u003c/strong\u003e when any part of them can be influenced from outside. The demonstration is an indirect prompt injection: the attacker never communicates with the agent directly and plants instructions in data that the agent reads. Detection alone is not sufficient, because hostile text can always be rewritten to avoid a filter or a classifier.\u003c/p\u003e\n\u003cp\u003eThe stronger defense \u003cstrong\u003elimits what the agent is able to do\u003c/strong\u003e. A change tool that accepts free-form configuration gives the agent, and therefore anyone who can mislead it, unlimited power over the network. A tool that offers an \u003cstrong\u003eallowlist of predefined actions with parameters\u003c/strong\u003e, such as restarting a routing session with a named neighbor or moving traffic to a backup path, with each parameter validated, reduces that power to a small set that has been reviewed. A harmful action that is not on the list cannot be carried out. This applies least privilege to the capability of a tool, and it addresses the risk that the OWASP Top 10 for LLM Applications calls excessive agency.\u003c/p\u003e\n\u003cp\u003eRemedies outside the list are still possible through the normal engineering process, with a person. Filters and classifiers can be added as further layers. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks\"\u003eMitigate jailbreaks and prompt injections\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/writing-tools-for-agents\"\u003eWriting effective tools for agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 59","answerStatus":"source"},{"query":"A network agent asked to review its own proposed change almost always agrees, even when wrong. How should the team obtain an independent automated second opinion?","type":"multiple-choice","options":[{"text":"Ask the same session the question three times, and proceed only if it answers yes each time.","explanation":"The session holds the reasoning that led to the change, so it will usually confirm that reasoning each time. Three confirmations from the same context add very little.","correct":false},{"text":"Ask the same session to state its confidence as a percentage, and proceed only above 95%.","explanation":"Confidence stated by the session that produced the change is not an independent measure. The cases in which it was wrong were also cases in which it was confident.","correct":false},{"text":"Remove the second opinion, because the engineer's approval already provides a check.","explanation":"The engineer's approval is essential, but an independent automated review finds some errors before they reach a busy engineer. The first design failed because it was not independent.","correct":false},{"text":"Give a separate verifier agent with a fresh context the evidence and the proposed change.","explanation":"A reviewer that shares the context of the author tends to confirm the author's conclusions. A separate agent that starts with only the evidence and the proposal has to form its own judgment, so it can find errors that the first agent could not see in its own work. Its findings go to the engineer with the proposal.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eGive a separate verifier agent with a fresh context the evidence and the proposed change.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA review is useful to the extent that it is \u003cstrong\u003eindependent\u003c/strong\u003e. An agent that is asked to check its own work in the same session still has its earlier reasoning in context, and it tends to follow the same path to the same conclusion. This is why the first design answers yes in almost every case. More repetitions and stated confidence do not add independence.\u003c/p\u003e\n\u003cp\u003eThe orchestration pattern is a \u003cstrong\u003eseparate verifier with an isolated context\u003c/strong\u003e. The verifier receives the inputs to the decision (alarm data, the relevant logs, the present configuration) and the proposed change with its rollback plan. It does not receive the investigator's chain of reasoning. It evaluates the proposal against the evidence and reports agreement or specific objections. This is an application of context isolation between agents. Subagents and separate sessions start with a fresh context, which is the property that is needed here. The verifier can also be given different instructions, for example to look for reasons why the change could fail.\u003c/p\u003e\n\u003cp\u003eThe engineer then sees the proposal and the independent review together. The human approval remains the final control, and the verifier improves the quality of what reaches it. See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/subagents\"\u003eSubagents in the SDK\u003c/a\u003e, \u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\"\u003eBuilding effective agents\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/best-practices\"\u003eBest practices for Claude Code\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 60","answerStatus":"source"},{"query":"A fiber cut causes 500 related alarms; an agent session per alarm duplicates investigations, proposes conflicting actions, and exhausts API limits. How should alarms be grouped for investigation?","type":"multiple-choice","options":[{"text":"Start one session for each alarm as now, and ask for a higher rate limit so that 500 sessions can run together.","explanation":"A higher limit would allow 500 separate investigations of one fault to run, at 500 times the cost, and they would still give conflicting proposals. The duplication is the fault.","correct":false},{"text":"Group related alarms into one incident, and run one coordinating session for each incident.","explanation":"The 500 alarms describe one event. Grouping them, by time and by network topology, into a single incident gives one investigation with all of the evidence. One coordinating session for each incident avoids 500 duplicate investigations.","correct":true},{"text":"Ignore every alarm after the first 10 in any period of two minutes.","explanation":"Discarding alarms by count could remove the alarm for a separate fault that begins at the same time. The alarms should be grouped by cause and not counted and dropped.","correct":false},{"text":"Start one session for each alarm, and let the 500 sessions message each other to agree on a diagnosis.","explanation":"Communication among 500 sessions would produce a very large number of messages and no clear owner of the decision. One coordinator with all of the evidence is simpler and more reliable.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eGroup related alarms into one incident, and run one coordinating session for each incident.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThe unit of work for an agent should be the \u003cstrong\u003eproblem\u003c/strong\u003e and not the \u003cstrong\u003eevent\u003c/strong\u003e that reports it. One fault in a network produces many alarms. If every alarm starts an agent, the system multiplies cost, reaches rate limits at the moment when capacity is most needed, and produces conclusions that do not agree, because each session sees only a small part of the evidence.\u003c/p\u003e\n\u003cp\u003eAn architecture that scales adds a \u003cstrong\u003ecorrelation step before orchestration\u003c/strong\u003e. Alarms are grouped into incidents by time and by network topology, and this is deterministic work that code does well. Each incident then has \u003cstrong\u003eone coordinating session\u003c/strong\u003e that holds all of the related alarms. If the incident is large, the coordinator can \u003cstrong\u003edelegate\u003c/strong\u003e defined sub-investigations to subagents and combine their findings, which keeps one owner for the diagnosis and for any proposed change. A \u003cstrong\u003econcurrency limit\u003c/strong\u003e on sessions, with a priority order by severity, keeps the system inside its rate limits and ensures that an unrelated incident still receives capacity.\u003c/p\u003e\n\u003cp\u003eThis is the supervisor/worker pattern applied to the correct unit of work. Many unsupervised peers investigating the same fault, with or without messages between them, is the anti-pattern. See \u003ca href=\"https://www.anthropic.com/engineering/multi-agent-research-system\"\u003eHow we built our multi-agent research system\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/building-effective-agents\"\u003eBuilding effective agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 61","answerStatus":"source"},{"query":"Several network incidents share one Claude API rate limit; low-severity investigations consume capacity while a hospital outage receives 429 errors. How should shared request capacity be scheduled?","type":"multiple-choice","options":[{"text":"Longer waits between retries in every session, so that all sessions send fewer requests.","explanation":"Longer waits reduce the total load, but they slow the hospital outage as much as the minor alarm. They do not give priority to more important work.","correct":false},{"text":"A separate API key for each session, so that the sessions do not affect each other.","explanation":"Rate limits apply to the organization and the workspace and not to each key. Separate keys would share the same limit and change nothing.","correct":false},{"text":"A rule that only one session may run at a time, in the order in which the incidents were opened.","explanation":"One session at a time wastes capacity when several could run, and the order of opening is not related to severity. The hospital outage could wait behind a minor alarm.","correct":false},{"text":"A shared request queue in front of the API with priority by incident severity.","explanation":"When capacity is short, something has to decide which requests go first. A shared queue that every session uses, ordered by the severity of the incident, sends requests for the hospital outage ahead of the minor alarm. Low-priority investigations wait or are slowed until capacity returns.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eA shared request queue in front of the API with priority by incident severity.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eRate limits are a \u003cstrong\u003eshared resource\u003c/strong\u003e. When each session retries independently, capacity goes to whichever request happens to succeed, and the system has no idea of importance. Under load, important work is then delayed by unimportant work.\u003c/p\u003e\n\u003cp\u003eThe solution is \u003cstrong\u003ecentral admission with priority\u003c/strong\u003e. All sessions send their model requests through a shared component, which may be a gateway or a client-side scheduler. That component knows the current use of the rate limit fro
