<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Developer Professional | Practice Exam 07</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #f8fafc;
      --text: #172033;
      --muted: #667085;
      --line: #d9e0e8;
      --primary: #1769aa;
      --primary-dark: #0f4f85;
      --secondary: #667085;
      --success: #16803c;
      --success-bg: #eaf8ef;
      --danger: #b42318;
      --danger-bg: #fff0ee;
      --warning: #9a6700;
      --warning-bg: #fff7d6;
      --shadow: 0 10px 28px rgba(23, 32, 51, 0.08);
      --radius: 14px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    button, input { font: inherit; }

    button {
      border: 0;
      border-radius: 9px;
      padding: .62rem .92rem;
      cursor: pointer;
      font-weight: 650;
      transition: transform .08s ease, background .15s ease, opacity .15s ease;
    }

    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); }
    .btn-secondary { background: #e8edf3; color: var(--text); }
    .btn-warning { background: #ffd96a; color: #4b3500; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-success { background: var(--success); color: white; }

    .page-shell {
      width: min(1040px, calc(100% - 28px));
      margin: 28px auto 60px;
    }

    .hero {
      background: linear-gradient(135deg, #12243b, #1e4f79);
      color: white;
      border-radius: 18px;
      padding: 24px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
    }

    .hero-top {
      display: flex;
      gap: 18px;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .hero h1 { margin: 0 0 6px; font-size: clamp(1.65rem, 4vw, 2.35rem); }
    .hero p { margin: 0; opacity: .88; }
    .meta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }
    .pill {
      border: 1px solid rgba(255,255,255,.28);
      background: rgba(255,255,255,.1);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: .9rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      margin-top: 16px;
      overflow: hidden;
    }

    .card-header {
      padding: 14px 18px;
      background: var(--surface-2);
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-weight: 750;
    }

    .card-body { padding: 18px; }

    .results {
      border-left: 5px solid var(--primary);
    }
    .results strong { font-size: 1.1rem; }

    .query {
      font-size: 1.08rem;
      font-weight: 700;
      margin: 0 0 8px;
    }

    .choose-note {
      color: var(--muted);
      font-size: .9rem;
      margin: 0 0 16px;
    }

    .option {
      display: flex;
      align-items: flex-start;
      gap: 11px;
      padding: 11px 12px;
      margin: 8px 0;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
    }

    .option input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--primary);
      flex: 0 0 auto;
    }

    .option.reveal-correct {
      border-color: #75c991;
      background: var(--success-bg);
    }

    .option.reveal-wrong-selected {
      border-color: #e9a7a0;
      background: var(--danger-bg);
    }

    .option small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .answer-panel {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 10px;
      background: var(--warning-bg);
      border: 1px solid #f0d783;
    }

    .answer-panel p:first-child { margin-top: 0; }
    .answer-panel ul { margin-bottom: 0; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .controls-top {
      position: sticky;
      top: 8px;
      z-index: 20;
      margin: 10px 0 12px;
      padding: 12px 14px;
      background: rgba(255,255,255,.97);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: 0 5px 24px rgba(23,32,51,.12);
      backdrop-filter: blur(8px);
    }

    .controls-top + exam-question .card { margin-top: 0; }

    .control-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .collapsible-title { cursor: pointer; user-select: none; }
    .chevron { font-size: .9rem; color: var(--muted); }

    .jumper-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .jump-btn {
      min-width: 38px;
      padding: 7px 9px;
      background: #eef2f6;
      color: var(--text);
      border: 1px solid var(--line);
    }

    .jump-btn.viewed { background: #d7dee7; }
    .jump-btn.current { background: var(--primary); color: white; border-color: var(--primary); }
    .jump-btn.correct { background: var(--success); color: white; border-color: var(--success); }
    .jump-btn.incorrect { background: var(--danger); color: white; border-color: var(--danger); }

    .history-empty { color: var(--muted); margin: 0; }
    .history-exam {
      border-top: 1px solid var(--line);
      padding: 14px 0;
    }
    .history-exam:first-child { border-top: 0; padding-top: 0; }
    .history-summary {
      display: flex;
      gap: 10px;
      justify-content: space-between;
      flex-wrap: wrap;
      margin-bottom: 9px;
    }
    .history-dots { display: flex; flex-wrap: wrap; gap: 5px; }
    .history-dot {
      width: 26px; height: 26px; border-radius: 7px;
      display: grid; place-items: center;
      font-size: .76rem; color: white;
      background: var(--danger);
    }
    .history-dot.correct { background: var(--success); }

    .status-line {
      color: var(--muted);
      font-size: .92rem;
      margin-top: 10px;
    }

    .footer-note {
      color: var(--muted);
      font-size: .88rem;
      text-align: center;
      margin-top: 22px;
    }

    @media (max-width: 640px) {
      .page-shell { width: min(100% - 16px, 1040px); margin-top: 8px; }
      .hero { border-radius: 12px; padding: 19px 17px; }
      .card-body { padding: 14px; }
      .card-header { padding: 12px 14px; }
      .controls { align-items: stretch; }
      .control-group { width: 100%; }
      .control-group button { flex: 1; }
      .controls-top { top: 0; padding: 10px; }
    }
  </style>
</head>

  <scrum-exam-app></scrum-exam-app>

  <script>
    const QUESTION_BANK = [{"query":"A clinic wants a third-party analytics vendor to identify patient-message topics, but the vendor is not approved to receive patient identifiers. The transcripts contain names, birth dates, and medications. How can the clinic export useful data compliantly?","type":"multiple-choice","options":[{"text":"Pass transcripts through a tested redactor inside Vantage's boundary, and export only the redacted text.","explanation":"A redaction step that runs before data leaves the covered environment removes identifiers at the boundary. Testing the redactor on labeled examples shows how much it misses, which matters because a missed identifier is a disclosure. The analytics service then receives text that supports topic analysis without patient identity.","correct":true},{"text":"Send the full transcripts, and ask the analytics service to delete any personal data that it finds in them.","explanation":"Once the transcripts leave Vantage, the data has been disclosed to a service that is not covered. A later deletion by that service does not reverse the disclosure, and Vantage cannot verify it.","correct":false},{"text":"Add a line to the copilot's system prompt that tells it not to repeat personal details in its replies to patients.","explanation":"The identifiers are mostly in the patients' own messages, which the instruction does not affect. The copilot also needs personal details to do its clinical work, so the instruction would harm the product and would not protect the export.","correct":false},{"text":"Send the full transcripts over an encrypted connection, so that nobody can read them on the way to the analytics service.","explanation":"Encryption protects data while it travels. The analytics service still receives and stores the full transcripts, and that service is the party that is not covered.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003ePass transcripts through a tested redactor inside Vantage\u0026#x27;s boundary, and export only the redacted text.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA \u003cstrong\u003ePII redactor\u003c/strong\u003e is a guardrail that removes or masks personal identifiers from text before the text crosses a trust boundary. The question to ask is where the boundary is. Inside the covered environment, the copilot needs real patient data in order to work. At the point of \u003cstrong\u003eexport\u003c/strong\u003e to a service outside the agreements, the data must be transformed. Redaction therefore belongs in Vantage's own pipeline, immediately before the export.\u003c/p\u003e\n\u003cp\u003eRedactors are classifiers, and they make errors. A false negative (a missed name or date of birth) is a disclosure. A false positive (a medication name removed by mistake) reduces the value of the analysis. A redactor should therefore be \u003cstrong\u003etested on labeled examples\u003c/strong\u003e from real messages, with its miss rate measured, and combined with structural controls, such as exporting only the fields that the analysis needs. For topic analysis, an alternative is to compute the topic labels inside the boundary and export only the labels and counts.\u003c/p\u003e\n\u003cp\u003eA request for deletion after disclosure and encryption in transit do not change who receives the data. See \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/api-and-data-retention\"\u003eAPI and data retention\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-prompt-leak\"\u003eReduce prompt leak\u003c/a\u003e for output screening and post-processing.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 1","answerStatus":"source"},{"query":"A patient's message impersonates a system note and orders the agent to request a controlled-substance refill. The system prompt prohibits controlled substances and limits refills to active prescriptions, but the agent called the tool anyway. What enforcement should be added?","type":"multiple-choice","options":[{"text":"A second copy of the policy at the end of the system prompt, with the words \"never\" and \"always\" in capital letters.","explanation":"The policy is already in the prompt and was not followed when a message imitated a system note. Repetition and capital letters make compliance more likely but do not make it certain.","correct":false},{"text":"A PreToolUse hook that checks each refill against the active prescription list and denies controlled substances.","explanation":"A hook runs in code before the tool call executes. It can compare the requested medication with the patient's active prescriptions and with a list of controlled substances, and deny the call when the policy is broken. The result does not depend on what the patient's message says or on how the model reads it.","correct":true},{"text":"A weekly report of all refill requests for controlled substances, sent to the head of pharmacy for review.","explanation":"A weekly report shows the request days after it was made. A prescription may already have been issued, so this is detection and not prevention.","correct":false},{"text":"A classifier that scans each incoming patient message for the words \"system,\" \"approved,\" and \"refill\" and blocks the message.","explanation":"A keyword scan blocks many normal messages, since patients often write about refills, and an attacker can simply use other words. It may be a useful extra layer, but it cannot enforce the refill policy.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eA PreToolUse hook that checks each refill against the active prescription list and denies controlled substances.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003ePatient messages are \u003cstrong\u003euntrusted input\u003c/strong\u003e. Text that imitates a system note or an approval is a simple form of prompt injection, and no prompt wording can guarantee that the model will never act on it. For an action with clinical and legal consequences, the policy must be enforced by \u003cstrong\u003ecode that runs outside the model\u003c/strong\u003e.\u003c/p\u003e\n\u003cp\u003eIn the Claude Agent SDK, a \u003ccode\u003ePreToolUse\u003c/code\u003e hook receives the tool name and the tool input before the call executes and can allow, deny, or ask for approval. A hook on \u003ccode\u003erequest_refill\u003c/code\u003e can look up the patient's active prescriptions, compare the requested medication and quantity, and deny any request for a controlled substance. The denial reason is returned to the model, which can then tell the nurse that the request needs a clinician. This is \u003cstrong\u003ehook-based policy enforcement\u003c/strong\u003e: the rule is applied on every call, including calls that follow an injected instruction.\u003c/p\u003e\n\u003cp\u003eThe same check can also be placed in the refill tool itself, which protects any other caller of the tool. Stronger wording, keyword scanning, and weekly reports do not prevent the action. See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/hooks\"\u003eAgent SDK hooks\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/mitigate-jailbreaks\"\u003eMitigate jailbreaks and prompt injections\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 2","answerStatus":"source"},{"query":"An agent uses one shared account with full scheduling and clinical-record access; appointment-change logs omit the approving nurse. Which TWO identity and access changes improve accountability and least privilege? (Select TWO.)","type":"multiple-choice","options":[{"text":"Record with every tool call the identity of the agent and of the nurse who approved it.","explanation":"This is correct. Accountability requires that each action can be traced to the actors behind it. Carrying the agent's own identity and the approving nurse's identity on each call, and writing both to the audit log, makes an action attributable.","correct":true},{"text":"Give each tool a credential that is limited to what that tool needs, for example appointments only.","explanation":"This is correct. One account with full access means that any tool, or any mistake, can reach everything. Credentials limited to each tool's purpose apply least privilege and limit the damage from a fault or a misled agent.","correct":true},{"text":"Rename the shared service account so that its name states clearly that it belongs to the AI agent.","explanation":"This is incorrect. A clearer name does not show which nurse approved an action or limit what the account can reach.","correct":false},{"text":"Change the password of the shared service account every month and store it in the agent's configuration file.","explanation":"This is incorrect. Rotation limits how long a leaked password is useful. The account is still shared and still has full access, so attribution and privilege are unchanged.","correct":false},{"text":"Ask the agent to write the name of the approving nurse at the end of each reply that it drafts for a patient.","explanation":"This is incorrect. Text that the model writes in a reply is not an audit record. It can be wrong or missing, and it is not linked to the tool call in the scheduling system.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answers:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eRecord with every tool call the identity of the agent and of the nurse who approved it.\u003c/li\u003e\u003cli\u003eGive each tool a credential that is limited to what that tool needs, for example appointments only.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eTwo principles apply to agents in a regulated setting. The first is \u003cstrong\u003eagent identity and attribution\u003c/strong\u003e. An agent should act under an identity of its own, and when it acts for a person, the action should also carry that person's identity. A shared account that hides both makes audit impossible. The record for each tool call should hold the agent identity, the human who approved or requested the action, the inputs, and the time.\u003c/p\u003e\n\u003cp\u003eThe second is \u003cstrong\u003eleast-privilege tool permissioning\u003c/strong\u003e. Each tool should hold a credential with the narrowest scope that lets it do its job. The appointment tool does not need access to the full clinical record. If one tool is misused, through a defect or through prompt injection, the possible harm is limited to that tool's scope. Anthropic's secure deployment guidance also recommends keeping such credentials outside the agent's own environment, for example in a proxy that adds them to approved requests.\u003c/p\u003e\n\u003cp\u003eRenaming or rotating a shared account, and text written by the model, do not provide attribution or reduce privilege. See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/secure-deployment\"\u003eSecurely deploying AI agents\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/permissions\"\u003eAgent SDK permissions\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/authentication\"\u003eAuthentication\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect TWO answers.\u003c/p\u003e","reference":"Runtime Guardrails and Production Security — source question 3","answerStatus":"source"},{"query":"A clinic's zero data retention (ZDR) arrangement covers synchronous Claude Messages API requests. It wants to move nightly patient-message summarization to the cheaper Message Batches API. What must it consider before processing protected health data?","type":"multiple-choice","options":[{"text":"Batch processing uses the same models, so it is covered by the ZDR arrangement in the same way as other requests.","explanation":"ZDR eligibility is decided for each feature, not for each model. Batch processing stores requests and results so that they can be retrieved later, which is different from a synchronous request.","correct":false},{"text":"Batch processing is acceptable if each batch is deleted by hand as soon as its results have been downloaded.","explanation":"Deleting a batch promptly shortens the storage period, but the data is still stored outside the ZDR arrangement for some time. Whether that is acceptable is a compliance decision, and it is not the same as being covered.","correct":false},{"text":"Batch processing is acceptable for this job because nightly summaries contain less detail than the original messages.","explanation":"The input to the job is the full set of patient messages, and those are what would be stored. The level of detail in the output does not change what is sent.","correct":false},{"text":"Batch processing is not ZDR-eligible and retains data, so the job should stay on the synchronous API unless compliance approves.","explanation":"The documentation lists batch processing as not eligible for ZDR: request and response data is stored for up to 29 days. A feature that is not eligible is outside the arrangement for the data that it handles. For protected health information, the job should remain on a covered path, with its own queue and rate control, unless the compliance office accepts the retention.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eBatch processing is not ZDR-eligible and retains data, so the job should stay on the synchronous API unless compliance approves.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA zero data retention arrangement applies to \u003cstrong\u003especific APIs and features\u003c/strong\u003e. Each feature has its own eligibility, which depends on whether the feature needs to store data in order to work. The Messages API and many of its features, such as prompt caching and citations, are ZDR-eligible. \u003cstrong\u003eBatch processing is not\u003c/strong\u003e: requests and results are stored so that results can be retrieved, for up to 29 days. The Files API, code execution, and Claude Managed Agents are other examples of features with their own retention.\u003c/p\u003e\n\u003cp\u003eThe documentation states the consequence clearly. Using a feature that is not eligible does not fail. It places that data \u003cstrong\u003eoutside the ZDR arrangement\u003c/strong\u003e, under the feature's own retention policy. For a healthcare organization, a cost optimization can therefore become a compliance change without any error or warning. Feature eligibility should be part of the design review for every new integration.\u003c/p\u003e\n\u003cp\u003eThe practical choice here is to keep the nightly job on the synchronous Messages API, with a rate-controlled queue and prompt caching for the shared instructions, or to obtain an explicit decision from compliance. See \u003ca href=\"https://platform.claude.com/docs/en/manage-claude/api-and-data-retention\"\u003eAPI and data retention\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/batch-processing\"\u003eBatch processing\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 4","answerStatus":"source"},{"query":"A clinical reply is streamed to a nurse, but a network failure cuts off the stream. The application mistakenly treats the partial medication instructions as complete. How should it detect a finished draft?","type":"multiple-choice","options":[{"text":"Turn streaming off, and show each draft only when the complete response has arrived.","explanation":"This prevents partial drafts from being shown, but nurses would then wait for the whole response each time. Streaming can be kept if the application checks for completion.","correct":false},{"text":"Treat any draft that ends with a period as complete, and any other draft as interrupted.","explanation":"The final character of the text is not a reliable sign. An interrupted draft can end with a period after a complete sentence, with later sentences missing.","correct":false},{"text":"Lower max_tokens so that drafts are shorter and are less likely to be interrupted.","explanation":"Shorter drafts reduce the time in which a fault can occur, but they do not remove the risk, and clinical replies may need the length. The application would still show an interrupted draft as complete.","correct":false},{"text":"Mark a draft as complete only when the stream ends with a stop reason.","explanation":"A streamed response is complete only when the stream ends properly, with the final events that carry the stop reason. If the connection ends before them, the text is partial and must not be presented as finished. The application should mark it as incomplete and request the draft again.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eMark a draft as complete only when the stream ends with a stop reason.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eWith streaming, a response arrives as a sequence of server-sent events. The text is delivered in parts, and the \u003ccode\u003estop_reason\u003c/code\u003e appears only near the end, in the \u003ccode\u003emessage_delta\u003c/code\u003e event, followed by the event that closes the message. If the network connection ends early, the application holds some text and \u003cstrong\u003eno stop reason\u003c/strong\u003e. That text is a partial response.\u003c/p\u003e\n\u003cp\u003eResilient handling of streams has two rules. First, \u003cstrong\u003ecompleteness is decided by the protocol\u003c/strong\u003e: a draft is complete only if the closing events arrived, and the stop reason is then checked as usual (\u003ccode\u003eend_turn\u003c/code\u003e is complete, \u003ccode\u003emax_tokens\u003c/code\u003e is truncated, and so on). Second, \u003cstrong\u003ean interrupted stream is a failure to recover from\u003c/strong\u003e. The interface shows that the draft is incomplete, and the application retries the request. In a clinical product, a partial instruction that looks finished is a patient safety risk, so the incomplete state must be visible and must block sending.\u003c/p\u003e\n\u003cp\u003eGuessing from punctuation is unreliable, and turning streaming off or shortening drafts avoids the issue at the cost of the product. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/streaming\"\u003eStreaming messages\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons\"\u003eStop reasons and fallback\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 5","answerStatus":"source"},{"query":"A clinic receives 429 errors during Monday's message surge. Rate-limit headers show output tokens per minute exhausted, while request and input-token limits have headroom. Each draft generates about 400 tokens. Which metric should drive peak-capacity planning?","type":"multiple-choice","options":[{"text":"The number of requests per minute at the peak, because each patient message produces one request.","explanation":"Requests per minute have a wide margin at the peak, so they are not the limit that is reached. A plan based on them would not explain or prevent the failures.","correct":false},{"text":"Output tokens per minute at the Monday peak, calculated from messages per minute and tokens per draft.","explanation":"The headers show that the output token limit is the one that runs out. The requirement at the peak is the number of drafts per minute multiplied by about 400 tokens. Comparing that figure with the limit shows how much more capacity to request, or how much work to queue or delay.","correct":true},{"text":"The size of the system prompt, because long prompts are the most frequent cause of rate limit errors.","explanation":"Input tokens per minute also have a wide margin. A shorter prompt would save cost but would not release any output token capacity.","correct":false},{"text":"The average message volume for the week, because the Monday peak lasts for only two hours.","explanation":"A plan based on the average ignores the two hours in which the service fails. Capacity has to be planned for the peak, or the peak has to be smoothed.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eOutput tokens per minute at the Monday peak, calculated from messages per minute and tokens per draft.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eCapacity planning\u003c/strong\u003e for a Claude workload begins with the \u003cstrong\u003ebinding constraint\u003c/strong\u003e: the limit that is reached first. The API applies separate limits to requests per minute, input tokens per minute, and output tokens per minute, and the response headers report each one. Here the output token limit is used up while the others have a margin. This is typical of a workload that generates long text from moderate inputs.\u003c/p\u003e\n\u003cp\u003eThe plan then follows from simple arithmetic at the \u003cstrong\u003epeak\u003c/strong\u003e. The required output tokens per minute are the peak number of messages per minute multiplied by the tokens for each draft, plus a margin. If that figure is above the current limit, there are three options, and they can be combined. The team can request a higher limit, with the measured peak as evidence. It can \u003cstrong\u003equeue\u003c/strong\u003e requests and give priority to nurse-facing drafts over background work. It can also reduce output, for example by drafting shorter replies for message types that need only an acknowledgment.\u003c/p\u003e\n\u003cp\u003eThe output limit counts tokens that are actually generated, so the value of \u003ccode\u003emax_tokens\u003c/code\u003e does not use up capacity. See \u003ca href=\"https://platform.claude.com/docs/en/api/rate-limits\"\u003eRate limits\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/api/errors\"\u003eClaude API errors\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 6","answerStatus":"source"},{"query":"A clinical triage agent is asked to emit its full step-by-step reasoning in a stored reasoning_trace field. Some requests refuse, and the explanations are unwieldy. What should it record instead so urgency decisions can be audited?","type":"multiple-choice","options":[{"text":"Keep the reasoning_trace field, and retry any request that is refused until it succeeds.","explanation":"Retrying the same request on the same model usually gives the same refusal, and the stored text would remain long and hard to use. The design itself needs to change.","correct":false},{"text":"Remove all explanation from the output, and tell nurses that the copilot's urgency decisions cannot be explained.","explanation":"This gives up a real need. A decision can be made explainable with structured evidence, with no request for the model's raw reasoning.","correct":false},{"text":"Ask the model after each decision to describe, in a second request, what it was thinking during the first request.","explanation":"A description produced afterward in a new request is a new piece of generated text. It may sound reasonable, but it is not a record of how the first decision was made.","correct":false},{"text":"Record structured decision factors, such as the triggering phrases and the protocol rule applied.","explanation":"A decision is explained by its evidence: the words in the message that matter and the triage rule that applies. Fields for these are short, can be checked against the message and the protocol, and are useful to a nurse. A request for a verbatim reasoning trace in the output can trigger a refusal, and thinking summaries are the supported way to see more.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eRecord structured decision factors, such as the triggering phrases and the protocol rule applied.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eReasoning traceability\u003c/strong\u003e means that a decision can be connected to the evidence and rules behind it. The most useful form for this is \u003cstrong\u003estructured decision factors\u003c/strong\u003e: which phrases in the patient's message were significant, which rule of the triage protocol was applied, and what the result was. These fields are short, they can be verified by code or by a person, and they can be stored and queried. They also support audit, because the rule ID links the decision to the clinic's own protocol.\u003c/p\u003e\n\u003cp\u003eAsking the model to reproduce its internal reasoning word for word in the output is a different thing, and the documentation advises against it. Prompts that request scratchpads, \u0026quot;trace\u0026quot; fields, or verbatim reasoning can cause a refusal in the \u003ccode\u003ereasoning_extraction\u003c/code\u003e category on current models. The guidance is to ask for a \u003cstrong\u003esummary, evidence, or actions\u003c/strong\u003e instead, or to read the model's thinking blocks in their summarized form. The structured outputs documentation also warns against schema fields that ask for step-by-step reasoning.\u003c/p\u003e\n\u003cp\u003eA description generated afterward is not a record of the original decision. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback\"\u003eRefusals and fallback\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/thinking\"\u003eThinking\u003c/a\u003e, and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/structured-outputs\"\u003eStructured outputs\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 7","answerStatus":"source"},{"query":"A clinic's API dashboard shows 99.98% HTTP success, but some responses return 200 with empty content and stop_reason 'refusal', leaving urgent patient drafts blank. What should monitoring measure?","type":"multiple-choice","options":[{"text":"Lower the alert threshold for the HTTP success rate from 99.9% to 99.99%.","explanation":"These responses have status 200 and are counted as successes. An alert on the HTTP success rate will not see them at any threshold.","correct":false},{"text":"Ask nurses to send an email to the engineering team whenever a draft area is empty.","explanation":"Reports from nurses are slow and incomplete, and they place the work of monitoring on clinical staff. The system has the information and can report it automatically.","correct":false},{"text":"Add a check that counts responses with empty content, and treat every empty response as a network fault to retry.","explanation":"Empty content can have several causes, and a refusal is not a network fault. Retrying it on the same model usually gives the same result. The stop reason states the condition exactly and should be used.","correct":false},{"text":"Emit an event for each refusal with its category, and alert on the refusal rate.","explanation":"A refusal is a successful HTTP response, so error dashboards cannot show it. An event for each refusal makes the rate visible and allows an alert. Dividing by category shows which kinds of message are refused.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eEmit an event for each refusal with its category, and alert on the refusal rate.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eMonitoring that is based on HTTP status sees only one kind of failure. A \u003cstrong\u003erefusal\u003c/strong\u003e is returned with status 200 and \u003ccode\u003estop_reason: \u0026quot;refusal\u0026quot;\u003c/code\u003e, often with no content. To a dashboard of error rates, it is a success. To the nurse, it is an empty screen on a message that may be urgent.\u003c/p\u003e\n\u003cp\u003eAnthropic's guidance says this directly: \u003cstrong\u003emonitor refusals separately\u003c/strong\u003e, because error-rate dashboards miss them. The application should branch on the stop reason, emit one event for each refusal (with the category from \u003ccode\u003estop_details\u003c/code\u003e when it is present, the model, and the route), and emit another event when a fallback serves the response. Alerts are then set on the refusal rate and on the difference between refusals and fallback responses. The stop reason should be used for detection, not empty content or the category field, because \u003ccode\u003estop_details.category\u003c/code\u003e is null when a refusal does not match a named category.\u003c/p\u003e\n\u003cp\u003eMonitoring has to be matched by handling. In this product, a refused message about self-harm should go immediately to a nurse with a clear flag. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/refusals-and-fallback\"\u003eRefusals and fallback\u003c/a\u003e, \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/handling-stop-reasons\"\u003eStop reasons and fallback\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/monitoring-usage\"\u003eMonitoring\u003c/a\u003e, which lists a refusal event among the events that Claude's own tooling exports.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Observability and Production Monitoring — source question 8","answerStatus":"source"},{"query":"Nurse approval may take hours. The agent waits in process memory, so overnight restarts lose pending drafts and approvals. How should the approval workflow survive restarts?","type":"multiple-choice","options":[{"text":"Store the pending action and the session ID durably, end the turn, and resume the session when the nurse decides.","explanation":"A wait for a person can last for hours and must not depend on a running process. Saving the proposed action with the session ID in durable storage lets the process end. When the nurse approves or rejects, the application resumes the session with that decision, and the agent continues with its context intact.","correct":true},{"text":"Give nurses a 10-minute limit for each approval, and discard the draft when the limit passes.","explanation":"A 10-minute limit does not match how nurses work. Most drafts would be discarded and prepared again, which wastes clinical time and model cost.","correct":false},{"text":"Send every draft without approval, and let nurses correct mistakes afterward by sending a second message.","explanation":"This removes the approval that clinic policy requires for clinical replies. A correction after a wrong reply has been sent does not undo the harm.","correct":false},{"text":"Keep the process waiting, and move the nightly server restart to a time when few approvals are pending.","explanation":"Fewer approvals would be lost, but some still would be, and any unplanned restart would lose all of them. State that is held only in a process's memory is not durable.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eStore the pending action and the session ID durably, end the turn, and resume the session when the nurse decides.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eA human approval is an \u003cstrong\u003easynchronous event\u003c/strong\u003e. It may arrive in seconds or in hours, and the design must not assume that a process stays alive in the meantime. The durable pattern has three steps. First, when the agent reaches the action that needs approval, the application \u003cstrong\u003epersists\u003c/strong\u003e the request: the proposed reply or tool call, the patient context, and the session ID. Second, the turn ends and the compute is released. Third, when the nurse decides, the application \u003cstrong\u003eresumes the session\u003c/strong\u003e by its ID and supplies the decision, and the agent continues.\u003c/p\u003e\n\u003cp\u003eThe Claude Agent SDK supports this structure. Sessions are saved and can be resumed by ID, and they can be stored in external storage so that any server can resume them. Approval requests are raised through the permission flow, for example a hook or callback that asks for approval before a tool runs, and the application decides how to present the request and when to answer it.\u003c/p\u003e\n\u003cp\u003eA short time limit and a process that waits in memory both tie the workflow to conditions that will not hold. See \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/user-input\"\u003eHandle approvals and user input\u003c/a\u003e, \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/sessions\"\u003eWork with sessions\u003c/a\u003e, and \u003ca href=\"https://code.claude.com/docs/en/agent-sdk/session-storage\"\u003ePersist sessions to external storage\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 9","answerStatus":"source"},{"query":"A clinical agent's memory holds allergy and medication facts that later become stale after the medical record changes. How should it store long-term preferences while keeping clinical facts current?","type":"multiple-choice","options":[{"text":"Read clinical facts from the clinical record through a tool, and keep only non-clinical notes in memory.","explanation":"A fact should have one authoritative home. Clinical facts belong to the record system, which clinicians maintain, and the agent should read the current values through a tool each time. Agent memory is then used for things that have no other home, such as a patient's preferred contact time.","correct":true},{"text":"Keep the facts in the agent's memory, and ask the agent to check every month whether each fact is still true.","explanation":"A monthly check leaves weeks in which the memory and the record disagree, and it depends on the agent carrying out a task reliably. Clinical facts would still exist in two places.","correct":false},{"text":"Keep the facts in the agent's memory, and tell nurses to update the memory whenever they change the record.","explanation":"This asks nurses to maintain the same fact in two systems. In time one update will be missed, and the two copies will differ again.","correct":false},{"text":"Copy the whole clinical record into the agent's context at the start of every conversation.","explanation":"The full record is very large and mostly not relevant to a given message. This raises cost and makes it harder for the model to find the facts that matter.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eRead clinical facts from the clinical record through a tool, and keep only non-clinical notes in memory.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThe first question in memory architecture is which information belongs in the agent's memory at all. The rule is that each fact has \u003cstrong\u003eone source of truth\u003c/strong\u003e. If a fact is already maintained in a system of record, a second copy in the agent's memory will become stale, and the agent will then act on outdated information with confidence. In a clinical setting, a stale allergy list is a safety risk.\u003c/p\u003e\n\u003cp\u003eThe correct division is as follows. \u003cstrong\u003eAuthoritative data\u003c/strong\u003e, such as allergies, medications, and appointments, stays in the clinical record and is read through a tool at the time it is needed, so the agent always sees the current value. This is retrieval at run time. \u003cstrong\u003eAgent memory\u003c/strong\u003e holds what no other system holds and what helps across sessions: the patient's communication preferences, or notes about how earlier requests were handled. Each entry should carry a date and a source, so that old entries can be reviewed or expired.\u003c/p\u003e\n\u003cp\u003eThis division also reduces privacy exposure, because clinical data is not duplicated into another store with its own access rules. See \u003ca href=\"https://platform.claude.com/docs/en/agents-and-tools/tool-use/memory-tool\"\u003eMemory tool\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\"\u003eEffective context engineering for AI agents\u003c/a\u003e, which describes loading data at run time through tools.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Agent Architecture and Orchestration — source question 10","answerStatus":"source"},{"query":"A legal research copilot receives retrieved case passages as plain text and cannot link claims to precise source passages. What response-input structure enables machine-readable, verifiable citations?","type":"multiple-choice","options":[{"text":"Ask the copilot to add a footnote number after each sentence, and to list the case names at the end of the answer.","explanation":"Footnotes that the model writes are free text. They may point to the wrong case or to a case that was not retrieved, and the application still has no exact passage to link to.","correct":false},{"text":"Pass each passage as a search result block with its source and title, and enable citations.","explanation":"A search result content block carries the passage with its source identifier and title as separate fields. With citations enabled, each part of the answer is returned with a reference to the specific block and the cited text. The application can then link every claim to its passage.","correct":true},{"text":"Increase the number of passages from 10 to 40, so that lawyers have more material to check by hand.","explanation":"More passages increase the amount of manual checking. They do not create a connection between a sentence in the answer and its source.","correct":false},{"text":"Put the passages in the system prompt and not in the user message, so that the copilot treats them as more authoritative.","explanation":"The position of the text does not create citations that a machine can read. Retrieved content is also data and should not be given the authority of system instructions.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003ePass each passage as a search result block with its source and title, and enable citations.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eVerifiable citation needs \u003cstrong\u003estructure\u003c/strong\u003e. When passages are pasted as plain text, the model can mention a case, but the link between a sentence and its source exists only in the wording. Nothing in the response can be checked by code.\u003c/p\u003e\n\u003cp\u003eThe Claude API provides \u003cstrong\u003esearch result content blocks\u003c/strong\u003e for this purpose. Each block contains the passage \u003ccode\u003econtent\u003c/code\u003e together with a \u003ccode\u003esource\u003c/code\u003e (for example a document ID or URL) and a \u003ccode\u003etitle\u003c/code\u003e, in dedicated fields. With citations enabled, the response connects spans of the answer to the blocks that support them and includes the cited text. The application can show each claim with a link to the exact passage, and it can verify in code that every citation refers to a block that was really supplied. The same mechanism is available for documents passed with citations enabled.\u003c/p\u003e\n\u003cp\u003eFootnotes written by the model are not reliable, and more passages only increase the checking work. Keeping retrieved text in the user turn or in tool results, and not in the system prompt, also matters for security, because retrieved content is untrusted. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/search-results\"\u003eSearch results\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/citations\"\u003eCitations\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 11","answerStatus":"source"},{"query":"A legal firm's English-trained embedding model retrieves poorly in French and Spanish despite having documents in both languages. How should it choose a better multilingual retrieval approach?","type":"multiple-choice","options":[{"text":"Evaluate multilingual embedding models on the firm's own labeled queries, and re-embed with the best.","explanation":"The right embedding model is the one that retrieves best on the firm's own material. A labeled set of real queries in each language, with the passages that answer them, allows candidates to be compared directly. A model that is built for several languages and performs well on this set is then used for both documents and queries.","correct":true},{"text":"Translate all 4 million documents into English, and index only the translations.","explanation":"Translation of legal text can change terms that have a precise meaning in the original language, and lawyers must cite the original. The cost is high, and the citations would refer to translations.","correct":false},{"text":"Translate each query into English before embedding it, and keep the current embedding model and index.","explanation":"A translated query is then compared with document vectors in French and Spanish from a model that was chosen for English. Legal terms often have no exact English equivalent, so meaning is lost twice.","correct":false},{"text":"Raise the number of passages returned for French and Spanish queries to three times the number for English.","explanation":"More results from a ranking that is poor for those languages gives more irrelevant passages. The relevant decisions may still be absent, and the cost of each answer rises.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eEvaluate multilingual embedding models on the firm\u0026#x27;s own labeled queries, and re-embed with the best.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eEmbedding strategy\u003c/strong\u003e depends on the content. An embedding model that performs well on general English text can perform poorly on other languages and on specialized domains such as law. Public benchmarks are a starting point, but the decision should rest on an \u003cstrong\u003eevaluation with the organization's own data\u003c/strong\u003e: real queries, in each language, labeled with the passages that answer them. Recall and precision on that set show which model serves the firm's lawyers.\u003c/p\u003e\n\u003cp\u003eAnthropic's embeddings guidance makes the same points. It lists domain specificity among the factors to consider when choosing an embedding model, and it notes that models built for particular domains (it names law and finance as examples) and for multiple languages are available. Whichever model is chosen, \u003cstrong\u003edocuments and queries must be embedded with the same model\u003c/strong\u003e, so a change of model means that the corpus is embedded again. For 4 million documents this is a planned migration with a parallel index and a comparison before the switch.\u003c/p\u003e\n\u003cp\u003eTranslation of queries or documents adds error to legal language, and a larger number of results does not correct a weak ranking. The lexical side of hybrid search needs equal care for each language, with suitable handling of word forms and accents. See \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/embeddings\"\u003eEmbeddings\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/contextual-retrieval\"\u003eIntroducing Contextual Retrieval\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 12","answerStatus":"source"},{"query":"Exact searches for legal citations such as '2019 ONCA 345' fail because the lexical index strips punctuation and numeric tokens. What is the root cause and correction?","type":"multiple-choice","options":[{"text":"The embedding model does not understand citations. Replace it with a larger embedding model.","explanation":"Citations are identifiers with almost no meaning, so embeddings are not the right tool for them at any size. The lexical index is the component that should match them, and it is the one that is configured badly.","correct":false},{"text":"Lawyers type citations in inconsistent formats. Require them to choose the court and year from menus.","explanation":"A fixed form would make input consistent, but the index would still discard the numbers that identify a decision. The fault is in how the index processes text.","correct":false},{"text":"The lexical tokenization destroys citation identifiers. Configure it to keep each citation as a searchable token.","explanation":"A lexical index matches the tokens that its text processing produces. If that processing discards numbers and brackets, \"2019 ONCA 345\" becomes the single token \"onca,\" which matches thousands of decisions. Treating citation patterns as whole tokens, in documents and in queries, lets the index match them exactly.","correct":true},{"text":"The index is too large for exact matching. Divide it into one index for each court.","explanation":"The size of an index does not prevent exact matching. Dividing it would add operational work and would leave the same text processing in each part.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe lexical tokenization destroys citation identifiers. Configure it to keep each citation as a searchable token.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003e\u003cstrong\u003eTokenization\u003c/strong\u003e applies to retrieval as well as to language models. A lexical index such as BM25 does not store text as written. It stores the \u003cstrong\u003etokens\u003c/strong\u003e that its analyzer produces, and it can match only those tokens. An analyzer designed for ordinary prose makes text lower case, removes punctuation, and may discard numbers or very short tokens. For most words this is harmless. For identifiers it is destructive.\u003c/p\u003e\n\u003cp\u003eA neutral citation is an identifier made of a year, a court code, and a number. If the analyzer discards digits and brackets, the distinctive parts are removed, and only a court abbreviation that appears in thousands of decisions remains. The exact-match advantage of lexical search is lost for the queries that need it most. The fix is to give identifiers their own handling: a pattern that recognizes citation formats and keeps each one as a single token, applied in the same way to documents at indexing time and to queries at search time. A dedicated citation field with exact lookup is a useful addition.\u003c/p\u003e\n\u003cp\u003eThis is a failure of the \u003cstrong\u003elexical stage\u003c/strong\u003e, so a larger embedding model would not help. Anthropic's Contextual Retrieval article explains that lexical search is valuable because it matches exact identifiers that embeddings miss. See \u003ca href=\"https://www.anthropic.com/engineering/contextual-retrieval\"\u003eIntroducing Contextual Retrieval\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 13","answerStatus":"source"},{"query":"A legal researcher asks for decisions after 2020, from a named court, that cite a specific case. Similarity search ignores the court, date, and citation-link metadata already indexed. How should search handle these constraints?","type":"multiple-choice","options":[{"text":"Add the court and year to the text of every chunk, so that similarity search can match them.","explanation":"Text in the chunk can help a little, but similarity gives no guarantee that a date condition such as \"after 2020\" is respected, and it cannot follow the relationship \"cites this case.\"","correct":false},{"text":"Increase the number of results to 500, and ask Claude to discard those that do not meet the conditions.","explanation":"This sends a very large input to the model at high cost, and the decisions that meet the conditions may still not be among the 500 most similar passages.","correct":false},{"text":"Give Claude a search tool with filters for court, date, and cited cases, so that it can build a structured query.","explanation":"The question contains exact conditions: a court, a date range, and a citation relationship. These are filters on metadata. A search tool that exposes them lets Claude turn the question into a structured query, and the search for the meaning of \"disagrees\" is then run only within the matching decisions.","correct":true},{"text":"Ask lawyers to search for the court and year first by hand, and then to ask the copilot about each decision.","explanation":"This returns to the lawyer the work that the system should do, and it does not scale to questions that match hundreds of decisions.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eGive Claude a search tool with filters for court, date, and cited cases, so that it can build a structured query.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eSimilarity search answers the question \u0026quot;which passages are about the same thing as this text?\u0026quot; Many real questions also contain \u003cstrong\u003estructured constraints\u003c/strong\u003e: a date range, a court, a jurisdiction, or a relationship between documents. Similarity cannot enforce these. A passage from 2015 can be more similar to the question than the passage that the lawyer needs.\u003c/p\u003e\n\u003cp\u003eThe solution combines two ideas. The first is \u003cstrong\u003emetadata filtering\u003c/strong\u003e: constraints are applied as exact filters on indexed fields, before or together with the ranking. The second is \u003cstrong\u003eagentic search\u003c/strong\u003e: Claude receives a search tool whose parameters expose those filters, with a clear description, and builds the query itself. For this question, it would filter by court and date, restrict the results to decisions that cite the named case, and then rank by the meaning of the remaining condition. It can also search again if the first results are thin. The cost is more model turns and more latency than a single retrieval step, which is acceptable for a research question of this kind.\u003c/p\u003e\n\u003cp\u003eAnthropic's guidance on tools recommends designing search tools with filters and returning concise, relevant results. See \u003ca href=\"https://www.anthropic.com/engineering/writing-tools-for-agents\"\u003eWriting effective tools for agents\u003c/a\u003e and \u003ca href=\"https://www.anthropic.com/engineering/effective-context-engineering-for-ai-agents\"\u003eEffective context engineering for AI agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Production Integration, Reliability, and Knowledge Grounding — source question 14","answerStatus":"source"},{"query":"Before replacing its legal-retrieval embedding model, a firm needs to measure both retrieval quality and whether answer citations support claims. Which TWO evaluation components are essential? (Select TWO.)","type":"multiple-choice","options":[{"text":"A count of the number of words in each answer, with a target range for length.","explanation":"This is incorrect. Length says nothing about whether the right decisions were found or whether citations are sound.","correct":false},{"text":"The partner's opinion on the same ten questions, repeated independently by two more partners for confirmation.","explanation":"This is incorrect. Opinions on ten questions are too few and too subjective to compare two embedding models. They can add to a measured suite but cannot replace it.","correct":false},{"text":"Labeled queries with their relevant passages, used to measure the recall and precision of retrieval alone.","explanation":"This is correct. Retrieval quality is measured against known relevant passages, with no involvement of the generation step. Recall and precision at a given number of results show directly whether a new embedding model finds more of the right decisions.","correct":true},{"text":"A measure of how similar the wording of each answer is to the wording of the question.","explanation":"This is incorrect. An answer can repeat the words of the question and cite the wrong decisions. Similarity of wording is not a measure of correctness.","correct":false},{"text":"A check that every cited case was retrieved and supports the statement.","explanation":"This is correct. The firm's greatest risk is a citation that cannot be verified. A check that each cited case was actually retrieved can be done in code, and a judge with a narrow rubric can assess whether the passage supports the claim.","correct":true}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answers:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eLabeled queries with their relevant passages, used to measure the recall and precision of retrieval alone.\u003c/li\u003e\u003cli\u003eA check that every cited case was retrieved and supports the statement.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eAn evaluation of a retrieval-grounded system should measure each stage \u003cstrong\u003ewith a metric that fits it\u003c/strong\u003e. For retrieval, the metrics are \u003cstrong\u003erecall\u003c/strong\u003e (of the passages that are relevant, how many were returned) and \u003cstrong\u003eprecision\u003c/strong\u003e (of the passages returned, how many are relevant), calculated at the number of results that the pipeline uses. These need a labeled set: real queries, each with the passages that a lawyer has marked as relevant. With that set, two embedding models can be compared in an afternoon, with no model generation involved.\u003c/p\u003e\n\u003cp\u003eFor generation, the metrics are \u003cstrong\u003egroundedness\u003c/strong\u003e and \u003cstrong\u003ecitation correctness\u003c/strong\u003e. Citation correctness has two parts. Does each cited case exist among the passages that were supplied? This can be checked in code, and it detects invented citations directly. Does the cited passage support the statement? This needs judgment, and a calibrated LLM judge with a narrow rubric can provide it. Because structured citations return the cited text, both checks can be automated.\u003c/p\u003e\n\u003cp\u003eLength and similarity of wording measure neither stage. A partner's opinion is useful as calibration for the judge, but not as the suite. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/citations\"\u003eCitations\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect TWO answers.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 15","answerStatus":"source"},{"query":"An LLM judge always sees answer A first and prefers it 68% of the time; blinded legal reviewers tend to prefer B. How should the team control for the judge's position bias before deciding?","type":"multiple-choice","options":[{"text":"Accept the judge's result, because it is based on many more comparisons than the lawyer's review.","explanation":"More comparisons do not correct a systematic error. If the judge favors the answer that it sees first, a larger number of comparisons repeats the same bias.","correct":false},{"text":"Run each comparison in both orders, and count only the verdicts that stay the same.","explanation":"The judge may prefer whichever answer appears first. Presenting each pair in both orders tests this: a verdict that changes when the order changes is caused by position and not by quality. Counting only the verdicts that are the same in both orders removes the bias, and the lawyer's labels show whether the corrected judge can be trusted.","correct":true},{"text":"Discard the judge, and ask the lawyer to review every pair in the full test set.","explanation":"Expert review of every pair is slow and expensive and cannot be repeated for each later change. The judge can probably be corrected, which keeps the evaluation automated.","correct":false},{"text":"Show answer B first in every comparison from now on, to balance the earlier results.","explanation":"A fixed order in the other direction moves the bias to the other side. The result would then favor B for the same invalid reason.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eRun each comparison in both orders, and count only the verdicts that stay the same.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003ePairwise comparison by an LLM judge has a well-known weakness: \u003cstrong\u003eposition bias\u003c/strong\u003e. Judges tend to prefer one position, often the first answer, whatever its quality. If one system is always shown first, the bias is credited to that system. The disagreement with the blind human review is the warning sign here.\u003c/p\u003e\n\u003cp\u003eThe standard control is to \u003cstrong\u003erandomize or swap the order\u003c/strong\u003e. Each pair is judged twice, once in each order. If the judge prefers the same answer both times, the verdict is counted. If the verdict changes with the order, it is treated as a tie or as uninformative. The share of verdicts that change is also a useful measure of how strong the bias is. After this correction, the judge is \u003cstrong\u003ecalibrated\u003c/strong\u003e: its verdicts are compared with the lawyer's blind labels, and it is used for decisions only if the agreement is acceptable.\u003c/p\u003e\n\u003cp\u003eThe exam guide's own sample question describes this situation and gives the same order of actions: control the bias, measure agreement with human labels again, and do not let the judge gate decisions until agreement is acceptable. See \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/develop-tests\"\u003eDefine success criteria and build evaluations\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 16","answerStatus":"source"},{"query":"Only 1% of legal-copilot users flag answers as unhelpful; an entire practice group has abandoned the tool without submitting ratings. How should production answers be sampled to measure quality across groups?","type":"multiple-choice","options":[{"text":"Review only the marked answers, but increase the review from once a week to once a day.","explanation":"More frequent review of the same biased sample gives the same distorted picture sooner. Groups that do not use the marking function would still be invisible.","correct":false},{"text":"Send every lawyer a monthly survey that asks for a rating of the copilot from 1 to 10.","explanation":"A general rating once a month is not tied to particular answers and cannot show which kinds of question fail or why.","correct":false},{"text":"Review a stratified random sample across practice areas and languages.","explanation":"Marked answers come from the users who choose to give feedback, so they do not represent all traffic. A random sample that is stratified by practice area and language covers every group, including those that never give feedback.","correct":true},{"text":"Review a random 0.01% of all answers, with no regard to practice area or language.","explanation":"A purely random sample is unbiased, but at this size small groups such as the tax team or Spanish-language questions would contribute almost nothing, so their problems would remain hidden.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eReview a stratified random sample across practice areas and languages.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eExplicit feedback is a \u003cstrong\u003ebiased sample\u003c/strong\u003e. Only some users give it, they give it more often for some kinds of failure than for others, and whole groups may never use it. Conclusions drawn only from marked answers describe the people who mark, not the product. The tax team's experience shows the gap.\u003c/p\u003e\n\u003cp\u003e\u003cstrong\u003eLive-traffic sampling\u003c/strong\u003e for quality measurement should be designed like a survey. A \u003cstrong\u003erandom sample\u003c/strong\u003e gives an unbiased view of typical quality. \u003cstrong\u003eStratification\u003c/strong\u003e, which means sampling a set number from each practice area, language, and question type, ensures that small but important segments are represented and can be reported separately. \u003cstrong\u003eTargeted oversampling\u003c/strong\u003e adds cases that are more likely to contain problems: answers with low retrieval scores, answers with no citations, very long sessions, and marked answers. The sampled answers are then graded by a calibrated judge, with experts reviewing a part of them.\u003c/p\u003e\n\u003cp\u003eFeedback from users is still valuable as one signal and as a source of new test cases. Anthropic's evaluation guidance lists user feedback, production monitoring, and systematic review of transcripts as complementary methods, each with weaknesses that the others cover. See \u003ca href=\"https://www.anthropic.com/research/demystifying-evals-for-ai-agents\"\u003eDemystifying evals for AI agents\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Evaluation Engineering and Quality Assurance — source question 17","answerStatus":"source"},{"query":"A legal copilot cites a nonexistent case that appears in none of the low-relevance retrieved passages. What is the most important safeguard against invented, unsupported citations?","type":"multiple-choice","options":[{"text":"The lawyer's question was too unusual. Train lawyers to ask only about well-established points of law.","explanation":"Unusual points are where research help is most valuable. A system that fails without warning on such questions has to be corrected, and its users should not be limited.","correct":false},{"text":"Nothing stopped an ungrounded answer. Verify in code that each citation refers to a retrieved passage.","explanation":"Two things failed together. Retrieval returned nothing useful, and the generation step answered from the model's general memory in place of saying so. A deterministic check that every cited case is among the supplied passages blocks an invented citation completely.","correct":true},{"text":"The model is not capable enough. Move the copilot to the most capable model available.","explanation":"A more capable model may invent citations less often, but \"less often\" is not acceptable for a law firm. With no supporting passages, any model is answering from memory and not from the sources.","correct":false},{"text":"The index is missing decisions. Add more decisions to the index until every question has a relevant passage.","explanation":"A larger index helps coverage, but no index answers every question. The system needs a safe behavior for the cases in which nothing relevant is found.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eNothing stopped an ungrounded answer. Verify in code that each citation refers to a retrieved passage.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThis is a \u003cstrong\u003eretrieval-grounding failure\u003c/strong\u003e with two parts. The retrieval stage returned passages that did not answer the question, which will always happen sometimes. The generation stage then failed in the dangerous way: it produced a plausible answer from the model's general knowledge and presented it as grounded, with a citation in the correct style. The trace makes the diagnosis clear, because the cited case appears in none of the supplied passages.\u003c/p\u003e\n\u003cp\u003eThe most important fix is one that cannot be bypassed: a \u003cstrong\u003edeterministic check of citations\u003c/strong\u003e. Code compares every case cited in the answer with the identifiers of the retrieved passages. A citation with no match is removed, or the answer is blocked. With structured citations from search result blocks, this check is simple, because each citation refers to a supplied block. The second fix deals with the cause: when relevance scores are below a threshold, or when the model finds no supporting passage, the copilot \u003cstrong\u003esays that it found no authority\u003c/strong\u003e and does not answer from memory.\u003c/p\u003e\n\u003cp\u003eAnthropic's guidance on hallucinations recommends both practices: allow the model to say that it does not know, and withdraw claims that have no supporting quote. A stronger model and a larger index reduce how often the problem occurs, but they do not provide the guarantee that a law firm needs. See \u003ca href=\"https://platform.claude.com/docs/en/test-and-evaluate/strengthen-guardrails/reduce-hallucinations\"\u003eReduce hallucinations\u003c/a\u003e and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/search-results\"\u003eSearch results\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Debugging and Incident Response — source question 18","answerStatus":"source"},{"query":"After a search migration, Spanish lexical retrieval recall falls from 71% to 22%, while Spanish embedding recall and all English/French results remain unchanged. Where should the team investigate?","type":"multiple-choice","options":[{"text":"The lexical index for Spanish changed in the migration, so its text processing settings should be compared.","explanation":"The fall is limited to one language and one stage: the lexical search for Spanish. That points to the configuration of the lexical index for Spanish, for example the settings that handle accents and word forms, which may not have been carried over in the migration. The settings before and after should be compared.","correct":true},{"text":"The embedding model has become worse for Spanish, so the Spanish documents should be embedded again.","explanation":"The measurements show that embedding recall for Spanish is unchanged. Embedding the documents again would cost time and money and would not affect the stage that has fallen.","correct":false},{"text":"The Spanish-speaking lawyers have changed how they phrase questions, so the labeled set should be rewritten.","explanation":"The labeled set is fixed, and it shows the fall directly. The same queries that worked before the migration now fail, so the change is in the system.","correct":false},{"text":"The copilot's prompt handles Spanish badly, so Spanish examples should be added to the system prompt.","explanation":"The labeled set measures retrieval before the model is involved. A prompt change cannot restore passages that the lexical search no longer returns.","correct":false}],"answer":"\u003cp\u003e\u003cstrong\u003eCorrect answer:\u003c/strong\u003e\u003c/p\u003e\u003cul\u003e\u003cli\u003eThe lexical index for Spanish changed in the migration, so its text processing settings should be compared.\u003c/li\u003e\u003c/ul\u003e\n\u003cp\u003eThis question shows the value of \u003cstrong\u003emetrics for each stage and each segment\u003c/strong\u003e. A general complaint (\u0026quot;results are worse in Madrid\u0026quot;) could have many causes. Measurement with the labeled query set, divided by language and by retrieval stage, reduces the possibilities to one. Embedding recall is unchanged everywhere. Lexical recall has collapsed for Spanish only. The generation step is not part of the measurement at all.\u003c/p\u003e\n\u003cp\u003eThe cause must therefore be something that is specific to the \u003cstrong\u003elexical index for Spanish\u003c/strong\u003e and that changed in the migration. Lexical search depends on language-specific text processing: how accents are treated, how word forms are reduced to a common stem, and which common words are ignored. If the migrated index applies English settings, or default settings, to Spanish text, many query terms will no longer match the indexed tokens. Comparing the configuration before and after the migration is the direct next step. A check of recall for each language should also be added to the migration procedure.\u003c/p\u003e\n\u003cp\u003eWithout diagnosis by stage, the team might have embedded 4 million documents again or changed the prompt, at high cost and with no effect. See \u003ca href=\"https://www.anthropic.com/engineering/contextual-retrieval\"\u003eIntroducing Contextual Retrieval\u003c/a\u003e, which reports retrieval performance separately from generation, and \u003ca href=\"https://platform.claude.com/docs/en/build-with-claude/embeddings\"\u003eEmbeddings\u003c/a\u003e.\u003c/p\u003e\n","tip":"\u003cp\u003eSelect the one best answer.\u003c/p\u003e","reference":"Advanced Debugging and Incident Response — source question 19","answerStatus":"source"},{"query":"One coding agent must independently convert 3,000 item files; after hours it has skipped and duplicated files. Each converted file can be checked by a fast schema validator. How should the workload be organized?","type":"multiple-choice","options":[{"text":"Run the same single agent again with the instruction to be more careful and to keep a list of completed files.","explanation":"A single agent with one long context is what failed. A request for more care does not give it a reliable record of 3,000 files or make the work faster.","correct":false},{"text":"Start 3,000 agents at the same moment, one for each file, on a single build machine.","explanation":"One agent for each file would exceed the machine's capacity and the API rate limits, and the start-up cost of each agent would be paid 3,000 times. Parallel work needs a controlled level of concurrency.","correct":false},{"text":"Ask an agent to write one regular expression that converts all 3,000 files, and apply it with no validation.","explanation":"A single pattern is unlikely to handle every variation in 3,000 files, and
